<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">라우팅 테이블 차이</title>
  <desc id="d">Public Subnet과 Private Subnet의 0.0.0.0/0 라우팅 경로 차이를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="#ffffff"/>

  <!-- Public Subnet Card -->
  <rect x="40" y="30" width="800" height="90" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="62" fill="#1f2933" font-size="14" font-weight="bold">Public Subnet:</text>
  <text x="60" y="93" fill="#1f2933" font-size="13">0.0.0.0/0</text>
  
  <path d="M140,88 L300,88" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <text x="315" y="93" fill="#2563eb" font-size="13" font-weight="bold">igw-xxx (인터넷 게이트웨이)</text>

  <!-- Private Subnet Card -->
  <rect x="40" y="140" width="800" height="90" rx="6" ry="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="172" fill="#1f2933" font-size="14" font-weight="bold">Private Subnet:</text>
  <text x="60" y="203" fill="#1f2933" font-size="13">0.0.0.0/0</text>
  
  <path d="M140,198 L300,198" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  
  <text x="315" y="203" fill="#7c3aed" font-size="13" font-weight="bold">nat-xxx (NAT 게이트웨이)</text>
</svg>