<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서브넷별 라우팅 테이블</title>
  <desc id="d">같은 목적지 0.0.0.0/0이 Public Subnet에서는 igw-xxx(인터넷 게이트웨이)로, Private Subnet에서는 nat-xxx(NAT 게이트웨이)로 향한다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="250" fill="#ffffff"/>

  <!-- Public Subnet -->
  <rect x="24" y="24" width="832" height="88" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="48" y="74" font-size="18" font-weight="bold" fill="#1d4ed8">Public Subnet</text>
  <rect x="250" y="44" width="160" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330" y="74" font-size="18" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">0.0.0.0/0</text>
  <path d="M420,68 H488" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <rect x="500" y="40" width="332" height="56" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="524" y="74" font-size="16" fill="#374151"><tspan font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">igw-xxx</tspan>  (인터넷 게이트웨이)</text>

  <!-- Private Subnet -->
  <rect x="24" y="138" width="832" height="88" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="48" y="188" font-size="18" font-weight="bold" fill="#047857">Private Subnet</text>
  <rect x="250" y="158" width="160" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330" y="188" font-size="18" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">0.0.0.0/0</text>
  <path d="M420,182 H488" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <rect x="500" y="154" width="332" height="56" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="524" y="188" font-size="16" fill="#374151"><tspan font-size="18" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">nat-xxx</tspan>  (NAT 게이트웨이)</text>
</svg>
