<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">같은 계정 vs 다른 계정</title>
  <desc id="d">같은 계정에서는 IAM 정책 Allow와 버킷 정책 Allow 둘 중 하나만 있어도 접근되지만, 다른 계정(크로스 계정)에서는 둘 다 있어야 접근된다.</desc>
  <rect width="880" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 같은 계정 -->
  <rect x="24" y="24" width="404" height="252" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="48" y="58" font-size="18" font-weight="bold" fill="#1d4ed8">같은 계정</text>

  <rect x="48" y="80" width="168" height="48" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="132" y="110" font-size="16" fill="#111827" text-anchor="middle">IAM 정책 Allow</text>
  <rect x="236" y="80" width="168" height="48" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="320" y="110" font-size="16" fill="#111827" text-anchor="middle">버킷 정책 Allow</text>

  <path d="M132,128 V190" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M320,128 V190" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>

  <rect x="112" y="196" width="228" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="226" y="228" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">둘 중 하나면 OK</text>

  <!-- 다른 계정 (크로스 계정) -->
  <rect x="452" y="24" width="404" height="252" rx="10" fill="#f8fafc" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="476" y="58" font-size="18" font-weight="bold" fill="#6d28d9">다른 계정 (크로스 계정)</text>

  <rect x="476" y="80" width="168" height="48" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="560" y="110" font-size="16" fill="#111827" text-anchor="middle">IAM 정책 Allow</text>
  <rect x="664" y="80" width="168" height="48" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="748" y="110" font-size="16" fill="#111827" text-anchor="middle">버킷 정책 Allow</text>

  <path d="M560,128 V160 H748 V128" stroke="#6d28d9" stroke-width="2" fill="none"/>
  <circle cx="654" cy="160" r="5" fill="#6d28d9"/>
  <path d="M654,160 V190" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ah-purple)"/>

  <rect x="540" y="196" width="228" height="52" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="654" y="228" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">둘 다 있어야 OK</text>
</svg>
