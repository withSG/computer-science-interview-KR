<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">같은 계정 vs 다른 계정 권한 비교</title>
  <desc id="d">같은 계정과 다른 계정(크로스 계정) 환경에서 IAM 정책과 버킷 정책의 Allow 조건 차이를 설명하는 다이어그램</desc>
  <rect width="880" height="230" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 그룹 1: 같은 계정 -->
  <rect x="24" y="20" width="396" height="190" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="40" y="36" width="130" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="56" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[ 같은 계정 ]</text>

  <!-- IAM 정책 Allow Box (좌) -->
  <rect x="50" y="90" width="150" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="125" y="114" font-size="13" fill="#1f2933" text-anchor="middle">IAM 정책 Allow</text>

  <!-- 버킷 정책 Allow Box (좌) -->
  <rect x="50" y="150" width="150" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="125" y="174" font-size="13" fill="#1f2933" text-anchor="middle">버킷 정책 Allow</text>

  <!-- 연결선 및 화살표 (좌) -->
  <path d="M200,110 L225,110 L225,140 L250,140" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M200,170 L225,170 L225,140 L250,140" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 결과 Box (좌) -->
  <rect x="250" y="120" width="150" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="144" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">둘 중 하나면 OK</text>


  <!-- 그룹 2: 다른 계정 (크로스 계정) -->
  <rect x="460" y="20" width="396" height="190" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="476" y="36" width="220" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="586" y="56" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">[ 다른 계정 (크로스 계정) ]</text>

  <!-- IAM 정책 Allow Box (우) -->
  <rect x="486" y="90" width="150" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="561" y="114" font-size="13" fill="#1f2933" text-anchor="middle">IAM 정책 Allow</text>

  <!-- 버킷 정책 Allow Box (우) -->
  <rect x="486" y="150" width="150" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="561" y="174" font-size="13" fill="#1f2933" text-anchor="middle">버킷 정책 Allow</text>

  <!-- 연결선 및 화살표 (우) -->
  <path d="M636,110 L661,110 L661,140 L686,140" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  <path d="M636,170 L661,170 L661,140 L686,140" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 결과 Box (우) -->
  <rect x="686" y="120" width="150" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="761" y="144" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">둘 다 있어야 OK</text>
</svg>