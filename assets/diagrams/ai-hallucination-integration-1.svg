<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">환각 완화 기법 세 층 배치</title>
  <desc id="d">환각 완화 기법을 1층 입력(근거 주입), 2층 생성(출력 제어), 3층 출력(사후 검증) 순서로 쌓고, 층마다 쓰는 기법과 그 층이 하는 일을 적은 그림.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 1층: 입력 (근거 주입) -->
  <rect x="24" y="24" width="832" height="130" rx="10" fill="#dbeafe"/>
  <rect x="224" y="25" width="631" height="128" fill="#ffffff"/>
  <rect x="24" y="24" width="832" height="130" rx="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="124" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">1층</text>
  <text x="124" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">입력</text>
  <text x="124" y="122" text-anchor="middle" font-size="15" fill="#1e3a8a">(근거 주입)</text>
  <circle cx="252" cy="51" r="3.5" fill="#1d4ed8"/>
  <text x="266" y="56" font-size="16" fill="#111827">RAG로 관련 문서 검색해 컨텍스트에 넣기</text>
  <circle cx="252" cy="79" r="3.5" fill="#1d4ed8"/>
  <text x="266" y="84" font-size="16" fill="#111827">도구(계산기, DB 조회, 검색 API)로 사실을 가져오기</text>
  <rect x="240" y="100" width="600" height="40" rx="6" fill="#eff6ff"/>
  <text x="256" y="126" font-size="16" font-weight="700" fill="#1e40af">→ 추측할 필요 자체를 없앤다. 효과가 가장 크다</text>

  <line x1="124" y1="158" x2="124" y2="184" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2층: 생성 (출력 제어) -->
  <rect x="24" y="190" width="832" height="158" rx="10" fill="#d1fae5"/>
  <rect x="224" y="191" width="631" height="156" fill="#ffffff"/>
  <rect x="24" y="190" width="832" height="158" rx="10" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="124" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#064e3b">2층</text>
  <text x="124" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#064e3b">생성</text>
  <text x="124" y="302" text-anchor="middle" font-size="15" fill="#064e3b">(출력 제어)</text>
  <circle cx="252" cy="217" r="3.5" fill="#047857"/>
  <text x="266" y="222" font-size="16" fill="#111827">"컨텍스트에 없으면 모른다고 답하라" 명시</text>
  <circle cx="252" cy="245" r="3.5" fill="#047857"/>
  <text x="266" y="250" font-size="16" fill="#111827">인용 형식 강제 ([1], [2])</text>
  <circle cx="252" cy="273" r="3.5" fill="#047857"/>
  <text x="266" y="278" font-size="16" fill="#111827">Temperature 낮추기</text>
  <rect x="240" y="294" width="600" height="40" rx="6" fill="#ecfdf5"/>
  <text x="256" y="320" font-size="16" font-weight="700" fill="#065f46">→ 벗어날 여지를 좁힌다. 싸고 즉시 적용 가능</text>

  <line x1="124" y1="352" x2="124" y2="378" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3층: 출력 (사후 검증) -->
  <rect x="24" y="384" width="832" height="186" rx="10" fill="#fef3c7"/>
  <rect x="224" y="385" width="631" height="184" fill="#ffffff"/>
  <rect x="24" y="384" width="832" height="186" rx="10" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="124" y="460" text-anchor="middle" font-size="22" font-weight="700" fill="#78350f">3층</text>
  <text x="124" y="486" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">출력</text>
  <text x="124" y="510" text-anchor="middle" font-size="15" fill="#78350f">(사후 검증)</text>
  <circle cx="252" cy="411" r="3.5" fill="#b45309"/>
  <text x="266" y="416" font-size="16" fill="#111827">스키마·값 범위 검증</text>
  <circle cx="252" cy="439" r="3.5" fill="#b45309"/>
  <text x="266" y="444" font-size="16" fill="#111827">인용된 출처가 실제 컨텍스트에 있는지 대조</text>
  <circle cx="252" cy="467" r="3.5" fill="#b45309"/>
  <text x="266" y="472" font-size="16" fill="#111827">별도 모델로 근거 충실도 판정 (LLM-as-a-Judge)</text>
  <circle cx="252" cy="495" r="3.5" fill="#b45309"/>
  <text x="266" y="500" font-size="16" fill="#111827">위험 작업은 사람 승인</text>
  <rect x="240" y="516" width="600" height="40" rx="6" fill="#fffbeb"/>
  <text x="256" y="542" font-size="16" font-weight="700" fill="#92400e">→ 통과 못한 답변을 사용자에게 안 보낸다</text>
</svg>
