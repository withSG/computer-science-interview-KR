<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브라우저는 문서를 두 번 만든다</title>
  <desc id="d">시멘틱 태그와 비시멘틱 태그의 접근성 트리 속성 비교 다이어그램</desc>
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="#ffffff"/>

  <!-- Section 1: Semantic Tag (<button>) -->
  <rect x="24" y="24" width="832" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  
  <!-- Left Source Code Box -->
  <rect x="44" y="45" width="220" height="50" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="154" y="74.55" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">&lt;button&gt;저장&lt;/button&gt;</text>

  <!-- Arrow -->
  <path d="M264,70 L304,70" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- Right Property Box -->
  <rect x="314" y="45" width="522" height="50" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="575" y="74.55" font-size="13" fill="#1f2933" text-anchor="middle">role=button, name="저장", state=(focusable, enabled)</text>

  <!-- Section 2: Non-semantic Tag (<div>) -->
  <rect x="24" y="132" width="832" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Left Source Code Box -->
  <rect x="44" y="148" width="310" height="42" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="199" y="173.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">&lt;div class="btn" onclick="save()"&gt;저장&lt;/div&gt;</text>

  <!-- Arrow -->
  <path d="M354,169 L394,169" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- Right Property Box -->
  <rect x="404" y="148" width="432" height="42" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="620" y="173.55" font-size="13" fill="#1f2933" text-anchor="middle">role=generic, name=(없음), state=(포커스 불가)</text>

  <!-- Sub-note / Screen reader explanation -->
  <text x="432" y="214.025" font-size="11.5" fill="#dc2626">스크린 리더: "저장"  ← 그냥 글자다. 누를 수 있는 줄 모른다.</text>
</svg>