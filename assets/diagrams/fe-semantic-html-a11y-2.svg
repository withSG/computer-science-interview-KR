<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">button과 div의 접근성 트리 비교</title>
  <desc id="d">&lt;button&gt;저장&lt;/button&gt;은 role=button, name="저장", state=(focusable, enabled)로 채워지지만, onclick을 단 &lt;div&gt;는 role=generic, name 없음, 포커스 불가라서 스크린 리더는 "저장"을 누를 수 없는 그냥 글자로 읽는다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- 1) button -->
  <rect x="24" y="24" width="832" height="136" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="2"/>
  <text x="44" y="57" font-size="17" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;button&gt;저장&lt;/button&gt;</text>
  <text x="836" y="56" text-anchor="end" font-size="15" font-weight="700" fill="#047857">role·name·state 자동으로 채워짐</text>

  <rect x="44" y="76" width="240" height="68" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="60" y="98" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">role</text>
  <text x="60" y="130" font-size="19" font-weight="700" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">button</text>

  <rect x="300" y="76" width="240" height="68" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="316" y="98" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</text>
  <text x="316" y="130" font-size="19" font-weight="700" fill="#047857">"저장"</text>

  <rect x="556" y="76" width="280" height="68" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="572" y="98" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">state</text>
  <text x="572" y="130" font-size="19" font-weight="700" fill="#047857">focusable, enabled</text>

  <!-- 2) div onclick -->
  <rect x="24" y="184" width="832" height="208" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="44" y="217" font-size="17" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div class="btn" onclick="save()"&gt;저장&lt;/div&gt;</text>
  <text x="836" y="216" text-anchor="end" font-size="15" font-weight="700" fill="#b91c1c">접근성 트리에서 사실상 투명인간</text>

  <rect x="44" y="236" width="240" height="68" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="60" y="258" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">role</text>
  <text x="60" y="290" font-size="19" font-weight="700" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">generic</text>

  <rect x="300" y="236" width="240" height="68" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="316" y="258" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</text>
  <text x="316" y="290" font-size="19" font-weight="700" fill="#b91c1c">(없음)</text>

  <rect x="556" y="236" width="280" height="68" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="572" y="258" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">state</text>
  <text x="572" y="290" font-size="19" font-weight="700" fill="#b91c1c">포커스 불가</text>

  <rect x="44" y="320" width="792" height="52" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="64" y="352" font-size="16" fill="#111827"><tspan font-weight="700">스크린 리더:</tspan><tspan font-size="18" font-weight="700" fill="#b91c1c"> "저장"</tspan><tspan fill="#374151">   ← 그냥 글자다. 누를 수 있는 줄 모른다.</tspan></text>
</svg>
