<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">로그 수집 파이프라인</title>
  <desc id="d">애플리케이션 컨테이너가 stdout으로 낸 로그를 노드 에이전트(DaemonSet)가 읽어 선택적 완충 계층(Kafka/Redis)과 가공 계층을 거쳐 저장소(Elasticsearch/Loki/S3)에 넣고 Kibana/Grafana로 본다. 수집은 가볍게 많이, 가공은 무겁게 적게 둔다.</desc>
  <rect width="880" height="760" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. 애플리케이션 컨테이너 -->
  <rect x="24" y="24" width="832" height="84" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="52" cy="54" r="14" fill="#1d4ed8"/>
  <text x="52" y="59" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="78" y="61" font-size="18" font-weight="bold" fill="#111827">애플리케이션 컨테이너</text>
  <text x="78" y="93" font-size="16" fill="#374151">구조화 JSON 로그를 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#1d4ed8">stdout</tspan> 으로만 출력</text>

  <line x1="52" y1="110" x2="52" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="72" y="141" font-size="15" fill="#4b5563">컨테이너 런타임이 노드 디스크에 기록</text>

  <!-- 2. 노드 에이전트 -->
  <rect x="24" y="164" width="832" height="108" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="52" cy="194" r="14" fill="#6d28d9"/>
  <text x="52" y="199" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="78" y="201" font-size="18" fill="#111827"><tspan font-weight="bold">노드 에이전트 (DaemonSet)</tspan><tspan dx="16" font-size="16" fill="#4b5563">Fluent Bit / Filebeat / Alloy</tspan></text>
  <rect x="682" y="181" width="154" height="28" rx="14" fill="#6d28d9"/>
  <text x="759" y="200" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">수집: 가볍게 많이</text>
  <rect x="78" y="222" width="96" height="32" rx="16" fill="#ede9fe"/>
  <text x="126" y="243" font-size="15" fill="#5b21b6" text-anchor="middle">파일 tail</text>
  <rect x="184" y="222" width="120" height="32" rx="16" fill="#ede9fe"/>
  <text x="244" y="243" font-size="15" fill="#5b21b6" text-anchor="middle">멀티라인 병합</text>
  <rect x="314" y="222" width="136" height="32" rx="16" fill="#ede9fe"/>
  <text x="382" y="243" font-size="15" fill="#5b21b6" text-anchor="middle">메타데이터 부착</text>
  <rect x="460" y="222" width="106" height="32" rx="16" fill="#ede9fe"/>
  <text x="513" y="243" font-size="15" fill="#5b21b6" text-anchor="middle">로컬 버퍼링</text>

  <line x1="52" y1="274" x2="52" y2="324" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3. 완충 계층 (선택) -->
  <rect x="24" y="328" width="832" height="84" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="52" cy="358" r="14" fill="#b45309"/>
  <text x="52" y="363" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="78" y="365" font-size="18" fill="#111827"><tspan font-weight="bold">완충 계층</tspan><tspan dx="6" font-size="16" font-weight="bold" fill="#b45309">(선택)</tspan><tspan dx="16" font-size="16" fill="#4b5563">Kafka / Redis</tspan></text>
  <text x="78" y="397" font-size="16" fill="#374151">저장소가 느려져도 로그를 흘리지 않기 위한 버퍼</text>

  <line x1="52" y1="414" x2="52" y2="464" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 4. 가공 계층 -->
  <rect x="24" y="468" width="832" height="108" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="52" cy="498" r="14" fill="#047857"/>
  <text x="52" y="503" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="78" y="505" font-size="18" fill="#111827"><tspan font-weight="bold">가공 계층</tspan><tspan dx="16" font-size="16" fill="#4b5563">Logstash / Fluentd / OTel Collector</tspan></text>
  <rect x="682" y="485" width="154" height="28" rx="14" fill="#047857"/>
  <text x="759" y="504" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">가공: 무겁게 적게</text>
  <rect x="78" y="526" width="62" height="32" rx="16" fill="#d1fae5"/>
  <text x="109" y="547" font-size="15" fill="#065f46" text-anchor="middle">파싱</text>
  <rect x="150" y="526" width="106" height="32" rx="16" fill="#d1fae5"/>
  <text x="203" y="547" font-size="15" fill="#065f46" text-anchor="middle">필드 정규화</text>
  <rect x="266" y="526" width="136" height="32" rx="16" fill="#d1fae5"/>
  <text x="334" y="547" font-size="15" fill="#065f46" text-anchor="middle">민감정보 마스킹</text>
  <rect x="412" y="526" width="76" height="32" rx="16" fill="#d1fae5"/>
  <text x="450" y="547" font-size="15" fill="#065f46" text-anchor="middle">라우팅</text>
  <rect x="498" y="526" width="76" height="32" rx="16" fill="#d1fae5"/>
  <text x="536" y="547" font-size="15" fill="#065f46" text-anchor="middle">샘플링</text>

  <line x1="52" y1="578" x2="52" y2="628" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 5. 저장소 -->
  <rect x="24" y="632" width="520" height="96" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <circle cx="52" cy="662" r="14" fill="#374151"/>
  <text x="52" y="667" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="78" y="669" font-size="18" font-weight="bold" fill="#111827">저장소</text>
  <rect x="78" y="686" width="124" height="30" rx="15" fill="#ffffff"/>
  <text x="140" y="706" font-size="15" fill="#111827" text-anchor="middle">Elasticsearch</text>
  <rect x="212" y="686" width="64" height="30" rx="15" fill="#ffffff"/>
  <text x="244" y="706" font-size="15" fill="#111827" text-anchor="middle">Loki</text>
  <rect x="286" y="686" width="92" height="30" rx="15" fill="#ffffff"/>
  <text x="332" y="706" font-size="15" fill="#111827" text-anchor="middle">S3(장기)</text>

  <line x1="546" y1="680" x2="598" y2="680" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 6. Kibana / Grafana -->
  <rect x="602" y="632" width="254" height="96" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <circle cx="630" cy="680" r="14" fill="#374151"/>
  <text x="630" y="685" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="656" y="686" font-size="18" font-weight="bold" fill="#111827">Kibana / Grafana</text>
</svg>
