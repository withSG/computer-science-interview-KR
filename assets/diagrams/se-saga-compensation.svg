<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Saga 보상 트랜잭션과 격리성 포기 구간</title>
  <desc id="d">정상 흐름은 주문 생성, 결제 승인, 재고 차감 순서로 진행된다. 재고 차감이 실패하면 롤백 대신 결제 취소(환불)와 주문 취소(CANCELED)를 역순으로 실행하며, 결제 승인부터 결제 취소까지는 다른 사용자에게 결제가 성공한 것으로 보여 격리성이 깨진다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="620" fill="#ffffff"/>

  <!-- 서비스 열 머리 -->
  <rect x="40" y="24" width="220" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="150" y="51" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">주문 서비스</text>
  <rect x="330" y="24" width="220" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="440" y="51" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">결제 서비스</text>
  <rect x="620" y="24" width="220" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="730" y="51" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">재고 서비스</text>

  <!-- 정상 흐름 -->
  <text x="40" y="100" font-size="17" font-weight="bold" fill="#1d4ed8">정상 흐름</text>

  <rect x="40" y="112" width="220" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="150" y="146" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 주문 생성</text>
  <rect x="330" y="112" width="220" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="146" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">② 결제 승인</text>
  <rect x="620" y="112" width="220" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="730" y="146" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">③ 재고 차감 실패</text>

  <path d="M262,140 L324,140" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M552,140 L614,140" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 실패 이후: 반대 작업 -->
  <text x="40" y="212" font-size="17" font-weight="bold" fill="#6d28d9">③에서 실패하면</text>
  <text x="40" y="238" font-size="16" fill="#1f2937">롤백이 아니라</text>
  <text x="40" y="262" font-size="16" fill="#1f2937"><tspan font-weight="bold">“반대 작업”</tspan>을 실행한다</text>

  <!-- 격리성 포기 구간: 결제 승인 ~ 결제 취소 -->
  <path d="M440,172 L440,296" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="8 5"/>
  <rect x="456" y="190" width="250" height="90" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="470" y="216" font-size="16" font-weight="bold" fill="#92400e">격리성(Isolation) 포기</text>
  <text x="470" y="242" font-size="15" fill="#1f2937">이 사이 다른 사용자에게는</text>
  <text x="470" y="264" font-size="15" fill="#1f2937">결제가 성공한 것으로 보임</text>

  <!-- 보상 흐름 -->
  <path d="M730,170 L730,346 L556,346" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <rect x="330" y="300" width="220" height="92" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="440" y="337" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle">② 결제 취소</text>
  <text x="440" y="363" font-size="15" fill="#1f2937" text-anchor="middle">보상: 승인된 결제를 환불</text>

  <path d="M328,346 L266,346" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <rect x="40" y="300" width="220" height="92" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="150" y="328" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle">① 주문 취소</text>
  <text x="150" y="354" font-size="15" fill="#1f2937" text-anchor="middle">보상: 주문 상태를</text>
  <text x="150" y="376" font-size="15" fill="#1f2937" text-anchor="middle">CANCELED로 변경</text>

  <!-- 롤백 vs 보상, 주의 -->
  <rect x="40" y="424" width="800" height="172" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="60" y="453" font-size="16" font-weight="bold" fill="#111827">롤백과 보상은 다르다</text>
  <text x="60" y="483" font-size="15" font-weight="bold" fill="#374151">DB 롤백</text>
  <text x="190" y="483" font-size="15" fill="#1f2937">흔적을 남기지 않는다</text>
  <text x="60" y="510" font-size="15" font-weight="bold" fill="#374151">보상 트랜잭션</text>
  <text x="190" y="510" font-size="15" fill="#1f2937">“결제했다가 환불했다”는 사실이 그대로 남는다</text>
  <path d="M60,528 L820,528" fill="none" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="554" font-size="15" fill="#1f2937">※ 이 중간 상태가 업무적으로 허용되는지 반드시 검토</text>
  <text x="60" y="580" font-size="15" fill="#1f2937">※ 되돌릴 수 없는 작업(예: 이메일 발송)은 Saga의 가장 마지막 단계에 배치</text>
</svg>
