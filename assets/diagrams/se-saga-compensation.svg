<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Saga 보상 트랜잭션 타임라인과 격리성이 깨지는 구간</title>
  <desc id="d">주문, 결제, 재고 서비스의 시퀀스 타임라인을 통해 재고 차감 실패 시 실행되는 보상 트랜잭션 과정과 격리성이 보장되지 않는 중간 상태 구간을 보여주는 다이어그램입니다.</desc>
  
  <!-- 배경 -->
  <rect width="880" height="620" fill="#ffffff"/>

  <!-- 마커 정의 -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 제목 및 상단 영역 -->
  <text x="440" y="36" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">Saga 보상 트랜잭션 타임라인과 격리성이 깨지는 구간</text>
  
  <!-- 범례 -->
  <rect x="520" y="55" width="320" height="30" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="535" y1="70" x2="560" y2="70" stroke="#2563eb" stroke-width="2" marker-end="url(#a-ink)"/>
  <text x="565" y="74" font-size="11" fill="#1f2933">정상 요청</text>
  <line x1="630" y1="70" x2="655" y2="70" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
  <text x="660" y="74" font-size="11" fill="#1f2933">실패</text>
  <line x1="710" y1="70" x2="735" y2="70" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
  <text x="740" y="74" font-size="11" fill="#1f2933">보상 트랜잭션</text>

  <!-- 격리성 결여 반투명 음영 밴드 (y: 200 ~ 440) -->
  <rect x="40" y="200" width="700" height="240" fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="570" y="210" width="160" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="650" y="227" font-size="11.5" font-weight="600" fill="#d97706" text-anchor="middle">격리성(Isolation) 포기 구간</text>
  <text x="650" y="242" font-size="11" fill="#52606d" text-anchor="middle">외부에는 결제 성공으로 보임</text>

  <!-- 참여자 세로 레인 (Lifelines) -->
  <!-- 레인 1: 주문 서비스 (x=160) -->
  <rect x="90" y="100" width="140" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="124" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">주문 서비스</text>
  <line x1="160" y1="140" x2="160" y2="520" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 레인 2: 결제 서비스 (x=380) -->
  <rect x="310" y="100" width="140" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="124" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">결제 서비스</text>
  <line x1="380" y1="140" x2="380" y2="520" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 레인 3: 재고 서비스 (x=600) -->
  <rect x="530" y="100" width="140" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="124" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">재고 서비스</text>
  <line x1="600" y1="140" x2="600" y2="520" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 시간축 라벨 (왼쪽) -->
  <line x1="50" y1="150" x2="50" y2="500" stroke="#52606d" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <text x="50" y="525" font-size="11.5" font-weight="600" fill="#52606d" text-anchor="middle">시간 흐름</text>

  <!-- 단계 ①: 주문 생성 (y=170) -->
  <circle cx="160" cy="170" r="4" fill="#2563eb"/>
  <rect x="70" y="158" width="80" height="22" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="110" y="173" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">① 주문 생성</text>
  <path d="M160,180 L370,180" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 단계 ②: 결제 승인 (y=220) -->
  <circle cx="380" cy="220" r="4" fill="#2563eb"/>
  <rect x="290" y="208" width="80" height="22" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="330" y="223" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">② 결제 승인</text>
  <path d="M380,230 L590,230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 단계 ③: 재고 차감 실패 (y=280) -->
  <circle cx="600" cy="280" r="5" fill="#dc2626"/>
  <rect x="535" y="290" width="130" height="22" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="600" y="305" font-size="11.5" font-weight="600" fill="#dc2626" text-anchor="middle">③ 재고 차감 실패</text>

  <!-- 보상 트랜잭션 화살표 시작 -->
  <!-- ③ -> ②' 결제 취소 요청 (y=340) -->
  <path d="M600,340 L390,340" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-purple)"/>
  <rect x="440" y="323" width="100" height="22" fill="#ffffff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="490" y="338" font-size="11.5" font-weight="500" fill="#7c3aed" text-anchor="middle">보상 이벤트 발행</text>

  <!-- 단계 ②': 결제 취소 (y=370) -->
  <circle cx="380" cy="370" r="4" fill="#7c3aed"/>
  <rect x="290" y="358" width="80" height="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="330" y="373" font-size="11.5" font-weight="600" fill="#7c3aed" text-anchor="middle">②' 결제 취소</text>
  <text x="380" y="395" font-size="11" fill="#52606d" text-anchor="middle">(보상: 환불 처리)</text>

  <!-- ②' -> ①' 주문 취소 요청 (y=420) -->
  <path d="M380,420 L170,420" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-purple)"/>
  <rect x="220" y="403" width="100" height="22" fill="#ffffff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="270" y="418" font-size="11.5" font-weight="500" fill="#7c3aed" text-anchor="middle">보상 이벤트 발행</text>

  <!-- 단계 ①': 주문 취소 (y=450) -->
  <circle cx="160" cy="450" r="4" fill="#7c3aed"/>
  <rect x="70" y="438" width="80" height="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="110" y="453" font-size="11.5" font-weight="600" fill="#7c3aed" text-anchor="middle">①' 주문 취소</text>
  <text x="160" y="475" font-size="11" fill="#52606d" text-anchor="middle">(보상: CANCELED)</text>

  <!-- 되돌릴 수 없는 작업 노트 (하단 박스) -->
  <rect x="160" y="530" width="560" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="440" y="547" font-size="11.5" font-weight="600" fill="#1f2933" text-anchor="middle">※ 되돌릴 수 없는 작업(예: 이메일 발송)은 Saga의 가장 마지막 단계에 배치</text>
  <text x="440" y="562" font-size="11" fill="#52606d" text-anchor="middle">보상 트랜잭션은 DB 롤백과 달리 취소 흔적이 남으며, 중간 상태가 업무적으로 허용되어야 함</text>

  <!-- 결론 캡션 -->
  <text x="440" y="600" font-size="11.5" fill="#52606d" text-anchor="middle">Saga 패턴은 실패 시 보상 트랜잭션으로 원상복구하지만, 완료 전까지 격리성(Isolation)이 보장되지 않는다.</text>
</svg>