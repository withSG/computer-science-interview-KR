<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 820" width="880" height="820" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실제 사례: H2를 의존성에 넣으면 인메모리 DB가 뜨는 이유</title>
  <desc id="d">H2 의존성 추가부터 조건 평가를 거쳐 DataSource Bean이 자동 구성되는 과정을 나타낸 순서도</desc>
  <rect width="880" height="820" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="240" y="30" width="400" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="59" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">1. build.gradle 에 h2 추가</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,78 L440,108" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 2 -->
  <rect x="130" y="110" width="620" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="139" fill="#1f2933" font-size="13" text-anchor="middle">2. 클래스패스에 javax.sql.DataSource(JDBC API)와 H2 드라이버가 존재</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,158 L440,188" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 3 -->
  <rect x="120" y="190" width="640" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="219" fill="#1f2933" font-size="13" text-anchor="middle">3. DataSourceAutoConfiguration 의 @ConditionalOnClass(DataSource.class) 통과</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,238 L440,268" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4 -->
  <rect x="160" y="270" width="560" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="299" fill="#1f2933" font-size="13" text-anchor="middle">4. 내부에서 @ConditionalOnMissingBean(DataSource.class) 검사</text>

  <!-- Arrow 4 -> Decision -->
  <path d="M440,318 L440,348" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Decision Box -->
  <rect x="270" y="350" width="340" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="379" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">내가 DataSource Bean을 만든 적이 있나?</text>

  <!-- Branch lines from Decision -->
  <!-- Vertical main trunk down to split point -->
  <path d="M440,398 L440,430" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <!-- Branch left (Yes) -->
  <path d="M440,430 L220,430 L220,468" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
  <!-- Branch right (No) -->
  <path d="M440,430 L640,430 L640,468" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Path Label 1: 있다 -->
  <rect x="200" y="418" width="40" height="22" fill="#ffffff" stroke="#d97706" stroke-width="1" rx="3"/>
  <text x="220" y="433" fill="#d97706" font-size="12" font-weight="bold" text-anchor="middle">있다</text>

  <!-- Path Label 2: 없다 -->
  <rect x="620" y="418" width="40" height="22" fill="#ffffff" stroke="#059669" stroke-width="1" rx="3"/>
  <text x="640" y="433" fill="#059669" font-size="12" font-weight="bold" text-anchor="middle">없다</text>

  <!-- Left Outcome: 있다 -->
  <rect x="40" y="470" width="360" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="220" y="505" fill="#1f2933" font-size="13" text-anchor="middle">자동 설정은 아무것도 하지 않고 물러난다</text>

  <!-- Right Outcome: 없다 -->
  <rect x="450" y="470" width="380" height="130" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="640" y="505" fill="#1f2933" font-size="13" text-anchor="middle">spring.datasource.url 이 있으면 그 값으로,</text>
  <text x="640" y="540" fill="#1f2933" font-size="13" text-anchor="middle">없으면 내장 DB(H2)로</text>
  <text x="640" y="575" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">DataSource 를 구성한다</text>
</svg>