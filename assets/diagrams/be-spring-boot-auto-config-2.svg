<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">H2 추가 시 DataSource 자동 구성</title>
  <desc id="d">build.gradle에 h2를 추가하면 클래스패스 조건(@ConditionalOnClass)을 통과하고, @ConditionalOnMissingBean 검사에서 내가 만든 DataSource Bean이 있으면 자동 설정이 물러나고 없으면 spring.datasource.url 또는 내장 DB(H2)로 DataSource를 구성하는 순서.</desc>
  <rect width="880" height="630" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1 -->
  <rect x="40" y="24" width="800" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="76" cy="52" r="16" fill="#1d4ed8"/>
  <text x="76" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="108" y="58" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">build.gradle</tspan> 에 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">h2</tspan> 추가</text>

  <line x1="440" y1="82" x2="440" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect x="40" y="108" width="800" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="76" cy="136" r="16" fill="#1d4ed8"/>
  <text x="76" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="108" y="142" font-size="16" fill="#111827">클래스패스에 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">javax.sql.DataSource</tspan>(JDBC API)와 H2 드라이버가 존재</text>

  <line x1="440" y1="166" x2="440" y2="190" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect x="40" y="192" width="800" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="76" cy="220" r="16" fill="#1d4ed8"/>
  <text x="76" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="108" y="226" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DataSourceAutoConfiguration</tspan> 의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#1d4ed8">@ConditionalOnClass(DataSource.class)</tspan> 통과</text>

  <line x1="440" y1="250" x2="440" y2="274" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect x="40" y="276" width="800" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="76" cy="304" r="16" fill="#1d4ed8"/>
  <text x="76" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="108" y="310" font-size="16" fill="#111827">내부에서 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#1d4ed8">@ConditionalOnMissingBean(DataSource.class)</tspan> 검사</text>

  <line x1="440" y1="334" x2="440" y2="358" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 판단 -->
  <polygon points="220,396 254,360 626,360 660,396 626,432 254,432" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="402" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">내가 DataSource Bean을 만든 적이 있나?</text>

  <!-- 갈래 -->
  <path d="M440,432 V454 M210,454 H630" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="210" y1="453" x2="210" y2="494" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="630" y1="453" x2="630" y2="494" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="196" y="482" text-anchor="end" font-size="17" font-weight="bold" fill="#374151">있다</text>
  <text x="644" y="482" font-size="17" font-weight="bold" fill="#047857">없다</text>

  <!-- 있다 -->
  <rect x="40" y="496" width="340" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="210" y="545" text-anchor="middle" font-size="16" fill="#111827">자동 설정은 아무것도</text>
  <text x="210" y="571" text-anchor="middle" font-size="16" fill="#111827">하지 않고 <tspan font-weight="bold">물러난다</tspan></text>

  <!-- 없다 -->
  <rect x="420" y="496" width="420" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="444" y="528" font-size="17" font-weight="bold" fill="#047857"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DataSource</tspan> 를 구성한다</text>
  <text x="444" y="560" font-size="15" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">spring.datasource.url</tspan> 이 있으면 → 그 값으로</text>
  <text x="444" y="588" font-size="15" fill="#111827">없으면 → 내장 DB(H2)로</text>
</svg>
