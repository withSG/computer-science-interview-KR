<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상태 관리가 어려워지는 네 단계</title>
  <desc id="d">useState만으로 충분하던 1단계에서 prop drilling, 전역 스토어 몰아넣기를 거쳐 버그 추적이 불가능해지는 4단계까지, 각 단계의 상황과 결과를 위에서 아래로 나열한다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="260" y="44" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">상황</text>
  <text x="660" y="44" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">결과</text>

  <!-- 단계 사이 진행 화살표 -->
  <line x1="60" y1="123" x2="60" y2="143" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="60" y1="209" x2="60" y2="229" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/>
  <line x1="60" y1="295" x2="60" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/>

  <!-- 1단계 -->
  <rect x="24" y="60" width="72" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="96" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">1단계</text>
  <rect x="110" y="60" width="300" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="260" y="96" font-size="16" fill="#1f2937" text-anchor="middle">화면 하나, <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">useState</tspan> 몇 개</text>
  <line x1="416" y1="90" x2="456" y2="90" stroke="#059669" stroke-width="2" marker-end="url(#m-green)"/>
  <rect x="464" y="60" width="392" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="96" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">아무 문제 없음</text>

  <!-- 2단계 -->
  <rect x="24" y="146" width="72" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="182" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">2단계</text>
  <rect x="110" y="146" width="300" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="260" y="182" font-size="16" fill="#1f2937" text-anchor="middle">자식의 자식에게 값이 필요해짐</text>
  <line x1="416" y1="176" x2="456" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#m-gray)"/>
  <rect x="464" y="146" width="392" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="660" y="182" font-size="16" fill="#1f2937" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">props</tspan>를 3~4단계 내려보냄 (prop drilling)</text>

  <!-- 3단계 -->
  <rect x="24" y="232" width="72" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="268" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">3단계</text>
  <rect x="110" y="232" width="300" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="268" font-size="16" fill="#1f2937" text-anchor="middle">"전역 상태 도입하면 되겠네"</text>
  <line x1="416" y1="262" x2="456" y2="262" stroke="#d97706" stroke-width="2" marker-end="url(#m-amber)"/>
  <rect x="464" y="232" width="392" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="660" y="268" font-size="16" fill="#1f2937" text-anchor="middle">스토어 하나에 전부 몰아넣음</text>

  <!-- 4단계 -->
  <rect x="24" y="318" width="72" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="354" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">4단계</text>
  <rect x="110" y="318" width="300" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="260" y="354" font-size="16" fill="#1f2937" text-anchor="middle">어디서 이 값을 바꾸는지 아무도 모름</text>
  <line x1="416" y1="348" x2="456" y2="348" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
  <rect x="464" y="318" width="392" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="660" y="354" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">버그 추적 불가</text>

  <!-- 범례 -->
  <rect x="24" y="401" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="48" y="414" font-size="14" fill="#374151">정상 작동</text>
  <rect x="140" y="401" width="16" height="16" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="164" y="414" font-size="14" fill="#374151">문제의 시작 (잘못된 구조 선택)</text>
  <rect x="400" y="401" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="424" y="414" font-size="14" fill="#374151">심각한 문제 발생</text>
</svg>
