<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상태 관리가 어려워지는 순간은 정해져 있다</title>
  <desc id="d">상태 관리가 1단계부터 4단계까지 진행되며 점차 문제가 발생하고 복잡해지는 과정을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="24" y="38" font-size="16" font-weight="bold" fill="#1f2933">상태 관리가 어려워지는 순간은 정해져 있다</text>

  <!-- Step 1 -->
  <g>
    <rect x="24" y="60" width="60" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="54" y="90" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">1단계</text>

    <rect x="94" y="60" width="310" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="249" y="90" font-size="13" fill="#1f2933" text-anchor="middle">화면 하나, useState 몇 개</text>

    <path d="M414,85 L444,85" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>

    <rect x="454" y="60" width="402" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="655" y="90" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">아무 문제 없음</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="24" y="130" width="60" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="54" y="160" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">2단계</text>

    <rect x="94" y="130" width="310" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="249" y="160" font-size="13" fill="#1f2933" text-anchor="middle">자식의 자식에게 값이 필요해짐</text>

    <path d="M414,155 L444,155" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>

    <rect x="454" y="130" width="402" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="655" y="160" font-size="13" fill="#1f2933" text-anchor="middle">props를 3~4단계 내려보냄 (prop drilling)</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="24" y="200" width="60" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="54" y="230" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">3단계</text>

    <rect x="94" y="200" width="310" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="249" y="230" font-size="13" fill="#1f2933" text-anchor="middle">"전역 상태 도입하면 되겠네"</text>

    <path d="M414,225 L444,225" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

    <rect x="454" y="200" width="402" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="655" y="230" font-size="13" fill="#1f2933" text-anchor="middle">스토어 하나에 전부 몰아넣음</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="24" y="270" width="60" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="54" y="300" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">4단계</text>

    <rect x="94" y="270" width="310" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="249" y="300" font-size="13" fill="#1f2933" text-anchor="middle">어디서 이 값을 바꾸는지 아무도 모름</text>

    <path d="M414,295 L444,295" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <rect x="454" y="270" width="402" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="655" y="300" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">버그 추적 불가</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="24" y="340" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="42" y="350" font-size="11.5" fill="#52606d">정상 작동</text>

    <rect x="120" y="340" width="12" height="12" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="138" y="350" font-size="11.5" fill="#52606d">문제의 시작 (잘못된 구조 선택)</text>

    <rect x="310" y="340" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="328" y="350" font-size="11.5" fill="#52606d">심각한 문제 발생</text>
  </g>
</svg>