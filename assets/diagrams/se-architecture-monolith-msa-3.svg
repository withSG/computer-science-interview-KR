<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가용성은 곱해진다</title>
  <desc id="d">안티패턴 동기 호출 체인에서 알림 서비스 장애가 주문 전체로 전파되는 과정을 나타낸 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title / Subtitle -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#dc2626">안티패턴: 동기 호출 체인</text>

  <!-- Boxes -->
  <!-- 클라이언트 -->
  <rect x="30" y="60" width="110" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="85" y="84" font-size="13" fill="#1f2933" text-anchor="middle">클라이언트</text>

  <!-- 주문 -->
  <rect x="170" y="60" width="90" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="215" y="84" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">주문</text>

  <!-- 재고 -->
  <rect x="290" y="60" width="90" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335" y="84" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">재고</text>

  <!-- 배송 -->
  <rect x="410" y="60" width="90" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="455" y="84" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">배송</text>

  <!-- 정산 -->
  <rect x="530" y="60" width="90" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="575" y="84" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">정산</text>

  <!-- 알림 (장애 지점) -->
  <rect x="650" y="60" width="90" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="695" y="84" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">알림</text>

  <!-- Forward Flow Arrows -->
  <path d="M140,80 L170,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M260,80 L290,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M380,80 L410,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M500,80 L530,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M620,80 L650,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Cascading Delay Arrows & Annotations -->
  <!-- (여기가 느려지면) -->
  <text x="695" y="125" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">(여기가 느려지면)</text>

  <!-- 정산이 대기 -->
  <path d="M640,135 L610,150" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="615" y="160" font-size="13" fill="#dc2626">정산이 대기</text>

  <!-- 배송이 대기 -->
  <path d="M520,170 L490,185" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="495" y="195" font-size="13" fill="#dc2626">배송이 대기</text>

  <!-- 재고가 대기 -->
  <path d="M400,205 L370,220" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="375" y="230" font-size="13" fill="#dc2626">재고가 대기</text>

  <!-- 주문 스레드 풀 고갈 -->
  <path d="M280,240 L250,255" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="255" y="265" font-size="13" fill="#dc2626">주문 스레드 풀 고갈</text>

  <!-- 최종 결과 메시지 및 화살표 -->
  <path d="M160,285 L120,285" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="170" y="289" font-size="13" font-weight="bold" fill="#dc2626">알림 서비스 장애가 주문 전체를 멈춘다</text>
</svg>