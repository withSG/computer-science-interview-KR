<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Raft 개요</title>
  <desc id="d">Raft 합의 알고리즘의 세 가지 핵심 과정인 리더 선출, 로그 복제, 안전성을 나타낸 다이어그램</desc>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="720" fill="#ffffff"/>

  <!-- [1. 리더 선출] 구역 -->
  <rect x="24" y="24" width="832" height="184" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="40" y="40" width="130" height="32" rx="4" fill="#2563eb"/>
  <text x="105" y="60.2" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1. 리더 선출</text>

  <text x="40" y="99.2" fill="#1f2933" font-size="13">모든 노드는 팔로워로 시작한다.</text>
  <text x="40" y="125.2" fill="#1f2933" font-size="13">리더에게서 일정 시간 신호가 없으면 후보가 되어 투표를 요청한다.</text>
  <text x="40" y="151.2" fill="#1f2933" font-size="13">과반의 표를 얻으면 리더가 된다.</text>
  <text x="40" y="177.2" fill="#1f2933" font-size="13">타임아웃을 노드마다 무작위로 흔들어 동시에 후보가 되는 상황을 줄인다.</text>

  <!-- [2. 로그 복제] 구역 -->
  <rect x="24" y="228" width="832" height="328" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="40" y="244" width="130" height="32" rx="4" fill="#2563eb"/>
  <text x="105" y="264.2" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2. 로그 복제</text>

  <!-- 클라이언트 -->
  <rect x="40" y="320" width="108" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="94" y="344.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">클라이언트</text>

  <!-- 리더 -->
  <rect x="248" y="320" width="80" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="288" y="344.55" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">리더</text>

  <!-- 팔로워 1 -->
  <rect x="470" y="296" width="90" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="515" y="320.55" fill="#1f2933" font-size="13" text-anchor="middle">팔로워1</text>

  <!-- 팔로워 2 -->
  <rect x="470" y="352" width="90" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="515" y="376.55" fill="#1f2933" font-size="13" text-anchor="middle">팔로워2</text>

  <!-- 화살표: 클라이언트 -> 리더 -->
  <path d="M148,340 L239,340" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 화살표: 리더 -> 팔로워1 -->
  <path d="M328,330 L461,316" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="372" y="312" width="45" height="18" fill="#ffffff"/>
  <text x="394.5" y="325.025" fill="#52606d" font-size="11.5" text-anchor="middle">복제</text>

  <!-- 화살표: 리더 -> 팔로워2 -->
  <path d="M328,350 L461,372" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="372" y="352" width="45" height="18" fill="#ffffff"/>
  <text x="394.5" y="365.025" fill="#52606d" font-size="11.5" text-anchor="middle">복제</text>

  <!-- 꺾은선 및 설명 -->
  <path d="M288,360 L288,430 L320,430" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <text x="330" y="434.2" fill="#1f2933" font-size="13">과반이 기록했다고 응답하면 커밋 확정 후 클라이언트에 응답</text>
  <text x="330" y="468.2" fill="#52606d" font-size="13">(팔로워 전부를 기다리지 않는다 → 느린 노드 1대가 전체를 막지 않는다)</text>

  <!-- [3. 안전성] 구역 -->
  <rect x="24" y="576" width="832" height="120" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="40" y="592" width="110" height="32" rx="4" fill="#2563eb"/>
  <text x="95" y="612.2" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">3. 안전성</text>

  <text x="40" y="651.2" fill="#1f2933" font-size="13">최신 로그를 가지지 않은 노드는 리더가 될 수 없다.</text>
  <text x="40" y="677.2" fill="#1f2933" font-size="13">→ 커밋된 데이터가 리더 교체 과정에서 사라지지 않는다.</text>
</svg>