<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 840" width="880" height="840" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Raft 세 부분</title>
  <desc id="d">Raft를 리더 선출, 로그 복제, 안전성 세 부분으로 나눈 그림. 팔로워는 리더 신호가 일정 시간 없으면 후보가 되어 투표를 요청하고 과반의 표를 얻으면 리더가 된다. 리더는 쓰기를 팔로워들에 복제하고 과반이 기록했다고 응답하면 커밋을 확정해 클라이언트에 응답한다. 최신 로그가 없는 노드는 리더가 될 수 없어 커밋된 데이터가 사라지지 않는다.</desc>
  <rect width="880" height="840" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- ===== 1. 리더 선출 ===== -->
  <rect x="24" y="24" width="832" height="272" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="44" y="42" width="130" height="34" rx="6" fill="#1f2937"/>
  <text x="109" y="65" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">1. 리더 선출</text>

  <rect x="64" y="128" width="140" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="134" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">팔로워</text>
  <text x="134" y="206" text-anchor="middle" font-size="15" fill="#4b5563">
    <tspan x="134">모든 노드는</tspan>
    <tspan x="134" dy="21">팔로워로 시작</tspan>
  </text>

  <line x1="208" y1="154" x2="364" y2="154" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="286" y="120" text-anchor="middle" font-size="15" fill="#374151">
    <tspan x="286">리더에게서 일정 시간</tspan>
    <tspan x="286" dy="21">신호가 없으면</tspan>
  </text>

  <rect x="370" y="128" width="140" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">후보</text>
  <text x="440" y="206" text-anchor="middle" font-size="15" fill="#4b5563">투표를 요청한다</text>

  <line x1="514" y1="154" x2="670" y2="154" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="592" y="141" text-anchor="middle" font-size="15" fill="#374151">과반의 표를 얻으면</text>

  <rect x="676" y="128" width="140" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="746" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">리더</text>

  <rect x="44" y="238" width="792" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="60" y="264" font-size="15" fill="#374151">타임아웃을 노드마다 무작위로 흔들어 동시에 후보가 되는 상황을 줄인다.</text>

  <!-- ===== 2. 로그 복제 ===== -->
  <rect x="24" y="316" width="832" height="320" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="44" y="334" width="130" height="34" rx="6" fill="#1f2937"/>
  <text x="109" y="357" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2. 로그 복제</text>

  <rect x="48" y="409" width="140" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="118" y="441" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">클라이언트</text>

  <line x1="192" y1="435" x2="262" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="268" y="409" width="120" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="328" y="441" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">리더</text>

  <path d="M392,435 H520 V402 H634" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M520,435 V468 H634" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="578" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">복제</text>
  <text x="578" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">복제</text>

  <rect x="640" y="380" width="140" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="710" y="408" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">팔로워1</text>
  <rect x="640" y="446" width="140" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="710" y="474" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">팔로워2</text>

  <!-- 커밋 흐름 -->
  <line x1="328" y1="465" x2="328" y2="522" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="223" y="528" width="210" height="44" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="328" y="556" text-anchor="middle" font-size="16" fill="#111827">과반이 기록했다고 응답</text>
  <line x1="437" y1="550" x2="473" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="479" y="528" width="110" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="534" y="556" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">커밋 확정</text>
  <line x1="593" y1="550" x2="629" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="635" y="528" width="160" height="44" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="715" y="556" text-anchor="middle" font-size="16" fill="#111827">클라이언트에 응답</text>

  <text x="223" y="608" font-size="15" fill="#4b5563">(팔로워 전부를 기다리지 않는다 → 느린 노드 1대가 전체를 막지 않는다)</text>

  <!-- ===== 3. 안전성 ===== -->
  <rect x="24" y="656" width="832" height="160" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="44" y="674" width="130" height="34" rx="6" fill="#1f2937"/>
  <text x="109" y="697" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">3. 안전성</text>

  <rect x="64" y="728" width="330" height="66" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="229" y="756" text-anchor="middle" font-size="16" fill="#111827">
    <tspan x="229">최신 로그를 가지지 않은 노드는</tspan>
    <tspan x="229" dy="23" font-weight="bold">리더가 될 수 없다</tspan>
  </text>
  <line x1="398" y1="761" x2="474" y2="761" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="480" y="728" width="336" height="66" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="648" y="756" text-anchor="middle" font-size="16" fill="#111827">
    <tspan x="648">커밋된 데이터가 리더 교체 과정에서</tspan>
    <tspan x="648" dy="23" font-weight="bold" fill="#065f46">사라지지 않는다</tspan>
  </text>
</svg>
