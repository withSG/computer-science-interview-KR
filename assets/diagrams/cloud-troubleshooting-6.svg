<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">시나리오 2 — Service에 접속이 안 된다</title>
  <desc id="d">증상(Pod는 Running인데 Service 요청이 연결 거부), 세 단계 진단(ENDPOINTS none, READY 0/1, Readiness probe failed), 원인(probe 포트 8080과 실제 listen 포트 3000 불일치로 Ready가 안 되어 엔드포인트 미등록), 즉시·근본 대응을 위에서 아래로 보여 준다.</desc>
  <defs>
    <marker id="rail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="cause" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="880" height="720" fill="#ffffff"/>

  <!-- 왼쪽 단계 레일 -->
  <path d="M62,74 V98" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#rail)"/>
  <path d="M62,144 V378" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#rail)"/>
  <path d="M62,424 V570" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#rail)"/>

  <rect x="24" y="34" width="76" height="36" rx="6" fill="#b91c1c"/>
  <text x="62" y="58" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">증상</text>
  <rect x="24" y="104" width="76" height="36" rx="6" fill="#1d4ed8"/>
  <text x="62" y="128" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">진단</text>
  <rect x="24" y="384" width="76" height="36" rx="6" fill="#b45309"/>
  <text x="62" y="408" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">원인</text>
  <rect x="24" y="576" width="76" height="36" rx="6" fill="#047857"/>
  <text x="62" y="600" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">대응</text>

  <!-- 증상 -->
  <rect x="120" y="24" width="736" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="140" y="58" font-size="16" fill="#1f2937">Pod는 <tspan font-weight="bold" fill="#047857">Running</tspan>인데 Service로 요청하면 <tspan font-weight="bold" fill="#b91c1c">연결 거부</tspan></text>

  <!-- 진단: 세 단계 -->
  <rect x="120" y="104" width="736" height="256" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#1f2937">
    <text x="170" y="145">kubectl get endpoints my-service</text>
    <text x="170" y="223">kubectl get pods -l app=web</text>
    <text x="170" y="301">kubectl describe pod &lt;pod&gt;</text>
  </g>
  <g fill="#1d4ed8">
    <circle cx="146" cy="140" r="12"/>
    <circle cx="146" cy="218" r="12"/>
    <circle cx="146" cy="296" r="12"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="146" y="145">1</text>
    <text x="146" y="223">2</text>
    <text x="146" y="301">3</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M146,154 V173 H162" marker-end="url(#step)"/>
    <path d="M146,232 V251 H162" marker-end="url(#step)"/>
    <path d="M146,310 V329 H162" marker-end="url(#step)"/>
  </g>
  <rect x="168" y="158" width="170" height="30" rx="4" fill="#f3f4f6"/>
  <text x="182" y="178" font-size="15" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">ENDPOINTS <tspan font-weight="bold" fill="#b91c1c">&lt;none&gt;</tspan></text>
  <rect x="168" y="236" width="220" height="30" rx="4" fill="#f3f4f6"/>
  <text x="182" y="256" font-size="15" fill="#1f2937">Pod는 있지만 <tspan font-weight="bold" fill="#b91c1c">READY 0/1</tspan></text>
  <rect x="168" y="314" width="390" height="30" rx="4" fill="#f3f4f6"/>
  <text x="182" y="334" font-size="15" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">Readiness probe failed: <tspan font-weight="bold" fill="#b91c1c">connection refused</tspan></text>

  <!-- 원인: 포트 불일치 → 미등록 -->
  <rect x="120" y="384" width="736" height="168" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="136" y="400" width="312" height="64" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="292" y="426" font-size="15" fill="#1f2937" text-anchor="middle">readiness probe의 포트를</text>
  <text x="292" y="451" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-size="17" font-weight="bold" fill="#b91c1c">8080</tspan>으로 적었는데</text>
  <rect x="528" y="400" width="312" height="64" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="684" y="426" font-size="15" fill="#1f2937" text-anchor="middle">애플리케이션이 실제로는</text>
  <text x="684" y="451" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-size="17" font-weight="bold" fill="#047857">3000</tspan>에서 listen</text>
  <text x="488" y="443" font-size="30" font-weight="bold" fill="#b91c1c" text-anchor="middle">≠</text>

  <path d="M488,458 V488" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#cause)"/>
  <rect x="408" y="492" width="160" height="40" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="488" y="517" font-size="15" fill="#1f2937" text-anchor="middle">Ready가 되지 않음</text>
  <path d="M572,512 H602" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#cause)"/>
  <rect x="606" y="492" width="234" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="723" y="517" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">엔드포인트에 등록되지 않음</text>

  <!-- 대응 -->
  <rect x="120" y="576" width="736" height="120" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="136" y="592" width="56" height="28" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="164" y="611" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">즉시</text>
  <text x="208" y="611" font-size="15" fill="#1f2937">probe 포트 수정 후 롤아웃</text>
  <rect x="136" y="634" width="56" height="28" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="164" y="653" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">근본</text>
  <text x="208" y="653" font-size="15" fill="#1f2937">containerPort / targetPort / probe port가 한 값을 참조하도록<tspan x="208" dy="26">매니페스트 템플릿 정리</tspan></text>
</svg>
