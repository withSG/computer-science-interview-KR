<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가장 큰 숫자 만들기 예시</title>
  <desc id="d">입력 배열 [3, 30, 34, 5, 9]가 비교 "330" vs "303"을 거쳐 정렬된 배열 [9, 5, 34, 3, 30]이 되고 최종 출력 "9534330"이 되는 과정을 나타낸 다이어그램입니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Row 1: 입력 -->
  <rect x="180" y="30" width="80" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="54.6" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">입력:</text>
  
  <rect x="270" y="30" width="430" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="485" y="54.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[3, 30, 34, 5, 9]</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M485,70 L485,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Row 2: 비교 -->
  <rect x="180" y="100" width="80" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="124.6" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">비교:</text>

  <rect x="270" y="100" width="430" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="485" y="124.6" font-size="14" fill="#1f2933" text-anchor="middle">"330" vs "303" → 3이 30보다 앞</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M485,140 L485,170" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Row 3: 정렬 -->
  <rect x="180" y="170" width="80" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="194.6" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">정렬:</text>

  <rect x="270" y="170" width="430" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="485" y="194.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[9, 5, 34, 3, 30]</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M485,210 L485,240" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Row 4: 출력 -->
  <rect x="180" y="240" width="80" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="264.6" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">출력:</text>

  <rect x="270" y="240" width="430" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="485" y="264.6" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">"9534330"</text>
</svg>