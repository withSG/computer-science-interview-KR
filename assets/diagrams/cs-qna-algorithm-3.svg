<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가장 큰 숫자 만들기</title>
  <desc id="d">입력 [3, 30, 34, 5, 9]를 두 수 a, b를 이어 붙인 "ab"와 "ba" 중 큰 쪽이 앞에 오도록 정렬하면 [9, 5, 34, 3, 30]이 되고, 이어 붙인 출력은 "9534330"입니다. 예를 들어 "330"과 "303"을 비교해 3이 30보다 앞에 옵니다.</desc>
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 단계 사이 화살표 -->
  <line x1="344" y1="78" x2="344" y2="102" stroke="#4b5563" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="344" y1="256" x2="344" y2="282" stroke="#4b5563" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="344" y1="336" x2="344" y2="362" stroke="#4b5563" stroke-width="1.5" marker-end="url(#down)"/>

  <!-- 1. 입력 -->
  <circle cx="46" cy="50" r="14" fill="#1f2937"/>
  <text x="46" y="55" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="70" y="56" font-size="17" font-weight="bold" fill="#111827">입력</text>
  <rect x="180" y="28" width="56" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="208" y="57" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">3</text>
  <rect x="248" y="28" width="56" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="276" y="57" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">30</text>
  <rect x="316" y="28" width="56" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="344" y="57" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">34</text>
  <rect x="384" y="28" width="56" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="412" y="57" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">5</text>
  <rect x="452" y="28" width="56" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="480" y="57" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">9</text>

  <!-- 2. 비교 -->
  <circle cx="46" cy="179" r="14" fill="#1f2937"/>
  <text x="46" y="184" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="70" y="185" font-size="17" font-weight="bold" fill="#111827">비교</text>
  <rect x="180" y="106" width="676" height="146" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="204" y="134" font-size="15" fill="#78350f">두 수 a, b를 이어 붙인 "ab"와 "ba"를 비교 (a=3, b=30)</text>

  <text x="204" y="177" font-size="17" font-weight="bold" fill="#78350f" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"ab"</text>
  <rect x="252" y="150" width="40" height="40" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="272" y="177" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">3</text>
  <rect x="292" y="150" width="52" height="40" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="318" y="177" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">30</text>
  <text x="358" y="177" font-size="20" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= "330"</text>

  <text x="478" y="176" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">vs</text>

  <text x="516" y="177" font-size="17" font-weight="bold" fill="#78350f" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"ba"</text>
  <rect x="564" y="150" width="52" height="40" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="590" y="177" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">30</text>
  <rect x="616" y="150" width="40" height="40" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="636" y="177" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">3</text>
  <text x="670" y="177" font-size="20" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= "303"</text>

  <text x="204" y="228" font-size="17" font-weight="bold" fill="#111827">"330" &gt; "303"  →  <tspan fill="#b45309">3이 30보다 앞</tspan></text>

  <!-- 3. 정렬 -->
  <circle cx="46" cy="308" r="14" fill="#1f2937"/>
  <text x="46" y="313" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="70" y="314" font-size="17" font-weight="bold" fill="#111827">정렬</text>
  <rect x="180" y="286" width="56" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="208" y="315" font-size="20" font-weight="bold" fill="#4c1d95" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">9</text>
  <rect x="248" y="286" width="56" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="276" y="315" font-size="20" font-weight="bold" fill="#4c1d95" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">5</text>
  <rect x="316" y="286" width="56" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="344" y="315" font-size="20" font-weight="bold" fill="#4c1d95" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">34</text>
  <rect x="384" y="286" width="56" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="412" y="315" font-size="20" font-weight="bold" fill="#4c1d95" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">3</text>
  <rect x="452" y="286" width="56" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="480" y="315" font-size="20" font-weight="bold" fill="#4c1d95" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">30</text>
  <text x="532" y="314" font-size="15" fill="#4b5563">더 큰 조합이 앞에 오도록 정렬</text>

  <!-- 4. 출력 -->
  <circle cx="46" cy="388" r="14" fill="#1f2937"/>
  <text x="46" y="393" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="70" y="394" font-size="17" font-weight="bold" fill="#111827">출력</text>
  <rect x="180" y="366" width="35" height="44" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="197.5" y="395" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">9</text>
  <rect x="215" y="366" width="35" height="44" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="232.5" y="395" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">5</text>
  <rect x="250" y="366" width="46" height="44" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="273" y="395" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">34</text>
  <rect x="296" y="366" width="35" height="44" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="313.5" y="395" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">3</text>
  <rect x="331" y="366" width="46" height="44" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="354" y="395" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">30</text>
  <text x="400" y="395" font-size="20" font-weight="bold" fill="#374151" text-anchor="middle">=</text>
  <rect x="424" y="366" width="150" height="44" rx="6" fill="#047857" stroke="#047857" stroke-width="1.5"/>
  <text x="499" y="396" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"9534330"</text>
  <text x="596" y="394" font-size="15" fill="#4b5563">정렬 순서대로 이어 붙임</text>
</svg>
