<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">주제 폴더의 세 겹 구성</title>
  <desc id="d">운영체제 주제 폴더를 예로, README.md(① 주제 지도), 번호 붙은 개념 설명 파일들(② 개념 설명), qna-os.md(③ 면접 질문과 모범 답변)의 세 겹을 위에서 아래로 읽는 순서와 함께 보여 준다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 루트 폴더 -->
  <text x="30" y="48" font-size="17" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">01-computer-science-fundamentals/operating-system/</text>

  <!-- 겹 ① : 주제 지도 -->
  <rect x="62" y="72" width="794" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- 겹 ② : 개념 설명 -->
  <rect x="62" y="156" width="794" height="132" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <!-- 겹 ③ : 면접 QnA -->
  <rect x="62" y="308" width="794" height="64" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>

  <!-- 트리 가지 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <line x1="42" y1="58" x2="42" y2="340"/>
    <line x1="42" y1="104" x2="76" y2="104"/>
    <line x1="42" y1="188" x2="76" y2="188"/>
    <line x1="42" y1="222" x2="76" y2="222"/>
    <line x1="42" y1="256" x2="76" y2="256"/>
    <line x1="42" y1="340" x2="76" y2="340"/>
  </g>

  <!-- 파일 이름 -->
  <g font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="86" y="110">README.md</text>
    <text x="86" y="194">01-process-thread.md</text>
    <text x="86" y="228">02-memory-management.md</text>
    <text x="86" y="262" fill="#4b5563">...</text>
    <text x="86" y="346">qna-os.md</text>
  </g>

  <!-- 읽는 순서: 번호 원과 화살표 -->
  <line x1="384" y1="126" x2="384" y2="199" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="384" y1="244" x2="384" y2="317" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <circle cx="384" cy="104" r="18" fill="#1d4ed8"/>
  <text x="384" y="110.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="384" cy="222" r="18" fill="#047857"/>
  <text x="384" y="228.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="384" cy="340" r="18" fill="#b45309"/>
  <text x="384" y="346.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 설명 -->
  <text x="416" y="98" font-size="19" font-weight="700" fill="#1e40af">이 주제의 지도</text>
  <text x="416" y="124" font-size="16" fill="#374151">무엇을 어떤 순서로 볼지</text>

  <text x="416" y="216" font-size="19" font-weight="700" fill="#065f46">개념 설명</text>
  <rect x="508" y="199" width="48" height="22" rx="11" fill="#047857"/>
  <text x="532" y="215" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">핵심</text>
  <text x="416" y="242" font-size="16" fill="#374151">"왜 필요한가"부터 코드·그림까지</text>

  <text x="416" y="346.5" font-size="19" font-weight="700" fill="#92400e">면접 질문 &amp; 모범 답변</text>
</svg>
