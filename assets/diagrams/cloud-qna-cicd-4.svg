<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rolling 배포</title>
  <desc id="d">Rolling 배포 방식의 3단계 진행 과정을 보여주는 다이어그램입니다. 각 단계마다 서버가 순차적으로 v1.0에서 v2.0으로 업데이트됩니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- Step 1 Group -->
  <g>
    <!-- Row 1: v1.0, v1.0, v1.0, v1.0 -->
    <rect x="180" y="40" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="230" y="69.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>

    <rect x="330" y="40" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="380" y="69.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>

    <rect x="480" y="40" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="530" y="69.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>

    <rect x="630" y="40" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="680" y="69.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>
  </g>

  <!-- Arrow 1: Step 1 -> Step 2 -->
  <path d="M230,90 L230,180" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 Group -->
  <g>
    <!-- Row 2: v2.0, v1.0, v1.0, v1.0 -->
    <rect x="180" y="195" width="100" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="230" y="224.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v2.0</text>

    <rect x="330" y="195" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="380" y="224.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>

    <rect x="480" y="195" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="530" y="224.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>

    <rect x="630" y="195" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="680" y="224.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>
  </g>

  <!-- Arrows 2: Step 2 -> Step 3 -->
  <path d="M230,245 L230,335" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M380,245 L380,335" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3 Group -->
  <g>
    <!-- Row 3: v2.0, v2.0, v1.0, v1.0 -->
    <rect x="180" y="350" width="100" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="230" y="379.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v2.0</text>

    <rect x="330" y="350" width="100" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="380" y="379.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v2.0</text>

    <rect x="480" y="350" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="530" y="379.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>

    <rect x="630" y="350" width="100" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="680" y="379.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1.0</text>
  </g>
</svg>