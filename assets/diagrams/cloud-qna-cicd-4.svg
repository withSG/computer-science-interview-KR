<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rolling 배포 순차 교체</title>
  <desc id="d">나란히 선 v1.0 네 개를 왼쪽부터 하나씩 v2.0으로 바꿔 나가는 Rolling 배포를 3단계로 보여 줍니다. 단계 1은 모두 v1.0, 단계 2는 첫 번째가 v2.0, 단계 3은 두 번째까지 v2.0입니다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="24" y="42" font-size="17" font-weight="bold" fill="#111827">왼쪽부터 하나씩 v1.0 → v2.0 순차적 교체</text>
  <text x="856" y="42" font-size="15" font-weight="bold" fill="#374151" text-anchor="end">v2.0 교체 수</text>

  <!-- 단계 1 -->
  <text x="24" y="112" font-size="17" font-weight="bold" fill="#111827">단계 1</text>
  <rect x="120" y="80" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="185" y="114" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <rect x="270" y="80" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="335" y="114" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <rect x="420" y="80" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="485" y="114" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <rect x="570" y="80" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="635" y="114" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <text x="856" y="114" font-size="18" font-weight="bold" fill="#4b5563" text-anchor="end">0 / 4</text>

  <!-- 단계 1 → 2 -->
  <line x1="185" y1="140" x2="185" y2="186" stroke="#047857" stroke-width="2" marker-end="url(#arr)"/>
  <text x="197" y="169" font-size="15" font-weight="bold" fill="#047857">교체</text>

  <!-- 단계 2 -->
  <text x="24" y="226" font-size="17" font-weight="bold" fill="#111827">단계 2</text>
  <rect x="120" y="194" width="130" height="56" rx="8" fill="#dcfce7" stroke="#047857" stroke-width="3"/>
  <text x="185" y="228" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">v2.0</text>
  <rect x="270" y="194" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="335" y="228" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <rect x="420" y="194" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="485" y="228" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <rect x="570" y="194" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="635" y="228" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <text x="856" y="228" font-size="18" font-weight="bold" fill="#047857" text-anchor="end">1 / 4</text>

  <!-- 단계 2 → 3 -->
  <line x1="185" y1="254" x2="185" y2="300" stroke="#047857" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="335" y1="254" x2="335" y2="300" stroke="#047857" stroke-width="2" marker-end="url(#arr)"/>
  <text x="347" y="283" font-size="15" font-weight="bold" fill="#047857">교체</text>

  <!-- 단계 3 -->
  <text x="24" y="340" font-size="17" font-weight="bold" fill="#111827">단계 3</text>
  <rect x="120" y="308" width="130" height="56" rx="8" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="185" y="342" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">v2.0</text>
  <rect x="270" y="308" width="130" height="56" rx="8" fill="#dcfce7" stroke="#047857" stroke-width="3"/>
  <text x="335" y="342" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">v2.0</text>
  <rect x="420" y="308" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="485" y="342" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <rect x="570" y="308" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="635" y="342" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1.0</text>
  <text x="856" y="342" font-size="18" font-weight="bold" fill="#047857" text-anchor="end">2 / 4</text>
</svg>
