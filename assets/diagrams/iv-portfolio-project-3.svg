<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안티패턴 → 개선</title>
  <desc id="d">안티패턴과 대비되는 개선된 답변 구조를 보여주는 다이어그램으로 대안, 기준, 트레이드오프 순의 흐름을 나타냅니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <rect x="40" y="30" width="800" height="280" rx="6" ry="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="62" font-size="16" font-weight="bold" fill="#2563eb">[개선 - 대안 → 기준 → 트레이드오프]</text>

  <text x="60" y="99" font-size="13" fill="#1f2933">"장바구니 상태를 목록, 상세, 결제 세 화면이 공유해야 했습니다.</text>
  <text x="500" y="99" font-size="13" fill="#dc2626">← 문제</text>

  <text x="60" y="121" font-size="13" fill="#1f2933">처음엔 Context API로 시작했는데, 장바구니 수량이 바뀔 때마다</text>
  <text x="60" y="143" font-size="13" fill="#1f2933">Context를 구독한 컴포넌트가 전부 다시 그려지는 게 확인됐습니다.</text>

  <text x="60" y="180" font-size="13" fill="#1f2933">후보는 Context 유지 + 분할, Redux Toolkit, Zustand였습니다.</text>
  <text x="500" y="180" font-size="13" font-weight="bold" fill="#2563eb">← [1] 대안</text>

  <text x="60" y="202" font-size="13" fill="#1f2933">팀원 두 명이 Redux 경험이 있었고 남은 기간이 3주라</text>

  <text x="60" y="224" font-size="13" fill="#1f2933">새 라이브러리를 학습할 여유가 없다고 판단해서</text>
  <text x="500" y="224" font-size="13" font-weight="bold" fill="#059669">← [2] 기준</text>

  <text x="60" y="246" font-size="13" fill="#1f2933">Redux Toolkit을 골랐습니다.</text>

  <text x="60" y="283" font-size="13" fill="#1f2933">보일러플레이트가 늘어나는 건 감수했고,</text>
  <text x="500" y="283" font-size="13" font-weight="bold" fill="#d97706">← [3] 트레이드오프</text>

  <text x="60" y="305" font-size="13" fill="#1f2933">createSlice로 액션 타입 정의를 줄여서 어느 정도 완화했습니다.</text>
  <text x="60" y="327" font-size="13" fill="#1f2933">지금 다시 한다면 팀 상황에 따라 Zustand도 진지하게 볼 것 같습니다."</text>
</svg>