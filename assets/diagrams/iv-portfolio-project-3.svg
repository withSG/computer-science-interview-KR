<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Redux 선택 개선 답변</title>
  <desc id="d">"왜 Redux를 선택했나"에 대한 개선 답변을 문제, [1] 대안, [2] 기준, [3] 트레이드오프, 회고 구간으로 나눠 표시한 그림. 기준은 팀 숙련도와 남은 기간이라는 프로젝트 제약에서 나온다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <text x="24" y="46" font-size="18" font-weight="bold" fill="#111827">[개선 - <tspan fill="#1d4ed8">대안</tspan> → <tspan fill="#047857">기준</tspan> → <tspan fill="#6d28d9">트레이드오프</tspan>]</text>

  <rect x="24" y="68" width="832" height="368" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 문제 -->
  <rect x="44" y="87" width="152" height="28" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="120" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">문제</text>
  <rect x="212" y="89" width="4" height="76" fill="#b91c1c"/>
  <text x="228" y="107" font-size="16" fill="#111827">"장바구니 상태를 목록, 상세, 결제 세 화면이 공유해야 했습니다.</text>
  <text x="228" y="133" font-size="16" fill="#111827">처음엔 Context API로 시작했는데, 장바구니 수량이 바뀔 때마다</text>
  <text x="228" y="159" font-size="16" fill="#111827">Context를 구독한 컴포넌트가 전부 다시 그려지는 게 확인됐습니다.</text>

  <!-- [1] 대안 -->
  <rect x="44" y="181" width="152" height="28" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="120" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">[1] 대안</text>
  <rect x="212" y="183" width="4" height="24" fill="#1d4ed8"/>
  <text x="228" y="201" font-size="16" fill="#111827">후보는 Context 유지 + 분할, Redux Toolkit, Zustand였습니다.</text>

  <!-- [2] 기준 -->
  <rect x="44" y="223" width="152" height="28" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="120" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">[2] 기준</text>
  <rect x="212" y="225" width="4" height="76" fill="#047857"/>
  <text x="228" y="243" font-size="16" fill="#111827">팀원 두 명이 Redux 경험이 있었고 남은 기간이 3주라</text>
  <text x="228" y="269" font-size="16" fill="#111827">새 라이브러리를 학습할 여유가 없다고 판단해서</text>
  <text x="228" y="295" font-size="16" fill="#111827">Redux Toolkit을 골랐습니다.</text>

  <!-- [3] 트레이드오프 -->
  <rect x="44" y="317" width="152" height="28" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="120" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">[3] 트레이드오프</text>
  <rect x="212" y="319" width="4" height="50" fill="#6d28d9"/>
  <text x="228" y="337" font-size="16" fill="#111827">보일러플레이트가 늘어나는 건 감수했고,</text>
  <text x="228" y="363" font-size="16" fill="#111827">createSlice로 액션 타입 정의를 줄여서 어느 정도 완화했습니다.</text>

  <!-- 회고 -->
  <rect x="44" y="385" width="152" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">회고</text>
  <rect x="212" y="387" width="4" height="24" fill="#6b7280"/>
  <text x="228" y="405" font-size="16" fill="#111827">지금 다시 한다면 팀 상황에 따라 Zustand도 진지하게 볼 것 같습니다."</text>
</svg>
