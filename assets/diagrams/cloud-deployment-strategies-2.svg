<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rolling Update — 한 대씩 갈아탄다</title>
  <desc id="d">Rolling update deployment process showing traffic flow and step-by-step instance replacement from v1 to v2.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- LB Box -->
  <rect x="180" y="30" width="80" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="52.6" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">LB</text>

  <!-- LB Lines -->
  <path d="M220,66 L220,85" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M70,85 L370,85" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M70,85 L70,105" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M170,85 L170,105" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M270,85 L270,105" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M370,85 L370,105" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- LB Side Note -->
  <text x="235" y="79" font-size="11.5" fill="#52606d">트래픽은 항상 흐른다</text>

  <!-- Step 1 -->
  <rect x="40" y="105" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="70" y="127.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="140" y="105" width="60" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="127.6" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">[v1]</text>

  <rect x="240" y="105" width="60" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="127.6" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">[v1]</text>

  <rect x="340" y="105" width="60" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="370" y="127.6" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">[v1]</text>

  <text x="430" y="127.6" font-size="13" fill="#1f2933">① 한 대를 v2로 교체, 헬스체크 통과 후 트래픽 투입</text>

  <!-- Step 2 -->
  <rect x="40" y="155" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="70" y="177.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="140" y="155" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="177.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="240" y="155" width="60" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="177.6" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">[v1]</text>

  <rect x="340" y="155" width="60" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="370" y="177.6" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">[v1]</text>

  <text x="430" y="177.6" font-size="13" fill="#1f2933">② 다음 한 대</text>

  <!-- Step 3 -->
  <rect x="40" y="205" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="70" y="227.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="140" y="205" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="227.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="240" y="205" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="270" y="227.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="340" y="205" width="60" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="370" y="227.6" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">[v1]</text>

  <text x="430" y="227.6" font-size="13" fill="#1f2933">③</text>

  <!-- Step 4 -->
  <rect x="40" y="255" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="70" y="277.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="140" y="255" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="277.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="240" y="255" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="270" y="277.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <rect x="340" y="255" width="60" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="370" y="277.6" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">[v2]</text>

  <text x="430" y="277.6" font-size="13" fill="#1f2933">④ 완료</text>

  <!-- Footer Banner -->
  <rect x="40" y="325" width="800" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="50" y="349.6" font-size="13" fill="#d97706" font-weight="bold">배포 중 상태: v1과 v2가 동시에 트래픽을 받는다</text>
  <path d="M415,345 L435,345" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-ink)" fill="none"/>
  <text x="445" y="349.6" font-size="13" fill="#1f2933">이게 이 전략의 전제이자 위험</text>
</svg>