<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rolling Update 진행 단계</title>
  <desc id="d">LB 뒤의 네 대를 한 대씩 v1에서 v2로 교체합니다. 한 대를 v2로 바꾸고 헬스체크를 통과하면 트래픽을 넣고, 다음 한 대로 넘어가 네 대가 모두 v2가 되면 완료입니다. 배포 중에는 v1과 v2가 동시에 트래픽을 받으며, 이것이 이 전략의 전제이자 위험입니다.</desc>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 범례 -->
  <rect x="28" y="34" width="30" height="20" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="68" y="49" font-size="14" fill="#4b5563">이번 단계에 교체된 한 대</text>

  <!-- LB -->
  <rect x="294" y="24" width="80" height="44" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="334" y="52" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">LB</text>
  <text x="392" y="52" font-size="15" fill="#4b5563">트래픽은 항상 흐른다</text>

  <path d="M334,68 L334,88 M184,88 L484,88" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M184,88 L184,108" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ak)"/>
  <path d="M284,88 L284,108" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ak)"/>
  <path d="M384,88 L384,108" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ak)"/>
  <path d="M484,88 L484,108" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ak)"/>

  <!-- 배포 중 괄호 (①~③) -->
  <path d="M100,114 L92,114 L92,270 L100,270" stroke="#b45309" stroke-width="2" fill="none"/>
  <text x="28" y="197" font-size="15" font-weight="bold" fill="#b45309">배포 중</text>

  <!-- ① -->
  <text x="122" y="140" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">①</text>
  <rect x="144" y="112" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="184" y="140" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="244" y="112" width="80" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="284" y="140" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="344" y="112" width="80" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="384" y="140" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="444" y="112" width="80" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="484" y="140" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <text x="556" y="130" font-size="15" fill="#1f2937">한 대를 v2로 교체,</text>
  <text x="556" y="151" font-size="15" fill="#1f2937">헬스체크 통과 후 트래픽 투입</text>

  <!-- ② -->
  <text x="122" y="198" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">②</text>
  <rect x="144" y="170" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="184" y="198" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="244" y="170" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="284" y="198" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="344" y="170" width="80" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="384" y="198" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="444" y="170" width="80" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="484" y="198" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <text x="556" y="198" font-size="15" fill="#1f2937">다음 한 대</text>

  <!-- ③ -->
  <text x="122" y="256" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">③</text>
  <rect x="144" y="228" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="184" y="256" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="244" y="228" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="284" y="256" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="344" y="228" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="384" y="256" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="444" y="228" width="80" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="484" y="256" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>

  <!-- ④ -->
  <text x="122" y="314" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">④</text>
  <rect x="144" y="286" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="184" y="314" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="244" y="286" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="284" y="314" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="344" y="286" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="384" y="314" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="444" y="286" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="484" y="314" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <text x="556" y="314" font-size="16" font-weight="bold" fill="#047857">완료</text>

  <!-- 결론 -->
  <rect x="28" y="356" width="824" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="48" y="387" font-size="17" font-weight="bold" fill="#1f2937">배포 중 상태: v1과 v2가 동시에 트래픽을 받는다</text>
  <text x="452" y="387" font-size="16" font-weight="bold" fill="#b91c1c">← 이게 이 전략의 전제이자 위험</text>
</svg>
