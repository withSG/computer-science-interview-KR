<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GraphQL 스키마와 타입 시스템 - Nullability 및 리스트 타입 표기법</title>
  <desc id="d">GraphQL의 널 허용 여부(! 연산자) 및 리스트 타입의 중첩된 널 허용 규칙을 설명하는 표 형태의 다이어그램</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- Sub-heading/Context Section -->
  <text x="40" y="36" font-size="16" font-weight="bold" fill="#1f2933">2. 스키마와 타입 시스템</text>

  <!-- Section 1: Basic Nullability -->
  <g>
    <!-- Row 1: String -->
    <rect x="40" y="60" width="120" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="100" y="86" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">String</text>

    <text x="180" y="86" font-size="13" fill="#52606d">널 허용</text>

    <!-- Row 2: String! -->
    <rect x="440" y="60" width="120" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="86" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">String!</text>

    <text x="580" y="86" font-size="13" fill="#1f2933">널 불가 (반드시 값이 있음)</text>
  </g>

  <!-- Divider line -->
  <line x1="40" y1="128" x2="840" y2="128" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Section 2: List Nullability -->
  <g>
    <!-- Card 1: [Post] -->
    <rect x="40" y="150" width="800" height="68" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <rect x="56" y="162" width="110" height="44" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="111" y="188" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[Post]</text>
    <text x="186" y="188" font-size="13" fill="#52606d">리스트도 원소도 널일 수 있음</text>

    <!-- Card 2: [Post!] -->
    <rect x="40" y="232" width="800" height="68" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <rect x="56" y="244" width="110" height="44" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="111" y="270" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[Post!]</text>
    <text x="186" y="270" font-size="13" fill="#52606d">리스트는 널일 수 있지만 원소는 널이 아님</text>

    <!-- Card 3: [Post!]! (Highlighted) -->
    <rect x="40" y="314" width="800" height="76" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="56" y="326" width="110" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="111" y="352" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">[Post!]!</text>

    <!-- Label & Annotation -->
    <text x="186" y="352" font-size="13" fill="#1f2933">
      리스트도 원소도 널이 아님
      <tspan font-weight="bold" fill="#d97706"> ← 가장 흔하다. 결과가 없으면 빈 배열 []</tspan>
    </text>
  </g>
</svg>