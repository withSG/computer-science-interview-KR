<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GraphQL 널 허용 표기 읽는 법</title>
  <desc id="d">타입 뒤에 !가 붙으면 널 불가다. 리스트 타입은 리스트 자체와 원소의 널 허용 여부가 따로 정해지며, 가장 흔한 [Post!]!는 둘 다 널이 아니고 결과가 없으면 빈 배열 []을 돌려준다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 규칙 1 -->
  <text x="32" y="44" font-size="17" font-weight="bold" fill="#111827">규칙 1 · 기본 타입</text>

  <rect x="32" y="60" width="400" height="72" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="56" y="104" font-size="22" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">String</text>
  <rect x="160" y="80" width="92" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="206" y="102" font-size="15" fill="#374151" text-anchor="middle">널 허용</text>

  <rect x="448" y="60" width="400" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="472" y="104" font-size="22" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">String!</text>
  <rect x="576" y="80" width="92" height="32" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="622" y="102" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">널 불가</text>
  <text x="682" y="102" font-size="15" fill="#1f2937">(반드시 값이 있음)</text>

  <!-- 규칙 2 -->
  <text x="32" y="184" font-size="17" font-weight="bold" fill="#111827">규칙 2 · 리스트 타입</text>

  <!-- 표 머리행 -->
  <rect x="32" y="200" width="816" height="40" fill="#f3f4f6"/>
  <text x="52" y="226" font-size="15" font-weight="bold" fill="#111827">타입</text>
  <text x="232" y="226" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">리스트 자체</text>
  <text x="352" y="226" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">원소</text>
  <text x="432" y="226" font-size="15" font-weight="bold" fill="#111827">의미</text>

  <!-- 강조 행 배경 -->
  <rect x="32" y="344" width="816" height="80" fill="#fffbeb"/>

  <!-- 행 1: [Post] -->
  <text x="52" y="275" font-size="20" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[Post]</text>
  <rect x="186" y="252" width="92" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="232" y="274" font-size="15" fill="#374151" text-anchor="middle">널 허용</text>
  <rect x="306" y="252" width="92" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="352" y="274" font-size="15" fill="#374151" text-anchor="middle">널 허용</text>
  <text x="432" y="274" font-size="15" fill="#1f2937">리스트도 원소도 널일 수 있음</text>

  <!-- 행 2: [Post!] -->
  <text x="52" y="327" font-size="20" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[Post!]</text>
  <rect x="186" y="304" width="92" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="232" y="326" font-size="15" fill="#374151" text-anchor="middle">널 허용</text>
  <rect x="306" y="304" width="92" height="32" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="352" y="326" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">널 불가</text>
  <text x="432" y="326" font-size="15" fill="#1f2937">리스트는 널일 수 있지만 원소는 널이 아님</text>

  <!-- 행 3: [Post!]! -->
  <text x="52" y="391" font-size="20" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[Post!]!</text>
  <rect x="186" y="368" width="92" height="32" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="232" y="390" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">널 불가</text>
  <rect x="306" y="368" width="92" height="32" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="352" y="390" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">널 불가</text>
  <text x="432" y="376" font-size="15" fill="#1f2937">리스트도 원소도 널이 아님</text>
  <text x="432" y="402" font-size="15" font-weight="bold" fill="#92400e">← 가장 흔하다. 결과가 없으면 빈 배열 []</text>

  <!-- 표 격자 -->
  <line x1="32" y1="240" x2="848" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="32" y1="292" x2="848" y2="292" stroke="#d1d5db" stroke-width="1"/>
  <line x1="32" y1="344" x2="848" y2="344" stroke="#d1d5db" stroke-width="1"/>
  <line x1="172" y1="200" x2="172" y2="424" stroke="#d1d5db" stroke-width="1"/>
  <line x1="292" y1="200" x2="292" y2="424" stroke="#d1d5db" stroke-width="1"/>
  <line x1="412" y1="200" x2="412" y2="424" stroke="#d1d5db" stroke-width="1"/>
  <rect x="32" y="200" width="816" height="224" rx="0" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
</svg>
