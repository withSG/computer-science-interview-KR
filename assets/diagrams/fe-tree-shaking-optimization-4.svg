<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 890" width="880" height="890" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Webpack과 Vite 개발 서버</title>
  <desc id="d">Webpack dev server는 entry부터 모든 모듈로 그래프를 구축하고 전부 변환해 하나로 묶은 뒤에야 브라우저에 서빙하므로 프로젝트가 커질수록 첫 화면 시간이 늘어난다. Vite dev server는 거의 즉시 시작하고, 브라우저가 index.html의 script type="module"에서 시작해 import를 따라 모듈을 하나씩 요청하면 요청된 모듈만 변환해 응답한다.</desc>
  <rect width="880" height="890" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="agn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ── Webpack dev server ── -->
  <rect x="24" y="25" width="6" height="26" fill="#b45309"/>
  <text x="42" y="45" font-size="18" font-weight="700" fill="#111827">Webpack dev server</text>
  <text x="236" y="45" font-size="15" fill="#4b5563">전체 사전 번들링 (프로젝트 크기 비례 대기)</text>

  <g font-size="16" fill="#111827" text-anchor="middle">
    <rect x="40" y="70" width="96" height="58" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="88" y="105">서버 시작</text>
    <rect x="166" y="70" width="196" height="58" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="264" y="94"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">entry</tspan>부터 모든 모듈을</text>
    <text x="264" y="117">훑어 그래프 구축</text>
    <rect x="392" y="70" width="96" height="58" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="440" y="105">전부 변환</text>
    <rect x="518" y="70" width="146" height="58" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="591" y="105">전부 하나로 묶기</text>
    <rect x="694" y="70" width="146" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="767" y="105" font-weight="700" fill="#1d4ed8">브라우저에 서빙</text>
  </g>
  <g stroke="#4b5563" stroke-width="2">
    <line x1="139" y1="99" x2="162" y2="99" marker-end="url(#ag)"/>
    <line x1="365" y1="99" x2="388" y2="99" marker-end="url(#ag)"/>
    <line x1="491" y1="99" x2="514" y2="99" marker-end="url(#ag)"/>
    <line x1="667" y1="99" x2="690" y2="99" marker-end="url(#ag)"/>
  </g>

  <path d="M40,138 V148 H840 V138" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">브라우저에 서빙까지 와야 첫 화면이 뜬다</text>
  <text x="440" y="200" text-anchor="middle" font-size="15" fill="#b91c1c">프로젝트가 커질수록 이 시간이 비례해서 늘어난다</text>

  <line x1="24" y1="226" x2="856" y2="226" stroke="#d1d5db" stroke-dasharray="6 6"/>

  <!-- ── Vite dev server ── -->
  <rect x="24" y="245" width="6" height="26" fill="#6d28d9"/>
  <text x="42" y="265" font-size="18" font-weight="700" fill="#111827">Vite dev server</text>
  <text x="200" y="265" font-size="15" fill="#4b5563">필요시 즉시 서빙 (On-Demand ES Module Serving)</text>

  <!-- 범례 -->
  <line x1="40" y1="298" x2="80" y2="298" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="90" y="303" font-size="15" fill="#111827">브라우저 요청 (Native ESM)</text>
  <line x1="340" y1="298" x2="380" y2="298" stroke="#047857" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#agn)"/>
  <text x="390" y="303" font-size="15" fill="#111827">Vite 서버 응답 (개별 모듈 변환)</text>

  <!-- 생명선 머리 -->
  <rect x="160" y="324" width="140" height="36" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="230" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">브라우저</text>
  <rect x="610" y="324" width="140" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="680" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Vite 서버</text>

  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="230" y1="360" x2="230" y2="776"/>
    <line x1="680" y1="360" x2="680" y2="372"/>
    <line x1="680" y1="406" x2="680" y2="776"/>
  </g>

  <rect x="585" y="372" width="190" height="34" rx="17" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="680" y="395" text-anchor="middle" font-size="15" fill="#111827">서버 시작 (거의 즉시)</text>

  <!-- 메시지 -->
  <g font-size="15" fill="#111827" text-anchor="middle">
    <text x="455" y="436"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">index.html</tspan> 요청</text>
    <text x="455" y="480" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;script type="module" src="/src/main.js"&gt;</text>
    <text x="455" y="524">"<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/src/main.js</tspan> 주세요"</text>
    <text x="455" y="568"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main.js</tspan> 하나만 변환해서 응답</text>
    <text x="455" y="606" fill="#4b5563">응답 안의 import를 보고</text>
    <text x="455" y="628">"<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/src/App.jsx</tspan> 주세요"</text>
    <text x="455" y="672"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">App.jsx</tspan> 하나만 변환해서 응답</text>
    <text x="455" y="716">"<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/src/Button.jsx</tspan> 주세요"</text>
    <text x="455" y="760" font-size="18" font-weight="700" fill="#4b5563">...</text>
  </g>

  <g stroke-width="2">
    <line x1="232" y1="444" x2="676" y2="444" stroke="#1d4ed8" marker-end="url(#ab)"/>
    <line x1="678" y1="488" x2="234" y2="488" stroke="#047857" stroke-dasharray="6 4" marker-end="url(#agn)"/>
    <line x1="232" y1="532" x2="676" y2="532" stroke="#1d4ed8" marker-end="url(#ab)"/>
    <line x1="678" y1="576" x2="234" y2="576" stroke="#047857" stroke-dasharray="6 4" marker-end="url(#agn)"/>
    <line x1="232" y1="636" x2="676" y2="636" stroke="#1d4ed8" marker-end="url(#ab)"/>
    <line x1="678" y1="680" x2="234" y2="680" stroke="#047857" stroke-dasharray="6 4" marker-end="url(#agn)"/>
    <line x1="232" y1="724" x2="676" y2="724" stroke="#1d4ed8" marker-end="url(#ab)"/>
  </g>

  <rect x="40" y="796" width="800" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="826" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">실제로 화면에 필요한 모듈만 요청되고, 요청된 것만 변환한다.</text>
  <text x="440" y="852" text-anchor="middle" font-size="15" fill="#047857">프로젝트에 파일이 1000개든 10000개든 첫 화면 시간은 크게 변하지 않는다.</text>
</svg>
