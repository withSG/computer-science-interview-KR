<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ETL과 ELT의 변환 위치</title>
  <desc id="d">ETL은 웨어하우스 바깥의 변환 서버에서 정제·조인·집계·마스킹을 끝내고 정제된 테이블만 적재한다. ELT는 원본을 웨어하우스(레이크)에 먼저 넣고 그 안에서 SQL로 원본을 정제·집계한다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ETL -->
  <rect x="24" y="24" width="64" height="32" rx="6" fill="#1f2937"/>
  <text x="56" y="46" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">ETL</text>
  <text x="104" y="46" font-size="16" fill="#1f2937">변환을 웨어하우스 <tspan font-weight="bold" fill="#b45309">바깥</tspan>에서 끝내고, 정제본만 넣는다</text>

  <rect x="24" y="96" width="96" height="68" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="136" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">소스</text>

  <line x1="122" y1="130" x2="214" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="168" y="118" font-size="15" fill="#374151" text-anchor="middle">추출</text>

  <rect x="220" y="84" width="240" height="92" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="340" y="120" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">변환 서버</text>
  <text x="340" y="150" font-size="15" fill="#374151" text-anchor="middle">(정제/조인/집계/마스킹)</text>

  <line x1="462" y1="130" x2="554" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="508" y="118" font-size="15" fill="#374151" text-anchor="middle">적재</text>

  <rect x="560" y="84" width="296" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="708" y="120" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">웨어하우스</text>
  <text x="708" y="150" font-size="15" fill="#374151" text-anchor="middle">정제된 테이블만</text>

  <line x1="24" y1="212" x2="856" y2="212" stroke="#d1d5db" stroke-width="1"/>

  <!-- ELT -->
  <rect x="24" y="240" width="64" height="32" rx="6" fill="#1f2937"/>
  <text x="56" y="262" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">ELT</text>
  <text x="104" y="262" font-size="16" fill="#1f2937">원본을 일단 다 넣고, 웨어하우스 <tspan font-weight="bold" fill="#b45309">안</tspan>에서 SQL로 변환한다</text>

  <rect x="24" y="336" width="96" height="68" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="376" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">소스</text>

  <line x1="122" y1="370" x2="214" y2="370" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="168" y="358" font-size="15" fill="#374151" text-anchor="middle">추출</text>

  <rect x="220" y="300" width="636" height="136" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="244" y="328" font-size="17" font-weight="bold" fill="#1e3a8a">웨어하우스 / 레이크</text>

  <rect x="244" y="346" width="140" height="52" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="314" y="378" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">원본(raw)</text>

  <line x1="386" y1="372" x2="506" y2="372" stroke="#b45309" stroke-width="2.5" marker-end="url(#ah-t)"/>
  <text x="446" y="360" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">SQL 변환</text>

  <rect x="512" y="346" width="120" height="52" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="572" y="378" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">정제</text>

  <line x1="634" y1="372" x2="698" y2="372" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="704" y="346" width="128" height="52" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="768" y="378" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">집계</text>
</svg>
