<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">전통적인 방식과 IoC의 제어 흐름 비교</title>
  <desc id="d">전통적인 방식에서는 main()이 OrderService, KakaoPayService, HttpClient를 차례로 new로 만든다. IoC에서는 Spring 컨테이너가 HttpClient부터 생성·주입하고 HTTP 요청이 오면 OrderService.order()를 호출한다.</desc>
  <defs>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="580" fill="#ffffff"/>

  <!-- ───── 왼쪽: 전통적인 방식 ───── -->
  <rect x="24" y="24" width="404" height="532" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="48" y="58" font-size="15" font-weight="bold" fill="#b45309">전통적인 방식</text>
  <text x="48" y="90" font-size="20" font-weight="bold" fill="#111827">내 코드가 흐름의 주인</text>

  <rect x="48" y="112" width="140" height="44" rx="8" fill="#b45309"/>
  <text x="118" y="140" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main()</text>

  <path d="M68,156 V204 H91" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="92" y="184" width="210" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="108" y="209" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">new OrderService()</text>

  <path d="M112,224 V300 H135" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="136" y="280" width="232" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="152" y="305" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">new KakaoPayService()</text>

  <path d="M156,320 V396 H179" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="180" y="376" width="196" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="196" y="401" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">new HttpClient()</text>

  <rect x="44" y="484" width="364" height="56" rx="8" fill="#fef3c7"/>
  <text x="226" y="507" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">내가 순서를 정하고,
    <tspan x="226" dy="22">내가 만들고, 내가 부른다</tspan></text>

  <!-- ───── 오른쪽: IoC ───── -->
  <rect x="452" y="24" width="404" height="532" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="476" y="58" font-size="15" font-weight="bold" fill="#6d28d9">IoC</text>
  <text x="476" y="90" font-size="20" font-weight="bold" fill="#111827">프레임워크가 흐름의 주인</text>

  <rect x="476" y="112" width="180" height="44" rx="8" fill="#6d28d9"/>
  <text x="566" y="140" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Spring 컨테이너</text>

  <path d="M496,156 V204 H535" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-violet)"/>
  <path d="M496,156 V274 H535" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-violet)"/>
  <path d="M496,156 V354 H535" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-violet)"/>
  <path d="M496,156 V434 H535" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-violet)"/>

  <!-- 1 -->
  <rect x="536" y="184" width="296" height="40" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="558" cy="204" r="11" fill="#6d28d9"/>
  <text x="558" y="209" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="580" y="209" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HttpClient</tspan> 생성</text>

  <!-- 2 -->
  <rect x="536" y="244" width="296" height="60" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="558" cy="274" r="11" fill="#6d28d9"/>
  <text x="558" y="279" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="580" y="268" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">KakaoPayService</tspan> 생성</text>
  <text x="580" y="291" font-size="15" fill="#4b5563">(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HttpClient</tspan> 주입)</text>

  <!-- 3 -->
  <rect x="536" y="324" width="296" height="60" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="558" cy="354" r="11" fill="#6d28d9"/>
  <text x="558" y="359" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="580" y="348" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService</tspan> 생성</text>
  <text x="580" y="371" font-size="15" fill="#4b5563">(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">KakaoPayService</tspan> 주입)</text>

  <!-- 4 -->
  <rect x="536" y="404" width="296" height="60" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="558" cy="434" r="11" fill="#6d28d9"/>
  <text x="558" y="439" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="580" y="428" font-size="15" fill="#4b5563">HTTP 요청 도착 시</text>
  <text x="580" y="451" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService.order()</tspan> 호출</text>

  <rect x="472" y="484" width="364" height="56" rx="8" fill="#ede9fe"/>
  <text x="654" y="507" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">나는 &quot;무엇을 할지&quot;만 작성하고,
    <tspan x="654" dy="22">&quot;언제 만들지·언제 부를지&quot;는 컨테이너가 정한다</tspan></text>
</svg>
