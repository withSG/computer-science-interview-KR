<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정의</title>
  <desc id="d">전통적인 방식과 IoC 방식의 제어 흐름 차이를 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="620" fill="#ffffff"/>

  <!-- [전통적인 방식] 섹션 -->
  <rect x="24" y="24" width="832" height="264" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  
  <!-- Header 1 -->
  <rect x="40" y="40" width="150" height="28" rx="4" fill="#d97706"/>
  <text x="115" y="58" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[전통적인 방식]</text>
  <text x="202" y="58.5" font-size="15" font-weight="bold" fill="#92400e">내 코드가 흐름의 주인</text>

  <!-- Tree 1 -->
  <!-- main() -->
  <rect x="60" y="86" width="130" height="34" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="125" y="107" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">main()</text>

  <!-- Arrow to new OrderService() -->
  <path d="M 125 120 L 125 145 L 210 145" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/>
  <rect x="218" y="128" width="180" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="308" y="149" font-size="13" fill="#1f2933" text-anchor="middle">new OrderService()</text>

  <!-- Arrow to new KakaoPayService() -->
  <path d="M 308 162 L 308 187 L 393 187" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/>
  <rect x="401" y="170" width="190" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="496" y="191" font-size="13" fill="#1f2933" text-anchor="middle">new KakaoPayService()</text>

  <!-- Arrow to new HttpClient() -->
  <path d="M 496 204 L 496 229 L 581 229" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/>
  <rect x="589" y="212" width="160" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="669" y="233" font-size="13" fill="#1f2933" text-anchor="middle">new HttpClient()</text>

  <!-- Footer 1 -->
  <rect x="40" y="254" width="800" height="24" rx="4" fill="#fef3c7"/>
  <text x="440" y="270" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">내가 순서를 정하고, 내가 만들고, 내가 부른다</text>

  <!-- [IoC] 섹션 -->
  <rect x="24" y="312" width="832" height="284" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>

  <!-- Header 2 -->
  <rect x="40" y="328" width="70" height="28" rx="4" fill="#7c3aed"/>
  <text x="75" y="346" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[IoC]</text>
  <text x="122" y="346.5" font-size="15" font-weight="bold" fill="#5b21b6">프레임워크가 흐름의 주인</text>

  <!-- Node: Spring 컨테이너 -->
  <rect x="60" y="372" width="160" height="34" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140" y="393" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Spring 컨테이너</text>

  <!-- Tree Branch 1: HttpClient 생성 -->
  <path d="M 140 406 L 140 425 L 232 425" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="240" y="408" width="160" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="320" y="429" font-size="13" fill="#1f2933" text-anchor="middle">HttpClient 생성</text>

  <!-- Tree Branch 2: KakaoPayService 생성 (HttpClient 주입) -->
  <path d="M 140 406 L 140 467 L 232 467" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="240" y="450" width="320" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="252" y="471" font-size="13" fill="#1f2933">KakaoPayService 생성</text>
  <text x="405" y="471" font-size="11.5" fill="#52606d">(HttpClient 주입)</text>

  <!-- Tree Branch 3: OrderService 생성 (KakaoPayService 주입) -->
  <path d="M 140 406 L 140 509 L 232 509" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="240" y="492" width="310" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="252" y="513" font-size="13" fill="#1f2933">OrderService 생성</text>
  <text x="390" y="513" font-size="11.5" fill="#52606d">(KakaoPayService 주입)</text>

  <!-- Tree Branch 4: HTTP 요청 도착 시 OrderService.order() 호출 -->
  <path d="M 140 406 L 140 551 L 232 551" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="240" y="534" width="370" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="425" y="555" font-size="13" fill="#1f2933" text-anchor="middle">HTTP 요청 도착 시 OrderService.order() 호출</text>

  <!-- Footer 2 -->
  <rect x="40" y="580" width="800" height="24" rx="4" fill="#ede9fe"/>
  <text x="440" y="596" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">나는 "무엇을 할지"만 작성하고, "언제 만들지·언제 부를지"는 컨테이너가 정한다</text>
</svg>