<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실제 버그 시나리오 - React의 재조정 - key가 id일 때</title>
  <desc id="d">React 재조정 과정에서 key가 고유 id일 때 새로 마운트되는 항목과 그대로 유지되며 상태가 정확히 매칭되는 모습을 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="230" fill="#ffffff"/>

  <!-- Title Section -->
  <text x="440" y="32" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[React의 재조정 - key가 id일 때]</text>

  <!-- Item 1: key 3 -->
  <g transform="translate(140, 50)">
    <rect x="0" y="0" width="600" height="42" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="bold" fill="#2563eb">key 3 :</text>
    <rect x="80" y="10" width="100" height="22" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="130" y="25" font-size="11.5" fill="#1f2933" text-anchor="middle">새로 마운트</text>
    <path d="M 190,21 L 220,21" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="235" y="26" font-size="13" fill="#1f2933">done=false,</text>
    <text x="330" y="26" font-size="13" fill="#1f2933">"운동하기"</text>
  </g>

  <!-- Item 2: key 1 -->
  <g transform="translate(140, 102)">
    <rect x="0" y="0" width="600" height="42" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="bold" fill="#1f2933">key 1 :</text>
    <rect x="80" y="10" width="100" height="22" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="130" y="25" font-size="11.5" fill="#52606d" text-anchor="middle">그대로</text>
    <path d="M 190,21 L 220,21" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="235" y="26" font-size="13" fill="#1f2933">done=false,</text>
    <text x="330" y="26" font-size="13" fill="#1f2933">"우유 사기"</text>
  </g>

  <!-- Item 3: key 2 (Highlighted / Correct) -->
  <g transform="translate(140, 154)">
    <rect x="0" y="0" width="600" height="42" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="26" font-size="13" font-weight="bold" fill="#059669">key 2 :</text>
    <rect x="80" y="10" width="100" height="22" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="130" y="25" font-size="11.5" fill="#52606d" text-anchor="middle">그대로</text>
    <path d="M 190,21 L 220,21" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="235" y="26" font-size="13" fill="#1f2933">done=true,</text>
    <text x="330" y="26" font-size="13" fill="#1f2933">"설거지"</text>
    <path d="M 440,21 L 465,21" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="475" y="26" font-size="13" font-weight="bold" fill="#059669">정확</text>
  </g>
</svg>