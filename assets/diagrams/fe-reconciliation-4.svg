<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">id를 key로 쓸 때의 재조정</title>
  <desc id="d">key가 데이터 고유의 id이면 key 3("운동하기")만 새로 마운트되고 key 1("우유 사기")과 key 2("설거지")는 그대로 유지되어, done=true가 "설거지"에 정확히 남는다.</desc>
  <rect width="880" height="310" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="24" y="46" font-size="18" font-weight="bold" fill="#111827">React의 재조정 — <tspan fill="#047857">key가 id일 때</tspan></text>

  <!-- 표 -->
  <path d="M24,108 V72 Q24,64 32,64 H848 Q856,64 856,72 V108 Z" fill="#f3f4f6"/>
  <path d="M24,228 H856 V278 Q856,286 848,286 H32 Q24,286 24,278 Z" fill="#ecfdf5"/>
  <line x1="24" y1="108" x2="856" y2="108" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="24" y1="168" x2="856" y2="168" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="228" x2="856" y2="228" stroke="#d1d5db" stroke-width="1"/>
  <rect x="24" y="64" width="832" height="222" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- 머리행 -->
  <text x="44" y="92" font-size="15" font-weight="bold" fill="#4b5563">key</text>
  <text x="170" y="92" font-size="15" font-weight="bold" fill="#4b5563">재조정</text>
  <text x="425" y="92" font-size="15" font-weight="bold" text-anchor="middle" fill="#4b5563">done</text>
  <text x="540" y="92" font-size="15" font-weight="bold" fill="#4b5563">text</text>

  <!-- key 3 -->
  <text x="44" y="144" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">key 3</text>
  <text x="170" y="144" font-size="16" font-weight="bold" fill="#1d4ed8">새로 마운트</text>
  <line x1="300" y1="139" x2="356" y2="139" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="368" y="125" width="114" height="26" rx="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="425" y="143" font-size="15" text-anchor="middle" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">done=false</text>
  <text x="540" y="144" font-size="17" fill="#111827">"운동하기"</text>

  <!-- key 1 -->
  <text x="44" y="204" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">key 1</text>
  <text x="170" y="204" font-size="16" font-weight="bold" fill="#374151">그대로</text>
  <line x1="300" y1="199" x2="356" y2="199" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="368" y="185" width="114" height="26" rx="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="425" y="203" font-size="15" text-anchor="middle" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">done=false</text>
  <text x="540" y="204" font-size="17" fill="#111827">"우유 사기"</text>

  <!-- key 2 -->
  <text x="44" y="264" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">key 2</text>
  <text x="170" y="264" font-size="16" font-weight="bold" fill="#374151">그대로</text>
  <line x1="300" y1="259" x2="356" y2="259" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="368" y="245" width="114" height="26" rx="13" fill="#ffffff" stroke="#34d399" stroke-width="1"/>
  <text x="425" y="263" font-size="15" text-anchor="middle" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">done=true</text>
  <text x="540" y="264" font-size="17" font-weight="bold" fill="#111827">"설거지"</text>
  <rect x="648" y="245" width="72" height="26" rx="13" fill="#047857"/>
  <text x="684" y="263" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">정확</text>
</svg>
