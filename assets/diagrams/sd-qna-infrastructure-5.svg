<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Canary 배포: 일부 트래픽부터</title>
  <desc id="d">Load Balancer가 트래픽의 95%를 v1(기존)에, 5%를 v2(카나리)에 보낸다. 이후 v2 비율을 5% → 25% → 50% → 100%로 점진적 확대한다. 장점은 위험 최소화와 실제 트래픽으로 검증, 단점은 복잡한 트래픽 분배 설정이다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="440" y="42" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">일부 사용자에게만 먼저 배포</text>

  <!-- Load Balancer -->
  <rect x="330" y="64" width="220" height="52" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="96" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Load Balancer</text>

  <!-- 트래픽 분배 (선 굵기 = 비율) -->
  <path d="M410,116 V150 H230 V184" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
  <path d="M470,116 V150 H650 V184" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-purple)"/>
  <text x="212" y="180" font-size="24" font-weight="bold" fill="#1d4ed8" text-anchor="end">95%</text>
  <text x="666" y="180" font-size="24" font-weight="bold" fill="#6d28d9">5%</text>

  <!-- v1 (기존) -->
  <rect x="120" y="194" width="220" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="230" y="234" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <text x="230" y="266" font-size="17" fill="#111827" text-anchor="middle">(기존)</text>

  <!-- v2 (카나리) -->
  <rect x="540" y="194" width="220" height="96" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="650" y="234" font-size="22" font-weight="bold" fill="#6d28d9" text-anchor="middle">v2</text>
  <text x="650" y="266" font-size="17" fill="#111827" text-anchor="middle">(카나리)</text>

  <!-- 점진적 확대 -->
  <text x="40" y="346" font-size="18" font-weight="bold" fill="#111827">점진적 확대</text>
  <rect x="628" y="333" width="14" height="14" fill="#6d28d9"/>
  <text x="648" y="346" font-size="15" fill="#111827">v2(카나리)</text>
  <rect x="746" y="333" width="14" height="14" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="766" y="346" font-size="15" fill="#111827">v1(기존)</text>

  <!-- 단계 1: 5% -->
  <text x="120" y="392" font-size="24" font-weight="bold" fill="#6d28d9" text-anchor="middle">5%</text>
  <rect x="40" y="404" width="160" height="20" fill="#bfdbfe"/>
  <rect x="40" y="404" width="8" height="20" fill="#6d28d9"/>
  <!-- 단계 2: 25% -->
  <text x="333" y="392" font-size="24" font-weight="bold" fill="#6d28d9" text-anchor="middle">25%</text>
  <rect x="253" y="404" width="160" height="20" fill="#bfdbfe"/>
  <rect x="253" y="404" width="40" height="20" fill="#6d28d9"/>
  <!-- 단계 3: 50% -->
  <text x="546" y="392" font-size="24" font-weight="bold" fill="#6d28d9" text-anchor="middle">50%</text>
  <rect x="466" y="404" width="160" height="20" fill="#bfdbfe"/>
  <rect x="466" y="404" width="80" height="20" fill="#6d28d9"/>
  <!-- 단계 4: 100% -->
  <text x="760" y="392" font-size="24" font-weight="bold" fill="#6d28d9" text-anchor="middle">100%</text>
  <rect x="680" y="404" width="160" height="20" fill="#bfdbfe"/>
  <rect x="680" y="404" width="160" height="20" fill="#6d28d9"/>

  <!-- 단계 사이 화살표 -->
  <line x1="208" y1="384" x2="244" y2="384" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>
  <line x1="421" y1="384" x2="457" y2="384" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>
  <line x1="634" y1="384" x2="671" y2="384" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>

  <!-- 장단점 표 -->
  <rect x="40" y="458" width="120" height="96" fill="#f3f4f6"/>
  <rect x="40" y="458" width="800" height="96" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="160" y1="458" x2="160" y2="554" stroke="#9ca3af" stroke-width="1"/>
  <line x1="40" y1="506" x2="840" y2="506" stroke="#d1d5db" stroke-width="1"/>

  <text x="100" y="488" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">장점</text>
  <text x="184" y="488" font-size="17" fill="#111827">위험 최소화, 실제 트래픽으로 검증</text>

  <text x="100" y="536" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">단점</text>
  <text x="184" y="536" font-size="17" fill="#111827">복잡한 트래픽 분배 설정</text>
</svg>
