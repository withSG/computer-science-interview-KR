<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3. Canary Deployment</title>
  <desc id="d">Canary Deployment 배포 전략을 나타낸 다이어그램입니다. Load Balancer에서 v1(기존)으로 95%, v2(카나리)로 5%의 트래픽을 분배하며, 점진적 확대 과정과 장단점을 설명합니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="520" fill="#ffffff"/>
  
  <!-- 헤더 (문서 헤딩) -->
  <text x="440" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">3. Canary Deployment</text>
  <text x="440" y="68" font-size="13" fill="#52606d" text-anchor="middle">일부 사용자에게만 먼저 배포</text>

  <!-- Load Balancer 박스 -->
  <rect x="350" y="100" width="180" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="128" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Load Balancer</text>

  <!-- 트래픽 분배 선 -->
  <path d="M440,146 L440,175" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M260,175 L620,175" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  
  <!-- v1 (기존) 방향 화살표 및 라벨 -->
  <path d="M260,175 L260,223" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="238" y="185" width="44" height="20" fill="#ffffff"/>
  <text x="260" y="199" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">95%</text>

  <!-- v2 (카나리) 방향 화살표 및 라벨 -->
  <path d="M620,175 L620,223" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="602" y="185" width="36" height="20" fill="#ffffff"/>
  <text x="620" y="199" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">5%</text>

  <!-- v1 (기존) 박스 -->
  <rect x="180" y="225" width="160" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="254" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v1</text>
  <text x="260" y="278" font-size="13" fill="#52606d" text-anchor="middle">(기존)</text>

  <!-- v2 (카나리) 박스 -->
  <rect x="540" y="225" width="160" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="620" y="254" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">v2</text>
  <text x="620" y="278" font-size="13" fill="#52606d" text-anchor="middle">(카나리)</text>

  <!-- 구분선 -->
  <line x1="40" y1="330" x2="840" y2="330" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 점진적 확대 -->
  <text x="440" y="365" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">점진적 확대: 5% → 25% → 50% → 100%</text>

  <!-- 장점 / 단점 구역 -->
  <rect x="40" y="400" width="388" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="445" font-size="13" font-weight="bold" fill="#059669">장점:</text>
  <text x="105" y="445" font-size="13" fill="#1f2933">위험 최소화, 실제 트래픽으로 검증</text>

  <rect x="452" y="400" width="388" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="472" y="445" font-size="13" font-weight="bold" fill="#dc2626">단점:</text>
  <text x="517" y="445" font-size="13" fill="#1f2933">복잡한 트래픽 분배 설정</text>
</svg>