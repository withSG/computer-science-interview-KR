<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">경우 2: 3-way merge</title>
  <desc id="d">3-way merge 시 공통 조상 c2, main c6, feature c4의 동일한 줄을 비교하여 변경 사항을 자동으로 결정하는 과정</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="45" font-size="16" font-weight="bold" fill="#1f2933">어떤 파일의 7번째 줄:</text>

  <!-- Compare Group Outer Container Box -->
  <rect x="30" y="65" width="820" height="185" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- Row 1: Common Ancestor c2 -->
  <rect x="50" y="85" width="170" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="135" y="110" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">공통 조상 c2</text>
  <text x="230" y="110" font-size="14" fill="#52606d" text-anchor="middle">:</text>
  
  <rect x="250" y="85" width="200" height="40" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="350" y="110" font-size="13" font-family="monospace" fill="#1f2933" text-anchor="middle">timeout = 30</text>

  <!-- Row 2: main c6 -->
  <rect x="50" y="138" width="170" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="163" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">main c6</text>
  <text x="230" y="163" font-size="14" fill="#52606d" text-anchor="middle">:</text>
  
  <rect x="250" y="138" width="200" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="163" font-size="13" font-family="monospace" fill="#1f2933" text-anchor="middle">timeout = 30</text>
  
  <!-- Arrow marker/pointer for main c6 -->
  <path d="M470,158 L495,158" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="505" y="138" width="130" height="40" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="570" y="163" font-size="13" fill="#52606d" text-anchor="middle">안 건드렸다</text>

  <!-- Row 3: feature c4 -->
  <rect x="50" y="191" width="170" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="135" y="216" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">feature c4</text>
  <text x="230" y="216" font-size="14" fill="#52606d" text-anchor="middle">:</text>
  
  <rect x="250" y="191" width="200" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="216" font-size="13" font-family="monospace" font-weight="bold" fill="#d97706" text-anchor="middle">timeout = 60</text>
  
  <!-- Arrow marker/pointer for feature c4 -->
  <path d="M470,211 L495,211" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="505" y="191" width="130" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="570" y="216" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">바꿨다</text>

  <!-- Result Section -->
  <path d="M50,282 L75,282" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
  <rect x="85" y="260" width="765" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="467" y="287" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">조상과 비교하면 "feature만 바꿨다"가 확정된다. 60을 채택.</text>
</svg>