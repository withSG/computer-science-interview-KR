<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">공통 조상과 비교한 7번째 줄</title>
  <desc id="d">어떤 파일의 7번째 줄이 공통 조상 c2와 main c6에서는 timeout = 30, feature c4에서는 timeout = 60이다. 조상과 비교하면 feature만 바꿨다는 것이 확정되어 60을 채택한다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="24" y="46" font-size="17" font-weight="bold" fill="#1f2937">어떤 파일의 7번째 줄</text>

  <!-- 표 -->
  <rect x="24" y="64" width="832" height="200" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M25,108 V72 Q25,65 32,65 H848 Q855,65 855,72 V108 Z" fill="#f1f5f9"/>
  <path d="M25,212 H855 V256 Q855,263 848,263 H32 Q25,263 25,256 Z" fill="#f5f3ff"/>
  <line x1="24" y1="108" x2="856" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="160" x2="856" y2="160" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="212" x2="856" y2="212" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="254" y1="64" x2="254" y2="264" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="524" y1="64" x2="524" y2="264" stroke="#cbd5e1" stroke-width="1"/>

  <text x="44" y="92" font-size="15" font-weight="bold" fill="#334155">커밋</text>
  <text x="274" y="92" font-size="15" font-weight="bold" fill="#334155">7번째 줄 내용</text>
  <text x="544" y="92" font-size="15" font-weight="bold" fill="#334155">조상과 비교</text>

  <text x="44" y="140" font-size="16" font-weight="bold" fill="#92400e">공통 조상 c2</text>
  <text x="274" y="140" font-size="17" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">timeout = 30</text>
  <text x="544" y="140" font-size="15" fill="#4b5563">비교 기준</text>

  <text x="44" y="192" font-size="16" font-weight="bold" fill="#1d4ed8">main c6</text>
  <text x="274" y="192" font-size="17" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">timeout = 30</text>
  <text x="544" y="192" font-size="16" fill="#1f2937">안 건드렸다 <tspan font-size="15" fill="#4b5563">(조상과 같음)</tspan></text>

  <text x="44" y="244" font-size="16" font-weight="bold" fill="#6d28d9">feature c4</text>
  <text x="274" y="244" font-size="17" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">timeout = 60</text>
  <text x="544" y="244" font-size="16" font-weight="bold" fill="#6d28d9">바꿨다 <tspan font-size="15" font-weight="normal" fill="#4b5563">(조상과 다름)</tspan></text>

  <!-- 결론 -->
  <line x1="440" y1="268" x2="440" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <rect x="160" y="296" width="560" height="80" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="328" font-size="16" text-anchor="middle" fill="#1f2937">조상과 비교하면 “feature만 바꿨다”가 확정된다</text>
  <text x="440" y="360" font-size="20" font-weight="bold" text-anchor="middle" fill="#047857">→ 60을 채택</text>
</svg>
