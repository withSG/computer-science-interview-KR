<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Git Flow 브랜치 흐름</title>
  <desc id="d">feature는 develop에서 분기해 develop으로 병합되고, release는 develop에서 분기해 main으로 병합되며 develop에도 다시 병합됩니다. hotfix는 main으로 바로 병합됩니다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="m-hot" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#b91c1c"/></marker>
    <marker id="m-rel" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#047857"/></marker>
    <marker id="m-feat" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#b45309"/></marker>
    <marker id="m-ink" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#374151"/></marker>
  </defs>

  <!-- 요점 -->
  <text x="32" y="44" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#b45309">feature</tspan> → <tspan fill="#6d28d9">develop</tspan> → <tspan fill="#047857">release</tspan> → <tspan fill="#1d4ed8">main</tspan> 순으로 올라감 · <tspan fill="#b91c1c">hotfix</tspan>는 <tspan fill="#1d4ed8">main</tspan>으로 직행</text>

  <!-- 브랜치 이름 -->
  <text x="32" y="105" font-size="16" font-weight="bold" fill="#b91c1c">hotfix</text>
  <text x="32" y="165" font-size="16" font-weight="bold" fill="#1d4ed8">main</text>
  <text x="32" y="225" font-size="16" font-weight="bold" fill="#047857">release</text>
  <text x="32" y="285" font-size="16" font-weight="bold" fill="#6d28d9">develop</text>
  <text x="32" y="345" font-size="16" font-weight="bold" fill="#b45309">feature</text>

  <!-- 짧게 사는 브랜치의 레인 안내선 -->
  <line x1="150" y1="100" x2="848" y2="100" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="150" y1="220" x2="848" y2="220" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="150" y1="340" x2="848" y2="340" stroke="#e5e7eb" stroke-width="2"/>

  <!-- 계속 유지되는 브랜치 -->
  <line x1="150" y1="160" x2="848" y2="160" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="150" y1="280" x2="848" y2="280" stroke="#6d28d9" stroke-width="4"/>

  <!-- feature: develop에서 분기 → develop으로 병합 -->
  <path d="M190,289 Q190,340 228,340" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-feat)"/>
  <line x1="240" y1="340" x2="290" y2="340" stroke="#b45309" stroke-width="3"/>
  <path d="M299,340 Q340,340 340,293" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#m-feat)"/>

  <!-- release 1: develop에서 분기 → main 병합 + develop 병합 -->
  <path d="M340,271 Q340,220 378,220" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-rel)"/>
  <line x1="390" y1="220" x2="440" y2="220" stroke="#047857" stroke-width="3"/>
  <path d="M449,220 Q500,220 500,173" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#m-rel)"/>
  <path d="M449,220 Q500,220 500,267" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#m-rel)"/>

  <!-- hotfix: main에서 분기 → main 병합 -->
  <path d="M500,151 Q500,100 548,100" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-hot)"/>
  <path d="M569,100 Q620,100 620,147" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#m-hot)"/>

  <!-- release 2: develop에서 분기 → main 병합 -->
  <path d="M640,271 Q640,220 678,220" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-rel)"/>
  <line x1="690" y1="220" x2="740" y2="220" stroke="#047857" stroke-width="3"/>
  <path d="M749,220 Q800,220 800,173" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#m-rel)"/>

  <!-- 커밋 -->
  <g fill="#ffffff" stroke-width="3">
    <circle cx="190" cy="160" r="7" stroke="#1d4ed8"/>
    <circle cx="500" cy="160" r="7" stroke="#1d4ed8"/>
    <circle cx="620" cy="160" r="7" stroke="#1d4ed8"/>
    <circle cx="800" cy="160" r="7" stroke="#1d4ed8"/>

    <circle cx="560" cy="100" r="7" stroke="#b91c1c"/>

    <circle cx="390" cy="220" r="7" stroke="#047857"/>
    <circle cx="440" cy="220" r="7" stroke="#047857"/>
    <circle cx="690" cy="220" r="7" stroke="#047857"/>
    <circle cx="740" cy="220" r="7" stroke="#047857"/>

    <circle cx="190" cy="280" r="7" stroke="#6d28d9"/>
    <circle cx="340" cy="280" r="7" stroke="#6d28d9"/>
    <circle cx="500" cy="280" r="7" stroke="#6d28d9"/>
    <circle cx="640" cy="280" r="7" stroke="#6d28d9"/>

    <circle cx="240" cy="340" r="7" stroke="#b45309"/>
    <circle cx="290" cy="340" r="7" stroke="#b45309"/>
  </g>

  <!-- 범례 -->
  <path d="M32,390 L72,390" fill="none" stroke="#374151" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-ink)"/>
  <text x="82" y="395" font-size="15" fill="#374151">분기</text>
  <path d="M140,390 L180,390" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#m-ink)"/>
  <text x="190" y="395" font-size="15" fill="#374151">병합</text>
  <circle cx="256" cy="390" r="7" fill="#ffffff" stroke="#374151" stroke-width="3"/>
  <text x="272" y="395" font-size="15" fill="#374151">커밋</text>
</svg>
