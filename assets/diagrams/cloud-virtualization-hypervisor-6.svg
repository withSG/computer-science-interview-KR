<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가상화와 컨테이너 스택 비교</title>
  <desc id="d">왼쪽 가상화(VM)는 App A·App B가 각자 Guest OS를 품고 Hypervisor, Host OS, Hardware 위에 올라간다. 오른쪽 컨테이너는 App A·App B가 Bins만 품고 Container Engine(Docker), Host OS, Hardware 위에 올라간다. VM은 커널을 따로 띄우고 컨테이너는 호스트 커널을 빌려 쓴다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>

  <!-- 열 머리 -->
  <text x="230" y="42" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">가상화 (VM)</text>
  <text x="650" y="42" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle">컨테이너</text>
  <line x1="440" y1="24" x2="440" y2="384" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- ===== 왼쪽: 가상화 (VM) ===== -->
  <!-- VM A -->
  <rect x="48" y="64" width="172" height="46" fill="#eff6ff"/>
  <rect x="48" y="110" width="172" height="46" fill="#fef3c7"/>
  <rect x="48" y="64" width="172" height="92" rx="6" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="48" y1="110" x2="220" y2="110" stroke="#2563eb" stroke-width="1.5"/>
  <text x="134" y="93" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">App A</text>
  <text x="134" y="139" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">Guest OS</text>
  <!-- VM B -->
  <rect x="240" y="64" width="172" height="46" fill="#eff6ff"/>
  <rect x="240" y="110" width="172" height="46" fill="#fef3c7"/>
  <rect x="240" y="64" width="172" height="92" rx="6" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="240" y1="110" x2="412" y2="110" stroke="#2563eb" stroke-width="1.5"/>
  <text x="326" y="93" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">App B</text>
  <text x="326" y="139" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">Guest OS</text>

  <line x1="134" y1="156" x2="134" y2="180" stroke="#6b7280" stroke-width="2"/>
  <line x1="326" y1="156" x2="326" y2="180" stroke="#6b7280" stroke-width="2"/>

  <rect x="48" y="180" width="364" height="64" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="230" y="218" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Hypervisor</text>

  <line x1="230" y1="244" x2="230" y2="264" stroke="#6b7280" stroke-width="2"/>

  <rect x="48" y="264" width="364" height="48" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="230" y="294" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Host OS</text>

  <line x1="230" y1="312" x2="230" y2="332" stroke="#6b7280" stroke-width="2"/>

  <rect x="48" y="332" width="364" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="230" y="362" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- ===== 오른쪽: 컨테이너 ===== -->
  <!-- Container A -->
  <rect x="468" y="64" width="172" height="46" fill="#ecfdf5"/>
  <rect x="468" y="110" width="172" height="46" fill="#d1fae5"/>
  <rect x="468" y="64" width="172" height="92" rx="6" fill="none" stroke="#059669" stroke-width="1.5"/>
  <line x1="468" y1="110" x2="640" y2="110" stroke="#059669" stroke-width="1.5"/>
  <text x="554" y="93" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">App A</text>
  <text x="554" y="139" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">Bins</text>
  <!-- Container B -->
  <rect x="660" y="64" width="172" height="46" fill="#ecfdf5"/>
  <rect x="660" y="110" width="172" height="46" fill="#d1fae5"/>
  <rect x="660" y="64" width="172" height="92" rx="6" fill="none" stroke="#059669" stroke-width="1.5"/>
  <line x1="660" y1="110" x2="832" y2="110" stroke="#059669" stroke-width="1.5"/>
  <text x="746" y="93" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">App B</text>
  <text x="746" y="139" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">Bins</text>

  <line x1="554" y1="156" x2="554" y2="180" stroke="#6b7280" stroke-width="2"/>
  <line x1="746" y1="156" x2="746" y2="180" stroke="#6b7280" stroke-width="2"/>

  <rect x="468" y="180" width="364" height="64" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="650" y="207" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Container Engine</text>
  <text x="650" y="231" font-size="15" fill="#374151" text-anchor="middle">(Docker)</text>

  <line x1="650" y1="244" x2="650" y2="264" stroke="#6b7280" stroke-width="2"/>

  <rect x="468" y="264" width="364" height="48" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="650" y="294" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Host OS</text>

  <line x1="650" y1="312" x2="650" y2="332" stroke="#6b7280" stroke-width="2"/>

  <rect x="468" y="332" width="364" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="650" y="362" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- ===== 요점 ===== -->
  <rect x="48" y="400" width="364" height="66" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="426" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">VM은 커널을 따로 띄운다</text>
  <text x="230" y="451" font-size="15" fill="#1f2937" text-anchor="middle">VM마다 Guest OS를 한 벌씩 품는다</text>

  <rect x="468" y="400" width="364" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="426" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">컨테이너는 호스트 커널을 빌려 쓴다</text>
  <text x="650" y="451" font-size="15" fill="#1f2937" text-anchor="middle">앱과 Bins만 담고, 커널은 Host OS 것을 쓴다</text>
</svg>
