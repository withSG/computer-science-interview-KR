<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">권한 구조</title>
  <desc id="d">Linux 파일 권한 표기와 각 위치별 의미(파일 타입, 소유자, 그룹, 기타 사용자 권한)를 보여주는 구조도</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="44" font-size="16" font-weight="bold" fill="#1f2933">권한 구조</text>

  <!-- Main Command/File Display Area -->
  <rect x="40" y="70" width="800" height="70" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Character Boxes / Highlights for file permissions string -->
  <!-- File Type: '-' at index 0 -->
  <rect x="60" y="85" width="24" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="72" y="111" font-size="16" font-family="monospace" font-weight="bold" fill="#dc2626" text-anchor="middle">-</text>

  <!-- User: 'rwx' at indices 1-3 -->
  <rect x="88" y="85" width="56" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="116" y="111" font-size="16" font-family="monospace" font-weight="bold" fill="#2563eb" text-anchor="middle">rwx</text>

  <!-- Group: 'r-x' at indices 4-6 -->
  <rect x="148" y="85" width="56" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="176" y="111" font-size="16" font-family="monospace" font-weight="bold" fill="#059669" text-anchor="middle">r-x</text>

  <!-- Others: 'r- -' at indices 7-9 -->
  <rect x="208" y="85" width="56" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="236" y="111" font-size="16" font-family="monospace" font-weight="bold" fill="#7c3aed" text-anchor="middle">r--</text>

  <!-- Remaining info string -->
  <text x="280" y="111" font-size="16" font-family="monospace" fill="#1f2933">1 user group 4096 Jan 15 10:30 file.txt</text>

  <!-- Connecting Lines & Annotation Boxes -->

  <!-- 1. Others (기타 사용자) -->
  <path d="M236,125 L236,180 L320,180" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="320" y="160" width="220" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="332" y="185" font-size="13" font-weight="bold" fill="#7c3aed">Others (기타 사용자)</text>

  <!-- 2. Group (그룹) -->
  <path d="M176,125 L176,230 L320,230" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="320" y="210" width="180" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="332" y="235" font-size="13" font-weight="bold" fill="#059669">Group (그룹)</text>

  <!-- 3. User (소유자) -->
  <path d="M116,125 L116,280 L320,280" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="320" y="260" width="180" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="332" y="285" font-size="13" font-weight="bold" fill="#2563eb">User (소유자)</text>

  <!-- 4. 파일 타입 (- 파일, d 디렉토리, l 링크) -->
  <path d="M72,125 L72,330 L320,330" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="320" y="310" width="420" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="332" y="335" font-size="13" font-weight="bold" fill="#dc2626">파일 타입 (- 파일, d 디렉토리, l 링크)</text>

</svg>