<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Linux 파일 권한 구조</title>
  <desc id="d">-rwxr-xr-- 1 user group 4096 Jan 15 10:30 file.txt 한 줄에서 앞 10자리를 확대해, 첫 자리는 파일 타입(- 파일, d 디렉터리, l 링크)이고 이어지는 세 자리씩이 User(소유자), Group(그룹), Others(기타 사용자)의 권한임을 보여줍니다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 원본 한 줄 -->
  <rect x="40" y="24" width="800" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="147" y="34" width="134" height="44" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="159" y="63" font-size="20" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan fill="#b45309">-</tspan><tspan fill="#1d4ed8">rwx</tspan><tspan fill="#047857">r-x</tspan><tspan fill="#6d28d9">r--</tspan></text>
  <text x="297" y="63" font-size="20" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">1 user group 4096 Jan 15 10:30 file.txt</text>

  <!-- 확대 안내선 -->
  <line x1="147" y1="78" x2="78" y2="124" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="281" y1="78" x2="802" y2="124" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 확대된 10자리 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="36" font-weight="bold" text-anchor="middle">
    <rect x="76" y="128" width="60" height="68" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
    <text x="106" y="174" fill="#b45309">-</text>

    <rect x="184" y="128" width="60" height="68" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <rect x="248" y="128" width="60" height="68" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <rect x="312" y="128" width="60" height="68" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
    <text x="214" y="174" fill="#1d4ed8">r</text>
    <text x="278" y="174" fill="#1d4ed8">w</text>
    <text x="342" y="174" fill="#1d4ed8">x</text>

    <rect x="400" y="128" width="60" height="68" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
    <rect x="464" y="128" width="60" height="68" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
    <rect x="528" y="128" width="60" height="68" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
    <text x="430" y="174" fill="#047857">r</text>
    <text x="494" y="174" fill="#047857">-</text>
    <text x="558" y="174" fill="#047857">x</text>

    <rect x="616" y="128" width="60" height="68" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
    <rect x="680" y="128" width="60" height="68" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
    <rect x="744" y="128" width="60" height="68" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
    <text x="646" y="174" fill="#6d28d9">r</text>
    <text x="710" y="174" fill="#6d28d9">-</text>
    <text x="774" y="174" fill="#6d28d9">-</text>
  </g>

  <!-- 묶음 괄호 -->
  <g fill="none" stroke-width="1.8">
    <path d="M76,206 v8 H136 v-8 M106,214 v18" stroke="#b45309"/>
    <path d="M184,206 v8 H372 v-8 M278,214 v18" stroke="#1d4ed8"/>
    <path d="M400,206 v8 H588 v-8 M494,214 v18" stroke="#047857"/>
    <path d="M616,206 v8 H804 v-8 M710,214 v18" stroke="#6d28d9"/>
  </g>

  <!-- 파일 타입 -->
  <rect x="36" y="236" width="140" height="124" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="106" y="264" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">파일 타입</text>
  <g font-size="16" fill="#1f2937">
    <text x="62" y="294" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">-</text>
    <text x="84" y="294">파일</text>
    <text x="62" y="319" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">d</text>
    <text x="84" y="319">디렉터리</text>
    <text x="62" y="344" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">l</text>
    <text x="84" y="344">링크</text>
  </g>

  <!-- User / Group / Others -->
  <rect x="196" y="236" width="164" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="278" y="264" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">User</text>
  <text x="278" y="290" font-size="16" fill="#1f2937" text-anchor="middle">소유자</text>

  <rect x="412" y="236" width="164" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="494" y="264" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">Group</text>
  <text x="494" y="290" font-size="16" fill="#1f2937" text-anchor="middle">그룹</text>

  <rect x="628" y="236" width="164" height="68" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="710" y="264" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">Others</text>
  <text x="710" y="290" font-size="16" fill="#1f2937" text-anchor="middle">기타 사용자</text>
</svg>
