<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">kube-proxy iptables와 IPVS 패킷 흐름</title>
  <desc id="d">Pod A에서 ClusterIP로 요청을 보내면 노드 커널의 kube-proxy 규칙을 통해 DNAT 처리되어 최종 Pod로 전송되는 과정을 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="720" fill="#ffffff"/>

  <!-- 1. Pod A 안의 애플리케이션 -->
  <rect x="250" y="30" width="380" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="61" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Pod A 안의 애플리케이션</text>

  <!-- 화살표 1 및 라벨 -->
  <path d="M440,80 L440,140" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="335" y="98" width="210" height="24" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="114" font-size="11.5" fill="#1f2933" text-anchor="middle">"http://user-service" 로 요청</text>

  <!-- 2. CoreDNS 조회 -->
  <rect x="230" y="140" width="420" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="171" font-size="14" fill="#1f2933" text-anchor="middle">CoreDNS 조회 → 10.96.0.42 (ClusterIP)</text>

  <!-- 화살표 2 및 라벨 -->
  <path d="M440,190 L440,260" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="315" y="213" width="250" height="24" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="229" font-size="11.5" fill="#1f2933" text-anchor="middle">패킷 전송 (목적지 10.96.0.42:80)</text>

  <!-- 3. 노드 커널 영역 -->
  <rect x="80" y="260" width="720" height="320" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="none"/>
  <text x="100" y="291" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="start">노드 커널</text>

  <!-- kube-proxy 심어 둔 규칙 내부 박스 -->
  <rect x="100" y="310" width="680" height="250" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  
  <text x="120" y="339" font-size="13" font-weight="bold" fill="#1f2933">kube-proxy가 심어 둔 규칙</text>
  <text x="120" y="374" font-size="13" fill="#1f2933">목적지 10.96.0.42:80 이면</text>

  <!-- 분기 규칙 목록 -->
  <text x="150" y="409" font-size="13" fill="#52606d">├─ 1/3 확률 → 10.244.1.7:8080  (Pod 1)</text>
  <text x="150" y="439" font-size="13" font-weight="bold" fill="#7c3aed">├─ 1/2 확률 → 10.244.2.3:8080  (Pod 2)</text>
  <text x="150" y="469" font-size="13" fill="#52606d">└─ 나머지   → 10.244.3.9:8080  (Pod 3)</text>

  <text x="120" y="524" font-size="13" fill="#1f2933">선택된 Pod IP로 목적지 주소를 바꿔서 전달(DNAT)</text>

  <!-- 화살표 3 (노드 커널 -> Pod 2) -->
  <path d="M440,580 L440,630" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- 4. Pod 2 -->
  <rect x="290" y="630" width="300" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="661" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">Pod 2 (10.244.2.3)</text>
</svg>