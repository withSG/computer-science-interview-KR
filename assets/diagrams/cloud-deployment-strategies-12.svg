<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">버전은 섞여도 DB는 한 벌</title>
  <desc id="d">배포 중에는 v1 인스턴스 두 대와 v2 인스턴스 두 대가 함께 떠 있지만 모두 하나의 DB를 쓴다. 그래서 스키마를 v1 기준으로 둘지 v2 기준으로 둘지가 문제가 된다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="310" fill="#ffffff"/>

  <!-- 애플리케이션 인스턴스 (배포 중 섞임) -->
  <rect x="32" y="32" width="476" height="88" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="48" y="50" width="96" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="96" y="83" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="164" y="50" width="96" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="212" y="83" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="280" y="50" width="96" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="328" y="83" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="396" y="50" width="96" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="444" y="83" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>

  <!-- 모두 같은 DB로 -->
  <line x1="96" y1="106" x2="204" y2="174" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="212" y1="106" x2="248" y2="174" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="328" y1="106" x2="292" y2="174" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="444" y1="106" x2="336" y2="174" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- DB 한 벌 -->
  <path d="M160,196 V268 A110,14 0 0 0 380,268 V196 Z" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <ellipse cx="270" cy="196" rx="110" ry="14" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="270" y="248" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>

  <!-- 설명 -->
  <line x1="514" y1="76" x2="538" y2="76" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="548" y="82" font-size="17" fill="#111827">애플리케이션은 배포 중 <tspan font-weight="bold">섞인다</tspan></text>

  <line x1="388" y1="216" x2="538" y2="216" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="548" y="222" font-size="17" fill="#111827">그런데 <tspan font-weight="bold">DB는 한 벌</tspan>이다</text>
  <rect x="540" y="240" width="316" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="698" y="268" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">스키마는 v1 기준일까 v2 기준일까?</text>
</svg>
