<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Loki — 라벨만 색인하고 본문은 압축해 던져둔다</title>
  <desc id="d">ELK와 Loki의 로그 처리 프로세스 및 저장 방식 비교 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ELK Section -->
  <rect x="24" y="24" width="832" height="136" rx="8" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="40" y="52" font-size="16" font-weight="bold" fill="#2563eb">ELK — 쓸 때 비싸고 읽을 때 싸다</text>

  <!-- ELK: 로그 -->
  <text x="64" y="105" font-size="13" font-weight="bold" fill="#1f2933">로그</text>
  <path d="M96,100 L126,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- ELK: [토큰화 + 역색인 생성] -->
  <rect x="136" y="76" width="180" height="48" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="226" y="105" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">토큰화 + 역색인 생성</text>
  <path d="M326,100 L356,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- ELK: 디스크(색인 + 원본) -->
  <rect x="366" y="76" width="168" height="48" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="105" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">디스크(색인 + 원본)</text>
  
  <!-- ELK: → 임의 단어도 즉시 -->
  <path d="M544,100 L574,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="584" y="105" font-size="13" fill="#52606d">임의 단어도 즉시</text>

  <!-- Loki Section -->
  <rect x="24" y="180" width="832" height="136" rx="8" fill="#f5f3ff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="40" y="208" font-size="16" font-weight="bold" fill="#7c3aed">Loki — 쓸 때 싸고 읽을 때 범위에 비례한다</text>

  <!-- Loki: 로그 -->
  <text x="64" y="261" font-size="13" font-weight="bold" fill="#1f2933">로그</text>
  <path d="M96,256 L126,256" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Loki: [라벨만 색인, 본문 압축] -->
  <rect x="136" y="232" width="180" height="48" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="226" y="261" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">라벨만 색인, 본문 압축</text>
  <path d="M326,256 L356,256" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Loki: 오브젝트 스토리지 -->
  <rect x="366" y="232" width="168" height="48" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="261" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">오브젝트 스토리지</text>

  <!-- Loki: → 라벨로 좁힌 뒤 병렬 스캔 -->
  <path d="M544,256 L574,256" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="584" y="261" font-size="13" fill="#52606d">라벨로 좁힌 뒤 병렬 스캔</text>
</svg>