<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ELK와 Loki의 색인 방식 비교</title>
  <desc id="d">ELK는 쓸 때 토큰화와 역색인 생성으로 비싸고 임의 단어도 즉시 찾는다. Loki는 라벨만 색인하고 본문을 압축해 오브젝트 스토리지에 두어 쓸 때 싸지만, 읽을 때는 라벨로 좁힌 뒤 병렬 스캔하므로 범위에 비례한다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- ===== ELK ===== -->
  <rect x="24" y="24" width="832" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="62" font-size="20" font-weight="bold" fill="#1d4ed8">ELK</text>

  <rect x="240" y="42" width="116" height="28" rx="14" fill="#fee2e2"/>
  <text x="298" y="61" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">쓸 때 비싸다</text>
  <rect x="673" y="42" width="116" height="28" rx="14" fill="#d1fae5"/>
  <text x="731" y="61" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">읽을 때 싸다</text>

  <line x1="590" y1="36" x2="590" y2="162" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 5"/>

  <rect x="44" y="88" width="64" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="76" y="119" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">로그</text>
  <line x1="110" y1="114" x2="136" y2="114" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="140" y="88" width="190" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="235" y="119" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">토큰화 + 역색인 생성</text>
  <line x1="332" y1="114" x2="358" y2="114" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="362" y="88" width="190" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="457" y="119" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">디스크(색인 + 원본)</text>
  <line x1="554" y1="114" x2="622" y2="114" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="626" y="88" width="210" height="52" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="731" y="119" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">임의 단어도 즉시</text>

  <!-- ===== Loki ===== -->
  <rect x="24" y="196" width="832" height="150" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="44" y="234" font-size="20" font-weight="bold" fill="#6d28d9">Loki</text>

  <rect x="248" y="214" width="100" height="28" rx="14" fill="#d1fae5"/>
  <text x="298" y="233" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">쓸 때 싸다</text>
  <rect x="629" y="214" width="204" height="28" rx="14" fill="#fef3c7"/>
  <text x="731" y="233" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">읽을 때 범위에 비례한다</text>

  <line x1="590" y1="208" x2="590" y2="334" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5 5"/>

  <rect x="44" y="260" width="64" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="76" y="291" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">로그</text>
  <line x1="110" y1="286" x2="136" y2="286" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <rect x="140" y="260" width="190" height="52" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="235" y="291" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">라벨만 색인, 본문 압축</text>
  <line x1="332" y1="286" x2="358" y2="286" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <rect x="362" y="260" width="190" height="52" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="457" y="291" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">오브젝트 스토리지</text>
  <line x1="554" y1="286" x2="622" y2="286" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <rect x="626" y="260" width="210" height="52" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="731" y="291" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">라벨로 좁힌 뒤 병렬 스캔</text>
</svg>
