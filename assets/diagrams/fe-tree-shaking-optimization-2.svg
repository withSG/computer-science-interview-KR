<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파일명 해싱과 캐싱</title>
  <desc id="d">해싱 없이 bundle.js로 배포하면 매번 서버에 최신 여부를 물어보거나 캐시를 길게 잡아 옛날 코드를 쓰는 사고가 난다. contenthash로 배포하면 2차 배포에서 내용이 그대로인 vendor.a1b2c3.js는 이름이 같아 캐시에서 재사용하고, 바뀐 app 파일만 app.4c5d6e.js로 이름이 바뀌어 새로 내려받는다. HTML은 캐시하지 않고 해시가 붙은 정적 파일에만 1년짜리 immutable 캐시를 건다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- ── 해싱 없이 ── -->
  <rect x="24" y="25" width="6" height="26" fill="#b91c1c"/>
  <text x="42" y="45" font-size="18" font-weight="700" fill="#111827">해싱 없이 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">bundle.js</tspan>로 배포</text>

  <rect x="40" y="66" width="800" height="44" rx="22" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="440" y="94" text-anchor="middle" font-size="16" fill="#111827"><tspan font-weight="700">브라우저:</tspan> "<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">bundle.js</tspan> 캐시에 있는데 최신인가?"</text>

  <line x1="210" y1="114" x2="210" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="625" y1="114" x2="625" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="40" y="142" width="340" height="68" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="210" y="182" text-anchor="middle" font-size="16" fill="#111827">매번 서버에 물어봐야 한다</text>

  <rect x="410" y="142" width="430" height="68" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="625" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">캐시 기간을 길게 잡으면</text>
  <text x="625" y="194" text-anchor="middle" font-size="15" fill="#111827">배포해도 사용자가 옛날 코드를 계속 쓰는 사고가 난다</text>

  <!-- ── contenthash로 배포 ── -->
  <rect x="24" y="245" width="6" height="26" fill="#047857"/>
  <text x="42" y="265" font-size="18" font-weight="700" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">contenthash</tspan>로 배포</text>

  <text x="40" y="310" font-size="16" font-weight="700" fill="#111827">1차 배포</text>
  <text x="40" y="360" font-size="16" font-weight="700" fill="#111827">2차 배포</text>
  <text x="40" y="382" font-size="15" fill="#4b5563">(내 코드만 수정)</text>

  <g font-size="16" text-anchor="middle" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <rect x="320" y="286" width="230" height="36" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="435" y="310">vendor.<tspan font-weight="700" fill="#047857">a1b2c3</tspan>.js</text>
    <rect x="590" y="286" width="230" height="36" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="705" y="310">app.<tspan font-weight="700" fill="#4b5563">9f8e7d</tspan>.js</text>

    <rect x="320" y="348" width="230" height="36" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="435" y="372">vendor.<tspan font-weight="700" fill="#047857">a1b2c3</tspan>.js</text>
    <rect x="590" y="348" width="230" height="36" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="705" y="372">app.<tspan font-weight="700" fill="#b45309">4c5d6e</tspan>.js</text>
  </g>

  <text x="435" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">▲ 이름이 같다</text>
  <text x="435" y="438" text-anchor="middle" font-size="15" fill="#047857">= 캐시에서 재사용</text>
  <text x="705" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">▲ 이름이 바뀌었다</text>
  <text x="705" y="438" text-anchor="middle" font-size="15" fill="#b45309">= 새로 내려받는다</text>

  <!-- ── 캐시 정책 ── -->
  <rect x="40" y="470" width="260" height="106" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="170" y="512" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">HTML</text>
  <text x="170" y="542" text-anchor="middle" font-size="16" fill="#111827">캐시하지 않는다</text>

  <rect x="320" y="470" width="520" height="106" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="580" y="500" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">해시가 붙은 정적 파일에만</text>
  <text x="580" y="528" text-anchor="middle" font-size="15" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Cache-Control: public, max-age=31536000, immutable</text>
  <text x="580" y="556" text-anchor="middle" font-size="15" fill="#111827">→ 1년간 재검증 없이 쓰게 한다</text>
</svg>
