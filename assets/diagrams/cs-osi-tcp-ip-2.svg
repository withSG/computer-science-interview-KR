<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OSI와 TCP/IP 계층 대응</title>
  <desc id="d">OSI 7계층 중 5·6·7은 TCP/IP의 응용, 4는 전송, 3은 인터넷, 1·2는 네트워크 접근 계층에 대응하며, 계층마다 대표 프로토콜과 QUIC·ARP 분류에 대한 각주를 함께 보여 줍니다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <g font-size="16" font-weight="700" fill="#374151">
    <text x="40" y="44">OSI 7계층</text>
    <text x="406" y="44" text-anchor="middle">TCP/IP 4계층</text>
    <text x="548" y="44">대표 프로토콜</text>
  </g>

  <!-- OSI 7계층 (왼쪽) -->
  <rect x="24" y="62" width="180" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="24" y="114" width="180" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="24" y="166" width="180" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="24" y="218" width="180" height="46" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="24" y="270" width="180" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="24" y="322" width="180" height="46" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="24" y="374" width="180" height="46" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <g font-size="16" fill="#111827">
    <text x="40" y="91"><tspan font-weight="700">7</tspan><tspan dx="8">응용</tspan></text>
    <text x="40" y="143"><tspan font-weight="700">6</tspan><tspan dx="8">표현</tspan></text>
    <text x="40" y="195"><tspan font-weight="700">5</tspan><tspan dx="8">세션</tspan></text>
    <text x="40" y="247"><tspan font-weight="700">4</tspan><tspan dx="8">전송</tspan></text>
    <text x="40" y="299"><tspan font-weight="700">3</tspan><tspan dx="8">네트워크</tspan></text>
    <text x="40" y="351"><tspan font-weight="700">2</tspan><tspan dx="8">데이터링크</tspan></text>
    <text x="40" y="403"><tspan font-weight="700">1</tspan><tspan dx="8">물리</tspan></text>
  </g>

  <!-- 대응 화살표 -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#ah)">
    <line x1="212" y1="85" x2="276" y2="85"/>
    <line x1="212" y1="137" x2="276" y2="137"/>
    <line x1="212" y1="189" x2="276" y2="189"/>
    <line x1="212" y1="241" x2="276" y2="241"/>
    <line x1="212" y1="293" x2="276" y2="293"/>
    <line x1="212" y1="345" x2="276" y2="345"/>
    <line x1="212" y1="397" x2="276" y2="397"/>
  </g>

  <!-- TCP/IP 4계층 (가운데) + 대표 프로토콜 (오른쪽) -->
  <rect x="284" y="62" width="572" height="150" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="284" y="218" width="572" height="46" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <rect x="284" y="270" width="572" height="46" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <rect x="284" y="322" width="572" height="98" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <g fill="#ffffff">
    <rect x="528" y="68" width="320" height="138" rx="6"/>
    <rect x="528" y="224" width="320" height="34" rx="6"/>
    <rect x="528" y="276" width="320" height="34" rx="6"/>
    <rect x="528" y="328" width="320" height="86" rx="6"/>
  </g>

  <g font-size="17" font-weight="700" text-anchor="middle">
    <text x="406" y="143" fill="#1e3a8a">응용(Application)</text>
    <text x="406" y="247" fill="#065f46">전송(Transport)</text>
    <text x="406" y="299" fill="#78350f">인터넷(Internet)</text>
    <text x="406" y="364" fill="#4c1d95">네트워크 접근</text>
  </g>
  <text x="406" y="388" font-size="15" text-anchor="middle" fill="#4c1d95">(Network Access)</text>

  <g font-size="16" fill="#111827">
    <text x="548" y="143">HTTP, DNS, SMTP, SSH, FTP</text>
    <text x="548" y="247">TCP, UDP, QUIC<tspan fill="#b91c1c" font-weight="700">*</tspan></text>
    <text x="548" y="299">IP, ICMP, IPsec, ARP<tspan fill="#b91c1c" font-weight="700">**</tspan></text>
    <text x="548" y="377">Ethernet, Wi-Fi(802.11), PPP</text>
  </g>

  <!-- 각주 -->
  <rect x="24" y="440" width="832" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="15" font-weight="700" fill="#b91c1c">
    <text x="40" y="467">*</text>
    <text x="40" y="495">**</text>
  </g>
  <g font-size="15" fill="#1f2937">
    <text x="68" y="467">QUIC은 UDP 위에서 동작하지만 전송 계층 기능(신뢰성·혼잡제어)을 직접 구현한다.</text>
    <text x="68" y="495">ARP는 IP 주소를 다루지만 IP 패킷 안에 담기지 않고 링크 프레임에 직접 실린다.</text>
    <text x="68" y="517">그래서 문헌에 따라 인터넷 계층으로도, 네트워크 접근 계층으로도 분류된다(RFC 1122는 후자).</text>
  </g>
</svg>
