<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OSI 7계층과 TCP/IP 4계층 매핑</title>
  <desc id="d">OSI 7계층 모델과 TCP/IP 4계층 모델 간의 매핑 관계 및 각 계층별 대표 프로토콜과 각주 설명 다이어그램입니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 헤더 영역 -->
  <text x="105" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">OSI 7계층</text>
  <text x="390" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">TCP/IP 4계층</text>
  <text x="690" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">대표 프로토콜</text>

  <!-- OSI 7계층 박스들 -->
  <!-- 7 응용 -->
  <rect x="30" y="60" width="150" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="105" y="82.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">7 응용</text>

  <!-- 6 표현 -->
  <rect x="30" y="96" width="150" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="105" y="118.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">6 표현</text>

  <!-- 5 세션 -->
  <rect x="30" y="132" width="150" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="105" y="154.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">5 세션</text>

  <!-- 4 전송 -->
  <rect x="30" y="178" width="150" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="105" y="200.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">4 전송</text>

  <!-- 3 네트워크 -->
  <rect x="30" y="224" width="150" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="105" y="246.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3 네트워크</text>

  <!-- 2 데이터링크 -->
  <rect x="30" y="270" width="150" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="105" y="292.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2 데이터링크</text>

  <!-- 1 물리 -->
  <rect x="30" y="306" width="150" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="105" y="328.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1 물리</text>


  <!-- TCP/IP 4계층 박스들 -->
  <!-- 응용(Application) -->
  <rect x="280" y="60" width="220" height="108" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="118.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">응용(Application)</text>

  <!-- 전송(Transport) -->
  <rect x="280" y="178" width="220" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="390" y="200.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">전송(Transport)</text>

  <!-- 인터넷(Internet) -->
  <rect x="280" y="224" width="220" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="390" y="246.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">인터넷(Internet)</text>

  <!-- 네트워크 접근 (Network Access) -->
  <rect x="280" y="270" width="220" height="72" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="390" y="300.1" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">네트워크 접근</text>
  <text x="390" y="318.1" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">(Network Access)</text>


  <!-- 대표 프로토콜 라벨 영역 -->
  <text x="530" y="118.6" font-size="13" fill="#1f2933">HTTP, DNS, SMTP, SSH, FTP</text>
  <text x="530" y="200.6" font-size="13" fill="#1f2933">TCP, UDP, QUIC*</text>
  <text x="530" y="246.6" font-size="13" fill="#1f2933">IP, ICMP, IPsec, ARP**</text>
  <text x="530" y="310.6" font-size="13" fill="#1f2933">Ethernet, Wi-Fi(802.11), PPP</text>


  <!-- 매핑 연결 선 및 화살표 -->
  <!-- 7-5 계층 묶음 -> 응용 -->
  <path d="M 180,78 L 220,78 L 220,114 L 278,114 M 220,114 L 220,150 L 180,150 M 180,114 L 220,114" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 4 계층 -> 전송 -->
  <path d="M 180,196 L 278,196" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 3 계층 -> 인터넷 -->
  <path d="M 180,242 L 278,242" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 2-1 계층 묶음 -> 네트워크 접근 -->
  <path d="M 180,288 L 220,288 L 220,306 L 278,306 M 220,306 L 220,324 L 180,324 M 180,306 L 220,306" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>


  <!-- 각주 영역 -->
  <line x1="30" y1="370" x2="850" y2="370" stroke="#cbd2d9" stroke-width="1"/>

  <text x="30" y="394" font-size="11.5" fill="#52606d">
    <tspan fill="#d97706" font-weight="bold">*</tspan>  QUIC은 UDP 위에서 동작하지만 전송 계층 기능(신뢰성·혼잡제어)을 직접 구현한다.
  </text>

  <text x="30" y="420" font-size="11.5" fill="#52606d">
    <tspan fill="#d97706" font-weight="bold">**</tspan> ARP는 IP 주소를 다루지만 IP 패킷 안에 담기지 않고 링크 프레임에 직접 실린다.
  </text>
  <text x="47" y="440" font-size="11.5" fill="#52606d">
    그래서 문헌에 따라 인터넷 계층으로도, 네트워크 접근 계층으로도 분류된다(RFC 1122는 후자).
  </text>
</svg>