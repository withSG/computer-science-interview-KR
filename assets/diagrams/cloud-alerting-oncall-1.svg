<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">오탐이 쌓이는 구조</title>
  <desc id="d">하루 알림 100건 중 95%의 오탐으로 인해 알림 무시 및 탐지 지연이 발생하는 구조를 나타낸 다이어그램</desc>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- Root: 하루 알림 100건 -->
  <rect x="40" y="30" width="800" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="400" y="61" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">하루 알림 100건</text>

  <!-- Tree Structure Lines -->
  <path d="M 80,78 L 80,120 L 100,120" stroke="#cbd2d9" stroke-width="2" fill="none"/>
  <path d="M 80,120 L 80,180 L 100,180" stroke="#cbd2d9" stroke-width="2" fill="none"/>

  <!-- Node 1: 실제 조치가 필요했던 것 5건 (5%) -->
  <rect x="100" y="96" width="740" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="120" y="127" fill="#1f2933" font-size="14" font-weight="bold">실제 조치가 필요했던 것</text>
  <text x="730" y="127" fill="#059669" font-size="14" font-weight="bold" text-anchor="end">5건</text>
  <text x="810" y="127" fill="#52606d" font-size="13" text-anchor="end">(5%)</text>

  <!-- Node 2: 확인했더니 아무 일 없었던 것 95건 (95%) -->
  <rect x="100" y="156" width="740" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="120" y="187" fill="#1f2933" font-size="14" font-weight="bold">확인했더니 아무 일 없었던 것</text>
  <text x="720" y="187" fill="#dc2626" font-size="14" font-weight="bold" text-anchor="end">95건</text>
  <text x="810" y="187" fill="#52606d" font-size="13" text-anchor="end">(95%)</text>

  <!-- Arrow Step 1 -->
  <path d="M 440,204 L 440,230" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- Result Step 1 -->
  <rect x="40" y="234" width="800" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="261" fill="#1f2933" font-size="13" text-anchor="middle">한 건 확인에 평균 5분이면 하루 8시간이 소모된다</text>

  <!-- Arrow Step 2 -->
  <path d="M 440,278 L 440,304" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- Result Step 2 -->
  <rect x="40" y="308" width="800" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="335" fill="#1f2933" font-size="13" text-anchor="middle">사람은 곧 학습한다: "어차피 95%는 아무것도 아니다"</text>

  <!-- Arrow Step 3 -->
  <path d="M 440,352 L 440,378" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- Result Step 3 -->
  <rect x="40" y="382" width="800" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="409" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">진짜 5건도 같은 속도로 무시되기 시작한다</text>
</svg>