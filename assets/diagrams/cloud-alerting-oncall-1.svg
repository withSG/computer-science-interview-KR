  <title id="t">오탐이 쌓이는 구조</title>
  <desc id="d">하루 알림 100건 중 실제 조치가 필요했던 것은 5건(5%)이고 95건(95%)은 아무 일 없었다. 확인에 하루 8시간이 들고, 사람은 95%가 아무것도 아니라고 학습해 진짜 5건도 무시하기 시작한다.</desc>
