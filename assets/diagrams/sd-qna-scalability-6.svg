<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Consistent Hashing</title>
  <desc id="d">리샤딩 시 최소한의 데이터만 이동하는 Consistent Hashing 개념도</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Top Title & Description Text -->
  <text x="440" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">리샤딩 시 최소한의 데이터만 이동</text>

  <text x="440" y="84" font-size="13" fill="#059669" text-anchor="middle">기존 해시: 서버 추가 시 전체 재배치</text>
  <text x="440" y="108" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Consistent Hash: 인접 노드에만 영향</text>

  <!-- Hash Ring Container Box -->
  <rect x="240" y="140" width="400" height="320" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="175" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Hash Ring</text>

  <!-- Connecting Lines between Nodes A, B, C -->
  <!-- A to B (Horizontal) -->
  <path d="M370,230 L510,230" stroke="#2563eb" stroke-width="2" fill="none"/>
  
  <!-- A to C (Diagonal) -->
  <path d="M340,260 L415,370" stroke="#2563eb" stroke-width="2" fill="none"/>
  
  <!-- B to C (Diagonal) -->
  <path d="M540,260 L465,370" stroke="#2563eb" stroke-width="2" fill="none"/>

  <!-- Node A -->
  <rect x="310" y="200" width="60" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="235" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>

  <!-- Node B -->
  <rect x="510" y="200" width="60" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="235" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">B</text>

  <!-- Node C -->
  <rect x="410" y="370" width="60" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="405" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">C</text>
</svg>