<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Expand and Contract 패턴</title>
  <desc id="d">DB 스키마 변경이 있을 때의 무중단 배포 순서: ① 새 컬럼 추가 → ② 코드 배포 → ③ 구 컬럼 제거. 단계마다 테이블 컬럼 상태를 함께 보여준다.</desc>
  <rect width="880" height="310" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="440" y="42" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Expand and Contract 패턴</text>
  <text x="440" y="70" font-size="15" fill="#4b5563" text-anchor="middle">DB 스키마 변경이 있을 때의 무중단 배포</text>

  <!-- 단계 태그 -->
  <rect x="100" y="92" width="100" height="28" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="150" y="111" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Expand</text>
  <rect x="676" y="92" width="108" height="28" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="730" y="111" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">Contract</text>

  <!-- ① 새 컬럼 추가 -->
  <rect x="40" y="130" width="220" height="152" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <circle cx="72" cy="166" r="15" fill="#111827"/>
  <text x="72" y="171" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="98" y="172" font-size="18" font-weight="bold" fill="#111827">새 컬럼 추가</text>
  <line x1="56" y1="196" x2="244" y2="196" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="222" font-size="14" fill="#4b5563">테이블 컬럼</text>
  <rect x="58" y="236" width="88" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="102" y="256" font-size="15" fill="#111827" text-anchor="middle">구 컬럼</text>
  <rect x="154" y="236" width="88" height="30" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="198" y="256" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">+ 새 컬럼</text>

  <line x1="266" y1="206" x2="322" y2="206" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- ② 코드 배포 -->
  <rect x="330" y="130" width="220" height="152" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <circle cx="362" cy="166" r="15" fill="#111827"/>
  <text x="362" y="171" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="388" y="172" font-size="18" font-weight="bold" fill="#111827">코드 배포</text>
  <line x1="346" y1="196" x2="534" y2="196" stroke="#e5e7eb" stroke-width="1"/>
  <text x="348" y="222" font-size="14" fill="#4b5563">테이블 컬럼</text>
  <rect x="348" y="236" width="88" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="392" y="256" font-size="15" fill="#111827" text-anchor="middle">구 컬럼</text>
  <rect x="444" y="236" width="88" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="488" y="256" font-size="15" fill="#111827" text-anchor="middle">새 컬럼</text>

  <line x1="556" y1="206" x2="612" y2="206" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- ③ 구 컬럼 제거 -->
  <rect x="620" y="130" width="220" height="152" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="652" cy="166" r="15" fill="#111827"/>
  <text x="652" y="171" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="678" y="172" font-size="18" font-weight="bold" fill="#111827">구 컬럼 제거</text>
  <line x1="636" y1="196" x2="824" y2="196" stroke="#e5e7eb" stroke-width="1"/>
  <text x="638" y="222" font-size="14" fill="#4b5563">테이블 컬럼</text>
  <rect x="638" y="236" width="88" height="30" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="682" y="256" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">− 구 컬럼</text>
  <rect x="734" y="236" width="88" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="778" y="256" font-size="15" fill="#111827" text-anchor="middle">새 컬럼</text>
</svg>
