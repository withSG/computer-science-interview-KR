<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">분할 시 CP와 AP 선택</title>
  <desc id="d">분할이 발생했을 때 CP 선택은 소수파가 응답을 거부해 그 지역 사용자는 서비스를 못 쓰지만 틀린 값은 나오지 않고(잔액, 재고, 좌석, 분산 락, 리더 선출), AP 선택은 소수파도 계속 응답해 서비스는 계속되지만 잠깐 낡거나 충돌한 값이 보인다(장바구니, 타임라인, 추천, 좋아요 수, 조회수).</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 뿌리: 분할 발생 -->
  <rect x="360" y="24" width="160" height="46" rx="8" fill="#1f2937"/>
  <text x="440" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">분할 발생</text>
  <path d="M440,70 V92 H226 V114" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <path d="M440,92 H654 V114" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- ===== CP 선택 ===== -->
  <rect x="24" y="120" width="404" height="336" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M25,130 A9,9 0 0 1 34,121 H418 A9,9 0 0 1 427,130 V196 H25 Z" fill="#dbeafe"/>
  <text x="226" y="153" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">CP 선택</text>
  <text x="226" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">소수파는 응답을 거부한다</text>

  <rect x="44" y="214" width="4" height="32" fill="#1d4ed8"/>
  <text x="60" y="236" font-size="16" fill="#374151">"지금 최신인지 확신할 수 없으니 답하지 않겠다"</text>

  <line x1="44" y1="264" x2="408" y2="264" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="294" font-size="16" fill="#374151">그 지역 사용자는 서비스를 못 쓴다</text>
  <text x="44" y="322" font-size="16" font-weight="bold" fill="#1d4ed8">대신 틀린 값은 절대 안 나온다</text>

  <line x1="44" y1="344" x2="408" y2="344" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="380" font-size="15" fill="#4b5563">예</text>
  <rect x="72" y="358" width="54" height="32" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="99" y="380" text-anchor="middle" font-size="15" fill="#1e3a8a">잔액</text>
  <rect x="134" y="358" width="54" height="32" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="161" y="380" text-anchor="middle" font-size="15" fill="#1e3a8a">재고</text>
  <rect x="196" y="358" width="54" height="32" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="223" y="380" text-anchor="middle" font-size="15" fill="#1e3a8a">좌석</text>
  <rect x="72" y="400" width="76" height="32" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="110" y="422" text-anchor="middle" font-size="15" fill="#1e3a8a">분산 락</text>
  <rect x="156" y="400" width="92" height="32" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="202" y="422" text-anchor="middle" font-size="15" fill="#1e3a8a">리더 선출</text>

  <!-- ===== AP 선택 ===== -->
  <rect x="452" y="120" width="404" height="336" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <path d="M453,130 A9,9 0 0 1 462,121 H846 A9,9 0 0 1 855,130 V196 H453 Z" fill="#ede9fe"/>
  <text x="654" y="153" text-anchor="middle" font-size="22" font-weight="bold" fill="#6d28d9">AP 선택</text>
  <text x="654" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">소수파도 계속 응답한다</text>

  <rect x="472" y="214" width="4" height="32" fill="#6d28d9"/>
  <text x="488" y="236" font-size="16" fill="#374151">"지금 아는 값으로 답하고, 나중에 합치겠다"</text>

  <line x1="472" y1="264" x2="836" y2="264" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="472" y="294" font-size="16" fill="#374151">서비스는 계속된다</text>
  <text x="472" y="322" font-size="16" font-weight="bold" fill="#6d28d9">대신 잠깐 낡거나 충돌한 값이 보인다</text>

  <line x1="472" y1="344" x2="836" y2="344" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="472" y="380" font-size="15" fill="#4b5563">예</text>
  <rect x="500" y="358" width="84" height="32" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="542" y="380" text-anchor="middle" font-size="15" fill="#4c1d95">장바구니</text>
  <rect x="592" y="358" width="84" height="32" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="634" y="380" text-anchor="middle" font-size="15" fill="#4c1d95">타임라인</text>
  <rect x="684" y="358" width="54" height="32" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="711" y="380" text-anchor="middle" font-size="15" fill="#4c1d95">추천</text>
  <rect x="500" y="400" width="90" height="32" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="545" y="422" text-anchor="middle" font-size="15" fill="#4c1d95">좋아요 수</text>
  <rect x="598" y="400" width="70" height="32" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="633" y="422" text-anchor="middle" font-size="15" fill="#4c1d95">조회수</text>
</svg>
