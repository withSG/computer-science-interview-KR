<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Saga 코레오그래피 방식의 이벤트 흐름과 장단점</title>
  <desc id="d">중앙 조정자 없이 주문·결제·재고 서비스가 OrderCreated, PaymentApproved 이벤트로 정상 흐름을 잇고, 재고 실패 시 StockFailed, PaymentCanceled 이벤트로 거꾸로 보상한다. 아래에 장점과 단점을 정리했다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 요점 캡션 -->
  <text x="40" y="44" font-size="16" fill="#374151"><tspan font-weight="bold" fill="#111827">중앙 조정자 없이</tspan> 각 서비스가 이벤트를 발행하고 구독한다</text>

  <!-- 서비스 3개 -->
  <rect x="40" y="72" width="140" height="160" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="110" y="158" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">주문 서비스</text>
  <rect x="370" y="72" width="140" height="160" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="158" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">결제 서비스</text>
  <rect x="700" y="72" width="140" height="160" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="770" y="158" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">재고 서비스</text>

  <!-- 정상 흐름 (위 차선, 왼→오른) -->
  <line x1="182" y1="114" x2="366" y2="114" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="275" y="102" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle"><tspan>① </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderCreated</tspan></text>
  <line x1="512" y1="114" x2="696" y2="114" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="605" y="102" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle"><tspan>② </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">PaymentApproved</tspan></text>

  <!-- 보상 흐름 (아래 차선, 오른→왼) -->
  <line x1="698" y1="190" x2="514" y2="190" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
  <text x="605" y="216" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle"><tspan>③ </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">StockFailed</tspan></text>
  <line x1="368" y1="190" x2="184" y2="190" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
  <text x="275" y="216" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle"><tspan>④ </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">PaymentCanceled</tspan></text>

  <!-- 범례 -->
  <line x1="40" y1="264" x2="80" y2="264" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="90" y="269" font-size="15" fill="#374151">정상 흐름</text>
  <line x1="190" y1="264" x2="230" y2="264" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
  <text x="240" y="269" font-size="15" fill="#374151">실패 시 보상 (반대 방향)</text>

  <!-- 장단점 표 -->
  <rect x="40" y="296" width="100" height="50" fill="#ecfdf5"/>
  <rect x="40" y="346" width="100" height="84" fill="#fef2f2"/>
  <rect x="40" y="296" width="800" height="134" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <line x1="40" y1="346" x2="840" y2="346" stroke="#9ca3af" stroke-width="1"/>
  <line x1="140" y1="296" x2="140" y2="430" stroke="#9ca3af" stroke-width="1"/>

  <text x="90" y="327" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">장점</text>
  <text x="160" y="327" font-size="16" fill="#111827">중앙 의존이 없고 서비스 추가가 쉽다</text>

  <text x="90" y="394" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">단점</text>
  <text x="160" y="377" font-size="16" fill="#111827">• <tspan font-weight="bold">전체 흐름이 어디에도 안 적혀 있다.</tspan> 흐름을 알려면 서비스를 다 뒤져야 한다</text>
  <text x="160" y="409" font-size="16" fill="#111827">• 서비스가 늘어나면 이벤트 관계가 순환하기 쉽다</text>
</svg>
