<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">두 가지 구현 방식 - 코레오그래피</title>
  <desc id="d">중앙 조정자 없이 이벤트로 소통하는 코레오그래피 방식의 Saga 패턴 및 장단점 설명 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <!-- Arrow heads -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Service Boxes Top Row -->
  <!-- 주문 서비스 -->
  <rect x="40" y="40" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="70" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">주문 서비스</text>

  <!-- 결제 서비스 -->
  <rect x="370" y="40" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="70" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">결제 서비스</text>

  <!-- 재고 서비스 -->
  <rect x="700" y="40" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="770" y="70" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">재고 서비스</text>

  <!-- Top Arrows & Event Labels (Forward / Success Flow) -->
  <!-- Arrow 1: 주문 서비스 -> 결제 서비스 -->
  <path d="M180,65 L370,65" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="212" y="53" width="126" height="22" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="275" y="68.2" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">[OrderCreated]</text>

  <!-- Arrow 2: 결제 서비스 -> 재고 서비스 -->
  <path d="M510,65 L700,65" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="532" y="53" width="146" height="22" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="605" y="68.2" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">[PaymentApproved]</text>

  <!-- Bottom Arrows & Event Labels (Compensation / Failure Flow) -->
  <!-- Line down from 재고 서비스 to bottom path -->
  <path d="M770,90 L770,165 L510,165" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="587" y="153" width="116" height="22" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="645" y="168.2" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">[StockFailed]</text>

  <!-- Arrow 4: 결제 서비스 -> 주문 서비스 -->
  <path d="M370,165 L180,165" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="210" y="153" width="130" height="22" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="275" y="168.2" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">[PaymentCanceled]</text>

  <!-- Bottom Boxed Area for Pros & Cons (장점/단점) -->
  <rect x="40" y="225" width="800" height="165" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Pros (장점) -->
  <rect x="60" y="245" width="48" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="84" y="262" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">장점</text>
  <text x="116" y="262" font-size="13" font-weight="bold" fill="#1f2933">:</text>
  <text x="126" y="262" font-size="13" fill="#1f2933">중앙 의존이 없고 서비스 추가가 쉽다</text>

  <!-- Cons (단점) -->
  <rect x="60" y="290" width="48" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="84" y="307" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">단점</text>
  <text x="116" y="307" font-size="13" font-weight="bold" fill="#1f2933">:</text>
  <text x="126" y="307" font-size="13" fill="#1f2933">전체 흐름이 어디에도 안 적혀 있다. 흐름을 알려면 서비스를 다 뒤져야 한다</text>
  <text x="126" y="342" font-size="13" fill="#1f2933">서비스가 늘어나면 이벤트 관계가 순환하기 쉽다</text>

</svg>