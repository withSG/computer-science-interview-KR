<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">CRP 다섯 단계</title>
  <desc id="d">HTML과 CSS 바이트부터 파싱, DOM/CSSOM 트리 생성, 렌더 트리, Layout, Paint, Composite까지 진행되는 Critical Rendering Path 과정 다이어그램</desc>
  <rect width="880" height="720" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- HTML Branch (Left) -->
  <text x="240" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">HTML 바이트</text>
  <path d="M240,55 L240,80" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="175" y="80" width="130" height="44" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">파싱</text>
  <path d="M240,124 L240,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="160" y="150" width="160" height="54" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">DOM</text>
  <text x="240" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">트리</text>

  <!-- CSS Branch (Right) -->
  <text x="640" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">CSS 바이트</text>
  <path d="M640,55 L640,80" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="575" y="80" width="130" height="44" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">파싱</text>
  <path d="M640,124 L640,150" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="560" y="150" width="160" height="54" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">CSSOM</text>
  <text x="640" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">트리</text>

  <!-- Merge Paths to Render Tree -->
  <path d="M240,204 L240,240 L440,240 L440,260" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M640,204 L640,240 L440,240" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <!-- Step 3: Render Tree -->
  <rect x="320" y="260" width="240" height="48" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">렌더 트리</text>
  <text x="575" y="289" text-anchor="start" font-size="11.5" fill="#52606d">보이는 노드 + 계산된 스타일</text>
  <path d="M440,308 L440,360" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Step 4: Layout -->
  <rect x="310" y="360" width="260" height="48" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="389" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">Layout(리플로우)</text>
  <text x="585" y="389" text-anchor="start" font-size="11.5" fill="#52606d">각 박스의 위치·크기 (px)</text>
  <path d="M440,408 L440,460" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- Step 5: Paint -->
  <rect x="320" y="460" width="240" height="48" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="489" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">Paint</text>
  <text x="575" y="489" text-anchor="start" font-size="11.5" fill="#52606d">"여기에 이 색으로 사각형" 그리기 명령</text>
  <path d="M440,508 L440,560" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 6: Composite -->
  <rect x="320" y="560" width="240" height="48" rx="4" fill="#f8fafc" stroke="#1f2933" stroke-width="1.5"/>
  <text x="440" y="589" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">Composite</text>
  <text x="575" y="589" text-anchor="start" font-size="11.5" fill="#52606d">레이어를 순서대로 겹쳐 화면 출력</text>
</svg>