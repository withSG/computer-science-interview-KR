<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">free 출력의 메모리 구성</title>
  <desc id="d">total 15Gi 가운데 used 11Gi, buff/cache 4.1Gi, free 0.4Gi를 크기 비율대로 그린 막대. free는 아주 작지만 캐시는 필요하면 즉시 회수되므로, 판단은 free와 회수 가능한 캐시를 합한 available 3.4Gi로 한다.</desc>
  <rect width="880" height="290" fill="#ffffff"/>

  <!-- total 브래킷 -->
  <path d="M40,66 V54 H328" fill="none" stroke="#374151" stroke-width="1.5"/>
  <path d="M452,54 H740 V66" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="390" y="60" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">total</tspan> 15Gi</text>

  <!-- 막대: 크기 비율대로 (1Gi ≈ 45px) -->
  <rect x="40" y="78" width="497" height="90" fill="#dbeafe"/>
  <rect x="537" y="78" width="185" height="90" fill="#fef3c7"/>
  <rect x="722" y="78" width="18" height="90" fill="#10b981"/>
  <line x1="537" y1="78" x2="537" y2="168" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="722" y1="78" x2="722" y2="168" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="40" y="78" width="700" height="90" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="288" y="117" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">used</tspan> 11Gi</text>
  <text x="288" y="146" text-anchor="middle" font-size="16" fill="#1e3a8a">(애플리케이션)</text>

  <text x="629" y="117" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350f"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">buff/cache</tspan> 4.1Gi</text>
  <text x="629" y="146" text-anchor="middle" font-size="15" fill="#78350f">필요하면 즉시 회수된다</text>

  <!-- free: 막대 오른쪽 끝의 얇은 조각 -->
  <text x="752" y="129" font-size="18" font-weight="bold" fill="#047857"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">free</tspan> 0.4Gi</text>

  <!-- available 브래킷: free + 회수 가능한 캐시 -->
  <path d="M586,178 V190 H740 V178" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <line x1="663" y1="190" x2="663" y2="200" stroke="#6d28d9" stroke-width="2"/>
  <text x="663" y="224" text-anchor="middle" font-size="19" font-weight="bold" fill="#6d28d9"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">available</tspan> 3.4Gi</text>
  <text x="663" y="250" text-anchor="middle" font-size="16" fill="#6d28d9">= <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">free</tspan> + 회수 가능한 캐시</text>

  <!-- 판단 기준 -->
  <rect x="40" y="200" width="420" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="58" y="227" font-size="16" font-weight="bold" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">free</tspan>가 작다고 메모리 부족이 아니다</text>
  <text x="58" y="251" font-size="16" fill="#111827">판단은 <tspan font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">available</tspan>로 한다</text>
</svg>
