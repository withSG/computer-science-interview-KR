<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">외부 API 호출과 커넥션 점유 시간</title>
  <desc id="d">트랜잭션 없이 호출하면 커넥션은 DB 작업 동안만 점유된다. 트랜잭션 안에서 외부 API를 호출하면 DB 작업에 외부 API 10초가 더해져, 커넥션과 락을 10초 동안 붙잡고 있다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 1행: 트랜잭션 없이 -->
  <text x="24" y="52" font-size="18" font-weight="bold" fill="#047857">트랜잭션 없이</text>
  <text x="24" y="76" font-size="15" fill="#4b5563">커넥션 점유</text>
  <rect x="220" y="34" width="130" height="44" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="285" y="62" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">DB 작업</text>

  <!-- 같은 시점 기준선 -->
  <line x1="350" y1="82" x2="350" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 2행: 트랜잭션 안에서 -->
  <text x="24" y="162" font-size="18" font-weight="bold" fill="#b91c1c">트랜잭션 안에서</text>
  <text x="24" y="186" font-size="15" fill="#4b5563">커넥션 점유</text>
  <rect x="220" y="144" width="130" height="44" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="285" y="172" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">DB 작업</text>
  <rect x="350" y="144" width="490" height="44" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="595" y="172" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">외부 API 10초</text>

  <!-- 강조 괄호 -->
  <path d="M352,200 V210 H838 V200" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <line x1="595" y1="210" x2="595" y2="220" stroke="#b91c1c" stroke-width="2"/>
  <text x="595" y="244" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">커넥션과 락을 10초 동안 붙잡고 있다</text>

  <!-- 시간축 -->
  <line x1="220" y1="272" x2="846" y2="272" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="846" y="296" font-size="15" fill="#4b5563" text-anchor="end">시간</text>
</svg>
