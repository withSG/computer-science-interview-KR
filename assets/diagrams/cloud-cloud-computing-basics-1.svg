<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">고정 용량과 실제 트래픽</title>
  <desc id="d">구매한 서버 용량은 고정인데 실제 트래픽은 출렁인다. 평소에는 용량 아래 빈 공간이 돈 내고 놀리는 자원이 되고, 이벤트나 입소문으로 트래픽이 튀면 구매 용량을 넘어 장애가 난다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- 돈 내고 놀리는 자원 (용량선 아래, 트래픽 위) -->
  <polygon points="82,180 382.1,180 320,320 220,320 220,288 150,288 150,320 82,320" fill="#fef3c7"/>
  <polygon points="477.9,180 820,180 820,320 680,320 680,292 610,292 610,320 540,320" fill="#fef3c7"/>
  <!-- 구매 용량을 넘은 구간 -->
  <polygon points="382.1,180 430,72 477.9,180" fill="#fecaca"/>

  <!-- 구매한 서버 용량 (고정) -->
  <line x1="80" y1="180" x2="820" y2="180" stroke="#1d4ed8" stroke-width="3.5"/>
  <!-- 실제 트래픽 -->
  <polyline points="82,320 150,320 150,288 220,288 220,320 320,320 430,72 540,320 610,320 610,292 680,292 680,320 820,320" fill="none" stroke="#047857" stroke-width="3" stroke-linejoin="round"/>

  <!-- 축 -->
  <line x1="80" y1="400" x2="80" y2="58" stroke="#111827" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="80" y1="400" x2="838" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#ax)"/>
  <text x="80" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">용량</text>
  <text x="838" y="428" text-anchor="end" font-size="16" font-weight="bold" fill="#111827">시간</text>

  <!-- 선 라벨 -->
  <text x="820" y="166" text-anchor="end" font-size="16" font-weight="bold" fill="#1d4ed8">구매한 서버 용량 (고정)</text>
  <text x="820" y="348" text-anchor="end" font-size="16" font-weight="bold" fill="#047857">실제 트래픽</text>

  <!-- 영역 라벨 -->
  <text x="216" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">돈 내고 놀리는 자원</text>
  <text x="664" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">돈 내고 놀리는 자원</text>

  <!-- 급증 -->
  <text x="452" y="82" font-size="16" font-weight="bold" fill="#b91c1c">이벤트/입소문: 구매 용량 초과 → 장애</text>
</svg>
