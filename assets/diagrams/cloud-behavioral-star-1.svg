<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">경험 B — 정산 배치 마이그레이션 (2025.03 ~ 2025.05)</title>
  <desc id="d">경험 B 정산 배치 마이그레이션 프로젝트의 STAR 기법 기반 정리 항목 다이어그램</desc>
  <rect width="880" height="580" fill="#ffffff"/>

  <!-- 메인 헤더 / 제목 영역 -->
  <rect x="30" y="30" width="820" height="50" rx="8" fill="#1f2933"/>
  <text x="50" y="61.5" font-size="16" font-weight="bold" fill="#ffffff">경험 B — 정산 배치 마이그레이션 (2025.03 ~ 2025.05)</text>

  <!-- STAR 기본 항목 카드 (S, T, A, R) -->
  
  <!-- Situation (상황) -->
  <g>
    <rect x="30" y="100" width="400" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="30" y="100" width="130" height="28" rx="6" fill="#2563eb"/>
    <!-- 사각 모서리 보정 -->
    <rect x="30" y="120" width="130" height="8" fill="#2563eb"/>
    <rect x="150" y="100" width="10" height="28" fill="#2563eb"/>
    <text x="95" y="118.25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">상황(S)</text>
    <text x="50" y="152.25" font-size="13" font-weight="bold" fill="#1f2933">•</text>
    <text x="65" y="152.25" font-size="13" fill="#1f2933">배치 4시간, 실패 시 재실행 불가, 정산 마감 압박</text>
  </g>

  <!-- Task (내 역할) -->
  <g>
    <rect x="450" y="100" width="400" height="90" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="450" y="100" width="130" height="28" rx="6" fill="#7c3aed"/>
    <rect x="450" y="120" width="130" height="8" fill="#7c3aed"/>
    <rect x="570" y="100" width="10" height="28" fill="#7c3aed"/>
    <text x="515" y="118.25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">내 역할(T)</text>
    <text x="470" y="152.25" font-size="13" font-weight="bold" fill="#1f2933">•</text>
    <text x="485" y="152.25" font-size="13" fill="#1f2933">설계·구현·전환 담당 (팀 3명 중 이 영역 단독)</text>
  </g>

  <!-- Action (핵심 판단) -->
  <g>
    <rect x="30" y="205" width="820" height="135" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="30" y="205" width="140" height="28" rx="6" fill="#d97706"/>
    <rect x="30" y="225" width="140" height="8" fill="#d97706"/>
    <rect x="160" y="205" width="10" height="28" fill="#d97706"/>
    <text x="100" y="223.25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">핵심 판단(A)</text>
    
    <text x="50" y="257.25" font-size="13" font-weight="bold" fill="#d97706">•</text>
    <text x="65" y="257.25" font-size="13" fill="#1f2933">① 전면 교체 대신 이중 실행 후 비교</text>
    
    <text x="50" y="282.25" font-size="13" font-weight="bold" fill="#d97706">•</text>
    <text x="65" y="282.25" font-size="13" fill="#1f2933">② 실데이터 복사본으로 검증</text>
    
    <text x="50" y="307.25" font-size="13" font-weight="bold" fill="#d97706">•</text>
    <text x="65" y="307.25" font-size="13" fill="#1f2933">③ 롤백 경로를 먼저 확보하고 전환</text>
  </g>

  <!-- Result (결과) -->
  <g>
    <rect x="30" y="355" width="820" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="30" y="355" width="130" height="28" rx="6" fill="#059669"/>
    <rect x="30" y="375" width="130" height="8" fill="#059669"/>
    <rect x="150" y="355" width="10" height="28" fill="#059669"/>
    <text x="95" y="373.25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">결과(R)</text>
    <text x="50" y="397.25" font-size="13" font-weight="bold" fill="#059669">•</text>
    <text x="65" y="397.25" font-size="13" fill="#1f2933">4시간 → 55분 / 전환 후 6개월 무장애 / shadow run 절차화</text>
  </g>

  <!-- 추가 분석 항목 (실패·아쉬움, 대응 질문, 꼬리 질문) -->

  <!-- 실패·아쉬움 -->
  <g>
    <rect x="30" y="430" width="820" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="45" y="454.5" font-size="13" font-weight="bold" fill="#dc2626">실패·아쉬움:</text>
    <text x="135" y="454.5" font-size="13" fill="#1f2933">초기에 스테이징 데이터만 믿어 3일치 누락 발생</text>
  </g>

  <!-- 대응 가능한 질문 유형 -->
  <g>
    <rect x="30" y="480" width="395" height="70" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="45" y="504.5" font-size="13" font-weight="bold" fill="#52606d">대응 가능한 질문 유형:</text>
    <rect x="185" y="489" width="42" height="22" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="206" y="504.25" font-size="11.5" fill="#2563eb" text-anchor="middle">갈등</text>
    <rect x="233" y="489" width="42" height="22" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="254" y="504.25" font-size="11.5" fill="#dc2626" text-anchor="middle">실패</text>
    <rect x="281" y="489" width="42" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="302" y="504.25" font-size="11.5" fill="#059669" text-anchor="middle">학습</text>
  </g>

  <!-- 예상 꼬리 질문 -->
  <g>
    <rect x="445" y="480" width="405" height="70" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="460" y="504.5" font-size="13" font-weight="bold" fill="#52606d">예상 꼬리 질문:</text>
    <text x="460" y="530.5" font-size="13" fill="#1f2933">"왜 이중 실행을 택했나" / "롤백 판단 기준은"</text>
  </g>

</svg>