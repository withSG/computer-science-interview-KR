<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">경험 하나당 정리 항목 예시: 정산 배치 마이그레이션</title>
  <desc id="d">경험 B(정산 배치 마이그레이션, 2025.03 ~ 2025.05)를 상황(S)·내 역할(T)·핵심 판단(A)·결과(R)와 실패·아쉬움, 대응 가능한 질문 유형, 예상 꼬리 질문 항목으로 정리한 카드. 실패·아쉬움 칸은 반드시 채운다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>

  <!-- 머리: 경험 이름과 기간 -->
  <rect x="32" y="24" width="816" height="56" rx="8" fill="#1e293b"/>
  <text x="52" y="59" font-size="20" font-weight="bold" fill="#ffffff">경험 B — 정산 배치 마이그레이션</text>
  <text x="828" y="58" font-size="16" fill="#e2e8f0" text-anchor="end">2025.03 ~ 2025.05</text>

  <!-- 표 1: STAR 네 칸 -->
  <rect x="32" y="92" width="200" height="272" fill="#f1f5f9"/>
  <line x1="32" y1="144" x2="848" y2="144" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="32" y1="196" x2="848" y2="196" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="32" y1="300" x2="848" y2="300" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="232" y1="92" x2="232" y2="364" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="92" width="816" height="272" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- S -->
  <text x="52" y="123.5" font-size="16" font-weight="bold" fill="#1f2937">상황<tspan fill="#1d4ed8">(S)</tspan></text>
  <text x="252" y="123.5" font-size="16" fill="#111827">배치 4시간, 실패 시 재실행 불가, 정산 마감 압박</text>

  <!-- T -->
  <text x="52" y="175.5" font-size="16" font-weight="bold" fill="#1f2937">내 역할<tspan fill="#1d4ed8">(T)</tspan></text>
  <text x="252" y="175.5" font-size="16" fill="#111827">설계·구현·전환 담당 <tspan fill="#4b5563">(팀 3명 중 이 영역 단독)</tspan></text>

  <!-- A -->
  <text x="52" y="253.5" font-size="16" font-weight="bold" fill="#1f2937">핵심 판단<tspan fill="#1d4ed8">(A)</tspan></text>
  <text x="252" y="227.5" font-size="16" fill="#111827">① 전면 교체 대신 이중 실행 후 비교</text>
  <text x="252" y="253.5" font-size="16" fill="#111827">② 실데이터 복사본으로 검증</text>
  <text x="252" y="279.5" font-size="16" fill="#111827">③ 롤백 경로를 먼저 확보하고 전환</text>

  <!-- R -->
  <text x="52" y="337.5" font-size="16" font-weight="bold" fill="#1f2937">결과<tspan fill="#1d4ed8">(R)</tspan></text>
  <rect x="252" y="315" width="136" height="34" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="320" y="337.5" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">4시간 → 55분</text>
  <rect x="400" y="315" width="184" height="34" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="492" y="337.5" font-size="16" fill="#065f46" text-anchor="middle">전환 후 6개월 무장애</text>
  <rect x="596" y="315" width="176" height="34" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="684" y="337.5" font-size="16" fill="#065f46" text-anchor="middle">shadow run 절차화</text>

  <!-- 표 2: 실패·아쉬움, 질문 유형, 꼬리 질문 -->
  <rect x="32" y="380" width="200" height="56" fill="#fee2e2"/>
  <rect x="232" y="380" width="616" height="56" fill="#fef2f2"/>
  <rect x="32" y="436" width="200" height="140" fill="#f1f5f9"/>
  <line x1="32" y1="436" x2="848" y2="436" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="32" y1="496" x2="848" y2="496" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="232" y1="380" x2="232" y2="576" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="32" y="380" width="816" height="196" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 실패·아쉬움 -->
  <text x="52" y="413.5" font-size="16" font-weight="bold" fill="#b91c1c">실패·아쉬움</text>
  <text x="252" y="413.5" font-size="16" fill="#111827">초기에 스테이징 데이터만 믿어 3일치 누락 발생</text>
  <rect x="704" y="393" width="124" height="30" rx="15" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="766" y="413" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">반드시 채울 칸</text>

  <!-- 대응 가능한 질문 유형 -->
  <text x="52" y="471.5" font-size="16" font-weight="bold" fill="#1f2937">대응 가능한 질문 유형</text>
  <rect x="252" y="450" width="60" height="32" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="282" y="471.5" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">갈등</text>
  <rect x="324" y="450" width="60" height="32" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="354" y="471.5" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">실패</text>
  <rect x="396" y="450" width="60" height="32" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="426" y="471.5" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">학습</text>

  <!-- 예상 꼬리 질문 -->
  <text x="52" y="541.5" font-size="16" font-weight="bold" fill="#1f2937">예상 꼬리 질문</text>
  <text x="252" y="528.5" font-size="16" fill="#111827">"왜 이중 실행을 택했나"</text>
  <text x="252" y="554.5" font-size="16" fill="#111827">"롤백 판단 기준은"</text>
</svg>
