<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브릿지 패턴 적용</title>
  <desc id="d">Shape(추상화) 계층의 Circle, Square, Triangle과 Color(구현) 계층의 Red, Blue를 따로 두고, Shape가 Color 구현체를 참조하는 브릿지로 두 계층을 잇는다.</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- 추상화 계층 -->
  <rect x="24" y="24" width="380" height="212" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="52" font-size="16" font-weight="bold" fill="#6d28d9">추상화</text>

  <path d="M214,120 V144" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M90,144 H338" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M90,143 V168 M338,143 V168 M214,144 V168" fill="none" stroke="#4b5563" stroke-width="2"/>

  <rect x="154" y="72" width="120" height="48" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="214" y="102" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Shape</text>

  <rect x="38" y="168" width="104" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90" y="198" font-size="16" fill="#1f2937" text-anchor="middle">Circle</text>
  <rect x="162" y="168" width="104" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="214" y="198" font-size="16" fill="#1f2937" text-anchor="middle">Square</text>
  <rect x="286" y="168" width="104" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="338" y="198" font-size="16" fill="#1f2937" text-anchor="middle">Triangle</text>

  <!-- 구현 계층 -->
  <rect x="556" y="24" width="300" height="212" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="576" y="52" font-size="16" font-weight="bold" fill="#047857">구현</text>

  <path d="M706,120 V144" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M638,144 H774" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M638,143 V168 M774,143 V168" fill="none" stroke="#4b5563" stroke-width="2"/>

  <rect x="646" y="72" width="120" height="48" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="706" y="102" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Color</text>

  <rect x="586" y="168" width="104" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="638" y="198" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">Red</text>
  <rect x="722" y="168" width="104" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="774" y="198" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Blue</text>

  <!-- 브릿지 -->
  <path d="M274,96 H646" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="480" y="84" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">브릿지</text>
  <text x="480" y="119" font-size="15" fill="#374151" text-anchor="middle">구현체 참조</text>

  <!-- 요점 -->
  <text x="440" y="272" font-size="16" fill="#1f2937" text-anchor="middle">추상화와 구현을 분리해 각각 독립적으로 확장 → <tspan font-weight="bold" fill="#047857">n + m개</tspan></text>
</svg>
