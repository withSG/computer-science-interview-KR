<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브릿지 패턴 적용</title>
  <desc id="d">Shape 추상화 트리가 Color 구현 트리를 화살표로 참조하는 브릿지 패턴 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Shape 구역 (추상화 - 파랑) -->
  <rect x="40" y="30" width="360" height="280" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="65" font-size="16" font-weight="bold" fill="#2563eb">Shape (추상화)</text>

  <!-- Shape 루트 노드 -->
  <rect x="60" y="85" width="130" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="125" y="108" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Shape</text>

  <!-- Shape 트리 라인 -->
  <path d="M 80 121 L 80 262" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 80 153 L 100 153" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 80 208 L 100 208" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 80 262 L 100 262" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Shape 자식 노드들 -->
  <rect x="100" y="135" width="130" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="165" y="158" font-size="13" fill="#1f2933" text-anchor="middle">Circle</text>

  <rect x="100" y="190" width="130" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="165" y="213" font-size="13" fill="#1f2933" text-anchor="middle">Square</text>

  <rect x="100" y="244" width="130" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="165" y="267" font-size="13" fill="#1f2933" text-anchor="middle">Triangle</text>

  <!-- Color 구역 (구현 - 초록) -->
  <rect x="480" y="30" width="360" height="280" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="500" y="65" font-size="16" font-weight="bold" fill="#059669">Color (구현)</text>

  <!-- Color 루트 노드 -->
  <rect x="500" y="85" width="130" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="565" y="108" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Color</text>

  <!-- Color 트리 라인 -->
  <path d="M 520 121 L 520 208" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 520 153 L 540 153" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 520 208 L 540 208" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Color 자식 노드들 -->
  <rect x="540" y="135" width="130" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="605" y="158" font-size="13" fill="#1f2933" text-anchor="middle">Red</text>

  <rect x="540" y="190" width="130" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="605" y="213" font-size="13" fill="#1f2933" text-anchor="middle">Blue</text>

  <!-- 브릿지 연관 관계 화살표 -->
  <path d="M 230 153 L 490 153" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
</svg>