  <circle cx="150" cy="456" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="150" y="462" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2</text>
  <circle cx="94" cy="516" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="94" y="522" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <circle cx="206" cy="516" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="206" y="522" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
  <circle cx="66" cy="576" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="66" y="582" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">7</text>
  <circle cx="122" cy="576" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="122" y="582" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">5</text>
  <circle cx="178" cy="576" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="178" y="582" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">4</text>
  <text x="150" y="626" font-size="15" fill="#374151" text-anchor="middle">작은 자식 1 &lt; 2 → 교환</text>

  <!-- ⑤ 1과 교환 -->
  <rect x="314" y="382" width="252" height="262" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="440" y="414" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">⑤ 1과 교환</text>
  <line x1="426.4" y1="470.6" x2="397.6" y2="501.4" stroke="#9ca3af" stroke-width="2"/>
