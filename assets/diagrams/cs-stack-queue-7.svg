  <text x="786" y="200" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">1</text>
  <circle cx="646" cy="254" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="646" y="260" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">7</text>
  <circle cx="702" cy="254" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="702" y="260" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">5</text>
  <circle cx="758" cy="254" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="758" y="260" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">4</text>
  <circle cx="814" cy="254" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="814" y="260" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
  <text x="730" y="304" font-size="15" fill="#374151" text-anchor="middle">루트 도착 → 끝</text>

  <line x1="282" y1="194" x2="306" y2="194" stroke="#374151" stroke-width="2.5" marker-end="url(#next)"/>

  <line x1="572" y1="194" x2="596" y2="194" stroke="#374151" stroke-width="2.5" marker-end="url(#next)"/>

  <text x="24" y="362" font-size="18" font-weight="bold" fill="#111827">삭제: 루트 0을 꺼낸다<tspan font-size="15" font-weight="normal" fill="#4b5563">  —  마지막 원소를 루트에 올린 뒤, 더 작은 자식과 바꾸며 아래로 (heapify-down)</tspan></text>

  <!-- ④ 마지막 2를 루트로 -->
  <rect x="24" y="382" width="252" height="262" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="150" y="414" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">④ 마지막 2를 루트로</text>
  <line x1="136.4" y1="470.6" x2="107.6" y2="501.4" stroke="#9ca3af" stroke-width="2"/>
  <line x1="163.6" y1="470.6" x2="192.4" y2="501.4" stroke="#9ca3af" stroke-width="2"/>
  <line x1="85.5" y1="534.1" x2="74.5" y2="557.9" stroke="#9ca3af" stroke-width="2"/>
