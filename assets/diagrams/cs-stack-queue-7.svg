  <text x="496" y="200" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">0</text>
  <circle cx="356" cy="254" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="356" y="260" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">7</text>
  <circle cx="412" cy="254" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="412" y="260" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">5</text>
