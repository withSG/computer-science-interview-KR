  <text x="150" y="140" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
  <circle cx="94" cy="194" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="94" y="200" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <circle cx="206" cy="194" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="206" y="200" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
