  <circle cx="356" cy="576" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="356" y="582" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">7</text>
  <circle cx="412" cy="576" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
