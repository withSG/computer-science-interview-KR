  <text x="440" y="626" font-size="15" fill="#374151" text-anchor="middle">2 &lt; 자식 4 → 끝</text>

  <line x1="282" y1="516" x2="306" y2="516" stroke="#374151" stroke-width="2.5" marker-end="url(#next)"/>

  <!-- 요약·범례 -->

