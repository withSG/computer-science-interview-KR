  <circle cx="440" cy="456" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="440" y="462" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">1</text>
  <circle cx="384" cy="516" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="384" y="522" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <circle cx="496" cy="516" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
