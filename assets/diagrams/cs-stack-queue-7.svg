  <line x1="487.5" y1="212.1" x2="476.5" y2="235.9" stroke="#9ca3af" stroke-width="2"/>
  <line x1="504.5" y1="212.1" x2="515.5" y2="235.9" stroke="#1d4ed8" stroke-width="4.5"/>
