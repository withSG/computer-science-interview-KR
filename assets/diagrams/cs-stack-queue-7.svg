<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="880" height="670" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">힙 삽입과 삭제 과정</title>
  <desc id="d">Min Heap 1, 3, 2, 7, 5, 4에 0을 넣으면 맨 뒤에 붙은 뒤 2, 1과 차례로 교환되며 루트까지 올라가고(heapify-up), 루트 0을 꺼내면 마지막 원소 2가 루트로 올라온 뒤 더 작은 자식 1과 교환되며 내려가는(heapify-down) 다섯 단계를 트리로 보여 준다. 둘 다 트리 높이만큼만 움직여 O(log n)이다.</desc>
  <rect width="880" height="670" fill="#ffffff"/>
  <defs>
    <marker id="next" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="24" y="40" font-size="18" font-weight="bold" fill="#111827">삽입: 0을 넣는다<tspan font-size="15" font-weight="normal" fill="#4b5563">  —  맨 뒤에 붙인 뒤, 부모보다 작으면 위로 (heapify-up)</tspan></text>

  <!-- ① 맨 뒤에 붙임 -->
