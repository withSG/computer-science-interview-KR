<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ISR 재생성 흐름</title>
  <desc id="d">ISR은 만료 후 요청이 오면 캐시된(stale) HTML로 먼저 응답하고, 백그라운드에서 페이지를 재생성해 다음 요청부터 새 HTML을 응답한다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 레인: 요청·응답 -->
  <rect x="24" y="24" width="832" height="120" rx="10" fill="#f1f5f9"/>
  <path d="M34,24 H124 V144 H34 A10,10 0 0 1 24,134 V34 A10,10 0 0 1 34,24 Z" fill="#e2e8f0"/>
  <text x="74" y="90" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">요청·응답</text>

  <!-- 레인: 백그라운드 -->
  <rect x="24" y="156" width="832" height="120" rx="10" fill="#f5f3ff"/>
  <path d="M34,156 H124 V276 H34 A10,10 0 0 1 24,266 V166 A10,10 0 0 1 34,156 Z" fill="#ede9fe"/>
  <text x="74" y="222" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">백그라운드</text>

  <!-- 화살표 -->
  <path d="M296,84 H316" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M400,122 V216 H500" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M664,216 H768 V126" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 1. 만료 후 요청 -->
  <rect x="140" y="50" width="152" height="68" rx="34" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="90" font-size="16" fill="#1f2937" text-anchor="middle">만료 후 요청</text>

  <!-- 2. 캐시된(stale) HTML 응답 -->
  <rect x="324" y="50" width="152" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="400" y="81" font-size="16" font-weight="700" fill="#78350f" text-anchor="middle">
    <tspan x="400">캐시된(stale)</tspan>
    <tspan x="400" dy="22">HTML 응답</tspan>
  </text>

  <!-- 3. 백그라운드에서 재생성 -->
  <rect x="508" y="182" width="152" height="68" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="584" y="213" font-size="16" fill="#4c1d95" text-anchor="middle">
    <tspan x="584">백그라운드에서</tspan>
    <tspan x="584" dy="22">재생성</tspan>
  </text>

  <!-- 4. 다음 요청에 새 HTML -->
  <rect x="692" y="50" width="152" height="68" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="768" y="81" font-size="16" font-weight="700" fill="#064e3b" text-anchor="middle">
    <tspan x="768">다음 요청에</tspan>
    <tspan x="768" dy="22">새 HTML</tspan>
  </text>

  <!-- 단계 번호 -->
  <circle cx="170" cy="50" r="12" fill="#475569" stroke="#ffffff" stroke-width="2"/>
  <text x="170" y="55" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="350" cy="50" r="12" fill="#92400e" stroke="#ffffff" stroke-width="2"/>
  <text x="350" y="55" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="534" cy="182" r="12" fill="#5b21b6" stroke="#ffffff" stroke-width="2"/>
  <text x="534" y="187" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="718" cy="50" r="12" fill="#065f46" stroke="#ffffff" stroke-width="2"/>
  <text x="718" y="55" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 요약 캡션 -->
  <line x1="24" y1="298" x2="856" y2="298" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="324" font-size="15" fill="#374151" text-anchor="middle">렌더링 시점: 빌드 + 런타임<tspan dx="12">·</tspan><tspan dx="12">HTML 생성 위치: 서버</tspan></text>
  <text x="440" y="350" font-size="15" fill="#374151" text-anchor="middle">예: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="700" fill="#1d4ed8">revalidate: 60</tspan> → 60초가 지난 뒤 요청이 오면 백그라운드 재생성</text>
</svg>
