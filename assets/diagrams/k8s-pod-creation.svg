<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1020" width="880" height="1020" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pod 하나가 만들어지기까지 — API 서버를 거쳐 도는 9단계</title>
  <desc id="d">Kubernetes에서 Pod가 생성되어 트래픽을 받기까지의 9단계 흐름을 시퀀스 다이어그램으로 나타냅니다. 모든 컴포넌트는 API 서버 및 etcd를 통해서만 통신합니다.</desc>
  <rect width="880" height="1020" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="36" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">Pod 하나가 만들어지기까지 — API 서버를 거쳐 도는 9단계</text>

  <!-- Legend -->
  <rect x="230" y="50" width="420" height="30" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <line x1="250" y1="65" x2="280" y2="65" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <text x="290" y="69" font-size="11" fill="#1f2933">생성 / 쓰기 (Write)</text>
  <line x1="430" y1="65" x2="460" y2="65" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
  <text x="470" y="69" font-size="11" fill="#1f2933">감지 / 읽기 (Watch)</text>

  <!-- Background highlights for grouping -->
  <rect x="30" y="150" width="820" height="230" fill="#eff6ff" fill-opacity="0.5" rx="6"/>
  <text x="840" y="170" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="end">요청 접수와 컨트롤러 처리 (①~④)</text>

  <rect x="30" y="390" width="820" height="150" fill="#f5f3ff" fill-opacity="0.5" rx="6"/>
  <text x="840" y="410" font-size="11.5" font-weight="600" fill="#7c3aed" text-anchor="end">스케줄링 단계 (⑤)</text>

  <rect x="30" y="550" width="820" height="230" fill="#ecfdf5" fill-opacity="0.5" rx="6"/>
  <text x="840" y="570" font-size="11.5" font-weight="600" fill="#059669" text-anchor="end">노드 생성 및 검증 단계 (⑥~⑦)</text>

  <rect x="30" y="790" width="820" height="150" fill="#fffbeb" fill-opacity="0.5" rx="6"/>
  <text x="840" y="810" font-size="11.5" font-weight="600" fill="#d97706" text-anchor="end">네트워크 연결 단계 (⑧~⑨)</text>

  <!-- Lifelines (Vertical Lines) -->
  <line x1="80" y1="130" x2="80" y2="950" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="200" y1="130" x2="200" y2="950" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="320" y1="130" x2="320" y2="950" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="440" y1="130" x2="440" y2="950" stroke="#2563eb" stroke-width="2"/>
  <line x1="560" y1="130" x2="560" y2="950" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="680" y1="130" x2="680" y2="950" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="800" y1="130" x2="800" y2="950" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Lifeline Header Boxes -->
  <!-- kubectl: center x=80, width=80 -->
  <rect x="40" y="90" width="80" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="80" y="114" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">kubectl</text>

  <!-- Deployment 컨트롤러: center x=200, width=110 -->
  <rect x="145" y="90" width="110" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="200" y="107" font-size="11.5" font-weight="600" fill="#1f2933" text-anchor="middle">Deployment</text>
  <text x="200" y="122" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">컨트롤러</text>

  <!-- ReplicaSet 컨트롤러: center x=320, width=110 -->
  <rect x="265" y="90" width="110" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="320" y="107" font-size="11.5" font-weight="600" fill="#1f2933" text-anchor="middle">ReplicaSet</text>
  <text x="320" y="122" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">컨트롤러</text>

  <!-- kube-apiserver + etcd (Center Bus): center x=440, width=110 -->
  <rect x="385" y="90" width="110" height="40" fill="#2563eb" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="440" y="107" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">apiserver</text>
  <text x="440" y="122" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">+ etcd</text>

  <!-- kube-scheduler: center x=560, width=100 -->
  <rect x="510" y="90" width="100" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="560" y="114" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">kube-scheduler</text>

  <!-- kubelet: center x=680, width=80 -->
  <rect x="640" y="90" width="80" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="680" y="114" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">kubelet</text>

  <!-- EndpointSlice / kube-proxy: center x=800, width=110 -->
  <rect x="745" y="90" width="110" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="800" y="107" font-size="11" font-weight="600" fill="#1f2933" text-anchor="middle">EndpointSlice /</text>
  <text x="800" y="122" font-size="11" font-weight="500" fill="#1f2933" text-anchor="middle">kube-proxy</text>

  <!-- Steps -->

  <!-- Step 1: kubectl apply -->
  <g>
    <line x1="80" y1="190" x2="440" y2="190" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
    <rect x="180" y="172" x2="160" height="18" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="260" y="185" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">① apply -f web.yaml</text>
  </g>

  <!-- Step 2: apiserver verification/storage -->
  <g>
    <rect x="360" y="215" width="160" height="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="440" y="228" font-size="11" font-weight="500" fill="#1f2933" text-anchor="middle">② 인증→인가→Admission</text>
    <text x="440" y="240" font-size="11" font-weight="500" fill="#1f2933" text-anchor="middle">→검증→etcd 저장 (Deployment)</text>
  </g>

  <!-- Step 3: Deployment controller watch & create RS -->
  <g>
    <line x1="440" y1="270" x2="200" y2="270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
    <rect x="250" y="255" width="140" height="18" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="320" y="268" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">③ 새 Deployment 감지</text>

    <line x1="200" y1="300" x2="440" y2="300" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
    <rect x="250" y="285" width="140" height="18" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="320" y="298" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">ReplicaSet 생성 요청</text>
  </g>

  <!-- Step 4: ReplicaSet controller watch & create Pods -->
  <g>
    <line x1="440" y1="330" x2="320" y2="330" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
    <rect x="330" y="315" width="100" height="18" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="380" y="328" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">④ ReplicaSet 감지</text>

    <line x1="320" y1="360" x2="440" y2="360" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
    <rect x="325" y="342" width="110" height="30" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="380" y="355" font-size="11" font-weight="500" fill="#1f2933" text-anchor="middle">Pod 3개 생성 요청</text>
    <text x="380" y="367" font-size="11" fill="#52606d" text-anchor="middle">(nodeName 비어 있음)</text>
  </g>

  <!-- Step 5: Scheduler watch & binding -->
  <g>
    <line x1="440" y1="430" x2="560" y2="430" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
    <rect x="445" y="412" width="110" height="30" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="500" y="425" font-size="11" font-weight="500" fill="#2563eb" text-anchor="middle">⑤ nodeName 없는</text>
    <text x="500" y="437" font-size="11" font-weight="500" fill="#2563eb" text-anchor="middle">Pod 발견 (watch)</text>

    <rect x="500" y="455" width="120" height="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="4"/>
    <text x="560" y="469" font-size="11" font-weight="500" fill="#7c3aed" text-anchor="middle">필터링 / 스코어링</text>

    <line x1="560" y1="500" x2="440" y2="500" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
    <rect x="445" y="482" width="110" height="30" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="500" y="495" font-size="11.5" font-weight="500" fill="#7c3aed" text-anchor="middle">binding 기록</text>
    <text x="500" y="507" font-size="11" fill="#52606d" text-anchor="middle">(spec.nodeName 할당)</text>
  </g>

  <!-- Step 6: Kubelet watch & run pod -->
  <g>
    <line x1="440" y1="590" x2="680" y2="590" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
    <rect x="500" y="572" width="120" height="30" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="560" y="585" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">⑥ 자기 Pod 확인</text>
    <text x="560" y="597" font-size="11" fill="#52606d" text-anchor="middle">(spec.nodeName 매칭)</text>

    <rect x="610" y="615" width="140" height="45" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="4"/>
    <text x="680" y="630" font-size="11" font-weight="500" fill="#059669" text-anchor="middle">볼륨 마운트 → 이미지 pull</text>
    <text x="680" y="643" font-size="11" font-weight="500" fill="#059669" text-anchor="middle">→ CRI로 컨테이너 생성</text>
    <text x="680" y="655" font-size="11" font-weight="500" fill="#059669" text-anchor="middle">→ Probe 시작</text>
  </g>

  <!-- Step 7: Kubelet status report -->
  <g>
    <line x1="680" y1="710" x2="440" y2="710" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/>
    <rect x="500" y="695" width="120" height="18" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="560" y="708" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">⑦ status 보고 (Pod Ready)</text>
  </g>

  <!-- Step 8: EndpointSlice Controller watch & add IP -->
  <g>
    <line x1="440" y1="830" x2="800" y2="830" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
    <rect x="580" y="812" width="140" height="30" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="650" y="825" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">⑧ Ready Pod 감지</text>
    <text x="650" y="837" font-size="11" fill="#52606d" text-anchor="middle">(EndpointSlice 컨트롤러)</text>

    <line x1="800" y1="870" x2="440" y2="870" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/>
    <rect x="550" y="852" width="170" height="30" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="635" y="865" font-size="11" font-weight="500" fill="#d97706" text-anchor="middle">Service 엔드포인트에</text>
    <text x="635" y="877" font-size="11" font-weight="500" fill="#d97706" text-anchor="middle">Pod IP 추가</text>
  </g>

  <!-- Step 9: kube-proxy routing rules update -->
  <g>
    <line x1="440" y1="915" x2="800" y2="915" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
    <rect x="560" y="897" width="150" height="30" fill="#ffffff" stroke="#cbd2d9" rx="3"/>
    <text x="635" y="910" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">⑨ 변경 감지 → 규칙 갱신</text>
    <text x="635" y="922" font-size="11" fill="#52606d" text-anchor="middle">(kube-proxy: 트래픽 수신 시작)</text>
  </g>

  <!-- Summary Footer Caption -->
  <text x="440" y="985" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">결론: 어떤 컴포넌트도 서로 직접 통신하지 않으며, 오직 API 서버의 상태 변경을 감지(watch)하고 기록(write)하며 동작합니다.</text>
</svg>