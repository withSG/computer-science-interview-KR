<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1180" width="880" height="1180" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pod 하나가 만들어지기까지</title>
  <desc id="d">kubectl apply부터 kube-proxy 규칙 갱신까지 9단계를 보여줍니다. 각 구성요소는 다음 단계를 직접 호출하지 않고, kube-apiserver와 etcd에 상태를 기록(write)하거나 그 변경을 감지(watch)해 반응합니다.</desc>
  <rect width="880" height="1180" fill="#ffffff"/>

  <defs>
    <marker id="ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 요점 -->
  <text x="24" y="46" font-size="18" font-weight="700" fill="#111827">어떤 단계도 다음 단계를 직접 호출하지 않습니다 — 모두 API 서버의 상태를 보고 반응합니다</text>

  <!-- 범례 -->
  <line x1="24" y1="75" x2="64" y2="75" stroke="#111827" stroke-width="2" marker-end="url(#ah-dark)"/>
  <text x="74" y="80" font-size="15" fill="#111827">쓰기 (write): API 서버에 상태를 기록</text>
  <line x1="378" y1="75" x2="418" y2="75" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="428" y="80" font-size="15" fill="#1d4ed8">감지 (watch): API 서버의 변경을 보고 반응</text>

  <!-- API 서버 기둥 -->
  <rect x="676" y="110" width="180" height="1044" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="766" y="140" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">kube-apiserver</text>
  <text x="766" y="162" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">+ etcd</text>
  <text x="766" y="1116" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">kube-apiserver</text>
  <text x="766" y="1136" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">+ etcd</text>

  <!-- ② API 서버 내부 처리 -->
  <rect x="690" y="180" width="152" height="132" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text font-size="15" fill="#111827">
    <tspan x="704" y="206"><tspan font-weight="700">②</tspan> 인증 → 인가</tspan>
    <tspan x="704" y="228">→ Admission</tspan>
    <tspan x="704" y="250">→ 검증</tspan>
    <tspan x="704" y="272">→ etcd 저장</tspan>
    <tspan x="704" y="294" fill="#4b5563">(Deployment)</tspan>
  </text>

  <!-- 단계 묶음 1 -->
  <text x="24" y="138" font-size="15" font-weight="700" fill="#4b5563">요청 접수와 컨트롤러 처리 (①~④)</text>

  <!-- ① kubectl -->
  <rect x="24" y="156" width="290" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="42" y="190" font-size="17" font-weight="700" fill="#111827">① kubectl</text>
  <text x="495" y="184" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">apply -f web.yaml</text>
  <line x1="320" y1="196" x2="668" y2="196" stroke="#111827" stroke-width="2" marker-end="url(#ah-dark)"/>

  <!-- ③ Deployment 컨트롤러 -->
  <rect x="24" y="232" width="290" height="88" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="42" y="282" font-size="17" font-weight="700" fill="#111827">③ Deployment 컨트롤러</text>
  <text x="495" y="252" font-size="15" fill="#1d4ed8" text-anchor="middle">새 Deployment 감지</text>
  <line x1="675" y1="262" x2="322" y2="262" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="495" y="292" font-size="15" fill="#111827" text-anchor="middle">ReplicaSet 생성 요청</text>
  <line x1="320" y1="302" x2="668" y2="302" stroke="#111827" stroke-width="2" marker-end="url(#ah-dark)"/>

  <!-- ④ ReplicaSet 컨트롤러 -->
  <rect x="24" y="338" width="290" height="108" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="42" y="398" font-size="17" font-weight="700" fill="#111827">④ ReplicaSet 컨트롤러</text>
  <text x="495" y="358" font-size="15" fill="#1d4ed8" text-anchor="middle">ReplicaSet 감지</text>
  <line x1="675" y1="368" x2="322" y2="368" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="495" y="398" font-size="15" fill="#111827" text-anchor="middle">Pod 3개 생성 요청</text>
  <text x="495" y="418" font-size="15" fill="#4b5563" text-anchor="middle">(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">spec.nodeName</tspan> 비어 있음)</text>
  <line x1="320" y1="430" x2="668" y2="430" stroke="#111827" stroke-width="2" marker-end="url(#ah-dark)"/>

  <!-- 단계 묶음 2 -->
  <text x="24" y="484" font-size="15" font-weight="700" fill="#4b5563">스케줄링 단계 (⑤)</text>

  <!-- ⑤ kube-scheduler -->
  <rect x="24" y="500" width="290" height="96" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="42" y="540" font-size="17" font-weight="700" fill="#111827">⑤ kube-scheduler</text>
  <text x="42" y="566" font-size="15" fill="#374151">필터링/스코어링</text>
  <text x="495" y="520" font-size="15" fill="#1d4ed8" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">nodeName</tspan> 없는 Pod 발견</text>
  <line x1="675" y1="530" x2="322" y2="530" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="495" y="566" font-size="15" fill="#111827" text-anchor="middle">binding (<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">spec.nodeName</tspan> 할당)</text>
  <line x1="320" y1="578" x2="668" y2="578" stroke="#111827" stroke-width="2" marker-end="url(#ah-dark)"/>

  <!-- 단계 묶음 3 -->
  <text x="24" y="634" font-size="15" font-weight="700" fill="#4b5563">노드 생성 및 검증 단계 (⑥~⑦)</text>

  <!-- ⑥ kubelet -->
  <rect x="24" y="650" width="290" height="150" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="42" y="682" font-size="17" font-weight="700" fill="#111827">⑥ 해당 노드의 kubelet</text>
  <text font-size="15" fill="#374151">
    <tspan x="42" y="712">볼륨 붙이고 마운트</tspan>
    <tspan x="42" y="734">→ 이미지 pull</tspan>
    <tspan x="42" y="756">→ CRI로 컨테이너 생성</tspan>
    <tspan x="42" y="778">→ Probe 시작</tspan>
  </text>
  <text x="495" y="670" font-size="15" fill="#1d4ed8" text-anchor="middle">자기 Pod임을 확인</text>
  <text x="495" y="690" font-size="15" fill="#4b5563" text-anchor="middle">(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">spec.nodeName</tspan> 매칭)</text>
  <line x1="675" y1="702" x2="322" y2="702" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>

  <!-- ⑦ kubelet status 보고 -->
  <rect x="24" y="816" width="290" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="42" y="852" font-size="17" font-weight="700" fill="#111827">⑦ kubelet</text>
  <text x="495" y="842" font-size="15" fill="#111827" text-anchor="middle">status 보고 → Pod Ready</text>
  <line x1="320" y1="854" x2="668" y2="854" stroke="#111827" stroke-width="2" marker-end="url(#ah-dark)"/>

  <!-- 단계 묶음 4 -->
  <text x="24" y="914" font-size="15" font-weight="700" fill="#4b5563">네트워크 연결 단계 (⑧~⑨)</text>

  <!-- ⑧ EndpointSlice 컨트롤러 -->
  <rect x="24" y="930" width="290" height="108" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="42" y="990" font-size="17" font-weight="700" fill="#111827">⑧ EndpointSlice 컨트롤러</text>
  <text x="495" y="950" font-size="15" fill="#1d4ed8" text-anchor="middle">Ready Pod 감지</text>
  <line x1="675" y1="960" x2="322" y2="960" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="495" y="990" font-size="15" fill="#111827" text-anchor="middle">Ready Pod의 IP를</text>
  <text x="495" y="1010" font-size="15" fill="#111827" text-anchor="middle">Service 엔드포인트에 추가</text>
  <line x1="320" y1="1022" x2="668" y2="1022" stroke="#111827" stroke-width="2" marker-end="url(#ah-dark)"/>

  <!-- ⑨ kube-proxy -->
  <rect x="24" y="1054" width="290" height="100" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="42" y="1086" font-size="17" font-weight="700" fill="#111827">⑨ 각 노드의 kube-proxy</text>
  <text font-size="15" fill="#374151">
    <tspan x="42" y="1114">라우팅 규칙 갱신</tspan>
    <tspan x="42" y="1136">→ 트래픽 수신 시작</tspan>
  </text>
  <text x="495" y="1074" font-size="15" fill="#1d4ed8" text-anchor="middle">엔드포인트 변경 감지</text>
  <line x1="675" y1="1084" x2="322" y2="1084" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
</svg>
