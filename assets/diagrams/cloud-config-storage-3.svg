<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PVC에서 Pod까지의 스토리지 흐름</title>
  <desc id="d">개발자가 작성한 PVC(요청서)가 StorageClass(생성 정책)에 매칭·생성 요청되고, 동적 프로비저닝으로 PV(실체)가 만들어진 뒤 바인딩되어 Pod가 volumes.persistentVolumeClaim으로 마운트하는 흐름입니다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>

  <!-- 주체 구분 띠 -->
  <rect x="24" y="32" width="104" height="80" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="76" y="67" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">개발자가</text>
  <text x="76" y="89" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">작성</text>

  <rect x="24" y="172" width="104" height="364" rx="8" fill="#f1f5f9" stroke="#4b5563" stroke-width="1.5"/>
  <text x="76" y="343" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">클러스터가</text>
  <text x="76" y="365" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">처리</text>

  <!-- 1. PVC -->
  <rect x="152" y="32" width="220" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="262" y="66" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">PVC</text>
  <text x="262" y="94" font-size="15" fill="#374151" text-anchor="middle">(요청서)</text>
  <text x="400" y="78" font-size="16" fill="#1f2937">“20Gi, ReadWriteOnce, gp3 클래스로 주세요”</text>

  <path d="M262,112 V166" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="276" y="145" font-size="15" fill="#374151">매칭 / 생성 요청</text>

  <!-- 2. StorageClass -->
  <rect x="152" y="172" width="220" height="80" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="262" y="206" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">StorageClass</text>
  <text x="262" y="234" font-size="15" fill="#374151" text-anchor="middle">(생성 정책)</text>
  <text x="400" y="206" font-size="16" fill="#1f2937">“gp3 요청이 오면 이 프로비저너로</text>
  <text x="400" y="230" font-size="16" fill="#1f2937">이런 파라미터로 만들어라”</text>

  <path d="M262,252 V306" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="276" y="285" font-size="15" fill="#374151">동적 프로비저닝</text>

  <!-- 3. PV -->
  <rect x="152" y="312" width="220" height="80" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="262" y="346" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">PV</text>
  <text x="262" y="374" font-size="15" fill="#374151" text-anchor="middle">(실체)</text>
  <text x="400" y="358" font-size="16" fill="#1f2937">실제로 만들어진 볼륨 (클라우드 디스크 등)</text>

  <path d="M262,392 V446" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="276" y="425" font-size="15" fill="#374151">바인딩</text>

  <!-- 4. Pod -->
  <rect x="152" y="452" width="220" height="80" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="262" y="499" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Pod</text>
  <text x="400" y="498" font-size="16" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">volumes.persistentVolumeClaim</tspan> 으로 마운트</text>
</svg>
