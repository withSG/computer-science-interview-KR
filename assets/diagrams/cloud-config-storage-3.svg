<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세 오브젝트가 나뉜 이유</title>
  <desc id="d">PVC, StorageClass, PV, Pod 오브젝트 간의 관계와 구성을 보여주는 쿠버네티스 스토리지 흐름도</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- 상단 역할 영역 헤더/배경 -->
  <rect x="24" y="24" width="400" height="492" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <text x="224" y="51.2" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">개발자가 작성</text>

  <rect x="456" y="24" width="400" height="492" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <text x="656" y="51.2" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">클러스터가 처리</text>

  <!-- 1. PVC -->
  <rect x="84" y="80" width="280" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="224" y="108.2" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">PVC</text>
  <text x="224" y="132.2" font-size="13" fill="#52606d" text-anchor="middle">(요청서)</text>

  <!-- PVC 오른쪽 설명 -->
  <text x="470" y="120.25" font-size="13" fill="#1f2933">"20Gi, ReadWriteOnce, gp3 클래스로 주세요"</text>

  <!-- 화살표 1: PVC -> StorageClass -->
  <path d="M224,150 L224,190" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="160" y="161" width="128" height="18" fill="#ffffff"/>
  <text x="224" y="174.55" font-size="11.5" fill="#2563eb" text-anchor="middle">매칭 / 생성 요청</text>

  <!-- 2. StorageClass -->
  <rect x="84" y="190" width="280" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="224" y="218.2" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">StorageClass</text>
  <text x="224" y="242.2" font-size="13" fill="#52606d" text-anchor="middle">(생성 정책)</text>

  <!-- StorageClass 오른쪽 설명 -->
  <text x="470" y="230.25" font-size="13" fill="#1f2933">"gp3 요청이 오면 이 프로비저너로 이런 파라미터로 만들어라"</text>

  <!-- 화살표 2: StorageClass -> PV -->
  <path d="M224,260 L224,300" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="171" y="271" width="106" height="18" fill="#ffffff"/>
  <text x="224" y="284.55" font-size="11.5" fill="#7c3aed" text-anchor="middle">동적 프로비저닝</text>

  <!-- 3. PV -->
  <rect x="84" y="300" width="280" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="224" y="328.2" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">PV</text>
  <text x="224" y="352.2" font-size="13" fill="#52606d" text-anchor="middle">(실체)</text>

  <!-- PV 오른쪽 설명 -->
  <text x="470" y="340.25" font-size="13" fill="#1f2933">실제로 만들어진 볼륨 (클라우드 디스크 등)</text>

  <!-- 화살표 3: PV -> Pod -->
  <path d="M224,370 L224,410" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="194" y="381" width="60" height="18" fill="#ffffff"/>
  <text x="224" y="394.55" font-size="11.5" fill="#059669" text-anchor="middle">바인딩</text>

  <!-- 4. Pod -->
  <rect x="84" y="410" width="280" height="70" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="224" y="449.2" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Pod</text>

  <!-- Pod 오른쪽 설명 -->
  <text x="470" y="450.25" font-size="13" fill="#1f2933">volumes.persistentVolumeClaim 으로 마운트</text>
</svg>