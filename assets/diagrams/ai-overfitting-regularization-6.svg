<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">전처리 누수: 분할 전 fit과 분할 후 fit</title>
  <desc id="d">안티패턴은 전체 데이터로 StandardScaler.fit()을 먼저 한 뒤 분할해 학습셋과 검증셋을 transform하므로 검증셋의 평균·분산이 스케일러에 섞인다. 개선안은 먼저 분할하고 학습셋에서만 fit_transform(), 검증셋은 transform()만 한다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ===== 안티패턴 ===== -->
  <rect x="24" y="24" width="832" height="264" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="48" y="56" font-size="18" font-weight="bold" fill="#b91c1c">[안티패턴] 전체 데이터로 스케일러를 먼저 학습</text>

  <rect x="48" y="80" width="120" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="108" y="108" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">전체 데이터</text>

  <line x1="168" y1="102" x2="328" y2="102" stroke="#b91c1c" stroke-width="2" marker-end="url(#red)"/>

  <rect x="332" y="80" width="240" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="352" cy="102" r="11" fill="#b91c1c"/>
  <text x="352" y="107" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="372" y="107" font-size="15" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">StandardScaler.fit()</text>
  <text x="588" y="107" font-size="15" font-weight="bold" fill="#b91c1c">← 검증셋의 평균·분산이 여기 섞인다</text>

  <path d="M108,124 V210 H192" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <rect x="196" y="190" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="216" cy="210" r="11" fill="#b91c1c"/>
  <text x="216" y="215" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="236" y="216" font-size="16" font-weight="bold" fill="#111827">분할</text>

  <path d="M292,210 H312 V180 H328" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <path d="M312,210 V240 H328" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>

  <rect x="332" y="160" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="380" y="186" font-size="16" fill="#111827" text-anchor="middle">학습셋</text>
  <rect x="332" y="220" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="380" y="246" font-size="16" fill="#111827" text-anchor="middle">검증셋</text>

  <line x1="428" y1="180" x2="496" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="428" y1="240" x2="496" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="466" y1="124" x2="466" y2="240" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="466" cy="180" r="5" fill="#b91c1c"/>
  <circle cx="466" cy="240" r="5" fill="#b91c1c"/>

  <rect x="500" y="160" width="112" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="556" y="185" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">transform</text>
  <rect x="500" y="220" width="112" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="556" y="245" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">transform</text>
  <text x="628" y="245" font-size="15" font-weight="bold" fill="#b91c1c">← 자기 정보를 이미 본 스케일러</text>

  <!-- ===== 개선 ===== -->
  <rect x="24" y="312" width="832" height="184" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="48" y="344" font-size="18" font-weight="bold" fill="#047857">[개선] 분할이 먼저, fit은 학습셋에서만</text>

  <rect x="48" y="396" width="120" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="108" y="424" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">전체 데이터</text>
  <line x1="168" y1="418" x2="192" y2="418" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>

  <rect x="196" y="398" width="96" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <circle cx="216" cy="418" r="11" fill="#047857"/>
  <text x="216" y="423" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="236" y="424" font-size="16" font-weight="bold" fill="#047857">분할</text>

  <path d="M292,418 H312 V388 H328" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <path d="M312,418 V448 H328" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>

  <rect x="332" y="368" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="380" y="394" font-size="16" fill="#111827" text-anchor="middle">학습셋</text>
  <rect x="332" y="428" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="380" y="454" font-size="16" fill="#111827" text-anchor="middle">검증셋</text>

  <line x1="428" y1="388" x2="496" y2="388" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="428" y1="448" x2="496" y2="448" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>

  <rect x="500" y="368" width="200" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <circle cx="520" cy="388" r="11" fill="#047857"/>
  <text x="520" y="393" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="540" y="393" font-size="15" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fit_transform()</text>
  <rect x="500" y="428" width="200" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="600" y="453" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">transform()</text>
  <text x="716" y="453" font-size="15" font-weight="bold" fill="#047857">← fit 하지 않는다</text>
</svg>
