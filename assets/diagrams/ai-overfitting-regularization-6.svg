<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">유형 1 — 전처리를 분할 전에 수행</title>
  <desc id="d">안티패턴과 개선된 데이터 전처리 분할 프로세스를 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- ==================== SECTION 1: ANTIPATTERN ==================== -->
  <rect x="24" y="24" width="832" height="246" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="44" y="52" font-size="16" font-weight="bold" fill="#dc2626">[안티패턴] 전체 데이터로 스케일러를 먼저 학습</text>

  <!-- Nodes Section 1 -->
  <!-- 전체 데이터 -->
  <rect x="54" y="90" width="130" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="119" y="114" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">전체 데이터</text>

  <!-- StandardScaler.fit() -->
  <rect x="284" y="90" width="200" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="384" y="114" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">StandardScaler.fit()</text>

  <!-- Comment 1 -->
  <text x="504" y="114" font-size="13" fill="#dc2626">← 검증셋의 평균·분산이 여기 섞인다</text>

  <!-- 분할 -->
  <rect x="184" y="160" width="80" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="224" y="182" font-size="13" fill="#1f2933" text-anchor="middle">분할</text>

  <!-- 학습셋 -->
  <rect x="304" y="150" width="80" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="344" y="172" font-size="13" fill="#1f2933" text-anchor="middle">학습셋</text>

  <!-- 검증셋 -->
  <rect x="304" y="200" width="80" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="344" y="222" font-size="13" fill="#1f2933" text-anchor="middle">검증셋</text>

  <!-- transform 1 (학습셋) -->
  <rect x="474" y="150" width="100" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="524" y="172" font-size="13" fill="#1f2933" text-anchor="middle">transform</text>

  <!-- transform 2 (검증셋) -->
  <rect x="474" y="200" width="100" height="36" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="524" y="222" font-size="13" fill="#dc2626" text-anchor="middle">transform</text>

  <!-- Comment 2 -->
  <text x="590" y="222" font-size="13" fill="#dc2626">(자기 정보를 이미 본 스케일러)</text>

  <!-- Arrows & Paths Section 1 -->
  <!-- 전체 데이터 ──> StandardScaler.fit() -->
  <path d="M184,110 L284,110" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- 전체 데이터 └─> 분할 -->
  <path d="M119,130 L119,178 L184,178" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 분할 ─> 학습셋 -->
  <path d="M264,168 L304,168" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 분할 ─> 검증셋 -->
  <path d="M264,188 L274,188 L274,218 L304,218" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 학습셋 ──> transform -->
  <path d="M384,168 L474,168" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 검증셋 ─────> transform -->
  <path d="M384,218 L474,218" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- StandardScaler.fit() ──┴──> transform connections -->
  <path d="M384,130 L384,150" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <path d="M429,130 L429,200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- ==================== SECTION 2: IMPROVEMENT ==================== -->
  <rect x="24" y="294" width="832" height="252" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="44" y="322" font-size="16" font-weight="bold" fill="#059669">[개선] 분할이 먼저, fit은 학습셋에서만</text>

  <!-- Nodes Section 2 -->
  <!-- 전체 데이터 -->
  <rect x="54" y="380" width="130" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="119" y="404" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">전체 데이터</text>

  <!-- 분할 -->
  <rect x="224" y="380" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="264" y="404" font-size="13" fill="#1f2933" text-anchor="middle">분할</text>

  <!-- 학습셋 -->
  <rect x="364" y="350" width="80" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="404" y="372" font-size="13" fill="#1f2933" text-anchor="middle">학습셋</text>

  <!-- 검증셋 -->
  <rect x="364" y="430" width="80" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="404" y="452" font-size="13" fill="#1f2933" text-anchor="middle">검증셋</text>

  <!-- fit_transform() -->
  <rect x="494" y="350" width="140" height="36" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="564" y="372" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">fit_transform()</text>

  <!-- transform() -->
  <rect x="494" y="430" width="140" height="36" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="564" y="452" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">transform()</text>

  <!-- Comment 3 -->
  <text x="650" y="452" font-size="13" fill="#059669">(fit 하지 않는다)</text>

  <!-- Arrows & Paths Section 2 -->
  <!-- 전체 데이터 ─ 분할 -->
  <path d="M184,400 L224,400" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- 분할 ─┬─> 학습셋 -->
  <path d="M304,400 L324,400 L324,368 L364,368" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 분할 └─> 검증셋 -->
  <path d="M324,400 L324,448 L364,448" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 학습셋 ──> fit_transform() -->
  <path d="M444,368 L494,368" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 검증셋 ──> transform() -->
  <path d="M444,448 L494,448" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
</svg>