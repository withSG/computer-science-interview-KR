<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이벤트 루프 한 사이클</title>
  <desc id="d">한 사이클은 매크로태스크 1개 실행, 마이크로태스크 전부 소진, 렌더링 기회 순으로 진행된다. 렌더링 기회는 매 사이클마다 오지 않으며, 오면 requestAnimationFrame 콜백 실행, 스타일 계산, 레이아웃, 페인트·합성 순으로 처리된다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 한 사이클 범위 표시 -->
  <path d="M48,58 V48 H832 V58" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="384" y="32" width="112" height="30" fill="#ffffff"/>
  <text x="440" y="54" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">한 사이클</text>

  <!-- 1. 매크로태스크 1개 실행 -->
  <rect x="48" y="130" width="172" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="134" y="161" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">매크로태스크<tspan x="134" dy="23">1개 실행</tspan></text>

  <path d="M222,166 H256" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- 2. 마이크로태스크 전부 소진 -->
  <rect x="260" y="130" width="172" height="72" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="346" y="161" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">마이크로태스크<tspan x="346" dy="23">전부 소진</tspan></text>

  <path d="M434,166 H472" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- 3. 렌더링 기회 -->
  <rect x="476" y="76" width="356" height="280" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="496" y="106" font-size="17" font-weight="bold" fill="#065f46">렌더링 기회</text>
  <text x="496" y="129" font-size="15" fill="#374151">매 사이클마다 오지 않는다</text>

  <rect x="496" y="146" width="316" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="510" y="171" font-size="15" font-weight="bold" fill="#92400e">① requestAnimationFrame 콜백 실행</text>

  <rect x="496" y="196" width="316" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="510" y="221" font-size="15" fill="#1f2937">② 스타일 계산</text>

  <rect x="496" y="246" width="316" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="510" y="271" font-size="15" fill="#1f2937">③ 레이아웃</text>

  <rect x="496" y="296" width="316" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="510" y="321" font-size="15" fill="#1f2937">④ 페인트 · 합성</text>

  <!-- 다음 사이클로 -->
  <path d="M654,358 V392 H134 V206" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="338" y="378" width="104" height="28" fill="#ffffff"/>
  <text x="390" y="397" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">다음 사이클</text>
</svg>
