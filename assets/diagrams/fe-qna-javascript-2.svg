<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">클로저의 동작 원리</title>
  <desc id="d">outer 함수 실행 컨텍스트 내부와 inner 함수의 Lexical Environment 참조 관계 및 가비지 컬렉션 방지 설명 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Section Header Label -->
  <text x="240" y="42" font-size="14" font-weight="bold" fill="#2563eb">outer() 호출 시:</text>

  <!-- Outer Box (outer Execution Context) -->
  <rect x="240" y="55" width="400" height="180" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="260" y="85" font-size="14" font-weight="bold" fill="#1f2933">outer Execution Context</text>

  <!-- Inner Variables -->
  <text x="280" y="118" font-size="13" fill="#1f2933">message: 'Hello'</text>
  <text x="280" y="148" font-size="13" fill="#1f2933">inner: function</text>

  <!-- Sub Tree for [[Environment]] -->
  <path d="M 310,162 L 310,178 L 324,178" stroke="#52606d" stroke-width="1.2" fill="none"/>
  
  <!-- Environment Badge/Box -->
  <rect x="330" y="163" width="280" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="340" y="181" font-size="12" fill="#7c3aed" font-weight="bold">[[Environment]]: outer의 렉시컬 환경 참조</text>

  <!-- Reference Arrow pointing back to the outer Lexical Environment -->
  <path d="M 610,177 C 660,177 660,80 642,80" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-purple)"/>

  <!-- Footer Explanation Note -->
  <rect x="140" y="260" width="600" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">outer() 종료 후에도 inner가 outer의 렉시컬 환경을 참조하므로</text>
  <text x="440" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">message 변수는 가비지 컬렉션되지 않음</text>
</svg>