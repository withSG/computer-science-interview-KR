<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">환경변수가 들어오는 세 층</title>
  <desc id="d">① .env 파일의 DB_PASSWORD=devpw를 Compose가 읽어 ② compose 파일의 ${DB_PASSWORD}를 치환하고, ③ environment나 env_file로 넣은 값만 컨테이너 안 환경변수가 되어 앱이 읽는다. .env는 컨테이너에 자동으로 들어가지 않는다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ① .env 파일 -->
  <rect x="24" y="24" width="252" height="188" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="150" y="67" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">① .env 파일</text>
  <line x1="40" y1="96" x2="260" y2="96" stroke="#93c5fd" stroke-width="1"/>
  <rect x="36" y="112" width="228" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="150" y="141" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DB_PASSWORD=devpw</text>
  <text x="150" y="191" font-size="15" fill="#1d4ed8" font-weight="bold" text-anchor="middle">Compose가 읽는다</text>

  <!-- ② compose 파일의 ${VAR} 치환 -->
  <rect x="314" y="24" width="252" height="188" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="54" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">② compose 파일의</text>
  <text x="440" y="80" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">${VAR} 치환</text>
  <line x1="330" y1="96" x2="550" y2="96" stroke="#fcd34d" stroke-width="1"/>
  <rect x="326" y="112" width="228" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="440" y="141" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">password: ${DB_PASSWORD}</text>
  <text x="440" y="191" font-size="15" fill="#b45309" font-weight="bold" text-anchor="middle">파일이 렌더링됨</text>

  <!-- ③ 컨테이너 안 환경변수 -->
  <rect x="604" y="24" width="252" height="188" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="730" y="54" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">③ 컨테이너 안</text>
  <text x="730" y="80" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">환경변수</text>
  <line x1="620" y1="96" x2="840" y2="96" stroke="#6ee7b7" stroke-width="1"/>
  <rect x="616" y="112" width="228" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="730" y="141" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">environment / env_file</text>
  <text x="730" y="191" font-size="15" fill="#047857" font-weight="bold" text-anchor="middle">앱이 읽는다</text>

  <!-- ① → ② → ③ -->
  <path d="M280,136 H310" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ak)"/>
  <path d="M570,136 H600" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- ① ⇢ ③ 직통 경로 없음 -->
  <path d="M150,216 V256 H424" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M456,256 H730 V218" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <circle cx="440" cy="256" r="14" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="262" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">✗</text>
  <text x="440" y="296" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">.env는 컨테이너에 자동으로 들어가지 않는다</text>
</svg>
