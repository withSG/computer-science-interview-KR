<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" width="880" height="416" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">단순 LLM 호출 vs Agent</title>
  <desc id="d">단순 LLM 호출은 질문에서 LLM을 한 번 거쳐 바로 답변하고, AI Agent는 추론, 도구 호출, 결과 관찰을 목표 달성까지 반복한 뒤 답변한다.</desc>
  <rect width="880" height="416" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 단순 LLM 호출 -->
  <rect x="24" y="24" width="832" height="144" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="56" font-size="18" font-weight="bold" fill="#111827">단순 LLM 호출</text>

  <rect x="48" y="76" width="96" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="96" y="106" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">질문</text>
  <line x1="144" y1="100" x2="376" y2="100" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="380" y="76" width="120" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="106" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">LLM</text>
  <line x1="500" y1="100" x2="732" y2="100" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="736" y="76" width="96" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="784" y="106" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">답변</text>

  <text x="440" y="152" font-size="15" fill="#4b5563" text-anchor="middle">1회성, 외부 상호작용 없음</text>

  <!-- AI Agent -->
  <rect x="24" y="188" width="832" height="204" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="48" y="220" font-size="18" font-weight="bold" fill="#6d28d9">AI Agent</text>

  <rect x="48" y="262" width="96" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="96" y="292" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">질문</text>
  <line x1="144" y1="286" x2="188" y2="286" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>

  <!-- 반복 루프 -->
  <rect x="192" y="240" width="496" height="132" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="216" y="262" width="120" height="48" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="276" y="292" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">추론</text>
  <line x1="336" y1="286" x2="376" y2="286" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="380" y="262" width="120" height="48" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="292" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">도구 호출</text>
  <line x1="500" y1="286" x2="540" y2="286" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="544" y="262" width="120" height="48" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="604" y="292" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">결과 관찰</text>
  <path d="M604,310 L604,330 L276,330 L276,314" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="440" y="356" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">반복 (목표 달성까지 루프)</text>

  <line x1="688" y1="286" x2="732" y2="286" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="736" y="262" width="96" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="784" y="292" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">답변</text>
</svg>
