<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">형태에 따른 이진 트리 분류</title>
  <desc id="d">포화 이진 트리, 완전 이진 트리, 편향 이진 트리의 형태적 특징과 설명을 비교하는 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 영역 구분 카드리드 (3개 구역) -->
  <!-- 1. 포화 이진 트리 -->
  <rect x="24" y="20" width="264" height="480" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <!-- 2. 완전 이진 트리 -->
  <rect x="308" y="20" width="264" height="480" rx="8" fill="#ecfdf5" stroke="#cbd2d9" stroke-width="1"/>
  <!-- 3. 편향 이진 트리 -->
  <rect x="592" y="20" width="264" height="480" rx="8" fill="#fffbeb" stroke="#cbd2d9" stroke-width="1"/>

  <!-- ===== 1. 포화 이진 트리 (Perfect) ===== -->
  <text x="156" y="52" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">포화 이진 트리</text>
  <text x="156" y="74" font-size="14" fill="#52606d" text-anchor="middle">(Perfect)</text>

  <!-- 간선 (Edges) -->
  <line x1="156" y1="125" x2="106" y2="175" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="156" y1="125" x2="206" y2="175" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="106" y1="195" x2="71" y2="245" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="106" y1="195" x2="141" y2="245" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="206" y1="195" x2="171" y2="245" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="206" y1="195" x2="241" y2="245" stroke="#9aa5b1" stroke-width="2"/>

  <!-- 노드 (Nodes) -->
  <circle cx="156" cy="125" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="156" y="131" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

  <circle cx="106" cy="185" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="106" y="191" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

  <circle cx="206" cy="185" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="206" y="191" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

  <circle cx="71" cy="255" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="71" y="261" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

  <circle cx="141" cy="255" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="141" y="261" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>

  <circle cx="171" cy="255" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="171" y="261" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">6</text>

  <circle cx="241" cy="255" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="241" y="261" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">7</text>

  <!-- 설명 -->
  <text x="156" y="370" font-size="13" fill="#1f2933" text-anchor="middle">모든 레벨이 꽉 참</text>


  <!-- ===== 2. 완전 이진 트리 (Complete) ===== -->
  <text x="440" y="52" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">완전 이진 트리</text>
  <text x="440" y="74" font-size="14" fill="#52606d" text-anchor="middle">(Complete)</text>

  <!-- 간선 (Edges) -->
  <line x1="440" y1="125" x2="390" y2="175" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="440" y1="125" x2="490" y2="175" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="390" y1="195" x2="355" y2="245" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="390" y1="195" x2="425" y2="245" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="490" y1="195" x2="455" y2="245" stroke="#9aa5b1" stroke-width="2"/>

  <!-- 노드 (Nodes) -->
  <circle cx="440" cy="125" r="18" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="440" y="131" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

  <circle cx="390" cy="185" r="18" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="390" y="191" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

  <circle cx="490" cy="185" r="18" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="490" y="191" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

  <circle cx="355" cy="255" r="18" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="355" y="261" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

  <circle cx="425" cy="255" r="18" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="425" y="261" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>

  <circle cx="455" cy="255" r="18" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="455" y="261" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">6</text>

  <!-- 설명 -->
  <text x="440" y="370" font-size="13" fill="#1f2933" text-anchor="middle">마지막 레벨만 덜 참,</text>
  <text x="440" y="392" font-size="13" fill="#1f2933" text-anchor="middle">왼쪽부터 채움</text>

  <!-- 화살표 및 추가 설명 -->
  <path d="M 380 415 L 395 415" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="403" y="420" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">배열 표현 가능</text>


  <!-- ===== 3. 편향 이진 트리 (Skewed) ===== -->
  <text x="724" y="52" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">편향 이진 트리</text>
  <text x="724" y="74" font-size="14" fill="#52606d" text-anchor="middle">(Skewed)</text>

  <!-- 간선 (Edges) -->
  <line x1="674" y1="125" x2="704" y2="175" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="704" y1="195" x2="734" y2="245" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="734" y1="265" x2="764" y2="315" stroke="#9aa5b1" stroke-width="2"/>

  <!-- 노드 (Nodes) -->
  <circle cx="674" cy="125" r="18" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="674" y="131" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

  <circle cx="704" cy="185" r="18" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="704" y="191" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

  <circle cx="734" cy="255" r="18" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="734" y="261" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

  <circle cx="764" cy="325" r="18" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="764" y="331" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

  <!-- 설명 -->
  <text x="724" y="370" font-size="13" fill="#1f2933" text-anchor="middle">연결 리스트와 동일</text>

</svg>