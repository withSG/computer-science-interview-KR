<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이진 트리의 세 가지 형태</title>
  <desc id="d">포화 이진 트리는 모든 레벨이 꽉 차 있고, 완전 이진 트리는 마지막 레벨만 왼쪽부터 채워져 배열로 표현할 수 있으며, 편향 이진 트리는 한쪽으로만 자식이 붙어 연결 리스트와 같다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <rect x="24" y="24" width="264" height="502" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="156" y="62" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">포화 이진 트리</text>
  <text x="156" y="86" font-size="15" fill="#4b5563" text-anchor="middle">(Perfect)</text>
  <rect x="308" y="24" width="264" height="502" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="440" y="62" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">완전 이진 트리</text>
  <text x="440" y="86" font-size="15" fill="#4b5563" text-anchor="middle">(Complete)</text>
  <rect x="592" y="24" width="264" height="502" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="724" y="62" font-size="19" font-weight="bold" fill="#9a3412" text-anchor="middle">편향 이진 트리</text>
  <text x="724" y="86" font-size="15" fill="#4b5563" text-anchor="middle">(Skewed)</text>
  <!-- 포화 -->
