<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기술 부채 해소 6개월 후</title>
  <desc id="d">6개월 후 테스트 커버리지 20%→65%, 코드 중복 40% 감소, 버그 발생률 30% 감소, 기능 개발 속도 정상화라는 네 가지 결과와, 기술 부채는 '지속적으로 조금씩' 해결하는 것이 효과적이라는 배운 점을 보여줍니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <text x="24" y="46" font-size="18" font-weight="bold" fill="#1f2937">6개월 후</text>

  <!-- 지표 타일 4개 -->
  <rect x="24" y="62" width="196" height="116" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="122" y="96" font-size="16" fill="#374151" text-anchor="middle">테스트 커버리지</text>
  <text x="122" y="148" font-size="28" font-weight="bold" fill="#047857" text-anchor="middle"><tspan fill="#4b5563">20%</tspan> → 65%</text>

  <rect x="236" y="62" width="196" height="116" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="334" y="96" font-size="16" fill="#374151" text-anchor="middle">코드 중복</text>
  <text x="334" y="148" font-size="28" font-weight="bold" fill="#047857" text-anchor="middle">40% 감소</text>

  <rect x="448" y="62" width="196" height="116" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="546" y="96" font-size="16" fill="#374151" text-anchor="middle">버그 발생률</text>
  <text x="546" y="148" font-size="28" font-weight="bold" fill="#047857" text-anchor="middle">30% 감소</text>

  <rect x="660" y="62" width="196" height="116" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="758" y="96" font-size="16" fill="#374151" text-anchor="middle">기능 개발 속도</text>
  <text x="758" y="148" font-size="28" font-weight="bold" fill="#047857" text-anchor="middle">정상화</text>

  <!-- 배운 점 -->
  <rect x="24" y="202" width="832" height="112" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="44" y="234" font-size="16" font-weight="bold" fill="#374151">배운 점</text>
  <text x="44" y="268" font-size="18" fill="#1f2937">기술 부채는 <tspan font-weight="bold" fill="#b91c1c">'나중에 한번에'</tspan> 가 아니라</text>
  <text x="44" y="296" font-size="18" fill="#1f2937"><tspan font-weight="bold" fill="#047857">'지속적으로 조금씩'</tspan> 해결하는 것이 효과적임을 배웠습니다.</text>
</svg>
