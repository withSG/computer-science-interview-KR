<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">STAR 답변 구조 - Result (결과)</title>
  <desc id="d">기술 부채 해소 프로젝트의 6개월 후 성과와 배운 점을 정리한 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">Result (결과)</text>
  
  <rect x="40" y="65" width="800" height="235" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  
  <text x="70" y="100" font-size="14" font-weight="bold" fill="#059669">"6개월 후:</text>
  <text x="70" y="128" font-size="13" fill="#1f2933">- 테스트 커버리지: 20% → 65%</text>
  <text x="70" y="152" font-size="13" fill="#1f2933">- 코드 중복: 40% 감소</text>
  <text x="70" y="176" font-size="13" fill="#1f2933">- 버그 발생률: 30% 감소</text>
  <text x="70" y="200" font-size="13" fill="#1f2933">- 기능 개발 속도: 정상화</text>
  
  <rect x="70" y="218" width="740" height="64" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="86" y="243" font-size="13" fill="#1f2933">기술 부채는 '나중에 한번에' 가 아니라</text>
  <text x="86" y="267" font-size="13" fill="#1f2933">'지속적으로 조금씩' 해결하는 것이 효과적임을 배웠습니다."</text>
</svg>