<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐스케이드 전체 순서와 @layer</title>
  <desc id="d">선언 여러 개가 한 속성에 충돌할 때 브라우저가 승자를 고르는 5단계 순서를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 상단 시작 텍스트 -->
  <text x="210" y="32" font-size="13" fill="#1f2933" text-anchor="middle">선언 여러 개가 한 속성에 충돌</text>
  <path d="M210,40 L210,62" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 1 -->
  <g>
    <rect x="40" y="70" width="340" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="210" y="104" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">① 출처와 중요도</text>

    <rect x="410" y="70" width="430" height="60" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="426" y="94" font-size="13" font-weight="bold" fill="#dc2626">!important<tspan fill="#52606d" font-weight="normal">끼리는</tspan></text>
    <text x="545" y="94" font-size="13" fill="#1f2933">브라우저 기본 &gt; 사용자 &gt; 작성자 순으로 강하고</text>
    <text x="426" y="116" font-size="13" font-weight="bold" fill="#1f2933">일반 선언<tspan font-weight="normal">끼리는</tspan></text>
    <text x="545" y="116" font-size="13" fill="#1f2933">작성자 &gt; 사용자 &gt; 브라우저 기본 순으로 강하다</text>
  </g>

  <path d="M210,130 L210,152" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 2 -->
  <g>
    <rect x="40" y="160" width="340" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="210" y="194" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">② 인라인 스타일</text>

    <rect x="410" y="160" width="430" height="60" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="426" y="194" font-size="13" fill="#52606d">같은 출처·중요도 안에서는 <tspan fill="#1f2933" font-weight="bold">style="..."</tspan> 가 선택자 규칙을 이긴다</text>
  </g>

  <path d="M210,220 L210,242" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 3 (강조: @layer) -->
  <g>
    <rect x="40" y="250" width="340" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="210" y="284" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">③ 캐스케이드 레이어</text>

    <rect x="410" y="250" width="430" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="426" y="274" font-size="13" font-weight="bold" fill="#7c3aed">@layer<tspan fill="#1f2933" font-weight="normal"> 순서. 나중에 선언된 레이어가 이긴다</tspan></text>
    <text x="426" y="296" font-size="13" fill="#1f2933">레이어에 안 넣은 스타일이 가장 강하다</text>
  </g>

  <path d="M210,310 L210,332" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 4 -->
  <g>
    <rect x="40" y="340" width="340" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="210" y="374" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">④ 명시도</text>

    <rect x="410" y="340" width="430" height="60" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="426" y="374" font-size="13" fill="#52606d">(ID, CLASS, TYPE) 앞자리부터 비교</text>
  </g>

  <path d="M210,400 L210,422" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 5 -->
  <g>
    <rect x="40" y="430" width="340" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="210" y="464" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">⑤ 선언 순서</text>

    <rect x="410" y="430" width="430" height="60" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="426" y="464" font-size="13" fill="#52606d">여기까지 같으면 나중에 쓴 것이 이긴다</text>
  </g>

  <!-- 범례 및 보충설명 영역 -->
  <g>
    <rect x="40" y="515" width="800" height="30" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <rect x="52" y="524" width="12" height="12" rx="2" fill="#7c3aed"/>
    <text x="70" y="534" font-size="11.5" fill="#52606d">강조: 본문에서 명시도(④)보다 먼저 적용된다고 기술된 핵심 판정 단계 (③ @layer)</text>
  </g>
</svg>