<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 704" width="880" height="704" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐스케이드 판정 순서</title>
  <desc id="d">한 속성에 선언이 여러 개 충돌하면 브라우저는 ① 출처와 중요도, ② 인라인 스타일, ③ 캐스케이드 레이어, ④ 명시도, ⑤ 선언 순서 차례로 승자를 가린다. ③ 레이어 순서가 ④ 명시도보다 먼저 판정된다.</desc>
  <rect width="880" height="704" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="24" y="24" width="220" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="134" y="49" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">선언 여러 개가</text>
  <text x="134" y="72" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">한 속성에 충돌</text>
  <line x1="134" y1="86" x2="134" y2="112" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ① 출처와 중요도 -->
  <rect x="24" y="116" width="220" height="120" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="134" y="182" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">① 출처와 중요도</text>
  <rect x="260" y="116" width="596" height="120" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="420" y="143" font-size="14" font-weight="bold" fill="#374151">강함</text>
  <line x1="458" y1="138" x2="752" y2="138" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-soft)"/>
  <text x="798" y="143" font-size="14" font-weight="bold" fill="#374151" text-anchor="end">약함</text>

  <text x="276" y="179" font-size="15" font-weight="bold" fill="#b91c1c">!important<tspan fill="#111827" font-weight="normal">끼리는</tspan></text>
  <rect x="420" y="160" width="110" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="475" y="179" font-size="15" fill="#111827" text-anchor="middle">브라우저 기본</text>
  <text x="542" y="179" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">&gt;</text>
  <rect x="554" y="160" width="110" height="28" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <text x="609" y="179" font-size="15" fill="#111827" text-anchor="middle">사용자</text>
  <text x="676" y="179" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">&gt;</text>
  <rect x="688" y="160" width="110" height="28" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="743" y="179" font-size="15" fill="#111827" text-anchor="middle">작성자</text>

  <text x="276" y="217" font-size="15" font-weight="bold" fill="#111827">일반 선언<tspan font-weight="normal">끼리는</tspan></text>
  <rect x="420" y="198" width="110" height="28" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="475" y="217" font-size="15" fill="#111827" text-anchor="middle">작성자</text>
  <text x="542" y="217" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">&gt;</text>
  <rect x="554" y="198" width="110" height="28" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <text x="609" y="217" font-size="15" fill="#111827" text-anchor="middle">사용자</text>
  <text x="676" y="217" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">&gt;</text>
  <rect x="688" y="198" width="110" height="28" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="743" y="217" font-size="15" fill="#111827" text-anchor="middle">브라우저 기본</text>

  <line x1="134" y1="238" x2="134" y2="264" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="146" y="257" font-size="14" fill="#4b5563">같으면</text>

  <!-- ② 인라인 스타일 -->
  <rect x="24" y="268" width="220" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="134" y="302" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">② 인라인 스타일</text>
  <rect x="260" y="268" width="596" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="276" y="301" font-size="15" fill="#111827">같은 출처·중요도 안에서는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">style="..."</tspan> 가 선택자 규칙을 이긴다</text>

  <line x1="134" y1="326" x2="134" y2="352" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="146" y="345" font-size="14" fill="#4b5563">같으면</text>

  <!-- ③ 캐스케이드 레이어 (강조) -->
  <rect x="24" y="356" width="220" height="76" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="134" y="400" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">③ 캐스케이드 레이어</text>
  <rect x="260" y="356" width="596" height="76" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="276" y="387" font-size="15" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#6d28d9">@layer</tspan> 순서. 나중에 선언된 레이어가 이긴다</text>
  <text x="276" y="413" font-size="15" fill="#111827">레이어에 안 넣은 스타일이 가장 강하다</text>

  <line x1="134" y1="434" x2="134" y2="460" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="146" y="453" font-size="14" fill="#4b5563">같으면</text>

  <!-- ④ 명시도 -->
  <rect x="24" y="464" width="220" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="134" y="498" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">④ 명시도</text>
  <rect x="260" y="464" width="596" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="276" y="497" font-size="15" fill="#111827"><tspan font-weight="bold">(ID, CLASS, TYPE)</tspan> 앞자리부터 비교</text>

  <line x1="134" y1="522" x2="134" y2="548" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="146" y="541" font-size="14" fill="#4b5563">같으면</text>

  <!-- ⑤ 선언 순서 -->
  <rect x="24" y="552" width="220" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="134" y="586" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">⑤ 선언 순서</text>
  <rect x="260" y="552" width="596" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="276" y="585" font-size="15" fill="#111827">여기까지 같으면 나중에 쓴 것이 이긴다</text>

  <!-- 핵심 -->
  <rect x="24" y="632" width="832" height="48" rx="6" fill="#f5f3ff"/>
  <rect x="24" y="632" width="6" height="48" fill="#6d28d9"/>
  <text x="48" y="662" font-size="16" font-weight="bold" fill="#6d28d9">③이 ④보다 먼저 — 레이어 순서가 명시도보다 강하다</text>
</svg>
