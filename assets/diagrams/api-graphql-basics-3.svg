<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스키마가 계약서 역할을 한다</title>
  <desc id="d">GraphQL 쿼리가 도착했을 때 파싱, 검증, 실행 단계를 거치는 흐름을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Start Box: 쿼리 도착 -->
  <rect x="360" y="30" width="160" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="57" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">쿼리 도착</text>

  <!-- Main vertical trunk -->
  <path d="M440,74 L440,290" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Step 1: 파싱 -->
  <path d="M440,120 L480,120" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="480" y="98" width="120" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="125" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">1. 파싱</text>
  <text x="620" y="124" fill="#52606d" font-size="13">문법이 맞는가</text>

  <!-- Step 2: 검증 (강조 단계) -->
  <path d="M440,205 L480,205" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="480" y="183" width="120" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="540" y="210" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">2. 검증</text>
  
  <text x="620" y="209" fill="#52606d" font-size="13">스키마에 존재하는 필드인가, 타입이 맞는가</text>
  
  <!-- Step 2 Annotation Box -->
  <rect x="618" y="222" width="222" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M628,222 L628,214" stroke="#dc2626" stroke-width="1" fill="none"/>
  <text x="628" y="239" fill="#dc2626" font-size="11.5" font-weight="bold">← 여기서 걸리면 실행 안 함</text>

  <!-- Step 3: 실행 -->
  <path d="M440,290 L480,290" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="480" y="268" width="120" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="540" y="295" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">3. 실행</text>
  <text x="620" y="294" fill="#52606d" font-size="13">리졸버 호출</text>

</svg>