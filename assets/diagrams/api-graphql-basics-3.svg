<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GraphQL 쿼리 처리 3단계</title>
  <desc id="d">도착한 쿼리는 파싱, 검증, 실행 순서로 처리된다. 검증 단계에서 스키마에 없는 필드이거나 타입이 맞지 않아 걸리면 실행하지 않는다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 스키마 (검증 기준) -->
  <rect x="452" y="24" width="120" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="512" y="50" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">스키마</text>
  <line x1="512" y1="66" x2="512" y2="92" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M506,86 L512,96 L518,86 z" fill="#6d28d9"/>

  <!-- 쿼리 도착 -->
  <rect x="32" y="100" width="120" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="92" y="156" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">쿼리 도착</text>

  <line x1="154" y1="150" x2="188" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 1. 파싱 -->
  <rect x="192" y="100" width="160" height="100" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="272" y="138" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1. 파싱</text>
  <text x="272" y="170" font-size="15" fill="#1f2937" text-anchor="middle">문법이 맞는가</text>

  <line x1="354" y1="150" x2="388" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2. 검증 -->
  <rect x="392" y="100" width="240" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="512" y="134" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">2. 검증</text>
  <text x="512" y="162" font-size="15" fill="#1f2937" text-anchor="middle">스키마에 존재하는 필드인가,</text>
  <text x="512" y="184" font-size="15" fill="#1f2937" text-anchor="middle">타입이 맞는가</text>

  <line x1="634" y1="150" x2="684" y2="150" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="659" y="138" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">통과</text>

  <!-- 3. 실행 -->
  <rect x="688" y="100" width="160" height="100" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="768" y="138" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">3. 실행</text>
  <text x="768" y="170" font-size="15" fill="#1f2937" text-anchor="middle">리졸버 호출</text>

  <!-- 검증 실패 분기 -->
  <line x1="512" y1="202" x2="512" y2="246" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="392" y="250" width="240" height="60" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="512" y="286" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기서 걸리면 실행 안 함</text>
</svg>
