<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1NF 예시</title>
  <desc id="d">비정규형 테이블과 1NF 적용 후의 원자값 테이블 비교 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- [비정규형] 섹션 (왼쪽) -->
  <g id="non-nf">
    <rect x="40" y="30" width="360" height="280" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
    
    <!-- 섹션 타이틀 -->
    <text x="60" y="66" font-size="16" font-weight="bold" fill="#1f2933">[비정규형]</text>

    <!-- 표 헤더 -->
    <rect x="60" y="90" width="120" height="36" fill="#fef2f2" stroke="#9aa5b1" stroke-width="1"/>
    <text x="120" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">학생</text>

    <rect x="180" y="90" width="200" height="36" fill="#fef2f2" stroke="#9aa5b1" stroke-width="1"/>
    <text x="280" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">수강과목</text>

    <!-- 표 데이터 행 -->
    <rect x="60" y="126" width="120" height="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="120" y="150" font-size="13" text-anchor="middle" fill="#1f2933">홍길동</text>

    <rect x="180" y="126" width="200" height="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="280" y="150" font-size="13" text-anchor="middle" fill="#dc2626">수학, 영어, 과학</text>

    <!-- 화살표 및 라벨 (← 다중 값) -->
    <path d="M 440 146 L 390 146" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
    <rect x="382" y="134" width="2" height="24" fill="none"/>
    <text x="448" y="150" font-size="13" font-weight="bold" fill="#dc2626">← 다중 값</text>
  </g>

  <!-- [1NF] 섹션 (오른쪽) -->
  <g id="nf-1">
    <rect x="540" y="30" width="300" height="280" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>

    <!-- 섹션 타이틀 -->
    <text x="560" y="66" font-size="16" font-weight="bold" fill="#1f2933">[1NF]</text>

    <!-- 표 헤더 -->
    <rect x="560" y="90" width="110" height="36" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="615" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">학생</text>

    <rect x="670" y="90" width="150" height="36" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="745" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">수강과목</text>

    <!-- 표 데이터 행 1 -->
    <rect x="560" y="126" width="110" height="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="615" y="150" font-size="13" text-anchor="middle" fill="#1f2933">홍길동</text>

    <rect x="670" y="126" width="150" height="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="745" y="150" font-size="13" text-anchor="middle" fill="#1f2933">수학</text>

    <!-- 표 데이터 행 2 -->
    <rect x="560" y="166" width="110" height="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="615" y="190" font-size="13" text-anchor="middle" fill="#1f2933">홍길동</text>

    <rect x="670" y="166" width="150" height="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="745" y="190" font-size="13" text-anchor="middle" fill="#1f2933">영어</text>

    <!-- 표 데이터 행 3 -->
    <rect x="560" y="206" width="110" height="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="615" y="230" font-size="13" text-anchor="middle" fill="#1f2933">홍길동</text>

    <rect x="670" y="206" width="150" height="40" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="745" y="230" font-size="13" text-anchor="middle" fill="#1f2933">과학</text>
  </g>
</svg>