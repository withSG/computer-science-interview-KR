<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1NF 예시</title>
  <desc id="d">비정규형 표에서 홍길동의 수강과목 칸에 수학, 영어, 과학이 다중 값으로 들어 있다. 1NF에서는 이 값을 한 행에 하나씩 나눠 홍길동-수학, 홍길동-영어, 홍길동-과학 세 행이 된다.</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ===== 비정규형 ===== -->
  <text x="40" y="52" font-size="18" font-weight="bold" fill="#991b1b">비정규형</text>

  <!-- 머리행 -->
  <rect x="40" y="70" width="110" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="150" y="70" width="210" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="95" y="97" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">학생</text>
  <text x="255" y="97" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">수강과목</text>

  <!-- 데이터 행 -->
  <rect x="40" y="112" width="110" height="46" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="150" y="112" width="210" height="46" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="95" y="141" font-size="16" text-anchor="middle" fill="#1f2937">홍길동</text>
  <text x="255" y="141" font-size="16" font-weight="bold" text-anchor="middle" fill="#991b1b">수학, 영어, 과학</text>

  <!-- 다중 값 표시 -->
  <path d="M255,188 V164" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="255" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">다중 값</text>
  <text x="255" y="232" font-size="15" text-anchor="middle" fill="#991b1b">(원자값 아님)</text>

  <!-- ===== 변환 화살표 ===== -->
  <text x="444" y="140" font-size="15" text-anchor="middle" fill="#374151">값마다 한 행</text>
  <path d="M384,154 H504" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ===== 1NF ===== -->
  <text x="530" y="52" font-size="18" font-weight="bold" fill="#047857">1NF</text>

  <!-- 머리행 -->
  <rect x="530" y="70" width="110" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="640" y="70" width="200" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="585" y="97" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">학생</text>
  <text x="740" y="97" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">수강과목</text>

  <!-- 행 1 -->
  <rect x="530" y="112" width="110" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="640" y="112" width="200" height="44" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/>
  <text x="585" y="140" font-size="16" text-anchor="middle" fill="#1f2937">홍길동</text>
  <text x="740" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#065f46">수학</text>

  <!-- 행 2 -->
  <rect x="530" y="156" width="110" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="640" y="156" width="200" height="44" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/>
  <text x="585" y="184" font-size="16" text-anchor="middle" fill="#1f2937">홍길동</text>
  <text x="740" y="184" font-size="16" font-weight="bold" text-anchor="middle" fill="#065f46">영어</text>

  <!-- 행 3 -->
  <rect x="530" y="200" width="110" height="44" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="640" y="200" width="200" height="44" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/>
  <text x="585" y="228" font-size="16" text-anchor="middle" fill="#1f2937">홍길동</text>
  <text x="740" y="228" font-size="16" font-weight="bold" text-anchor="middle" fill="#065f46">과학</text>

  <!-- 원자값 표시 -->
  <text x="685" y="274" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">원자값만 포함</text>
</svg>
