<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">중복 ACK와 Fast Retransmit</title>
  <desc id="d">Client가 seg1~seg5를 보내다 seg2가 유실되면 Server는 seg3, 4, 5를 받을 때마다 같은 ACK(2번 주세요)를 반복하고, Client는 3번째 중복 ACK를 받자마자 타임아웃을 기다리지 않고 seg2를 재전송해 ACK(6번 주세요)로 밀린 것까지 한 번에 확인받습니다.</desc>
  <rect width="880" height="730" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="110" y="24" width="140" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="180" y="50" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">Client</text>
  <text x="180" y="72" font-size="15" fill="#374151" text-anchor="middle">송신 측</text>
  <rect x="550" y="24" width="140" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="620" y="50" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">Server</text>
  <text x="620" y="72" font-size="15" fill="#374151" text-anchor="middle">수신 측</text>
  <line x1="180" y1="84" x2="180" y2="706" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="620" y1="84" x2="620" y2="706" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- seg1 / ACK -->
  <line x1="180" y1="130" x2="617" y2="146" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="400" y="126" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">seg1</text>
  <line x1="620" y1="176" x2="183" y2="192" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="400" y="172" font-size="15" fill="#1f2937" text-anchor="middle">ACK(2번 주세요)</text>

  <!-- seg2 유실 -->
  <line x1="180" y1="222" x2="390" y2="229.7" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M393,223 L407,237 M407,223 L393,237" stroke="#b91c1c" stroke-width="3" fill="none"/>
  <text x="284" y="215" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">seg2</text>
  <text x="416" y="236" font-size="16" font-weight="700" fill="#b91c1c">유실</text>

  <!-- seg3 / 중복 1 -->
  <line x1="180" y1="268" x2="617" y2="284" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="400" y="264" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">seg3</text>
  <line x1="620" y1="314" x2="183" y2="330" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="400" y="310" font-size="15" fill="#b45309" text-anchor="middle">ACK(2번 주세요)</text>
  <rect x="96" y="317" width="70" height="26" rx="13" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="131" y="335" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">중복 1</text>

  <!-- seg4 / 중복 2 -->
  <line x1="180" y1="360" x2="617" y2="376" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="400" y="356" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">seg4</text>
  <line x1="620" y1="406" x2="183" y2="422" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="400" y="402" font-size="15" fill="#b45309" text-anchor="middle">ACK(2번 주세요)</text>
  <rect x="96" y="409" width="70" height="26" rx="13" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="131" y="427" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">중복 2</text>

  <!-- seg5 / 중복 3 -->
  <line x1="180" y1="452" x2="617" y2="468" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="400" y="448" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">seg5</text>
  <line x1="620" y1="498" x2="183" y2="514" stroke="#b45309" stroke-width="2.5" marker-end="url(#ah-amber)"/>
  <text x="400" y="494" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">ACK(2번 주세요)</text>
  <rect x="96" y="501" width="70" height="26" rx="13" fill="#b45309"/>
  <text x="131" y="519" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">중복 3</text>

  <!-- 수신 측 동작 -->
  <path d="M640,284 h8 V498 h-8" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <text x="660" y="386" font-size="15" fill="#374151">3, 4, 5를 받을 때마다</text>
  <text x="660" y="408" font-size="15" fill="#374151">같은 ACK를 반복</text>

  <!-- Fast Retransmit 판단 -->
  <rect x="196" y="536" width="408" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="400" y="561" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">3번째 중복 ACK 수신 → Fast Retransmit</text>
  <text x="400" y="585" font-size="15" fill="#1f2937" text-anchor="middle">타임아웃을 기다리지 않고 즉시 seg2 재전송</text>

  <!-- seg2 재전송 / ACK(6) -->
  <line x1="180" y1="626" x2="616" y2="642" stroke="#047857" stroke-width="3" marker-end="url(#ah-green)"/>
  <text x="400" y="622" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">seg2 재전송</text>
  <line x1="620" y1="672" x2="184" y2="688" stroke="#047857" stroke-width="3" marker-end="url(#ah-green)"/>
  <text x="400" y="668" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">ACK(6번 주세요)</text>
  <text x="636" y="677" font-size="15" fill="#047857">밀린 것까지 한 번에 확인</text>
</svg>
