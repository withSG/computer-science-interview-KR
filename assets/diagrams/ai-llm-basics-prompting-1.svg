<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">다음 토큰 예측의 반복</title>
  <desc id="d">"대한민국의 수도는"을 넣으면 LLM이 다음 토큰 확률 분포(서울 0.87, 부산 0.04, 한국 0.03 …)를 계산하고 "서울"을 하나 뽑는다. 뽑은 토큰을 입력 끝에 붙인 "대한민국의 수도는 서울"로 다시 처음부터 같은 일을 반복해 입니다 0.62, 이다 0.21 … 분포를 얻는 자기회귀 생성 과정이다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="136" y="46" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">① 입력</text>
  <text x="336" y="46" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">② 모델</text>
  <text x="542" y="46" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">③ 다음 토큰 확률 분포</text>
  <text x="778" y="46" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">④ 하나 선택</text>

  <!-- ===== 1회차 ===== -->
  <rect x="24" y="114" width="224" height="56" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="136" y="148" font-size="16" fill="#111827" text-anchor="middle">"대한민국의 수도는"</text>

  <line x1="250" y1="142" x2="284" y2="142" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="288" y="114" width="96" height="56" rx="6" fill="#1e40af"/>
  <text x="336" y="148" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">LLM</text>

  <line x1="386" y1="142" x2="420" y2="142" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="424" y="70" width="236" height="144" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="430" y="80" width="224" height="28" rx="4" fill="#d1fae5"/>
  <text x="440" y="100" font-size="15" font-weight="bold" fill="#065f46">서울</text>
  <rect x="496" y="86" width="96" height="16" fill="#059669"/>
  <text x="646" y="100" font-size="15" font-weight="bold" fill="#065f46" text-anchor="end">0.87</text>

  <text x="440" y="131" font-size="15" fill="#111827">부산</text>
  <rect x="496" y="116" width="4" height="16" fill="#94a3b8"/>
  <text x="646" y="131" font-size="15" fill="#111827" text-anchor="end">0.04</text>

  <text x="440" y="161" font-size="15" fill="#111827">한국</text>
  <rect x="496" y="146" width="3" height="16" fill="#94a3b8"/>
  <text x="646" y="161" font-size="15" fill="#111827" text-anchor="end">0.03</text>

  <text x="440" y="191" font-size="15" fill="#4b5563">...</text>
  <text x="646" y="191" font-size="15" fill="#4b5563" text-anchor="end">...</text>

  <line x1="662" y1="142" x2="696" y2="142" stroke="#047857" stroke-width="2" marker-end="url(#ahg)"/>

  <rect x="700" y="114" width="156" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="778" y="149" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">"서울"</text>

  <!-- 되먹임: 뽑은 토큰을 입력 끝에 붙인다 -->
  <path d="M778,172 V262 H136 V313" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahg)"/>
  <text x="457" y="250" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">방금 뽑은 토큰을 붙여서 다시 처음부터</text>

  <!-- ===== 2회차 ===== -->
  <rect x="24" y="319" width="224" height="56" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="136" y="353" font-size="16" fill="#111827" text-anchor="middle">"대한민국의 수도는 <tspan font-weight="bold" fill="#047857">서울</tspan>"</text>

  <line x1="250" y1="347" x2="284" y2="347" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="288" y="319" width="96" height="56" rx="6" fill="#1e40af"/>
  <text x="336" y="353" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">LLM</text>

  <line x1="386" y1="347" x2="420" y2="347" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="424" y="290" width="236" height="114" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="321" font-size="15" fill="#111827">입니다</text>
  <rect x="496" y="306" width="68" height="16" fill="#94a3b8"/>
  <text x="646" y="321" font-size="15" fill="#111827" text-anchor="end">0.62</text>

  <text x="440" y="351" font-size="15" fill="#111827">이다</text>
  <rect x="496" y="336" width="23" height="16" fill="#94a3b8"/>
  <text x="646" y="351" font-size="15" fill="#111827" text-anchor="end">0.21</text>

  <text x="440" y="381" font-size="15" fill="#4b5563">...</text>
  <text x="646" y="381" font-size="15" fill="#4b5563" text-anchor="end">...</text>

  <line x1="662" y1="347" x2="696" y2="347" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahl)"/>

  <rect x="700" y="319" width="156" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="778" y="352" font-size="15" fill="#4b5563" text-anchor="middle">같은 일을 반복 …</text>

  <!-- 요점 -->
  <text x="440" y="444" font-size="15" fill="#374151" text-anchor="middle"><tspan font-weight="bold" fill="#111827">자기회귀 생성</tspan>: 뽑은 토큰을 입력 끝에 붙여 같은 일을 반복한다</text>
</svg>
