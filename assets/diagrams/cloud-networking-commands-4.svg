<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">dig 응답 읽는 법</title>
  <desc id="d">dig +noall +answer +comments example.com 출력에서 먼저 볼 status(NOERROR), ANSWER 줄의 TTL 300초(캐시가 남아 있는 시간)와 실제 응답 IP 93.184.216.34를 짚어 준다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <rect x="110" y="24" width="660" height="282" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="138" y="62" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" textLength="445.2" lengthAdjust="spacing"><tspan fill="#4b5563">$ </tspan><tspan fill="#111827" font-weight="bold">dig +noall +answer +comments example.com</tspan></text>
  <text x="138" y="96" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#4b5563" textLength="318" lengthAdjust="spacing">;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY,</text>
  <text x="466.6" y="96" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#b45309" font-weight="bold" textLength="159" lengthAdjust="spacing">status: NOERROR</text>
  <text x="625.6" y="96" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#4b5563" textLength="116.6" lengthAdjust="spacing">, id: 12345</text>
  <path d="M467.6,104 v6 H624.6 v-6 M546.1,110 V118" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="546.1" y="140" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">응답 상태 — 가장 먼저 확인</text>
  <text x="138" y="176" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#4b5563" textLength="190.8" lengthAdjust="spacing">;; ANSWER SECTION:</text>
  <text x="138" y="210" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#111827" textLength="127.2" lengthAdjust="spacing">example.com.</text>
  <text x="297" y="210" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#1d4ed8" font-weight="bold" textLength="31.8" lengthAdjust="spacing">300</text>
  <text x="350" y="210" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#111827" textLength="21.2" lengthAdjust="spacing">IN</text>
  <text x="392.4" y="210" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#111827" textLength="10.6" lengthAdjust="spacing">A</text>
  <text x="424.2" y="210" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#047857" font-weight="bold" textLength="137.8" lengthAdjust="spacing">93.184.216.34</text>
  <path d="M425.2,218 v6 H561 v-6 M493.1,224 V236" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="493.1" y="258" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">실제 응답 IP</text>
  <path d="M298,218 v6 H327.8 v-6 M312.9,224 V283" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M312.9,283 H326.9" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="334.9" y="289" font-size="16" font-weight="bold" fill="#1d4ed8">TTL(초). 캐시가 남아 있는 시간</text>
</svg>
