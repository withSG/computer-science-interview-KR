<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Histogram — 분포를 버킷으로</title>
  <desc id="d">프로메테우스 히스토그램 메트릭 표현 방식과 버킷별 분포 및 p99 생성 원인을 보여주는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Left Side: Metric Names & Values -->
  <!-- Line 1 -->
  <text x="30" y="44" font-size="13" fill="#1f2933">..._bucket{le="0.1"}</text>
  <text x="210" y="44" font-size="13" fill="#1f2933" font-weight="bold">1200</text>
  <text x="260" y="44" font-size="13" fill="#52606d">← 0.1초 이하 1200건</text>

  <!-- Line 2 -->
  <text x="30" y="84" font-size="13" fill="#1f2933">..._bucket{le="0.3"}</text>
  <text x="210" y="84" font-size="13" fill="#1f2933" font-weight="bold">1850</text>
  <text x="260" y="84" font-size="13" fill="#52606d">← 0.3초 이하 (누적)</text>

  <!-- Line 3 -->
  <text x="30" y="124" font-size="13" fill="#1f2933">..._bucket{le="1.0"}</text>
  <text x="210" y="124" font-size="13" fill="#1f2933" font-weight="bold">1980</text>

  <!-- Line 4 -->
  <text x="30" y="164" font-size="13" fill="#1f2933">..._bucket{le="+Inf"}</text>
  <text x="210" y="164" font-size="13" fill="#1f2933" font-weight="bold">2000</text>
  <text x="260" y="164" font-size="13" fill="#52606d">← 전체</text>

  <!-- Line 5 -->
  <text x="30" y="214" font-size="13" fill="#1f2933">..._sum</text>
  <text x="210" y="214" font-size="13" fill="#1f2933" font-weight="bold">412.7</text>
  <text x="260" y="214" font-size="13" fill="#52606d">← 관측치 합</text>

  <!-- Line 6 -->
  <text x="30" y="254" font-size="13" fill="#1f2933">..._count</text>
  <text x="210" y="254" font-size="13" fill="#1f2933" font-weight="bold">2000</text>
  <text x="260" y="254" font-size="13" fill="#52606d">← 관측치 개수</text>

  <!-- Right Side: Histogram Visualizations & Annotations -->
  <!-- Bar 1 -->
  <text x="470" y="44" font-size="13" fill="#1f2933">0 ─ 0.1초</text>
  <rect x="560" y="30" width="240" height="18" fill="#2563eb" rx="2"/>
  <text x="810" y="44" font-size="13" fill="#1f2933" font-weight="bold">1200</text>

  <!-- Bar 2 -->
  <text x="470" y="84" font-size="13" fill="#1f2933">0.1 ─ 0.3초</text>
  <rect x="560" y="70" width="130" height="18" fill="#2563eb" rx="2"/>
  <text x="700" y="84" font-size="13" fill="#1f2933" font-weight="bold">650</text>

  <!-- Bar 3 -->
  <text x="470" y="124" font-size="13" fill="#1f2933">0.3 ─ 1.0초</text>
  <rect x="560" y="110" width="26" height="18" fill="#2563eb" rx="2"/>
  <text x="596" y="124" font-size="13" fill="#1f2933" font-weight="bold">130</text>

  <!-- Bar 4 (Highlighted) -->
  <text x="470" y="164" font-size="13" fill="#1f2933">1.0초 초과</text>
  <rect x="560" y="150" width="8" height="18" fill="#dc2626" rx="2"/>
  <text x="578" y="164" font-size="13" fill="#dc2626" font-weight="bold">20</text>

  <!-- Pointer and Annotation for Highlighted Bar -->
  <path d="M564,212 L564,178" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <text x="564" y="235" font-size="13" fill="#dc2626" font-weight="bold" text-anchor="middle">이 20건이 p99를 만든다</text>
</svg>