<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">약한 세대 가설 (Weak Generational Hypothesis)</title>
  <desc id="d">Java Heap의 Young Generation(Eden, S0, S1)과 Old Generation 구조 및 Minor/Major GC 대상 및 승격 과정을 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- Main Outer Box: Heap -->
  <g>
    <!-- Background Header/Title for Heap -->
    <rect x="40" y="30" width="800" height="260" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
    <text x="440" y="52" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Heap</text>

    <!-- Young Generation Container -->
    <rect x="60" y="65" width="410" height="205" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="265" y="87" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Young Generation</text>

    <!-- Sub-regions in Young Gen: Eden, S0, S1 -->
    <g>
      <!-- Eden -->
      <rect x="80" y="100" width="180" height="75" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="2"/>
      <text x="170" y="142" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Eden</text>

      <!-- S0 (from) -->
      <rect x="260" y="100" width="95" height="75" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="2"/>
      <text x="307" y="133" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">S0</text>
      <text x="307" y="152" font-size="11.5" fill="#52606d" text-anchor="middle">(from)</text>

      <!-- S1 (to) -->
      <rect x="355" y="100" width="95" height="75" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="2"/>
      <text x="402" y="133" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">S1</text>
      <text x="402" y="152" font-size="11.5" fill="#52606d" text-anchor="middle">(to)</text>
    </g>

    <!-- Annotations & Arrows inside Young Gen -->
    <!-- Upward arrow to Eden -->
    <path d="M170,222 L170,182" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="170" y="238" font-size="13" fill="#1f2933" text-anchor="middle">새 객체는</text>
    <text x="170" y="255" font-size="13" fill="#1f2933" text-anchor="middle">여기 할당</text>

    <!-- Bidirectional vertical arrow between S0/S1 area -->
    <path d="M355,182 L355,222" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <path d="M355,222 L355,182" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="355" y="238" font-size="13" fill="#1f2933" text-anchor="middle">살아남으면</text>
    <text x="355" y="255" font-size="13" fill="#1f2933" text-anchor="middle">S0↔S1 왕복</text>

    <!-- Old Generation Container -->
    <rect x="490" y="65" width="330" height="205" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
    <text x="655" y="87" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Old Generation</text>

    <text x="655" y="133" font-size="13" fill="#1f2933" text-anchor="middle">Young에서 여러 번</text>
    <text x="655" y="152" font-size="13" fill="#1f2933" text-anchor="middle">살아남은 객체들</text>

    <!-- Upward arrow inside Old Gen: age 초과 시 승격 -->
    <path d="M655,222 L655,177" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <rect x="590" y="228" width="130" height="22" fill="#ffffff" rx="3"/>
    <text x="655" y="243" font-size="13" fill="#7c3aed" font-weight="bold" text-anchor="middle">age 초과 시 승격</text>
  </g>

  <!-- External Descriptions below Heap Box -->
  <g>
    <!-- Left: Minor GC -->
    <rect x="130" y="308" width="270" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="265" y="329" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Minor GC 대상 (자주, 빠름)</text>

    <!-- Right: Major GC -->
    <rect x="510" y="308" width="290" height="32" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="4"/>
    <text x="655" y="329" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">Major GC 대상 (드물게, 느림)</text>
  </g>
</svg>