<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Heap의 세대 구분</title>
  <desc id="d">Heap은 Young Generation(Eden, S0, S1)과 Old Generation으로 나뉜다. 새 객체는 Eden에 할당되고, 살아남으면 S0와 S1을 오가며, age를 넘기면 Old로 승격된다. Young은 자주·빠른 Minor GC, Old는 드물고 느린 Major GC의 대상이다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- Heap -->
  <rect x="24" y="24" width="832" height="352" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="44" y="54" font-size="18" font-weight="bold" fill="#111827">Heap</text>

  <!-- Young Generation -->
  <rect x="44" y="72" width="424" height="284" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="64" y="100" font-size="17" font-weight="bold" fill="#1d4ed8">Young Generation</text>

  <rect x="64" y="120" width="384" height="100" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="224" y1="120" x2="224" y2="220" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="336" y1="120" x2="336" y2="220" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="144" y="176" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Eden</text>
  <text x="280" y="166" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">S0</text>
  <text x="280" y="190" font-size="15" fill="#4b5563" text-anchor="middle">(from)</text>
  <text x="392" y="166" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">S1</text>
  <text x="392" y="190" font-size="15" fill="#4b5563" text-anchor="middle">(to)</text>

  <!-- 새 객체 할당 -->
  <path d="M144,258 V226" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#ar-blue)"/>
  <text x="144" y="282" font-size="15" fill="#111827" text-anchor="middle">새 객체는 여기 할당</text>

  <!-- S0 ↔ S1 왕복 -->
  <path d="M280,226 V248 H392 V226" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-start="url(#ar-blue)" marker-end="url(#ar-blue)"/>
  <text x="336" y="282" font-size="15" fill="#111827" text-anchor="middle">살아남으면 S0↔S1 왕복</text>

  <!-- Minor GC 대상 -->
  <rect x="56" y="300" width="400" height="44" rx="6" fill="#dbeafe"/>
  <text x="256" y="328" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Minor GC 대상 (자주, 빠름)</text>

  <!-- 승격 -->
  <text x="526" y="134" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">age 초과 시</text>
  <text x="526" y="154" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">승격</text>

  <!-- Old Generation -->
  <rect x="584" y="72" width="252" height="284" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="604" y="100" font-size="17" font-weight="bold" fill="#6d28d9">Old Generation</text>
  <rect x="604" y="120" width="212" height="164" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="710" y="196" font-size="16" fill="#111827" text-anchor="middle">Young에서 여러 번</text>
  <text x="710" y="220" font-size="16" fill="#111827" text-anchor="middle">살아남은 객체들</text>

  <!-- 승격 화살표 (Old 박스 위에 그려야 화살촉이 보임) -->
  <path d="M452,170 H598" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ar-purple)"/>

  <!-- Major GC 대상 -->
  <rect x="596" y="300" width="228" height="44" rx="6" fill="#ede9fe"/>
  <text x="710" y="328" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Major GC 대상 (드물게, 느림)</text>
</svg>
