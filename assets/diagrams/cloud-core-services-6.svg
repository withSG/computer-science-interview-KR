<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Redis 운영 방식 스펙트럼</title>
  <desc id="d">직접 운영에서 관리형으로 갈수록 통제권 축에서 관리형 쪽으로, 운영 부담은 높음에서 낮음으로 이동한다. Redis를 EC2에 직접 설치, ECS/EKS에 컨테이너로 배포, ElastiCache 관리형으로 쓰는 세 방식의 특징을 비교한다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 축 1: 통제권 -->
  <text x="152" y="52" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">직접 운영</text>
  <line x1="392" y1="46" x2="208" y2="46" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="440" y="52" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">통제권</text>
  <line x1="488" y1="46" x2="672" y2="46" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="728" y="52" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">관리형</text>

  <!-- 축 2: 운영 부담 -->
  <text x="152" y="92" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">높음</text>
  <line x1="392" y1="86" x2="208" y2="86" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="440" y="92" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">운영 부담</text>
  <line x1="488" y1="86" x2="672" y2="86" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="728" y="92" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">낮음</text>

  <!-- 카드 1: EC2 직접 설치 -->
  <rect x="24" y="120" width="256" height="186" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M34,120 H270 A10,10 0 0 1 280,130 V192 H24 V130 A10,10 0 0 1 34,120 Z" fill="#fff7ed"/>
  <line x1="24" y1="192" x2="280" y2="192" stroke="#c2410c" stroke-width="1"/>
  <text x="152" y="151" font-size="17" font-weight="700" fill="#9a3412" text-anchor="middle">EC2에 직접 설치</text>
  <text x="152" y="176" font-size="15" fill="#7c2d12" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">redis-server</text>
  <circle cx="46" cy="217" r="3" fill="#9a3412"/>
  <text x="58" y="222" font-size="15" fill="#1f2937">버전/설정 자유</text>
  <circle cx="46" cy="247" r="3" fill="#9a3412"/>
  <text x="58" y="252" font-size="15" fill="#1f2937">백업·HA 직접 구현</text>
  <circle cx="46" cy="277" r="3" fill="#9a3412"/>
  <text x="58" y="282" font-size="15" fill="#1f2937">장애 시 내가 대응</text>

  <!-- 카드 2: ECS/EKS 컨테이너 -->
  <rect x="312" y="120" width="256" height="186" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M322,120 H558 A10,10 0 0 1 568,130 V192 H312 V130 A10,10 0 0 1 322,120 Z" fill="#eff6ff"/>
  <line x1="312" y1="192" x2="568" y2="192" stroke="#1d4ed8" stroke-width="1"/>
  <text x="440" y="151" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">ECS/EKS에 컨테이너로</text>
  <text x="440" y="176" font-size="15" fill="#1e3a8a" text-anchor="middle">Redis 배포</text>
  <circle cx="334" cy="217" r="3" fill="#1e3a8a"/>
  <text x="346" y="222" font-size="15" fill="#1f2937">오케스트레이션 활용</text>
  <circle cx="334" cy="247" r="3" fill="#1e3a8a"/>
  <text x="346" y="252" font-size="15" fill="#1f2937">여전히 HA는 직접</text>

  <!-- 카드 3: ElastiCache -->
  <rect x="600" y="120" width="256" height="186" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M610,120 H846 A10,10 0 0 1 856,130 V192 H600 V130 A10,10 0 0 1 610,120 Z" fill="#ecfdf5"/>
  <line x1="600" y1="192" x2="856" y2="192" stroke="#047857" stroke-width="1"/>
  <text x="728" y="151" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">ElastiCache</text>
  <text x="728" y="176" font-size="15" fill="#065f46" text-anchor="middle">(관리형)</text>
  <circle cx="622" cy="217" r="3" fill="#065f46"/>
  <text x="634" y="222" font-size="15" fill="#1f2937">백업·패치·페일오버<tspan x="634" dy="22">AWS가 담당</tspan></text>
  <circle cx="622" cy="277" r="3" fill="#065f46"/>
  <text x="634" y="282" font-size="15" fill="#1f2937">세부 설정 제한</text>
</svg>
