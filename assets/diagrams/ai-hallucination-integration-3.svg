<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로덕션 통합 파이프라인</title>
  <desc id="d">사용자 요청부터 로깅까지의 LLM 프로덕션 통합 흐름을 나타낸 파이프라인 다이어그램입니다.</desc>
  <rect width="880" height="780" fill="#ffffff"/>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Main Vertical Trunk Line -->
  <path d="M 80,40 L 80,720" stroke="#1f2933" stroke-width="2" fill="none"/>

  <!-- Top Input Node -->
  <rect x="30" y="20" width="100" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="80" y="44.9" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자 요청</text>

  <!-- Branch 1: 입력 검증 · PII 마스킹 · 인젝션 방어 -->
  <path d="M 80,100 L 130,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="130" y="80" width="300" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="104.55" font-size="13" fill="#1f2933" text-anchor="middle">입력 검증 · PII 마스킹 · 인젝션 방어</text>

  <!-- Branch 2: 캐시 조회 -->
  <path d="M 80,170 L 130,170" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="130" y="150" width="120" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="190" y="174.55" font-size="13" fill="#1f2933" text-anchor="middle">캐시 조회</text>

  <!-- Cache hit -> 즉시 응답 -->
  <path d="M 250,170 L 390,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="295" y="161" width="30" height="18" fill="#ffffff"/>
  <text x="310" y="174.025" font-size="11.5" fill="#2563eb" text-anchor="middle">hit</text>

  <rect x="390" y="150" width="100" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="174.55" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold">즉시 응답</text>

  <!-- Cache miss -> 예산/쿼터 확인 -->
  <path d="M 190,190 L 190,240" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="175" y="206" width="30" height="18" fill="#ffffff"/>
  <text x="190" y="219.025" font-size="11.5" fill="#52606d" text-anchor="middle">miss</text>

  <!-- Branch 3: 예산/쿼터 확인 -->
  <path d="M 80,260 L 130,260" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="130" y="240" width="140" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="200" y="264.55" font-size="13" fill="#1f2933" text-anchor="middle">예산/쿼터 확인</text>

  <!-- 예산/쿼터 초과 -> 429 응답 또는 큐잉 -->
  <path d="M 270,260 L 390,260" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="305" y="251" width="35" height="18" fill="#ffffff"/>
  <text x="322.5" y="264.025" font-size="11.5" fill="#d97706" text-anchor="middle">초과</text>

  <rect x="390" y="240" width="170" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="475" y="264.55" font-size="13" fill="#d97706" text-anchor="middle">429 응답 또는 큐잉</text>

  <!-- 예산/쿼터 통과 -> LLM 호출 -->
  <path d="M 200,280 L 200,330" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="185" y="296" width="30" height="18" fill="#ffffff"/>
  <text x="200" y="309.025" font-size="11.5" fill="#52606d" text-anchor="middle">통과</text>

  <!-- Branch 4: LLM 호출 -->
  <path d="M 80,350 L 130,350" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="130" y="330" width="410" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="335" y="354.55" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">LLM 호출 (타임아웃 · 재시도 · 서킷 브레이커 · 스트리밍)</text>

  <!-- LLM 실패 지속 -> 폴백 -->
  <path d="M 335,370 L 335,420 L 390,420" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="295" y="411" width="60" height="18" fill="#ffffff"/>
  <text x="325" y="424.025" font-size="11.5" fill="#dc2626" text-anchor="middle">실패 지속</text>

  <rect x="390" y="400" width="370" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="575" y="424.55" font-size="13" fill="#dc2626" text-anchor="middle">폴백(캐시된 답 / 축소 모델 / 안내 문구)</text>

  <!-- Branch 5: 출력 검증 -->
  <path d="M 80,490 L 130,490" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="130" y="470" width="310" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="285" y="494.55" font-size="13" fill="#1f2933" text-anchor="middle">출력 검증 (스키마 · 인용 대조 · 정책 필터)</text>

  <!-- Branch 6: 응답 + 캐시 저장 -->
  <path d="M 80,570 L 130,570" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="130" y="550" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="220" y="574.55" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold">응답 + 캐시 저장</text>

  <!-- Branch 7: 로깅 -> 대시보드/알림 -->
  <path d="M 80,650 L 130,650" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="130" y="630" width="330" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="295" y="654.55" font-size="13" fill="#1f2933" text-anchor="middle">로깅 (토큰 수, 지연, finish_reason, 비용)</text>

  <path d="M 460,650 L 520,650" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="520" y="630" width="110" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="575" y="654.55" font-size="13" fill="#1f2933" text-anchor="middle">대시보드/알림</text>
</svg>