<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LLM 프로덕션 통합 흐름</title>
  <desc id="d">사용자 요청이 입력 검증, 캐시 조회, 예산/쿼터 확인, LLM 호출, 출력 검증, 응답과 캐시 저장, 로깅 순서로 지나가고, 캐시 hit·쿼터 초과·실패 지속일 때 오른쪽으로 빠지는 분기를 보여 주는 그림.</desc>
  <rect width="880" height="770" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 주 흐름 화살표 -->
  <g stroke="#4b5563" stroke-width="2" marker-end="url(#arr)">
    <line x1="266" y1="68" x2="266" y2="106"/>
    <line x1="266" y1="156" x2="266" y2="194"/>
    <line x1="266" y1="244" x2="266" y2="286"/>
    <line x1="266" y1="336" x2="266" y2="378"/>
    <line x1="266" y1="444" x2="266" y2="482"/>
    <line x1="266" y1="548" x2="266" y2="586"/>
    <line x1="266" y1="636" x2="266" y2="674"/>
  </g>
  <text x="280" y="271" font-size="15" fill="#4b5563">miss</text>
  <text x="280" y="363" font-size="15" fill="#4b5563">통과</text>

  <!-- 분기 화살표 -->
  <g stroke="#4b5563" stroke-width="2" marker-end="url(#arr)">
    <line x1="456" y1="220" x2="578" y2="220"/>
    <line x1="456" y1="312" x2="578" y2="312"/>
    <line x1="456" y1="412" x2="578" y2="412"/>
    <line x1="456" y1="708" x2="578" y2="708"/>
  </g>
  <text x="517" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">hit</text>
  <text x="517" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">초과</text>
  <text x="517" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">실패 지속</text>

  <!-- 시작 -->
  <rect x="166" y="24" width="200" height="44" rx="22" fill="#1f2937"/>
  <text x="266" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">사용자 요청</text>

  <!-- 1 입력 검증 -->
  <circle cx="44" cy="132" r="14" fill="#374151"/>
  <text x="44" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <rect x="76" y="108" width="380" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="266" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">입력 검증 · PII 마스킹 · 인젝션 방어</text>

  <!-- 2 캐시 조회 -->
  <circle cx="44" cy="220" r="14" fill="#374151"/>
  <text x="44" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <rect x="76" y="196" width="380" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="266" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">캐시 조회</text>
  <rect x="580" y="196" width="276" height="48" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="718" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#064e3b">즉시 응답</text>

  <!-- 3 예산/쿼터 확인 -->
  <circle cx="44" cy="312" r="14" fill="#374151"/>
  <text x="44" y="317" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <rect x="76" y="288" width="380" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="266" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">예산/쿼터 확인</text>
  <rect x="580" y="288" width="276" height="48" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="718" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">429 응답 또는 큐잉</text>

  <!-- 4 LLM 호출 -->
  <circle cx="44" cy="412" r="14" fill="#374151"/>
  <text x="44" y="417" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <rect x="76" y="380" width="380" height="64" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="266" y="406" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">LLM 호출</text>
  <text x="266" y="430" text-anchor="middle" font-size="15" fill="#312e81">타임아웃 · 재시도 · 서킷 브레이커 · 스트리밍</text>
  <rect x="580" y="380" width="276" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="718" y="406" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">폴백</text>
  <text x="718" y="430" text-anchor="middle" font-size="15" fill="#78350f">캐시된 답 / 축소 모델 / 안내 문구</text>

  <!-- 5 출력 검증 -->
  <circle cx="44" cy="516" r="14" fill="#374151"/>
  <text x="44" y="521" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <rect x="76" y="484" width="380" height="64" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="266" y="510" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">출력 검증</text>
  <text x="266" y="534" text-anchor="middle" font-size="15" fill="#374151">스키마 · 인용 대조 · 정책 필터</text>

  <!-- 6 응답 + 캐시 저장 -->
  <circle cx="44" cy="612" r="14" fill="#374151"/>
  <text x="44" y="617" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text>
  <rect x="76" y="588" width="380" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="266" y="618" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">응답 + 캐시 저장</text>

  <!-- 7 로깅 -->
  <circle cx="44" cy="708" r="14" fill="#374151"/>
  <text x="44" y="713" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">7</text>
  <rect x="76" y="676" width="380" height="64" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="266" y="702" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">로깅</text>
  <text x="266" y="726" text-anchor="middle" font-size="15" fill="#374151">토큰 수, 지연, <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">finish_reason</tspan>, 비용</text>
  <rect x="580" y="684" width="276" height="48" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="718" y="714" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">대시보드/알림</text>
</svg>
