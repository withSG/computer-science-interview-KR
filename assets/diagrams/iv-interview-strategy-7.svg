<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">한 주제가 3단계까지 파이는 모양</title>
  <desc id="d">Q1부터 Q4까지 질문이 깊어지는 계단형 꼬리 질문 구조도</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 연결 L자 브랜치 선 (10px 라운딩으로 깔끔한 계단 연출) -->
  <path d="M 120 70 L 120 100 L 140 100" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 230 140 L 230 170 L 250 170" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 340 210 L 340 240 L 360 240" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Level 1: Q1 -->
  <g id="node-q1">
    <rect x="40" y="30" width="40" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="54" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Q1</text>
    
    <rect x="90" y="30" width="300" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="106" y="54" font-size="13" fill="#1f2933">"이벤트 루프를 설명해주세요"</text>
    
    <path d="M 400 50 L 460 50" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    
    <rect x="470" y="30" width="180" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="560" y="54" font-size="13" fill="#52606d" text-anchor="middle">암기로 통과</text>
  </g>

  <!-- Level 2: Q2 -->
  <g id="node-q2">
    <rect x="150" y="100" width="40" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="170" y="124" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Q2</text>
    
    <rect x="200" y="100" width="370" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="216" y="124" font-size="13" fill="#1f2933">"태스크 큐와 마이크로태스크 큐의 차이는?"</text>
    
    <path d="M 580 120 L 640 120" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    
    <rect x="650" y="100" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="740" y="124" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">이해했으면 통과</text>
  </g>

  <!-- Level 3: Q3 -->
  <g id="node-q3">
    <rect x="260" y="170" width="40" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="280" y="194" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Q3</text>
    
    <rect x="310" y="162" width="330" height="56" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="326" y="184" font-size="13" fill="#1f2933">"그럼 setTimeout(fn, 0)과 Promise.then(fn)</text>
    <text x="336" y="204" font-size="13" fill="#1f2933">중 뭐가 먼저 실행되나요? 왜죠?"</text>
    
    <path d="M 650 190 L 670 190" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    
    <rect x="680" y="170" width="180" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="770" y="194" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">원리를 알아야 통과</text>
  </g>

  <!-- Level 4: Q4 -->
  <g id="node-q4">
    <rect x="370" y="240" width="40" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="390" y="264" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Q4</text>
    
    <rect x="420" y="232" width="240" height="56" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="436" y="254" font-size="13" fill="#1f2933">"그 순서 때문에 실무에서</text>
    <text x="446" y="274" font-size="13" fill="#1f2933">문제가 됐던 경험이 있나요?"</text>
    
    <path d="M 670 260 L 680 260" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    
    <rect x="690" y="240" width="170" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="775" y="264" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">경험이 있어야 통과</text>
  </g>
</svg>