<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">한 주제가 3단계까지 파이는 모양</title>
  <desc id="d">이벤트 루프 한 주제에서 Q1부터 Q4까지 꼬리 질문이 한 단계씩 깊어지고, 통과 조건도 암기, 이해, 원리, 경험 순으로 높아진다. Q3까지가 대개 신입에게 기대하는 선이고 Q4는 가산점이다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="24" y="44" font-size="15" fill="#374151">꼬리 질문 · 답이 맞으면 한 단계 더 깊이</text>
  <text x="756" y="44" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">통과하려면</text>

  <!-- 트리 연결선 -->
  <path d="M44,108 V160 H66" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M88,180 V240 H110" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M132,260 V380 H154" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Q1 -->
  <rect x="24" y="68" width="40" height="40" rx="8" fill="#1e3a8a"/>
  <text x="44" y="93.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Q1</text>
  <rect x="76" y="64" width="540" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="92" y="93.6" font-size="16" fill="#111827">"이벤트 루프를 설명해주세요"</text>
  <line x1="620" y1="88" x2="652" y2="88" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="656" y="64" width="200" height="48" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="756" y="94.3" font-size="16" fill="#1e3a8a" text-anchor="middle"><tspan font-size="18" font-weight="bold">암기</tspan>로 통과</text>

  <!-- Q2 -->
  <rect x="68" y="140" width="40" height="40" rx="8" fill="#1e3a8a"/>
  <text x="88" y="165.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Q2</text>
  <rect x="120" y="136" width="496" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="136" y="165.6" font-size="16" fill="#111827">"태스크 큐와 마이크로태스크 큐의 차이는?"</text>
  <line x1="620" y1="160" x2="652" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="656" y="136" width="200" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="756" y="166.3" font-size="16" fill="#1e3a8a" text-anchor="middle"><tspan font-size="18" font-weight="bold">이해</tspan>했으면 통과</text>

  <!-- Q3 -->
  <rect x="112" y="220" width="40" height="40" rx="8" fill="#1e3a8a"/>
  <text x="132" y="245.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Q3</text>
  <rect x="164" y="208" width="452" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text font-size="16" fill="#111827">
    <tspan x="180" y="233.6">"그럼 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTimeout(fn, 0)</tspan>과 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Promise.then(fn)</tspan></tspan>
    <tspan x="180" y="257.6">중 뭐가 먼저 실행되나요? 왜죠?"</tspan>
  </text>
  <line x1="620" y1="240" x2="652" y2="240" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="656" y="216" width="200" height="48" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="756" y="246.3" font-size="16" fill="#1e3a8a" text-anchor="middle"><tspan font-size="18" font-weight="bold">원리</tspan>를 알아야 통과</text>

  <!-- 신입 기대선 -->
  <line x1="24" y1="312" x2="856" y2="312" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="856" y="303" font-size="15" fill="#1e3a8a" text-anchor="end">▲ Q3까지가 대개 <tspan font-weight="bold">신입에게 기대하는 선</tspan></text>
  <text x="856" y="333" font-size="15" fill="#5b21b6" text-anchor="end">▼ Q4는 있으면 <tspan font-weight="bold">가산점</tspan></text>

  <!-- Q4 -->
  <rect x="156" y="360" width="40" height="40" rx="8" fill="#1e3a8a"/>
  <text x="176" y="385.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Q4</text>
  <rect x="208" y="348" width="408" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text font-size="16" fill="#111827">
    <tspan x="224" y="373.6">"그 순서 때문에 실무에서</tspan>
    <tspan x="224" y="397.6">문제가 됐던 경험이 있나요?"</tspan>
  </text>
  <line x1="620" y1="380" x2="652" y2="380" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="656" y="356" width="200" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="756" y="386.3" font-size="16" fill="#5b21b6" text-anchor="middle"><tspan font-size="18" font-weight="bold">경험</tspan>이 있어야 통과</text>
</svg>
