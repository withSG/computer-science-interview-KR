<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">React와 Svelte의 갱신 작업 시점</title>
  <desc id="d">React는 런타임에 새 트리 생성, 비교, 변경점 찾기를 매번 수행하고, Svelte는 컴파일 타임에 어디를 갱신할지 이미 확정해 런타임엔 그 코드만 실행한다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>

  <defs>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 열 배경 -->
  <rect x="132" y="24" width="280" height="282" fill="#f1f5f9"/>
  <rect x="428" y="24" width="428" height="282" fill="#f8fafc"/>

  <!-- 열 머리 -->
  <rect x="132" y="24" width="280" height="40" fill="#e2e8f0"/>
  <text x="272" y="50" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">컴파일 타임</text>
  <rect x="428" y="24" width="428" height="40" fill="#e2e8f0"/>
  <text x="642" y="50" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">런타임</text>

  <!-- 행 구분선 -->
  <line x1="24" y1="210" x2="856" y2="210" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- React 행 -->
  <text x="32" y="130" font-size="19" font-weight="bold" fill="#111827">React</text>

  <rect x="460" y="96" width="112" height="44" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="516" y="124" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">새 트리 생성</text>
  <path d="M572,118 H602" stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#ah-orange)"/>

  <rect x="606" y="96" width="76" height="44" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="644" y="124" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">비교</text>
  <path d="M682,118 H712" stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#ah-orange)"/>

  <rect x="716" y="96" width="112" height="44" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="772" y="124" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">변경점 찾기</text>

  <!-- 매번 반복 -->
  <path d="M772,140 V176 H516 V146" stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#ah-orange)"/>
  <rect x="598" y="164" width="92" height="24" fill="#f8fafc"/>
  <text x="644" y="182" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">매번 수행</text>

  <!-- Svelte 행 -->
  <text x="32" y="264" font-size="19" font-weight="bold" fill="#111827">Svelte</text>

  <rect x="152" y="226" width="240" height="64" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="272" y="252" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">어디를 갱신할지 이미 확정</text>
  <text x="272" y="276" font-size="15" fill="#065f46" text-anchor="middle">갱신 코드를 미리 생성</text>

  <path d="M392,258 H454" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>

  <rect x="460" y="236" width="168" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="544" y="264" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">그 코드만 실행</text>
  <text x="648" y="264" font-size="15" fill="#047857">트리 비교 없음</text>
</svg>
