<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">보안 인시던트 대응 5단계</title>
  <desc id="d">보안 인시던트는 탐지(Detection), 격리(Containment), 제거(Eradication), 복구(Recovery), 사후 조치(Lessons Learned) 순서로 대응하며, 단계마다 하는 일을 오른쪽에 나열했다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 순서 축 -->
  <line x1="60" y1="105" x2="60" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="60" y1="235" x2="60" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="60" y1="365" x2="60" y2="432" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="60" y1="482" x2="60" y2="536" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 1. 탐지 -->
  <circle cx="60" cy="81" r="20" fill="#1d4ed8"/>
  <text x="60" y="87" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="100" y="28" width="748" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="78" font-size="19" font-weight="bold" fill="#0f172a">탐지</text>
  <text x="124" y="100" font-size="14" fill="#4b5563">Detection</text>
  <line x1="340" y1="42" x2="340" y2="120" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="366" cy="57" r="3" fill="#475569"/>
  <text x="378" y="62" font-size="16" fill="#1f2937">WAF 알림</text>
  <circle cx="366" cy="83" r="3" fill="#475569"/>
  <text x="378" y="88" font-size="16" fill="#1f2937">비정상 로그인 시도 감지</text>
  <circle cx="366" cy="109" r="3" fill="#475569"/>
  <text x="378" y="114" font-size="16" fill="#1f2937">트래픽 이상 탐지</text>

  <!-- 2. 격리 -->
  <circle cx="60" cy="211" r="20" fill="#1d4ed8"/>
  <text x="60" y="217" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="100" y="158" width="748" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="208" font-size="19" font-weight="bold" fill="#0f172a">격리</text>
  <text x="124" y="230" font-size="14" fill="#4b5563">Containment</text>
  <line x1="340" y1="172" x2="340" y2="250" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="366" cy="187" r="3" fill="#475569"/>
  <text x="378" y="192" font-size="16" fill="#1f2937">의심 IP 차단</text>
  <circle cx="366" cy="213" r="3" fill="#475569"/>
  <text x="378" y="218" font-size="16" fill="#1f2937">계정 잠금</text>
  <circle cx="366" cy="239" r="3" fill="#475569"/>
  <text x="378" y="244" font-size="16" fill="#1f2937">영향 범위 파악</text>

  <!-- 3. 제거 -->
  <circle cx="60" cy="341" r="20" fill="#1d4ed8"/>
  <text x="60" y="347" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="100" y="288" width="748" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="338" font-size="19" font-weight="bold" fill="#0f172a">제거</text>
  <text x="124" y="360" font-size="14" fill="#4b5563">Eradication</text>
  <line x1="340" y1="302" x2="340" y2="380" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="366" cy="317" r="3" fill="#475569"/>
  <text x="378" y="322" font-size="16" fill="#1f2937">취약점 패치</text>
  <circle cx="366" cy="343" r="3" fill="#475569"/>
  <text x="378" y="348" font-size="16" fill="#1f2937">악성코드 제거</text>
  <circle cx="366" cy="369" r="3" fill="#475569"/>
  <text x="378" y="374" font-size="16" fill="#1f2937">자격증명 재발급</text>

  <!-- 4. 복구 -->
  <circle cx="60" cy="458" r="20" fill="#1d4ed8"/>
  <text x="60" y="464" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="100" y="418" width="748" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="455" font-size="19" font-weight="bold" fill="#0f172a">복구</text>
  <text x="124" y="477" font-size="14" fill="#4b5563">Recovery</text>
  <line x1="340" y1="432" x2="340" y2="484" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="366" cy="447" r="3" fill="#475569"/>
  <text x="378" y="452" font-size="16" fill="#1f2937">서비스 정상화</text>
  <circle cx="366" cy="473" r="3" fill="#475569"/>
  <text x="378" y="478" font-size="16" fill="#1f2937">모니터링 강화</text>

  <!-- 5. 사후 조치 -->
  <circle cx="60" cy="562" r="20" fill="#1d4ed8"/>
  <text x="60" y="568" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="100" y="522" width="748" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="559" font-size="19" font-weight="bold" fill="#0f172a">사후 조치</text>
  <text x="124" y="581" font-size="14" fill="#4b5563">Lessons Learned</text>
  <line x1="340" y1="536" x2="340" y2="588" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="366" cy="551" r="3" fill="#475569"/>
  <text x="378" y="556" font-size="16" fill="#1f2937">인시던트 보고서</text>
  <circle cx="366" cy="577" r="3" fill="#475569"/>
  <text x="378" y="582" font-size="16" fill="#1f2937">보안 강화 조치</text>
</svg>
