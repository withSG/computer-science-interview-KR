<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대응 프로세스</title>
  <desc id="d">탐지, 격리, 제거, 복구, 사후 조치 5단계로 구성된 보안 인시던트 대응 프로세스 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <rect width="880" height="780" fill="#ffffff"/>

  <!-- Section Title -->
  <text x="40" y="42" font-size="16" font-weight="bold" fill="#1f2933">대응 프로세스</text>

  <!-- Step 1: 탐지 -->
  <g>
    <rect x="200" y="60" width="480" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="220" y="90" font-size="14" font-weight="bold" fill="#2563eb">1. 탐지 (Detection)</text>
    <text x="240" y="115" font-size="13" fill="#1f2933">- WAF 알림</text>
    <text x="240" y="135" font-size="13" fill="#1f2933">- 비정상 로그인 시도 감지</text>
    <text x="240" y="155" font-size="13" fill="#1f2933">- 트래픽 이상 탐지</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,170 L440,200" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2: 격리 -->
  <g>
    <rect x="200" y="200" width="480" height="110" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="220" y="230" font-size="14" font-weight="bold" fill="#d97706">2. 격리 (Containment)</text>
    <text x="240" y="255" font-size="13" fill="#1f2933">- 의심 IP 차단</text>
    <text x="240" y="275" font-size="13" fill="#1f2933">- 계정 잠금</text>
    <text x="240" y="295" font-size="13" fill="#1f2933">- 영향 범위 파악</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,310 L440,340" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a-amber)"/>

  <!-- Step 3: 제거 -->
  <g>
    <rect x="200" y="340" width="480" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="220" y="370" font-size="14" font-weight="bold" fill="#dc2626">3. 제거 (Eradication)</text>
    <text x="240" y="395" font-size="13" fill="#1f2933">- 취약점 패치</text>
    <text x="240" y="415" font-size="13" fill="#1f2933">- 악성코드 제거</text>
    <text x="240" y="435" font-size="13" fill="#1f2933">- 자격증명 재발급</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,450 L440,480" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- Step 4: 복구 -->
  <g>
    <rect x="200" y="480" width="480" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="220" y="510" font-size="14" font-weight="bold" fill="#059669">4. 복구 (Recovery)</text>
    <text x="240" y="535" font-size="13" fill="#1f2933">- 서비스 정상화</text>
    <text x="240" y="555" font-size="13" fill="#1f2933">- 모니터링 강화</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,570 L440,600" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 5: 사후 조치 -->
  <g>
    <rect x="200" y="600" width="480" height="90" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="220" y="630" font-size="14" font-weight="bold" fill="#7c3aed">5. 사후 조치 (Lessons Learned)</text>
    <text x="240" y="655" font-size="13" fill="#1f2933">- 인시던트 보고서</text>
    <text x="240" y="675" font-size="13" fill="#1f2933">- 보안 강화 조치</text>
  </g>
</svg>