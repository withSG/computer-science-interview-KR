<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GitOps 원칙</title>
  <desc id="d">GitOps의 4가지 주요 원칙인 선언적, 버전 관리, 자동 적용, 지속적 조정을 설명하는 카드 형태의 다이어그램입니다.</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- Card 1: 선언적 (Declarative) - 파랑 -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="190" height="260" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="48" rx="8" fill="#2563eb"/>
    <!-- fill overlay to square bottom corners of top header -->
    <rect x="0" y="40" width="190" height="8" fill="#2563eb"/>
    <text x="95" y="30.6" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 선언적 (Declarative)</text>
    
    <text x="16" y="85.55" font-size="13" font-weight="bold" fill="#1f2933">- 원하는 상태를 코드로 정의</text>
    <text x="16" y="117.025" font-size="11.5" fill="#52606d">- YAML, HCL 등</text>
  </g>

  <!-- Card 2: 버전 관리 (Versioned) - 초록 -->
  <g transform="translate(240, 20)">
    <rect x="0" y="0" width="190" height="260" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="48" rx="8" fill="#059669"/>
    <rect x="0" y="40" width="190" height="8" fill="#059669"/>
    <text x="95" y="30.6" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 버전 관리 (Versioned)</text>
    
    <text x="16" y="85.55" font-size="13" font-weight="bold" fill="#1f2933">- 모든 변경사항 Git에 기록</text>
    <text x="16" y="117.025" font-size="11.5" fill="#52606d">- 히스토리 추적 가능</text>
  </g>

  <!-- Card 3: 자동 적용 (Automated) - 보라 -->
  <g transform="translate(450, 20)">
    <rect x="0" y="0" width="190" height="260" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="48" rx="8" fill="#7c3aed"/>
    <rect x="0" y="40" width="190" height="8" fill="#7c3aed"/>
    <text x="95" y="30.6" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 자동 적용 (Automated)</text>
    
    <text x="16" y="85.55" font-size="13" font-weight="bold" fill="#1f2933">- Git 변경 → 자동 배포</text>
    <text x="16" y="117.025" font-size="11.5" fill="#52606d">- Pull/Push 기반</text>
  </g>

  <!-- Card 4: 지속적 조정 (Reconciled) - 주황 -->
  <g transform="translate(660, 20)">
    <rect x="0" y="0" width="190" height="260" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="48" rx="8" fill="#d97706"/>
    <rect x="0" y="40" width="190" height="8" fill="#d97706"/>
    <text x="95" y="30.6" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4. 지속적 조정 (Reconciled)</text>
    
    <text x="16" y="85.55" font-size="13" font-weight="bold" fill="#1f2933">- 실제 상태와 선언 상태 비교</text>
    <text x="16" y="117.025" font-size="11.5" fill="#52606d">- 차이 발생 시 자동 복구</text>
  </g>
</svg>