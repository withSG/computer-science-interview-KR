<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GitOps 4가지 원칙</title>
  <desc id="d">GitOps의 네 원칙인 선언적(Declarative), 버전 관리(Versioned), 자동 적용(Automated), 지속적 조정(Reconciled)을 번호 순서대로 나열하고 각 원칙의 핵심 내용 두 가지를 적었습니다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 1. 선언적 -->
  <rect x="24" y="24" width="832" height="84" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M34,24.75 H273.25 V107.25 H34 A9.25,9.25 0 0 1 24.75,98 V34 A9.25,9.25 0 0 1 34,24.75 Z" fill="#eff6ff"/>
  <line x1="274" y1="24" x2="274" y2="108" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="60" cy="66" r="18" fill="#1d4ed8"/>
  <text x="60" y="72.5" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="92" y="60" font-size="19" font-weight="bold" fill="#1e3a8a">선언적</text>
  <text x="92" y="86" font-size="15" fill="#374151">Declarative</text>
  <text x="298" y="58" font-size="16" fill="#111827">• 원하는 상태를 코드로 정의</text>
  <text x="298" y="87" font-size="16" fill="#111827">• YAML, HCL 등</text>

  <!-- 2. 버전 관리 -->
  <rect x="24" y="122" width="832" height="84" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M34,122.75 H273.25 V205.25 H34 A9.25,9.25 0 0 1 24.75,196 V132 A9.25,9.25 0 0 1 34,122.75 Z" fill="#ecfdf5"/>
  <line x1="274" y1="122" x2="274" y2="206" stroke="#047857" stroke-width="1.5"/>
  <circle cx="60" cy="164" r="18" fill="#047857"/>
  <text x="60" y="170.5" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="92" y="158" font-size="19" font-weight="bold" fill="#065f46">버전 관리</text>
  <text x="92" y="184" font-size="15" fill="#374151">Versioned</text>
  <text x="298" y="156" font-size="16" fill="#111827">• 모든 변경사항 Git에 기록</text>
  <text x="298" y="185" font-size="16" fill="#111827">• 히스토리 추적 가능</text>

  <!-- 3. 자동 적용 -->
  <rect x="24" y="220" width="832" height="84" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M34,220.75 H273.25 V303.25 H34 A9.25,9.25 0 0 1 24.75,294 V230 A9.25,9.25 0 0 1 34,220.75 Z" fill="#f5f3ff"/>
  <line x1="274" y1="220" x2="274" y2="304" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="60" cy="262" r="18" fill="#6d28d9"/>
  <text x="60" y="268.5" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="92" y="256" font-size="19" font-weight="bold" fill="#4c1d95">자동 적용</text>
  <text x="92" y="282" font-size="15" fill="#374151">Automated</text>
  <text x="298" y="254" font-size="16" fill="#111827">• Git 변경 → 자동 배포</text>
  <text x="298" y="283" font-size="16" fill="#111827">• Pull 기반 (에이전트가 당김)</text>

  <!-- 4. 지속적 조정 -->
  <rect x="24" y="318" width="832" height="84" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M34,318.75 H273.25 V401.25 H34 A9.25,9.25 0 0 1 24.75,392 V328 A9.25,9.25 0 0 1 34,318.75 Z" fill="#fffbeb"/>
  <line x1="274" y1="318" x2="274" y2="402" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="60" cy="360" r="18" fill="#b45309"/>
  <text x="60" y="366.5" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="92" y="354" font-size="19" font-weight="bold" fill="#78350f">지속적 조정</text>
  <text x="92" y="380" font-size="15" fill="#374151">Reconciled</text>
  <text x="298" y="352" font-size="16" fill="#111827">• 실제 상태와 선언 상태 비교</text>
  <text x="298" y="381" font-size="16" fill="#111827">• 차이 발생 시 자동 복구</text>
</svg>
