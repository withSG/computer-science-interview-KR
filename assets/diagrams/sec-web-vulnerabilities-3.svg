<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">문자열 연결과 PreparedStatement</title>
  <desc id="d">문자열 연결은 입력을 SQL 문자열에 합친 뒤 DB 파서가 파싱하므로 입력이 문법으로 승격된다. PreparedStatement는 SQL 뼈대를 먼저 파싱해 실행 계획을 완성하고, 입력은 나중에 파라미터 바인딩으로 값 슬롯에만 들어가 문법을 바꿀 수 없다.</desc>
  <rect width="880" height="530" fill="#ffffff"/>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ===== 문자열 연결 ===== -->
  <rect x="24" y="24" width="832" height="196" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="54" font-size="18" font-weight="bold" fill="#b91c1c">문자열 연결</text>

  <rect x="44" y="72" width="140" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="114" y="98" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">입력</text>
  <text x="114" y="122" font-size="15" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">' OR '1'='1</text>

  <text x="219" y="94" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">합침</text>
  <line x1="188" y1="104" x2="248" y2="104" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>

  <rect x="254" y="72" width="160" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="334" y="110" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">SQL 문자열</text>

  <line x1="418" y1="104" x2="464" y2="104" stroke="#4b5563" stroke-width="2" marker-end="url(#ar-gray)"/>

  <rect x="470" y="72" width="140" height="64" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
  <text x="540" y="110" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">DB 파서</text>

  <line x1="614" y1="104" x2="660" y2="104" stroke="#4b5563" stroke-width="2" marker-end="url(#ar-gray)"/>

  <rect x="666" y="72" width="150" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="741" y="110" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">실행 계획</text>

  <line x1="540" y1="176" x2="540" y2="142" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>
  <text x="540" y="200" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기서 파싱될 때 입력이 문법으로 승격된다</text>

  <!-- ===== PreparedStatement ===== -->
  <rect x="24" y="244" width="832" height="262" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="44" y="274" font-size="18" font-weight="bold" fill="#047857">PreparedStatement</text>

  <!-- 1행: 뼈대 먼저 파싱 -->
  <rect x="44" y="292" width="170" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="129" y="318" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">SQL 뼈대</text>
  <text x="129" y="342" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">email = ?</text>

  <line x1="218" y1="324" x2="258" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#ar-gray)"/>

  <rect x="264" y="292" width="130" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="329" y="330" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">DB 파서</text>

  <line x1="398" y1="324" x2="438" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#ar-gray)"/>

  <rect x="444" y="292" width="170" height="64" rx="8" fill="#ffffff" stroke="#047857" stroke-width="3"/>
  <text x="529" y="330" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">실행 계획 (완성)</text>

  <!-- 2행: 입력은 나중에 바인딩 -->
  <rect x="44" y="398" width="170" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="129" y="424" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">입력</text>
  <text x="129" y="448" font-size="15" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">' OR '1'='1</text>

  <line x1="218" y1="430" x2="438" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#ar-gray)"/>

  <rect x="444" y="398" width="170" height="64" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="529" y="436" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">파라미터 바인딩</text>

  <!-- 바인딩 값이 완성된 계획의 값 슬롯으로 -->
  <path d="M618,430 H652 V324 H620" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ar-green)"/>
  <text x="666" y="382" font-size="15" font-weight="bold" fill="#047857">← 파싱이 이미 끝났다</text>

  <text x="529" y="490" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">값 슬롯에만 들어간다. 문법을 바꿀 수 없다</text>
</svg>
