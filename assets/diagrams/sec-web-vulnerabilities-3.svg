<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PreparedStatement가 하는 일</title>
  <desc id="d">문자열 연결 방식과 PreparedStatement 방식의 SQL 처리 과정을 비교하여 SQL Injection 방지 원리를 설명하는 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커: 잉크 (#1f2933) -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- 화살표 마커: 빨강 (#dc2626) -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <!-- 화살표 마커: 초록 (#059669) -->
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ==================== 구역 1: [문자열 연결] ==================== -->
  <!-- 구역 배경 및 테두리 (위험/취약점 - 빨간색 계열 연한 면) -->
  <rect x="24" y="24" width="832" height="150" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  
  <!-- Section Title -->
  <text x="44" y="52" font-size="16" font-weight="bold" fill="#dc2626">[문자열 연결]</text>

  <!-- Flow Nodes for 문자열 연결 -->
  <!-- 입력 (x: 44 ~ 124, w: 80, y: 70 ~ 110, cy: 90) -->
  <rect x="44" y="70" width="80" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="84" y="94" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">입력</text>

  <!-- SQL 문자열 (x: 230 ~ 340, w: 110, y: 70 ~ 110, cy: 90) -->
  <rect x="230" y="70" width="110" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="285" y="94" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">SQL 문자열</text>

  <!-- DB 파서 (x: 420 ~ 510, w: 90, y: 70 ~ 110, cy: 90) -->
  <rect x="420" y="70" width="90" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="465" y="94" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">DB 파서</text>

  <!-- 실행 계획 (x: 590 ~ 690, w: 100, y: 70 ~ 110, cy: 90) -->
  <rect x="590" y="70" width="100" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="640" y="94" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">실행 계획</text>

  <!-- Arrows for 문자열 연결 -->
  <!-- 입력 -> SQL 문자열 (라벨: 합침) -->
  <path d="M124,90 L230,90" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="156" y="80" width="42" height="20" fill="#fef2f2"/>
  <text x="177" y="94" font-size="11.5" fill="#dc2626" text-anchor="middle">합침</text>

  <!-- SQL 문자열 -> DB 파서 -->
  <path d="M340,90 L420,90" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- DB 파서 -> 실행 계획 -->
  <path d="M510,90 L590,90" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- DB 파서 하단 수직 화살표 & 설명 주석 -->
  <path d="M465,142 L465,110" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="465" y="157" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">여기서 파싱될 때 입력이 문법으로 승격된다</text>


  <!-- ==================== 구역 2: [PreparedStatement] ==================== -->
  <!-- 구역 배경 및 테두리 (안전/권장 - 초록색 계열 연한 면) -->
  <rect x="24" y="194" width="832" height="212" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>

  <!-- Section Title -->
  <text x="44" y="222" font-size="16" font-weight="bold" fill="#059669">[PreparedStatement]</text>

  <!-- Flow Nodes & Paths (윗줄: SQL 뼈대 -> DB 파서 -> 실행 계획 (완성)) -->
  <!-- SQL 뼈대 (x: 44 ~ 134, w: 90, y: 240 ~ 280, cy: 260) -->
  <rect x="44" y="240" width="90" height="40" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="89" y="264" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">SQL 뼈대</text>

  <!-- DB 파서 (x: 214 ~ 304, w: 90, y: 240 ~ 280, cy: 260) -->
  <rect x="214" y="240" width="90" height="40" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="259" y="264" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">DB 파서</text>

  <!-- 실행 계획 (완성) (x: 384 ~ 534, w: 150, y: 240 ~ 280, cy: 260) -->
  <rect x="384" y="240" width="150" height="40" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="459" y="264" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">실행 계획 (완성)</text>

  <!-- Arrows (SQL 뼈대 -> DB 파서 -> 실행 계획 (완성)) -->
  <path d="M134,260 L214,260" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M304,260 L384,260" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Flow Nodes & Paths (아랫줄: 입력 -> 파라미터 바인딩) -->
  <!-- 입력 (x: 44 ~ 124, w: 80, y: 320 ~ 360, cy: 340) -->
  <rect x="44" y="320" width="80" height="40" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="84" y="344" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">입력</text>

  <!-- 파라미터 바인딩 (x: 384 ~ 534, w: 150, y: 320 ~ 360, cy: 340) -->
  <rect x="384" y="320" width="150" height="40" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="459" y="344" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">파라미터 바인딩</text>

  <!-- Arrow (입력 -> 파라미터 바인딩) -->
  <path d="M124,340 L384,340" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Right Side Bracket & Annotation Lines -->
  <!-- 실행 계획 (완성) [right edge: 534] -> L570, y:260 -->
  <!-- 파라미터 바인딩 [right edge: 534] -> L570, y:340 -->
  <!-- Bracket vertical connector at x:570 -->
  <path d="M534,260 L570,260 L570,340 L534,340" stroke="#059669" stroke-width="1.5" fill="none"/>

  <!-- Annotations on Right Side -->
  <!-- Top annotation arrow/label pointing to upper branch -->
  <path d="M605,260 L575,260" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="613" y="264" font-size="11.5" font-weight="bold" fill="#059669">파싱이 이미 끝났다</text>

  <!-- Bottom annotation text under 파라미터 바인딩 -->
  <text x="384" y="382" font-size="11.5" fill="#52606d">값 슬롯에만 들어간다. 문법을 바꿀 수 없다</text>
</svg>