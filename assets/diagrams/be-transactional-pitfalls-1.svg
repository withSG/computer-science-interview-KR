<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">@Transactional 프록시 호출 흐름</title>
  <desc id="d">Controller의 호출은 OrderService$$Proxy가 먼저 받는다. TransactionInterceptor가 커넥션을 얻어 ThreadLocal에 보관한 뒤 원본 OrderService를 호출하고, 정상 반환이면 commit, 예외면 rollback 한 다음 커넥션을 반환한다.</desc>
  <rect width="880" height="660" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Controller -->
  <rect x="214" y="24" width="160" height="44" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="294" y="52" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Controller</text>

  <!-- 호출 -->
  <line x1="294" y1="68" x2="294" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="308" y="103" font-size="15" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">orderService.placeOrder(...)</text>

  <!-- 프록시 -->
  <rect x="24" y="128" width="540" height="502" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="44" y="158" font-size="18" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService$$Proxy</text>

  <!-- TransactionInterceptor -->
  <rect x="48" y="176" width="492" height="132" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="66" y="204" font-size="17" font-weight="bold" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">TransactionInterceptor</text>
  <text x="286" y="204" font-size="15" fill="#374151">(@Around 성격의 Advice)</text>
  <text x="66" y="236" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">PlatformTransactionManager.getTransaction()</text>
  <text x="90" y="262" font-size="15" fill="#1f2937">→ 커넥션 획득, setAutoCommit(false)</text>
  <text x="90" y="288" font-size="15" fill="#1f2937">→ 커넥션을 ThreadLocal 에 보관</text>

  <line x1="294" y1="308" x2="294" y2="343" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 원본 OrderService -->
  <rect x="48" y="346" width="492" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="66" y="376" font-size="17" font-weight="bold" fill="#065f46">OrderService (원본)</text>
  <text x="256" y="376" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">placeOrder()</text>
  <text x="370" y="376" font-size="16" fill="#111827">실제 로직</text>
  <text x="66" y="408" font-size="15" fill="#1f2937">Repository 들은 ThreadLocal 에서 같은 커넥션을 꺼내 쓴다</text>

  <!-- 분기 -->
  <path d="M294,430 V450" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M294,450 H160 V473" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M294,450 H428 V473" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="56" y="476" width="208" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="160" y="504" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">정상 반환 → commit()</text>
  <rect x="324" y="476" width="208" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="428" y="504" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">예외 → rollback()</text>

  <!-- 합류 -->
  <path d="M160,520 V540 H428 V520" stroke="#374151" stroke-width="2" fill="none"/>
  <line x1="294" y1="540" x2="294" y2="561" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="214" y="564" width="160" height="42" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="294" y="591" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">커넥션 반환</text>

  <!-- ThreadLocal -->
  <rect x="660" y="252" width="196" height="156" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="758" y="282" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ThreadLocal</text>
  <text x="758" y="306" font-size="15" fill="#4b5563" text-anchor="middle">현재 스레드</text>
  <rect x="698" y="324" width="120" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="758" y="350" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">커넥션</text>

  <!-- 보관 / 꺼내 씀 -->
  <line x1="540" y1="278" x2="657" y2="278" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="612" y="266" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">보관</text>
  <line x1="660" y1="394" x2="543" y2="394" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="612" y="382" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">꺼내 씀</text>
</svg>
