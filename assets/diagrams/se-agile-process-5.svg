<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브룩스의 법칙 - 커뮤니케이션 채널 및 그래프</title>
  <desc id="d">인원 증가에 따라 커뮤니케이션 채널 수가 제곱으로 늘어나는 현상을 나타낸 3명, 5명 네트워크 다이어그램 및 인원 대 채널 수 그래프</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Section 1: 3-person vs 5-person network -->
  <g id="network-comparison">
    <!-- 3-person network -->
    <g id="group-3p">
      <text x="210" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">3명 → 3채널</text>
      
      <!-- Edges -->
      <line x1="210" y1="70" x2="160" y2="150" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="210" y1="70" x2="260" y2="150" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="160" y1="150" x2="260" y2="150" stroke="#9aa5b1" stroke-width="2"/>

      <!-- Nodes -->
      <circle cx="210" cy="70" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="210" y="75" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>

      <circle cx="160" cy="150" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="160" y="155" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">B</text>

      <circle cx="260" cy="150" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="260" y="155" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">C</text>
    </g>

    <!-- 5-person network -->
    <g id="group-5p">
      <text x="640" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">5명 → 10채널</text>

      <!-- Edges (Pentagon complete graph K5) -->
      <!-- Outer Pentagon -->
      <line x1="640" y1="65" x2="710" y2="85" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="710" y1="85" x2="730" y2="155" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="730" y1="155" x2="640" y2="185" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="640" y1="185" x2="550" y2="155" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="550" y1="155" x2="640" y2="65" stroke="#9aa5b1" stroke-width="2"/>

      <!-- Inner Star (Diagonals) -->
      <line x1="640" y1="65" x2="730" y2="155" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="640" y1="65" x2="640" y2="185" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="710" y1="85" x2="640" y2="185" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="710" y1="85" x2="550" y2="155" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="550" y1="155" x2="730" y2="155" stroke="#9aa5b1" stroke-width="2"/>

      <!-- Nodes -->
      <circle cx="640" cy="65" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="640" y="70" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">A</text>

      <circle cx="710" cy="85" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="710" y="90" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">B</text>

      <circle cx="730" cy="155" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="730" y="160" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">C</text>

      <circle cx="640" cy="185" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="640" y="190" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">D</text>

      <circle cx="550" cy="155" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="550" y="160" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">E</text>
    </g>
  </g>

  <!-- Section 2: Curve Description & Graph -->
  <g id="chart-section">
    <!-- Curve Title Text -->
    <text x="440" y="240" font-size="14" fill="#52606d" text-anchor="middle">n(n-1)/2가 그리는 곡선 — 직선이 아니라 위로 휜다</text>

    <!-- Axes -->
    <text x="210" y="280" font-size="13" font-weight="bold" fill="#52606d">채널 수</text>
    
    <!-- Y Axis Line -->
    <path d="M 230 290 L 230 440" stroke="#1f2933" stroke-width="1.5" fill="none"/>
    <!-- X Axis Line -->
    <path d="M 230 440 L 680 440" stroke="#1f2933" stroke-width="1.5" stroke-linecap="square" fill="none" marker-end="url(#a-ink)"/>
    <text x="700" y="444" font-size="13" font-weight="bold" fill="#52606d">인원(n)</text>

    <!-- Y Axis Labels & Grid Lines -->
    <!-- y=28 (400 - 28*4 = 288) -->
    <text x="215" y="293" font-size="12" fill="#52606d" text-anchor="end">28</text>
    <line x1="226" y1="289" x2="230" y2="289" stroke="#1f2933" stroke-width="1.5"/>

    <!-- y=21 (400 - 21*4 = 316) -->
    <text x="215" y="321" font-size="12" fill="#52606d" text-anchor="end">21</text>
    <line x1="226" y1="317" x2="230" y2="317" stroke="#1f2933" stroke-width="1.5"/>

    <!-- y=15 (400 - 15*4 = 340) -->
    <text x="215" y="345" font-size="12" fill="#52606d" text-anchor="end">15</text>
    <line x1="226" y1="341" x2="230" y2="341" stroke="#1f2933" stroke-width="1.5"/>

    <!-- y=10 (400 - 10*4 = 361) -->
    <text x="215" y="365" font-size="12" fill="#52606d" text-anchor="end">10</text>
    <line x1="226" y1="361" x2="230" y2="361" stroke="#1f2933" stroke-width="1.5"/>

    <!-- y=6 (400 - 6*4 = 377) -->
    <text x="215" y="381" font-size="12" fill="#52606d" text-anchor="end">6</text>
    <line x1="226" y1="377" x2="230" y2="377" stroke="#1f2933" stroke-width="1.5"/>

    <!-- y=3 (400 - 3*4 = 389) -->
    <text x="215" y="393" font-size="12" fill="#52606d" text-anchor="end">3</text>
    <line x1="226" y1="389" x2="230" y2="389" stroke="#1f2933" stroke-width="1.5"/>

    <!-- X Axis Labels (n=3 to 8, step=70px: 280, 350, 420, 490, 560, 630) -->
    <line x1="280" y1="440" x2="280" y2="445" stroke="#1f2933" stroke-width="1.5"/>
    <text x="280" y="462" font-size="12" fill="#52606d" text-anchor="middle">3</text>

    <line x1="350" y1="440" x2="350" y2="445" stroke="#1f2933" stroke-width="1.5"/>
    <text x="350" y="462" font-size="12" fill="#52606d" text-anchor="middle">4</text>

    <line x1="420" y1="440" x2="420" y2="445" stroke="#1f2933" stroke-width="1.5"/>
    <text x="420" y="462" font-size="12" fill="#52606d" text-anchor="middle">5</text>

    <line x1="490" y1="440" x2="490" y2="445" stroke="#1f2933" stroke-width="1.5"/>
    <text x="490" y="462" font-size="12" fill="#52606d" text-anchor="middle">6</text>

    <line x1="560" y1="440" x2="560" y2="445" stroke="#1f2933" stroke-width="1.5"/>
    <text x="560" y="462" font-size="12" fill="#52606d" text-anchor="middle">7</text>

    <line x1="630" y1="440" x2="630" y2="445" stroke="#1f2933" stroke-width="1.5"/>
    <text x="630" y="462" font-size="12" fill="#52606d" text-anchor="middle">8</text>

    <!-- Curve Path -->
    <path d="M 280,389 Q 450,370 630,289" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

    <!-- Data Points -->
    <!-- (n=3, y=3) -> (280, 389) -->
    <circle cx="280" cy="389" r="6" fill="#7c3aed"/>
    <!-- (n=4, y=6) -> (350, 377) -->
    <circle cx="350" cy="377" r="6" fill="#7c3aed"/>
    <!-- (n=5, y=10) -> (420, 361) -->
    <circle cx="420" cy="361" r="6" fill="#7c3aed"/>
    <!-- (n=6, y=15) -> (490, 341) -->
    <circle cx="490" cy="341" r="6" fill="#7c3aed"/>
    <!-- (n=7, y=21) -> (560, 317) -->
    <circle cx="560" cy="317" r="6" fill="#7c3aed"/>
    <!-- (n=8, y=28) -> (630, 289) -->
    <circle cx="630" cy="289" r="6" fill="#7c3aed"/>
  </g>
</svg>