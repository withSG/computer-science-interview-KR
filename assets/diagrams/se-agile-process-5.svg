<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">인원에 따른 커뮤니케이션 채널 수</title>
  <desc id="d">3명이면 채널이 3개, 5명이면 10개다. 인원 n이 3에서 8로 늘 때 채널 수 n(n-1)/2는 3, 6, 10, 15, 21, 28로 늘어 직선이 아니라 위로 휘는 곡선을 그린다.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="660" fill="#ffffff"/>

  <!-- 위: 3명 vs 5명 -->
  <rect x="24" y="24" width="404" height="252" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="226" y="58" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">3명 → <tspan fill="#1d4ed8">3채널</tspan></text>
  <line x1="238" y1="120.8" x2="276.4" y2="187.2" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="214" y1="120.8" x2="175.6" y2="187.2" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="264.4" y1="208" x2="187.6" y2="208" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="226" cy="100" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="226" y="106" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>
  <circle cx="288.4" cy="208" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="288.4" y="214" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">C</text>
  <circle cx="163.6" cy="208" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="163.6" y="214" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">B</text>
  <rect x="452" y="24" width="404" height="252" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="654" y="58" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">5명 → <tspan fill="#b91c1c">10채널</tspan></text>
  <line x1="631" y1="103.3" x2="677" y2="103.3" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="626.4" y1="117.4" x2="710.7" y2="178.6" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="614.4" y1="126.1" x2="646.6" y2="225.2" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="599.6" y1="126.1" x2="585.3" y2="169.9" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="708.4" y1="126.1" x2="722.7" y2="169.9" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="693.6" y1="126.1" x2="661.4" y2="225.2" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="681.6" y1="117.4" x2="597.3" y2="178.6" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="710.7" y1="206.8" x2="673.4" y2="233.9" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="706.1" y1="192.7" x2="601.9" y2="192.7" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="634.6" y1="233.9" x2="597.3" y2="206.8" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="607" cy="103.3" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="607" y="109.3" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">A</text>
  <circle cx="701" cy="103.3" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="701" y="109.3" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">B</text>
  <circle cx="730.1" cy="192.7" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="730.1" y="198.7" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">C</text>
  <circle cx="654" cy="248" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="654" y="254" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">D</text>
  <circle cx="577.9" cy="192.7" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="577.9" y="198.7" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">E</text>

  <!-- 아래: n(n-1)/2 곡선 -->
  <text x="440" y="324" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">n(n-1)/2</tspan>가 그리는 곡선 — 직선이 아니라 위로 휜다</text>
  <line x1="120" y1="590" x2="120" y2="372" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="120" y1="590" x2="790" y2="590" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="120" y="360" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">채널 수</text>
  <text x="800" y="595" font-size="15" font-weight="bold" fill="#374151">인원(n)</text>
  <line x1="120" y1="569" x2="162" y2="569" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="115" y1="569" x2="120" y2="569" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="574" font-size="15" fill="#374151" text-anchor="end">3</text>
  <line x1="170" y1="590" x2="170" y2="595" stroke="#374151" stroke-width="1.5"/>
  <text x="170" y="616" font-size="15" fill="#374151" text-anchor="middle">3</text>
  <line x1="120" y1="548" x2="276" y2="548" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="115" y1="548" x2="120" y2="548" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="553" font-size="15" fill="#374151" text-anchor="end">6</text>
  <line x1="284" y1="590" x2="284" y2="595" stroke="#374151" stroke-width="1.5"/>
  <text x="284" y="616" font-size="15" fill="#374151" text-anchor="middle">4</text>
  <line x1="120" y1="520" x2="390" y2="520" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="115" y1="520" x2="120" y2="520" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="525" font-size="15" fill="#374151" text-anchor="end">10</text>
  <line x1="398" y1="590" x2="398" y2="595" stroke="#374151" stroke-width="1.5"/>
  <text x="398" y="616" font-size="15" fill="#374151" text-anchor="middle">5</text>
  <line x1="120" y1="485" x2="504" y2="485" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="115" y1="485" x2="120" y2="485" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="490" font-size="15" fill="#374151" text-anchor="end">15</text>
  <line x1="512" y1="590" x2="512" y2="595" stroke="#374151" stroke-width="1.5"/>
  <text x="512" y="616" font-size="15" fill="#374151" text-anchor="middle">6</text>
  <line x1="120" y1="443" x2="618" y2="443" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="115" y1="443" x2="120" y2="443" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="448" font-size="15" fill="#374151" text-anchor="end">21</text>
  <line x1="626" y1="590" x2="626" y2="595" stroke="#374151" stroke-width="1.5"/>
  <text x="626" y="616" font-size="15" fill="#374151" text-anchor="middle">7</text>
  <line x1="120" y1="394" x2="732" y2="394" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="115" y1="394" x2="120" y2="394" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="399" font-size="15" fill="#374151" text-anchor="end">28</text>
  <line x1="740" y1="590" x2="740" y2="595" stroke="#374151" stroke-width="1.5"/>
  <text x="740" y="616" font-size="15" fill="#374151" text-anchor="middle">8</text>
  <path d="M170,569 Q455,525.3 740,394" fill="none" stroke="#6d28d9" stroke-width="2.5"/>
  <circle cx="170" cy="569" r="6" fill="#6d28d9" stroke="#ffffff" stroke-width="2"/>
  <circle cx="284" cy="548" r="6" fill="#6d28d9" stroke="#ffffff" stroke-width="2"/>
  <circle cx="398" cy="520" r="6" fill="#6d28d9" stroke="#ffffff" stroke-width="2"/>
  <circle cx="512" cy="485" r="6" fill="#6d28d9" stroke="#ffffff" stroke-width="2"/>
  <circle cx="626" cy="443" r="6" fill="#6d28d9" stroke="#ffffff" stroke-width="2"/>
  <circle cx="740" cy="394" r="6" fill="#6d28d9" stroke="#ffffff" stroke-width="2"/>
</svg>
