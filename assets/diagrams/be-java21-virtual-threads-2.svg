<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">마운트와 언마운트</title>
  <desc id="d">가상 스레드 VT-1이 캐리어 스레드 C1에서 실행되다 블로킹을 만나 힙으로 언마운트되고, 다른 스레드 C1이 VT-2를 실행한 뒤, I/O 완료 후 VT-1이 C3로 마운트되는 과정 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="720" fill="#ffffff"/>

  <!-- [1] 단계 -->
  <g transform="translate(0, 0)">
    <text x="30" y="38" font-size="14" font-weight="bold" fill="#1f2933">[1] VT-1이 캐리어 C1 위에서 실행 중</text>
    
    <!-- C1 박스 -->
    <rect x="50" y="55" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="100" y="79" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">C1</text>
    
    <!-- 화살표 -->
    <path d="M150,75 L260,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <rect x="180" y="62" width="50" height="20" fill="#ffffff"/>
    <text x="205" y="76" font-size="12" fill="#2563eb" text-anchor="middle">실행</text>

    <!-- VT-1 텍스트 및 설명 -->
    <text x="272" y="79" font-size="13" font-weight="bold" fill="#1f2933">VT-1</text>
    <text x="315" y="79" font-size="11.5" fill="#52606d">(스택 프레임이 C1의 OS 스택에 올라와 있음)</text>
  </g>

  <!-- 구분선 1 -->
  <line x1="30" y1="120" x2="850" y2="120" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- [2] 단계 -->
  <g transform="translate(0, 120)">
    <text x="30" y="35" font-size="14" font-weight="bold" fill="#1f2933">[2] VT-1이 socket.read() 등 블로킹 지점에 도달</text>
    <text x="55" y="58" font-size="13" fill="#d97706">JVM이 VT-1의 스택 프레임을 힙으로 옮긴다 = 언마운트(unmount)</text>

    <!-- C1 박스 -->
    <rect x="50" y="80" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="100" y="104" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">C1</text>

    <!-- 비었음 표시 -->
    <path d="M150,100 L210,100" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
    <text x="220" y="104" font-size="12" fill="#52606d">비었음</text>

    <!-- Heap 컨테이너 -->
    <rect x="520" y="70" width="280" height="90" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="535" y="90" font-size="13" font-weight="bold" fill="#d97706">Heap</text>

    <!-- Continuation 박스 -->
    <rect x="540" y="98" width="240" height="50" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="660" y="118" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">VT-1의 Continuation</text>
    <text x="660" y="138" font-size="11.5" fill="#52606d" text-anchor="middle">(스택 프레임 사본)</text>

    <!-- 언마운트 흐름 화살표 -->
    <path d="M300,100 C380,100 420,123 530,123" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-orange)"/>
  </g>

  <!-- 구분선 2 -->
  <line x1="30" y1="310" x2="850" y2="310" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- [3] 단계 -->
  <g transform="translate(0, 310)">
    <text x="30" y="38" font-size="14" font-weight="bold" fill="#1f2933">[3] C1은 즉시 다른 가상 스레드를 집어 실행</text>

    <!-- C1 박스 -->
    <rect x="50" y="55" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="100" y="79" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">C1</text>

    <!-- 화살표 -->
    <path d="M150,75 L260,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <rect x="180" y="62" width="50" height="20" fill="#ffffff"/>
    <text x="205" y="76" font-size="12" fill="#2563eb" text-anchor="middle">실행</text>

    <!-- VT-2 텍스트 -->
    <text x="272" y="79" font-size="13" font-weight="bold" fill="#1f2933">VT-2</text>
  </g>

  <!-- 구분선 3 -->
  <line x1="30" y1="430" x2="850" y2="430" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- [4] 단계 -->
  <g transform="translate(0, 430)">
    <text x="30" y="35" font-size="14" font-weight="bold" fill="#1f2933">[4] I/O 완료 이벤트가 오면 VT-1을 다시 스케줄</text>
    <text x="55" y="58" font-size="13" fill="#7c3aed">힙의 프레임을 어느 캐리어든 비어 있는 스레드 스택으로 복원 = 마운트(mount)</text>

    <!-- C3 박스 -->
    <rect x="50" y="80" width="100" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="100" y="104" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">C3</text>

    <!-- 화살표 -->
    <path d="M150,100 L260,100" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <rect x="180" y="87" width="50" height="20" fill="#ffffff"/>
    <text x="205" y="101" font-size="12" fill="#7c3aed" text-anchor="middle">실행</text>

    <!-- VT-1 텍스트 및 설명 -->
    <text x="272" y="104" font-size="13" font-weight="bold" fill="#1f2933">VT-1</text>
    <text x="315" y="104" font-size="11.5" fill="#52606d">(read() 다음 줄부터 재개, 캐리어는 바뀔 수 있다)</text>
  </g>
</svg>