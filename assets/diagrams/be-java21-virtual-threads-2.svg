<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가상 스레드의 마운트와 언마운트</title>
  <desc id="d">VT-1이 캐리어 C1에서 실행되다 socket.read() 같은 블로킹 지점에서 스택 프레임이 힙의 Continuation으로 옮겨지고(언마운트), C1은 곧바로 VT-2를 실행하며, I/O가 완료되면 VT-1의 프레임이 비어 있는 캐리어 C3의 스택으로 복원돼(마운트) read() 다음 줄부터 재개되는 네 단계를 보여준다.</desc>
  <rect width="880" height="690" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- ===== 1단계 ===== -->
  <rect x="24" y="24" width="832" height="116" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="52" cy="54" r="14" fill="#1f2937"/>
  <text x="52" y="59" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="78" y="60" font-size="17" font-weight="bold" fill="#111827">VT-1이 캐리어 C1 위에서 실행 중</text>

  <rect x="72" y="80" width="100" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="122" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">C1</text>
  <line x1="172" y1="102" x2="256" y2="102" stroke="#374151" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="214" y="93" text-anchor="middle" font-size="15" fill="#374151">실행</text>
  <rect x="262" y="80" width="80" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="302" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">VT-1</text>
  <text x="360" y="108" font-size="15" fill="#4b5563">스택 프레임이 C1의 OS 스택에 올라와 있음</text>

  <!-- ===== 2단계 ===== -->
  <rect x="24" y="152" width="832" height="184" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="52" cy="182" r="14" fill="#1f2937"/>
  <text x="52" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="78" y="188" font-size="17" font-weight="bold" fill="#111827">VT-1이 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">socket.read()</tspan> 등 블로킹 지점에 도달</text>
  <text x="78" y="214" font-size="15" fill="#374151">JVM이 VT-1의 스택 프레임을 힙으로 옮긴다 = <tspan font-weight="bold" fill="#b45309">언마운트(unmount)</tspan></text>

  <rect x="72" y="248" width="100" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="122" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#4b5563">C1</text>
  <line x1="172" y1="270" x2="262" y2="270" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="262" y="248" width="80" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="302" y="276" text-anchor="middle" font-size="15" fill="#4b5563">비었음</text>

  <line x1="346" y1="270" x2="498" y2="270" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-amber)"/>
  <text x="422" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">언마운트</text>

  <rect x="504" y="228" width="328" height="94" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="252" font-size="16" font-weight="bold" fill="#b45309">Heap</text>
  <rect x="520" y="262" width="296" height="52" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="668" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">VT-1의 Continuation</text>
  <text x="668" y="305" text-anchor="middle" font-size="15" fill="#4b5563">(스택 프레임 사본)</text>

  <!-- ===== 3단계 ===== -->
  <rect x="24" y="348" width="832" height="116" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="52" cy="378" r="14" fill="#1f2937"/>
  <text x="52" y="383" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="78" y="384" font-size="17" font-weight="bold" fill="#111827">C1은 즉시 다른 가상 스레드를 집어 실행</text>

  <rect x="72" y="404" width="100" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="122" y="432" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">C1</text>
  <line x1="172" y1="426" x2="256" y2="426" stroke="#374151" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="214" y="417" text-anchor="middle" font-size="15" fill="#374151">실행</text>
  <rect x="262" y="404" width="80" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="302" y="432" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">VT-2</text>

  <!-- ===== 4단계 ===== -->
  <rect x="24" y="476" width="832" height="190" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="52" cy="506" r="14" fill="#1f2937"/>
  <text x="52" y="511" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4</text>
  <text x="78" y="512" font-size="17" font-weight="bold" fill="#111827">I/O 완료 이벤트가 오면 VT-1을 다시 스케줄</text>
  <text x="78" y="538" font-size="15" fill="#374151">힙의 프레임을 어느 캐리어든 비어 있는 스레드 스택으로 복원 = <tspan font-weight="bold" fill="#1d4ed8">마운트(mount)</tspan></text>

  <rect x="72" y="572" width="100" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="122" y="600" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">C3</text>
  <line x1="172" y1="594" x2="256" y2="594" stroke="#374151" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="214" y="585" text-anchor="middle" font-size="15" fill="#374151">실행</text>
  <rect x="262" y="572" width="80" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="302" y="600" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">VT-1</text>

  <line x1="502" y1="594" x2="348" y2="594" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="424" y="584" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">마운트</text>

  <rect x="504" y="554" width="328" height="94" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="578" font-size="16" font-weight="bold" fill="#b45309">Heap</text>
  <rect x="520" y="588" width="296" height="52" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="668" y="610" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">VT-1의 Continuation</text>
  <text x="668" y="631" text-anchor="middle" font-size="15" fill="#4b5563">(스택 프레임 사본)</text>

  <text x="72" y="646" font-size="15" fill="#4b5563"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">read()</tspan> 다음 줄부터 재개, <tspan font-weight="bold" fill="#1f2937">캐리어는 바뀔 수 있다</tspan></text>
</svg>
