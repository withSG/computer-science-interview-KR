<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Readiness와 Liveness 비교</title>
  <desc id="d">Readiness는 지금 트래픽을 받아도 되는지를 묻고, 실패하면 로드 밸런서 대상 목록에서 빠질 뿐 컨테이너는 그대로 둔다. Liveness는 프로세스를 죽이고 다시 띄워야 하는지를 묻고, 실패하면 컨테이너를 재시작한다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>

  <!-- 행 라벨 -->
  <text x="24" y="90" font-size="16" font-weight="bold" fill="#374151">묻는 것</text>
  <text x="24" y="161" font-size="16" font-weight="bold" fill="#374151">실패하면</text>
  <text x="24" y="259" font-size="16" font-weight="bold" fill="#374151">용도</text>

  <!-- Readiness 머리 -->
  <rect x="140" y="24" width="352" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M140,64 V32 A8,8 0 0 1 148,24 H484 A8,8 0 0 1 492,32 V64 Z" fill="#1d4ed8"/>
  <text x="316" y="51" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Readiness (준비됨)</text>
  <text x="316" y="90" font-size="16" fill="#1e3a8a" text-anchor="middle">“지금 트래픽을 받아도 되나?”</text>

  <!-- Liveness 머리 -->
  <rect x="504" y="24" width="352" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M504,64 V32 A8,8 0 0 1 512,24 H848 A8,8 0 0 1 856,32 V64 Z" fill="#6d28d9"/>
  <text x="680" y="51" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Liveness (살아있음)</text>
  <text x="680" y="90" font-size="16" fill="#4c1d95" text-anchor="middle">“이 프로세스를 죽이고 다시 띄워야 하나?”</text>

  <!-- 실패하면 -->
  <rect x="140" y="116" width="352" height="80" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="316" y="150" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">로드 밸런서 대상 목록에서 제외</text>
  <text x="316" y="176" font-size="15" fill="#374151" text-anchor="middle">컨테이너는 그대로 둔다</text>

  <rect x="504" y="116" width="352" height="80" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="680" y="162" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">컨테이너 재시작</text>

  <!-- 용도 -->
  <rect x="140" y="208" width="352" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="238" font-size="15" fill="#111827">• 기동 중</text>
  <text x="176" y="262" font-size="15" fill="#374151">(DB 커넥션 풀 초기화, 캐시 워밍업)</text>
  <text x="160" y="288" font-size="15" fill="#111827">• 일시적 과부하</text>

  <rect x="504" y="208" width="352" height="96" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="524" y="250" font-size="15" fill="#111827">• 데드락</text>
  <text x="524" y="276" font-size="15" fill="#111827">• 복구 불가능한 상태</text>
</svg>
