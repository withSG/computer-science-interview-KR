<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">하나의 큰 Context와 분리된 Context</title>
  <desc id="d">AppContext 하나에 user, theme, cart를 담으면 cart가 바뀔 때 구독한 Header, CartBadge, Footer 셋이 모두 리렌더된다(ProductList는 안 씀). UserContext, ThemeContext, CartContext로 나누면 cart가 바뀔 때 CartBadge만 리렌더된다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 왼쪽: 하나의 큰 Context -->
  <rect x="24" y="24" width="400" height="412" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#111827">하나의 큰 Context</text>

  <rect x="44" y="72" width="360" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="224" y="99" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">AppContext = { user, theme, <tspan font-weight="bold" fill="#b45309">cart</tspan> }</text>

  <path d="M68,116 V354" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M68,162 H87" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M68,226 H87" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M68,290 H87" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M68,354 H87" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="92" y="136" width="170" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="159" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Header</text>
  <text x="108" y="179" font-size="14" fill="#4b5563">user만 씀</text>
  <rect x="278" y="148" width="64" height="28" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="310" y="167" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">리렌더</text>

  <rect x="92" y="200" width="170" height="52" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="108" y="223" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ProductList</text>
  <text x="108" y="243" font-size="14" fill="#4b5563">안 씀</text>

  <rect x="92" y="264" width="170" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="287" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CartBadge</text>
  <text x="108" y="307" font-size="14" fill="#4b5563">cart만 씀</text>
  <rect x="278" y="276" width="64" height="28" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="310" y="295" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">리렌더</text>

  <rect x="92" y="328" width="170" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="351" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Footer</text>
  <text x="108" y="371" font-size="14" fill="#4b5563">theme만 씀</text>
  <rect x="278" y="340" width="64" height="28" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="310" y="359" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">리렌더</text>

  <text x="224" y="416" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle"><tspan fill="#b45309">cart가 바뀌면</tspan> 구독한 셋 다 리렌더</text>

  <!-- 오른쪽: 분리된 Context -->
  <rect x="456" y="24" width="400" height="412" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="476" y="56" font-size="18" font-weight="bold" fill="#111827">분리된 Context</text>

  <rect x="476" y="124" width="140" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="546" y="155" font-size="16" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UserContext</text>
  <path d="M616,150 H647" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="652" y="124" width="120" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="712" y="155" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Header</text>

  <rect x="476" y="200" width="140" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="546" y="231" font-size="16" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ThemeContext</text>
  <path d="M616,226 H647" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="652" y="200" width="120" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="712" y="231" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Footer</text>

  <rect x="476" y="276" width="140" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="546" y="307" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CartContext</text>
  <path d="M616,302 H647" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="652" y="276" width="120" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="712" y="307" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CartBadge</text>
  <rect x="780" y="288" width="64" height="28" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="812" y="307" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">리렌더</text>

  <text x="656" y="416" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle"><tspan fill="#b45309">cart가 바뀌면</tspan> CartBadge만 리렌더</text>
</svg>
