<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커서 방식이 빠른 이유</title>
  <desc id="d">id 인덱스(B-Tree)에서 "id &lt; 90" 조건은 트리 높이만큼만 내려가 시작 위치를 찾고(O(log N)), 정렬된 연결 리스트인 리프 노드에서 거기서부터 10개만 순차로 읽는다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="24" y="40" font-size="19" font-weight="bold" fill="#111827">id 인덱스 (B-Tree)</text>

  <!-- 트리 간선: 회색 = 가지 않는 길, 파랑 = "id < 90" 탐색 경로 -->
  <line x1="276" y1="106" x2="170" y2="152" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="324" y1="106" x2="410" y2="152" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="130" y1="196" x2="98" y2="242" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="170" y1="196" x2="202" y2="242" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="410" y1="196" x2="378" y2="242" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="450" y1="196" x2="482" y2="242" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- 1단계: 루트 -->
  <rect x="264" y="62" width="72" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="300" y="90" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">50</text>

  <!-- 2단계 -->
  <rect x="114" y="152" width="72" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="150" y="180" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">25</text>
  <rect x="394" y="152" width="72" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="430" y="180" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">90</text>

  <!-- 3단계 -->
  <rect x="54" y="242" width="72" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="90" y="270" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">10</text>
  <rect x="174" y="242" width="72" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="210" y="270" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">40</text>
  <rect x="334" y="242" width="72" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="370" y="270" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">70</text>
  <rect x="454" y="242" width="72" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="490" y="270" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">95</text>

  <!-- 설명: "id < 90"은 여기까지 바로 내려온다 -->
  <line x1="572" y1="174" x2="480" y2="174" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="584" y="170" font-size="17" font-weight="bold" fill="#1d4ed8">"id &lt; 90"은</text>
  <text x="584" y="194" font-size="17" font-weight="bold" fill="#1d4ed8">여기까지 바로 내려온다</text>
  <text x="584" y="230" font-size="16" fill="#374151">트리 높이만큼만 탐색 = <tspan font-weight="bold" fill="#111827">O(log N)</tspan></text>

  <!-- 리프 노드 영역 -->
  <rect x="24" y="316" width="832" height="180" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="346" font-size="17" font-weight="bold" fill="#374151">리프 노드가 정렬된 연결 리스트</text>

  <!-- 리프로 내려가는 경로 -->
  <line x1="370" y1="286" x2="370" y2="378" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah-blue)"/>

  <text x="138" y="412" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>
  <line x1="160" y1="406" x2="184" y2="406" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="194" y="384" width="72" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="230" y="412" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">88</text>
  <line x1="266" y1="406" x2="334" y2="406" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="334" y="384" width="72" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="370" y="412" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">89</text>
  <line x1="406" y1="406" x2="474" y2="406" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="474" y="384" width="72" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="510" y="412" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">90</text>
  <line x1="546" y1="406" x2="614" y2="406" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="614" y="384" width="72" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="650" y="412" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">91</text>
  <line x1="686" y1="406" x2="710" y2="406" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="732" y="412" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>

  <!-- 순차 읽기 -->
  <line x1="400" y1="458" x2="130" y2="458" stroke="#b45309" stroke-width="3" marker-end="url(#ah-amber)"/>
  <text x="416" y="464" font-size="17" font-weight="bold" fill="#b45309">여기서부터 10개만 순차로 읽는다</text>
</svg>
