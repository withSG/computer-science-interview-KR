<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Git Flow 커밋 그래프</title>
  <desc id="d">feature는 develop에서 갈라져 develop으로 합쳐지고, release는 develop에서 갈라져 main(v1.1)으로 합쳐진 뒤 develop에도 반영된다. hotfix는 main에서 갈라져 main(v1.1.1)으로 합쳐지고 develop에도 반영된다. 점선은 갈라져 나오는 곳, 화살표는 합쳐 들어가는 곳이다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-dev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-feat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-rel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 레인 배경 -->
  <rect x="24" y="42" width="832" height="94" rx="6" fill="#fef2f2"/>
  <rect x="24" y="144" width="832" height="72" rx="6" fill="#fffbeb"/>
  <rect x="24" y="224" width="832" height="72" rx="6" fill="#f5f3ff"/>
  <rect x="24" y="304" width="832" height="72" rx="6" fill="#eff6ff"/>
  <rect x="24" y="384" width="832" height="72" rx="6" fill="#ecfdf5"/>

  <!-- 레인 이름 -->
  <text x="40" y="106" font-size="17" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main</text>
  <text x="40" y="186" font-size="17" font-weight="bold" fill="#b45309" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hotfix</text>
  <text x="40" y="266" font-size="17" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">release</text>
  <text x="40" y="346" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">develop</text>
  <text x="40" y="426" font-size="17" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">feature</text>

  <!-- 영구 브랜치 레일 -->
  <line x1="150" y1="100" x2="852" y2="100" stroke="#b91c1c" stroke-width="3" marker-end="url(#ah-main)"/>
  <line x1="150" y1="340" x2="852" y2="340" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah-dev)"/>

  <!-- 짧은 브랜치 몸통 -->
  <line x1="265" y1="420" x2="315" y2="420" stroke="#047857" stroke-width="3"/>
  <line x1="395" y1="260" x2="455" y2="260" stroke="#6d28d9" stroke-width="3"/>
  <line x1="630" y1="180" x2="690" y2="180" stroke="#b45309" stroke-width="3"/>

  <!-- 갈라져 나온다 (점선) -->
  <path d="M180 107 L180 333" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M225 347 C225 395 240 420 258 420" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M350 333 C350 285 365 260 388 260" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M590 107 C590 155 605 180 623 180" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- 합쳐 들어간다 (화살표) -->
  <path d="M322 420 C340 420 350 405 350 351" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-feat)"/>
  <path d="M462 260 C492 260 505 235 505 111" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ah-rel)"/>
  <path d="M511 105 C540 130 545 220 545 329" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-main)"/>
  <path d="M697 180 C725 180 740 165 740 111" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ah-hot)"/>
  <path d="M746 105 C775 130 780 220 780 329" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-main)"/>

  <!-- 커밋 점 -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="180" cy="100" r="7" fill="#b91c1c"/>
    <circle cx="505" cy="100" r="7" fill="#b91c1c"/>
    <circle cx="590" cy="100" r="7" fill="#b91c1c"/>
    <circle cx="740" cy="100" r="7" fill="#b91c1c"/>
    <circle cx="630" cy="180" r="7" fill="#b45309"/>
    <circle cx="690" cy="180" r="7" fill="#b45309"/>
    <circle cx="395" cy="260" r="7" fill="#6d28d9"/>
    <circle cx="455" cy="260" r="7" fill="#6d28d9"/>
    <circle cx="180" cy="340" r="7" fill="#1d4ed8"/>
    <circle cx="225" cy="340" r="7" fill="#1d4ed8"/>
    <circle cx="290" cy="340" r="7" fill="#1d4ed8"/>
    <circle cx="350" cy="340" r="7" fill="#1d4ed8"/>
    <circle cx="545" cy="340" r="7" fill="#1d4ed8"/>
    <circle cx="780" cy="340" r="7" fill="#1d4ed8"/>
    <circle cx="265" cy="420" r="7" fill="#047857"/>
    <circle cx="315" cy="420" r="7" fill="#047857"/>
  </g>

  <!-- 릴리스 태그 -->
  <rect x="155" y="58" width="50" height="24" rx="5" fill="#b91c1c"/>
  <text x="180" y="75" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">v1.0</text>
  <rect x="480" y="58" width="50" height="24" rx="5" fill="#b91c1c"/>
  <text x="505" y="75" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">v1.1</text>
  <rect x="707" y="58" width="66" height="24" rx="5" fill="#b91c1c"/>
  <text x="740" y="75" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">v1.1.1</text>

  <!-- 범례 -->
  <rect x="24" y="480" width="832" height="54" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="60" y1="507" x2="120" y2="507" stroke="#374151" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="134" y="512" font-size="16" fill="#111827">여기서 갈라져 나온다</text>
  <line x1="460" y1="507" x2="518" y2="507" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-ink)"/>
  <text x="532" y="512" font-size="16" fill="#111827">여기로 합쳐 들어간다</text>
</svg>
