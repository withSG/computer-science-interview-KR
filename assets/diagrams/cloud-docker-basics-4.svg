<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컨테이너 라이프사이클</title>
  <desc id="d">Dockerfile을 docker build로 이미지로 만들고, docker run(= create + start)으로 실행 중 컨테이너를 띄운다. docker stop으로 정지됨이 되고, docker start로 다시 실행 중이 되거나 docker rm으로 삭제되며 이때 쓰기 레이어도 소멸한다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 상태 박스 -->
  <rect x="24" y="48" width="116" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="82" y="86" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Dockerfile</text>

  <rect x="266" y="48" width="96" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="314" y="86" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">이미지</text>

  <rect x="532" y="48" width="104" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="584" y="86" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">실행 중</text>

  <rect x="756" y="48" width="100" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="806" y="86" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">정지됨</text>

  <rect x="596" y="236" width="260" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="726" y="270" font-size="16" fill="#1f2937" text-anchor="middle"><tspan font-size="18" font-weight="bold" fill="#b91c1c">삭제</tspan> (쓰기 레이어도 소멸)</text>

  <!-- docker build -->
  <line x1="146" y1="80" x2="259" y2="80" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="203" y="70" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">docker build</text>

  <!-- docker run (= create + start) -->
  <line x1="368" y1="80" x2="525" y2="80" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="447" y="70" font-size="15" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">docker run</text>
  <text x="447" y="102" font-size="14" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(= create + start)</text>

  <!-- docker stop -->
  <line x1="642" y1="80" x2="749" y2="80" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="696" y="70" font-size="15" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">docker stop</text>

  <!-- docker start: 정지됨 → 실행 중 -->
  <path d="M780,112 V160 H584 V119" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="682" y="150" font-size="15" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">docker start</text>

  <!-- docker rm: 정지됨 → 삭제 -->
  <line x1="832" y1="112" x2="832" y2="229" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="820" y="200" font-size="15" fill="#b91c1c" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">docker rm</text>
</svg>
