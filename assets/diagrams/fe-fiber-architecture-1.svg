<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">중단할 수 없는 300ms 렌더링</title>
  <desc id="d">컴포넌트 3,000개짜리 트리를 렌더링하는 300ms 동안 메인 스레드가 중단 없이 묶여, 그 사이에 누른 키는 300ms 뒤에야 화면에 반응하고 18프레임이 드랍되는 과정을 시간축으로 보여준다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="24" y="40" font-size="18" font-weight="bold" fill="#111827">컴포넌트 3,000개짜리 트리를 렌더링하는 동안</text>

  <!-- 시간축 -->
  <text x="180" y="76" font-size="14" fill="#4b5563">0ms</text>
  <text x="840" y="76" font-size="14" fill="#4b5563" text-anchor="end">300ms</text>
  <line x1="218" y1="71" x2="480" y2="71" stroke="#d1d5db" stroke-width="1"/>
  <text x="510" y="76" font-size="14" fill="#4b5563" text-anchor="middle">시간</text>
  <line x1="540" y1="71" x2="788" y2="71" stroke="#d1d5db" stroke-width="1"/>

  <!-- 1. 메인 스레드 -->
  <text x="24" y="115" font-size="16" font-weight="bold" fill="#111827">메인 스레드</text>
  <rect x="180" y="86" width="660" height="46" rx="4" fill="#b91c1c"/>
  <text x="510" y="115" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">렌더링 300ms, 중단 불가</text>

  <!-- 2. 사용자 입력 -->
  <text x="24" y="178" font-size="16" font-weight="bold" fill="#111827">사용자 입력</text>
  <line x1="400" y1="136" x2="400" y2="163" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="180" y1="172" x2="390" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <circle cx="400" cy="172" r="7" fill="#1d4ed8"/>
  <text x="416" y="178" font-size="16" font-weight="bold" fill="#1d4ed8">여기서 키를 눌렀지만</text>

  <!-- 3. 화면 반영 -->
  <text x="24" y="232" font-size="16" font-weight="bold" fill="#111827">화면 반영</text>
  <line x1="840" y1="136" x2="840" y2="217" stroke="#047857" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="180" y1="226" x2="828" y2="226" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <circle cx="840" cy="226" r="7" fill="#047857"/>
  <text x="824" y="212" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">300ms 뒤에야 반응</text>

  <!-- 4. 프레임 -->
  <text x="24" y="283" font-size="16" font-weight="bold" fill="#111827">프레임</text>
  <text x="24" y="304" font-size="14" fill="#4b5563">(1칸 ≈ 16.7ms)</text>
  <g font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">
    <rect x="182.0" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="198.3" y="288">✕</text>
    <rect x="218.7" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="235.0" y="288">✕</text>
    <rect x="255.3" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="271.7" y="288">✕</text>
    <rect x="292.0" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="308.3" y="288">✕</text>
    <rect x="328.7" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="345.0" y="288">✕</text>
    <rect x="365.3" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="381.7" y="288">✕</text>
    <rect x="402.0" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="418.3" y="288">✕</text>
    <rect x="438.7" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="455.0" y="288">✕</text>
    <rect x="475.3" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="491.7" y="288">✕</text>
    <rect x="512.0" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="528.3" y="288">✕</text>
    <rect x="548.7" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="565.0" y="288">✕</text>
    <rect x="585.3" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="601.7" y="288">✕</text>
    <rect x="622.0" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="638.3" y="288">✕</text>
    <rect x="658.7" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="675.0" y="288">✕</text>
    <rect x="695.3" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="711.7" y="288">✕</text>
    <rect x="732.0" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="748.3" y="288">✕</text>
    <rect x="768.7" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="785.0" y="288">✕</text>
    <rect x="805.3" y="264" width="32.7" height="34" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="821.7" y="288">✕</text>
  </g>
  <path d="M180,308 V316 H840 V308 M510,316 V324" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="510" y="350" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">18프레임 드랍 = 화면이 멈춘 것처럼 보임</text>
</svg>
