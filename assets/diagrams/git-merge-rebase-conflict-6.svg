<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">rebase 실행 전후</title>
  <desc id="d">feature에서 git rebase main을 실행하면 c3, c4의 변경 내용이 c6 위에 새 커밋 c3', c4'로 순서대로 재적용되고, 옛 c3, c4는 어떤 브랜치도 가리키지 않게 된다.</desc>
  <rect width="880" height="650" fill="#ffffff"/>
  <defs>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 명령 -->
  <rect x="24" y="20" width="832" height="44" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="48" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git switch feature; git rebase main</text>

  <!-- ① 실행 전 -->
  <rect x="24" y="80" width="832" height="220" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="112" font-size="18" font-weight="bold" fill="#111827">① 실행 전</text>

  <line x1="112" y1="208" x2="168" y2="208" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="210.2" y1="199.2" x2="279.8" y2="168.8" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="210.2" y1="216.8" x2="279.8" y2="247.2" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="322" y1="160" x2="388" y2="160" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="322" y1="256" x2="388" y2="256" stroke="#047857" stroke-width="2.5"/>

  <circle cx="90" cy="208" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="90" y="214" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="190" cy="208" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="190" y="214" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c2</text>
  <circle cx="300" cy="160" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="300" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c3</text>
  <circle cx="410" cy="160" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="410" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c4</text>
  <circle cx="300" cy="256" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="300" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">c5</text>
  <circle cx="410" cy="256" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="410" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">c6</text>

  <line x1="432" y1="160" x2="452" y2="160" stroke="#b45309" stroke-width="2"/>
  <rect x="452" y="146" width="92" height="28" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="498" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">feature</text>
  <line x1="432" y1="256" x2="452" y2="256" stroke="#b45309" stroke-width="2"/>
  <rect x="452" y="242" width="76" height="28" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="490" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">main</text>

  <!-- ② 실행 후 -->
  <rect x="24" y="316" width="832" height="314" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="348" font-size="18" font-weight="bold" fill="#111827">② 실행 후 — c3, c4의 변경 내용을 c6 위에 순서대로 재적용</text>

  <!-- 옛 c3, c4 (브랜치 없음) -->
  <text x="278" y="398" font-size="15" fill="#4b5563">c3, c4는 어떤 브랜치도 가리키지 않게 되어 나중에 정리된다</text>
  <line x1="206.3" y1="515.2" x2="283.7" y2="444.8" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="322" y1="430" x2="388" y2="430" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="300" cy="430" r="22" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="300" y="436" text-anchor="middle" font-size="16" fill="#4b5563">c3</text>
  <circle cx="410" cy="430" r="22" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="410" y="436" text-anchor="middle" font-size="16" fill="#4b5563">c4</text>

  <!-- 재적용 화살표 -->
  <line x1="320.2" y1="438.8" x2="506.2" y2="519.6" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/>
  <line x1="430.2" y1="438.8" x2="616.2" y2="519.6" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/>
  <text x="500" y="450" font-size="15" font-weight="bold" fill="#6d28d9">재적용</text>

  <!-- 직선 히스토리 -->
  <line x1="112" y1="530" x2="168" y2="530" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="212" y1="530" x2="278" y2="530" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="322" y1="530" x2="388" y2="530" stroke="#047857" stroke-width="2.5"/>
  <line x1="432" y1="530" x2="508" y2="530" stroke="#6d28d9" stroke-width="2.5"/>
  <line x1="552" y1="530" x2="618" y2="530" stroke="#6d28d9" stroke-width="2.5"/>

  <circle cx="90" cy="530" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="90" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="190" cy="530" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="190" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c2</text>
  <circle cx="300" cy="530" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="300" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">c5</text>
  <circle cx="410" cy="530" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="410" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">c6</text>
  <circle cx="530" cy="530" r="22" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="530" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">c3'</text>
  <circle cx="640" cy="530" r="22" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="640" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">c4'</text>
  <text x="585" y="584" text-anchor="middle" font-size="15" fill="#6d28d9">새 커밋 (해시가 다르다)</text>

  <line x1="662" y1="530" x2="682" y2="530" stroke="#b45309" stroke-width="2"/>
  <rect x="682" y="516" width="92" height="28" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="728" y="536" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">feature</text>

  <line x1="410" y1="582" x2="410" y2="558" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <rect x="372" y="584" width="76" height="28" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="410" y="604" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">main</text>
</svg>
