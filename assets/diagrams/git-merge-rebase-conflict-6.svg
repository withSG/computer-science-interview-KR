<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">git rebase 동작 방식</title>
  <desc id="d">git rebase main 실행 전후의 커밋 그래프 변화를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Section 1: 실행 전 -->
  <g>
    <!-- Section 1 Box/Label -->
    <rect x="24" y="24" width="832" height="196" fill="#f8fafc" stroke="#e4e7eb" stroke-width="1" rx="8"/>
    <text x="44" y="55" font-size="16" font-weight="bold" fill="#1f2933">git switch feature; git rebase main   실행 전</text>

    <!-- Connectors (Edges) -->
    <!-- c1 - - c2 -->
    <path d="M 122 130 L 168 130" stroke="#9aa5b1" stroke-width="2"/>
    <!-- c2 - - c3 (up) -->
    <path d="M 222 120 L 278 80" stroke="#9aa5b1" stroke-width="2"/>
    <!-- c3 - - c4 -->
    <path d="M 332 80 L 378 80" stroke="#9aa5b1" stroke-width="2"/>
    <!-- c2 - - c5 (down) -->
    <path d="M 222 140 L 278 180" stroke="#9aa5b1" stroke-width="2"/>
    <!-- c5 - - c6 -->
    <path d="M 332 180 L 378 180" stroke="#9aa5b1" stroke-width="2"/>

    <!-- Nodes (Commits) -->
    <!-- c1 -->
    <rect x="70" y="110" width="52" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="96" y="134" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c1</text>

    <!-- c2 -->
    <rect x="170" y="110" width="52" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="196" y="134" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c2</text>

    <!-- c3 (feature branch commit) -->
    <rect x="280" y="60" width="52" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="306" y="84" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">c3</text>

    <!-- c4 (feature branch commit) -->
    <rect x="380" y="60" width="52" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="406" y="84" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">c4</text>

    <!-- Branch Pointer: feature -->
    <path d="M 432 80 L 488 80" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <rect x="490" y="66" width="76" height="28" rx="14" fill="#7c3aed"/>
    <text x="528" y="84" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">feature</text>

    <!-- c5 (main branch commit) -->
    <rect x="280" y="160" width="52" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="306" y="184" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">c5</text>

    <!-- c6 (main branch commit) -->
    <rect x="380" y="160" width="52" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="406" y="184" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">c6</text>

    <!-- Branch Pointer: main -->
    <path d="M 432 180 L 488 180" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <rect x="490" y="166" width="60" height="28" rx="14" fill="#2563eb"/>
    <text x="520" y="184" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">main</text>
  </g>

  <!-- Section 2: 실행 후 -->
  <g>
    <!-- Section 2 Box/Label -->
    <rect x="24" y="236" width="832" height="240" fill="#f8fafc" stroke="#e4e7eb" stroke-width="1" rx="8"/>
    <text x="44" y="267" font-size="16" font-weight="bold" fill="#1f2933">실행 후 — c3, c4의 변경 내용을 c6 위에 순서대로 재적용</text>

    <!-- Connectors (Edges) -->
    <!-- c1 - - c2 -->
    <path d="M 122 340 L 168 340" stroke="#9aa5b1" stroke-width="2"/>
    <!-- c2 - - c5 -->
    <path d="M 222 340 L 268 340" stroke="#9aa5b1" stroke-width="2"/>
    <!-- c5 - - c6 -->
    <path d="M 322 340 L 368 340" stroke="#9aa5b1" stroke-width="2"/>
    <!-- c6 - - c3' -->
    <path d="M 422 340 L 468 340" stroke="#7c3aed" stroke-width="2"/>
    <!-- c3' - - c4' -->
    <path d="M 522 340 L 568 340" stroke="#7c3aed" stroke-width="2"/>

    <!-- Nodes (Commits) -->
    <!-- c1 -->
    <rect x="70" y="320" width="52" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="96" y="344" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c1</text>

    <!-- c2 -->
    <rect x="170" y="320" width="52" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="196" y="344" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c2</text>

    <!-- c5 -->
    <rect x="270" y="320" width="52" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="296" y="344" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">c5</text>

    <!-- c6 -->
    <rect x="370" y="320" width="52" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="396" y="344" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">c6</text>

    <!-- c3' (rebased) -->
    <rect x="470" y="320" width="52" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="496" y="344" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">c3'</text>

    <!-- c4' (rebased) -->
    <rect x="570" y="320" width="52" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="596" y="344" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">c4'</text>

    <!-- Branch Pointer: feature -->
    <path d="M 622 340 L 668 340" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <rect x="670" y="326" width="76" height="28" rx="14" fill="#7c3aed"/>
    <text x="708" y="344" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">feature</text>

    <!-- Pointer Arrow pointing up to c6 from main -->
    <path d="M 396 400 L 396 369" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Branch Pointer: main -->
    <rect x="366" y="402" width="60" height="28" rx="14" fill="#2563eb"/>
    <text x="396" y="420" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">main</text>

    <!-- Footnote -->
    <text x="44" y="458" font-size="11" font-style="italic" fill="#52606d">(c3, c4는 어떤 브랜치도 가리키지 않게 되어 나중에 정리된다)</text>
  </g>
</svg>