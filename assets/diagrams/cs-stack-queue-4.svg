<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4. 원형 큐 (Circular Queue)</title>
  <desc id="d">capacity 5인 배열에서 enqueue 5번, dequeue 3번 후 rear가 끝에 닿아 더 이상 데이터를 넣지 못하는 상태를 나타낸 다이어그램</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 상단 설명 -->
  <rect x="190" y="30" width="500" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="54.9" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">capacity 5인 배열. enqueue 5번, dequeue 3번 후</text>

  <!-- 배열 셀 0..4 -->
  <rect x="215" y="95" width="90" height="70" fill="#f8fafc" stroke="#cbd2d9" stroke-width="2"/>
  <text x="260" y="136.3" font-size="18" font-weight="bold" fill="#9aa5b1" text-anchor="middle">/</text>

  <rect x="305" y="95" width="90" height="70" fill="#f8fafc" stroke="#cbd2d9" stroke-width="2"/>
  <text x="350" y="136.3" font-size="18" font-weight="bold" fill="#9aa5b1" text-anchor="middle">/</text>

  <rect x="395" y="95" width="90" height="70" fill="#f8fafc" stroke="#cbd2d9" stroke-width="2"/>
  <text x="440" y="136.3" font-size="18" font-weight="bold" fill="#9aa5b1" text-anchor="middle">/</text>

  <rect x="485" y="95" width="90" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="530" y="136.3" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">D</text>

  <rect x="575" y="95" width="90" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="136.3" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">E</text>

  <!-- 인덱스 번호 -->
  <text x="260" y="179.55" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">0</text>
  <text x="350" y="179.55" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">1</text>
  <text x="440" y="179.55" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">2</text>
  <text x="530" y="179.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">3</text>
  <text x="620" y="179.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text>

  <!-- 포인터 화살표 & 라벨 -->
  <path d="M530,235 L530,192" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <text x="530" y="253.55" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">front</text>

  <path d="M620,235 L620,192" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <text x="620" y="253.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">rear</text>

  <!-- 하단 문제 상황 설명 -->
  <rect x="160" y="280" width="560" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="307.9" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">앞쪽 3칸이 놀고 있는데 rear가 끝에 닿아 더 못 넣는다.</text>
</svg>