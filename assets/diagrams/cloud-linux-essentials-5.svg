<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 688" width="880" height="688" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">리눅스 파일 시스템 계층(FHS) 디렉터리 트리</title>
  <desc id="d">루트(/) 아래 bin, sbin, etc, var, home, root, tmp, opt, usr, proc, sys, dev, boot 디렉터리와 etc·var의 주요 하위 항목을 들여쓰기 트리로 보이고, 각 디렉터리에 무엇을 두는지 오른쪽 열에 적었다.</desc>
  <rect width="880" height="688" fill="#ffffff"/>
  <rect x="24" y="56" width="832" height="32" fill="#f3f6fa"/>
  <rect x="24" y="120" width="832" height="128" fill="#f3f6fa"/>
  <rect x="24" y="376" width="832" height="32" fill="#f3f6fa"/>
  <rect x="24" y="440" width="832" height="32" fill="#f3f6fa"/>
  <rect x="24" y="504" width="832" height="32" fill="#f3f6fa"/>
  <rect x="24" y="568" width="832" height="32" fill="#f3f6fa"/>
  <rect x="24" y="632" width="832" height="32" fill="#f3f6fa"/>
  <path d="M42,53 V648" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,72 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,104 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,136 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M78,168 H91" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M78,200 H91" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M78,232 H91" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M78,147 V232" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,264 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M78,296 H91" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M78,328 H91" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M78,360 H91" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M78,275 V360" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,392 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,424 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,456 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,488 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,520 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,552 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,584 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,616 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M42,648 H56" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <text x="34" y="47" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="21" font-weight="bold" fill="#111827">/</text>
  <text x="270" y="45" font-size="14" fill="#4b5563">디렉터리마다 무엇을 두는지 (FHS)</text>
  <text x="64" y="77.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">bin/</text>
  <text x="270" y="77.5" font-size="15" fill="#1f2937"><tspan>기본 실행 파일 (ls, cp, cat) — 요즘 배포판은 </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/usr/bin</tspan><tspan> 심볼릭 링크</tspan></text>
  <text x="64" y="109.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">sbin/</text>
  <text x="270" y="109.5" font-size="15" fill="#1f2937"><tspan>관리자용 실행 파일 (ip, iptables)</tspan></text>
  <text x="64" y="141.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">etc/</text>
  <text x="270" y="141.5" font-size="15" fill="#1f2937"><tspan>설정 파일. 텍스트. </tspan><tspan font-weight="bold" fill="#b45309">백업 1순위</tspan></text>
  <text x="98" y="173" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="normal" fill="#1f2937">ssh/sshd_config</text>
  <text x="98" y="205" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="normal" fill="#1f2937">fstab</text>
  <text x="270" y="205.5" font-size="15" fill="#1f2937"><tspan>부팅 시 마운트할 파일시스템 목록</tspan></text>
  <text x="98" y="237" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#1e3a8a">systemd/system/</text>
  <text x="270" y="237.5" font-size="15" fill="#1f2937"><tspan>서비스 유닛 정의</tspan></text>
  <text x="64" y="269.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">var/</text>
  <text x="270" y="269.5" font-size="15" fill="#1f2937"><tspan>"가변" 데이터. 실행 중 계속 커지는 것들</tspan></text>
  <text x="98" y="301" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#1e3a8a">log/</text>
  <text x="270" y="301.5" font-size="15" fill="#1f2937"><tspan>로그 </tspan><tspan font-weight="bold" fill="#b45309">← 장애 대응의 출발점</tspan></text>
  <text x="98" y="333" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#1e3a8a">lib/</text>
  <text x="270" y="333.5" font-size="15" fill="#1f2937"><tspan>서비스별 상태 데이터 (docker, mysql)</tspan></text>
  <text x="98" y="365" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#1e3a8a">spool/</text>
  <text x="270" y="365.5" font-size="15" fill="#1f2937"><tspan>큐 (cron, mail)</tspan></text>
  <text x="64" y="397.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">home/</text>
  <text x="270" y="397.5" font-size="15" fill="#1f2937"><tspan>일반 사용자 홈. </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/home/ubuntu</tspan><tspan>, </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/home/deploy</tspan></text>
  <text x="64" y="429.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">root/</text>
  <text x="270" y="429.5" font-size="15" fill="#1f2937"><tspan>root 계정의 홈 </tspan><tspan font-weight="bold" fill="#b45309">(/ 가 아니다)</tspan></text>
  <text x="64" y="461.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">tmp/</text>
  <text x="270" y="461.5" font-size="15" fill="#1f2937"><tspan>임시 파일. </tspan><tspan font-weight="bold" fill="#b45309">재부팅 시 삭제되는 경우가 많음</tspan></text>
  <text x="64" y="493.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">opt/</text>
  <text x="270" y="493.5" font-size="15" fill="#1f2937"><tspan>배포판 패키지가 아닌 자체/상용 소프트웨어</tspan></text>
  <text x="64" y="525.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">usr/</text>
  <text x="270" y="525.5" font-size="15" fill="#1f2937"><tspan>읽기 전용 프로그램과 라이브러리 (원래 user 홈이 있던 자리에서 유래)</tspan></text>
  <text x="64" y="557.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">proc/</text>
  <text x="270" y="557.5" font-size="15" fill="#1f2937"><tspan>가짜 파일시스템. 커널·프로세스 정보가 파일처럼 보임</tspan></text>
  <text x="64" y="589.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">sys/</text>
  <text x="270" y="589.5" font-size="15" fill="#1f2937"><tspan>가짜 파일시스템. 커널이 노출한 장치·드라이버 설정</tspan></text>
  <text x="64" y="621.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">dev/</text>
  <text x="270" y="621.5" font-size="15" fill="#1f2937"><tspan>장치 파일 (</tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/dev/null</tspan><tspan>, </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/dev/sda1</tspan><tspan>)</tspan></text>
  <text x="64" y="653.5" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#1e3a8a">boot/</text>
  <text x="270" y="653.5" font-size="15" fill="#1f2937"><tspan>커널 이미지와 부트로더</tspan></text>
</svg>
