<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Trace 타임라인과 병목</title>
  <desc id="d">0ms부터 130ms까지의 가로 시간축 위에 API Gateway 130ms, User Service 40ms, DB Query 15ms, Order Service 80ms, Payment API 50ms 구간을 막대로 그렸고, 라벨 들여쓰기로 부모-자식 관계(API Gateway 아래 User Service·Order Service, 그 아래 DB Query·Payment API)를 나타냈다. 총 소요시간은 130ms, 병목 구간은 Payment API(50ms).</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- bottleneck row band -->
  <rect x="28" y="250" width="824" height="44" rx="6" fill="#fef2f2"/>

  <!-- time axis: 0ms at x=220, 130ms at x=740 (4px per ms) -->
  <text x="220" y="44" font-size="15" fill="#4b5563" text-anchor="middle">0ms</text>
  <text x="420" y="44" font-size="15" fill="#4b5563" text-anchor="middle">50ms</text>
  <text x="620" y="44" font-size="15" fill="#4b5563" text-anchor="middle">100ms</text>
  <text x="740" y="44" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">130ms</text>
  <line x1="220" y1="58" x2="740" y2="58" stroke="#6b7280" stroke-width="1.5"/>
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="220" y1="52" x2="220" y2="64"/>
    <line x1="420" y1="52" x2="420" y2="64"/>
    <line x1="620" y1="52" x2="620" y2="64"/>
    <line x1="740" y1="52" x2="740" y2="64"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="220" y1="66" x2="220" y2="294"/>
    <line x1="420" y1="66" x2="420" y2="294"/>
    <line x1="620" y1="66" x2="620" y2="294"/>
    <line x1="740" y1="66" x2="740" y2="294"/>
  </g>

  <!-- Row 1: API Gateway 0-130ms -->
  <text x="40" y="102" font-size="16" font-weight="bold" fill="#1f2937">API Gateway</text>
  <rect x="220" y="84" width="520" height="24" rx="4" fill="#475569"/>
  <text x="840" y="102" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">130ms</text>

  <!-- Row 2: User Service 5-45ms -->
  <text x="60" y="146" font-size="16" fill="#1f2937">User Service</text>
  <rect x="240" y="128" width="160" height="24" rx="4" fill="#64748b"/>
  <text x="840" y="146" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">40ms</text>

  <!-- Row 3: DB Query 15-30ms -->
  <text x="80" y="190" font-size="16" fill="#1f2937">DB Query</text>
  <rect x="280" y="172" width="60" height="24" rx="4" fill="#64748b"/>
  <text x="840" y="190" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">15ms</text>

  <!-- Row 4: Order Service 45-125ms -->
  <text x="60" y="234" font-size="16" fill="#1f2937">Order Service</text>
  <rect x="400" y="216" width="320" height="24" rx="4" fill="#64748b"/>
  <text x="840" y="234" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">80ms</text>

  <!-- Row 5: Payment API 60-110ms (bottleneck) -->
  <text x="80" y="278" font-size="16" font-weight="bold" fill="#b91c1c">Payment API</text>
  <rect x="460" y="260" width="200" height="24" rx="4" fill="#dc2626"/>
  <rect x="670" y="260" width="56" height="24" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="698" y="277" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">병목</text>
  <text x="840" y="278" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="end">50ms</text>

  <!-- summary -->
  <line x1="40" y1="314" x2="840" y2="314" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="40" y="330" width="220" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="150" y="356" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">총 소요시간: 130ms</text>
  <rect x="280" y="330" width="300" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="430" y="356" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">병목 구간: Payment API (50ms)</text>
</svg>
