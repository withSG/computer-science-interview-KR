<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">탐색 순서 비교</title>
  <desc id="d">트리 구조에서 DFS와 BFS의 탐색 순서를 비교하는 다이어그램</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">탐색 순서 비교</text>

  <!-- 트리 영역 배경 -->
  <rect x="30" y="55" width="820" height="175" rx="8" fill="#f8fafc" stroke="#e4e7eb" stroke-width="1"/>

  <!-- 레벨 가이드라인 (점선) -->
  <line x1="50" y1="90" x2="830" y2="90" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="50" y1="145" x2="830" y2="145" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="50" y1="200" x2="830" y2="200" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 트리 간선 (Edges) -->
  <!-- 1 -> 2, 3, 4 -->
  <line x1="440" y1="90" x2="310" y2="145" stroke="#52606d" stroke-width="2"/>
  <line x1="440" y1="90" x2="440" y2="145" stroke="#52606d" stroke-width="2"/>
  <line x1="440" y1="90" x2="570" y2="145" stroke="#52606d" stroke-width="2"/>

  <!-- 2 -> 5, 6 -->
  <line x1="310" y1="145" x2="245" y2="200" stroke="#52606d" stroke-width="2"/>
  <line x1="310" y1="145" x2="375" y2="200" stroke="#52606d" stroke-width="2"/>

  <!-- 4 -> 7 -->
  <line x1="570" y1="145" x2="570" y2="200" stroke="#52606d" stroke-width="2"/>

  <!-- 트리 노드 (Nodes) -->
  <!-- Level 1 -->
  <circle cx="440" cy="90" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="440" y="94.7" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

  <!-- Level 2 -->
  <circle cx="310" cy="145" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="310" y="149.7" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

  <circle cx="440" cy="145" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="440" y="149.7" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

  <circle cx="570" cy="145" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="570" y="149.7" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

  <!-- Level 3 -->
  <circle cx="245" cy="200" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="245" y="204.7" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>

  <circle cx="375" cy="200" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="375" y="204.7" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">6</text>

  <circle cx="570" cy="200" r="18" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="570" y="204.7" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">7</text>

  <!-- DFS 결과 박스 -->
  <rect x="30" y="245" width="820" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="274.5" font-size="14" font-weight="bold" fill="#2563eb">DFS:</text>
  
  <text x="100" y="274.5" font-size="14" font-weight="bold" fill="#1f2933">1</text>
  <path d="M 115 270 L 135 270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-blue)"/>
  
  <text x="145" y="274.5" font-size="14" font-weight="bold" fill="#1f2933">2</text>
  <path d="M 160 270 L 180 270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-blue)"/>
  
  <text x="190" y="274.5" font-size="14" font-weight="bold" fill="#1f2933">5</text>
  <path d="M 205 270 L 225 270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-blue)"/>
  
  <text x="235" y="274.5" font-size="14" font-weight="bold" fill="#1f2933">6</text>
  <path d="M 250 270 L 270 270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-blue)"/>
  
  <text x="280" y="274.5" font-size="14" font-weight="bold" fill="#1f2933">3</text>
  <path d="M 295 270 L 315 270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-blue)"/>
  
  <text x="325" y="274.5" font-size="14" font-weight="bold" fill="#1f2933">4</text>
  <path d="M 340 270 L 360 270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-blue)"/>
  
  <text x="370" y="274.5" font-size="14" font-weight="bold" fill="#1f2933">7</text>

  <text x="400" y="274" font-size="13" fill="#52606d">(깊이 먼저)</text>

  <!-- BFS 결과 박스 -->
  <rect x="30" y="305" width="820" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="50" y="334.5" font-size="14" font-weight="bold" fill="#059669">BFS:</text>
  
  <text x="100" y="334.5" font-size="14" font-weight="bold" fill="#1f2933">1</text>
  <path d="M 115 330 L 135 330" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-green)"/>
  
  <text x="145" y="334.5" font-size="14" font-weight="bold" fill="#1f2933">2</text>
  <path d="M 160 330 L 180 330" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-green)"/>
  
  <text x="190" y="334.5" font-size="14" font-weight="bold" fill="#1f2933">3</text>
  <path d="M 205 330 L 225 330" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-green)"/>
  
  <text x="235" y="334.5" font-size="14" font-weight="bold" fill="#1f2933">4</text>
  <path d="M 250 330 L 270 330" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-green)"/>
  
  <text x="280" y="334.5" font-size="14" font-weight="bold" fill="#1f2933">5</text>
  <path d="M 295 330 L 315 330" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-green)"/>
  
  <text x="325" y="334.5" font-size="14" font-weight="bold" fill="#1f2933">6</text>
  <path d="M 340 330 L 360 330" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#a-green)"/>
  
  <text x="370" y="334.5" font-size="14" font-weight="bold" fill="#1f2933">7</text>

  <text x="400" y="334" font-size="13" fill="#52606d">(레벨 순서)</text>
</svg>