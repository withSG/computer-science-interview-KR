<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">플랫폼 스레드와 가상 스레드의 매핑</title>
  <desc id="d">플랫폼 스레드는 Java 스레드 하나가 OS 스레드 하나에 1:1로 묶여 수천 개가 한계이고, 가상 스레드는 M개(VT1~VT100000)가 ForkJoinPool 캐리어 N개(보통 코어 수)에 올라타며 캐리어가 OS 스레드와 1:1로 묶이는 M:N 매핑임을 나란히 비교한다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ===== 왼쪽: 플랫폼 스레드 ===== -->
  <path d="M24,70 V34 Q24,24 34,24 H402 Q412,24 412,34 V70 Z" fill="#f1f5f9"/>
  <path d="M24,404 V434 Q24,444 34,444 H402 Q412,444 412,434 V404 Z" fill="#fef2f2"/>
  <rect x="24" y="24" width="388" height="420" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="70" x2="412" y2="70" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="404" x2="412" y2="404" stroke="#fecaca" stroke-width="1"/>
  <text x="218" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">플랫폼 스레드 (기존)</text>

  <!-- Java Thread 행 -->
  <rect x="44" y="108" width="108" height="44" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="98" y="136" text-anchor="middle" font-size="15" fill="#1f2937">Java Thread</text>
  <rect x="164" y="108" width="108" height="44" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="218" y="136" text-anchor="middle" font-size="15" fill="#1f2937">Java Thread</text>
  <rect x="284" y="108" width="108" height="44" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="338" y="136" text-anchor="middle" font-size="15" fill="#1f2937">Java Thread</text>

  <!-- 1:1 연결 -->
  <line x1="98" y1="152" x2="98" y2="346" stroke="#475569" stroke-width="2"/>
  <line x1="218" y1="152" x2="218" y2="346" stroke="#475569" stroke-width="2"/>
  <line x1="338" y1="152" x2="338" y2="346" stroke="#475569" stroke-width="2"/>
  <text x="106" y="254" font-size="15" font-weight="bold" fill="#374151">1:1</text>
  <text x="226" y="254" font-size="15" font-weight="bold" fill="#374151">1:1</text>
  <text x="346" y="254" font-size="15" font-weight="bold" fill="#374151">1:1</text>

  <!-- OS Thread 행 -->
  <rect x="44" y="346" width="108" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="98" y="374" text-anchor="middle" font-size="15" fill="#1f2937">OS Thread</text>
  <rect x="164" y="346" width="108" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="218" y="374" text-anchor="middle" font-size="15" fill="#1f2937">OS Thread</text>
  <rect x="284" y="346" width="108" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="338" y="374" text-anchor="middle" font-size="15" fill="#1f2937">OS Thread</text>

  <!-- 왼쪽 결론 -->
  <text x="218" y="430" text-anchor="middle" font-size="18" font-weight="bold"><tspan fill="#1f2937">1 : 1 매핑</tspan><tspan fill="#b91c1c"> · 수천 개가 한계</tspan></text>

  <!-- ===== 오른쪽: 가상 스레드 ===== -->
  <path d="M436,70 V34 Q436,24 446,24 H846 Q856,24 856,34 V70 Z" fill="#ede9fe"/>
  <path d="M436,404 V434 Q436,444 446,444 H846 Q856,444 856,434 V404 Z" fill="#f5f3ff"/>
  <rect x="436" y="24" width="420" height="420" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="436" y1="70" x2="856" y2="70" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="436" y1="404" x2="856" y2="404" stroke="#ddd6fe" stroke-width="1"/>
  <text x="646" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b21b6">가상 스레드 (Java 21)</text>

  <!-- 가상 스레드 행 (M개) -->
  <rect x="456" y="108" width="54" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="483" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">VT1</text>
  <rect x="518" y="108" width="54" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="545" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">VT2</text>
  <rect x="580" y="108" width="54" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="607" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">VT3</text>
  <text x="656" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">…</text>
  <rect x="678" y="108" width="98" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="727" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">VT100000</text>
  <text x="788" y="136" font-size="15" fill="#374151">(M개)</text>

  <!-- 모여드는 화살표 -->
  <line x1="483" y1="152" x2="646" y2="184" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="545" y1="152" x2="646" y2="184" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="607" y1="152" x2="646" y2="184" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="727" y1="152" x2="646" y2="184" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="646" y1="184" x2="646" y2="204" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ForkJoinPool (캐리어) -->
  <rect x="456" y="208" width="380" height="92" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="472" y="234" font-size="16" font-weight="bold" fill="#6d28d9">ForkJoinPool (캐리어)</text>
  <text x="820" y="234" text-anchor="end" font-size="15" fill="#374151">N개, 보통 코어 수</text>
  <rect x="472" y="244" width="78" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="511" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">C1</text>
  <rect x="562" y="244" width="78" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="601" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">C2</text>
  <rect x="652" y="244" width="78" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="691" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">C3</text>
  <rect x="742" y="244" width="78" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="781" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">C4</text>

  <!-- 캐리어-OS 1:1 -->
  <line x1="511" y1="300" x2="511" y2="346" stroke="#475569" stroke-width="2"/>
  <line x1="601" y1="300" x2="601" y2="346" stroke="#475569" stroke-width="2"/>
  <line x1="691" y1="300" x2="691" y2="346" stroke="#475569" stroke-width="2"/>
  <line x1="781" y1="300" x2="781" y2="346" stroke="#475569" stroke-width="2"/>
  <text x="519" y="328" font-size="15" font-weight="bold" fill="#374151">1:1</text>
  <text x="609" y="328" font-size="15" font-weight="bold" fill="#374151">1:1</text>
  <text x="699" y="328" font-size="15" font-weight="bold" fill="#374151">1:1</text>
  <text x="789" y="328" font-size="15" font-weight="bold" fill="#374151">1:1</text>

  <!-- OS 행 -->
  <rect x="472" y="346" width="78" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="511" y="374" text-anchor="middle" font-size="15" fill="#1f2937">OS</text>
  <rect x="562" y="346" width="78" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="601" y="374" text-anchor="middle" font-size="15" fill="#1f2937">OS</text>
  <rect x="652" y="346" width="78" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="691" y="374" text-anchor="middle" font-size="15" fill="#1f2937">OS</text>
  <rect x="742" y="346" width="78" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="781" y="374" text-anchor="middle" font-size="15" fill="#1f2937">OS</text>

  <!-- 오른쪽 결론 -->
  <text x="646" y="430" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">M : N 매핑</text>
</svg>
