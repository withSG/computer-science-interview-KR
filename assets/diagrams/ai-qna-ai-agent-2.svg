<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LangGraph를 쓰는 이유</title>
  <desc id="d">LangGraph의 4가지 주요 특징인 순환 표현, 상태 기반, 조건부 분기, 체크포인트를 나타낸 목록</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <rect x="24" y="24" width="832" height="292" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <rect x="48" y="48" width="784" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="68" cy="74" r="4" fill="#2563eb"/>
  <text x="82" y="79" font-size="14" font-weight="bold" fill="#1f2933">순환(loop) 표현 가능</text>
  <path d="M 235 74 L 255 74" stroke="#52606d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="265" y="79" font-size="13" fill="#52606d">→ 에이전트 반복 루프에 적합</text>
  
  <rect x="48" y="112" width="784" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="68" cy="138" r="4" fill="#059669"/>
  <text x="82" y="143" font-size="14" font-weight="bold" fill="#1f2933">상태 기반</text>
  <path d="M 155 138 L 175 138" stroke="#52606d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="185" y="143" font-size="13" fill="#52606d">→ 복잡한 워크플로우의 데이터 흐름 명확</text>
  
  <rect x="48" y="176" width="784" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="68" cy="202" r="4" fill="#d97706"/>
  <text x="82" y="207" font-size="14" font-weight="bold" fill="#1f2933">조건부 분기</text>
  <path d="M 170 202 L 190 202" stroke="#52606d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="200" y="207" font-size="13" fill="#52606d">→ 동적 라우팅</text>
  
  <rect x="48" y="240" width="784" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="68" cy="266" r="4" fill="#7c3aed"/>
  <text x="82" y="271" font-size="14" font-weight="bold" fill="#1f2933">체크포인트</text>
  <path d="M 170 266 L 190 266" stroke="#52606d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="200" y="271" font-size="13" fill="#52606d">→ 중단/재개, Human-in-the-Loop 지원</text>
</svg>