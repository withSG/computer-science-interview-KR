<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LangGraph를 쓰는 이유</title>
  <desc id="d">LangGraph의 네 가지 특징(순환 표현, 상태 기반, 조건부 분기, 체크포인트)과 각각이 주는 효과를 짝지어 보여준다.</desc>
  <rect width="880" height="352" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="40" y="44" font-size="15" font-weight="bold" fill="#4b5563">특징</text>
  <text x="392" y="44" font-size="15" font-weight="bold" fill="#4b5563">효과</text>
  <line x1="24" y1="58" x2="856" y2="58" stroke="#d1d5db" stroke-width="1"/>

  <!-- 1 순환 -->
  <rect x="24" y="76" width="304" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="108" font-size="17" font-weight="bold" fill="#1e3a8a">순환(loop) 표현 가능</text>
  <line x1="328" y1="102" x2="372" y2="102" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="376" y="76" width="480" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="396" y="108" font-size="16" fill="#111827">에이전트 반복 루프에 적합</text>

  <!-- 2 상태 기반 -->
  <rect x="24" y="144" width="304" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="176" font-size="17" font-weight="bold" fill="#1e3a8a">상태 기반</text>
  <line x1="328" y1="170" x2="372" y2="170" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="376" y="144" width="480" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="396" y="176" font-size="16" fill="#111827">복잡한 워크플로우의 데이터 흐름 명확</text>

  <!-- 3 조건부 분기 -->
  <rect x="24" y="212" width="304" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="244" font-size="17" font-weight="bold" fill="#1e3a8a">조건부 분기</text>
  <line x1="328" y1="238" x2="372" y2="238" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="376" y="212" width="480" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="396" y="244" font-size="16" fill="#111827">동적 라우팅</text>

  <!-- 4 체크포인트 -->
  <rect x="24" y="280" width="304" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="312" font-size="17" font-weight="bold" fill="#1e3a8a">체크포인트</text>
  <line x1="328" y1="306" x2="372" y2="306" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="376" y="280" width="480" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="396" y="312" font-size="16" fill="#111827">중단/재개, Human-in-the-Loop 지원</text>
</svg>
