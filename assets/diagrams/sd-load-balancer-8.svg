<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 564" width="880" height="564" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">우아한 종료와 커넥션 드레이닝 순서</title>
  <desc id="d">잘못된 순서는 프로세스를 먼저 종료해 LB가 알아채기 전 도착한 요청이 전부 실패하고 502 Bad Gateway가 난다. 올바른 순서는 헬스체크를 실패로 돌린 뒤 LB가 목록에서 제외할 때까지 기다리고, 진행 중인 요청과 자원을 정리한 다음 마지막에 프로세스를 종료한다.</desc>
  <rect width="880" height="564" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <line x1="356" y1="28" x2="356" y2="540" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 잘못된 순서 -->
  <text x="24" y="48" font-size="18" font-weight="700" fill="#b91c1c">잘못된 순서</text>
  <rect x="24" y="58" width="312" height="3" fill="#b91c1c"/>

  <rect x="24" y="76" width="312" height="44" rx="6" fill="#374151"/>
  <text x="180" y="104" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">프로세스 종료</text>
  <line x1="180" y1="124" x2="180" y2="144" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="24" y="150" width="312" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="180" y="178" font-size="16" fill="#111827" text-anchor="middle">LB: "어? 연결이 끊겼네"</text>
  <line x1="180" y1="198" x2="180" y2="240" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <text x="194" y="224" font-size="15" fill="#4b5563">(아직 모름)</text>
  <rect x="24" y="246" width="312" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="180" y="274" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">이 사이 도착한 요청 전부 실패</text>
  <line x1="180" y1="294" x2="180" y2="314" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="24" y="320" width="312" height="44" rx="6" fill="#b91c1c"/>
  <text x="180" y="348" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">502 Bad Gateway</text>

  <!-- 올바른 순서 -->
  <text x="376" y="48" font-size="18" font-weight="700" fill="#047857">올바른 순서</text>
  <rect x="376" y="58" width="480" height="3" fill="#047857"/>

  <rect x="376" y="76" width="480" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <circle cx="402" cy="98" r="14" fill="#047857"/>
  <text x="402" y="103" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="428" y="104" font-size="16" fill="#111827">종료 시작 (<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SIGTERM</tspan> 수신 또는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">preStop</tspan> 훅)</text>
  <line x1="616" y1="124" x2="616" y2="144" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="376" y="150" width="480" height="60" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <circle cx="402" cy="180" r="14" fill="#047857"/>
  <text x="402" y="185" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="428" y="175" font-size="16" fill="#111827">헬스체크를 즉시 실패로 전환</text>
  <text x="428" y="198" font-size="15" fill="#4b5563">또는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">preStop</tspan> 훅에서 대기</text>
  <line x1="616" y1="214" x2="616" y2="234" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="376" y="240" width="480" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="402" cy="270" r="14" fill="#b45309"/>
  <text x="402" y="275" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="428" y="265" font-size="16" font-weight="700" fill="#111827">LB가 목록에서 제외할 때까지 기다린다</text>
  <text x="428" y="288" font-size="15" font-weight="700" fill="#b45309">여기가 핵심. 주기×임계값만큼</text>
  <line x1="616" y1="304" x2="616" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="376" y="330" width="480" height="60" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <circle cx="402" cy="360" r="14" fill="#047857"/>
  <text x="402" y="365" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="428" y="355" font-size="16" fill="#111827">새 요청은 더 이상 오지 않음</text>
  <text x="428" y="378" font-size="15" fill="#4b5563">진행 중인 요청만 끝까지 처리</text>
  <line x1="616" y1="394" x2="616" y2="414" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="376" y="420" width="480" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <circle cx="402" cy="442" r="14" fill="#047857"/>
  <text x="402" y="447" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="428" y="448" font-size="16" fill="#111827">커넥션 풀·컨슈머·스케줄러 정리</text>
  <line x1="616" y1="468" x2="616" y2="488" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="376" y="494" width="480" height="44" rx="6" fill="#374151"/>
  <circle cx="402" cy="516" r="14" fill="#ffffff"/>
  <text x="402" y="521" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">6</text>
  <text x="428" y="522" font-size="16" font-weight="700" fill="#ffffff">프로세스 종료</text>
</svg>
