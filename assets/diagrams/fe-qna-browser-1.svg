<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">핵심 답변</title>
  <desc id="d">브라우저에 URL을 입력했을 때 일어나는 핵심 과정 6단계를 나타낸 순서도</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Main Container / Header Context -->
  <rect x="24" y="24" width="832" height="492" rx="12" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="24" y="24" width="832" height="50" rx="12" fill="#eff6ff"/>
  <path d="M24,74 L856,74" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="44" y="56" fill="#1f2933" font-size="16" font-weight="bold">핵심 답변</text>

  <!-- Step 1 -->
  <g transform="translate(140, 94)">
    <rect x="0" y="0" width="600" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="29" fill="#2563eb" font-size="14" font-weight="bold">1. URL 파싱</text>
    <text x="120" y="29" fill="#1f2933" font-size="14">→</text>
    <text x="145" y="29" fill="#52606d" font-size="13">프로토콜, 도메인, 경로 분리</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,142 L440,162" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 -->
  <g transform="translate(140, 162)">
    <rect x="0" y="0" width="600" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="29" fill="#2563eb" font-size="14" font-weight="bold">2. DNS 조회</text>
    <text x="120" y="29" fill="#1f2933" font-size="14">→</text>
    <text x="145" y="29" fill="#52606d" font-size="13">도메인을 IP 주소로 변환</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,210 L440,230" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3 -->
  <g transform="translate(140, 230)">
    <rect x="0" y="0" width="600" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="29" fill="#2563eb" font-size="14" font-weight="bold">3. TCP 연결</text>
    <text x="120" y="29" fill="#1f2933" font-size="14">→</text>
    <text x="145" y="29" fill="#52606d" font-size="13">3-way handshake</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,278 L440,298" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4 -->
  <g transform="translate(140, 298)">
    <rect x="0" y="0" width="600" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="29" fill="#2563eb" font-size="14" font-weight="bold">4. HTTP 요청</text>
    <text x="120" y="29" fill="#1f2933" font-size="14">→</text>
    <text x="145" y="29" fill="#52606d" font-size="13">서버에 리소스 요청</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,346 L440,366" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 5 -->
  <g transform="translate(140, 366)">
    <rect x="0" y="0" width="600" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="29" fill="#2563eb" font-size="14" font-weight="bold">5. 응답 수신</text>
    <text x="120" y="29" fill="#1f2933" font-size="14">→</text>
    <text x="145" y="29" fill="#52606d" font-size="13">HTML, CSS, JS 등</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M440,414 L440,434" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 6 (Highlighted as client-side rendering start) -->
  <g transform="translate(140, 434)">
    <rect x="0" y="0" width="600" height="48" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="20" y="29" fill="#7c3aed" font-size="14" font-weight="bold">6. 브라우저 렌더링</text>
    <text x="155" y="29" fill="#1f2933" font-size="14">→</text>
    <text x="180" y="29" fill="#52606d" font-size="13">CRP 시작</text>
  </g>
</svg>