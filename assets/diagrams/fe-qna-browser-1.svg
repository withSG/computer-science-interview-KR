<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">URL 입력 후 6단계</title>
  <desc id="d">URL 파싱, DNS 조회, TCP 연결, HTTP 요청, 응답 수신을 거쳐 브라우저 렌더링(CRP 시작)에 이르는 6단계를 위에서 아래로 차례대로 보여준다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 번호 사이 화살표 -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M56,71 L56,94"/>
    <path d="M56,139 L56,162"/>
    <path d="M56,207 L56,230"/>
    <path d="M56,275 L56,298"/>
    <path d="M56,343 L56,366"/>
  </g>

  <!-- 1 -->
  <rect x="96" y="24" width="760" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="50" r="18" fill="#1d4ed8"/>
  <text x="56" y="55.5" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">1</text>
  <text x="120" y="56" fill="#1d4ed8" font-size="17" font-weight="bold">URL 파싱</text>
  <path d="M292,36 L292,64" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="316" y="56" fill="#374151" font-size="16">프로토콜, 도메인, 경로 분리</text>

  <!-- 2 -->
  <rect x="96" y="92" width="760" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="118" r="18" fill="#1d4ed8"/>
  <text x="56" y="123.5" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">2</text>
  <text x="120" y="124" fill="#1d4ed8" font-size="17" font-weight="bold">DNS 조회</text>
  <path d="M292,104 L292,132" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="316" y="124" fill="#374151" font-size="16">도메인을 IP 주소로 변환</text>

  <!-- 3 -->
  <rect x="96" y="160" width="760" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="186" r="18" fill="#1d4ed8"/>
  <text x="56" y="191.5" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">3</text>
  <text x="120" y="192" fill="#1d4ed8" font-size="17" font-weight="bold">TCP 연결</text>
  <path d="M292,172 L292,200" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="316" y="192" fill="#374151" font-size="16">3-way handshake</text>

  <!-- 4 -->
  <rect x="96" y="228" width="760" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="254" r="18" fill="#1d4ed8"/>
  <text x="56" y="259.5" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">4</text>
  <text x="120" y="260" fill="#1d4ed8" font-size="17" font-weight="bold">HTTP 요청</text>
  <path d="M292,240 L292,268" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="316" y="260" fill="#374151" font-size="16">서버에 리소스 요청</text>

  <!-- 5 -->
  <rect x="96" y="296" width="760" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="322" r="18" fill="#1d4ed8"/>
  <text x="56" y="327.5" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">5</text>
  <text x="120" y="328" fill="#1d4ed8" font-size="17" font-weight="bold">응답 수신</text>
  <path d="M292,308 L292,336" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="316" y="328" fill="#374151" font-size="16">HTML, CSS, JS 등</text>

  <!-- 6 : 렌더링 시작 -->
  <rect x="96" y="364" width="760" height="52" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="56" cy="390" r="18" fill="#6d28d9"/>
  <text x="56" y="395.5" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">6</text>
  <text x="120" y="396" fill="#6d28d9" font-size="17" font-weight="bold">브라우저 렌더링</text>
  <path d="M292,376 L292,404" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="316" y="396" fill="#374151" font-size="16">CRP 시작</text>
</svg>
