<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cache Hit vs Cache Miss</title>
  <desc id="d">Cache Hit은 캐시에 데이터가 있어 즉시 반환하고, Cache Miss는 캐시에 없어 DB 조회, 캐시 저장을 거친 뒤 반환합니다.</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Cache Hit -->
  <text x="40" y="46" font-size="19" font-weight="bold" fill="#047857">Cache Hit</text>
  <rect x="40" y="62" width="200" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="140" y="96" font-size="16" fill="#111827" text-anchor="middle">캐시에 데이터 있음</text>
  <line x1="244" y1="90" x2="674" y2="90" stroke="#047857" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="680" y="62" width="160" height="56" rx="8" fill="#047857" stroke="#047857" stroke-width="2"/>
  <text x="760" y="96" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">즉시 반환</text>

  <line x1="40" y1="150" x2="840" y2="150" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Cache Miss -->
  <text x="40" y="196" font-size="19" font-weight="bold" fill="#b45309">Cache Miss</text>
  <rect x="40" y="212" width="200" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="246" font-size="16" fill="#111827" text-anchor="middle">캐시에 없음</text>
  <line x1="244" y1="240" x2="274" y2="240" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrA)"/>
  <rect x="280" y="212" width="160" height="56" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="246" font-size="16" fill="#111827" text-anchor="middle">DB 조회</text>
  <line x1="444" y1="240" x2="474" y2="240" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrA)"/>
  <rect x="480" y="212" width="160" height="56" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="246" font-size="16" fill="#111827" text-anchor="middle">캐시 저장</text>
  <line x1="644" y1="240" x2="674" y2="240" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrA)"/>
  <rect x="680" y="212" width="160" height="56" rx="8" fill="#b45309" stroke="#b45309" stroke-width="2"/>
  <text x="760" y="246" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">반환</text>
</svg>
