<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1140" width="880" height="1140" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 전 준비 체크리스트</title>
  <desc id="d">D-7, D-3, D-1, 당일 시간순 면접 준비 체크리스트 다이어그램</desc>
  <rect width="880" height="1140" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Timeline Vertical Guide Bar -->
  <line x1="100" y1="60" x2="100" y2="1080" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ==================== D-7 SECTION ==================== -->
  <g id="section-d-7">
    <!-- Section Header Badge -->
    <rect x="30" y="30" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="100" y="55.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">D-7</text>
    <line x1="170" y1="50" x2="850" y2="50" stroke="#2563eb" stroke-width="2"/>

    <!-- Box Container -->
    <rect x="140" y="85" width="710" height="205" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

    <!-- Checklist Items -->
    <g font-size="13" fill="#1f2933">
      <!-- Item 1 -->
      <rect x="165" y="108" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="121.55">JD(채용 공고)의 기술 스택을 한 줄씩 자기 경험과 매칭</text>

      <!-- Item 2 -->
      <rect x="165" y="153" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="166.55">회사 기술 블로그 최근 글 훑기 (질문 소재이자 역질문 재료)</text>

      <!-- Item 3 -->
      <rect x="165" y="198" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="211.55">서비스 직접 사용 → 개선점 한 가지 메모</text>

      <!-- Item 4 -->
      <rect x="165" y="243" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="256.55">이력서/포트폴리오에 쓴 기술 중 "설명 못 하는 것" 표시</text>
    </g>
  </g>

  <!-- Timeline Connector Line -->
  <path d="M100,70 L100,310" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- ==================== D-3 SECTION ==================== -->
  <g id="section-d-3">
    <!-- Section Header Badge -->
    <rect x="30" y="310" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="100" y="335.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">D-3</text>
    <line x1="170" y1="330" x2="850" y2="330" stroke="#2563eb" stroke-width="2"/>

    <!-- Box Container -->
    <rect x="140" y="365" width="710" height="205" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

    <!-- Checklist Items -->
    <g font-size="13" fill="#1f2933">
      <!-- Item 1 -->
      <rect x="165" y="388" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="401.55">표시한 항목 보강 (이력서에 쓴 건 전부 질문 대상이다)</text>

      <!-- Item 2 -->
      <rect x="165" y="433" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="446.55">프로젝트 3개를 각각 60초 분량으로 말해보기</text>

      <!-- Item 3 -->
      <rect x="165" y="478" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="491.55">자기소개 1분/3분 버전 소리 내어 연습</text>

      <!-- Item 4 -->
      <rect x="165" y="523" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="536.55">역질문 3~5개 작성</text>
    </g>
  </g>

  <!-- Timeline Connector Line -->
  <path d="M100,350 L100,590" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- ==================== D-1 SECTION ==================== -->
  <g id="section-d-1">
    <!-- Section Header Badge -->
    <rect x="30" y="590" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="100" y="615.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">D-1</text>
    <line x1="170" y1="610" x2="850" y2="610" stroke="#2563eb" stroke-width="2"/>

    <!-- Box Container (Highlighted for Warning/Importance) -->
    <rect x="140" y="645" width="710" height="205" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>

    <!-- Checklist Items -->
    <g font-size="13" fill="#1f2933">
      <!-- Item 1 -->
      <rect x="165" y="668" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="681.55">비대면이면: 카메라·마이크·조명·배경·네트워크 점검</text>

      <!-- Item 2 -->
      <rect x="165" y="713" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="726.55">대면이면: 이동 경로와 소요 시간 확인</text>

      <!-- Item 3 (Important Warning Item) -->
      <rect x="165" y="758" width="16" height="16" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="195" y="771.55" fill="#dc2626" font-weight="bold">새 개념 공부 금지 — 반쯤 아는 지식이 늘면 혼선만 커진다</text>

      <!-- Item 4 -->
      <rect x="165" y="803" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="816.55">이미 정리한 답변 노트만 읽기</text>
    </g>
  </g>

  <!-- Timeline Connector Line -->
  <path d="M100,630 L100,870" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- ==================== 당일 SECTION ==================== -->
  <g id="section-d-day">
    <!-- Section Header Badge (Highlight / Final Day) -->
    <rect x="30" y="870" width="140" height="40" rx="8" fill="#059669"/>
    <text x="100" y="895.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">당일</text>
    <line x1="170" y1="890" x2="850" y2="890" stroke="#059669" stroke-width="2"/>

    <!-- Box Container -->
    <rect x="140" y="925" width="710" height="160" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>

    <!-- Checklist Items -->
    <g font-size="13" fill="#1f2933">
      <!-- Item 1 -->
      <rect x="165" y="948" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="961.55">이력서 사본 눈앞에 두기 (비대면이면 화면 밖에)</text>

      <!-- Item 2 -->
      <rect x="165" y="993" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="1006.55">물 한 잔 준비 (생각할 시간을 버는 도구이기도 하다)</text>

      <!-- Item 3 -->
      <rect x="165" y="1038" width="16" height="16" rx="2" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="195" y="1051.55">첫 질문은 거의 자기소개다 — 첫 30초를 입에 익혀두기</text>
    </g>
  </g>
</svg>