<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 전 준비 체크리스트</title>
  <desc id="d">D-7, D-3, D-1, 당일 순서로 해야 할 면접 준비 항목을 시간 순으로 나열한 체크리스트. D-1의 '새 개념 공부 금지'가 특히 중요하다.</desc>
  <rect width="880" height="760" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 시간 축 -->
  <line x1="72" y1="74" x2="72" y2="222" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="72" y1="266" x2="72" y2="414" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="72" y1="458" x2="72" y2="606" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- D-7 -->
  <rect x="152" y="24" width="704" height="168" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="34" width="96" height="40" rx="20" fill="#1e3a8a"/>
  <text x="72" y="60.3" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">D-7</text>
  <rect x="174" y="45" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="59.6" font-size="16" fill="#111827">JD(채용 공고)의 기술 스택을 한 줄씩 자기 경험과 매칭</text>
  <rect x="174" y="81" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="95.6" font-size="16" fill="#111827">회사 기술 블로그 최근 글 훑기<tspan fill="#4b5563"> (질문 소재이자 역질문 재료)</tspan></text>
  <rect x="174" y="117" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="131.6" font-size="16" fill="#111827">서비스 직접 사용 → 개선점 한 가지 메모</text>
  <rect x="174" y="153" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="167.6" font-size="16" fill="#111827">이력서/포트폴리오에 쓴 기술 중 "설명 못 하는 것" 표시</text>
  <!-- D-3 -->
  <rect x="152" y="216" width="704" height="168" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="226" width="96" height="40" rx="20" fill="#1e3a8a"/>
  <text x="72" y="252.3" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">D-3</text>
  <rect x="174" y="237" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="251.6" font-size="16" fill="#111827">표시한 항목 보강<tspan fill="#4b5563"> (이력서에 쓴 건 전부 질문 대상이다)</tspan></text>
  <rect x="174" y="273" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="287.6" font-size="16" fill="#111827">프로젝트 3개를 각각 60초 분량으로 말해보기</text>
  <rect x="174" y="309" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="323.6" font-size="16" fill="#111827">자기소개 1분/3분 버전 소리 내어 연습</text>
  <rect x="174" y="345" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="359.6" font-size="16" fill="#111827">역질문 3~5개 작성</text>
  <!-- D-1 -->
  <rect x="152" y="408" width="704" height="168" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="418" width="96" height="40" rx="20" fill="#1e3a8a"/>
  <text x="72" y="444.3" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">D-1</text>
  <rect x="174" y="429" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="443.6" font-size="16" fill="#111827"><tspan font-weight="bold">비대면이면:</tspan> 카메라·마이크·조명·배경·네트워크 점검</text>
  <rect x="174" y="465" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="479.6" font-size="16" fill="#111827"><tspan font-weight="bold">대면이면:</tspan> 이동 경로와 소요 시간 확인</text>
  <rect x="164" y="494" width="680" height="32" rx="6" fill="#fef2f2"/>
  <rect x="174" y="501" width="18" height="18" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="206" y="515.6" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#b91c1c">새 개념 공부 금지</tspan><tspan fill="#4b5563"> — 반쯤 아는 지식이 늘면 혼선만 커진다</tspan></text>
  <rect x="692" y="497" width="88" height="26" rx="13" fill="#b91c1c"/>
  <text x="736" y="515" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">특히 중요</text>
  <rect x="174" y="537" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="551.6" font-size="16" fill="#111827">이미 정리한 답변 노트만 읽기</text>
  <!-- 당일 -->
  <rect x="152" y="600" width="704" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="610" width="96" height="40" rx="20" fill="#047857"/>
  <text x="72" y="636.3" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">당일</text>
  <rect x="174" y="621" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="635.6" font-size="16" fill="#111827">이력서 사본 눈앞에 두기<tspan fill="#4b5563"> (비대면이면 화면 밖에)</tspan></text>
  <rect x="174" y="657" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="671.6" font-size="16" fill="#111827">물 한 잔 준비<tspan fill="#4b5563"> (생각할 시간을 버는 도구이기도 하다)</tspan></text>
  <rect x="174" y="693" width="18" height="18" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="206" y="707.6" font-size="16" fill="#111827">첫 질문은 거의 자기소개다 — 첫 30초를 입에 익혀두기</text>
</svg>
