<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PIO와 DMA 비교</title>
  <desc id="d">PIO 방식에서는 CPU가 I/O 장치에서 읽고 메모리에 쓰며 모든 데이터 전송을 맡아 I/O 작업에 묶인다. DMA 방식에서는 CPU가 전송을 요청하면 DMA가 I/O에서 메모리로 직접 전송하고 완료 시 인터럽트로 알리므로 CPU가 다른 작업을 할 수 있다.</desc>
  <defs>
    <marker id="ah-data" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- ===== 기존 방식: PIO ===== -->
  <rect x="24" y="24" width="408" height="452" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <path d="M24,68 V36 A12,12 0 0 1 36,24 H420 A12,12 0 0 1 432,36 V68 Z" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="53" font-size="18" font-weight="bold" fill="#b91c1c">기존 방식 — PIO (Programmed I/O)</text>

  <!-- 구성 요소 -->
  <rect x="162" y="96" width="132" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="228" y="126" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">CPU</text>
  <rect x="44" y="216" width="132" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="110" y="246" font-size="16" fill="#111827" text-anchor="middle">I/O 장치</text>
  <rect x="284" y="216" width="132" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="350" y="246" font-size="16" fill="#111827" text-anchor="middle">메모리</text>

  <!-- 데이터 경로: I/O → CPU → 메모리 -->
  <path d="M110,212 V120 H157" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#ah-data)"/>
  <text x="122" y="186" font-size="16" font-weight="bold" fill="#92400e">① 읽기</text>
  <path d="M298,120 H350 V211" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#ah-data)"/>
  <text x="338" y="186" font-size="16" font-weight="bold" fill="#92400e" text-anchor="end">② 쓰기</text>

  <!-- 단계 -->
  <text x="44" y="310" font-size="16" fill="#111827">① CPU가 I/O 장치에서 데이터 읽기</text>
  <text x="44" y="340" font-size="16" fill="#111827">② CPU가 메모리에 데이터 쓰기</text>
  <text x="44" y="370" font-size="16" fill="#111827">③ 모든 데이터 전송에 CPU 사용</text>

  <rect x="44" y="396" width="368" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="228" y="430" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">→ CPU가 I/O 작업에 묶임</text>

  <!-- ===== DMA 방식 ===== -->
  <rect x="448" y="24" width="408" height="452" rx="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M448,68 V36 A12,12 0 0 1 460,24 H844 A12,12 0 0 1 856,36 V68 Z" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="468" y="53" font-size="18" font-weight="bold" fill="#047857">DMA 방식</text>

  <!-- 구성 요소 -->
  <rect x="468" y="96" width="132" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="534" y="126" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">CPU</text>
  <rect x="708" y="96" width="132" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="774" y="126" font-size="16" fill="#111827" text-anchor="middle">DMA 컨트롤러</text>
  <rect x="468" y="216" width="132" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="534" y="246" font-size="16" fill="#111827" text-anchor="middle">I/O 장치</text>
  <rect x="708" y="216" width="132" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="774" y="246" font-size="16" fill="#111827" text-anchor="middle">메모리</text>

  <!-- ① 전송 요청 / ③ 인터럽트 -->
  <text x="654" y="100" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">① 전송 요청</text>
  <line x1="604" y1="110" x2="703" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#ah-ctl)"/>
  <line x1="704" y1="130" x2="605" y2="130" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-ctl)"/>
  <text x="654" y="156" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">③ 인터럽트</text>

  <!-- ② 직접 전송 -->
  <text x="654" y="228" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">② 직접 전송</text>
  <line x1="604" y1="240" x2="703" y2="240" stroke="#b45309" stroke-width="3" marker-end="url(#ah-data)"/>

  <!-- 단계 -->
  <text x="468" y="310" font-size="16" fill="#111827">① CPU가 DMA 컨트롤러에 전송 요청</text>
  <text x="468" y="340" font-size="16" fill="#111827">② DMA가 I/O → 메모리 직접 전송</text>
  <text x="468" y="370" font-size="16" fill="#111827">③ 전송 완료 시 인터럽트로 CPU에 알림</text>

  <rect x="468" y="396" width="368" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="652" y="430" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">→ CPU가 다른 작업 수행 가능</text>
</svg>
