<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">속성별 렌더링 파이프라인 단계</title>
  <desc id="d">일반 속성을 바꾸면 Layout, Paint, Composite 모든 단계가 실행되고, transform과 opacity를 바꾸면 Layout과 Paint를 건너뛰고 GPU에서 Composite만 처리한다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 행 1: 일반 속성 변경 -->
  <text x="24" y="68" font-size="18" font-weight="bold" fill="#111827">일반 속성 변경</text>
  <text x="24" y="94" font-size="15" fill="#4b5563">예: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">left</tspan></text>

  <rect x="300" y="44" width="140" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="370" y="78" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Layout</text>
  <line x1="444" y1="72" x2="474" y2="72" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="480" y="44" width="140" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="550" y="78" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Paint</text>
  <line x1="624" y1="72" x2="654" y2="72" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="660" y="44" width="140" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="730" y="78" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Composite</text>

  <path d="M300,112 v8 h500 v-8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="550" y="144" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">모든 단계 실행</text>

  <line x1="24" y1="172" x2="856" y2="172" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 행 2: transform/opacity 변경 -->
  <text x="24" y="224" font-size="18" font-weight="bold" fill="#111827">transform/opacity 변경</text>
  <text x="24" y="250" font-size="15" fill="#4b5563">예: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">translateX(100px)</tspan></text>

  <rect x="300" y="200" width="140" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="370" y="234" font-size="17" fill="#4b5563" text-anchor="middle">Layout</text>
  <rect x="480" y="200" width="140" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="550" y="234" font-size="17" fill="#4b5563" text-anchor="middle">Paint</text>
  <rect x="660" y="200" width="140" height="56" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="730" y="223" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">Composite</text>
  <text x="730" y="245" font-size="15" fill="#6d28d9" text-anchor="middle">GPU에서 처리</text>

  <path d="M300,268 v8 h320 v-8" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <text x="460" y="300" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">건너뜀</text>
  <path d="M660,268 v8 h140 v-8" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="730" y="300" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">Composite만 실행</text>
</svg>
