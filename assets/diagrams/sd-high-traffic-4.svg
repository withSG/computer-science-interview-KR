<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동기 처리와 큐를 쓴 비동기 처리의 응답 시간 비교</title>
  <desc id="d">동기 방식은 재고차감 50ms, 결제 400ms, 이메일 300ms, 알림톡 200ms, 포인트 100ms를 모두 기다려 총 1,050ms가 걸리고, 비동기 방식은 재고차감과 결제 뒤 큐에 발행하고 바로 응답해 총 455ms가 걸린다. 이메일·알림톡·포인트는 워커가 처리한다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- ===== [동기] ===== -->
  <rect x="24" y="20" width="832" height="200" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="48" y="34" width="60" height="28" rx="14" fill="#b91c1c"/>
  <text x="78" y="54" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">동기</text>
  <text x="122" y="54" font-size="16" fill="#1f2937">사용자가 모든 단계를 기다린다</text>

  <!-- 흐름 -->
  <rect x="48" y="76" width="60" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="78" y="108" font-size="16" fill="#111827" text-anchor="middle">주문</text>
  <path d="M112,102 H136" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="142" y="76" width="92" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="188" y="98" font-size="16" fill="#111827" text-anchor="middle">재고차감</text>
  <text x="188" y="119" font-size="15" fill="#4b5563" text-anchor="middle">50ms</text>
  <path d="M238,102 H262" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="268" y="76" width="92" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="314" y="98" font-size="16" fill="#111827" text-anchor="middle">결제</text>
  <text x="314" y="119" font-size="15" fill="#4b5563" text-anchor="middle">400ms</text>
  <path d="M364,102 H388" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="394" y="76" width="92" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="98" font-size="16" fill="#111827" text-anchor="middle">이메일</text>
  <text x="440" y="119" font-size="15" fill="#4b5563" text-anchor="middle">300ms</text>
  <path d="M490,102 H514" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="520" y="76" width="92" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="566" y="98" font-size="16" fill="#111827" text-anchor="middle">알림톡</text>
  <text x="566" y="119" font-size="15" fill="#4b5563" text-anchor="middle">200ms</text>
  <path d="M616,102 H640" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="646" y="76" width="92" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="692" y="98" font-size="16" fill="#111827" text-anchor="middle">포인트</text>
  <text x="692" y="119" font-size="15" fill="#4b5563" text-anchor="middle">100ms</text>
  <path d="M742,102 H766" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="772" y="76" width="60" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="802" y="108" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">응답</text>

  <!-- 사용자 대기 막대 (1ms = 0.5429px) -->
  <text x="48" y="163" font-size="15" fill="#374151">사용자 대기</text>
  <rect x="150" y="146" width="570" height="24" rx="3" fill="#f87171"/>
  <text x="732" y="164" font-size="17" font-weight="bold" fill="#b91c1c">총 1,050ms</text>

  <text x="48" y="202" font-size="15" fill="#b91c1c">이메일 서버가 느려지면 주문 응답이 통째로 느려진다</text>

  <!-- ===== [비동기] ===== -->
  <rect x="24" y="240" width="832" height="278" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="48" y="254" width="72" height="28" rx="14" fill="#047857"/>
  <text x="84" y="274" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">비동기</text>
  <text x="134" y="274" font-size="16" fill="#1f2937">꼭 필요한 것만 기다린다</text>

  <!-- 흐름 -->
  <rect x="48" y="296" width="60" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="78" y="328" font-size="16" fill="#111827" text-anchor="middle">주문</text>
  <path d="M112,322 H136" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="142" y="296" width="92" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="188" y="318" font-size="16" fill="#111827" text-anchor="middle">재고차감</text>
  <text x="188" y="339" font-size="15" fill="#4b5563" text-anchor="middle">50ms</text>
  <path d="M238,322 H262" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="268" y="296" width="92" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="314" y="318" font-size="16" fill="#111827" text-anchor="middle">결제</text>
  <text x="314" y="339" font-size="15" fill="#4b5563" text-anchor="middle">400ms</text>
  <path d="M364,322 H388" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="394" y="296" width="92" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="440" y="328" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">큐에 발행</text>
  <path d="M490,322 H514" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="520" y="296" width="60" height="52" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="550" y="328" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">응답</text>

  <!-- 워커 분기 -->
  <path d="M440,352 V378" stroke="#6d28d9" stroke-width="1.5" fill="none" marker-end="url(#ah-p)"/>
  <rect x="394" y="384" width="270" height="40" rx="6" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="410" y="410" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#6d28d9">워커</tspan>: 이메일 / 알림톡 / 포인트</text>

  <!-- 사용자 대기 막대 (같은 축척) -->
  <text x="48" y="461" font-size="15" fill="#374151">사용자 대기</text>
  <rect x="150" y="444" width="247" height="24" rx="3" fill="#34d399"/>
  <text x="409" y="462" font-size="17" font-weight="bold" fill="#047857">총 455ms</text>

  <text x="48" y="500" font-size="15" fill="#047857">이메일 서버가 느려도 주문은 정상</text>
</svg>
