<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Recreate 배포 흐름</title>
  <desc id="d">v1 인스턴스 세 대를 전부 내린 뒤 v2 세 대를 전부 올린다. 내린 뒤 올리기 전까지 서버가 한 대도 없어 다운타임이 생긴다.</desc>
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 다운타임 구간 -->
  <rect x="330" y="28" width="220" height="162" rx="10" fill="#fef2f2"/>

  <!-- 1) v1 세 대 -->
  <rect x="40" y="60" width="56" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="68" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">v1</text>
  <rect x="104" y="60" width="56" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="132" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">v1</text>
  <rect x="168" y="60" width="56" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="196" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">v1</text>

  <!-- 전부 내림 -->
  <text x="277" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">전부 내림</text>
  <line x1="236" y1="90" x2="318" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2) 빈 자리 -->
  <rect x="348" y="60" width="56" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="412" y="60" width="56" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="476" y="60" width="56" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="164" text-anchor="middle" font-size="20" font-weight="bold" fill="#b91c1c">다운타임</text>

  <!-- 전부 올림 -->
  <text x="603" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">전부 올림</text>
  <line x1="562" y1="90" x2="644" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3) v2 세 대 -->
  <rect x="656" y="60" width="56" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="684" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">v2</text>
  <rect x="720" y="60" width="56" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="748" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">v2</text>
  <rect x="784" y="60" width="56" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="812" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">v2</text>

  <!-- 시간 축 -->
  <line x1="40" y1="214" x2="806" y2="214" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <line x1="348" y1="214" x2="532" y2="214" stroke="#dc2626" stroke-width="6"/>
  <text x="816" y="219" font-size="15" fill="#4b5563">시간</text>
</svg>
