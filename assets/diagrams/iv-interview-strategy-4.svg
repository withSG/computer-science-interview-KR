<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 750" width="880" height="750" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안티패턴 개선 - 결론, 근거, 사례, 확장</title>
  <desc id="d">면접 답변 구조의 개선 사례로 결론, 근거, 사례, 확장의 4단계 흐름을 보여주는 다이어그램입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="750" fill="#ffffff"/>

  <!-- 메인 프레임 / 배경 -->
  <rect x="24" y="24" width="832" height="702" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 헤더 / 제목 -->
  <rect x="40" y="40" width="800" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="69.6" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">[개선 - 결론 → 근거 → 사례 → 확장]</text>

  <!-- 1. 결론 -->
  <g transform="translate(40, 108)">
    <rect x="0" y="0" width="800" height="80" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="80" rx="6" fill="#eff6ff"/>
    <path d="M120,0 L120,80" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="44.55" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">결론:</text>
    <text x="140" y="44.55" font-size="13" fill="#1f2933">"런타임에 터질 오류를 에디터에서 미리 잡기 위해 씁니다."</text>
  </g>

  <!-- 화살표 1 -->
  <path d="M440,188 L440,208" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 2. 근거 -->
  <g transform="translate(40, 218)">
    <rect x="0" y="0" width="800" height="150" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="150" rx="6" fill="#f8fafc"/>
    <path d="M120,0 L120,150" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="60" y="79.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">근거:</text>
    <text x="140" y="42.55" font-size="13" fill="#1f2933">"자바스크립트는 객체에 없는 프로퍼티를 읽어도 그 자리에서는 undefined만 돌아오고,</text>
    <text x="145" y="79.55" font-size="13" fill="#1f2933"> 그 값을 실제로 쓰는 시점에 가서야 오류가 납니다.</text>
    <text x="145" y="102.55" font-size="13" fill="#1f2933"> 타입스크립트는 그 접근 자체를 에디터에서 빨간 줄로 표시하니까,</text>
    <text x="145" y="125.55" font-size="13" fill="#1f2933"> 오류를 발견하는 시점이 배포 후에서 작성 중으로 당겨지는 거죠."</text>
  </g>

  <!-- 화살표 2 -->
  <path d="M440,368 L440,388" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. 사례 -->
  <g transform="translate(40, 398)">
    <rect x="0" y="0" width="800" height="150" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="150" rx="6" fill="#f8fafc"/>
    <path d="M120,0 L120,150" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="60" y="79.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">사례:</text>
    <text x="140" y="54.55" font-size="13" fill="#1f2933">"이전 프로젝트에서 API 응답 필드명이 바뀐 적이 있는데,</text>
    <text x="145" y="79.55" font-size="13" fill="#1f2933"> 타입을 정의해뒀더니 그 타입을 쓰는 컴포넌트 전부에 컴파일 에러가 떠서</text>
    <text x="145" y="104.55" font-size="13" fill="#1f2933"> 수정 범위를 바로 알 수 있었습니다."</text>
  </g>

  <!-- 화살표 3 -->
  <path d="M440,548 L440,568" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 4. 확장 -->
  <g transform="translate(40, 578)">
    <rect x="0" y="0" width="800" height="110" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="110" rx="6" fill="#f8fafc"/>
    <path d="M120,0 L120,110" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="60" y="59.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">확장:</text>
    <text x="140" y="59.55" font-size="13" fill="#1f2933">"협업할 때는 타입 정의 자체가 문서 역할을 한다는 점도 큽니다."</text>
  </g>
</svg>