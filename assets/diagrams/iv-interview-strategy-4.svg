<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">개선 답변: 결론 → 근거 → 사례 → 확장</title>
  <desc id="d">"왜 TypeScript를 쓰시나요?"에 대한 개선 답변을 결론, 근거, 사례, 확장 네 단계로 나눠 위에서 아래로 보여줍니다. 첫 줄의 결론은 "런타임에 터질 오류를 에디터에서 미리 잡기 위해 씁니다"입니다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 머리 -->
  <text x="24" y="46" font-size="18" font-weight="bold" fill="#111827">Q. 왜 TypeScript를 쓰시나요?</text>
  <text x="24" y="74" font-size="15" font-weight="bold" fill="#1d4ed8">개선 답변 — 결론 → 근거 → 사례 → 확장</text>

  <!-- 1. 결론 (강조) -->
  <rect x="24" y="96" width="128" height="68" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="88" y="125" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 결론</text>
  <text x="88" y="147" font-size="14" fill="#ffffff" text-anchor="middle">한 문장</text>
  <rect x="168" y="96" width="688" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="188" y="136" font-size="18" font-weight="bold" fill="#1e3a8a">"런타임에 터질 오류를 에디터에서 미리 잡기 위해 씁니다."</text>

  <path d="M88,168 L88,187" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 2. 근거 -->
  <rect x="24" y="192" width="128" height="124" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="88" y="249" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">2. 근거</text>
  <text x="88" y="271" font-size="14" fill="#4b5563" text-anchor="middle">원리·이유</text>
  <rect x="168" y="192" width="688" height="124" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="188" y="224" font-size="15" fill="#1f2937">"자바스크립트는 객체에 없는 프로퍼티를 읽어도 그 자리에서는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">undefined</tspan>만 돌아오고,</text>
  <text x="188" y="248" font-size="15" fill="#1f2937">그 값을 실제로 쓰는 시점에 가서야 오류가 납니다.</text>
  <text x="188" y="272" font-size="15" fill="#1f2937">타입스크립트는 그 접근 자체를 에디터에서 빨간 줄로 표시하니까,</text>
  <text x="188" y="296" font-size="15" fill="#1f2937">오류를 발견하는 시점이 배포 후에서 작성 중으로 당겨지는 거죠."</text>

  <path d="M88,320 L88,339" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 3. 사례 -->
  <rect x="24" y="344" width="128" height="100" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="88" y="389" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">3. 사례</text>
  <text x="88" y="411" font-size="14" fill="#4b5563" text-anchor="middle">내가 겪은 것</text>
  <rect x="168" y="344" width="688" height="100" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="188" y="376" font-size="15" fill="#1f2937">"이전 프로젝트에서 API 응답 필드명이 바뀐 적이 있는데,</text>
  <text x="188" y="400" font-size="15" fill="#1f2937">타입을 정의해뒀더니 그 타입을 쓰는 컴포넌트 전부에 컴파일 에러가 떠서</text>
  <text x="188" y="424" font-size="15" fill="#1f2937">수정 범위를 바로 알 수 있었습니다."</text>

  <path d="M88,448 L88,467" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 4. 확장 -->
  <rect x="24" y="472" width="128" height="68" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="88" y="501" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">4. 확장</text>
  <text x="88" y="523" font-size="14" fill="#4b5563" text-anchor="middle">꼬리 질문 미끼</text>
  <rect x="168" y="472" width="688" height="68" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="188" y="511" font-size="15" fill="#1f2937">"협업할 때는 타입 정의 자체가 문서 역할을 한다는 점도 큽니다."</text>
</svg>
