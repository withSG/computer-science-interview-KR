<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트리 셰이킹</title>
  <desc id="d">ES Modules와 CommonJS의 트리 셰이킹 지원 여부 및 특성을 비교한 다이어그램</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">트리 셰이킹</text>

  <!-- ES Modules Section Box -->
  <rect x="30" y="60" width="820" height="95" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="50" y="88" font-size="14" font-weight="bold" fill="#059669">ES Modules (정적 분석 가능)</text>
  
  <!-- ESM Sub-item Line & Box -->
  <path d="M 60,95 L 60,120 L 80,120" stroke="#059669" stroke-width="1.5" fill="none"/>
  <rect x="80" y="103" width="280" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="92" y="124" font-size="13" font-family="Consolas, monospace" fill="#1f2933">import { add } from './math.js'</text>
  
  <!-- ESM Arrow & Description Box -->
  <path d="M 360,120 L 410,120" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="415" y="103" width="415" height="34" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="427" y="124" font-size="13" fill="#059669">add만 번들에 포함, subtract는 제거 (트리 셰이킹)</text>

  <!-- CommonJS Section Box -->
  <rect x="30" y="175" width="820" height="95" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="50" y="203" font-size="14" font-weight="bold" fill="#dc2626">CommonJS (동적 분석)</text>
  
  <!-- CJS Sub-item Line & Box -->
  <path d="M 60,210 L 60,235 L 80,235" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <rect x="80" y="218" width="280" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="92" y="239" font-size="13" font-family="Consolas, monospace" fill="#1f2933">const { add } = require('./math')</text>
  
  <!-- CJS Arrow & Description Box -->
  <path d="M 360,235 L 410,235" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="415" y="218" width="260" height="34" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="427" y="239" font-size="13" fill="#dc2626">정적 분석 불가, 전체 모듈 포함</text>
</svg>