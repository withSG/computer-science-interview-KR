<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">하이브리드 연결 구조</title>
  <desc id="d">온프레미스/프라이빗(코어 DB, 기간계 시스템, 사내 인증)과 퍼블릭 클라우드 VPC(웹/API 서버, 배치·분석 클러스터, 개발·테스트 환경)가 두 경로로 연결된다. 주 경로는 전용선(Direct Connect 등)으로 지연이 낮고 대역폭이 보장되며, 백업 경로는 인터넷을 거치는 IPsec VPN으로 지연·대역폭이 열세다.</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- 온프레미스 / 프라이빗 -->
  <rect x="24" y="24" width="264" height="252" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="156" y="58" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle">온프레미스 / 프라이빗</text>
  <rect x="40" y="80" width="232" height="48" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="156" y="110" font-size="16" fill="#111827" text-anchor="middle">코어 DB (규제 데이터)</text>
  <rect x="40" y="140" width="232" height="48" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="156" y="170" font-size="16" fill="#111827" text-anchor="middle">기간계 시스템</text>
  <rect x="40" y="200" width="232" height="48" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="156" y="230" font-size="16" fill="#111827" text-anchor="middle">사내 인증 (LDAP/AD)</text>

  <!-- 퍼블릭 클라우드 VPC -->
  <rect x="592" y="24" width="264" height="252" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="724" y="58" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">퍼블릭 클라우드 VPC</text>
  <rect x="608" y="80" width="232" height="48" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="724" y="110" font-size="16" fill="#111827" text-anchor="middle">웹/API 서버 (오토스케일링)</text>
  <rect x="608" y="140" width="232" height="48" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="724" y="170" font-size="16" fill="#111827" text-anchor="middle">배치·분석 클러스터</text>
  <rect x="608" y="200" width="232" height="48" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="724" y="230" font-size="16" fill="#111827" text-anchor="middle">개발·테스트 환경</text>

  <!-- 주 경로: 전용선 -->
  <text x="440" y="104" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">전용선 (Direct Connect 등)</text>
  <path d="M290,120 L590,120" fill="none" stroke="#6d28d9" stroke-width="5"/>
  <circle cx="290" cy="120" r="6" fill="#6d28d9"/>
  <circle cx="590" cy="120" r="6" fill="#6d28d9"/>
  <text x="440" y="146" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold">주 경로:</tspan> 낮은 지연, 대역폭 보장</text>

  <!-- 백업 경로: IPsec VPN -->
  <text x="440" y="198" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">IPsec VPN (인터넷)</text>
  <path d="M290,214 L590,214" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="9 6"/>
  <circle cx="290" cy="214" r="5" fill="#6b7280"/>
  <circle cx="590" cy="214" r="5" fill="#6b7280"/>
  <text x="440" y="240" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold">백업 경로:</tspan> 지연·대역폭 열세</text>
</svg>
