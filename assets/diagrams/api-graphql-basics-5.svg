<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DataLoader — 모았다가 한 번에</title>
  <desc id="d">DataLoader가 없으면 author(3), author(7), author(3), author(5) 호출이 각자 SELECT를 보내 쿼리 4번이 나간다. DataLoader가 있으면 같은 틱 동안 키 [3, 7, 3, 5]를 모으고 중복을 제거한 [3, 7, 5]로 IN 쿼리 1번만 보낸다.</desc>
  <rect width="880" height="530" fill="#ffffff"/>
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 가운데 구분선 -->
  <line x1="416" y1="24" x2="416" y2="506" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== 왼쪽: DataLoader 없음 ===== -->
  <rect x="24" y="24" width="372" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="51" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle">DataLoader 없음</text>
  <text x="210" y="76" font-size="15" fill="#991b1b" text-anchor="middle">호출마다 즉시 DB 조회</text>

  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="44" y="112" width="112" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="100" y="137">author(3)</text>
    <rect x="196" y="112" width="180" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="286" y="137">SELECT ... id=3</text>

    <rect x="44" y="164" width="112" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="100" y="189">author(7)</text>
    <rect x="196" y="164" width="180" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="286" y="189">SELECT ... id=7</text>

    <rect x="44" y="216" width="112" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="100" y="241">author(3)</text>
    <rect x="196" y="216" width="180" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="286" y="241">SELECT ... id=3</text>

    <rect x="44" y="268" width="112" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="100" y="293">author(5)</text>
    <rect x="196" y="268" width="180" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="286" y="293">SELECT ... id=5</text>
  </g>
  <line x1="156" y1="132" x2="193" y2="132" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ah-red)"/>
  <line x1="156" y1="184" x2="193" y2="184" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ah-red)"/>
  <line x1="156" y1="236" x2="193" y2="236" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ah-red)"/>
  <line x1="156" y1="288" x2="193" y2="288" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ah-red)"/>

  <rect x="150" y="460" width="120" height="40" rx="20" fill="#b91c1c"/>
  <text x="210" y="486" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">쿼리 4번</text>

  <!-- ===== 오른쪽: DataLoader 있음 ===== -->
  <rect x="436" y="24" width="420" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="646" y="51" font-size="18" font-weight="700" fill="#047857" text-anchor="middle">DataLoader 있음</text>
  <text x="646" y="76" font-size="15" fill="#065f46" text-anchor="middle">같은 틱의 요청을 모아 한 번에 조회</text>

  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="456" y="112" width="112" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="512" y="137">author(3)</text>
    <rect x="456" y="164" width="112" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="512" y="189">author(7)</text>
    <rect x="456" y="216" width="112" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="512" y="241">author(3)</text>
    <rect x="456" y="268" width="112" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="512" y="293">author(5)</text>
  </g>

  <!-- 모으는 괄호 -->
  <path d="M568,132 H592 M568,184 H592 M568,236 H592 M568,288 H592 M592,132 V288" stroke="#047857" stroke-width="1.5" fill="none"/>
  <line x1="592" y1="210" x2="613" y2="210" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-green)"/>

  <!-- 키 모음 -->
  <rect x="616" y="190" width="132" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="682" y="215" font-size="15" font-weight="700" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[3, 7, 3, 5]</text>
  <text x="762" y="204" font-size="15" fill="#374151">같은 틱 동안</text>
  <text x="762" y="226" font-size="15" fill="#374151">키를 모은다</text>

  <line x1="682" y1="230" x2="682" y2="309" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-green)"/>

  <!-- 중복 제거 -->
  <rect x="590" y="312" width="184" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="682" y="337" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">중복 제거 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[3, 7, 5]</tspan></text>

  <line x1="682" y1="352" x2="682" y2="385" stroke="#047857" stroke-width="1.5" marker-end="url(#ah-green)"/>

  <!-- 배치 쿼리 -->
  <rect x="456" y="388" width="380" height="48" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="646" y="417" font-size="15" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SELECT * FROM users WHERE id IN (3,7,5)</text>

  <rect x="586" y="460" width="120" height="40" rx="20" fill="#047857"/>
  <text x="646" y="486" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">쿼리 1번</text>
</svg>
