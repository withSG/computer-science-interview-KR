<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">데이터를 옮기려고 만드는 중간 계층</title>
  <desc id="d">컴포넌트가 fetch('/api/posts')로 API 라우트 핸들러를 거쳐야 DB에 닿는 흐름. 데이터를 옮기기만 하는 중간 계층인데도 타입 정의·에러 처리·스키마 검증이 각각 필요하다.</desc>
  <rect width="880" height="270" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 흐름: 컴포넌트 → fetch → API 라우트 핸들러 → DB -->
  <rect x="48" y="40" width="130" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="113" y="74" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">컴포넌트</text>

  <line x1="182" y1="68" x2="228" y2="68" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="234" y="40" width="210" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="339" y="73" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fetch('/api/posts')</text>

  <line x1="448" y1="68" x2="494" y2="68" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="500" y="40" width="180" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="590" y="74" font-size="16" fill="#111827" text-anchor="middle">API 라우트 핸들러</text>

  <line x1="684" y1="68" x2="730" y2="68" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- DB 원통 -->
  <path d="M736,48 V88 A48,10 0 0 0 832,88 V48" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <ellipse cx="784" cy="48" rx="48" ry="10" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="784" y="80" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>

  <!-- 중간 계층 묶음 괄호 -->
  <path d="M236,108 V120 H678 V108" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <line x1="457" y1="120" x2="457" y2="140" stroke="#b45309" stroke-width="1.5"/>

  <!-- 부담 설명 -->
  <rect x="234" y="140" width="446" height="100" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="457" y="170" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">옮기기만 하는데도 각각 필요</text>
  <rect x="283" y="188" width="100" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="333" y="211" font-size="15" fill="#111827" text-anchor="middle">타입 정의</text>
  <rect x="399" y="188" width="100" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="449" y="211" font-size="15" fill="#111827" text-anchor="middle">에러 처리</text>
  <rect x="515" y="188" width="116" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="573" y="211" font-size="15" fill="#111827" text-anchor="middle">스키마 검증</text>
</svg>
