<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구성 관계</title>
  <desc id="d">JDK, JRE, JVM 및 개발 도구의 계층적 포함 관계와 구성을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Main Container: JDK -->
  <rect x="24" y="24" width="832" height="452" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="36" width="60" height="26" rx="4" fill="#2563eb"/>
  <text x="70" y="53" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">JDK</text>

  <!-- Nested Container: JRE -->
  <rect x="48" y="76" width="784" height="252" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="64" y="88" width="60" height="26" rx="4" fill="#059669"/>
  <text x="94" y="105" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">JRE</text>

  <!-- Nested Container inside JRE: JVM -->
  <rect x="72" y="128" width="736" height="124" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="88" y="140" width="60" height="26" rx="4" fill="#7c3aed"/>
  <text x="118" y="157" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">JVM</text>

  <!-- Sub-components inside JVM -->
  <g>
    <!-- Class Loader -->
    <rect x="88" y="180" width="216" height="52" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="196" y="211" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Class Loader</text>

    <!-- Runtime Data Area -->
    <rect x="332" y="180" width="216" height="52" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="440" y="211" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Runtime Data Area</text>

    <!-- Execution Engine -->
    <rect x="576" y="180" width="216" height="52" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="684" y="211" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Execution Engine</text>
  </g>

  <!-- Sub-component inside JRE: Java Class Libraries -->
  <rect x="72" y="264" width="736" height="48" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="293" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Java Class Libraries (Java 8까지 rt.jar)</text>

  <!-- Container: Development Tools -->
  <rect x="48" y="344" width="784" height="116" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="64" y="356" width="160" height="26" rx="4" fill="#d97706"/>
  <text x="144" y="373" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Development Tools</text>

  <!-- Tools inside Development Tools -->
  <g>
    <!-- javac -->
    <rect x="64" y="394" width="172" height="48" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="150" y="423" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">javac (컴파일러)</text>

    <!-- jdb -->
    <rect x="252" y="394" width="172" height="48" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="338" y="423" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">jdb (디버거)</text>

    <!-- jar -->
    <rect x="440" y="394" width="172" height="48" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="526" y="423" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">jar (아카이브)</text>

    <!-- javadoc -->
    <rect x="628" y="394" width="188" height="48" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="722" y="423" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">javadoc (문서화)</text>
  </g>
</svg>