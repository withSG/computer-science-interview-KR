<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JDK·JRE·JVM 구성 관계</title>
  <desc id="d">JDK는 JRE와 Development Tools(javac, jdb, jar, javadoc)로 구성되고, JRE는 JVM(Class Loader, Runtime Data Area, Execution Engine)과 Java Class Libraries로 구성되는 포함 관계를 보여줍니다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- JDK -->
  <rect x="24" y="24" width="832" height="412" rx="12" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2"/>
  <text x="48" y="61" font-size="22" font-weight="bold" fill="#1d4ed8">JDK</text>
  <text x="104" y="61" font-size="15" fill="#4b5563">Java Development Kit · 개발 + 실행</text>

  <!-- JRE -->
  <rect x="44" y="80" width="476" height="334" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="64" y="113" font-size="18" font-weight="bold" fill="#047857">JRE</text>
  <text x="108" y="113" font-size="15" fill="#4b5563">Java Runtime Environment · 실행만</text>

  <!-- JVM -->
  <rect x="64" y="128" width="436" height="202" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="84" y="157" font-size="18" font-weight="bold" fill="#6d28d9">JVM</text>
  <rect x="84" y="170" width="396" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="282" y="196" font-size="16" fill="#111827" text-anchor="middle">Class Loader</text>
  <rect x="84" y="220" width="396" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="282" y="246" font-size="16" fill="#111827" text-anchor="middle">Runtime Data Area</text>
  <rect x="84" y="270" width="396" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="282" y="296" font-size="16" fill="#111827" text-anchor="middle">Execution Engine</text>

  <!-- Java Class Libraries -->
  <rect x="64" y="346" width="436" height="48" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="282" y="376" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">Java Class Libraries</tspan><tspan fill="#4b5563" font-size="15"> (Java 8까지 rt.jar)</tspan></text>

  <!-- Development Tools -->
  <rect x="540" y="80" width="296" height="334" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="560" y="113" font-size="18" font-weight="bold" fill="#b45309">Development Tools</text>

  <rect x="560" y="130" width="256" height="54" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="688" y="163" font-size="16" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">javac</tspan><tspan fill="#4b5563" font-size="15"> (컴파일러)</tspan></text>
  <rect x="560" y="200" width="256" height="54" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="688" y="233" font-size="16" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">jdb</tspan><tspan fill="#4b5563" font-size="15"> (디버거)</tspan></text>
  <rect x="560" y="270" width="256" height="54" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="688" y="303" font-size="16" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">jar</tspan><tspan fill="#4b5563" font-size="15"> (아카이브)</tspan></text>
  <rect x="560" y="340" width="256" height="54" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="688" y="373" font-size="16" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">javadoc</tspan><tspan fill="#4b5563" font-size="15"> (문서화)</tspan></text>
</svg>
