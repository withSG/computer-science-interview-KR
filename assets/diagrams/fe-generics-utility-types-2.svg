<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">typeof — 값에서 타입 뽑기</title>
  <desc id="d">값의 세계에서 타입의 세계로 typeof를 통해 타입을 추출하고 keyof와 T[K] 연산자를 거치는 과정을 나타낸 다이어그램</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- World Columns/Background Sections -->
  <!-- Value World -->
  <rect x="40" y="40" width="340" height="320" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="210" y="75" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">값의 세계</text>
  <line x1="60" y1="90" x2="360" y2="90" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Type World -->
  <rect x="440" y="40" width="400" height="320" rx="8" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="640" y="75" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">타입의 세계</text>
  <line x1="460" y1="90" x2="820" y2="90" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Value World Element -->
  <!-- const defaultConfig -->
  <rect x="70" y="125" width="200" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="170" y="149" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">const defaultConfig</text>

  <!-- Type World Elements -->
  <!-- Config -->
  <rect x="580" y="125" width="120" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="149" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">Config</text>

  <!-- "retries" | "endpoint" | "verbose" -->
  <rect x="490" y="215" width="300" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="239" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">"retries" | "endpoint" | "verbose"</text>

  <!-- number | string | boolean -->
  <rect x="510" y="305" width="260" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="329" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">number | string | boolean</text>

  <!-- Arrows & Connectors -->
  <!-- typeof arrow: const defaultConfig -> Config -->
  <path d="M270,145 L580,145" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Label badge for typeof -->
  <rect x="390" y="133" width="70" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="425" y="149" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">typeof</text>

  <!-- keyof arrow: Config -> "retries" | ... -->
  <path d="M640,165 L640,215" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <!-- Label badge for keyof -->
  <rect x="612" y="178" width="56" height="22" rx="4" fill="#ffffff"/>
  <text x="640" y="193" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="middle">keyof</text>

  <!-- T[K] arrow: "retries" | ... -> number | ... -->
  <path d="M640,255 L640,305" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <!-- Label badge for T[K] -->
  <rect x="618" y="268" width="44" height="22" rx="4" fill="#ffffff"/>
  <text x="640" y="283" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="middle">T[K]</text>
</svg>