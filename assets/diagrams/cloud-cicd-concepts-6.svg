<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Git Flow와 트렁크 기반 개발</title>
  <desc id="d">Git Flow는 feature 브랜치가 2주 생존하다가 릴리스 때 큰 머지로 합쳐져 그 시점의 통합 비용이 매우 크다. 트렁크 기반 개발은 수명 하루 이하의 짧은 브랜치를 main에 매일 여러 번 통합해 충돌이 나도 하루치라 몇 줄 수준이다.</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- ───── Git Flow (긴 브랜치) ───── -->
  <rect x="24" y="24" width="832" height="200" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#991b1b">Git Flow (긴 브랜치)</text>

  <text x="44" y="97" font-size="15" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main</text>
  <text x="44" y="143" font-size="15" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">develop</text>
  <text x="44" y="189" font-size="15" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">feature</text>

  <!-- main / develop 레인 -->
  <line x1="140" y1="92" x2="600" y2="92" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="140" y1="138" x2="600" y2="138" stroke="#6b7280" stroke-width="2.5"/>

  <!-- feature: develop 첫 커밋에서 갈라져 2주 뒤 합류 -->
  <path d="M180,138 L180,172 Q180,184 192,184 L528,184 Q540,184 540,172 L540,149" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <text x="360" y="208" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">2주 생존</text>

  <!-- 릴리스 머지 develop → main -->
  <line x1="540" y1="131" x2="540" y2="102" stroke="#b91c1c" stroke-width="2" marker-end="url(#a-red)"/>

  <circle cx="180" cy="92" r="6" fill="#4b5563"/>
  <circle cx="540" cy="92" r="7" fill="#b91c1c"/>
  <circle cx="180" cy="138" r="5.5" fill="#4b5563"/>
  <circle cx="270" cy="138" r="5.5" fill="#4b5563"/>
  <circle cx="360" cy="138" r="5.5" fill="#4b5563"/>
  <circle cx="450" cy="138" r="5.5" fill="#4b5563"/>
  <circle cx="540" cy="138" r="7" fill="#b91c1c"/>

  <!-- 통합 지점 강조 -->
  <rect x="518" y="74" width="44" height="126" rx="10" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="616" y="97" font-size="15" fill="#374151">릴리스마다 큰 머지.</text>
  <text x="616" y="119" font-size="15" font-weight="bold" fill="#b91c1c">충돌 폭발 지점.</text>

  <line x1="610" y1="172" x2="570" y2="172" stroke="#b91c1c" stroke-width="2" marker-end="url(#a-red)"/>
  <text x="616" y="177" font-size="15" font-weight="bold" fill="#b91c1c">이 시점의 통합 비용이 매우 크다</text>

  <!-- ───── 트렁크 기반 개발 (짧은 브랜치) ───── -->
  <rect x="24" y="244" width="832" height="192" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="44" y="276" font-size="18" font-weight="bold" fill="#065f46">트렁크 기반 개발 (짧은 브랜치)</text>

  <text x="44" y="319" font-size="15" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main</text>
  <line x1="140" y1="314" x2="600" y2="314" stroke="#059669" stroke-width="2.5"/>

  <!-- 하루 이하 수명의 짧은 브랜치 -->
  <path d="M180,314 L192,340 L218,340 L230,314" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M230,314 L242,340 L268,340 L280,314" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M280,314 L292,340 L318,340 L330,314" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M330,314 L342,340 L368,340 L380,314" fill="none" stroke="#2563eb" stroke-width="2"/>

  <circle cx="180" cy="314" r="5.5" fill="#047857"/>
  <circle cx="230" cy="314" r="5.5" fill="#047857"/>
  <circle cx="280" cy="314" r="5.5" fill="#047857"/>
  <circle cx="330" cy="314" r="5.5" fill="#047857"/>
  <circle cx="380" cy="314" r="5.5" fill="#047857"/>
  <circle cx="430" cy="314" r="5.5" fill="#047857"/>
  <circle cx="480" cy="314" r="5.5" fill="#047857"/>
  <circle cx="530" cy="314" r="5.5" fill="#047857"/>

  <text x="616" y="319" font-size="15" fill="#374151">매일 여러 번 통합</text>
  <text x="616" y="345" font-size="15" fill="#1d4ed8">브랜치 수명 하루 이하</text>

  <line x1="255" y1="396" x2="255" y2="350" stroke="#047857" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="268" y="398" font-size="15" font-weight="bold" fill="#047857">충돌이 나도 하루치라 몇 줄 수준</text>
</svg>
