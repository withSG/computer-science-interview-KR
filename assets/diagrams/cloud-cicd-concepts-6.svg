<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 브랜치 전략이 CI 이야기에 끼어드나</title>
  <desc id="d">Git Flow와 트렁크 기반 개발의 브랜치 수명 및 통합 비용 비교 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- Git Flow 섹션 -->
  <rect x="24" y="20" width="832" height="190" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="40" y="48" font-size="15" font-weight="bold" fill="#991b1b">Git Flow (긴 브랜치)</text>

  <!-- main 브랜치 -->
  <text x="40" y="84" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">main</text>
  <line x1="110" y1="80" x2="480" y2="80" stroke="#9aa5b1" stroke-width="2"/>
  <circle cx="170" cy="80" r="5" fill="#dc2626"/>
  <circle cx="430" cy="80" r="5" fill="#dc2626"/>
  <text x="500" y="84" font-size="12.5" fill="#52606d">릴리스마다 큰 머지. 충돌 폭발 지점.</text>

  <!-- develop 브랜치 -->
  <text x="40" y="124" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">develop</text>
  <line x1="110" y1="120" x2="480" y2="120" stroke="#9aa5b1" stroke-width="2"/>
  <circle cx="170" cy="120" r="4" fill="#52606d"/>
  <circle cx="235" cy="120" r="4" fill="#52606d"/>
  <circle cx="300" cy="120" r="4" fill="#52606d"/>
  <circle cx="365" cy="120" r="4" fill="#52606d"/>
  <circle cx="430" cy="120" r="5" fill="#dc2626"/>

  <!-- feature 브랜치 -->
  <text x="40" y="164" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">feature</text>
  <path d="M 170,120 L 170,160 L 365,160 L 365,120" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <text x="500" y="164" font-size="12.5" fill="#52606d">2주 생존</text>

  <!-- 통합 비용 경고 화살표 및 라벨 -->
  <path d="M 430,195 L 430,133" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="442" y="192" font-size="12" fill="#dc2626" font-weight="bold">이 시점의 통합 비용이 매우 크다</text>

  <!-- 트렁크 기반 개발 섹션 -->
  <rect x="24" y="230" width="832" height="180" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="40" y="258" font-size="15" font-weight="bold" fill="#065f46">트렁크 기반 개발 (짧은 브랜치)</text>

  <!-- main 브랜치 및 반복 커밋 -->
  <text x="40" y="294" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">main</text>
  <line x1="110" y1="290" x2="480" y2="290" stroke="#059669" stroke-width="2"/>
  <circle cx="160" cy="290" r="4.5" fill="#059669"/>
  <circle cx="200" cy="290" r="4.5" fill="#059669"/>
  <circle cx="240" cy="290" r="4.5" fill="#059669"/>
  <circle cx="280" cy="290" r="4.5" fill="#059669"/>
  <circle cx="320" cy="290" r="4.5" fill="#059669"/>
  <circle cx="360" cy="290" r="4.5" fill="#059669"/>
  <circle cx="400" cy="290" r="4.5" fill="#059669"/>
  <circle cx="440" cy="290" r="4.5" fill="#059669"/>
  <text x="500" y="294" font-size="12.5" fill="#52606d">매일 여러 번 통합</text>

  <!-- 짧은 수명의 브랜치 루프 -->
  <path d="M 160,290 L 160,318 L 200,318 L 200,290" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M 200,290 L 200,318 L 240,318 L 240,290" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M 240,290 L 240,318 L 280,318 L 280,290" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M 280,290 L 280,318 L 320,318 L 320,290" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <text x="500" y="322" font-size="12.5" fill="#52606d">브랜치 수명 하루 이하</text>

  <!-- 충돌 최소화 강조 화살표 및 라벨 -->
  <path d="M 220,375 L 220,326" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="232" y="372" font-size="12" fill="#059669" font-weight="bold">충돌이 나도 하루치라 몇 줄 수준</text>
</svg>