<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">읽기를 루프 밖으로 뺀 개선</title>
  <desc id="d">루프 밖에서 한 번 읽어 레이아웃 계산은 1회만 일어나고, 루프 안에서는 쓰기만 이어진다. 모인 쓰기는 프레임 끝에 레이아웃 1회로 처리된다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 머리: 개선 태그 -->
  <rect x="24" y="20" width="72" height="32" rx="16" fill="#047857"/>
  <text x="60" y="41" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">개선</text>

  <!-- 루프 밖: 읽기 1회 -->
  <text x="24" y="104" font-size="15" font-weight="bold" fill="#374151">루프 밖</text>
  <rect x="110" y="72" width="170" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="195" y="94" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">읽기</text>
  <text x="195" y="114" font-size="14" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">offsetWidth</text>
  <path d="M284,98 L326,98" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#m-blue)"/>
  <rect x="330" y="72" width="220" height="52" rx="6" fill="#047857"/>
  <text x="440" y="104" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">레이아웃 계산 1회</text>

  <!-- 루프 안: 쓰기만 -->
  <text x="24" y="188" font-size="15" font-weight="bold" fill="#374151">루프 안</text>
  <rect x="110" y="156" width="112" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="166" y="178" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">쓰기</text>
  <text x="166" y="198" font-size="14" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">style.width</text>
  <rect x="234" y="156" width="112" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="290" y="178" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">쓰기</text>
  <text x="290" y="198" font-size="14" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">style.width</text>
  <rect x="358" y="156" width="112" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="414" y="178" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">쓰기</text>
  <text x="414" y="198" font-size="14" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">style.width</text>
  <rect x="482" y="156" width="112" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="538" y="178" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">쓰기</text>
  <text x="538" y="198" font-size="14" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">style.width</text>
  <text x="606" y="188" font-size="18" font-weight="bold" fill="#6d28d9">…</text>

  <!-- 모인 쓰기 → 프레임 끝 레이아웃 1회 -->
  <path d="M110,218 L110,226 L626,226 L626,218" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <path d="M368,226 L368,276 L604,276" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#m-green)"/>
  <text x="384" y="302" font-size="15" fill="#374151">쓰기는 프레임 끝에 몰아서 처리</text>
  <rect x="610" y="250" width="246" height="52" rx="6" fill="#047857"/>
  <text x="733" y="282" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">프레임 끝에 레이아웃 1회</text>
</svg>
