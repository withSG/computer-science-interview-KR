<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구조</title>
  <desc id="d">Internet에서 Ingress Controller를 거쳐 /users, /orders, /products 경로별로 User Service, Order Service, Product Service로 라우팅되는 Kubernetes Ingress 구조 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="360" y="30" width="160" height="44" rx="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="57" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">Internet</text>

  <!-- Line: Internet -> Ingress Controller -->
  <path d="M440,74 L440,114" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Ingress Controller -->
  <rect x="340" y="114" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="141" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Ingress</text>
  <text x="440" y="159" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Controller</text>

  <!-- Distribution Lines & Path Labels -->
  <!-- Main vertical stem out of Ingress Controller -->
  <path d="M440,174 L440,204" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- Horizontal bus -->
  <path d="M180,204 L700,204" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Branch 1: /users -->
  <path d="M180,204 L180,290" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="140" y="222" width="80" height="24" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="180" y="238" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">/users</text>

  <!-- Branch 2: /orders -->
  <path d="M440,204 L440,290" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="400" y="222" width="80" height="24" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="238" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">/orders</text>

  <!-- Branch 3: /products -->
  <path d="M700,204 L700,290" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="650" y="222" width="100" height="24" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="700" y="238" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">/products</text>

  <!-- User Service -->
  <rect x="90" y="290" width="180" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="325" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">User</text>
  <text x="180" y="347" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Service</text>

  <!-- Order Service -->
  <rect x="350" y="290" width="180" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="325" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Order</text>
  <text x="440" y="347" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Service</text>

  <!-- Product Service -->
  <rect x="610" y="290" width="180" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="325" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Product</text>
  <text x="700" y="347" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Service</text>
</svg>