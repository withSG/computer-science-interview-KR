<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Ingress 라우팅 구조</title>
  <desc id="d">Internet에서 들어온 요청이 Ingress Controller 하나를 거쳐 경로별로 나뉜다. /users는 User Service로, /orders는 Order Service로, /products는 Product Service로 라우팅된다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- Internet -->
  <rect x="345" y="24" width="190" height="46" rx="23" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="53" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Internet</text>

  <line x1="440" y1="70" x2="440" y2="102" stroke="#374151" stroke-width="2.5" marker-end="url(#a-ink)"/>

  <!-- Ingress Controller -->
  <rect x="300" y="106" width="280" height="62" rx="10" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <text x="440" y="143" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Ingress Controller</text>
  <text x="604" y="135" font-size="15" fill="#374151">하나의 LB로</text>
  <text x="604" y="156" font-size="15" fill="#374151">여러 서비스 라우팅</text>

  <!-- 분기 -->
  <line x1="440" y1="168" x2="440" y2="198" stroke="#374151" stroke-width="2.5"/>
  <line x1="170" y1="198" x2="710" y2="198" stroke="#374151" stroke-width="2.5"/>
  <line x1="170" y1="198" x2="170" y2="220" stroke="#374151" stroke-width="2.5"/>
  <line x1="710" y1="198" x2="710" y2="220" stroke="#374151" stroke-width="2.5"/>
  <line x1="440" y1="198" x2="440" y2="220" stroke="#374151" stroke-width="2.5"/>

  <!-- 경로 라벨 -->
  <rect x="110" y="220" width="120" height="36" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="244" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/users</text>
  <rect x="380" y="220" width="120" height="36" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="244" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/orders</text>
  <rect x="640" y="220" width="140" height="36" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="710" y="244" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/products</text>

  <line x1="170" y1="256" x2="170" y2="290" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <line x1="440" y1="256" x2="440" y2="290" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <line x1="710" y1="256" x2="710" y2="290" stroke="#047857" stroke-width="2.5" marker-end="url(#a-green)"/>

  <!-- Services -->
  <rect x="60" y="294" width="220" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="332" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">User Service</text>
  <rect x="330" y="294" width="220" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="332" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Order Service</text>
  <rect x="600" y="294" width="220" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="710" y="332" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Product Service</text>
</svg>
