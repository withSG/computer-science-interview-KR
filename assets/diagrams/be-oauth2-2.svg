<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 코드를 한 번 거치나</title>
  <desc id="d">브라우저 경유 위험 경로와 백엔드 직통 안전 경로의 보안 특성과 전송되는 데이터 비교 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">왜 코드를 한 번 거치나</text>

  <!-- Column 1: 브라우저 경유 (위험) -->
  <rect x="40" y="65" width="380" height="205" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230" y="96" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">브라우저 경유 (위험)</text>
  <line x1="60" y1="112" x2="400" y2="112" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  
  <text x="60" y="142" font-size="13" fill="#1f2933">주소창 / 히스토리에 남는다</text>
  <text x="60" y="180" font-size="13" fill="#1f2933">Referer 헤더로 유출될 수 있다</text>
  <text x="60" y="218" font-size="13" fill="#1f2933">확장 프로그램·액세스 로그에 기록</text>

  <!-- Column 2: 백엔드 직통 (안전) -->
  <rect x="460" y="65" width="380" height="205" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="96" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">백엔드 직통 (안전)</text>
  <line x1="480" y1="112" x2="820" y2="112" stroke="#059669" stroke-width="1.5"/>
  
  <text x="480" y="142" font-size="13" fill="#1f2933">사용자에게 보이지 않는다</text>
  <text x="480" y="180" font-size="13" fill="#1f2933">client_secret이 있어야 통한다</text>
  <text x="480" y="218" font-size="13" fill="#1f2933">TLS로 보호된다</text>

  <!-- Bottom Data Transfer Block 1 -->
  <rect x="40" y="295" width="380" height="55" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="328" font-size="13" font-weight="bold" fill="#1f2933">여기로는</text>
  <path d="M125,323 L165,323" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <text x="180" y="328" font-size="13" font-weight="bold" fill="#dc2626">Code(일회용, 단명)</text>

  <!-- Bottom Data Transfer Block 2 -->
  <rect x="460" y="295" width="380" height="55" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="328" font-size="13" font-weight="bold" fill="#1f2933">여기로는</text>
  <path d="M545,323 L585,323" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <text x="600" y="328" font-size="13" font-weight="bold" fill="#7c3aed">Access Token(장기, 강력)</text>

  <!-- Legend -->
  <rect x="360" y="362" width="160" height="20" rx="3" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <circle cx="375" cy="372" r="4" fill="#dc2626"/>
  <text x="385" y="376" font-size="11" fill="#52606d">위험 경로</text>
  <circle cx="445" cy="372" r="4" fill="#059669"/>
  <text x="455" y="376" font-size="11" fill="#52606d">안전 경로</text>
</svg>