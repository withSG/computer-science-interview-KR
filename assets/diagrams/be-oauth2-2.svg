<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브라우저 경유와 백엔드 직통</title>
  <desc id="d">브라우저 경유 경로는 주소창·히스토리, Referer 헤더, 확장 프로그램·액세스 로그로 새기 쉬워 일회용·단명인 Code만 보내고, 사용자에게 보이지 않고 client_secret과 TLS로 보호되는 백엔드 직통 경로로만 장기·강력한 Access Token을 주고받습니다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="mr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 왼쪽: 브라우저 경유 (위험) -->
  <path d="M24,34 a10,10 0 0 1 10,-10 h384 a10,10 0 0 1 10,10 v42 h-404 z" fill="#fee2e2"/>
  <rect x="24" y="24" width="404" height="286" rx="10" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="226" y="58" font-size="19" font-weight="bold" fill="#991b1b" text-anchor="middle">브라우저 경유 (위험)</text>

  <circle cx="50" cy="109" r="4" fill="#b91c1c"/>
  <text x="64" y="115" font-size="16" fill="#1f2937">주소창 / 히스토리에 남는다</text>
  <circle cx="50" cy="147" r="4" fill="#b91c1c"/>
  <text x="64" y="153" font-size="16" fill="#1f2937">Referer 헤더로 유출될 수 있다</text>
  <circle cx="50" cy="185" r="4" fill="#b91c1c"/>
  <text x="64" y="191" font-size="16" fill="#1f2937">확장 프로그램·액세스 로그에 기록</text>

  <line x1="44" y1="216" x2="408" y2="216" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="44" y="264" font-size="15" fill="#4b5563">여기로는</text>
  <line x1="112" y1="259" x2="152" y2="259" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#mr)"/>
  <rect x="162" y="230" width="246" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="285" y="255" font-size="20" font-weight="bold" fill="#991b1b" text-anchor="middle">Code</text>
  <text x="285" y="278" font-size="15" fill="#991b1b" text-anchor="middle">(일회용, 단명)</text>

  <!-- 오른쪽: 백엔드 직통 (안전) -->
  <path d="M452,34 a10,10 0 0 1 10,-10 h384 a10,10 0 0 1 10,10 v42 h-404 z" fill="#d1fae5"/>
  <rect x="452" y="24" width="404" height="286" rx="10" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="654" y="58" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">백엔드 직통 (안전)</text>

  <circle cx="478" cy="109" r="4" fill="#047857"/>
  <text x="492" y="115" font-size="16" fill="#1f2937">사용자에게 보이지 않는다</text>
  <circle cx="478" cy="147" r="4" fill="#047857"/>
  <text x="492" y="153" font-size="16" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">client_secret</tspan>이 있어야 통한다</text>
  <circle cx="478" cy="185" r="4" fill="#047857"/>
  <text x="492" y="191" font-size="16" fill="#1f2937">TLS로 보호된다</text>

  <line x1="472" y1="216" x2="836" y2="216" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="472" y="264" font-size="15" fill="#4b5563">여기로는</text>
  <line x1="540" y1="259" x2="580" y2="259" stroke="#047857" stroke-width="2.5" marker-end="url(#mg)"/>
  <rect x="590" y="230" width="246" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="713" y="255" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">Access Token</text>
  <text x="713" y="278" font-size="15" fill="#065f46" text-anchor="middle">(장기, 강력)</text>

  <!-- 요점 -->
  <text x="440" y="344" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">위험한 경로로는 쓸모없는 값만 보내고, 값진 것은 안전한 경로로만 오갑니다</text>
</svg>
