<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CI/CD 파이프라인 흐름</title>
  <desc id="d">Code Commit, Build, Test, Deploy Staging, Monitor로 이어지는 연속적인 CI/CD 파이프라인 흐름과 Deploy Staging에서 Production으로 이어지는 배포 과정 다이어그램</desc>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Code Commit (100x60, center x=80, y=80) -->
  <rect x="30" y="50" width="100" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="80" y="74.05" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Code</text>
  <text x="80" y="94.05" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Commit</text>

  <!-- Arrow 1: Code Commit -> Build -->
  <path d="M 130 80 L 180 80" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Build (100x60, center x=230, y=80) -->
  <rect x="180" y="50" width="100" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="84.55" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Build</text>

  <!-- Arrow 2: Build -> Test -->
  <path d="M 280 80 L 330 80" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Test (100x60, center x=380, y=80) -->
  <rect x="330" y="50" width="100" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="84.55" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Test</text>

  <!-- Arrow 3: Test -> Deploy Staging -->
  <path d="M 430 80 L 480 80" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Deploy Staging (120x60, center x=540, y=80) -->
  <rect x="480" y="50" width="120" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="540" y="74.05" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Deploy</text>
  <text x="540" y="94.05" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Staging</text>

  <!-- Arrow 4: Deploy Staging -> Monitor -->
  <path d="M 600 80 L 650 80" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Monitor (100x60, center x=700, y=80) -->
  <rect x="650" y="50" width="100" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="700" y="84.55" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Monitor</text>

  <!-- Arrow 5: Deploy Staging -> Production -->
  <path d="M 540 110 L 540 180" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Production (120x60, center x=540, y=210) -->
  <rect x="480" y="180" width="120" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="540" y="214.55" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Production</text>
</svg>