<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OAuth 2.0 vs OIDC 계층 구조</title>
  <desc id="d">OAuth 2.0 인가 레이어 위에 OpenID Connect 인증 레이어가 확장 형성된 계층 구조 다이어그램</desc>
  
  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 헤더 / 타이틀 -->
  <text x="40" y="42" font-size="16" font-weight="bold" fill="#1f2933">6. OAuth(인가) vs OIDC(인증)</text>

  <!-- 메인 콘테이너/그룹 (두 레이어를 감싸는 전체 구조) -->
  <rect x="40" y="70" width="500" height="230" rx="8" ry="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/>

  <!-- 상단 레이어: OpenID Connect -->
  <rect x="40" y="70" width="500" height="115" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <!-- 겹치는 부분의 곡률 가림 및 구분을 위한 사각형 -->
  <rect x="40" y="175" width="500" height="10" fill="#f5f3ff"/>
  <line x1="40" y1="185" x2="540" y2="185" stroke="#7c3aed" stroke-width="2"/>
  <text x="290" y="133" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">OpenID Connect: ID Token/UserInfo/nonce</text>

  <!-- 하단 레이어: OAuth 2.0 -->
  <rect x="40" y="185" width="500" height="115" rx="0" ry="0" fill="#eff6ff"/>
  <!-- 하단 모서리 라운딩 처리 -->
  <path d="M 40,185 L 540,185 L 540,292 A 8,8 0 0,1 532,300 L 48,300 A 8,8 0 0,1 40,292 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="248" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">OAuth 2.0: Grant Type/Access Token/Scope</text>

  <!-- 상단 설명: 화살표 & 텍스트 (인증) -->
  <path d="M 540,127.5 L 590,127.5" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="600" y="107.5" width="240" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="612" y="132" font-size="13" font-weight="bold" fill="#7c3aed">← 인증 (누구인가)</text>

  <!-- 하단 설명: 화살표 & 텍스트 (인가) -->
  <path d="M 540,242.5 L 590,242.5" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="600" y="222.5" width="240" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="612" y="247" font-size="13" font-weight="bold" fill="#2563eb">← 인가 (무엇을 할 수 있는가)</text>

</svg>