<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OAuth 2.0 위의 OIDC</title>
  <desc id="d">OAuth 2.0(Grant Type, Access Token, Scope) 층이 인가, 즉 무엇을 할 수 있는가를 맡고, 그 위에 얹힌 OpenID Connect(ID Token, UserInfo, nonce) 층이 인증, 즉 누구인가를 맡는다.</desc>
  <rect width="880" height="240" fill="#ffffff"/>
  <defs>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 위층: OpenID Connect -->
  <rect x="24" y="28" width="576" height="88" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="44" y="78" font-size="18" font-weight="bold" fill="#6d28d9">OpenID Connect</text>
  <rect x="212" y="52" width="104" height="40" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="264" y="77.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">ID Token</text>
  <rect x="328" y="52" width="104" height="40" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="380" y="77.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">UserInfo</text>
  <rect x="444" y="52" width="84" height="40" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="486" y="77.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">nonce</text>

  <!-- 아래층: OAuth 2.0 -->
  <rect x="24" y="128" width="576" height="88" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="44" y="178" font-size="18" font-weight="bold" fill="#1d4ed8">OAuth 2.0</text>
  <rect x="212" y="152" width="116" height="40" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="270" y="177.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Grant Type</text>
  <rect x="340" y="152" width="132" height="40" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="406" y="177.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Access Token</text>
  <rect x="484" y="152" width="80" height="40" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="524" y="177.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Scope</text>

  <!-- 오른쪽: 각 층의 역할 -->
  <line x1="652" y1="72" x2="608" y2="72" stroke="#6d28d9" stroke-width="2" marker-end="url(#ahp)"/>
  <text x="664" y="68" font-size="22" font-weight="bold" fill="#6d28d9">인증</text>
  <text x="664" y="94" font-size="16" fill="#111827">(누구인가)</text>

  <line x1="652" y1="172" x2="608" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/>
  <text x="664" y="168" font-size="22" font-weight="bold" fill="#1d4ed8">인가</text>
  <text x="664" y="194" font-size="16" fill="#111827">(무엇을 할 수 있는가)</text>
</svg>
