<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">사용자·커널 모드 전환</title>
  <desc id="d">사용자 모드는 시스템 콜이나 인터럽트가 일어나면 커널 모드로 전환되고, 커널 모드는 처리가 끝나면 사용자 모드로 돌아온다.</desc>
  <defs>
    <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="240" fill="#ffffff"/>

  <!-- 사용자 모드 -->
  <rect x="24" y="40" width="250" height="160" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="149" y="102" font-size="21" font-weight="bold" fill="#1e3a8a" text-anchor="middle">사용자 모드</text>
  <text x="149" y="128" font-size="15" fill="#1d4ed8" text-anchor="middle">User Mode</text>
  <text x="149" y="166" font-size="15" fill="#4b5563" text-anchor="middle">권한 제한적</text>

  <!-- 커널 모드 -->
  <rect x="606" y="40" width="250" height="160" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="731" y="102" font-size="21" font-weight="bold" fill="#4c1d95" text-anchor="middle">커널 모드</text>
  <text x="731" y="128" font-size="15" fill="#6d28d9" text-anchor="middle">Kernel Mode</text>
  <text x="731" y="166" font-size="15" fill="#4b5563" text-anchor="middle">모든 권한</text>

  <!-- 사용자 → 커널 -->
  <text x="440" y="80" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">시스템 콜/인터럽트</text>
  <line x1="284" y1="96" x2="596" y2="96" stroke="#6d28d9" stroke-width="3" marker-end="url(#ah-k)"/>

  <!-- 커널 → 사용자 -->
  <line x1="596" y1="146" x2="284" y2="146" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah-u)"/>
  <text x="440" y="176" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">처리 완료</text>
</svg>
