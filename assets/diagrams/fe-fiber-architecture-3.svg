<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 790" width="880" height="790" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">작업 루프의 beginWork·completeWork 순서</title>
  <desc id="d">App, Header, List, Item 트리를 child·sibling으로 내려가고 return으로 올라오며 순회할 때 내려가면서 beginWork(컴포넌트 실행, 자식 생성), 올라오면서 completeWork(DOM 노드 준비, 변경점 수집)를 호출하는 순서 ①~⑧을 트리 위 번호와 단계별 표로 보여준다. 루트까지 올라오면 render 단계가 끝난다.</desc>
  <rect width="880" height="790" fill="#ffffff"/>
  <defs>
    <marker id="ah-child" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <!-- 범례: 두 종류의 작업 -->
  <rect x="24" y="24" width="404" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="452" y="24" width="404" height="76" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <g font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="56" cy="62" r="15" fill="#1d4ed8"/>
    <rect x="469" y="47" width="30" height="30" rx="6" fill="#6d28d9"/>
  </g>
  <path d="M56,53 V71 M49,64 L56,71 L63,64" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M484,71 V53 M477,60 L484,53 L491,60" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="56" font-size="17" font-weight="bold" fill="#111827">내려가면서 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">beginWork</tspan></text>
  <text x="86" y="83" font-size="15" fill="#374151">(컴포넌트 실행, 자식 생성)</text>
  <text x="514" y="56" font-size="17" font-weight="bold" fill="#111827">올라오면서 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#6d28d9">completeWork</tspan></text>
  <text x="514" y="83" font-size="15" fill="#374151">(DOM 노드 준비, 변경점 수집)</text>
  <!-- 트리 -->
  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <rect x="240" y="132" width="120" height="46" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="300" y="161">App</text>
    <rect x="240" y="240" width="120" height="46" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="300" y="269">Header</text>
    <rect x="540" y="240" width="120" height="46" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="600" y="269">List</text>
    <rect x="540" y="348" width="120" height="46" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="600" y="377">Item</text>
  </g>
  <g font-size="16" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#374151">
    <line x1="300" y1="180" x2="300" y2="236" stroke="#374151" stroke-width="1.8" marker-end="url(#ah-child)"/>
    <text x="290" y="213" text-anchor="end">child</text>
    <line x1="405" y1="263" x2="494" y2="263" stroke="#374151" stroke-width="1.8" marker-end="url(#ah-child)"/>
    <text x="450" y="252" text-anchor="middle">sibling</text>
    <line x1="600" y1="288" x2="600" y2="344" stroke="#374151" stroke-width="1.8" marker-end="url(#ah-child)"/>
    <text x="590" y="321" text-anchor="end">child</text>
  </g>
  <g font-size="16" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#b45309">
    <line x1="686" y1="354" x2="686" y2="282" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-ret)"/>
    <text x="698" y="323">return</text>
    <path d="M686,246 V155 H405" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-ret)"/>
    <text x="698" y="206">return</text>
  </g>
  <g font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="214" cy="155" r="15" fill="#1d4ed8"/>
    <text x="214" y="161">1</text>
    <rect x="371" y="140" width="30" height="30" rx="6" fill="#6d28d9"/>
    <text x="386" y="161">8</text>
    <circle cx="214" cy="263" r="15" fill="#1d4ed8"/>
    <text x="214" y="269">2</text>
    <rect x="371" y="248" width="30" height="30" rx="6" fill="#6d28d9"/>
    <text x="386" y="269">3</text>
    <circle cx="514" cy="263" r="15" fill="#1d4ed8"/>
    <text x="514" y="269">4</text>
    <rect x="671" y="248" width="30" height="30" rx="6" fill="#6d28d9"/>
    <text x="686" y="269">7</text>
    <circle cx="514" cy="371" r="15" fill="#1d4ed8"/>
    <text x="514" y="377">5</text>
    <rect x="671" y="356" width="30" height="30" rx="6" fill="#6d28d9"/>
    <text x="686" y="377">6</text>
  </g>
  <!-- 단계표 -->
  <rect x="24" y="424" width="832" height="36" fill="#f3f4f6"/>
  <g font-size="15" font-weight="bold" fill="#374151">
    <text x="54" y="447" text-anchor="middle">단계</text>
    <text x="98" y="447">호출</text>
    <text x="350" y="447">판단</text>
  </g>
  <line x1="24" y1="498" x2="856" y2="498" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="536" x2="856" y2="536" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="574" x2="856" y2="574" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="612" x2="856" y2="612" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="650" x2="856" y2="650" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="688" x2="856" y2="688" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="726" x2="856" y2="726" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="460" x2="856" y2="460" stroke="#d1d5db" stroke-width="1"/>
  <line x1="84" y1="424" x2="84" y2="764" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="336" y1="424" x2="336" y2="764" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="24" y="424" width="832" height="340" fill="none" stroke="#d1d5db" stroke-width="1"/>
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="54" cy="479" r="13" fill="#1d4ed8"/>
    <text x="54" y="484">1</text>
    <circle cx="54" cy="517" r="13" fill="#1d4ed8"/>
    <text x="54" y="522">2</text>
    <rect x="41" y="542" width="26" height="26" rx="5" fill="#6d28d9"/>
    <text x="54" y="560">3</text>
    <circle cx="54" cy="593" r="13" fill="#1d4ed8"/>
    <text x="54" y="598">4</text>
    <circle cx="54" cy="631" r="13" fill="#1d4ed8"/>
    <text x="54" y="636">5</text>
    <rect x="41" y="656" width="26" height="26" rx="5" fill="#6d28d9"/>
    <text x="54" y="674">6</text>
    <rect x="41" y="694" width="26" height="26" rx="5" fill="#6d28d9"/>
    <text x="54" y="712">7</text>
    <rect x="41" y="732" width="26" height="26" rx="5" fill="#6d28d9"/>
    <text x="54" y="750">8</text>
  </g>
  <g font-size="17" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="98" y="485" fill="#1d4ed8">beginWork(App)</text>
    <text x="98" y="523" fill="#1d4ed8">beginWork(Header)</text>
    <text x="98" y="561" fill="#6d28d9">completeWork(Header)</text>
    <text x="98" y="599" fill="#1d4ed8">beginWork(List)</text>
    <text x="98" y="637" fill="#1d4ed8">beginWork(Item)</text>
    <text x="98" y="675" fill="#6d28d9">completeWork(Item)</text>
    <text x="98" y="713" fill="#6d28d9">completeWork(List)</text>
    <text x="98" y="751" fill="#6d28d9">completeWork(App)</text>
  </g>
  <g font-size="16" fill="#1f2937">
    <text x="350" y="485">자식이 있으니 내려간다</text>
    <text x="350" y="523">자식이 없다</text>
    <text x="350" y="561">형제가 있으니 그쪽으로 넘어간다</text>
    <text x="350" y="599">자식이 있으니 내려간다</text>
    <text x="350" y="637">자식이 없다</text>
    <text x="350" y="675">형제가 없으니 부모로 올라간다</text>
    <text x="350" y="713">형제가 없으니 부모로 올라간다</text>
    <text x="350" y="751" font-weight="bold" fill="#111827">루트까지 올라오면 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">render</tspan> 단계 종료</text>
  </g>
</svg>
