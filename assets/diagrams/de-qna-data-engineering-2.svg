<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DAG 작업 의존성</title>
  <desc id="d">DAG는 방향성 있고 순환하지 않는 그래프로 작업 간 실행 순서와 의존성을 나타낸다. extract 다음 transform이 실행되고, transform 뒤에 load와 notify가 이어지며, 사이클이 없어 무한 루프를 막는다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="832" height="48" rx="8" fill="#f1f5f9"/>
  <text x="440" y="54" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">방향성 있고 순환하지 않는 그래프 = 작업 간 실행 순서/의존성</text>

  <!-- 그래프 -->
  <rect x="125" y="100" width="150" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="132" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">extract</text>

  <rect x="365" y="100" width="150" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="132" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">transform</text>

  <rect x="605" y="100" width="150" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="680" y="132" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">load</text>

  <rect x="605" y="184" width="150" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="680" y="216" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">notify</text>

  <path d="M279,126 L360,126" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M519,126 L600,126" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M440,156 L440,210 L600,210" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 성질 -->
  <rect x="24" y="266" width="404" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="298" font-size="18" font-weight="bold" fill="#1d4ed8">방향성</text>
  <text x="48" y="332" font-size="16" fill="#1f2937">실행 순서 (<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">extract</tspan> 다음 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">transform</tspan>)</text>

  <rect x="452" y="266" width="404" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="476" y="298" font-size="18" font-weight="bold" fill="#047857">비순환</text>
  <text x="476" y="332" font-size="16" fill="#1f2937">사이클 없음 (무한 루프 방지)</text>
</svg>
