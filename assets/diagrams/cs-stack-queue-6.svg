<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">힙의 구조</title>
  <desc id="d">Min Heap 트리 구조와 배열 표현 방식, 그리고 인덱스 계산 공식과 검증 예시</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Left Column: Min Heap Tree -->
  <g>
    <!-- Section Title -->
    <text x="210" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Min Heap</text>

    <!-- Tree Edges -->
    <line x1="210" y1="80" x2="140" y2="130" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="210" y1="80" x2="280" y2="130" stroke="#9aa5b1" stroke-width="2"/>

    <line x1="140" y1="150" x2="90" y2="200" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="140" y1="150" x2="190" y2="200" stroke="#9aa5b1" stroke-width="2"/>

    <line x1="280" y1="150" x2="230" y2="200" stroke="#9aa5b1" stroke-width="2"/>

    <!-- Tree Nodes -->
    <!-- Node 1 (Root, idx 0) -->
    <circle cx="210" cy="80" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="85" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text>

    <!-- Node 3 (idx 1) -->
    <circle cx="140" cy="140" r="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="140" y="145" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">3</text>

    <!-- Node 2 (idx 2) -->
    <circle cx="280" cy="140" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="280" y="145" font-size="14" fill="#1f2933" text-anchor="middle">2</text>

    <!-- Node 7 (idx 3) -->
    <circle cx="90" cy="210" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="90" y="215" font-size="14" fill="#1f2933" text-anchor="middle">7</text>

    <!-- Node 5 (idx 4) -->
    <circle cx="190" cy="210" r="22" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="190" y="215" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">5</text>

    <!-- Node 4 (idx 5) -->
    <circle cx="230" cy="210" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="230" y="215" font-size="14" fill="#1f2933" text-anchor="middle">4</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="420" y1="30" x2="420" y2="360" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right Column: Array Representation & Formulas -->
  <g>
    <!-- Section Title -->
    <text x="460" y="44" font-size="16" font-weight="bold" fill="#1f2933">배열 표현</text>

    <!-- Array Representation Label & Cells -->
    <g transform="translate(460, 60)">
      <text x="0" y="32" font-size="13" font-weight="bold" fill="#52606d">idx:</text>

      <!-- idx 0 -->
      <text x="60" y="18" font-size="11.5" fill="#52606d" text-anchor="middle">0</text>
      <rect x="42" y="24" width="36" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="60" y="46" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[1]</text>

      <!-- idx 1 -->
      <text x="100" y="18" font-size="11.5" fill="#52606d" text-anchor="middle">1</text>
      <rect x="82" y="24" width="36" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
      <text x="100" y="46" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">[3]</text>

      <!-- idx 2 -->
      <text x="140" y="18" font-size="11.5" fill="#52606d" text-anchor="middle">2</text>
      <rect x="122" y="24" width="36" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
      <text x="140" y="46" font-size="14" fill="#1f2933" text-anchor="middle">[2]</text>

      <!-- idx 3 -->
      <text x="180" y="18" font-size="11.5" fill="#52606d" text-anchor="middle">3</text>
      <rect x="162" y="24" width="36" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
      <text x="180" y="46" font-size="14" fill="#1f2933" text-anchor="middle">[7]</text>

      <!-- idx 4 -->
      <text x="220" y="18" font-size="11.5" fill="#52606d" text-anchor="middle">4</text>
      <rect x="202" y="24" width="36" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="220" y="46" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">[5]</text>

      <!-- idx 5 -->
      <text x="260" y="18" font-size="11.5" fill="#52606d" text-anchor="middle">5</text>
      <rect x="242" y="24" width="36" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
      <text x="260" y="46" font-size="14" fill="#1f2933" text-anchor="middle">[4]</text>
    </g>

    <!-- Index Formulas Box -->
    <rect x="460" y="145" width="380" height="110" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    
    <text x="480" y="177" font-size="13" font-weight="bold" fill="#1f2933">부모(i)</text>
    <text x="610" y="177" font-size="13" fill="#1f2933">= (i - 1) / 2</text>

    <text x="480" y="207" font-size="13" font-weight="bold" fill="#1f2933">왼쪽 자식(i)</text>
    <text x="610" y="207" font-size="13" fill="#1f2933">= 2i + 1</text>

    <text x="480" y="237" font-size="13" font-weight="bold" fill="#1f2933">오른쪽 자식(i)</text>
    <text x="610" y="237" font-size="13" fill="#1f2933">= 2i + 2</text>

    <!-- Example Verification Box -->
    <rect x="460" y="275" width="380" height="75" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="475" y="303" font-size="13" fill="#1f2933">
      <tspan font-weight="bold" fill="#059669">idx 4(값 5)</tspan>의 부모 = (4-1)/2 = 1 → <tspan font-weight="bold" fill="#d97706">값 3</tspan>.
    </text>
    <text x="475" y="331" font-size="13" fill="#1f2933">
      3 ≤ 5 이므로 <tspan font-weight="bold" fill="#2563eb">힙 조건 만족</tspan>
    </text>
  </g>

  <!-- Relationship Arrow: Node 5 -> Node 3 -->
  <path d="M 175 195 L 155 158" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#a-blue)"/>
</svg>