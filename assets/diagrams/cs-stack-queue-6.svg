<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">힙의 배열 표현</title>
  <desc id="d">값 1, 3, 2, 7, 5, 4로 이루어진 Min Heap 트리를 인덱스 0부터 5까지의 배열로 옮기고, 부모 (i - 1) / 2, 왼쪽 자식 2i + 1, 오른쪽 자식 2i + 2 공식을 적용해 idx 4(값 5)의 부모가 idx 1(값 3)이며 3 ≤ 5로 힙 조건을 만족함을 보이는 그림.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 왼쪽: Min Heap 트리 -->
  <text x="24" y="40" font-size="18" font-weight="bold" fill="#111827">Min Heap <tspan font-size="15" font-weight="normal" fill="#4b5563">(완전 이진 트리)</tspan></text>

  <line x1="193" y1="117" x2="142" y2="168" stroke="#9ca3af" stroke-width="2"/>
  <line x1="227" y1="117" x2="278" y2="168" stroke="#9ca3af" stroke-width="2"/>
  <line x1="113.8" y1="206.2" x2="91.2" y2="248.8" stroke="#9ca3af" stroke-width="2"/>
  <line x1="136.2" y1="206.2" x2="158.8" y2="248.8" stroke="#b45309" stroke-width="3.5"/>
  <line x1="283.8" y1="206.2" x2="261.2" y2="248.8" stroke="#9ca3af" stroke-width="2"/>

  <circle cx="210" cy="100" r="24" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="210" y="107" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
  <text x="244" y="105" font-size="14" fill="#4b5563">idx 0</text>

  <circle cx="125" cy="185" r="24" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="125" y="192" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">3</text>
  <text x="93" y="190" font-size="14" fill="#4b5563" text-anchor="end">idx 1</text>

  <circle cx="295" cy="185" r="24" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="295" y="192" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
  <text x="327" y="190" font-size="14" fill="#4b5563">idx 2</text>

  <circle cx="80" cy="270" r="24" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="277" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">7</text>
  <text x="80" y="316" font-size="14" fill="#4b5563" text-anchor="middle">idx 3</text>

  <circle cx="170" cy="270" r="24" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <text x="170" y="277" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">5</text>
  <text x="170" y="316" font-size="14" fill="#4b5563" text-anchor="middle">idx 4</text>

  <circle cx="250" cy="270" r="24" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="250" y="277" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">4</text>
  <text x="250" y="316" font-size="14" fill="#4b5563" text-anchor="middle">idx 5</text>

  <!-- 구분선 -->
  <line x1="404" y1="28" x2="404" y2="340" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 오른쪽: 배열 표현 -->
  <text x="440" y="40" font-size="18" font-weight="bold" fill="#111827">배열 표현</text>

  <text x="440" y="89" font-size="14" font-weight="bold" fill="#4b5563">idx</text>
  <text x="524" y="89" font-size="14" fill="#4b5563" text-anchor="middle">0</text>
  <text x="580" y="89" font-size="14" fill="#4b5563" text-anchor="middle">1</text>
  <text x="636" y="89" font-size="14" fill="#4b5563" text-anchor="middle">2</text>
  <text x="692" y="89" font-size="14" fill="#4b5563" text-anchor="middle">3</text>
  <text x="748" y="89" font-size="14" fill="#4b5563" text-anchor="middle">4</text>
  <text x="804" y="89" font-size="14" fill="#4b5563" text-anchor="middle">5</text>

  <text x="440" y="128" font-size="14" font-weight="bold" fill="#4b5563">값</text>
  <rect x="496" y="98" width="56" height="48" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="552" y="98" width="56" height="48" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <rect x="608" y="98" width="56" height="48" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="664" y="98" width="56" height="48" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="720" y="98" width="56" height="48" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <rect x="776" y="98" width="56" height="48" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="524" y="129" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
  <text x="580" y="129" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">3</text>
  <text x="636" y="129" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
  <text x="692" y="129" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">7</text>
  <text x="748" y="129" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">5</text>
  <text x="804" y="129" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">4</text>

  <!-- idx 4 → 부모 idx 1 -->
  <path d="M748,152 C748,198 580,198 580,160" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="664" y="212" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">부모(4) = (4 - 1) / 2 = 1</text>

  <!-- 인덱스 공식 -->
  <rect x="440" y="230" width="416" height="110" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="464" y="264" font-size="16" font-weight="bold" fill="#111827">부모(i)</text>
  <text x="614" y="264" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= (i - 1) / 2</text>
  <text x="464" y="296" font-size="16" font-weight="bold" fill="#111827">왼쪽 자식(i)</text>
  <text x="614" y="296" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= 2i + 1</text>
  <text x="464" y="328" font-size="16" font-weight="bold" fill="#111827">오른쪽 자식(i)</text>
  <text x="614" y="328" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= 2i + 2</text>

  <!-- 검증 예시 -->
  <rect x="24" y="364" width="832" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="396" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#047857">idx 4(값 5)</tspan>의 부모 = (4 - 1) / 2 = 1 → <tspan font-weight="bold" fill="#b45309">값 3</tspan>.   3 ≤ 5 이므로 <tspan font-weight="bold">힙 조건 만족</tspan></text>
</svg>
