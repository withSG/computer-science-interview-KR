<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스팸 필터 혼동 행렬</title>
  <desc id="d">메일 10,000건 스팸 필터 예시를 혼동 행렬에 채운 표. 스팸을 Positive로 두면 TP 210, FN 90, FP 140, TN 9,560이고, 실제 스팸 300·정상 9,700, 예측 스팸 350·정상 9,650이다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <text x="40" y="40" font-size="16" fill="#374151">스팸 필터 예시 · 메일 10,000건 · 여기서는 <tspan font-weight="bold" fill="#111827">스팸이 Positive</tspan></text>

  <!-- 칸 면색 -->
  <rect x="40" y="60" width="800" height="48" fill="#e5e7eb"/>
  <rect x="40" y="108" width="200" height="220" fill="#f3f4f6"/>
  <rect x="240" y="108" width="200" height="76" fill="#ecfdf5"/>
  <rect x="440" y="108" width="200" height="76" fill="#fef2f2"/>
  <rect x="240" y="184" width="200" height="76" fill="#fef2f2"/>
  <rect x="440" y="184" width="200" height="76" fill="#ecfdf5"/>
  <rect x="640" y="108" width="200" height="152" fill="#f9fafb"/>
  <rect x="240" y="260" width="600" height="68" fill="#f9fafb"/>

  <!-- 격자 -->
  <line x1="40" y1="108" x2="840" y2="108" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="40" y1="184" x2="840" y2="184" stroke="#d1d5db" stroke-width="1"/>
  <line x1="40" y1="260" x2="840" y2="260" stroke="#6b7280" stroke-width="2"/>
  <line x1="240" y1="60" x2="240" y2="328" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="440" y1="60" x2="440" y2="328" stroke="#d1d5db" stroke-width="1"/>
  <line x1="640" y1="60" x2="640" y2="328" stroke="#6b7280" stroke-width="2"/>
  <rect x="40" y="60" width="800" height="268" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 머리행 -->
  <text x="340" y="90" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">예측: 스팸</text>
  <text x="540" y="90" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">예측: 정상</text>
  <text x="740" y="90" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">합계</text>

  <!-- 행 머리 -->
  <text x="140" y="152" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">실제: 스팸</text>
  <text x="140" y="228" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">실제: 정상</text>
  <text x="140" y="300" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">합계</text>

  <!-- 실제: 스팸 -->
  <text x="340" y="150" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">210</text>
  <text x="340" y="172" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">TP</text>
  <text x="540" y="150" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">90</text>
  <text x="540" y="172" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">FN</text>
  <text x="740" y="154" font-size="22" font-weight="bold" fill="#374151" text-anchor="middle">300</text>

  <!-- 실제: 정상 -->
  <text x="340" y="226" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">140</text>
  <text x="340" y="248" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">FP</text>
  <text x="540" y="226" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">9,560</text>
  <text x="540" y="248" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">TN</text>
  <text x="740" y="230" font-size="22" font-weight="bold" fill="#374151" text-anchor="middle">9,700</text>

  <!-- 합계 -->
  <text x="340" y="302" font-size="22" font-weight="bold" fill="#374151" text-anchor="middle">350</text>
  <text x="540" y="302" font-size="22" font-weight="bold" fill="#374151" text-anchor="middle">9,650</text>
  <text x="740" y="302" font-size="22" font-weight="bold" fill="#374151" text-anchor="middle">10,000</text>

  <!-- 범례 -->
  <rect x="40" y="348" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="64" y="361" font-size="15" fill="#111827">예측이 맞음 (TP·TN)</text>
  <rect x="244" y="348" width="16" height="16" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="268" y="361" font-size="15" fill="#111827">예측이 틀림 (FN·FP)</text>
</svg>
