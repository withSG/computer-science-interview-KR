<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">체계적 진단 6단계</title>
  <desc id="d">증상 정의, 변경점 확인, 범위 좁히기, 가설과 검증, 완화, 근본 원인과 재발 방지의 6단계를 위에서 아래로 진행합니다. 5단계 완화는 실제로는 2단계 직후에 이미 실행돼 있는 경우가 많습니다.</desc>
  <rect width="880" height="780" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 진행 척추 -->
  <g stroke="#1d4ed8" stroke-width="2" fill="none">
    <line x1="52" y1="68" x2="52" y2="214" marker-end="url(#ah)"/>
    <line x1="52" y1="252" x2="52" y2="338" marker-end="url(#ah)"/>
    <line x1="52" y1="376" x2="52" y2="462" marker-end="url(#ah)"/>
    <line x1="52" y1="500" x2="52" y2="586" marker-end="url(#ah)"/>
    <line x1="52" y1="624" x2="52" y2="686" marker-end="url(#ah)"/>
  </g>
  <g fill="#1d4ed8">
    <circle cx="52" cy="50" r="17"/>
    <circle cx="52" cy="234" r="17"/>
    <circle cx="52" cy="358" r="17"/>
    <circle cx="52" cy="482" r="17"/>
    <circle cx="52" cy="606" r="17" fill="#b45309"/>
    <circle cx="52" cy="706" r="17"/>
  </g>
  <g font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="52" y="56">1</text>
    <text x="52" y="240">2</text>
    <text x="52" y="364">3</text>
    <text x="52" y="488">4</text>
    <text x="52" y="612">5</text>
    <text x="52" y="712">6</text>
  </g>

  <!-- 1. 증상 정의 -->
  <rect x="88" y="24" width="572" height="160" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="56" font-size="18" font-weight="bold" fill="#111827">증상 정의</text>
  <rect x="108" y="79" width="82" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="149" y="99" font-size="15" fill="#374151" text-anchor="middle">“느리다”</text>
  <line x1="196" y1="94" x2="222" y2="94" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="228" y="66" width="412" height="56" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="242" y="89" font-size="15" fill="#111827">
    <tspan x="242">“결제 API p99가 200ms에서 3.4초, 14:33부터,</tspan>
    <tspan x="242" dy="21">전체 사용자, 조회 API는 정상”</tspan>
  </text>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1">
    <rect x="108" y="136" width="54" height="30" rx="15"/>
    <rect x="172" y="136" width="84" height="30" rx="15"/>
    <rect x="266" y="136" width="69" height="30" rx="15"/>
    <rect x="345" y="136" width="69" height="30" rx="15"/>
    <rect x="424" y="136" width="133" height="30" rx="15"/>
  </g>
  <g font-size="15" fill="#111827" text-anchor="middle">
    <text x="135" y="156">누가</text>
    <text x="214" y="156">언제부터</text>
    <text x="300.5" y="156">무엇이</text>
    <text x="379.5" y="156">얼마나</text>
    <text x="490.5" y="156">어디는 멀쩡한가</text>
  </g>

  <!-- 2. 변경점 확인 -->
  <rect x="88" y="208" width="572" height="100" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="240" font-size="18" font-weight="bold" fill="#111827">변경점 확인</text>
  <text x="108" y="270" font-size="15" fill="#1f2937">증상 시작 시각 ±30분 안에 바뀐 것 전부 나열</text>
  <text x="108" y="292" font-size="15" fill="#1f2937">대부분의 장애는 “누가 뭘 바꿔서” 생긴다</text>

  <!-- 3. 범위 좁히기 -->
  <rect x="88" y="332" width="572" height="100" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="364" font-size="18" font-weight="bold" fill="#111827">범위 좁히기</text>
  <text x="108" y="394" font-size="15" fill="#1f2937">요청 경로를 절반으로 갈라 어느 쪽인지 판정하고 반복</text>
  <text x="108" y="416" font-size="15" fill="#4b5563">(아래 이분 탐색 그림)</text>

  <!-- 4. 가설과 검증 -->
  <rect x="88" y="456" width="572" height="100" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="488" font-size="18" font-weight="bold" fill="#111827">가설과 검증</text>
  <text x="108" y="518" font-size="15" fill="#1f2937">“X 때문이라면 Y가 관측돼야 한다”는 형태로 세우고 Y를 확인</text>
  <text x="108" y="540" font-size="15" fill="#1f2937">한 번에 하나만 바꾼다</text>

  <!-- 5. 완화 -->
  <rect x="88" y="580" width="572" height="76" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="108" y="612" font-size="18" font-weight="bold" fill="#111827">완화</text>
  <text x="108" y="640" font-size="15" fill="#1f2937">지표가 정상으로 돌아왔는지 + 밀린 큐가 소진됐는지 확인</text>

  <!-- 6. 근본 원인과 재발 방지 -->
  <rect x="88" y="680" width="572" height="76" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="712" font-size="18" font-weight="bold" fill="#111827">근본 원인과 재발 방지</text>
  <text x="108" y="740" font-size="15" fill="#1f2937">왜 발생했나 + 왜 못 막았나 + 왜 늦게 알았나</text>

  <!-- 2단계 → 5단계 지름길 -->
  <path d="M662,258 H700 V618 H666" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-amber)"/>
  <text x="712" y="400" font-size="15" fill="#92400e">
    <tspan x="712">실제로는 2단계</tspan>
    <tspan x="712" dy="21">직후에 이미</tspan>
    <tspan x="712" dy="21">실행돼 있는</tspan>
    <tspan x="712" dy="21">경우가 많다</tspan>
  </text>
</svg>
