<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">체계적 진단 절차</title>
  <desc id="d">장애 발생 시 1단계 증상 정의부터 6단계 근본 원인 및 재발 방지까지 순차적으로 진행하는 6단계 체계적 진단 절차 흐름도</desc>
  
  <rect width="880" height="770" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g>
    <rect x="100" y="30" width="680" height="96" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="100" y="30" width="680" height="28" rx="6" fill="#2563eb"/>
    <rect x="100" y="52" width="680" height="6" fill="#2563eb"/>
    <text x="116" y="50" font-size="14" font-weight="bold" fill="#ffffff">1. 증상 정의</text>
    <text x="116" y="80" font-size="13" fill="#1f2933">"느리다" → "결제 API p99가 200ms에서 3.4초, 14:33부터,</text>
    <text x="216" y="98" font-size="13" fill="#1f2933">전체 사용자, 조회 API는 정상"</text>
    <text x="116" y="116" font-size="11.5" fill="#52606d">누가 / 언제부터 / 무엇이 / 얼마나 / 어디는 멀쩡한가</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,126 L440,150" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g>
    <rect x="100" y="150" width="680" height="80" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="100" y="150" width="680" height="28" rx="6" fill="#d97706"/>
    <rect x="100" y="172" width="680" height="6" fill="#d97706"/>
    <text x="116" y="170" font-size="14" font-weight="bold" fill="#ffffff">2. 변경점 확인</text>
    <text x="116" y="200" font-size="13" fill="#1f2933">증상 시작 시각 ±30분 안에 바뀐 것 전부 나열</text>
    <text x="116" y="218" font-size="13" fill="#1f2933">대부분의 장애는 "누가 뭘 바꿔서" 생긴다</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,230 L440,254" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g>
    <rect x="100" y="254" width="680" height="80" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="100" y="254" width="680" height="28" rx="6" fill="#52606d"/>
    <rect x="100" y="276" width="680" height="6" fill="#52606d"/>
    <text x="116" y="274" font-size="14" font-weight="bold" fill="#ffffff">3. 범위 좁히기</text>
    <text x="116" y="304" font-size="13" fill="#1f2933">요청 경로를 절반으로 갈라 어느 쪽인지 판정하고 반복</text>
    <text x="116" y="322" font-size="11.5" fill="#52606d">(아래 이분 탐색 그림)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,334 L440,358" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g>
    <rect x="100" y="358" width="680" height="80" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="100" y="358" width="680" height="28" rx="6" fill="#52606d"/>
    <rect x="100" y="380" width="680" height="6" fill="#52606d"/>
    <text x="116" y="378" font-size="14" font-weight="bold" fill="#ffffff">4. 가설과 검증</text>
    <text x="116" y="408" font-size="13" fill="#1f2933">"X 때문이라면 Y가 관측돼야 한다"는 형태로 세우고 Y를 확인</text>
    <text x="116" y="426" font-size="13" fill="#1f2933">한 번에 하나만 바꾼다</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,438 L440,462" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g>
    <rect x="100" y="462" width="680" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="100" y="462" width="680" height="28" rx="6" fill="#dc2626"/>
    <rect x="100" y="484" width="680" height="6" fill="#dc2626"/>
    <text x="116" y="482" font-size="14" font-weight="bold" fill="#ffffff">5. 완화</text>
    <text x="116" y="512" font-size="11.5" fill="#52606d">(실제로는 2단계 직후에 이미 실행돼 있는 경우가 많다)</text>
    <text x="116" y="530" font-size="13" fill="#1f2933">지표가 정상으로 돌아왔는지 + 밀린 큐가 소진됐는지 확인</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M440,542 L440,566" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <g>
    <rect x="100" y="566" width="680" height="62" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="100" y="566" width="680" height="28" rx="6" fill="#059669"/>
    <rect x="100" y="588" width="680" height="6" fill="#059669"/>
    <text x="116" y="586" font-size="14" font-weight="bold" fill="#ffffff">6. 근본 원인과 재발 방지</text>
    <text x="116" y="616" font-size="13" fill="#1f2933">왜 발생했나 + 왜 못 막았나 + 왜 늦게 알았나</text>
  </g>
</svg>