<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">능동 헬스체크와 수동 헬스체크</title>
  <desc id="d">능동 방식은 LB가 5초마다 GET /health로 서버를 먼저 찔러 보고, 수동 방식은 실제 요청이 타임아웃이나 5xx로 끝나면 실패 카운트를 올린다. 각 방식의 장점과 단점을 함께 보여준다.</desc>
  <rect width="880" height="444" fill="#ffffff"/>
  <defs>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 능동 -->
  <rect x="24" y="24" width="832" height="190" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="60" font-size="20" font-weight="700" fill="#1d4ed8">능동(Active)</text>
  <text x="190" y="60" font-size="16" fill="#374151">LB가 주기적으로 먼저 찔러본다</text>

  <rect x="44" y="84" width="90" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="89" y="112" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">LB</text>
  <line x1="142" y1="106" x2="352" y2="106" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahB)"/>
  <text x="247" y="96" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /health</text>
  <text x="247" y="127" font-size="15" fill="#4b5563" text-anchor="middle">5초마다</text>
  <rect x="360" y="84" width="120" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="420" y="112" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Server</text>

  <rect x="44" y="148" width="388" height="44" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="60" y="175" font-size="15" font-weight="700" fill="#047857">장점</text>
  <text x="106" y="175" font-size="15" fill="#111827">트래픽이 없어도 상태를 안다</text>
  <rect x="448" y="148" width="388" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="464" y="175" font-size="15" font-weight="700" fill="#b91c1c">단점</text>
  <text x="510" y="175" font-size="15" fill="#111827">서버 수 × 주기만큼 추가 요청</text>

  <!-- 수동 -->
  <rect x="24" y="230" width="832" height="190" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="266" font-size="20" font-weight="700" fill="#6d28d9">수동(Passive)</text>
  <text x="190" y="266" font-size="16" fill="#374151">실제 요청의 실패를 관찰한다</text>

  <rect x="44" y="290" width="90" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="89" y="318" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">LB</text>
  <line x1="142" y1="312" x2="352" y2="312" stroke="#374151" stroke-width="2" marker-end="url(#ahG)"/>
  <text x="247" y="302" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">실제 요청</text>
  <rect x="360" y="290" width="120" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="420" y="318" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Server</text>
  <line x1="488" y1="312" x2="660" y2="312" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahR)"/>
  <text x="574" y="302" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">타임아웃/5xx</text>
  <rect x="668" y="290" width="168" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="752" y="317" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">실패 카운트 증가</text>

  <rect x="44" y="354" width="388" height="44" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="60" y="381" font-size="15" font-weight="700" fill="#047857">장점</text>
  <text x="106" y="381" font-size="15" fill="#111827">추가 비용 0, 진짜 트래픽으로 판단</text>
  <rect x="448" y="354" width="388" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="464" y="381" font-size="15" font-weight="700" fill="#b91c1c">단점</text>
  <text x="510" y="381" font-size="15" fill="#111827">사용자 요청 몇 개는 이미 실패한 뒤에 감지</text>
</svg>
