<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">능동 vs 수동</title>
  <desc id="d">능동(Active) 및 수동(Passive) 헬스체크 방식의 흐름과 장단점 비교 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- Section 1: Active Health Check -->
  <rect x="30" y="30" width="820" height="180" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- Active Title & Description -->
  <text x="50" y="62" font-size="16" font-weight="bold" fill="#2563eb">능동(Active)</text>
  <text x="150" y="62" font-size="14" fill="#52606d">LB가 주기적으로 먼저 찔러본다</text>

  <!-- Active Diagram Nodes -->
  <rect x="60" y="85" width="80" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="107" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">LB</text>

  <path d="M140,103 L320,103" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="180" y="92" width="100" height="20" fill="#ffffff" rx="2"/>
  <text x="230" y="106" font-size="11.5" fill="#2563eb" text-anchor="middle">GET /health</text>

  <rect x="320" y="85" width="90" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="365" y="107" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Server</text>

  <text x="430" y="107" font-size="13" fill="#52606d">5초마다</text>

  <!-- Active Pros & Cons -->
  <text x="60" y="152" font-size="13" fill="#059669">장점: <tspan fill="#1f2933">트래픽이 없어도 상태를 안다</tspan></text>
  <text x="60" y="180" font-size="13" fill="#dc2626">단점: <tspan fill="#1f2933">서버 수 × 주기만큼 추가 요청</tspan></text>

  <!-- Section 2: Passive Health Check -->
  <rect x="30" y="230" width="820" height="180" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Passive Title & Description -->
  <text x="50" y="262" font-size="16" font-weight="bold" fill="#d97706">수동(Passive)</text>
  <text x="150" y="262" font-size="14" fill="#52606d">실제 요청의 실패를 관찰한다</text>

  <!-- Passive Diagram Nodes -->
  <rect x="60" y="285" width="80" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="307" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">LB</text>

  <path d="M140,303 L250,303" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="158" y="292" width="74" height="20" fill="#ffffff" rx="2"/>
  <text x="195" y="306" font-size="11.5" fill="#d97706" text-anchor="middle">실제 요청</text>

  <rect x="250" y="285" width="90" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="295" y="307" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Server</text>

  <path d="M340,303 L490,303" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="353" y="292" width="124" height="20" fill="#ffffff" rx="2"/>
  <text x="415" y="306" font-size="11.5" fill="#dc2626" text-anchor="middle">타임아웃/5xx</text>

  <rect x="490" y="285" width="130" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="555" y="307" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">실패 카운트 증가</text>

  <!-- Passive Pros & Cons -->
  <text x="60" y="352" font-size="13" fill="#059669">장점: <tspan fill="#1f2933">추가 비용 0, 진짜 트래픽으로 판단</tspan></text>
  <text x="60" y="380" font-size="13" fill="#dc2626">단점: <tspan fill="#1f2933">사용자 요청 몇 개는 이미 실패한 뒤에 감지</tspan></text>
</svg>