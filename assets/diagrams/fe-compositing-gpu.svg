<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">합성 레이어 분리와 합성 결과</title>
  <desc id="d">화면(합성 결과)은 레이어 1(나머지 문서 전체), 레이어 2(video), 레이어 3(애니메이션 중인 모달)을 z축 순서대로 겹친 것이다. 레이어 3을 옮길 때는 레이어 1, 2는 그대로 두고 비트맵을 재사용하며, 레이어 3의 위치만 바꿔 다시 겹친다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="72" y="40" font-size="16" font-weight="bold" fill="#1f2937">합성 레이어 (각자 자기 비트맵)</text>
  <text x="72" y="60" font-size="14" fill="#4b5563">DevTools Layers 패널에서 확인</text>
  <text x="478" y="40" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">레이어 3을 옮기면</text>
  <text x="738" y="40" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">화면 (합성 결과)</text>

  <g transform="translate(0,20)">
  <!-- z축 -->
  <line x1="58" y1="338" x2="58" y2="66" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="42" y="202" font-size="15" fill="#374151" text-anchor="middle" transform="rotate(-90 42 202)">z축 겹침 순서</text>

  <!-- 레이어 3: 애니메이션 중인 모달 -->
  <rect x="72" y="60" width="500" height="84" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <rect x="88" y="74" width="84" height="56" rx="4" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="100" y="86" width="60" height="8" rx="2" fill="#c4b5fd"/>
  <rect x="112" y="108" width="36" height="12" rx="3" fill="#6d28d9"/>
  <circle cx="200" cy="90" r="12" fill="#6d28d9"/>
  <text x="200" y="95" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="220" y="96" font-size="16" font-weight="bold" fill="#1f2937">레이어 3</text>
  <text x="188" y="124" font-size="15" fill="#374151">애니메이션 중인 모달</text>
  <rect x="384" y="74" width="176" height="56" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="472" y="97" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">위치만 바꿈</text>
  <text x="472" y="120" font-size="15" fill="#6d28d9" text-anchor="middle">다시 겹침</text>

  <!-- 레이어 2: video -->
  <rect x="72" y="160" width="500" height="84" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="88" y="174" width="84" height="56" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <polygon points="122,190 122,214 142,202" fill="#1d4ed8"/>
  <circle cx="200" cy="190" r="12" fill="#1d4ed8"/>
  <text x="200" y="195" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="220" y="196" font-size="16" font-weight="bold" fill="#1f2937">레이어 2</text>
  <text x="188" y="224" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;video&gt;</text>
  <rect x="384" y="174" width="176" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="472" y="197" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">그대로 둠</text>
  <text x="472" y="220" font-size="15" fill="#374151" text-anchor="middle">비트맵 재사용</text>

  <!-- 레이어 1: 나머지 문서 전체 -->
  <rect x="72" y="260" width="500" height="84" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="88" y="274" width="84" height="56" rx="4" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="98" y1="286" x2="162" y2="286" stroke="#9ca3af" stroke-width="3"/>
  <line x1="98" y1="298" x2="156" y2="298" stroke="#d1d5db" stroke-width="3"/>
  <line x1="98" y1="308" x2="160" y2="308" stroke="#d1d5db" stroke-width="3"/>
  <line x1="98" y1="318" x2="140" y2="318" stroke="#d1d5db" stroke-width="3"/>
  <circle cx="200" cy="290" r="12" fill="#4b5563"/>
  <text x="200" y="295" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="220" y="296" font-size="16" font-weight="bold" fill="#1f2937">레이어 1</text>
  <text x="188" y="324" font-size="15" fill="#374151">나머지 문서 전체</text>
  <rect x="384" y="274" width="176" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="472" y="297" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">그대로 둠</text>
  <text x="472" y="320" font-size="15" fill="#374151" text-anchor="middle">비트맵 재사용</text>

  <!-- 합성 화살표 -->
  <text x="596" y="190" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">합성</text>
  <line x1="578" y1="202" x2="614" y2="202" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 화면 (합성 결과) = 레이어 1 바탕 위에 2, 3 -->
  <rect x="620" y="60" width="236" height="284" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="642" cy="82" r="12" fill="#4b5563"/>
  <text x="642" y="87" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="664" y1="82" x2="836" y2="82" stroke="#d1d5db" stroke-width="3"/>
  <line x1="636" y1="102" x2="820" y2="102" stroke="#d1d5db" stroke-width="3"/>

  <rect x="652" y="118" width="164" height="78" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="674" cy="140" r="12" fill="#6d28d9"/>
  <text x="674" y="145" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="694" y="145" font-size="15" font-weight="bold" fill="#6d28d9">모달</text>
  <rect x="704" y="168" width="60" height="14" rx="3" fill="#6d28d9"/>
  <line x1="822" y1="157" x2="848" y2="157" stroke="#6d28d9" stroke-width="2" marker-end="url(#ar-purple)"/>

  <rect x="652" y="214" width="164" height="78" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="674" cy="236" r="12" fill="#1d4ed8"/>
  <text x="674" y="241" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="694" y="241" font-size="15" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;video&gt;</text>
  <polygon points="726,256 726,280 746,268" fill="#1d4ed8"/>

  <line x1="636" y1="312" x2="836" y2="312" stroke="#d1d5db" stroke-width="3"/>
  <line x1="636" y1="328" x2="780" y2="328" stroke="#d1d5db" stroke-width="3"/>

  <!-- 요점 -->
  <rect x="24" y="368" width="832" height="56" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="440" y="402" font-size="16" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#6d28d9">레이어 3을 옮긴다</tspan> = 레이어 1, 2는 그대로 두고 레이어 3의 위치만 바꿔 다시 겹친다</text>
  </g>
</svg>
