<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">합성 레이어의 z축 분리와 합성 결과</title>
  <desc id="d">DevTools 스타일로 모달, 비디오, 본문 레이어가 z축으로 분리된 구조와 오른쪽에 최종 합성된 화면을 보여주며, 레이어 3의 위치 변경 시 레이어 1과 2의 비트맵이 재사용됨을 나타내는 다이어그램</desc>
  <rect width="880" height="480" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 제목 영역 -->
  <text x="40" y="44" font-size="17" font-weight="600" fill="#1f2933">합성 레이어의 z축 분리와 합성 결과</text>
  <text x="40" y="66" font-size="11.5" font-weight="400" fill="#52606d">독립된 레이어 분리로 다른 레이어의 재그리기 없이 합성 가능</text>

  <!-- 구역 1: z축 분리 레이어들 (DevTools Layers 스타일) -->
  <rect x="30" y="80" width="460" height="340" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="50" y="108" font-size="14" font-weight="600" fill="#1f2933">z축 레이어 분리 (DevTools Layers)</text>

  <!-- z축 화살표 -->
  <path d="M70,390 L160,330" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-ink)"/>
  <text x="110" y="380" font-size="11" font-weight="400" fill="#52606d">z축 겹침 순서</text>

  <!-- 레이어 1: 나머지 문서 전체 -->
  <g transform="translate(60, 240)">
    <polygon points="0,110 200,110 250,0 50,0" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <polygon points="10,100 190,100 235,10 55,10" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <!-- 문서 내부 스켈레톤 라인 -->
    <line x1="70" y1="25" x2="210" y2="25" stroke="#cbd2d9" stroke-width="3"/>
    <line x1="65" y1="45" x2="195" y2="45" stroke="#cbd2d9" stroke-width="2"/>
    <line x1="60" y1="65" x2="180" y2="65" stroke="#cbd2d9" stroke-width="2"/>
    <line x1="55" y1="85" x2="165" y2="85" stroke="#cbd2d9" stroke-width="2"/>
    <!-- 라벨 꼬리표 -->
    <rect x="-10" y="50" width="130" height="24" rx="4" fill="#1f2933"/>
    <text x="55" y="66" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">레이어 1: 문서 전체</text>
  </g>

  <!-- 레이어 2: <video> -->
  <g transform="translate(100, 190)">
    <polygon points="0,90 160,90 200,0 40,0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="10,80 150,80 185,10 45,10" fill="#ffffff" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- 비디오 플레이 아이콘 표식 -->
    <polygon points="100,35 100,55 115,45" fill="#2563eb"/>
    <!-- 라벨 꼬리표 -->
    <rect x="-10" y="33" width="105" height="24" rx="4" fill="#2563eb"/>
    <text x="42" y="49" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">레이어 2: &lt;video&gt;</text>
  </g>

  <!-- 레이어 3: 애니메이션 중인 모달 -->
  <g transform="translate(150, 130)">
    <polygon points="0,80 140,80 175,0 35,0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <polygon points="10,70 130,70 160,10 40,10" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <!-- 모달 내 콘텐츠 표현 -->
    <rect x="55" y="20" width="80" height="12" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="95" y="29" font-size="11" font-weight="500" fill="#7c3aed" text-anchor="middle">MODAL</text>
    <!-- 위치 변경 이동 화살표 (이동 애니메이션 표현) -->
    <path d="M120,40 L150,20" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a-ink)" stroke-dasharray="4 3"/>
    <!-- 라벨 꼬리표 -->
    <rect x="-15" y="28" width="115" height="24" rx="4" fill="#7c3aed"/>
    <text x="42" y="44" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">레이어 3: 모달</text>
  </g>

  <!-- 합성 프로세스 연결 화살표들 -->
  <path d="M 380 200 Q 450 170 510 180" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
  <rect x="410" y="165" width="80" height="18" rx="3" fill="#ffffff"/>
  <text x="450" y="178" font-size="11" fill="#7c3aed" text-anchor="middle">위치만 변경</text>

  <path d="M 330 260 Q 420 260 510 260" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="400" y="251" width="90" height="18" rx="3" fill="#ffffff"/>
  <text x="445" y="264" font-size="11" fill="#2563eb" text-anchor="middle">비트맵 재사용</text>

  <path d="M 310 320 Q 410 330 510 310" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="395" y="321" width="90" height="18" rx="3" fill="#ffffff"/>
  <text x="440" y="334" font-size="11" fill="#1f2933" text-anchor="middle">비트맵 재사용</text>

  <!-- 구역 2: 화면 (합성 결과) -->
  <rect x="520" y="80" width="330" height="340" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <!-- 브라우저 타이틀바 모식도 -->
  <path d="M 520 86 Q 520 80 526 80 L 844 80 Q 850 80 850 86 L 850 110 L 520 110 Z" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <circle cx="540" cy="95" r="4" fill="#dc2626"/>
  <circle cx="552" cy="95" r="4" fill="#d97706"/>
  <circle cx="564" cy="95" r="4" fill="#059669"/>
  <text x="685" y="100" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">화면 (합성 결과)</text>

  <!-- 합성 결과 내부 요소 레이아웃 -->
  <g transform="translate(540, 125)">
    <!-- 레이어 1 결과 영역 (바탕 전체) -->
    <rect x="0" y="0" width="290" height="280" fill="#ecfdf5" stroke="#059669" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="15" y="25" font-size="11.5" font-weight="500" fill="#059669">레이어 1: 나머지 문서 전체</text>
    <line x1="15" y1="40" x2="275" y2="40" stroke="#cbd2d9" stroke-width="2"/>
    <line x1="15" y1="55" x2="250" y2="55" stroke="#cbd2d9" stroke-width="2"/>

    <!-- 레이어 2 결과 영역 (<video>) -->
    <rect x="25" y="75" width="240" height="90" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="35" y="95" font-size="11.5" font-weight="500" fill="#2563eb">레이어 2: &lt;video&gt;</text>
    <polygon points="140,110 140,135 160,122.5" fill="#2563eb"/>

    <!-- 본문 텍스트 연장 -->
    <line x1="15" y1="180" x2="275" y2="180" stroke="#cbd2d9" stroke-width="2"/>
    <line x1="15" y1="195" x2="220" y2="195" stroke="#cbd2d9" stroke-width="2"/>

    <!-- 레이어 3 결과 영역 (애니메이션 중인 모달) -->
    <rect x="50" y="130" width="190" height="130" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="60" y="140" width="170" height="25" rx="3" fill="#7c3aed"/>
    <text x="145" y="157" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">레이어 3: 모달</text>
    <text x="145" y="190" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">애니메이션 진행 중</text>
    <rect x="105" y="215" width="80" height="26" rx="4" fill="#7c3aed"/>
    <text x="145" y="232" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">확인</text>
  </g>

  <!-- 하단 요약 캡션 -->
  <text x="440" y="455" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">레이어 3의 위치만 변경 시, 레이어 1과 2를 다시 그리지 않고 독립된 비트맵을 합성하여 빠르게 처리합니다.</text>
</svg>