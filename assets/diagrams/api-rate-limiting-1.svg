<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fixed Window 카운터 동작</title>
  <desc id="d">한도가 분당 5개일 때 12:00 창에서 요청 5개는 카운터 1~5로 전부 허용되고 12:00:55의 6번째 요청은 거절된다. 12:01:00에 새 창이 시작되며 카운터가 0으로 리셋되고, 12:01:01 요청은 카운터 1로 다시 허용된다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 한도 배지 -->
  <rect x="32" y="22" width="152" height="36" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="108" y="46" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">한도: 분당 5개</text>

  <!-- 표 머리행 -->
  <rect x="32" y="76" width="816" height="40" fill="#f3f4f6"/>
  <text x="82" y="102" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">창</text>
  <text x="236" y="102" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">시각</text>
  <text x="414" y="102" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">이벤트</text>
  <text x="596" y="102" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">카운터</text>
  <text x="776" y="102" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">결과</text>

  <!-- 창 열 -->
  <rect x="32" y="116" width="100" height="128" fill="#eff6ff"/>
  <rect x="32" y="244" width="100" height="128" fill="#eff6ff"/>
  <text x="82" y="186" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">12:00 창</text>
  <text x="82" y="314" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">12:01 창</text>

  <!-- 격자 -->
  <line x1="32" y1="116" x2="848" y2="116" stroke="#9ca3af" stroke-width="1"/>
  <line x1="132" y1="180" x2="848" y2="180" stroke="#d1d5db" stroke-width="1"/>
  <line x1="132" y1="308" x2="848" y2="308" stroke="#d1d5db" stroke-width="1"/>
  <line x1="132" y1="76" x2="132" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <line x1="340" y1="76" x2="340" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <line x1="488" y1="76" x2="488" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <line x1="704" y1="76" x2="704" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <rect x="32" y="76" width="816" height="296" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <!-- 창 경계 -->
  <line x1="32" y1="244" x2="848" y2="244" stroke="#6d28d9" stroke-width="3"/>

  <!-- 1행: 12:00:10 ~ 12:00:50 -->
  <text x="236" y="154" font-size="16" fill="#111827" text-anchor="middle">12:00:10 ~ 12:00:50</text>
  <text x="414" y="154" font-size="16" fill="#111827" text-anchor="middle">요청 5개</text>
  <rect x="505" y="135" width="26" height="26" rx="4" fill="#047857"/>
  <rect x="536" y="135" width="26" height="26" rx="4" fill="#047857"/>
  <rect x="567" y="135" width="26" height="26" rx="4" fill="#047857"/>
  <rect x="598" y="135" width="26" height="26" rx="4" fill="#047857"/>
  <rect x="629" y="135" width="26" height="26" rx="4" fill="#047857"/>
  <text x="518" y="153.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="549" y="153.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="580" y="153.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="611" y="153.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="642" y="153.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="720" y="132" width="112" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="776" y="153.5" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">전부 허용</text>

  <!-- 2행: 12:00:55 -->
  <text x="236" y="218" font-size="16" fill="#111827" text-anchor="middle">12:00:55</text>
  <text x="414" y="218" font-size="16" fill="#111827" text-anchor="middle">요청 1개</text>
  <rect x="505" y="199" width="26" height="26" rx="4" fill="#f3f4f6"/>
  <rect x="536" y="199" width="26" height="26" rx="4" fill="#f3f4f6"/>
  <rect x="567" y="199" width="26" height="26" rx="4" fill="#f3f4f6"/>
  <rect x="598" y="199" width="26" height="26" rx="4" fill="#f3f4f6"/>
  <rect x="629" y="199" width="26" height="26" rx="4" fill="#f3f4f6"/>
  <text x="518" y="217.5" font-size="15" fill="#4b5563" text-anchor="middle">1</text>
  <text x="549" y="217.5" font-size="15" fill="#4b5563" text-anchor="middle">2</text>
  <text x="580" y="217.5" font-size="15" fill="#4b5563" text-anchor="middle">3</text>
  <text x="611" y="217.5" font-size="15" fill="#4b5563" text-anchor="middle">4</text>
  <text x="642" y="217.5" font-size="15" fill="#4b5563" text-anchor="middle">5</text>
  <rect x="660" y="199" width="26" height="26" rx="4" fill="#b91c1c"/>
  <text x="673" y="217.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="720" y="196" width="112" height="32" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="776" y="217.5" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">거절</text>

  <!-- 3행: 12:01:00 -->
  <text x="236" y="282" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">12:01:00</text>
  <text x="414" y="282" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">새 창 시작</text>
  <rect x="505" y="263" width="26" height="26" rx="4" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="518" y="281.5" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">0</text>
  <text x="537" y="282" font-size="16" font-weight="bold" fill="#6d28d9">으로 리셋</text>
  <text x="776" y="282" font-size="16" fill="#4b5563" text-anchor="middle">–</text>

  <!-- 4행: 12:01:01 -->
  <text x="236" y="346" font-size="16" fill="#111827" text-anchor="middle">12:01:01</text>
  <text x="414" y="346" font-size="16" fill="#111827" text-anchor="middle">요청 1개</text>
  <rect x="505" y="327" width="26" height="26" rx="4" fill="#047857"/>
  <text x="518" y="345.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="720" y="324" width="112" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="776" y="345.5" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">다시 허용</text>

  <!-- 범례 -->
  <line x1="32" y1="402" x2="72" y2="402" stroke="#6d28d9" stroke-width="3"/>
  <text x="82" y="407" font-size="15" fill="#374151">창 경계(12:01:00) — 창이 바뀌면 카운터를 0으로 리셋</text>
  <rect x="520" y="393" width="18" height="18" rx="3" fill="#047857"/>
  <text x="546" y="407" font-size="15" fill="#374151">허용</text>
  <rect x="600" y="393" width="18" height="18" rx="3" fill="#b91c1c"/>
  <text x="626" y="407" font-size="15" fill="#374151">한도 초과</text>
</svg>
