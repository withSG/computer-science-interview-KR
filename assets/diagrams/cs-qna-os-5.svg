<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IPC 선택 기준</title>
  <desc id="d">요구사항에 따른 프로세스 간 통신(IPC) 기법 선택 기준 다이어그램</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Row 1: Shared Memory -->
  <rect x="40" y="40" width="280" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="69" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">대용량 + 고속</text>

  <path d="M320,64 L500,64" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="500" y="40" width="340" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="670" y="69" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Shared Memory (+ 세마포어)</text>

  <!-- Row 2: Message Queue -->
  <rect x="40" y="104" width="280" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="133" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">비동기 메시징</text>

  <path d="M320,128 L500,128" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="500" y="104" width="340" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="133" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Message Queue</text>

  <!-- Row 3: Socket -->
  <rect x="40" y="168" width="280" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="197" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">네트워크 통신</text>

  <path d="M320,192 L500,192" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="500" y="168" width="340" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="197" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Socket</text>

  <!-- Row 4: Pipe -->
  <rect x="40" y="232" width="280" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="261" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">단순 부모-자식</text>

  <path d="M320,256 L500,256" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <rect x="500" y="232" width="340" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="670" y="261" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Pipe</text>

  <!-- Row 5: Signal -->
  <rect x="40" y="296" width="280" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="180" y="325" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">이벤트 알림</text>

  <path d="M320,320 L500,320" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="500" y="296" width="340" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="670" y="325" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Signal</text>
</svg>