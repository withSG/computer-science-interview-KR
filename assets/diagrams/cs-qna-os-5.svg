<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IPC 선택 기준</title>
  <desc id="d">요구 사항별로 고를 IPC 방식: 대용량과 고속이면 Shared Memory(세마포어와 함께), 비동기 메시징이면 Message Queue, 네트워크 통신이면 Socket, 단순 부모-자식이면 Pipe, 이벤트 알림이면 Signal.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="to" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="40" y="46" font-size="15" font-weight="bold" fill="#4b5563">요구 사항</text>
  <text x="466" y="46" font-size="15" font-weight="bold" fill="#4b5563">IPC 방식</text>

  <!-- 1 -->
  <rect x="40" y="62" width="290" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="94" font-size="17" font-weight="bold" fill="#111827">대용량 + 고속</text>
  <line x1="344" y1="88" x2="452" y2="88" stroke="#4b5563" stroke-width="2" marker-end="url(#to)"/>
  <rect x="466" y="62" width="374" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="486" y="95" font-size="18" font-weight="bold" fill="#1e3a8a">Shared Memory <tspan font-size="16" font-weight="normal" fill="#374151">(+ 세마포어)</tspan></text>

  <!-- 2 -->
  <rect x="40" y="126" width="290" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="158" font-size="17" font-weight="bold" fill="#111827">비동기 메시징</text>
  <line x1="344" y1="152" x2="452" y2="152" stroke="#4b5563" stroke-width="2" marker-end="url(#to)"/>
  <rect x="466" y="126" width="374" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="486" y="159" font-size="18" font-weight="bold" fill="#1e3a8a">Message Queue</text>

  <!-- 3 -->
  <rect x="40" y="190" width="290" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="222" font-size="17" font-weight="bold" fill="#111827">네트워크 통신</text>
  <line x1="344" y1="216" x2="452" y2="216" stroke="#4b5563" stroke-width="2" marker-end="url(#to)"/>
  <rect x="466" y="190" width="374" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="486" y="223" font-size="18" font-weight="bold" fill="#1e3a8a">Socket</text>

  <!-- 4 -->
  <rect x="40" y="254" width="290" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="286" font-size="17" font-weight="bold" fill="#111827">단순 부모-자식</text>
  <line x1="344" y1="280" x2="452" y2="280" stroke="#4b5563" stroke-width="2" marker-end="url(#to)"/>
  <rect x="466" y="254" width="374" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="486" y="287" font-size="18" font-weight="bold" fill="#1e3a8a">Pipe</text>

  <!-- 5 -->
  <rect x="40" y="318" width="290" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="350" font-size="17" font-weight="bold" fill="#111827">이벤트 알림</text>
  <line x1="344" y1="344" x2="452" y2="344" stroke="#4b5563" stroke-width="2" marker-end="url(#to)"/>
  <rect x="466" y="318" width="374" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="486" y="351" font-size="18" font-weight="bold" fill="#1e3a8a">Signal</text>
</svg>
