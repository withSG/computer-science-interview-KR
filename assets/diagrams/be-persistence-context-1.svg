<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">영속성 컨텍스트 구조</title>
  <desc id="d">애플리케이션 코드와 DB 사이에 영속성 컨텍스트(JVM Heap)가 있고, 그 안에 1차 캐시, 쓰기 지연 저장소, 스냅샷이 들어 있다. 애플리케이션은 em.find(), em.persist(), setter로 영속성 컨텍스트를 다루고, SQL은 flush 때 DB로 전송된다.</desc>
  <rect width="880" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 애플리케이션 코드 -->
  <rect x="320" y="24" width="240" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">애플리케이션 코드</text>

  <line x1="440" y1="76" x2="440" y2="130" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="458" y="109" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.find(), em.persist(), setter</text>

  <!-- 영속성 컨텍스트 -->
  <rect x="48" y="134" width="784" height="354" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <text x="72" y="174" font-size="20" font-weight="700" fill="#111827">영속성 컨텍스트<tspan font-size="16" font-weight="400" fill="#4b5563"> (JVM Heap)</tspan></text>
  <text x="808" y="174" text-anchor="end" font-size="15" fill="#4b5563">애플리케이션과 DB 사이의 작업 공간</text>

  <!-- 1차 캐시 -->
  <rect x="72" y="196" width="356" height="168" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="92" y="226" font-size="18" font-weight="700" fill="#1d4ed8">1차 캐시</text>
  <text x="92" y="250" font-size="15" fill="#4b5563">재조회 시 SELECT 없이 반환</text>
  <rect x="92" y="266" width="316" height="36" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="108" y="290" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">1L → Member@a</text>
  <rect x="92" y="310" width="316" height="36" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="108" y="334" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">2L → Member@b</text>

  <!-- 쓰기 지연 저장소 -->
  <rect x="452" y="196" width="356" height="168" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="472" y="226" font-size="18" font-weight="700" fill="#b45309">쓰기 지연 저장소</text>
  <text x="472" y="250" font-size="15" fill="#4b5563">SQL을 모아 두었다가 flush 때 전송</text>
  <rect x="472" y="266" width="316" height="36" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="488" y="290" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">INSERT ...</text>
  <rect x="472" y="310" width="316" height="36" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="488" y="334" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UPDATE ...</text>

  <!-- 스냅샷 -->
  <rect x="72" y="380" width="736" height="88" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="92" y="412" font-size="18" font-weight="700" fill="#047857">스냅샷</text>
  <text x="92" y="440" font-size="15" fill="#4b5563">변경 감지 때 비교 기준</text>
  <rect x="316" y="406" width="472" height="36" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="332" y="430" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">1L →</tspan> 조회 시점 필드 값 복사본</text>

  <!-- flush -->
  <line x1="440" y1="488" x2="440" y2="546" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="458" y="523" font-size="16" fill="#111827"><tspan font-weight="700" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">flush</tspan> (SQL 전송)</text>

  <!-- DB -->
  <path d="M370,562 L370,604 A70,12 0 0 0 510,604 L510,562" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <ellipse cx="440" cy="562" rx="70" ry="12" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="598" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">DB</text>
</svg>
