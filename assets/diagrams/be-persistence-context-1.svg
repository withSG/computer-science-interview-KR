<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">영속성 컨텍스트 동작 구조</title>
  <desc id="d">애플리케이션 코드, 영속성 컨텍스트(1차 캐시, 쓰기 지연 저장소, 스냅샷), DB 간의 상호작용과 데이터 흐름을 나타낸 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Top: Application Code -->
  <rect x="290" y="30" width="300" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="56.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">애플리케이션 코드</text>

  <!-- Arrow Top to Context -->
  <path d="M440,74 L440,132" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Arrow Label Top -->
  <rect x="330" y="93" width="220" height="20" fill="#ffffff"/>
  <text x="440" y="107.025" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2563eb">em.find(), em.persist(), setter</text>

  <!-- Main Container: Persistence Context -->
  <rect x="180" y="134" width="520" height="286" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="163.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">영속성 컨텍스트 (JVM Heap)</text>

  <!-- Inner Box 1: First Level Cache -->
  <rect x="204" y="184" width="228" height="110" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="208.9" text-anchor="start" font-size="13" font-weight="bold" fill="#2563eb">1차 캐시</text>
  <rect x="220" y="220" width="196" height="60" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="232" y="243.025" font-size="11.5" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">1L → Member@a</text>
  <text x="232" y="265.025" font-size="11.5" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">2L → Member@b</text>

  <!-- Inner Box 2: Write-Behind Store -->
  <rect x="448" y="184" width="228" height="110" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="464" y="208.9" text-anchor="start" font-size="13" font-weight="bold" fill="#d97706">쓰기 지연 저장소</text>
  <rect x="464" y="220" width="196" height="60" fill="#fffbeb" stroke="#cbd2d9" stroke-width="1"/>
  <text x="476" y="243.025" font-size="11.5" font-family="'Consolas', 'Courier New', monospace" fill="#d97706">INSERT ...</text>
  <text x="476" y="265.025" font-size="11.5" font-family="'Consolas', 'Courier New', monospace" fill="#d97706">UPDATE ...</text>

  <!-- Inner Box 3: Snapshot -->
  <rect x="204" y="308" width="472" height="92" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="332.9" text-anchor="start" font-size="13" font-weight="bold" fill="#059669">스냅샷</text>
  <rect x="220" y="344" width="440" height="42" fill="#ecfdf5" stroke="#cbd2d9" stroke-width="1"/>
  <text x="232" y="369.025" font-size="11.5" fill="#059669">1L → 조회 시점 필드 값 복사본</text>

  <!-- Arrow Context to DB -->
  <path d="M440,420 L440,468" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Arrow Label Bottom -->
  <rect x="370" y="434" width="140" height="20" fill="#ffffff"/>
  <text x="440" y="448.025" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">flush (SQL 전송)</text>

  <!-- Bottom: DB -->
  <rect x="360" y="470" width="160" height="40" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.5"/>
  <text x="440" y="494.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">[ DB ]</text>
</svg>