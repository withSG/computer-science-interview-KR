<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DNS 도메인 계층 구조</title>
  <desc id="d">루트 아래 TLD(com, org, kr), com 아래 2단계 도메인(example, google), example 아래 서브도메인(www, api, blog)이 있는 트리. 루트는 com을 아는 서버를, com은 example.com을 아는 ns1.example.com을 알려 주며, 도메인 www.example.com.은 오른쪽부터 루트, TLD, 등록한 도메인, 호스트 순으로 읽는다.</desc>
  <rect width="880" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 층 띠 -->
  <rect x="24" y="28" width="832" height="60" rx="8" fill="#f5f6f8"/>
  <rect x="24" y="160" width="832" height="60" rx="8" fill="#f5f6f8"/>
  <rect x="24" y="292" width="832" height="60" rx="8" fill="#f5f6f8"/>
  <rect x="24" y="400" width="832" height="60" rx="8" fill="#f5f6f8"/>
  <text x="44" y="64" font-size="16" font-weight="bold" fill="#5b21b6">루트</text>
  <text x="44" y="196" font-size="16" font-weight="bold" fill="#1e40af">TLD</text>
  <text x="44" y="328" font-size="16" font-weight="bold" fill="#065f46">2단계 도메인</text>
  <text x="44" y="436" font-size="16" font-weight="bold" fill="#92400e">서브도메인</text>

  <!-- 연결선 (회색: 나머지 가지) -->
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M410,144 L710,144"/>
    <path d="M560,144 L560,170"/>
    <path d="M710,144 L710,170"/>
    <path d="M340,276 L480,276 L480,302"/>
    <path d="M250,380 L430,380"/>
    <path d="M340,380 L340,410"/>
    <path d="M430,380 L430,410"/>
  </g>
  <!-- 연결선 (진한 선: www.example.com. 의 경로) -->
  <g stroke="#1f2937" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <path d="M560,78 L560,144 L410,144 L410,170"/>
    <path d="M410,210 L410,276 L340,276 L340,302"/>
    <path d="M340,342 L340,380 L250,380 L250,410"/>
  </g>

  <!-- 루트 -->
  <rect x="500" y="38" width="120" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="560" y="64" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle">. (루트)</text>

  <!-- 루트가 알려 주는 것 -->
  <rect x="586" y="98" width="228" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <path d="M587,108 L570,114 L587,120" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="700" y="119" font-size="15" fill="#1f2937" text-anchor="middle">“com은 저쪽 서버들이 안다”</text>

  <!-- TLD -->
  <rect x="370" y="170" width="80" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="410" y="196" font-size="17" font-weight="bold" fill="#1e40af" text-anchor="middle">com</text>
  <rect x="520" y="170" width="80" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="560" y="196" font-size="17" font-weight="bold" fill="#1e40af" text-anchor="middle">org</text>
  <rect x="670" y="170" width="80" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="710" y="196" font-size="17" font-weight="bold" fill="#1e40af" text-anchor="middle">kr</text>

  <!-- com이 알려 주는 것 -->
  <rect x="438" y="230" width="330" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <path d="M439,240 L420,246 L439,252" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
  <text x="603" y="251" font-size="15" fill="#1f2937" text-anchor="middle">“example.com은 ns1.example.com이 안다”</text>

  <!-- 2단계 도메인 -->
  <rect x="285" y="302" width="110" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="340" y="328" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">example</text>
  <rect x="430" y="302" width="100" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="480" y="328" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">google</text>

  <!-- 서브도메인 -->
  <rect x="214" y="410" width="72" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="250" y="436" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">www</text>
  <rect x="304" y="410" width="72" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="340" y="436" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">api</text>
  <rect x="394" y="410" width="72" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="430" y="436" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">blog</text>

  <!-- 이름 읽는 법 -->
  <rect x="24" y="488" width="832" height="140" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="518" font-size="16" font-weight="bold" fill="#111827">도메인은 오른쪽부터 읽는다</text>
  <path d="M600,512 L636,512" stroke="#1f2937" stroke-width="3.5"/>
  <text x="646" y="518" font-size="15" fill="#374151">진한 선 = 이 이름의 경로</text>

  <rect x="243" y="532" width="80" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="283" y="559" font-size="21" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">www</text>
  <text x="335" y="561" font-size="24" font-weight="bold" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.</text>
  <rect x="347" y="532" width="120" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="407" y="559" font-size="21" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">example</text>
  <text x="479" y="561" font-size="24" font-weight="bold" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.</text>
  <rect x="491" y="532" width="80" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="531" y="559" font-size="21" font-weight="bold" fill="#1e40af" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">com</text>
  <rect x="583" y="532" width="56" height="40" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="611" y="561" font-size="24" font-weight="bold" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.</text>

  <text x="283" y="594" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">호스트</text>
  <text x="407" y="594" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">등록한 도메인</text>
  <text x="531" y="594" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">TLD</text>
  <text x="611" y="594" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">루트</text>

  <path d="M639,612 L249,612" stroke="#374151" stroke-width="1.75" fill="none" marker-end="url(#arr)"/>
</svg>
