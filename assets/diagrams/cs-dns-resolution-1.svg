<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">DNS 계층 구조와 등장인물</title>
  <desc id="d">루트 서버부터 TLD, 2단계 도메인, 서브도메인으로 이어지는 DNS 계층 구조 다이어그램</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- Markers -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Level 1: Root . (루트) -->
  <rect x="340" y="30" width="120" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="55" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">. (루트)</text>

  <!-- Speech Callout 1: "com은 저쪽 서버들이 안다" -->
  <rect x="475" y="37" width="205" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="577.5" y="54" font-size="12" fill="#d97706" text-anchor="middle">"com은 저쪽 서버들이 안다"</text>

  <!-- Connector from Root down -->
  <path d="M400,70 L400,120" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- Branching line for TLD level: com(200), org(400), kr(600) -->
  <path d="M200,120 L600,120" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M200,120 L200,140" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M400,120 L400,140" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M600,120 L600,140" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Level 2: TLD (com, org, kr) -->
  <rect x="160" y="140" width="80" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="163" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">com</text>

  <rect x="360" y="140" width="80" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="400" y="163" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">org</text>

  <rect x="560" y="140" width="80" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="163" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">kr</text>

  <!-- Level annotation: ← TLD -->
  <text x="680" y="163" font-size="13" font-weight="bold" fill="#52606d">← TLD</text>

  <!-- Speech Callout 2: "example.com은 ns1.example.com이 안다" -->
  <rect x="255" y="187" width="290" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="400" y="204" font-size="12" fill="#d97706" text-anchor="middle">"example.com은 ns1.example.com이 안다"</text>

  <!-- Connector from com down to 2nd level -->
  <path d="M200,176 L200,230" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- Branching line for 2nd level: example(140), google(260) -->
  <path d="M140,230 L260,230" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M140,230 L140,250" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M260,230 L260,250" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Level 3: 2단계 도메인 (example, google) -->
  <rect x="95" y="250" width="90" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="140" y="273" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">example</text>

  <rect x="215" y="250" width="90" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="260" y="273" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">google</text>

  <!-- Level annotation: ← 2단계 도메인 -->
  <text x="680" y="273" font-size="13" font-weight="bold" fill="#52606d">← 2단계 도메인</text>

  <!-- Connector from example down to subdomain level -->
  <path d="M140,286 L140,340" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- Branching line for subdomains: www(70), api(140), blog(210) -->
  <path d="M70,340 L210,340" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M70,340 L70,360" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M140,340 L140,360" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M210,340 L210,360" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Level 4: 서브도메인 (www, api, blog) -->
  <rect x="40" y="360" width="60" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="70" y="383" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">www</text>

  <rect x="110" y="360" width="60" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="140" y="383" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">api</text>

  <rect x="180" y="360" width="60" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="210" y="383" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">blog</text>

  <!-- Level annotation: ← 서브도메인 -->
  <text x="680" y="383" font-size="13" font-weight="bold" fill="#52606d">← 서브도메인</text>

</svg>