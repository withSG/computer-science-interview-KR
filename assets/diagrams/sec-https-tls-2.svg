<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">인증서 체인과 CA 신뢰 모델</title>
  <desc id="d">신뢰 저장소에 내장된 루트 CA 인증서가 중간 CA 인증서에 서명하고, 중간 CA가 서버 인증서(leaf)에 서명합니다. 검증은 서버 인증서에서 위로 올라가 신뢰 저장소의 루트에 닿으면 통과합니다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>
  <defs>
    <marker id="tls2-sign" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="tls2-verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="tls2-note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 신뢰 저장소 -->
  <rect x="108" y="24" width="748" height="168" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="124" y="50" font-size="15" font-weight="bold" fill="#6d28d9">신뢰 저장소 (OS/브라우저에 미리 내장)</text>

  <!-- 루트 CA -->
  <rect x="124" y="64" width="372" height="112" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="142" y="94" font-size="17" font-weight="bold" fill="#5b21b6">루트 CA 인증서 (self-signed)</text>
  <text x="142" y="124" font-size="16" fill="#111827">주체: Example Root CA</text>
  <text x="142" y="152" font-size="16" fill="#111827">서명: 자기 자신</text>
  <line x1="552" y1="120" x2="502" y2="120" stroke="#6b7280" stroke-width="1.5" marker-end="url(#tls2-note)"/>
  <text x="564" y="126" font-size="16" font-weight="bold" fill="#5b21b6">여기가 신뢰의 출발점이다</text>

  <!-- 루트 → 중간 서명 -->
  <line x1="310" y1="178" x2="310" y2="232" stroke="#374151" stroke-width="2" marker-end="url(#tls2-sign)"/>
  <text x="322" y="218" font-size="15" fill="#374151">서명</text>

  <!-- 중간 CA -->
  <rect x="124" y="236" width="372" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="142" y="266" font-size="17" font-weight="bold" fill="#1e40af">중간 CA 인증서</text>
  <text x="142" y="296" font-size="16" fill="#111827">서명: 루트 CA의 개인키</text>
  <line x1="552" y1="278" x2="502" y2="278" stroke="#6b7280" stroke-width="1.5" marker-end="url(#tls2-note)"/>
  <text x="564" y="284" font-size="16" fill="#111827">서버가 함께 보내줘야 한다</text>

  <!-- 중간 → 서버 서명 -->
  <line x1="310" y1="322" x2="310" y2="376" stroke="#374151" stroke-width="2" marker-end="url(#tls2-sign)"/>
  <text x="322" y="362" font-size="15" fill="#374151">서명</text>

  <!-- 서버 인증서 -->
  <rect x="124" y="380" width="372" height="136" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="142" y="410" font-size="17" font-weight="bold" fill="#065f46">서버 인증서 (leaf)</text>
  <text x="142" y="440" font-size="16" fill="#111827">SAN: www.example.com</text>
  <text x="142" y="468" font-size="16" fill="#111827">공개키: (서버의 공개키)</text>
  <text x="142" y="496" font-size="16" fill="#111827">서명: 중간 CA의 개인키</text>
  <line x1="552" y1="448" x2="502" y2="448" stroke="#6b7280" stroke-width="1.5" marker-end="url(#tls2-note)"/>
  <text x="564" y="454" font-size="16" fill="#111827">서버가 보낸다</text>

  <!-- 검증 방향: 아래 → 위 -->
  <path d="M120,448 H60 V120 H118" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tls2-verify)"/>
  <rect x="34" y="262" width="52" height="32" fill="#ffffff"/>
  <text x="60" y="284" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">검증</text>

  <!-- 캡션 -->
  <text x="24" y="552" font-size="16" font-weight="bold" fill="#111827">검증은 아래에서 위로. 신뢰 저장소에 있는 루트에 닿으면 통과.</text>
</svg>
