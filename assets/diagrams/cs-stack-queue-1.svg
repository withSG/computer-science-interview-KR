<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스택의 push와 pop</title>
  <desc id="d">빈 스택에 push(10), push(20), push(30)을 차례로 하고 pop()을 한 번 하는 네 단계. 넣고 빼는 일이 모두 맨 위(top) 한 곳에서 일어나므로 마지막에 넣은 30이 가장 먼저 나온다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <pattern id="floor" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9ca3af" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- ① push(10) : 패널 x=24, 중심 94 -->
  <circle cx="50.5" cy="42" r="12" fill="#1f2937"/>
  <text x="50.5" y="47.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="70.5" y="48" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">push(10)</text>
  <line x1="94" y1="62" x2="94" y2="126" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <rect x="30" y="306" width="128" height="12" fill="url(#floor)"/>
  <path d="M40,132 V306 H148 V132" fill="none" stroke="#4b5563" stroke-width="2.5"/>
  <rect x="46" y="252" width="96" height="48" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="94" y="283" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">10</text>
  <line x1="190" y1="276" x2="154" y2="276" stroke="#111827" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="194" y="281.5" font-size="16" font-weight="bold" fill="#111827">top</text>

  <!-- ② push(20) : 패널 x=232, 중심 302 -->
  <circle cx="258.5" cy="42" r="12" fill="#1f2937"/>
  <text x="258.5" y="47.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="278.5" y="48" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">push(20)</text>
  <line x1="302" y1="62" x2="302" y2="126" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <rect x="238" y="306" width="128" height="12" fill="url(#floor)"/>
  <path d="M248,132 V306 H356 V132" fill="none" stroke="#4b5563" stroke-width="2.5"/>
  <rect x="254" y="252" width="96" height="48" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="302" y="283" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">10</text>
  <rect x="254" y="198" width="96" height="48" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="302" y="229" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">20</text>
  <line x1="398" y1="222" x2="362" y2="222" stroke="#111827" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="402" y="227.5" font-size="16" font-weight="bold" fill="#111827">top</text>

  <!-- ③ push(30) : 패널 x=440, 중심 510 -->
  <circle cx="466.5" cy="42" r="12" fill="#1f2937"/>
  <text x="466.5" y="47.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="486.5" y="48" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">push(30)</text>
  <line x1="510" y1="62" x2="510" y2="126" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <rect x="446" y="306" width="128" height="12" fill="url(#floor)"/>
  <path d="M456,132 V306 H564 V132" fill="none" stroke="#4b5563" stroke-width="2.5"/>
  <rect x="462" y="252" width="96" height="48" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="510" y="283" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">10</text>
  <rect x="462" y="198" width="96" height="48" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="510" y="229" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">20</text>
  <rect x="462" y="144" width="96" height="48" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="510" y="175" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">30</text>
  <line x1="606" y1="168" x2="570" y2="168" stroke="#111827" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="610" y="173.5" font-size="16" font-weight="bold" fill="#111827">top</text>

  <!-- ④ pop() → 30 : 패널 x=648, 중심 718 -->
  <circle cx="664.5" cy="42" r="12" fill="#1f2937"/>
  <text x="664.5" y="47.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="684.5" y="48" font-size="18" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">pop() <tspan font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">→</tspan> 30</text>
  <rect x="654" y="306" width="128" height="12" fill="url(#floor)"/>
  <path d="M664,132 V306 H772 V132" fill="none" stroke="#4b5563" stroke-width="2.5"/>
  <rect x="670" y="252" width="96" height="48" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="718" y="283" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">10</text>
  <rect x="670" y="198" width="96" height="48" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="718" y="229" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">20</text>
  <rect x="670" y="144" width="96" height="48" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="718" y1="170" x2="718" y2="64" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <line x1="814" y1="222" x2="778" y2="222" stroke="#111827" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="818" y="227.5" font-size="16" font-weight="bold" fill="#111827">top</text>

  <!-- 범례 -->
  <rect x="282" y="337" width="30" height="20" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="352.5" font-size="15" fill="#374151">방금 넣은 원소</text>
  <rect x="470" y="337" width="30" height="20" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="508" y="352.5" font-size="15" fill="#374151">방금 빠진 자리</text>

  <!-- 요점 -->
  <rect x="24" y="376" width="832" height="42" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="440" y="402.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">push와 pop 모두 top 한 곳에서만 일어난다 → 마지막에 넣은 30이 가장 먼저 나온다 (LIFO)</text>
</svg>
