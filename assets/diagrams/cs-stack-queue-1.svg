<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동작</title>
  <desc id="d">스택의 push(10), push(20), push(30), pop() 연산 과정과 top의 변화를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd2d9" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- Step 1: push(10) -->
  <g id="step1">
    <text x="110" y="54" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">push(10)</text>
    
    <!-- Stack frame for Step 1 -->
    <rect x="70" y="80" width="80" height="180" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    
    <!-- Stack cell: 10 -->
    <rect x="70" y="140" width="80" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="174.2" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">10</text>
    
    <!-- Stack cell: bottom/empty pattern -->
    <rect x="70" y="200" width="80" height="60" fill="url(#hatch)" stroke="#9aa5b1" stroke-width="1.5"/>

    <!-- top indicator -->
    <path d="M180,170 L154,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="188" y="174.2" font-size="14" fill="#2563eb" font-weight="bold">top</text>
  </g>

  <!-- Step 2: push(20) -->
  <g id="step2">
    <text x="310" y="54" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">push(20)</text>

    <!-- Stack frame for Step 2 -->
    <rect x="270" y="80" width="80" height="180" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>

    <!-- Stack cell: 20 -->
    <rect x="270" y="140" width="80" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="174.2" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">20</text>

    <!-- Stack cell: 10 -->
    <rect x="270" y="200" width="80" height="60" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="310" y="234.2" font-size="14" fill="#1f2933" text-anchor="middle">10</text>

    <!-- Stack cell: bottom/empty pattern -->
    <rect x="270" y="260" width="80" height="60" fill="url(#hatch)" stroke="#9aa5b1" stroke-width="1.5"/>

    <!-- top indicator -->
    <path d="M380,170 L354,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="388" y="174.2" font-size="14" fill="#2563eb" font-weight="bold">top</text>
  </g>

  <!-- Step 3: push(30) -->
  <g id="step3">
    <text x="510" y="54" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">push(30)</text>

    <!-- Stack frame for Step 3 -->
    <rect x="470" y="80" width="80" height="240" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>

    <!-- Stack cell: 30 -->
    <rect x="470" y="80" width="80" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="510" y="114.2" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">30</text>

    <!-- Stack cell: 20 -->
    <rect x="470" y="140" width="80" height="60" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="510" y="174.2" font-size="14" fill="#1f2933" text-anchor="middle">20</text>

    <!-- Stack cell: 10 -->
    <rect x="470" y="200" width="80" height="60" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="510" y="234.2" font-size="14" fill="#1f2933" text-anchor="middle">10</text>

    <!-- Stack cell: bottom/empty pattern -->
    <rect x="470" y="260" width="80" height="60" fill="url(#hatch)" stroke="#9aa5b1" stroke-width="1.5"/>

    <!-- top indicator -->
    <path d="M580,110 L554,110" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="588" y="114.2" font-size="14" fill="#2563eb" font-weight="bold">top</text>
  </g>

  <!-- Step 4: pop() → 30 -->
  <g id="step4">
    <text x="710" y="54" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">pop() → 30</text>

    <!-- Stack frame for Step 4 -->
    <rect x="670" y="80" width="80" height="240" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>

    <!-- Stack cell: 20 -->
    <rect x="670" y="140" width="80" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="710" y="174.2" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">20</text>

    <!-- Stack cell: 10 -->
    <rect x="670" y="200" width="80" height="60" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="710" y="234.2" font-size="14" fill="#1f2933" text-anchor="middle">10</text>

    <!-- Stack cell: bottom/empty pattern -->
    <rect x="670" y="260" width="80" height="60" fill="url(#hatch)" stroke="#9aa5b1" stroke-width="1.5"/>

    <!-- top indicator -->
    <path d="M780,170 L754,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="788" y="174.2" font-size="14" fill="#2563eb" font-weight="bold">top</text>
  </g>
</svg>