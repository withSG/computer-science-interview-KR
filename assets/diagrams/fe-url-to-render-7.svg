<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">리소스 로딩 타임라인</title>
  <desc id="d">시간축 위에 DNS, TCP, TLS가 차례로 끝난 뒤 HTML을 받는 동안 CSS(HTML 파싱 중 발견), JS, IMG 요청이 겹쳐 시작되고, 그 뒤 렌더링이 일어나 첫 화면(FCP)이 나오는 흐름을 막대로 보여 줍니다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 시간축 -->
  <text x="36" y="46" font-size="16" font-weight="700" fill="#374151">시간</text>
  <line x1="130" y1="40" x2="846" y2="40" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 줄 띠 (짝수 줄 음영) -->
  <rect x="24" y="64" width="832" height="38" fill="#f3f4f6"/>
  <rect x="24" y="140" width="832" height="38" fill="#f3f4f6"/>
  <rect x="24" y="216" width="832" height="38" fill="#f3f4f6"/>
  <rect x="24" y="292" width="832" height="38" fill="#f3f4f6"/>

  <!-- 줄 이름 -->
  <text x="36" y="89" font-size="16" font-weight="700" fill="#1f2937">DNS</text>
  <text x="36" y="127" font-size="16" font-weight="700" fill="#1f2937">TCP</text>
  <text x="36" y="165" font-size="16" font-weight="700" fill="#1f2937">TLS</text>
  <text x="36" y="203" font-size="16" font-weight="700" fill="#1f2937">HTML</text>
  <text x="36" y="241" font-size="16" font-weight="700" fill="#1f2937">CSS</text>
  <text x="36" y="279" font-size="16" font-weight="700" fill="#1f2937">JS</text>
  <text x="36" y="317" font-size="16" font-weight="700" fill="#1f2937">IMG</text>
  <text x="36" y="355" font-size="16" font-weight="700" fill="#1f2937">렌더링</text>

  <!-- 막대: 연결 준비 -->
  <rect x="130" y="73" width="40" height="20" rx="3" fill="#64748b"/>
  <rect x="170" y="111" width="60" height="20" rx="3" fill="#64748b"/>
  <rect x="230" y="149" width="60" height="20" rx="3" fill="#64748b"/>

  <!-- 막대: HTML과 하위 리소스 -->
  <rect x="290" y="187" width="240" height="20" rx="3" fill="#1d4ed8"/>
  <rect x="370" y="225" width="160" height="20" rx="3" fill="#60a5fa"/>
  <text x="546" y="241" font-size="15" fill="#4b5563">(HTML 파싱 중 발견)</text>
  <rect x="410" y="263" width="120" height="20" rx="3" fill="#60a5fa"/>
  <rect x="490" y="301" width="120" height="20" rx="3" fill="#60a5fa"/>

  <!-- 막대: 렌더링 -->
  <rect x="630" y="339" width="60" height="20" rx="3" fill="#047857"/>
  <line x1="726" y1="349" x2="696" y2="349" stroke="#047857" stroke-width="2" marker-end="url(#ahg)"/>
  <text x="734" y="355" font-size="16" font-weight="700" fill="#047857">첫 화면(FCP)</text>
</svg>
