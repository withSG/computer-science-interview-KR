<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">응답을 받은 다음 — 렌더링으로 넘어가는 지점</title>
  <desc id="d">URL 입력 후 리소스 로드 및 렌더링 타임라인 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title / Section Heading from doc -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">7. 응답을 받은 다음 — 렌더링으로 넘어가는 지점</text>

  <!-- Timeline Top Axis -->
  <text x="30" y="78" font-size="13" font-weight="bold" fill="#1f2933">시간</text>
  <path d="M65,74 L830,74" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Horizontal Grid Lines -->
  <line x1="30" y1="115" x2="850" y2="115" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="30" y1="150" x2="850" y2="150" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="30" y1="185" x2="850" y2="185" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="30" y1="220" x2="850" y2="220" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="30" y1="255" x2="850" y2="255" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="30" y1="290" x2="850" y2="290" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="30" y1="325" x2="850" y2="325" stroke="#f0f4f8" stroke-width="1"/>
  <line x1="30" y1="360" x2="850" y2="360" stroke="#f0f4f8" stroke-width="1"/>

  <!-- Row Labels -->
  <text x="30" y="120" font-size="13" font-weight="bold" fill="#1f2933">DNS</text>
  <text x="30" y="155" font-size="13" font-weight="bold" fill="#1f2933">TCP</text>
  <text x="30" y="190" font-size="13" font-weight="bold" fill="#1f2933">TLS</text>
  <text x="30" y="225" font-size="13" font-weight="bold" fill="#1f2933">HTML</text>
  <text x="30" y="260" font-size="13" font-weight="bold" fill="#1f2933">CSS</text>
  <text x="30" y="295" font-size="13" font-weight="bold" fill="#1f2933">JS</text>
  <text x="30" y="330" font-size="13" font-weight="bold" fill="#1f2933">IMG</text>
  <text x="30" y="365" font-size="13" font-weight="bold" fill="#1f2933">렌더링</text>

  <!-- Bars representing ASCII ██ -->
  <!-- DNS: start 120, width 30 -->
  <rect x="120" y="106" width="30" height="18" rx="3" fill="#2563eb"/>
  
  <!-- TCP: start 150, width 50 -->
  <rect x="150" y="141" width="50" height="18" rx="3" fill="#2563eb"/>
  
  <!-- TLS: start 200, width 50 -->
  <rect x="200" y="176" width="50" height="18" rx="3" fill="#2563eb"/>
  
  <!-- HTML: start 250, width 180 -->
  <rect x="250" y="211" width="180" height="18" rx="3" fill="#059669"/>
  
  <!-- CSS: start 350, width 120 -->
  <rect x="350" y="246" width="120" height="18" rx="3" fill="#7c3aed"/>
  
  <!-- Inline annotation for CSS: (HTML 파싱 중 발견) -->
  <text x="485" y="260" font-size="12" fill="#52606d">(HTML 파싱 중 발견)</text>
  
  <!-- JS: start 380, width 90 -->
  <rect x="380" y="281" width="90" height="18" rx="3" fill="#d97706"/>
  
  <!-- IMG: start 450, width 90 -->
  <rect x="450" y="316" width="90" height="18" rx="3" fill="#52606d"/>
  
  <!-- 렌더링: start 580, width 50 -->
  <rect x="580" y="351" width="50" height="18" rx="3" fill="#dc2626"/>

  <!-- Arrow pointing to FCP: ← 첫 화면(FCP) -->
  <path d="M720,360 L640,360" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="730" y="365" font-size="13" font-weight="bold" fill="#dc2626">첫 화면(FCP)</text>

</svg>