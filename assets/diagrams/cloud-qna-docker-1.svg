<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">관계</title>
  <desc id="d">Docker 이미지와 컨테이너 1, 2, 3의 Writable Layer 관계를 나타낸 트리 구조 다이어그램</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 연결선 (Image -> Container 1, 2, 3) -->
  <path d="M 230,80 L 230,300 M 230,80 L 300,80 M 230,190 L 300,190 M 230,300 L 300,300" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- 연결선 (Container -> Writable Layer) -->
  <path d="M 520,80 L 520,130 L 550,130 M 520,190 L 520,240 L 550,240 M 520,300 L 520,350 L 550,350" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- Image (읽기 전용) -->
  <rect x="30" y="50" width="160" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">Image (읽기 전용)</text>

  <!-- Container 1 (실행 중) -->
  <rect x="300" y="50" width="190" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="395" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">Container 1 (실행 중)</text>

  <!-- Container 1's Writable Layer -->
  <rect x="550" y="105" width="170" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="635" y="135" text-anchor="middle" font-size="13" fill="#1f2933">Writable Layer</text>

  <!-- Container 2 (실행 중) -->
  <rect x="300" y="160" width="190" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="395" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">Container 2 (실행 중)</text>

  <!-- Container 2's Writable Layer -->
  <rect x="550" y="215" width="170" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="635" y="245" text-anchor="middle" font-size="13" fill="#1f2933">Writable Layer</text>

  <!-- Container 3 (정지됨) -->
  <rect x="300" y="270" width="190" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="395" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">Container 3 (정지됨)</text>

  <!-- Container 3's Writable Layer -->
  <rect x="550" y="325" width="170" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="635" y="355" text-anchor="middle" font-size="13" fill="#1f2933">Writable Layer</text>
</svg>