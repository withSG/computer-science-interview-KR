<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">"제 컴퓨터에서는 잘 되는데요"</title>
  <desc id="d">개발자 노트북과 운영 서버 간의 환경 설정(Node, OpenSSL, TZ, locale) 차이를 보여주는 다이어그램</desc>
  
  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 마커 정의 -->
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 범례 (Legend) -->
  <rect x="680" y="24" width="156" height="34" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <rect x="692" y="35" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="710" y="45.2" font-size="11.5" fill="#dc2626" font-weight="bold">← 다름 (환경 불일치)</text>

  <!-- 메인 영격 그룹 (개발자 노트북 vs 운영 서버) -->
  <!-- 개발자 노트북 영역 -->
  <rect x="40" y="70" width="370" height="280" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="105.6" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">개발자 노트북</text>
  <line x1="60" y1="120" x2="390" y2="120" stroke="#2563eb" stroke-width="1.5"/>

  <!-- 운영 서버 영역 -->
  <rect x="470" y="70" width="370" height="280" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="655" y="105.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">운영 서버</text>
  <line x1="490" y1="120" x2="820" y2="120" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 행 1: Node -->
  <!-- 개발자 노트북: Node 20.11 -->
  <rect x="60" y="138" width="330" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="76" y="163.5" font-size="13" font-weight="bold" fill="#1f2933">Node 20.11</text>
  
  <!-- 화살표 1 -->
  <path d="M400,159 L458,159" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  
  <!-- 운영 서버: Node 18.17 -->
  <rect x="490" y="138" width="180" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="506" y="163.5" font-size="13" font-weight="bold" fill="#dc2626">Node 18.17</text>
  
  <!-- 배지 1: ← 다름 -->
  <rect x="682" y="146" width="68" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="716" y="163.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">← 다름</text>

  <!-- 행 2: OpenSSL -->
  <!-- 개발자 노트북: OpenSSL 3.x -->
  <rect x="60" y="190" width="330" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="76" y="215.5" font-size="13" font-weight="bold" fill="#1f2933">OpenSSL 3.x</text>
  
  <!-- 화살표 2 -->
  <path d="M400,211 L458,211" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  
  <!-- 운영 서버: OpenSSL 1.1 -->
  <rect x="490" y="190" width="180" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="506" y="215.5" font-size="13" font-weight="bold" fill="#dc2626">OpenSSL 1.1</text>
  
  <!-- 배지 2: ← 다름 -->
  <rect x="682" y="198" width="68" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="716" y="215.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">← 다름</text>

  <!-- 행 3: TZ -->
  <!-- 개발자 노트북: TZ=Asia/Seoul -->
  <rect x="60" y="242" width="330" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="76" y="267.5" font-size="13" font-weight="bold" fill="#1f2933">TZ=Asia/Seoul</text>
  
  <!-- 화살표 3 -->
  <path d="M400,263 L458,263" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  
  <!-- 운영 서버: TZ=UTC -->
  <rect x="490" y="242" width="180" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="506" y="267.5" font-size="13" font-weight="bold" fill="#dc2626">TZ=UTC</text>
  
  <!-- 배지 3: ← 다름 -->
  <rect x="682" y="250" width="68" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="716" y="267.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">← 다름</text>

  <!-- 행 4: locale -->
  <!-- 개발자 노트북: locale ko_KR.UTF-8 -->
  <rect x="60" y="294" width="330" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="76" y="319.5" font-size="13" font-weight="bold" fill="#1f2933">locale ko_KR.UTF-8</text>
  
  <!-- 화살표 4 -->
  <path d="M400,315 L458,315" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  
  <!-- 운영 서버: locale C -->
  <rect x="490" y="294" width="180" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="506" y="319.5" font-size="13" font-weight="bold" fill="#dc2626">locale C</text>
  
  <!-- 배지 4: ← 다름 -->
  <rect x="682" y="302" width="68" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="716" y="319.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">← 다름</text>
</svg>