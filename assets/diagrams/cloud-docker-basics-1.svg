<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">개발자 노트북과 운영 서버의 환경 차이</title>
  <desc id="d">코드는 git push로 똑같이 옮겼지만, 코드가 기대하던 환경인 Node 버전, OpenSSL 버전, TZ, locale 네 가지는 개발자 노트북과 운영 서버에서 모두 다르다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <rect x="24" y="24" width="360" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="204" y="55" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">개발자 노트북</text>
  <rect x="496" y="24" width="360" height="48" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="676" y="55" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">운영 서버</text>

  <!-- 코드: 같음 -->
  <rect x="24" y="88" width="360" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="44" y="118" font-size="17" font-weight="bold" fill="#065f46">코드</text>
  <text x="440" y="108" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git push</text>
  <line x1="392" y1="122" x2="486" y2="122" stroke="#047857" stroke-width="2" marker-end="url(#a-green)"/>
  <rect x="496" y="88" width="360" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="516" y="118" font-size="17" font-weight="bold" fill="#065f46">코드 <tspan font-weight="normal">(똑같이 옮겨짐)</tspan></text>

  <!-- 구분 문장 -->
  <text x="440" y="172" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">옮긴 것은 코드뿐 — 코드가 기대하던 환경은 옮기지 않았다</text>

  <!-- 행 1: Node -->
  <rect x="24" y="192" width="360" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="224" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Node 20.11</text>
  <rect x="400" y="204" width="80" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="223" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">≠ 다름</text>
  <rect x="496" y="192" width="360" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="516" y="224" font-size="17" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Node 18.17</text>

  <!-- 행 2: OpenSSL -->
  <rect x="24" y="254" width="360" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="286" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OpenSSL 3.x</text>
  <rect x="400" y="266" width="80" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="285" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">≠ 다름</text>
  <rect x="496" y="254" width="360" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="516" y="286" font-size="17" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OpenSSL 1.1</text>

  <!-- 행 3: TZ -->
  <rect x="24" y="316" width="360" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="348" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">TZ=Asia/Seoul</text>
  <rect x="400" y="328" width="80" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="347" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">≠ 다름</text>
  <rect x="496" y="316" width="360" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="516" y="348" font-size="17" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">TZ=UTC</text>

  <!-- 행 4: locale -->
  <rect x="24" y="378" width="360" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="410" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">locale ko_KR.UTF-8</text>
  <rect x="400" y="390" width="80" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="409" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">≠ 다름</text>
  <rect x="496" y="378" width="360" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="516" y="410" font-size="17" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">locale C</text>
</svg>
