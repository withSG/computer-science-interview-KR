<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">같은 출처의 조건</title>
  <desc id="d">https://example.com:443/page 를 프로토콜, 호스트, 포트로 나누어 보이고, https://api.example.com 은 호스트가 달라 다른 출처임을 보여 준다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="40" y="52" font-size="19" font-weight="bold" fill="#111827">같은 출처: 프로토콜 + 호스트 + 포트가 동일</text>

  <!-- URL 분해 -->
  <rect x="60" y="84" width="140" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="130" y="115" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">https://</text>
  <rect x="208" y="84" width="180" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="298" y="115" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">example.com</text>
  <rect x="396" y="84" width="90" height="48" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="441" y="115" font-size="22" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:443</text>
  <rect x="494" y="84" width="100" height="48" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="544" y="115" font-size="22" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/page</text>

  <path d="M130,132 L130,156" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M298,132 L298,156" stroke="#047857" stroke-width="2"/>
  <path d="M441,132 L441,156" stroke="#b45309" stroke-width="2"/>

  <rect x="80" y="156" width="100" height="36" rx="18" fill="#1d4ed8"/>
  <text x="130" y="180" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">프로토콜</text>
  <rect x="253" y="156" width="90" height="36" rx="18" fill="#047857"/>
  <text x="298" y="180" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">호스트</text>
  <rect x="401" y="156" width="80" height="36" rx="18" fill="#b45309"/>
  <text x="441" y="180" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">포트</text>

  <path d="M40,218 L840,218" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 비교 URL -->
  <rect x="60" y="240" width="140" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="130" y="271" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">https://</text>
  <rect x="208" y="240" width="230" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="323" y="271" font-size="22" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">api.example.com</text>

  <text x="130" y="318" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">= 같음</text>
  <text x="323" y="318" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">≠ 다름</text>

  <path d="M452,264 L508,264" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="520" y="240" width="260" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="650" y="270" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">다른 출처 (호스트 다름)</text>
</svg>
