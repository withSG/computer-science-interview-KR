<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Same-Origin Policy</title>
  <desc id="d">같은 출처의 구성 요소(프로토콜, 호스트, 포트) 분석 및 다른 출처 예시 다이어그램</desc>
  
  <rect width="880" height="320" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title / Main Header Text -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">같은 출처: 프로토콜 + 호스트 + 포트가 동일</text>

  <!-- Container Box for URL components -->
  <rect x="40" y="70" width="800" height="150" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="8"/>

  <!-- URL Components Boxes -->
  <!-- https:// -->
  <rect x="60" y="90" width="130" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="125" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#2563eb">https://</text>

  <!-- example.com -->
  <rect x="200" y="90" width="220" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="310" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#059669">example.com</text>

  <!-- :443 -->
  <rect x="430" y="90" width="90" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="475" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#d97706">:443</text>

  <!-- /page -->
  <rect x="530" y="90" width="100" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="580" y="115" font-size="14" text-anchor="middle" fill="#52606d">/page</text>

  <!-- Connecting Lines -->
  <!-- Line from Protocol -->
  <path d="M125,130 L125,160" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Line from Host -->
  <path d="M310,130 L310,160" stroke="#059669" stroke-width="1.5"/>
  <!-- Line from Port -->
  <path d="M475,130 L475,160" stroke="#d97706" stroke-width="1.5"/>

  <!-- Labels -->
  <!-- 프로토콜 -->
  <rect x="75" y="160" width="100" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="125" y="181" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">프로토콜</text>

  <!-- 호스트 -->
  <rect x="260" y="160" width="100" height="32" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="310" y="181" font-size="13" font-weight="bold" text-anchor="middle" fill="#059669">호스트</text>

  <!-- 포트 -->
  <rect x="425" y="160" width="100" height="32" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="4"/>
  <text x="475" y="181" font-size="13" font-weight="bold" text-anchor="middle" fill="#d97706">포트</text>

  <!-- Different Origin Example Box -->
  <rect x="40" y="240" width="800" height="50" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="6"/>
  <text x="60" y="271" font-size="14" font-weight="bold" fill="#dc2626">https://api.example.com</text>
  
  <!-- Arrow -->
  <path d="M260,265 L310,265" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  
  <!-- Result Text -->
  <text x="325" y="271" font-size="14" font-weight="bold" fill="#dc2626">다른 출처 (호스트 다름)</text>
</svg>