<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 750" width="880" height="750" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AWS 데이터 전송 경로별 과금</title>
  <desc id="d">같은 AZ 안의 사설 IP 통신과 VPC Endpoint를 거친 같은 리전 S3 전송은 무료이고, AZ 간 전송, NAT Gateway 처리량, 리전 간 전송, 인터넷으로 나가는 outbound는 과금됩니다.</desc>
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="750" fill="#ffffff"/>

  <!-- Region -->
  <rect x="32" y="24" width="816" height="436" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="52" y="54" font-size="18" font-weight="bold" fill="#111827">Region</text>

  <!-- AZ-a -->
  <rect x="56" y="72" width="368" height="168" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="76" y="98" font-size="16" font-weight="bold" fill="#374151">AZ-a</text>
  <path d="M188,140 H292" fill="none" stroke="#059669" stroke-width="2.5"/>
  <rect x="96" y="118" width="92" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="142" y="146" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">EC2</text>
  <rect x="292" y="118" width="92" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="338" y="146" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">EC2</text>
  <text x="136" y="203" font-size="15" fill="#374151">같은 AZ · 사설 IP</text>
  <rect x="264" y="184" width="54" height="28" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="291" y="203" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">무료</text>

  <!-- AZ-c -->
  <rect x="456" y="72" width="368" height="168" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="476" y="98" font-size="16" font-weight="bold" fill="#374151">AZ-c</text>
  <rect x="594" y="118" width="92" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="640" y="146" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">EC2</text>

  <!-- AZ 간 전송 (AZ-a의 EC2 ↔ AZ-c의 EC2) -->
  <path d="M338,162 V276 H640 V162" fill="none" stroke="#dc2626" stroke-width="2"/>

  <!-- AZ 간 전송 라벨 (선을 가리는 면 위) -->
  <rect x="410" y="262" width="160" height="28" fill="#f8fafc"/>
  <text x="420" y="281" font-size="15" font-weight="bold" fill="#111827">AZ 간 전송</text>
  <rect x="506" y="262" width="54" height="28" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="533" y="281" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">과금</text>

  <!-- EC2 → NAT Gateway -->
  <rect x="64" y="308" width="92" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="336" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">EC2</text>
  <path d="M160,330 H438" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="444" y="308" width="160" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="524" y="336" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">NAT Gateway</text>
  <rect x="624" y="316" width="136" height="28" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="692" y="335" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">처리량만큼 과금</text>

  <!-- EC2 → S3 (같은 리전, VPC Endpoint 경유) -->
  <rect x="64" y="388" width="92" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="416" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">EC2</text>
  <text x="299" y="398" font-size="15" fill="#374151" text-anchor="middle">같은 리전, VPC Endpoint 경유</text>
  <path d="M160,410 H438" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="444" y="388" width="160" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="524" y="416" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">S3</text>
  <rect x="624" y="396" width="54" height="28" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="651" y="415" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">무료</text>

  <!-- Region → 다른 Region -->
  <path d="M440,460 V534" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="458" y="503" font-size="15" font-weight="bold" fill="#111827">리전 간 전송</text>
  <rect x="554" y="484" width="54" height="28" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="581" y="503" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">과금</text>

  <rect x="350" y="540" width="180" height="52" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="440" y="572" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">다른 Region</text>

  <!-- 다른 Region → 사용자 (인터넷 outbound) -->
  <path d="M440,592 V666" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="458" y="635" font-size="15" font-weight="bold" fill="#111827">인터넷으로 나가는 outbound</text>
  <rect x="670" y="616" width="54" height="28" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="697" y="635" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">과금</text>

  <rect x="370" y="672" width="140" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="440" y="704" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">사용자</text>
</svg>
