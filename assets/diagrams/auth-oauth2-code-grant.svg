<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1030" width="880" height="1030" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Authorization Code Grant 흐름</title>
  <desc id="d">사용자(브라우저), Client(우리 서버), Authorization Server, Resource Server 사이의 9단계 시퀀스입니다. (1)~(5)는 브라우저를 거치는 Front-channel, (6)(7) 토큰 교환은 서버 대 서버 Back-channel, (8)(9)는 Access Token으로 자원에 접근하고 로그인을 완료하는 구간입니다.</desc>
  <rect width="880" height="1030" fill="#ffffff"/>
  <defs>
    <marker id="mF" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="mK" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <!-- 구간 배경 -->
  <rect x="24" y="94" width="832" height="401" rx="8" fill="#fff7ed"/>
  <rect x="24" y="505" width="832" height="222" rx="8" fill="#ecfdf5"/>
  <rect x="24" y="737" width="832" height="235" rx="8" fill="#f3f4f6"/>
  <!-- 생명선 -->
  <line x1="80" y1="80" x2="80" y2="972" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="340" y1="80" x2="340" y2="972" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="610" y1="80" x2="610" y2="972" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="790" y1="80" x2="790" y2="972" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- 참여자 -->
  <rect x="30" y="24" width="100" height="56" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="80" y="47" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사용자</text>
  <text x="80" y="69" font-size="15" fill="#111827" text-anchor="middle">(브라우저)</text>
  <rect x="275" y="24" width="130" height="56" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="340" y="47" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>
  <text x="340" y="69" font-size="15" fill="#111827" text-anchor="middle">(우리 서버)</text>
  <rect x="530" y="24" width="160" height="56" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="610" y="47" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Authorization</text>
  <text x="610" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>
  <rect x="735" y="24" width="110" height="56" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="790" y="47" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Resource</text>
  <text x="790" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>
  <!-- 구간 이름표 -->
  <rect x="36" y="104" width="356" height="30" rx="15" fill="#ffedd5" stroke="#fdba74" stroke-width="1"/>
  <text x="52" y="124" font-size="15" font-weight="bold" fill="#9a3412">(1)~(5) 브라우저 경유 · Front-channel (위험)</text>
  <rect x="36" y="515" width="344" height="30" rx="15" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="52" y="535" font-size="15" font-weight="bold" fill="#065f46">(6)(7) 서버 대 서버 · Back-channel (안전)</text>
  <rect x="36" y="747" width="200" height="30" rx="15" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="52" y="767" font-size="15" font-weight="bold" fill="#1f2937">(8)(9) 자원 접근 · 응답</text>
  <!-- 메시지 -->
  <line x1="93" y1="177" x2="339" y2="177" stroke="#b45309" stroke-width="2" marker-end="url(#mF)"/>
  <circle cx="80" cy="177" r="12" fill="#b45309"/>
  <text x="80" y="182" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="210" y="165" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold">"구글로 로그인"</tspan></text>
  <line x1="327" y1="250" x2="81" y2="250" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mF)"/>
  <circle cx="340" cy="250" r="12" fill="#b45309"/>
  <text x="340" y="255" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="210" y="218" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">302 → /authorize?client_id=..</tspan></text>
  <text x="210" y="238" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">&amp;state=..&amp;code_challenge=..</tspan></text>
  <line x1="93" y1="323" x2="609" y2="323" stroke="#b45309" stroke-width="2" marker-end="url(#mF)"/>
  <circle cx="80" cy="323" r="12" fill="#b45309"/>
  <text x="80" y="328" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="210" y="291" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold">로그인 + 동의(Consent)</tspan></text>
  <text x="210" y="311" font-size="15" fill="#111827" text-anchor="middle"><tspan fill="#4b5563">"이 앱이 캘린더를 읽어도 될까요?"</tspan></text>
  <line x1="597" y1="396" x2="81" y2="396" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mF)"/>
  <circle cx="610" cy="396" r="12" fill="#b45309"/>
  <text x="610" y="401" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="475" y="364" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">302 → https://myapp.com/callback</tspan></text>
  <text x="475" y="384" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">?code=Splxl..&amp;state=..</tspan></text>
  <line x1="93" y1="469" x2="339" y2="469" stroke="#b45309" stroke-width="2" marker-end="url(#mF)"/>
  <circle cx="80" cy="469" r="12" fill="#b45309"/>
  <text x="80" y="474" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="210" y="437" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" font-size="14">GET /callback</tspan></text>
  <text x="210" y="457" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">?code=..&amp;state=..</tspan></text>
  <line x1="353" y1="628" x2="609" y2="628" stroke="#047857" stroke-width="2.5" marker-end="url(#mK)"/>
  <circle cx="340" cy="628" r="12" fill="#047857"/>
  <text x="340" y="633" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="475" y="576" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" font-size="14">POST /token</tspan></text>
  <text x="475" y="596" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">code + client_secret</tspan></text>
  <text x="475" y="616" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">+ code_verifier</tspan></text>
  <line x1="597" y1="701" x2="341" y2="701" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mK)"/>
  <circle cx="610" cy="701" r="12" fill="#047857"/>
  <text x="610" y="706" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="475" y="669" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" font-size="14">access_token</tspan></text>
  <text x="475" y="689" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">(+ id_token, refresh_token)</tspan></text>
  <line x1="353" y1="840" x2="789" y2="840" stroke="#374151" stroke-width="2" marker-end="url(#mG)"/>
  <circle cx="340" cy="840" r="12" fill="#374151"/>
  <text x="340" y="845" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="475" y="808" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" font-size="14">GET /calendar</tspan></text>
  <text x="475" y="828" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">Authorization: Bearer AT</tspan></text>
  <line x1="788" y1="893" x2="341" y2="893" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mG)"/>
  <text x="700" y="881" font-size="15" fill="#111827" text-anchor="middle">응답</text>
  <line x1="327" y1="946" x2="81" y2="946" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mG)"/>
  <circle cx="340" cy="946" r="12" fill="#374151"/>
  <text x="340" y="951" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <text x="210" y="934" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold">로그인 완료</tspan></text>
  <!-- 범례 -->
  <line x1="36" y1="1002" x2="84" y2="1002" stroke="#374151" stroke-width="2" marker-end="url(#mG)"/>
  <text x="94" y="1007" font-size="14" fill="#374151">요청</text>
  <line x1="150" y1="1002" x2="198" y2="1002" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mG)"/>
  <text x="208" y="1007" font-size="14" fill="#374151">응답 · 302 리다이렉트</text>
  <circle cx="380" cy="1002" r="11" fill="#374151"/>
  <text x="380" y="1007" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">n</text>
  <text x="398" y="1007" font-size="14" fill="#374151">단계 번호 (보내는 쪽에 표시)</text>
</svg>
