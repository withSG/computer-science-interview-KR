<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DOM 변경 뒤 렌더링 파이프라인</title>
  <desc id="d">DOM 변경 뒤에 스타일 재계산(어떤 규칙이 적용되나), 레이아웃(위치·크기 재계산), 페인트(그리기), 합성(겹치기) 순서로 렌더링 파이프라인이 이어지는 흐름입니다.</desc>
  <rect width="880" height="200" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 렌더링 파이프라인 묶음 -->
  <path d="M200,62 V52 H852 V62" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="446" y="28" width="160" height="30" fill="#ffffff"/>
  <text x="526" y="48" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">렌더링 파이프라인</text>

  <!-- DOM 변경 -->
  <rect x="28" y="72" width="136" height="100" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="96" y="128" font-size="17" font-weight="bold" fill="#7c2d12" text-anchor="middle">DOM 변경</text>

  <!-- 스타일 재계산 -->
  <rect x="200" y="72" width="136" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="268" y="106" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">스타일 재계산</text>
  <text x="268" y="136" font-size="15" fill="#374151" text-anchor="middle">어떤 규칙이</text>
  <text x="268" y="156" font-size="15" fill="#374151" text-anchor="middle">적용되나</text>

  <!-- 레이아웃 -->
  <rect x="372" y="72" width="136" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="106" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">레이아웃</text>
  <text x="440" y="136" font-size="15" fill="#374151" text-anchor="middle">위치·크기</text>
  <text x="440" y="156" font-size="15" fill="#374151" text-anchor="middle">재계산</text>

  <!-- 페인트 -->
  <rect x="544" y="72" width="136" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="612" y="106" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">페인트</text>
  <text x="612" y="136" font-size="15" fill="#374151" text-anchor="middle">그리기</text>

  <!-- 합성 -->
  <rect x="716" y="72" width="136" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="784" y="106" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">합성</text>
  <text x="784" y="136" font-size="15" fill="#374151" text-anchor="middle">겹치기</text>

  <!-- 화살표 -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M168,122 H194" marker-end="url(#arr)"/>
    <path d="M340,122 H366" marker-end="url(#arr)"/>
    <path d="M512,122 H538" marker-end="url(#arr)"/>
    <path d="M684,122 H710" marker-end="url(#arr)"/>
  </g>
</svg>
