<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Trunk Based Development</title>
  <desc id="d">Trunk Based Development 워크플로우를 나타낸 다이어그램으로, main 브랜치로 짧은 feature 브랜치들이 직접 병합되는 구조를 설명합니다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <path d="M100,100 L780,100" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="80" y="105" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="end">main</text>
  <path d="M280,210 L280,112" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M440,210 L440,112" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M600,210 L600,112" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <rect x="300" y="215" width="280" height="40" rx="6" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="240" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">(짧은 feature 브랜치)</text>
</svg>