<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">회귀 지표 MAE와 RMSE 비교</title>
  <desc id="d">모델 X와 모델 Y의 오차 배열을 비교하여 MAE는 동일하지만 RMSE는 큰 오차에 민감하게 반응하여 다른 값을 보여주는 다이어그램입니다.</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 전체 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 모델 X 구역 -->
  <rect x="24" y="24" width="832" height="96" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  
  <rect x="44" y="44" width="300" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="56" y="78.05" fill="#1f2933" font-size="14" font-weight="bold">모델 X 오차: [2, 2, 2, 2, 2]</text>

  <path d="M354,72 L424,72" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="434" y="44" width="402" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="78.05" fill="#1f2933" font-size="14" font-weight="bold">MAE = 2.0,  RMSE = 2.00</text>

  <!-- 모델 Y 구역 -->
  <rect x="24" y="136" width="832" height="96" rx="8" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1"/>
  
  <rect x="44" y="156" width="300" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="56" y="190.05" fill="#1f2933" font-size="14" font-weight="bold">모델 Y 오차: [1, 1, 1, 1, 6]</text>

  <path d="M354,184 L424,184" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <rect x="434" y="156" width="402" height="56" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="190.05" fill="#1f2933" font-size="14" font-weight="bold">MAE = 2.0,  RMSE ≈ 2.83</text>

  <!-- 하단 설명 및 시사점 -->
  <rect x="24" y="248" width="832" height="68" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="44" y="274.55" fill="#1f2933" font-size="13">MAE는 동일하지만 RMSE는 모델 Y가 나쁘다고 판정한다.</text>
  <text x="44" y="298.55" fill="#52606d" font-size="13">제곱이 큰 오차의 비중을 키우기 때문이다.</text>
</svg>