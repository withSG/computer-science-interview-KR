<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">규칙</title>
  <desc id="d">이전 트리의 div와 새 트리의 span처럼 루트 타입이 다르면 하위 Counter 컴포넌트가 동일해도 이전 서브트리를 통째로 언마운트하고 새 서브트리를 마운트하는 과정을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 이전 트리 그룹 -->
  <text x="170" y="45" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">이전 트리</text>
  
  <rect x="100" y="70" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="100.25" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">&lt;div&gt;</text>

  <path d="M170,120 L170,162" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="80" y="170" width="180" height="80" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="170" y="200.25" font-size="14" fill="#1f2933" text-anchor="middle">&lt;Counter&gt;</text>
  <text x="170" y="225.25" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">count: 7</text>

  <!-- 새 트리 그룹 -->
  <text x="470" y="45" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">새 트리</text>

  <rect x="400" y="70" width="140" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="100.25" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">&lt;span&gt;</text>

  <path d="M470,120 L470,162" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="380" y="170" width="180" height="80" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="470" y="210.25" font-size="14" fill="#1f2933" text-anchor="middle">&lt;Counter&gt;</text>

  <!-- 주석 1: 타입 다름! -->
  <path d="M250,95 L390,95" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <rect x="562" y="83" width="106" height="24" fill="#ffffff"/>
  <text x="565" y="99.25" font-size="13" font-weight="bold" fill="#dc2626">← 타입 다름!</text>

  <!-- 주석 2: 내용이 같아도 비교 안 함 -->
  <rect x="562" y="198" width="190" height="24" fill="#ffffff"/>
  <text x="565" y="214.25" font-size="13" fill="#52606d">← 내용이 같아도 비교 안 함</text>

  <!-- 하단 결과 영역 -->
  <rect x="40" y="290" width="800" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="325.25" font-size="14" font-weight="bold" fill="#d97706">결과:</text>
  <text x="105" y="325.25" font-size="13.5" fill="#1f2933">이전 &lt;div&gt; 이하 전부 언마운트 → 새 &lt;span&gt; 이하 전부 마운트</text>
  <text x="105" y="358.25" font-size="13.5" fill="#1f2933">Counter의 count 값 7은 사라지고 초기값으로 돌아간다</text>
</svg>