<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">타입이 다르면 서브트리를 통째로 교체</title>
  <desc id="d">같은 위치의 루트가 div에서 span으로 타입이 바뀌면, 아래의 Counter가 같아도 비교하지 않고 이전 서브트리를 전부 언마운트한 뒤 새 서브트리를 전부 마운트한다. 그래서 Counter의 count 값 7은 사라지고 초기값으로 돌아간다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="190" y="48" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">이전 트리</text>
  <text x="690" y="48" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">새 트리</text>

  <!-- 이전 트리: 언마운트 영역 -->
  <rect x="40" y="66" width="300" height="258" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="115" y="88" width="150" height="50" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="190" y="120" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div&gt;</text>
  <path d="M190,138 L190,172" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ar-ink)"/>
  <rect x="95" y="176" width="190" height="82" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="190" y="208" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;Counter&gt;</text>
  <text x="190" y="238" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">count: 7</text>
  <text x="190" y="298" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">① 전부 언마운트</text>

  <!-- 새 트리: 마운트 영역 -->
  <rect x="540" y="66" width="300" height="258" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="615" y="88" width="150" height="50" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="690" y="120" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;span&gt;</text>
  <path d="M690,138 L690,172" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ar-ink)"/>
  <rect x="595" y="176" width="190" height="82" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="690" y="208" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;Counter&gt;</text>
  <text x="690" y="238" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">count: 초기값</text>
  <text x="690" y="298" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">② 전부 마운트</text>

  <!-- 가운데: 같은 위치끼리 비교 -->
  <text x="440" y="104" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">타입 다름!</text>
  <path d="M352,118 L528,118" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <text x="440" y="142" font-size="15" fill="#4b5563" text-anchor="middle">→ 비교 중단</text>

  <text x="440" y="212" font-size="16" fill="#4b5563" text-anchor="middle">내용이 같아도</text>
  <text x="440" y="236" font-size="16" fill="#4b5563" text-anchor="middle">비교 안 함</text>

  <!-- 결과 -->
  <rect x="40" y="350" width="800" height="106" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="64" y="386" font-size="17" font-weight="bold" fill="#92400e">결과</text>
  <text x="124" y="386" font-size="16" fill="#111827">이전 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div&gt;</tspan> 이하 전부 언마운트 → 새 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;span&gt;</tspan> 이하 전부 마운트</text>
  <text x="124" y="424" font-size="16" fill="#111827">Counter의 <tspan font-weight="bold" fill="#b91c1c">count 값 7은 사라지고</tspan> 초기값으로 돌아간다</text>
</svg>
