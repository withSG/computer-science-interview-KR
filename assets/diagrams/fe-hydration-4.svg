<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Streaming SSR — 준비된 것부터 흘려보낸다</title>
  <desc id="d">기존 SSR과 Streaming SSR의 전송 방식을 시간 흐름에 따라 비교한 다이어그램</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- SVG Defs / Markers -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="40" font-size="16" font-weight="bold" fill="#1f2933">Streaming SSR — 준비된 것부터 흘려보낸다</text>

  <!-- Section 1: 기존 SSR -->
  <g transform="translate(0, 60)">
    <text x="30" y="30" font-size="14" font-weight="bold" fill="#1f2933">기존 SSR</text>

    <!-- Timeline Axis -->
    <line x1="120" y1="26" x2="520" y2="26" stroke="#52606d" stroke-width="1.5"/>
    <circle cx="120" cy="26" r="3" fill="#52606d"/>
    <text x="120" y="16" font-size="11.5" text-anchor="middle" fill="#52606d">0ms</text>
    <circle cx="520" cy="26" r="3" fill="#52606d"/>
    <text x="520" y="16" font-size="11.5" text-anchor="middle" fill="#52606d">800ms</text>

    <!-- Blocks -->
    <rect x="120" y="40" width="320" height="34" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="280" y="61" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">서버 대기</text>

    <rect x="440" y="40" width="80" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="480" y="61" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">전송</text>

    <!-- Description -->
    <text x="540" y="61" font-size="13" fill="#dc2626">← 800ms 동안 흰 화면</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="180" x2="850" y2="180" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Section 2: Streaming SSR -->
  <g transform="translate(0, 200)">
    <text x="30" y="30" font-size="14" font-weight="bold" fill="#1f2933">Streaming SSR</text>

    <!-- Timeline Axis -->
    <line x1="120" y1="26" x2="520" y2="26" stroke="#52606d" stroke-width="1.5"/>
    
    <circle cx="120" cy="26" r="3" fill="#52606d"/>
    <text x="120" y="16" font-size="11.5" text-anchor="middle" fill="#52606d">0ms</text>

    <circle cx="170" cy="26" r="3" fill="#52606d"/>
    <text x="170" y="16" font-size="11.5" text-anchor="middle" fill="#52606d">80ms</text>

    <circle cx="310" cy="26" r="3" fill="#52606d"/>
    <text x="310" y="16" font-size="11.5" text-anchor="middle" fill="#52606d">300ms</text>

    <circle cx="520" cy="26" r="3" fill="#52606d"/>
    <text x="520" y="16" font-size="11.5" text-anchor="middle" fill="#52606d">800ms</text>

    <!-- Row 1: Header -->
    <rect x="120" y="40" width="80" height="34" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="160" y="61" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">헤더</text>

    <rect x="200" y="40" width="60" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="230" y="61" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">전송</text>

    <text x="280" y="61" font-size="13" fill="#059669">← 레이아웃 + 스켈레톤이 먼저 보인다</text>

    <!-- Row 2: Product Info -->
    <rect x="200" y="86" width="110" height="34" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="255" y="107" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">상품정보</text>

    <rect x="310" y="86" width="60" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="340" y="107" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">전송</text>

    <text x="390" y="107" font-size="13" fill="#059669">← 상품 정보 채워짐</text>

    <!-- Row 3: Reviews -->
    <rect x="310" y="132" width="150" height="34" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="385" y="153" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">리뷰 목록</text>

    <rect x="460" y="132" width="60" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="490" y="153" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">전송</text>

    <text x="540" y="153" font-size="13" fill="#059669">← 마지막 조각 채워짐</text>
  </g>
</svg>