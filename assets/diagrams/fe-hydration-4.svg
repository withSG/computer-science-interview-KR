<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기존 SSR과 Streaming SSR 비교</title>
  <desc id="d">같은 시간축(0~800ms)에서 기존 SSR은 800ms 동안 서버 대기 후 한 번에 전송해 그동안 흰 화면이다. Streaming SSR은 80ms에 헤더, 300ms에 상품정보, 800ms에 리뷰 목록을 조각별로 전송해 레이아웃과 스켈레톤이 먼저 보이고 차례로 채워진다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 기존 SSR -->
  <text x="48" y="44" font-size="18" font-weight="bold" fill="#111827">기존 SSR</text>
  <text x="48" y="70" font-size="14" fill="#4b5563" text-anchor="middle">0ms</text>
  <text x="608" y="70" font-size="14" fill="#4b5563" text-anchor="middle">800ms</text>
  <line x1="48" y1="80" x2="608" y2="80" stroke="#6b7280" stroke-width="2"/>
  <line x1="48" y1="74" x2="48" y2="86" stroke="#6b7280" stroke-width="2"/>
  <line x1="608" y1="74" x2="608" y2="86" stroke="#6b7280" stroke-width="2"/>

  <rect x="48" y="94" width="560" height="38" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="328" y="119" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">서버 대기</text>
  <rect x="608" y="94" width="52" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="634" y="118" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">전송</text>
  <text x="674" y="118" font-size="15" font-weight="bold" fill="#b91c1c">← 800ms 동안 흰 화면</text>

  <line x1="32" y1="160" x2="848" y2="160" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Streaming SSR -->
  <text x="48" y="196" font-size="18" font-weight="bold" fill="#111827">Streaming SSR</text>
  <text x="48" y="222" font-size="14" fill="#4b5563" text-anchor="middle">0ms</text>
  <text x="104" y="222" font-size="14" fill="#4b5563" text-anchor="middle">80ms</text>
  <text x="258" y="222" font-size="14" fill="#4b5563" text-anchor="middle">300ms</text>
  <text x="608" y="222" font-size="14" fill="#4b5563" text-anchor="middle">800ms</text>
  <line x1="48" y1="232" x2="608" y2="232" stroke="#6b7280" stroke-width="2"/>
  <line x1="48" y1="226" x2="48" y2="238" stroke="#6b7280" stroke-width="2"/>
  <line x1="104" y1="226" x2="104" y2="238" stroke="#6b7280" stroke-width="2"/>
  <line x1="258" y1="226" x2="258" y2="238" stroke="#6b7280" stroke-width="2"/>
  <line x1="608" y1="226" x2="608" y2="238" stroke="#6b7280" stroke-width="2"/>

  <rect x="48" y="246" width="56" height="38" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="76" y="270" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">헤더</text>
  <rect x="104" y="246" width="52" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="270" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">전송</text>
  <text x="170" y="270" font-size="15" fill="#047857">← 레이아웃 + 스켈레톤이 먼저 보인다</text>

  <rect x="104" y="292" width="154" height="38" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="181" y="316" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">상품정보</text>
  <rect x="258" y="292" width="52" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="284" y="316" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">전송</text>
  <text x="324" y="316" font-size="15" fill="#047857">← 상품 정보 채워짐</text>

  <rect x="258" y="338" width="350" height="38" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="433" y="362" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">리뷰 목록</text>
  <rect x="608" y="338" width="52" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="634" y="362" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">전송</text>
  <text x="674" y="362" font-size="15" fill="#047857">← 마지막 조각 채워짐</text>
</svg>
