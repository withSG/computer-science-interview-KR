<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 최적화 전략</title>
  <desc id="d">캐싱, 병렬 실행, 선택적 실행, 빠른 실패 등 4가지 테스트 최적화 전략을 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Main Container -->
  <rect x="24" y="24" width="832" height="272" rx="12" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 1. 캐싱 (Blue Theme) -->
  <g>
    <rect x="44" y="44" width="186" height="232" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <!-- Title Header -->
    <rect x="44" y="44" width="186" height="40" rx="8" fill="#2563eb"/>
    <rect x="44" y="72" width="186" height="12" fill="#2563eb"/>
    <text x="137" y="69" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1. 캐싱</text>
    <!-- List Items -->
    <text x="60" y="112" fill="#1f2933" font-size="13">- node_modules 캐시</text>
    <text x="60" y="142" fill="#1f2933" font-size="13">- Docker 레이어 캐시</text>
    <text x="60" y="172" fill="#1f2933" font-size="13">- 테스트 결과 캐시</text>
  </g>

  <!-- 2. 병렬 실행 (Green Theme) -->
  <g>
    <rect x="246" y="44" width="186" height="232" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <!-- Title Header -->
    <rect x="246" y="44" width="186" height="40" rx="8" fill="#059669"/>
    <rect x="246" y="72" width="186" height="12" fill="#059669"/>
    <text x="339" y="69" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2. 병렬 실행</text>
    <!-- List Items -->
    <text x="262" y="112" fill="#1f2933" font-size="13">- 매트릭스 빌드</text>
    <text x="262" y="142" fill="#1f2933" font-size="13">- 테스트 샤딩</text>
  </g>

  <!-- 3. 선택적 실행 (Purple Theme) -->
  <g>
    <rect x="448" y="44" width="186" height="232" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <!-- Title Header -->
    <rect x="448" y="44" width="186" height="40" rx="8" fill="#7c3aed"/>
    <rect x="448" y="72" width="186" height="12" fill="#7c3aed"/>
    <text x="541" y="69" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">3. 선택적 실행</text>
    <!-- List Items -->
    <text x="464" y="112" fill="#1f2933" font-size="13">- 변경된 파일 기반</text>
    <text x="464" y="142" fill="#1f2933" font-size="13">- 라벨/태그 기반</text>
  </g>

  <!-- 4. 빠른 실패 (Amber/Orange Theme) -->
  <g>
    <rect x="650" y="44" width="186" height="232" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <!-- Title Header -->
    <rect x="650" y="44" width="186" height="40" rx="8" fill="#d97706"/>
    <rect x="650" y="72" width="186" height="12" fill="#d97706"/>
    <text x="743" y="69" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">4. 빠른 실패</text>
    <!-- List Items -->
    <text x="666" y="112" fill="#1f2933" font-size="13">- 린트 → 유닛 → 통합 순서</text>
    <text x="666" y="142" fill="#1f2933" font-size="13">- 실패 시 즉시 중단</text>
  </g>
</svg>