<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fixed Window 경계 버스트</title>
  <desc id="d">한도가 분당 5개인 Fixed Window에서 12:00:58에 5개(12:00 창), 12:01:00 창 전환으로 카운터 리셋, 12:01:02에 5개(12:01 창)가 통과해 4초 동안 10개가 지나간다. 12:00:58 ~ 12:01:58 1분 구간에 한도의 2배가 통과한 것이다. 같은 요청을 Sliding Window로 세면 12:01:02 기준 지난 1분 안에 앞의 5개가 남아 있어 뒤의 5개는 거절(429)된다.</desc>
  <rect width="880" height="610" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 한도 배지 + 축척 메모 -->
  <rect x="32" y="22" width="152" height="36" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="108" y="46" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">한도: 분당 5개</text>
  <text x="848" y="46" font-size="15" fill="#4b5563" text-anchor="end">창 경계 12:01:00 전후를 확대한 시간축</text>

  <!-- ===== Fixed Window ===== -->
  <text x="32" y="98" font-size="18" font-weight="bold" fill="#111827">Fixed Window</text>

  <!-- 창 띠 -->
  <rect x="40" y="112" width="416" height="36" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="248" y="136" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">12:00 창 · 카운터 5/5</text>
  <rect x="464" y="112" width="386" height="36" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="657" y="136" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">12:01 창 · 카운터 5/5</text>

  <!-- 창 경계선 -->
  <line x1="460" y1="104" x2="460" y2="272" stroke="#6d28d9" stroke-width="3"/>
  <rect x="370" y="162" width="180" height="32" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="460" y="183.5" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">창 전환 · 카운터 리셋</text>

  <!-- 요청 5개 @12:00:58 -->
  <rect x="287" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="309" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="331" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="353" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="375" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <text x="340" y="252" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">5개 통과 (12:00 창)</text>

  <!-- 요청 5개 @12:01:02 -->
  <rect x="527" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="549" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="571" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="593" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="615" y="208" width="18" height="18" rx="3" fill="#047857"/>
  <text x="580" y="252" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">5개 통과 (12:01 창)</text>

  <!-- 시간축 A -->
  <line x1="40" y1="272" x2="846" y2="272" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="340" y1="266" x2="340" y2="278" stroke="#374151" stroke-width="1.5"/>
  <line x1="580" y1="266" x2="580" y2="278" stroke="#374151" stroke-width="1.5"/>
  <text x="340" y="296" font-size="15" fill="#374151" text-anchor="middle">12:00:58</text>
  <text x="460" y="296" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">12:01:00</text>
  <text x="580" y="296" font-size="15" fill="#374151" text-anchor="middle">12:01:02</text>

  <!-- 4초 치수선 -->
  <line x1="340" y1="308" x2="340" y2="324" stroke="#b91c1c" stroke-width="2"/>
  <line x1="580" y1="308" x2="580" y2="324" stroke="#b91c1c" stroke-width="2"/>
  <line x1="340" y1="316" x2="580" y2="316" stroke="#b91c1c" stroke-width="2"/>
  <text x="460" y="346" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">4초 — 이 구간에 10개가 통과했다</text>
  <text x="460" y="370" font-size="15" fill="#374151" text-anchor="middle">12:00:58 ~ 12:01:58 1분 구간에 10개 = 한도(분당 5개)의 2배</text>

  <line x1="32" y1="394" x2="848" y2="394" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===== Sliding Window 비교 ===== -->
  <text x="32" y="428" font-size="18" font-weight="bold" fill="#111827">비교: Sliding Window<tspan font-size="15" font-weight="normal" fill="#4b5563"> — 12:01:02 기준 지난 1분을 센다</tspan></text>

  <rect x="40" y="444" width="540" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="310" y="468" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">◀ 윈도: 12:00:02 ~ 12:01:02</text>

  <!-- 요청 5개 @12:00:58 (윈도 안) -->
  <rect x="287" y="498" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="309" y="498" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="331" y="498" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="353" y="498" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="375" y="498" width="18" height="18" rx="3" fill="#047857"/>
  <text x="340" y="542" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">5개 통과 · 아직 윈도 안</text>

  <!-- 요청 5개 @12:01:02 (거절) -->
  <rect x="527" y="498" width="18" height="18" rx="3" fill="#b91c1c"/>
  <rect x="549" y="498" width="18" height="18" rx="3" fill="#b91c1c"/>
  <rect x="571" y="498" width="18" height="18" rx="3" fill="#b91c1c"/>
  <rect x="593" y="498" width="18" height="18" rx="3" fill="#b91c1c"/>
  <rect x="615" y="498" width="18" height="18" rx="3" fill="#b91c1c"/>
  <text x="580" y="542" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">5개 거절 (429)</text>

  <!-- 시간축 B -->
  <line x1="40" y1="562" x2="846" y2="562" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="340" y1="556" x2="340" y2="568" stroke="#374151" stroke-width="1.5"/>
  <line x1="460" y1="556" x2="460" y2="568" stroke="#374151" stroke-width="1.5"/>
  <line x1="580" y1="556" x2="580" y2="568" stroke="#374151" stroke-width="1.5"/>
  <text x="340" y="586" font-size="15" fill="#374151" text-anchor="middle">12:00:58</text>
  <text x="460" y="586" font-size="15" fill="#374151" text-anchor="middle">12:01:00</text>
  <text x="580" y="586" font-size="15" fill="#374151" text-anchor="middle">12:01:02</text>
  <text x="846" y="586" font-size="15" fill="#374151" text-anchor="end">시간</text>
</svg>
