<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PR 크기와 리뷰의 실제 모습</title>
  <desc id="d">PR이 약 50줄이면 줄 단위로 읽히고, 200줄이면 대부분 읽히고, 500줄이면 훑어보게 되며, 1000줄이 넘으면 "LGTM" 한마디로 끝나 리뷰가 아니라 승인 도장이 된다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="40" y="46" font-size="19" font-weight="bold" fill="#111827">PR 크기와 리뷰의 실제 모습</text>

  <!-- 머리행 -->
  <text x="52" y="88" font-size="14" font-weight="bold" fill="#4b5563">PR 크기</text>
  <text x="150" y="88" font-size="14" font-weight="bold" fill="#4b5563">변경량 (막대 길이는 줄 수에 비례)</text>
  <text x="480" y="88" font-size="14" font-weight="bold" fill="#4b5563">리뷰에서 실제로 일어나는 일</text>
  <line x1="40" y1="102" x2="840" y2="102" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- 행 1: ~50줄 -->
  <text x="52" y="140" font-size="18" font-weight="bold" fill="#047857">~50줄</text>
  <rect x="150" y="123" width="14" height="22" rx="2" fill="#6ee7b7" stroke="#047857" stroke-width="1.5"/>
  <text x="480" y="140" font-size="16" fill="#111827">줄 단위로 읽는다. 설계 의견까지 나온다</text>
  <line x1="40" y1="166" x2="840" y2="166" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 행 2: ~200줄 -->
  <text x="52" y="204" font-size="18" font-weight="bold" fill="#1d4ed8">~200줄</text>
  <rect x="150" y="187" width="56" height="22" rx="2" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="480" y="204" font-size="16" fill="#111827">대부분 읽는다. 핵심 로직에 질문이 붙는다</text>
  <line x1="40" y1="230" x2="840" y2="230" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 행 3: ~500줄 -->
  <text x="52" y="268" font-size="18" font-weight="bold" fill="#b45309">~500줄</text>
  <rect x="150" y="251" width="140" height="22" rx="2" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
  <text x="480" y="268" font-size="16" fill="#111827">훑는다. 눈에 띄는 것만 지적한다</text>
  <line x1="40" y1="294" x2="840" y2="294" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 행 4: 1000줄+ -->
  <rect x="40" y="298" width="800" height="72" rx="6" fill="#fef2f2"/>
  <text x="52" y="340" font-size="18" font-weight="bold" fill="#b91c1c">1000줄+</text>
  <rect x="150" y="323" width="280" height="22" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <path d="M434,323 L446,334 L434,345" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <path d="M446,323 L458,334 L446,345" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <text x="480" y="341" font-size="20" font-weight="bold" fill="#b91c1c">"LGTM"</text>
  <line x1="630" y1="334" x2="572" y2="334" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrRed)"/>
  <rect x="640" y="316" width="190" height="36" rx="18" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="735" y="339" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">리뷰가 아니라 승인 도장</text>
</svg>
