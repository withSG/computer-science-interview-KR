<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">큰 PR은 리뷰가 안 된다</title>
  <desc id="d">PR 크기에 따른 리뷰 방식 및 품질 차이를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Main Container / Card Background -->
  <rect x="24" y="24" width="832" height="292" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Title Section -->
  <text x="440" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">PR 크기와 리뷰의 실제 모습</text>
  <line x1="44" y1="78" x2="836" y2="78" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Row 1: ~50줄 (Green Zone - High Quality) -->
  <g>
    <rect x="44" y="96" width="100" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="94" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">~50줄</text>

    <line x1="156" y1="114" x2="224" y2="114" stroke="#059669" stroke-width="1.5"/>

    <rect x="236" y="96" width="580" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="252" y="118" font-size="13" fill="#1f2933">줄 단위로 읽는다. 설계 의견까지 나온다</text>
  </g>

  <!-- Row 2: ~200줄 (Blue Zone - Good Quality) -->
  <g>
    <rect x="44" y="148" width="100" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="94" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">~200줄</text>

    <line x1="156" y1="166" x2="224" y2="166" stroke="#2563eb" stroke-width="1.5"/>

    <rect x="236" y="148" width="580" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="252" y="170" font-size="13" fill="#1f2933">대부분 읽는다. 핵심 로직에 질문이 붙는다</text>
  </g>

  <!-- Row 3: ~500줄 (Amber Zone - Warning) -->
  <g>
    <rect x="44" y="200" width="100" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="94" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">~500줄</text>

    <line x1="156" y1="218" x2="224" y2="218" stroke="#d97706" stroke-width="1.5"/>

    <rect x="236" y="200" width="580" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="252" y="222" font-size="13" fill="#1f2933">훑는다. 눈에 띄는 것만 지적한다</text>
  </g>

  <!-- Row 4: 1000줄+ (Red Zone - Danger / Low Quality) -->
  <g>
    <defs>
      <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>

    <rect x="44" y="252" width="100" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="94" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">1000줄+</text>

    <line x1="156" y1="270" x2="224" y2="270" stroke="#dc2626" stroke-width="1.5"/>

    <rect x="236" y="252" width="234" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="252" y="274" font-size="13" fill="#1f2933">"LGTM"</text>

    <!-- Left-pointing Arrow for Note -->
    <path d="M540,270 L482,270" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <text x="552" y="274" font-size="13" font-weight="bold" fill="#dc2626">리뷰가 아니라 승인 도장</text>
  </g>
</svg>