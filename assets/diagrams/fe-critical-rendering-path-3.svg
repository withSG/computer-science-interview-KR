<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기본·async·defer 파싱 흐름</title>
  <desc id="d">파싱 진행 방향을 따라 기본, async, defer 스크립트를 비교한 그림. 기본은 다운로드와 실행 동안 파싱이 완전히 정지하고, async는 다운로드를 병행하다 준비되는 순간 끼어들어 파싱을 잠깐 멈추며, defer는 다운로드를 병행하고 파싱이 끝난 뒤 작성 순서대로 실행된다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 파싱 진행 축 -->
  <text x="100" y="46" text-anchor="end" font-size="17" font-weight="bold" fill="#111827">파싱</text>
  <line x1="116" y1="40" x2="850" y2="40" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 공통 기준선: 스크립트 발견 -->
  <text x="228" y="72" text-anchor="middle" font-size="15" fill="#374151">스크립트 발견</text>
  <line x1="228" y1="80" x2="228" y2="414" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- ── 기본 ── -->
  <text x="100" y="128" text-anchor="end" font-size="18" font-weight="bold" fill="#111827">기본</text>
  <rect x="116" y="100" width="110" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="171" y="127" text-anchor="middle" font-size="16" fill="#1e3a8a">파싱</text>
  <rect x="230" y="100" width="170" height="44" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="315" y="127" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">다운로드</text>
  <rect x="404" y="100" width="76" height="44" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="442" y="127" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">실행</text>
  <rect x="484" y="100" width="330" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="649" y="127" text-anchor="middle" font-size="16" fill="#1e3a8a">파싱</text>

  <path d="M230,150 V157 H480 V150" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="355" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">파싱 완전 정지</text>

  <!-- ── async ── -->
  <text x="100" y="248" text-anchor="end" font-size="18" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">async</text>
  <rect x="116" y="220" width="284" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="258" y="247" text-anchor="middle" font-size="16" fill="#1e3a8a">파싱</text>
  <rect x="404" y="220" width="76" height="44" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="442" y="247" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">실행</text>
  <rect x="484" y="220" width="156" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="562" y="247" text-anchor="middle" font-size="16" fill="#1e3a8a">파싱</text>

  <rect x="230" y="270" width="170" height="30" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="315" y="290" text-anchor="middle" font-size="15" fill="#78350f">다운로드는 병행</text>
  <line x1="442" y1="302" x2="442" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="454" y="296" font-size="15" fill="#111827">준비되는 순간 끼어들어 파싱을 잠깐 멈춤</text>

  <!-- ── defer ── -->
  <text x="100" y="358" text-anchor="end" font-size="18" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">defer</text>
  <rect x="116" y="330" width="440" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="336" y="357" text-anchor="middle" font-size="16" fill="#1e3a8a">파싱</text>
  <rect x="560" y="330" width="76" height="44" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="598" y="357" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">실행</text>

  <rect x="230" y="380" width="170" height="30" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="315" y="400" text-anchor="middle" font-size="15" fill="#78350f">다운로드는 병행</text>
  <line x1="598" y1="412" x2="598" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="610" y="406" font-size="15" fill="#111827">파싱 끝난 뒤, 작성 순서대로</text>
</svg>
