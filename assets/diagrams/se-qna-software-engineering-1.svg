<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">V-모델</title>
  <desc id="d">개발 단계와 검증 단계가 대칭을 이루는 V-모델 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 제목 (문서 헤딩) -->
  <text x="440" y="32" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">V-모델</text>

  <!-- 하향 화살표 (개발 진행 흐름) -->
  <path d="M 200,98 L 250,152" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M 280,168 L 330,222" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M 350,238 L 375,270" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 상향 화살표 (테스트 진행 흐름) -->
  <path d="M 505,270 L 530,238" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M 550,222 L 600,168" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M 630,152 L 680,98" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 수평 대응 화살표 (양방향 대응관계) -->
  <path d="M 260,80 L 620,80" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <path d="M 340,150 L 540,150" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <path d="M 420,220 L 460,220" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <path d="M 420,290 L 460,290" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>

  <!-- 왼쪽 노드들 (개발 단계) -->
  <!-- 요구사항 분석: 글자폭 ~91px, 박스폭 160px -->
  <rect x="100" y="60" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">요구사항 분석</text>

  <!-- 시스템 설계: 글자폭 ~77px, 박스폭 160px -->
  <rect x="180" y="130" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="155" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">시스템 설계</text>

  <!-- 상세 설계: 글자폭 ~63px, 박스폭 160px -->
  <rect x="260" y="200" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="225" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">상세 설계</text>

  <!-- 코딩: 글자폭 ~28px, 박스폭 110px -->
  <rect x="310" y="270" width="110" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="365" y="295" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">코딩</text>

  <!-- 오른쪽 노드들 (테스트 단계) -->
  <!-- 인수 테스트: 글자폭 ~77px, 박스폭 160px -->
  <rect x="620" y="60" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">인수 테스트</text>

  <!-- 시스템 테스트: 글자폭 ~91px, 박스폭 160px -->
  <rect x="540" y="130" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="155" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">시스템 테스트</text>

  <!-- 통합 테스트: 글자폭 ~77px, 박스폭 160px -->
  <rect x="460" y="200" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="540" y="225" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">통합 테스트</text>

  <!-- 단위 테스트: 글자폭 ~77px, 박스폭 110px -->
  <rect x="460" y="270" width="110" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="515" y="295" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">단위 테스트</text>

</svg>