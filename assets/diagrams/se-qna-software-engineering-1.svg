<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">V-모델</title>
  <desc id="d">왼쪽은 요구사항 분석, 시스템 설계, 상세 설계, 코딩으로 내려가고 오른쪽은 단위 테스트, 통합 테스트, 시스템 테스트, 인수 테스트로 올라간다. 같은 높이의 단계끼리 서로 대응한다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="120" y="36" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">개발 단계</text>
  <text x="760" y="36" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">테스트 단계</text>

  <!-- 같은 높이끼리 대응 (양방향) -->
  <line x1="206" y1="80" x2="674" y2="80" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <line x1="266" y1="168" x2="614" y2="168" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <line x1="326" y1="256" x2="554" y2="256" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <line x1="386" y1="344" x2="494" y2="344" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#ak)" marker-end="url(#ak)"/>

  <!-- 왼쪽: 내려가는 흐름 -->
  <line x1="150" y1="108" x2="150" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="210" y1="196" x2="210" y2="228" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="270" y1="284" x2="270" y2="316" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 오른쪽: 올라가는 흐름 -->
  <line x1="610" y1="316" x2="610" y2="284" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="670" y1="228" x2="670" y2="196" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="730" y1="140" x2="730" y2="108" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>

  <!-- 왼쪽 박스 -->
  <rect x="40" y="56" width="160" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="86" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">요구사항 분석</text>
  <rect x="100" y="144" width="160" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="180" y="174" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">시스템 설계</text>
  <rect x="160" y="232" width="160" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="240" y="262" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">상세 설계</text>
  <rect x="220" y="320" width="160" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="300" y="350" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">코딩</text>

  <!-- 오른쪽 박스 -->
  <rect x="680" y="56" width="160" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="760" y="86" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">인수 테스트</text>
  <rect x="620" y="144" width="160" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="700" y="174" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">시스템 테스트</text>
  <rect x="560" y="232" width="160" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="640" y="262" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">통합 테스트</text>
  <rect x="500" y="320" width="160" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="580" y="350" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">단위 테스트</text>
</svg>
