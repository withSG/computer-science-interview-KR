<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캡슐화와 계층별 PDU</title>
  <desc id="d">송신 측에서 HTTP 메시지가 응용에서 물리 계층으로 내려가며 TCP 헤더, IP 헤더, MAC 헤더와 FCS가 차례로 붙어 메시지, 세그먼트, 패킷, 프레임, 비트가 되는 캡슐화 과정과, 수신 측은 반대로 올라가며 헤더를 떼는 비캡슐화를 보여 줍니다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 머리 -->
  <text x="24" y="40" font-size="16" font-weight="700" fill="#111827">캡슐화 (송신 측)</text>
  <text x="718" y="40" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">PDU</text>

  <!-- 왼쪽: 계층 사슬 -->
  <rect x="24" y="60" width="116" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="24" y="150" width="116" height="40" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="24" y="264" width="116" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="24" y="356" width="116" height="40" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="24" y="448" width="116" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="82" y="86" fill="#1e3a8a">응용</text>
    <text x="82" y="176" fill="#065f46">전송</text>
    <text x="82" y="290" fill="#78350f">네트워크</text>
    <text x="82" y="382" fill="#4c1d95">데이터링크</text>
    <text x="82" y="474" fill="#1f2937">물리</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#ah)">
    <line x1="82" y1="104" x2="82" y2="146"/>
    <line x1="82" y1="194" x2="82" y2="260"/>
    <line x1="82" y1="308" x2="82" y2="352"/>
    <line x1="82" y1="400" x2="82" y2="444"/>
  </g>
  <text x="94" y="130" font-size="14" fill="#4b5563">아래로 전달</text>

  <!-- 1. 응용: 메시지 -->
  <rect x="400" y="60" width="150" height="40" fill="#dbeafe"/>
  <rect x="400" y="60" width="150" height="40" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="85" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">HTTP 메시지</text>
  <text x="550" y="122" font-size="15" fill="#1e3a8a" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /index.html HTTP/1.1 ...</text>

  <!-- 2. 전송: 세그먼트 -->
  <rect x="316" y="150" width="84" height="40" fill="#d1fae5"/>
  <rect x="400" y="150" width="150" height="40" fill="#dbeafe"/>
  <line x1="400" y1="150" x2="400" y2="190" stroke="#334155" stroke-width="1.5"/>
  <rect x="316" y="150" width="234" height="40" fill="none" stroke="#334155" stroke-width="1.5"/>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="358" y="175" fill="#065f46">TCP hdr</text>
    <text x="475" y="175" fill="#1e3a8a">HTTP 메시지</text>
  </g>
  <g font-size="15" fill="#065f46">
    <text x="316" y="212">출발지 포트 51234 / 목적지 포트 443</text>
    <text x="316" y="234">시퀀스 번호, ACK 번호, 윈도우 크기</text>
  </g>

  <!-- 3. 네트워크: 패킷 -->
  <rect x="240" y="264" width="76" height="40" fill="#fef3c7"/>
  <rect x="316" y="264" width="84" height="40" fill="#d1fae5"/>
  <rect x="400" y="264" width="150" height="40" fill="#dbeafe"/>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="316" y1="264" x2="316" y2="304"/>
    <line x1="400" y1="264" x2="400" y2="304"/>
  </g>
  <rect x="240" y="264" width="310" height="40" fill="none" stroke="#334155" stroke-width="1.5"/>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="278" y="289" fill="#78350f">IP hdr</text>
    <text x="358" y="289" fill="#065f46">TCP hdr</text>
    <text x="475" y="289" fill="#1e3a8a">HTTP 메시지</text>
  </g>
  <text x="240" y="326" font-size="15" fill="#78350f">출발지 IP 192.0.2.10 / 목적지 IP 203.0.113.5, TTL</text>

  <!-- 4. 데이터링크: 프레임 -->
  <rect x="156" y="356" width="84" height="40" fill="#ede9fe"/>
  <rect x="240" y="356" width="76" height="40" fill="#fef3c7"/>
  <rect x="316" y="356" width="84" height="40" fill="#d1fae5"/>
  <rect x="400" y="356" width="150" height="40" fill="#dbeafe"/>
  <rect x="550" y="356" width="56" height="40" fill="#ede9fe"/>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="240" y1="356" x2="240" y2="396"/>
    <line x1="316" y1="356" x2="316" y2="396"/>
    <line x1="400" y1="356" x2="400" y2="396"/>
    <line x1="550" y1="356" x2="550" y2="396"/>
  </g>
  <rect x="156" y="356" width="450" height="40" fill="none" stroke="#334155" stroke-width="1.5"/>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="198" y="381" fill="#4c1d95">MAC hdr</text>
    <text x="278" y="381" fill="#78350f">IP hdr</text>
    <text x="358" y="381" fill="#065f46">TCP hdr</text>
    <text x="475" y="381" fill="#1e3a8a">HTTP 메시지</text>
    <text x="578" y="381" fill="#4c1d95">FCS</text>
  </g>
  <g font-size="15" fill="#4c1d95">
    <text x="156" y="418">출발지/목적지 MAC</text>
    <text x="606" y="418" text-anchor="end">오류검출 트레일러</text>
  </g>

  <!-- 5. 물리: 비트 -->
  <rect x="156" y="448" width="450" height="40" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="381" y="474" font-size="16" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">1010110001110101...</text>

  <!-- 오른쪽: PDU 이름 -->
  <rect x="624" y="60" width="188" height="40" rx="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="624" y="150" width="188" height="40" rx="20" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="624" y="264" width="188" height="40" rx="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="624" y="356" width="188" height="40" rx="20" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="624" y="448" width="188" height="40" rx="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="718" y="86" fill="#1e3a8a">메시지(Message)</text>
    <text x="718" y="176" fill="#065f46">세그먼트(Segment)</text>
    <text x="718" y="290" fill="#78350f">패킷(Packet)</text>
    <text x="718" y="382" fill="#4c1d95">프레임(Frame)</text>
    <text x="718" y="474" fill="#1f2937">비트(Bit)</text>
  </g>

  <!-- 수신 측: 반대 방향 -->
  <line x1="846" y1="488" x2="846" y2="62" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="856" y="518" font-size="16" font-weight="700" fill="#111827" text-anchor="end">비캡슐화 (수신 측)</text>
  <text x="856" y="540" font-size="14" fill="#4b5563" text-anchor="end">헤더를 떼며 위로</text>

  <!-- 요점 -->
  <rect x="24" y="562" width="832" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="590" font-size="16" fill="#1f2937">하위 계층은 상위 계층 데이터를 뜯어보지 않고 <tspan font-weight="700">“그냥 바이트 덩어리”</tspan>로만 봅니다.</text>
</svg>
