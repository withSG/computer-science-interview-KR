<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">로드 밸런서 위치</title>
  <desc id="d">User에서 Load Balancer를 거쳐 Server 1, Server 2, Server 3으로 트래픽이 분산되는 아키텍처 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  
  <rect width="880" height="400" fill="#ffffff"/>
  
  <!-- User Box -->
  <rect x="370" y="30" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="60" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">User</text>
  
  <!-- User to Load Balancer Line & Arrow -->
  <path d="M440,80 L440,120" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Load Balancer Box -->
  <rect x="360" y="120" width="160" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="150" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Load</text>
  <text x="440" y="171" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Balancer</text>
  
  <!-- Distribution Lines & Arrows -->
  <path d="M440,190 L440,240" stroke="#059669" stroke-width="2" fill="none"/>
  <path d="M200,240 L680,240" stroke="#059669" stroke-width="2" fill="none"/>
  
  <path d="M200,240 L200,280" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <path d="M440,240 L440,280" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <path d="M680,240 L680,280" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  
  <!-- Server 1 Box -->
  <rect x="130" y="280" width="140" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="200" y="310" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Server 1</text>
  
  <!-- Server 2 Box -->
  <rect x="370" y="280" width="140" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="310" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Server 2</text>
  
  <!-- Server 3 Box -->
  <rect x="610" y="280" width="140" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="680" y="310" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Server 3</text>
</svg>