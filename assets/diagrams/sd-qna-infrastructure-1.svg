<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">로드 밸런서 위치</title>
  <desc id="d">User의 요청이 Load Balancer를 거쳐 Server 1, Server 2, Server 3으로 분산된다. 로드 밸런서는 사용자와 여러 서버 사이에 놓인다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="360" y="24" width="160" height="52" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">User</text>

  <line x1="440" y1="76" x2="440" y2="116" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>

  <!-- Load Balancer -->
  <rect x="310" y="122" width="260" height="62" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="440" y="160" font-size="20" font-weight="bold" fill="#4c1d95" text-anchor="middle">Load Balancer</text>

  <!-- 분산 -->
  <line x1="440" y1="184" x2="440" y2="224" stroke="#047857" stroke-width="2"/>
  <text x="456" y="210" font-size="15" font-weight="bold" fill="#047857">트래픽 분산</text>
  <line x1="180" y1="224" x2="700" y2="224" stroke="#047857" stroke-width="2"/>
  <line x1="180" y1="224" x2="180" y2="260" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="440" y1="224" x2="440" y2="260" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="700" y1="224" x2="700" y2="260" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- Servers -->
  <rect x="90" y="266" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="180" y="300" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">Server 1</text>
  <rect x="350" y="266" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="300" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">Server 2</text>
  <rect x="610" y="266" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="700" y="300" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">Server 3</text>
</svg>
