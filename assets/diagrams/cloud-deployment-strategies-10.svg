<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">전통적 방식과 Feature Flag 방식 비교</title>
  <desc id="d">전통적 방식은 코드 배포가 곧 기능 공개라 배포 시점과 공개 시점이 묶여 있다. Feature Flag 방식은 플래그 off로 코드를 배포해 두고, 며칠 뒤 배포 없이 플래그를 켜 내부 직원, 1%, 10%, 100% 순으로 넓히며, 문제를 발견하면 킬 스위치로 플래그를 꺼 롤백보다 빠른 초 단위로 막는다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ── 전통적 방식 ── -->
  <text x="24" y="44" font-size="18" font-weight="bold" fill="#111827">전통적 방식</text>
  <rect x="24" y="62" width="200" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="124" y="94" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">코드 배포 = 기능 공개</text>
  <text x="248" y="94" font-size="16" fill="#374151">배포 시점과 공개 시점이 <tspan font-weight="bold" fill="#111827">묶여 있다</tspan></text>

  <line x1="24" y1="142" x2="856" y2="142" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ── Feature Flag 방식 ── -->
  <text x="24" y="178" font-size="18" font-weight="bold" fill="#111827">Feature Flag 방식</text>

  <text x="124" y="206" font-size="14" fill="#4b5563" text-anchor="middle">배포 시점</text>
  <text x="440" y="206" font-size="14" fill="#4b5563" text-anchor="middle">공개 시점</text>

  <!-- ① 코드 배포 (플래그 off) -->
  <rect x="24" y="216" width="200" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="52" cy="252" r="13" fill="#1d4ed8"/>
  <text x="52" y="257" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="245" font-size="17" font-weight="bold" fill="#111827">코드 배포</text>
  <text x="76" y="270" font-size="15" fill="#374151">(플래그 off)</text>

  <line x1="124" y1="292" x2="124" y2="322" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="24" y="326" width="200" height="66" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="124" y="353" font-size="15" fill="#1f2937" text-anchor="middle">운영에 코드가 있지만</text>
  <text x="124" y="376" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">아무도 못 본다</text>

  <!-- ① → ② -->
  <line x1="232" y1="252" x2="315" y2="252" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="274" y="238" font-size="15" fill="#374151" text-anchor="middle">며칠 뒤,</text>
  <text x="274" y="280" font-size="15" fill="#374151" text-anchor="middle">배포 없이</text>

  <!-- ② 플래그 on -->
  <rect x="324" y="216" width="232" height="298" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="352" cy="252" r="13" fill="#047857"/>
  <text x="352" y="257" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="376" y="258" font-size="17" font-weight="bold" fill="#111827">플래그 on</text>
  <line x1="324" y1="288" x2="556" y2="288" stroke="#047857" stroke-width="1"/>

  <rect x="384" y="302" width="112" height="30" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="440" y="322" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">내부 직원</text>
  <line x1="440" y1="335" x2="440" y2="354" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="367" y="358" width="146" height="30" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
  <text x="440" y="378" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">1%</text>
  <line x1="440" y1="391" x2="440" y2="410" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="350" y="414" width="180" height="30" rx="6" fill="#a7f3d0" stroke="#047857" stroke-width="1.2"/>
  <text x="440" y="434" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">10%</text>
  <line x1="440" y1="447" x2="440" y2="466" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="336" y="470" width="208" height="30" rx="6" fill="#6ee7b7" stroke="#047857" stroke-width="1.2"/>
  <text x="440" y="490" font-size="15" font-weight="bold" fill="#064e3b" text-anchor="middle">100%</text>

  <!-- ② → ③ -->
  <line x1="564" y1="252" x2="647" y2="252" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="606" y="238" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">문제 발견</text>

  <!-- ③ 플래그 off (킬 스위치) -->
  <rect x="656" y="216" width="200" height="72" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="684" cy="252" r="13" fill="#b91c1c"/>
  <text x="684" y="257" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="708" y="245" font-size="17" font-weight="bold" fill="#111827">플래그 off</text>
  <text x="708" y="270" font-size="15" fill="#374151">(킬 스위치)</text>

  <line x1="756" y1="292" x2="756" y2="322" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="656" y="326" width="200" height="66" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="756" y="353" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">롤백보다 빠르다.</text>
  <text x="756" y="376" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">초 단위.</text>
</svg>
