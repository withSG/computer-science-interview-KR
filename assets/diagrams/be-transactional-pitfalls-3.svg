<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">REQUIRED와 REQUIRES_NEW의 차이</title>
  <desc id="d">Spring Framework 트랜잭션 전파 속성인 REQUIRED와 REQUIRES_NEW의 동작 및 트랜잭션 공유/분리 차이를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- ==================== SECTION 1: REQUIRED ==================== -->
  <g>
    <!-- 영역 구분을 위한 섹션 컨테이너 -->
    <rect x="24" y="24" width="832" height="230" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
    
    <!-- 섹션 헤더 -->
    <rect x="40" y="40" width="110" height="28" rx="4" fill="#2563eb"/>
    <text x="95" y="58" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">[REQUIRED]</text>
    <text x="162" y="58" fill="#1f2933" font-size="14" font-weight="bold">하나의 물리 트랜잭션을 공유한다</text>

    <!-- 타임라인/실행 흐름 -->
    <!-- outer() -->
    <text x="60" y="115" fill="#1f2933" font-size="13" font-weight="bold">outer()</text>
    
    <path d="M120,110 L200,110" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
    <text x="210" y="114" fill="#2563eb" font-size="13" font-weight="bold">BEGIN</text>

    <path d="M260,110 L680,110" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M680,110 L720,110" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
    <text x="730" y="114" fill="#2563eb" font-size="13" font-weight="bold">COMMIT/ROLLBACK</text>

    <!-- inner() 계층 구조 관계선 -->
    <path d="M230,110 L230,155 L250,155" stroke="#52606d" stroke-width="1.5" fill="none"/>
    
    <!-- inner() 내용 -->
    <text x="260" y="159" fill="#1f2933" font-size="13" font-weight="bold">inner()</text>
    <text x="315" y="159" fill="#52606d" font-size="13">(같은 커넥션, 같은 트랜잭션)</text>

    <!-- 예외 발생 영향 -->
    <path d="M280,165 L280,205 L300,205" stroke="#dc2626" stroke-width="1.5" fill="none"/>
    <text x="310" y="209" fill="#dc2626" font-size="13" font-weight="bold">여기서 예외 → 전체가 롤백된다</text>
  </g>

  <!-- ==================== SECTION 2: REQUIRES_NEW ==================== -->
  <g>
    <!-- 영역 구분을 위한 섹션 컨테이너 -->
    <rect x="24" y="274" width="832" height="272" rx="8" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1"/>
    
    <!-- 섹션 헤더 -->
    <rect x="40" y="290" width="140" height="28" rx="4" fill="#7c3aed"/>
    <text x="110" y="308" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">[REQUIRES_NEW]</text>
    <text x="192" y="308" fill="#1f2933" font-size="14" font-weight="bold">물리 트랜잭션이 두 개다</text>

    <!-- outer() 상단 흐름 -->
    <text x="60" y="365" fill="#1f2933" font-size="13" font-weight="bold">outer()</text>
    
    <path d="M120,360 L200,360" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
    <text x="210" y="364" fill="#7c3aed" font-size="13" font-weight="bold">BEGIN</text>

    <path d="M260,360 L290,360" stroke="#7c3aed" stroke-width="2"/>
    
    <!-- [보류] -->
    <rect x="290" y="346" width="54" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="317" y="363" fill="#d97706" font-size="12" font-weight="bold" text-anchor="middle">보류</text>

    <path d="M344,360 L410,360" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- [재개] -->
    <rect x="410" y="346" width="54" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="437" y="363" fill="#059669" font-size="12" font-weight="bold" text-anchor="middle">재개</text>

    <path d="M464,360 L680,360" stroke="#7c3aed" stroke-width="2"/>
    <path d="M680,360 L720,360" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
    <text x="730" y="364" fill="#7c3aed" font-size="13" font-weight="bold">COMMIT/ROLLBACK</text>

    <!-- outer() -> inner() 제어권 이전 화살표 (보류에서 아래로) -->
    <path d="M317,372 L317,422" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-ink)"/>
    
    <!-- inner() -> outer() 제어권 복귀 화살표 (재개로 위로) -->
    <path d="M437,422 L437,378" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-ink)"/>

    <!-- inner() 하단 흐름 -->
    <text x="60" y="435" fill="#1f2933" font-size="13" font-weight="bold">inner()</text>

    <text x="210" y="435" fill="#059669" font-size="13" font-weight="bold">BEGIN</text>
    <path d="M260,431 L380,431" stroke="#059669" stroke-width="2"/>
    <text x="385" y="435" fill="#059669" font-size="13" font-weight="bold">COMMIT</text>
    <text x="455" y="435" fill="#52606d" font-size="13">(별도 커넥션)</text>

    <!-- inner() 설명 텍스트 -->
    <path d="M230,442 L230,475 L250,475" stroke="#52606d" stroke-width="1.5" fill="none"/>
    <text x="260" y="479" fill="#1f2933" font-size="12.5">inner 가 롤백돼도 outer 는 영향받지 않고,</text>
    <text x="260" y="501" fill="#1f2933" font-size="12.5">outer 가 롤백돼도 inner 커밋은 남는다</text>
  </g>
</svg>