<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">양쪽에 커밋이 쌓인 분기</title>
  <desc id="d">c2에서 갈라진 뒤 feature에는 c3, c4가, main에는 c5, c6가 쌓였다. c2가 공통 조상(merge base)이고 main 끝 c6, feature 끝 c4와 함께 3-way merge의 세 지점이 된다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 간선 -->
  <line x1="134" y1="160" x2="226" y2="160" stroke="#64748b" stroke-width="2.5"/>
  <path d="M274,160 C330,160 330,80 376,80" fill="none" stroke="#6d28d9" stroke-width="2.5"/>
  <line x1="424" y1="80" x2="516" y2="80" stroke="#6d28d9" stroke-width="2.5"/>
  <path d="M274,160 C330,160 330,240 376,240" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="424" y1="240" x2="516" y2="240" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- 커밋 -->
  <circle cx="110" cy="160" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="110" y="166" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c1</text>
  <circle cx="250" cy="160" r="24" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="250" y="166" font-size="17" font-weight="bold" text-anchor="middle" fill="#92400e">c2</text>

  <circle cx="400" cy="80" r="24" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="400" y="86" font-size="17" font-weight="bold" text-anchor="middle" fill="#6d28d9">c3</text>
  <circle cx="540" cy="80" r="24" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
  <text x="540" y="86" font-size="17" font-weight="bold" text-anchor="middle" fill="#6d28d9">c4</text>

  <circle cx="400" cy="240" r="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="246" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d4ed8">c5</text>
  <circle cx="540" cy="240" r="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="540" y="246" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d4ed8">c6</text>

  <!-- 브랜치 포인터 -->
  <line x1="594" y1="80" x2="572" y2="80" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <rect x="598" y="64" width="100" height="32" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="648" y="86" font-size="16" font-weight="bold" text-anchor="middle" fill="#6d28d9">feature</text>
  <text x="716" y="86" font-size="15" fill="#4b5563">상대 쪽 끝</text>

  <line x1="594" y1="240" x2="572" y2="240" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="598" y="224" width="100" height="32" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="648" y="246" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">main</text>
  <text x="716" y="246" font-size="15" fill="#4b5563">내 쪽 끝</text>

  <!-- 공통 조상 -->
  <line x1="250" y1="272" x2="250" y2="192" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <rect x="100" y="276" width="300" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="302" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">c2 = 공통 조상 (merge base)</text>
</svg>
