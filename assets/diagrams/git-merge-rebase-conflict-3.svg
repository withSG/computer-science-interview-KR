<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3-way merge 브랜치 구조</title>
  <desc id="d">feature 브랜치와 main 브랜치가 c2 커밋에서 분기되어 각각 c4, c6까지 커밋이 쌓인 3-way merge 구조 diagram</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 연결선 -->
  <!-- c1 - - c2 -->
  <path d="M 120,150 L 170,150" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>

  <!-- c2 -> c3 (feature branch) -->
  <path d="M 230,150 L 270,150 L 300,90" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- c3 - - c4 -->
  <path d="M 350,90 L 400,90" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- c2 -> c5 (main branch) -->
  <path d="M 230,150 L 270,150 L 300,210" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- c5 - - c6 -->
  <path d="M 350,210 L 400,210" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- c2 = 공통 조상 (merge base) 지시선 -->
  <path d="M 440,150 L 230,150" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-amber)"/>

  <!-- c1 노드 -->
  <rect x="60" y="125" width="60" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="90" y="155" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">c1</text>

  <!-- c2 노드 (공통 조상) -->
  <rect x="170" y="125" width="60" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="155" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">c2</text>

  <!-- c3 노드 -->
  <rect x="290" y="65" width="60" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="95" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">c3</text>

  <!-- c4 노드 -->
  <rect x="400" y="65" width="60" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="95" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">c4</text>

  <!-- c5 노드 -->
  <rect x="290" y="185" width="60" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="215" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">c5</text>

  <!-- c6 노드 -->
  <rect x="400" y="185" width="60" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="215" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">c6</text>

  <!-- 라벨: feature -->
  <text x="500" y="95" font-size="14" font-weight="bold" fill="#2563eb">feature</text>

  <!-- 라벨: main -->
  <text x="500" y="215" font-size="14" font-weight="bold" fill="#7c3aed">main</text>

  <!-- 주석 라벨: c2 = 공통 조상 (merge base) -->
  <rect x="440" y="136" width="220" height="28" rx="4" fill="#ffffff"/>
  <text x="445" y="155" font-size="13" font-weight="bold" fill="#d97706">c2 = 공통 조상 (merge base)</text>
</svg>