<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컬럼 이름 변경 5단계</title>
  <desc id="d">phone 컬럼을 phone_number로 바꾸는 과정을 새 컬럼 추가, v2 이중 쓰기 배포, 백필, v3 배포, 안정화 후 phone DROP의 다섯 단계로 보여주고, 각 단계를 Expand·Migrate·Contract 구간으로 묶는다. v2 단계에서는 v1으로 롤백해도 phone이 최신이라 안전하다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- caption -->
  <text x="170" y="40" font-size="16" fill="#374151">예: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">phone</tspan> → <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">phone_number</tspan> 컬럼 이름 변경</text>

  <!-- phase bands -->
  <rect x="24" y="60" width="122" height="216" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="85" y="174" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Expand</text>

  <rect x="24" y="304" width="122" height="140" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="85" y="380" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">Migrate</text>

  <rect x="24" y="472" width="122" height="56" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="85" y="506" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">Contract</text>

  <!-- step 1 -->
  <rect x="170" y="60" width="686" height="56" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="202" cy="88" r="16" fill="#1d4ed8"/>
  <text x="202" y="94" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="232" y="94" font-size="17" fill="#1f2937"><tspan font-weight="bold">새 컬럼 </tspan><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">phone_number</tspan><tspan font-weight="bold"> 추가</tspan> (nullable)</text>

  <line x1="202" y1="120" x2="202" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <rect x="170" y="144" width="686" height="132" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="202" cy="172" r="16" fill="#1d4ed8"/>
  <text x="202" y="178" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="232" y="178" font-size="17" font-weight="bold" fill="#1f2937">v2 배포: 두 컬럼 모두에 쓴다 (이중 쓰기)</text>
  <text x="232" y="208" font-size="16" fill="#374151">읽기는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">phone_number</tspan> 우선, <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">NULL</tspan>이면 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">phone</tspan>으로 폴백</text>
  <rect x="232" y="224" width="520" height="36" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="248" y="248" font-size="16" fill="#047857">→ 이 시점에 v1으로 롤백해도 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">phone</tspan>이 최신이라 <tspan font-weight="bold">안전</tspan>하다</text>

  <line x1="202" y1="280" x2="202" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="170" y="304" width="686" height="56" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="202" cy="332" r="16" fill="#b45309"/>
  <text x="202" y="338" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="232" y="338" font-size="17" fill="#1f2937"><tspan font-weight="bold">백필:</tspan> 기존 행의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">phone</tspan> → <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">phone_number</tspan> 복사 (청크 단위)</text>

  <line x1="202" y1="364" x2="202" y2="384" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <rect x="170" y="388" width="686" height="56" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="202" cy="416" r="16" fill="#b45309"/>
  <text x="202" y="422" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="232" y="422" font-size="17" fill="#1f2937"><tspan font-weight="bold">v3 배포:</tspan> <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">phone_number</tspan>만 읽고 쓴다</text>

  <line x1="202" y1="448" x2="202" y2="468" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 5 -->
  <rect x="170" y="472" width="686" height="56" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="202" cy="500" r="16" fill="#6d28d9"/>
  <text x="202" y="506" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="232" y="506" font-size="17" fill="#1f2937">안정화 후 <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">phone</tspan> <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DROP</tspan></text>
</svg>
