<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Scale Out (수평 확장)</title>
  <desc id="d">트래픽 증가 시 Auto Scaling Group을 통한 서버 인스턴스 자동 확장 과정 및 설정 예시 다이어그램</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title/Header Area -->
  <text x="30" y="41" font-size="16" font-weight="bold" fill="#1f2933">Scale Out (수평 확장)</text>
  <text x="30" y="70" font-size="13" fill="#52606d">트래픽 증가 시 서버 인스턴스 추가</text>

  <!-- Main Auto Scaling Group Area -->
  <rect x="30" y="90" width="820" height="150" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="50" y="121" font-size="14" font-weight="bold" fill="#1f2933">Auto Scaling Group</text>

  <!-- Server Instances -->
  <!-- Existing Instances (S) -->
  <g>
    <rect x="50" y="140" width="60" height="70" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="80" y="179" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">S</text>
  </g>
  <g>
    <rect x="125" y="140" width="60" height="70" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="155" y="179" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">S</text>
  </g>
  <g>
    <rect x="200" y="140" width="60" height="70" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="230" y="179" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">S</text>
  </g>

  <!-- Added Instances (+) -->
  <g>
    <rect x="275" y="140" width="60" height="70" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="305" y="179" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">+</text>
  </g>
  <g>
    <rect x="350" y="140" width="60" height="70" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="380" y="179" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">+</text>
  </g>

  <!-- Auto Scale Arrow & Text -->
  <path d="M 520 175 L 430 175" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <text x="530" y="179" font-size="13" font-weight="bold" fill="#1f2933">← 자동 확장</text>

  <!-- Settings / Rules Section -->
  <rect x="30" y="260" width="820" height="80" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="50" y="286" font-size="13" font-weight="bold" fill="#1f2933">설정 예시:</text>
  <text x="50" y="308" font-size="13" fill="#52606d">- CPU 70% 이상 → 인스턴스 추가</text>
  <text x="50" y="328" font-size="13" fill="#52606d">- 요청 수 10,000/초 이상 → 인스턴스 추가</text>
</svg>