<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">선언 종류별 스코프 안 접근 가능 구간</title>
  <desc id="d">스코프 시작부터 끝까지 var는 전 구간 읽기 가능(undefined에서 할당된 값으로), let은 선언문 위치 전까지 TDZ(일시적 사각지대)라 읽으면 ReferenceError, 함수 선언문(fn)은 전 구간 호출 가능함을 가로 막대로 보여 준다. 셋 모두 생성 단계에 등록되고 초기화 시점만 다르다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <!-- 시간 축 기준점 -->
  <text x="170" y="44" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">스코프 시작</text>
  <text x="470" y="44" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">선언문 위치</text>
  <text x="820" y="44" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">스코프 끝</text>
  <line x1="170" y1="56" x2="170" y2="340" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="470" y1="56" x2="470" y2="340" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="820" y1="56" x2="820" y2="340" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- var -->
  <text x="40" y="130" font-size="22" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">var</text>
  <polygon points="163,80 177,80 170,93" fill="#111827"/>
  <text x="184" y="92" font-size="14" font-weight="bold" fill="#111827">초기화 (<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">undefined</tspan>)</text>
  <rect x="170" y="100" width="300" height="46" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="470" y="100" width="350" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="129" font-size="16" fill="#1e3a8a" text-anchor="middle">읽기 가능 · <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">undefined</tspan></text>
  <text x="645" y="129" font-size="16" fill="#1e3a8a" text-anchor="middle">읽기 가능 · <tspan font-weight="bold">할당된 값</tspan></text>

  <!-- let -->
  <text x="40" y="220" font-size="22" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">let</text>
  <polygon points="463,170 477,170 470,183" fill="#111827"/>
  <text x="484" y="182" font-size="14" font-weight="bold" fill="#111827">초기화 (선언문 도달 시)</text>
  <rect x="170" y="190" width="300" height="46" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="470" y="190" width="350" height="46" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="219" font-size="16" fill="#991b1b" text-anchor="middle"><tspan font-weight="bold">TDZ</tspan> · 읽으면 <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ReferenceError</tspan></text>
  <text x="645" y="219" font-size="16" fill="#1e3a8a" text-anchor="middle">읽기 가능</text>

  <!-- fn (함수 선언문) -->
  <text x="40" y="300" font-size="22" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fn</text>
  <text x="40" y="320" font-size="14" fill="#4b5563">함수 선언문</text>
  <polygon points="163,260 177,260 170,273" fill="#111827"/>
  <text x="184" y="272" font-size="14" font-weight="bold" fill="#111827">초기화 (함수 객체)</text>
  <rect x="170" y="280" width="650" height="46" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="495" y="309" font-size="16" fill="#065f46" text-anchor="middle">전 구간 <tspan font-weight="bold">호출 가능</tspan></text>

  <!-- 범례·결론 -->
  <line x1="24" y1="356" x2="856" y2="356" stroke="#e5e7eb" stroke-width="1"/>
  <polygon points="40,375 54,375 47,388" fill="#111827"/>
  <text x="62" y="387" font-size="15" fill="#111827">초기화 시점</text>
  <rect x="176" y="375" width="24" height="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="210" y="387" font-size="15" fill="#111827"><tspan font-weight="bold">TDZ</tspan>(Temporal Dead Zone, 일시적 사각지대)</text>
  <text x="40" y="416" font-size="15" fill="#374151">등록은 셋 모두 생성 단계에 끝난다. 갈리는 것은 <tspan font-weight="bold" fill="#111827">초기화가 언제 되는가</tspan> 하나뿐.</text>
</svg>
