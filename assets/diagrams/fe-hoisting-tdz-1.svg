<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">호이스팅의 실체 — 등록과 초기화</title>
  <desc id="d">스코프 시작부터 끝까지 var, let, fn 선언의 실행 및 TDZ 구간을 나타낸 다이어그램입니다.</desc>
  
  <!-- 배경 -->
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- 헤딩 (문서 헤딩 사용) -->
  <text x="30" y="45" font-size="16" font-weight="bold" fill="#1f2933">2. 호이스팅의 실체 — 등록과 초기화</text>

  <!-- 수직 기준선 (스코프 시작, 선언문 위치, 스코프 끝) -->
  <!-- 1. 스코프 시작 (x = 100) -->
  <line x1="100" y1="95" x2="100" y2="330" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="100" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">스코프 시작</text>

  <!-- 2. 선언문 위치 (x = 380) -->
  <line x1="380" y1="95" x2="380" y2="330" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="380" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">선언문 위치</text>

  <!-- 3. 스코프 끝 (x = 640) -->
  <line x1="640" y1="95" x2="640" y2="330" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="640" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">스코프 끝</text>

  <!-- Row 1: var -->
  <text x="50" y="140" font-size="14" font-weight="bold" fill="#1f2933">var</text>
  <!-- 전 구간 (100 ~ 640) -->
  <rect x="100" y="120" width="540" height="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="655" y="140" font-size="12" fill="#52606d">전 구간 읽기 가능(undefined→값)</text>

  <!-- Row 2: let -->
  <text x="50" y="210" font-size="14" font-weight="bold" fill="#1f2933">let</text>
  <!-- TDZ 구간 (100 ~ 380) -->
  <rect x="100" y="190" width="280" height="30" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <!-- 읽기 가능 구간 (380 ~ 640) -->
  <rect x="380" y="190" width="260" height="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="655" y="210" font-size="12" fill="#52606d">TDZ (읽으면 ReferenceError)</text>

  <!-- Row 3: fn -->
  <text x="50" y="280" font-size="14" font-weight="bold" fill="#1f2933">fn</text>
  <!-- 전 구간 (100 ~ 640) -->
  <rect x="100" y="260" width="540" height="30" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="655" y="280" font-size="12" fill="#52606d">전 구간 호출 가능</text>

  <!-- 범례 (Legend) -->
  <rect x="100" y="325" width="12" height="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="118" y="335" font-size="11.5" fill="#52606d">읽기 가능 / 실행 가능</text>

  <rect x="250" y="325" width="12" height="12" fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="268" y="335" font-size="11.5" fill="#52606d">TDZ (일시적 사각지대)</text>

  <rect x="420" y="325" width="12" height="12" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="438" y="335" font-size="11.5" fill="#52606d">함수 생성 및 완전 초기화</text>
</svg>