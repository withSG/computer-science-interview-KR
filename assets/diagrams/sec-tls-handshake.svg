<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TLS 핸드셰이크와 인증서 검증 4단계</title>
  <desc id="d">Client와 Server 간의 TLS 핸드셰이크 과정과 Server Certificate 수신 시 수행하는 4단계 인증서 검증 절차, 그리고 세션 키 합의 전 (SNI는 평문)과 암호화 구간의 분리를 보여주는 시퀀스 다이어그램입니다.</desc>
  
  <!-- 배경 흰색 rect -->
  <rect width="880" height="720" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마크 정의 -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 메인 제목 (y=35) -->
  <text x="440" y="35" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">TLS 핸드셰이크와 인증서 검증 4단계</text>

  <!-- 범례 및 섹션 배경 밴드 (세션 키 합의 전 (SNI는 평문) vs 암호화 구간) -->
  <!-- 세션 키 합의 전 (SNI는 평문) 배경 (y: 110 ~ 320, h=210) -->
  <rect x="30" y="110" width="510" height="210" fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-dasharray="4 4" rx="4"/>
  <rect x="40" y="118" width="180" height="22" fill="#d97706" rx="3"/>
  <text x="130" y="133" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">세션 키 합의 전 (SNI는 평문)</text>

  <!-- 암호화 구간 배경 (y: 390 ~ 620, h=230) -->
  <rect x="30" y="390" width="510" height="230" fill="#ecfdf5" stroke="#059669" stroke-width="1" stroke-dasharray="4 4" rx="4"/>
  <rect x="40" y="398" width="90" height="22" fill="#059669" rx="3"/>
  <text x="85" y="413" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">암호화 구간</text>

  <!-- Lifeline Header Blocks -->
  <!-- Client: x=130, width=120 -> 중심 x=190 -->
  <rect x="130" y="60" width="120" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="190" y="82" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">Client</text>

  <!-- Server: x=370, width=120 -> 중심 x=430 -->
  <rect x="370" y="60" width="120" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="430" y="82" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">Server</text>

  <!-- Lifeline vertical lines -->
  <line x1="190" y1="96" x2="190" y2="650" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="430" y1="96" x2="430" y2="650" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Pre-condition label -->
  <text x="310" y="105" font-size="11" fill="#52606d" text-anchor="middle">(TCP 연결 수립 완료 상태)</text>

  <!-- 1. ClientHello (y=150) -->
  <path d="M190,150 L430,150" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="235" y="133" width="150" height="16" fill="#ffffff"/>
  <text x="310" y="145" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">1. ClientHello</text>
  <text x="310" y="167" font-size="11.5" fill="#52606d" text-anchor="middle">TLS 버전, Cipher Suite 목록, 클라이언트 랜덤, SNI(평문)</text>

  <!-- 2. ServerHello + Certificate (y=210) -->
  <path d="M430,210 L190,210" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="210" y="193" width="200" height="16" fill="#ffffff"/>
  <text x="310" y="205" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">2. ServerHello + Certificate</text>
  <text x="310" y="227" font-size="11.5" fill="#52606d" text-anchor="middle">선택한 버전/Cipher Suite, 서버 랜덤, 인증서 체인</text>

  <!-- 점선 분기선: Certificate 수신 지점 (y=210) -> 검증 패널 (x=570) -->
  <path d="M190,210 Q380,240 570,240" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#a-ink)"/>

  <!-- 오른쪽: 인증서 검증 4단계 패널 (x=570, y=140, w=280, h=210) -->
  <rect x="570" y="140" width="280" height="210" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
  
  <!-- 패널 제목 -->
  <rect x="580" y="152" width="260" height="26" fill="#dc2626" rx="4"/>
  <text x="710" y="169" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">클라이언트가 검증하는 네 가지</text>

  <!-- 4개 검증 항목 박스 -->
  <!-- Step 1 -->
  <rect x="585" y="188" width="250" height="30" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="595" y="207" font-size="11.5" font-weight="600" fill="#dc2626">① CA 서명 체인</text>
  <text x="695" y="207" font-size="11.5" fill="#1f2933">신뢰 루트까지 이어지는가</text>

  <!-- Step 2 -->
  <rect x="585" y="224" width="250" height="30" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="595" y="243" font-size="11.5" font-weight="600" fill="#dc2626">② 유효기간</text>
  <text x="670" y="243" font-size="11.5" fill="#1f2933">현재 유효기간 안인가</text>

  <!-- Step 3 -->
  <rect x="585" y="260" width="250" height="30" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="595" y="279" font-size="11.5" font-weight="600" fill="#dc2626">③ 도메인(SAN)</text>
  <text x="690" y="279" font-size="11.5" fill="#1f2933">접속 대상과 일치하는가</text>

  <!-- Step 4 -->
  <rect x="585" y="296" width="250" height="30" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="595" y="315" font-size="11.5" font-weight="600" fill="#dc2626">④ 폐기 여부</text>
  <text x="675" y="315" font-size="11.5" fill="#1f2933">폐기되지 않았는가 (OCSP/CRL)</text>

  <text x="710" y="341" font-size="11" font-weight="500" fill="#dc2626" text-anchor="middle">※ 하나라도 실패 시 사용자 경고 발생</text>

  <!-- 3. 키 합의 (ECDHE) (y=360) - 평문/암호화 전이 구간 -->
  <path d="M190,360 L430,360" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
  <path d="M430,360 L190,360" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
  <rect x="210" y="343" width="200" height="16" fill="#ffffff"/>
  <text x="310" y="355" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">3. 키 합의 (ECDHE 공개값 교환)</text>
  <text x="310" y="377" font-size="11.5" fill="#52606d" text-anchor="middle">양쪽이 각자 계산하여 동일한 대칭 세션 키 생성</text>

  <!-- 4. Finished (y=440) -->
  <path d="M190,440 L430,440" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M430,440 L190,440" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="220" y="423" width="180" height="16" fill="#ffffff"/>
  <text x="310" y="435" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">4. Finished 메시지 교환</text>
  <text x="310" y="457" font-size="11.5" fill="#52606d" text-anchor="middle">핸드셰이크 메시지 해시 검증 (위변조 탐지)</text>

  <!-- 5. 애플리케이션 데이터 통신 (y=530 ~ 590) -->
  <rect x="180" y="500" width="260" height="100" fill="#ffffff" stroke="#059669" stroke-width="1.5" rx="6"/>
  <text x="310" y="522" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">암호화 데이터 통신 (HTTP)</text>
  
  <path d="M200,545 L420,545" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <text x="310" y="540" font-size="11.5" fill="#059669" text-anchor="middle">HTTP Request (대칭 세션 키 암호화)</text>

  <path d="M420,580 L200,580" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <text x="310" y="575" font-size="11.5" fill="#059669" text-anchor="middle">HTTP Response (대칭 세션 키 암호화)</text>

  <!-- 확보되는 3가지 자산 설명 박스 (오른쪽 하단: x=570, y=430, w=280, h=190) -->
  <rect x="570" y="430" width="280" height="190" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
  <rect x="580" y="442" width="260" height="24" fill="#52606d" rx="3"/>
  <text x="710" y="458" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">핸드셰이크 완료 후 확보되는 3가지</text>

  <text x="585" y="490" font-size="11.5" font-weight="600" fill="#1f2933">(1) 서버 신원 증명</text>
  <text x="600" y="508" font-size="11" fill="#52606d">상대가 해당 도메인의 소유자임</text>

  <text x="585" y="535" font-size="11.5" font-weight="600" fill="#1f2933">(2) 공유 대칭 세션 키</text>
  <text x="600" y="553" font-size="11" fill="#52606d">양쪽만 알고 있는 비밀 키 확보</text>

  <text x="585" y="580" font-size="11.5" font-weight="600" fill="#1f2933">(3) 무결성 확인</text>
  <text x="600" y="598" font-size="11" fill="#52606d">이전 교환 메시지의 변조 없음 검증</text>

  <!-- 결론 캡션 (y=690) -->
  <text x="440" y="690" font-size="11.5" fill="#52606d" text-anchor="middle">결론: TLS 핸드셰이크는 인증서 검증을 통해 상대 신원을 확인하고, 안전하게 대칭 세션 키를 합의하여 암호화 통신을 개시한다.</text>
</svg>