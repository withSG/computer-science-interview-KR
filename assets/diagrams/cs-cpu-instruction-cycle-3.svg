<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JUMP 명령어와 PC</title>
  <desc id="d">JUMP 300 실행 과정. Fetch에서 PC를 일단 104로 올려 두지만, Execute에서 PC에 300을 넣어 방금 넣은 104를 덮어쓴다. 그래서 다음 사이클의 Fetch는 300번지에서 시작한다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ① Fetch -->
  <rect x="24" y="24" width="832" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M32,24 H168 V120 H32 Q24,120 24,112 V32 Q24,24 32,24 Z" fill="#1d4ed8"/>
  <text x="96" y="78" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">① Fetch</text>
  <g font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="224" y="60" text-anchor="end" font-weight="bold">IR</text>
    <text x="242" y="60" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="262" y="60">MEM[100]</text>
  </g>
  <text x="352" y="59" font-size="15" fill="#4b5563">(= <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#111827">JUMP 300</tspan>)</text>
  <rect x="184" y="78" width="122" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <g font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="224" y="99" text-anchor="end" font-weight="bold">PC</text>
    <text x="242" y="99" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="262" y="99" font-weight="bold" fill="#b45309">104</text>
  </g>
  <line x1="352" y1="93" x2="314" y2="93" stroke="#b45309" stroke-width="2" marker-end="url(#aha)"/>
  <text x="362" y="98" font-size="16" font-weight="bold" fill="#b45309">일단 습관적으로 +4 해둔다</text>

  <!-- ② Decode -->
  <rect x="24" y="132" width="832" height="56" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M32,132 H168 V188 H32 Q24,188 24,180 V140 Q24,132 32,132 Z" fill="#6d28d9"/>
  <text x="96" y="166" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">② Decode</text>
  <text x="192" y="166" font-size="17" fill="#111827">"분기 명령어이고 목적지는 300"</text>

  <!-- ③ Execute -->
  <rect x="24" y="200" width="832" height="56" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M32,200 H168 V256 H32 Q24,256 24,248 V208 Q24,200 32,200 Z" fill="#047857"/>
  <text x="96" y="234" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">③ Execute</text>
  <rect x="184" y="213" width="122" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <g font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="224" y="234" text-anchor="end" font-weight="bold">PC</text>
    <text x="242" y="234" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="262" y="234" font-weight="bold" fill="#b91c1c">300</text>
  </g>
  <line x1="352" y1="228" x2="314" y2="228" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahr)"/>
  <text x="362" y="233" font-size="16" font-weight="bold" fill="#b91c1c">방금 넣은 104를 덮어쓴다</text>

  <!-- 결과 -->
  <rect x="24" y="276" width="832" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <line x1="48" y1="304" x2="84" y2="304" stroke="#047857" stroke-width="2.5" marker-end="url(#ahg)"/>
  <text x="98" y="310" font-size="17" fill="#064e3b">다음 사이클의 Fetch는 <tspan font-weight="bold">300번지</tspan>에서 시작한다.</text>
</svg>
