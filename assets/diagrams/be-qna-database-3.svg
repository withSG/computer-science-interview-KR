<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3NF 예시</title>
  <desc id="d">2NF의 이행 함수 종속이 3NF의 학생 및 학과 테이블로 정규화되는 과정을 나타낸 다이어그램</desc>
  
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Section 1: 2NF -->
  <g id="section-2nf">
    <rect x="40" y="30" width="800" height="110" rx="6" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
    
    <text x="60" y="60" font-size="14" font-weight="bold" fill="#d97706">[2NF - 이행 함수 종속]</text>
    
    <!-- Box 1: 학생ID -->
    <rect x="180" y="75" width="120" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="240" y="99" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학생ID</text>
    
    <!-- Arrow 1 -->
    <path d="M300,95 L380,95" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
    
    <!-- Box 2: 학과코드 -->
    <rect x="380" y="75" width="120" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="440" y="99" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학과코드</text>
    
    <!-- Arrow 2 -->
    <path d="M500,95 L580,95" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
    
    <!-- Box 3: 학과명 -->
    <rect x="580" y="75" width="120" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="640" y="99" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학과명</text>
  </g>

  <!-- Transition Arrow -->
  <g id="transition">
    <path d="M440,140 L440,170" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  </g>

  <!-- Section 2: 3NF -->
  <g id="section-3nf">
    <rect x="40" y="180" width="800" height="130" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    
    <text x="60" y="210" font-size="14" font-weight="bold" fill="#059669">[3NF]</text>
    
    <!-- Table 1: 학생 -->
    <rect x="180" y="230" width="230" height="50" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="295" y="260" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학생(학생ID, 학과코드)</text>
    
    <!-- Table 2: 학과 -->
    <rect x="470" y="230" width="230" height="50" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="585" y="260" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학과(학과코드, 학과명)</text>
  </g>
</svg>