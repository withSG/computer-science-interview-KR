<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">2의 보수의 발상</title>
  <desc id="d">8비트에서 5를 비트 반전 후 1을 더해 -5(1111 1011)를 만드는 과정 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 헤더 / 영역 카드 -->
  <rect x="24" y="24" width="832" height="292" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  
  <!-- Title / Section header -->
  <rect x="24" y="24" width="832" height="48" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <!-- Sub-mask to clean bottom corners of top header card -->
  <rect x="25" y="60" width="830" height="12" fill="#eff6ff"/>
  <text x="44" y="53" font-size="16" font-weight="bold" fill="#2563eb">8비트에서 -5 만들기</text>

  <!-- Step 1: 5 = 0000 0101 -->
  <rect x="48" y="92" width="220" height="44" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="64" y="119" font-size="14" font-weight="bold" fill="#1f2933">5</text>
  <text x="140" y="119" font-size="14" fill="#52606d">=</text>
  <rect x="160" y="100" width="96" height="28" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="208" y="118" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle" font-family="monospace">0000 0101</text>

  <!-- Flow 1: Down arrow + 비트 반전 -->
  <path d="M158,136 L158,162" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="170" y="139" width="76" height="20" fill="#ffffff" rx="3" stroke="#cbd2d9" stroke-width="1"/>
  <text x="208" y="153" font-size="11.5" fill="#52606d" text-anchor="middle">비트 반전</text>

  <!-- Step 2: 1111 1010 -->
  <rect x="48" y="164" width="220" height="44" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <rect x="160" y="172" width="96" height="28" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="208" y="190" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle" font-family="monospace">1111 1010</text>

  <!-- Flow 2: Down arrow + +1 -->
  <path d="M158,208 L158,234" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="180" y="211" width="36" height="20" fill="#ffffff" rx="3" stroke="#cbd2d9" stroke-width="1"/>
  <text x="198" y="225" font-size="11.5" font-weight="bold" fill="#059669" text-anchor="middle">+1</text>

  <!-- Step 3: 1111 1011 (Result: -5) -->
  <rect x="48" y="236" width="460" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="160" y="246" width="96" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="208" y="264" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle" font-family="monospace">1111 1011</text>

  <!-- Left arrow pointing to result label -->
  <path d="M280,260 L312,260" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="324" y="265" font-size="14" font-weight="bold" fill="#7c3aed">이것이 -5</text>
</svg>