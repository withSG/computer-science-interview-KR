<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Minor GC — Eden·Survivor 사이 객체 이동과 승격</title>
  <desc id="d">Eden 및 Survivor 영역 간의 살아있는 객체 이동, age 증가, Eden/S0 비우기, 그리고 Old 영역으로의 승격 프로세스를 보여주는 Minor GC 흐름도입니다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 다이어그램 제목 및 범례 -->
  <text x="40" y="40" font-size="17" font-weight="600" fill="#1f2933">Minor GC — Eden·Survivor 사이 객체 이동과 승격</text>
  
  <rect x="520" y="24" width="12" height="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="2"/>
  <text x="538" y="34" font-size="11" fill="#1f2933">살아있는 객체(복사 대상)</text>
  
  <rect x="680" y="24" width="12" height="12" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="2"/>
  <text x="698" y="34" font-size="11" fill="#52606d">죽은 객체(처리 안 함)</text>

  <!-- 구역 1: GC 실행 전 상태 (Y: 60 ~ 230) -->
  <rect x="40" y="60" width="800" height="170" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="6"/>
  <text x="60" y="85" font-size="14" font-weight="600" fill="#1f2933">1. Minor GC 발동 전 메모리 상태 (Eden 꽉 참)</text>

  <!-- Eden 영역 -->
  <rect x="60" y="100" width="340" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="70" y="120" font-size="13" font-weight="500" fill="#1f2933">Eden 영역</text>
  <!-- TLAB 표현 -->
  <rect x="70" y="130" width="110" height="25" fill="#f8fafc" stroke="#cbd2d9" stroke-dasharray="3 3" rx="3"/>
  <text x="75" y="146" font-size="11" fill="#52606d">TLAB (할당 구간)</text>
  <!-- Eden 객체들 -->
  <rect x="70" y="165" width="70" height="35" fill="#f8fafc" stroke="#9aa5b1" rx="3"/>
  <text x="105" y="187" font-size="11.5" text-anchor="middle" fill="#52606d">죽은 객체</text>
  <rect x="150" y="165" width="85" height="35" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="3"/>
  <text x="192" y="187" font-size="11.5" text-anchor="middle" fill="#059669">라이브 객체</text>
  <rect x="245" y="165" width="70" height="35" fill="#f8fafc" stroke="#9aa5b1" rx="3"/>
  <text x="280" y="187" font-size="11.5" text-anchor="middle" fill="#52606d">죽은 객체</text>

  <!-- Survivor S0 영역 -->
  <rect x="420" y="100" width="200" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="430" y="120" font-size="13" font-weight="500" fill="#1f2933">Survivor 0 (S0, From)</text>
  <rect x="430" y="135" width="85" height="35" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="3"/>
  <text x="472" y="152" font-size="11.5" text-anchor="middle" fill="#059669">라이브 객체</text>
  <text x="472" y="164" font-size="11" text-anchor="middle" fill="#059669">(age = 2)</text>
  <rect x="525" y="135" width="85" height="35" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="3"/>
  <text x="567" y="152" font-size="11.5" text-anchor="middle" fill="#7c3aed">임계값 초과</text>
  <text x="567" y="164" font-size="11" text-anchor="middle" fill="#7c3aed">(age > 15)</text>

  <!-- Survivor S1 영역 -->
  <rect x="640" y="100" width="180" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="650" y="120" font-size="13" font-weight="500" fill="#1f2933">Survivor 1 (S1, To)</text>
  <rect x="650" y="135" width="160" height="65" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 4" rx="3"/>
  <text x="730" y="172" font-size="11.5" text-anchor="middle" fill="#d97706">비어 있음 (To 공간)</text>

  <!-- GC 처리 과정 화살표 (Y: 230 ~ 290) -->
  <path d="M192,210 L192,270 L680,270 L680,330" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="290" y="260" width="170" height="20" fill="#ffffff" stroke="#059669" rx="3"/>
  <text x="375" y="274" font-size="11.5" text-anchor="middle" fill="#059669">살아있는 객체 복사 (age +1)</text>

  <path d="M472,210 L472,250 L730,250 L730,330" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-green)"/>

  <path d="M567,210 L567,290 L490,290 L490,330" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="500" y="280" width="150" height="20" fill="#ffffff" stroke="#7c3aed" rx="3"/>
  <text x="575" y="294" font-size="11.5" text-anchor="middle" fill="#7c3aed">승격 (MaxTenuringThreshold)</text>

  <!-- 구역 2: GC 실행 후 상태 (Y: 310 ~ 480) -->
  <rect x="40" y="310" width="800" height="170" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="6"/>
  <text x="60" y="335" font-size="14" font-weight="600" fill="#1f2933">2. Minor GC 수행 직후 결과 메모리 상태</text>

  <!-- 비워진 Eden -->
  <rect x="60" y="350" width="180" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="70" y="370" font-size="13" font-weight="500" fill="#1f2933">Eden 영역</text>
  <rect x="70" y="385" width="160" height="65" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="4 4" rx="3"/>
  <text x="150" y="422" font-size="11.5" text-anchor="middle" fill="#2563eb">통째로 비움 (CLEAR)</text>

  <!-- 비워진 S0 -->
  <rect x="250" y="350" width="180" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="260" y="370" font-size="13" font-weight="500" fill="#1f2933">Survivor 0 (S0)</text>
  <rect x="260" y="385" width="160" height="65" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="4 4" rx="3"/>
  <text x="340" y="422" font-size="11.5" text-anchor="middle" fill="#2563eb">통째로 비움 (CLEAR)</text>

  <!-- Old 영역으로 승격 -->
  <rect x="440" y="350" width="180" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="450" y="370" font-size="13" font-weight="500" fill="#1f2933">Old 영역</text>
  <rect x="450" y="385" width="160" height="65" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="3"/>
  <text x="530" y="415" font-size="11.5" text-anchor="middle" fill="#7c3aed">승격된 객체 (Promotion)</text>
  <text x="530" y="433" font-size="11" text-anchor="middle" fill="#52606d">Old Generation 이동</text>

  <!-- 복사 완료된 S1 -->
  <rect x="630" y="350" width="190" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="640" y="370" font-size="13" font-weight="500" fill="#1f2933">Survivor 1 (S1, 활성)</text>
  <rect x="640" y="385" width="80" height="65" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="3"/>
  <text x="680" y="412" font-size="11.5" text-anchor="middle" fill="#059669">Eden 출신</text>
  <text x="680" y="430" font-size="11" text-anchor="middle" fill="#059669">(age = 1)</text>

  <rect x="730" y="385" width="80" height="65" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="3"/>
  <text x="770" y="412" font-size="11.5" text-anchor="middle" fill="#059669">S0 출신</text>
  <text x="770" y="430" font-size="11" text-anchor="middle" fill="#059669">(age = 3)</text>

  <!-- 결론 캡션 (Y: 510) -->
  <text x="440" y="510" font-size="11.5" text-anchor="middle" fill="#52606d">결론: Minor GC의 처리 비용은 죽은 객체를 무시하고 살아있는 객체 수에만 비례하여 복사한다.</text>
</svg>