<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 744" width="880" height="744" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Minor GC 전후의 객체 이동</title>
  <desc id="d">Minor GC 발동 전(Eden 꽉 참)과 수행 직후를 영역별로 나란히 비교한다. Eden과 S0의 살아있는 객체는 age가 1 늘어 S1로 복사되고, 임계값을 넘은 객체는 Old로 승격되며, Eden과 S0은 통째로 비워진다. 죽은 객체는 처리하지 않으므로 비용은 살아있는 객체 수에만 비례한다.</desc>
  <rect width="880" height="744" fill="#ffffff"/>
  <defs>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <rect x="24" y="24" width="18" height="18" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="50" y="39" font-size="15" fill="#111827">살아있는 객체 (복사 대상)</text>
  <rect x="260" y="24" width="18" height="18" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="286" y="39" font-size="15" fill="#111827">죽은 객체 (처리 안 함)</text>

  <!-- 열 머리 -->
  <text x="24" y="84" font-size="17" font-weight="bold" fill="#111827">① Minor GC 발동 전 (Eden 꽉 참)</text>
  <path d="M384,78 H500" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#ar-gray)"/>
  <text x="516" y="84" font-size="17" font-weight="bold" fill="#111827">② Minor GC 수행 직후</text>

  <!-- ───── Eden ───── -->
  <rect x="24" y="100" width="348" height="112" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="40" y="130" font-size="17" font-weight="bold" fill="#111827">Eden</text>
  <rect x="196" y="112" width="160" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="276" y="132" font-size="15" fill="#374151" text-anchor="middle">TLAB (할당 구간)</text>
  <rect x="40" y="156" width="88" height="44" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="84" y="183" font-size="15" fill="#4b5563" text-anchor="middle">죽은 객체</text>
  <rect x="146" y="156" width="88" height="44" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="190" y="183" font-size="15" fill="#4b5563" text-anchor="middle">죽은 객체</text>
  <rect x="252" y="156" width="104" height="44" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="304" y="183" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">라이브 객체</text>

  <rect x="516" y="100" width="340" height="112" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <rect x="532" y="116" width="120" height="80" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="592" y="152" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">통째로 비움</text>
  <text x="592" y="174" font-size="15" fill="#374151" text-anchor="middle">(CLEAR)</text>
  <text x="672" y="130" font-size="17" font-weight="bold" fill="#111827">Eden</text>

  <!-- ───── Survivor 0 ───── -->
  <rect x="24" y="224" width="348" height="148" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="40" y="254" font-size="17" font-weight="bold" fill="#111827">Survivor 0</text>
  <text x="40" y="276" font-size="15" fill="#374151">(S0, From)</text>
  <text x="40" y="320" font-size="15" fill="#4b5563">임계값 =</text>
  <text x="40" y="342" font-size="14" fill="#5b21b6" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">MaxTenuringThreshold</text>
  <rect x="236" y="240" width="120" height="52" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="296" y="262" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">라이브 객체</text>
  <text x="296" y="283" font-size="15" fill="#14532d" text-anchor="middle">(age = 2)</text>
  <rect x="236" y="304" width="120" height="52" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="296" y="326" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">임계값 초과</text>
  <text x="296" y="347" font-size="15" fill="#4c1d95" text-anchor="middle">(age &gt; 15)</text>

  <rect x="516" y="224" width="340" height="148" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <rect x="532" y="240" width="120" height="116" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="592" y="293" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">통째로 비움</text>
  <text x="592" y="315" font-size="15" fill="#374151" text-anchor="middle">(CLEAR)</text>
  <text x="672" y="254" font-size="17" font-weight="bold" fill="#111827">Survivor 0</text>
  <text x="672" y="276" font-size="15" fill="#374151">(S0)</text>
  <text x="672" y="320" font-size="15" fill="#4b5563">다음 GC에서는</text>
  <text x="672" y="342" font-size="15" fill="#4b5563">To 공간</text>

  <!-- ───── Survivor 1 ───── -->
  <rect x="24" y="384" width="348" height="148" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="40" y="414" font-size="17" font-weight="bold" fill="#111827">Survivor 1</text>
  <text x="40" y="436" font-size="15" fill="#374151">(S1, To)</text>
  <rect x="236" y="400" width="120" height="116" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="296" y="453" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">비어 있음</text>
  <text x="296" y="475" font-size="15" fill="#374151" text-anchor="middle">(To 공간)</text>

  <rect x="516" y="384" width="340" height="148" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <rect x="532" y="400" width="120" height="52" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="592" y="422" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Eden 출신</text>
  <text x="592" y="443" font-size="15" fill="#14532d" text-anchor="middle">(age = 1)</text>
  <rect x="532" y="464" width="120" height="52" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="592" y="486" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">S0 출신</text>
  <text x="592" y="507" font-size="15" fill="#14532d" text-anchor="middle">(age = 3)</text>
  <text x="672" y="414" font-size="17" font-weight="bold" fill="#111827">Survivor 1</text>
  <text x="672" y="436" font-size="15" fill="#374151">(S1, 활성)</text>

  <!-- ───── Old ───── -->
  <rect x="24" y="544" width="348" height="92" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="40" y="574" font-size="17" font-weight="bold" fill="#111827">Old 영역</text>

  <rect x="516" y="544" width="340" height="92" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <rect x="532" y="560" width="120" height="52" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="592" y="582" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">승격된 객체</text>
  <text x="592" y="603" font-size="15" fill="#4c1d95" text-anchor="middle">(Promotion)</text>
  <text x="672" y="574" font-size="17" font-weight="bold" fill="#111827">Old 영역</text>
  <text x="672" y="596" font-size="15" fill="#374151">(Old Generation)</text>

  <!-- ───── 이동 화살표 ───── -->
  <path d="M356,178 H432 V426 H526" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#ar-green)"/>
  <path d="M356,266 H412 V490 H526" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#ar-green)"/>
  <path d="M356,330 H392 V586 H526" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ar-purple)"/>
  <text x="478" y="452" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">복사</text>
  <text x="478" y="472" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">age +1</text>
  <text x="470" y="572" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">승격</text>

  <!-- 결론 -->
  <rect x="24" y="656" width="832" height="64" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="440" y="682" font-size="16" fill="#111827" text-anchor="middle">Minor GC는 죽은 객체를 무시하고 살아있는 객체만 복사합니다.</text>
  <text x="440" y="706" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">그래서 처리 비용이 살아있는 객체 수에만 비례합니다.</text>
</svg>
