<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Salt 유무에 따른 해시값</title>
  <desc id="d">Salt가 없으면 같은 비밀번호 "hunter2"를 쓰는 user A와 user B의 해시값이 a3f9c2…로 같다. 사용자마다 다른 Salt를 붙이면 같은 비밀번호라도 해시값이 91be04…와 5cd7ff…로 달라진다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>

  <!-- Salt 없음 -->
  <rect x="24" y="24" width="832" height="172" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="48" y="62" font-size="19" font-weight="bold" fill="#b91c1c">Salt 없음</text>

  <text x="64" y="110" font-size="16" font-weight="bold" fill="#111827">user A</text>
  <text x="160" y="110" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash("hunter2")</text>
  <text x="430" y="110" font-size="17" text-anchor="middle" fill="#111827">=</text>
  <rect x="456" y="86" width="140" height="36" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="526" y="110" font-size="17" font-weight="bold" text-anchor="middle" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a3f9c2…</text>

  <text x="64" y="160" font-size="16" font-weight="bold" fill="#111827">user B</text>
  <text x="160" y="160" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash("hunter2")</text>
  <text x="430" y="160" font-size="17" text-anchor="middle" fill="#111827">=</text>
  <rect x="456" y="136" width="140" height="36" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="526" y="160" font-size="17" font-weight="bold" text-anchor="middle" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a3f9c2…</text>

  <path d="M606,104 H626 V154 H606" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <text x="646" y="126" font-size="20" font-weight="bold" fill="#b91c1c">같다!</text>
  <text x="646" y="150" font-size="15" fill="#b91c1c">같은 비밀번호 노출</text>

  <!-- Salt 있음 -->
  <rect x="24" y="214" width="832" height="172" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="48" y="252" font-size="19" font-weight="bold" fill="#047857">Salt 있음</text>
  <text x="160" y="252" font-size="15" fill="#6d28d9">Salt = 사용자마다 다른 랜덤 값</text>

  <text x="64" y="300" font-size="16" font-weight="bold" fill="#111827">user A</text>
  <text x="160" y="300" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash("hunter2" + <tspan font-weight="bold" fill="#6d28d9">"x7Kq2p"</tspan>)</text>
  <text x="430" y="300" font-size="17" text-anchor="middle" fill="#111827">=</text>
  <rect x="456" y="276" width="140" height="36" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="526" y="300" font-size="17" font-weight="bold" text-anchor="middle" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">91be04…</text>

  <text x="64" y="350" font-size="16" font-weight="bold" fill="#111827">user B</text>
  <text x="160" y="350" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash("hunter2" + <tspan font-weight="bold" fill="#6d28d9">"mZ4Tn8"</tspan>)</text>
  <text x="430" y="350" font-size="17" text-anchor="middle" fill="#111827">=</text>
  <rect x="456" y="326" width="140" height="36" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="526" y="350" font-size="17" font-weight="bold" text-anchor="middle" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">5cd7ff…</text>

  <path d="M606,294 H626 V344 H606" stroke="#047857" stroke-width="2" fill="none"/>
  <text x="646" y="316" font-size="20" font-weight="bold" fill="#047857">다르다</text>
  <text x="646" y="340" font-size="15" fill="#047857">같은 비밀번호 노출 차단</text>
</svg>
