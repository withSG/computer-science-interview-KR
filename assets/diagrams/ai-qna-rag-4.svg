<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">하이브리드 검색의 필요성</title>
  <desc id="d">Dense만 쓰면 "iPhone 15 Pro Max 가격" 쿼리에서 정확한 제품명 매칭에 실패하고, Sparse만 쓰면 "자동차 사고 처리" 쿼리에서 "교통사고 대응" 문서를 놓친다. 하이브리드는 Dense의 의미 유사 문서와 Sparse의 키워드 매칭을 합쳐 두 장점을 결합한다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="580" fill="#ffffff"/>

  <!-- Dense만 사용 -->
  <rect x="24" y="24" width="400" height="304" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#1d4ed8">Dense만 사용<tspan dx="10" font-size="15" font-weight="normal" fill="#374151">벡터 검색</tspan></text>

  <rect x="44" y="72" width="360" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="60" y="95" font-size="14" fill="#4b5563">쿼리</text>
  <text x="60" y="123" font-size="16" fill="#111827">"iPhone 15 Pro Max 가격"</text>

  <line x1="224" y1="140" x2="224" y2="161" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="44" y="166" width="360" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="60" y="189" font-size="14" fill="#4b5563">검색 결과</text>
  <text x="60" y="217" font-size="16" fill="#111827">"스마트폰 가격 비교"<tspan dx="8" font-size="15" fill="#4b5563">(의미적 유사)</tspan></text>

  <line x1="224" y1="234" x2="224" y2="255" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="44" y="260" width="360" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="224" y="290" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">정확한 제품명 매칭 실패</text>

  <!-- Sparse만 사용 -->
  <rect x="456" y="24" width="400" height="304" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="476" y="56" font-size="18" font-weight="bold" fill="#b45309">Sparse만 사용<tspan dx="10" font-size="15" font-weight="normal" fill="#374151">키워드 검색</tspan></text>

  <rect x="476" y="72" width="360" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="492" y="95" font-size="14" fill="#4b5563">쿼리</text>
  <text x="492" y="123" font-size="16" fill="#111827">"자동차 사고 처리"</text>

  <line x1="656" y1="140" x2="656" y2="161" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="476" y="166" width="360" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="492" y="189" font-size="14" fill="#4b5563">검색 결과</text>
  <text x="492" y="217" font-size="16" fill="#111827">"자동차 사고" 포함 문서</text>

  <line x1="656" y1="234" x2="656" y2="255" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="476" y="260" width="360" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="656" y="290" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">"교통사고 대응" 문서 누락</text>

  <!-- 하이브리드 -->
  <rect x="24" y="352" width="832" height="204" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="44" y="384" font-size="18" font-weight="bold" fill="#047857">하이브리드</text>

  <rect x="44" y="400" width="360" height="48" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="224" y="430" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Dense로 의미 유사 문서</text>

  <text x="440" y="432" font-size="24" font-weight="bold" fill="#374151" text-anchor="middle">+</text>

  <rect x="476" y="400" width="360" height="48" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="656" y="430" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Sparse로 키워드 매칭</text>

  <path d="M224,450 V466 H440 M656,450 V466 H440" fill="none" stroke="#047857" stroke-width="1.5"/>
  <line x1="440" y1="466" x2="440" y2="485" stroke="#047857" stroke-width="1.5" marker-end="url(#ahg)"/>

  <rect x="320" y="490" width="240" height="48" rx="6" fill="#047857"/>
  <text x="440" y="520" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">두 장점 결합</text>
</svg>
