<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">하이브리드 검색의 필요성</title>
  <desc id="d">Dense 검색 단점, Sparse 검색 단점, 그리고 두 방식을 결합한 하이브리드 검색의 장점을 비교하여 설명하는 다이어그램입니다.</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="30" y="35.6" font-size="16" font-weight="bold" fill="#1f2933">하이브리드 검색의 필요성</text>

  <!-- 1. Dense만 사용 (빨강 영역) -->
  <g>
    <rect x="30" y="55" width="820" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="50" y="80.6" font-size="14" font-weight="bold" fill="#dc2626">Dense만 사용:</text>
    
    <rect x="50" y="95" width="220" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="60" y="115.7" font-size="13" fill="#1f2933">쿼리: "iPhone 15 Pro Max 가격"</text>

    <rect x="300" y="95" width="270" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="310" y="115.7" font-size="13" fill="#1f2933">검색 결과: "스마트폰 가격 비교"</text>
    <text x="580" y="115.7" font-size="11.5" fill="#52606d">(의미적 유사)</text>

    <path d="M50,148 L100,148" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="110" y="152.2" font-size="13" font-weight="bold" fill="#dc2626">정확한 제품명 매칭 실패</text>
  </g>

  <!-- 2. Sparse만 사용 (주황/경고 영역) -->
  <g>
    <rect x="30" y="195" width="820" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="50" y="220.6" font-size="14" font-weight="bold" fill="#d97706">Sparse만 사용:</text>
    
    <rect x="50" y="235" width="180" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="60" y="255.7" font-size="13" fill="#1f2933">쿼리: "자동차 사고 처리"</text>

    <rect x="260" y="235" width="230" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="270" y="255.7" font-size="13" fill="#1f2933">검색 결과: "자동차 사고" 포함 문서</text>

    <path d="M50,288 L100,288" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="110" y="292.2" font-size="13" font-weight="bold" fill="#dc2626">"교통사고 대응" 문서 누락</text>
  </g>

  <!-- 3. 하이브리드 (초록/성공 영역) -->
  <g>
    <rect x="30" y="335" width="820" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="50" y="360.6" font-size="14" font-weight="bold" fill="#059669">하이브리드:</text>
    
    <rect x="50" y="375" width="410" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/>
    <text x="60" y="395.7" font-size="13" fill="#1f2933">Dense로 의미 유사 문서 + Sparse로 키워드 매칭</text>

    <path d="M50,428 L100,428" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="110" y="432.2" font-size="13" font-weight="bold" fill="#059669">두 장점 결합</text>
  </g>
</svg>