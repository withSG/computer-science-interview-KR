<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IVF 클러스터 경계 문제</title>
  <desc id="d">쿼리는 centroid가 가장 가까운 C3에 속한다고 판정됐지만 진짜 정답은 경계 바로 건너편 C2에 있다. nprobe=1이면 C3만 보므로 정답을 영원히 못 찾고, nprobe=2면 2순위인 C2까지 보므로 정답을 찾는 대신 본 만큼 느려진다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>

  <!-- ===== 위: 경계 근처 상황 ===== -->
  <rect x="24" y="24" width="832" height="280" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="48" y="62" font-size="20" font-weight="700" fill="#111827">C2 구역</text>
  <text x="832" y="62" font-size="20" font-weight="700" fill="#111827" text-anchor="end">C3 구역</text>

  <!-- 쿼리 → centroid 거리 -->
  <path d="M476,140 L170,240" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <path d="M476,140 L700,240" stroke="#1d4ed8" stroke-width="2.5" fill="none"/>

  <!-- 경계선 -->
  <path d="M440,24 L440,304" stroke="#b91c1c" stroke-width="3"/>
  <rect x="408" y="268" width="64" height="26" rx="4" fill="#ffffff"/>
  <text x="440" y="287" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">경계선</text>

  <!-- 순위 라벨 -->
  <rect x="295" y="178" width="56" height="24" rx="4" fill="#f9fafb"/>
  <text x="323" y="196" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">2순위</text>
  <rect x="560" y="178" width="56" height="24" rx="4" fill="#f9fafb"/>
  <text x="588" y="196" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">1순위</text>

  <!-- centroid -->
  <path d="M170,229 L180,246 L160,246 Z" fill="#1e3a8a"/>
  <text x="170" y="272" font-size="15" fill="#1f2937" text-anchor="middle">C2 centroid</text>
  <path d="M700,229 L710,246 L690,246 Z" fill="#1e3a8a"/>
  <text x="700" y="272" font-size="15" fill="#1f2937" text-anchor="middle">C3 centroid</text>

  <!-- 정답과 쿼리 -->
  <circle cx="404" cy="140" r="9" fill="#111827"/>
  <text x="388" y="146" font-size="16" font-weight="700" fill="#111827" text-anchor="end">정답</text>
  <path d="M476,125 L480.4,134.9 L490.3,135.4 L482.6,142 L485.2,152.2 L476,146.6 L466.8,152.2 L469.4,142 L461.7,135.4 L471.6,134.9 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <text x="496" y="146" font-size="16" font-weight="700" fill="#92400e">쿼리</text>

  <!-- 설명 -->
  <text x="420" y="104" font-size="16" fill="#1f2937" text-anchor="end">진짜 정답은 경계 바로 건너편 <tspan font-weight="700">C2</tspan>에 있다</text>
  <text x="460" y="104" font-size="16" fill="#1f2937">쿼리는 <tspan font-weight="700">C3</tspan>에 속한다고 판정됐다</text>

  <!-- ===== 아래 왼쪽: nprobe=1 ===== -->
  <rect x="24" y="328" width="408" height="192" rx="8" fill="#fff7f7" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="40" y="344" width="112" height="30" rx="15" fill="#b91c1c"/>
  <text x="96" y="365" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">nprobe=1</text>
  <text x="166" y="365" font-size="16" font-weight="700" fill="#111827">C3 구역만 탐색</text>

  <rect x="40" y="388" width="188" height="64" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="228" y="388" width="188" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="54" y="412" font-size="15" font-weight="700" fill="#4b5563">C2 · 안 봄</text>
  <text x="242" y="412" font-size="15" font-weight="700" fill="#1d4ed8">C3 · 탐색</text>
  <circle cx="210" cy="433" r="7" fill="#111827"/>
  <text x="196" y="438" font-size="15" fill="#111827" text-anchor="end">정답</text>
  <path d="M248,423 L250.9,429.6 L258.1,430.1 L252.6,434.8 L254.3,441.9 L248,438.1 L241.7,441.9 L243.4,434.8 L237.9,430.1 L245.1,429.6 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.2"/>
  <text x="264" y="438" font-size="15" fill="#92400e">쿼리</text>

  <text x="40" y="482" font-size="16" font-weight="700" fill="#b91c1c">C2를 아예 안 보므로 정답을 영원히 못 찾는다</text>
  <text x="40" y="506" font-size="15" fill="#374151">결과: Recall 하락</text>

  <!-- ===== 아래 오른쪽: nprobe=2 ===== -->
  <rect x="448" y="328" width="408" height="192" rx="8" fill="#f3fbf7" stroke="#047857" stroke-width="1.5"/>
  <rect x="464" y="344" width="112" height="30" rx="15" fill="#047857"/>
  <text x="520" y="365" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">nprobe=2</text>
  <text x="590" y="365" font-size="16" font-weight="700" fill="#111827">C3와 C2 구역 탐색</text>

  <rect x="464" y="388" width="188" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="652" y="388" width="188" height="64" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="478" y="412" font-size="15" font-weight="700" fill="#1d4ed8">C2 · 탐색</text>
  <text x="666" y="412" font-size="15" font-weight="700" fill="#1d4ed8">C3 · 탐색</text>
  <circle cx="634" cy="433" r="7" fill="#111827"/>
  <text x="620" y="438" font-size="15" fill="#111827" text-anchor="end">정답</text>
  <path d="M672,423 L674.9,429.6 L682.1,430.1 L676.6,434.8 L678.3,441.9 L672,438.1 L665.7,441.9 L667.4,434.8 L661.9,430.1 L669.1,429.6 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.2"/>
  <text x="688" y="438" font-size="15" fill="#92400e">쿼리</text>

  <text x="464" y="482" font-size="16" font-weight="700" fill="#047857">경계 건너편 C2의 정답까지 찾는다</text>
  <text x="464" y="506" font-size="15" fill="#374151">결과: Recall 상승, 대신 본 만큼 느려짐</text>
</svg>
