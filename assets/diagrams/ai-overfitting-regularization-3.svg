<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">일반화 오차의 분해</title>
  <desc id="d">일반화 오차는 편향², 분산, 줄일 수 없는 노이즈의 합이다. 편향은 모델이 단순해서 정답 구조를 표현하지 못하는 정도, 분산은 학습 데이터가 조금 바뀌면 모델이 크게 흔들리는 정도, 노이즈는 라벨 오류나 관측 불가능한 요인으로 어떤 모델로도 줄일 수 없다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 식 -->
  <rect x="32" y="24" width="816" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="61" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">일반화 오차 = <tspan fill="#1d4ed8">편향²(Bias)</tspan> + <tspan fill="#b45309">분산(Variance)</tspan> + <tspan fill="#4b5563">줄일 수 없는 노이즈</tspan></text>

  <!-- 편향² -->
  <rect x="72" y="108" width="776" height="88" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="88" y="124" width="160" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="168" y="159" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">편향</text>
  <text x="272" y="144" font-size="17" fill="#111827">모델이 단순해서 정답 구조 자체를 표현하지 못하는 정도</text>
  <text x="272" y="176" font-size="16" fill="#1e3a8a">→ 학습 데이터를 바꿔도 “일관되게” 틀린다</text>

  <!-- 분산 -->
  <text x="52" y="264" font-size="24" font-weight="bold" fill="#374151" text-anchor="middle">+</text>
  <rect x="72" y="212" width="776" height="88" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <rect x="88" y="228" width="160" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="168" y="263" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">분산</text>
  <text x="272" y="248" font-size="17" fill="#111827">학습 데이터가 조금 바뀌면 모델이 크게 흔들리는 정도</text>
  <text x="272" y="280" font-size="16" fill="#78350f">→ 데이터의 노이즈까지 따라 그린 결과</text>

  <!-- 노이즈 -->
  <text x="52" y="368" font-size="24" font-weight="bold" fill="#374151" text-anchor="middle">+</text>
  <rect x="72" y="316" width="776" height="88" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="88" y="332" width="160" height="56" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="168" y="367" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">노이즈</text>
  <text x="272" y="352" font-size="17" fill="#111827">라벨 오류나 관측 불가능한 요인</text>
  <text x="272" y="384" font-size="16" font-weight="bold" fill="#374151">→ 어떤 모델로도 줄일 수 없다</text>

  <!-- 복잡도와의 관계 -->
  <rect x="32" y="428" width="816" height="68" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="56" y="456" font-size="16" fill="#111827">모델 복잡도를 키우면 <tspan font-weight="bold" fill="#1e3a8a">편향은 줄고</tspan> <tspan font-weight="bold" fill="#78350f">분산은 는다</tspan></text>
  <text x="56" y="482" font-size="16" fill="#111827">→ 둘의 합이 최소가 되는 지점을 찾는 것이 <tspan font-weight="bold" fill="#065f46">튜닝의 목표</tspan></text>
</svg>
