<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">1.2 진짜 문제는 반복이 아니라 패러다임 불일치</title>
  <desc id="d">객체 세계와 테이블 세계 간의 패러다임 불일치 항목들을 비교하는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 제목 헤딩 -->
  <text x="40" y="40" font-size="16" font-weight="bold" fill="#1f2933">1.2 진짜 문제는 반복이 아니라 "패러다임 불일치"</text>

  <!-- 객체 세계 영역 (파랑) -->
  <rect x="40" y="65" width="310" height="235" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="98" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">객체 세계</text>
  <line x1="60" y1="115" x2="330" y2="115" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 객체 세계 항목 -->
  <rect x="60" y="130" width="270" height="32" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="195" y="151.05" font-size="13" fill="#1f2933" text-anchor="middle">상속이 있다</text>

  <rect x="60" y="172" width="270" height="32" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="195" y="193.05" font-size="13" fill="#1f2933" text-anchor="middle">참조로 연결</text>

  <rect x="60" y="214" width="270" height="32" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="195" y="235.05" font-size="13" fill="#1f2933" text-anchor="middle">그래프 자유 탐색</text>

  <rect x="60" y="256" width="270" height="32" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="195" y="277.05" font-size="13" fill="#1f2933" text-anchor="middle">== 로 동일성</text>

  <!-- 중앙 화살표 및 불일치 라벨 (주황 강조) -->
  <!-- 1. 상속 -->
  <path d="M350,146 L530,146" stroke="#d97706" stroke-width="1.5" fill="none" marker-start="url(#a-blue)" marker-end="url(#a-purple)"/>
  <rect x="400" y="135" width="80" height="22" fill="#ffffff" rx="3" ry="3"/>
  <text x="440" y="150.05" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">← 불일치 →</text>

  <!-- 2. 연결 -->
  <path d="M350,188 L530,188" stroke="#d97706" stroke-width="1.5" fill="none" marker-start="url(#a-blue)" marker-end="url(#a-purple)"/>
  <rect x="400" y="177" width="80" height="22" fill="#ffffff" rx="3" ry="3"/>
  <text x="440" y="192.05" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">← 불일치 →</text>

  <!-- 3. 탐색/조인 -->
  <path d="M350,230 L530,230" stroke="#d97706" stroke-width="1.5" fill="none" marker-start="url(#a-blue)" marker-end="url(#a-purple)"/>
  <rect x="400" y="219" width="80" height="22" fill="#ffffff" rx="3" ry="3"/>
  <text x="440" y="234.05" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">← 불일치 →</text>

  <!-- 4. 동일성 -->
  <path d="M350,272 L530,272" stroke="#d97706" stroke-width="1.5" fill="none" marker-start="url(#a-blue)" marker-end="url(#a-purple)"/>
  <rect x="400" y="261" width="80" height="22" fill="#ffffff" rx="3" ry="3"/>
  <text x="440" y="276.05" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">← 불일치 →</text>

  <!-- 테이블 세계 영역 (보라) -->
  <rect x="530" y="65" width="310" height="235" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="685" y="98" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">테이블 세계</text>
  <line x1="550" y1="115" x2="820" y2="115" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 테이블 세계 항목 -->
  <rect x="550" y="130" width="270" height="32" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="685" y="151.05" font-size="13" fill="#1f2933" text-anchor="middle">상속이 없다</text>

  <rect x="550" y="172" width="270" height="32" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="685" y="193.05" font-size="13" fill="#1f2933" text-anchor="middle">외래키로 연결</text>

  <rect x="550" y="214" width="270" height="32" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="685" y="235.05" font-size="13" fill="#1f2933" text-anchor="middle">JOIN 한 만큼만</text>

  <rect x="550" y="256" width="270" height="32" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="685" y="277.05" font-size="13" fill="#1f2933" text-anchor="middle">PK 값으로 동일성</text>
</svg>