<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">객체와 테이블의 패러다임 불일치</title>
  <desc id="d">상속, 연관관계, 객체 그래프 탐색, 동일성 네 가지에서 객체 세계와 테이블 세계가 서로 어긋나는 지점을 한 줄씩 나란히 비교한다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <rect x="188" y="24" width="260" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="318" y="51" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">객체 세계</text>
  <rect x="588" y="24" width="260" height="42" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="718" y="51" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">테이블 세계</text>

  <!-- 행 1: 상속 -->
  <text x="32" y="114" font-size="16" font-weight="bold" fill="#374151">상속</text>
  <rect x="188" y="80" width="260" height="56" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="318" y="114" font-size="17" fill="#111827" text-anchor="middle">상속이 있다</text>
  <line x1="488" y1="108" x2="454" y2="108" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="518" y="114" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">불일치</text>
  <line x1="548" y1="108" x2="582" y2="108" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="588" y="80" width="260" height="56" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="718" y="114" font-size="17" fill="#111827" text-anchor="middle">상속이 없다</text>

  <!-- 행 2: 연관관계 -->
  <text x="32" y="182" font-size="16" font-weight="bold" fill="#374151">연관관계</text>
  <rect x="188" y="148" width="260" height="56" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="318" y="182" font-size="17" fill="#111827" text-anchor="middle">참조로 연결</text>
  <line x1="488" y1="176" x2="454" y2="176" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="518" y="182" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">불일치</text>
  <line x1="548" y1="176" x2="582" y2="176" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="588" y="148" width="260" height="56" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="718" y="182" font-size="17" fill="#111827" text-anchor="middle">외래키로 연결</text>

  <!-- 행 3: 객체 그래프 탐색 -->
  <text x="32" y="250" font-size="16" font-weight="bold" fill="#374151">객체 그래프 탐색</text>
  <rect x="188" y="216" width="260" height="56" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="318" y="250" font-size="17" fill="#111827" text-anchor="middle">그래프 자유 탐색</text>
  <line x1="488" y1="244" x2="454" y2="244" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="518" y="250" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">불일치</text>
  <line x1="548" y1="244" x2="582" y2="244" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="588" y="216" width="260" height="56" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="718" y="250" font-size="17" fill="#111827" text-anchor="middle">JOIN 한 만큼만</text>

  <!-- 행 4: 동일성 -->
  <text x="32" y="318" font-size="16" font-weight="bold" fill="#374151">동일성</text>
  <rect x="188" y="284" width="260" height="56" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="318" y="318" font-size="17" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">==</tspan> 로 동일성</text>
  <line x1="488" y1="312" x2="454" y2="312" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="518" y="318" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">불일치</text>
  <line x1="548" y1="312" x2="582" y2="312" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="588" y="284" width="260" height="56" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="718" y="318" font-size="17" fill="#111827" text-anchor="middle">PK 값으로 동일성</text>
</svg>
