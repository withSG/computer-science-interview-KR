<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">5-Fold 교차 검증</title>
  <desc id="d">데이터를 5등분하고 Fold 1부터 Fold 5까지 한 조각씩 돌아가며 검증셋으로, 나머지를 학습셋으로 써서 score₁~score₅를 얻는다. 결과는 평균 ± 표준편차로, 평균은 성능 추정치이고 표준편차는 그 추정치를 얼마나 믿을지 알려준다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>

  <text x="24" y="48" font-size="18" font-weight="bold" fill="#111827">데이터를 K등분하고, 한 조각씩 돌아가며 검증셋으로 쓴다 (K=5)</text>

  <!-- 조각 머리 -->
  <text x="158" y="102" font-size="14" fill="#4b5563" text-anchor="middle">조각 1</text>
  <text x="255" y="102" font-size="14" fill="#4b5563" text-anchor="middle">조각 2</text>
  <text x="352" y="102" font-size="14" fill="#4b5563" text-anchor="middle">조각 3</text>
  <text x="449" y="102" font-size="14" fill="#4b5563" text-anchor="middle">조각 4</text>
  <text x="546" y="102" font-size="14" fill="#4b5563" text-anchor="middle">조각 5</text>

  <!-- Fold 1 -->
  <text x="28" y="142" font-size="16" font-weight="bold" fill="#1f2937">Fold 1</text>
  <rect x="112" y="116" width="92" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="158" y="141" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <rect x="209" y="116" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="255" y="141" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="306" y="116" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="352" y="141" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="403" y="116" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="449" y="141" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="500" y="116" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="546" y="141" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <line x1="606" y1="136" x2="646" y2="136" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="658" y="142" font-size="17" font-weight="bold" fill="#111827">score₁</text>

  <!-- Fold 2 -->
  <text x="28" y="194" font-size="16" font-weight="bold" fill="#1f2937">Fold 2</text>
  <rect x="112" y="168" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="158" y="193" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="209" y="168" width="92" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="255" y="193" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <rect x="306" y="168" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="352" y="193" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="403" y="168" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="449" y="193" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="500" y="168" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="546" y="193" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <line x1="606" y1="188" x2="646" y2="188" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="658" y="194" font-size="17" font-weight="bold" fill="#111827">score₂</text>

  <!-- Fold 3 -->
  <text x="28" y="246" font-size="16" font-weight="bold" fill="#1f2937">Fold 3</text>
  <rect x="112" y="220" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="158" y="245" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="209" y="220" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="255" y="245" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="306" y="220" width="92" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="352" y="245" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <rect x="403" y="220" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="449" y="245" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="500" y="220" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="546" y="245" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <line x1="606" y1="240" x2="646" y2="240" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="658" y="246" font-size="17" font-weight="bold" fill="#111827">score₃</text>

  <!-- Fold 4 -->
  <text x="28" y="298" font-size="16" font-weight="bold" fill="#1f2937">Fold 4</text>
  <rect x="112" y="272" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="158" y="297" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="209" y="272" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="255" y="297" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="306" y="272" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="352" y="297" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="403" y="272" width="92" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="449" y="297" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <rect x="500" y="272" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="546" y="297" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <line x1="606" y1="292" x2="646" y2="292" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="658" y="298" font-size="17" font-weight="bold" fill="#111827">score₄</text>

  <!-- Fold 5 -->
  <text x="28" y="350" font-size="16" font-weight="bold" fill="#1f2937">Fold 5</text>
  <rect x="112" y="324" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="158" y="349" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="209" y="324" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="255" y="349" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="306" y="324" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="352" y="349" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="403" y="324" width="92" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="449" y="349" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="500" y="324" width="92" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="546" y="349" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <line x1="606" y1="344" x2="646" y2="344" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="658" y="350" font-size="17" font-weight="bold" fill="#111827">score₅</text>

  <!-- 점수 모으기 -->
  <path d="M736,136 H760 M736,188 H760 M736,240 H760 M736,292 H760 M736,344 H760" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <path d="M760,136 V406" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 결과 -->
  <rect x="24" y="410" width="832" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="446" font-size="20" font-weight="bold" fill="#111827">결과 = 평균 ± 표준편차</text>
  <text x="48" y="478" font-size="16" fill="#374151">평균은 성능 추정치, 표준편차는 그 추정치를 얼마나 믿을지 알려준다</text>
</svg>
