<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">K-Fold 교차 검증</title>
  <desc id="d">데이터를 5등분하여 한 조각씩 돌아가며 검증셋으로 사용하고 평균과 표준편차를 구하는 K-Fold 교차 검증 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 상단 설명 -->
  <text x="40" y="42" font-size="14" font-weight="bold" fill="#1f2933">데이터를 K등분하고, 한 조각씩 돌아가며 검증셋으로 쓴다 (K=5)</text>

  <!-- Fold 1 -->
  <text x="40" y="87.55" font-size="13" font-weight="bold" fill="#1f2933">Fold 1</text>
  <rect x="100" y="65" width="80" height="35" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="140" y="87.2" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">검증</text>
  <rect x="185" y="65" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="225" y="87.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="270" y="65" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="310" y="87.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="355" y="65" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="395" y="87.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="440" y="65" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="480" y="87.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <path d="M535,82.5 L585,82.5" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="600" y="87.2" font-size="13" font-weight="bold" fill="#1f2933">score₁</text>

  <!-- Fold 2 -->
  <text x="40" y="132.55" font-size="13" font-weight="bold" fill="#1f2933">Fold 2</text>
  <rect x="100" y="110" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="140" y="132.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="185" y="110" width="80" height="35" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="225" y="132.2" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">검증</text>
  <rect x="270" y="110" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="310" y="132.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="355" y="110" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="395" y="132.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="440" y="110" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="480" y="132.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <path d="M535,127.5 L585,127.5" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="600" y="132.2" font-size="13" font-weight="bold" fill="#1f2933">score₂</text>

  <!-- Fold 3 -->
  <text x="40" y="177.55" font-size="13" font-weight="bold" fill="#1f2933">Fold 3</text>
  <rect x="100" y="155" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="140" y="177.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="185" y="155" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="225" y="177.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="270" y="155" width="80" height="35" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="310" y="177.2" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">검증</text>
  <rect x="355" y="155" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="395" y="177.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="440" y="155" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="480" y="177.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <path d="M535,172.5 L585,172.5" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="600" y="177.2" font-size="13" font-weight="bold" fill="#1f2933">score₃</text>

  <!-- Fold 4 -->
  <text x="40" y="222.55" font-size="13" font-weight="bold" fill="#1f2933">Fold 4</text>
  <rect x="100" y="200" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="140" y="222.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="185" y="200" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="225" y="222.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="270" y="200" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="310" y="222.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="355" y="200" width="80" height="35" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="395" y="222.2" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">검증</text>
  <rect x="440" y="200" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="480" y="222.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <path d="M535,217.5 L585,217.5" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="600" y="222.2" font-size="13" font-weight="bold" fill="#1f2933">score₄</text>

  <!-- Fold 5 -->
  <text x="40" y="267.55" font-size="13" font-weight="bold" fill="#1f2933">Fold 5</text>
  <rect x="100" y="245" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="140" y="267.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="185" y="245" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="225" y="267.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="270" y="245" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="310" y="267.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="355" y="245" width="80" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="395" y="267.2" font-size="12" fill="#2563eb" text-anchor="middle">학습</text>
  <rect x="440" y="245" width="80" height="35" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="480" y="267.2" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">검증</text>
  <path d="M535,262.5 L585,262.5" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="600" y="267.2" font-size="13" font-weight="bold" fill="#1f2933">score₅</text>

  <!-- 하단 결과 카드 -->
  <rect x="40" y="325" width="800" height="135" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="8"/>
  <text x="70" y="364.9" font-size="14" font-weight="bold" fill="#1f2933">결과 = 평균 ± 표준편차</text>
  <text x="110" y="403.025" font-size="11.5" fill="#52606d">평균은 성능 추정치, 표준편차는 그 추정치를 얼마나 믿을지 알려준다</text>
</svg>