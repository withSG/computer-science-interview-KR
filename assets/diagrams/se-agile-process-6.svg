<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PR 크기별 리뷰어 행동</title>
  <desc id="d">PR이 200줄 안팎이면 줄 단위로 읽고 설계 의견이 나오지만, 400줄 근처에서는 놓치는 것이 생기고, 1000줄 이상이면 "LGTM" 한 줄로 끝나 사실상 리뷰가 없었던 것이 된다.</desc>
  <rect width="880" height="270" fill="#ffffff"/>

  <!-- 머리행 -->
  <rect x="24" y="24" width="832" height="48" fill="#e5e7eb"/>
  <text x="46" y="54" font-size="16" font-weight="bold" fill="#111827">PR 크기</text>
  <text x="246" y="54" font-size="16" font-weight="bold" fill="#111827">리뷰어의 실제 행동</text>

  <!-- 행 1 -->
  <rect x="24" y="72" width="832" height="56" fill="#ecfdf5"/>
  <rect x="24" y="72" width="6" height="56" fill="#047857"/>
  <text x="46" y="106" font-size="17" font-weight="bold" fill="#047857">~ 200줄</text>
  <text x="246" y="106" font-size="16" fill="#111827">줄 단위로 읽는다. 설계 의견이 나온다</text>

  <!-- 행 2 -->
  <rect x="24" y="128" width="832" height="56" fill="#fffbeb"/>
  <rect x="24" y="128" width="6" height="56" fill="#b45309"/>
  <text x="46" y="162" font-size="17" font-weight="bold" fill="#b45309">400줄 근처</text>
  <text x="246" y="162" font-size="16" fill="#111827">읽기는 하지만 놓치는 것이 생긴다</text>

  <!-- 행 3 -->
  <rect x="24" y="184" width="832" height="56" fill="#fef2f2"/>
  <rect x="24" y="184" width="6" height="56" fill="#b91c1c"/>
  <text x="46" y="218" font-size="17" font-weight="bold" fill="#b91c1c">1000줄 이상</text>
  <text x="246" y="218" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#b91c1c">"LGTM" 한 줄.</tspan> 사실상 리뷰가 없었던 것</text>

  <!-- 격자선 -->
  <line x1="24" y1="72" x2="856" y2="72" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="24" y1="128" x2="856" y2="128" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="184" x2="856" y2="184" stroke="#d1d5db" stroke-width="1"/>
  <line x1="224" y1="24" x2="224" y2="240" stroke="#d1d5db" stroke-width="1"/>
  <rect x="24" y="24" width="832" height="216" fill="none" stroke="#9ca3af" stroke-width="1"/>
</svg>
