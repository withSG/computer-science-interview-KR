<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안정 정렬과 불안정 정렬</title>
  <desc id="d">학생 네 명을 점수만으로 정렬한 두 결과를 비교한다. 안정 정렬은 같은 점수끼리 원본 순서(80점 ②→④, 90점 ①→③)를 유지하고, 불안정 정렬은 그 순서가 뒤집힐 수 있다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="46" font-size="19" font-weight="bold" fill="#111827">학생 목록을 "점수"만으로 정렬한다.</text>
  <rect x="560" y="31" width="18" height="18" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="584" y="46" font-size="16" fill="#111827">80점</text>
  <rect x="640" y="31" width="18" height="18" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="664" y="46" font-size="16" fill="#111827">90점</text>
  <text x="856" y="46" font-size="16" fill="#374151" text-anchor="end">①~④ 원본 순서</text>
  <rect x="24" y="84" width="140" height="68" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="94" y="124" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">원본</text>
  <rect x="188" y="84" width="112" height="68" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="244" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(김, 90)</text>
  <text x="244" y="141" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">①</text>
  <rect x="316" y="84" width="112" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="372" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(이, 80)</text>
  <text x="372" y="141" font-size="19" font-weight="bold" fill="#92400e" text-anchor="middle">②</text>
  <rect x="444" y="84" width="112" height="68" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="500" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(박, 90)</text>
  <text x="500" y="141" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③</text>
  <rect x="572" y="84" width="112" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="628" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(최, 80)</text>
  <text x="628" y="141" font-size="19" font-weight="bold" fill="#92400e" text-anchor="middle">④</text>
  <rect x="24" y="190" width="140" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="94" y="230" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">안정 정렬</text>
  <rect x="188" y="190" width="112" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="244" y="220" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(이, 80)</text>
  <text x="244" y="247" font-size="19" font-weight="bold" fill="#92400e" text-anchor="middle">②</text>
  <rect x="316" y="190" width="112" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="372" y="220" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(최, 80)</text>
  <text x="372" y="247" font-size="19" font-weight="bold" fill="#92400e" text-anchor="middle">④</text>
  <rect x="444" y="190" width="112" height="68" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="500" y="220" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(김, 90)</text>
  <text x="500" y="247" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">①</text>
  <rect x="572" y="190" width="112" height="68" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="628" y="220" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(박, 90)</text>
  <text x="628" y="247" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③</text>
  <path d="M196,266 V276 H420 V266" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="308" y="300" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">80끼리 ② → ④ 유지</text>
  <path d="M452,266 V276 H676 V266" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="564" y="300" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">90끼리 ① → ③ 유지</text>
  <rect x="708" y="190" width="148" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="782" y="218" font-size="15" fill="#065f46" text-anchor="middle">같은 점수끼리</text>
  <text x="782" y="242" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">원래 순서 유지</text>
  <rect x="24" y="334" width="140" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="94" y="374" font-size="18" font-weight="bold" fill="#991b1b" text-anchor="middle">불안정 정렬</text>
  <rect x="188" y="334" width="112" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="244" y="364" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(최, 80)</text>
  <text x="244" y="391" font-size="19" font-weight="bold" fill="#92400e" text-anchor="middle">④</text>
  <rect x="316" y="334" width="112" height="68" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="372" y="364" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(이, 80)</text>
  <text x="372" y="391" font-size="19" font-weight="bold" fill="#92400e" text-anchor="middle">②</text>
  <rect x="444" y="334" width="112" height="68" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="500" y="364" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(박, 90)</text>
  <text x="500" y="391" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③</text>
  <rect x="572" y="334" width="112" height="68" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="628" y="364" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">(김, 90)</text>
  <text x="628" y="391" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">①</text>
  <path d="M196,410 V420 H420 V410" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="308" y="444" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">80끼리 ④ → ② 뒤집힘</text>
  <path d="M452,410 V420 H676 V410" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="564" y="444" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">90끼리 ③ → ① 뒤집힘</text>
  <rect x="708" y="334" width="148" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="782" y="362" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">순서가 뒤집힐</text>
  <text x="782" y="386" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">수 있음</text>
</svg>
