<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안정 정렬과 불안정 정렬 비교</title>
  <desc id="d">학생 목록을 점수로 정렬할 때 안정 정렬은 동일 점수의 원래 순서를 유지하고 불안정 정렬은 순서가 뒤집힐 수 있음을 비교하여 보여주는 다이어그램</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- Color Definitions / Legend Box -->
  <rect x="24" y="20" width="832" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="44" font-size="13" font-weight="bold" fill="#1f2933">학생 목록을 "점수"만으로 정렬한다.</text>

  <!-- Section 1: Raw Data (원본) -->
  <g transform="translate(0, 80)">
    <rect x="24" y="0" width="110" height="48" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="79" y="29" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">원본:</text>

    <!-- Item 1: (김,90) ① -->
    <rect x="154" y="0" width="90" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="199" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(김,90)</text>
    <circle cx="199" cy="62" r="10" fill="#2563eb"/>
    <text x="199" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">①</text>

    <!-- Item 2: (이,80) ② -->
    <rect x="264" y="0" width="90" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="309" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(이,80)</text>
    <circle cx="309" cy="62" r="10" fill="#d97706"/>
    <text x="309" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">②</text>

    <!-- Item 3: (박,90) ③ -->
    <rect x="374" y="0" width="90" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="419" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(박,90)</text>
    <circle cx="419" cy="62" r="10" fill="#2563eb"/>
    <text x="419" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">③</text>

    <!-- Item 4: (최,80) ④ -->
    <rect x="484" y="0" width="90" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="529" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(최,80)</text>
    <circle cx="529" cy="62" r="10" fill="#d97706"/>
    <text x="529" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">④</text>
  </g>

  <!-- Divider line -->
  <line x1="24" y1="170" x2="856" y2="170" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Section 2: Stable Sort (안정 정렬) -->
  <g transform="translate(0, 190)">
    <rect x="24" y="0" width="110" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="79" y="29" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">안정 정렬:</text>

    <!-- Item 2: (이,80) ② -->
    <rect x="154" y="0" width="90" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="199" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(이,80)</text>
    <circle cx="199" cy="62" r="10" fill="#d97706"/>
    <text x="199" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">②</text>

    <!-- Item 4: (최,80) ④ -->
    <rect x="264" y="0" width="90" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="309" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(최,80)</text>
    <circle cx="309" cy="62" r="10" fill="#d97706"/>
    <text x="309" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">④</text>

    <!-- Item 1: (김,90) ① -->
    <rect x="374" y="0" width="90" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="419" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(김,90)</text>
    <circle cx="419" cy="62" r="10" fill="#2563eb"/>
    <text x="419" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">①</text>

    <!-- Item 3: (박,90) ③ -->
    <rect x="484" y="0" width="90" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="529" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(박,90)</text>
    <circle cx="529" cy="62" r="10" fill="#2563eb"/>
    <text x="529" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">③</text>

    <!-- Annotation -->
    <text x="584" y="66" font-size="13" fill="#059669" font-weight="bold">← 80끼리 ②→④, 90끼리 ①→③ 유지</text>
  </g>

  <!-- Section 3: Unstable Sort (불안정 정렬) -->
  <g transform="translate(0, 280)">
    <rect x="24" y="0" width="110" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="79" y="29" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">불안정 정렬:</text>

    <!-- Item 4: (최,80) ④ -->
    <rect x="154" y="0" width="90" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="199" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(최,80)</text>
    <circle cx="199" cy="62" r="10" fill="#d97706"/>
    <text x="199" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">④</text>

    <!-- Item 2: (이,80) ② -->
    <rect x="264" y="0" width="90" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="309" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(이,80)</text>
    <circle cx="309" cy="62" r="10" fill="#d97706"/>
    <text x="309" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">②</text>

    <!-- Item 3: (박,90) ③ -->
    <rect x="374" y="0" width="90" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="419" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(박,90)</text>
    <circle cx="419" cy="62" r="10" fill="#2563eb"/>
    <text x="419" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">③</text>

    <!-- Item 1: (김,90) ① -->
    <rect x="484" y="0" width="90" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="529" y="28" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(김,90)</text>
    <circle cx="529" cy="62" r="10" fill="#2563eb"/>
    <text x="529" y="66" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">①</text>

    <!-- Annotation -->
    <text x="584" y="66" font-size="13" fill="#dc2626" font-weight="bold">← 순서가 뒤집힐 수 있음</text>
  </g>
</svg>