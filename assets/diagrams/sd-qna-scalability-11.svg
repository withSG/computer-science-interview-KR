<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">마이크로서비스 구조</title>
  <desc id="d">User Service, Order Service, Product Service가 각자 자기 DB를 가진 독립 서비스로 나뉘고, 서로 Message Queue / API Gateway를 통해 연결됩니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Connectors to the shared channel -->
  <path d="M180,210 V256 M440,210 V256 M700,210 V256" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- User Service -->
  <rect x="70" y="30" width="220" height="180" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="180" y="66" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">User Service</text>
  <path d="M120,100 V160 A60,10 0 0 0 240,160 V100 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="180" cy="100" rx="60" ry="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="180" y="143" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">DB</text>

  <!-- Order Service -->
  <rect x="330" y="30" width="220" height="180" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="66" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Order Service</text>
  <path d="M380,100 V160 A60,10 0 0 0 500,160 V100 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="440" cy="100" rx="60" ry="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="143" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">DB</text>

  <!-- Product Service -->
  <rect x="590" y="30" width="220" height="180" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="700" y="66" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Product Service</text>
  <path d="M640,100 V160 A60,10 0 0 0 760,160 V100 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="700" cy="100" rx="60" ry="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="700" y="143" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">DB</text>

  <!-- Message Queue / API Gateway -->
  <rect x="70" y="256" width="740" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="440" y="290" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Message Queue / API Gateway</text>
</svg>
