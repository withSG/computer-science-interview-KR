<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">마이크로서비스</title>
  <desc id="d">User, Order, Product 마이크로서비스 및 DB와 Message Queue / API Gateway 연결 다이어그램</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Connecting Lines -->
  <path d="M 200,140 L 200,190 L 680,190 L 680,140" stroke="#52606d" stroke-width="2" fill="none"/>
  <path d="M 440,140 L 440,230" stroke="#52606d" stroke-width="2" fill="none"/>

  <!-- User Service DB -->
  <rect x="110" y="40" width="180" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="68" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">User</text>
  <text x="200" y="93" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Service</text>
  <text x="200" y="118" font-size="14" fill="#2563eb" text-anchor="middle">DB</text>

  <!-- Order Service DB -->
  <rect x="350" y="40" width="180" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="68" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Order</text>
  <text x="440" y="93" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Service</text>
  <text x="440" y="118" font-size="14" fill="#059669" text-anchor="middle">DB</text>

  <!-- Product Service DB -->
  <rect x="590" y="40" width="180" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="680" y="68" font-size="14" font-weight="bold" fill="#5b21b6" text-anchor="middle">Product</text>
  <text x="680" y="93" font-size="14" font-weight="bold" fill="#5b21b6" text-anchor="middle">Service</text>
  <text x="680" y="118" font-size="14" fill="#7c3aed" text-anchor="middle">DB</text>

  <!-- Message Queue / API Gateway -->
  <rect x="280" y="230" width="320" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="258" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Message Queue / API Gateway</text>
</svg>