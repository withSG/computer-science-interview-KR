<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">콜 스택과 힙의 수명 차이</title>
  <desc id="d">outer() 호출 중과 반환 후(const fn = outer())를 시간 순으로 나눠, outer 컨텍스트는 반환과 함께 콜 스택에서 제거되지만 힙의 렉시컬 환경 { secret: 'hidden' }과 inner 함수 객체는 계속 남는 모습을 보여준다. fn → inner → [[Environment]] → 렉시컬 환경으로 이어지는 도달 가능성(Reachability) 체인 때문에 secret은 GC되지 않는다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="24" y="38" font-size="18" font-weight="700" fill="#111827">핵심: 실행 컨텍스트와 렉시컬 환경의 수명이 다르다</text>

  <!-- 시간 구간 머리 -->
  <rect x="212" y="56" width="288" height="52" rx="6" fill="#f3f4f6"/>
  <text x="356" y="88" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">① outer() 호출 중</text>
  <rect x="512" y="56" width="344" height="52" rx="6" fill="#f3f4f6"/>
  <text x="684" y="78" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">② outer() 반환 후</text>
  <text x="684" y="100" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">const fn = outer()</text>

  <!-- 반환 시점 경계선 (막대 뒤에 깔림) -->
  <line x1="506" y1="56" x2="506" y2="448" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- L1: outer 컨텍스트 -->
  <text x="24" y="143" font-size="16" font-weight="700" fill="#111827">outer 컨텍스트</text>
  <text x="24" y="162" font-size="14" fill="#4b5563">콜 스택</text>
  <rect x="220" y="124" width="272" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="356" y="151" font-size="15" fill="#1e3a8a" text-anchor="middle">실행 중</text>
  <rect x="520" y="124" width="328" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="684" y="151" font-size="15" fill="#b91c1c" text-anchor="middle">콜 스택에서 제거됨</text>

  <!-- L2: outer의 렉시컬 환경 -->
  <text x="24" y="237" font-size="16" font-weight="700" fill="#111827">outer의 렉시컬 환경</text>
  <text x="24" y="257" font-size="14" fill="#4b5563">힙</text>
  <rect x="220" y="208" width="628" height="68" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="356" y="236" font-size="16" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ secret: 'hidden' }</text>
  <text x="356" y="262" font-size="15" fill="#374151" text-anchor="middle">outer ref → 전역 렉시컬 환경</text>
  <text x="684" y="236" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">유지됨</text>
  <text x="684" y="262" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">GC: "도달 가능" (수거 불가)</text>

  <!-- L3: inner 함수 객체 -->
  <text x="24" y="335" font-size="16" font-weight="700" fill="#111827">inner 함수 객체</text>
  <text x="24" y="354" font-size="14" fill="#4b5563">힙</text>
  <rect x="220" y="316" width="628" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="356" y="343" font-size="15" fill="#5b21b6" text-anchor="middle">outer가 반환하는 함수</text>
  <text x="684" y="343" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">유지됨</text>

  <!-- L4: Global 컨텍스트 -->
  <text x="24" y="419" font-size="16" font-weight="700" fill="#111827">Global 컨텍스트</text>
  <text x="24" y="438" font-size="14" fill="#4b5563">콜 스택</text>
  <rect x="220" y="400" width="628" height="44" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="540" y="427" font-size="15" fill="#111827"><tspan font-weight="700" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fn</tspan> 변수 보유</text>

  <!-- ① 구간의 참조 -->
  <path d="M300,170 L300,204" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <text x="312" y="194" font-size="15" fill="#1d4ed8">LexicalEnv</text>
  <path d="M440,314 L440,280" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <text x="428" y="302" font-size="15" fill="#6d28d9" text-anchor="end">[[Environment]]</text>

  <!-- ② 구간의 참조: 도달 가능성 체인 -->
  <path d="M552,398 L552,364" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <text x="564" y="386" font-size="15" font-weight="700" fill="#b45309">fn 변수 참조</text>
  <path d="M552,314 L552,280" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <text x="564" y="302" font-size="15" font-weight="700" fill="#b45309">[[Environment]]</text>

  <!-- 결론 -->
  <rect x="24" y="468" width="832" height="68" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="44" y="495" font-size="16" font-weight="700" fill="#92400e">도달 가능성(Reachability) 체인 (주황 화살표): fn → inner → [[Environment]] → 렉시컬 환경</text>
  <text x="44" y="522" font-size="15" fill="#92400e">→ 그래서 secret은 GC되지 않고 유지된다</text>
</svg>
