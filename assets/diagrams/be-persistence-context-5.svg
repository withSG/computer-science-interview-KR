<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">8. LazyInitializationException</title>
  <desc id="d">Service와 Controller 레이어 사이에서 영속성 컨텍스트가 닫힌 후 프록시 객체 초기화 시도로 예외가 발생 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="35.6" font-size="16" font-weight="bold" fill="#1f2933">8. LazyInitializationException</text>

  <!-- Service Layer Section Background -->
  <rect x="30" y="55" width="820" height="185" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Controller Layer Section Background -->
  <rect x="30" y="260" width="820" height="215" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>

  <!-- [Service] Label Box -->
  <rect x="45" y="70" width="95" height="30" rx="4" fill="#2563eb"/>
  <text x="92.5" y="89.55" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[Service]</text>

  <!-- Spine Line (Service) -->
  <path d="M 180 100 L 180 230" stroke="#2563eb" stroke-width="2" fill="none"/>

  <!-- Step 1: 트랜잭션 시작 → 영속성 컨텍스트 열림 -->
  <path d="M 140 85 L 171 85" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="180" y="70" width="270" height="30" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="315" y="89.55" font-size="13" fill="#1e40af" text-anchor="middle">트랜잭션 시작 → 영속성 컨텍스트 열림</text>

  <!-- Step 2: ├─ Order 조회 (member 는 프록시로 남겨둠) -->
  <path d="M 180 135 L 211 135" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="220" y="120" width="290" height="30" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="365" y="139.55" font-size="13" fill="#1f2933" text-anchor="middle">Order 조회 (member 는 프록시로 남겨둠)</text>

  <!-- Step 3: return → 트랜잭션 종료 → 영속성 컨텍스트 닫힘 ✕ -->
  <path d="M 180 185 L 211 185" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="220" y="170" width="350" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="395" y="189.55" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">return → 트랜잭션 종료 → 영속성 컨텍스트 닫힘 ✕</text>

  <!-- Connection between Service and Controller spine -->
  <path d="M 180 230 L 180 275" stroke="#52606d" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>

  <!-- [Controller] Label Box -->
  <rect x="45" y="275" width="105" height="30" rx="4" fill="#7c3aed"/>
  <text x="97.5" y="294.55" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[Controller]</text>

  <!-- Spine Line (Controller) -->
  <path d="M 180 280 L 180 340" stroke="#7c3aed" stroke-width="2" fill="none"/>

  <!-- Step 4: └─ proxy.getName() -->
  <path d="M 180 325 L 211 325" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="220" y="310" width="155" height="30" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="297.5" y="329.55" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">proxy.getName()</text>

  <!-- Branch from proxy.getName() to Step 5 -->
  <path d="M 297.5 340 L 297.5 380 L 321 380" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 5: └─ "영속성 컨텍스트야, 초기화해줘" -->
  <rect x="330" y="365" width="250" height="30" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="455" y="384.55" font-size="13" fill="#5b21b6" text-anchor="middle">"영속성 컨텍스트야, 초기화해줘"</text>

  <!-- Branch from Step 5 to Step 6 -->
  <path d="M 455 395 L 455 435 L 471 435" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>

  <!-- Step 6: → 이미 닫혀 있음 → 예외 -->
  <rect x="480" y="420" width="195" height="30" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="577.5" y="439.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">→ 이미 닫혀 있음 → 예외</text>

</svg>