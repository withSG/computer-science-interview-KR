<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 850" width="880" height="850" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">종료 시점의 시차</title>
  <desc id="d">SIGTERM을 받은 애플리케이션은 0.6초 만에 종료되지만 로드 밸런서는 헬스체크 2회 실패(10.0초) 전까지 계속 요청을 보내 502와 연결 실패가 나는 최대 10초 구멍, 그리고 preStop 대기(대기 시간 ≥ 헬스체크 주기 × 실패 임계값)로 SIGTERM을 늦춰 LB 목록에서 먼저 빠진 뒤(10초) SIGTERM을 받게 하면 새 요청이 오지 않아 구멍이 사라지는 처방을 비교한다.</desc>
  <rect width="880" height="850" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== 처방 전 ===== -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#b91c1c">처방 전 — 앱은 내려가는데 로드 밸런서는 아직 모른다</text>

  <!-- 열 머리 -->
  <text x="96" y="74" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="end">시각</text>
  <rect x="110" y="50" width="270" height="36" rx="6" fill="#f3f4f6"/>
  <text x="245" y="74" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">애플리케이션이 아는 시간</text>
  <rect x="470" y="50" width="320" height="36" rx="6" fill="#f3f4f6"/>
  <text x="630" y="74" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">로드 밸런서가 아는 시간</text>

  <!-- 0.0초 -->
  <text x="96" y="130" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">0.0초</text>
  <rect x="110" y="96" width="270" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="126" y="120" font-size="15" font-weight="bold" fill="#b45309">SIGTERM 수신</text>
  <text x="126" y="145" font-size="15" fill="#1f2937">"새 요청 안 받음" 선언</text>
  <rect x="470" y="96" width="320" height="60" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="486" y="131" font-size="15" fill="#1f2937">여전히 이 서버로 요청을 보내는 중</text>

  <!-- 0.1초 -->
  <text x="96" y="192" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">0.1초</text>
  <rect x="110" y="166" width="270" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="126" y="192" font-size="15" fill="#1f2937">진행 중 요청 처리</text>
  <line x1="466" y1="187" x2="386" y2="187" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="470" y="166" width="320" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="486" y="192" font-size="15" fill="#1f2937">새 요청 도착! 서버는 거부 → <tspan font-weight="bold" fill="#b91c1c">502</tspan></text>

  <!-- 0.5초 -->
  <text x="96" y="244" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">0.5초</text>
  <rect x="110" y="218" width="270" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="126" y="244" font-size="15" fill="#1f2937">진행 중 요청 완료</text>
  <line x1="466" y1="239" x2="386" y2="239" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="470" y="218" width="320" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="486" y="244" font-size="15" fill="#1f2937">새 요청 도착! → <tspan font-weight="bold" fill="#b91c1c">502</tspan></text>

  <!-- 0.6초 -->
  <text x="96" y="296" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">0.6초</text>
  <rect x="110" y="270" width="270" height="42" rx="6" fill="#374151"/>
  <text x="126" y="296" font-size="15" font-weight="bold" fill="#ffffff">프로세스 종료</text>
  <line x1="466" y1="291" x2="386" y2="291" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="470" y="270" width="320" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="486" y="296" font-size="15" fill="#1f2937">새 요청 도착! → <tspan font-weight="bold" fill="#b91c1c">연결 실패</tspan></text>

  <!-- 생략 -->
  <text x="96" y="342" font-size="18" font-weight="bold" fill="#4b5563" text-anchor="end">⋮</text>
  <text x="630" y="342" font-size="18" font-weight="bold" fill="#4b5563" text-anchor="middle">⋮</text>

  <!-- 5.0초 -->
  <text x="96" y="384" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">5.0초</text>
  <rect x="470" y="358" width="320" height="42" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="486" y="384" font-size="15" fill="#1f2937">헬스체크 1회 실패</text>

  <!-- 10.0초 -->
  <text x="96" y="436" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">10.0초</text>
  <rect x="470" y="410" width="320" height="62" rx="6" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="486" y="436" font-size="15" fill="#1f2937">헬스체크 2회 실패</text>
  <text x="486" y="460" font-size="15" font-weight="bold" fill="#1f2937">→ 이제야 목록에서 제외</text>

  <!-- 구멍 괄호 -->
  <path d="M798,96 L806,96 L806,472 L798,472" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="806" y1="284" x2="814" y2="284" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="840" y="262" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">최대</text>
  <text x="840" y="286" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">10초</text>
  <text x="840" y="310" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">구멍</text>

  <!-- 요약 -->
  <rect x="24" y="492" width="832" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="520" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#b91c1c">헬스체크 주기 5초 × 실패 임계값 2회 = 최대 10초</tspan>  ·  이 시차 동안 도착한 요청은 전부 실패</text>

  <!-- 구분선 -->
  <line x1="24" y1="562" x2="856" y2="562" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ===== 처방 적용 ===== -->
  <text x="24" y="596" font-size="17" font-weight="bold" fill="#047857">처방 적용 — preStop 대기로 SIGTERM을 늦춰, LB에서 먼저 빠진 뒤 종료한다</text>

  <text x="96" y="662" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="end">종료 요청</text>

  <!-- ① 대기 구간 -->
  <rect x="110" y="614" width="370" height="86" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="126" y="639" font-size="15" font-weight="bold" fill="#047857">① 준비 상태 false 또는 preStop 훅 N초 대기</text>
  <text x="126" y="663" font-size="15" fill="#1f2937">앱은 아직 SIGTERM을 못 받음</text>
  <text x="126" y="687" font-size="15" fill="#1f2937">→ 대기 중 도착한 요청도 정상 처리</text>

  <!-- SIGTERM 이후 -->
  <rect x="480" y="614" width="376" height="86" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="496" y="639" font-size="15" font-weight="bold" fill="#b45309">SIGTERM 수신</text>
  <text x="496" y="663" font-size="15" fill="#1f2937"><tspan font-weight="bold" fill="#047857">③ 새 요청 없음</tspan> · 진행 중 요청만 처리</text>
  <text x="496" y="687" font-size="15" fill="#1f2937">④ 자원 정리 → ⑤ 종료</text>

  <!-- 축 -->
  <line x1="110" y1="708" x2="110" y2="718" stroke="#4b5563" stroke-width="2"/>
  <line x1="480" y1="708" x2="480" y2="718" stroke="#047857" stroke-width="2"/>
  <text x="110" y="738" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">0초</text>
  <text x="480" y="738" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">② 10초: LB 목록에서 제외 완료 → 이제 SIGTERM</text>
  <text x="480" y="760" font-size="15" fill="#047857" text-anchor="middle">(대기 시간 ≥ 헬스체크 주기 × 실패 임계값)</text>

  <!-- 결론 -->
  <rect x="24" y="782" width="832" height="44" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="810" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#047857">LB에서 완전히 제외될 때까지 preStop 훅으로 SIGTERM을 늦춘다</tspan>  ·  502 구멍이 사라진다</text>
</svg>
