<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배포 전략 선택 가이드</title>
  <desc id="d">상황별 배포 전략: 인프라 비용 최소화는 Rolling, 빠른 롤백 필수는 Blue/Green, 신규 기능 검증 필요는 Canary, DB 스키마 변경 동반은 Blue/Green + 마이그레이션 전략.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="40" y="38" font-size="15" font-weight="bold" fill="#4b5563">상황</text>
  <text x="520" y="38" font-size="15" font-weight="bold" fill="#4b5563">전략</text>

  <!-- 1. 인프라 비용 최소화 → Rolling -->
  <rect x="40" y="54" width="400" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="62" y="88" font-size="17" fill="#111827">인프라 비용 최소화</text>
  <line x1="450" y1="82" x2="508" y2="82" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="520" y="54" width="320" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="680" y="89" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">Rolling</text>

  <!-- 2. 빠른 롤백 필수 → Blue/Green -->
  <rect x="40" y="126" width="400" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="62" y="160" font-size="17" fill="#111827">빠른 롤백 필수</text>
  <line x1="450" y1="154" x2="508" y2="154" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="520" y="126" width="320" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="680" y="161" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Blue/Green</text>

  <!-- 3. 신규 기능 검증 필요 → Canary -->
  <rect x="40" y="198" width="400" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="62" y="232" font-size="17" fill="#111827">신규 기능 검증 필요</text>
  <line x1="450" y1="226" x2="508" y2="226" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="520" y="198" width="320" height="56" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="680" y="233" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">Canary</text>

  <!-- 4. DB 스키마 변경 동반 → Blue/Green + 마이그레이션 전략 -->
  <rect x="40" y="270" width="400" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="62" y="304" font-size="17" fill="#111827">DB 스키마 변경 동반</text>
  <line x1="450" y1="298" x2="508" y2="298" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="520" y="270" width="320" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="680" y="305" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Blue/Green <tspan fill="#111827">+ 마이그레이션 전략</tspan></text>
</svg>
