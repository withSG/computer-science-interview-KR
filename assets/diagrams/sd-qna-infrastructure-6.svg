<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배포 전략 선택 가이드</title>
  <desc id="d">다양한 조건에 따른 배포 전략 선택 가이드 목록</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Item 1: Rolling -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="800" height="52" rx="6" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="20" y="32" font-size="14" fill="#2563eb" font-weight="bold">✓</text>
    <text x="44" y="31" font-size="13" fill="#1f2933">인프라 비용 최소화</text>
    <path d="M 460 26 L 490 26" stroke="#52606d" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
    <rect x="500" y="11" width="280" height="30" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Rolling</text>
  </g>

  <!-- Item 2: Blue/Green -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="800" height="52" rx="6" fill="#ecfdf5" stroke="#9aa5b1" stroke-width="1"/>
    <text x="20" y="32" font-size="14" fill="#059669" font-weight="bold">✓</text>
    <text x="44" y="31" font-size="13" fill="#1f2933">빠른 롤백 필수</text>
    <path d="M 460 26 L 490 26" stroke="#52606d" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
    <rect x="500" y="11" width="280" height="30" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Blue/Green</text>
  </g>

  <!-- Item 3: Canary -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="800" height="52" rx="6" fill="#fffbeb" stroke="#9aa5b1" stroke-width="1"/>
    <text x="20" y="32" font-size="14" fill="#d97706" font-weight="bold">✓</text>
    <text x="44" y="31" font-size="13" fill="#1f2933">신규 기능 검증 필요</text>
    <path d="M 460 26 L 490 26" stroke="#52606d" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
    <rect x="500" y="11" width="280" height="30" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">Canary</text>
  </g>

  <!-- Item 4: Blue/Green + 마이그레이션 전략 -->
  <g transform="translate(40, 225)">
    <rect x="0" y="0" width="800" height="52" rx="6" fill="#f5f3ff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="20" y="32" font-size="14" fill="#7c3aed" font-weight="bold">✓</text>
    <text x="44" y="31" font-size="13" fill="#1f2933">DB 스키마 변경 동반</text>
    <path d="M 460 26 L 490 26" stroke="#52606d" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
    <rect x="500" y="11" width="280" height="30" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="640" y="30" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">Blue/Green + 마이그레이션 전략</text>
  </g>
</svg>