<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JPA, Hibernate, Spring Data JPA는 각각 무엇인가</title>
  <desc id="d">내 애플리케이션 코드부터 Spring Data JPA, JPA, Hibernate, JDBC 및 DB로 이어지는 계층 구조 다이어그램</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Box 1: 내 애플리케이션 코드 -->
  <rect x="130" y="35" width="620" height="76" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="62" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">내 애플리케이션 코드</text>
  <text x="440" y="88" font-size="13" fill="#52606d" text-anchor="middle">memberRepository.findByEmail("a@b.com")</text>

  <!-- Arrow 1 -->
  <path d="M440,111 L440,142" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Box 2: Spring Data JPA -->
  <rect x="130" y="150" width="620" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="177" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Spring Data JPA</text>
  <text x="440" y="201" font-size="13" fill="#1f2933" text-anchor="middle">인터페이스만 선언하면 구현체를 만들어 주는</text>
  <text x="440" y="225" font-size="13" fill="#1f2933" text-anchor="middle">편의 계층. 내부적으로 EntityManager를 호출.</text>

  <!-- Arrow 2 -->
  <path d="M440,244 L440,275" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Box 3: JPA (표준 명세 / 인터페이스) -->
  <rect x="130" y="283" width="620" height="94" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="310" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">JPA (표준 명세 / 인터페이스)</text>
  <text x="440" y="334" font-size="13" fill="#1f2933" text-anchor="middle">EntityManager, @Entity, JPQL 같은 "규격"만</text>
  <text x="440" y="358" font-size="13" fill="#1f2933" text-anchor="middle">정의. 스스로 동작하는 코드는 없다.</text>

  <!-- Arrow 3 -->
  <path d="M440,377 L440,408" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Box 4: Hibernate (구현체) -->
  <rect x="130" y="416" width="620" height="94" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="443" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Hibernate (구현체)</text>
  <text x="440" y="467" font-size="13" fill="#1f2933" text-anchor="middle">실제로 SQL을 만들고 JDBC를 호출하는 엔진</text>
  <text x="440" y="491" font-size="13" fill="#1f2933" text-anchor="middle">EclipseLink, DataNucleus 등 다른 구현체도 있음</text>

  <!-- Arrow 4 -->
  <path d="M440,510 L440,536" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Bottom: JDBC → DB -->
  <rect x="320" y="544" width="240" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="569" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">JDBC → DB</text>
</svg>