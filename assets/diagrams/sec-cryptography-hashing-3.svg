<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레인보우 테이블 공격</title>
  <desc id="d">공격자는 유출 이전에 수십억 개의 흔한 비밀번호(+ 조합)와 그 SHA-256 해시값을 짝지은 표를 미리 만들어 둔다. DB가 유출되면 해시값으로 표를 조회해 일치하는 즉시 원본을 확인하므로 계산 시간이 0이다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ① 유출 이전: 미리 만든 표 -->
  <rect x="24" y="24" width="496" height="272" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="58" font-size="17" font-weight="bold" fill="#111827">① 공격자가 유출 이전에 미리 만들어두는 표</text>

  <!-- 표 -->
  <rect x="44" y="80" width="456" height="40" fill="#e5e7eb"/>
  <rect x="44" y="120" width="456" height="150" fill="#ffffff"/>
  <path d="M44,120 H500 M44,170 H500 M44,220 H500 M220,80 V220" stroke="#9ca3af" stroke-width="1" fill="none"/>
  <rect x="44" y="80" width="456" height="190" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <text x="132" y="106" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">비밀번호</text>
  <text x="360" y="106" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">SHA-256 해시값</text>

  <text x="132" y="151" font-size="17" text-anchor="middle" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"123456"</text>
  <text x="360" y="151" font-size="17" text-anchor="middle" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">8d969eef...</text>

  <text x="132" y="201" font-size="17" text-anchor="middle" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"password"</text>
  <text x="360" y="201" font-size="17" text-anchor="middle" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">5e884898...</text>

  <text x="272" y="251" font-size="15" text-anchor="middle" fill="#4b5563">(수십억 개의 흔한 비밀번호 + 조합)</text>

  <!-- 조회 화살표 -->
  <path d="M578,100 H504" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ah-red)"/>

  <!-- ② DB가 유출되면 -->
  <rect x="560" y="24" width="296" height="272" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="580" y="58" font-size="17" font-weight="bold" fill="#111827">② DB가 유출되면</text>

  <rect x="580" y="76" width="256" height="48" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="708" y="106" font-size="16" text-anchor="middle" fill="#111827">해시값으로 표를 조회</text>
  <path d="M708,126 V146" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="580" y="150" width="256" height="48" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="708" y="180" font-size="16" text-anchor="middle" fill="#111827">일치하면 즉시 원본 확인</text>
  <path d="M708,200 V220" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="580" y="224" width="256" height="50" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="708" y="256" font-size="20" font-weight="bold" text-anchor="middle" fill="#b91c1c">계산 시간 0</text>
</svg>
