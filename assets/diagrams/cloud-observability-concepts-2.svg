<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">라벨 조합과 시계열 수</title>
  <desc id="d">http_requests_total 메트릭의 라벨 값 개수 5, 6, 20, 50을 곱하면 시계열이 30,000개가 되고, 사용자 100만 명의 user_id 라벨을 더하면 300억 개로 불어난다는 것을 보여줍니다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- 메트릭 이름과 라벨 -->
  <rect x="24" y="24" width="832" height="52" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">http_requests_total{method, status, endpoint, pod}</text>

  <!-- 라벨별 값 개수 표 -->
  <rect x="24" y="96" width="832" height="36" fill="#e5e7eb"/>
  <text x="48" y="120" font-size="15" font-weight="bold" fill="#374151">라벨</text>
  <text x="196" y="120" font-size="15" font-weight="bold" fill="#374151">값</text>
  <text x="832" y="120" font-size="15" font-weight="bold" fill="#374151" text-anchor="end">값 개수</text>

  <text x="48" y="162" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">method</text>
  <text x="196" y="162" font-size="17" fill="#1f2937">GET, POST, PUT, DELETE, PATCH</text>
  <text x="832" y="163" font-size="20" font-weight="bold" fill="#111827" text-anchor="end">5</text>

  <line x1="24" y1="180" x2="856" y2="180" stroke="#d1d5db" stroke-width="1"/>
  <text x="48" y="210" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">status</text>
  <text x="196" y="210" font-size="17" fill="#1f2937">200, 201, 400, 401, 404, 500</text>
  <text x="740" y="211" font-size="20" fill="#4b5563" text-anchor="middle">×</text>
  <text x="832" y="211" font-size="20" font-weight="bold" fill="#111827" text-anchor="end">6</text>

  <line x1="24" y1="228" x2="856" y2="228" stroke="#d1d5db" stroke-width="1"/>
  <text x="48" y="258" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">endpoint</text>
  <text x="196" y="258" font-size="17" fill="#1f2937">/orders, /users, ... (20개)</text>
  <text x="740" y="259" font-size="20" fill="#4b5563" text-anchor="middle">×</text>
  <text x="832" y="259" font-size="20" font-weight="bold" fill="#111827" text-anchor="end">20</text>

  <line x1="24" y1="276" x2="856" y2="276" stroke="#d1d5db" stroke-width="1"/>
  <text x="48" y="306" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">pod</text>
  <text x="196" y="306" font-size="17" fill="#1f2937">주문 서비스 파드 50개</text>
  <text x="740" y="307" font-size="20" fill="#4b5563" text-anchor="middle">×</text>
  <text x="832" y="307" font-size="20" font-weight="bold" fill="#111827" text-anchor="end">50</text>

  <!-- 합계 행 -->
  <rect x="24" y="324" width="832" height="60" fill="#eff6ff"/>
  <line x1="24" y1="324" x2="856" y2="324" stroke="#374151" stroke-width="2"/>
  <text x="48" y="362" font-size="18" font-weight="bold" fill="#111827">시계열 수 = 5 × 6 × 20 × 50</text>
  <text x="832" y="364" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="end">= <tspan font-size="26">30,000</tspan></text>
  <rect x="24" y="96" width="832" height="288" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- user_id 라벨 추가 -->
  <rect x="24" y="408" width="832" height="136" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="48" y="446" font-size="18" font-weight="bold" fill="#b91c1c">여기에 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_id</tspan> 라벨을 추가하면? (사용자 100만 명)</text>
  <line x1="48" y1="470" x2="832" y2="470" stroke="#fca5a5" stroke-width="1"/>
  <text x="48" y="512" font-size="18" font-weight="bold" fill="#111827">시계열 수 = 30,000 × 1,000,000</text>
  <text x="832" y="516" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="end">= <tspan font-size="32">300억</tspan></text>
</svg>
