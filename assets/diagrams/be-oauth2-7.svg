<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PKCE 흐름</title>
  <desc id="d">앱이 인가 요청 전에 code_verifier를 만들어 메모리에만 두고 그 해시인 code_challenge만 Auth Server에 보내면, 서버는 이를 code와 함께 저장했다가 토큰 교환 때 받은 verifier를 SHA256으로 계산해 비교하고 일치해야 토큰을 발급합니다. 공격자가 콜백의 code를 훔쳐도 verifier를 모르고 challenge는 역산할 수 없습니다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>
  <defs>
    <marker id="mp" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="mk" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="190" y="24" width="300" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="340" y="52" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">앱 (Public Client)</text>
  <rect x="600" y="24" width="256" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="728" y="52" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Auth Server</text>

  <!-- 생명선 -->
  <line x1="340" y1="68" x2="340" y2="484" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="728" y1="68" x2="728" y2="484" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 단계 이름 -->
  <text x="24" y="155" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#111827">[1]</tspan> 인가 요청 전</text>
  <text x="24" y="267" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#111827">[2]</tspan> 인가 요청 시</text>
  <text x="24" y="347" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#111827">[3]</tspan> 브라우저 콜백</text>
  <text x="24" y="435" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#111827">[4]</tspan> 토큰 교환 시</text>

  <!-- [1] 앱 안에서 생성 -->
  <rect x="202" y="88" width="276" height="122" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="218" y="116" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14" font-weight="bold" fill="#1d4ed8">code_verifier</tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14"> = </tspan>랜덤 문자열</text>
  <text x="218" y="139" font-size="14" fill="#4b5563">(앱 메모리에만 보관)</text>
  <text x="218" y="172" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937"><tspan font-weight="bold" fill="#6d28d9">code_challenge</tspan> =</text>
  <text x="218" y="195" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">BASE64URL(SHA256(<tspan fill="#1d4ed8">code_verifier</tspan>))</text>

  <!-- [2] challenge 전송 -->
  <line x1="342" y1="262" x2="610" y2="262" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#mp)"/>
  <text x="476" y="250" font-size="15" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#6d28d9" text-anchor="middle">code_challenge</text>
  <rect x="612" y="232" width="232" height="60" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="628" y="256" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14" fill="#6d28d9">code_challenge</tspan>를</text>
  <text x="628" y="280" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14" fill="#b45309">code</tspan>와 함께 저장</text>

  <!-- [3] code 반환 (브라우저 경유) -->
  <line x1="726" y1="342" x2="342" y2="342" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#mb)"/>
  <text x="534" y="330" font-size="15" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#b45309" text-anchor="middle">code</text>
  <text x="534" y="366" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">공격자가 가로챌 수 있는 구간</text>

  <!-- [4] 토큰 교환 -->
  <line x1="342" y1="430" x2="610" y2="430" stroke="#1f2937" stroke-width="2.5" marker-end="url(#mk)"/>
  <text x="476" y="418" font-size="15" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937" text-anchor="middle"><tspan fill="#b45309">code</tspan> + <tspan fill="#1d4ed8">verifier</tspan></text>
  <rect x="612" y="388" width="232" height="86" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="628" y="412" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14">SHA256(<tspan fill="#1d4ed8">verifier</tspan>)</tspan>를 계산해</text>
  <text x="628" y="436" font-size="15" fill="#1f2937">저장된 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14" fill="#6d28d9">challenge</tspan>와 비교</text>
  <text x="628" y="461" font-size="15" font-weight="bold" fill="#047857">일치해야 발급</text>

  <!-- 공격자 관점 -->
  <rect x="24" y="504" width="832" height="102" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="48" y="535" font-size="17" font-weight="bold" fill="#991b1b">공격자가 [3]의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#b45309">code</tspan>를 훔쳐도</text>
  <text x="48" y="564" font-size="15" fill="#1f2937">· [1]의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14" font-weight="bold" fill="#1d4ed8">verifier</tspan>를 모르고</text>
  <text x="48" y="590" font-size="15" fill="#1f2937">· <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14" font-weight="bold" fill="#6d28d9">challenge</tspan>는 해시라 역산이 불가능하다</text>
</svg>
