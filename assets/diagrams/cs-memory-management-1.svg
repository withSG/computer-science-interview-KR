<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">c 실행 시점의 스택 프레임</title>
  <desc id="d">a(5)가 b를, b가 c를 호출해 main, a, b, c 프레임이 높은 주소에서 낮은 주소 쪽으로 쌓이고 스택 포인터(SP)가 맨 아래 c 프레임을 가리킨다. c가 리턴하면 SP를 b 프레임 끝으로 되돌리는 것이 해제의 전부다.</desc>
  <rect width="880" height="660" fill="#ffffff"/>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 코드 -->
  <rect x="24" y="24" width="832" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="58" font-size="16" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" xml:space="preserve">int a(int x) { return <tspan fill="#1d4ed8" font-weight="bold">b(x)</tspan> + 1; }</text>
  <text x="48" y="86" font-size="16" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" xml:space="preserve">int b(int y) { return <tspan fill="#1d4ed8" font-weight="bold">c(y)</tspan> * 2; }</text>
  <text x="48" y="114" font-size="16" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" xml:space="preserve">int c(int z) { return z;        }</text>

  <!-- 캡션 -->
  <text x="24" y="180" font-size="18" font-weight="bold" fill="#111827">a(5) 호출 중 c 실행 시점의 Stack</text>

  <!-- 주소 방향 -->
  <text x="150" y="222" font-size="15" font-weight="bold" fill="#4b5563">높은 주소</text>
  <line x1="126" y1="240" x2="126" y2="528" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-gray)"/>
  <text x="150" y="562" font-size="15" fill="#4b5563"><tspan font-weight="bold">낮은 주소</tspan>   (아래로 자란다)</text>

  <!-- 프레임 -->
  <rect x="150" y="232" width="300" height="76" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="170" y="264" font-size="17" font-weight="bold" fill="#111827">main 프레임</text>
  <text x="170" y="292" font-size="15" fill="#4b5563">지역변수, 리턴주소</text>

  <rect x="150" y="308" width="300" height="76" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="170" y="340" font-size="17" font-weight="bold" fill="#111827">a 프레임</text>
  <text x="430" y="340" font-size="16" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">(x=5)</text>
  <text x="170" y="368" font-size="15" fill="#4b5563">리턴주소 → main</text>

  <rect x="150" y="384" width="300" height="76" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="170" y="416" font-size="17" font-weight="bold" fill="#111827">b 프레임</text>
  <text x="430" y="416" font-size="16" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">(y=5)</text>
  <text x="170" y="444" font-size="15" fill="#4b5563">리턴주소 → a</text>

  <rect x="150" y="460" width="300" height="76" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="492" font-size="17" font-weight="bold" fill="#1e3a8a">c 프레임</text>
  <text x="430" y="492" font-size="16" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">(z=5)</text>
  <text x="170" y="520" font-size="15" fill="#1e3a8a">실행 중</text>

  <!-- 리턴 후 SP (점선) -->
  <line x1="580" y1="460" x2="460" y2="460" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-gray)"/>
  <text x="590" y="465" font-size="15" fill="#4b5563">c 리턴 후 SP (b 프레임 끝)</text>

  <!-- 현재 SP -->
  <line x1="580" y1="506" x2="460" y2="506" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#m-blue)"/>
  <rect x="590" y="492" width="44" height="28" rx="6" fill="#1d4ed8"/>
  <text x="612" y="512" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SP</text>
  <text x="644" y="512" font-size="15" fill="#1e3a8a">스택 포인터가 여기를 가리킴</text>

  <!-- 요점 -->
  <rect x="24" y="588" width="832" height="48" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="44" y="618" font-size="16" font-weight="bold" fill="#92400e">c가 리턴하면 SP를 b 프레임 끝으로 되돌린다. 그게 전부다.</text>
</svg>
