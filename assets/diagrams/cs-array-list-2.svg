<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배열 중간 삽입과 이동</title>
  <desc id="d">arr[1] 자리에 15를 삽입하려면 before의 20, 30, 40, 50이 뒤로 한 칸씩 이동(4번)해야 하고, after는 10, 15, 20, 30, 40, 50이 된다.</desc>
  <rect width="880" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="24" y="38" font-size="18" font-weight="bold" fill="#111827">arr[1] 자리에 <tspan fill="#047857">15</tspan>를 삽입</text>

  <!-- 인덱스 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="180" y="76">[0]</text>
    <text x="260" y="76" fill="#047857" font-weight="bold">[1]</text>
    <text x="340" y="76">[2]</text>
    <text x="420" y="76">[3]</text>
    <text x="500" y="76">[4]</text>
    <text x="580" y="76">[5]</text>
  </g>

  <!-- before -->
  <text x="24" y="118" font-size="16" font-weight="bold" fill="#374151">before</text>
  <rect x="140" y="86" width="80" height="52" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <g fill="#fffbeb" stroke="#b45309" stroke-width="1.5">
    <rect x="220" y="86" width="80" height="52"/>
    <rect x="300" y="86" width="80" height="52"/>
    <rect x="380" y="86" width="80" height="52"/>
    <rect x="460" y="86" width="80" height="52"/>
  </g>
  <rect x="540" y="86" width="80" height="52" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <text x="180" y="119" fill="#111827">10</text>
    <text x="260" y="119" fill="#92400e">20</text>
    <text x="340" y="119" fill="#92400e">30</text>
    <text x="420" y="119" fill="#92400e">40</text>
    <text x="500" y="119" fill="#92400e">50</text>
  </g>

  <!-- 이동 화살표 -->
  <g stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ah-o)">
    <line x1="260" y1="144" x2="338" y2="207"/>
    <line x1="340" y1="144" x2="418" y2="207"/>
    <line x1="420" y1="144" x2="498" y2="207"/>
    <line x1="500" y1="144" x2="578" y2="207"/>
  </g>
  <text x="606" y="180" font-size="16" font-weight="bold" fill="#b45309">뒤로 한 칸씩 이동 (4번)</text>

  <!-- after -->
  <text x="24" y="246" font-size="16" font-weight="bold" fill="#374151">after</text>
  <rect x="140" y="214" width="80" height="52" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="220" y="214" width="80" height="52" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <g fill="#fffbeb" stroke="#b45309" stroke-width="1.5">
    <rect x="300" y="214" width="80" height="52"/>
    <rect x="380" y="214" width="80" height="52"/>
    <rect x="460" y="214" width="80" height="52"/>
    <rect x="540" y="214" width="80" height="52"/>
  </g>
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <text x="180" y="247" fill="#111827">10</text>
    <text x="260" y="247" fill="#047857">15</text>
    <text x="340" y="247" fill="#92400e">20</text>
    <text x="420" y="247" fill="#92400e">30</text>
    <text x="500" y="247" fill="#92400e">40</text>
    <text x="580" y="247" fill="#92400e">50</text>
  </g>
</svg>
