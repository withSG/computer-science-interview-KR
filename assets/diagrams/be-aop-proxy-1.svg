<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컨테이너에 등록되는 것은 원본이 아니다</title>
  <desc id="d">AOP 적용 전에는 컨테이너와 주입받는 쪽이 모두 원본 OrderService를 가리킨다. AOP 적용 후에는 둘 다 OrderService$$Proxy를 가리키고, 원본(target)은 프록시가 내부 참조로만 들고 있다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- AOP 적용 전 -->
  <rect x="24" y="24" width="832" height="136" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="54" font-size="17" font-weight="bold" fill="#374151">AOP 적용 전</text>

  <rect x="48" y="72" width="144" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="106" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">컨테이너</text>

  <line x1="200" y1="100" x2="320" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="260" y="90" font-size="14" fill="#4b5563" text-anchor="middle">등록</text>

  <rect x="330" y="72" width="220" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="440" y="96" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService</text>
  <text x="440" y="118" font-size="14" fill="#4b5563" text-anchor="middle">원본</text>

  <line x1="680" y1="100" x2="560" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="620" y="90" font-size="14" fill="#4b5563" text-anchor="middle">주입받아 참조</text>

  <rect x="688" y="72" width="144" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="760" y="106" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">주입받는 쪽</text>

  <!-- AOP 적용 후 -->
  <rect x="24" y="180" width="832" height="236" rx="12" fill="#faf8ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="44" y="210" font-size="17" font-weight="bold" fill="#6d28d9">AOP 적용 후</text>

  <rect x="48" y="228" width="144" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="262" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">컨테이너</text>

  <line x1="200" y1="256" x2="310" y2="256" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="255" y="246" font-size="14" fill="#6d28d9" text-anchor="middle">등록</text>

  <rect x="320" y="228" width="240" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="440" y="252" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService$$Proxy</text>
  <text x="440" y="274" font-size="14" fill="#5b21b6" text-anchor="middle">프록시</text>

  <line x1="680" y1="256" x2="570" y2="256" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="625" y="246" font-size="14" fill="#6d28d9" text-anchor="middle">주입받아 참조</text>

  <rect x="688" y="228" width="144" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="760" y="262" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">주입받는 쪽</text>

  <line x1="440" y1="290" x2="440" y2="330" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="454" y="315" font-size="14" fill="#6d28d9">내부 참조</text>

  <rect x="330" y="336" width="220" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="360" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService</text>
  <text x="440" y="382" font-size="14" fill="#4b5563" text-anchor="middle">원본, target</text>
</svg>
