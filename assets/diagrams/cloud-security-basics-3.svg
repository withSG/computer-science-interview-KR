<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">자기 자신을 잠그지 않는 절차</title>
  <desc id="d">SSH 설정을 안전하게 변경하기 위한 6단계 순서도 및 주의사항 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="41.6" font-size="16" font-weight="bold" fill="#1f2933">자기 자신을 잠그지 않는 절차</text>

  <!-- Flow Steps -->

  <!-- Step 1 (Critical Safety - Red Highlight) -->
  <rect x="40" y="60" width="460" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="89.55" font-size="13" font-weight="bold" fill="#dc2626">1. 지금 열려 있는 SSH 세션을 절대 닫지 않는다</text>
  
  <path d="M 500 84 L 560 84" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="568" y="68" width="80" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="608" y="89.025" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">← 생명줄</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 270 108 L 270 130" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 2 -->
  <rect x="40" y="130" width="460" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="159.55" font-size="13" fill="#1f2933">2. 설정 파일 수정</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 270 178 L 270 200" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 3 (Validation) -->
  <rect x="40" y="200" width="460" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="229.55" font-size="13" font-weight="bold" fill="#1f2933">3. sudo sshd -t</text>

  <path d="M 500 224 L 530 224" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="538" y="208" width="302" height="32" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="689" y="229.025" font-size="11.5" fill="#d97706" text-anchor="middle">문법 검사. 에러 있으면 여기서 멈춘다</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 270 248 L 270 270" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 4 -->
  <rect x="40" y="270" width="460" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="299.55" font-size="13" fill="#1f2933">4. sudo systemctl restart sshd</text>
  <text x="270" y="299.55" font-size="11.5" fill="#52606d">(Debian 계열은 서비스명이 ssh)</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M 270 318 L 270 340" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 5 (Test) -->
  <rect x="40" y="340" width="460" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="369.55" font-size="13" font-weight="bold" fill="#2563eb">5. 새 터미널을 열어 접속 테스트</text>

  <!-- Arrow 5 -> 6 -->
  <path d="M 270 388 L 270 410" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 6 (Completion) -->
  <rect x="40" y="410" width="460" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="439.55" font-size="13" font-weight="bold" fill="#059669">6. 성공을 확인한 뒤에야 1번 세션을 닫는다</text>

  <!-- Connection line connecting Step 6 back to Step 1 rule visually -->
  <path d="M 500 434 L 520 434 L 520 84 L 500 84" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#a-blue)"/>
  <rect x="475" y="250" width="90" height="24" rx="3" fill="#ffffff" stroke="#cbd2d9"/>
  <text x="520" y="266.025" font-size="11" fill="#2563eb" text-anchor="middle">1번 세션 보호</text>

</svg>