<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">sshd 안전 변경 절차</title>
  <desc id="d">기존 SSH 세션을 생명줄로 열어 둔 채 설정 수정, sshd -t 문법 검사, sshd 재시작, 새 터미널 접속 테스트를 거치고, 성공을 확인한 뒤에야 처음 세션을 닫는 6단계 절차.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 생명줄: 1번 세션이 1~6단계 내내 열려 있음 -->
  <line x1="124" y1="50" x2="124" y2="440" stroke="#b91c1c" stroke-width="3"/>
  <line x1="124" y1="50" x2="150" y2="50" stroke="#b91c1c" stroke-width="3"/>
  <line x1="124" y1="440" x2="150" y2="440" stroke="#b91c1c" stroke-width="3"/>
  <text x="66" y="226" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">생명줄</text>
  <text x="66" y="250" font-size="15" fill="#374151" text-anchor="middle">1번 세션</text>
  <text x="66" y="272" font-size="15" fill="#374151" text-anchor="middle">계속 열어 둠</text>

  <!-- 1 -->
  <rect x="150" y="24" width="410" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="178" cy="50" r="15" fill="#b91c1c"/>
  <text x="178" y="55" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="204" y="56" font-size="16" font-weight="bold" fill="#111827">지금 열려 있는 SSH 세션을 절대 닫지 않는다</text>
  <line x1="355" y1="78" x2="355" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect x="150" y="102" width="410" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="178" cy="128" r="15" fill="#374151"/>
  <text x="178" y="133" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="204" y="134" font-size="16" fill="#111827">설정 파일 수정</text>
  <line x1="355" y1="156" x2="355" y2="178" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect x="150" y="180" width="410" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="178" cy="206" r="15" fill="#b45309"/>
  <text x="178" y="211" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="204" y="212" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">sudo sshd -t</text>
  <line x1="562" y1="206" x2="584" y2="206" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="594" y="199" font-size="15" font-weight="bold" fill="#b45309">문법 검사</text>
  <text x="594" y="222" font-size="15" fill="#374151">에러 있으면 여기서 멈춘다</text>
  <line x1="355" y1="234" x2="355" y2="256" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect x="150" y="258" width="410" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="178" cy="284" r="15" fill="#374151"/>
  <text x="178" y="289" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="204" y="290" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">sudo systemctl restart sshd</text>
  <line x1="562" y1="284" x2="584" y2="284" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="594" y="289" font-size="15" fill="#374151">Debian 계열은 서비스명이 ssh</text>
  <line x1="355" y1="312" x2="355" y2="334" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 5 -->
  <rect x="150" y="336" width="410" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="178" cy="362" r="15" fill="#1d4ed8"/>
  <text x="178" y="367" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="204" y="368" font-size="16" font-weight="bold" fill="#111827">새 터미널을 열어 접속 테스트</text>
  <line x1="562" y1="362" x2="584" y2="362" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="594" y="355" font-size="15" fill="#374151"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">sshd -t</tspan>가 못 잡는 논리 오류</text>
  <text x="594" y="378" font-size="15" fill="#374151">(예: AllowUsers 누락)를 잡는다</text>
  <line x1="355" y1="390" x2="355" y2="412" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 6 -->
  <rect x="150" y="414" width="410" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <circle cx="178" cy="440" r="15" fill="#047857"/>
  <text x="178" y="445" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="204" y="446" font-size="16" font-weight="bold" fill="#111827">성공을 확인한 뒤에야 1번 세션을 닫는다</text>
</svg>
