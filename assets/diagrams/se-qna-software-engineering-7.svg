<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MSA와 모놀리식 선택 기준</title>
  <desc id="d">MSA 도입이 맞는 경우 네 가지와 모놀리식이 적합한 경우 세 가지를 나란히 비교한다. 아래 띠는 먼저 모놀리식으로 시작하고 성장 후 Strangler Fig 패턴으로 MSA로 전환하는 순서를 보여준다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- ===== MSA 도입 시기 ===== -->
  <path d="M24,76 V34 A10,10 0 0 1 34,24 H422 A10,10 0 0 1 432,34 V76 Z" fill="#dbeafe"/>
  <line x1="24" y1="76" x2="432" y2="76" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="24" y="24" width="408" height="228" rx="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="44" y="57" font-size="19" font-weight="700" fill="#1e3a8a">MSA 도입 시기</text>

  <text x="46" y="112" font-size="17" font-weight="700" fill="#1d4ed8">✓</text>
  <text x="72" y="112" font-size="16" fill="#111827">팀 규모가 크고 독립적 배포가 필요</text>
  <text x="46" y="152" font-size="17" font-weight="700" fill="#1d4ed8">✓</text>
  <text x="72" y="152" font-size="16" fill="#111827">서비스별 다른 기술 스택이 필요</text>
  <text x="46" y="192" font-size="17" font-weight="700" fill="#1d4ed8">✓</text>
  <text x="72" y="192" font-size="16" fill="#111827">특정 기능만 집중적으로 확장 필요</text>
  <text x="46" y="232" font-size="17" font-weight="700" fill="#1d4ed8">✓</text>
  <text x="72" y="232" font-size="16" fill="#111827">장애 격리가 중요한 경우</text>

  <!-- ===== 모놀리식이 적합한 경우 ===== -->
  <path d="M448,76 V34 A10,10 0 0 1 458,24 H846 A10,10 0 0 1 856,34 V76 Z" fill="#fef3c7"/>
  <line x1="448" y1="76" x2="856" y2="76" stroke="#b45309" stroke-width="1"/>
  <rect x="448" y="24" width="408" height="228" rx="10" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="468" y="57" font-size="19" font-weight="700" fill="#78350f">모놀리식이 적합한 경우</text>

  <text x="470" y="112" font-size="17" font-weight="700" fill="#b45309">✓</text>
  <text x="496" y="112" font-size="16" fill="#111827">소규모 팀, 초기 스타트업</text>
  <text x="470" y="152" font-size="17" font-weight="700" fill="#b45309">✓</text>
  <text x="496" y="152" font-size="16" fill="#111827">도메인이 아직 명확하지 않음</text>
  <text x="470" y="192" font-size="17" font-weight="700" fill="#b45309">✓</text>
  <text x="496" y="192" font-size="16" fill="#111827">분산 시스템 운영 역량 부족</text>

  <!-- ===== 권장 순서 ===== -->
  <rect x="24" y="276" width="832" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="56" y="306" width="250" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="181" y="342" font-size="17" font-weight="700" fill="#78350f" text-anchor="middle">① 먼저 모놀리식으로 시작</text>

  <line x1="310" y1="336" x2="566" y2="336" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="438" y="324" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">성장 후</text>
  <text x="438" y="360" font-size="15" fill="#374151" text-anchor="middle">Strangler Fig 패턴</text>

  <rect x="574" y="306" width="250" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="699" y="342" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">② MSA로 전환</text>
</svg>
