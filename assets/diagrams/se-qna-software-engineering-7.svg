<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">언제 MSA를 선택하는가?</title>
  <desc id="d">MSA 도입 시기와 모놀리식이 적합한 경우를 비교하고, 전환 전략인 Strangler Fig 패턴을 설명하는 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 메인 제목 -->
  <text x="30" y="44" font-size="16" font-weight="bold" fill="#1f2933">언제 MSA를 선택하는가?</text>

  <!-- 왼쪽 박스: MSA 도입 시기 -->
  <rect x="30" y="70" width="395" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="30" y="70" width="395" height="40" rx="8" fill="#2563eb"/>
  <!-- 하단 라운드 가리기용 덮개 -->
  <rect x="30" y="100" width="395" height="10" fill="#2563eb"/>
  <text x="45" y="95" font-size="14" font-weight="bold" fill="#ffffff">MSA 도입 시기:</text>

  <!-- MSA 항목들 -->
  <g font-size="13" fill="#1f2933">
    <!-- 항목 1 -->
    <text x="50" y="145" font-weight="bold" fill="#059669">✓</text>
    <text x="68" y="145">팀 규모가 크고 독립적 배포가 필요</text>

    <!-- 항목 2 -->
    <text x="50" y="195" font-weight="bold" fill="#059669">✓</text>
    <text x="68" y="195">서비스별 다른 기술 스택이 필요</text>

    <!-- 항목 3 -->
    <text x="50" y="245" font-weight="bold" fill="#059669">✓</text>
    <text x="68" y="245">특정 기능만 집중적으로 확장 필요</text>

    <!-- 항목 4 -->
    <text x="50" y="295" font-weight="bold" fill="#059669">✓</text>
    <text x="68" y="295">장애 격리가 중요한 경우</text>
  </g>

  <!-- 오른쪽 박스: 모놀리식이 적합한 경우 -->
  <rect x="455" y="70" width="395" height="300" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="455" y="70" width="395" height="40" rx="8" fill="#d97706"/>
  <!-- 하단 라운드 가리기용 덮개 -->
  <rect x="455" y="100" width="395" height="10" fill="#d97706"/>
  <text x="470" y="95" font-size="14" font-weight="bold" fill="#ffffff">모놀리식이 적합한 경우:</text>

  <!-- 모놀리식 항목들 -->
  <g font-size="13" fill="#1f2933">
    <!-- 항목 1 -->
    <text x="475" y="145" font-weight="bold" fill="#d97706">✓</text>
    <text x="493" y="145">소규모 팀, 초기 스타트업</text>

    <!-- 항목 2 -->
    <text x="475" y="195" font-weight="bold" fill="#d97706">✓</text>
    <text x="493" y="195">도메인이 아직 명확하지 않음</text>

    <!-- 항목 3 -->
    <text x="475" y="245" font-weight="bold" fill="#d97706">✓</text>
    <text x="493" y="245">분산 시스템 운영 역량 부족</text>
  </g>

  <!-- 하단 전환 화살표 영역 -->
  <path d="M 652 380 L 652 412 L 227 412 L 227 380" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>

  <!-- 화살표 중앙 라벨 영역 -->
  <rect x="215" y="400" width="450" height="24" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="416" font-size="11.5" fill="#1f2933" text-anchor="middle">→ 먼저 모놀리식으로 시작, 성장 후 MSA로 전환 (Strangler Fig 패턴)</text>
</svg>