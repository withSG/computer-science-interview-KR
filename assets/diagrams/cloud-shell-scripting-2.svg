<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">trap으로 뒷정리 보장</title>
  <desc id="d">정상 흐름, 중간 실패(set -e 종료), Ctrl+C(SIGINT) 세 가지 경로가 모두 trap EXIT로 모여 cleanup을 실행한다. 어떤 경로로 끝나도 cleanup은 반드시 지난다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ───── 경로 1: 정상 흐름 ───── -->
  <text x="160" y="42" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">정상 흐름</text>
  <rect x="72" y="64" width="176" height="44" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="92" font-size="16" fill="#111827" text-anchor="middle">작업 1</text>
  <line x1="160" y1="108" x2="160" y2="136" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>
  <rect x="72" y="140" width="176" height="44" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="168" font-size="16" fill="#111827" text-anchor="middle">작업 2</text>
  <line x1="160" y1="184" x2="160" y2="212" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>
  <rect x="72" y="216" width="176" height="44" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="244" font-size="16" fill="#111827" text-anchor="middle">작업 3</text>
  <path d="M160,260 L160,332 L284,332" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>
  <text x="172" y="298" font-size="15" fill="#1d4ed8">정상 종료</text>

  <!-- ───── 경로 2: 중간 실패 ───── -->
  <text x="440" y="42" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">중간 실패</text>
  <rect x="352" y="64" width="176" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="92" font-size="16" fill="#111827" text-anchor="middle">작업 1</text>
  <line x1="440" y1="108" x2="440" y2="136" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>
  <rect x="352" y="140" width="176" height="44" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="168" font-size="16" fill="#111827" text-anchor="middle">작업 2 <tspan font-weight="bold" fill="#b91c1c">✗</tspan></text>
  <line x1="440" y1="184" x2="440" y2="212" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>
  <rect x="352" y="216" width="176" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="244" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">set -e 종료</text>
  <line x1="440" y1="260" x2="440" y2="294" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>

  <!-- ───── 경로 3: Ctrl+C ───── -->
  <text x="720" y="42" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">Ctrl+C</text>
  <rect x="632" y="64" width="176" height="44" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="720" y="92" font-size="16" fill="#111827" text-anchor="middle">작업 1</text>
  <line x1="720" y1="108" x2="720" y2="136" stroke="#6d28d9" stroke-width="2" marker-end="url(#ar-purple)"/>
  <rect x="632" y="140" width="176" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="720" y="168" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">[SIGINT]</text>
  <path d="M720,184 L720,332 L596,332" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#ar-purple)"/>

  <!-- ───── 합류: trap ───── -->
  <rect x="290" y="298" width="300" height="68" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="326" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">trap EXIT</text>
  <text x="440" y="352" font-size="15" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">trap cleanup EXIT INT TERM</text>

  <line x1="440" y1="366" x2="440" y2="398" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>

  <!-- ───── cleanup ───── -->
  <rect x="190" y="402" width="500" height="76" rx="10" fill="#047857" stroke="#065f46" stroke-width="1.5"/>
  <text x="440" y="433" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">cleanup 실행</text>
  <text x="440" y="462" font-size="16" fill="#ffffff" text-anchor="middle">어떤 경로로 끝나도 반드시 지난다</text>
</svg>
