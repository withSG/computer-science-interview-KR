<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">trap — 뒷정리 보장</title>
  <desc id="d">정상 흐름, 중간 실패, Ctrl+C 시그널 흐름이 모두 trap EXIT를 거쳐 cleanup을 실행하는 흐름도</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Section Backgrounds -->
  <rect x="50" y="30" width="220" height="300" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="330" y="30" width="220" height="300" rx="8" fill="#fef2f2" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="610" y="30" width="220" height="300" rx="8" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Column 1: 정상 흐름 -->
  <text x="160" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">정상 흐름</text>
  
  <rect x="90" y="90" width="140" height="36" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="113" text-anchor="middle" font-size="13" fill="#1f2933">작업 1</text>

  <rect x="90" y="160" width="140" height="36" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="183" text-anchor="middle" font-size="13" fill="#1f2933">작업 2</text>

  <rect x="90" y="230" width="140" height="36" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="253" text-anchor="middle" font-size="13" fill="#1f2933">작업 3</text>

  <path d="M160,126 L160,160" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M160,196 L160,230" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M160,266 L160,370" stroke="#2563eb" stroke-width="1.5" fill="none"/>

  <!-- Column 2: 중간 실패 -->
  <text x="440" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">중간 실패</text>

  <rect x="370" y="90" width="140" height="36" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="113" text-anchor="middle" font-size="13" fill="#1f2933">작업 1</text>

  <rect x="370" y="160" width="140" height="36" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="430" y="183" text-anchor="middle" font-size="13" fill="#1f2933">작업 2</text>
  <text x="490" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">✗</text>

  <rect x="360" y="230" width="160" height="36" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">set -e 종료</text>

  <path d="M440,126 L440,160" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <path d="M440,196 L440,230" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <path d="M440,266 L440,370" stroke="#dc2626" stroke-width="1.5" fill="none"/>

  <!-- Column 3: Ctrl+C -->
  <text x="720" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c3aed">Ctrl+C</text>

  <rect x="650" y="90" width="140" height="36" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="720" y="113" text-anchor="middle" font-size="13" fill="#1f2933">작업 1</text>

  <rect x="650" y="160" width="140" height="36" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="720" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">[SIGINT]</text>

  <path d="M720,126 L720,160" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  <path d="M720,196 L720,370" stroke="#7c3aed" stroke-width="1.5" fill="none"/>

  <!-- Converging Paths to trap EXIT -->
  <path d="M160,370 L342,370" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M440,370 L440,370" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <path d="M720,370 L538,370" stroke="#7c3aed" stroke-width="1.5" fill="none"/>

  <!-- trap EXIT Node -->
  <rect x="350" y="350" width="180" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">trap EXIT</text>

  <!-- Arrow to cleanup -->
  <path d="M440,390 L440,432" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- cleanup Node -->
  <rect x="180" y="440" width="520" height="46" rx="6" fill="#059669" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">cleanup 실행 — 어떤 경로로 끝나도 반드시 지난다</text>
</svg>