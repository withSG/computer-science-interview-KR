<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DNS 조회 과정</title>
  <desc id="d">브라우저, OS, 라우터, ISP 캐시 확인 후 Root, TLD, Authoritative DNS로 이어지는 조회 과정을 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>
  <rect x="24" y="24" width="832" height="392" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="8"/>
  <text x="44" y="55" font-size="16" font-weight="bold" fill="#1f2933">DNS 조회 과정</text>
  
  <rect x="44" y="80" width="180" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="134" y="104" font-size="13" fill="#1f2933" text-anchor="middle">1. 브라우저 캐시 확인</text>
  
  <path d="M224,100 L244,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  
  <rect x="244" y="80" width="220" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="354" y="104" font-size="13" fill="#1f2933" text-anchor="middle">2. hosts 파일 · OS 캐시 확인</text>
  
  <path d="M464,100 L484,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  
  <rect x="484" y="80" width="160" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="564" y="104" font-size="13" fill="#1f2933" text-anchor="middle">3. 라우터 캐시 확인</text>
  
  <path d="M644,100 L664,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  
  <rect x="664" y="80" width="168" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="748" y="104" font-size="13" fill="#1f2933" text-anchor="middle">4. ISP DNS 서버 확인</text>
  
  <path d="M748,120 L748,150 L134,150 L134,170" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  
  <rect x="44" y="170" width="788" height="226" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4" rx="6"/>
  <text x="64" y="200" font-size="14" font-weight="bold" fill="#7c3aed">5. ISP DNS(재귀 리졸버)가 반복 질의 시작</text>
  
  <rect x="130" y="220" width="310" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="285" y="244" font-size="13" fill="#1f2933" text-anchor="middle">Root DNS (.com, .org 등 안내)</text>
  
  <rect x="230" y="280" width="280" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="370" y="304" font-size="13" fill="#1f2933" text-anchor="middle">TLD DNS (example.com 안내)</text>
  
  <rect x="330" y="340" width="280" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="470" y="364" font-size="13" fill="#1f2933" text-anchor="middle">Authoritative DNS (IP 반환)</text>
  
  <path d="M84,208 L84,240 L120,240" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M184,260 L184,300 L220,300" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M284,320 L284,360 L320,360" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
</svg>