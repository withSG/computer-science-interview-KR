<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DNS 조회 과정</title>
  <desc id="d">브라우저 캐시, hosts 파일·OS 캐시, 라우터 캐시, ISP DNS 서버 순으로 확인한 뒤, ISP DNS(재귀 리졸버)가 Root DNS, TLD DNS, Authoritative DNS에 차례로 반복 질의해 IP를 받는다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
  </defs>

  <!-- 1~4 캐시 확인 -->
  <rect x="24" y="24" width="180" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="114" y="57" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#1d4ed8">1.</tspan> 브라우저 캐시 확인</text>
  <line x1="206" y1="52" x2="226" y2="52" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>

  <rect x="228" y="24" width="232" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="344" y="57" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#1d4ed8">2.</tspan> hosts 파일 · OS 캐시 확인</text>
  <line x1="462" y1="52" x2="482" y2="52" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>

  <rect x="484" y="24" width="168" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="568" y="57" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#1d4ed8">3.</tspan> 라우터 캐시 확인</text>
  <line x1="654" y1="52" x2="674" y2="52" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>

  <rect x="676" y="24" width="180" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="766" y="57" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#1d4ed8">4.</tspan> ISP DNS 서버 확인</text>
  <line x1="766" y1="82" x2="766" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>

  <!-- 5. 반복 질의 -->
  <rect x="24" y="120" width="832" height="326" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="152" font-size="16" font-weight="bold" fill="#6d28d9">5. ISP DNS(재귀 리졸버)가 반복 질의 시작</text>

  <rect x="48" y="180" width="184" height="240" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="140" y="294" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">ISP DNS</text>
  <text x="140" y="318" font-size="15" fill="#374151" text-anchor="middle">(재귀 리졸버)</text>

  <!-- Root -->
  <rect x="600" y="182" width="232" height="56" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="716" y="216" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Root DNS</text>
  <line x1="236" y1="200" x2="594" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="416" y="190" font-size="15" fill="#374151" text-anchor="middle">① 질의</text>
  <line x1="596" y1="220" x2="238" y2="220" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ap)"/>
  <text x="416" y="244" font-size="15" fill="#6d28d9" text-anchor="middle">.com, .org 등 안내</text>

  <!-- TLD -->
  <rect x="600" y="272" width="232" height="56" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="716" y="306" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">TLD DNS</text>
  <line x1="236" y1="290" x2="594" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="416" y="280" font-size="15" fill="#374151" text-anchor="middle">② 질의</text>
  <line x1="596" y1="310" x2="238" y2="310" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ap)"/>
  <text x="416" y="334" font-size="15" fill="#6d28d9" text-anchor="middle">example.com 안내</text>

  <!-- Authoritative -->
  <rect x="600" y="362" width="232" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="716" y="396" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Authoritative DNS</text>
  <line x1="236" y1="380" x2="594" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="416" y="370" font-size="15" fill="#374151" text-anchor="middle">③ 질의</text>
  <line x1="596" y1="400" x2="238" y2="400" stroke="#047857" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ag)"/>
  <text x="416" y="424" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">IP 반환</text>
</svg>
