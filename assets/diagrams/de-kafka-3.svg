<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">토픽은 파티션으로 쪼개진다</title>
  <desc id="d">Topic orders의 Partition 0, 1, 2와 offset, append 및 다음 쓰기 위치를 나타내는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 메인 영역 박스 (Topic: orders) -->
  <rect x="24" y="20" width="832" height="230" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <!-- Topic Header -->
  <text x="44" y="52" font-size="16" font-weight="bold" fill="#1f2933">Topic: orders (partition 3개)</text>

  <!-- Partition 0 -->
  <g transform="translate(44, 70)">
    <text x="0" y="24" font-size="13" font-weight="bold" fill="#1f2933">Partition 0 :</text>
    
    <!-- Offset Blocks -->
    <rect x="100" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="116" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[0]</text>

    <rect x="136" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="152" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[1]</text>

    <rect x="172" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="188" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[2]</text>

    <rect x="208" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="224" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[3]</text>

    <rect x="244" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="260" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[4]</text>

    <rect x="280" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="296" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[5]</text>

    <!-- Arrow & Append Label -->
    <path d="M320,16 L380,16" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="390" y="20" font-size="13" fill="#2563eb">뒤에만 append</text>

    <!-- Next write location Arrow & Label -->
    <path d="M304,60 L304,38" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
    <text x="316" y="58" font-size="13" fill="#d97706">다음 쓰기 위치</text>
  </g>

  <!-- Partition 1 -->
  <g transform="translate(44, 145)">
    <text x="0" y="24" font-size="13" font-weight="bold" fill="#1f2933">Partition 1 :</text>
    
    <!-- Offset Blocks -->
    <rect x="100" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="116" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[0]</text>

    <rect x="136" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="152" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[1]</text>

    <rect x="172" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="188" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[2]</text>

    <rect x="208" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="224" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[3]</text>
  </g>

  <!-- Partition 2 -->
  <g transform="translate(44, 195)">
    <text x="0" y="24" font-size="13" font-weight="bold" fill="#1f2933">Partition 2 :</text>
    
    <!-- Offset Blocks -->
    <rect x="100" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="116" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[0]</text>

    <rect x="136" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="152" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[1]</text>

    <rect x="172" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="188" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[2]</text>

    <rect x="208" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="224" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[3]</text>

    <rect x="244" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="260" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[4]</text>

    <rect x="280" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="296" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[5]</text>

    <rect x="316" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="332" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[6]</text>

    <rect x="352" y="0" width="32" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="368" y="21" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[7]</text>
  </g>

  <!-- 하단 설명 영역 (Note Box) -->
  <rect x="24" y="270" width="832" height="140" rx="6" fill="#fffbeb" stroke="#cbd2d9" stroke-width="1.5"/>

  <g transform="translate(44, 280)">
    <text x="0" y="24" font-size="13" font-weight="bold" fill="#d97706">대괄호 안 숫자 = offset (파티션 안에서의 순번)</text>
    <text x="0" y="52" font-size="13" fill="#52606d">- offset은 파티션마다 독립적으로 0부터 증가한다</text>
    <text x="0" y="78" font-size="13" fill="#52606d">- 한 번 쓰인 레코드는 수정되지 않는다 (append-only)</text>
    <text x="0" y="104" font-size="13" fill="#52606d">- 소비해도 지워지지 않는다. 보존 기간이 지나야 삭제된다</text>
  </g>
</svg>