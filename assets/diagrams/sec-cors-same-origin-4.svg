<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CORS 에러 진단 순서</title>
  <desc id="d">CORS 에러를 세 단계로 진단한다. 1) OPTIONS 요청이 200/204가 아니면 인증 필터나 리다이렉트 문제, 2) 본 응답에 Access-Control-Allow-Origin이 없으면 서버 설정이나 화이트리스트 문제이고 있으면 요청 Origin과 문자 단위로 비교, 3) 쿠키를 보내야 하면 credentials·Allow-Credentials·정확한 Allow-Origin 셋을 모두 확인한다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>

  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 단계 사이 흐름 -->
  <line x1="44" y1="64" x2="44" y2="184" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <line x1="44" y1="226" x2="44" y2="346" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>

  <!-- ===== 1단계 ===== -->
  <circle cx="44" cy="44" r="18" fill="#1f2937"/>
  <text x="44" y="50" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="51" font-size="18" font-weight="bold" fill="#111827">네트워크 탭에 OPTIONS 요청이 있는가?</text>
  <path d="M88,62 V146 H102 M88,96 H102" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <rect x="104" y="80" width="210" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="209" y="101" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">있는데 200/204가 아니다</text>
  <line x1="318" y1="96" x2="356" y2="96" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <rect x="362" y="76" width="494" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="378" y="102" font-size="16" fill="#111827">인증 필터 또는 리다이렉트 문제</text>

  <rect x="104" y="130" width="210" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="209" y="151" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">정상이거나 없다</text>
  <line x1="318" y1="146" x2="356" y2="146" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <rect x="362" y="126" width="494" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="378" y="152" font-size="16" fill="#111827">본 요청의 응답 헤더로 넘어간다</text>

  <!-- ===== 2단계 ===== -->
  <circle cx="44" cy="206" r="18" fill="#1f2937"/>
  <text x="44" y="212" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="76" y="213" font-size="18" font-weight="bold" fill="#111827">본 응답에 Access-Control-Allow-Origin이 있는가?</text>
  <path d="M88,224 V308 H102 M88,258 H102" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <rect x="104" y="242" width="210" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="209" y="263" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">없다</text>
  <line x1="318" y1="258" x2="356" y2="258" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <rect x="362" y="238" width="494" height="40" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="378" y="264" font-size="16" fill="#111827">서버 CORS 설정이 안 걸렸거나 Origin이 화이트리스트 밖</text>

  <rect x="104" y="292" width="210" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="209" y="313" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">있다</text>
  <line x1="318" y1="308" x2="356" y2="308" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <rect x="362" y="288" width="494" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="378" y="314" font-size="16" fill="#111827">요청 Origin과 문자 단위로 같은가? (스킴·포트·끝 슬래시)</text>

  <!-- ===== 3단계 ===== -->
  <circle cx="44" cy="368" r="18" fill="#1f2937"/>
  <text x="44" y="374" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="76" y="375" font-size="18" font-weight="bold" fill="#111827">쿠키를 보내야 하는가?</text>
  <path d="M88,386 V436 H102" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <rect x="104" y="420" width="210" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="209" y="441" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">예</text>
  <line x1="318" y1="436" x2="356" y2="436" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <rect x="362" y="392" width="494" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="378" y="417" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">credentials:'include'</text>
  <text x="378" y="443" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">+ Allow-Credentials:true</text>
  <text x="378" y="469" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">+ 정확한 Allow-Origin</text>
  <text x="836" y="443" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="end">셋 다 확인</text>
</svg>
