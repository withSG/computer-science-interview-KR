<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">같은 오탐 140건, FPR과 정밀도 비교</title>
  <desc id="d">스팸 예시에서 FP = 140은 FPR에서는 분모 9700(FP + TN) 중 1.4%로 아주 낮아 보이지만, 정밀도에서는 분모 350(TP + FP) 중 40%를 차지해 심각한 오탐으로 드러난다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="19" font-weight="bold" fill="#111827">같은 오탐 140건이 분모에 따라 다르게 보인다</text>

  <!-- ===== 카드 1: FPR ===== -->
  <rect x="24" y="52" width="832" height="186" rx="8" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="82" font-size="15" font-weight="bold" fill="#1d4ed8">ROC의 x축 · FPR</text>
  <text x="48" y="112" font-size="17" fill="#111827">FP = 140, TN = 9560  →  FPR = 140 / 9700 ≈ 0.014</text>
  <!-- 막대: 분모 9700 = FP 140 + TN 9560 -->
  <rect x="48" y="128" width="11" height="38" fill="#b91c1c"/>
  <rect x="59" y="128" width="773" height="38" fill="#e5e7eb"/>
  <text x="445" y="152" font-size="15" fill="#1f2937" text-anchor="middle">TN 9560</text>
  <text x="48" y="188" font-size="15" font-weight="bold" fill="#b91c1c">FP 140 (1.4%)</text>
  <text x="832" y="188" font-size="15" fill="#374151" text-anchor="end">분모 9700 = FP + TN</text>
  <text x="48" y="222" font-size="18" font-weight="bold" fill="#1d4ed8">“거짓 양성률 1.4%, 아주 낮다”</text>

  <!-- 연결 -->
  <line x1="54" y1="242" x2="54" y2="284" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="68" y="270" font-size="15" fill="#374151">같은 FP = 140 이 정밀도에서는</text>

  <!-- ===== 카드 2: Precision ===== -->
  <rect x="24" y="290" width="832" height="186" rx="8" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="320" font-size="15" font-weight="bold" fill="#047857">PR 곡선의 y축 · Precision</text>
  <text x="48" y="350" font-size="17" fill="#111827">Precision = 210 / (210 + 140) = 0.600</text>
  <!-- 막대: 분모 350 = FP 140 + TP 210 -->
  <rect x="48" y="366" width="314" height="38" fill="#b91c1c"/>
  <rect x="362" y="366" width="470" height="38" fill="#dbeafe"/>
  <text x="205" y="390" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">FP 140 (40%)</text>
  <text x="597" y="390" font-size="15" fill="#1f2937" text-anchor="middle">TP 210 (60%)</text>
  <text x="832" y="426" font-size="15" fill="#374151" text-anchor="end">분모 350 = TP + FP</text>
  <text x="48" y="460" font-size="18" font-weight="bold" fill="#b91c1c">“잡은 것의 40%가 오탐, 심각하다”</text>
</svg>
