<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ROC-AUC와 PR-AUC 불균형 데이터 오탐 비교</title>
  <desc id="d">FPR과 Precision 계산을 통해 동일한 FP 140건이 지표에 따라 미치는 영향의 차이를 비교하는 다이어그램</desc>
  <rect width="880" height="180" fill="#ffffff"/>
  
  <!-- Section 1: FPR (Blue Theme) -->
  <rect x="24" y="20" width="832" height="60" rx="6" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="40" y="55" font-size="13" font-weight="bold" fill="#1f2933">FP = 140, TN = 9560 → FPR = 140 / 9700 ≈ 0.014</text>
  <text x="490" y="55" font-size="13" font-weight="bold" fill="#2563eb">"거짓 양성률 1.4%, 아주 낮다"</text>

  <!-- Section 2: Precision (Red Theme) -->
  <rect x="24" y="100" width="832" height="60" rx="6" fill="#fef2f2" stroke="#cbd2d9" stroke-width="1"/>
  <text x="40" y="125" font-size="13" fill="#52606d">같은 FP = 140 이 정밀도에서는</text>
  <text x="40" y="147" font-size="13" font-weight="bold" fill="#1f2933">Precision = 210 / (210 + 140) = 0.600</text>
  <text x="490" y="136" font-size="13" font-weight="bold" fill="#dc2626">"잡은 것의 40%가 오탐, 심각하다"</text>
</svg>