<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Kafka 토픽·파티션·컨슈머 그룹 구조</title>
  <desc id="d">Producer가 토픽 orders에 메시지를 발행하고, 토픽의 Partition 0·1·2를 Consumer Group의 Consumer A·B·C가 하나씩 맡아 병렬로 소비한다. 파티션 수만큼 컨슈머가 병렬 소비해 처리량을 확장하고, 같은 파티션 안에서는 순서가 보장된다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Producer -->
  <rect x="24" y="131" width="120" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="84" y="161" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Producer</text>
  <line x1="144" y1="155" x2="198" y2="155" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- Topic: orders -->
  <rect x="200" y="30" width="290" height="286" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="345" y="62" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">Topic: orders</text>

  <rect x="220" y="82" width="250" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="109" font-size="16" fill="#1f2937" text-anchor="middle">Partition 0</text>
  <rect x="220" y="136" width="250" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="163" font-size="16" fill="#1f2937" text-anchor="middle">Partition 1</text>
  <rect x="220" y="190" width="250" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="217" font-size="16" fill="#1f2937" text-anchor="middle">Partition 2</text>

  <line x1="216" y1="252" x2="474" y2="252" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="345" y="289" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">같은 파티션 내에서는 순서 보장</text>

  <!-- Consumer Group -->
  <rect x="600" y="30" width="256" height="286" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="728" y="62" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">Consumer Group</text>

  <rect x="624" y="82" width="208" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="728" y="109" font-size="16" fill="#1f2937" text-anchor="middle">Consumer A</text>
  <rect x="624" y="136" width="208" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="728" y="163" font-size="16" fill="#1f2937" text-anchor="middle">Consumer B</text>
  <rect x="624" y="190" width="208" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="728" y="217" font-size="16" fill="#1f2937" text-anchor="middle">Consumer C</text>

  <line x1="616" y1="252" x2="840" y2="252" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="728" y="278" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">파티션 수만큼 컨슈머가 병렬 소비</text>
  <text x="728" y="300" font-size="15" fill="#5b21b6" text-anchor="middle">(처리량 확장)</text>

  <!-- Partition → Consumer -->
  <line x1="472" y1="103" x2="621" y2="103" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="472" y1="157" x2="621" y2="157" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="472" y1="211" x2="621" y2="211" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
</svg>
