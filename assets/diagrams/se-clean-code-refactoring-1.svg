<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1. 왜 필요한가 — 나쁜 코드는 이자를 붙여 청구한다</title>
  <desc id="d">프로젝트 진행에 따라 정리 안 한 코드와 계속 정리한 코드의 기능 추가 시간 변화를 나타낸 그래프</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">1. 왜 필요한가 — 나쁜 코드는 이자를 붙여 청구한다</text>

  <!-- Y Axis Label -->
  <text x="50" y="65" font-size="13" fill="#1f2933">기능 하나를 추가하는 데 걸리는 시간</text>

  <!-- Y Axis Arrow -->
  <path d="M 50 370 L 50 80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- X Axis Arrow -->
  <path d="M 50 370 L 740 370" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- X Axis Label -->
  <text x="750" y="374" font-size="13" fill="#1f2933">프로젝트 진행</text>

  <!-- X Axis Ticks & Labels -->
  <line x1="120" y1="370" x2="120" y2="375" stroke="#9aa5b1" stroke-width="1"/>
  <text x="120" y="393" font-size="12" fill="#52606d" text-anchor="middle">1주</text>

  <line x1="220" y1="370" x2="220" y2="375" stroke="#9aa5b1" stroke-width="1"/>
  <text x="220" y="393" font-size="12" fill="#52606d" text-anchor="middle">1개월</text>

  <line x1="340" y1="370" x2="340" y2="375" stroke="#9aa5b1" stroke-width="1"/>
  <text x="340" y="393" font-size="12" fill="#52606d" text-anchor="middle">3개월</text>

  <line x1="480" y1="370" x2="480" y2="375" stroke="#9aa5b1" stroke-width="1"/>
  <text x="480" y="393" font-size="12" fill="#52606d" text-anchor="middle">6개월</text>

  <line x1="640" y1="370" x2="640" y2="375" stroke="#9aa5b1" stroke-width="1"/>
  <text x="640" y="393" font-size="12" fill="#52606d" text-anchor="middle">1년</text>

  <!-- Curve: 정리 안 한 코드 (Red) -->
  <path d="M 80 340 L 120 330 L 180 310 L 260 270 L 360 220 L 480 160 L 600 110" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="80" cy="340" r="4.5" fill="#dc2626"/>
  <circle cx="120" cy="330" r="4.5" fill="#dc2626"/>
  <circle cx="180" cy="310" r="4.5" fill="#dc2626"/>
  <circle cx="260" cy="270" r="4.5" fill="#dc2626"/>
  <circle cx="360" cy="220" r="4.5" fill="#dc2626"/>
  <circle cx="480" cy="160" r="4.5" fill="#dc2626"/>
  <circle cx="600" cy="110" r="4.5" fill="#dc2626"/>
  <text x="612" y="114" font-size="13" font-weight="bold" fill="#dc2626">● 정리 안 한 코드</text>

  <!-- Curve: 계속 정리한 코드 (Green) -->
  <path d="M 80 320 L 120 315 L 160 325 L 220 315 L 300 310 L 400 305 L 500 305 L 560 305 L 620 305" stroke="#059669" stroke-width="2" fill="none"/>
  <circle cx="80" cy="320" r="4.5" fill="#059669"/>
  <circle cx="120" cy="315" r="4.5" fill="#059669"/>
  <circle cx="160" cy="325" r="4.5" fill="#059669"/>
  <circle cx="220" cy="315" r="4.5" fill="#059669"/>
  <circle cx="300" cy="310" r="4.5" fill="#059669"/>
  <circle cx="400" cy="305" r="4.5" fill="#059669"/>
  <circle cx="500" cy="305" r="4.5" fill="#059669"/>
  <circle cx="560" cy="305" r="4.5" fill="#059669"/>
  <circle cx="620" cy="305" r="4.5" fill="#059669"/>
  <text x="632" y="309" font-size="13" font-weight="bold" fill="#059669">● 계속 정리한 코드</text>

  <!-- Footnote Box & Text -->
  <rect x="50" y="420" width="780" height="55" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="70" y="442" font-size="12" fill="#1f2933">초반에는 정리를 건너뛴 쪽이 빠르다. 그래서 정리를 안 하게 된다.</text>
  <text x="70" y="462" font-size="12" fill="#1f2933">교차점 이후로는 같은 크기의 기능에 몇 배의 시간이 든다.</text>
</svg>