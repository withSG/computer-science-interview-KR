<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정리 여부에 따른 기능 추가 시간</title>
  <desc id="d">프로젝트가 진행될수록 정리 안 한 코드는 기능 하나를 추가하는 시간이 가파르게 늘고, 계속 정리한 코드는 완만하게 유지된다. 초반에는 정리를 건너뛴 쪽이 빠르지만 교차점 이후로는 같은 크기의 기능에 몇 배의 시간이 든다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 축 -->
  <path d="M90,400 L90,50" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
  <path d="M90,400 L848,400" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
  <text x="104" y="60" font-size="15" font-weight="bold" fill="#374151">기능 하나를 추가하는 데 걸리는 시간</text>
  <text x="848" y="428" font-size="15" font-weight="bold" fill="#374151" text-anchor="end">프로젝트 진행</text>

  <!-- 눈금 -->
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="140" y1="400" x2="140" y2="407"/>
    <line x1="245" y1="400" x2="245" y2="407"/>
    <line x1="365" y1="400" x2="365" y2="407"/>
    <line x1="485" y1="400" x2="485" y2="407"/>
    <line x1="620" y1="400" x2="620" y2="407"/>
  </g>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="140" y="428">1주</text>
    <text x="245" y="428">1개월</text>
    <text x="365" y="428">3개월</text>
    <text x="485" y="428">6개월</text>
    <text x="620" y="428">1년</text>
  </g>

  <!-- 곡선 -->
  <path d="M104,352 L680,312" stroke="#047857" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M104,372 Q392,293.4 680,110" stroke="#b91c1c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="680" cy="110" r="5" fill="#b91c1c"/>
  <circle cx="680" cy="312" r="5" fill="#047857"/>
  <text x="694" y="116" font-size="16" font-weight="bold" fill="#b91c1c">정리 안 한 코드</text>
  <text x="694" y="318" font-size="16" font-weight="bold" fill="#047857">계속 정리한 코드</text>

  <!-- 교차점 -->
  <circle cx="190.6" cy="346" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="191" y="381" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">교차점</text>

  <!-- 초반 설명 -->
  <text x="110" y="168" font-size="15" fill="#111827">
    <tspan x="110">초반에는 정리를 건너뛴 쪽이 빠르다.</tspan>
    <tspan x="110" dy="22">그래서 정리를 안 하게 된다.</tspan>
  </text>
  <path d="M150,198 L150,334" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ax)"/>

  <!-- 교차점 이후 격차 -->
  <path d="M620,158 L620,304" stroke="#374151" stroke-width="1.5" fill="none" marker-start="url(#ax)" marker-end="url(#ax)"/>
  <text font-size="15" fill="#111827" text-anchor="end">
    <tspan x="606" y="252">교차점 이후로는</tspan>
    <tspan x="606" dy="22">같은 크기의 기능에</tspan>
    <tspan x="606" dy="22" font-weight="bold" fill="#b91c1c">몇 배의 시간이 든다</tspan>
  </text>
</svg>
