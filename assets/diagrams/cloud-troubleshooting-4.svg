<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">liveness 오설정 무한 재시작</title>
  <desc id="d">부팅에 60초가 필요한 앱에 liveness probe만 걸면 t=10s부터 5초마다 실패해 t=20s에 임계치에 도달하고 컨테이너가 재시작되며, t=30s에 다시 부팅을 시작해 무한 반복하는 과정을 시간축에 그렸습니다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 설정 -->
  <rect x="24" y="24" width="832" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="54" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold">liveness:</tspan> initialDelaySeconds 10, periodSeconds 5, failureThreshold 3</text>

  <!-- liveness probe 레인 -->
  <text x="24" y="124" font-size="15" font-weight="bold" fill="#374151">liveness</text>
  <text x="24" y="144" font-size="15" font-weight="bold" fill="#374151">probe</text>
  <rect x="150" y="112" width="706" height="40" fill="#f3f4f6"/>
  <text x="265" y="104" font-size="15" fill="#111827" text-anchor="middle">probe 시작</text>
  <rect x="241" y="118" width="48" height="28" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="265" y="137" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패</text>
  <rect x="298.5" y="118" width="48" height="28" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="322.5" y="137" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패</text>
  <rect x="356" y="118" width="48" height="28" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="380" y="137" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패</text>
  <text x="416" y="137" font-size="15" font-weight="bold" fill="#b91c1c">→ 임계치 도달</text>

  <!-- 시각 안내선 -->
  <line x1="265" y1="152" x2="265" y2="194" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="322.5" y1="152" x2="322.5" y2="194" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- 재시작 -->
  <line x1="380" y1="150" x2="380" y2="190" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="392" y="176" font-size="15" font-weight="bold" fill="#b91c1c">컨테이너 재시작</text>

  <!-- 앱 레인 -->
  <text x="24" y="219" font-size="15" font-weight="bold" fill="#374151">앱</text>
  <rect x="150" y="194" width="706" height="40" fill="#f3f4f6"/>
  <rect x="150" y="198" width="230" height="32" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="265" y="219" font-size="15" fill="#1e3a8a" text-anchor="middle">앱 아직 부팅 중</text>
  <rect x="495" y="198" width="205" height="32" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="507" y="219" font-size="15" fill="#1e3a8a">다시 부팅 시작...</text>
  <line x1="704" y1="214" x2="726" y2="214" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="732" y="200" width="104" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="784" y="219" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">무한 반복</text>

  <!-- 시간축 -->
  <line x1="150" y1="256" x2="852" y2="256" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="150" y1="250" x2="150" y2="262" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="265" y1="250" x2="265" y2="262" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="322.5" y1="250" x2="322.5" y2="262" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="380" y1="250" x2="380" y2="262" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="495" y1="250" x2="495" y2="262" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="840" y1="250" x2="840" y2="262" stroke="#4b5563" stroke-width="1.5"/>
  <text x="150" y="282" font-size="14" fill="#374151" text-anchor="middle">t=0s</text>
  <text x="265" y="282" font-size="14" fill="#374151" text-anchor="middle">t=10s</text>
  <text x="322.5" y="282" font-size="14" fill="#374151" text-anchor="middle">t=15s</text>
  <text x="380" y="282" font-size="14" fill="#374151" text-anchor="middle">t=20s</text>
  <text x="495" y="282" font-size="14" fill="#374151" text-anchor="middle">t=30s</text>
  <text x="840" y="282" font-size="14" fill="#374151" text-anchor="middle">t=60s</text>

  <!-- 부팅 필요 구간 -->
  <line x1="150" y1="302" x2="840" y2="302" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="150" y1="295" x2="150" y2="309" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="840" y1="295" x2="840" y2="309" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="495" y="330" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">앱 부팅에 60초 필요</text>
</svg>
