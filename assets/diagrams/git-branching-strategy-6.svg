<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트렁크 기반 개발의 짧은 브랜치</title>
  <desc id="d">모든 개발자가 하나의 트렁크(main)에 매일 합류한다. 브랜치는 수 시간에서 하루짜리로, main에서 갈라졌다가 곧바로 다시 합쳐진다.</desc>
  <rect width="880" height="230" fill="#ffffff"/>
  <defs>
    <marker id="endMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 트렁크 이름 -->
  <text x="40" y="68" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main</text>
  <text x="40" y="90" font-size="14" fill="#4b5563">(트렁크)</text>

  <!-- 짧은 브랜치: 갈라졌다가 바로 합쳐짐 -->
  <g stroke="#6d28d9" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <polyline points="130,62 151,122 172,62"/>
    <polyline points="214,62 235,122 256,62"/>
    <polyline points="256,62 277,122 298,62"/>
    <polyline points="340,62 361,122 382,62"/>
    <polyline points="424,62 445,122 466,62"/>
    <polyline points="508,62 529,122 550,62"/>
  </g>
  <g fill="#6d28d9" stroke="#ffffff" stroke-width="2">
    <circle cx="151" cy="122" r="7"/>
    <circle cx="235" cy="122" r="7"/>
    <circle cx="277" cy="122" r="7"/>
    <circle cx="361" cy="122" r="7"/>
    <circle cx="445" cy="122" r="7"/>
    <circle cx="529" cy="122" r="7"/>
  </g>

  <!-- 트렁크 선과 커밋 -->
  <line x1="110" y1="62" x2="630" y2="62" stroke="#1d4ed8" stroke-width="4" marker-end="url(#endMain)"/>
  <g fill="#1d4ed8" stroke="#ffffff" stroke-width="2">
    <circle cx="130" cy="62" r="8"/>
    <circle cx="172" cy="62" r="8"/>
    <circle cx="214" cy="62" r="8"/>
    <circle cx="256" cy="62" r="8"/>
    <circle cx="298" cy="62" r="8"/>
    <circle cx="340" cy="62" r="8"/>
    <circle cx="382" cy="62" r="8"/>
    <circle cx="424" cy="62" r="8"/>
    <circle cx="466" cy="62" r="8"/>
    <circle cx="508" cy="62" r="8"/>
    <circle cx="550" cy="62" r="8"/>
    <circle cx="592" cy="62" r="8"/>
  </g>

  <text x="652" y="68" font-size="16" font-weight="bold" fill="#1d4ed8">모두가 여기로 매일 합류</text>

  <!-- 브랜치 수명 표시 -->
  <path d="M130,146 L130,154 L550,154 L550,146" stroke="#6d28d9" stroke-width="1.5" fill="none"/>
  <text x="340" y="180" text-anchor="middle" font-size="16" fill="#6d28d9">(수 시간~하루짜리 브랜치)</text>
  <text x="340" y="204" text-anchor="middle" font-size="15" fill="#374151">갈라지자마자 다시 main으로 합쳐진다</text>
</svg>
