<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">주요 로그 파일 위치</title>
  <desc id="d">/var/log/ 아래의 주요 로그를 디렉터리 트리로 보여줍니다. messages·secure는 CentOS, syslog는 Ubuntu의 파일이고, auth.log(인증), dmesg(커널 부팅), cron, nginx/(access.log, error.log), journal/(systemd 저널)이 있습니다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- 머리행 -->
  <rect x="32" y="20" width="816" height="36" rx="6" fill="#f1f5f9"/>
  <text x="52" y="44" font-size="15" font-weight="bold" fill="#374151">경로</text>
  <text x="300" y="44" font-size="15" font-weight="bold" fill="#374151">설명</text>

  <!-- 줄 구분 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="32" y1="92" x2="848" y2="92"/>
    <line x1="32" y1="128" x2="848" y2="128"/>
    <line x1="32" y1="164" x2="848" y2="164"/>
    <line x1="32" y1="200" x2="848" y2="200"/>
    <line x1="32" y1="236" x2="848" y2="236"/>
    <line x1="32" y1="272" x2="848" y2="272"/>
    <line x1="32" y1="308" x2="848" y2="308"/>
    <line x1="32" y1="416" x2="848" y2="416"/>
    <line x1="32" y1="452" x2="848" y2="452"/>
  </g>

  <!-- 트리 선 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M60,90 V434"/>
    <path d="M60,110 H76 M60,146 H76 M60,182 H76 M60,218 H76 M60,254 H76 M60,290 H76 M60,326 H76 M60,434 H76"/>
    <path d="M92,338 V398"/>
    <path d="M92,362 H108 M92,398 H108"/>
  </g>

  <!-- 설명 이음 점선 -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="166" y1="110" x2="288" y2="110"/>
    <line x1="148" y1="146" x2="288" y2="146"/>
    <line x1="166" y1="182" x2="288" y2="182"/>
    <line x1="148" y1="218" x2="288" y2="218"/>
    <line x1="140" y1="254" x2="288" y2="254"/>
    <line x1="132" y1="290" x2="288" y2="290"/>
    <line x1="150" y1="326" x2="288" y2="326"/>
    <line x1="168" y1="434" x2="288" y2="434"/>
  </g>

  <!-- 경로 이름 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" fill="#1f2937">
    <text x="52" y="80" font-size="18" font-weight="bold" fill="#1d4ed8">/var/log/</text>
    <text x="84" y="116">messages</text>
    <text x="84" y="152">syslog</text>
    <text x="84" y="188">auth.log</text>
    <text x="84" y="224">secure</text>
    <text x="84" y="260">dmesg</text>
    <text x="84" y="296">cron</text>
    <text x="84" y="332" font-weight="bold" fill="#1d4ed8">nginx/</text>
    <text x="116" y="368">access.log</text>
    <text x="116" y="404">error.log</text>
    <text x="84" y="440" font-weight="bold" fill="#1d4ed8">journal/</text>
  </g>

  <!-- 설명 -->
  <g font-size="16" fill="#1f2937">
    <text x="300" y="116">시스템 메시지</text>
    <text x="300" y="152">시스템 메시지</text>
    <text x="300" y="188">인증 로그</text>
    <text x="300" y="224">보안 로그</text>
    <text x="300" y="260">커널 부팅 메시지</text>
    <text x="300" y="296">Cron 작업 로그</text>
    <text x="300" y="332">Nginx 로그</text>
    <text x="300" y="440">systemd 저널</text>
  </g>

  <!-- 배포판 표시 -->
  <rect x="416" y="98" width="76" height="24" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="454" y="115" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">CentOS</text>
  <rect x="416" y="134" width="76" height="24" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="454" y="151" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">Ubuntu</text>
  <rect x="416" y="206" width="76" height="24" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="454" y="223" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">CentOS</text>
</svg>
