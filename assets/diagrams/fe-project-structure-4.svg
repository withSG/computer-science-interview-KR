<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기술별 구조와 기능별 구조</title>
  <desc id="d">같은 프로젝트를 기술별(layer-first)과 기능별(feature-first)로 나눈 두 디렉터리 트리. 기술별 구조에서는 로그인 폼을 고칠 때 손대는 파일이 components/, hooks/, api/, types/ 네 폴더에 흩어져 있고, 기능별 구조에서는 features/auth/ 한 폴더에 모여 있다.</desc>
  <rect width="880" height="700" fill="#ffffff"/>

  <!-- 범례 -->
  <rect x="24" y="24" width="30" height="20" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="66" y="40" font-size="15" fill="#111827">로그인 폼을 고칠 때 손대는 파일</text>

