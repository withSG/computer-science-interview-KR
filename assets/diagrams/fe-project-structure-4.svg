  <text x="470" y="94"><tspan font-size="19" font-weight="bold" fill="#111827">기능별</tspan><tspan font-size="16" fill="#4b5563"> (feature-first)</tspan></text>
  <line x1="451" y1="110" x2="855" y2="110" stroke="#e5e7eb" stroke-width="1.5"/>

