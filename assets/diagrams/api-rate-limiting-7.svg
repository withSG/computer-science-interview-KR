<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 Lua 스크립트인가 - 잘못된 구현 (읽고 → 판단하고 → 쓰기)</title>
  <desc id="d">분산 환경에서 서버 A와 서버 B가 카운터를 동시에 읽고 판단하여 경쟁 상태가 발생하는 잘못된 구현 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">잘못된 구현 (읽고 → 판단하고 → 쓰기)</text>

  <!-- Flow Lines Top (GET count) -->
  <path d="M 120,90 L 320,90" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="180" y="78" width="80" height="24" fill="#ffffff"/>
  <text x="220" y="94.6" font-size="13" fill="#1f2933" text-anchor="middle">GET count</text>

  <path d="M 760,90 L 560,90" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="620" y="78" width="80" height="24" fill="#ffffff"/>
  <text x="660" y="94.6" font-size="13" fill="#1f2933" text-anchor="middle">GET count</text>

  <!-- Boxes Row 1: Server Reading -->
  <rect x="40" y="70" width="160" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="94.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">서버 A: GET count</text>

  <text x="325" y="94.6" font-size="13" font-weight="bold" fill="#2563eb">→ 99</text>

  <rect x="680" y="70" width="160" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="760" y="94.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">서버 B: GET count</text>

  <text x="535" y="94.6" font-size="13" font-weight="bold" fill="#2563eb">→ 99</text>

  <!-- Center Highlight Box (같은 값을 읽었다) -->
  <rect x="350" y="73" width="180" height="34" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 520,90 L 530,90" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="440" y="94.6" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">← 같은 값을 읽었다</text>

  <!-- Vertical Arrows down -->
  <path d="M 120,110 L 120,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M 760,110 L 760,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Boxes Row 2: Evaluation -->
  <rect x="40" y="140" width="230" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="155" y="164.6" font-size="13" fill="#1f2933" text-anchor="middle">서버 A: 99 &lt; 100, 허용</text>

  <rect x="610" y="140" width="230" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="725" y="164.6" font-size="13" fill="#1f2933" text-anchor="middle">서버 B: 99 &lt; 100, 허용</text>

  <!-- Error Callout Box at Bottom -->
  <rect x="40" y="220" width="800" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M 120,180 L 120,220" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#a-red)"/>
  <path d="M 760,180 L 760,220" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#a-red)"/>
  <text x="440" y="254.6" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">→ 한도 100인데 101번째 요청이 통과했다 (경쟁 상태)</text>
</svg>