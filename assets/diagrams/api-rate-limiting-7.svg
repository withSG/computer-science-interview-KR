<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">읽고-판단하고-쓰기 구현의 경쟁 상태</title>
  <desc id="d">서버 A와 서버 B가 동시에 GET count로 같은 값 99를 읽고, 각자 99 &lt; 100이라 판단해 허용한다. 그 결과 한도 100인데 101번째 요청이 통과하는 경쟁 상태가 생긴다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="32" y="42" font-size="19" font-weight="bold" fill="#111827">잘못된 구현 (읽고 → 판단하고 → 쓰기)</text>

  <!-- 단계 띠 -->
  <rect x="24" y="142" width="832" height="140" rx="8" fill="#f8fafc"/>
  <rect x="24" y="296" width="832" height="72" rx="8" fill="#f8fafc"/>
  <text x="40" y="206" font-size="16" font-weight="bold" fill="#374151">① 읽기</text>
  <text x="40" y="338" font-size="16" font-weight="bold" fill="#374151">② 판단</text>

  <!-- 참여자 머리 -->
  <rect x="160" y="66" width="160" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="240" y="102" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">서버 A</text>
  <rect x="400" y="66" width="160" height="60" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="480" y="91" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">Redis</text>
  <text x="480" y="114" font-size="15" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">count</text>
  <rect x="640" y="66" width="160" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="720" y="102" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">서버 B</text>

  <!-- 생명선 -->
  <line x1="240" y1="126" x2="240" y2="310" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="480" y1="126" x2="480" y2="160" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="720" y1="126" x2="720" y2="310" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="471" y="160" width="18" height="74" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>

  <!-- ① GET count (A, B 동시에) -->
  <line x1="242" y1="178" x2="469" y2="178" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="360" y="167" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET count</text>
  <line x1="718" y1="178" x2="491" y2="178" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="600" y="167" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET count</text>

  <!-- 응답 99 -->
  <line x1="470" y1="222" x2="244" y2="222" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-red)"/>
  <text x="360" y="211" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">99</text>
  <line x1="490" y1="222" x2="716" y2="222" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-red)"/>
  <text x="600" y="211" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">99</text>

  <!-- 같은 값을 읽었다 -->
  <rect x="380" y="244" width="200" height="34" rx="17" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="480" y="267" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">같은 값을 읽었다</text>

  <!-- ② 판단 -->
  <rect x="150" y="310" width="180" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="240" y="338" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">99 &lt; 100, 허용</text>
  <rect x="630" y="310" width="180" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="720" y="338" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">99 &lt; 100, 허용</text>

  <!-- 결과 -->
  <line x1="240" y1="356" x2="240" y2="400" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="720" y1="356" x2="720" y2="400" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="24" y="404" width="832" height="58" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="440" font-size="19" font-weight="bold" fill="#991b1b" text-anchor="middle">한도 100인데 101번째 요청이 통과했다 (경쟁 상태)</text>
</svg>
