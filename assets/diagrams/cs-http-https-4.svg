<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HTTP/1.1의 HOL 블로킹과 HTTP/2 스트림</title>
  <desc id="d">HTTP/1.1은 한 연결에서 응답1(느린 API, 2초)이 끝나야 요청2와 요청3을 처리할 수 있어 그 2초 동안 아무것도 못 한다. HTTP/2는 한 연결을 stream 1, 3, 5로 나눠 프레임 단위로 뒤섞어 보내므로 응답2와 응답3이 완료된 순서대로 먼저 도착하고 응답1은 나중에 온다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>

  <defs>
    <marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="h-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== HTTP/1.1 ===== -->
  <rect x="24" y="24" width="832" height="236" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="57" font-size="18" font-weight="bold" fill="#111827">HTTP/1.1 (한 연결)</text>
  <rect x="226" y="38" width="100" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="276" y="57" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">HOL 블로킹</text>

  <!-- 범례 -->
  <line x1="652" y1="51" x2="684" y2="51" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#h-blue)"/>
  <text x="694" y="56" font-size="15" fill="#374151">요청 보냄</text>

  <!-- 행 1 -->
  <text x="48" y="106" font-size="16" font-weight="bold" fill="#1f2937">요청1</text>
  <line x1="214" y1="100" x2="240" y2="100" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#h-blue)"/>
  <rect x="244" y="84" width="300" height="32" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="394" y="106" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">응답1 (느린 API, 2초)</text>

  <!-- 행 2 -->
  <text x="48" y="156" font-size="16" font-weight="bold" fill="#1f2937">요청2</text>
  <rect x="214" y="134" width="330" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="379" y="156" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">이 2초 동안 아무것도 못 한다</text>
  <line x1="548" y1="150" x2="572" y2="150" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#h-blue)"/>
  <rect x="576" y="134" width="60" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="606" y="156" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">응답2</text>

  <!-- 행 3 -->
  <text x="48" y="206" font-size="16" font-weight="bold" fill="#1f2937">요청3</text>
  <rect x="214" y="184" width="422" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="425" y="206" font-size="15" fill="#4b5563" text-anchor="middle">대기</text>
  <line x1="640" y1="200" x2="664" y2="200" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#h-blue)"/>
  <rect x="668" y="184" width="60" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="698" y="206" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">응답3</text>

  <!-- 시간축 -->
  <line x1="214" y1="238" x2="790" y2="238" stroke="#6b7280" stroke-width="1.5" marker-end="url(#h-gray)"/>
  <text x="800" y="243" font-size="15" fill="#4b5563">시간</text>

  <!-- ===== HTTP/2 ===== -->
  <rect x="24" y="280" width="832" height="276" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="313" font-size="18" font-weight="bold" fill="#111827">HTTP/2 (한 연결, 스트림으로 분리)</text>

  <!-- 행 1 -->
  <text x="48" y="362" font-size="16" font-weight="bold" fill="#1f2937">요청1</text>
  <rect x="104" y="342" width="90" height="28" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="149" y="361" font-size="15" fill="#5b21b6" text-anchor="middle">stream 1</text>
  <line x1="214" y1="356" x2="240" y2="356" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#h-blue)"/>
  <rect x="244" y="340" width="300" height="32" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="394" y="362" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">응답1 (느린 API, 2초)</text>

  <!-- 행 2 -->
  <text x="48" y="412" font-size="16" font-weight="bold" fill="#1f2937">요청2</text>
  <rect x="104" y="392" width="90" height="28" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="149" y="411" font-size="15" fill="#5b21b6" text-anchor="middle">stream 3</text>
  <line x1="214" y1="406" x2="240" y2="406" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#h-blue)"/>
  <rect x="244" y="390" width="60" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="274" y="412" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">응답2</text>

  <!-- 행 3 -->
  <text x="48" y="462" font-size="16" font-weight="bold" fill="#1f2937">요청3</text>
  <rect x="104" y="442" width="90" height="28" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="149" y="461" font-size="15" fill="#5b21b6" text-anchor="middle">stream 5</text>
  <line x1="214" y1="456" x2="240" y2="456" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#h-blue)"/>
  <rect x="244" y="440" width="60" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="274" y="462" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">응답3</text>

  <!-- 먼저 도착 표시 -->
  <path d="M312,392 H320 V470 H312" fill="none" stroke="#047857" stroke-width="1.5"/>
  <text x="334" font-size="15" fill="#065f46"><tspan x="334" y="427" font-weight="bold">응답2, 응답3 먼저 도착</tspan><tspan x="334" dy="22" fill="#374151">(완료된 순서대로)</tspan></text>

  <!-- 프레임 메모 -->
  <text x="104" y="498" font-size="15" fill="#5b21b6">↑ 프레임 단위로 뒤섞여 나감</text>

  <!-- 시간축 -->
  <line x1="214" y1="530" x2="790" y2="530" stroke="#6b7280" stroke-width="1.5" marker-end="url(#h-gray)"/>
  <text x="800" y="535" font-size="15" fill="#4b5563">시간</text>
</svg>
