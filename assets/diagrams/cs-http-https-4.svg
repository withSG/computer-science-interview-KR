<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HTTP/1.1과 HTTP/2 비교</title>
  <desc id="d">HTTP/1.1의 Head-of-Line 블로킹 문제와 HTTP/2의 멀티플렉싱을 통한 해결 방식을 보여주는 다이어그램</desc>
  <defs>
    <!-- Arrow Markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Section 1: HTTP/1.1 -->
  <rect x="24" y="20" width="832" height="210" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="6"/>
  <text x="40" y="47" font-size="16" font-weight="bold" fill="#1f2933">HTTP/1.1 (한 연결)</text>

  <!-- Section 1 Timeline Line -->
  <line x1="120" y1="55" x2="120" y2="215" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- HTTP/1.1 Requests & Responses -->
  <!-- 요청1 -->
  <path d="M70,75 L120,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="73" y="62" width="34" height="18" fill="#ffffff" rx="2"/>
  <text x="90" y="75" font-size="13" fill="#2563eb" text-anchor="middle">요청1</text>

  <!-- 응답1 (느린 API, 2초) -->
  <path d="M120,95 L650,95 L120,95" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="296" y="85" width="178" height="20" fill="#ffffff" rx="2"/>
  <text x="385" y="99" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">응답1 (느린 API, 2초)</text>

  <!-- 요청2 -->
  <path d="M70,115 L120,115" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="73" y="102" width="34" height="18" fill="#ffffff" rx="2"/>
  <text x="90" y="115" font-size="13" fill="#2563eb" text-anchor="middle">요청2</text>

  <!-- Notice Arrow & Text for Delay -->
  <path d="M500,115 L430,115" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-ink)"/>
  <text x="510" y="119" font-size="13" font-weight="bold" fill="#d97706">← 이 2초 동안 아무것도 못 한다</text>

  <!-- 응답2 -->
  <path d="M120,140 L260,140 L120,140" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="158" y="130" width="44" height="18" fill="#ffffff" rx="2"/>
  <text x="180" y="144" font-size="13" fill="#059669" text-anchor="middle">응답2</text>

  <!-- 요청3 -->
  <path d="M70,160 L120,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="73" y="147" width="34" height="18" fill="#ffffff" rx="2"/>
  <text x="90" y="160" font-size="13" fill="#2563eb" text-anchor="middle">요청3</text>

  <!-- 응답3 -->
  <path d="M120,185 L260,185 L120,185" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="158" y="175" width="44" height="18" fill="#ffffff" rx="2"/>
  <text x="180" y="189" font-size="13" fill="#059669" text-anchor="middle">응답3</text>


  <!-- Section 2: HTTP/2 -->
  <rect x="24" y="250" width="832" height="230" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="6"/>
  <text x="40" y="277" font-size="16" font-weight="bold" fill="#1f2933">HTTP/2 (한 연결, 스트림으로 분리)</text>

  <!-- Streams Frame Box -->
  <rect x="140" y="300" width="110" height="100" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" rx="4"/>

  <!-- 요청1, 2, 3 Arrows to Streams -->
  <path d="M70,315 L140,315" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="73" y="302" width="34" height="18" fill="#ffffff" rx="2"/>
  <text x="90" y="315" font-size="13" fill="#2563eb" text-anchor="middle">요청1</text>

  <text x="195" y="320" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">|stream 1|</text>

  <path d="M70,350 L140,350" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="73" y="337" width="34" height="18" fill="#ffffff" rx="2"/>
  <text x="90" y="350" font-size="13" fill="#2563eb" text-anchor="middle">요청2</text>

  <text x="195" y="355" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">|stream 3|</text>

  <path d="M70,385 L140,385" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="73" y="372" width="34" height="18" fill="#ffffff" rx="2"/>
  <text x="90" y="385" font-size="13" fill="#2563eb" text-anchor="middle">요청3</text>

  <text x="195" y="390" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">|stream 5|</text>

  <!-- Arrow note for interleaved frames -->
  <text x="270" y="355" font-size="13" fill="#52606d">← 프레임 단위로 뒤섞여 나감</text>

  <!-- Responses in HTTP/2 -->
  <!-- 응답2, 응답3 먼저 도착 -->
  <path d="M140,425 L380,425 L140,425" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="160" y="415" width="180" height="20" fill="#ffffff" rx="2"/>
  <text x="250" y="429" font-size="13" fill="#059669" text-anchor="middle">응답2, 응답3 먼저 도착</text>
  <text x="355" y="429" font-size="13" fill="#52606d">(완료된 순서대로)</text>

  <!-- 응답1 -->
  <path d="M140,455 L650,455 L140,455" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="368" y="445" width="44" height="18" fill="#ffffff" rx="2"/>
  <text x="390" y="459" font-size="13" fill="#7c3aed" text-anchor="middle">응답1</text>
</svg>