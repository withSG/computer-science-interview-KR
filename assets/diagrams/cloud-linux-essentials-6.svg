  <title id="t">ls -l 출력의 권한 문자열 읽기</title>
  <desc id="d">ls -l 출력 한 줄에서 첫 글자는 파일 종류, 이어지는 rwx·r-x·r-- 세 묶음은 user·group·others 권한이고, deploy는 소유자, webapp은 그룹임을 필드별로 풀어 보인다. 파일 종류 문자(- d l c b s p)의 뜻도 함께 적었다.</desc>
