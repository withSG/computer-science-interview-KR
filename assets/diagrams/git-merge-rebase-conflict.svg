<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="880" height="670" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">git reset 옵션별 도달 범위와 revert 비교</title>
  <desc id="d">reset --soft는 브랜치 포인터만, --mixed는 스테이징까지, --hard는 작업 디렉터리까지 되돌리며 --hard는 커밋하지 않은 변경을 영구히 잃습니다. 아래는 히스토리를 바꾸는 reset과 상쇄 커밋을 쌓아 히스토리를 보존하는 revert를 비교합니다.</desc>
  <rect width="880" height="670" fill="#ffffff"/>

  <!-- ① reset 옵션별 도달 범위 -->
  <text x="32" y="40" font-size="18" font-weight="700" fill="#111827">① reset 옵션별 도달 범위</text>
  <text x="264" y="40" font-size="15" fill="#4b5563">어디까지 따라오는가</text>

  <!-- 머리행 -->
  <rect x="32" y="60" width="140" height="56" fill="#f1f5f9"/>
  <rect x="172" y="60" width="160" height="56" fill="#f1f5f9"/>
  <rect x="332" y="60" width="160" height="56" fill="#f1f5f9"/>
  <rect x="492" y="60" width="160" height="56" fill="#fee2e2"/>
  <rect x="652" y="60" width="196" height="56" fill="#f1f5f9"/>

  <!-- 본문 열 음영 -->
  <rect x="172" y="116" width="320" height="192" fill="#f8fafc"/>
  <rect x="492" y="116" width="160" height="192" fill="#fff5f5"/>

  <text x="102" y="94" font-size="16" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git reset</text>
  <text x="252" y="84" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">브랜치 포인터</text>
  <text x="252" y="105" font-size="14" fill="#4b5563" text-anchor="middle">(HEAD / Commit)</text>
  <text x="412" y="84" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">스테이징 영역</text>
  <text x="412" y="105" font-size="14" fill="#4b5563" text-anchor="middle">(Index)</text>
  <text x="572" y="84" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">작업 디렉터리</text>
  <text x="572" y="105" font-size="14" fill="#991b1b" text-anchor="middle">(Working Dir)</text>
  <text x="750" y="94" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">주 용도</text>

  <!-- 격자 선 -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="332" y1="60" x2="332" y2="116"/>
    <line x1="492" y1="60" x2="492" y2="116"/>
    <line x1="172" y1="60" x2="172" y2="308"/>
    <line x1="652" y1="60" x2="652" y2="308"/>
    <line x1="32" y1="116" x2="848" y2="116"/>
    <line x1="32" y1="180" x2="848" y2="180"/>
    <line x1="32" y1="244" x2="848" y2="244"/>
  </g>
  <rect x="32" y="60" width="816" height="248" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- soft -->
  <text x="102" y="154" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">--soft</text>
  <path d="M182,129 H314 L326,148 L314,167 H182 Z" fill="#dbeafe"/>
  <text x="250" y="153" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">포인터만 이동</text>
  <text x="750" y="153" font-size="15" fill="#111827" text-anchor="middle">커밋 묶기 (add 유지)</text>

  <!-- mixed -->
  <text x="102" y="207" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">--mixed</text>
  <text x="102" y="228" font-size="14" fill="#4b5563" text-anchor="middle">(기본값)</text>
  <path d="M182,193 H474 L486,212 L474,231 H182 Z" fill="#fef3c7"/>
  <line x1="332" y1="193" x2="332" y2="231" stroke="#ffffff" stroke-width="2"/>
  <text x="256" y="217" font-size="15" fill="#78350f" text-anchor="middle">포인터 이동</text>
  <text x="408" y="217" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">스테이징 해제</text>
  <text x="750" y="217" font-size="15" fill="#111827" text-anchor="middle">커밋 취소 후 다시 담기</text>

  <!-- hard -->
  <text x="102" y="271" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">--hard</text>
  <text x="102" y="292" font-size="14" fill="#b91c1c" text-anchor="middle">(복구 불가 위험)</text>
  <path d="M182,257 H634 L646,276 L634,295 H182 Z" fill="#fecaca"/>
  <line x1="332" y1="257" x2="332" y2="295" stroke="#ffffff" stroke-width="2"/>
  <line x1="492" y1="257" x2="492" y2="295" stroke="#ffffff" stroke-width="2"/>
  <text x="256" y="281" font-size="15" fill="#7f1d1d" text-anchor="middle">포인터 이동</text>
  <text x="412" y="281" font-size="15" fill="#7f1d1d" text-anchor="middle">스테이징 해제</text>
  <text x="566" y="281" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">작업 파일까지 원복</text>
  <text x="750" y="281" font-size="15" fill="#111827" text-anchor="middle">로컬 실험 통째로 폐기</text>

  <!-- 작업 디렉터리 경고 -->
  <text x="572" y="334" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">▲ 미커밋 변경 영구 손실</text>
  <text x="572" y="355" font-size="14" fill="#b91c1c" text-anchor="middle">(reflog로도 복구 불가)</text>

  <line x1="32" y1="378" x2="848" y2="378" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ② reset vs revert -->
  <text x="32" y="414" font-size="18" font-weight="700" fill="#111827">② 히스토리 되돌리기: reset vs revert</text>

  <!-- reset 방식 -->
  <text x="48" y="459" font-size="17" font-weight="700" fill="#b91c1c">reset 방식</text>
  <text x="48" y="482" font-size="15" fill="#4b5563">히스토리 변경</text>
  <line x1="280" y1="464" x2="310" y2="464" stroke="#6b7280" stroke-width="2"/>
  <line x1="350" y1="464" x2="380" y2="464" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="260" cy="464" r="20" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <circle cx="330" cy="464" r="20" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <circle cx="400" cy="464" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="260" y="470" fill="#111827">c1</text>
    <text x="330" y="470" fill="#111827">c2</text>
    <text x="400" y="470" fill="#6b7280">c3</text>
  </g>
  <text x="520" y="459" font-size="15" fill="#111827">HEAD가 c2로 이동 (c3 참조 해제)</text>
  <text x="520" y="483" font-size="15" font-weight="700" fill="#b91c1c">공유 브랜치에 reset 금지</text>

  <line x1="32" y1="508" x2="848" y2="508" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- revert 방식 -->
  <text x="48" y="547" font-size="17" font-weight="700" fill="#047857">revert 방식</text>
  <text x="48" y="570" font-size="15" fill="#4b5563">히스토리 보존</text>
  <g stroke="#6b7280" stroke-width="2">
    <line x1="280" y1="552" x2="310" y2="552"/>
    <line x1="350" y1="552" x2="380" y2="552"/>
    <line x1="420" y1="552" x2="448" y2="552"/>
  </g>
  <circle cx="260" cy="552" r="20" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <circle cx="330" cy="552" r="20" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <circle cx="400" cy="552" r="20" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <circle cx="470" cy="552" r="22" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="260" y="558" fill="#111827">c1</text>
    <text x="330" y="558" fill="#111827">c2</text>
    <text x="400" y="558" fill="#111827">c3</text>
    <text x="470" y="558" fill="#065f46">c4</text>
  </g>
  <text x="520" y="547" font-size="15" fill="#111827">c4 = c3를 상쇄하는 새 커밋</text>
  <text x="520" y="571" font-size="15" font-weight="700" fill="#047857">새 커밋 생성 · push 후 안전</text>

  <!-- 결론 -->
  <rect x="32" y="600" width="816" height="44" rx="6" fill="#f1f5f9"/>
  <text x="52" y="628" font-size="15" fill="#111827"><tspan font-weight="700">결론</tspan>  로컬 작업 취소는 reset · 이미 push된 원격 커밋은 revert로 히스토리 보존</text>
</svg>
