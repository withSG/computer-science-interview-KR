<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">git reset 옵션 범위 및 revert 비교</title>
  <desc id="d">git reset의 soft, mixed, hard 옵션이 영향을 미치는 영역(HEAD, Index, 작업 디렉토리)의 범위를 보여주고, 히스토리를 덮어쓰지 않고 새 커밋을 추가하는 git revert 방식과의 차이를 설명하는 다이어그램입니다.</desc>
  
  <!-- 배경 흰색 -->
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커 -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 다이어그램 제목 -->
  <text x="440" y="36" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">git reset 옵션별 영향 범위 및 revert 동작 비교</text>

  <!-- SECTION 1: git reset 옵션 범위 (Layered / Contained) -->
  <g id="section-reset">
    <text x="40" y="70" font-size="14" font-weight="600" fill="#1f2933">1. git reset 옵션별 영향 영역</text>

    <!-- 3개 대상 영역 (Base Columns) -->
    <!-- 영역 1: 브랜치 포인터 (HEAD) -->
    <rect x="40" y="90" width="160" height="180" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="120" y="115" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">브랜치 포인터</text>
    <text x="120" y="132" font-size="11.5" fill="#52606d" text-anchor="middle">(HEAD / Commit)</text>

    <!-- 영역 2: Index (Staging Area) -->
    <rect x="230" y="90" width="160" height="180" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="310" y="115" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">스테이징 영역</text>
    <text x="310" y="132" font-size="11.5" fill="#52606d" text-anchor="middle">(Index)</text>

    <!-- 영역 3: 작업 디렉토리 (Working Directory) - 복구 불가 위험 강조 -->
    <rect x="420" y="90" width="160" height="180" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="500" y="115" font-size="13" font-weight="600" fill="#dc2626" text-anchor="middle">작업 디렉토리</text>
    <text x="500" y="132" font-size="11.5" fill="#dc2626" text-anchor="middle">(Working Dir)</text>
    <rect x="435" y="238" width="130" height="22" rx="4" fill="#dc2626"/>
    <text x="500" y="253" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">미커밋 변경 영구 손실</text>

    <!-- 중첩 영역 (Reset Options) -->
    <!-- 1) - -soft -->
    <rect x="50" y="150" width="140" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="185" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">git reset --soft</text>
    <text x="120" y="205" font-size="11.5" fill="#2563eb" text-anchor="middle">포인터만 이동</text>

    <!-- 2) - -mixed (기본값) -->
    <rect x="45" y="145" width="330" height="90" rx="8" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="235" y="155" width="130" height="20" rx="4" fill="#fffbeb"/>
    <text x="300" y="169" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">--mixed (기본값)</text>
    <text x="300" y="195" font-size="11.5" fill="#d97706" text-anchor="middle">스테이징 해제</text>

    <!-- 3) - -hard -->
    <rect x="40" y="140" width="540" height="100" rx="10" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="425" y="155" width="150" height="20" rx="4" fill="#fef2f2"/>
    <text x="500" y="169" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">--hard (복구 불가 위험)</text>
    <text x="500" y="195" font-size="11.5" fill="#dc2626" text-anchor="middle">작업 파일까지 원복</text>
  </g>

  <!-- 오른쪽 요약 안내 박스 -->
  <g id="reset-summary">
    <rect x="610" y="90" width="230" height="180" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="725" y="115" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">reset 시나리오별 요약</text>
    
    <text x="625" y="145" font-size="11.5" font-weight="600" fill="#2563eb">• --soft</text>
    <text x="685" y="145" font-size="11.5" fill="#52606d">커밋 묶기 (add 유지)</text>

    <text x="625" y="175" font-size="11.5" font-weight="600" fill="#d97706">• --mixed</text>
    <text x="685" y="175" font-size="11.5" fill="#52606d">커밋 취소 후 다시 담기</text>

    <text x="625" y="205" font-size="11.5" font-weight="600" fill="#dc2626">• --hard</text>
    <text x="685" y="205" font-size="11.5" fill="#52606d">로컬 실험 통째로 폐기</text>

    <line x1="625" y1="225" x2="825" y2="225" stroke="#cbd2d9" stroke-width="1"/>
    <text x="725" y="245" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">공유 브랜치에 reset 금지!</text>
  </g>

  <!-- 구분선 -->
  <line x1="40" y1="290" x2="840" y2="290" stroke="#cbd2d9" stroke-width="1"/>

  <!-- SECTION 2: reset vs revert 히스토리 비교 -->
  <g id="section-revert">
    <text x="40" y="320" font-size="14" font-weight="600" fill="#1f2933">2. 히스토리 되돌리기 방식 비교 (reset vs revert)</text>

    <!-- 1) reset 방식 -->
    <g id="reset-history">
      <text x="50" y="355" font-size="13" font-weight="600" fill="#dc2626">reset 방식</text>
      <text x="130" y="355" font-size="11.5" fill="#52606d">(기존 커밋 삭제/히스토리 변경)</text>

      <!-- Nodes -->
      <circle cx="80" cy="390" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="80" y="394" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">c1</text>

      <path d="M100,390 L130,390" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

      <circle cx="150" cy="390" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="150" y="394" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">c2</text>

      <!-- c3가 제거됨을 표시 -->
      <path d="M170,390 L200,390" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

      <circle cx="220" cy="390" r="16" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="220" y="394" font-size="11.5" fill="#9aa5b1" text-anchor="middle">c3</text>
      <!-- X 표시 -->
      <line x1="210" y1="380" x2="230" y2="400" stroke="#dc2626" stroke-width="2"/>
      <line x1="230" y1="380" x2="210" y2="400" stroke="#dc2626" stroke-width="2"/>

      <text x="150" y="430" font-size="11.5" font-weight="600" fill="#dc2626" text-anchor="middle">HEAD가 c2로 이동 (c3 삭제됨)</text>
    </g>

    <!-- 화살표 구분을 위한 중앙 경계 -->
    <line x1="420" y1="330" x2="420" y2="460" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- 2) revert 방식 -->
    <g id="revert-history">
      <text x="450" y="355" font-size="13" font-weight="600" fill="#059669">revert 방식</text>
      <text x="535" y="355" font-size="11.5" fill="#52606d">(새 커밋 생성/히스토리 보존 — push 후 안전)</text>

      <!-- Nodes -->
      <circle cx="480" cy="390" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="480" y="394" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">c1</text>

      <path d="M500,390 L520,390" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

      <circle cx="540" cy="390" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="540" y="394" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">c2</text>

      <path d="M560,390 L580,390" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

      <circle cx="600" cy="390" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="600" y="394" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">c3</text>

      <path d="M620,390 L650,390" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

      <!-- c4: revert commit -->
      <circle cx="670" cy="390" r="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="670" y="394" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">c4</text>

      <text x="670" y="430" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">c4 = c3를 상쇄하는 새 커밋</text>
    </g>
  </g>

  <!-- 하단 범례 및 결론 캡션 -->
  <rect x="40" y="475" width="800" height="30" rx="4" fill="#f8fafc"/>
  <text x="440" y="495" font-size="11.5" fill="#52606d" text-anchor="middle">결론: 커밋을 취소할 때 로컬 작업은 reset을 사용하고, 이미 push된 원격 커밋은 revert를 사용해 히스토리를 보존해야 한다.</text>
</svg>