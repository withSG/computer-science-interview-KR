<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SJF (Shortest Job First) — 비선점</title>
  <desc id="d">SJF 비선점 알고리즘의 프로세스 실행 Gantt 차트와 대기 시간 및 평균 대기 시간 계산 과정</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">SJF (Shortest Job First) — 비선점</text>

  <!-- Gantt Chart Timeline -->
  <!-- Time ticks -->
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">0</text>
  <text x="392.5" y="72" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">7</text>
  <text x="440" y="72" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">8</text>
  <text x="630" y="72" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">12</text>
  <text x="820" y="72" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">16</text>

  <!-- Gantt Chart Bars -->
  <!-- P1: 0 to 7 (width 332.5) -->
  <rect x="60" y="80" width="332.5" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="226.25" y="104" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">P1</text>

  <!-- P3: 7 to 8 (width 47.5) -->
  <rect x="392.5" y="80" width="47.5" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="416.25" y="104" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">P3</text>

  <!-- P2: 8 to 12 (width 190) -->
  <rect x="440" y="80" width="190" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="535" y="104" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">P2</text>

  <!-- P4: 12 to 16 (width 190) -->
  <rect x="630" y="80" width="190" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="725" y="104" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">P4</text>

  <!-- Timeline base line markers -->
  <line x1="60" y1="80" x2="60" y2="120" stroke="#1f2933" stroke-width="2"/>
  <line x1="392.5" y1="80" x2="392.5" y2="120" stroke="#1f2933" stroke-width="1.5"/>
  <line x1="440" y1="80" x2="440" y2="120" stroke="#1f2933" stroke-width="1.5"/>
  <line x1="630" y1="80" x2="630" y2="120" stroke="#1f2933" stroke-width="1.5"/>
  <line x1="820" y1="80" x2="820" y2="120" stroke="#1f2933" stroke-width="2"/>

  <!-- Description below timeline -->
  <text x="60" y="152" font-size="13" fill="#52606d">(0시점엔 P1만 있어 P1부터. 이후 남은 것 중 짧은 순)</text>

  <!-- Separator -->
  <line x1="30" y1="180" x2="850" y2="180" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Statistics Section -->
  <rect x="30" y="200" width="820" height="110" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="6"/>

  <text x="60" y="238" font-size="13" font-weight="bold" fill="#1f2933">
    대기 시간: <tspan fill="#2563eb">P1=0</tspan>, <tspan fill="#7c3aed">P3=7-4=3</tspan>, <tspan fill="#059669">P2=8-2=6</tspan>, <tspan fill="#d97706">P4=12-5=7</tspan>
  </text>

  <text x="60" y="278" font-size="14" font-weight="bold" fill="#1f2933">
    평균 대기 시간 = (0+3+6+7)/4 = 4.0
  </text>
</svg>