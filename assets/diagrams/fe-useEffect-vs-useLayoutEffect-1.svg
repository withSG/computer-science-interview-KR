<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">useLayoutEffect와 useEffect의 실행 시점</title>
  <desc id="d">상태 변경 후 render 단계와 commit 단계를 거쳐 브라우저 페인트가 일어나는 흐름. useLayoutEffect는 commit 단계 안, 페인트 전에 실행되고 useEffect는 페인트가 끝난 뒤 실행된다. 각 훅 안에서 setState하면 render로 되돌아가는데, useLayoutEffect에서는 페인트 전에, useEffect에서는 화면이 한 번 그려진 뒤에 다시 그려진다.</desc>
  <rect width="880" height="680" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 왼쪽 구간 레일: 페인트 전 / 페인트 후 -->
  <rect x="24" y="86" width="96" height="338" rx="8" fill="#f3f4f6"/>
  <text x="72" y="261" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">페인트 전</text>
  <rect x="24" y="520" width="96" height="136" rx="8" fill="#dbeafe"/>
  <text x="72" y="594" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">페인트 후</text>

  <!-- 상태 변경 -->
  <rect x="385" y="24" width="130" height="36" rx="18" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="450" y="47.5" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">상태 변경</text>
  <path d="M450,60 V82" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ah-ink)"/>

  <!-- render 단계 -->
  <rect x="140" y="86" width="620" height="64" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="164" y="113" font-size="17" fill="#1f2937"><tspan font-weight="bold">render 단계</tspan> — 컴포넌트 실행, 재조정</text>
  <text x="164" y="138" font-size="15" fill="#4b5563">실제 DOM도 화면도 아직 그대로</text>
  <path d="M450,150 V172" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ah-ink)"/>

  <!-- commit 단계 -->
  <rect x="140" y="176" width="620" height="248" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="164" y="205" font-size="17" fill="#5b21b6"><tspan font-weight="bold">commit 단계</tspan> (동기, 중단 불가)</text>
  <text x="164" y="239" font-size="16" fill="#1f2937">① 실제 DOM 삽입·수정·삭제</text>
  <text x="164" y="268" font-size="16" fill="#1f2937">② 이전 useLayoutEffect의 cleanup</text>
  <text x="190" y="292" font-size="15" fill="#4b5563">(①과 ②는 같은 mutation 구간에서 함께 처리된다)</text>
  <text x="164" y="324" font-size="16" fill="#1f2937">③ ref 연결</text>
  <rect x="156" y="340" width="588" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="172" y="366" font-size="17" font-weight="bold" fill="#1f2937">④ useLayoutEffect</text>
  <text x="728" y="366" font-size="16" font-weight="bold" fill="#92400e" text-anchor="end">◀ 여기! 화면은 아직 안 그려짐</text>
  <text x="190" y="404" font-size="15" fill="#4b5563">(여기서 setState하면 페인트 전에 render부터 다시)</text>
  <path d="M450,424 V442" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ah-ink)"/>

  <!-- 브라우저 페인트 -->
  <rect x="24" y="446" width="736" height="50" rx="8" fill="#1f2937"/>
  <text x="392" y="477" font-size="18" fill="#f9fafb" text-anchor="middle"><tspan font-weight="bold">브라우저 페인트</tspan> — 사용자가 처음으로 새 화면을 본다</text>
  <path d="M450,496 V516" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ah-ink)"/>

  <!-- 페인트 이후 -->
  <rect x="140" y="520" width="620" height="136" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="164" y="554" font-size="16" fill="#1f2937">⑤ 이전 useEffect의 cleanup</text>
  <rect x="156" y="570" width="588" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="172" y="596" font-size="17" font-weight="bold" fill="#1f2937">⑥ useEffect</text>
  <text x="728" y="596" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="end">◀ 여기! 이미 화면이 그려진 뒤</text>
  <text x="190" y="636" font-size="15" fill="#4b5563">(여기서 setState하면 화면이 한 번 더 바뀐다)</text>

  <!-- setState 되돌림: ④는 페인트 전에, ⑥은 페인트를 한 번 거친 뒤 -->
  <path d="M760,399 H792 V134 H766" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ah-amber)"/>
  <path d="M760,631 H832 V106 H766" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ah-blue)"/>
</svg>
