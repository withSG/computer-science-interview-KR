<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐싱 레이어</title>
  <desc id="d">Client부터 Browser Cache, CDN, Application Cache, Database까지 이어지는 캐싱 레이어 구조도</desc>
  <rect width="880" height="720" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Client -->
  <g transform="translate(240, 40)">
    <rect x="0" y="0" width="220" height="60" rx="6" ry="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="110" y="35" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Client</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M350,100 L350,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Browser Cache -->
  <g transform="translate(240, 150)">
    <rect x="0" y="0" width="220" height="60" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="35" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Browser Cache</text>
  </g>

  <!-- Side Note L1 -->
  <path d="M460,180 L520,180" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="532" y="184" font-size="13" fill="#2563eb" font-weight="bold">L1 (가장 빠름)</text>

  <!-- Arrow 2 -->
  <path d="M350,210 L350,260" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- CDN -->
  <g transform="translate(240, 260)">
    <rect x="0" y="0" width="220" height="60" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="110" y="35" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">CDN</text>
  </g>

  <!-- Side Note L2 -->
  <path d="M460,290 L520,290" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="532" y="294" font-size="13" fill="#059669" font-weight="bold">L2 (정적 리소스)</text>

  <!-- Arrow 3 -->
  <path d="M350,320 L350,370" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Application Cache -->
  <g transform="translate(240, 370)">
    <rect x="0" y="0" width="220" height="80" rx="6" ry="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="110" y="35" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Application</text>
    <text x="110" y="58" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Cache</text>
  </g>

  <!-- Side Note L3 -->
  <path d="M460,410 L520,410" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="532" y="414" font-size="13" fill="#7c3aed" font-weight="bold">L3 (Redis, Memcached)</text>

  <!-- Arrow 4 -->
  <path d="M350,450 L350,500" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Database -->
  <g transform="translate(240, 500)">
    <rect x="0" y="0" width="220" height="60" rx="6" ry="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="110" y="35" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Database</text>
  </g>

  <!-- Side Note DB -->
  <path d="M460,530 L520,530" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="532" y="534" font-size="13" fill="#d97706" font-weight="bold">원본 데이터</text>
</svg>