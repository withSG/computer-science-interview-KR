<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐싱 레이어</title>
  <desc id="d">요청은 Client에서 Browser Cache(L1, 가장 빠름), CDN(L2, 정적 리소스), Application Cache(L3, Redis, Memcached)를 차례로 지나 원본 데이터가 있는 Database에 닿습니다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 캐시 3단 묶음 -->
  <rect x="40" y="104" width="800" height="276" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="140" y="248" font-size="17" font-weight="bold" fill="#334155" text-anchor="middle">캐싱 레이어</text>

  <!-- Client -->
  <rect x="300" y="30" width="280" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="64" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>

  <line x1="440" y1="88" x2="440" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- L1 Browser Cache -->
  <rect x="300" y="122" width="280" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="156" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Browser Cache</text>
  <rect x="604" y="134" width="48" height="32" rx="16" fill="#1d4ed8"/>
  <text x="628" y="156" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L1</text>
  <text x="666" y="156" font-size="16" fill="#1f2937">가장 빠름</text>

  <line x1="440" y1="180" x2="440" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- L2 CDN -->
  <rect x="300" y="214" width="280" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="248" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">CDN</text>
  <rect x="604" y="226" width="48" height="32" rx="16" fill="#047857"/>
  <text x="628" y="248" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L2</text>
  <text x="666" y="248" font-size="16" fill="#1f2937">정적 리소스</text>

  <line x1="440" y1="272" x2="440" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- L3 Application Cache -->
  <rect x="300" y="306" width="280" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="340" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Application Cache</text>
  <rect x="604" y="318" width="48" height="32" rx="16" fill="#6d28d9"/>
  <text x="628" y="340" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L3</text>
  <text x="666" y="340" font-size="16" fill="#1f2937">Redis, Memcached</text>

  <line x1="440" y1="364" x2="440" y2="394" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Database -->
  <rect x="300" y="398" width="280" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="432" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Database</text>
  <text x="604" y="432" font-size="16" font-weight="bold" fill="#b45309">원본 데이터</text>
</svg>
