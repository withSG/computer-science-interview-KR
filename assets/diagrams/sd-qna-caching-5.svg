<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CDN 동작 원리</title>
  <desc id="d">Origin Server의 콘텐츠가 서울·도쿄·싱가포르의 Edge 서버로 퍼지고, 각 지역 사용자는 가까운 Edge 서버에서 콘텐츠를 받는 구조.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Origin -->
  <rect x="320" y="28" width="240" height="60" rx="10" fill="#1d4ed8"/>
  <text x="440" y="65" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Origin Server</text>

  <!-- 지역 묶음 (Edge 서버 + 가까운 사용자) -->
  <rect x="40" y="150" width="240" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="320" y="150" width="240" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="600" y="150" width="240" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Origin → Edge 분배선 -->
  <line x1="440" y1="88" x2="440" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="160" y1="120" x2="720" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="160" y1="119" x2="160" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="440" y1="120" x2="440" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="720" y1="119" x2="720" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- Edge 서버 -->
  <rect x="64" y="176" width="192" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="160" y="205" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Edge 서버</text>
  <text x="160" y="229" font-size="16" fill="#1f2937" text-anchor="middle">(서울)</text>

  <rect x="344" y="176" width="192" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="205" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Edge 서버</text>
  <text x="440" y="229" font-size="16" fill="#1f2937" text-anchor="middle">(도쿄)</text>

  <rect x="624" y="176" width="192" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="720" y="205" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Edge 서버</text>
  <text x="720" y="229" font-size="16" fill="#1f2937" text-anchor="middle">(싱가포르)</text>

  <!-- Edge → 사용자 -->
  <line x1="160" y1="244" x2="160" y2="296" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="440" y1="244" x2="440" y2="296" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="720" y1="244" x2="720" y2="296" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- 사용자 -->
  <rect x="64" y="300" width="192" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="160" y="333" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">한국 사용자</text>

  <rect x="344" y="300" width="192" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="333" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">일본 사용자</text>

  <rect x="624" y="300" width="192" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="720" y="333" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">동남아 사용자</text>

  <!-- 캡션 -->
  <text x="440" y="414" font-size="16" fill="#374151" text-anchor="middle">사용자에게 가까운 서버에서 콘텐츠 제공</text>
</svg>
