<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CDN 동작 원리</title>
  <desc id="d">Origin Server에서 지리적으로 분산된 Edge 서버들을 거쳐 각 지역 사용자에게 콘텐츠가 전달되는 구조를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- Origin Server -->
  <rect x="360" y="30" width="160" height="60" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="52.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Origin</text>
  <text x="440" y="70.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Server</text>

  <!-- Distribution Line from Origin -->
  <path d="M440,90 L440,120 M160,120 L720,120 M160,120 L160,150 M440,120 L440,150 M720,120 L720,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Edge Servers -->
  <!-- Seoul -->
  <rect x="80" y="150" width="160" height="60" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="172.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Edge 서버</text>
  <text x="160" y="190.55" font-size="13" fill="#52606d" text-anchor="middle">(서울)</text>

  <!-- Tokyo -->
  <rect x="360" y="150" width="160" height="60" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="172.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Edge 서버</text>
  <text x="440" y="190.55" font-size="13" fill="#52606d" text-anchor="middle">(도쿄)</text>

  <!-- Singapore -->
  <rect x="640" y="150" width="160" height="60" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="172.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Edge 서버</text>
  <text x="720" y="190.55" font-size="13" fill="#52606d" text-anchor="middle">(싱가포르)</text>

  <!-- Edge to User Connections -->
  <path d="M160,210 L160,270" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M440,210 L440,270" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M720,210 L720,270" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Users -->
  <!-- Korea User -->
  <rect x="80" y="270" width="160" height="50" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="160" y="299.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">한국 사용자</text>

  <!-- Japan User -->
  <rect x="360" y="270" width="160" height="50" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="299.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">일본 사용자</text>

  <!-- SE Asia User -->
  <rect x="640" y="270" width="160" height="50" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="299.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">동남아 사용자</text>
</svg>