<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">두 시각은 반드시 어긋난다</title>
  <desc id="d">이벤트 발생 시각과 도착(처리) 시각의 차이 및 지연 데이터로 인한 윈도우 계산 오차를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- 배경 구분선 및 세로 경계선 -->
  <line x1="480" y1="40" x2="480" y2="340" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 시간축 라벨 및 데이터 항목 -->
  <!-- Header Row: Event Identifiers -->
  <text x="200" y="45" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text>
  <text x="320" y="45" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">B</text>
  <text x="540" y="45" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>
  <text x="660" y="45" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">D</text>
  <text x="780" y="45" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">E</text>

  <!-- Row 1: 이벤트 발생 시각 -->
  <text x="40" y="80" font-size="13" font-weight="bold" fill="#1f2933">이벤트 발생 시각</text>
  <text x="200" y="80" font-size="13" fill="#52606d" text-anchor="middle">09:58</text>
  <text x="320" y="80" font-size="13" fill="#52606d" text-anchor="middle">09:59</text>
  <text x="540" y="80" font-size="13" fill="#52606d" text-anchor="middle">10:00</text>
  <text x="660" y="80" font-size="13" fill="#52606d" text-anchor="middle">10:01</text>
  <text x="780" y="80" font-size="13" fill="#52606d" text-anchor="middle">10:02</text>

  <!-- Middle: 윈도우 경계 표시 (가로 구분선 및 라벨) -->
  <line x1="480" y1="130" x2="520" y2="130" stroke="#2563eb" stroke-width="2"/>
  <text x="530" y="134" font-size="13" font-weight="bold" fill="#2563eb">윈도우 경계 10:00</text>
  <text x="530" y="154" font-size="11.5" fill="#52606d">(09:50~10:00 구간은 여기서 닫힌다)</text>

  <!-- Row 2: 도착(처리) 시각 -->
  <text x="40" y="210" font-size="13" font-weight="bold" fill="#1f2933">도착(처리) 시각</text>
  <text x="200" y="210" font-size="13" fill="#52606d" text-anchor="middle">09:58</text>
  <text x="320" y="210" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">10:03</text>
  <text x="540" y="210" font-size="13" fill="#52606d" text-anchor="middle">10:00</text>
  <text x="660" y="210" font-size="13" fill="#52606d" text-anchor="middle">10:01</text>
  <text x="780" y="210" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">10:04</text>

  <!-- Bottom Row: Event Identifiers Repeat -->
  <text x="200" y="240" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text>
  <text x="320" y="240" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">B</text>
  <text x="540" y="240" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>
  <text x="660" y="240" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">D</text>
  <text x="780" y="240" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">E</text>

  <!-- 지연 원인 화살표 & 설명 (B) -->
  <path d="M320,290 L320,252" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="320" y="308" font-size="11.5" fill="#dc2626" text-anchor="middle">지하철에서 오프라인</text>
  <text x="320" y="326" font-size="11.5" fill="#dc2626" text-anchor="middle">→ 4분 늦게 도착</text>

  <!-- 지연 원인 화살표 & 설명 (E) -->
  <path d="M780,290 L780,252" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="780" y="308" font-size="11.5" fill="#dc2626" text-anchor="middle">네트워크 재시도</text>
  <text x="780" y="326" font-size="11.5" fill="#dc2626" text-anchor="middle">→ 2분 늦게 도착</text>

  <!-- 하단 수식 / 상황 설명 박스 -->
  <rect x="40" y="370" width="800" height="130" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="6"/>
  <text x="70" y="415" font-size="13" fill="#1f2933">이벤트 B는 09:59에 일어났지만 10:03에 도착했다.</text>
  <text x="70" y="455" font-size="13" fill="#1f2933">10:00에 도착한 것만 세어 "09:50~10:00 윈도우"를 닫으면 B가 통째로 빠진다.</text>
</svg>