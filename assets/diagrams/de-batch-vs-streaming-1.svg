<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이벤트 시간과 도착 시간의 어긋남</title>
  <desc id="d">이벤트 A~E의 발생 시각과 도착(처리) 시각을 같은 시간축에 놓았다. 09:59에 일어난 B는 10:03에 도착해, 10:00까지 도착한 것만 세어 09:50~10:00 윈도우를 닫으면 통째로 빠진다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 09:50~10:00 윈도우 영역 -->
  <rect x="200" y="84" width="240" height="376" fill="#eff6ff"/>
  <text x="212" y="108" font-size="15" font-weight="700" fill="#1d4ed8">09:50~10:00 윈도우</text>

  <!-- 윈도우 경계 -->
  <text x="440" y="40" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">윈도우 경계 10:00</text>
  <text x="440" y="63" font-size="15" fill="#374151" text-anchor="middle">(09:50~10:00 구간은 여기서 닫힌다)</text>
  <line x1="440" y1="76" x2="440" y2="460" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- 행 이름 -->
  <text x="24" y="166" font-size="17" font-weight="700" fill="#111827">이벤트 발생 시각</text>
  <text x="24" y="188" font-size="14" fill="#4b5563">event time</text>
  <text x="24" y="366" font-size="17" font-weight="700" fill="#111827">도착(처리) 시각</text>
  <text x="24" y="388" font-size="14" fill="#4b5563">processing time</text>

  <!-- 행 기준선 -->
  <line x1="200" y1="170" x2="852" y2="170" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="200" y1="370" x2="852" y2="370" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- 지연 화살표: B (4분), E (2분) -->
  <line x1="345" y1="228" x2="704.4" y2="362.3" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar-red)"/>
  <line x1="630" y1="228" x2="802.4" y2="356.8" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar-amber)"/>

  <rect x="456" y="275" width="168" height="52" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="540" y="296" font-size="15" fill="#111827" text-anchor="middle">지하철에서 오프라인</text>
  <text x="540" y="317" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">→ 4분 늦게 도착</text>

  <rect x="644" y="266" width="144" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="716" y="287" font-size="15" fill="#111827" text-anchor="middle">네트워크 재시도</text>
  <text x="716" y="308" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">→ 2분 늦게 도착</text>

  <!-- 1행: 이벤트 발생 시각 -->
  <circle cx="250" cy="170" r="16" fill="#1f2937"/>
  <circle cx="345" cy="170" r="16" fill="#b91c1c"/>
  <circle cx="440" cy="170" r="16" fill="#1f2937"/>
  <circle cx="535" cy="170" r="16" fill="#1f2937"/>
  <circle cx="630" cy="170" r="16" fill="#b45309"/>
  <text x="250" y="176" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="345" y="176" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="440" y="176" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="535" y="176" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="630" y="176" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>

  <rect x="218" y="196" width="64" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="313" y="196" width="64" height="26" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="408" y="196" width="64" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="503" y="196" width="64" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="598" y="196" width="64" height="26" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="214" font-size="15" fill="#111827" text-anchor="middle">09:58</text>
  <text x="345" y="214" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">09:59</text>
  <text x="440" y="214" font-size="15" fill="#111827" text-anchor="middle">10:00</text>
  <text x="535" y="214" font-size="15" fill="#111827" text-anchor="middle">10:01</text>
  <text x="630" y="214" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">10:02</text>

  <!-- 2행: 도착(처리) 시각 -->
  <circle cx="250" cy="370" r="16" fill="#1f2937"/>
  <circle cx="725" cy="370" r="16" fill="#b91c1c"/>
  <circle cx="440" cy="370" r="16" fill="#1f2937"/>
  <circle cx="535" cy="370" r="16" fill="#1f2937"/>
  <circle cx="820" cy="370" r="16" fill="#b45309"/>
  <text x="250" y="376" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="725" y="376" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="440" y="376" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="535" y="376" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="820" y="376" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>

  <rect x="218" y="396" width="64" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="693" y="396" width="64" height="26" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="408" y="396" width="64" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="503" y="396" width="64" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <rect x="788" y="396" width="64" height="26" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="414" font-size="15" fill="#111827" text-anchor="middle">09:58</text>
  <text x="725" y="414" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">10:03</text>
  <text x="440" y="414" font-size="15" fill="#111827" text-anchor="middle">10:00</text>
  <text x="535" y="414" font-size="15" fill="#111827" text-anchor="middle">10:01</text>
  <text x="820" y="414" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">10:04</text>

  <rect x="647" y="432" width="156" height="26" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="725" y="450" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">마감 뒤 도착 → 빠짐</text>

  <!-- 결론 -->
  <rect x="24" y="482" width="832" height="72" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="440" y="511" font-size="16" fill="#111827" text-anchor="middle">이벤트 B는 09:59에 일어났지만 10:03에 도착했다.</text>
  <text x="440" y="538" font-size="16" fill="#111827" text-anchor="middle">10:00에 도착한 것만 세어 "09:50~10:00 윈도우"를 닫으면 <tspan font-weight="700" fill="#b91c1c">B가 통째로 빠진다.</tspan></text>
</svg>
