<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">전통적 SSR의 두 가지 병목</title>
  <desc id="d">문제 1: 서버는 DB 조회 완료를 기다려 전체 HTML을 생성한 뒤에야 전송·표시하므로 느린 쿼리 하나가 페이지 전체의 TTFB를 잡아먹는다. 문제 2: 클라이언트는 JS 번들을 전부 다운로드하고 트리 전체를 하이드레이션해야 인터랙티브해지므로 페이지 맨 아래 댓글 위젯 때문에 맨 위 검색창이 안 눌린다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 문제 1 -->
  <text x="40" y="56" font-size="19" font-weight="bold" fill="#111827">문제 1 — 서버가 <tspan fill="#b91c1c">전부</tspan> 끝나야 보낸다</text>

  <rect x="40" y="76" width="210" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="108" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">DB 조회 완료 대기</text>
  <line x1="256" y1="102" x2="288" y2="102" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="294" y="76" width="190" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="389" y="108" font-size="16" fill="#1f2937" text-anchor="middle">전체 HTML 생성</text>
  <line x1="490" y1="102" x2="522" y2="102" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="528" y="76" width="130" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="593" y="108" font-size="16" fill="#1f2937" text-anchor="middle">전송</text>
  <line x1="664" y1="102" x2="696" y2="102" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="702" y="76" width="130" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="767" y="108" font-size="16" fill="#1f2937" text-anchor="middle">표시</text>

  <path d="M40,136 V146 H250 V136" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="145" y1="146" x2="145" y2="160" stroke="#dc2626" stroke-width="2"/>
  <rect x="40" y="160" width="424" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="56" y="186" font-size="16" fill="#b91c1c">느린 쿼리 하나가 페이지 전체의 TTFB를 잡아먹는다</text>

  <line x1="40" y1="226" x2="840" y2="226" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 문제 2 -->
  <text x="40" y="278" font-size="19" font-weight="bold" fill="#111827">문제 2 — 클라이언트가 <tspan fill="#b91c1c">전부</tspan> 받아야 동작한다</text>

  <rect x="40" y="298" width="220" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="330" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">JS 번들 전부 다운로드</text>
  <line x1="266" y1="324" x2="298" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="304" y="298" width="220" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="414" y="330" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">트리 전체 하이드레이션</text>
  <line x1="530" y1="324" x2="562" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="568" y="298" width="150" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="643" y="330" font-size="16" fill="#1f2937" text-anchor="middle">인터랙티브</text>

  <path d="M40,358 V368 H524 V358" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="282" y1="368" x2="282" y2="382" stroke="#dc2626" stroke-width="2"/>
  <rect x="40" y="382" width="484" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="56" y="408" font-size="16" fill="#b91c1c">페이지 맨 아래 댓글 위젯 때문에 맨 위 검색창이 안 눌린다</text>
</svg>
