<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세션 방식의 요청 처리 흐름</title>
  <desc id="d">세션 방식에서 요청은 WAS를 거쳐 Redis 조회, 사용자 확인, 처리 순으로 진행된다. 매 요청마다 끼는 Redis 조회 때문에 네트워크 왕복, Redis 장애 시 전원 로그아웃, 모든 서비스가 같은 Redis를 바라봐야 하는 부담이 생긴다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 행 라벨 -->
  <rect x="24" y="50" width="64" height="36" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="56" y="74" font-size="16" font-weight="bold" fill="#3730a3" text-anchor="middle">세션</text>

  <!-- 흐름 -->
  <rect x="112" y="40" width="88" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="156" y="74" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">요청</text>

  <line x1="204" y1="68" x2="240" y2="68" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="244" y="40" width="88" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="288" y="74" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">WAS</text>

  <line x1="336" y1="68" x2="372" y2="68" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="376" y="40" width="140" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="446" y="74" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">Redis 조회</text>

  <line x1="520" y1="68" x2="556" y2="68" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="560" y="40" width="132" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="626" y="74" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사용자 확인</text>

  <line x1="696" y1="68" x2="732" y2="68" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="736" y="40" width="88" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="780" y="74" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">처리</text>

  <!-- Redis 조회가 만드는 부담 -->
  <line x1="446" y1="150" x2="446" y2="102" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahr)"/>

  <rect x="206" y="150" width="480" height="140" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="232" cy="181" r="5" fill="#b91c1c"/>
  <text x="248" y="187" font-size="16" fill="#111827">매 요청마다 네트워크 왕복</text>
  <circle cx="232" cy="220" r="5" fill="#b91c1c"/>
  <text x="248" y="226" font-size="16" fill="#111827">Redis가 죽으면 전원 로그아웃</text>
  <circle cx="232" cy="259" r="5" fill="#b91c1c"/>
  <text x="248" y="265" font-size="16" fill="#111827">서비스가 10개면 10개 모두 이 Redis를 바라봐야 함</text>
</svg>
