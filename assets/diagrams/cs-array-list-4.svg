<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">연결 리스트 노드 삽입</title>
  <desc id="d">10과 20 사이에 15를 넣을 때 15 노드를 새로 만들고, 1) 15.next = 20, 2) 10.next = 15 순서로 화살표 두 개만 고친다. 기존 노드는 옮기지 않으며 결과는 10, 15, 20, 30 순서가 된다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- before -->
  <text x="24" y="70" font-size="16" font-weight="bold" fill="#374151">before</text>
  <g fill="#f9fafb" stroke="#6b7280" stroke-width="1.5">
    <rect x="150" y="40" width="70" height="48" rx="4"/>
    <rect x="370" y="40" width="70" height="48" rx="4"/>
    <rect x="480" y="40" width="70" height="48" rx="4"/>
  </g>
  <g font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="185" y="71">10</text>
    <text x="405" y="71">20</text>
    <text x="515" y="71">30</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#ah-k)">
    <line x1="221" y1="64" x2="368" y2="64"/>
    <line x1="441" y1="64" x2="478" y2="64"/>
  </g>

  <!-- 삽입 과정 -->
  <rect x="24" y="112" width="832" height="220" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="44" y="144" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#1d4ed8">15</tspan> 노드를 새로 만들고</text>

  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.5">
    <rect x="150" y="162" width="70" height="48" rx="4"/>
    <rect x="370" y="162" width="70" height="48" rx="4"/>
    <rect x="480" y="162" width="70" height="48" rx="4"/>
  </g>
  <rect x="260" y="258" width="70" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="185" y="193" fill="#111827">10</text>
    <text x="405" y="193" fill="#111827">20</text>
    <text x="515" y="193" fill="#111827">30</text>
    <text x="295" y="289" fill="#1d4ed8">15</text>
  </g>

  <!-- 기존 10→20 연결은 끊김 -->
  <line x1="221" y1="186" x2="368" y2="186" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-g)"/>
  <g stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round">
    <line x1="287" y1="178" x2="303" y2="194"/>
    <line x1="287" y1="194" x2="303" y2="178"/>
  </g>
  <line x1="441" y1="186" x2="478" y2="186" stroke="#374151" stroke-width="2" marker-end="url(#ah-k)"/>

  <!-- 새 연결 -->
  <line x1="331" y1="268" x2="390" y2="215" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#ah-b)"/>
  <line x1="200" y1="212" x2="256" y2="268" stroke="#b45309" stroke-width="2.2" marker-end="url(#ah-o)"/>
  <circle cx="378" cy="262" r="11" fill="#1d4ed8"/>
  <text x="378" y="267" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="212" cy="258" r="11" fill="#b45309"/>
  <text x="212" y="263" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <!-- 단계 설명 -->
  <circle cx="606" cy="196" r="11" fill="#1d4ed8"/>
  <text x="606" y="201" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="626" y="202" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="17" font-weight="bold" fill="#1d4ed8">15.next = 20</text>
  <text x="626" y="228" font-size="15" fill="#4b5563">새 노드가 뒤를 가리키게</text>
  <circle cx="606" cy="270" r="11" fill="#b45309"/>
  <text x="606" y="275" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="626" y="276" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="17" font-weight="bold" fill="#b45309">10.next = 15</text>
  <text x="626" y="302" font-size="15" fill="#4b5563">앞 노드가 새 노드를 가리키게</text>

  <!-- after -->
  <text x="24" y="396" font-size="16" font-weight="bold" fill="#374151">after</text>
  <g fill="#f9fafb" stroke="#6b7280" stroke-width="1.5">
    <rect x="150" y="366" width="70" height="48" rx="4"/>
    <rect x="370" y="366" width="70" height="48" rx="4"/>
    <rect x="480" y="366" width="70" height="48" rx="4"/>
  </g>
  <rect x="260" y="366" width="70" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="185" y="397" fill="#111827">10</text>
    <text x="295" y="397" fill="#1d4ed8">15</text>
    <text x="405" y="397" fill="#111827">20</text>
    <text x="515" y="397" fill="#111827">30</text>
  </g>
  <line x1="221" y1="390" x2="258" y2="390" stroke="#b45309" stroke-width="2.2" marker-end="url(#ah-o)"/>
  <line x1="331" y1="390" x2="368" y2="390" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#ah-b)"/>
  <line x1="441" y1="390" x2="478" y2="390" stroke="#374151" stroke-width="2" marker-end="url(#ah-k)"/>
  <circle cx="240" cy="350" r="11" fill="#b45309"/>
  <text x="240" y="355" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="350" cy="350" r="11" fill="#1d4ed8"/>
  <text x="350" y="355" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
</svg>
