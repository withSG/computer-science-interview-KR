<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동작 원리 — 삽입은 화살표 두 개</title>
  <desc id="d">연결 리스트에서 10과 20 노드 사이에 새 노드 15를 삽입할 때 화살표 두 개를 변경하는 과정을 보여주는 다이어그램</desc>
  
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Section 1: before -->
  <text x="50" y="54" font-size="14" font-weight="bold" fill="#1f2933">before:</text>

  <!-- before nodes -->
  <rect x="130" y="30" width="50" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="155" y="52" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">10</text>

  <path d="M180,48 L230,48" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="230" y="30" width="50" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="255" y="52" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">20</text>

  <path d="M280,48 L330,48" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="330" y="30" width="50" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="355" y="52" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">30</text>


  <!-- Section 2: middle explanation block -->
  <rect x="110" y="95" width="680" height="110" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- New node 15 highlight -->
  <rect x="130" y="112" width="50" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="155" y="134" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">15</text>
  <text x="190" y="134" font-size="13" font-weight="bold" fill="#1f2933">노드를 새로 만들고</text>

  <!-- Step 1 -->
  <text x="150" y="166" font-size="13" font-weight="bold" fill="#2563eb">1)</text>
  <text x="170" y="166" font-size="13" font-weight="bold" fill="#2563eb">15.next = 20</text>
  <text x="280" y="166" font-size="13" fill="#52606d">(새 노드가 뒤를 가리키게)</text>

  <!-- Step 2 -->
  <text x="150" y="192" font-size="13" font-weight="bold" fill="#d97706">2)</text>
  <text x="170" y="192" font-size="13" font-weight="bold" fill="#d97706">10.next = 15</text>
  <text x="280" y="192" font-size="13" fill="#52606d">(앞 노드가 새 노드를 가리키게)</text>


  <!-- Section 3: after -->
  <text x="50" y="274" font-size="14" font-weight="bold" fill="#1f2933">after:</text>

  <!-- after nodes -->
  <rect x="130" y="250" width="50" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="155" y="272" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">10</text>

  <!-- arrow 10 -> 15 (step 2 effect) -->
  <path d="M180,268 L230,268" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <rect x="230" y="250" width="50" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="255" y="272" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">15</text>

  <!-- arrow 15 -> 20 (step 1 effect) -->
  <path d="M280,268 L330,268" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="330" y="250" width="50" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="355" y="272" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">20</text>

  <path d="M380,268 L430,268" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="430" y="250" width="50" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="455" y="272" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">30</text>
</svg>