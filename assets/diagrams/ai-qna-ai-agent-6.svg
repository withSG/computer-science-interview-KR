<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BMAD 워크플로우</title>
  <desc id="d">계획 단계에서 큰 컨텍스트로 PRD·아키텍처를 작성한 뒤, 개발 단계에서 IDE로 스토리 단위 구현·검증을 반복하는 두 단계 흐름.</desc>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="250" fill="#ffffff"/>

  <!-- 1. 계획 단계 -->
  <rect x="24" y="32" width="330" height="190" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="58" cy="66" r="15" fill="#1d4ed8"/>
  <text x="58" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="84" y="73" font-size="20" font-weight="bold" fill="#1e3a8a">계획 단계</text>
  <text x="48" y="120" font-size="16" fill="#374151">큰 컨텍스트에서</text>
  <text x="48" y="168" font-size="18" font-weight="bold" fill="#111827">PRD·아키텍처 작성</text>

  <!-- 단계 전환 -->
  <path d="M354,127 L432,127" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ak)"/>

  <!-- 2. 개발 단계 -->
  <rect x="434" y="32" width="422" height="190" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <circle cx="468" cy="66" r="15" fill="#047857"/>
  <text x="468" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="494" y="73" font-size="20" font-weight="bold" fill="#065f46">개발 단계</text>
  <text x="458" y="120" font-size="16" fill="#374151">IDE에서 스토리 단위로</text>

  <!-- 구현·검증 반복 -->
  <rect x="520" y="140" width="100" height="36" rx="18" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="570" y="164" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">구현</text>
  <rect x="700" y="140" width="100" height="36" rx="18" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="750" y="164" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">검증</text>
  <path d="M620,158 L698,158" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M750,176 V204 H570 V178" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="660" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">반복</text>
</svg>
