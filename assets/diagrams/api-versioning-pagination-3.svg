<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Offset 페이지네이션의 누락</title>
  <desc id="d">초기 상태 [글6, 글5, 글4, 글3, 글2, 글1]에서 1페이지로 [글6, 글5, 글4]를 받은 뒤 글5가 삭제되면 전체가 한 칸 당겨진다. 그래서 2페이지(OFFSET 3 LIMIT 3)는 [글2, 글1]이 되어 글3을 못 보게 된다(누락).</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 단계 라벨 (왼쪽 열) -->
  <text x="24" y="86" font-size="16" font-weight="bold" fill="#1d4ed8">① 1페이지 조회</text>
  <text x="24" y="106" font-size="14" fill="#4b5563">초기 상태</text>
  <text x="24" y="152" font-size="15" font-weight="bold" fill="#b91c1c">② 이 순간 글5가 삭제</text>
  <text x="24" y="174" font-size="15" fill="#374151">전체가 한 칸 당겨졌다</text>
  <text x="24" y="216" font-size="16" font-weight="bold" fill="#1d4ed8">③ 2페이지 조회</text>
  <text x="24" y="236" font-size="14" fill="#4b5563">현재 상태</text>

  <!-- 1페이지 조회 범위 -->
  <text x="300" y="44" font-size="16" fill="#1d4ed8"><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OFFSET 0 LIMIT 3</tspan>  →  [글6, 글5, 글4]</text>
  <rect x="300" y="58" width="236" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>

  <!-- 초기 상태 -->
  <rect x="308" y="66" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="342" y="96" font-size="16" fill="#111827" text-anchor="middle">글6</text>
  <rect x="384" y="66" width="68" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="418" y="96" font-size="16" fill="#4b5563" text-anchor="middle">글5</text>
  <rect x="460" y="66" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="494" y="96" font-size="16" fill="#111827" text-anchor="middle">글4</text>
  <rect x="536" y="66" width="68" height="48" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="570" y="96" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">글3</text>
  <rect x="612" y="66" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="646" y="96" font-size="16" fill="#111827" text-anchor="middle">글2</text>
  <rect x="688" y="66" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="722" y="96" font-size="16" fill="#111827" text-anchor="middle">글1</text>

  <!-- 한 칸씩 당겨짐 -->
  <line x1="342" y1="128" x2="342" y2="182" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="418" y="148" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">✕ 삭제</text>
  <line x1="494" y1="128" x2="418" y2="182" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="570" y1="128" x2="494" y2="182" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ahr)"/>
  <line x1="646" y1="128" x2="570" y2="182" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="722" y1="128" x2="646" y2="182" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- 2페이지 조회 범위 -->
  <rect x="528" y="188" width="236" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>

  <!-- 현재 상태 -->
  <rect x="308" y="196" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="342" y="226" font-size="16" fill="#111827" text-anchor="middle">글6</text>
  <rect x="384" y="196" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="418" y="226" font-size="16" fill="#111827" text-anchor="middle">글4</text>
  <rect x="460" y="196" width="68" height="48" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="494" y="226" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">글3</text>
  <rect x="536" y="196" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="570" y="226" font-size="16" fill="#111827" text-anchor="middle">글2</text>
  <rect x="612" y="196" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="646" y="226" font-size="16" fill="#111827" text-anchor="middle">글1</text>
  <rect x="688" y="196" width="68" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 3"/>

  <text x="528" y="278" font-size="16" fill="#1d4ed8"><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OFFSET 3 LIMIT 3</tspan>  →  [글2, 글1]</text>
  <text x="528" y="306" font-size="16" font-weight="bold" fill="#b91c1c">글3을 못 봤다 (누락)</text>
</svg>
