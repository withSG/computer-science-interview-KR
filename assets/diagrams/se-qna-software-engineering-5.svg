<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MSA 구성 요소</title>
  <desc id="d">클라이언트 요청은 단일 진입점인 API Gateway를 거쳐 사용자·주문·결제·알림 서비스로 라우팅된다. 사용자·주문·결제 서비스는 각자 User DB·Order DB·Payment DB를 두고, 알림 서비스는 Message Queue(Kafka/RabbitMQ)와 연결된다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#ffffff"/>

  <!-- 클라이언트 -->
  <rect x="24" y="175" width="112" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="80" y="209" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">클라이언트</text>
  <line x1="136" y1="203" x2="176" y2="203" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- API Gateway -->
  <rect x="180" y="24" width="160" height="358" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="260" y="186" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">API Gateway</text>
  <text x="260" y="214" font-size="15" fill="#1e3a8a" text-anchor="middle">단일 진입점</text>
  <text x="260" y="236" font-size="15" fill="#1e3a8a" text-anchor="middle">인증/라우팅</text>

  <!-- 게이트웨이 → 서비스 -->
  <line x1="340" y1="62" x2="388" y2="62" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="156" x2="388" y2="156" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="250" x2="388" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="344" x2="388" y2="344" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 서비스 -->
  <rect x="392" y="24" width="240" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="512" y="57" font-size="17" font-weight="700" fill="#064e3b" text-anchor="middle">사용자 서비스</text>
  <text x="512" y="80" font-size="15" fill="#374151" text-anchor="middle">(User Service)</text>

  <rect x="392" y="118" width="240" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="512" y="151" font-size="17" font-weight="700" fill="#064e3b" text-anchor="middle">주문 서비스</text>
  <text x="512" y="174" font-size="15" fill="#374151" text-anchor="middle">(Order Service)</text>

  <rect x="392" y="212" width="240" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="512" y="245" font-size="17" font-weight="700" fill="#064e3b" text-anchor="middle">결제 서비스</text>
  <text x="512" y="268" font-size="15" fill="#374151" text-anchor="middle">(Payment Service)</text>

  <rect x="392" y="306" width="240" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="512" y="339" font-size="17" font-weight="700" fill="#064e3b" text-anchor="middle">알림 서비스</text>
  <text x="512" y="362" font-size="15" fill="#374151" text-anchor="middle">(Notification Service)</text>

  <!-- 서비스 ↔ 저장소 연결 -->
  <line x1="632" y1="62" x2="680" y2="62" stroke="#64748b" stroke-width="2"/>
  <line x1="632" y1="156" x2="680" y2="156" stroke="#64748b" stroke-width="2"/>
  <line x1="632" y1="250" x2="680" y2="250" stroke="#64748b" stroke-width="2"/>
  <line x1="632" y1="344" x2="680" y2="344" stroke="#64748b" stroke-width="2"/>

  <!-- User DB -->
  <path d="M680,40 A88,8 0 0 1 856,40 V86 A88,8 0 0 1 680,86 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="768" cy="40" rx="88" ry="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="768" y="74" font-size="16" font-weight="700" fill="#78350f" text-anchor="middle">User DB</text>

  <!-- Order DB -->
  <path d="M680,134 A88,8 0 0 1 856,134 V180 A88,8 0 0 1 680,180 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="768" cy="134" rx="88" ry="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="768" y="168" font-size="16" font-weight="700" fill="#78350f" text-anchor="middle">Order DB</text>

  <!-- Payment DB -->
  <path d="M680,228 A88,8 0 0 1 856,228 V274 A88,8 0 0 1 680,274 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="768" cy="228" rx="88" ry="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="768" y="262" font-size="16" font-weight="700" fill="#78350f" text-anchor="middle">Payment DB</text>

  <!-- Message Queue -->
  <rect x="680" y="310" width="176" height="68" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="768" y="339" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">Message Queue</text>
  <text x="768" y="362" font-size="15" fill="#4c1d95" text-anchor="middle">(Kafka/RabbitMQ)</text>
</svg>
