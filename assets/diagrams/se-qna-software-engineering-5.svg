<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MSA 구성 요소</title>
  <desc id="d">클라이언트가 API Gateway를 거쳐 사용자, 주문, 결제, 알림 서비스 및 Message Queue와 DB로 연결되는 MSA 아키텍처 다이어그램</desc>
  <rect width="880" height="720" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">MSA 구성 요소</text>

  <!-- Client -->
  <rect x="340" y="70" width="200" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="97" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트</text>

  <!-- Arrow: Client -> API Gateway -->
  <path d="M440,114 L440,154" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- API Gateway -->
  <rect x="240" y="156" width="400" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="186" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">API Gateway (단일 진입점, 인증/라우팅)</text>

  <!-- Main Trunk Line down from API Gateway -->
  <path d="M440,206 L440,580" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <!-- Branch 1: 사용자 서비스 -->
  <path d="M440,260 L490,260" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="492" y="238" width="310" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="647" y="265" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자 서비스 (User Service)</text>

  <!-- Sub-branch 1: User DB -->
  <path d="M647,282 L647,310" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M647,310 L677,310" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <rect x="680" y="292" width="120" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="740" y="315" font-size="13" fill="#d97706" text-anchor="middle">User DB</text>

  <!-- Branch 2: 주문 서비스 -->
  <path d="M440,360 L490,360" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="492" y="338" width="310" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="647" y="365" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">주문 서비스 (Order Service)</text>

  <!-- Sub-branch 2: Order DB -->
  <path d="M647,382 L647,410" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M647,410 L677,410" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <rect x="680" y="392" width="120" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="740" y="415" font-size="13" fill="#d97706" text-anchor="middle">Order DB</text>

  <!-- Branch 3: 결제 서비스 -->
  <path d="M440,460 L490,460" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="492" y="438" width="310" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="647" y="465" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">결제 서비스 (Payment Service)</text>

  <!-- Sub-branch 3: Payment DB -->
  <path d="M647,482 L647,510" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M647,510 L677,510" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <rect x="680" y="492" width="120" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="740" y="515" font-size="13" fill="#d97706" text-anchor="middle">Payment DB</text>

  <!-- Branch 4: 알림 서비스 -->
  <path d="M440,580 L490,580" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="492" y="558" width="310" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="647" y="585" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">알림 서비스 (Notification Service)</text>

  <!-- Sub-branch 4: Message Queue -->
  <path d="M647,602 L647,640" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <rect x="502" y="640" width="290" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="647" y="665" font-size="13" fill="#7c3aed" text-anchor="middle">Message Queue (Kafka/RabbitMQ)</text>
</svg>