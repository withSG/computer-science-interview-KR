<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">고정 소수점 비트 구조</title>
  <desc id="d">16비트 고정 소수점은 부호 1비트, 정수부 7비트, 소수부 8비트로 나뉘고 소수점은 정수부와 소수부 사이에 고정된다. 장점(연산 간단, 속도 빠름, 값 간격 일정), 단점(표현 범위 좁음, 매우 크거나 작은 수 표현 불가), 사용 분야(임베디드 시스템, 실시간 제어 시스템, DSP)를 함께 정리했다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 캡션 -->
  <text x="61" y="42" font-size="16" fill="#374151"><tspan font-weight="bold" fill="#111827">예: 16비트 기준</tspan> → 부호(1) + 정수(7) + 소수(8)</text>

  <!-- 소수점 표시 -->
  <text x="443" y="78" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">소수점 위치 고정</text>
  <line x1="443" y1="86" x2="443" y2="127" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="443" cy="134" r="5" fill="#b91c1c"/>

  <!-- 부호 비트 (1) -->
  <rect x="61" y="96" width="42" height="44" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>

  <!-- 정수부 (7) -->
  <rect x="113" y="96" width="42" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="159" y="96" width="42" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="205" y="96" width="42" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="251" y="96" width="42" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="297" y="96" width="42" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="343" y="96" width="42" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="389" y="96" width="42" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- 소수부 (8) -->
  <rect x="455" y="96" width="42" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="501" y="96" width="42" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="547" y="96" width="42" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="593" y="96" width="42" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="639" y="96" width="42" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="685" y="96" width="42" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="731" y="96" width="42" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="777" y="96" width="42" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>

  <!-- 묶음 괄호 + 필드 이름 -->
  <path d="M61,150 V158 H103 V150" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M113,150 V158 H431 V150" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M455,150 V158 H819 V150" fill="none" stroke="#b45309" stroke-width="1.5"/>

  <text x="82" y="184" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">부호 비트</text>
  <text x="82" y="205" font-size="15" fill="#4b5563" text-anchor="middle">1비트</text>
  <text x="272" y="184" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">정수부</text>
  <text x="272" y="205" font-size="15" fill="#4b5563" text-anchor="middle">7비트</text>
  <text x="637" y="184" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">소수부</text>
  <text x="637" y="205" font-size="15" fill="#4b5563" text-anchor="middle">8비트</text>

  <!-- 장점 -->
  <rect x="40" y="232" width="392" height="136" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="64" y="264" font-size="18" font-weight="bold" fill="#047857">장점</text>
  <circle cx="70" cy="291" r="3" fill="#047857"/>
  <text x="82" y="296" font-size="16" fill="#111827">연산 간단</text>
  <circle cx="70" cy="317" r="3" fill="#047857"/>
  <text x="82" y="322" font-size="16" fill="#111827">속도 빠름</text>
  <circle cx="70" cy="343" r="3" fill="#047857"/>
  <text x="82" y="348" font-size="16" fill="#111827">값 간격(정밀도) 일정</text>

  <!-- 단점 -->
  <rect x="448" y="232" width="392" height="136" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="472" y="264" font-size="18" font-weight="bold" fill="#b91c1c">단점</text>
  <circle cx="478" cy="291" r="3" fill="#b91c1c"/>
  <text x="490" y="296" font-size="16" fill="#111827">표현 범위 좁음</text>
  <circle cx="478" cy="317" r="3" fill="#b91c1c"/>
  <text x="490" y="322" font-size="16" fill="#111827">매우 크거나 작은 수 표현 불가</text>

  <!-- 사용 -->
  <text x="40" y="415" font-size="17" font-weight="bold" fill="#111827">사용</text>
  <rect x="96" y="392" width="129" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="160.5" y="415" font-size="16" fill="#111827" text-anchor="middle">임베디드 시스템</text>
  <rect x="237" y="392" width="166" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="320" y="415" font-size="16" fill="#111827" text-anchor="middle">실시간 제어 시스템</text>
  <rect x="415" y="392" width="64" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="447" y="415" font-size="16" fill="#111827" text-anchor="middle">DSP</text>
</svg>
