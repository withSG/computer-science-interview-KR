<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">고정 소수점 (Fixed Point)</title>
  <desc id="d">고정 소수점의 비트 구조, 예시, 장단점 및 사용 분야를 나타낸 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 제목 -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">고정 소수점 (Fixed Point)</text>

  <!-- 구조 섹션 배경 및 제목 -->
  <rect x="40" y="70" width="800" height="110" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="60" y="98" font-size="14" font-weight="bold" fill="#1f2933">구조 &amp; 예시</text>

  <!-- 비트 구조 박스들 -->
  <!-- 전체 박스 너비: 760 (x: 60 ~ 820) -->

  <!-- 부호 비트 (1비트 비율: 95px) -->
  <rect x="60" y="115" width="95" height="45" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="107.5" y="133.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">부호 비트</text>
  <text x="107.5" y="150.5" font-size="11.5" fill="#52606d" text-anchor="middle">부호(1)</text>

  <!-- 정수부 (7비트 비율: 332.5px) -->
  <rect x="160" y="115" width="332.5" height="45" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="326.25" y="133.5" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">정수부</text>
  <text x="326.25" y="150.5" font-size="11.5" fill="#52606d" text-anchor="middle">정수(7)</text>

  <!-- 소수부 (8비트 비율: 380px -> 남은 공간 맞춰 322.5px) -->
  <rect x="497.5" y="115" width="322.5" height="45" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="658.75" y="133.5" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">소수부</text>
  <text x="658.75" y="150.5" font-size="11.5" fill="#52606d" text-anchor="middle">소수(8)</text>

  <!-- 부가 설명 Text (16비트 기준) -->
  <text x="60" y="198" font-size="11.5" fill="#52606d">예: 16비트 기준 → 부호(1) + 정수(7) + 소수(8)</text>

  <!-- 장점 & 단점 섹션 -->
  <!-- 장점 박스 -->
  <rect x="40" y="220" width="390" height="130" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="60" y="248" font-size="14" font-weight="bold" fill="#059669">장점</text>
  <circle cx="68" cy="272" r="3" fill="#059669"/>
  <text x="80" y="276" font-size="13" fill="#1f2933">연산 간단</text>
  <circle cx="68" cy="296" r="3" fill="#059669"/>
  <text x="80" y="300" font-size="13" fill="#1f2933">속도 빠름</text>
  <circle cx="68" cy="320" r="3" fill="#059669"/>
  <text x="80" y="324" font-size="13" fill="#1f2933">오차 없음</text>

  <!-- 단점 박스 -->
  <rect x="450" y="220" width="390" height="130" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="470" y="248" font-size="14" font-weight="bold" fill="#dc2626">단점</text>
  <circle cx="478" cy="272" r="3" fill="#dc2626"/>
  <text x="490" y="276" font-size="13" fill="#1f2933">표현 범위 좁음</text>
  <circle cx="478" cy="296" r="3" fill="#dc2626"/>
  <text x="490" y="300" font-size="13" fill="#1f2933">매우 크거나 작은 수 표현 불가</text>

  <!-- 사용 분야 섹션 -->
  <rect x="40" y="370" width="800" height="90" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="60" y="398" font-size="14" font-weight="bold" fill="#7c3aed">사용</text>
  
  <rect x="60" y="412" width="150" height="32" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="135" y="432" font-size="13" fill="#1f2933" text-anchor="middle">임베디드 시스템</text>

  <rect x="220" y="412" width="170" height="32" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="305" y="432" font-size="13" fill="#1f2933" text-anchor="middle">실시간 제어 시스템</text>

  <rect x="400" y="412" width="80" height="32" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="440" y="432" font-size="13" fill="#1f2933" text-anchor="middle">DSP</text>
</svg>