<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Tail 샘플링</title>
  <desc id="d">모든 서비스에서 Collector로 스팬을 모아 버퍼링한 뒤, 에러, 지연, 정상 조건에 따라 저장 비율을 결정하는 Tail 샘플링 프로세스 다이어그램</desc>
  
  <defs>
    <!-- Dark Ink Arrowhead -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- Red Arrowhead -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <!-- Amber Arrowhead -->
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <!-- Green Arrowhead -->
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background for Dark Mode Support -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Top Flow Section -->
  <!-- Box 1: 모든 서비스 -->
  <rect x="100" y="30" width="140" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="170" y="54.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">모든 서비스</text>

  <!-- Arrow 1: 모든 서비스 ──▶ Collector -->
  <path d="M 240,50 L 360,50" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Box 2: Collector (트레이스별로 스팬을 모아 버퍼링) -->
  <rect x="360" y="30" width="420" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="570" y="54.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Collector <tspan fill="#52606d" font-weight="normal">(트레이스별로 스팬을 모아 버퍼링)</tspan></text>

  <!-- Arrow 2: Vertical arrow with label "트레이스가 완성되면 정책 평가" -->
  <path d="M 570,70 L 570,130" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  
  <!-- Arrow Label Background & Text -->
  <rect x="475" y="90" width="190" height="20" fill="#ffffff"/>
  <text x="570" y="104.025" fill="#52606d" font-size="11.5" text-anchor="middle">트레이스가 완성되면 정책 평가</text>

  <!-- Container Box for Sampling Rules -->
  <rect x="220" y="130" width="440" height="180" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Rule 1: 에러 포함? → 100% 저장 -->
  <g transform="translate(250, 150)">
    <!-- Label Box -->
    <rect x="0" y="0" width="140" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="70" y="22.55" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">에러 포함?</text>
    
    <!-- Arrow -->
    <path d="M 140,18 L 220,18" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    
    <!-- Result Box -->
    <rect x="220" y="0" width="140" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="290" y="22.55" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">100% 저장</text>
  </g>

  <!-- Rule 2: 지연 > 1s? → 100% 저장 -->
  <g transform="translate(250, 202)">
    <!-- Label Box -->
    <rect x="0" y="0" width="140" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="70" y="22.55" fill="#d97706" font-size="13" font-weight="bold" text-anchor="middle">지연 &gt; 1s?</text>
    
    <!-- Arrow -->
    <path d="M 140,18 L 220,18" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
    
    <!-- Result Box -->
    <rect x="220" y="0" width="140" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="290" y="22.55" fill="#d97706" font-size="13" font-weight="bold" text-anchor="middle">100% 저장</text>
  </g>

  <!-- Rule 3: 그 외 정상 → 1% 저장 -->
  <g transform="translate(250, 254)">
    <!-- Label Box -->
    <rect x="0" y="0" width="140" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="70" y="22.55" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">그 외 정상</text>
    
    <!-- Arrow -->
    <path d="M 140,18 L 220,18" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    
    <!-- Result Box -->
    <rect x="220" y="0" width="140" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="290" y="22.55" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">1% 저장</text>
  </g>
</svg>