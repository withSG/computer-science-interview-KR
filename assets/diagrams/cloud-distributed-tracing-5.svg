<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Tail 샘플링</title>
  <desc id="d">모든 서비스가 스팬을 Collector로 보내면 Collector가 트레이스별로 모아 버퍼링하고, 트레이스가 완성되면 정책을 평가해 에러 포함·지연 1초 초과는 100%, 그 외 정상은 1%만 저장한다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1단: 서비스 → Collector -->
  <rect x="24" y="28" width="220" height="80" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="134" y="74" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">모든 서비스</text>

  <path d="M244,68 H296" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="304" y="28" width="552" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="328" y="62" font-size="20" font-weight="bold" fill="#1d4ed8">Collector</text>
  <text x="328" y="90" font-size="16" fill="#1f2937">트레이스별로 스팬을 모아 버퍼링</text>

  <!-- 정책 평가로 -->
  <path d="M580,108 H580 V168" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="596" y="144" font-size="15" font-weight="bold" fill="#374151">트레이스가 완성되면 정책 평가</text>

  <!-- 정책 표 -->
  <rect x="24" y="176" width="832" height="202" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M25,216 H855" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="25" y="177" width="830" height="38" rx="7" fill="#f3f4f6"/>
  <text x="48" y="202" font-size="15" font-weight="bold" fill="#374151">조건</text>
  <text x="384" y="202" font-size="15" font-weight="bold" fill="#374151">저장 비율</text>
  <path d="M360,177 V377" stroke="#d1d5db" stroke-width="1"/>
  <path d="M25,270 H855" stroke="#d1d5db" stroke-width="1"/>
  <path d="M25,324 H855" stroke="#d1d5db" stroke-width="1"/>

  <!-- 행 1 -->
  <text x="48" y="249" font-size="17" font-weight="bold" fill="#1f2937">에러 포함?</text>
  <rect x="384" y="236" width="320" height="14" rx="3" fill="#e5e7eb"/>
  <rect x="384" y="236" width="320" height="14" rx="3" fill="#1d4ed8"/>
  <text x="724" y="249" font-size="17" font-weight="bold" fill="#1d4ed8">100% 저장</text>

  <!-- 행 2 -->
  <text x="48" y="303" font-size="17" font-weight="bold" fill="#1f2937">지연 &gt; 1s?</text>
  <rect x="384" y="290" width="320" height="14" rx="3" fill="#e5e7eb"/>
  <rect x="384" y="290" width="320" height="14" rx="3" fill="#1d4ed8"/>
  <text x="724" y="303" font-size="17" font-weight="bold" fill="#1d4ed8">100% 저장</text>

  <!-- 행 3 -->
  <text x="48" y="357" font-size="17" font-weight="bold" fill="#1f2937">그 외 정상</text>
  <rect x="384" y="344" width="320" height="14" rx="3" fill="#e5e7eb"/>
  <rect x="384" y="344" width="4" height="14" rx="1" fill="#4b5563"/>
  <text x="724" y="357" font-size="17" font-weight="bold" fill="#4b5563">1% 저장</text>
</svg>
