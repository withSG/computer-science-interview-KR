<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1220" width="880" height="1220" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비난 없는 포스트모템 템플릿 예시</title>
  <desc id="d">SEV-2 주문 API 실패율 상승 사고를 예로 든 포스트모템 템플릿. 한 줄 요약, 영향, 사실만 적은 타임라인, 여러 층의 기여 요인, 잘 된 점, 담당·기한·유형이 붙은 액션 아이템으로 구성된다.</desc>
  <rect width="880" height="1220" fill="#ffffff"/>

  <!-- 제목 -->
  <rect x="24" y="24" width="832" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="44" y="40" width="84" height="32" rx="6" fill="#b91c1c"/>
  <text x="86" y="62" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SEV-2</text>
  <text x="144" y="63" font-size="20" font-weight="bold" fill="#111827">주문 API 실패율 상승<tspan font-size="16" font-weight="normal" fill="#4b5563"> (2026-03-14)</tspan></text>

  <!-- 한 줄 요약 -->
  <rect x="24" y="108" width="5" height="20" fill="#1d4ed8"/>
  <text x="40" y="124" font-size="17" font-weight="bold" fill="#111827">한 줄 요약</text>
  <rect x="24" y="138" width="832" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="44" y="170" font-size="16" fill="#1f2937">결제 확인 로직이 트랜잭션 안에서 외부 API를 호출해 커넥션 풀이 고갈됐고,</text>
  <text x="44" y="198" font-size="16" fill="#1f2937"><tspan font-weight="bold">51분간</tspan> 주문 생성 요청의 <tspan font-weight="bold">32%</tspan>가 실패했다.</text>

  <!-- 영향 -->
  <rect x="24" y="240" width="5" height="20" fill="#1d4ed8"/>
  <text x="40" y="256" font-size="17" font-weight="bold" fill="#111827">영향</text>
  <text x="44" y="290" font-size="15" font-weight="bold" fill="#374151">기간</text>
  <text x="164" y="290" font-size="15" fill="#1f2937">14:30 배포 ~ 15:24 지표 복귀. 사용자 영향은 14:33~15:24 (51분)</text>
  <text x="44" y="320" font-size="15" font-weight="bold" fill="#374151">범위</text>
  <text x="164" y="320" font-size="15" fill="#1f2937">주문 생성 요청의 32% 실패 (결제 이전 단계 → 이중 결제 없음)</text>
  <text x="44" y="352" font-size="15" font-weight="bold" fill="#374151">배포 시각 기준</text>
  <rect x="164" y="332" width="124" height="30" rx="15" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="226" y="352" font-size="15" fill="#111827" text-anchor="middle">탐지까지 8분</text>
  <rect x="300" y="332" width="160" height="30" rx="15" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="380" y="352" font-size="15" fill="#111827" text-anchor="middle">대응 착수까지 22분</text>
  <rect x="472" y="332" width="128" height="30" rx="15" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="536" y="352" font-size="15" fill="#111827" text-anchor="middle">복구까지 54분</text>

  <!-- 타임라인 -->
  <rect x="24" y="382" width="5" height="20" fill="#1d4ed8"/>
  <text x="40" y="398" font-size="17" font-weight="bold" fill="#111827">타임라인<tspan font-size="15" font-weight="normal" fill="#4b5563"> (해석 없이 사실만)</tspan></text>
  <line x1="128" y1="434" x2="128" y2="638" stroke="#9ca3af" stroke-width="2"/>

  <text x="108" y="439" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">14:30</text>
  <circle cx="128" cy="434" r="6" fill="#374151"/>
  <text x="148" y="439" font-size="15" fill="#1f2937">v2.14.0 배포 완료</text>

  <text x="108" y="473" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">14:33</text>
  <circle cx="128" cy="468" r="6" fill="#b91c1c"/>
  <text x="148" y="473" font-size="15" fill="#1f2937">5xx 비율 0.1% → 4.2%</text>

  <text x="108" y="507" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">14:38</text>
  <circle cx="128" cy="502" r="6" fill="#374151"/>
  <text x="148" y="507" font-size="15" fill="#1f2937">알림 발화</text>

  <text x="108" y="541" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">14:52</text>
  <circle cx="128" cy="536" r="6" fill="#374151"/>
  <text x="148" y="541" font-size="15" fill="#1f2937">1차 온콜 무응답, 2차 에스컬레이션</text>

  <text x="108" y="575" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">15:04</text>
  <circle cx="128" cy="570" r="6" fill="#374151"/>
  <text x="148" y="575" font-size="15" fill="#1f2937">커넥션 풀 대기 시간 급증 확인</text>

  <text x="108" y="609" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">15:20</text>
  <circle cx="128" cy="604" r="6" fill="#374151"/>
  <text x="148" y="609" font-size="15" fill="#1f2937">롤백 시작</text>

  <text x="108" y="643" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">15:24</text>
  <circle cx="128" cy="638" r="6" fill="#047857"/>
  <text x="148" y="643" font-size="15" fill="#1f2937">지표 정상 복귀 (실패 주문 재처리는 15:45 완료)</text>

  <path d="M600,468 H614 V638 H600" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <text x="630" y="548" font-size="15" font-weight="bold" fill="#b91c1c">사용자 영향</text>
  <text x="630" y="570" font-size="15" fill="#b91c1c">14:33~15:24 (51분)</text>

  <!-- 기여 요인 -->
  <rect x="24" y="676" width="5" height="20" fill="#1d4ed8"/>
  <text x="40" y="692" font-size="17" font-weight="bold" fill="#111827">기여 요인<tspan font-size="15" font-weight="normal" fill="#4b5563"> (근본 원인 하나가 아니라 여러 층)</tspan></text>
  <text x="44" y="724" font-size="15" font-weight="bold" fill="#374151">1.</text>
  <text x="68" y="724" font-size="15" fill="#1f2937">트랜잭션 안 외부 호출을 막는 리뷰 기준·정적 검사가 없었다</text>
  <text x="44" y="754" font-size="15" font-weight="bold" fill="#374151">2.</text>
  <text x="68" y="754" font-size="15" fill="#1f2937">스테이징의 외부 API는 목(mock)이라 응답이 5ms여서 재현되지 않았다</text>
  <text x="44" y="784" font-size="15" font-weight="bold" fill="#374151">3.</text>
  <text x="68" y="784" font-size="15" fill="#1f2937">커넥션 풀 대기 시간 지표가 대시보드에 없었다</text>
  <text x="44" y="814" font-size="15" font-weight="bold" fill="#374151">4.</text>
  <text x="68" y="814" font-size="15" fill="#1f2937">1차 온콜 알림이 전달되지 않아 14분이 소요됐다</text>

  <!-- 잘 된 점 -->
  <rect x="24" y="840" width="5" height="20" fill="#1d4ed8"/>
  <text x="40" y="856" font-size="17" font-weight="bold" fill="#111827">잘 된 점</text>
  <text x="44" y="888" font-size="15" fill="#374151">•</text>
  <text x="68" y="888" font-size="15" fill="#1f2937">알림이 증상 발생 5분 만에 발화했다</text>
  <text x="44" y="918" font-size="15" fill="#374151">•</text>
  <text x="68" y="918" font-size="15" fill="#1f2937">롤백 절차가 문서화돼 있어 실행 시작 4분 만에 지표가 정상으로 돌아왔다</text>

  <!-- 액션 아이템 -->
  <rect x="24" y="944" width="5" height="20" fill="#1d4ed8"/>
  <text x="40" y="960" font-size="17" font-weight="bold" fill="#111827">액션 아이템</text>

  <rect x="24" y="976" width="832" height="214" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M25,1014 V982 Q25,977 30,977 H850 Q855,977 855,982 V1014 Z" fill="#f3f4f6"/>
  <line x1="24" y1="1014" x2="856" y2="1014" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="24" y1="1058" x2="856" y2="1058" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="1102" x2="856" y2="1102" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="1146" x2="856" y2="1146" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="520" y1="976" x2="520" y2="1190" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="640" y1="976" x2="640" y2="1190" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="750" y1="976" x2="750" y2="1190" stroke="#e5e7eb" stroke-width="1"/>

  <text x="44" y="1001" font-size="15" font-weight="bold" fill="#111827">항목</text>
  <text x="580" y="1001" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">담당</text>
  <text x="695" y="1001" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">기한</text>
  <text x="803" y="1001" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">유형</text>

  <text x="44" y="1042" font-size="15" fill="#1f2937">트랜잭션 내 외부 호출 정적 검사 규칙</text>
  <text x="580" y="1042" font-size="15" fill="#1f2937" text-anchor="middle">김OO</text>
  <text x="695" y="1042" font-size="15" fill="#1f2937" text-anchor="middle">3/28</text>
  <rect x="771" y="1022" width="64" height="28" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="803" y="1041" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">예방</text>

  <text x="44" y="1086" font-size="15" fill="#1f2937">스테이징 외부 API에 지연 주입</text>
  <text x="580" y="1086" font-size="15" fill="#1f2937" text-anchor="middle">이OO</text>
  <text x="695" y="1086" font-size="15" fill="#1f2937" text-anchor="middle">4/04</text>
  <rect x="771" y="1066" width="64" height="28" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="803" y="1085" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">예방</text>

  <text x="44" y="1130" font-size="15" fill="#1f2937">커넥션 풀 대기 시간 대시보드·알림</text>
  <text x="580" y="1130" font-size="15" fill="#1f2937" text-anchor="middle">박OO</text>
  <text x="695" y="1130" font-size="15" fill="#1f2937" text-anchor="middle">3/21</text>
  <rect x="771" y="1110" width="64" height="28" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="803" y="1129" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">탐지</text>

  <text x="44" y="1174" font-size="15" fill="#1f2937">온콜 알림 전달 테스트 교대 시 필수화</text>
  <text x="580" y="1174" font-size="15" fill="#1f2937" text-anchor="middle">최OO</text>
  <text x="695" y="1174" font-size="15" fill="#1f2937" text-anchor="middle">3/21</text>
  <rect x="771" y="1154" width="64" height="28" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1"/>
  <text x="803" y="1173" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">대응</text>
</svg>
