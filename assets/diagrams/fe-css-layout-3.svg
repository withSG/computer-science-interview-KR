<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">다섯 값의 기준점</title>
  <desc id="d">CSS position 속성의 다섯 가지 값(static, relative, absolute, fixed, sticky)과 각 기준점 및 특징을 설명하는 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 제목 / 문서 헤딩 -->
  <text x="24" y="38" font-size="16" font-weight="bold" fill="#1f2933">다섯 값의 기준점</text>

  <!-- 항목 1: static -->
  <g transform="translate(24, 55)">
    <rect x="0" y="0" width="100" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="50" y="28" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">static</text>
    <rect x="112" y="0" width="720" height="48" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="128" y="28" font-size="13" fill="#1f2933">일반 흐름 그대로. top/left를 적어도 무시된다 (기본값)</text>
  </g>

  <!-- 항목 2: relative -->
  <g transform="translate(24, 115)">
    <rect x="0" y="0" width="100" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="50" y="28" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">relative</text>
    <rect x="112" y="0" width="720" height="48" rx="6" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="128" y="28" font-size="13" fill="#1f2933">흐름은 유지하면서 "보이는 위치"만 이동. 원래 자리는 비워둔다</text>
  </g>

  <!-- 항목 3: absolute -->
  <g transform="translate(24, 175)">
    <rect x="0" y="0" width="100" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="50" y="28" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">absolute</text>
    <rect x="112" y="0" width="720" height="48" rx="6" fill="#fffbeb" stroke="#cbd2d9" stroke-width="1"/>
    <text x="128" y="28" font-size="13" fill="#1f2933">흐름에서 제거. 가장 가까운 positioned 조상이 기준</text>
  </g>

  <!-- 항목 4: fixed -->
  <g transform="translate(24, 235)">
    <rect x="0" y="0" width="100" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="50" y="28" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">fixed</text>
    <rect x="112" y="0" width="720" height="48" rx="6" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="128" y="28" font-size="13" fill="#1f2933">흐름에서 제거. 뷰포트가 기준 → 스크롤해도 고정</text>
  </g>

  <!-- 항목 5: sticky -->
  <g transform="translate(24, 295)">
    <rect x="0" y="0" width="100" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="50" y="28" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">sticky</text>
    <rect x="112" y="0" width="720" height="48" rx="6" fill="#ecfdf5" stroke="#cbd2d9" stroke-width="1"/>
    <text x="128" y="28" font-size="13" fill="#1f2933">흐름 유지. 임계점 전에는 relative, 도달하면 fixed처럼 굳는다</text>
  </g>
</svg>