<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">position 다섯 값</title>
  <desc id="d">position의 다섯 값별 흐름 유지 여부와 기준점을 정리한 표. static·relative·sticky는 흐름을 유지하고, absolute는 가장 가까운 positioned 조상, fixed는 뷰포트를 기준으로 흐름에서 제거된다.</desc>
  <rect width="880" height="392" fill="#ffffff"/>

  <!-- 표 틀과 머리행 -->
  <rect x="24" y="24" width="832" height="344" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <path d="M24,68 V30 A6,6 0 0 1 30,24 H850 A6,6 0 0 1 856,30 V68 Z" fill="#f3f4f6"/>
  <line x1="24" y1="68" x2="856" y2="68" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="52" font-size="16" font-weight="700" fill="#111827">position 값</text>
  <text x="264" y="52" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">흐름</text>
  <text x="340" y="52" font-size="16" font-weight="700" fill="#111827">동작과 기준점</text>

  <!-- 열 구분선 -->
  <line x1="204" y1="24" x2="204" y2="368" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="324" y1="24" x2="324" y2="368" stroke="#e5e7eb" stroke-width="1"/>
  <!-- 행 구분선 -->
  <line x1="24" y1="128" x2="856" y2="128" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="188" x2="856" y2="188" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="248" x2="856" y2="248" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="308" x2="856" y2="308" stroke="#e5e7eb" stroke-width="1"/>

  <!-- static -->
  <text x="40" y="105" font-size="18" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">static</text>
  <text x="118" y="105" font-size="15" fill="#4b5563">(기본값)</text>
  <rect x="228" y="83" width="72" height="30" rx="15" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
  <text x="264" y="104" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">유지</text>
  <text x="340" y="104" font-size="16" fill="#111827">일반 흐름 그대로. top/left를 적어도 무시된다</text>

  <!-- relative -->
  <text x="40" y="165" font-size="18" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">relative</text>
  <rect x="228" y="143" width="72" height="30" rx="15" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
  <text x="264" y="164" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">유지</text>
  <text x="340" y="164" font-size="16" fill="#111827">"보이는 위치"만 이동. 원래 자리는 비워둔다</text>

  <!-- absolute -->
  <text x="40" y="225" font-size="18" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">absolute</text>
  <rect x="228" y="203" width="72" height="30" rx="15" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <text x="264" y="224" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">제거</text>
  <text x="340" y="224" font-size="16" fill="#111827"><tspan font-weight="700" fill="#1d4ed8">가장 가까운 positioned 조상</tspan>이 기준</text>

  <!-- fixed -->
  <text x="40" y="285" font-size="18" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fixed</text>
  <rect x="228" y="263" width="72" height="30" rx="15" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <text x="264" y="284" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">제거</text>
  <text x="340" y="284" font-size="16" fill="#111827"><tspan font-weight="700" fill="#1d4ed8">뷰포트</tspan>가 기준 → 스크롤해도 고정</text>

  <!-- sticky -->
  <text x="40" y="345" font-size="18" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">sticky</text>
  <rect x="228" y="323" width="72" height="30" rx="15" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
  <text x="264" y="344" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">유지</text>
  <text x="340" y="344" font-size="16" fill="#111827">임계점 전에는 relative, 도달하면 fixed처럼 굳는다</text>
</svg>
