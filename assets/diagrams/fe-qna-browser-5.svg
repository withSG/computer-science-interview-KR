<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Virtual DOM 동작 원리</title>
  <desc id="d">상태 변경 발생부터 새로운 Virtual DOM 생성, Diffing, Reconciliation, 배치 업데이트까지의 Virtual DOM 동작 원리를 보여주는 순서도</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="230" y="30" width="420" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">1. 상태 변경 발생</text>

  <path d="M440,80 L440,120" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="230" y="120" width="420" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">2. 새로운 Virtual DOM 생성</text>

  <path d="M440,170 L440,210" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="230" y="210" width="420" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">3. 이전 Virtual DOM과 비교 (Diffing)</text>

  <path d="M440,260 L440,300" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="230" y="300" width="420" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">4. 변경된 부분만 Real DOM에 반영 (Reconciliation)</text>

  <path d="M440,350 L440,390" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="230" y="390" width="420" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">5. 배치로 한 번에 업데이트</text>
</svg>