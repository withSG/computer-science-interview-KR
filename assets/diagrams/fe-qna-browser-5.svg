<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Virtual DOM 동작 원리</title>
  <desc id="d">상태 변경이 일어나면 메모리에서 새 Virtual DOM을 만들어 이전 Virtual DOM과 비교(Diffing)하고, 변경된 부분만 Real DOM에 반영(Reconciliation)해 배치로 한 번에 업데이트하는 5단계 흐름.</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 1. 상태 변경 발생 -->
  <circle cx="62" cy="51" r="17" fill="#1d4ed8"/>
  <text x="62" y="57" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="100" y="24" width="520" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="124" y="57" font-size="17" fill="#111827">상태 변경 발생</text>

  <line x1="360" y1="82" x2="360" y2="103" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2. 새로운 Virtual DOM 생성 -->
  <circle cx="62" cy="135" r="17" fill="#1d4ed8"/>
  <text x="62" y="141" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="100" y="108" width="520" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="124" y="141" font-size="17" fill="#111827">새로운 Virtual DOM 생성</text>

  <line x1="360" y1="166" x2="360" y2="187" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3. 이전 Virtual DOM과 비교 (Diffing) -->
  <circle cx="62" cy="219" r="17" fill="#1d4ed8"/>
  <text x="62" y="225" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="100" y="192" width="520" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="124" y="225" font-size="17" fill="#111827">이전 Virtual DOM과 비교</text>
  <rect x="496" y="204" width="108" height="30" rx="15" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="550" y="224" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Diffing</text>

  <line x1="360" y1="250" x2="360" y2="271" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4. 변경된 부분만 Real DOM에 반영 (Reconciliation) -->
  <circle cx="62" cy="303" r="17" fill="#047857"/>
  <text x="62" y="309" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="100" y="276" width="520" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="124" y="309" font-size="17" fill="#111827"><tspan font-weight="bold">변경된 부분만</tspan> Real DOM에 반영</text>
  <rect x="444" y="288" width="160" height="30" rx="15" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="524" y="308" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Reconciliation</text>

  <line x1="360" y1="334" x2="360" y2="355" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5. 배치로 한 번에 업데이트 -->
  <circle cx="62" cy="387" r="17" fill="#047857"/>
  <text x="62" y="393" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="100" y="360" width="520" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="124" y="393" font-size="17" fill="#111827"><tspan font-weight="bold">배치로 한 번에</tspan> 업데이트</text>

  <!-- 구간 표시 -->
  <path d="M640,24 h12 v222 h-12" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="668" y="130" font-size="16" font-weight="bold" fill="#1d4ed8">메모리</text>
  <text x="668" y="154" font-size="16" font-weight="bold" fill="#1d4ed8">(JavaScript)</text>

  <path d="M640,276 h12 v138 h-12" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="668" y="340" font-size="16" font-weight="bold" fill="#047857">브라우저</text>
  <text x="668" y="364" font-size="16" font-weight="bold" fill="#047857">(Real DOM)</text>
</svg>
