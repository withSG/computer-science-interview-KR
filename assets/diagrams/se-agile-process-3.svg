<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">칸반 보드와 WIP 제한</title>
  <desc id="d">To Do, In Progress, Review, Done 단계로 구성된 칸반 보드에서 WIP 제한으로 인해 새 작업을 시작하지 못하고 기존 작업을 완료하도록 유도하는 과정을 보여주는 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 메인 칸반 보드 배경 영역 -->
  <rect x="30" y="30" width="820" height="230" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="6"/>

  <!-- Column 1: To Do -->
  <text x="125" y="58" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">To Do</text>
  <rect x="45" y="70" width="160" height="175" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" rx="4"/>
  <!-- Cards in To Do -->
  <rect x="55" y="80" width="140" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="125" y="100.5" font-size="13" fill="#1f2933" text-anchor="middle">[ 카드 D ]</text>

  <rect x="55" y="120" width="140" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="125" y="140.5" font-size="13" fill="#1f2933" text-anchor="middle">[ 카드 E ]</text>

  <rect x="55" y="160" width="140" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="125" y="180.5" font-size="13" fill="#1f2933" text-anchor="middle">[ 카드 F ]</text>


  <!-- Column 2: In Progress (WIP 2) - Full Warning State -->
  <text x="330" y="58" font-size="14" fill="#dc2626" font-weight="bold" text-anchor="middle">In Progress (WIP 2)</text>
  <rect x="230" y="70" width="200" height="175" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <!-- Cards in In Progress -->
  <rect x="242" y="80" width="176" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="3"/>
  <text x="330" y="100.5" font-size="13" fill="#1f2933" text-anchor="middle">[ 카드 B ]</text>

  <rect x="242" y="120" width="176" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="3"/>
  <text x="330" y="140.5" font-size="13" fill="#1f2933" text-anchor="middle">[ 카드 C ]</text>

  <!-- Status indicator in In Progress -->
  <rect x="242" y="160" width="176" height="32" fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3" rx="3"/>
  <text x="330" y="180.5" font-size="13" fill="#d97706" font-weight="bold" text-anchor="middle">─── 꽉 참 ───</text>


  <!-- Column 3: Review (WIP 2) -->
  <text x="545" y="58" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Review (WIP 2)</text>
  <rect x="450" y="70" width="190" height="175" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" rx="4"/>
  <!-- Cards in Review -->
  <rect x="462" y="80" width="166" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="3"/>
  <text x="545" y="100.5" font-size="13" fill="#1f2933" text-anchor="middle">[ 카드 A ]</text>

  <!-- Status indicator in Review -->
  <rect x="462" y="160" width="166" height="32" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 3" rx="3"/>
  <text x="545" y="180.5" font-size="13" fill="#52606d" text-anchor="middle">1자리 남음</text>


  <!-- Column 4: Done -->
  <text x="735" y="58" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">Done</text>
  <rect x="660" y="70" width="150" height="175" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <!-- Cards in Done -->
  <rect x="672" y="80" width="126" height="32" fill="#ffffff" stroke="#059669" stroke-width="1" rx="3"/>
  <text x="735" y="100.5" font-size="13" fill="#059669" text-anchor="middle">[완료들]</text>


  <!-- Explanation Section Below Board -->
  <g transform="translate(45, 275)">
    <text x="0" y="11.5" font-size="13" fill="#1f2933">D를 시작하고 싶어도 In Progress가 꽉 찼다.</text>

    <!-- Bullet 1 -->
    <path d="M 0,33 L 14,33" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="22" y="37.5" font-size="13" fill="#1f2933">새 일을 시작할 수 없으니, 팀은 B나 C를 끝내러 간다.</text>

    <!-- Bullet 2 -->
    <path d="M 0,59 L 14,59" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="22" y="63.5" font-size="13" fill="#1f2933">카드가 Review에 계속 쌓이면 "리뷰가 병목"이라는 사실이 보드에 그려진다.</text>
  </g>
</svg>