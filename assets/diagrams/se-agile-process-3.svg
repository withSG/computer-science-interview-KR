<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">칸반 보드와 WIP 제한</title>
  <desc id="d">To Do, In Progress(WIP 2), Review(WIP 2), Done 네 열의 칸반 보드. In Progress가 카드 B·C로 꽉 차서 카드 D를 시작할 수 없으니 팀은 B나 C를 끝내러 가고, Review에 카드가 계속 쌓이면 리뷰가 병목이라는 사실이 보드에 드러난다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ── To Do ── -->
  <rect x="40" y="40" width="160" height="238" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="40" y1="110" x2="200" y2="110" stroke="#9ca3af" stroke-width="1"/>
  <text x="120" y="68" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">To Do</text>
  <rect x="52" y="122" width="136" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="148" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">카드 D</text>
  <rect x="52" y="174" width="136" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="200" font-size="16" fill="#111827" text-anchor="middle">카드 E</text>
  <rect x="52" y="226" width="136" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="252" font-size="16" fill="#111827" text-anchor="middle">카드 F</text>

  <!-- ── In Progress (꽉 참) ── -->
  <rect x="264" y="40" width="200" height="238" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <line x1="264" y1="110" x2="464" y2="110" stroke="#b91c1c" stroke-width="1"/>
  <text x="364" y="68" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">In Progress</text>
  <rect x="330" y="78" width="68" height="24" rx="12" fill="#b91c1c"/>
  <text x="364" y="96" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">WIP 2</text>
  <rect x="276" y="122" width="176" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="364" y="148" font-size="16" fill="#111827" text-anchor="middle">카드 B</text>
  <rect x="276" y="174" width="176" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="364" y="200" font-size="16" fill="#111827" text-anchor="middle">카드 C</text>
  <rect x="276" y="226" width="176" height="40" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="364" y="252" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">꽉 참</text>

  <!-- ── Review ── -->
  <rect x="504" y="40" width="180" height="238" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="504" y1="110" x2="684" y2="110" stroke="#9ca3af" stroke-width="1"/>
  <text x="594" y="68" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Review</text>
  <rect x="560" y="78" width="68" height="24" rx="12" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="594" y="96" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">WIP 2</text>
  <rect x="516" y="122" width="156" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="594" y="148" font-size="16" fill="#111827" text-anchor="middle">카드 A</text>
  <rect x="516" y="174" width="156" height="40" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="594" y="200" font-size="16" fill="#4b5563" text-anchor="middle">1자리 남음</text>

  <!-- ── Done ── -->
  <rect x="724" y="40" width="116" height="238" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <line x1="724" y1="110" x2="840" y2="110" stroke="#047857" stroke-width="1"/>
  <text x="782" y="68" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">Done</text>
  <rect x="736" y="122" width="92" height="40" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="782" y="148" font-size="16" fill="#111827" text-anchor="middle">완료들</text>

  <!-- ① D 시작 막힘 -->
  <line x1="192" y1="142" x2="258" y2="142" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah-red)"/>
  <path d="M223,135 L237,149 M223,149 L237,135" stroke="#b91c1c" stroke-width="3" fill="none"/>
  <circle cx="232" cy="110" r="12" fill="#b91c1c"/>
  <text x="232" y="115" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- ② B·C 끝내러 감 -->
  <line x1="456" y1="168" x2="498" y2="168" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <circle cx="484" cy="140" r="12" fill="#047857"/>
  <text x="484" y="145" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <!-- ③ Review 병목 -->
  <circle cx="662" cy="62" r="12" fill="#6d28d9"/>
  <text x="662" y="67" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 설명 -->
  <circle cx="52" cy="324" r="12" fill="#b91c1c"/>
  <text x="52" y="329" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="330" font-size="16" fill="#111827">D를 시작하고 싶어도 In Progress가 <tspan font-weight="bold" fill="#b91c1c">꽉 찼다.</tspan></text>

  <circle cx="52" cy="360" r="12" fill="#047857"/>
  <text x="52" y="365" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="76" y="366" font-size="16" fill="#111827">새 일을 시작할 수 없으니, 팀은 <tspan font-weight="bold" fill="#047857">B나 C를 끝내러 간다.</tspan></text>

  <circle cx="52" cy="396" r="12" fill="#6d28d9"/>
  <text x="52" y="401" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="76" y="402" font-size="16" fill="#111827">카드가 Review에 계속 쌓이면 <tspan font-weight="bold" fill="#6d28d9">“리뷰가 병목”</tspan>이라는 사실이 보드에 그려진다.</text>
</svg>
