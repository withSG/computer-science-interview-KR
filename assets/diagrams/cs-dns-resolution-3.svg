<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DNS 캐시 계층 구조 (캐시는 몇 겹인가)</title>
  <desc id="d">브라우저, OS, 라우터, 재귀 리졸버로 이어지는 DNS 캐시 4단계 계층과 로컬 캐시 범위 및 실제 권한 서버 조회 구분을 보여주는 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Background Area for Local Cache Zone -->
  <rect x="80" y="70" width="720" height="270" rx="8" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="6 4"/>
  
  <!-- Right Brackets and Annotation Text -->
  <path d="M 520 100 L 540 100 L 540 235 L 550 235 L 540 235 L 540 370 L 520 370" fill="none" stroke="#2563eb" stroke-width="2"/>
  
  <rect x="565" y="218" width="220" height="34" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="675" y="239" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">여기서 맞으면 네트워크로 나가지 않는다</text>

  <!-- Items 1 to 4 (Cache Layers) -->
  <!-- 1. 브라우저 자체 DNS 캐시 -->
  <rect x="110" y="85" width="390" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="130" y="115" font-size="14" font-weight="bold" fill="#1f2933">① 브라우저 자체 DNS 캐시</text>

  <!-- 2. OS 캐시 + hosts 파일 -->
  <rect x="110" y="155" width="390" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="130" y="185" font-size="14" font-weight="bold" fill="#1f2933">② OS 캐시 + hosts 파일</text>

  <!-- 3. 라우터(공유기) 캐시 -->
  <rect x="110" y="225" width="390" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="130" y="255" font-size="14" font-weight="bold" fill="#1f2933">③ 라우터(공유기) 캐시</text>

  <!-- 4. 재귀 리졸버(ISP/공개DNS) -->
  <rect x="110" y="295" width="390" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="130" y="325" font-size="14" font-weight="bold" fill="#1f2933">④ 재귀 리졸버(ISP/공개DNS)</text>

  <!-- Divider Line for Item 5 -->
  <line x1="80" y1="410" x2="800" y2="410" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Item 5 Text Label -->
  <rect x="210" y="393" width="460" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="414" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">⑤ ── 여기서부터 루트 → TLD → 권한 서버 실제 조회 ──</text>
</svg>