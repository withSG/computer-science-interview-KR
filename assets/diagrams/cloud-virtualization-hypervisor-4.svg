<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Type 2: Hosted Hypervisor Architecture</title>
  <desc id="d">Diagram showing VMs on top of Type 2 Hypervisor, running on Host OS, above Hardware</desc>

  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Level 1: VMs (Side by Side) -->
  <!-- VM 1 -->
  <rect x="230" y="40" width="180" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="70" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">VM 1</text>

  <!-- VM 2 -->
  <rect x="470" y="40" width="180" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="560" y="70" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">VM 2</text>

  <!-- Vertical lines from VMs down to Hypervisor -->
  <path d="M320,90 L320,150" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M560,90 L560,150" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Level 2: Type 2 Hypervisor -->
  <rect x="200" y="150" width="480" height="90" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="180" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Type 2 Hypervisor</text>
  <text x="440" y="202" font-size="13" fill="#52606d" text-anchor="middle">(VirtualBox, VMware</text>
  <text x="440" y="222" font-size="13" fill="#52606d" text-anchor="middle">Workstation)</text>

  <!-- Vertical line from Hypervisor down to Host OS -->
  <path d="M440,240 L440,280" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Level 3: Host OS -->
  <rect x="200" y="280" width="480" height="70" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="309" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Host OS</text>
  <text x="440" y="331" font-size="13" fill="#52606d" text-anchor="middle">(Windows, macOS)</text>

  <!-- Vertical line from Host OS down to Hardware -->
  <path d="M440,350 L440,390" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Level 4: Hardware -->
  <rect x="200" y="390" width="480" height="60" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="425" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Hardware</text>
</svg>