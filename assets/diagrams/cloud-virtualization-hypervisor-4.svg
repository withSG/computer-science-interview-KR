<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Type 2 하이퍼바이저 계층 구조</title>
  <desc id="d">VM 1과 VM 2가 Type 2 Hypervisor(VirtualBox, VMware Workstation) 위에서 돌고, 하이퍼바이저는 Host OS(Windows, macOS) 위에, Host OS는 Hardware 위에 놓인다. Type 1과 달리 게스트와 하드웨어 사이에 호스트 OS가 한 벌 더 끼어 있음을 강조한다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- VMs -->
  <rect x="60" y="40" width="204" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="162" y="74" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">VM 1</text>
  <rect x="296" y="40" width="204" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="398" y="74" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">VM 2</text>

  <line x1="162" y1="96" x2="162" y2="124" stroke="#6b7280" stroke-width="2"/>
  <line x1="398" y1="96" x2="398" y2="124" stroke="#6b7280" stroke-width="2"/>

  <!-- Type 2 Hypervisor -->
  <rect x="60" y="124" width="440" height="80" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="280" y="158" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Type 2 Hypervisor</text>
  <text x="280" y="184" font-size="15" fill="#4b5563" text-anchor="middle">(VirtualBox, VMware Workstation)</text>

  <line x1="280" y1="204" x2="280" y2="228" stroke="#6b7280" stroke-width="2"/>

  <!-- Host OS (강조) -->
  <rect x="60" y="228" width="440" height="80" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="280" y="262" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">Host OS</text>
  <text x="280" y="288" font-size="15" fill="#4b5563" text-anchor="middle">(Windows, macOS)</text>

  <line x1="280" y1="308" x2="280" y2="332" stroke="#6b7280" stroke-width="2"/>

  <!-- Hardware -->
  <rect x="60" y="332" width="440" height="56" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="280" y="366" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- 설명 콜아웃 -->
  <line x1="546" y1="268" x2="506" y2="268" stroke="#b45309" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="548" y="210" width="308" height="116" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="566" y="240" font-size="17" font-weight="bold" fill="#b45309">Type 1에는 없는 층</text>
  <text x="566" y="266" font-size="15" fill="#1f2937">기존 OS 위에 설치하므로</text>
  <text x="566" y="289" font-size="15" fill="#1f2937">게스트와 하드웨어 사이에</text>
  <text x="566" y="312" font-size="15" fill="#1f2937">범용 OS 한 벌이 더 끼어 있다</text>
</svg>
