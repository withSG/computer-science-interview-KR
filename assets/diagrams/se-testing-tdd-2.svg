<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">TDD 한 바퀴 — 실제로 돌려보기</title>
  <desc id="d">RED(실패하는 테스트), GREEN(통과하는 최소 코드), REFACTOR(구조만 개선) 세 단계를 순환하는 TDD 사이클 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <!-- RED 화살표 마커 -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <!-- GREEN 화살표 마커 -->
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <!-- PURPLE (Refactor->Red) 화살표 마커 -->
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- RED 박스 -->
  <!-- Center: X=190, Y=105 | Box: W=200, H=110 | Top-Left: X=90, Y=50 -->
  <rect x="90" y="50" width="200" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="80.5" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">RED</text>
  <text x="190" y="109.55" font-size="13" fill="#1f2933" text-anchor="middle">실패하는</text>
  <text x="190" y="132.55" font-size="13" fill="#1f2933" text-anchor="middle">테스트</text>

  <!-- GREEN 박스 -->
  <!-- Center: X=440, Y=105 | Box: W=200, H=110 | Top-Left: X=340, Y=50 -->
  <rect x="340" y="50" width="200" height="110" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="80.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">GREEN</text>
  <text x="440" y="109.55" font-size="13" fill="#1f2933" text-anchor="middle">통과하는</text>
  <text x="440" y="132.55" font-size="13" fill="#1f2933" text-anchor="middle">최소 코드</text>

  <!-- REFACTOR 박스 -->
  <!-- Center: X=690, Y=105 | Box: W=200, H=110 | Top-Left: X=590, Y=50 -->
  <rect x="590" y="50" width="200" height="110" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="690" y="80.5" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">REFACTOR</text>
  <text x="690" y="109.55" font-size="13" fill="#1f2933" text-anchor="middle">구조만</text>
  <text x="690" y="132.55" font-size="13" fill="#1f2933" text-anchor="middle">개선</text>

  <!-- 하단 텍스트 라벨 (각 박스 아래 정렬) -->
  <text x="190" y="184.025" font-size="11.5" fill="#52606d" text-anchor="middle">"무엇을</text>
  <text x="190" y="202.025" font-size="11.5" fill="#52606d" text-anchor="middle">원하는가"</text>

  <text x="440" y="184.025" font-size="11.5" fill="#52606d" text-anchor="middle">"일단</text>
  <text x="440" y="202.025" font-size="11.5" fill="#52606d" text-anchor="middle">되게 하라"</text>

  <text x="690" y="184.025" font-size="11.5" fill="#52606d" text-anchor="middle">"테스트는 계속</text>
  <text x="690" y="202.025" font-size="11.5" fill="#52606d" text-anchor="middle">초록인 채로"</text>

  <!-- 순환 화살표 (순차 흐름) -->
  <!-- RED -> GREEN -->
  <path d="M 290 105 L 340 105" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- GREEN -> REFACTOR -->
  <path d="M 540 105 L 590 105" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- REFACTOR -> RED (상단 되돌아가는 루프) -->
  <path d="M 690 50 L 690 25 L 190 25 L 190 50" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- 하단 각주 / 요약 문구 -->
  <rect x="90" y="250" width="700" height="40" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="273.85" font-size="13" fill="#1f2933" text-anchor="middle">한 바퀴 목표 시간은 몇 분. 30분짜리 사이클은 이미 단계가 너무 크다.</text>
</svg>