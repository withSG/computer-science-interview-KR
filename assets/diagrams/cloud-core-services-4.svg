<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RDS Multi-AZ와 Read Replica 비교</title>
  <desc id="d">Multi-AZ는 가용성용으로 다른 AZ의 Standby에 동기 복제하며 Standby는 접속할 수 없고 장애 시 엔드포인트가 Standby를 가리킨다. Read Replica는 성능용으로 다른 AZ의 Replica에 비동기 복제하며(복제 지연 있음) 앱이 읽기 쿼리를 Replica로 명시적으로 보낸다.</desc>
  <rect width="880" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ===== Multi-AZ ===== -->
  <rect x="24" y="24" width="832" height="284" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="48" y="58" font-size="20" font-weight="700" fill="#1e3a8a">Multi-AZ<tspan font-size="18" fill="#1d4ed8" dx="10">— 가용성용</tspan></text>

  <rect x="56" y="156" width="320" height="112" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="72" y="180" font-size="15" font-weight="700" fill="#475569">AZ-a</text>
  <rect x="504" y="156" width="320" height="112" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="520" y="180" font-size="15" font-weight="700" fill="#475569">AZ-b</text>

  <rect x="360" y="76" width="160" height="44" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="440" y="104" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">엔드포인트</text>

  <rect x="136" y="184" width="160" height="68" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="216" y="212" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Primary</text>
  <text x="216" y="238" font-size="15" fill="#374151" text-anchor="middle">읽기/쓰기</text>

  <rect x="584" y="184" width="160" height="68" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="664" y="212" font-size="17" font-weight="700" fill="#374151" text-anchor="middle">Standby</text>
  <text x="664" y="238" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">접속 불가</text>

  <!-- 연결선 (박스 위에 그림) -->
  <line x1="410" y1="120" x2="252" y2="181" stroke="#1e3a8a" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="338" y="138" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="end">평소</text>
  <line x1="470" y1="120" x2="628" y2="181" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
  <text x="542" y="138" font-size="15" font-weight="700" fill="#b91c1c">장애 시</text>

  <line x1="298" y1="218" x2="580" y2="218" stroke="#1e3a8a" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="440" y="208" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">동기 복제</text>

  <text x="440" y="293" font-size="15" fill="#1f2937" text-anchor="middle">장애 시 엔드포인트가 Standby를 가리킴</text>

  <!-- ===== Read Replica ===== -->
  <rect x="24" y="332" width="832" height="284" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="48" y="366" font-size="20" font-weight="700" fill="#065f46">Read Replica<tspan font-size="18" fill="#047857" dx="10">— 성능용</tspan></text>

  <rect x="56" y="464" width="320" height="112" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="72" y="488" font-size="15" font-weight="700" fill="#475569">AZ-a</text>
  <rect x="504" y="464" width="320" height="112" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="520" y="488" font-size="15" font-weight="700" fill="#475569">AZ-b</text>

  <rect x="380" y="384" width="120" height="44" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="412" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">앱</text>

  <rect x="136" y="492" width="160" height="68" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="216" y="520" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Primary</text>
  <text x="216" y="546" font-size="15" fill="#374151" text-anchor="middle">읽기/쓰기</text>

  <rect x="584" y="492" width="160" height="68" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="664" y="520" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Replica</text>
  <text x="664" y="546" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">읽기 전용</text>

  <!-- 연결선 (박스 위에 그림) -->
  <line x1="410" y1="428" x2="252" y2="489" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="338" y="446" font-size="15" font-weight="700" fill="#374151" text-anchor="end">쓰기</text>
  <line x1="470" y1="428" x2="628" y2="489" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="542" y="446" font-size="15" font-weight="700" fill="#047857">읽기 쿼리</text>

  <line x1="298" y1="526" x2="580" y2="526" stroke="#047857" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#ah-green)"/>
  <text x="440" y="516" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">비동기 복제</text>
  <text x="440" y="551" font-size="15" fill="#b45309" text-anchor="middle">복제 지연 있음</text>

  <text x="440" y="601" font-size="15" fill="#1f2937" text-anchor="middle">앱이 읽기 쿼리를 명시적으로 보냄</text>
</svg>
