<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AWS RDS Multi-AZ 및 Read Replica 구성 비교</title>
  <desc id="d">RDS Multi-AZ의 가용성 중심 동기 복제 구조와 Read Replica의 성능 중심 비동기 복제 구조를 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- Left Section: Multi-AZ -->
  <g id="multi-az-section">
    <!-- Section Headers -->
    <text x="70" y="45" font-size="14" font-weight="bold" fill="#1f2933">[Multi-AZ]</text>
    <text x="145" y="45" font-size="13" fill="#52606d">— 가용성용</text>

    <!-- Sub Headers (AZs) -->
    <text x="100" y="75" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">AZ-a</text>
    <text x="320" y="75" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">AZ-b</text>

    <!-- Primary Box -->
    <rect x="40" y="90" width="120" height="90" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="100" y="117" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Primary</text>
    <text x="100" y="152" font-size="13" fill="#52606d" text-anchor="middle">읽기/쓰기</text>

    <!-- Arrow & Labels -->
    <path d="M160,135 L250,135" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <rect x="185" y="102" width="40" height="20" fill="#ffffff"/>
    <text x="205" y="116" font-size="13" fill="#2563eb" text-anchor="middle">동기</text>
    <rect x="185" y="137" width="40" height="20" fill="#ffffff"/>
    <text x="205" y="151" font-size="13" fill="#2563eb" text-anchor="middle">복제</text>

    <!-- Standby Box -->
    <rect x="260" y="90" width="120" height="90" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="320" y="117" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Standby</text>
    <text x="320" y="152" font-size="13" fill="#52606d" text-anchor="middle">접속 불가</text>

    <!-- Footer Note -->
    <text x="210" y="215" font-size="11.5" fill="#52606d" text-anchor="middle">장애 시 엔드포인트가 Standby를 가리킴</text>
  </g>

  <!-- Divider Line -->
  <line x1="430" y1="30" x2="430" y2="260" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right Section: Read Replica -->
  <g id="read-replica-section">
    <!-- Section Headers -->
    <text x="460" y="45" font-size="14" font-weight="bold" fill="#1f2933">[Read Replica]</text>
    <text x="560" y="45" font-size="13" fill="#52606d">— 성능용</text>

    <!-- Sub Headers (AZs) -->
    <text x="510" y="75" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">AZ-a</text>
    <text x="730" y="75" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">AZ-b</text>

    <!-- Primary Box -->
    <rect x="450" y="90" width="120" height="90" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="510" y="117" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Primary</text>
    <text x="510" y="152" font-size="13" fill="#52606d" text-anchor="middle">읽기/쓰기</text>

    <!-- Arrow & Labels -->
    <path d="M570,135 L660,135" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="590" y="102" width="50" height="20" fill="#ffffff"/>
    <text x="615" y="116" font-size="13" fill="#059669" text-anchor="middle">비동기</text>
    <rect x="595" y="137" width="40" height="20" fill="#ffffff"/>
    <text x="615" y="151" font-size="13" fill="#059669" text-anchor="middle">복제</text>

    <!-- Replica Box -->
    <rect x="670" y="90" width="120" height="90" rx="4" ry="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="730" y="117" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Replica</text>
    <text x="730" y="152" font-size="13" fill="#52606d" text-anchor="middle">읽기 전용</text>

    <!-- Footer Note -->
    <text x="620" y="215" font-size="11.5" fill="#52606d" text-anchor="middle">앱이 읽기 쿼리를 명시적으로 보냄</text>
  </g>
</svg>