<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CI 동작 원리</title>
  <desc id="d">개발자가 작은 변경을 git push 하면 원격 저장소가 push/PR 이벤트를 CI 러너에 보내고, 러너는 깨끗한 환경 준비, 소스 체크아웃, 의존성 설치, 빌드, 테스트를 차례로 실행한 뒤 성공/실패 상태를 보고한다. 실패 알림은 5분 안에 개발자에게 돌아오며, 운영에 나가기 전인 이 시점에 고쳐야 싸다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="590" fill="#ffffff"/>

  <!-- 생명선 -->
  <line x1="130" y1="68" x2="130" y2="446" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="440" y1="68" x2="440" y2="486" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="740" y1="68" x2="740" y2="486" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 참여자 -->
  <rect x="45" y="24" width="170" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="52" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">개발자</text>
  <rect x="355" y="24" width="170" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="52" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">원격 저장소</text>
  <rect x="655" y="24" width="170" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="740" y="52" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">CI 러너</text>

  <!-- 1. git push -->
  <line x1="130" y1="116" x2="438" y2="116" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="285" y="104" font-size="16" fill="#1d4ed8" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">git push</tspan> (작은 변경)</text>

  <!-- 2. push/PR 이벤트 -->
  <line x1="440" y1="166" x2="738" y2="166" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="590" y="154" font-size="16" fill="#111827" text-anchor="middle">push/PR 이벤트 발생</text>

  <!-- 러너 실행 단계 -->
  <rect x="640" y="188" width="200" height="182" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="222" font-size="16" font-weight="bold" fill="#6d28d9">① 깨끗한 환경 준비</text>
  <text x="660" y="254" font-size="16" fill="#111827">② 소스 체크아웃</text>
  <text x="660" y="286" font-size="16" fill="#111827">③ 의존성 설치</text>
  <text x="660" y="318" font-size="16" fill="#111827">④ 빌드</text>
  <text x="660" y="350" font-size="16" fill="#111827">⑤ 테스트</text>

  <!-- 3. 상태 보고 -->
  <line x1="740" y1="406" x2="442" y2="406" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="590" y="394" font-size="16" fill="#111827" text-anchor="middle">성공/실패 상태 보고</text>

  <!-- 4. 실패 알림 -->
  <line x1="440" y1="452" x2="138" y2="452" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <text x="285" y="440" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패 알림 (5분 내)</text>
  <circle cx="130" cy="452" r="7" fill="#b91c1c"/>

  <!-- 여기서 고쳐야 싸다 -->
  <line x1="130" y1="460" x2="130" y2="494" stroke="#b45309" stroke-width="2"/>
  <rect x="40" y="494" width="600" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="522" font-size="17" font-weight="bold" fill="#b45309">여기서 고쳐야 싸다</text>
  <text x="60" y="550" font-size="15" fill="#374151">운영에 나간 뒤 고치면 원인 조사·복구·재배포가 전부 붙는다.</text>
</svg>
