<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Push vs Pull 배포</title>
  <desc id="d">Push 기반(전통적)은 Git에서 CI/CD Pipeline을 거쳐 Cluster로 밀어 넣으며 파이프라인에 권한이 필요합니다. Pull 기반(GitOps)은 클러스터 내부의 ArgoCD가 Git에서 당겨 와 Cluster에 적용합니다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Push 기반 -->
  <rect x="24" y="24" width="832" height="172" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#111827">Push 기반 (전통적)</text>

  <rect x="60" y="76" width="180" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="150" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Git</text>

  <line x1="244" y1="108" x2="344" y2="108" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-push)"/>

  <rect x="350" y="76" width="180" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="114" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">CI/CD Pipeline</text>

  <line x1="534" y1="108" x2="634" y2="108" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-push)"/>

  <rect x="640" y="76" width="180" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="730" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Cluster</text>

  <text x="440" y="172" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">(권한 필요)</text>

  <!-- Pull 기반 -->
  <rect x="24" y="220" width="832" height="172" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="252" font-size="18" font-weight="bold" fill="#111827">Pull 기반 (GitOps)</text>

  <rect x="60" y="272" width="180" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="150" y="310" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Git</text>

  <line x1="346" y1="304" x2="246" y2="304" stroke="#047857" stroke-width="2" marker-end="url(#arr-pull)"/>

  <rect x="350" y="272" width="180" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="299" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">ArgoCD</text>
  <text x="440" y="323" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">(Pull)</text>

  <line x1="534" y1="304" x2="634" y2="304" stroke="#047857" stroke-width="2" marker-end="url(#arr-pull)"/>

  <rect x="640" y="272" width="180" height="64" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="730" y="310" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Cluster</text>

  <text x="440" y="368" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">(클러스터 내부)</text>
</svg>
