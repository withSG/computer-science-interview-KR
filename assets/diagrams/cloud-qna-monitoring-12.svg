<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">장애 대응 단계</title>
  <desc id="d">탐지, 대응, 완화, 해결, 사후 분석의 5단계 장애 대응 프로세스를 나타낸 플로우차트</desc>
  <rect width="880" height="720" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Step 1: Detect -->
  <g>
    <rect x="180" y="30" width="520" height="100" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="204" y="60" font-size="16" font-weight="bold" fill="#1f2933">1. 탐지 (Detect)</text>
    <text x="224" y="86" font-size="13" fill="#52606d">- 모니터링 알림 수신</text>
    <text x="224" y="108" font-size="13" fill="#52606d">- 고객 리포트 접수</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,130 L440,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2: Respond -->
  <g>
    <rect x="180" y="160" width="520" height="120" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="204" y="190" font-size="16" font-weight="bold" fill="#1f2933">2. 대응 (Respond)</text>
    <text x="224" y="216" font-size="13" fill="#52606d">- On-call 담당자 확인</text>
    <text x="224" y="238" font-size="13" fill="#52606d">- 장애 채널 오픈</text>
    <text x="224" y="260" font-size="13" fill="#52606d">- 역할 분담 (Commander, Communicator)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,280 L440,310" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3: Mitigate -->
  <g>
    <rect x="180" y="310" width="520" height="100" rx="6" ry="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="204" y="340" font-size="16" font-weight="bold" fill="#1f2933">3. 완화 (Mitigate)</text>
    <text x="224" y="366" font-size="13" fill="#52606d">- 서비스 복구 우선 (롤백, 스케일링)</text>
    <text x="224" y="388" font-size="13" fill="#52606d">- 근본 원인은 나중에</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,410 L440,440" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4: Resolve -->
  <g>
    <rect x="180" y="440" width="520" height="100" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="204" y="470" font-size="16" font-weight="bold" fill="#1f2933">4. 해결 (Resolve)</text>
    <text x="224" y="496" font-size="13" fill="#52606d">- 정상 상태 확인</text>
    <text x="224" y="518" font-size="13" fill="#52606d">- 모니터링 지속</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,540 L440,570" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 5: Postmortem -->
  <g>
    <rect x="180" y="570" width="520" height="120" rx="6" ry="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="204" y="600" font-size="16" font-weight="bold" fill="#1f2933">5. 사후 분석 (Postmortem)</text>
    <text x="224" y="626" font-size="13" fill="#52606d">- 타임라인 정리</text>
    <text x="224" y="648" font-size="13" fill="#52606d">- 근본 원인 분석 (5 Whys)</text>
    <text x="224" y="670" font-size="13" fill="#52606d">- 재발 방지 Action Items</text>
  </g>
</svg>