<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">장애 대응 단계</title>
  <desc id="d">장애 대응은 탐지(Detect), 대응(Respond), 완화(Mitigate), 해결(Resolve), 사후 분석(Postmortem)의 5단계로 차례대로 진행되며, 각 단계에서 할 일을 오른쪽에 정리했습니다.</desc>
  <rect width="880" height="690" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 단계 사이 화살표 -->
  <line x1="64" y1="116" x2="64" y2="144" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="64" y1="266" x2="64" y2="294" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="64" y1="390" x2="64" y2="418" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="64" y1="514" x2="64" y2="542" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 1. 탐지 -->
  <rect x="24" y="24" width="832" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="64" cy="68" r="20" fill="#1d4ed8"/>
  <text x="64" y="74" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="100" y="66" font-size="20" font-weight="bold" fill="#111827">탐지</text>
  <text x="100" y="90" font-size="15" fill="#4b5563">Detect</text>
  <line x1="280" y1="40" x2="280" y2="96" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="304" cy="56" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="61" font-size="16" fill="#111827">모니터링 알림 수신</text>
  <circle cx="304" cy="82" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="87" font-size="16" fill="#111827">고객 리포트 접수</text>

  <!-- 2. 대응 -->
  <rect x="24" y="148" width="832" height="114" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="64" cy="205" r="20" fill="#1d4ed8"/>
  <text x="64" y="211" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="100" y="203" font-size="20" font-weight="bold" fill="#111827">대응</text>
  <text x="100" y="227" font-size="15" fill="#4b5563">Respond</text>
  <line x1="280" y1="164" x2="280" y2="246" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="304" cy="180" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="185" font-size="16" fill="#111827">On-call 담당자 확인</text>
  <circle cx="304" cy="206" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="211" font-size="16" fill="#111827">장애 채널 오픈</text>
  <circle cx="304" cy="232" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="237" font-size="16" fill="#111827">역할 분담 (Commander, Communicator)</text>

  <!-- 3. 완화 -->
  <rect x="24" y="298" width="832" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="64" cy="342" r="20" fill="#1d4ed8"/>
  <text x="64" y="348" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="100" y="340" font-size="20" font-weight="bold" fill="#111827">완화</text>
  <text x="100" y="364" font-size="15" fill="#4b5563">Mitigate</text>
  <line x1="280" y1="314" x2="280" y2="370" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="304" cy="330" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="335" font-size="16" fill="#111827">서비스 복구 우선 (롤백, 스케일링)</text>
  <circle cx="304" cy="356" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="361" font-size="16" fill="#111827">근본 원인은 나중에</text>

  <!-- 4. 해결 -->
  <rect x="24" y="422" width="832" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="64" cy="466" r="20" fill="#1d4ed8"/>
  <text x="64" y="472" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="100" y="464" font-size="20" font-weight="bold" fill="#111827">해결</text>
  <text x="100" y="488" font-size="15" fill="#4b5563">Resolve</text>
  <line x1="280" y1="438" x2="280" y2="494" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="304" cy="454" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="459" font-size="16" fill="#111827">정상 상태 확인</text>
  <circle cx="304" cy="480" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="485" font-size="16" fill="#111827">모니터링 지속</text>

  <!-- 5. 사후 분석 -->
  <rect x="24" y="546" width="832" height="114" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="64" cy="603" r="20" fill="#1d4ed8"/>
  <text x="64" y="609" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="100" y="601" font-size="20" font-weight="bold" fill="#111827">사후 분석</text>
  <text x="100" y="625" font-size="15" fill="#4b5563">Postmortem</text>
  <line x1="280" y1="562" x2="280" y2="644" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="304" cy="578" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="583" font-size="16" fill="#111827">타임라인 정리</text>
  <circle cx="304" cy="604" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="609" font-size="16" fill="#111827">근본 원인 분석 (5 Whys)</text>
  <circle cx="304" cy="630" r="3.5" fill="#1d4ed8"/>
  <text x="318" y="635" font-size="16" fill="#111827">재발 방지 Action Items</text>
</svg>
