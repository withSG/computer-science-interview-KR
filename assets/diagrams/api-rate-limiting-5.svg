<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Leaky Bucket 동작</title>
  <desc id="d">요청이 들쭉날쭉 들어와도 큐에 쌓였다가 초당 1개씩 일정하게 처리되어, 나가는 속도는 항상 일정하다. 큐가 가득 차면 새 요청은 거절한다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#ffffff"/>

  <!-- 들어오는 요청: 불규칙 -->
  <text x="380" y="40" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">요청이 들쭉날쭉 들어와도</text>
  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)">
    <line x1="262" y1="56" x2="262" y2="100"/>
    <line x1="344" y1="56" x2="344" y2="100"/>
    <line x1="364" y1="56" x2="364" y2="100"/>
    <line x1="384" y1="56" x2="384" y2="100"/>
    <line x1="404" y1="56" x2="404" y2="100"/>
    <line x1="494" y1="56" x2="494" y2="100"/>
  </g>

  <!-- 큐 -->
  <rect x="210" y="106" width="340" height="60" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="237" y="119" width="34" height="34" rx="4" fill="#1d4ed8"/>
  <rect x="279" y="119" width="34" height="34" rx="4" fill="#1d4ed8"/>
  <rect x="321" y="119" width="34" height="34" rx="4" fill="#1d4ed8"/>
  <rect x="363" y="119" width="34" height="34" rx="4" fill="#1d4ed8"/>
  <rect x="405" y="119" width="34" height="34" rx="4" fill="#1d4ed8"/>
  <rect x="447" y="119" width="34" height="34" rx="4" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="489" y="119" width="34" height="34" rx="4" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="572" y="142" font-size="17" font-weight="bold" fill="#111827">큐 <tspan font-size="15" font-weight="normal" fill="#b91c1c">(가득 차면 새 요청 거절)</tspan></text>

  <!-- 나가는 요청: 일정 간격 -->
  <line x1="380" y1="166" x2="380" y2="188" stroke="#047857" stroke-width="3"/>
  <rect x="371" y="195" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="371" y="237" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="371" y="279" width="18" height="18" rx="3" fill="#047857"/>
  <rect x="371" y="321" width="18" height="18" rx="3" fill="#047857"/>
  <line x1="380" y1="344" x2="380" y2="384" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>

  <!-- 간격 표시 -->
  <path d="M398,204 L406,204 M406,204 L406,330 M398,246 L406,246 M398,288 L406,288 M398,330 L406,330" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <g font-size="15" fill="#374151">
    <text x="414" y="230">1초</text>
    <text x="414" y="272">1초</text>
    <text x="414" y="314">1초</text>
  </g>

  <text x="480" y="262" font-size="17" font-weight="bold" fill="#047857">초당 1개씩 일정하게 처리</text>
  <text x="480" y="290" font-size="16" fill="#111827">→ 나가는 속도는 항상 일정</text>
</svg>
