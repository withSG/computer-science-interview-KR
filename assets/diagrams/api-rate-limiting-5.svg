<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Leaky Bucket — 출력 속도를 일정하게</title>
  <desc id="d">요청이 들쭉날쭉 들어와도 큐에 쌓인 후 초당 1개씩 일정하게 처리되어 나가는 속도가 일정한 Leaky Bucket 알고리즘 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- Top Request Flow -->
  <!-- Top Label: 요청이 들쭉날쭉 들어와도 (font-size 13) -->
  <text x="320" y="44.55" font-size="13" fill="#1f2933" text-anchor="middle">요청이 들쭉날쭉 들어와도</text>

  <!-- Incoming Arrows: ↓  ↓↓↓↓   ↓ -->
  <!-- Arrow 1 -->
  <path d="M230,55 L230,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Burst Arrows -->
  <path d="M280,55 L280,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M300,55 L300,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M320,55 L320,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M340,55 L340,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Arrow 3 -->
  <path d="M410,55 L410,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Queue Main Container -->
  <!-- Queue Box [180, 110] to [460, 170] -->
  <rect x="180" y="110" width="280" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

  <!-- Queue Items: ■ ■ ■ ■ ■ (5 Blocks) -->
  <rect x="200" y="125" width="30" height="30" rx="3" fill="#2563eb"/>
  <rect x="240" y="125" width="30" height="30" rx="3" fill="#2563eb"/>
  <rect x="280" y="125" width="30" height="30" rx="3" fill="#2563eb"/>
  <rect x="320" y="125" width="30" height="30" rx="3" fill="#2563eb"/>
  <rect x="360" y="125" width="30" height="30" rx="3" fill="#2563eb"/>

  <!-- Queue Description Label Right of Queue Box -->
  <!-- 큐 (가득 차면 새 요청 거절) (font-size 13) -->
  <text x="480" y="144.55" font-size="13" fill="#52606d">큐 (가득 차면 새 요청 거절)</text>

  <!-- Output Processing Connector & Text -->
  <!-- Vertical Line from Queue Bottom to Processing Point -->
  <path d="M320,170 L320,230" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Dot representing processing point: ● -->
  <circle cx="320" cy="230" r="5" fill="#059669"/>

  <!-- Text next to dot: 초당 1개씩 일정하게 처리 → 나가는 속도는 항상 일정 -->
  <text x="335" y="234.55" font-size="13" fill="#1f2933">초당 1개씩 일정하게 처리 → 나가는 속도는 항상 일정</text>

  <!-- Arrow from processing point down -->
  <path d="M320,235 L320,300" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Outflowing Items Below -->
  <rect x="305" y="320" width="30" height="30" rx="3" fill="#059669"/>
</svg>