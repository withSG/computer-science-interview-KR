<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DNS 캐시 계층과 조회 순서</title>
  <desc id="d">브라우저 캐시, OS 캐시/hosts, 라우터 캐시, ISP 재귀 리졸버 순으로 가까운 곳부터 확인하고, 모두 miss이면 재귀 리졸버가 Root 서버, TLD 서버(.com), 권한 있는 네임서버에 차례로 물어 최종 IP를 받는다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 머리: 요점 + 범례 -->
  <text x="40" y="36" font-size="16" font-weight="bold" fill="#111827">가까운 곳부터 확인 · 답이 나오면 즉시 반환</text>
  <rect x="478" y="23" width="16" height="16" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="502" y="36" font-size="15" fill="#374151">캐시 계층 (로컬/중계)</text>
  <rect x="674" y="23" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="698" y="36" font-size="15" fill="#374151">실제 DNS 조회</text>

  <!-- 1. 브라우저 캐시 -->
  <rect x="40" y="60" width="240" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="90" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">브라우저 캐시</text>
  <text x="304" y="90" font-size="16" fill="#374151"><tspan font-weight="bold" fill="#047857">있으면 종료</tspan> (0 RTT, 가장 빠름)</text>
  <line x1="160" y1="109" x2="160" y2="141" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="174" y="131" font-size="15" fill="#4b5563">miss</text>

  <!-- 2. OS 캐시/hosts -->
  <rect x="40" y="144" width="240" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="174" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">OS 캐시/hosts</text>
  <text x="304" y="174" font-size="16" fill="#374151">운영체제 리졸버 캐시</text>
  <line x1="160" y1="193" x2="160" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="174" y="215" font-size="15" fill="#4b5563">miss</text>

  <!-- 3. 라우터 캐시 -->
  <rect x="40" y="228" width="240" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="258" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">라우터 캐시</text>
  <text x="304" y="258" font-size="16" fill="#374151">가정/사내 공유기</text>
  <line x1="160" y1="277" x2="160" y2="309" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="174" y="299" font-size="15" fill="#4b5563">miss</text>

  <!-- 4. ISP 재귀 리졸버 -->
  <rect x="40" y="312" width="240" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="342" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">ISP 재귀 리졸버</text>
  <text x="304" y="342" font-size="16" font-weight="bold" fill="#6d28d9">여기서부터 실제 "조회"가 시작된다</text>

  <!-- miss → 재귀 리졸버가 세 서버에 차례로 질의 -->
  <path d="M160,361 V546" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="174" y="386" font-size="15" fill="#4b5563">miss</text>
  <line x1="160" y1="422" x2="221" y2="422" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-p)"/>
  <line x1="160" y1="484" x2="221" y2="484" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-p)"/>
  <line x1="160" y1="546" x2="221" y2="546" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-p)"/>

  <rect x="224" y="400" width="250" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="349" y="428" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Root 서버</text>
  <text x="496" y="428" font-size="16" fill="#374151">"com은 저기서 물어봐"</text>

  <rect x="224" y="462" width="250" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="349" y="490" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">TLD 서버(.com)</text>
  <text x="496" y="490" font-size="16" fill="#374151">"example.com은 저 네임서버가 안다"</text>

  <rect x="224" y="524" width="250" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="349" y="552" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">권한 있는 네임서버</text>
  <line x1="480" y1="546" x2="522" y2="546" stroke="#047857" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="532" y="552" font-size="17" font-weight="bold" fill="#047857">최종 IP 응답</text>
</svg>
