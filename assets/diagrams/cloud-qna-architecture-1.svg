<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">URL 단축 서비스 요구사항</title>
  <desc id="d">왼쪽은 기능적 요구사항 세 가지(URL 변환, 리다이렉트, 선택 기능), 오른쪽은 비기능적 요구사항 네 가지입니다. 월 1억 생성과 월 100억 리다이렉트에서 읽기:쓰기 = 100:1 비율이 나옵니다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>

  <!-- 기능적 요구사항 -->
  <rect x="24" y="24" width="380" height="282" rx="10" fill="#f5f8ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="48" y="62" font-size="19" font-weight="bold" fill="#1d4ed8">기능적 요구사항</text>
  <line x1="24" y1="80" x2="404" y2="80" stroke="#bfdbfe" stroke-width="1.5"/>

  <circle cx="50" cy="111" r="4" fill="#1d4ed8"/>
  <text x="64" y="117" font-size="16" fill="#1f2937">긴 URL → 짧은 URL 변환</text>
  <circle cx="50" cy="151" r="4" fill="#1d4ed8"/>
  <text x="64" y="157" font-size="16" fill="#1f2937">짧은 URL 접속 시 원본으로 리다이렉트</text>
  <circle cx="50" cy="191" r="4" fill="#1d4ed8"/>
  <text x="64" y="197" font-size="16" fill="#1f2937"><tspan fill="#4b5563">(선택)</tspan> 커스텀 alias, 만료 시간</text>

  <!-- 비기능적 요구사항 -->
  <rect x="428" y="24" width="428" height="282" rx="10" fill="#f3fbf7" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="452" y="62" font-size="19" font-weight="bold" fill="#047857">비기능적 요구사항</text>
  <line x1="428" y1="80" x2="856" y2="80" stroke="#a7f3d0" stroke-width="1.5"/>

  <circle cx="454" cy="111" r="4" fill="#047857"/>
  <text x="468" y="117" font-size="16" fill="#1f2937">월 <tspan font-weight="bold">1억</tspan> URL 생성 (쓰기)</text>
  <circle cx="454" cy="151" r="4" fill="#047857"/>
  <text x="468" y="157" font-size="16" fill="#1f2937">월 <tspan font-weight="bold">100억</tspan> 리다이렉트 (읽기)</text>

  <rect x="468" y="174" width="212" height="38" rx="19" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="486" y="199" font-size="16" font-weight="bold" fill="#92400e">→ 읽기:쓰기 = 100:1</text>

  <circle cx="454" cy="237" r="4" fill="#047857"/>
  <text x="468" y="243" font-size="16" fill="#1f2937">가용성 <tspan font-weight="bold">99.9%</tspan></text>
  <circle cx="454" cy="277" r="4" fill="#047857"/>
  <text x="468" y="283" font-size="16" fill="#1f2937">낮은 지연시간 (<tspan font-weight="bold">&lt; 100ms</tspan>)</text>
</svg>
