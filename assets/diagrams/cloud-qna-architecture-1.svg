<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">요구사항 정리</title>
  <desc id="d">URL 단축 서비스의 기능적 요구사항과 비기능적 요구사항을 나타낸 다이어그램입니다.</desc>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 메인 영역 박스 -->
  <rect x="24" y="24" width="832" height="342" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 제목 (문서 헤딩) -->
  <text x="44" y="59.6" font-size="16" font-weight="bold" fill="#1f2933">요구사항 정리</text>

  <!-- 구분선 -->
  <line x1="44" y1="74" x2="836" y2="74" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 좌측: 기능적 요구사항 카드 -->
  <g transform="translate(44, 94)">
    <!-- 카드 배경 -->
    <rect x="0" y="0" width="384" height="250" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <!-- 카드 헤더 -->
    <rect x="0" y="0" width="384" height="42" rx="6" fill="#2563eb"/>
    <rect x="0" y="36" width="384" height="6" fill="#2563eb"/>
    <text x="20" y="25.9" font-size="14" font-weight="bold" fill="#ffffff">기능적 요구사항:</text>

    <!-- 목록 항목 -->
    <text x="20" y="73.55" font-size="13" fill="#1f2933">- 긴 URL → 짧은 URL 변환</text>
    <text x="20" y="113.55" font-size="13" fill="#1f2933">- 짧은 URL 접속 시 원본으로 리다이렉트</text>
    <text x="20" y="153.55" font-size="13" fill="#1f2933">- (선택) 커스텀 alias, 만료 시간</text>
  </g>

  <!-- 우측: 비기능적 요구사항 카드 -->
  <g transform="translate(452, 94)">
    <!-- 카드 배경 -->
    <rect x="0" y="0" width="384" height="250" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <!-- 카드 헤더 -->
    <rect x="0" y="0" width="384" height="42" rx="6" fill="#059669"/>
    <rect x="0" y="36" width="384" height="6" fill="#059669"/>
    <text x="20" y="25.9" font-size="14" font-weight="bold" fill="#ffffff">비기능적 요구사항:</text>

    <!-- 목록 항목 -->
    <text x="20" y="73.55" font-size="13" fill="#1f2933">- 월 1억 URL 생성 (쓰기)</text>
    <text x="20" y="113.55" font-size="13" fill="#1f2933">- 월 100억 리다이렉트 (읽기) → 읽기:쓰기 = 100:1</text>
    <text x="20" y="153.55" font-size="13" fill="#1f2933">- 가용성 99.9%</text>
    <text x="20" y="193.55" font-size="13" fill="#1f2933">- 낮은 지연시간 (&lt; 100ms)</text>
  </g>
</svg>