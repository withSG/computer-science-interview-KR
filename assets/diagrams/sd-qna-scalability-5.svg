<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sticky Session 동작과 문제점</title>
  <desc id="d">LB가 같은 클라이언트의 요청을 항상 같은 서버로 보내는 Sticky Session의 두 가지 방법(쿠키 기반, IP 기반)과 문제점(서버 장애 시 세션 손실, 부하 불균형), 그리고 외부 세션 저장소(Redis) 권장을 보여줍니다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 요점 -->
  <text x="440" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">같은 클라이언트를 같은 서버로 라우팅</text>

  <!-- 라우팅 그림 -->
  <rect x="40" y="90" width="160" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="117" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">클라이언트 A</text>
  <rect x="40" y="150" width="160" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="120" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">클라이언트 B</text>

  <rect x="320" y="90" width="160" height="164" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="400" y="166" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">LB</text>
  <text x="400" y="190" text-anchor="middle" font-size="15" fill="#374151">(로드 밸런서)</text>

  <rect x="660" y="90" width="180" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="750" y="117" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Server 1</text>
  <rect x="660" y="150" width="180" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="750" y="177" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">Server 2</text>
  <rect x="660" y="210" width="180" height="44" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="750" y="237" text-anchor="middle" font-size="16" fill="#4b5563">Server 3</text>

  <line x1="200" y1="112" x2="314" y2="112" stroke="#1d4ed8" stroke-width="2"  marker-end="url(#arr-blue)"/>
  <text x="258" y="102" text-anchor="middle" font-size="15" fill="#1d4ed8">매 요청</text>
  <line x1="480" y1="112" x2="654" y2="112" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="567" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">항상 Server 1</text>

  <line x1="200" y1="172" x2="314" y2="172" stroke="#047857" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="258" y="162" text-anchor="middle" font-size="15" fill="#047857">매 요청</text>
  <line x1="480" y1="172" x2="654" y2="172" stroke="#047857" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="567" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">항상 Server 2</text>

  <!-- 방법 -->
  <rect x="40" y="290" width="390" height="200" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="322" font-size="18" font-weight="bold" fill="#111827">방법</text>
  <rect x="60" y="338" width="350" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="78" y="364" font-size="17" font-weight="bold" fill="#1f2937">1. 쿠키 기반</text>
  <text x="78" y="389" font-size="15" fill="#374151">LB가 세션 쿠키 삽입</text>
  <rect x="60" y="414" width="350" height="64" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="78" y="440" font-size="17" font-weight="bold" fill="#1f2937">2. IP 기반</text>
  <text x="78" y="465" font-size="15" fill="#374151">클라이언트 IP로 서버 결정</text>

  <!-- 문제점 -->
  <rect x="450" y="290" width="390" height="200" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="470" y="322" font-size="18" font-weight="bold" fill="#b91c1c">문제점</text>
  <rect x="470" y="338" width="350" height="64" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="488" y="376" font-size="17" fill="#1f2937">서버 장애 시 세션 손실</text>
  <rect x="470" y="414" width="350" height="64" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="488" y="452" font-size="17" fill="#1f2937">부하 불균형 가능</text>

  <!-- 권장 -->
  <line x1="645" y1="490" x2="645" y2="516" stroke="#047857" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="450" y="520" width="390" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="645" y="554" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">외부 세션 저장소 권장 (Redis)</text>
</svg>
