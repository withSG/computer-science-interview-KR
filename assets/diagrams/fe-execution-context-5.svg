<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">콜 스택 — 컨텍스트가 쌓이고 걷히는 과정</title>
  <desc id="d">시간 흐름에 따라 전역, first, second, third 실행 컨텍스트가 콜 스택에 푸시되고 팝되는 6단계 과정을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Timeline Top Header -->
  <path d="M40,30 L840,30" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="400" y="18" width="80" height="24" fill="#ffffff"/>
  <text x="440" y="34.2" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">시간 →</text>

  <!-- Step Column 1 -->
  <text x="90" y="70.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">①</text>
  <rect x="35" y="200" width="110" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="90" y="222.55" font-size="13" fill="#1f2933" text-anchor="middle">Global</text>
  <text x="90" y="260.55" font-size="11.5" fill="#52606d" text-anchor="middle">스크립트</text>
  <text x="90" y="278.55" font-size="11.5" fill="#52606d" text-anchor="middle">평가</text>

  <!-- Step Column 2 -->
  <text x="230" y="70.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">②</text>
  <rect x="175" y="160" width="110" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="230" y="182.55" font-size="13" fill="#1f2933" text-anchor="middle">first</text>
  <rect x="175" y="200" width="110" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="230" y="222.55" font-size="13" fill="#1f2933" text-anchor="middle">Global</text>
  <text x="230" y="260.55" font-size="11.5" fill="#52606d" text-anchor="middle">first 호출</text>

  <!-- Step Column 3 -->
  <text x="370" y="70.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">③</text>
  <rect x="315" y="120" width="110" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="370" y="142.55" font-size="13" fill="#1f2933" text-anchor="middle">second</text>
  <rect x="315" y="160" width="110" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="370" y="182.55" font-size="13" fill="#1f2933" text-anchor="middle">first</text>
  <rect x="315" y="200" width="110" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="370" y="222.55" font-size="13" fill="#1f2933" text-anchor="middle">Global</text>
  <text x="370" y="260.55" font-size="11.5" fill="#52606d" text-anchor="middle">second 호출</text>

  <!-- Step Column 4 -->
  <text x="510" y="70.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">④</text>
  <rect x="455" y="80" width="110" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="510" y="102.55" font-size="13" fill="#1f2933" text-anchor="middle">third</text>
  <rect x="455" y="120" width="110" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="510" y="142.55" font-size="13" fill="#1f2933" text-anchor="middle">second</text>
  <rect x="455" y="160" width="110" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="510" y="182.55" font-size="13" fill="#1f2933" text-anchor="middle">first</text>
  <rect x="455" y="200" width="110" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="510" y="222.55" font-size="13" fill="#1f2933" text-anchor="middle">Global</text>
  <text x="510" y="260.55" font-size="11.5" fill="#52606d" text-anchor="middle">third 호출</text>

  <!-- Step Column 5 -->
  <text x="650" y="70.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">⑤</text>
  <rect x="595" y="120" width="110" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="650" y="142.55" font-size="13" fill="#1f2933" text-anchor="middle">second</text>
  <rect x="595" y="160" width="110" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="650" y="182.55" font-size="13" fill="#1f2933" text-anchor="middle">first</text>
  <rect x="595" y="200" width="110" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="650" y="222.55" font-size="13" fill="#1f2933" text-anchor="middle">Global</text>
  <text x="650" y="260.55" font-size="11.5" fill="#52606d" text-anchor="middle">third 반환</text>

  <!-- Step Column 6 -->
  <text x="790" y="70.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">⑥</text>
  <rect x="735" y="160" width="110" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="790" y="182.55" font-size="13" fill="#1f2933" text-anchor="middle">first</text>
  <rect x="735" y="200" width="110" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="790" y="222.55" font-size="13" fill="#1f2933" text-anchor="middle">Global</text>
  <text x="790" y="260.55" font-size="11.5" fill="#52606d" text-anchor="middle">second 반환</text>

  <!-- Base Line for Call Stack floor -->
  <path d="M20,236 L860,236" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
</svg>