<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">콜 스택이 쌓이고 걷히는 과정</title>
  <desc id="d">시간 순서대로 스크립트 평가, first 호출, second 호출, third 호출 때 Global, first, second, third 컨텍스트가 콜 스택에 쌓이고, third 반환과 second 반환 때 위에서부터 걷힌다. 각 시점의 맨 위 컨텍스트가 현재 실행 중인 컨텍스트다.</desc>
  <defs>
    <marker id="ah-time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#ffffff"/>

  <!-- 시간 축 -->
  <text x="24" y="35" font-size="15" font-weight="bold" fill="#374151">시간</text>
  <line x1="68" y1="30" x2="846" y2="30" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah-time)"/>

  <!-- 단계 번호 -->
  <circle cx="94" cy="66" r="14" fill="#111827"/>
  <text x="94" y="71.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="232" cy="66" r="14" fill="#111827"/>
  <text x="232" y="71.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="370" cy="66" r="14" fill="#111827"/>
  <text x="370" y="71.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="508" cy="66" r="14" fill="#111827"/>
  <text x="508" y="71.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="646" cy="66" r="14" fill="#111827"/>
  <text x="646" y="71.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="784" cy="66" r="14" fill="#111827"/>
  <text x="784" y="71.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

  <!-- 스택 통 -->
  <path d="M34,92 L34,282 L154,282 L154,92" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <path d="M172,92 L172,282 L292,282 L292,92" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <path d="M310,92 L310,282 L430,282 L430,92" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <path d="M448,92 L448,282 L568,282 L568,92" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <path d="M586,92 L586,282 L706,282 L706,92" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <path d="M724,92 L724,282 L844,282 L844,92" fill="none" stroke="#9ca3af" stroke-width="2"/>

  <g font-size="17" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <!-- ① Global -->
    <rect x="42" y="236" width="104" height="40" rx="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="94" y="261.5" font-weight="bold" fill="#ffffff">Global</text>

    <!-- ② first / Global -->
    <rect x="180" y="190" width="104" height="40" rx="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="232" y="215.5" font-weight="bold" fill="#ffffff">first</text>
    <rect x="180" y="236" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="232" y="261.5" fill="#111827">Global</text>

    <!-- ③ second / first / Global -->
    <rect x="318" y="144" width="104" height="40" rx="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="370" y="169.5" font-weight="bold" fill="#ffffff">second</text>
    <rect x="318" y="190" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="370" y="215.5" fill="#111827">first</text>
    <rect x="318" y="236" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="370" y="261.5" fill="#111827">Global</text>

    <!-- ④ third / second / first / Global -->
    <rect x="456" y="98" width="104" height="40" rx="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="508" y="123.5" font-weight="bold" fill="#ffffff">third</text>
    <rect x="456" y="144" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="508" y="169.5" fill="#111827">second</text>
    <rect x="456" y="190" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="508" y="215.5" fill="#111827">first</text>
    <rect x="456" y="236" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="508" y="261.5" fill="#111827">Global</text>

    <!-- ⑤ second / first / Global -->
    <rect x="594" y="144" width="104" height="40" rx="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="646" y="169.5" font-weight="bold" fill="#ffffff">second</text>
    <rect x="594" y="190" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="646" y="215.5" fill="#111827">first</text>
    <rect x="594" y="236" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="646" y="261.5" fill="#111827">Global</text>

    <!-- ⑥ first / Global -->
    <rect x="732" y="190" width="104" height="40" rx="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="784" y="215.5" font-weight="bold" fill="#ffffff">first</text>
    <rect x="732" y="236" width="104" height="40" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="784" y="261.5" fill="#111827">Global</text>
  </g>

  <!-- 각 시점의 사건 -->
  <g font-size="16" text-anchor="middle" fill="#1f2937">
    <text x="94" y="310">스크립트 평가</text>
    <text x="232" y="310">first 호출</text>
    <text x="370" y="310">second 호출</text>
    <text x="508" y="310">third 호출</text>
    <text x="646" y="310">third 반환</text>
    <text x="784" y="310">second 반환</text>
  </g>

  <!-- 쌓임 / 걷힘 구간 -->
  <path d="M34,324 L34,332 L568,332 L568,324" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <text x="301" y="356" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">컨텍스트가 쌓임</text>
  <path d="M586,324 L586,332 L844,332 L844,324" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <text x="715" y="356" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">컨텍스트가 걷힘</text>

  <!-- 범례 -->
  <rect x="24" y="374" width="30" height="18" rx="3" fill="#1d4ed8"/>
  <text x="64" y="388" font-size="15" fill="#1f2937">스택 맨 위 = 현재 실행 중인 컨텍스트</text>
</svg>
