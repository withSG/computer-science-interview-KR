<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">병목 발생 위치</title>
  <desc id="d">Client에서 Disk까지 이어지는 흐름과 모든 구간이 병목 후보임을 나타내는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="210" fill="#ffffff"/>
  
  <!-- Outer Box (Main Container) -->
  <rect x="24" y="20" width="832" height="110" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <!-- Step 1: Client -->
  <rect x="44" y="45" width="90" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="89" y="80" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Client</text>
  
  <path d="M134,75 L166,75" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Step 2: Network -->
  <rect x="176" y="45" width="100" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="226" y="80" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Network</text>
  
  <path d="M276,75 L308,75" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Step 3: LB -->
  <rect x="318" y="45" width="70" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="353" y="80" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">LB</text>
  
  <path d="M388,75 L420,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Step 4: App -->
  <rect x="430" y="45" width="80" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="80" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">App</text>
  
  <path d="M510,75 L542,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Step 5: DB -->
  <rect x="552" y="45" width="70" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="587" y="80" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">DB</text>
  
  <path d="M622,75 L654,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Step 6: Disk -->
  <rect x="664" y="45" width="80" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="704" y="80" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Disk</text>

  <!-- Subtitle Text -->
  <text x="440" y="165" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">모든 구간이 병목 후보</text>
</svg>