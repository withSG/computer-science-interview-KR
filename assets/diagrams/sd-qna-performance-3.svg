<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">병목 발생 위치</title>
  <desc id="d">요청은 Client → Network → LB → App → DB → Disk 순서로 흐르며, 이 모든 구간이 병목 후보다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="190" fill="#ffffff"/>

  <!-- 요청 경로 -->
  <rect x="30" y="36" width="100" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="80" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2933">Client</text>
  <line x1="136" y1="66" x2="168" y2="66" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <rect x="174" y="36" width="100" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="224" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2933">Network</text>
  <line x1="280" y1="66" x2="312" y2="66" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <rect x="318" y="36" width="100" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="368" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2933">LB</text>
  <line x1="424" y1="66" x2="456" y2="66" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <rect x="462" y="36" width="100" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="512" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2933">App</text>
  <line x1="568" y1="66" x2="600" y2="66" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <rect x="606" y="36" width="100" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="656" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2933">DB</text>
  <line x1="712" y1="66" x2="744" y2="66" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <rect x="750" y="36" width="100" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="800" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2933">Disk</text>

  <!-- 전 구간을 묶는 괄호 -->
  <path d="M30,108 L30,118 L850,118 L850,108" fill="none" stroke="#b45309" stroke-width="2"/>
  <line x1="440" y1="118" x2="440" y2="130" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="#b45309">모든 구간이 병목 후보</text>
</svg>
