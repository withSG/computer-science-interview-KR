<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">내적·코사인·L2 거리 비교</title>
  <desc id="d">내적은 두 벡터의 크기와 각도를 함께 보고(크기 × 크기 × cos θ), 코사인은 각도만 보며, L2 거리는 두 점 사이 직선거리를 잽니다. 그래서 내적은 긴 문서가 유리해질 수 있고, 코사인은 문서 길이에 중립이며, L2는 크기 차이에 민감합니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 1열: 내적 -->
  <path d="M28,34 A10,10 0 0 1 38,24 H282 A10,10 0 0 1 292,34 V96 H28 Z" fill="#eff6ff"/>
  <line x1="28" y1="96" x2="292" y2="96" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="28" y1="268" x2="292" y2="268" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="28" y="24" width="264" height="328" rx="10" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="160" y="54" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">내적(Dot Product)</text>
  <text x="160" y="82" font-size="16" fill="#1f2937" text-anchor="middle">크기 × 크기 × cos θ</text>
  <line x1="76" y1="240" x2="242" y2="240" stroke="#1d4ed8" stroke-width="3" marker-end="url(#mb)"/>
  <line x1="76" y1="240" x2="168.7" y2="131.5" stroke="#1d4ed8" stroke-width="3" marker-end="url(#mb)"/>
  <path d="M116,240 A40,40 0 0 0 101.98,209.58" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="127" y="224" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">θ</text>
  <text x="62" y="246" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">O</text>
  <text x="254" y="246" font-size="16" font-weight="bold" fill="#1d4ed8">A</text>
  <text x="170" y="118" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">B</text>
  <text x="160" y="300" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">길이가 길수록 큰 값</text>
  <text x="160" y="328" font-size="15" fill="#374151" text-anchor="middle">→ 긴 문서가 유리해질 수 있음</text>

  <!-- 2열: 코사인 -->
  <path d="M308,34 A10,10 0 0 1 318,24 H562 A10,10 0 0 1 572,34 V96 H308 Z" fill="#ecfdf5"/>
  <line x1="308" y1="96" x2="572" y2="96" stroke="#6ee7b7" stroke-width="1.5"/>
  <line x1="308" y1="268" x2="572" y2="268" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="308" y="24" width="264" height="328" rx="10" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="440" y="54" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">코사인(Cosine)</text>
  <text x="440" y="82" font-size="16" fill="#1f2937" text-anchor="middle">cos θ</text>
  <path d="M356,240 L396,240 A40,40 0 0 0 381.98,209.58 Z" fill="#a7f3d0"/>
  <line x1="356" y1="240" x2="522" y2="240" stroke="#6b7280" stroke-width="2.5" marker-end="url(#mg)"/>
  <line x1="356" y1="240" x2="448.7" y2="131.5" stroke="#6b7280" stroke-width="2.5" marker-end="url(#mg)"/>
  <path d="M396,240 A40,40 0 0 0 381.98,209.58" fill="none" stroke="#047857" stroke-width="3"/>
  <text x="407" y="224" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">θ</text>
  <text x="342" y="246" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">O</text>
  <text x="534" y="246" font-size="16" font-weight="bold" fill="#374151">A</text>
  <text x="450" y="118" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">B</text>
  <text x="440" y="300" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">각도만 본다</text>
  <text x="440" y="328" font-size="15" fill="#374151" text-anchor="middle">→ 문서 길이에 중립</text>

  <!-- 3열: L2 거리 -->
  <path d="M588,34 A10,10 0 0 1 598,24 H842 A10,10 0 0 1 852,34 V96 H588 Z" fill="#f5f3ff"/>
  <line x1="588" y1="96" x2="852" y2="96" stroke="#c4b5fd" stroke-width="1.5"/>
  <line x1="588" y1="268" x2="852" y2="268" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="588" y="24" width="264" height="328" rx="10" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="720" y="54" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">L2 거리(Euclidean)</text>
  <text x="720" y="82" font-size="16" fill="#1f2937" text-anchor="middle">두 점 사이 직선거리</text>
  <line x1="636" y1="240" x2="794" y2="240" stroke="#6b7280" stroke-width="2.5" marker-end="url(#mg)"/>
  <line x1="636" y1="240" x2="723.5" y2="137.6" stroke="#6b7280" stroke-width="2.5" marker-end="url(#mg)"/>
  <line x1="734.5" y1="136.6" x2="799.5" y2="233.4" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="804" cy="240" r="5.5" fill="#6d28d9"/>
  <circle cx="730" cy="130" r="5.5" fill="#6d28d9"/>
  <text x="784" y="186" font-size="16" font-weight="bold" fill="#6d28d9">이 길이</text>
  <text x="622" y="246" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">O</text>
  <text x="816" y="246" font-size="16" font-weight="bold" fill="#374151">A</text>
  <text x="730" y="118" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">B</text>
  <text x="720" y="300" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">좌표 차이 그대로</text>
  <text x="720" y="328" font-size="15" fill="#374151" text-anchor="middle">→ 크기 차이에 민감</text>
</svg>
