<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TLS 1.3 핸드셰이크 흐름</title>
  <desc id="d">TLS 1.3에서는 ClientHello에 key_share(ECDHE 공개값)를 미리 넣어 한 번 왕복(1 RTT)으로 핸드셰이크가 끝난다. ServerHello 다음 메시지부터 이미 암호화되며, 클라이언트는 Finished와 함께 바로 데이터를 보낼 수 있다.</desc>
  <rect width="880" height="720" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 암호화 구간 배경 -->
  <rect x="40" y="290" width="576" height="356" fill="#ecfdf5"/>
  <line x1="40" y1="290" x2="616" y2="290" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 참여자 -->
  <rect x="50" y="24" width="140" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="120" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>
  <rect x="530" y="24" width="140" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="600" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>
  <line x1="120" y1="68" x2="120" y2="660" stroke="#9ca3af" stroke-width="2"/>
  <line x1="600" y1="68" x2="600" y2="660" stroke="#9ca3af" stroke-width="2"/>

  <!-- ClientHello -->
  <line x1="122" y1="110" x2="598" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="136" y="102" font-size="16" font-weight="bold" fill="#111827">ClientHello</text>
  <rect x="136" y="122" width="372" height="106" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="152" y="145" font-size="15" fill="#374151">· Cipher Suite 목록</text>
  <text x="152" y="168" font-size="15" fill="#374151">· <tspan font-weight="bold" fill="#1d4ed8">key_share</tspan> ← 서버가 고를 것 같은 곡선의</text>
  <text x="166" y="191" font-size="15" fill="#374151">ECDHE 공개값을 미리 넣어 보낸다</text>
  <text x="152" y="214" font-size="15" fill="#374151">· SNI</text>

  <!-- ServerHello -->
  <line x1="598" y1="266" x2="122" y2="266" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="584" y="258" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">ServerHello (key_share)</text>

  <!-- 암호화 시작 표시 -->
  <rect x="136" y="276" width="184" height="28" rx="14" fill="#047857"/>
  <text x="228" y="295" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">여기부터 이미 암호화</text>

  <!-- 서버의 암호화된 메시지 -->
  <line x1="598" y1="336" x2="122" y2="336" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="584" y="328" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">{EncryptedExtensions}</text>

  <line x1="598" y1="382" x2="122" y2="382" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="584" y="374" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">{Certificate}</text>

  <line x1="598" y1="428" x2="122" y2="428" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="584" y="420" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">{CertificateVerify}</text>

  <line x1="598" y1="474" x2="122" y2="474" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="584" y="466" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">{Finished}</text>

  <!-- 1 RTT -->
  <path d="M 624 110 H 640 V 474 H 624" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="654" y="288" font-size="20" font-weight="bold" fill="#1d4ed8">1 RTT</text>
  <text x="654" y="312" font-size="15" fill="#4b5563">(TLS 1.2는 2 RTT)</text>

  <!-- 클라이언트 Finished + 데이터 -->
  <line x1="122" y1="526" x2="598" y2="526" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="136" y="518" font-size="16" font-weight="bold" fill="#047857">{Finished}</text>

  <line x1="122" y1="580" x2="596" y2="580" stroke="#047857" stroke-width="4" marker-end="url(#ah-green)"/>
  <text x="136" y="570" font-size="16" font-weight="bold" fill="#047857">암호화 통신</text>
  <text x="136" y="606" font-size="15" fill="#374151">클라이언트는 Finished와 함께</text>
  <text x="136" y="628" font-size="15" fill="#374151">바로 데이터를 실어 보낼 수 있다</text>

  <!-- 범례 -->
  <line x1="40" y1="690" x2="84" y2="690" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="94" y="695" font-size="15" fill="#374151">평문 메시지</text>
  <line x1="200" y1="690" x2="244" y2="690" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="254" y="695" font-size="15" fill="#374151">암호화된 메시지 · {…}로 표기</text>
</svg>
