<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">공유 브랜치 rebase의 결과</title>
  <desc id="d">push해 동료가 받아 간 c2, c3를 내가 rebase해 c2', c3'로 바꾸고 force push하면, 동료 쪽에는 옛 c2, c3가 살아 있어 pull 때 같은 변경이 짝으로 남고 곳곳에서 충돌하며, 동료가 --force로 밀면 내 rebase 결과가 사라진다.</desc>
  <rect width="880" height="680" fill="#ffffff"/>

  <!-- 1) 출발 -->
  <rect x="24" y="20" width="832" height="172" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="54" cy="47" r="15" fill="#4b5563"/>
  <text x="54" y="53" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="80" y="53" font-size="18" font-weight="bold" fill="#111827">출발</text>

  <text x="64" y="106" font-size="16" font-weight="bold" fill="#111827">나</text>
  <line x1="212" y1="100" x2="268" y2="100" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="312" y1="100" x2="368" y2="100" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="190" cy="100" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="190" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="290" cy="100" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="290" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c2</text>
  <circle cx="390" cy="100" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c3</text>
  <text x="440" y="106" font-size="15" fill="#374151">(feature, push 완료)</text>

  <text x="64" y="162" font-size="16" font-weight="bold" fill="#111827">동료</text>
  <line x1="212" y1="156" x2="268" y2="156" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="312" y1="156" x2="368" y2="156" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="190" cy="156" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="190" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="290" cy="156" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="290" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c2</text>
  <circle cx="390" cy="156" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c3</text>
  <text x="440" y="162" font-size="15" fill="#374151">(pull 받아둠)</text>

  <!-- 2) 내가 rebase + force push -->
  <rect x="24" y="208" width="832" height="116" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="54" cy="235" r="15" fill="#b45309"/>
  <text x="54" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="80" y="241" font-size="18" font-weight="bold" fill="#111827">내가 rebase + force push</text>

  <text x="64" y="292" font-size="16" font-weight="bold" fill="#111827">나</text>
  <line x1="212" y1="286" x2="268" y2="286" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="312" y1="286" x2="368" y2="286" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="190" cy="286" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="190" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="290" cy="286" r="22" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="290" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">c2'</text>
  <circle cx="390" cy="286" r="22" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="390" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">c3'</text>
  <text x="440" y="292" font-size="16" font-weight="bold" fill="#b45309">원격도 이 상태로 덮어씀</text>

  <!-- 3) 동료가 작업을 얹고 push 시도 -->
  <rect x="24" y="340" width="832" height="320" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="54" cy="367" r="15" fill="#b91c1c"/>
  <text x="54" y="373" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="80" y="373" font-size="18" font-weight="bold" fill="#111827">동료가 작업을 얹고 push 시도</text>

  <text x="64" y="424" font-size="16" font-weight="bold" fill="#111827">동료</text>
  <line x1="212" y1="418" x2="268" y2="418" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="312" y1="418" x2="368" y2="418" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="412" y1="418" x2="468" y2="418" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="190" cy="418" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="190" y="424" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="290" cy="418" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="290" y="424" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c2</text>
  <circle cx="390" cy="418" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="390" y="424" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c3</text>
  <circle cx="490" cy="418" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="490" y="424" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">c7</text>

  <!-- 옛 c2, c3 괄호 -->
  <path d="M 268 448 L 268 456 L 412 456 L 412 448" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="340" y="480" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">옛 c2, c3가 살아 있다</text>

  <!-- pull 하면 -->
  <rect x="48" y="498" width="784" height="146" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="72" y="528" font-size="16" font-weight="bold" fill="#111827">pull 하면 Git은 두 히스토리를 합치려 든다</text>
  <text x="72" y="562" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#b91c1c">→ </tspan><tspan font-weight="bold">c2/c2', c3/c3'</tspan> 처럼 같은 변경을 담은 커밋이 짝으로 남고</text>
  <text x="72" y="594" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#b91c1c">→ </tspan>같은 변경이 두 번 적용되며 곳곳에서 충돌하고</text>
  <text x="72" y="626" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#b91c1c">→ </tspan>동료가 <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">--force</tspan>로 밀면 내 rebase 결과가 사라진다</text>
</svg>
