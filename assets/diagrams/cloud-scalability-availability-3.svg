<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SPOF 찾기</title>
  <desc id="d">요청 경로 상의 주요 구성 요소들과 잠재적 단일 장애점(SPOF)을 점검하기 위한 질문 리스트 다이어그램</desc>
  <rect width="880" height="730" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 1. 사용자 -->
  <rect x="30" y="30" width="220" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자</text>

  <!-- Vertical Main Flow Arrows -->
  <path d="M140,70 L140,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M140,140 L140,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M140,210 L140,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M140,280 L140,310" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M140,350 L140,380" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M140,420 L140,450" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M140,490 L140,520" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Horizontal Dash Connectors -->
  <line x1="250" y1="120" x2="280" y2="120" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="250" y1="190" x2="280" y2="190" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="250" y1="260" x2="280" y2="260" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="250" y1="330" x2="280" y2="330" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="250" y1="400" x2="280" y2="400" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="250" y1="470" x2="280" y2="470" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="250" y1="540" x2="280" y2="540" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Main Flow Nodes (1) to (7) -->
  <!-- (1) DNS -->
  <rect x="30" y="100" width="220" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="140" y="125" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(1) DNS</text>
  <rect x="280" y="100" width="570" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="295" y="124.6" font-size="13" fill="#1f2933">네임서버가 한 곳? 존 파일 실수 시 되돌릴 수 있나?</text>

  <!-- (2) CDN / WAF -->
  <rect x="30" y="170" width="220" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="140" y="195" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(2) CDN / WAF</text>
  <rect x="280" y="170" width="570" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="295" y="194.6" font-size="13" fill="#1f2933">우회 경로가 있나? 인증서 만료일은 감시 중인가?</text>

  <!-- (3) 로드 밸런서 -->
  <rect x="30" y="240" width="220" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="140" y="265" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(3) 로드 밸런서</text>
  <rect x="280" y="240" width="570" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="295" y="264.6" font-size="13" fill="#1f2933">여러 AZ에 노드가 배치돼 있나?</text>

  <!-- (4) 애플리케이션 -->
  <rect x="30" y="310" width="220" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="140" y="335" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(4) 애플리케이션</text>
  <rect x="280" y="310" width="570" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="295" y="334.6" font-size="13" fill="#1f2933">2대 이상인가? 서로 다른 AZ인가? 같은 이미지인가?</text>

  <!-- (5) 캐시 -->
  <rect x="30" y="380" width="220" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="140" y="405" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(5) 캐시</text>
  <rect x="280" y="380" width="570" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="295" y="404.6" font-size="13" fill="#1f2933">캐시가 죽으면 트래픽이 전부 DB로 몰리지 않나?</text>

  <!-- (6) 데이터베이스 -->
  <rect x="30" y="450" width="220" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="140" y="475" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(6) 데이터베이스</text>
  <rect x="280" y="450" width="570" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="295" y="474.6" font-size="13" fill="#1f2933">단일 인스턴스인가? 자동 승격되나? 승격 시간은?</text>

  <!-- (7) 파일/객체 저장소 -->
  <rect x="30" y="520" width="220" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="140" y="545" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(7) 파일/객체 저장소</text>
  <rect x="280" y="520" width="570" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="295" y="544.6" font-size="13" fill="#1f2933">한 AZ에만 있나?</text>

  <!-- Line connecting main flow to (8) -->
  <path d="M140,560 L140,630 L200,630" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <!-- (8) 경로 밖에 숨은 것들 -->
  <rect x="200" y="585" width="650" height="115" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="220" y="613" font-size="14" font-weight="bold" fill="#dc2626">(8) 경로 밖에 숨은 것들</text>
  <text x="240" y="640" font-size="13" font-weight="bold" fill="#1f2933">배포 파이프라인 / 시크릿 저장소 / 내부 인증 서버 / NAT 게이트웨이</text>
  
  <path d="M240,665 L255,665" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="265" y="669" font-size="12.5" fill="#52606d">평소엔 안 보이지만 죽으면 복구 작업 자체를 못 한다</text>
</svg>