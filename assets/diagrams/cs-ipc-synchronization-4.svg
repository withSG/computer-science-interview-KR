<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">두 가지 대기 방식</title>
  <desc id="d">블로킹 락과 스핀락의 대기 방식을 비교하는 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title / Heading -->
  <text x="30" y="35" font-size="16" font-weight="bold" fill="#1f2933">두 가지 대기 방식</text>

  <!-- SECTION 1: 블로킹 락 (뮤텍스) -->
  <rect x="24" y="55" width="832" height="165" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="83.9" font-size="14" font-weight="bold" fill="#1e40af">블로킹 락 (뮤텍스)</text>

  <!-- Row 1: 락 실패 -> 스레드를 Waiting 상태로 -> CPU를 다른 스레드에 양보 -->
  <!-- Box 1-1: 락 실패 -->
  <rect x="44" y="100" width="90" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="89" y="122.55" font-size="13" text-anchor="middle" fill="#1f2933">락 실패</text>

  <!-- Arrow 1-1 -> 1-2 -->
  <path d="M134,118 L158,118" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Box 1-2: 스레드를 Waiting 상태로 -->
  <rect x="166" y="100" width="180" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="256" y="122.55" font-size="13" text-anchor="middle" fill="#1f2933">스레드를 Waiting 상태로</text>

  <!-- Arrow 1-2 -> 1-3 -->
  <path d="M346,118 L370,118" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Box 1-3: CPU를 다른 스레드에 양보 -->
  <rect x="378" y="100" width="200" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="478" y="122.55" font-size="13" text-anchor="middle" fill="#1f2933">CPU를 다른 스레드에 양보</text>

  <!-- Connector Line from Row 1 to Row 2 -->
  <path d="M478,136 L478,150 L89,150 L89,160" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#a-blue)"/>

  <!-- Row 2: 락이 풀리면 커널이 깨움 -> Ready -> 실행 -->
  <!-- Box 1-4: 락이 풀리면 커널이 깨움 -->
  <rect x="44" y="162" width="180" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="134" y="184.55" font-size="13" text-anchor="middle" fill="#1f2933">락이 풀리면 커널이 깨움</text>

  <!-- Arrow 1-4 -> 1-5 -->
  <path d="M224,180 L248,180" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Box 1-5: Ready -->
  <rect x="256" y="162" width="75" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="293.5" y="184.55" font-size="13" text-anchor="middle" fill="#1f2933">Ready</text>

  <!-- Arrow 1-5 -> 1-6 -->
  <path d="M331,180 L355,180" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Box 1-6: 실행 -->
  <rect x="363" y="162" width="65" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="395.5" y="184.55" font-size="13" text-anchor="middle" fill="#1f2933">실행</text>

  <!-- Tag 1: [컨텍스트 스위칭 2회] -->
  <rect x="448" y="165" width="170" height="30" rx="15" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="533" y="184.025" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#dc2626">[컨텍스트 스위칭 2회]</text>


  <!-- SECTION 2: 스핀락 (spinlock) -->
  <rect x="24" y="240" width="832" height="165" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="44" y="268.9" font-size="14" font-weight="bold" fill="#b45309">스핀락 (spinlock)</text>

  <!-- Row 1: 락 실패 -> while (락이 잡혀있음) { 계속 확인 }  <- busy waiting -->
  <!-- Box 2-1: 락 실패 -->
  <rect x="44" y="285" width="90" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="89" y="307.55" font-size="13" text-anchor="middle" fill="#1f2933">락 실패</text>

  <!-- Arrow 2-1 -> 2-2 -->
  <path d="M134,303 L158,303" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- Box 2-2: while (락이 잡혀있음) { 계속 확인 } -->
  <rect x="166" y="285" width="290" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="311" y="307.55" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">while (락이 잡혀있음) { 계속 확인 }</text>

  <!-- Loop Arrow on Box 2-2 for busy waiting -->
  <path d="M420,285 C420,268 440,268 440,285 C440,295 432,298 426,298" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/>

  <!-- Tag / Label: <- busy waiting -->
  <rect x="466" y="290" width="110" height="26" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="521" y="307.025" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#d97706">&lt;─ busy waiting</text>

  <!-- Connector Line from Row 1 to Row 2 in Spinlock -->
  <path d="M311,321 L311,338 L89,338 L89,347" stroke="#d97706" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#a-orange)"/>

  <!-- Row 2: 락이 풀리는 순간 즉시 진입 -->
  <!-- Box 2-3: 락이 풀리는 순간 즉시 진입 -->
  <rect x="44" y="349" width="210" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="149" y="371.55" font-size="13" text-anchor="middle" fill="#1f2933">락이 풀리는 순간 즉시 진입</text>

  <!-- Tag 2: [기다리는 동안 CPU 100%] -->
  <rect x="274" y="352" width="190" height="30" rx="15" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="369" y="371.025" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#dc2626">[기다리는 동안 CPU 100%]</text>

</svg>