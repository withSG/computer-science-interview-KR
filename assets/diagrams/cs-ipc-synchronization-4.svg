<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">블로킹 락과 스핀락의 대기 방식</title>
  <desc id="d">블로킹 락(뮤텍스)은 락 실패 시 스레드를 Waiting 상태로 두고 CPU를 양보했다가 락이 풀리면 커널이 깨워 Ready를 거쳐 실행하므로 컨텍스트 스위칭이 2회 든다. 스핀락은 while 루프로 계속 확인하는 busy waiting을 하다가 락이 풀리는 순간 즉시 진입하므로 기다리는 동안 CPU를 100% 쓴다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 왼쪽: 블로킹 락 -->
  <rect x="24" y="24" width="404" height="492" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="226" y="58" font-size="19" font-weight="700" fill="#1e3a8a" text-anchor="middle">블로킹 락 (뮤텍스)</text>

  <rect x="56" y="76" width="340" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="226" y="102" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">락 실패</text>
  <line x1="226" y1="118" x2="226" y2="138" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="56" y="140" width="340" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="166" font-size="16" fill="#111827" text-anchor="middle">스레드를 <tspan font-weight="700">Waiting</tspan> 상태로</text>
  <line x1="226" y1="182" x2="226" y2="202" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="56" y="204" width="340" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="230" font-size="16" fill="#111827" text-anchor="middle">CPU를 다른 스레드에 양보</text>
  <line x1="226" y1="246" x2="226" y2="266" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="56" y="268" width="340" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="294" font-size="16" fill="#111827" text-anchor="middle">락이 풀리면 커널이 깨움</text>
  <line x1="226" y1="310" x2="226" y2="330" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="56" y="332" width="340" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="358" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Ready</text>
  <line x1="226" y1="374" x2="226" y2="394" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="56" y="396" width="340" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="226" y="422" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">실행</text>

  <rect x="96" y="458" width="260" height="38" rx="19" fill="#1d4ed8"/>
  <text x="226" y="483" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">컨텍스트 스위칭 2회</text>

  <!-- 오른쪽: 스핀락 -->
  <rect x="452" y="24" width="404" height="492" rx="12" fill="#fffdf7" stroke="#e5c89a" stroke-width="1.5"/>
  <text x="654" y="58" font-size="19" font-weight="700" fill="#92400e" text-anchor="middle">스핀락 (spinlock)</text>

  <rect x="484" y="76" width="340" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="654" y="102" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">락 실패</text>
  <line x1="654" y1="118" x2="654" y2="138" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="484" y="140" width="340" height="232" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="654" y="206" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">busy waiting</text>
  <text font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <tspan x="512" y="254">while (락이 잡혀있음) {</tspan>
    <tspan x="544" y="282">계속 확인</tspan>
    <tspan x="512" y="310">}</tspan>
  </text>
  <path d="M760,310 A30,30 0 0 0 760,250" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arO)"/>
  <line x1="654" y1="374" x2="654" y2="394" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="484" y="396" width="340" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="654" y="422" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">락이 풀리는 순간 즉시 진입</text>

  <rect x="514" y="458" width="280" height="38" rx="19" fill="#b45309"/>
  <text x="654" y="483" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">기다리는 동안 CPU 100%</text>
</svg>
