<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AWS 3-tier HA 아키텍처</title>
  <desc id="d">Internet 트래픽이 ALB(Load Balancer)를 거쳐 AZ-a, AZ-b, AZ-c에 하나씩 있는 EC2-1~3으로 분산되고, EC2들은 RDS (Multi-AZ)에 연결된다. 다중 인스턴스, 다중 AZ, DB 이중화로 각 계층을 이중화한 구성이다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 계층 띠 -->
  <rect x="24" y="92" width="832" height="88" rx="10" fill="#f8fafc"/>
  <rect x="24" y="212" width="832" height="154" rx="10" fill="#f8fafc"/>
  <rect x="24" y="398" width="832" height="88" rx="10" fill="#f8fafc"/>

  <!-- 왼쪽: 계층 이름 -->
  <text x="40" y="141" font-size="15" font-weight="bold" fill="#1d4ed8">로드 밸런서 (ALB)</text>
  <text x="40" y="294" font-size="15" font-weight="bold" fill="#b45309">EC2 Compute 계층</text>
  <text x="40" y="447" font-size="15" font-weight="bold" fill="#6d28d9">Database 계층</text>

  <!-- Internet -->
  <rect x="358" y="24" width="140" height="40" rx="20" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="428" y="50" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Internet</text>
  <path d="M428,64 L428,106" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- ALB -->
  <rect x="348" y="110" width="160" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="428" y="143" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ALB</text>

  <!-- AZ 영역 -->
  <rect x="192" y="226" width="144" height="126" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="356" y="226" width="144" height="126" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="520" y="226" width="144" height="126" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="204" y="250" font-size="15" font-weight="bold" fill="#374151">AZ-a</text>
  <text x="368" y="250" font-size="15" font-weight="bold" fill="#374151">AZ-b</text>
  <text x="532" y="250" font-size="15" font-weight="bold" fill="#374151">AZ-c</text>

  <!-- ALB → EC2 분배 -->
  <path d="M428,162 L428,196" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M264,196 L592,196" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M264,196 L264,262" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M428,196 L428,262" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M592,196 L592,262" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- EC2 -->
  <rect x="208" y="266" width="112" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="264" y="305" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">EC2-1</text>
  <rect x="372" y="266" width="112" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="428" y="305" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">EC2-2</text>
  <rect x="536" y="266" width="112" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="592" y="305" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">EC2-3</text>

  <!-- EC2 → RDS 취합 -->
  <path d="M264,330 L264,382" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M428,330 L428,382" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M592,330 L592,382" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M264,382 L592,382" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M428,382 L428,412" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- RDS -->
  <rect x="318" y="416" width="220" height="52" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="428" y="449" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">RDS (Multi-AZ)</text>

  <!-- 오른쪽: 설명 -->
  <text x="688" y="142" font-size="15" fill="#374151">← Load Balancer</text>
  <text x="688" y="250" font-size="15" font-weight="bold" fill="#047857">← 다중 AZ</text>
  <text x="688" y="304" font-size="15" font-weight="bold" fill="#047857">← 다중 인스턴스</text>
  <text x="688" y="448" font-size="15" font-weight="bold" fill="#047857">← DB 이중화</text>
</svg>
