<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파이프라인 표준 순서</title>
  <desc id="d">파이프라인은 빌드(컴파일, 의존성 해결, 약 1분), 테스트(단위, 통합, E2E, 약 5분), 정적 분석(린트, 취약점, 커버리지, 약 2분), 아티팩트(이미지, 레지스트리, 버전 태깅, 약 2분), 배포(스테이징, 운영, 수 분) 순서로 진행한다. 어느 단계에서 실패하면 뒤 단계는 아예 실행하지 않는다(fail fast).</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- ① 빌드 -->
  <rect x="24" y="28" width="144" height="208" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M24.75,72 V38 Q24.75,28.75 34,28.75 H158 Q167.25,28.75 167.25,38 V72 Z" fill="#dbeafe"/>
  <line x1="24" y1="72" x2="168" y2="72" stroke="#2563eb" stroke-width="1"/>
  <text x="96" y="57" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">① 빌드</text>
  <text x="96" y="110" font-size="16" fill="#111827" text-anchor="middle">컴파일</text>
  <text x="96" y="138" font-size="16" fill="#111827" text-anchor="middle">의존성 해결</text>
  <line x1="40" y1="192" x2="152" y2="192" stroke="#bfdbfe" stroke-width="1"/>
  <text x="96" y="220" font-size="16" fill="#374151" text-anchor="middle">소요 <tspan font-weight="bold" fill="#111827">~1분</tspan></text>

  <line x1="168" y1="132" x2="194" y2="132" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ② 테스트 -->
  <rect x="196" y="28" width="144" height="208" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M196.75,72 V38 Q196.75,28.75 206,28.75 H330 Q339.25,28.75 339.25,38 V72 Z" fill="#dbeafe"/>
  <line x1="196" y1="72" x2="340" y2="72" stroke="#2563eb" stroke-width="1"/>
  <text x="268" y="57" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">② 테스트</text>
  <text x="268" y="110" font-size="16" fill="#111827" text-anchor="middle">단위</text>
  <text x="268" y="138" font-size="16" fill="#111827" text-anchor="middle">통합</text>
  <text x="268" y="166" font-size="16" fill="#111827" text-anchor="middle">E2E</text>
  <line x1="212" y1="192" x2="324" y2="192" stroke="#bfdbfe" stroke-width="1"/>
  <text x="268" y="220" font-size="16" fill="#374151" text-anchor="middle">소요 <tspan font-weight="bold" fill="#111827">~5분</tspan></text>

  <line x1="340" y1="132" x2="366" y2="132" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ③ 정적 분석 -->
  <rect x="368" y="28" width="144" height="208" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M368.75,72 V38 Q368.75,28.75 378,28.75 H502 Q511.25,28.75 511.25,38 V72 Z" fill="#dbeafe"/>
  <line x1="368" y1="72" x2="512" y2="72" stroke="#2563eb" stroke-width="1"/>
  <text x="440" y="57" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">③ 정적 분석</text>
  <text x="440" y="110" font-size="16" fill="#111827" text-anchor="middle">린트</text>
  <text x="440" y="138" font-size="16" fill="#111827" text-anchor="middle">취약점</text>
  <text x="440" y="166" font-size="16" fill="#111827" text-anchor="middle">커버리지</text>
  <line x1="384" y1="192" x2="496" y2="192" stroke="#bfdbfe" stroke-width="1"/>
  <text x="440" y="220" font-size="16" fill="#374151" text-anchor="middle">소요 <tspan font-weight="bold" fill="#111827">~2분</tspan></text>

  <line x1="512" y1="132" x2="538" y2="132" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ④ 아티팩트 -->
  <rect x="540" y="28" width="144" height="208" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M540.75,72 V38 Q540.75,28.75 550,28.75 H674 Q683.25,28.75 683.25,38 V72 Z" fill="#dbeafe"/>
  <line x1="540" y1="72" x2="684" y2="72" stroke="#2563eb" stroke-width="1"/>
  <text x="612" y="57" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">④ 아티팩트</text>
  <text x="612" y="110" font-size="16" fill="#111827" text-anchor="middle">이미지</text>
  <text x="612" y="138" font-size="16" fill="#111827" text-anchor="middle">레지스트리</text>
  <text x="612" y="166" font-size="16" fill="#111827" text-anchor="middle">버전 태깅</text>
  <line x1="556" y1="192" x2="668" y2="192" stroke="#bfdbfe" stroke-width="1"/>
  <text x="612" y="220" font-size="16" fill="#374151" text-anchor="middle">소요 <tspan font-weight="bold" fill="#111827">~2분</tspan></text>

  <line x1="684" y1="132" x2="710" y2="132" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ⑤ 배포 -->
  <rect x="712" y="28" width="144" height="208" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M712.75,72 V38 Q712.75,28.75 722,28.75 H846 Q855.25,28.75 855.25,38 V72 Z" fill="#dbeafe"/>
  <line x1="712" y1="72" x2="856" y2="72" stroke="#2563eb" stroke-width="1"/>
  <text x="784" y="57" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">⑤ 배포</text>
  <text x="784" y="110" font-size="16" fill="#111827" text-anchor="middle">스테이징</text>
  <text x="784" y="138" font-size="16" fill="#111827" text-anchor="middle">운영</text>
  <line x1="728" y1="192" x2="840" y2="192" stroke="#bfdbfe" stroke-width="1"/>
  <text x="784" y="220" font-size="16" fill="#374151" text-anchor="middle">소요 <tspan font-weight="bold" fill="#111827">~수 분</tspan></text>

  <!-- fail fast -->
  <line x1="96" y1="236" x2="96" y2="282" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="268" y1="236" x2="268" y2="282" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="440" y1="236" x2="440" y2="282" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="612" y1="236" x2="612" y2="282" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="784" y1="236" x2="784" y2="282" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="24" y="284" width="832" height="58" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="319" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기서 실패하면 뒤 단계는 아예 실행하지 않는다 (fail fast)</text>
</svg>
