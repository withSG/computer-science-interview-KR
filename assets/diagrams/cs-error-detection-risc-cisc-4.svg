<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">경계는 이미 흐려졌다 — 현대 x86-64 CPU 내부</title>
  <desc id="d">x86 기계어가 디코더를 거쳐 내부 μop로 변환된 후 비순차 실행 엔진에서 RISC 방식으로 처리되는 현대 x86-64 CPU 내부 구조도</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 구역 배경 (현대 x86-64 CPU 내부) -->
  <rect x="24" y="24" width="832" height="292" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="44" y="52" font-size="16" font-weight="bold" fill="#1f2933">현대 x86-64 CPU 내부</text>

  <!-- 1. x86 기계어 (입력 요소) -->
  <rect x="44" y="90" width="180" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="134" y="118" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">x86 기계어</text>
  <text x="134" y="139" font-size="11.5" fill="#52606d" text-anchor="middle">(가변 길이, 복잡)</text>

  <!-- 화살표 1: x86 기계어 -> 디코더 -->
  <path d="M224,125 L284,125" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 2. 디코더 (변환) -->
  <rect x="284" y="90" width="130" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="349" y="130" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">디코더</text>

  <!-- 화살표 2: 디코더 -> 내부 μop -->
  <path d="M414,125 L474,125" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 3. 내부 μop(마이크로 연산) (중간 결과물) -->
  <rect x="474" y="90" width="362" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="655" y="118" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">내부 μop(마이크로 연산)</text>
  <text x="655" y="139" font-size="11.5" fill="#52606d" text-anchor="middle">고정 형식, 단순, 파이프라인 친화</text>

  <!-- 화살표 3: 내부 μop -> 비순차 실행 엔진 -->
  <path d="M655,160 L655,200" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 4. 비순차 실행 엔진 (실행 및 RISC 특성) -->
  <rect x="430" y="200" width="280" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="570" y="228" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">비순차 실행 엔진</text>
  <text x="570" y="250" font-size="11.5" fill="#52606d" text-anchor="middle">(레지스터 리네이밍,</text>
  <text x="570" y="268" font-size="11.5" fill="#52606d" text-anchor="middle">슈퍼스칼라 발행)</text>

  <!-- 주석 라벨: ← 사실상 RISC 스타일 -->
  <rect x="718" y="234" width="128" height="22" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <path d="M718,245 L726,245" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="732" y="249" font-size="11.5" font-weight="bold" fill="#1f2933">사실상 RISC 스타일</text>
</svg>