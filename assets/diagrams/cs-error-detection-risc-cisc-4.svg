<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">현대 x86-64 CPU 내부</title>
  <desc id="d">가변 길이의 복잡한 x86 기계어가 디코더를 거쳐 고정 형식의 단순한 내부 μop(마이크로 연산)으로 바뀌고, 사실상 RISC 스타일인 비순차 실행 엔진(레지스터 리네이밍, 슈퍼스칼라 발행)에서 실행됩니다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- CPU 내부 틀 -->
  <rect x="24" y="24" width="832" height="272" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#111827">현대 x86-64 CPU 내부</text>

  <!-- 1. x86 기계어 -->
  <rect x="44" y="80" width="170" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="129" y="130" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">x86 기계어</text>
  <text x="129" y="158" font-size="15" fill="#374151" text-anchor="middle">(가변 길이, 복잡)</text>

  <line x1="218" y1="140" x2="250" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2. 디코더 -->
  <rect x="256" y="80" width="130" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="321" y="145" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">디코더</text>

  <line x1="390" y1="140" x2="422" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3. 내부 μop -->
  <rect x="428" y="80" width="190" height="120" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="523" y="112" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">내부 μop</text>
  <text x="523" y="135" font-size="15" fill="#374151" text-anchor="middle">(마이크로 연산)</text>
  <text x="523" y="162" font-size="15" fill="#374151" text-anchor="middle">고정 형식, 단순,</text>
  <text x="523" y="183" font-size="15" fill="#374151" text-anchor="middle">파이프라인 친화</text>

  <line x1="622" y1="140" x2="654" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4. 비순차 실행 엔진 -->
  <rect x="660" y="80" width="180" height="120" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="750" y="120" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">비순차 실행 엔진</text>
  <text x="750" y="148" font-size="15" fill="#374151" text-anchor="middle">(레지스터 리네이밍,</text>
  <text x="750" y="170" font-size="15" fill="#374151" text-anchor="middle">슈퍼스칼라 발행)</text>

  <!-- 태그: 겉면 / 사실상 RISC -->
  <line x1="129" y1="238" x2="129" y2="206" stroke="#b45309" stroke-width="2" marker-end="url(#ar-amber)"/>
  <rect x="44" y="240" width="232" height="36" rx="18" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="264" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">CISC 겉면: 명령어 세트(ISA)</text>

  <line x1="750" y1="238" x2="750" y2="206" stroke="#047857" stroke-width="2" marker-end="url(#ar-green)"/>
  <rect x="660" y="240" width="180" height="36" rx="18" fill="#047857"/>
  <text x="750" y="264" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">사실상 RISC 스타일</text>
</svg>
