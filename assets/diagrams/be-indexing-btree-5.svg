<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컬럼별 카디널리티 비교</title>
  <desc id="d">100만 행인 member 테이블에서 컬럼별 서로 다른 값의 개수를 로그 눈금 막대로 비교합니다. gender 는 2종류로 카디널리티 낮음, city 는 200종류로 중간, email 은 100만 종류로 카디널리티 높음입니다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>

  <text x="24" y="46" font-size="18" font-weight="bold" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">member</tspan> 테이블 100만 행</text>

  <!-- 눈금선 -->
  <line x1="176.0" y1="72" x2="176.0" y2="282" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="249.3" y1="72" x2="249.3" y2="282" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="322.7" y1="72" x2="322.7" y2="282" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="396.0" y1="72" x2="396.0" y2="282" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="469.3" y1="72" x2="469.3" y2="282" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="542.7" y1="72" x2="542.7" y2="282" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="616.0" y1="72" x2="616.0" y2="282" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 막대 -->
  <text x="24" y="103" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">gender</text>
  <text x="24" y="125" font-size="15" fill="#4b5563">값이 2종류</text>
  <rect x="176" y="91" width="22.1" height="30" rx="3" fill="#dc2626"/>
  <rect x="656" y="88" width="200" height="36" rx="18" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="756" y="112" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">카디널리티 낮음</text>
  <text x="24" y="171" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">city</text>
  <text x="24" y="193" font-size="15" fill="#4b5563">값이 200종류</text>
  <rect x="176" y="159" width="168.7" height="30" rx="3" fill="#d97706"/>
  <rect x="656" y="156" width="200" height="36" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="756" y="180" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">중간</text>
  <text x="24" y="239" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">email</text>
  <text x="24" y="261" font-size="15" fill="#4b5563">값이 100만 종류</text>
  <rect x="176" y="227" width="440.0" height="30" rx="3" fill="#059669"/>
  <rect x="656" y="224" width="200" height="36" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="756" y="248" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">카디널리티 높음</text>

  <!-- 축 -->
  <line x1="176" y1="282" x2="616" y2="282" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="176.0" y1="282" x2="176.0" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="176.0" y="306" font-size="14" fill="#374151" text-anchor="middle">1</text>
  <line x1="249.3" y1="282" x2="249.3" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="249.3" y="306" font-size="14" fill="#374151" text-anchor="middle">10</text>
  <line x1="322.7" y1="282" x2="322.7" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="322.7" y="306" font-size="14" fill="#374151" text-anchor="middle">100</text>
  <line x1="396.0" y1="282" x2="396.0" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="396.0" y="306" font-size="14" fill="#374151" text-anchor="middle">1,000</text>
  <line x1="469.3" y1="282" x2="469.3" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="469.3" y="306" font-size="14" fill="#374151" text-anchor="middle">1만</text>
  <line x1="542.7" y1="282" x2="542.7" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="542.7" y="306" font-size="14" fill="#374151" text-anchor="middle">10만</text>
  <line x1="616.0" y1="282" x2="616.0" y2="288" stroke="#4b5563" stroke-width="1.5"/>
  <text x="616.0" y="306" font-size="14" fill="#374151" text-anchor="middle">100만</text>
  <text x="396" y="336" font-size="15" fill="#4b5563" text-anchor="middle">서로 다른 값의 개수 (로그 눈금)</text>
</svg>
