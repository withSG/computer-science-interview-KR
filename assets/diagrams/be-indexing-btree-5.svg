<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">카디널리티와 선택도 - member 테이블</title>
  <desc id="d">member 테이블 100만 행에서 gender, city, email 컬럼의 값 종류 수에 따른 카디널리티 비교 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>
  
  <rect x="40" y="24" width="800" height="272" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <rect x="60" y="44" width="760" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="73.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">member 테이블 100만 행</text>
  
  <rect x="60" y="112" width="160" height="44" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="140" y="138.9" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">gender</text>
  
  <text x="235" y="138.55" font-size="13" fill="#52606d" text-anchor="middle">:</text>
  <rect x="250" y="112" width="220" height="44" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="360" y="138.55" font-size="13" fill="#dc2626" text-anchor="middle">값이 2종류</text>
  
  <path d="M 480 134 L 570 134" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  
  <rect x="580" y="112" width="240" height="44" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="700" y="138.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">카디널리티 낮음</text>
  
  <rect x="60" y="168" width="160" height="44" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="140" y="194.9" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">city</text>
  
  <text x="235" y="194.55" font-size="13" fill="#52606d" text-anchor="middle">:</text>
  <rect x="250" y="168" width="220" height="44" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="360" y="194.55" font-size="13" fill="#d97706" text-anchor="middle">값이 200종류</text>
  
  <path d="M 480 190 L 570 190" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  
  <rect x="580" y="168" width="240" height="44" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="194.55" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">중간</text>
  
  <rect x="60" y="224" width="160" height="44" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="140" y="250.9" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">email</text>
  
  <text x="235" y="250.55" font-size="13" fill="#52606d" text-anchor="middle">:</text>
  <rect x="250" y="224" width="220" height="44" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="360" y="250.55" font-size="13" fill="#059669" text-anchor="middle">값이 100만 종류</text>
  
  <path d="M 480 246 L 570 246" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  
  <rect x="580" y="224" width="240" height="44" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="250.55" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">카디널리티 높음</text>
