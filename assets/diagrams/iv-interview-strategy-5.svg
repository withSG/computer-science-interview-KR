<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가장 비싼 실수 두 가지</title>
  <desc id="d">실수 A(침묵 후 "모르겠습니다")는 문제 해결 축 0점으로 끝나지만, 실수 B(아는 척하며 지어내기)는 기초 이해 축까지 마이너스가 되고 꼬리 질문 한 번에 무너져 다른 모든 답변의 신뢰도까지 떨어뜨립니다. B가 A보다 훨씬 비쌉니다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 실수 A -->
  <rect x="32" y="24" width="392" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="228" y="54" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">실수 A</text>
  <text x="228" y="85" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">침묵 후 "모르겠습니다"</text>

  <path d="M228,108 L228,135" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arr-a)"/>

  <rect x="32" y="140" width="392" height="92" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="228" y="178" font-size="19" font-weight="bold" fill="#b45309" text-anchor="middle">문제 해결 축 0점</text>
  <text x="228" y="210" font-size="15" fill="#374151" text-anchor="middle">면접관이 얻을 정보가 없다.</text>

  <!-- 실수 B -->
  <rect x="456" y="24" width="392" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="652" y="54" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">실수 B</text>
  <text x="652" y="85" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">아는 척하며 지어내기</text>

  <path d="M652,108 L652,135" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-b)"/>

  <rect x="456" y="140" width="392" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="178" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">기초 이해 축까지 마이너스</text>
  <text x="652" y="210" font-size="15" fill="#374151" text-anchor="middle">꼬리 질문 한 번이면 무너지고,</text>

  <path d="M652,236 L652,263" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-b)"/>

  <rect x="456" y="268" width="392" height="88" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="652" y="304" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">그 순간 다른 모든 답변의</text>
  <text x="652" y="332" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">신뢰도가 같이 떨어진다.</text>

  <!-- 비교 -->
  <rect x="32" y="384" width="816" height="52" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="416" font-size="16" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#b91c1c">B가 A보다 훨씬 비싸다</tspan> — 지어낸 답은 대부분 그 자리에서 티가 난다</text>
</svg>
