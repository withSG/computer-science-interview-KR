<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가장 비싼 실수 두 가지</title>
  <desc id="d">면접에서 모르는 질문을 만났을 때 범하기 쉬운 두 가지 실수인 실수 A(침묵 후 모르겠습니다)와 실수 B(아는 척하며 지어내기)의 결과 및 영향 비교 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="44" font-size="16" font-weight="bold" fill="#1f2933">가장 비싼 실수 두 가지</text>

  <!-- Box A: 실수 A -->
  <rect x="40" y="70" width="380" height="230" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="56" y="86" width="348" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="230" y="108" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">실수 A: 침묵 후 "모르겠습니다"</text>

  <!-- Arrow A -->
  <path d="M230,122 L230,150" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <!-- Details A -->
  <rect x="56" y="156" width="348" height="128" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="72" y="188" font-size="13" fill="#1f2933">→ 문제 해결 축 0점.</text>
  <text x="91" y="210" font-size="13" fill="#1f2933">면접관이 얻을 정보가 없다.</text>

  <!-- Box B: 실수 B -->
  <rect x="460" y="70" width="380" height="230" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="476" y="86" width="348" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="650" y="108" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">실수 B: 아는 척하며 지어내기</text>

  <!-- Arrow B -->
  <path d="M650,122 L650,150" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Details B -->
  <rect x="476" y="156" width="348" height="128" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="492" y="188" font-size="13" fill="#1f2933">→ 기초 이해 축까지 마이너스.</text>
  <text x="511" y="210" font-size="13" fill="#1f2933">꼬리 질문 한 번이면 무너지고,</text>
  <text x="511" y="232" font-size="13" fill="#1f2933">그 순간 다른 모든 답변의 신뢰도가</text>
  <text x="511" y="254" font-size="13" fill="#1f2933">같이 떨어진다.</text>
</svg>