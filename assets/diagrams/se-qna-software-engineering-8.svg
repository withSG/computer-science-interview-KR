<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 피라미드</title>
  <desc id="d">아래층 Unit Test가 가장 많고, 가운데 Integration Test, 꼭대기 E2E Test가 가장 적은 테스트 피라미드. 위로 갈수록 느리고 비용이 높으며, 아래로 갈수록 빠르고 비용이 낮다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 피라미드 3층 -->
  <polygon points="440,40 530,140 350,140" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round"/>
  <text x="440" y="124" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">E2E Test</text>

  <polygon points="342.8,148 537.2,148 620,240 260,240" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>
  <text x="440" y="201" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Integration Test</text>

  <polygon points="252.8,248 627.2,248 710,340 170,340" fill="#d1fae5" stroke="#047857" stroke-width="2" stroke-linejoin="round"/>
  <text x="440" y="301" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Unit Test</text>

  <!-- 왼쪽 축: 테스트 개수 -->
  <text x="90" y="56" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">개수 적음</text>
  <line x1="90" y1="72" x2="90" y2="314" stroke="#6b7280" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="90" y="340" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">개수 많음</text>

  <!-- 오른쪽 축: 속도·비용 -->
  <text x="780" y="56" font-size="16" fill="#374151" text-anchor="middle">느림 · 비용 높음</text>
  <line x1="780" y1="72" x2="780" y2="314" stroke="#6b7280" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="780" y="340" font-size="16" fill="#374151" text-anchor="middle">빠름 · 비용 낮음</text>
</svg>
