<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">순진한 방법이 실패하는 이유</title>
  <desc id="d">4비트 부호-절댓값 방식에서 +5와 -5를 더했을 때 0이 아닌 엉뚱한 값 10010이 나오는 실패 사례를 보여주는 이진수 덧셈 다이어그램입니다.</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="280" fill="#ffffff"/>

  <!-- 메인 카드 메인 배경 -->
  <rect x="180" y="24" width="520" height="232" rx="12" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 4비트 이진수 계산 영역 -->
  <text x="325" y="70" font-size="20" font-weight="600" fill="#1f2933" letter-spacing="4">0101</text>
  <text x="445" y="70" font-size="16" fill="#52606d">(+5)</text>

  <text x="285" y="115" font-size="20" font-weight="600" fill="#1f2933">+</text>
  <text x="325" y="115" font-size="20" font-weight="600" fill="#1f2933" letter-spacing="4">1101</text>
  <text x="445" y="115" font-size="16" fill="#52606d">(-5)</text>

  <!-- 구분선 -->
  <line x1="285" y1="135" x2="485" y2="135" stroke="#1f2933" stroke-width="2"/>

  <!-- 덧셈 결과 (실패 강조) -->
  <text x="305" y="175" font-size="20" font-weight="700" fill="#dc2626" letter-spacing="4">10010</text>

  <!-- 화살표 -->
  <path d="M 405,168 L 475,168" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- 실패 설명 상자 -->
  <rect x="485" y="148" width="190" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="580" y="173" font-size="13" font-weight="600" fill="#dc2626" text-anchor="middle">0을 기대했는데 엉뚱한 값</text>
</svg>