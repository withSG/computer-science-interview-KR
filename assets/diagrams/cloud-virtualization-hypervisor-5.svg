<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">그래서 지금은 어떻게 도는가</title>
  <desc id="d">CPU/메모리는 하드웨어 지원 가상화로, 네트워크/디스크는 반가상화 드라이버로 동작하는 현대 가상화 구조 설명 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- Row 1: CPU / 메모리 -->
  <rect x="40" y="40" width="200" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="87.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">CPU / 메모리</text>

  <path d="M 240 82.5 L 282 82.5" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="290" y="40" width="550" height="85" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="310" y="70" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="start">하드웨어 지원 가상화 (VT-x, AMD-V, EPT/NPT)</text>
  <text x="310" y="100.5" font-size="13" fill="#52606d" text-anchor="start">게스트를 네이티브에 가까운 속도로 실행</text>

  <!-- Row 2: 네트워크 / 디스크 -->
  <rect x="40" y="165" width="200" height="95" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="140" y="217.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">네트워크 / 디스크</text>

  <path d="M 240 212.5 L 282 212.5" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <rect x="290" y="165" width="550" height="95" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="310" y="195" font-size="14" font-weight="bold" fill="#059669" text-anchor="start">반가상화 드라이버 (virtio 계열)</text>
  <text x="310" y="222.5" font-size="13" fill="#52606d" text-anchor="start">게스트가 "나는 가상 환경이다"를 알고,</text>
  <text x="310" y="243.5" font-size="13" fill="#52606d" text-anchor="start">흉내 낸 가짜 장치 대신 전용 통로로 데이터를 넘긴다</text>
</svg>