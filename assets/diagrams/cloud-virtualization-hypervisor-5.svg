<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">자원별 가상화 방식</title>
  <desc id="d">CPU와 메모리는 하드웨어 지원 가상화(VT-x, AMD-V, EPT/NPT)로 게스트를 네이티브에 가까운 속도로 실행하고, 네트워크와 디스크는 반가상화 드라이버(virtio 계열)로 흉내 낸 가짜 장치 대신 전용 통로로 데이터를 넘긴다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="132" y="42" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">자원</text>
  <text x="306" y="42" font-size="15" font-weight="bold" fill="#4b5563">지금 쓰는 방식</text>

  <!-- 1행: CPU / 메모리 -->
  <rect x="32" y="60" width="200" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="132" y="116" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">CPU / 메모리</text>
  <line x1="238" y1="110" x2="282" y2="110" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="288" y="60" width="560" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="288" y="60" width="8" height="100" fill="#2563eb"/>
  <text x="314" y="99" font-size="18" font-weight="bold" fill="#1d4ed8">하드웨어 지원 가상화 <tspan font-weight="normal" font-size="16">(VT-x, AMD-V, EPT/NPT)</tspan></text>
  <text x="314" y="131" font-size="16" fill="#1f2937">게스트를 네이티브에 가까운 속도로 실행</text>

  <!-- 2행: 네트워크 / 디스크 -->
  <rect x="32" y="184" width="200" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="132" y="250" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">네트워크 / 디스크</text>
  <line x1="238" y1="244" x2="282" y2="244" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <rect x="288" y="184" width="560" height="120" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <rect x="288" y="184" width="8" height="120" fill="#059669"/>
  <text x="314" y="222" font-size="18" font-weight="bold" fill="#047857">반가상화 드라이버 <tspan font-weight="normal" font-size="16">(virtio 계열)</tspan></text>
  <text x="314" y="254" font-size="16" fill="#1f2937">게스트가 “나는 가상 환경이다”를 알고,</text>
  <text x="314" y="280" font-size="16" fill="#1f2937">흉내 낸 가짜 장치 대신 전용 통로로 데이터를 넘긴다</text>
</svg>
