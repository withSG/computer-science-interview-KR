<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">연결 리스트의 노드 사슬</title>
  <desc id="d">head가 첫 노드(10)를 가리키고, 각 노드의 next가 다음 노드(20, 30)를 가리키며 마지막 next는 null이다. 노드 주소는 0x7A20, 0x3C08, 0xF140으로 제각각이어서 연속일 필요가 없다.</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  <defs>
    <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- 필드 이름 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="192.5" y="80">data</text>
    <text x="277.5" y="80">next</text>
    <text x="432.5" y="80">data</text>
    <text x="517.5" y="80">next</text>
    <text x="672.5" y="80">data</text>
    <text x="757.5" y="80">next</text>
  </g>

  <!-- head -->
  <text x="24" y="126" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="17" font-weight="bold" fill="#111827">head</text>
  <line x1="74" y1="120" x2="146" y2="120" stroke="#111827" stroke-width="2" marker-end="url(#ah-k)"/>

  <!-- 노드 -->
  <g fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5">
    <rect x="150" y="90" width="170" height="60" rx="4"/>
    <rect x="390" y="90" width="170" height="60" rx="4"/>
    <rect x="630" y="90" width="170" height="60" rx="4"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="1.5">
    <line x1="235" y1="90" x2="235" y2="150"/>
    <line x1="475" y1="90" x2="475" y2="150"/>
    <line x1="715" y1="90" x2="715" y2="150"/>
  </g>
  <g font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="192.5" y="128">10</text>
    <text x="432.5" y="128">20</text>
    <text x="672.5" y="128">30</text>
  </g>

  <!-- next 포인터 -->
  <circle cx="277.5" cy="120" r="5" fill="#111827"/>
  <circle cx="517.5" cy="120" r="5" fill="#111827"/>
  <line x1="277.5" y1="120" x2="387" y2="120" stroke="#111827" stroke-width="2" marker-end="url(#ah-k)"/>
  <line x1="517.5" y1="120" x2="627" y2="120" stroke="#111827" stroke-width="2" marker-end="url(#ah-k)"/>
  <text x="757.5" y="126" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">null</text>

  <!-- 주소 -->
  <text x="24" y="184" font-size="15" fill="#4b5563">주소</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">
    <text x="235" y="184">0x7A20</text>
    <text x="475" y="184">0x3C08</text>
    <text x="715" y="184">0xF140</text>
  </g>

  <!-- 요점 -->
  <text x="440" y="234" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">주소가 제각각 — 연속일 필요가 전혀 없다</text>
</svg>
