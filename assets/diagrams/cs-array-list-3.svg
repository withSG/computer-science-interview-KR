<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">연결 리스트 정의 다이어그램</title>
  <desc id="d">head 포인터가 첫 번째 노드를 가리키고, 각 노드가 데이터와 다음 노드의 메모리 주소를 가리키는 포인터를 가져 사슬처럼 연결된 모습을 보여주는 다이어그램입니다.</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="880" height="230" fill="#ffffff"/>

  <!-- head pointer -->
  <text x="110" y="32" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">head</text>
  <path d="M110,40 L110,72" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Node 1 (Address: 0x7A20) -->
  <g>
    <rect x="50" y="80" width="120" height="48" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="110" y1="80" x2="110" y2="128" stroke="#2563eb" stroke-width="1.5"/>
    <text x="80" y="108.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">10</text>
    <circle cx="135" cy="104" r="4" fill="#1f2933"/>
    <path d="M135,104 L318,104" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="110" y="148" font-size="12" fill="#52606d" text-anchor="middle">0x7A20</text>
  </g>

  <!-- Node 2 (Address: 0x3C08) -->
  <g>
    <rect x="325" y="80" width="120" height="48" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="385" y1="80" x2="385" y2="128" stroke="#2563eb" stroke-width="1.5"/>
    <text x="355" y="108.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">20</text>
    <circle cx="410" cy="104" r="4" fill="#1f2933"/>
    <path d="M410,104 L593,104" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="385" y="148" font-size="12" fill="#52606d" text-anchor="middle">0x3C08</text>
  </g>

  <!-- Node 3 (Address: 0xF140) -->
  <g>
    <rect x="600" y="80" width="120" height="48" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="660" y1="80" x2="660" y2="128" stroke="#2563eb" stroke-width="1.5"/>
    <text x="630" y="108.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">30</text>
    <text x="690" y="108.2" font-size="13" font-weight="500" fill="#7c3aed" text-anchor="middle">null</text>
    <text x="660" y="148" font-size="12" fill="#52606d" text-anchor="middle">0xF140</text>
  </g>

  <!-- Bottom Annotation Note -->
  <text x="440" y="194.2" font-size="13" font-weight="500" fill="#d97706" text-anchor="middle">주소가 제각각 — 연속일 필요가 전혀 없다</text>
</svg>