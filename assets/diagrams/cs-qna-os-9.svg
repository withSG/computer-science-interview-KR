<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">내부 단편화와 외부 단편화</title>
  <desc id="d">내부 단편화는 4KB 페이지에 3.5KB 데이터만 들어 0.5KB가 할당된 공간 안에서 낭비되는 경우이고, 외부 단편화는 할당 사이에 흩어진 구멍 때문에 큰 연속 공간을 얻지 못하는 경우임을 비교한다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- 내부 단편화 -->
  <rect x="24" y="24" width="832" height="228" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="60" font-size="20" font-weight="bold" fill="#111827">내부 단편화<tspan font-size="16" font-weight="normal" fill="#4b5563"> (Internal Fragmentation)</tspan></text>
  <text x="48" y="90" font-size="16" fill="#111827">할당된 공간 <tspan font-weight="bold">내부</tspan>에 낭비 발생</text>

  <text x="440" y="126" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">4KB 페이지 (할당된 공간)</text>
  <path d="M48,146 V138 H832 V146" stroke="#374151" stroke-width="1.5" fill="none"/>

  <rect x="48" y="150" width="686" height="50" fill="#dbeafe"/>
  <rect x="734" y="150" width="98" height="50" fill="#fee2e2"/>
  <line x1="734" y1="150" x2="734" y2="200" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="48" y="150" width="784" height="50" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="391" y="181" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3.5KB 데이터</text>
  <text x="783" y="180" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">0.5KB 낭비</text>

  <text x="48" y="232" font-size="15" fill="#374151">예: 4KB 페이지에 3.5KB 데이터 → 0.5KB 낭비</text>

  <!-- 외부 단편화 -->
  <rect x="24" y="272" width="832" height="244" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="308" font-size="20" font-weight="bold" fill="#111827">외부 단편화<tspan font-size="16" font-weight="normal" fill="#4b5563"> (External Fragmentation)</tspan></text>
  <text x="48" y="338" font-size="16" fill="#111827">여러 곳에 흩어진 빈 공간 때문에 큰 <tspan font-weight="bold">연속</tspan> 공간 없음</text>

  <rect x="158" y="366" width="100" height="50" fill="#fee2e2"/>
  <rect x="388" y="366" width="100" height="50" fill="#fee2e2"/>
  <rect x="48" y="366" width="110" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="258" y="366" width="130" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="488" y="366" width="112" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="48" y="366" width="552" height="50" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="103" y="397" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">할당</text>
  <text x="208" y="396" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">구멍</text>
  <text x="323" y="397" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">할당</text>
  <text x="438" y="396" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">구멍</text>
  <text x="544" y="397" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">할당</text>

  <path d="M208,422 V434 H438 V422" stroke="#b91c1c" stroke-width="1.5" fill="none"/>
  <text x="323" y="456" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">흩어진 빈 공간 (구멍)</text>

  <rect x="648" y="366" width="184" height="50" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="397" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">큰 연속 공간 필요</text>
  <text x="740" y="440" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">들어갈 곳 없음</text>

  <text x="48" y="494" font-size="15" fill="#374151">예: 세그먼트 할당/해제 반복 시 중간에 구멍 발생</text>
</svg>
