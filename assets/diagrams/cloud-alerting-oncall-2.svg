<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">증상 기반 알림 vs 원인 기반 알림</title>
  <desc id="d">원인 기반 알림과 증상 기반 알림의 지표 차이 및 각각 대시보드와 알림으로 연결되는 비교 다이어그램</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Left Column: Cause-based (Orange/Gray Theme) -->
  <text x="230" y="38.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">원인 기반 알림</text>
  <rect x="70" y="50" width="320" height="110" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="90" y="80.55" font-size="13" fill="#1f2933">CPU 90% / 메모리 85%</text>
  <text x="90" y="105.55" font-size="13" fill="#1f2933">디스크 IOPS 포화</text>
  <text x="90" y="130.55" font-size="13" fill="#1f2933">GC pause 증가</text>

  <text x="230" y="189.55" font-size="13" fill="#52606d" text-anchor="middle">원인은 무한히 많다</text>
  <text x="230" y="214.55" font-size="13" fill="#52606d" text-anchor="middle">새 실패 모드마다 규칙 추가</text>

  <path d="M230,228 L230,268" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>
  
  <rect x="220" y="278" width="130" height="24" rx="2" fill="#ffffff"/>
  <text x="285" y="294.55" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">이건 대시보드로</text>

  <!-- Right Column: Symptom-based (Blue Theme) -->
  <text x="650" y="38.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">증상 기반 알림</text>
  <rect x="490" y="50" width="320" height="110" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="510" y="80.55" font-size="13" fill="#1f2933">5xx 비율 &gt; 1%</text>
  <text x="510" y="105.55" font-size="13" fill="#1f2933">p99 &gt; 1s</text>
  <text x="510" y="130.55" font-size="13" fill="#1f2933">주문 성공률 급감</text>

  <text x="650" y="189.55" font-size="13" fill="#2563eb" text-anchor="middle">증상은 몇 개뿐이다</text>
  <text x="650" y="214.55" font-size="13" fill="#2563eb" text-anchor="middle">새 실패 모드도 자동으로 잡힌다</text>

  <path d="M650,228 L650,268" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <rect x="640" y="278" width="105" height="24" rx="2" fill="#ffffff"/>
  <text x="692.5" y="294.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">이건 알림으로</text>
</svg>