<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">형식</title>
  <desc id="d">cron 표현식의 5개 필드(분, 시, 일, 월, 요일) 구성과 다양한 실행 주기 예시를 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title / Section -->
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#1f2933">형식</text>

  <!-- Field Annotations & Lines -->
  <!-- Line 1: 분 (0-59) -->
  <path d="M 120 70 L 120 215 L 230 215" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="125" y="55" width="130" height="28" rx="4" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="135" y="73" font-size="13" font-weight="bold" fill="#2563eb">분</text>
  <text x="160" y="73" font-size="13" fill="#52606d">(0-59)</text>

  <!-- Line 2: 시 (0-23) -->
  <path d="M 150 100 L 150 215 L 260 215" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="155" y="85" width="130" height="28" rx="4" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="165" y="103" font-size="13" font-weight="bold" fill="#2563eb">시</text>
  <text x="190" y="103" font-size="13" fill="#52606d">(0-23)</text>

  <!-- Line 3: 일 (1-31) -->
  <path d="M 180 130 L 180 215 L 290 215" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="185" y="115" width="130" height="28" rx="4" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="195" y="133" font-size="13" font-weight="bold" fill="#2563eb">일</text>
  <text x="220" y="133" font-size="13" fill="#52606d">(1-31)</text>

  <!-- Line 4: 월 (1-12) -->
  <path d="M 210 160 L 210 215 L 320 215" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="215" y="145" width="130" height="28" rx="4" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="225" y="163" font-size="13" font-weight="bold" fill="#2563eb">월</text>
  <text x="250" y="163" font-size="13" fill="#52606d">(1-12)</text>

  <!-- Line 5: 요일 (0-7, 0과 7은 일요일) -->
  <path d="M 240 190 L 240 215 L 350 215" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="245" y="175" width="225" height="28" rx="4" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="255" y="193" font-size="13" font-weight="bold" fill="#2563eb">요일</text>
  <text x="290" y="193" font-size="13" fill="#52606d">(0-7, 0과 7은 일요일)</text>

  <!-- Cron Expression Format (* * * * * 실행할 명령) -->
  <rect x="210" y="218" width="40" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="230" y="241" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">*</text>

  <rect x="260" y="218" width="40" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="280" y="241" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">*</text>

  <rect x="310" y="218" width="40" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="330" y="241" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">*</text>

  <rect x="360" y="218" width="40" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="241" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">*</text>

  <rect x="410" y="218" width="40" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="430" y="241" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">*</text>

  <text x="475" y="241" font-size="14" font-weight="bold" fill="#1f2933">실행할 명령</text>

  <!-- Separator Line -->
  <line x1="120" y1="280" x2="760" y2="280" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Examples Table Section -->
  <!-- Row 1 -->
  <rect x="120" y="300" x2="350" width="220" height="30" rx="4" fill="#f8fafc"/>
  <text x="130" y="320" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">30 3 * * *</text>
  <text x="370" y="320" font-size="13" fill="#059669" font-weight="bold">매일 03:30</text>

  <!-- Row 2 -->
  <rect x="120" y="338" x2="350" width="220" height="30" rx="4" fill="#f8fafc"/>
  <text x="130" y="358" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">*/10 * * * *</text>
  <text x="370" y="358" font-size="13" fill="#059669" font-weight="bold">10분마다</text>

  <!-- Row 3 -->
  <rect x="120" y="376" x2="350" width="220" height="30" rx="4" fill="#f8fafc"/>
  <text x="130" y="396" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">0 */6 * * *</text>
  <text x="370" y="396" font-size="13" fill="#059669" font-weight="bold">6시간마다</text>

  <!-- Row 4 -->
  <rect x="120" y="414" x2="350" width="220" height="30" rx="4" fill="#f8fafc"/>
  <text x="130" y="434" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">0 9 * * 1-5</text>
  <text x="370" y="434" font-size="13" fill="#059669" font-weight="bold">평일 09:00</text>

  <!-- Row 5 -->
  <rect x="120" y="452" x2="350" width="220" height="30" rx="4" fill="#f8fafc"/>
  <text x="130" y="472" font-size="13" font-family="monospace" font-weight="bold" fill="#1f2933">0 0 1 * *</text>
  <text x="370" y="472" font-size="13" fill="#059669" font-weight="bold">매월 1일 자정</text>

  <!-- Row 6 -->
  <rect x="120" y="490" x2="350" width="220" height="30" rx="4" fill="#f8fafc"/>
  <text x="130" y="510" font-size="13" font-family="monospace" font-weight="bold" fill="#d97706">@reboot</text>
  <text x="370" y="510" font-size="13" fill="#059669" font-weight="bold">부팅 시 1회</text>
</svg>