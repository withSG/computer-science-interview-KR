<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">cron 표현식 형식</title>
  <desc id="d">cron 한 줄은 분(0-59), 시(0-23), 일(1-31), 월(1-12), 요일(0-7, 0과 7은 일요일) 다섯 필드 뒤에 실행할 명령이 온다. 아래 표는 30 3 * * *(매일 03:30), */10 * * * *(10분마다), 0 */6 * * *(6시간마다), 0 9 * * 1-5(평일 09:00), 0 0 1 * *(매월 1일 자정), @reboot(부팅 시 1회) 예시를 필드별 열에 맞춰 보여준다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>

  <!-- ───── 형식: 필드 이름·범위 + 템플릿 ───── -->
  <rect x="32" y="24" width="538" height="72" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="32" y="96" width="816" height="52" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="124" y1="24" x2="124" y2="148"/>
    <line x1="216" y1="24" x2="216" y2="148"/>
    <line x1="308" y1="24" x2="308" y2="148"/>
    <line x1="400" y1="24" x2="400" y2="148"/>
    <line x1="570" y1="96" x2="570" y2="148"/>
  </g>

  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="78" y="54">분</text>
    <text x="170" y="54">시</text>
    <text x="262" y="54">일</text>
    <text x="354" y="54">월</text>
    <text x="485" y="54">요일</text>
  </g>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="78" y="80">0-59</text>
    <text x="170" y="80">0-23</text>
    <text x="262" y="80">1-31</text>
    <text x="354" y="80">1-12</text>
    <text x="485" y="80">0-7, 0과 7은 일요일</text>
  </g>

  <g font-size="24" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="78" y="131">*</text>
    <text x="170" y="131">*</text>
    <text x="262" y="131">*</text>
    <text x="354" y="131">*</text>
    <text x="485" y="131">*</text>
  </g>
  <text x="588" y="128" font-size="17" font-weight="bold" fill="#111827">실행할 명령</text>

  <!-- ───── 예시 ───── -->
  <text x="32" y="188" font-size="16" font-weight="bold" fill="#374151">예시</text>

  <rect x="32" y="200" width="816" height="280" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="33" y="201" width="814" height="39" fill="#f3f4f6"/>
  <line x1="32" y1="240" x2="848" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="32" y1="280" x2="848" y2="280"/>
    <line x1="32" y1="320" x2="848" y2="320"/>
    <line x1="32" y1="360" x2="848" y2="360"/>
    <line x1="32" y1="400" x2="848" y2="400"/>
    <line x1="32" y1="440" x2="848" y2="440"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="124" y1="200" x2="124" y2="440"/>
    <line x1="216" y1="200" x2="216" y2="440"/>
    <line x1="308" y1="200" x2="308" y2="440"/>
    <line x1="400" y1="200" x2="400" y2="440"/>
    <line x1="570" y1="200" x2="570" y2="480"/>
  </g>

  <g font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">
    <text x="78" y="226">분</text>
    <text x="170" y="226">시</text>
    <text x="262" y="226">일</text>
    <text x="354" y="226">월</text>
    <text x="485" y="226">요일</text>
  </g>
  <text x="588" y="226" font-size="15" font-weight="bold" fill="#374151">의미</text>

  <g font-size="17" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <!-- 30 3 * * * -->
    <text x="78" y="266" font-weight="bold" fill="#111827">30</text>
    <text x="170" y="266" font-weight="bold" fill="#111827">3</text>
    <text x="262" y="266" fill="#6b7280">*</text>
    <text x="354" y="266" fill="#6b7280">*</text>
    <text x="485" y="266" fill="#6b7280">*</text>
    <!-- */10 * * * * -->
    <text x="78" y="306" font-weight="bold" fill="#111827">*/10</text>
    <text x="170" y="306" fill="#6b7280">*</text>
    <text x="262" y="306" fill="#6b7280">*</text>
    <text x="354" y="306" fill="#6b7280">*</text>
    <text x="485" y="306" fill="#6b7280">*</text>
    <!-- 0 */6 * * * -->
    <text x="78" y="346" font-weight="bold" fill="#111827">0</text>
    <text x="170" y="346" font-weight="bold" fill="#111827">*/6</text>
    <text x="262" y="346" fill="#6b7280">*</text>
    <text x="354" y="346" fill="#6b7280">*</text>
    <text x="485" y="346" fill="#6b7280">*</text>
    <!-- 0 9 * * 1-5 -->
    <text x="78" y="386" font-weight="bold" fill="#111827">0</text>
    <text x="170" y="386" font-weight="bold" fill="#111827">9</text>
    <text x="262" y="386" fill="#6b7280">*</text>
    <text x="354" y="386" fill="#6b7280">*</text>
    <text x="485" y="386" font-weight="bold" fill="#111827">1-5</text>
    <!-- 0 0 1 * * -->
    <text x="78" y="426" font-weight="bold" fill="#111827">0</text>
    <text x="170" y="426" font-weight="bold" fill="#111827">0</text>
    <text x="262" y="426" font-weight="bold" fill="#111827">1</text>
    <text x="354" y="426" fill="#6b7280">*</text>
    <text x="485" y="426" fill="#6b7280">*</text>
    <!-- @reboot -->
    <text x="301" y="466" font-weight="bold" fill="#b45309">@reboot</text>
  </g>

  <g font-size="16" fill="#111827">
    <text x="588" y="266">매일 03:30</text>
    <text x="588" y="306">10분마다</text>
    <text x="588" y="346">6시간마다</text>
    <text x="588" y="386">평일 09:00</text>
    <text x="588" y="426">매월 1일 자정</text>
    <text x="588" y="466">부팅 시 1회</text>
  </g>
</svg>
