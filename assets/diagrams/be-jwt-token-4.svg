<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Refresh Token Rotation과 재사용 감지</title>
  <desc id="d">정상 흐름에서는 RT1에서 RT2, RT3로 재발급될 때마다 이전 RT가 폐기된다. 공격자가 RT2를 먼저 쓰면 RT3가 발급되고 RT2가 폐기되며, 정상 사용자가 나중에 RT2로 재발급을 시도하면 탈취 신호로 보고 토큰 계보 전체를 무효화한 뒤 재로그인을 요구한다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 정상 -->
  <rect x="24" y="24" width="832" height="132" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="48" y="56" font-size="18" font-weight="bold" fill="#047857">정상</text>

  <rect x="110" y="74" width="120" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="170" y="99" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">RT1</text>
  <text x="170" y="122" font-size="14" fill="#4b5563" text-anchor="middle">폐기됨</text>

  <path d="M232,104 H376" stroke="#047857" stroke-width="1.8" fill="none" marker-end="url(#ahg)"/>
  <text x="304" y="94" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">재발급</text>

  <rect x="380" y="74" width="120" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="99" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">RT2</text>
  <text x="440" y="122" font-size="14" fill="#4b5563" text-anchor="middle">폐기됨</text>

  <path d="M502,104 H646" stroke="#047857" stroke-width="1.8" fill="none" marker-end="url(#ahg)"/>
  <text x="574" y="94" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">재발급</text>

  <rect x="650" y="74" width="120" height="60" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="710" y="99" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">RT3</text>
  <text x="710" y="122" font-size="14" fill="#047857" text-anchor="middle">유효</text>

  <!-- 탈취 -->
  <rect x="24" y="176" width="832" height="320" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="48" y="208" font-size="18" font-weight="bold" fill="#b91c1c">탈취</text>
  <text x="666" y="208" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">서버</text>

  <!-- ① 공격자 -->
  <circle cx="48" cy="254" r="13" fill="#b91c1c"/>
  <text x="48" y="259" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="72" y="226" width="140" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="142" y="260" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">공격자</text>
  <path d="M214,254 H496" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="355" y="243" font-size="15" fill="#111827" text-anchor="middle">RT2를 훔쳐 <tspan font-weight="bold">먼저</tspan> 사용</text>
  <rect x="500" y="226" width="332" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="666" y="260" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">RT3 발급</tspan>, RT2 폐기</text>

  <!-- ② 정상 사용자 -->
  <circle cx="48" cy="338" r="13" fill="#b91c1c"/>
  <text x="48" y="343" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="72" y="306" width="140" height="64" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="142" y="344" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">정상 사용자</text>
  <path d="M214,338 H496" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="355" y="327" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold">나중에</tspan> RT2로 재발급 시도</text>
  <rect x="500" y="306" width="332" height="64" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="666" y="332" font-size="15" fill="#111827" text-anchor="middle">"이미 폐기된 토큰이 다시 왔다"</text>
  <text x="666" y="357" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">= 탈취 발생 신호</text>

  <!-- ③ 결과 -->
  <path d="M666,372 V400" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
  <circle cx="48" cy="438" r="13" fill="#b91c1c"/>
  <text x="48" y="443" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="72" y="404" width="760" height="68" rx="8" fill="#b91c1c"/>
  <text x="452" y="432" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">해당 사용자의 토큰 계보 전체를 무효화하고 재로그인 요구</text>
  <text x="452" y="457" font-size="15" fill="#fee2e2" text-anchor="middle">공격자가 받은 RT3까지 끊겨, 비밀번호를 모르는 공격자는 밀려남</text>
</svg>
