<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">@Autowired 주입 순서</title>
  <desc id="d">@Autowired는 1차로 타입을 매칭해 하나면 주입하고, 타입이 여러 개면 2차로 @Qualifier로 후보를 거르고, 3차로 @Primary로 우선순위를 정하고, 그래도 여러 개면 4차로 필드/파라미터 이름을 빈 이름과 맞춰 매칭한다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 왼쪽 열 머리: 주입 해결 단계 -->
  <text x="32" y="44" font-size="15" font-weight="bold" fill="#4b5563">주입 해결 단계</text>
  <line x1="32" y1="54" x2="164" y2="54" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 1차 -->
  <text x="32" y="88" font-size="16" font-weight="bold" fill="#374151">1차</text>
  <text x="32" y="110" font-size="15" fill="#4b5563">타입 단일성</text>
  <rect x="196" y="64" width="400" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <circle cx="230" cy="92" r="16" fill="#374151"/>
  <text x="230" y="98" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="262" y="98" font-size="18" font-weight="bold" fill="#1f2937">타입 매칭</text>

  <!-- 하나면 주입 -->
  <text x="650" y="82" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">하나면</text>
  <line x1="596" y1="92" x2="700" y2="92" stroke="#047857" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="704" y="66" width="140" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="774" y="98" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">주입</text>

  <!-- 1 → 2 -->
  <line x1="396" y1="120" x2="396" y2="182" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="157" font-size="16" font-weight="bold" fill="#b45309">타입이 여러 개</text>

  <!-- 2차 -->
  <text x="32" y="208" font-size="16" font-weight="bold" fill="#374151">2차</text>
  <text x="32" y="230" font-size="15" fill="#4b5563">한정자 필터</text>
  <rect x="196" y="184" width="400" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <circle cx="230" cy="212" r="16" fill="#374151"/>
  <text x="230" y="218" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="262" y="218" font-size="18" fill="#1f2937"><tspan font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@Qualifier</tspan>로 후보 필터링</text>

  <!-- 2 → 3 -->
  <line x1="396" y1="240" x2="396" y2="286" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3차 -->
  <text x="32" y="312" font-size="16" font-weight="bold" fill="#374151">3차</text>
  <text x="32" y="334" font-size="15" fill="#4b5563">Primary 우선권</text>
  <rect x="196" y="288" width="400" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <circle cx="230" cy="316" r="16" fill="#374151"/>
  <text x="230" y="322" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="262" y="322" font-size="18" fill="#1f2937"><tspan font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@Primary</tspan>로 우선순위 지정</text>

  <!-- 3 → 4 -->
  <line x1="396" y1="344" x2="396" y2="406" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="381" font-size="16" font-weight="bold" fill="#b45309">그래도 여러 개</text>

  <!-- 4차 -->
  <text x="32" y="442" font-size="16" font-weight="bold" fill="#374151">4차</text>
  <text x="32" y="464" font-size="15" fill="#4b5563">이름 매칭</text>
  <rect x="196" y="408" width="400" height="76" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <circle cx="230" cy="446" r="16" fill="#374151"/>
  <text x="230" y="452" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="262" y="439" font-size="18" font-weight="bold" fill="#1f2937">필드/파라미터 이름으로 매칭</text>
  <text x="262" y="466" font-size="15" fill="#4b5563">필드/파라미터 이름 = 빈 이름</text>
</svg>
