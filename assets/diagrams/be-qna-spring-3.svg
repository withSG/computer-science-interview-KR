<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">주입 순서</title>
  <desc id="d">Spring @Autowired의 빈 주입 순서를 보여주는 플로우차트 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">주입 순서</text>

  <!-- Flowchart Connectors -->
  <path d="M440,120 L440,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M440,210 L440,240" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M440,300 L440,330" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <!-- Step 1 -->
  <g id="step1">
    <rect x="230" y="70" width="420" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="250" y="100" font-size="14" font-weight="bold" fill="#2563eb">1.</text>
    <text x="275" y="100" font-size="14" font-weight="bold" fill="#1f2933">타입 매칭</text>
    <text x="350" y="100" font-size="13" fill="#52606d">→</text>
    <text x="370" y="100" font-size="13" font-weight="bold" fill="#2563eb">하나면 주입</text>
  </g>

  <!-- Step 2 -->
  <g id="step2">
    <rect x="230" y="160" width="420" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="250" y="190" font-size="14" font-weight="bold" fill="#7c3aed">2.</text>
    <text x="275" y="190" font-size="14" fill="#1f2933">타입이 여러 개</text>
    <text x="385" y="190" font-size="13" fill="#52606d">→</text>
    <text x="405" y="190" font-size="13" font-weight="bold" fill="#7c3aed">필드/파라미터 이름으로 매칭</text>
  </g>

  <!-- Step 3 -->
  <g id="step3">
    <rect x="230" y="250" width="420" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="250" y="280" font-size="14" font-weight="bold" fill="#d97706">3.</text>
    <text x="275" y="280" font-size="14" font-weight="bold" fill="#d97706">@Qualifier</text>
    <text x="365" y="280" font-size="14" fill="#1f2933">로 명시적 지정</text>
  </g>

  <!-- Step 4 -->
  <g id="step4">
    <rect x="230" y="340" width="420" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="250" y="370" font-size="14" font-weight="bold" fill="#059669">4.</text>
    <text x="275" y="370" font-size="14" font-weight="bold" fill="#059669">@Primary</text>
    <text x="355" y="370" font-size="14" fill="#1f2933">로 우선순위 지정</text>
  </g>

  <!-- Legend Section -->
  <g id="legend" transform="translate(40, 435)">
    <rect x="0" y="0" width="800" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="15" y="24" font-size="11.5" font-weight="bold" fill="#52606d">주입 해결 단계:</text>
    
    <circle cx="120" cy="20" r="5" fill="#2563eb"/>
    <text x="130" y="24" font-size="11.5" fill="#1f2933">1차: 타입 단일성</text>

    <circle cx="270" cy="20" r="5" fill="#7c3aed"/>
    <text x="280" y="24" font-size="11.5" fill="#1f2933">2차: 이름 매칭</text>

    <circle cx="410" cy="20" r="5" fill="#d97706"/>
    <text x="420" y="24" font-size="11.5" fill="#1f2933">3차: Explicit 한정자</text>

    <circle cx="570" cy="20" r="5" fill="#059669"/>
    <text x="580" y="24" font-size="11.5" fill="#1f2933">4차: Primary 우선권</text>
  </g>
</svg>