<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IAM 정책 평가 순서</title>
  <desc id="d">API 요청이 도착하면 ① 명시적 Deny가 있으면 거부, ② SCP·권한 경계가 허용 범위에 두지 않으면 거부, ③ 신원 기반 또는 리소스 기반 정책에 Allow가 없으면 암묵적 거부, 세 관문을 모두 통과해야 허용되는 순서도.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="204" y="24" width="160" height="40" rx="20" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="284" y="50" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">API 요청 도착</text>
  <path d="M284,64 V96" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>

  <!-- ① 명시적 Deny -->
  <rect x="64" y="100" width="440" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="88" y="134" font-size="16" fill="#111827">① 어디에든 <tspan font-weight="bold" fill="#b91c1c">명시적 Deny</tspan>가 있는가?</text>
  <path d="M504,128 H644" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
  <text x="574" y="118" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">예</text>
  <rect x="648" y="104" width="168" height="48" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="732" y="134" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">거부</text>

  <path d="M284,156 V216" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>
  <text x="298" y="192" font-size="15" fill="#374151">아니오</text>

  <!-- ② SCP·권한 경계 -->
  <rect x="64" y="220" width="440" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="88" y="254" font-size="16" fill="#111827">② SCP·권한 경계가 이 동작을 허용 범위에 두는가?</text>
  <path d="M504,248 H644" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
  <text x="574" y="238" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">아니오</text>
  <rect x="648" y="224" width="168" height="48" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="732" y="254" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">거부</text>

  <path d="M284,276 V336" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>
  <text x="298" y="312" font-size="15" fill="#374151">예</text>

  <!-- ③ Allow 존재 -->
  <rect x="64" y="340" width="440" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="88" y="374" font-size="16" fill="#111827">③ 신원 기반 또는 리소스 기반 정책에 Allow가 있는가?</text>
  <path d="M504,368 H644" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
  <text x="574" y="358" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">아니오</text>
  <rect x="648" y="344" width="168" height="48" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="732" y="374" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">거부 (암묵적)</text>

  <path d="M284,396 V456" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <text x="298" y="432" font-size="15" font-weight="bold" fill="#047857">예</text>

  <!-- 허용 -->
  <rect x="200" y="460" width="168" height="52" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="284" y="492" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">허용</text>
</svg>
