<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">평가 로직: 명시적 Deny가 모든 것을 이긴다</title>
  <desc id="d">IAM 정책 평가 로직을 나타내는 순서도. 명시적 Deny 여부, SCP 및 권한 경계 확인, Allow 유무를 거쳐 허용 또는 거부를 결정합니다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Start Node -->
  <rect x="360" y="30" width="160" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="52.5" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">API 요청 도착</text>

  <!-- Arrow Start -> Step 1 -->
  <path d="M440,66 L440,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 1 Box -->
  <rect x="220" y="100" width="440" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="240" y="129.5" fill="#1f2933" font-size="13">① 어디에든 명시적 Deny가 있는가?</text>

  <!-- Step 1 Yes -> Deny 1 -->
  <path d="M660,125 L730,125" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="674" y="114" width="28" height="20" fill="#ffffff"/>
  <text x="688" y="128" fill="#dc2626" font-size="11.5" text-anchor="middle">예</text>

  <!-- Deny Box 1 -->
  <rect x="730" y="102" width="90" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="775" y="129.5" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">[ 거부 ]</text>

  <!-- Arrow Step 1 -> Step 2 -->
  <path d="M440,150 L440,210" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="415" y="170" width="50" height="20" fill="#ffffff"/>
  <text x="440" y="184" fill="#52606d" font-size="11.5" text-anchor="middle">아니오</text>

  <!-- Step 2 Box -->
  <rect x="220" y="210" width="440" height="70" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="240" y="239.5" fill="#1f2933" font-size="13">② SCP·권한 경계가 이 동작을 허용 범위에</text>
  <text x="256" y="261.5" fill="#1f2933" font-size="13">두는가?</text>

  <!-- Step 2 No -> Deny 2 -->
  <path d="M660,245 L730,245" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="668" y="234" width="48" height="20" fill="#ffffff"/>
  <text x="692" y="248" fill="#dc2626" font-size="11.5" text-anchor="middle">아니오</text>

  <!-- Deny Box 2 -->
  <rect x="730" y="222" width="90" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="775" y="249.5" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">[ 거부 ]</text>

  <!-- Arrow Step 2 -> Step 3 -->
  <path d="M440,280 L440,340" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="428" y="300" width="24" height="20" fill="#ffffff"/>
  <text x="440" y="314" fill="#52606d" font-size="11.5" text-anchor="middle">예</text>

  <!-- Step 3 Box -->
  <rect x="220" y="340" width="440" height="70" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="240" y="369.5" fill="#1f2933" font-size="13">③ 신원 기반 또는 리소스 기반 정책에</text>
  <text x="256" y="391.5" fill="#1f2933" font-size="13">Allow가 있는가?</text>

  <!-- Step 3 No -> Deny 3 -->
  <path d="M660,375 L730,375" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="668" y="364" width="48" height="20" fill="#ffffff"/>
  <text x="692" y="378" fill="#dc2626" font-size="11.5" text-anchor="middle">아니오</text>

  <!-- Deny Box 3 (Implicit) -->
  <rect x="730" y="352" width="130" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="795" y="379.5" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">[ 거부 (암묵적) ]</text>

  <!-- Arrow Step 3 -> Allow -->
  <path d="M440,410 L440,470" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="428" y="430" width="24" height="20" fill="#ffffff"/>
  <text x="440" y="444" fill="#059669" font-size="11.5" text-anchor="middle">예</text>

  <!-- Allow Box -->
  <rect x="395" y="470" width="90" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="497.5" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">[ 허용 ]</text>
</svg>