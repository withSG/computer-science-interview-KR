<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stateful vs Stateless</title>
  <desc id="d">Security Group (Stateful)과 NACL (Stateless)의 동작 방식 비교 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>
  
  <!-- Security Group (Stateful) Section -->
  <rect x="40" y="30" width="800" height="140" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="65" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="start">Security Group (Stateful):</text>
  
  <rect x="140" y="90" width="180" height="50" rx="6" ry="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="230" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">요청 허용</text>
  
  <path d="M320,115 L530,115" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  
  <rect x="540" y="90" width="180" height="50" rx="6" ry="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="630" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">응답 자동 허용</text>

  <!-- NACL (Stateless) Section -->
  <rect x="40" y="200" width="800" height="150" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="235" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="start">NACL (Stateless):</text>
  
  <rect x="230" y="260" width="420" height="60" rx="6" ry="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="295" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">인바운드, 아웃바운드 규칙 각각 필요</text>
</svg>