<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">STAR 답변 구조 - Result (결과)</title>
  <desc id="d">프로젝트 지연 및 부분 분리 결과, 실패 원인 분석 3가지, 배운 점 3가지를 나타낸 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Top Banner: Result Overview (Red accent for delay/partial failure) -->
  <rect x="30" y="30" width="820" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">"결국 프로젝트는 6개월 → 10개월로 지연되었고,</text>
  <text x="440" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">4개 서비스 중 2개만 분리 완료되었습니다.</text>

  <!-- Arrow Left: Down to Cause Analysis -->
  <path d="M240,120 L240,150" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  
  <!-- Arrow Right: Down to Lessons Learned -->
  <path d="M640,120 L640,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Left Column Section: Failure Analysis -->
  <rect x="30" y="160" width="400" height="310" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="50" y="196" font-size="16" font-weight="bold" fill="#d97706">실패 원인 분석:</text>
  
  <!-- Card 1-1 -->
  <rect x="50" y="215" width="360" height="65" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="70" y="253" font-size="13" fill="#1f2933">1. 충분한 PoC 없이 전면 전환 시도</text>

  <!-- Card 1-2 -->
  <rect x="50" y="295" width="360" height="65" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="70" y="333" font-size="13" fill="#1f2933">2. 팀 역량 고려 부족</text>

  <!-- Card 1-3 -->
  <rect x="50" y="375" width="360" height="65" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="70" y="413" font-size="13" fill="#1f2933">3. 단계적 마이그레이션 계획 부재</text>

  <!-- Right Column Section: Lessons Learned -->
  <rect x="450" y="160" width="400" height="310" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="196" font-size="16" font-weight="bold" fill="#2563eb">배운 점:</text>

  <!-- Card 2-1 -->
  <rect x="470" y="215" width="360" height="65" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="490" y="253" font-size="13" fill="#1f2933">- Strangler Fig 패턴으로 점진적 전환</text>

  <!-- Card 2-2 -->
  <rect x="470" y="295" width="360" height="65" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="490" y="333" font-size="13" fill="#1f2933">- 팀 교육에 충분한 시간 투자</text>

  <!-- Card 2-3 -->
  <rect x="470" y="375" width="360" height="65" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="490" y="413" font-size="13" fill="#1f2933">- 기술 도입 전 PoC 필수"</text>
</svg>