<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MSA 전환 결과와 교훈</title>
  <desc id="d">프로젝트가 6개월에서 10개월로 지연되고 4개 서비스 중 2개만 분리 완료된 결과, 그 실패 원인 3가지와 거기서 얻은 배운 점 3가지를 보여줍니다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 결과 패널 -->
  <rect x="24" y="24" width="832" height="150" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- 기간: 계획 6개월 vs 실제 10개월 -->
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#b91c1c">6개월 → 10개월로 지연</text>
  <text x="44" y="95" font-size="16" font-weight="bold" fill="#374151">계획</text>
  <rect x="100" y="72" width="228" height="34" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="338" y="95" font-size="16" font-weight="bold" fill="#1d4ed8">6개월</text>
  <text x="44" y="143" font-size="16" font-weight="bold" fill="#374151">실제</text>
  <rect x="100" y="120" width="228" height="34" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <rect x="328" y="120" width="152" height="34" rx="3" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="404" y="143" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">지연</text>
  <text x="490" y="143" font-size="16" font-weight="bold" fill="#b91c1c">10개월</text>

  <!-- 서비스 분리: 4개 중 2개 -->
  <text x="576" y="56" font-size="18" font-weight="bold" fill="#1f2937">4개 서비스 중 2개만 분리 완료</text>
  <rect x="576" y="72" width="122" height="34" rx="4" fill="#047857"/>
  <text x="637" y="95" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">분리 완료</text>
  <rect x="714" y="72" width="122" height="34" rx="4" fill="#047857"/>
  <text x="775" y="95" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">분리 완료</text>
  <rect x="576" y="120" width="122" height="34" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="637" y="143" font-size="16" fill="#4b5563" text-anchor="middle">미완료</text>
  <rect x="714" y="120" width="122" height="34" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="775" y="143" font-size="16" fill="#4b5563" text-anchor="middle">미완료</text>

  <!-- 결과 → 원인 분석 -->
  <line x1="220" y1="178" x2="220" y2="202" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 실패 원인 분석 -->
  <rect x="24" y="206" width="392" height="222" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="40" y="238" font-size="18" font-weight="bold" fill="#b91c1c">실패 원인 분석</text>
  <rect x="40" y="254" width="360" height="46" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="56" y="283" font-size="16" fill="#1f2937">1. 충분한 PoC 없이 전면 전환 시도</text>
  <rect x="40" y="310" width="360" height="46" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="56" y="339" font-size="16" fill="#1f2937">2. 팀 역량 고려 부족</text>
  <rect x="40" y="366" width="360" height="46" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="56" y="395" font-size="16" fill="#1f2937">3. 단계적 마이그레이션 계획 부재</text>

  <!-- 원인 → 배운 점 -->
  <line x1="422" y1="317" x2="456" y2="317" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 배운 점 -->
  <rect x="464" y="206" width="392" height="222" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="480" y="238" font-size="18" font-weight="bold" fill="#047857">배운 점</text>
  <rect x="480" y="254" width="360" height="46" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="496" y="283" font-size="16" fill="#1f2937">Strangler Fig 패턴으로 점진적 전환</text>
  <rect x="480" y="310" width="360" height="46" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="496" y="339" font-size="16" fill="#1f2937">팀 교육에 충분한 시간 투자</text>
  <rect x="480" y="366" width="360" height="46" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="496" y="395" font-size="16" fill="#1f2937">기술 도입 전 PoC 필수</text>
</svg>
