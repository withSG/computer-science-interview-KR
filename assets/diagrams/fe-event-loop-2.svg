<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">setTimeout 실행 순서 추적</title>
  <desc id="d">console.log('A'), setTimeout, console.log('C')를 차례로 실행할 때 단계별 콜 스택과 출력을 추적한다. 전역 코드가 끝나 콜 스택이 비어야 비로소 태스크 큐의 콜백이 올라가므로 출력 순서는 A → C → B다.</desc>
  <rect width="880" height="590" fill="#ffffff"/>

  <!-- 표 틀 -->
  <rect x="24" y="24" width="832" height="418" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="24" y="24" width="832" height="38" rx="8" fill="#f3f4f6"/>
  <rect x="24" y="44" width="832" height="18" fill="#f3f4f6"/>
  <text x="44" y="49" font-size="16" font-weight="bold" fill="#374151">단계</text>
  <text x="486" y="49" font-size="16" font-weight="bold" fill="#374151">콜 스택 (바닥 → 위)</text>
  <text x="788" y="49" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">출력</text>

  <!-- ④ 강조 행 -->
  <rect x="24" y="254" width="832" height="56" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>

  <!-- 행 구분선·열 구분선 -->
  <line x1="24" y1="62" x2="856" y2="62" stroke="#9ca3af" stroke-width="1"/>
  <line x1="24" y1="118" x2="856" y2="118" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="198" x2="856" y2="198" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="24" y1="386" x2="856" y2="386" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="470" y1="24" x2="470" y2="442" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="720" y1="24" x2="720" y2="442" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ① -->
  <circle cx="50" cy="90" r="14" fill="#1f2937"/>
  <text x="50" y="96" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="80" y="96" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">console.log('A')</tspan> 실행</text>
  <rect x="486" y="74" width="84" height="32" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="528" y="95" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Global</text>
  <rect x="578" y="74" width="60" height="32" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="608" y="95" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">log</text>
  <rect x="756" y="72" width="64" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="788" y="96" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">'A'</text>

  <!-- ② -->
  <circle cx="50" cy="146" r="14" fill="#1f2937"/>
  <text x="50" y="152" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="80" y="152" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTimeout</tspan> 호출</text>
  <path d="M86,162 L86,178 L98,178" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="104" y="183" font-size="15" fill="#4b5563">브라우저 타이머 스레드에 콜백 등록 후 즉시 반환</text>
  <rect x="486" y="130" width="84" height="32" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="528" y="151" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Global</text>
  <rect x="578" y="130" width="118" height="32" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="637" y="151" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTimeout</text>

  <!-- ③ -->
  <circle cx="50" cy="226" r="14" fill="#1f2937"/>
  <text x="50" y="232" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="80" y="232" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">console.log('C')</tspan> 실행</text>
  <rect x="486" y="210" width="84" height="32" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="528" y="231" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Global</text>
  <rect x="578" y="210" width="60" height="32" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="608" y="231" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">log</text>
  <rect x="756" y="208" width="64" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="788" y="232" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">'C'</text>

  <!-- ④ -->
  <circle cx="50" cy="282" r="14" fill="#b45309"/>
  <text x="50" y="288" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="80" y="288" font-size="16" font-weight="bold" fill="#111827">전역 코드 종료</text>
  <rect x="486" y="266" width="94" height="32" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="533" y="287" font-size="15" fill="#92400e" text-anchor="middle">비어 있음</text>
  <text x="592" y="287" font-size="15" font-weight="bold" fill="#92400e">← 여기서 비로소</text>

  <!-- ⑤ -->
  <circle cx="50" cy="348" r="14" fill="#1f2937"/>
  <text x="50" y="354" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="80" y="342" font-size="16" fill="#111827">0ms가 이미 지났으므로</text>
  <text x="80" y="366" font-size="16" fill="#111827">콜백이 태스크 큐에 있음</text>
  <text x="486" y="353" font-size="15" fill="#047857">태스크 큐</text>
  <rect x="562" y="332" width="100" height="32" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="612" y="353" font-size="15" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">callback</text>

  <!-- ⑥ -->
  <circle cx="50" cy="414" r="14" fill="#1f2937"/>
  <text x="50" y="420" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="80" y="420" font-size="16" fill="#111827">이벤트 루프가 콜백을 스택에 올림</text>
  <rect x="486" y="398" width="100" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="536" y="419" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">callback</text>
  <rect x="756" y="396" width="64" height="36" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="788" y="420" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">'B'</text>

  <!-- 요약 -->
  <rect x="24" y="466" width="832" height="100" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="503" font-size="18" font-weight="bold" fill="#111827">출력 순서</text>
  <text x="150" y="504" font-size="22" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan fill="#1d4ed8">A</tspan> → <tspan fill="#1d4ed8">C</tspan> → <tspan fill="#047857">B</tspan></text>
  <text x="48" y="542" font-size="15" fill="#374151"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTimeout(fn, 0)</tspan>의 0은 "0ms 뒤에 실행"이 아니라 "0ms 뒤에 큐에 넣을 자격을 준다"는 뜻</text>
</svg>
