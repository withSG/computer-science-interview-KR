<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Service가 Pod를 찾아 규칙을 까는 흐름</title>
  <desc id="d">Service 생성 후 EndpointSlice 컨트롤러가 selector에 맞고 Ready인 Pod의 IP를 EndpointSlice에 기록하고, 각 노드의 kube-proxy가 이를 watch해 10.96.0.42:80 패킷을 10.244.1.7:8080 또는 10.244.2.3:8080으로 보내는 커널 규칙을 설치하며, Pod가 죽거나 늘면 2단계부터 다시 반복하는 흐름.</desc>
  <rect width="880" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ① Service 생성 -->
  <rect x="40" y="24" width="620" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="64" y="57" font-size="18" font-weight="bold" fill="#1d4ed8">① Service 생성</text>

  <line x1="350" y1="78" x2="350" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ② EndpointSlice 컨트롤러 -->
  <rect x="40" y="108" width="620" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="64" y="139" font-size="18" font-weight="bold" fill="#111827">② EndpointSlice 컨트롤러가</text>
  <text x="64" y="168" font-size="16" fill="#1f2937">selector에 맞고 <tspan font-weight="bold" fill="#047857">Ready 상태인 Pod</tspan>를 찾아</text>
  <text x="64" y="196" font-size="16" fill="#1f2937">IP 목록을 EndpointSlice 오브젝트에 기록</text>

  <line x1="350" y1="220" x2="350" y2="247" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ③ kube-proxy watch -->
  <rect x="40" y="250" width="620" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="64" y="282" font-size="18" font-weight="bold" fill="#111827">③ 각 노드의 kube-proxy가 EndpointSlice 변경을 watch</text>

  <line x1="350" y1="304" x2="350" y2="331" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ④ 규칙 설치 -->
  <rect x="40" y="334" width="620" height="176" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="64" y="365" font-size="18" font-weight="bold" fill="#111827">④ kube-proxy가 노드 커널에 규칙 설치</text>
  <rect x="64" y="380" width="572" height="114" rx="6" fill="#ffffff" stroke="#d6a45c" stroke-width="1"/>
  <!-- 목적지 -->
  <rect x="84" y="406" width="164" height="36" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="166" y="430" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.96.0.42:80</text>
  <text x="166" y="470" font-size="15" fill="#374151" text-anchor="middle">으로 온 패킷은</text>
  <!-- 분기 -->
  <path d="M250,424 H284 V409 H318" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#aha)"/>
  <path d="M284,424 V463 H318" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#aha)"/>
  <rect x="320" y="392" width="156" height="34" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="398" y="415" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.244.1.7:8080</text>
  <rect x="320" y="446" width="156" height="34" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="398" y="469" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.244.2.3:8080</text>
  <path d="M486,398 H494 V474 H486" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="506" y="442" font-size="16" font-weight="bold" fill="#b45309">중 하나로 보내라</text>

  <line x1="350" y1="512" x2="350" y2="539" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ⑤ Pod 변동 -->
  <rect x="40" y="542" width="620" height="52" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="64" y="575" font-size="18" font-weight="bold" fill="#6d28d9">⑤ Pod가 죽거나 늘면</text>

  <!-- 되돌아가는 고리 ⑤ → ② -->
  <path d="M662,568 H704 V163 H664" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahp)"/>
  <text x="720" y="340" font-size="16" font-weight="bold" fill="#6d28d9">②로 돌아가</text>
  <text x="720" y="366" font-size="15" fill="#4c1d95">목록이 갱신되고</text>
  <text x="720" y="390" font-size="15" fill="#4c1d95">규칙도 다시 깔린다</text>
</svg>
