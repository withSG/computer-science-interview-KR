<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">핵심 답변</title>
  <desc id="d">Spring MVC의 요청 처리 흐름 6단계를 나타낸 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">핵심 답변</text>

  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="800" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="14" fill="#2563eb"/>
    <text x="30" y="32" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="60" y="33" font-size="14" font-weight="bold" fill="#1f2933">Request</text>
    <path d="M130,28 L170,28" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
    <text x="185" y="33" font-size="14" font-weight="bold" fill="#2563eb">DispatcherServlet</text>
  </g>

  <path d="M440,126 L440,142" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <g transform="translate(40, 144)">
    <rect x="0" y="0" width="800" height="56" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="14" fill="#52606d"/>
    <text x="30" y="32" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="60" y="33" font-size="14" font-weight="bold" fill="#1f2933">HandlerMapping</text>
    <path d="M195,28 L235,28" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="250" y="33" font-size="14" font-weight="bold" fill="#1f2933">Controller 조회</text>
  </g>

  <path d="M440,200 L440,216" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <g transform="translate(40, 218)">
    <rect x="0" y="0" width="800" height="56" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="14" fill="#52606d"/>
    <text x="30" y="32" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="60" y="33" font-size="14" font-weight="bold" fill="#1f2933">HandlerAdapter</text>
    <path d="M190,28 L230,28" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="245" y="33" font-size="14" font-weight="bold" fill="#1f2933">Controller 실행</text>
  </g>

  <path d="M440,274 L440,290" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <g transform="translate(40, 292)">
    <rect x="0" y="0" width="800" height="56" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="14" fill="#52606d"/>
    <text x="30" y="32" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="60" y="33" font-size="14" font-weight="bold" fill="#1f2933">Controller</text>
    <path d="M150,28 L190,28" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="205" y="33" font-size="14" font-weight="bold" fill="#1f2933">비즈니스 로직, Model + View 반환</text>
  </g>

  <path d="M440,348 L440,364" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <g transform="translate(40, 366)">
    <rect x="0" y="0" width="800" height="56" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="14" fill="#52606d"/>
    <text x="30" y="32" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="60" y="33" font-size="14" font-weight="bold" fill="#1f2933">ViewResolver</text>
    <path d="M175,28 L215,28" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="230" y="33" font-size="14" font-weight="bold" fill="#1f2933">View 객체 조회</text>
  </g>

  <path d="M440,422 L440,438" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="800" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="14" fill="#059669"/>
    <text x="30" y="32" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="60" y="33" font-size="14" font-weight="bold" fill="#1f2933">View</text>
    <path d="M105,28 L145,28" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="160" y="33" font-size="14" font-weight="bold" fill="#059669">렌더링 후 Response</text>
