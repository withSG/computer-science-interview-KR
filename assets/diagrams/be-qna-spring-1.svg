<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Spring MVC 요청 처리 6단계</title>
  <desc id="d">Request가 DispatcherServlet에 도착한 뒤 HandlerMapping의 Controller 조회, HandlerAdapter의 Controller 실행, Controller의 비즈니스 로직과 Model + View 반환, ViewResolver의 View 객체 조회, View의 렌더링 후 Response까지 여섯 단계를 순서대로 보여준다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 단계 사이 세로 흐름 -->
  <line x1="52" y1="74" x2="52" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="146" x2="52" y2="172" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="218" x2="52" y2="244" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="290" x2="52" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="362" x2="52" y2="388" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 1 -->
  <circle cx="52" cy="52" r="19" fill="#1d4ed8"/>
  <text x="52" y="58" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="92" y="24" width="260" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="222" y="58" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Request</text>
  <line x1="360" y1="52" x2="406" y2="52" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="416" y="24" width="440" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="436" y="58" font-size="17" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DispatcherServlet</text>

  <!-- 2 -->
  <circle cx="52" cy="124" r="19" fill="#374151"/>
  <text x="52" y="130" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="92" y="96" width="260" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="222" y="130" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HandlerMapping</text>
  <line x1="360" y1="124" x2="406" y2="124" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="416" y="96" width="440" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="436" y="130" font-size="17" fill="#1f2937">Controller 조회</text>

  <!-- 3 -->
  <circle cx="52" cy="196" r="19" fill="#374151"/>
  <text x="52" y="202" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="92" y="168" width="260" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="222" y="202" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HandlerAdapter</text>
  <line x1="360" y1="196" x2="406" y2="196" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="416" y="168" width="440" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="436" y="202" font-size="17" fill="#1f2937">Controller 실행</text>

  <!-- 4 -->
  <circle cx="52" cy="268" r="19" fill="#374151"/>
  <text x="52" y="274" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="92" y="240" width="260" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="222" y="274" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Controller</text>
  <line x1="360" y1="268" x2="406" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="416" y="240" width="440" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="436" y="274" font-size="17" fill="#1f2937">비즈니스 로직, Model + View 반환</text>

  <!-- 5 -->
  <circle cx="52" cy="340" r="19" fill="#374151"/>
  <text x="52" y="346" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="92" y="312" width="260" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="222" y="346" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ViewResolver</text>
  <line x1="360" y1="340" x2="406" y2="340" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="416" y="312" width="440" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="436" y="346" font-size="17" fill="#1f2937">View 객체 조회</text>

  <!-- 6 -->
  <circle cx="52" cy="412" r="19" fill="#1d4ed8"/>
  <text x="52" y="418" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="92" y="384" width="260" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="222" y="418" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">View</text>
  <line x1="360" y1="412" x2="406" y2="412" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="416" y="384" width="440" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="436" y="418" font-size="17" fill="#1f2937">렌더링 후 <tspan font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Response</tspan></text>
</svg>
