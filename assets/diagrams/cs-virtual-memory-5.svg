<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LRU를 O(1)로 구현하기</title>
  <desc id="d">HashMap과 이중 연결 리스트를 조합하여 LRU 캐시를 O(1) 시간에 동작하도록 표현한 다이어그램입니다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title / Section Heading -->
  <text x="30" y="35" font-size="16" font-weight="bold" fill="#1f2933">LRU를 O(1)로 구현하기</text>

  <!-- Head / Tail Labels & Arrows -->
  <text x="130" y="68" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">head (최근)</text>
  <path d="M130,76 L130,98" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <text x="750" y="68" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">tail (오래됨)</text>
  <path d="M750,76 L750,98" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Nodes -->
  <!-- Box 1: K:A -->
  <rect x="80" y="106" width="100" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="135" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">K:A</text>

  <!-- Arrow K:A <-> K:C -->
  <path d="M189,130 L281,130" stroke="#2563eb" stroke-width="1.5" fill="none" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>

  <!-- Box 2: K:C -->
  <rect x="290" y="106" width="100" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="135" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">K:C</text>

  <!-- Arrow K:C <-> K:B -->
  <path d="M399,130 L491,130" stroke="#2563eb" stroke-width="1.5" fill="none" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>

  <!-- Box 3: K:B -->
  <rect x="500" y="106" width="100" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="135" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">K:B</text>

  <!-- Arrow K:B <-> K:D -->
  <path d="M609,130 L701,130" stroke="#2563eb" stroke-width="1.5" fill="none" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>

  <!-- Box 4: K:D -->
  <rect x="700" y="106" width="100" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="750" y="135" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">K:D</text>

  <!-- HashMap pointers to nodes -->
  <!-- Horizontal bus at y=200 -->
  <path d="M130,200 L750,200" stroke="#7c3aed" stroke-width="1.5" fill="none"/>

  <!-- Vertical lines going UP from bus (y=200) to node bottoms (y=154) -->
  <path d="M130,200 L130,162" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M340,200 L340,162" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M550,200 L550,162" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M750,200 L750,162" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Vertical line from HashMap top (y=244) to bus (y=200) -->
  <path d="M440,244 L440,200" stroke="#7c3aed" stroke-width="1.5" fill="none"/>

  <!-- HashMap Container -->
  <rect x="290" y="244" width="300" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="271" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">HashMap: key → 노드 참조</text>
</svg>