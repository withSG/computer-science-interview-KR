<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">웜 스타트와 콜드 스타트</title>
  <desc id="d">요청이 오면 플랫폼 라우팅이 재사용 가능한 실행 환경이 있는지 본다. 있으면 바로 핸들러를 실행하고(웜 스타트), 없으면 실행 환경 생성, 코드 패키지 로드, 런타임 초기화, 핸들러 밖 초기화 코드 실행을 거친 뒤 핸들러를 실행하며(콜드 스타트) 그 구간만큼 응답이 늦어진다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 요청 도착 -->
  <rect x="24" y="24" width="123" height="40" rx="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="85.5" y="49" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">요청 도착</text>
  <line x1="85.5" y1="65" x2="85.5" y2="94" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>

  <!-- 플랫폼 라우팅 -->
  <rect x="24" y="96" width="123" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="85.5" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">플랫폼 라우팅</text>

  <!-- 예: 웜 스타트 -->
  <line x1="148" y1="120" x2="636" y2="120" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="164" y="108" font-size="15" font-weight="bold" fill="#374151">재사용 가능한 실행 환경 있음?</text>
  <text x="164" y="142" font-size="15" font-weight="bold" fill="#047857">예</text>
  <rect x="638" y="96" width="104" height="48" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="690" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">핸들러 실행</text>
  <text x="756" y="125" font-size="15" font-weight="bold" fill="#047857">(웜 스타트)</text>

  <!-- 아니오: 콜드 스타트 -->
  <line x1="85.5" y1="145" x2="85.5" y2="198" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="98" y="177" font-size="15" font-weight="bold" fill="#b91c1c">아니오</text>

  <rect x="24" y="200" width="123" height="56" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="85.5" y="233" text-anchor="middle" font-size="15" fill="#7f1d1d">실행 환경 생성</text>
  <line x1="148" y1="228" x2="169" y2="228" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="171" y="200" width="138" height="56" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="240" y="233" text-anchor="middle" font-size="15" fill="#7f1d1d">코드 패키지 로드</text>
  <line x1="310" y1="228" x2="331" y2="228" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="333" y="200" width="119" height="56" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="392.5" y="233" text-anchor="middle" font-size="15" fill="#7f1d1d">런타임 초기화</text>
  <line x1="453" y1="228" x2="474" y2="228" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="476" y="200" width="138" height="56" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="545" y="223" text-anchor="middle" font-size="15" fill="#7f1d1d"><tspan x="545" dy="0">핸들러 밖</tspan><tspan x="545" dy="21">초기화 코드 실행</tspan></text>
  <line x1="615" y1="228" x2="636" y2="228" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="638" y="200" width="104" height="56" rx="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="690" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">핸들러 실행</text>
  <text x="756" y="233" font-size="15" font-weight="bold" fill="#b91c1c">(콜드 스타트)</text>

  <!-- 지연 구간 -->
  <path d="M24,266 V277 H614 V266" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="319" y="302" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">이 구간만큼 응답이 늦어진다</text>
</svg>
