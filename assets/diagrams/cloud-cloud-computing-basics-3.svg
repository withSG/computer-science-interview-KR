<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4.2 콜드 스타트 — 서버리스의 대표적 함정</title>
  <desc id="d">서버리스 환경에서 요청 도착 시 실행 환경 존재 여부에 따라 웜 스타트와 콜드 스타트로 갈라지는 과정을 나타낸 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title / Heading context -->
  <text x="40" y="32" font-size="16" font-weight="bold" fill="#1f2933">4.2 콜드 스타트 — 서버리스의 대표적 함정</text>

  <!-- Legend -->
  <rect x="650" y="16" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="668" y="26" font-size="11" fill="#52606d">웜 스타트 (빠름)</text>
  <rect x="760" y="16" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="778" y="26" font-size="11" fill="#52606d">콜드 스타트 (지연)</text>

  <!-- Top start node -->
  <rect x="110" y="50" width="100" height="32" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="160" y="70" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">요청 도착</text>

  <!-- Arrow down to Platform Routing -->
  <path d="M160,82 L160,103" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Decision Box: 플랫폼 라우팅 -->
  <rect x="80" y="110" width="160" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="139" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">플랫폼 라우팅</text>

  <!-- Arrow Right: 예 (Warm Start Path) -->
  <path d="M240,135 L580,135" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  
  <!-- Decision Label: 재사용 가능한 실행 환경 있음? / 예 -->
  <rect x="255" y="122" width="200" height="24" fill="#ffffff"/>
  <text x="260" y="139" font-size="13" font-weight="bold" fill="#52606d">재사용 가능한 실행 환경 있음?</text>
  
  <rect x="495" y="122" width="30" height="24" fill="#ffffff"/>
  <text x="510" y="139" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">예</text>

  <!-- Warm Start Box -->
  <rect x="588" y="110" width="120" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="648" y="139" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">핸들러 실행</text>
  <text x="720" y="139" font-size="13" font-weight="bold" fill="#059669">(웜 스타트)</text>

  <!-- Arrow Down: 아니오 (Cold Start Path) -->
  <path d="M160,160 L160,203" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  
  <rect x="168" y="171" width="48" height="20" fill="#ffffff"/>
  <text x="172" y="185" font-size="13" font-weight="bold" fill="#dc2626">아니오</text>

  <!-- Cold Start Process Flow -->
  <g>
    <!-- Background Area for Delay Section -->
    <rect x="40" y="200" width="800" height="115" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Step 1 -->
    <rect x="52" y="212" width="130" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="117" y="236" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">실행 환경 생성</text>

    <!-- Arrow 1-2 -->
    <path d="M182,232 L202,232" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- Step 2 -->
    <rect x="210" y="212" width="130" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="275" y="236" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">코드 패키지 로드</text>

    <!-- Arrow 2-3 -->
    <path d="M340,232 L360,232" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- Step 3 -->
    <rect x="368" y="212" width="115" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="425" y="236" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">런타임 초기화</text>

    <!-- Arrow 3-4 -->
    <path d="M483,232 L503,232" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- Step 4 -->
    <rect x="511" y="212" width="170" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="596" y="236" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">핸들러 밖 초기화 코드 실행</text>

    <!-- Arrow 4-5 -->
    <path d="M681,232 L701,232" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- Step 5 -->
    <rect x="709" y="212" width="115" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="766" y="236" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">핸들러 실행</text>

    <!-- Cold Start Tag -->
    <text x="735" y="280" font-size="13" font-weight="bold" fill="#dc2626">(콜드 스타트)</text>

    <!-- Bracket and Delay Text -->
    <!-- Bracket left vertical, bottom horizontal, right vertical -->
    <path d="M117,260 L117,276 L766,276 L766,260" stroke="#dc2626" stroke-width="1.5" fill="none"/>
    
    <!-- Delay Text inside Bracket -->
    <rect x="300" y="265" width="270" height="22" fill="#fef2f2"/>
    <text x="435" y="280" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">이 구간만큼 응답이 늦어진다</text>
  </g>
</svg>