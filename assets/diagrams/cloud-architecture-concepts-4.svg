<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pod 안에서 공유하는 것과 공유하지 않는 것</title>
  <desc id="d">IP 10.244.1.7인 Pod 안에서 pause 컨테이너가 network·IPC 네임스페이스를 보유하고 app과 log-agent가 거기에 합류한다. app과 log-agent는 localhost:8080으로 통하고 emptyDir /var/log 볼륨을 함께 쓰지만, 이미지 파일시스템은 컨테이너마다 따로 가진다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>

  <!-- Pod -->
  <rect x="24" y="24" width="832" height="448" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="48" y="57" font-size="20" font-weight="bold" fill="#111827">Pod</text>
  <text x="100" y="57" font-size="16" fill="#1f2937">IP 10.244.1.7</text>

  <!-- 공유 네임스페이스 -->
  <rect x="48" y="74" width="784" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="104" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">공유 네임스페이스: network ns · IPC ns</text>
  <text x="440" y="132" font-size="15" fill="#1f2937" text-anchor="middle">같은 IP 10.244.1.7 · localhost 통신 · 포트 공간 공유</text>

  <!-- 네임스페이스 보유 / 합류 -->
  <line x1="138" y1="196" x2="138" y2="153" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <text x="148" y="180" font-size="14" font-weight="bold" fill="#1d4ed8">보유</text>
  <line x1="359" y1="196" x2="359" y2="153" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <text x="369" y="180" font-size="14" font-weight="bold" fill="#1d4ed8">합류</text>
  <line x1="728" y1="196" x2="728" y2="153" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <text x="738" y="180" font-size="14" font-weight="bold" fill="#1d4ed8">합류</text>

  <!-- pause -->
  <rect x="48" y="196" width="180" height="150" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="138" y="226" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">pause</text>
  <text x="138" y="252" font-size="15" fill="#1f2937" text-anchor="middle">네임스페이스 보유</text>
  <rect x="62" y="278" width="152" height="48" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="138" y="307" font-size="15" fill="#374151" text-anchor="middle">이미지 파일시스템</text>

  <!-- app -->
  <rect x="264" y="196" width="190" height="150" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="359" y="226" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">app</text>
  <text x="359" y="252" font-size="16" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:8080</text>
  <rect x="278" y="278" width="162" height="48" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="359" y="307" font-size="15" fill="#374151" text-anchor="middle">이미지 파일시스템</text>

  <!-- localhost -->
  <text x="539" y="238" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">localhost:8080</text>
  <line x1="460" y1="252" x2="618" y2="252" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>

  <!-- log-agent -->
  <rect x="624" y="196" width="208" height="150" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="728" y="226" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">log-agent</text>
  <text x="728" y="252" font-size="15" fill="#1f2937" text-anchor="middle">(사이드카)</text>
  <rect x="638" y="278" width="180" height="48" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="728" y="307" font-size="15" fill="#374151" text-anchor="middle">이미지 파일시스템</text>

  <!-- emptyDir 볼륨 -->
  <line x1="359" y1="346" x2="359" y2="389" stroke="#374151" stroke-width="1.8" marker-end="url(#ah-ink)"/>
  <line x1="728" y1="346" x2="728" y2="389" stroke="#374151" stroke-width="1.8" marker-end="url(#ah-ink)"/>
  <rect x="264" y="392" width="568" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="548" y="417" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">emptyDir  /var/log</text>
  <text x="548" y="439" font-size="14" fill="#1f2937" text-anchor="middle">공유 볼륨</text>

  <!-- 범례 -->
  <rect x="48" y="490" width="32" height="20" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="92" y="506" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#1e3a8a">공유</tspan>: network ns · IPC ns · 볼륨</text>
  <rect x="48" y="524" width="32" height="20" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="92" y="540" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#374151">비공유</tspan>: 각 컨테이너의 이미지 파일시스템 · PID ns (기본값)</text>
</svg>
