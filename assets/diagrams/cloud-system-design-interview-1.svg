<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">45분 배분 및 각 단계의 산출물</title>
  <desc id="d">시스템 디자인 면접 45분 시간 배분 타임라인과 각 단계별 산출물 목록을 나타낸 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 타임라인 상단 시간 표시 -->
  <text x="40" y="38" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">0분</text>
  <text x="176" y="38" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">5분</text>
  <text x="312" y="38" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">10분</text>
  <text x="502" y="38" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">20분</text>
  <text x="706" y="38" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">35분</text>
  <text x="840" y="38" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">45분</text>

  <!-- 타임라인 중앙 박스들 -->
  <!-- 1. 요구사항 명확화 (0분 ~ 5분) -->
  <rect x="40" y="50" width="136" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="108" y="74.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">요구사항</text>
  <text x="108" y="94.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">명확화</text>

  <!-- 2. 규모 추정 (5분 ~ 10분) -->
  <rect x="176" y="50" width="136" height="60" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="244" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">규모 추정</text>

  <!-- 3. API·데이터 모델 (10분 ~ 20분) -->
  <rect x="312" y="50" width="190" height="60" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="407" y="74.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">API·데이터</text>
  <text x="407" y="94.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">모델</text>

  <!-- 4. 상위 설계 + 심화 (20분 ~ 35분) -->
  <rect x="502" y="50" width="204" height="60" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="604" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">상위 설계 + 심화</text>

  <!-- 5. 병목·확장 (35분 ~ 45분) -->
  <rect x="706" y="50" width="134" height="60" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="773" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">병목·확장</text>

  <!-- 타임라인 하단 소요 시간 표시 -->
  <text x="108" y="132.55" font-size="13" fill="#52606d" text-anchor="middle">5분</text>
  <text x="244" y="132.55" font-size="13" fill="#52606d" text-anchor="middle">5분</text>
  <text x="407" y="132.55" font-size="13" fill="#52606d" text-anchor="middle">10분</text>
  <text x="604" y="132.55" font-size="13" fill="#52606d" text-anchor="middle">15분</text>
  <text x="773" y="132.55" font-size="13" fill="#52606d" text-anchor="middle">10분</text>

  <!-- 구분선 -->
  <line x1="40" y1="160" x2="840" y2="160" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 각 단계의 산출물 섹션 -->
  <text x="40" y="194.9" font-size="14" font-weight="bold" fill="#1f2933">각 단계의 산출물</text>

  <!-- 산출물 목록 박스 영역 -->
  <rect x="40" y="210" width="800" height="300" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>

  <!-- 항목 1 -->
  <circle cx="64" cy="245" r="10" fill="#2563eb"/>
  <text x="64" y="249.025" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="249.55" font-size="13" fill="#1f2933">기능 3~5개 + 비기능 지표(규모, 지연, 가용성) + 범위 밖 목록</text>

  <!-- 항목 2 -->
  <circle cx="64" cy="290" r="10" fill="#059669"/>
  <text x="64" y="294.025" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="294.55" font-size="13" fill="#1f2933">QPS(평균/피크), 저장량/년, 대역폭 → "무엇이 어려운 문제인가" 판정</text>

  <!-- 항목 3 -->
  <circle cx="64" cy="335" r="10" fill="#d97706"/>
  <text x="64" y="339.025" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="84" y="339.55" font-size="13" fill="#1f2933">엔드포인트 3~4개 + 핵심 테이블 스키마</text>

  <!-- 항목 4 -->
  <circle cx="64" cy="380" r="10" fill="#7c3aed"/>
  <text x="64" y="384.025" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="84" y="384.55" font-size="13" fill="#1f2933">컴포넌트 다이어그램 + 요청 흐름 두 개(쓰기 경로, 읽기 경로)</text>

  <!-- 항목 5 -->
  <circle cx="64" cy="425" r="10" fill="#7c3aed"/>
  <text x="64" y="429.025" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="84" y="429.55" font-size="13" fill="#1f2933">면접관이 지목하거나 내가 고른 컴포넌트 하나를 깊이</text>

  <!-- 항목 6 -->
  <circle cx="64" cy="470" r="10" fill="#dc2626"/>
  <text x="64" y="474.025" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="84" y="474.55" font-size="13" fill="#1f2933">단일 장애점, 병목, 확장 방향, 트레이드오프 요약</text>
</svg>