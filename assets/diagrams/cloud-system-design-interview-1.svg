<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">45분 배분과 단계별 산출물</title>
  <desc id="d">시스템 설계 면접 45분을 요구사항 명확화 5분, 규모 추정 5분, API·데이터 모델 10분, 상위 설계와 심화 15분, 병목·확장 10분으로 나눈 타임라인과, 1~6단계 각각의 산출물 목록.</desc>
  <rect width="880" height="600" fill="#ffffff"/>

  <!-- 경과 시각 -->
  <g font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="40" y="42">0분</text>
    <text x="129" y="42">5분</text>
    <text x="218" y="42">10분</text>
    <text x="396" y="42">20분</text>
    <text x="662" y="42">35분</text>
    <text x="840" y="42">45분</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="40" y1="50" x2="40" y2="60"/>
    <line x1="129" y1="50" x2="129" y2="60"/>
    <line x1="218" y1="50" x2="218" y2="60"/>
    <line x1="396" y1="50" x2="396" y2="60"/>
    <line x1="662" y1="50" x2="662" y2="60"/>
    <line x1="840" y1="50" x2="840" y2="60"/>
  </g>

  <!-- 구간 막대 (폭 = 시간에 비례) -->
  <rect x="40" y="60" width="89" height="90" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="129" y="60" width="89" height="90" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="218" y="60" width="178" height="90" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="396" y="60" width="266" height="90" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="662" y="60" width="178" height="90" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- 단계 번호 -->
  <circle cx="84.5" cy="84" r="12" fill="#1d4ed8"/>
  <circle cx="173.5" cy="84" r="12" fill="#047857"/>
  <circle cx="307" cy="84" r="12" fill="#b45309"/>
  <circle cx="513" cy="84" r="12" fill="#6d28d9"/>
  <circle cx="545" cy="84" r="12" fill="#6d28d9"/>
  <circle cx="751" cy="84" r="12" fill="#b91c1c"/>
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="84.5" y="89">1</text>
    <text x="173.5" y="89">2</text>
    <text x="307" y="89">3</text>
    <text x="513" y="89">4</text>
    <text x="545" y="89">5</text>
    <text x="751" y="89">6</text>
  </g>

  <!-- 단계 이름 -->
  <g font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="84.5" y="120">요구사항</text>
    <text x="84.5" y="140">명확화</text>
    <text x="173.5" y="128">규모 추정</text>
    <text x="307" y="128">API·데이터 모델</text>
    <text x="529" y="128">상위 설계 + 심화</text>
    <text x="751" y="128">병목·확장</text>
  </g>

  <!-- 소요 시간 치수선 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M44,160 V168 H125 V160"/>
    <path d="M133,160 V168 H214 V160"/>
    <path d="M222,160 V168 H392 V160"/>
    <path d="M400,160 V168 H658 V160"/>
    <path d="M666,160 V168 H836 V160"/>
  </g>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="84.5" y="192">5분</text>
    <text x="173.5" y="192">5분</text>
    <text x="307" y="192">10분</text>
    <text x="529" y="192">15분</text>
    <text x="751" y="192">10분</text>
  </g>

  <!-- 각 단계의 산출물 -->
  <text x="40" y="240" font-size="17" font-weight="bold" fill="#111827">각 단계의 산출물</text>

  <g fill="#f9fafb" stroke="#d1d5db" stroke-width="1">
    <rect x="40" y="256" width="800" height="46" rx="6"/>
    <rect x="40" y="310" width="800" height="46" rx="6"/>
    <rect x="40" y="364" width="800" height="46" rx="6"/>
    <rect x="40" y="418" width="800" height="46" rx="6"/>
    <rect x="40" y="472" width="800" height="46" rx="6"/>
    <rect x="40" y="526" width="800" height="46" rx="6"/>
  </g>

  <circle cx="66" cy="279" r="12" fill="#1d4ed8"/>
  <circle cx="66" cy="333" r="12" fill="#047857"/>
  <circle cx="66" cy="387" r="12" fill="#b45309"/>
  <circle cx="66" cy="441" r="12" fill="#6d28d9"/>
  <circle cx="66" cy="495" r="12" fill="#6d28d9"/>
  <circle cx="66" cy="549" r="12" fill="#b91c1c"/>
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="66" y="284">1</text>
    <text x="66" y="338">2</text>
    <text x="66" y="392">3</text>
    <text x="66" y="446">4</text>
    <text x="66" y="500">5</text>
    <text x="66" y="554">6</text>
  </g>

  <g font-size="15" font-weight="bold">
    <text x="90" y="284" fill="#1d4ed8">요구사항 명확화</text>
    <text x="90" y="338" fill="#047857">규모 추정</text>
    <text x="90" y="392" fill="#b45309">API·데이터 모델</text>
    <text x="90" y="446" fill="#6d28d9">상위 설계</text>
    <text x="90" y="500" fill="#6d28d9">심화</text>
    <text x="90" y="554" fill="#b91c1c">병목·확장</text>
  </g>

  <g font-size="15" fill="#1f2937">
    <text x="226" y="284">기능 3~5개 + 비기능 지표(규모, 지연, 가용성) + 범위 밖 목록</text>
    <text x="226" y="338">QPS(평균/피크), 저장량/년, 대역폭 → <tspan font-weight="bold" fill="#111827">"무엇이 어려운 문제인가" 판정</tspan></text>
    <text x="226" y="392">엔드포인트 3~4개 + 핵심 테이블 스키마</text>
    <text x="226" y="446">컴포넌트 다이어그램 + 요청 흐름 두 개(쓰기 경로, 읽기 경로)</text>
    <text x="226" y="500">면접관이 지목하거나 내가 고른 컴포넌트 하나를 깊이</text>
    <text x="226" y="554">단일 장애점, 병목, 확장 방향, 트레이드오프 요약</text>
  </g>
</svg>
