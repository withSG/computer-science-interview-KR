<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JVM 힙 메모리 구조</title>
  <desc id="d">Heap은 Young Generation과 Old Generation으로 나뉘고, Young Generation은 다시 Eden과 Survivor(S0, S1)로 나뉩니다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Heap (outer) -->
  <rect x="32" y="24" width="816" height="272" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="56" y="58" font-size="20" font-weight="bold" fill="#1f2937">Heap</text>

  <!-- Young Generation -->
  <rect x="56" y="78" width="376" height="194" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="76" y="108" font-size="18" font-weight="bold" fill="#065f46">Young Generation</text>

  <!-- Eden -->
  <rect x="76" y="126" width="140" height="126" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="146" y="195" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Eden</text>

  <!-- Survivor (S0, S1) -->
  <rect x="232" y="126" width="180" height="126" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="322" y="154" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Survivor</text>
  <rect x="248" y="170" width="68" height="64" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="282" y="208" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">S0</text>
  <rect x="328" y="170" width="68" height="64" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="362" y="208" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">S1</text>

  <!-- Old Generation -->
  <rect x="448" y="78" width="376" height="194" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="468" y="108" font-size="18" font-weight="bold" fill="#92400e">Old Generation</text>
</svg>
