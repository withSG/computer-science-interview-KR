<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">힙 메모리 구조</title>
  <desc id="d">Heap, Young Generation (Eden, Survivor S0, S1), Old Generation의 계층 구조 트리 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Root Node: Heap -->
  <rect x="350" y="30" width="180" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="57" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">Heap</text>

  <!-- Level 1 Nodes: Young & Old Generation -->
  <rect x="180" y="120" width="220" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="290" y="147" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Young Generation</text>

  <rect x="520" y="120" width="200" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="147" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Old Generation</text>

  <!-- Level 2 Nodes under Young Generation -->
  <rect x="100" y="240" width="160" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="180" y="267" fill="#1f2933" font-size="13" text-anchor="middle">Eden</text>

  <rect x="290" y="240" width="210" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="395" y="267" fill="#1f2933" font-size="13" text-anchor="middle">Survivor (S0, S1)</text>

  <!-- Connector Lines -->
  <!-- Root to Level 1 -->
  <path d="M440,74 L440,95 L290,95 L290,120" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M440,95 L620,95 L620,120" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <!-- Level 1 (Young Gen) to Level 2 -->
  <path d="M290,164 L290,200 L180,200 L180,240" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M290,200 L395,200 L395,240" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <!-- Tree Structure Indicators (Dots at branching points) -->
  <circle cx="440" cy="95" r="3" fill="#52606d"/>
  <circle cx="290" cy="200" r="3" fill="#52606d"/>
</svg>