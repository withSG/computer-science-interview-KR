<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">분리 연결법(Separate Chaining)</title>
  <desc id="d">버킷[0]에는 같은 인덱스에 걸린 K1:V1과 K2:V2가 LinkedList로 이어지고, 버킷[1]에는 K3:V3 하나, 버킷[2]는 null인 해시 테이블을 보여준다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="#ffffff"/>
  <g transform="translate(76,0)">

  <!-- 머리 -->
  <text x="108" y="52" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">버킷 배열</text>
  <text x="402" y="44" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">같은 인덱스(충돌) → LinkedList로 연결</text>
  <path d="M230,64 V56 H574 V64" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- 버킷 배열 -->
  <g fill="#f3f4f6" stroke="#374151" stroke-width="1.5">
    <rect x="48" y="68" width="120" height="52"/>
    <rect x="48" y="120" width="120" height="52"/>
    <rect x="48" y="172" width="120" height="52"/>
  </g>
  <g font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="108" y="99">버킷[0]</text>
    <text x="108" y="151">버킷[1]</text>
    <text x="108" y="203">버킷[2]</text>
  </g>

  <!-- 포인터 -->
  <g stroke="#374151" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="170" y1="94" x2="226" y2="94"/>
    <line x1="372" y1="94" x2="430" y2="94"/>
    <line x1="576" y1="94" x2="632" y2="94"/>
    <line x1="170" y1="146" x2="226" y2="146"/>
    <line x1="372" y1="146" x2="430" y2="146"/>
    <line x1="170" y1="198" x2="226" y2="198"/>
  </g>

  <!-- 노드 -->
  <g fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5">
    <rect x="230" y="74" width="140" height="40" rx="6"/>
    <rect x="434" y="74" width="140" height="40" rx="6"/>
    <rect x="230" y="126" width="140" height="40" rx="6"/>
  </g>
  <g font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="300" y="99">K1:V1</text>
    <text x="504" y="99">K2:V2</text>
    <text x="300" y="151">K3:V3</text>
  </g>
  <g font-size="16" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="640" y="99">null</text>
    <text x="436" y="151">null</text>
    <text x="232" y="203">null</text>
  </g>
  </g>
</svg>
