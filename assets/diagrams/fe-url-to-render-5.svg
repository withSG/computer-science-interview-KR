<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TLS 핸드셰이크 순서</title>
  <desc id="d">Client가 ClientHello(지원 암호 스위트, 키 공유)를 보내고 Server가 ServerHello, 인증서, 키 공유로 답하기까지가 1 RTT입니다. 이어 Client가 인증서 체인과 도메인 일치를 확인하고, 양쪽이 같은 세션 키를 도출한 뒤 Client가 Finished를 보내면 암호화된 HTTP가 시작됩니다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="180" y="24" width="140" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="250" y="52" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">Client</text>
  <rect x="620" y="24" width="140" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="690" y="52" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">Server</text>

  <!-- 생명선 (상자에서 끊김) -->
  <g stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="250" y1="68" x2="250" y2="212"/>
    <line x1="250" y1="254" x2="250" y2="274"/>
    <line x1="250" y1="316" x2="250" y2="392"/>
    <line x1="690" y1="68" x2="690" y2="274"/>
    <line x1="690" y1="316" x2="690" y2="392"/>
  </g>

  <!-- ClientHello -->
  <text x="470" y="110" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="700">ClientHello</tspan><tspan font-size="15" fill="#4b5563"> (지원 암호 스위트, 키 공유)</tspan></text>
  <line x1="252" y1="122" x2="688" y2="122" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ServerHello -->
  <text x="470" y="174" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="700">ServerHello</tspan> + 인증서 + 키 공유</text>
  <line x1="688" y1="186" x2="252" y2="186" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 1 RTT 구간 -->
  <path d="M238,122 L224,122 L224,186 L238,186" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="212" y="148" font-size="15" fill="#6d28d9" text-anchor="end">여기까지</text>
  <text x="212" y="172" font-size="20" font-weight="700" fill="#6d28d9" text-anchor="end">1 RTT</text>

  <!-- Client 쪽 검증 -->
  <rect x="100" y="212" width="300" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="238" font-size="16" fill="#1f2937" text-anchor="middle">인증서 체인 검증 · 도메인 일치 확인</text>

  <!-- 양쪽 세션 키 -->
  <rect x="170" y="274" width="600" height="42" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="470" y="300" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">양쪽이 같은 세션 키 도출</text>

  <!-- Finished -->
  <text x="470" y="354" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Finished</text>
  <line x1="252" y1="366" x2="688" y2="366" stroke="#1f2937" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 암호화된 HTTP -->
  <rect x="170" y="392" width="600" height="44" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="470" y="420" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">암호화된 HTTP 시작</text>
</svg>
