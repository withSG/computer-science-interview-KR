<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BMAD 두 가지 핵심 아이디어</title>
  <desc id="d">1. 에이전트 기반 계획에서 Analyst, PM, Architect 에이전트가 협업해 상세한 PRD(요구사항)와 아키텍처 문서를 작성하고, 2. 컨텍스트 엔지니어링 개발에서 Scrum Master 에이전트가 그 계획을 필요한 모든 컨텍스트가 담긴 상세 개발 스토리로 변환하면 Dev 에이전트가 추측 없이 구현한다.</desc>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="620" fill="#ffffff"/>

  <!-- ── 1. 에이전트 기반 계획 -->
  <rect x="24" y="24" width="832" height="198" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="64" cy="62" r="16" fill="#1d4ed8"/>
  <text x="64" y="68" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">1</text>
  <text x="48" y="108" font-size="20" font-weight="bold" fill="#1e3a8a">에이전트 기반 계획</text>
  <text x="48" y="134" font-size="15" fill="#374151">(Agentic Planning)</text>

  <!-- 협업하는 에이전트 -->
  <rect x="368" y="48" width="140" height="48" rx="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="438" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Analyst</text>
  <rect x="526" y="48" width="140" height="48" rx="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="596" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">PM</text>
  <rect x="684" y="48" width="140" height="48" rx="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="754" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Architect</text>

  <path d="M438,96 V112 M596,96 V112 M754,96 V112 M438,112 H754" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M596,112 L596,146" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ak)"/>
  <text x="610" y="136" font-size="15" fill="#1d4ed8">에이전트가 협업해 작성</text>

  <!-- 산출물: PRD·아키텍처 문서 -->
  <path d="M416,148 H760 L776,164 V198 H416 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M760,148 V164 H776" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="592" y="179" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">상세한 PRD(요구사항)와 아키텍처 문서</text>

  <!-- ── 2. 컨텍스트 엔지니어링 개발 -->
  <rect x="24" y="262" width="832" height="330" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="64" cy="300" r="16" fill="#047857"/>
  <text x="64" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2</text>
  <text x="48" y="346" font-size="20" font-weight="bold" fill="#065f46">컨텍스트 엔지니어링 개발</text>
  <text x="48" y="372" font-size="15" fill="#374151">(Context-Engineered Development)</text>

  <!-- 계획 전달 -->
  <path d="M596,198 L596,286" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ak)"/>
  <text x="610" y="247" font-size="15" font-weight="bold" fill="#374151">계획</text>
  <rect x="476" y="288" width="240" height="48" rx="24" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="596" y="318" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Scrum Master 에이전트</text>

  <path d="M596,336 L596,386" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ak)"/>
  <text x="610" y="367" font-size="15" fill="#047857">계획을 변환</text>

  <!-- 산출물: 상세 개발 스토리 -->
  <path d="M396,388 H780 L796,404 V452 H396 Z" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <path d="M780,388 V404 H796" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="592" y="414" text-anchor="middle" font-size="15" fill="#047857">“필요한 모든 컨텍스트가 담긴”</text>
  <text x="592" y="440" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">상세 개발 스토리</text>

  <path d="M596,452 L596,502" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ak)"/>

  <rect x="466" y="504" width="260" height="64" rx="32" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="596" y="531" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Dev 에이전트</text>
  <text x="596" y="556" text-anchor="middle" font-size="15" fill="#374151">추측 없이 구현</text>
</svg>
