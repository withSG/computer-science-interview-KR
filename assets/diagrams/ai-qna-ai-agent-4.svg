<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">두 가지 핵심 아이디어</title>
  <desc id="d">BMAD Method의 두 가지 핵심 아이디어인 에이전트 기반 계획과 컨텍스트 엔지니어링 개발을 나타내는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Item 1 Card: Agentic Planning -->
  <rect x="24" y="24" width="832" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="44" y="58.2" font-size="16" font-weight="bold" fill="#2563eb">1. 에이전트 기반 계획 (Agentic Planning)</text>
  
  <text x="64" y="87.55" font-size="13" fill="#1f2933">Analyst / PM / Architect 에이전트가 협업해</text>
  <text x="64" y="115.55" font-size="13" fill="#1f2933">상세한 PRD(요구사항)와 아키텍처 문서를 작성</text>

  <!-- Flow Arrow from 1 to 2 -->
  <path d="M440,144 L440,166" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-green)"/>

  <!-- Item 2 Card: Context-Engineered Development -->
  <rect x="24" y="176" width="832" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="44" y="210.2" font-size="16" font-weight="bold" fill="#059669">2. 컨텍스트 엔지니어링 개발 (Context-Engineered Development)</text>
  
  <text x="64" y="239.55" font-size="13" fill="#1f2933">Scrum Master 에이전트가 계획을 "필요한 모든 컨텍스트가</text>
  <text x="64" y="267.55" font-size="13" fill="#1f2933">담긴" 상세 개발 스토리로 변환 → Dev 에이전트가 추측 없이 구현</text>
</svg>