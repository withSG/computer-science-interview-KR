<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">멱등성과 백필</title>
  <desc id="d">멱등성은 같은 작업을 여러 번 실행해도 결과가 동일해야 한다는 성질로, 날짜 파티션 덮어쓰기 등으로 구현해 재시도·재실행 시 데이터 중복을 막는다. 백필은 사람이 지정한 과거 구간에 대해 DAG를 소급 실행해 누락된 실행을 채운다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 멱등성 -->
  <rect x="24" y="24" width="832" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="60" font-size="20" font-weight="bold" fill="#1d4ed8">멱등성<tspan dx="10" font-size="15" font-weight="normal" fill="#4b5563">Idempotency</tspan></text>
  <text x="48" y="92" font-size="17" font-weight="bold" fill="#111827">같은 작업을 여러 번 실행해도 결과가 동일해야 함</text>

  <rect x="48" y="116" width="170" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="133" y="144" font-size="16" fill="#1f2937" text-anchor="middle">1회 실행</text>
  <rect x="48" y="176" width="170" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="133" y="204" font-size="16" fill="#1f2937" text-anchor="middle">재시도/재실행</text>

  <path d="M222,139 L295,160" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M222,197 L295,176" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <rect x="300" y="128" width="250" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="425" y="157" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">구현</text>
  <text x="425" y="185" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">날짜 파티션 덮어쓰기 등</text>

  <path d="M554,168 L627,168" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <rect x="632" y="128" width="200" height="80" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="732" y="159" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">결과 동일</text>
  <text x="732" y="186" font-size="15" fill="#1f2937" text-anchor="middle">데이터 중복 방지</text>

  <!-- 백필 -->
  <rect x="24" y="260" width="832" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="296" font-size="20" font-weight="bold" fill="#6d28d9">백필<tspan dx="10" font-size="15" font-weight="normal" fill="#4b5563">Backfill</tspan></text>
  <text x="48" y="328" font-size="17" font-weight="bold" fill="#111827">과거 기간에 대해 DAG를 소급 실행</text>

  <text x="392" y="364" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">사람이 지정한 과거 구간</text>
  <path d="M280,382 L280,374 L504,374 L504,382" stroke="#b45309" stroke-width="1.5" fill="none"/>

  <text x="48" y="416" font-size="15" font-weight="bold" fill="#4b5563">과거</text>
  <text x="786" y="416" font-size="15" font-weight="bold" fill="#4b5563">현재</text>

  <rect x="120" y="390" width="64" height="40" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="152" y="416" font-size="15" fill="#5b21b6" text-anchor="middle">실행</text>
  <rect x="200" y="390" width="64" height="40" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="232" y="416" font-size="15" fill="#5b21b6" text-anchor="middle">실행</text>
  <rect x="280" y="390" width="64" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="312" y="416" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">누락</text>
  <rect x="360" y="390" width="64" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="392" y="416" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">누락</text>
  <rect x="440" y="390" width="64" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="472" y="416" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">누락</text>
  <rect x="520" y="390" width="64" height="40" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="552" y="416" font-size="15" fill="#5b21b6" text-anchor="middle">실행</text>
  <rect x="600" y="390" width="64" height="40" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="632" y="416" font-size="15" fill="#5b21b6" text-anchor="middle">실행</text>
  <rect x="680" y="390" width="64" height="40" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="712" y="416" font-size="15" fill="#5b21b6" text-anchor="middle">실행</text>

  <path d="M392,456 L392,436" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <text x="392" y="476" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">소급 실행으로 누락된 실행을 채움</text>
</svg>
