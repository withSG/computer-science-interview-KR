<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">section인가 article인가 div인가</title>
  <desc id="d">HTML 태그 selection, article, div의 사용 기준을 결정하는 의사결정 흐름도</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 질문 1 -->
  <rect x="180" y="30" width="520" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="65" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">이 덩어리를 다른 사이트에 그대로 퍼가도 말이 되는가?</text>

  <!-- 질문 1 -> 예 / 아니오 분기선 -->
  <!-- 예 (오른쪽으로) -->
  <path d="M 700 60 L 760 60 L 760 130" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <rect x="715" y="48" width="30" height="24" fill="#ffffff"/>
  <text x="730" y="65" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">예</text>

  <!-- 아니오 (아래로) -->
  <path d="M 440 90 L 440 180" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
  <rect x="420" y="123" width="40" height="24" fill="#ffffff"/>
  <text x="440" y="140" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">아니오</text>

  <!-- 결과 1: <article> -->
  <g transform="translate(620, 130)">
    <rect x="0" y="0" width="230" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="115" y="38" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">&lt;article&gt;</text>
    <text x="115" y="68" font-size="12" fill="#52606d" text-anchor="middle">(블로그 글, 뉴스 기사, 상품 후기, 댓글 하나)</text>
  </g>

  <!-- 메인 질문 2 -->
  <rect x="180" y="180" width="520" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="215" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">이 덩어리에 붙일 제목(h2~h6)이 있는가?</text>

  <!-- 질문 2 -> 예 / 아니오 분기선 -->
  <!-- 예 (왼쪽 아래로) -->
  <path d="M 310 240 L 310 320" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <rect x="295" y="268" width="30" height="24" fill="#ffffff"/>
  <text x="310" y="285" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">예</text>

  <!-- 아니오 (오른쪽 아래로) -->
  <path d="M 570 240 L 570 320" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>
  <rect x="550" y="268" width="40" height="24" fill="#ffffff"/>
  <text x="570" y="285" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">아니오</text>

  <!-- 결과 2: <section> + 제목 -->
  <g transform="translate(110, 320)">
    <rect x="0" y="0" width="320" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="42" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">&lt;section&gt; + 제목</text>
    <text x="160" y="74" font-size="12" fill="#52606d" text-anchor="middle">("배송 정보", "리뷰" 같은 주제 묶음)</text>
  </g>

  <!-- 결과 3: <div> -->
  <g transform="translate(450, 320)">
    <rect x="0" y="0" width="320" height="110" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="160" y="42" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">&lt;div&gt;</text>
    <text x="160" y="74" font-size="12" fill="#52606d" text-anchor="middle">(순수하게 CSS를 걸기 위한 껍데기)</text>
  </g>
</svg>