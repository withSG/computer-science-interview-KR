<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">section·article·div 판별 순서</title>
  <desc id="d">다른 사이트에 그대로 퍼가도 말이 되는 덩어리면 article, 아니면서 붙일 제목(h2~h6)이 있으면 section과 제목, 둘 다 아니면 CSS를 걸기 위한 껍데기인 div를 쓴다는 판별 흐름.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 질문 1 -->
  <rect x="24" y="24" width="380" height="84" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="54" cy="66" r="15" fill="#374151"/>
  <text x="54" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="84" y="59" font-size="17" font-weight="700" fill="#111827">이 덩어리를 다른 사이트에<tspan x="84" dy="25">그대로 퍼가도 말이 되는가?</tspan></text>

  <!-- 1 예 → article -->
  <line x1="404" y1="66" x2="510" y2="66" stroke="#047857" stroke-width="2.5" marker-end="url(#ay)"/>
  <text x="457" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">예</text>
  <rect x="516" y="24" width="340" height="84" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="536" y="58" font-size="20" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;article&gt;</text>
  <text x="536" y="88" font-size="15" fill="#374151">블로그 글, 뉴스 기사, 상품 후기, 댓글 하나</text>

  <!-- 1 아니오 → 질문 2 -->
  <line x1="214" y1="108" x2="214" y2="178" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#an)"/>
  <text x="228" y="149" font-size="16" font-weight="700" fill="#b91c1c">아니오</text>

  <!-- 질문 2 -->
  <rect x="24" y="184" width="380" height="84" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="54" cy="226" r="15" fill="#374151"/>
  <text x="54" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="84" y="219" font-size="17" font-weight="700" fill="#111827">이 덩어리에 붙일<tspan x="84" dy="25">제목(h2~h6)이 있는가?</tspan></text>

  <!-- 2 예 → section -->
  <line x1="404" y1="226" x2="510" y2="226" stroke="#047857" stroke-width="2.5" marker-end="url(#ay)"/>
  <text x="457" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">예</text>
  <rect x="516" y="184" width="340" height="84" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="536" y="218" font-size="20" font-weight="700" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;section&gt;<tspan font-size="18" fill="#111827" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"> + 제목</tspan></text>
  <text x="536" y="248" font-size="15" fill="#374151">"배송 정보", "리뷰" 같은 주제 묶음</text>

  <!-- 2 아니오 → div -->
  <path d="M214,268 V386 H510" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#an)"/>
  <text x="228" y="318" font-size="16" font-weight="700" fill="#b91c1c">아니오</text>
  <rect x="516" y="344" width="340" height="84" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="536" y="378" font-size="20" font-weight="700" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div&gt;</text>
  <text x="536" y="408" font-size="15" fill="#374151">순수하게 CSS를 걸기 위한 껍데기</text>
</svg>
