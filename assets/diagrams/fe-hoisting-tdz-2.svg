<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">함수 선언문과 함수 표현식의 호이스팅 차이</title>
  <desc id="d">함수 선언문은 생성 단계에 등록과 함께 함수 객체로 초기화되어 언제든 호출할 수 있다. var 함수 표현식은 생성 단계에 undefined로 초기화되고 실행 단계에 할당되므로 할당 전 호출은 TypeError, const 함수 표현식은 생성 단계에 등록만 되어 TDZ에 있으므로 할당 전 접근은 ReferenceError다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="286" y="42" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">생성 단계</text>
  <text x="504" y="42" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">실행 단계</text>
  <text x="737" y="42" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">결과</text>
  <line x1="176" y1="54" x2="396" y2="54" stroke="#9ca3af" stroke-width="2"/>
  <line x1="412" y1="54" x2="596" y2="54" stroke="#9ca3af" stroke-width="2"/>
  <line x1="618" y1="54" x2="856" y2="54" stroke="#9ca3af" stroke-width="2"/>

  <!-- 1. 함수 선언문 -->
  <text x="24" y="116" font-size="17" font-weight="bold" fill="#111827">함수 선언문</text>
  <rect x="176" y="82" width="220" height="56" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="286" y="116" font-size="15" fill="#111827" text-anchor="middle">등록 + <tspan font-weight="bold">함수 객체</tspan> 초기화</text>
  <line x1="396" y1="110" x2="610" y2="110" stroke="#047857" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="618" y="82" width="238" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="737" y="116" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">언제든 호출 가능</text>

  <!-- 2. 함수 표현식(var) -->
  <text x="24" y="196" font-size="17" font-weight="bold" fill="#111827">함수 표현식</text>
  <text x="24" y="218" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(var)</text>
  <rect x="176" y="172" width="220" height="56" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="286" y="206" font-size="15" fill="#111827" text-anchor="middle">등록 + <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">undefined</tspan> 초기화</text>
  <line x1="396" y1="200" x2="472" y2="200" stroke="#b45309" stroke-width="2"/>
  <rect x="472" y="185" width="64" height="30" rx="15" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="504" y="205" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">할당</text>
  <line x1="536" y1="200" x2="610" y2="200" stroke="#b45309" stroke-width="2" marker-end="url(#arr-o)"/>
  <rect x="618" y="172" width="238" height="56" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="737" y="196" font-size="15" fill="#374151" text-anchor="middle">할당 전 호출</text>
  <text x="737" y="219" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">TypeError</text>

  <!-- 3. 함수 표현식(const) -->
  <text x="24" y="286" font-size="17" font-weight="bold" fill="#111827">함수 표현식</text>
  <text x="24" y="308" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(const)</text>
  <rect x="176" y="262" width="220" height="56" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="286" y="296" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold">등록만</tspan> / TDZ</text>
  <line x1="396" y1="290" x2="472" y2="290" stroke="#b91c1c" stroke-width="2"/>
  <rect x="472" y="275" width="64" height="30" rx="15" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="504" y="295" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">할당</text>
  <line x1="536" y1="290" x2="610" y2="290" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-r)"/>
  <rect x="618" y="262" width="238" height="56" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="737" y="286" font-size="15" fill="#374151" text-anchor="middle">할당 전 접근</text>
  <text x="737" y="309" font-size="18" font-weight="bold" fill="#991b1b" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ReferenceError</text>
</svg>
