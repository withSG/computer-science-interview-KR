<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">--no-ff 병합 커밋</title>
  <desc id="d">--no-ff로 병합하면 부모가 c2와 c3 둘인 병합 커밋 M이 생겨, 기능 브랜치가 갈라졌다 합쳐진 범위가 그래프에 남는다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <text x="40" y="50" font-size="16" fill="#4b5563"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1f2937">git merge --no-ff feature</tspan><tspan> 실행 결과</tspan></text>

  <!-- 간선 -->
  <line x1="124" y1="130" x2="206" y2="130" stroke="#64748b" stroke-width="2.5"/>
  <line x1="254" y1="130" x2="536" y2="130" stroke="#047857" stroke-width="3"/>
  <line x1="250.5" y1="142.4" x2="374.5" y2="217.6" stroke="#6d28d9" stroke-width="2.5"/>
  <line x1="415.5" y1="217.6" x2="539.5" y2="142.4" stroke="#047857" stroke-width="3"/>

  <!-- 커밋 -->
  <circle cx="100" cy="130" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="100" y="136" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c1</text>
  <circle cx="230" cy="130" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="230" y="136" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c2</text>
  <circle cx="395" cy="230" r="24" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="395" y="236" font-size="17" font-weight="bold" text-anchor="middle" fill="#6d28d9">c3</text>
  <circle cx="560" cy="130" r="26" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="560" y="137" font-size="19" font-weight="bold" text-anchor="middle" fill="#047857">M</text>

  <!-- M 설명 -->
  <line x1="618" y1="130" x2="592" y2="130" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="622" y="92" width="234" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="640" y="124" font-size="17" font-weight="bold" fill="#047857">병합 커밋</text>
  <text x="640" y="152" font-size="16" fill="#1f2937">부모가 c2와 c3 둘</text>

  <!-- 기능 브랜치 범위 -->
  <path d="M230,270 V282 H560 V270" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="395" y="312" font-size="16" text-anchor="middle" fill="#6d28d9">기능 브랜치의 범위가 그래프에 남는다</text>
</svg>
