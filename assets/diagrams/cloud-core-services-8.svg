<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">클라우드 이전의 서비스 출시 과정</title>
  <desc id="d">기획 확정부터 용량 산정, 서버 견적과 구매 승인, 수 주의 납품 대기, IDC 랙 입고, OS 설치, 네트워크 배선, 방화벽 신청을 모두 거친 뒤에야 애플리케이션을 배포하는 9단계 순차 흐름.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#ffffff"/>

  <text x="24" y="40" font-size="17" font-weight="bold" fill="#111827">클라우드 이전의 서비스 출시</text>

  <!-- 1행 -->
  <rect x="24" y="64" width="178" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="46" cy="84" r="11" fill="#374151"/>
  <text x="46" y="89" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="113" y="118" font-size="16" fill="#111827" text-anchor="middle">기획 확정</text>

  <line x1="208" y1="100" x2="236" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="242" y="64" width="178" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="264" cy="84" r="11" fill="#374151"/>
  <text x="264" y="89" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="331" y="118" font-size="16" fill="#111827" text-anchor="middle">용량 산정</text>

  <line x1="426" y1="100" x2="454" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="460" y="64" width="178" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="482" cy="84" r="11" fill="#374151"/>
  <text x="482" y="89" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="549" y="118" font-size="16" fill="#111827" text-anchor="middle">서버 견적/구매 승인</text>

  <line x1="644" y1="100" x2="672" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="678" y="64" width="178" height="72" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="700" cy="84" r="11" fill="#b45309"/>
  <text x="700" y="89" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="767" y="118" font-size="16" fill="#111827" text-anchor="middle">납품 대기<tspan font-weight="bold" fill="#92400e">(수 주)</tspan></text>

  <!-- 1행 → 2행 줄바꿈 -->
  <path d="M767,138 V151 H113 V164" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2행 -->
  <rect x="24" y="168" width="178" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="46" cy="188" r="11" fill="#374151"/>
  <text x="46" y="193" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="113" y="222" font-size="16" fill="#111827" text-anchor="middle">IDC 랙 입고</text>

  <line x1="208" y1="204" x2="236" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="242" y="168" width="178" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="264" cy="188" r="11" fill="#374151"/>
  <text x="264" y="193" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="331" y="222" font-size="16" fill="#111827" text-anchor="middle">OS 설치</text>

  <line x1="426" y1="204" x2="454" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="460" y="168" width="178" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="482" cy="188" r="11" fill="#374151"/>
  <text x="482" y="193" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="549" y="222" font-size="16" fill="#111827" text-anchor="middle">네트워크 배선</text>

  <line x1="644" y1="204" x2="672" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="678" y="168" width="178" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="700" cy="188" r="11" fill="#374151"/>
  <text x="700" y="193" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="767" y="222" font-size="16" fill="#111827" text-anchor="middle">방화벽 신청</text>

  <!-- 2행 → 3행 줄바꿈 -->
  <path d="M767,242 V255 H113 V268" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3행: 마지막 단계 -->
  <rect x="24" y="272" width="300" height="72" rx="8" fill="#047857" stroke="#065f46" stroke-width="1.5"/>
  <circle cx="46" cy="292" r="11" fill="#ffffff"/>
  <text x="46" y="297" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">9</text>
  <text x="174" y="326" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">그제서야 애플리케이션 배포</text>
</svg>
