<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Multi-AZ 네트워크 설계: AZ별 서브넷과 NAT</title>
  <desc id="d">VPC 10.0.0.0/16 안에 AZ-a와 AZ-c가 같은 구조로 놓인다. 각 AZ에 Public(ALB 노드, NAT GW), Private App(ASG 인스턴스), Private DB(RDS) 서브넷이 있고, 각 AZ의 Private App 라우팅 테이블은 0.0.0.0/0을 같은 AZ의 NAT로 보내며, DB 서브넷에는 기본 경로가 없다.</desc>
  <defs>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="700" fill="#ffffff"/>

  <!-- VPC -->
  <rect x="24" y="24" width="832" height="652" rx="10" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="44" y="58" font-size="18" font-weight="bold" fill="#1f2937">VPC 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="388" y="40" width="104" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="69" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">IGW</text>
  <path d="M440,86 L440,108 M236,108 L644,108 M236,108 L236,168 M644,108 L644,168" stroke="#2563eb" stroke-width="2" fill="none"/>

  <!-- ================= AZ-a ================= -->
  <rect x="44" y="124" width="384" height="532" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="62" y="152" font-size="17" font-weight="bold" fill="#374151">AZ-a</text>

  <!-- Public -->
  <rect x="64" y="168" width="344" height="116" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="80" y="194" font-size="16" font-weight="bold" fill="#1d4ed8">Public 10.0.0.0/24</text>
  <rect x="80" y="210" width="140" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="150" y="242" font-size="16" fill="#1f2937" text-anchor="middle">ALB 노드</text>
  <rect x="252" y="210" width="140" height="52" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="322" y="242" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">NAT GW (a)</text>

  <!-- RT: App -> NAT (a) -->
  <line x1="322" y1="370" x2="322" y2="266" stroke="#c2410c" stroke-width="2.2" marker-end="url(#an)"/>
  <text x="308" y="334" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RT: 0.0.0.0/0 <tspan font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">→</tspan> nat-a</text>

  <!-- Private App -->
  <rect x="64" y="372" width="344" height="100" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="80" y="398" font-size="16" font-weight="bold" fill="#6d28d9">Private App 10.0.10.0/24</text>
  <rect x="80" y="412" width="160" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="160" y="440" font-size="16" fill="#1f2937" text-anchor="middle">ASG 인스턴스</text>

  <!-- App -> DB -->
  <line x1="236" y1="474" x2="236" y2="520" stroke="#4b5563" stroke-width="2" marker-end="url(#ak)"/>

  <!-- Private DB -->
  <rect x="64" y="524" width="344" height="112" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="80" y="550" font-size="16" font-weight="bold" fill="#047857">Private DB 10.0.20.0/24</text>
  <rect x="80" y="566" width="140" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="150" y="596" font-size="16" fill="#1f2937" text-anchor="middle">RDS Primary</text>
  <text x="238" y="596" font-size="15" font-weight="bold" fill="#b91c1c">(기본 경로 없음)</text>

  <!-- ================= AZ-c ================= -->
  <rect x="452" y="124" width="384" height="532" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="470" y="152" font-size="17" font-weight="bold" fill="#374151">AZ-c</text>

  <!-- Public -->
  <rect x="472" y="168" width="344" height="116" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="488" y="194" font-size="16" font-weight="bold" fill="#1d4ed8">Public 10.0.1.0/24</text>
  <rect x="488" y="210" width="140" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="558" y="242" font-size="16" fill="#1f2937" text-anchor="middle">ALB 노드</text>
  <rect x="660" y="210" width="140" height="52" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="730" y="242" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">NAT GW (c)</text>

  <!-- RT: App -> NAT (c) -->
  <line x1="730" y1="370" x2="730" y2="266" stroke="#c2410c" stroke-width="2.2" marker-end="url(#an)"/>
  <text x="716" y="334" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RT: 0.0.0.0/0 <tspan font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">→</tspan> nat-c</text>

  <!-- Private App -->
  <rect x="472" y="372" width="344" height="100" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="488" y="398" font-size="16" font-weight="bold" fill="#6d28d9">Private App 10.0.11.0/24</text>
  <rect x="488" y="412" width="160" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="568" y="440" font-size="16" fill="#1f2937" text-anchor="middle">ASG 인스턴스</text>

  <!-- App -> DB -->
  <line x1="644" y1="474" x2="644" y2="520" stroke="#4b5563" stroke-width="2" marker-end="url(#ak)"/>

  <!-- Private DB -->
  <rect x="472" y="524" width="344" height="112" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="488" y="550" font-size="16" font-weight="bold" fill="#047857">Private DB 10.0.21.0/24</text>
  <rect x="488" y="566" width="140" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="558" y="596" font-size="16" fill="#1f2937" text-anchor="middle">RDS Standby</text>
  <text x="646" y="596" font-size="15" font-weight="bold" fill="#b91c1c">(기본 경로 없음)</text>
</svg>
