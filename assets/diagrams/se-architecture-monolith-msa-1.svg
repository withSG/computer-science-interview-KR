<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">모놀리식이 실제로 아파지는 지점</title>
  <desc id="d">하나의 프로세스와 DB에 결합된 모놀리식 아키텍처의 배포, 스케일, 조직 결합 문제를 설명하는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- 메인 다이어그램 구역 -->
  <g id="diagram">
    <!-- 헤더 / 배포 단위 라벨 -->
    <text x="280" y="49.55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[모놀리식]</text>
    <text x="360" y="49.55" font-size="14" fill="#52606d">하나의 배포 단위</text>

    <!-- 프로세스 박스 -->
    <rect x="180" y="70" width="360" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    
    <!-- 모듈 모음 -->
    <g font-size="14" fill="#1f2933" text-anchor="middle">
      <text x="212" y="104.9">사용자</text>
      <text x="262" y="104.9">주문</text>
      <text x="312" y="104.9">결제</text>
      <text x="362" y="104.9">정산</text>
      <text x="412" y="104.9">알림</text>
      <text x="462" y="104.9">검색</text>
    </g>

    <!-- 화살표 (프로세스 <-> 주석) -->
    <path d="M 548 100 L 582 100" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="590" y="104.55" font-size="13" fill="#52606d">전부 한 프로세스</text>

    <!-- 화살표 (프로세스 -> DB) -->
    <path d="M 360 130 L 360 160" stroke="#1f2933" stroke-width="1.5" fill="none"/>

    <!-- 하나의 DB 박스 -->
    <rect x="290" y="160" width="140" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="360" y="184.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">하나의 DB</text>
  </g>

  <!-- 문제점 카드 구역 -->
  <g id="issues">
    <!-- 문제 1 -->
    <rect x="24" y="230" width="832" height="90" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="6"/>
    <text x="44" y="258.55" font-size="14" font-weight="bold" fill="#dc2626">문제 1. 배포 결합</text>
    <text x="64" y="281.025" font-size="13" fill="#1f2933">알림 문구 하나 고쳐도 전체를 재배포한다.</text>
    <text x="64" y="299.025" font-size="13" fill="#1f2933">배포가 20분이면 20분짜리 리스크를 문구 수정에 지불한다.</text>
    <text x="64" y="317.025" font-size="13" fill="#1f2933">누군가의 실수 하나로 전체가 내려간다.</text>

    <!-- 문제 2 -->
    <rect x="24" y="340" width="832" height="72" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="6"/>
    <text x="44" y="368.55" font-size="14" font-weight="bold" fill="#d97706">문제 2. 스케일 결합</text>
    <text x="64" y="391.025" font-size="13" fill="#1f2933">검색만 CPU를 많이 쓰는데, 늘리려면 사용자·결제·정산까지 함께 복제된다.</text>
    <text x="64" y="409.025" font-size="13" fill="#1f2933">쓰지도 않는 메모리를 인스턴스 수만큼 산다.</text>

    <!-- 문제 3 -->
    <rect x="24" y="432" width="832" height="90" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="6"/>
    <text x="44" y="460.55" font-size="14" font-weight="bold" fill="#7c3aed">문제 3. 조직 결합</text>
    <text x="64" y="483.025" font-size="13" fill="#1f2933">개발자 50명이 한 저장소에 커밋한다.</text>
    <text x="64" y="501.025" font-size="13" fill="#1f2933">배포 큐가 밀리고, 릴리스마다 "누구 것 때문에 깨졌는지" 회의를 한다.</text>
  </g>
</svg>