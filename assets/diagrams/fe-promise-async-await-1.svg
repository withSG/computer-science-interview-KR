<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Promise의 세 상태</title>
  <desc id="d">대기(pending) 상태의 Promise는 resolve()로 이행(fulfilled), reject()로 거부(rejected) 상태가 됩니다. 둘을 합쳐 settled라 하며, 한 번 정해지면 되돌릴 수 없습니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- pending -->
  <rect x="340" y="28" width="200" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="440" y="59" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">pending</text>
  <text x="440" y="85" font-size="16" fill="#374151" text-anchor="middle">대기</text>

  <!-- 분기 -->
  <path d="M440,98 V140" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M440,140 H240 V192" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <path d="M440,140 H640 V192" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <text x="330" y="128" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">resolve()</text>
  <text x="550" y="128" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">reject()</text>

  <!-- fulfilled -->
  <rect x="120" y="196" width="240" height="84" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="240" y="230" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fulfilled</text>
  <text x="240" y="259" font-size="16" fill="#111827" text-anchor="middle">이행 (value)</text>

  <!-- rejected -->
  <rect x="520" y="196" width="240" height="84" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="640" y="230" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">rejected</text>
  <text x="640" y="259" font-size="16" fill="#111827" text-anchor="middle">거부 (reason)</text>

  <!-- settled 묶음 -->
  <path d="M240,290 V310 H388" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M492,310 H640 V290" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="440" y="316" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">settled</text>
  <text x="440" y="348" font-size="16" fill="#374151" text-anchor="middle">한 번 정해지면 <tspan font-weight="bold" fill="#111827">되돌릴 수 없다</tspan></text>
</svg>
