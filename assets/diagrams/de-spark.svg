<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 790" width="880" height="790" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">셔플의 all-to-all 데이터 교환과 Stage 경계</title>
  <desc id="d">Stage 1(map 측) 익스큐터들이 각자 데이터를 키 해시로 갈라 로컬 디스크에 쓰고, Stage 경계 너머 Stage 2(reduce 측) 익스큐터들이 자기 키의 조각을 모든 익스큐터에서 네트워크로 끌어와 정렬·병합해 집계한다. 아래는 작은 테이블을 모든 익스큐터에 복사해 셔플 없이 로컬 조인하는 브로드캐스트 조인이다.</desc>
  <rect width="880" height="790" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- ===== Stage 1 (map 측) ===== -->
  <rect x="24" y="24" width="344" height="332" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="40" y="54" font-size="18" font-weight="700" fill="#1d4ed8">Stage 1 (map 측)</text>
  <text x="274" y="90" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">① shuffle write</text>

  <!-- map Executor 1 -->
  <rect x="40" y="112" width="128" height="76" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="104" y="156" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Executor 1</text>
  <line x1="170" y1="150" x2="194" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <rect x="196" y="104" width="156" height="92" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="274" y="124" font-size="15" fill="#374151" text-anchor="middle">로컬 디스크</text>
  <rect x="206" y="132" width="136" height="26" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="274" y="150" font-size="15" fill="#1e3a8a" text-anchor="middle">키 0,2,4…</text>
  <rect x="206" y="162" width="136" height="26" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/>
  <text x="274" y="180" font-size="15" fill="#9a3412" text-anchor="middle">키 1,3,5…</text>

  <!-- map Executor 2 -->
  <rect x="40" y="242" width="128" height="76" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="104" y="286" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Executor 2</text>
  <line x1="170" y1="280" x2="194" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <rect x="196" y="234" width="156" height="92" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="274" y="254" font-size="15" fill="#374151" text-anchor="middle">로컬 디스크</text>
  <rect x="206" y="262" width="136" height="26" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="274" y="280" font-size="15" fill="#1e3a8a" text-anchor="middle">키 0,2,4…</text>
  <rect x="206" y="292" width="136" height="26" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/>
  <text x="274" y="310" font-size="15" fill="#9a3412" text-anchor="middle">키 1,3,5…</text>

  <!-- ===== 가운데: 키 해시로 분류 / shuffle read / Stage 경계 ===== -->
  <text x="468" y="46" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">키 해시로 분류</text>
  <line x1="404" y1="60" x2="532" y2="60" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="468" y="90" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">② shuffle read</text>
  <text x="468" y="110" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">(all-to-all)</text>
  <line x1="468" y1="124" x2="468" y2="326" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="468" y="350" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">Stage 경계</text>


  <!-- ===== Stage 2 (reduce 측) ===== -->
  <rect x="568" y="24" width="288" height="332" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="584" y="54" font-size="18" font-weight="700" fill="#047857">Stage 2 (reduce 측)</text>
  <text x="720" y="90" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">③ 정렬·병합해 집계</text>

  <!-- 네트워크 이동 (all-to-all) -->
  <line x1="354" y1="145" x2="597" y2="138" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#ab)"/>
  <line x1="354" y1="275" x2="597" y2="162" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#ab)"/>
  <line x1="354" y1="175" x2="597" y2="268" stroke="#c2410c" stroke-width="2.2" marker-end="url(#ao)"/>
  <line x1="354" y1="305" x2="597" y2="292" stroke="#c2410c" stroke-width="2.2" marker-end="url(#ao)"/>

  <rect x="600" y="112" width="240" height="76" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="720" y="144" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Executor 1</text>
  <text x="720" y="168" font-size="15" fill="#1e3a8a" text-anchor="middle">(키 0,2,4…)</text>

  <rect x="600" y="242" width="240" height="76" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="720" y="274" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">Executor 2</text>
  <text x="720" y="298" font-size="15" fill="#9a3412" text-anchor="middle">(키 1,3,5…)</text>

  <!-- ===== 단계 설명 ===== -->
  <rect x="24" y="376" width="832" height="102" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="406" font-size="16" fill="#1f2937"><tspan font-weight="700" fill="#1d4ed8">①</tspan> 각자 자기 몫을 키별로 갈라 로컬 디스크에 기록 (shuffle write)</text>
  <text x="44" y="434" font-size="16" fill="#1f2937"><tspan font-weight="700" fill="#374151">②</tspan> 리듀스 측이 자기 몫의 조각을 네트워크로 끌어옴 (shuffle read)</text>
  <text x="44" y="462" font-size="16" fill="#1f2937"><tspan font-weight="700" fill="#047857">③</tspan> 끌어온 조각들을 정렬·병합해 집계</text>

  <!-- ===== 브로드캐스트 조인 적용 시 ===== -->
  <rect x="24" y="498" width="832" height="180" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="530" font-size="18" font-weight="700" fill="#6d28d9">브로드캐스트 조인 적용 시</text>

  <rect x="48" y="560" width="196" height="64" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="146" y="587" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">작은 테이블</text>
  <text x="146" y="609" font-size="15" fill="#6d28d9" text-anchor="middle">(Broadcast)</text>

  <text x="330" y="566" font-size="15" fill="#6d28d9" text-anchor="middle">모든 익스큐터에 복사</text>
  <line x1="246" y1="584" x2="421" y2="582" stroke="#6d28d9" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="246" y1="600" x2="421" y2="634" stroke="#6d28d9" stroke-width="2" marker-end="url(#ap)"/>

  <rect x="412" y="548" width="428" height="118" rx="8" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="424" y="560" width="212" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="530" y="588" font-size="16" fill="#1f2937" text-anchor="middle">Executor 1 (로컬 조인)</text>
  <rect x="424" y="612" width="212" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="530" y="640" font-size="16" fill="#1f2937" text-anchor="middle">Executor 2 (로컬 조인)</text>

  <text x="660" y="586" font-size="18" font-weight="700" fill="#6d28d9">단일 Stage</text>
  <text x="660" y="612" font-size="16" fill="#1f2937">(셔플 없음)</text>
  <text x="660" y="642" font-size="15" fill="#4b5563">큰 쪽은 움직이지 않음</text>

  <!-- ===== 결론 ===== -->
  <rect x="24" y="696" width="832" height="70" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="724" font-size="16" fill="#1f2937"><tspan font-weight="700" fill="#b91c1c">결론:</tspan> 셔플은 <tspan font-weight="700">all-to-all</tspan> 디스크 IO와 네트워크 이동을 유발해 비쌈</text>
  <text x="44" y="750" font-size="16" fill="#1f2937">→ 브로드캐스트 조인 등으로 선 다발(셔플)을 줄이는 것이 핵심</text>
</svg>
