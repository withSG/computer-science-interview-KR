<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">3-way merge 결과</title>
  <desc id="d">부모가 둘인 커밋 M이 생기고 main이 그리로 이동하는 3-way merge 흐름도</desc>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 마커 정의 -->
  <defs>
    <!-- 기본 잉크 화살표 -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- 파랑 화살표 (위쪽 브랜치 / 머지) -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <!-- 보라 화살표 (머지 커밋 M) -->
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 헤더 / 설명문 (원본텍스트: 병합 결과 — 부모가 둘인 커밋 M이 생기고 main이 그리로 이동한다) -->
  <g id="header">
    <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">병합 결과 — 부모가 둘인 커밋 M이 생기고 main이 그리로 이동한다</text>
  </g>

  <!-- 연결선 (커밋 간 선) -->
  <g id="lines">
    <!-- c1 -> c2 -->
    <line x1="100" y1="180" x2="160" y2="180" stroke="#9aa5b1" stroke-width="2"/>

    <!-- c2 분기 -> c3 (위쪽) -->
    <path d="M 210,180 L 235,180 L 275,120 L 300,120" fill="none" stroke="#2563eb" stroke-width="2"/>

    <!-- c2 분기 -> c5 (아래쪽) -->
    <path d="M 210,180 L 235,180 L 275,240 L 300,240" fill="none" stroke="#059669" stroke-width="2"/>

    <!-- c3 -> c4 -->
    <line x1="350" y1="120" x2="410" y2="120" stroke="#2563eb" stroke-width="2"/>

    <!-- c5 -> c6 -->
    <line x1="350" y1="240" x2="410" y2="240" stroke="#059669" stroke-width="2"/>

    <!-- c4 -> M (위쪽 병합) -->
    <path d="M 460,120 L 515,120 L 565,180 L 580,180" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>

    <!-- c6 -> M (아래쪽 병합) -->
    <path d="M 460,240 L 515,240 L 565,180 L 580,180" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-blue)"/>
  </g>

  <!-- 노드 / 커밋 박스 -->
  <!-- Base commits: c1, c2 -->
  <g id="commit-c1">
    <rect x="50" y="157.5" width="50" height="45" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="75" y="184.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">c1</text>
  </g>

  <g id="commit-c2">
    <rect x="160" y="157.5" width="50" height="45" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="185" y="184.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">c2</text>
  </g>

  <!-- Top branch commits: c3, c4 -->
  <g id="commit-c3">
    <rect x="300" y="97.5" width="50" height="45" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="325" y="124.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">c3</text>
  </g>

  <g id="commit-c4">
    <rect x="410" y="97.5" width="50" height="45" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="435" y="124.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">c4</text>
  </g>

  <!-- Bottom branch commits: c5, c6 -->
  <g id="commit-c5">
    <rect x="300" y="217.5" width="50" height="45" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="325" y="244.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">c5</text>
  </g>

  <g id="commit-c6">
    <rect x="410" y="217.5" width="50" height="45" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="435" y="244.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">c6</text>
  </g>

  <!-- Merge Commit: M -->
  <g id="commit-M">
    <rect x="585" y="155" width="55" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="612.5" y="184.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c3aed">M</text>
  </g>

  <!-- Branch Label: (main) -->
  <g id="label-main">
    <rect x="655" y="162.5" width="75" height="35" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="692.5" y="184.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">(main)</text>
  </g>
</svg>