<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3-way merge 결과</title>
  <desc id="d">c4와 c6 두 커밋을 부모로 갖는 병합 커밋 M이 새로 생기고, main 포인터가 c6에서 M으로 이동한다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 요점 캡션 -->
  <text x="40" y="44" font-size="18" font-weight="bold" fill="#111827">병합 결과 — 부모가 둘인 커밋 M이 생기고 main이 그리로 이동한다</text>

  <!-- 커밋 사이 선 -->
  <line x1="102" y1="220" x2="168" y2="220" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="208.7" y1="208.5" x2="301.3" y2="151.5" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="208.7" y1="231.5" x2="301.3" y2="288.5" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="342" y1="140" x2="418" y2="140" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="342" y1="300" x2="418" y2="300" stroke="#047857" stroke-width="2.5"/>
  <!-- M의 두 부모 연결 -->
  <line x1="459.9" y1="149.4" x2="584.7" y2="208.1" stroke="#6d28d9" stroke-width="3.5"/>
  <line x1="459.9" y1="290.6" x2="584.7" y2="231.9" stroke="#6d28d9" stroke-width="3.5"/>

  <!-- 공통 커밋 -->
  <circle cx="80" cy="220" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="80" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="190" cy="220" r="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="190" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c2</text>

  <!-- feature 쪽 커밋 -->
  <circle cx="320" cy="140" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c3</text>
  <circle cx="440" cy="140" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c4</text>

  <!-- main 쪽 커밋 -->
  <circle cx="320" cy="300" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="320" y="306" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">c5</text>
  <circle cx="440" cy="300" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="306" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">c6</text>

  <!-- feature 포인터 (그대로 c4) -->
  <line x1="440" y1="106" x2="440" y2="118" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="394" y="78" width="92" height="28" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">feature</text>

  <!-- 병합 전 main 위치 (흐리게) -->
  <line x1="440" y1="322" x2="440" y2="336" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="376" y="336" width="128" height="28" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="356" text-anchor="middle" font-size="15" fill="#4b5563">main (병합 전)</text>

  <!-- 병합 커밋 M -->
  <circle cx="610" cy="220" r="28" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
  <text x="610" y="227" text-anchor="middle" font-size="20" font-weight="bold" fill="#6d28d9">M</text>

  <!-- main 포인터 (M으로 이동) -->
  <line x1="668" y1="220" x2="644" y2="220" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <rect x="670" y="205" width="80" height="30" rx="15" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="710" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">main</text>

  <!-- 설명 -->
  <text x="670" y="276" font-size="16" font-weight="bold" fill="#6d28d9">M = 병합 커밋</text>
  <text x="670" y="302" font-size="15" fill="#1f2937">부모 2개: c4, c6</text>
  <text x="670" y="326" font-size="15" fill="#1f2937">main: c6 → M 이동</text>
</svg>
