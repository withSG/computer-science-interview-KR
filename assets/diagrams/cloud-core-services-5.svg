<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">앞단 요청 경로</title>
  <desc id="d">사용자 브라우저의 요청이 Route 53(이름 해석), CloudFront(엣지 캐시, 히트면 즉시 응답하고 미스면 오리진으로 전달), ALB 또는 NLB를 차례로 지나 여러 AZ에 분산된 EC2/컨테이너 대상 그룹에 도달하는 경로.</desc>
  <rect width="880" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 사용자 브라우저 -->
  <rect x="48" y="24" width="240" height="44" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="168" y="52" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">사용자 브라우저</text>

  <!-- ① -->
  <line x1="168" y1="68" x2="168" y2="121" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="186" y="101" font-size="15" fill="#1f2937"><tspan font-weight="700">①</tspan> 이름 해석: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">shop.example.com</tspan> 은 어디?</text>

  <!-- Route 53 -->
  <rect x="48" y="124" width="240" height="72" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="168" y="154" font-size="18" font-weight="700" fill="#4c1d95" text-anchor="middle">Route 53</text>
  <text x="168" y="180" font-size="15" fill="#4c1d95" text-anchor="middle">(권한 있는 DNS)</text>
  <line x1="312" y1="134" x2="312" y2="186" stroke="#6d28d9" stroke-width="3"/>
  <text x="326" y="154" font-size="15" fill="#1f2937">DNS. 어느 엣지/어느 리전으로 보낼지 결정</text>
  <text x="326" y="180" font-size="15" fill="#1f2937">가중치/지연시간/장애조치 라우팅 정책</text>

  <!-- ② -->
  <line x1="168" y1="196" x2="168" y2="249" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="186" y="229" font-size="15" fill="#1f2937"><tspan font-weight="700">②</tspan> 응답: 가장 가까운 엣지 주소</text>

  <!-- CloudFront -->
  <rect x="48" y="252" width="240" height="72" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="168" y="282" font-size="18" font-weight="700" fill="#7c2d12" text-anchor="middle">CloudFront</text>
  <text x="168" y="308" font-size="15" fill="#7c2d12" text-anchor="middle">(CDN, 엣지 캐시)</text>

  <line x1="288" y1="288" x2="353" y2="288" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="356" y="264" width="440" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="374" y="294" font-size="16" fill="#1f2937"><tspan font-weight="700" fill="#047857">캐시 히트</tspan> → 여기서 즉시 응답 (리전까지 안 감)</text>

  <!-- ③ -->
  <line x1="168" y1="324" x2="168" y2="411" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="186" y="358" font-size="15" fill="#1f2937"><tspan font-weight="700">③</tspan> <tspan font-weight="700" fill="#b45309">캐시 미스</tspan> → 오리진으로 전달</text>

  <!-- 리전 -->
  <rect x="32" y="382" width="816" height="234" rx="10" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="832" y="406" font-size="15" font-weight="700" fill="#475569" text-anchor="end">리전</text>

  <!-- ALB / NLB -->
  <rect x="48" y="414" width="240" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="168" y="444" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">ALB (L7)</text>
  <text x="168" y="470" font-size="15" fill="#1e3a8a" text-anchor="middle">또는 NLB (L4)</text>
  <line x1="312" y1="424" x2="312" y2="476" stroke="#1d4ed8" stroke-width="3"/>
  <text x="326" y="444" font-size="15" fill="#1f2937">경로/호스트 기반 라우팅, 헬스 체크</text>
  <text x="326" y="470" font-size="15" fill="#1f2937">TLS 종료, 여러 AZ의 대상으로 분산</text>

  <!-- ④ -->
  <line x1="168" y1="486" x2="168" y2="518" stroke="#374151" stroke-width="2"/>
  <text x="156" y="508" font-size="15" font-weight="700" fill="#1f2937" text-anchor="end">④</text>
  <line x1="128" y1="518" x2="520" y2="518" stroke="#374151" stroke-width="2"/>
  <line x1="128" y1="517" x2="128" y2="541" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="324" y1="517" x2="324" y2="541" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="520" y1="517" x2="520" y2="541" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="48" y="544" width="552" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="324" y="578" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">EC2/컨테이너 대상 그룹 — 여러 AZ에 분산</text>
</svg>
