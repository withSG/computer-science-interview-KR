<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">결정 순서</title>
  <desc id="d">클라우드 모델 선택을 위한 3단계 결정 순서 흐름도</desc>
  <rect width="880" height="570" fill="#ffffff"/>
  
  <defs>
    <!-- Arrow Markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Step 1 Group -->
  <!-- Question 1 -->
  <rect x="40" y="30" width="370" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="225" y="60" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1. 법적으로 데이터를 밖에 둘 수 있는가?</text>

  <!-- Branch No 1 -->
  <path d="M120,80 L120,130 L450,130" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="135" y="103" width="50" height="20" fill="#ffffff"/>
  <text x="160" y="117" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">아니오</text>

  <!-- Result 1 -->
  <rect x="450" y="100" width="390" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="645" y="125" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">해당 데이터는 프라이빗/온프레미스 확정</text>
  <text x="645" y="145" font-size="13" fill="#52606d" text-anchor="middle">나머지는 퍼블릭 → 하이브리드</text>

  <!-- Branch Yes 1 -->
  <path d="M225,80 L225,185" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="210" y="115" width="30" height="20" fill="#ffffff"/>
  <text x="225" y="129" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">예</text>


  <!-- Step 2 Group -->
  <!-- Question 2 -->
  <rect x="40" y="185" width="370" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="225" y="215" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2. 부하가 변동적인가?</text>

  <!-- Branch No 2 -->
  <path d="M120,235 L120,285 L450,285" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <rect x="135" y="258" width="220" height="20" fill="#ffffff"/>
  <text x="245" y="272" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">아니오(평탄·대규모·수년 안정)</text>

  <!-- Result 2 -->
  <rect x="450" y="260" width="390" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="645" y="290" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">자체 구축/장기 약정과 비교 검토</text>

  <!-- Branch Yes 2 -->
  <path d="M225,235 L225,340" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="210" y="270" width="30" height="20" fill="#ffffff"/>
  <text x="225" y="284" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">예</text>


  <!-- Step 3 Group -->
  <!-- Question 3 -->
  <rect x="40" y="340" width="370" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="225" y="365" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3. 특정 벤더에 못 갈 사업적 제약이 있는가?</text>
  <text x="225" y="385" font-size="11.5" fill="#52606d" text-anchor="middle">(고객 요구, 경쟁관계, 기존 계약)</text>

  <!-- Branch Yes 3 -->
  <path d="M120,400 L120,450 L450,450" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/>
  <rect x="135" y="423" width="30" height="20" fill="#ffffff"/>
  <text x="150" y="437" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">예</text>

  <!-- Result 3 - Yes -->
  <rect x="450" y="425" width="390" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="645" y="455" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">멀티 클라우드를 검토하되 운영 복잡도 비용을 명시적으로 계산</text>

  <!-- Branch No 3 -->
  <path d="M225,400 L225,520 L450,520" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="210" y="443" width="50" height="20" fill="#ffffff"/>
  <text x="235" y="457" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">아니오</text>

  <!-- Result 3 - No -->
  <rect x="450" y="495" width="390" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="645" y="525" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">단일 퍼블릭 클라우드</text>
</svg>