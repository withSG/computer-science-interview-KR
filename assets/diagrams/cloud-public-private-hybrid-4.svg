<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배포 모델 결정 순서</title>
  <desc id="d">세 질문을 차례로 거친다. 1) 법적으로 데이터를 밖에 둘 수 없으면 해당 데이터는 프라이빗/온프레미스로 확정하고 나머지는 퍼블릭에 두어 하이브리드가 된다. 2) 부하가 변동적이지 않으면(평탄·대규모·수년 안정) 자체 구축/장기 약정과 비교 검토한다. 3) 특정 벤더에 못 갈 사업적 제약이 있으면 운영 복잡도 비용을 명시적으로 계산하며 멀티 클라우드를 검토하고, 없으면 단일 퍼블릭 클라우드다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 질문 1 -->
  <rect x="24" y="52" width="356" height="56" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="44" y="86" font-size="16" font-weight="bold" fill="#111827">1. 법적으로 데이터를 밖에 둘 수 있는가?</text>
  <path d="M382,80 L552,80" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="466" y="70" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">아니오</text>
  <rect x="556" y="28" width="300" height="104" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="706" y="60" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">해당 데이터는</text>
  <text x="706" y="84" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">프라이빗/온프레미스 확정</text>
  <text x="706" y="114" font-size="15" fill="#1f2937" text-anchor="middle">나머지는 퍼블릭 → 하이브리드</text>

  <path d="M202,110 L202,164" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="216" y="143" font-size="15" font-weight="bold" fill="#374151">예</text>

  <!-- 질문 2 -->
  <rect x="24" y="168" width="356" height="56" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="44" y="202" font-size="16" font-weight="bold" fill="#111827">2. 부하가 변동적인가?</text>
  <path d="M382,196 L552,196" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="466" y="186" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">아니오</text>
  <text x="466" y="218" font-size="14" fill="#374151" text-anchor="middle">(평탄·대규모·수년 안정)</text>
  <rect x="556" y="168" width="300" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="706" y="202" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">자체 구축/장기 약정과 비교 검토</text>

  <path d="M202,226 L202,280" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="216" y="259" font-size="15" font-weight="bold" fill="#374151">예</text>

  <!-- 질문 3 -->
  <rect x="24" y="284" width="356" height="76" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="44" y="316" font-size="16" font-weight="bold" fill="#111827">3. 특정 벤더에 못 갈 사업적 제약이 있는가?</text>
  <text x="44" y="344" font-size="15" fill="#374151">(고객 요구, 경쟁관계, 기존 계약)</text>
  <path d="M382,322 L552,322" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="466" y="312" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">예</text>
  <rect x="556" y="284" width="300" height="76" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="706" y="316" font-size="16" font-weight="bold" fill="#881337" text-anchor="middle">멀티 클라우드를 검토하되</text>
  <text x="706" y="344" font-size="15" fill="#1f2937" text-anchor="middle">운영 복잡도 비용을 명시적으로 계산</text>

  <path d="M202,362 L202,448 L552,448" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="216" y="410" font-size="15" font-weight="bold" fill="#374151">아니오</text>
  <rect x="556" y="420" width="300" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="706" y="454" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">단일 퍼블릭 클라우드</text>
</svg>
