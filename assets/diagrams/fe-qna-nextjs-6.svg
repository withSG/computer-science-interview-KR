<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SSG 렌더링 흐름</title>
  <desc id="d">SSG는 빌드 시 모든 페이지의 HTML을 미리 생성해 두고, CDN에 캐싱한 뒤 요청에 즉시 응답한다.</desc>
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 빌드 타임 구간 -->
  <rect x="24" y="24" width="418" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="54" font-size="16" font-weight="700" fill="#92400e">빌드 타임</text>

  <!-- 화살표 -->
  <line x1="214" y1="116" x2="246" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="436" y1="116" x2="454" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="630" y1="116" x2="662" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 1. 빌드 시 -->
  <rect x="46" y="82" width="164" height="68" rx="34" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="128" y="122" font-size="17" fill="#1f2937" text-anchor="middle">빌드 시</text>

  <!-- 2. 모든 페이지 HTML 미리 생성 (핵심, 여러 장 겹친 모양) -->
  <rect x="266" y="70" width="164" height="68" rx="8" fill="#fde68a"/>
  <rect x="260" y="76" width="164" height="68" rx="8" fill="#fcd34d"/>
  <rect x="254" y="82" width="164" height="68" rx="8" fill="#b45309" stroke="#92400e" stroke-width="2"/>
  <text x="336" y="112" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
    <tspan x="336">모든 페이지</tspan>
    <tspan x="336" dy="23">HTML 미리 생성</tspan>
  </text>

  <!-- 3. CDN 캐싱 -->
  <rect x="462" y="82" width="164" height="68" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="544" y="122" font-size="17" fill="#1f2937" text-anchor="middle">CDN 캐싱</text>

  <!-- 4. 즉시 응답 -->
  <rect x="670" y="82" width="164" height="68" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="752" y="122" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">즉시 응답</text>

  <!-- 단계 번호 -->
  <circle cx="80" cy="82" r="12" fill="#475569" stroke="#ffffff" stroke-width="2"/>
  <text x="80" y="87" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="280" cy="82" r="12" fill="#78350f" stroke="#ffffff" stroke-width="2"/>
  <text x="280" y="87" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="488" cy="82" r="12" fill="#475569" stroke="#ffffff" stroke-width="2"/>
  <text x="488" y="87" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="696" cy="82" r="12" fill="#065f46" stroke="#ffffff" stroke-width="2"/>
  <text x="696" y="87" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 요약 캡션 -->
  <line x1="24" y1="194" x2="856" y2="194" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="222" font-size="15" fill="#374151" text-anchor="middle">렌더링 시점: 빌드 타임<tspan dx="12">·</tspan><tspan dx="12">HTML 생성 위치: 서버</tspan></text>
</svg>
