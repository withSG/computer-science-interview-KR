  <title id="t">퀵 정렬 Lomuto 파티션 과정</title>
  <desc id="d">마지막 원소 4를 피벗으로 [7 2 1 8 6 3 5 | 4]를 분할하는 과정. j가 왼쪽부터 훑으며 4보다 작은 값을 작은 값 구역 끝(i)으로 swap하고, 마지막에 피벗을 경계로 [2 1 3 (4) 6 7 5 8]이 되어 4가 최종 위치에 확정된다.</desc>
