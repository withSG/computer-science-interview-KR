<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">퀵 정렬 (Quick Sort) 분할 과정을 나타낸 다이어그램</title>
  <desc id="d">피벗 4를 기준으로 배열 [7, 2, 1, 8, 6, 3, 5]를 비교하고 교환하며 정렬하는 단계별 ASCII 다이어그램 전사본입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="780" fill="#ffffff"/>

  <!-- 헤딩 / 제목 -->
  <text x="30" y="40" font-size="16" font-weight="bold" fill="#1f2933">5. 퀵 정렬 (Quick Sort)</text>

  <!-- pivot 안내 라벨 -->
  <rect x="30" y="60" width="160" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="110" y="80" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">pivot = 마지막 원소 4</text>

  <!-- 원본 초기 배열 상태 [ 7 2 1 8 6 3 5 | 4 ] -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="310" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="20" y="25" font-size="14" font-weight="bold" fill="#1f2933">[</text>
    <text x="40" y="25" font-size="13" fill="#1f2933" text-anchor="middle">7</text>
    <text x="75" y="25" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
    <text x="110" y="25" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
    <text x="145" y="25" font-size="13" fill="#1f2933" text-anchor="middle">8</text>
    <text x="180" y="25" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
    <text x="215" y="25" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
    <text x="250" y="25" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
    <line x1="272" y1="5" x2="272" y2="35" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="288" y="25" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">4</text>
    <text x="302" y="25" font-size="14" font-weight="bold" fill="#1f2933">]</text>
  </g>

  <!-- 원본 설명 문구 -->
  <text x="30" y="180" font-size="13" fill="#52606d">j를 왼쪽부터 훑으면서, 4보다 작은 값을 만나면 "작은 값 구역" 끝(i)으로 보낸다</text>

  <!-- 단계별 추적 구역 -->
  <!-- j=0 -->
  <g transform="translate(30, 205)">
    <text x="0" y="25" font-size="13" font-weight="bold" fill="#2563eb">j=0:</text>
    <text x="45" y="25" font-size="13" fill="#1f2933">7 ≥ 4 → 통과</text>
  </g>

  <!-- j=1 -->
  <g transform="translate(30, 255)">
    <text x="0" y="25" font-size="13" font-weight="bold" fill="#2563eb">j=1:</text>
    <text x="45" y="25" font-size="13" fill="#1f2933">2 &lt; 4 → i=0, swap</text>
    <!-- 배열 [ 2 7 1 8 6 3 5 | 4 ] -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="310" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
      <text x="20" y="25" font-size="14" font-weight="bold" fill="#1f2933">[</text>
      <!-- 교환 강조 2, 7 -->
      <rect x="30" y="6" width="20" height="28" rx="2" fill="#ecfdf5"/>
      <text x="40" y="25" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">2</text>
      <rect x="65" y="6" width="20" height="28" rx="2" fill="#fffbeb"/>
      <text x="75" y="25" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">7</text>
      <text x="110" y="25" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
      <text x="145" y="25" font-size="13" fill="#1f2933" text-anchor="middle">8</text>
      <text x="180" y="25" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
      <text x="215" y="25" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
      <text x="250" y="25" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
      <line x1="272" y1="5" x2="272" y2="35" stroke="#9aa5b1" stroke-width="1.5"/>
      <text x="288" y="25" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">4</text>
      <text x="302" y="25" font-size="14" font-weight="bold" fill="#1f2933">]</text>
    </g>
  </g>

  <!-- j=2 -->
  <g transform="translate(30, 305)">
    <text x="0" y="25" font-size="13" font-weight="bold" fill="#2563eb">j=2:</text>
    <text x="45" y="25" font-size="13" fill="#1f2933">1 &lt; 4 → i=1, swap</text>
    <!-- 배열 [ 2 1 7 8 6 3 5 | 4 ] -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="310" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
      <text x="20" y="25" font-size="14" font-weight="bold" fill="#1f2933">[</text>
      <text x="40" y="25" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
      <rect x="65" y="6" width="20" height="28" rx="2" fill="#ecfdf5"/>
      <text x="75" y="25" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">1</text>
      <rect x="100" y="6" width="20" height="28" rx="2" fill="#fffbeb"/>
      <text x="110" y="25" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">7</text>
      <text x="145" y="25" font-size="13" fill="#1f2933" text-anchor="middle">8</text>
      <text x="180" y="25" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
      <text x="215" y="25" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
      <text x="250" y="25" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
      <line x1="272" y1="5" x2="272" y2="35" stroke="#9aa5b1" stroke-width="1.5"/>
      <text x="288" y="25" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">4</text>
      <text x="302" y="25" font-size="14" font-weight="bold" fill="#1f2933">]</text>
    </g>
  </g>

  <!-- j=3 -->
  <g transform="translate(30, 355)">
    <text x="0" y="25" font-size="13" font-weight="bold" fill="#2563eb">j=3:</text>
    <text x="45" y="25" font-size="13" fill="#1f2933">8 ≥ 4 → 통과</text>
  </g>

  <!-- j=4 -->
  <g transform="translate(30, 405)">
    <text x="0" y="25" font-size="13" font-weight="bold" fill="#2563eb">j=4:</text>
    <text x="45" y="25" font-size="13" fill="#1f2933">6 ≥ 4 → 통과</text>
  </g>

  <!-- j=5 -->
  <g transform="translate(30, 455)">
    <text x="0" y="25" font-size="13" font-weight="bold" fill="#2563eb">j=5:</text>
    <text x="45" y="25" font-size="13" fill="#1f2933">3 &lt; 4 → i=2, swap</text>
    <!-- 배열 [ 2 1 3 8 6 7 5 | 4 ] -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="310" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
      <text x="20" y="25" font-size="14" font-weight="bold" fill="#1f2933">[</text>
      <text x="40" y="25" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
      <text x="75" y="25" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
      <rect x="100" y="6" width="20" height="28" rx="2" fill="#ecfdf5"/>
      <text x="110" y="25" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">3</text>
      <text x="145" y="25" font-size="13" fill="#1f2933" text-anchor="middle">8</text>
      <text x="180" y="25" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
      <rect x="205" y="6" width="20" height="28" rx="2" fill="#fffbeb"/>
      <text x="215" y="25" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">7</text>
      <text x="250" y="25" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
      <line x1="272" y1="5" x2="272" y2="35" stroke="#9aa5b1" stroke-width="1.5"/>
      <text x="288" y="25" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">4</text>
      <text x="302" y="25" font-size="14" font-weight="bold" fill="#1f2933">]</text>
    </g>
  </g>

  <!-- j=6 -->
  <g transform="translate(30, 505)">
    <text x="0" y="25" font-size="13" font-weight="bold" fill="#2563eb">j=6:</text>
    <text x="45" y="25" font-size="13" fill="#1f2933">5 ≥ 4 → 통과</text>
  </g>

  <!-- 마지막 피벗 배치 및 결과 -->
  <g transform="translate(30, 560)">
    <text x="0" y="25" font-size="13" fill="#1f2933">마지막에 피벗을 경계로</text>
    
    <!-- 최종 확정 배열 [ 2 1 3 (4) 6 7 5 8 ] -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="310" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
      <text x="20" y="25" font-size="14" font-weight="bold" fill="#1f2933">[</text>
      
      <!-- '작다' 영역 배경 -->
      <rect x="30" y="6" width="95" height="28" rx="2" fill="#ecfdf5"/>
      <text x="40" y="25" font-size="13" fill="#059669" text-anchor="middle">2</text>
      <text x="75" y="25" font-size="13" fill="#059669" text-anchor="middle">1</text>
      <text x="110" y="25" font-size="13" fill="#059669" text-anchor="middle">3</text>
      
      <!-- 확정된 피벗 (4) -->
      <rect x="135" y="6" width="30" height="28" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="150" y="25" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">(4)</text>
      
      <!-- '크다' 영역 배경 -->
      <rect x="170" y="6" width="125" height="28" rx="2" fill="#eff6ff"/>
      <text x="180" y="25" font-size="13" fill="#2563eb" text-anchor="middle">6</text>
      <text x="215" y="25" font-size="13" fill="#2563eb" text-anchor="middle">7</text>
      <text x="250" y="25" font-size="13" fill="#2563eb" text-anchor="middle">5</text>
      <text x="285" y="25" font-size="13" fill="#2563eb" text-anchor="middle">8</text>
      
      <text x="302" y="25" font-size="14" font-weight="bold" fill="#1f2933">]</text>

      <!-- 주석 및 화살표 -->
      <!-- '작다' 라벨 및 화살표 -->
      <text x="77" y="62" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">작다</text>
      <path d="M 125,52 L 135,42" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
      <path d="M 175,52 L 165,42" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
      <!-- '크다' 라벨 -->
      <text x="232" y="62" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">크다</text>
    </g>
  </g>

  <!-- 최종 확정 설명 각주 -->
  <g transform="translate(210, 675)">
    <rect x="0" y="0" width="340" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="170" y="22" font-size="13" fill="#52606d" text-anchor="middle">4는 여기서 최종 확정. 다시 볼 일 없다</text>
  </g>

</svg>