<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">디바운스와 스로틀 타임라인 비교</title>
  <desc id="d">같은 두 번의 연속 이벤트에 대해 디바운스는 각 묶음의 마지막 이벤트 후 delay가 지나면 한 번 실행하고, 스로틀은 이벤트가 이어지는 동안 delay 간격으로 한 번씩 실행하는 모습을 시간축에 나란히 보여준다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <circle cx="276" cy="40" r="5" fill="#374151"/>
  <text x="288" y="45" font-size="15" fill="#374151">이벤트</text>
  <circle cx="358" cy="40" r="8" fill="#ffffff" stroke="#374151" stroke-width="3"/>
  <text x="374" y="45" font-size="15" fill="#374151">실행</text>
  <rect x="428" y="31" width="30" height="18" rx="3" fill="#e5e9f0"/>
  <text x="466" y="45" font-size="15" fill="#374151">이벤트가 연속으로 발생하는 구간</text>

  <!-- 연속 이벤트 구간 띠 -->
  <rect x="276" y="78" width="188" height="330" rx="6" fill="#e5e9f0"/>
  <rect x="576" y="78" width="188" height="330" rx="6" fill="#e5e9f0"/>

  <!-- 1. 이벤트 발생 -->
  <text x="24" y="106" font-size="18" font-weight="bold" fill="#111827">이벤트 발생</text>
  <text x="24" y="130" font-size="15" fill="#4b5563">짧은 간격으로 연속 발생</text>
  <line x1="270" y1="110" x2="850" y2="110" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="290" cy="110" r="5" fill="#374151"/>
  <circle cx="310" cy="110" r="5" fill="#374151"/>
  <circle cx="330" cy="110" r="5" fill="#374151"/>
  <circle cx="350" cy="110" r="5" fill="#374151"/>
  <circle cx="370" cy="110" r="5" fill="#374151"/>
  <circle cx="390" cy="110" r="5" fill="#374151"/>
  <circle cx="410" cy="110" r="5" fill="#374151"/>
  <circle cx="430" cy="110" r="5" fill="#374151"/>
  <circle cx="450" cy="110" r="5" fill="#374151"/>
  <circle cx="590" cy="110" r="5" fill="#374151"/>
  <circle cx="610" cy="110" r="5" fill="#374151"/>
  <circle cx="630" cy="110" r="5" fill="#374151"/>
  <circle cx="650" cy="110" r="5" fill="#374151"/>
  <circle cx="670" cy="110" r="5" fill="#374151"/>
  <circle cx="690" cy="110" r="5" fill="#374151"/>
  <circle cx="710" cy="110" r="5" fill="#374151"/>
  <circle cx="730" cy="110" r="5" fill="#374151"/>
  <circle cx="750" cy="110" r="5" fill="#374151"/>

  <!-- 2. 디바운스 -->
  <text x="24" y="212" font-size="19" font-weight="bold" fill="#1d4ed8">디바운스<tspan font-size="15" font-weight="normal"> (Debounce)</tspan></text>
  <text x="24" y="238" font-size="15" fill="#374151">마지막 이벤트 후</text>
  <text x="24" y="260" font-size="15" fill="#374151">delay 경과 시 실행</text>
  <text x="370" y="212" font-size="15" fill="#4b5563" text-anchor="middle">연속 입력 중 실행 안됨</text>
  <line x1="270" y1="230" x2="850" y2="230" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="530" cy="230" r="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="3.5"/>
  <circle cx="830" cy="230" r="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="3.5"/>
  <path d="M450,250 V258 H530 V250" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="490" y="280" font-size="15" fill="#1d4ed8" text-anchor="middle">delay</text>
  <path d="M750,250 V258 H830 V250" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="790" y="280" font-size="15" fill="#1d4ed8" text-anchor="middle">delay</text>

  <!-- 3. 스로틀 -->
  <text x="24" y="336" font-size="19" font-weight="bold" fill="#047857">스로틀<tspan font-size="15" font-weight="normal"> (Throttle)</tspan></text>
  <text x="24" y="362" font-size="15" fill="#374151">일정 간격으로 실행</text>
  <text x="24" y="384" font-size="15" fill="#374151">(delay 간격으로 최대 한 번)</text>
  <line x1="270" y1="350" x2="850" y2="350" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="290" cy="350" r="10" fill="#ffffff" stroke="#047857" stroke-width="3.5"/>
  <circle cx="370" cy="350" r="10" fill="#ffffff" stroke="#047857" stroke-width="3.5"/>
  <circle cx="450" cy="350" r="10" fill="#ffffff" stroke="#047857" stroke-width="3.5"/>
  <circle cx="590" cy="350" r="10" fill="#ffffff" stroke="#047857" stroke-width="3.5"/>
  <circle cx="670" cy="350" r="10" fill="#ffffff" stroke="#047857" stroke-width="3.5"/>
  <circle cx="750" cy="350" r="10" fill="#ffffff" stroke="#047857" stroke-width="3.5"/>
  <path d="M290,370 V378 H370 V370" fill="none" stroke="#047857" stroke-width="1.5"/>
  <text x="330" y="400" font-size="15" fill="#047857" text-anchor="middle">delay</text>

  <!-- 시간축 -->
  <line x1="270" y1="440" x2="846" y2="440" stroke="#6b7280" stroke-width="1.5" marker-end="url(#axis)"/>
  <text x="850" y="466" font-size="15" fill="#4b5563" text-anchor="end">시간</text>
</svg>
