<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">cherry-pick으로 핫픽스 커밋 하나만 복제</title>
  <desc id="d">c1에서 갈라진 main과 release 중 main의 핫픽스 커밋 c3 하나만 골라 release 끝에 c3'로 복제합니다. c3'는 c3와 같은 변경이지만 해시가 다른 새 커밋입니다.</desc>
  <rect width="880" height="310" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 브랜치 이름 -->
  <text x="40" y="96" font-size="18" font-weight="700" fill="#1d4ed8">main</text>
  <text x="40" y="226" font-size="18" font-weight="700" fill="#047857">release</text>

  <!-- 부모 연결선 -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M220,148 C250,148 250,90 280,90"/>
    <path d="M220,168 C250,168 250,220 280,220"/>
    <path d="M360,90 H420"/>
    <path d="M500,90 H560"/>
    <path d="M360,220 H420"/>
    <path d="M500,220 H560"/>
  </g>

  <!-- 공통 조상 c1 -->
  <rect x="140" y="132" width="80" height="52" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="180" y="164" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">c1</text>

  <!-- main 레인 -->
  <rect x="280" y="64" width="80" height="52" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="96" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">c2</text>

  <rect x="420" y="64" width="80" height="52" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="460" y="87" font-size="18" font-weight="700" fill="#78350f" text-anchor="middle">c3</text>
  <text x="460" y="107" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">핫픽스</text>

  <rect x="560" y="64" width="80" height="52" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="600" y="96" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">c4</text>

  <!-- release 레인 -->
  <rect x="280" y="194" width="80" height="52" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="320" y="226" font-size="18" font-weight="700" fill="#064e3b" text-anchor="middle">r1</text>

  <rect x="420" y="194" width="80" height="52" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="460" y="226" font-size="18" font-weight="700" fill="#064e3b" text-anchor="middle">r2</text>

  <rect x="560" y="194" width="80" height="52" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="600" y="226" font-size="18" font-weight="700" fill="#78350f" text-anchor="middle">c3'</text>

  <!-- cherry-pick 복제 화살표 -->
  <path d="M475,120 C475,160 585,150 585,188" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ah)"/>
  <text x="542" y="152" font-size="16" font-weight="700" fill="#b45309">cherry-pick</text>

  <!-- c3' 설명 -->
  <text x="660" y="226" font-size="16" font-weight="700" fill="#b45309">← 같은 변경, 다른 해시</text>

  <!-- 캡션 -->
  <text x="40" y="284" font-size="15" fill="#374151">c3 하나만 골라 복제 · c2는 따라오지 않는다</text>
</svg>
