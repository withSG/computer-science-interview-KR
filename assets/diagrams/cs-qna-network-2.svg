<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TCP 4-way Handshake 연결 종료</title>
  <desc id="d">Client가 FIN으로 종료를 요청하면 Server가 ACK로 확인하고, 남은 데이터를 보낸 뒤 FIN으로 종료 준비 완료를 알리며, Client의 ACK로 연결이 종료되는 네 단계.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 주체 -->
  <rect x="95" y="24" width="150" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="170" y="52" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Client</text>
  <rect x="455" y="24" width="150" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="530" y="52" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">Server</text>

  <!-- 생명선 -->
  <line x1="170" y1="68" x2="170" y2="430" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="530" y1="68" x2="530" y2="430" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 2와 3 사이: 서버 쪽 남은 데이터 전송 구간 -->
  <rect x="523" y="220" width="14" height="90" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>

  <!-- 1. FIN (Client → Server) -->
  <line x1="170" y1="130" x2="528" y2="130" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="350" y="116" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">FIN</text>

  <!-- 2. ACK (Server → Client) -->
  <line x1="530" y1="200" x2="172" y2="200" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="350" y="186" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">ACK</text>

  <!-- 3. FIN (Server → Client) -->
  <line x1="530" y1="330" x2="172" y2="330" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="350" y="316" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">FIN</text>

  <!-- 4. ACK (Client → Server) -->
  <line x1="170" y1="400" x2="528" y2="400" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="350" y="386" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ACK</text>

  <!-- 단계 설명 -->
  <line x1="542" y1="130" x2="638" y2="130" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="542" y1="200" x2="638" y2="200" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="542" y1="330" x2="638" y2="330" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="542" y1="400" x2="638" y2="400" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>

  <circle cx="660" cy="130" r="14" fill="#374151"/>
  <text x="660" y="135" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="686" y="136" font-size="17" fill="#1f2937">종료 요청</text>

  <circle cx="660" cy="200" r="14" fill="#374151"/>
  <text x="660" y="205" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="686" y="206" font-size="17" fill="#1f2937">확인</text>

  <line x1="542" y1="265" x2="638" y2="265" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="648" y="258" font-size="15" fill="#b45309">서버가 남은 데이터를</text>
  <text x="648" y="280" font-size="15" fill="#b45309">전송할 시간</text>

  <circle cx="660" cy="330" r="14" fill="#374151"/>
  <text x="660" y="335" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="686" y="336" font-size="17" fill="#1f2937">서버도 종료 준비 완료</text>

  <circle cx="660" cy="400" r="14" fill="#374151"/>
  <text x="660" y="405" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="686" y="406" font-size="17" font-weight="bold" fill="#1f2937">확인, 연결 종료</text>
</svg>
