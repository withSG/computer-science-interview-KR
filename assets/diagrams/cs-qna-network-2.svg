<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4-way Handshake (연결 종료)</title>
  <desc id="d">Client와 Server 간의 4-way Handshake 연결 종료 과정을 나타낸 시퀀스 다이어그램</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="440" y="36" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">4-way Handshake (연결 종료)</text>

  <!-- Actor Boxes -->
  <!-- Client Box: x=140, y=50, w=120, h=40 -->
  <rect x="140" y="50" width="120" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="74" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Client</text>

  <!-- Server Box: x=500, y=50, w=120, h=40 -->
  <rect x="500" y="50" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="560" y="74" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Server</text>

  <!-- Lifelines -->
  <path d="M200,90 L200,410" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M560,90 L560,410" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <!-- Step 1: Client -> Server FIN -->
  <path d="M200,130 L560,130" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="352" y="117" width="56" height="26" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="3"/>
  <text x="380" y="134" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">FIN</text>
  <text x="640" y="134" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">1. 종료 요청</text>

  <!-- Step 2: Server -> Client ACK -->
  <path d="M560,200 L200,200" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="350" y="187" width="60" height="26" fill="#ffffff" stroke="#059669" stroke-width="1" rx="3"/>
  <text x="380" y="204" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">ACK</text>
  <text x="640" y="204" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">2. 확인</text>

  <!-- Step 3: Server -> Client FIN -->
  <path d="M560,270 L200,270" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
  <rect x="352" y="257" width="56" height="26" fill="#ffffff" stroke="#d97706" stroke-width="1" rx="3"/>
  <text x="380" y="274" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">FIN</text>
  <text x="640" y="274" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">3. 서버도 종료 준비 완료</text>

  <!-- Step 4: Client -> Server ACK -->
  <path d="M200,340 L560,340" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="350" y="327" width="60" height="26" fill="#ffffff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="380" y="344" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">ACK</text>
  <text x="640" y="344" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">4. 확인, 연결 종료</text>
</svg>