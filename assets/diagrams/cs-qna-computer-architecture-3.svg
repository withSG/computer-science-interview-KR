<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">지역성 원리 (Locality)</title>
  <desc id="d">시간적 지역성과 공간적 지역성의 정의 및 예시를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 영역 박스 -->
  <rect x="24" y="24" width="832" height="292" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="44" y="58" font-size="16" font-weight="bold" fill="#1f2933">지역성 원리 (Locality)</text>

  <!-- 시간적 지역성 (Temporal Locality) 그룹 -->
  <rect x="44" y="80" width="792" height="104" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="64" y="112" font-size="14" font-weight="bold" fill="#2563eb">시간적 지역성 (Temporal Locality)</text>

  <!-- 화살표 및 세부 항목 1 -->
  <path d="M84,130 L110,130" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="120" y="134" font-size="13" fill="#1f2933">최근에 접근한 데이터를 곧 다시 접근할 가능성이 높음</text>

  <path d="M84,158 L110,158" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="120" y="162" font-size="13" fill="#52606d">예: 루프 내의 변수</text>

  <!-- 공간적 지역성 (Spatial Locality) 그룹 -->
  <rect x="44" y="196" width="792" height="104" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="64" y="228" font-size="14" font-weight="bold" fill="#7c3aed">공간적 지역성 (Spatial Locality)</text>

  <!-- 화살표 및 세부 항목 2 -->
  <path d="M84,246 L110,246" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="120" y="250" font-size="13" fill="#1f2933">접근한 주소 근처의 데이터를 곧 접근할 가능성이 높음</text>

  <path d="M84,274 L110,274" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="120" y="278" font-size="13" fill="#52606d">예: 배열의 순차 접근</text>
</svg>