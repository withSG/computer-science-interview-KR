<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">지역성 원리</title>
  <desc id="d">시간적 지역성은 최근에 접근한 데이터를 곧 다시 접근할 가능성이 높다는 것으로, 같은 데이터가 시간에 따라 반복 접근되며 예는 루프 내의 변수다. 공간적 지역성은 접근한 주소 근처의 데이터를 곧 접근할 가능성이 높다는 것으로, 이웃한 주소가 차례로 접근되며 예는 배열의 순차 접근이다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="880" height="350" fill="#ffffff"/>

  <!-- 시간적 지역성 -->
  <rect x="24" y="24" width="404" height="302" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="48" y="62" font-size="20" font-weight="bold" fill="#1d4ed8">시간적 지역성<tspan font-size="15" font-weight="normal"> (Temporal Locality)</tspan></text>
  <text x="48" y="100" font-size="16" fill="#111827">최근에 접근한 데이터를<tspan x="48" dy="24">곧 다시 접근할 가능성이 높음</tspan></text>

  <path d="M96,172 Q128,146 160,171" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M180,172 Q212,146 244,171" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M264,172 Q296,146 328,171" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="62" y="176" width="48" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="86" y="202" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">x</text>
  <rect x="146" y="176" width="48" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="170" y="202" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">x</text>
  <rect x="230" y="176" width="48" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="254" y="202" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">x</text>
  <rect x="314" y="176" width="48" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="338" y="202" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">x</text>
  <path d="M62,234 H369" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <text x="378" y="239" font-size="15" fill="#374151">시간</text>

  <rect x="48" y="258" width="356" height="44" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="286" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#1d4ed8">예:</tspan> 루프 내의 변수</text>

  <!-- 공간적 지역성 -->
  <rect x="452" y="24" width="404" height="302" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="476" y="62" font-size="20" font-weight="bold" fill="#6d28d9">공간적 지역성<tspan font-size="15" font-weight="normal"> (Spatial Locality)</tspan></text>
  <text x="476" y="100" font-size="16" fill="#111827">접근한 주소 근처의 데이터를<tspan x="476" dy="24">곧 접근할 가능성이 높음</tspan></text>

  <path d="M526,172 Q550,148 574,171" stroke="#6d28d9" stroke-width="1.8" fill="none" marker-end="url(#ah-purple)"/>
  <path d="M586,172 Q610,148 634,171" stroke="#6d28d9" stroke-width="1.8" fill="none" marker-end="url(#ah-purple)"/>
  <path d="M646,172 Q670,148 694,171" stroke="#6d28d9" stroke-width="1.8" fill="none" marker-end="url(#ah-purple)"/>
  <path d="M706,172 Q730,148 754,171" stroke="#6d28d9" stroke-width="1.8" fill="none" marker-end="url(#ah-purple)"/>
  <rect x="490" y="176" width="60" height="40" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="520" y="201" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a[0]</text>
  <rect x="550" y="176" width="60" height="40" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="580" y="201" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a[1]</text>
  <rect x="610" y="176" width="60" height="40" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="640" y="201" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a[2]</text>
  <rect x="670" y="176" width="60" height="40" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="700" y="201" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a[3]</text>
  <rect x="730" y="176" width="60" height="40" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="760" y="201" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a[4]</text>
  <path d="M490,234 H797" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <text x="806" y="239" font-size="15" fill="#374151">주소</text>

  <rect x="476" y="258" width="356" height="44" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="492" y="286" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#6d28d9">예:</tspan> 배열의 순차 접근</text>
</svg>
