<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CAS 재시도 루프</title>
  <desc id="d">incrementAndGet 내부 개념. 현재 값을 읽고(v=5) CAS(기대=5, 새값=6)를 시도해 성공하면 완료하고, 그사이 남이 값을 바꿔 실패하면 현재 값 읽기로 돌아가 재시도한다.</desc>
  <rect width="880" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="24" y="44" font-size="18" font-weight="bold" fill="#111827">CAS 재시도 루프 <tspan font-size="16" font-weight="normal" fill="#4b5563">(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">incrementAndGet</tspan> 내부 개념)</tspan></text>

  <!-- 1. 현재 값 읽기 -->
  <rect x="24" y="96" width="240" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="144" y="136" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">현재 값 읽기 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">(v=5)</tspan></text>

  <line x1="270" y1="130" x2="324" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2. CAS -->
  <rect x="330" y="96" width="270" height="68" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="465" y="136" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CAS</tspan>(기대=5, 새값=6)</text>

  <!-- 성공 → 완료 -->
  <line x1="606" y1="130" x2="690" y2="130" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="648" y="118" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">성공</text>

  <rect x="696" y="96" width="160" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="776" y="137" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">완료</text>

  <!-- 실패 → 다시 읽기 -->
  <path d="M465,170 L465,226 L144,226 L144,170" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
  <text x="304" y="258" font-size="16" fill="#b91c1c" text-anchor="middle"><tspan font-weight="bold">실패</tspan> (그사이 남이 바꿈)</text>
</svg>
