<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Atomic 클래스 (CAS 연산)</title>
  <desc id="d">CAS 재시도 루프와 incrementAndGet 내부 개념을 나타낸 플로우차트</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 제목 / 문서 헤딩 -->
  <text x="440" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Atomic 클래스 (CAS 연산)</text>
  <text x="440" y="72" font-size="13" fill="#52606d" text-anchor="middle">CAS 재시도 루프 (incrementAndGet 내부 개념)</text>

  <!-- Step 1: 현재 값 읽기 (v=5) -->
  <rect x="290" y="110" width="300" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="145" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">현재 값 읽기 (v=5)</text>

  <!-- 화살표 1 -> 2 -->
  <path d="M440,170 L440,220" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 2: CAS(기대=5, 새값=6) -->
  <rect x="290" y="220" width="300" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="255" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">CAS(기대=5, 새값=6)</text>

  <!-- Step 2 하단 분기선 (성공 / 실패) -->
  <path d="M440,280 L440,320" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M360,320 L520,320" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- 성공/실패 분기 텍스트 -->
  <rect x="340" y="310" width="40" height="20" fill="#ffffff"/>
  <text x="360" y="324" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">성공</text>

  <rect x="500" y="310" width="40" height="20" fill="#ffffff"/>
  <text x="520" y="324" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">실패</text>

  <!-- 성공 경로 -> 완료 -->
  <path d="M360,320 L360,420" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  
  <rect x="310" y="420" width="100" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="360" y="444" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">완료</text>

  <!-- 실패 경로 -> 루프 (오른쪽으로 돌아서 Step 1 우측으로) -->
  <path d="M520,320 L680,320 L680,140 L590,140" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>

  <!-- 실패 사유 부가 설명 라벨 -->
  <rect x="548" y="220" width="114" height="24" rx="4" fill="#fef2f2"/>
  <text x="605" y="236" font-size="11.5" fill="#dc2626" text-anchor="middle">실패 (그사이 남이 바꿈)</text>
</svg>