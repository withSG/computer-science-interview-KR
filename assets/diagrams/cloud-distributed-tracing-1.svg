<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">팀별 지연과 사용자 체감의 차이</title>
  <desc id="d">주문 요청은 Gateway, order를 거쳐 inventory·pricing, payment·외부 PG, 비동기 notification으로 갈라진다. order 팀은 40ms, inventory 팀은 15ms, payment 팀은 60ms라고 답하지만, 같은 축척으로 보면 사용자가 기다린 2.8초에 비해 아주 짧다.</desc>
  <rect width="880" height="610" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 상단: 요청 한 건의 호출 경로 -->
  <text x="24" y="36" font-size="15" font-weight="bold" fill="#4b5563">요청 한 건의 호출 경로</text>

  <!-- 1행: 사용자 → Gateway → order → inventory → pricing -->
  <rect x="110" y="62" width="84" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="152" y="89.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사용자</text>
  <line x1="196" y1="84" x2="231" y2="84" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="234" y="62" width="100" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="284" y="89.5" font-size="16" fill="#111827" text-anchor="middle">Gateway</text>
  <line x1="336" y1="84" x2="371" y2="84" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="374" y="62" width="90" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="419" y="89.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">order</text>
  <line x1="466" y1="84" x2="509" y2="84" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="512" y="62" width="116" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="570" y="89.5" font-size="16" fill="#111827" text-anchor="middle">inventory</text>
  <line x1="630" y1="84" x2="665" y2="84" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="668" y="62" width="100" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="718" y="89.5" font-size="16" fill="#111827" text-anchor="middle">pricing</text>

  <!-- order에서 갈라지는 가지 -->
  <path d="M419,108 V148 H509" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M419,148 V212 H509" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahp)"/>

  <!-- 2행: payment → 외부 PG -->
  <rect x="512" y="126" width="116" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="570" y="153.5" font-size="16" fill="#111827" text-anchor="middle">payment</text>
  <line x1="630" y1="148" x2="665" y2="148" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="668" y="126" width="100" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="718" y="153.5" font-size="16" fill="#111827" text-anchor="middle">외부 PG</text>

  <!-- 3행: notification (비동기) -->
  <rect x="512" y="190" width="140" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="582" y="217.5" font-size="16" fill="#111827" text-anchor="middle">notification</text>
  <text x="666" y="217.5" font-size="15" font-weight="bold" fill="#6d28d9">(비동기)</text>

  <line x1="24" y1="262" x2="856" y2="262" stroke="#d1d5db" stroke-width="1"/>

  <!-- 하단: 불만 → 각 팀의 답 → 사용자가 기다린 시간 -->
  <rect x="24" y="282" width="252" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="150" y="310" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">"주문이 2.8초 걸립니다"</text>

  <text x="24" y="360" font-size="15" font-weight="bold" fill="#4b5563">각 팀의 답 — 막대 길이는 모두 같은 축척의 시간</text>

  <!-- 기준선 -->
  <line x1="200" y1="372" x2="200" y2="556" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- order 팀 -->
  <text x="24" y="396.5" font-size="16" font-weight="bold" fill="#111827">order 팀</text>
  <rect x="200" y="380" width="8.9" height="22" fill="#047857"/>
  <text x="222" y="396.5" font-size="16" font-weight="bold" fill="#047857">"우리는 40ms"</text>

  <!-- inventory 팀 -->
  <text x="24" y="438.5" font-size="16" font-weight="bold" fill="#111827">inventory 팀</text>
  <rect x="200" y="422" width="4" height="22" fill="#047857"/>
  <text x="222" y="438.5" font-size="16" font-weight="bold" fill="#047857">"15ms"</text>

  <!-- payment 팀 -->
  <text x="24" y="480.5" font-size="16" font-weight="bold" fill="#111827">payment 팀</text>
  <rect x="200" y="464" width="13.3" height="22" fill="#047857"/>
  <text x="222" y="480.5" font-size="16" font-weight="bold" fill="#047857">"60ms"</text>

  <!-- 사용자 -->
  <text x="24" y="535.5" font-size="16" font-weight="bold" fill="#b91c1c">사용자</text>
  <rect x="200" y="510" width="620" height="38" fill="#b91c1c"/>
  <text x="216" y="535" font-size="17" font-weight="bold" fill="#ffffff">… 그런데 사용자는 2.8초를 기다렸다</text>

  <!-- 시간 축 -->
  <line x1="200" y1="566" x2="820" y2="566" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="200" y1="566" x2="200" y2="573" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="421.4" y1="566" x2="421.4" y2="573" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="642.9" y1="566" x2="642.9" y2="573" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="820" y1="566" x2="820" y2="573" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200" y="592" font-size="14" fill="#4b5563" text-anchor="middle">0</text>
  <text x="421.4" y="592" font-size="14" fill="#4b5563" text-anchor="middle">1초</text>
  <text x="642.9" y="592" font-size="14" fill="#4b5563" text-anchor="middle">2초</text>
  <text x="820" y="592" font-size="14" fill="#4b5563" text-anchor="middle">2.8초</text>
</svg>
