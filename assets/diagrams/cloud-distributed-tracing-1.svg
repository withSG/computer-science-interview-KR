<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1. 왜 필요한가</title>
  <desc id="d">마이크로서비스 환경에서 사용자 요청이 여러 서비스를 거치며 발생하는 지연 시간을 설명하는 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  
  <defs>
    <!-- Arrow Markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- SECTION 1: Service Architecture Flow -->
  <g id="architecture-flow">
    <!-- User (Start node) -->
    <rect x="30" y="80" width="80" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="70" y="105" font-size="13" fill="#1f2933" text-anchor="middle">사용자</text>

    <!-- Arrow 1: User -> Gateway -->
    <path d="M110,100 L150,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Gateway -->
    <rect x="150" y="80" width="90" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="195" y="105" font-size="13" fill="#1f2933" text-anchor="middle">Gateway</text>

    <!-- Arrow 2: Gateway -> order -->
    <path d="M240,100 L280,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- order (Central node) -->
    <rect x="280" y="80" width="80" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="320" y="105" font-size="13" fill="#1f2933" text-anchor="middle">order</text>

    <!-- Branch 1: order -> inventory (Top Level) -->
    <path d="M360,100 L440,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <rect x="440" y="80" width="90" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="485" y="105" font-size="13" fill="#1f2933" text-anchor="middle">inventory</text>

    <!-- Arrow 3: inventory -> pricing -->
    <path d="M530,100 L590,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="590" y="80" width="80" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="630" y="105" font-size="13" fill="#1f2933" text-anchor="middle">pricing</text>

    <!-- Branch 2: order -> payment -> 외부 PG (Middle Level) -->
    <path d="M320,120 L320,170 L440,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <rect x="440" y="150" width="90" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="485" y="175" font-size="13" fill="#1f2933" text-anchor="middle">payment</text>

    <!-- Arrow 4: payment -> 외부 PG -->
    <path d="M530,170 L590,170" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="590" y="150" width="95" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="637.5" y="175" font-size="13" fill="#1f2933" text-anchor="middle">외부 PG</text>

    <!-- Branch 3: order -> notification (비동기) (Bottom Level) -->
    <path d="M320,170 L320,240 L440,240" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <rect x="440" y="220" width="105" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="492.5" y="245" font-size="13" fill="#1f2933" text-anchor="middle">notification</text>

    <!-- Label: (비동기) -->
    <rect x="553" y="231" width="54" height="18" fill="#ffffff"/>
    <text x="555" y="245" font-size="11.5" fill="#7c3aed">(비동기)</text>
  </g>

  <!-- Divider Line -->
  <line x1="30" y1="285" x2="850" y2="285" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- SECTION 2: Quotes and Metrics -->
  <g id="quotes-and-claims">
    <!-- Highlight: "주문이 2.8초 걸립니다" -->
    <rect x="30" y="305" width="180" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="120" y="326" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">"주문이 2.8초 걸립니다"</text>

    <!-- Team Claims -->
    <g font-size="13" fill="#1f2933">
      <!-- order team -->
      <text x="240" y="326">order 팀 <tspan fill="#059669" font-weight="bold">"우리는 40ms"</tspan></text>
      <text x="385" y="326" fill="#52606d">/</text>

      <!-- inventory team -->
      <text x="405" y="326">inventory 팀 <tspan fill="#059669" font-weight="bold">"15ms"</tspan></text>
      <text x="545" y="326" fill="#52606d">/</text>

      <!-- payment team -->
      <text x="565" y="326">payment 팀 <tspan fill="#059669" font-weight="bold">"60ms"</tspan></text>
    </g>

    <!-- Ellipsis & User Reality Note -->
    <text x="30" y="362" font-size="13" fill="#52606d">...</text>
    <text x="60" y="362" font-size="13" fill="#1f2933">그런데 사용자는 <tspan font-weight="bold" fill="#dc2626">2.8초</tspan>를 기다렸다</text>
  </g>
</svg>