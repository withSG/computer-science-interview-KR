<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">StatefulSet 특징</title>
  <desc id="d">Kubernetes StatefulSet의 Pod 이름, DNS, 그리고 순차적 스케일 업 및 스케일 다운 흐름을 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 영역 컨테이너 -->
  <rect x="20" y="20" width="840" height="460" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- 제목 (문서 헤딩) -->
  <text x="40" y="55" font-size="16" font-weight="bold" fill="#1f2933">StatefulSet 특징</text>
  <line x1="40" y1="70" x2="840" y2="70" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 1. Pod 이름 및 DNS 섹션 -->
  <rect x="40" y="90" width="800" height="135" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <!-- Pod 카드 그룹 -->
  <!-- Pod 0 -->
  <rect x="60" y="105" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="130" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">mysql-0</text>
  
  <!-- Pod 1 -->
  <rect x="175" y="105" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="130" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">mysql-1</text>
  
  <!-- Pod 2 -->
  <rect x="290" y="105" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="130" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">mysql-2</text>

  <!-- Pod 이름 라벨 -->
  <text x="405" y="130" font-size="13" font-weight="bold" fill="#1f2933">Pod 이름: mysql-0, mysql-1, mysql-2</text>

  <!-- DNS 라벨 박스 -->
  <rect x="60" y="160" width="760" height="45" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="75" y="187" font-size="13" font-weight="bold" fill="#7c3aed">DNS:</text>
  <text x="120" y="187" font-size="13" fill="#1f2933">mysql-0.mysql-headless.default.svc.cluster.local</text>

  <!-- 2. 스케일링 (스케일 업 / 스케일 다운) 섹션 -->
  <rect x="40" y="245" width="800" height="215" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 스케일 업 -->
  <g id="scale-up">
    <text x="60" y="290" font-size="14" font-weight="bold" fill="#1f2933">스케일 업:</text>
    
    <!-- mysql-0 -->
    <rect x="160" y="270" width="110" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="215" y="293" font-size="13" fill="#1f2933" text-anchor="middle">mysql-0</text>
    
    <!-- 화살표 1 -->
    <path d="M270,288 L340,288" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
    
    <!-- mysql-1 -->
    <rect x="340" y="270" width="110" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="395" y="293" font-size="13" fill="#1f2933" text-anchor="middle">mysql-1</text>
    
    <!-- 화살표 2 -->
    <path d="M450,288 L520,288" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
    
    <!-- mysql-2 -->
    <rect x="520" y="270" width="110" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="575" y="293" font-size="13" fill="#1f2933" text-anchor="middle">mysql-2</text>

    <!-- 순차 라벨 -->
    <text x="650" y="293" font-size="13" font-weight="bold" fill="#2563eb">순차</text>
  </g>

  <!-- 구분선 -->
  <line x1="60" y1="335" x2="820" y2="335" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 스케일 다운 -->
  <g id="scale-down">
    <text x="60" y="385" font-size="14" font-weight="bold" fill="#1f2933">스케일 다운:</text>
    
    <!-- mysql-2 -->
    <rect x="160" y="365" width="110" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="215" y="388" font-size="13" fill="#1f2933" text-anchor="middle">mysql-2</text>
    
    <!-- 화살표 1 -->
    <path d="M270,383 L340,383" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a-amber)"/>
    
    <!-- mysql-1 -->
    <rect x="340" y="365" width="110" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="395" y="388" font-size="13" fill="#1f2933" text-anchor="middle">mysql-1</text>
    
    <!-- 화살표 2 -->
    <path d="M450,383 L520,383" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a-amber)"/>
    
    <!-- mysql-0 -->
    <rect x="520" y="365" width="110" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="575" y="388" font-size="13" fill="#1f2933" text-anchor="middle">mysql-0</text>

    <!-- 역순 라벨 -->
    <text x="650" y="388" font-size="13" font-weight="bold" fill="#d97706">역순</text>
  </g>
</svg>