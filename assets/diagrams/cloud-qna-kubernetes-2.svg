<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">StatefulSet 특징</title>
  <desc id="d">StatefulSet의 Pod는 mysql-0, mysql-1, mysql-2처럼 순서 있는 이름과 mysql-0.mysql-headless.default.svc.cluster.local 같은 DNS를 가진다. 스케일 업은 mysql-0부터 mysql-2까지 순차로, 스케일 다운은 mysql-2부터 mysql-0까지 역순으로 진행된다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="880" height="350" fill="#ffffff"/>

  <!-- 행 1: Pod 이름 -->
  <text x="40" y="58" font-size="16" font-weight="bold" fill="#1f2937">Pod 이름</text>
  <rect x="220" y="28" width="160" height="48" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="58" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-0</text>
  <rect x="440" y="28" width="160" height="48" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="58" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-1</text>
  <rect x="660" y="28" width="160" height="48" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="740" y="58" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-2</text>

  <!-- 행 2: DNS -->
  <text x="40" y="126" font-size="16" font-weight="bold" fill="#1f2937">DNS</text>
  <line x1="300" y1="76" x2="300" y2="96" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="220" y="96" width="600" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="238" y="126" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#1f2937">mysql-0</tspan>.mysql-headless.default.svc.cluster.local</text>

  <line x1="40" y1="168" x2="840" y2="168" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 행 3: 스케일 업 (순차) -->
  <text x="40" y="210" font-size="16" font-weight="bold" fill="#1f2937">스케일 업</text>
  <text x="40" y="233" font-size="15" font-weight="bold" fill="#1d4ed8">순차</text>

  <rect x="220" y="190" width="160" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="244" cy="216" r="12" fill="#1d4ed8"/>
  <text x="244" y="221" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="312" y="222" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-0</text>

  <line x1="386" y1="216" x2="433" y2="216" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#a-blue)"/>

  <rect x="440" y="190" width="160" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="464" cy="216" r="12" fill="#1d4ed8"/>
  <text x="464" y="221" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="532" y="222" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-1</text>

  <line x1="606" y1="216" x2="653" y2="216" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#a-blue)"/>

  <rect x="660" y="190" width="160" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="684" cy="216" r="12" fill="#1d4ed8"/>
  <text x="684" y="221" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="752" y="222" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-2</text>

  <!-- 행 4: 스케일 다운 (역순) -->
  <text x="40" y="286" font-size="16" font-weight="bold" fill="#1f2937">스케일 다운</text>
  <text x="40" y="309" font-size="15" font-weight="bold" fill="#b45309">역순</text>

  <rect x="220" y="266" width="160" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="244" cy="292" r="12" fill="#b45309"/>
  <text x="244" y="297" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="312" y="298" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-0</text>

  <line x1="434" y1="292" x2="387" y2="292" stroke="#b45309" stroke-width="2.5" marker-end="url(#a-amber)"/>

  <rect x="440" y="266" width="160" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="464" cy="292" r="12" fill="#b45309"/>
  <text x="464" y="297" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="532" y="298" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-1</text>

  <line x1="654" y1="292" x2="607" y2="292" stroke="#b45309" stroke-width="2.5" marker-end="url(#a-amber)"/>

  <rect x="660" y="266" width="160" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="684" cy="292" r="12" fill="#b45309"/>
  <text x="684" y="297" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="752" y="298" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mysql-2</text>
</svg>
