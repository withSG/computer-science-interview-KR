<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">영어와 한국어 토큰화 예시</title>
  <desc id="d">영어는 1 토큰이 약 4글자 또는 0.75단어라 "Hello world"가 "Hello", " world" 2 토큰으로, 한국어는 1 토큰이 약 1~2글자라 "안녕하세요"가 "안", "녕", "하세요" 3 토큰으로 나뉜다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 영어 -->
  <rect x="24" y="24" width="832" height="146" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="44" y="44" width="84" height="32" rx="16" fill="#1d4ed8"/>
  <text x="86" y="65.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">영어</text>
  <text x="146" y="66" font-size="18" fill="#111827">1 토큰 ≈ <tspan font-weight="bold" fill="#1d4ed8">4글자</tspan> 또는 <tspan font-weight="bold" fill="#1d4ed8">0.75단어</tspan></text>

  <rect x="44" y="94" width="220" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="154" y="127" font-size="20" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"Hello world"</text>
  <line x1="276" y1="120" x2="326" y2="120" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>

  <rect x="344" y="94" width="108" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="398" y="127" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"Hello"</text>
  <rect x="464" y="94" width="120" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="524" y="127" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">" world"</text>

  <text x="662" y="128" font-size="26" fill="#4b5563" text-anchor="middle">=</text>
  <rect x="700" y="94" width="136" height="52" rx="26" fill="#1d4ed8"/>
  <text x="768" y="127" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2 토큰</text>

  <!-- 한국어 -->
  <rect x="24" y="190" width="832" height="146" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="44" y="210" width="84" height="32" rx="16" fill="#6d28d9"/>
  <text x="86" y="231.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">한국어</text>
  <text x="146" y="232" font-size="18" fill="#111827">1 토큰 ≈ <tspan font-weight="bold" fill="#6d28d9">1~2글자</tspan></text>

  <rect x="44" y="260" width="220" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="154" y="293" font-size="20" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"안녕하세요"</text>
  <line x1="276" y1="286" x2="326" y2="286" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ah-purple)"/>

  <rect x="344" y="260" width="72" height="52" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="380" y="293" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"안"</text>
  <rect x="428" y="260" width="72" height="52" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="464" y="293" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"녕"</text>
  <rect x="512" y="260" width="116" height="52" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="570" y="293" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"하세요"</text>

  <text x="662" y="294" font-size="26" fill="#4b5563" text-anchor="middle">=</text>
  <rect x="700" y="260" width="136" height="52" rx="26" fill="#6d28d9"/>
  <text x="768" y="293" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3 토큰</text>
</svg>
