<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">토큰화 예시</title>
  <desc id="d">영어와 한국어의 토큰화 규칙 및 예시 비교 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Defs / Arrows -->
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="41.6" font-size="16" font-weight="bold" fill="#1f2933">토큰화 예시</text>

  <!-- Group 1: English (Blue Theme) -->
  <rect x="40" y="60" width="800" height="110" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- Rule Label -->
  <text x="60" y="94.25" font-size="14" font-weight="bold" fill="#2563eb">영어: 1 토큰 ≈ 4글자 또는 0.75단어</text>

  <!-- Input String Box -->
  <rect x="60" y="115" width="150" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="135" y="137.55" font-size="13" fill="#1f2933" text-anchor="middle">"Hello world"</text>

  <!-- Arrow -->
  <path d="M210,133 L270,133" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Output Tokens -->
  <text x="285" y="137.55" font-size="13" fill="#52606d">[</text>
  
  <!-- Token 1 -->
  <rect x="295" y="115" width="70" height="36" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="137.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">"Hello"</text>

  <text x="372" y="137.55" font-size="13" fill="#52606d">,</text>

  <!-- Token 2 -->
  <rect x="385" y="115" width="80" height="36" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="425" y="137.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">" world"</text>

  <text x="472" y="137.55" font-size="13" fill="#52606d">]</text>

  <!-- Token Count Note -->
  <text x="490" y="137.55" font-size="13" font-weight="bold" fill="#1f2933">(2 토큰)</text>


  <!-- Group 2: Korean (Purple Theme) -->
  <rect x="40" y="190" width="800" height="110" rx="8" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- Rule Label -->
  <text x="60" y="224.25" font-size="14" font-weight="bold" fill="#7c3aed">한국어: 1 토큰 ≈ 1~2글자</text>

  <!-- Input String Box -->
  <rect x="60" y="245" width="150" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="135" y="267.55" font-size="13" fill="#1f2933" text-anchor="middle">"안녕하세요"</text>

  <!-- Arrow -->
  <path d="M210,263 L270,263" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Output Tokens -->
  <text x="285" y="267.55" font-size="13" fill="#52606d">[</text>
  
  <!-- Token 1 -->
  <rect x="295" y="245" width="50" height="36" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="320" y="267.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">"안"</text>

  <text x="352" y="267.55" font-size="13" fill="#52606d">,</text>

  <!-- Token 2 -->
  <rect x="365" y="245" width="50" height="36" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="267.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">"녕"</text>

  <text x="422" y="267.55" font-size="13" fill="#52606d">,</text>

  <!-- Token 3 -->
  <rect x="435" y="245" width="80" height="36" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="475" y="267.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">"하세요"</text>

  <text x="522" y="267.55" font-size="13" fill="#52606d">]</text>

  <!-- Token Count Note -->
  <text x="540" y="267.55" font-size="13" font-weight="bold" fill="#1f2933">(3 토큰)</text>
</svg>