<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">마진 병합</title>
  <desc id="d">.a의 margin-bottom 20px와 .b의 margin-top 30px가 세로로 맞닿으면, 기대한 50px이 아니라 두 margin이 겹쳐 큰 쪽인 30px만 남는다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- CSS 코드 (색 견본 = 아래 margin 띠의 색) -->
  <rect x="24" y="24" width="832" height="84" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <rect x="48" y="42" width="18" height="18" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
  <text x="80" y="57" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.a { margin-bottom: <tspan font-weight="700" fill="#b45309">20px</tspan>; }</text>
  <rect x="48" y="74" width="18" height="18" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1"/>
  <text x="80" y="89" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.b { margin-top: <tspan font-weight="700" fill="#6d28d9">30px</tspan>; }</text>

  <!-- 칸 구분선 -->
  <line x1="372" y1="130" x2="372" y2="396" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ───── 기대: 50px (margin이 각자 제 몫) ───── -->
  <text x="156" y="150" font-size="20" font-weight="700" fill="#374151" text-anchor="middle">기대: 50px</text>
  <rect x="76" y="168" width="160" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="156" y="198" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.a</text>
  <rect x="76" y="216" width="80" height="48" fill="#fde68a"/>
  <text x="116" y="246" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">20px</text>
  <rect x="156" y="264" width="80" height="72" fill="#ddd6fe"/>
  <text x="196" y="306" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">30px</text>
  <rect x="76" y="336" width="160" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="156" y="366" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.b</text>
  <!-- 치수선 50px -->
  <line x1="256" y1="216" x2="256" y2="336" stroke="#374151" stroke-width="1.5"/>
  <line x1="250" y1="216" x2="262" y2="216" stroke="#374151" stroke-width="1.5"/>
  <line x1="250" y1="336" x2="262" y2="336" stroke="#374151" stroke-width="1.5"/>
  <text x="270" y="282" font-size="18" font-weight="700" fill="#374151">50px</text>

  <!-- ───── 실제: 30px (겹쳐서 큰 쪽만) ───── -->
  <text x="512" y="150" font-size="20" font-weight="700" fill="#b91c1c" text-anchor="middle">실제: 30px</text>
  <rect x="432" y="168" width="160" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="512" y="198" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.a</text>
  <rect x="432" y="216" width="80" height="48" fill="#fde68a"/>
  <text x="472" y="246" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">20px</text>
  <rect x="512" y="216" width="80" height="72" fill="#ddd6fe"/>
  <text x="552" y="258" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">30px</text>
  <rect x="432" y="288" width="160" height="48" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="512" y="318" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.b</text>
  <!-- 치수선 30px -->
  <line x1="612" y1="216" x2="612" y2="288" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="606" y1="216" x2="618" y2="216" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="606" y1="288" x2="618" y2="288" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="626" y="258" font-size="18" font-weight="700" fill="#b91c1c">30px</text>
  <text x="680" y="258" font-size="16" font-weight="700" fill="#b91c1c">← 겹쳐서 큰 쪽만</text>
</svg>
