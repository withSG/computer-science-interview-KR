<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Re-ranking 흐름</title>
  <desc id="d">초기 검색이 Top-N 후보를 뽑고, Re-ranker가 이를 다시 순위 매겨 Top-K 최종 결과만 남긴다. Re-ranker 모델로는 Cross-encoder(더 정확하지만 느림), Cohere Rerank, BGE Reranker가 있다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 1. 초기 검색 -->
  <rect x="24" y="78" width="170" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="109" y="116" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">초기 검색</text>

  <line x1="198" y1="110" x2="239" y2="110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 2. Top-N 후보 -->
  <rect x="244" y="44" width="170" height="132" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="329" y="74" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Top-N 후보</text>
  <rect x="268" y="88" width="122" height="8" rx="2" fill="#9ca3af"/>
  <rect x="268" y="101" width="122" height="8" rx="2" fill="#9ca3af"/>
  <rect x="268" y="114" width="122" height="8" rx="2" fill="#9ca3af"/>
  <rect x="268" y="127" width="122" height="8" rx="2" fill="#9ca3af"/>
  <rect x="268" y="140" width="122" height="8" rx="2" fill="#9ca3af"/>
  <rect x="268" y="153" width="122" height="8" rx="2" fill="#9ca3af"/>

  <line x1="418" y1="110" x2="459" y2="110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 3. Re-ranker -->
  <rect x="464" y="78" width="170" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="549" y="116" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">Re-ranker</text>

  <line x1="638" y1="110" x2="679" y2="110" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 4. Top-K 최종 -->
  <rect x="684" y="44" width="170" height="132" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="769" y="74" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">Top-K 최종</text>
  <rect x="708" y="88" width="122" height="8" rx="2" fill="#047857"/>
  <rect x="708" y="101" width="122" height="8" rx="2" fill="#047857"/>
  <rect x="708" y="114" width="122" height="8" rx="2" fill="#047857"/>

  <!-- Re-ranker 모델 -->
  <line x1="549" y1="144" x2="549" y2="218" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="24" y="220" width="832" height="152" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="252" font-size="17" font-weight="bold" fill="#6d28d9">Re-ranker 모델</text>

  <rect x="44" y="270" width="252" height="80" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="170" y="302" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Cross-encoder</text>
  <text x="170" y="330" font-size="15" fill="#374151" text-anchor="middle">더 정확하지만 느림</text>

  <rect x="314" y="270" width="252" height="80" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="440" y="316" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Cohere Rerank</text>

  <rect x="584" y="270" width="252" height="80" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="710" y="316" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">BGE Reranker</text>
</svg>
