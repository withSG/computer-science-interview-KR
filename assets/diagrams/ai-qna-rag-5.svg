<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Re-ranking</title>
  <desc id="d">초기 검색에서 Top-N 후보, Re-ranker, Top-K 최종으로 이어지는 흐름과 Re-ranker 모델 목록을 나타낸 다이어그램</desc>
  <rect width="880" height="400" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="46" font-size="16" font-weight="bold" fill="#1f2933">Re-ranking</text>

  <!-- Flowchart Nodes -->
  <!-- Node 1: 초기 검색 -->
  <rect x="30" y="80" width="130" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="95" y="110" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">초기 검색</text>

  <!-- Arrow 1 -->
  <path d="M160,105 L210,105" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Node 2: Top-N 후보 -->
  <rect x="210" y="80" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="110" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Top-N 후보</text>

  <!-- Arrow 2 -->
  <path d="M350,105 L400,105" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Node 3: Re-ranker -->
  <rect x="400" y="80" width="140" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="110" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">Re-ranker</text>

  <!-- Arrow 3 -->
  <path d="M540,105 L590,105" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Node 4: Top-K 최종 -->
  <rect x="590" y="80" width="140" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="110" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Top-K 최종</text>

  <!-- Divider Line -->
  <line x1="30" y1="165" x2="850" y2="165" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Models Section Group Box -->
  <rect x="30" y="190" width="820" height="180" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>

  <!-- Models Section Header -->
  <text x="50" y="221" font-size="14" font-weight="bold" fill="#1f2933">Re-ranker 모델:</text>

  <!-- Model List Items -->
  <text x="50" y="258" font-size="13" fill="#52606d">-</text>
  <text x="65" y="258" font-size="13" fill="#1f2933">Cross-encoder (더 정확하지만 느림)</text>

  <text x="50" y="293" font-size="13" fill="#52606d">-</text>
  <text x="65" y="293" font-size="13" fill="#1f2933">Cohere Rerank</text>

  <text x="50" y="328" font-size="13" fill="#52606d">-</text>
  <text x="65" y="328" font-size="13" fill="#1f2933">BGE Reranker</text>
</svg>