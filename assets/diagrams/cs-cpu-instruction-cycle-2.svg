<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ADD 명령어 레지스터 추적</title>
  <desc id="d">100번지의 ADD R1, R2, R3 명령어가 5단계를 지나며 레지스터가 어떻게 바뀌는지 보여준다. Fetch에서 MAR, MBR, IR, PC(104)가 채워지고, Decode에서 opcode·목적지·소스를 읽어 CU가 신호를 만들며, Execute에서 ALU가 R2 + R3를 계산하고, Memory는 통과, Writeback에서 R1에 결과를 기록한다.</desc>
  <rect width="880" height="590" fill="#ffffff"/>
  <defs>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 초기 상태 -->
  <rect x="24" y="24" width="832" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M32,24 H168 V76 H32 Q24,76 24,68 V32 Q24,24 32,24 Z" fill="#e5e7eb"/>
  <text x="96" y="56" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">초기 상태</text>
  <text x="272" y="57" font-size="17" font-weight="bold" fill="#111827" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">PC</text>
  <text x="290" y="57" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="310" y="57" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">100</text>
  <text x="400" y="56" font-size="15" fill="#4b5563">100번지에 ADD R1, R2, R3 · 명령어 길이 4바이트</text>

  <!-- ① Fetch -->
  <rect x="24" y="88" width="832" height="140" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M32,88 H168 V228 H32 Q24,228 24,220 V96 Q24,88 32,88 Z" fill="#1d4ed8"/>
  <text x="96" y="164" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">① Fetch</text>
  <g font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="272" y="123" text-anchor="end" font-weight="bold">MAR</text>
    <text x="290" y="123" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="310" y="123">100</text>
    <text x="272" y="153" text-anchor="end" font-weight="bold">MBR</text>
    <text x="290" y="153" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="310" y="153">MEM[100]</text>
    <text x="272" y="183" text-anchor="end" font-weight="bold">IR</text>
    <text x="290" y="183" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="310" y="183">MBR</text>
    <text x="272" y="213" text-anchor="end" font-weight="bold">PC</text>
    <text x="290" y="213" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="310" y="213">104</text>
  </g>
  <text x="412" y="152" font-size="15" fill="#4b5563">(= ADD R1, R2, R3 의 기계어)</text>
  <text x="412" y="212" font-size="15" fill="#4b5563">다음 명령어 주소 (100 + 4)</text>

  <!-- ② Decode -->
  <rect x="24" y="240" width="832" height="130" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M32,240 H168 V370 H32 Q24,370 24,362 V248 Q24,240 32,240 Z" fill="#6d28d9"/>
  <text x="96" y="311" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">② Decode</text>
  <!-- IR 필드 표 -->
  <rect x="192" y="256" width="130" height="30" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
  <rect x="322" y="256" width="130" height="30" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
  <rect x="452" y="256" width="150" height="30" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/>
  <rect x="192" y="286" width="130" height="36" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/>
  <rect x="322" y="286" width="130" height="36" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/>
  <rect x="452" y="286" width="150" height="36" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/>
  <text x="257" y="276" font-size="15" fill="#4c1d95" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">opcode</text>
  <text x="387" y="276" font-size="15" fill="#4c1d95" text-anchor="middle">목적지</text>
  <text x="527" y="276" font-size="15" fill="#4c1d95" text-anchor="middle">소스</text>
  <g font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="257" y="310">ADD</text>
    <text x="387" y="310">R1</text>
    <text x="527" y="310">R2, R3</text>
  </g>
  <line x1="194" y1="347" x2="222" y2="347" stroke="#6d28d9" stroke-width="2" marker-end="url(#ahp)"/>
  <text x="232" y="352" font-size="16" fill="#111827">CU가 <tspan font-weight="bold" fill="#6d28d9">"ALU를 덧셈 모드로, 입력은 R2/R3"</tspan> 신호 생성</text>

  <!-- ③ Execute -->
  <rect x="24" y="382" width="832" height="52" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M32,382 H168 V434 H32 Q24,434 24,426 V390 Q24,382 32,382 Z" fill="#047857"/>
  <text x="96" y="414" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">③ Execute</text>
  <g font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="272" y="415" text-anchor="end" font-weight="bold">ALU 출력</text>
    <text x="290" y="415" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="310" y="415">R2 + R3</text>
  </g>

  <!-- ④ Memory -->
  <rect x="24" y="446" width="832" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M32,446 H168 V498 H32 Q24,498 24,490 V454 Q24,446 32,446 Z" fill="#4b5563"/>
  <text x="96" y="478" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">④ Memory</text>
  <text x="192" y="478" font-size="16" fill="#4b5563">(할 일 없음, 통과)</text>

  <!-- ⑤ Writeback -->
  <rect x="24" y="510" width="832" height="52" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M32,510 H168 V562 H32 Q24,562 24,554 V518 Q24,510 32,510 Z" fill="#b45309"/>
  <text x="96" y="542" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">⑤ Writeback</text>
  <g font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="272" y="543" text-anchor="end" font-weight="bold">R1</text>
    <text x="290" y="543" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-weight="bold">←</text>
    <text x="310" y="543">ALU 출력</text>
  </g>
</svg>
