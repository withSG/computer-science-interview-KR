<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ADD R1, R2, R3 명령어 실행 과정 (코드로 보기)</title>
  <desc id="d">ADD R1, R2, R3 명령어의 인출, 해석, 실행, 메모리 접근, 쓰기 되돌림 단계별 레지스터 변화를 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 초기 상태 -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="832" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="20" y="24" fill="#1f2933" font-size="14" font-weight="bold">[초기 상태]</text>
    <text x="120" y="24" fill="#52606d" font-size="14">PC = 100</text>
  </g>

  <!-- ① Fetch -->
  <g transform="translate(24, 80)">
    <rect x="0" y="0" width="832" height="124" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="16" y="12" width="100" height="28" rx="4" fill="#2563eb"/>
    <text x="66" y="30.2" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">① Fetch</text>

    <!-- Content -->
    <g font-size="13" font-family="monospace, sans-serif">
      <!-- Row 1 -->
      <text x="140" y="30.2" fill="#1f2933" font-weight="bold">MAR</text>
      <path d="M215,26 L185,26" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
      <text x="230" y="30.2" fill="#1f2933">100</text>

      <!-- Row 2 -->
      <text x="140" y="54.2" fill="#1f2933" font-weight="bold">MBR</text>
      <path d="M215,50 L185,50" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
      <text x="230" y="54.2" fill="#1f2933">MEM[100]</text>
      <text x="310" y="54.2" fill="#52606d" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">(= ADD R1, R2, R3 의 기계어)</text>

      <!-- Row 3 -->
      <text x="140" y="78.2" fill="#1f2933" font-weight="bold">IR</text>
      <path d="M215,74 L185,74" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
      <text x="230" y="78.2" fill="#1f2933">MBR</text>

      <!-- Row 4 -->
      <text x="140" y="102.2" fill="#1f2933" font-weight="bold">PC</text>
      <path d="M215,98 L185,98" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
      <text x="230" y="102.2" fill="#1f2933">104</text>
    </g>
  </g>

  <!-- ② Decode -->
  <g transform="translate(24, 220)">
    <rect x="0" y="0" width="832" height="100" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="16" y="12" width="100" height="28" rx="4" fill="#7c3aed"/>
    <text x="66" y="30.2" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">② Decode</text>

    <!-- Content -->
    <g font-size="13">
      <text x="140" y="30.2" fill="#1f2933" font-family="monospace, sans-serif">opcode</text>
      <text x="200" y="30.2" fill="#1f2933">=</text>
      <text x="220" y="30.2" fill="#1f2933" font-weight="bold">ADD</text>

      <text x="140" y="54.2" fill="#1f2933">목적지</text>
      <text x="200" y="54.2" fill="#1f2933">=</text>
      <text x="220" y="54.2" fill="#1f2933" font-weight="bold" font-family="monospace, sans-serif">R1</text>

      <text x="140" y="78.2" fill="#1f2933">소스</text>
      <text x="200" y="78.2" fill="#1f2933">=</text>
      <text x="220" y="78.2" fill="#1f2933" font-weight="bold" font-family="monospace, sans-serif">R2, R3</text>

      <path d="M300,50 L320,50" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
      <text x="330" y="54.2" fill="#1f2933">CU가 "ALU를 덧셈 모드로, 입력은 R2/R3" 신호 생성</text>
    </g>
  </g>

  <!-- ③ Execute -->
  <g transform="translate(24, 336)">
    <rect x="0" y="0" width="832" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="16" y="6" width="100" height="28" rx="4" fill="#059669"/>
    <text x="66" y="24.2" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">③ Execute</text>

    <!-- Content -->
    <g font-size="13">
      <text x="140" y="24.2" fill="#1f2933" font-weight="bold">ALU 출력</text>
      <path d="M245,20 L215,20" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
      <text x="260" y="24.2" fill="#1f2933" font-family="monospace, sans-serif">R2 + R3</text>
    </g>
  </g>

  <!-- ④ Memory -->
  <g transform="translate(24, 392)">
    <rect x="0" y="0" width="832" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="16" y="6" width="100" height="28" rx="4" fill="#52606d"/>
    <text x="66" y="24.2" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">④ Memory</text>

    <!-- Content -->
    <g font-size="13">
      <text x="140" y="24.2" fill="#52606d">(할 일 없음, 통과)</text>
    </g>
  </g>

  <!-- ⑤ Writeback -->
  <g transform="translate(24, 448)">
    <rect x="0" y="0" width="832" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="16" y="6" width="100" height="28" rx="4" fill="#d97706"/>
    <text x="66" y="24.2" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">⑤ Writeback</text>

    <!-- Content -->
    <g font-size="13">
      <text x="140" y="24.2" fill="#1f2933" font-weight="bold" font-family="monospace, sans-serif">R1</text>
      <path d="M195,20 L165,20" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
      <text x="210" y="24.2" fill="#1f2933" font-weight="bold">ALU 출력</text>
    </g>
  </g>
</svg>