<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AWS 글로벌 인프라 구조</title>
  <desc id="d">서울 리전(ap-northeast-2) 안에 독립 전원과 독립 네트워크를 가진 AZ-a, AZ-b, AZ-c가 저지연 전용선으로 연결되어 있고, us-east-1 리전과는 완전히 독립이라 복제를 명시적으로 설정해야 하며, 전 세계의 Edge Location(CloudFront 캐시, Route 53)은 동적 요청만 리전으로 보낸다.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="510" fill="#ffffff"/>

  <!-- 서울 리전 -->
  <rect x="24" y="24" width="832" height="268" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="48" y="56" font-size="18" font-weight="bold" fill="#1d4ed8">Region: ap-northeast-2 (서울)</text>

  <!-- AZ-a -->
  <rect x="48" y="76" width="200" height="150" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="148" y="106" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">AZ-a</text>
  <text x="148" y="130" font-size="15" fill="#4b5563" text-anchor="middle">(DC 묶음)</text>
  <line x1="68" y1="146" x2="228" y2="146" stroke="#e2e8f0" stroke-width="1"/>
  <text x="148" y="174" font-size="15" fill="#111827" text-anchor="middle">독립 전원</text>
  <text x="148" y="200" font-size="15" fill="#111827" text-anchor="middle">독립 네트워크</text>

  <!-- AZ-b -->
  <rect x="340" y="76" width="200" height="150" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="106" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">AZ-b</text>
  <text x="440" y="130" font-size="15" fill="#4b5563" text-anchor="middle">(DC 묶음)</text>
  <line x1="360" y1="146" x2="520" y2="146" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="174" font-size="15" fill="#111827" text-anchor="middle">독립 전원</text>
  <text x="440" y="200" font-size="15" fill="#111827" text-anchor="middle">독립 네트워크</text>

  <!-- AZ-c -->
  <rect x="632" y="76" width="200" height="150" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="732" y="106" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">AZ-c</text>
  <text x="732" y="130" font-size="15" fill="#4b5563" text-anchor="middle">(DC 묶음)</text>
  <line x1="652" y1="146" x2="812" y2="146" stroke="#e2e8f0" stroke-width="1"/>
  <text x="732" y="174" font-size="15" fill="#111827" text-anchor="middle">독립 전원</text>
  <text x="732" y="200" font-size="15" fill="#111827" text-anchor="middle">독립 네트워크</text>

  <!-- AZ 간 저지연 전용선 -->
  <line x1="254" y1="156" x2="334" y2="156" stroke="#1d4ed8" stroke-width="2" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="294" y="144" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">저지연</text>
  <text x="294" y="180" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">전용선</text>

  <line x1="546" y1="156" x2="626" y2="156" stroke="#1d4ed8" stroke-width="2" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="586" y="144" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">저지연</text>
  <text x="586" y="180" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">전용선</text>

  <!-- AZ 간 거리·지연 -->
  <text x="440" y="264" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold">AZ 간 거리:</tspan> 수 km ~ 수십 km(같은 리전 내)<tspan dx="14" fill="#4b5563">/</tspan><tspan dx="14" font-weight="bold">지연:</tspan> 한 자릿수 ms</text>

  <!-- 리전 간: 완전 독립 -->
  <line x1="184" y1="298" x2="184" y2="394" stroke="#374151" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <text x="202" y="338" font-size="16" font-weight="bold" fill="#111827">리전 간은 완전 독립</text>
  <text x="202" y="362" font-size="15" fill="#4b5563">(복제는 명시적으로 설정해야 함)</text>

  <!-- 엣지 → 리전 -->
  <line x1="676" y1="398" x2="676" y2="298" stroke="#6d28d9" stroke-width="2" marker-end="url(#ap)"/>
  <text x="692" y="352" font-size="15" font-weight="bold" fill="#6d28d9">동적 요청만 리전까지</text>

  <!-- us-east-1 -->
  <rect x="24" y="400" width="320" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="184" y="434" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Region: us-east-1</text>
  <text x="184" y="460" font-size="15" fill="#4b5563" text-anchor="middle">(버지니아 북부)</text>

  <!-- Edge Location -->
  <rect x="496" y="400" width="360" height="80" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="676" y="434" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">Edge Location (전 세계 다수)</text>
  <text x="676" y="460" font-size="15" fill="#374151" text-anchor="middle">CloudFront 캐시 / Route 53</text>
</svg>
