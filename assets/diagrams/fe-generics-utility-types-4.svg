<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기존 타입의 모든 속성을 돌면서 변형하기</title>
  <desc id="d">User 타입의 속성들에 물음표(?)가 추가되어 Optional User 타입으로 변형되는 매핑된 타입의 과정을 보여주는 다이어그램</desc>
  <rect width="880" height="260" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- User Box -->
  <g>
    <rect x="80" y="40" width="280" height="180" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="80" y="40" width="280" height="40" rx="8" fill="#cbd2d9"/>
    <!-- Overlap bottom rounded corners of header rect -->
    <rect x="80" y="70" width="280" height="10" fill="#cbd2d9"/>
    <line x1="80" y1="80" x2="360" y2="80" stroke="#9aa5b1" stroke-width="1.5"/>
    
    <text x="220" y="65.25" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">User</text>
    
    <text x="110" y="114.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">id:</text>
    <text x="180" y="114.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#059669">number</text>
    
    <text x="110" y="149.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">name:</text>
    <text x="180" y="149.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#059669">string</text>
    
    <text x="110" y="184.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">email:</text>
    <text x="180" y="184.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#059669">string</text>
  </g>

  <!-- Arrow & Transformation Label -->
  <g>
    <path d="M360,130 L520,130" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
    <rect x="408" y="103" width="64" height="54" fill="#ffffff"/>
    <text x="440" y="119.2" font-size="12" fill="#52606d" text-anchor="middle">각</text>
    <text x="440" y="134.2" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">속성에 ?</text>
    <text x="440" y="149.2" font-size="12" fill="#52606d" text-anchor="middle">추가</text>
  </g>

  <!-- Optional<User> Box -->
  <g>
    <rect x="520" y="40" width="280" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="520" y="40" width="280" height="40" rx="8" fill="#bfdbfe"/>
    <!-- Overlap bottom rounded corners of header rect -->
    <rect x="520" y="70" width="280" height="10" fill="#bfdbfe"/>
    <line x1="520" y1="80" x2="800" y2="80" stroke="#2563eb" stroke-width="1.5"/>
    
    <text x="660" y="65.25" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Optional&lt;User&gt;</text>
    
    <text x="550" y="114.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">id<tspan fill="#dc2626" font-weight="bold">?</tspan>:</text>
    <text x="620" y="114.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#059669">number</text>
    
    <text x="550" y="149.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">name<tspan fill="#dc2626" font-weight="bold">?</tspan>:</text>
    <text x="620" y="149.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#059669">string</text>
    
    <text x="550" y="184.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">email<tspan fill="#dc2626" font-weight="bold">?</tspan>:</text>
    <text x="620" y="184.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#059669">string</text>
  </g>
</svg>