<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">매핑된 타입 Optional</title>
  <desc id="d">매핑된 타입 Optional은 User의 키 id, name, email을 하나씩 돌면서 각 속성에 ?를 붙여 Optional&lt;User&gt;를 만든다. 속성 타입은 그대로 유지된다.</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="40" y="30" width="260" height="192" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M41,76 V38 A7,7 0 0 1 48,31 H292 A7,7 0 0 1 299,38 V76 Z" fill="#e5e7eb"/>
  <line x1="40" y1="76" x2="300" y2="76" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="60" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">User</text>
  <g font-size="17" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">
    <text x="64" y="105">id:</text>
    <text x="150" y="105" fill="#047857">number</text>
    <text x="64" y="151">name:</text>
    <text x="150" y="151" fill="#047857">string</text>
    <text x="64" y="197">email:</text>
    <text x="150" y="197" fill="#047857">string</text>
  </g>

  <!-- 변환 -->
  <text x="440" y="60" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">각 속성에 ? 추가</text>
  <g font-size="15" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#4b5563" text-anchor="middle">
    <text x="440" y="90">K = "id"</text>
    <text x="440" y="136">K = "name"</text>
    <text x="440" y="182">K = "email"</text>
  </g>
  <line x1="312" y1="99" x2="566" y2="99" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="312" y1="145" x2="566" y2="145" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="312" y1="191" x2="566" y2="191" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- Optional<User> -->
  <rect x="580" y="30" width="260" height="192" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M581,76 V38 A7,7 0 0 1 588,31 H832 A7,7 0 0 1 839,38 V76 Z" fill="#dbeafe"/>
  <line x1="580" y1="76" x2="840" y2="76" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="710" y="60" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Optional&lt;User&gt;</text>
  <g font-size="17" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">
    <text x="604" y="105">id<tspan fill="#1d4ed8" font-weight="bold">?</tspan>:</text>
    <text x="700" y="105" fill="#047857">number</text>
    <text x="604" y="151">name<tspan fill="#1d4ed8" font-weight="bold">?</tspan>:</text>
    <text x="700" y="151" fill="#047857">string</text>
    <text x="604" y="197">email<tspan fill="#1d4ed8" font-weight="bold">?</tspan>:</text>
    <text x="700" y="197" fill="#047857">string</text>
  </g>

  <!-- 코드 -->
  <text x="440" y="262" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">type Optional&lt;T&gt; = { [K in keyof T]<tspan fill="#1d4ed8" font-weight="bold">?</tspan>: T[K] };</text>
</svg>
