<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">개선한 자기소개의 3단 구성</title>
  <desc id="d">개선한 자기소개 예시를 문장별로 나눠 [1] 현재 좌표, [2] 강점(행동 서술)과 근거(구체 사건), [3] 지원 연결에 대응시킨다. 프로파일링·리렌더링·메모이제이션·가상화가 심어 둔 키워드다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>

  <text x="24" y="46" font-size="18" font-weight="bold" fill="#111827">[개선 - 현재 → 강점 근거 → 지원 연결]</text>

  <!-- [1] 현재 좌표 -->
  <rect x="24" y="68" width="160" height="44" rx="6" fill="#1d4ed8"/>
  <text x="104" y="96" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">[1] 현재 좌표</text>
  <rect x="196" y="68" width="660" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="212" y="96" font-size="16" fill="#111827">"안녕하세요, 프론트엔드 개발자로 지원한 OOO입니다.</text>

  <!-- [2] 강점(행동 서술) -->
  <rect x="24" y="124" width="160" height="56" rx="6" fill="#047857"/>
  <text x="104" y="147" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">[2] 강점</text>
  <text x="104" y="169" font-size="15" fill="#ffffff" text-anchor="middle">(행동 서술)</text>
  <rect x="196" y="124" width="660" height="56" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="212" y="158" font-size="16" fill="#111827">화면이 느려지는 원인을 끝까지 좁혀 들어가는 걸 좋아합니다.</text>

  <!-- 근거(구체 사건) -->
  <rect x="24" y="188" width="160" height="160" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="104" y="263" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">근거</text>
  <text x="104" y="285" font-size="15" fill="#047857" text-anchor="middle">(구체 사건)</text>
  <rect x="196" y="188" width="660" height="160" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="212" y="216" font-size="16" fill="#111827">최근 진행한 커머스 프로젝트에서 상품 목록 스크롤이 버벅였는데,</text>
  <text x="212" y="244" font-size="16" fill="#111827">처음엔 데이터가 많아서라고 생각했다가 <tspan font-weight="bold" fill="#065f46">프로파일링</tspan>을 해보니</text>
  <text x="212" y="272" font-size="16" fill="#111827">필터 상태가 바뀔 때마다 목록 전체가 <tspan font-weight="bold" fill="#065f46">리렌더링</tspan>되는 게 원인이었습니다.</text>
  <text x="212" y="300" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#065f46">메모이제이션</tspan>과 리스트 <tspan font-weight="bold" fill="#065f46">가상화</tspan>로 스크롤이 눈에 띄게 부드러워졌고,</text>
  <text x="212" y="328" font-size="16" fill="#111827">그 과정에서 리액트 렌더링 조건을 처음으로 제대로 이해했습니다.</text>

  <!-- [3] 지원 연결 -->
  <rect x="24" y="360" width="160" height="64" rx="6" fill="#b45309"/>
  <text x="104" y="398" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">[3] 지원 연결</text>
  <rect x="196" y="360" width="660" height="64" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="212" y="385" font-size="16" fill="#111827">이 회사가 다루는 서비스는 목록과 상세를 오가는 사용량이 많다고 알고 있어서,</text>
  <text x="212" y="411" font-size="16" fill="#111827">이런 렌더링 최적화 경험을 바로 쓸 수 있을 것 같아 지원했습니다."</text>

  <!-- 범례 -->
  <text x="196" y="456" font-size="15" fill="#4b5563"><tspan font-weight="bold" fill="#065f46">굵은 초록 글씨</tspan> = 심어 둔 키워드 (다음 질문이 나올 범위)</text>
</svg>
