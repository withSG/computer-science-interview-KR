<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안티패턴 → 개선</title>
  <desc id="d">자기소개 안티패턴과 개선안의 구조적 비교 및 상세 내용 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- 메인 프레임 -->
  <rect x="24" y="24" width="832" height="492" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 타이틀 -->
  <rect x="40" y="40" width="410" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="245" y="62.55" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">[개선 - 현재 → 강점 근거 → 지원 연결]</text>

  <!-- 인용부호 시작 -->
  <text x="50" y="105" font-size="16" font-weight="bold" fill="#1f2933">"</text>

  <!-- 섹션 1: [1] 현재 좌표 -->
  <rect x="65" y="94" width="530" height="34" rx="4" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="75" y="115.55" font-size="13" fill="#1f2933">안녕하세요, 프론트엔드 개발자로 지원한 OOO입니다.</text>
  
  <path d="M605,111 L645,111" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="655" y="94" width="160" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="735" y="115.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[1] 현재 좌표</text>

  <!-- 섹션 2: [2] 강점(행동 서술) & 근거 -->
  <rect x="65" y="140" width="530" height="236" rx="4" fill="#ecfdf5" stroke="#cbd2d9" stroke-width="1"/>
  <text x="75" y="166.55" font-size="13" fill="#1f2933">화면이 느려지는 원인을 끝까지 좁혀 들어가는 걸 좋아합니다.</text>
  <text x="75" y="196.55" font-size="13" fill="#1f2933">최근 진행한 커머스 프로젝트에서 상품 목록 스크롤이 버벅였는데,</text>
  <text x="75" y="226.55" font-size="13" fill="#1f2933">처음엔 데이터가 많아서라고 생각했다가 프로파일링을 해보니</text>
  <text x="75" y="256.55" font-size="13" fill="#1f2933">필터 상태가 바뀔 때마다 목록 전체가 리렌더링되는 게 원인이었습니다.</text>
  <text x="75" y="286.55" font-size="13" fill="#1f2933">메모이제이션과 리스트 가상화로 스크롤이 눈에 띄게 부드러워졌고,</text>
  <text x="75" y="316.55" font-size="13" fill="#1f2933">그 과정에서 리액트 렌더링 조건을 처음으로 제대로 이해했습니다.</text>

  <!-- 화살표 및 라벨 2: 강점 -->
  <path d="M605,162 L645,162" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="655" y="145" width="180" height="34" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="745" y="166.55" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">[2] 강점(행동 서술)</text>

  <!-- 화살표 및 라벨 2-2: 근거 -->
  <path d="M605,252 L645,252" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <rect x="655" y="235" width="160" height="34" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="735" y="256.55" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">근거(구체 사건)</text>

  <!-- 섹션 3: [3] 지원 연결 -->
  <rect x="65" y="388" width="530" height="86" rx="4" fill="#fffbeb" stroke="#cbd2d9" stroke-width="1"/>
  <text x="75" y="414.55" font-size="13" fill="#1f2933">이 회사가 다루는 서비스는 목록과 상세를 오가는 사용량이 많다고 알고 있어서,</text>
  <text x="75" y="444.55" font-size="13" fill="#1f2933">이런 렌더링 최적화 경험을 바로 쓸 수 있을 것 같아 지원했습니다.</text>

  <!-- 화살표 및 라벨 3: 지원 연결 -->
  <path d="M605,431 L645,431" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="655" y="414" width="160" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="735" y="435.55" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[3] 지원 연결</text>

  <!-- 인용부호 끝 -->
  <text x="598" y="468" font-size="16" font-weight="bold" fill="#1f2933">"</text>
</svg>