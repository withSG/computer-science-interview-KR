<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구조적 타이핑 대 명목적 타이핑</title>
  <desc id="d">Java의 명목적 타이핑과 TypeScript의 구조적 타이핑 비교 다이어그램</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 명목적 타이핑 (Java) 구역 -->
  <rect x="24" y="20" width="400" height="360" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="224" y="52" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[명목적 타이핑 — Java]</text>

  <!-- Point Box (Nominal) -->
  <rect x="124" y="80" width="200" height="50" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="224" y="102" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">interface Point</text>
  <text x="224" y="120" font-size="13" fill="#52606d" text-anchor="middle">{ x, y }</text>

  <!-- Arrow & Text (Nominal) -->
  <path d="M224,230 L224,137" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>
  <rect x="134" y="165" width="180" height="36" fill="#ffffff"/>
  <text x="139" y="180" font-size="11.5" fill="#52606d">implements 선언이 있어야만</text>
  <text x="139" y="196" font-size="11.5" fill="#52606d">호환된다</text>

  <!-- Vector Box (Nominal) -->
  <rect x="84" y="230" width="280" height="50" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="224" y="252" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">class Vector implements Point</text>
  <text x="224" y="270" font-size="13" fill="#52606d" text-anchor="middle">{ x, y }</text>

  <!-- 구조적 타이핑 (TypeScript) 구역 -->
  <rect x="456" y="20" width="400" height="360" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="656" y="52" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">[구조적 타이핑 — TypeScript]</text>

  <!-- Point Box (Structural) -->
  <rect x="556" y="80" width="200" height="50" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="656" y="102" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">interface Point</text>
  <text x="656" y="120" font-size="13" fill="#52606d" text-anchor="middle">{ x, y }</text>

  <!-- Arrow & Text (Structural) -->
  <path d="M656,230 L656,137" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="561" y="165" width="190" height="36" fill="#ffffff"/>
  <text x="566" y="180" font-size="11.5" fill="#2563eb">선언 없이도</text>
  <text x="566" y="196" font-size="11.5" fill="#2563eb">모양만 맞으면 호환된다</text>

  <!-- Vector & Assignments Box (Structural) -->
  <rect x="476" y="230" width="360" height="110" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="496" y="255" font-size="13" font-weight="bold" fill="#1f2933">class Vector { x; y }</text>
  <text x="496" y="283" font-size="13" fill="#1f2933">const p: Point = new Vector();</text>
  <text x="766" y="283" font-size="13" font-weight="bold" fill="#059669">// OK</text>
  <text x="496" y="311" font-size="13" fill="#1f2933">const q: Point = { x: 1, y: 2 };</text>
  <text x="766" y="311" font-size="13" font-weight="bold" fill="#059669">// OK</text>
</svg>