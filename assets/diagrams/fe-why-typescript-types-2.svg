<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">명목적 타이핑과 구조적 타이핑</title>
  <desc id="d">Java의 명목적 타이핑은 implements 선언이 있어야만 Vector가 Point와 호환된다. TypeScript의 구조적 타이핑은 선언 없이도 모양만 맞으면 호환되어, new Vector()와 객체 리터럴 { x: 1, y: 2 }를 모두 Point에 대입할 수 있다.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 왼쪽: 명목적 타이핑 (Java) -->
  <rect x="24" y="24" width="408" height="402" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="228" y="58" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">명목적 타이핑 — Java</text>
  <text x="228" y="84" font-size="15" fill="#4b5563" text-anchor="middle">이름(선언)으로 판단</text>

  <rect x="128" y="104" width="200" height="64" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="228" y="130" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">interface Point</text>
  <text x="228" y="154" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ x, y }</text>

  <line x1="198" y1="274" x2="198" y2="172" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="214" y="215" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#b45309">implements</tspan> 선언이</text>
  <text x="214" y="238" font-size="15" fill="#374151">있어야만 호환된다</text>

  <rect x="68" y="276" width="320" height="64" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="228" y="302" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">class Vector <tspan fill="#b45309">implements Point</tspan></text>
  <text x="228" y="326" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ x, y }</text>

  <!-- 오른쪽: 구조적 타이핑 (TypeScript) -->
  <rect x="448" y="24" width="408" height="402" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="652" y="58" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">구조적 타이핑 — TypeScript</text>
  <text x="652" y="84" font-size="15" fill="#1e40af" text-anchor="middle">구조(속성 구성)로 판단</text>

  <rect x="552" y="104" width="200" height="64" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="652" y="130" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">interface Point</text>
  <text x="652" y="154" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ x, y }</text>

  <line x1="622" y1="274" x2="622" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="638" y="215" font-size="15" font-weight="bold" fill="#1d4ed8">선언 없이도</text>
  <text x="638" y="238" font-size="15" fill="#1e3a8a">모양만 맞으면 호환된다</text>

  <rect x="464" y="276" width="376" height="124" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="480" y="302" font-size="15" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">class Vector { x; y }</text>
  <line x1="480" y1="318" x2="824" y2="318" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="346" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">const p: Point = new Vector();</text>
  <text x="824" y="346" font-size="15" font-weight="bold" fill="#047857" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">// OK</text>
  <text x="480" y="376" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">const q: Point = { x: 1, y: 2 };</text>
  <text x="824" y="376" font-size="15" font-weight="bold" fill="#047857" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">// OK</text>
</svg>
