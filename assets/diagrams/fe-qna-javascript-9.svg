<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">함수형 프로그래밍 핵심 원칙</title>
  <desc id="d">함수형 프로그래밍의 3가지 핵심 원칙인 순수 함수, 불변성, 고차 함수에 대한 트리 구조 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Root Container Box -->
  <rect x="40" y="30" width="800" height="280" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Root Label -->
  <rect x="70" y="50" width="130" height="40" rx="6" fill="#1f2933"/>
  <text x="135" y="74" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">핵심 원칙:</text>

  <!-- Tree Structure Lines -->
  <!-- Main Trunk from Root -->
  <path d="M 135,90 L 135,250" stroke="#52606d" stroke-width="2" fill="none"/>

  <!-- Branch 1: 순수 함수 -->
  <path d="M 135,115 L 170,115" stroke="#52606d" stroke-width="2" fill="none"/>
  
  <!-- Branch 2: 불변성 -->
  <path d="M 135,180 L 170,180" stroke="#52606d" stroke-width="2" fill="none"/>
  
  <!-- Branch 3: 고차 함수 -->
  <path d="M 135,250 L 170,250" stroke="#52606d" stroke-width="2" fill="none"/>

  <!-- Node 1: 순수 함수 -->
  <g transform="translate(170, 92.5)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="27" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">순수 함수</text>
    <text x="132" y="27" fill="#1f2933" font-size="14" font-weight="bold">:</text>
    <!-- Description Box -->
    <rect x="150" y="2.5" width="480" height="40" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="165" y="27" fill="#1f2933" font-size="13">동일 입력 → 동일 출력, 부수 효과 없음</text>
  </g>

  <!-- Node 2: 불변성 -->
  <g transform="translate(170, 157.5)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="60" y="27" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">불변성</text>
    <text x="132" y="27" fill="#1f2933" font-size="14" font-weight="bold">:</text>
    <!-- Description Box -->
    <rect x="150" y="2.5" width="480" height="40" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="165" y="27" fill="#1f2933" font-size="13">데이터를 직접 변경하지 않고 새로운 데이터 생성</text>
  </g>

  <!-- Node 3: 고차 함수 -->
  <g transform="translate(170, 227.5)">
    <rect x="0" y="0" width="120" height="45" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="60" y="27" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">고차 함수</text>
    <text x="132" y="27" fill="#1f2933" font-size="14" font-weight="bold">:</text>
    <!-- Description Box -->
    <rect x="150" y="2.5" width="480" height="40" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="165" y="27" fill="#1f2933" font-size="13">함수를 조합하여 로직 구성</text>
  </g>
</svg>