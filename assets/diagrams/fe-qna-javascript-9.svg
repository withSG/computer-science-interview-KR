<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">함수형 프로그래밍 핵심 원칙</title>
  <desc id="d">함수형 프로그래밍의 세 가지 핵심 원칙: 순수 함수(동일 입력에 동일 출력, 부수 효과 없음), 불변성(데이터를 직접 변경하지 않고 새로운 데이터 생성), 고차 함수(함수를 조합하여 로직 구성).</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 루트 -->
  <rect x="370" y="24" width="140" height="42" rx="21" fill="#1f2937"/>
  <text x="440" y="51" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">핵심 원칙</text>
  <path d="M440,66 V86 M156,86 H724 M156,86 V104 M440,86 V104 M724,86 V104" fill="none" stroke="#9ca3af" stroke-width="2"/>

  <!-- 1. 순수 함수 -->
  <rect x="24" y="104" width="264" height="202" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M25,150 V116 A11,11 0 0 1 36,105 H276 A11,11 0 0 1 287,116 V150 Z" fill="#eff6ff"/>
  <line x1="25" y1="150" x2="287" y2="150" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="156" y="135" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">순수 함수</text>
  <rect x="48" y="172" width="52" height="36" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="74" y="195" font-size="15" fill="#1f2937" text-anchor="middle">입력</text>
  <line x1="104" y1="190" x2="126" y2="190" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mb)"/>
  <rect x="130" y="172" width="52" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="156" y="195" font-size="15" fill="#1f2937" text-anchor="middle">함수</text>
  <line x1="186" y1="190" x2="208" y2="190" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mb)"/>
  <rect x="212" y="172" width="52" height="36" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="238" y="195" font-size="15" fill="#1f2937" text-anchor="middle">출력</text>
  <text x="156" y="250" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">동일 입력 → 동일 출력</text>
  <text x="156" y="276" font-size="16" fill="#1f2937" text-anchor="middle">부수 효과 없음</text>

  <!-- 2. 불변성 -->
  <rect x="308" y="104" width="264" height="202" rx="12" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <path d="M309,150 V116 A11,11 0 0 1 320,105 H560 A11,11 0 0 1 571,116 V150 Z" fill="#ecfdf5"/>
  <line x1="309" y1="150" x2="571" y2="150" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="440" y="135" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">불변성</text>
  <rect x="336" y="172" width="64" height="36" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="368" y="195" font-size="15" fill="#1f2937" text-anchor="middle">원본</text>
  <line x1="406" y1="190" x2="436" y2="190" stroke="#047857" stroke-width="2" marker-end="url(#mg)"/>
  <rect x="444" y="172" width="100" height="36" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="494" y="195" font-size="15" fill="#1f2937" text-anchor="middle">새 데이터</text>
  <text x="440" y="250" font-size="16" fill="#1f2937" text-anchor="middle">데이터를 직접 변경하지 않고</text>
  <text x="440" y="276" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">새로운 데이터 생성</text>

  <!-- 3. 고차 함수 -->
  <rect x="592" y="104" width="264" height="202" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <path d="M593,150 V116 A11,11 0 0 1 604,105 H844 A11,11 0 0 1 855,116 V150 Z" fill="#f5f3ff"/>
  <line x1="593" y1="150" x2="855" y2="150" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="724" y="135" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">고차 함수</text>
  <rect x="611" y="172" width="52" height="36" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="637" y="195" font-size="15" fill="#1f2937" text-anchor="middle">함수</text>
  <text x="674" y="196" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">+</text>
  <rect x="685" y="172" width="52" height="36" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="711" y="195" font-size="15" fill="#1f2937" text-anchor="middle">함수</text>
  <line x1="743" y1="190" x2="769" y2="190" stroke="#6d28d9" stroke-width="2" marker-end="url(#mp)"/>
  <rect x="775" y="172" width="60" height="36" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="805" y="195" font-size="15" fill="#1f2937" text-anchor="middle">로직</text>
  <text x="724" y="250" font-size="16" fill="#1f2937" text-anchor="middle">함수를 조합하여</text>
  <text x="724" y="276" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">로직 구성</text>
</svg>
