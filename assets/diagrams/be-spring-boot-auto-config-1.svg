<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 830" width="880" height="830" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Spring Boot 자동 설정 전체 흐름</title>
  <desc id="d">SpringApplication.run()에서 시작해 @EnableAutoConfiguration이 내부적으로 AutoConfigurationImportSelector를 가져오고, 후보 수집, 제외 처리, 조건 평가, 등록의 네 단계를 거쳐 살아남은 자동 설정 클래스의 Bean만 컨테이너에 등록되는 흐름.</desc>
  <rect width="880" height="830" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 시작점 -->
  <rect x="290" y="24" width="300" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="53" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SpringApplication.run()</text>

  <line x1="440" y1="72" x2="440" y2="96" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="150" y="98" width="580" height="74" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@EnableAutoConfiguration</text>
  <text x="440" y="156" text-anchor="middle" font-size="15" fill="#374151">내부적으로 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@Import(AutoConfigurationImportSelector.class)</tspan></text>

  <line x1="440" y1="174" x2="440" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- [1] 후보 수집 -->
  <rect x="40" y="200" width="800" height="196" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="64" y="236" font-size="19" font-weight="bold" fill="#1d4ed8">[1] 후보 수집</text>
  <text x="64" y="268" font-size="16" fill="#111827">클래스패스의 모든 JAR에서 아래 파일을 읽는다</text>
  <rect x="64" y="284" width="620" height="62" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="82" y="309" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">META-INF/spring/</text>
  <text x="82" y="333" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">org.springframework.boot.autoconfigure.AutoConfiguration.imports</text>
  <text x="64" y="376" font-size="16" font-weight="bold" fill="#1d4ed8">→ “이 프로젝트에서 켤 수 있는 자동 설정 클래스 전체 목록”</text>

  <line x1="440" y1="398" x2="440" y2="422" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- [2] 제외 처리 -->
  <rect x="40" y="424" width="800" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="64" y="460" font-size="19" font-weight="bold" fill="#b45309">[2] 제외 처리</text>
  <text x="64" y="492" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">exclude</tspan> 속성, <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">spring.autoconfigure.exclude</tspan> 로 뺀 것 제거</text>

  <line x1="440" y1="516" x2="440" y2="540" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- [3] 조건 평가 -->
  <rect x="40" y="542" width="800" height="116" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="64" y="578" font-size="19" font-weight="bold" fill="#b45309">[3] 조건 평가</text>
  <text x="64" y="610" font-size="16" fill="#111827">각 클래스의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@ConditionalOnXxx</tspan> 를 하나씩 검사</text>
  <text x="64" y="638" font-size="16" font-weight="bold" fill="#b91c1c">조건 불만족 → 아예 로드하지 않고 버린다</text>

  <line x1="440" y1="660" x2="440" y2="684" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- [4] 등록 -->
  <rect x="40" y="686" width="800" height="116" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="64" y="722" font-size="19" font-weight="bold" fill="#047857">[4] 등록</text>
  <text x="64" y="754" font-size="16" fill="#111827">살아남은 설정 클래스의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@Bean</tspan> 들이 컨테이너에 등록</text>
  <text x="64" y="782" font-size="16" font-weight="bold" fill="#047857">이 단계는 사용자 정의 Bean 등록이 끝난 뒤에 수행된다</text>
</svg>
