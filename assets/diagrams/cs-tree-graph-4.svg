<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">우회전과 중위 순회 보존</title>
  <desc id="d">왼쪽이 무거운 트리에서 z를 우회전하면 y가 루트로 올라가고 x와 z가 그 자식이 된다. 회전 전후 중위 순회가 T1 x T2 y T3 z T4로 같아 BST 조건이 보존된다.</desc>
  <rect width="880" height="610" fill="#ffffff"/>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="24" y="46" font-size="20" font-weight="bold" fill="#111827">우회전 (Right Rotation) — 왼쪽이 무거울 때</text>
  <text x="190" y="92" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">회전 전</text>
  <text x="668" y="92" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">회전 후</text>
  <line x1="225.9" y1="144.1" x2="184.1" y2="185.9" stroke="#6b7280" stroke-width="2"/>
  <line x1="256.1" y1="141.9" x2="307.6" y2="180.2" stroke="#6b7280" stroke-width="2"/>
  <line x1="157" y1="215.2" x2="123" y2="254.8" stroke="#6b7280" stroke-width="2"/>
  <line x1="185.1" y1="213.1" x2="227.7" y2="250" stroke="#6b7280" stroke-width="2"/>
  <line x1="97.8" y1="285.9" x2="71.8" y2="319.6" stroke="#6b7280" stroke-width="2"/>
  <line x1="122.2" y1="285.9" x2="148.2" y2="319.6" stroke="#6b7280" stroke-width="2"/>
  <circle cx="240" cy="130" r="20" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="240" y="136.3" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">z</text>
  <circle cx="170" cy="200" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="206.3" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">y</text>
  <circle cx="110" cy="270" r="20" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="110" y="276.3" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">x</text>
  <polygon points="310,182 336,230 284,230" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="310" y="223" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">T4</text>
  <polygon points="230,252 256,300 204,300" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="230" y="293" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">T3</text>
  <polygon points="70,322 96,370 44,370" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="70" y="363" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">T1</text>
  <polygon points="150,322 176,370 124,370" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="150" y="363" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">T2</text>
  <line x1="380" y1="226" x2="478" y2="226" stroke="#374151" stroke-width="3" marker-end="url(#m-ink)"/>
  <text x="429" y="212" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">우회전</text>
  <line x1="652.2" y1="142.3" x2="593.8" y2="187.7" stroke="#6b7280" stroke-width="2"/>
  <line x1="683.8" y1="142.3" x2="742.2" y2="187.7" stroke="#6b7280" stroke-width="2"/>
  <line x1="565.8" y1="215.9" x2="539.8" y2="249.6" stroke="#6b7280" stroke-width="2"/>
  <line x1="590.2" y1="215.9" x2="616.2" y2="249.6" stroke="#6b7280" stroke-width="2"/>
  <line x1="745.8" y1="215.9" x2="719.8" y2="249.6" stroke="#6b7280" stroke-width="2"/>
  <line x1="770.2" y1="215.9" x2="796.2" y2="249.6" stroke="#6b7280" stroke-width="2"/>
  <circle cx="668" cy="130" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="668" y="136.3" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">y</text>
  <circle cx="578" cy="200" r="20" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="578" y="206.3" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">x</text>
  <circle cx="758" cy="200" r="20" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="758" y="206.3" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">z</text>
  <polygon points="538,252 564,300 512,300" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="538" y="293" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">T1</text>
  <polygon points="618,252 644,300 592,300" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="618" y="293" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">T2</text>
  <polygon points="718,252 744,300 692,300" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="718" y="293" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">T3</text>
  <polygon points="798,252 824,300 772,300" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="798" y="293" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">T4</text>
  <text x="190" y="406" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">중위 순회</text>
  <rect x="46" y="418" width="36" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="64" y="441" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">T1</text>
  <rect x="88" y="418" width="36" height="34" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="106" y="441" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">x</text>
  <rect x="130" y="418" width="36" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="148" y="441" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">T2</text>
  <rect x="172" y="418" width="36" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="190" y="441" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">y</text>
  <rect x="214" y="418" width="36" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="232" y="441" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">T3</text>
  <rect x="256" y="418" width="36" height="34" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="274" y="441" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">z</text>
  <rect x="298" y="418" width="36" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="316" y="441" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">T4</text>
  <text x="668" y="406" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">중위 순회</text>
  <rect x="524" y="418" width="36" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="542" y="441" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">T1</text>
  <rect x="566" y="418" width="36" height="34" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="584" y="441" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">x</text>
  <rect x="608" y="418" width="36" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="626" y="441" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">T2</text>
  <rect x="650" y="418" width="36" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="668" y="441" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">y</text>
  <rect x="692" y="418" width="36" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="710" y="441" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">T3</text>
  <rect x="734" y="418" width="36" height="34" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="752" y="441" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">z</text>
  <rect x="776" y="418" width="36" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="794" y="441" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">T4</text>
  <text x="429" y="446" font-size="30" font-weight="bold" fill="#047857" text-anchor="middle">=</text>
  <rect x="24" y="484" width="832" height="102" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="44" y="516" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#92400e">검증:</tspan> 회전 전후 모두 중위 순회가 <tspan font-weight="bold">T1 x T2 y T3 z T4</tspan> 로 동일</text>
  <text x="92" y="544" font-size="16" font-weight="bold" fill="#047857">→ 정렬 순서가 유지되므로 BST 조건이 보존된다</text>
  <text x="92" y="572" font-size="16" fill="#374151">좌회전은 이 그림을 좌우로 뒤집은 것이다</text>
</svg>
