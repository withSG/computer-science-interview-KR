<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">회전 (Rotation)</title>
  <desc id="d">트리의 우회전 과정을 나타낸 다이어그램으로, 회전 전후의 트리 구조 변화와 중위 순회 결과의 동일성을 설명합니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title / Section Heading -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">우회전 (Right Rotation) — 왼쪽이 무거울 때</text>

  <!-- Left Tree (Before Rotation) -->
  <!-- Edges -->
  <line x1="180" y1="80" x2="120" y2="130" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="180" y1="80" x2="240" y2="130" stroke="#9aa5b1" stroke-width="1.5"/>

  <line x1="120" y1="130" x2="70" y2="180" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="120" y1="130" x2="170" y2="180" stroke="#9aa5b1" stroke-width="1.5"/>

  <line x1="70" y1="180" x2="40" y2="225" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="70" y1="180" x2="100" y2="225" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Nodes (Internal: Circles) -->
  <circle cx="180" cy="80" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">z</text>

  <circle cx="120" cy="130" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="135" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">y</text>

  <circle cx="70" cy="180" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="185" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">x</text>

  <!-- Subtrees (Leaves: Rectangles / Triangles represented as distinct subtrees) -->
  <rect x="25" y="225" width="30" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="40" y="242" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">T1</text>

  <rect x="85" y="225" width="30" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="100" y="242" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">T2</text>

  <rect x="155" y="180" width="30" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="170" y="197" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">T3</text>

  <rect x="225" y="130" width="30" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="240" y="147" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">T4</text>


  <!-- Transition Arrow -->
  <path d="M310,140 L410,140" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#a-blue)"/>


  <!-- Right Tree (After Rotation) -->
  <!-- Edges -->
  <line x1="560" y1="80" x2="500" y2="130" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="560" y1="80" x2="620" y2="130" stroke="#9aa5b1" stroke-width="1.5"/>

  <line x1="500" y1="130" x2="470" y2="180" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="500" y1="130" x2="530" y2="180" stroke="#9aa5b1" stroke-width="1.5"/>

  <line x1="620" y1="130" x2="590" y2="180" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="620" y1="130" x2="650" y2="180" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Nodes (Internal: Circles) -->
  <circle cx="560" cy="80" r="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="560" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">y</text>

  <circle cx="500" cy="130" r="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="500" y="135" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">x</text>

  <circle cx="620" cy="130" r="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="620" y="135" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">z</text>

  <!-- Subtrees (Leaves: Rectangles) -->
  <rect x="455" y="180" width="30" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="470" y="197" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">T1</text>

  <rect x="515" y="180" width="30" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="530" y="197" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">T2</text>

  <rect x="575" y="180" width="30" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="590" y="197" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">T3</text>

  <rect x="635" y="180" width="30" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="650" y="197" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">T4</text>


  <!-- Verification Box / Footnote -->
  <rect x="30" y="280" width="820" height="75" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <text x="45" y="308" font-size="13" font-weight="bold" fill="#d97706">검증:</text>
  <text x="85" y="308" font-size="13" fill="#1f2933">회전 전후 모두 중위 순회가 <tspan font-weight="bold" fill="#2563eb">T1 x T2 y T3 z T4</tspan> 로 동일</text>
  <text x="85" y="328" font-size="12" fill="#52606d">→ 정렬 순서가 유지되므로 BST 조건이 보존된다</text>
  <text x="85" y="344" font-size="12" fill="#52606d">좌회전은 이 그림을 좌우로 뒤집은 것이다</text>
</svg>