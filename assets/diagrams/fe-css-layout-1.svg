<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">박스 모델의 네 겹</title>
  <desc id="d">안쪽부터 content, padding, border, margin 순서로 겹친 네 사각형. content는 width×height 영역이고, 배경색은 border까지 칠해지며 margin은 배경 없는 투명한 바깥 여백이다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- ④ margin: 투명한 바깥 여백 -->
  <rect x="32" y="32" width="528" height="392" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="48" y="60" font-size="16" font-weight="700" fill="#374151">④ margin</text>

  <!-- ③ border -->
  <rect x="76" y="76" width="440" height="304" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
  <text x="92" y="104" font-size="16" font-weight="700" fill="#1e3a8a">③ border</text>

  <!-- ② padding -->
  <rect x="120" y="120" width="352" height="216" fill="#dbeafe" stroke="#1e40af" stroke-width="1"/>
  <text x="136" y="148" font-size="16" font-weight="700" fill="#1e3a8a">② padding</text>

  <!-- ① content -->
  <rect x="164" y="164" width="264" height="128" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="180" y="192" font-size="16" font-weight="700" fill="#1e3a8a">① content</text>
  <text x="296" y="252" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">width×height</text>

  <!-- margin 설명 -->
  <circle cx="538" cy="54" r="4" fill="#374151"/>
  <line x1="542" y1="54" x2="594" y2="54" stroke="#6b7280" stroke-width="1.5"/>
  <text x="604" y="60" font-size="16" fill="#374151">바깥 여백 (투명, 배경 없음)</text>

  <!-- 배경색 범위: border 바깥 경계까지 -->
  <line x1="520" y1="76" x2="570" y2="76" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="520" y1="380" x2="570" y2="380" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M572,76 H584 V380 H572" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="600" y="234" font-size="16" font-weight="700" fill="#1d4ed8">배경색은 여기까지 칠해진다</text>
</svg>
