<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">네 겹의 영역</title>
  <desc id="d">CSS 박스 모델의 네 겹 영역인 content, padding, border, margin과 관련 설명을 나타낸 다이어그램</desc>
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- Outer Box: margin -->
  <rect x="40" y="40" width="460" height="400" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="66" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">margin</text>
  <line x1="55" y1="62" x2="185" y2="62" stroke="#1f2933" stroke-width="1.5"/>
  <line x1="255" y1="62" x2="485" y2="62" stroke="#1f2933" stroke-width="1.5"/>

  <!-- Border Box: border -->
  <rect x="70" y="80" width="400" height="340" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="235" y="106" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">border</text>
  <line x1="85" y1="102" x2="202" y2="102" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="268" y1="102" x2="455" y2="102" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Padding Box: padding -->
  <rect x="100" y="120" width="340" height="280" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="250" y="146" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">padding</text>
  <line x1="115" y1="142" x2="212" y2="142" stroke="#059669" stroke-width="1.5"/>
  <line x1="288" y1="142" x2="425" y2="142" stroke="#059669" stroke-width="1.5"/>

  <!-- Content Box: content -->
  <rect x="130" y="160" width="280" height="220" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="186" fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle">content</text>
  <line x1="145" y1="182" x2="223" y2="182" stroke="#d97706" stroke-width="1.5"/>
  <line x1="297" y1="182" x2="395" y2="182" stroke="#d97706" stroke-width="1.5"/>

  <!-- Inner Content Label: width×height -->
  <rect x="160" y="240" width="220" height="60" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="270" y="274" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">width×height</text>

  <!-- Side Annotations -->
  <text x="520" y="66" fill="#52606d" font-size="13">바깥 여백 (투명, 배경 없음)</text>
  <text x="500" y="106" fill="#52606d" font-size="13">배경색은 여기까지 칠해진다</text>
</svg>