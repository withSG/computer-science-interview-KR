<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CDN 요청 흐름</title>
  <desc id="d">서울 사용자의 요청이 서울 엣지에서 히트하면 즉시 응답(RTT 약 5ms)하고, 미스하면 지역 엣지들이 공유하는 오리진 실드로, 거기서도 미스하면 버지니아의 오리진 서버(RTT 약 180ms)까지 간다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-hit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="a-miss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 1행: 사용자 → 엣지 → 히트 → 즉시 응답 -->
  <rect x="40" y="40" width="160" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="74" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">서울 사용자</text>

  <line x1="202" y1="68" x2="266" y2="68" stroke="#374151" stroke-width="2" marker-end="url(#a-ink)"/>

  <rect x="270" y="40" width="180" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="74" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">서울 엣지</text>

  <text x="508" y="56" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">히트</text>
  <line x1="452" y1="68" x2="566" y2="68" stroke="#047857" stroke-width="2" marker-end="url(#a-hit)"/>

  <rect x="570" y="40" width="270" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="705" y="74" text-anchor="middle" font-size="17" font-weight="bold" fill="#047857">즉시 응답 (RTT ~5ms)</text>

  <!-- 미스 1 -->
  <line x1="360" y1="98" x2="360" y2="166" stroke="#b45309" stroke-width="2" marker-end="url(#a-miss)"/>
  <text x="374" y="138" font-size="16" font-weight="bold" fill="#b45309">미스</text>

  <!-- 오리진 실드 -->
  <rect x="270" y="170" width="180" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="360" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">오리진 실드</text>
  <line x1="452" y1="198" x2="490" y2="198" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="204" font-size="16" fill="#1f2937">지역 엣지들이 공유하는 중간 캐시</text>

  <!-- 미스 2 -->
  <line x1="360" y1="228" x2="360" y2="296" stroke="#b45309" stroke-width="2" marker-end="url(#a-miss)"/>
  <text x="374" y="268" font-size="16" font-weight="bold" fill="#b45309">미스</text>

  <!-- 오리진 서버 -->
  <rect x="270" y="300" width="180" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="334" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">오리진 서버</text>
  <line x1="452" y1="328" x2="490" y2="328" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="334" font-size="16" fill="#1f2937">버지니아 · <tspan font-weight="bold" fill="#b91c1c">RTT ~180ms</tspan></text>
</svg>
