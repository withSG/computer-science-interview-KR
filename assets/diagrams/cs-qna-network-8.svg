<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">I/O Multiplexing (동기 + 이벤트 대기)</title>
  <desc id="d">호출자가 select()/epoll()을 호출해 다수의 fd를 동시에 기다리다가, 준비된 fd를 알림받으면 read()를 호출해 바로 데이터를 읽는 흐름과, 특징·핵심 시스템 콜(select, poll, epoll) 비교·예를 정리한 그림.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 흐름 -->
  <rect x="24" y="84" width="76" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="118" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">호출자</text>
  <line x1="102" y1="112" x2="130" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="134" y="84" width="172" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="220" y="107" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">select()/epoll()</text>
  <text x="220" y="129" font-size="15" fill="#1e3a8a" text-anchor="middle">호출</text>
  <line x1="308" y1="112" x2="336" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 다수 fd 동시 대기 -->
  <rect x="340" y="40" width="232" height="116" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="456" y="72" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">다수 fd 동시 대기</text>
  <rect x="353" y="94" width="44" height="36" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="375" y="117" font-size="15" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fd</text>
  <rect x="407" y="94" width="44" height="36" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="429" y="117" font-size="15" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fd</text>
  <rect x="461" y="94" width="44" height="36" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="483" y="117" font-size="15" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fd</text>
  <rect x="515" y="94" width="44" height="36" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="537" y="117" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fd</text>

  <!-- 준비된 fd 알림 → read() -->
  <line x1="561" y1="112" x2="712" y2="112" stroke="#047857" stroke-width="2" marker-end="url(#ahg)"/>
  <text x="643" y="100" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">준비된 fd 알림</text>

  <rect x="716" y="84" width="140" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="786" y="106" font-size="16" fill="#065f46" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">read()</tspan> 호출</text>
  <text x="786" y="129" font-size="14" fill="#065f46" text-anchor="middle">(즉시 데이터 있음)</text>

  <!-- 특징 -->
  <rect x="24" y="180" width="348" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="212" font-size="17" font-weight="bold" fill="#1d4ed8">특징</text>
  <circle cx="50" cy="241" r="3" fill="#1d4ed8"/>
  <text x="62" y="246" font-size="15" fill="#1f2937">하나의 스레드로 다수 I/O 소켓 관리</text>
  <circle cx="50" cy="271" r="3" fill="#1d4ed8"/>
  <text x="62" y="276" font-size="15" fill="#1f2937">Blocking이지만 여러 fd를 동시에 감시</text>
  <circle cx="50" cy="301" r="3" fill="#1d4ed8"/>
  <text x="62" y="306" font-size="15" fill="#1f2937">Non-blocking보다 효율적</text>

  <!-- 예 -->
  <rect x="24" y="346" width="348" height="72" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="387" font-size="16" font-weight="bold" fill="#111827">예</text>
  <text x="74" y="387" font-size="15" fill="#1f2937">Redis (싱글 스레드 + epoll), Nginx</text>

  <!-- 핵심 시스템 콜 -->
  <rect x="388" y="180" width="468" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="408" y="212" font-size="17" font-weight="bold" fill="#1d4ed8">핵심 시스템 콜</text>
  <rect x="404" y="228" width="436" height="174" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="404.5" y="228.5" width="435" height="35.5" fill="#e2e8f0"/>
  <line x1="404" y1="264" x2="840" y2="264" stroke="#94a3b8" stroke-width="1"/>
  <line x1="404" y1="310" x2="840" y2="310" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="404" y1="356" x2="840" y2="356" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="560" y1="228" x2="560" y2="402" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="700" y1="228" x2="700" y2="402" stroke="#cbd5e1" stroke-width="1"/>

  <text x="416" y="251" font-size="15" font-weight="bold" fill="#111827">시스템 콜</text>
  <text x="572" y="251" font-size="15" font-weight="bold" fill="#111827">fd 수 · 규모</text>
  <text x="712" y="251" font-size="15" font-weight="bold" fill="#111827">감지 방식</text>

  <text x="416" y="292" font-size="15" font-weight="bold" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">select()</text>
  <text x="572" y="292" font-size="15" fill="#1f2937">최대 1024 fd</text>
  <text x="712" y="292" font-size="15" fill="#1f2937">모든 fd 순회</text>

  <text x="416" y="338" font-size="15" font-weight="bold" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">poll()</text>
  <text x="572" y="338" font-size="15" fill="#1f2937">fd 수 제한 없음</text>
  <text x="712" y="338" font-size="15" fill="#1f2937">역시 순회</text>

  <text x="416" y="384" font-size="15" fill="#1e3a8a"><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">epoll()</tspan> <tspan fill="#4b5563" font-size="14">(Linux)</tspan></text>
  <text x="572" y="384" font-size="15" fill="#1f2937">대규모에 적합</text>
  <text x="712" y="384" font-size="15" fill="#1f2937">O(1) 이벤트 감지</text>
</svg>
