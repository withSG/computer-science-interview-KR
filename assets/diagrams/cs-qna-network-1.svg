<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TCP 3-way Handshake 연결 수립</title>
  <desc id="d">Client가 SYN으로 연결을 요청하고, Server가 SYN + ACK로 요청 수락과 확인을 보내고, Client가 ACK를 보내 연결이 확립되는 세 단계.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 주체 -->
  <rect x="95" y="24" width="150" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="170" y="52" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Client</text>
  <rect x="455" y="24" width="150" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="530" y="52" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">Server</text>

  <!-- 생명선 -->
  <line x1="170" y1="68" x2="170" y2="340" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="530" y1="68" x2="530" y2="340" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 1. SYN -->
  <line x1="170" y1="130" x2="528" y2="130" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="350" y="116" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">SYN</text>

  <!-- 2. SYN + ACK -->
  <line x1="530" y1="210" x2="172" y2="210" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="350" y="196" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">SYN + ACK</text>

  <!-- 3. ACK -->
  <line x1="170" y1="290" x2="528" y2="290" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="350" y="276" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ACK</text>

  <!-- 단계 설명 -->
  <line x1="542" y1="130" x2="638" y2="130" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="542" y1="210" x2="638" y2="210" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="542" y1="290" x2="638" y2="290" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>

  <circle cx="660" cy="130" r="14" fill="#374151"/>
  <text x="660" y="135" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="686" y="136" font-size="17" fill="#1f2937">연결 요청</text>

  <circle cx="660" cy="210" r="14" fill="#374151"/>
  <text x="660" y="215" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="686" y="216" font-size="17" fill="#1f2937">요청 수락 + 확인</text>

  <circle cx="660" cy="290" r="14" fill="#374151"/>
  <text x="660" y="295" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="686" y="296" font-size="17" font-weight="bold" fill="#1f2937">연결 확립</text>
</svg>
