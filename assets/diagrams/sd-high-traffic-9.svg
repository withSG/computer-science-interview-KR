<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대기열로 입장을 제어하는 흐름</title>
  <desc id="d">사용자는 CDN이 서빙하는 정적 대기실에서 순번을 보며 입장 제어기를 폴링하고, 제어기는 Redis에 순번을 두고 실제 처리 능력만큼 초당 N명에게 서명된 입장 토큰을 발급한다. 실제 서비스는 토큰 없는 요청을 거절하므로 항상 처리 가능한 만큼만 들어온다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 사용자 -->
  <rect x="40" y="62" width="112" height="44" rx="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="96" y="89.5" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">사용자</text>
  <path d="M153,84 H216" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ar-ink)"/>

  <!-- 대기실 -->
  <rect x="224" y="40" width="320" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="384" y="71" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">대기실 (정적 페이지)</text>
  <rect x="300" y="84" width="168" height="32" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="384" y="105.5" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">"앞에 12,340명"</text>
  <path d="M560,56 V112" stroke="#93c5fd" stroke-width="3" fill="none"/>
  <text x="572" y="77" font-size="15" fill="#1f2937">CDN에서 서빙. <tspan font-weight="bold">원본 부하 0</tspan></text>
  <text x="572" y="104" font-size="15" fill="#1f2937">순번·예상 시간 표시</text>

  <!-- 폴링 -->
  <path d="M384,129 V179" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ar-blue)"/>
  <text x="398" y="160" font-size="15" fill="#1d4ed8">폴링 (수 초 간격)</text>

  <!-- 입장 제어기 -->
  <rect x="224" y="188" width="320" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="384" y="220" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">입장 제어기</text>
  <text x="384" y="249" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">초당 N명씩 입장</text>
  <path d="M560,204 V256" stroke="#c4b5fd" stroke-width="3" fill="none"/>
  <text x="572" y="222" font-size="15" fill="#1f2937">Redis에 대기 순번 저장</text>
  <text x="572" y="250" font-size="15" font-weight="bold" fill="#1f2937">N = 실제 처리 능력</text>

  <!-- 토큰 발급 -->
  <path d="M384,269 V319" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ar-violet)"/>
  <text x="398" y="300" font-size="15" fill="#6d28d9">서명된 입장 토큰 발급 (만료 있음)</text>

  <!-- 실제 서비스 -->
  <rect x="224" y="328" width="320" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="384" y="366" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">실제 서비스 (예매·결제)</text>
  <path d="M560,344 V376" stroke="#6ee7b7" stroke-width="3" fill="none"/>
  <text x="572" y="366" font-size="16" font-weight="bold" fill="#047857">항상 처리 가능한 만큼만 들어온다</text>

  <!-- 토큰 없는 요청은 거절 -->
  <text x="40" y="350" font-size="15" font-weight="bold" fill="#b91c1c">토큰 없는 요청</text>
  <path d="M40,364 H194" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar-red)"/>
  <rect x="202" y="344" width="6" height="40" rx="2" fill="#b91c1c"/>
  <text x="196" y="390" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">여기서 거절</text>
</svg>
