<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">outer 반환 전후의 스택과 힙</title>
  <desc id="d">outer() 호출 중에는 콜 스택의 outer 컨텍스트가 LexicalEnv로 힙의 { secret:'hidden' } 환경을 가리키고, inner 함수 객체도 [[Environment]]로 같은 환경을 가리킨다. outer() 반환 후 스택에는 Global만 남지만, fn 변수가 inner를 참조하고 inner가 [[Environment]]로 환경을 참조하므로 { secret:'hidden' }은 여전히 참조된다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="160" y="42" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">콜 스택 (실행 컨텍스트)</text>
  <line x1="48" y1="54" x2="272" y2="54" stroke="#1d4ed8" stroke-width="2"/>
  <text x="575" y="42" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">힙 (렉시컬 환경)</text>
  <line x1="450" y1="54" x2="700" y2="54" stroke="#047857" stroke-width="2"/>

  <!-- ===== ① outer() 호출 중 ===== -->
  <rect x="24" y="68" width="832" height="232" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="94" font-size="16" font-weight="700" fill="#111827">① outer() 호출 중</text>

  <rect x="60" y="112" width="200" height="44" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="160" y="140" font-size="16" fill="#1e3a8a" text-anchor="middle">outer 컨텍스트</text>
  <rect x="60" y="162" width="200" height="44" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="190" font-size="16" fill="#111827" text-anchor="middle">Global</text>

  <rect x="450" y="108" width="250" height="72" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="575" y="136" font-size="16" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ secret:'hidden' }</text>
  <text x="575" y="164" font-size="15" fill="#374151" text-anchor="middle">outer ref → 전역</text>

  <path d="M262,134 L446,134" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <text x="354" y="124" font-size="15" fill="#1d4ed8" text-anchor="middle">LexicalEnv</text>

  <rect x="450" y="236" width="250" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="575" y="264" font-size="16" fill="#5b21b6" text-anchor="middle">inner 함수 객체</text>
  <path d="M575,234 L575,184" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <text x="587" y="214" font-size="15" fill="#6d28d9">[[Environment]]</text>

  <!-- ===== ② outer() 반환 후 ===== -->
  <rect x="24" y="316" width="832" height="238" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="342" font-size="16" font-weight="700" fill="#111827">② outer() 반환 후</text>
  <text x="196" y="342" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">const fn = outer()</text>

  <rect x="60" y="360" width="200" height="44" rx="4" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="160" y="387" font-size="15" fill="#4b5563" text-anchor="middle">outer 컨텍스트 (사라짐)</text>
  <rect x="60" y="410" width="200" height="44" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="124" y="438" font-size="16" fill="#111827" text-anchor="middle">Global</text>
  <rect x="200" y="418" width="48" height="28" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="224" y="438" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fn</text>

  <rect x="450" y="356" width="250" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="575" y="390" font-size="16" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ secret:'hidden' }</text>
  <text x="712" y="390" font-size="15" font-weight="700" fill="#b45309">← 여전히 참조됨</text>

  <rect x="450" y="486" width="250" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="575" y="514" font-size="16" fill="#5b21b6" text-anchor="middle">inner 함수 객체</text>
  <path d="M575,484 L575,416" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <text x="587" y="455" font-size="15" fill="#6d28d9">[[Environment]]</text>

  <path d="M224,448 L224,508 L446,508" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <text x="248" y="496" font-size="15" fill="#b45309">fn 변수가 inner를 참조</text>
</svg>
