<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">G1 GC의 Region 기반 힙</title>
  <desc id="d">G1은 힙을 동일 크기 Region 8×3 격자로 나누고, 각 Region이 Eden, Survivor, Old, Humongous, Free 중 하나의 역할을 맡는다. 같은 세대의 Region이 흩어져 있어 세대가 물리적으로 붙어 있지 않고, Region 하나가 비면 곧바로 다른 역할로 재배정된다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <text x="44" y="42" font-size="18" font-weight="bold" fill="#111827">Region 기반 힙</text>

  <!-- 범례 -->
  <rect x="44" y="62" width="20" height="20" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="72" y="78" font-size="15" fill="#111827">E = Eden</text>
  <rect x="197" y="62" width="20" height="20" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="225" y="78" font-size="15" fill="#111827">S = Survivor</text>
  <rect x="373" y="62" width="20" height="20" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="401" y="78" font-size="15" fill="#111827">O = Old</text>
  <rect x="521" y="62" width="20" height="20" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="549" y="78" font-size="15" fill="#111827">H = Humongous</text>
  <rect x="728" y="62" width="20" height="20" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="756" y="78" font-size="15" fill="#111827">빈칸 = Free</text>

  <!-- 1행: E O · S O E H H -->
  <rect x="44" y="108" width="92" height="64" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="148" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle">E</text>
  <rect x="144" y="108" width="92" height="64" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
