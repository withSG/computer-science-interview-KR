  <rect x="244" y="252" width="92" height="64" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="290" y="292" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle">E</text>
  <rect x="344" y="252" width="92" height="64" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
