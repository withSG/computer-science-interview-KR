  <rect x="544" y="252" width="92" height="64" rx="5" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="590" y="292" font-size="22" font-weight="bold" fill="#065f46" text-anchor="middle">S</text>
