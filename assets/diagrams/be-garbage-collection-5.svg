  <rect x="744" y="252" width="92" height="64" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="790" y="292" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle">E</text>

  <!-- 요점 -->
  <rect x="44" y="340" width="792" height="84" rx="6" fill="#f3f4f6"/>
  <text x="64" y="374" font-size="16" fill="#111827">• 세대가 <tspan font-weight="bold">물리적으로 붙어 있지 않다.</tspan></text>
  <text x="64" y="404" font-size="16" fill="#111827">• Region 하나가 비면 곧바로 <tspan font-weight="bold">다른 역할로 재배정</tspan>된다.</text>
