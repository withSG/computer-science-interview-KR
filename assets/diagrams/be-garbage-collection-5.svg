  <!-- 3행: · O E O · S O E -->
  <rect x="44" y="252" width="92" height="64" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="144" y="252" width="92" height="64" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
