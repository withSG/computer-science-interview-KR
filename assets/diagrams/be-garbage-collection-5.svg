  <rect x="644" y="180" width="92" height="64" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="690" y="220" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle">E</text>
