<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">병목을 찾는 6단계</title>
  <desc id="d">목표 정의, 범위 좁히기, 정밀 분석, 가설 하나, 수정과 재측정, 지표 고정의 여섯 단계를 위에서 아래로 차례대로 밟으며, 4단계에서는 가장 큰 비용 한 곳만 골라 한 번에 하나만 고친다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 단계 사이 연결 -->
  <g stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="60" y1="94" x2="60" y2="148"/>
    <line x1="60" y1="198" x2="60" y2="238"/>
    <line x1="60" y1="288" x2="60" y2="314"/>
    <line x1="60" y1="364" x2="60" y2="390"/>
    <line x1="60" y1="440" x2="60" y2="466"/>
  </g>

  <!-- 1. 목표 정의 -->
  <rect x="104" y="28" width="752" height="84" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="60" cy="70" r="20" fill="#1d4ed8"/>
  <text x="60" y="76" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="128" y="76" font-size="18" font-weight="bold" fill="#111827">목표 정의</text>
  <rect x="276" y="40" width="280" height="32" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="416" y="62" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">"주문 API p99 800ms → 200ms"</text>
  <text x="276" y="99" font-size="15" fill="#4b5563">숫자가 없으면 성공 여부를 판정할 수 없다</text>

  <!-- 2. 범위 좁히기 -->
  <rect x="104" y="132" width="752" height="84" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="60" cy="174" r="20" fill="#1d4ed8"/>
  <text x="60" y="180" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="128" y="180" font-size="18" font-weight="bold" fill="#111827">범위 좁히기</text>
  <text x="276" y="160" font-size="16" fill="#111827">어느 계층에서 시간이 빠지는가?</text>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.2">
    <rect x="276" y="172" width="100" height="30" rx="6"/>
    <rect x="400" y="172" width="86" height="30" rx="6"/>
    <rect x="510" y="172" width="48" height="30" rx="6"/>
    <rect x="582" y="172" width="50" height="30" rx="6"/>
  </g>
  <g font-size="15" fill="#111827" text-anchor="middle">
    <text x="326" y="193">클라이언트</text>
    <text x="443" y="193">네트워크</text>
    <text x="534" y="193">앱</text>
    <text x="607" y="193">DB</text>
  </g>
  <g font-size="15" fill="#6b7280" text-anchor="middle">
    <text x="388" y="193">/</text>
    <text x="498" y="193">/</text>
    <text x="570" y="193">/</text>
  </g>

  <!-- 3. 정밀 분석 -->
  <rect x="104" y="236" width="752" height="56" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="60" cy="264" r="20" fill="#1d4ed8"/>
  <text x="60" y="270" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="128" y="270" font-size="18" font-weight="bold" fill="#111827">정밀 분석</text>
  <text x="276" y="270" font-size="16" fill="#111827">좁혀진 계층의 전용 도구를 쓴다</text>

  <!-- 4. 가설 하나 (핵심) -->
  <rect x="104" y="312" width="752" height="56" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <circle cx="60" cy="340" r="20" fill="#b45309"/>
  <text x="60" y="346" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="128" y="346" font-size="18" font-weight="bold" fill="#111827">가설 하나</text>
  <text x="276" y="346" font-size="16" font-weight="bold" fill="#92400e">가장 큰 비용 한 곳만 고른다</text>
  <rect x="648" y="324" width="192" height="32" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="744" y="345" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">한 번에 하나만 고친다</text>

  <!-- 5. 수정 + 재측정 -->
  <rect x="104" y="388" width="752" height="56" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="60" cy="416" r="20" fill="#1d4ed8"/>
  <text x="60" y="422" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="128" y="422" font-size="18" font-weight="bold" fill="#111827">수정 + 재측정</text>
  <text x="276" y="422" font-size="16" fill="#111827">같은 조건으로 다시 잰다</text>

  <!-- 6. 지표 고정 -->
  <rect x="104" y="464" width="752" height="56" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="60" cy="492" r="20" fill="#1d4ed8"/>
  <text x="60" y="498" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="128" y="498" font-size="18" font-weight="bold" fill="#111827">지표 고정</text>
  <text x="276" y="498" font-size="16" fill="#111827">대시보드와 알람에 반영해 회귀를 막는다</text>
</svg>
