<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">병목을 찾는 절차</title>
  <desc id="d">목표 정의부터 지표 고정까지 병목을 찾는 6단계 절차를 설명하는 플로우차트</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="720" fill="#ffffff"/>
  
  <!-- Outer Container Frame (Original Outer Box) -->
  <rect x="24" y="24" width="832" height="672" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- Step 1 -->
  <g>
    <rect x="54" y="44" width="772" height="76" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="74" y="76.6" font-size="14" font-weight="bold" fill="#1f2933">1. 목표 정의</text>
    <rect x="165" y="58" width="220" height="26" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="275" y="75.6" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">"주문 API p99 800ms → 200ms"</text>
    <text x="74" y="103.6" font-size="12" fill="#52606d">숫자가 없으면 성공 여부를 판정할 수 없다</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,120 L440,146" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 -->
  <g>
    <rect x="54" y="148" width="772" height="76" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="74" y="180.6" font-size="14" font-weight="bold" fill="#1f2933">2. 범위 좁히기</text>
    <text x="175" y="180.6" font-size="13" fill="#1f2933">어느 계층에서 시간이 빠지는가?</text>
    <text x="74" y="207.6" font-size="12" fill="#52606d">클라이언트 / 네트워크 / 앱 / DB</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,224 L440,250" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3 -->
  <g>
    <rect x="54" y="252" width="772" height="76" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="74" y="284.6" font-size="14" font-weight="bold" fill="#1f2933">3. 정밀 분석</text>
    <text x="175" y="284.6" font-size="13" fill="#1f2933">좁혀진 계층의 전용 도구를 쓴다</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,328 L440,354" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4 -->
  <g>
    <rect x="54" y="356" width="772" height="76" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="74" y="388.6" font-size="14" font-weight="bold" fill="#1f2933">4. 가설 하나</text>
    <text x="175" y="388.6" font-size="13" font-weight="bold" fill="#d97706">가장 큰 비용 한 곳만 고른다</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,432 L440,458" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 5 -->
  <g>
    <rect x="54" y="460" width="772" height="76" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="74" y="492.6" font-size="14" font-weight="bold" fill="#1f2933">5. 수정 + 재측정</text>
    <text x="195" y="492.6" font-size="13" fill="#1f2933">같은 조건으로 다시 잰다</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M440,536 L440,562" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 6 -->
  <g>
    <rect x="54" y="564" width="772" height="76" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="74" y="596.6" font-size="14" font-weight="bold" fill="#1f2933">6. 지표 고정</text>
    <text x="175" y="596.6" font-size="13" fill="#059669">대시보드와 알람에 반영해 회귀를 막는다</text>
  </g>
</svg>