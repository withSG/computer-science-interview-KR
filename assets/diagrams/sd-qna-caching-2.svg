<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cache-Aside 읽기 흐름</title>
  <desc id="d">Cache-Aside에서는 애플리케이션이 직접 캐시를 관리합니다. 1. 캐시 조회, 2. Cache Miss이면 DB 조회, 3. 캐시에 저장, 4. 응답 반환 순서로 모든 호출을 애플리케이션이 합니다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 요점 -->
  <text x="440" y="42" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">애플리케이션이 직접 캐시 관리</text>

  <!-- 참여자 -->
  <rect x="100" y="66" width="200" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="200" y="98" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">애플리케이션</text>
  <rect x="430" y="66" width="140" height="52" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="98" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">캐시</text>
  <rect x="700" y="66" width="140" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="770" y="98" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>

  <!-- 생명선 -->
  <line x1="200" y1="118" x2="200" y2="494" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="500" y1="118" x2="500" y2="494" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="770" y1="118" x2="770" y2="494" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 1. 캐시 조회 -->
  <text x="350" y="166" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">1. 캐시 조회</text>
  <line x1="202" y1="178" x2="496" y2="178" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Cache Miss 응답 -->
  <text x="350" y="220" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Cache Miss</text>
  <line x1="498" y1="232" x2="204" y2="232" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrM)"/>

  <!-- 2. DB 조회 -->
  <text x="350" y="284" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">2. DB 조회</text>
  <line x1="202" y1="296" x2="766" y2="296" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="768" y1="340" x2="204" y2="340" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrR)"/>

  <!-- 3. 캐시에 저장 -->
  <text x="350" y="392" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">3. 캐시에 저장</text>
  <line x1="202" y1="404" x2="496" y2="404" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4. 응답 반환 -->
  <text x="108" y="450" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">4. 응답 반환</text>
  <line x1="198" y1="462" x2="34" y2="462" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arr)"/>
</svg>
