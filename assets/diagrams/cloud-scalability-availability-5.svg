<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RPO와 RTO 두 개의 시간축</title>
  <desc id="d">장애 발생 시점을 기준으로, 마지막 복제/백업 시점부터 장애까지가 RPO(잃을 수 있는 데이터), 장애부터 서비스 재개까지가 RTO(감수하는 중단 시간)다.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 구간 음영 -->
  <rect x="180" y="96" width="270" height="200" fill="#eff6ff"/>
  <rect x="450" y="96" width="270" height="200" fill="#fff7ed"/>

  <!-- 시점 라벨 -->
  <text x="180" y="52" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">마지막 복제/백업 시점</text>
  <text x="450" y="52" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">장애 발생</text>
  <text x="720" y="52" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">서비스 재개</text>

  <!-- 시점 세로선 -->
  <path d="M180,64 L180,200" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M450,64 L450,200" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M720,64 L720,200" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <!-- 시간축 -->
  <path d="M40,130 L800,130" stroke="#1f2937" stroke-width="2.5" fill="none" marker-end="url(#ax)"/>
  <text x="812" y="136" font-size="16" font-weight="bold" fill="#1f2937">시간</text>

  <circle cx="180" cy="130" r="8" fill="#1d4ed8"/>
  <circle cx="450" cy="130" r="11" fill="#ffffff"/>
  <path d="M442,122 L458,138 M458,122 L442,138" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="720" cy="130" r="8" fill="#047857"/>

  <!-- RPO -->
  <path d="M290,178 L188,178" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#mb)"/>
  <path d="M340,178 L442,178" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#mb)"/>
  <text x="315" y="186" font-size="22" font-weight="bold" fill="#1d4ed8" text-anchor="middle">RPO</text>
  <text x="315" y="214" font-size="15" fill="#4b5563" text-anchor="middle">Recovery Point Objective</text>
  <text x="315" y="252" font-size="16" fill="#1f2937" text-anchor="middle">이만큼의 데이터를</text>
  <text x="315" y="274" font-size="16" fill="#1f2937" text-anchor="middle">잃을 수 있다</text>

  <!-- RTO -->
  <path d="M560,178 L458,178" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#mo)"/>
  <path d="M610,178 L712,178" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#mo)"/>
  <text x="585" y="186" font-size="22" font-weight="bold" fill="#92400e" text-anchor="middle">RTO</text>
  <text x="585" y="214" font-size="15" fill="#4b5563" text-anchor="middle">Recovery Time Objective</text>
  <text x="585" y="252" font-size="16" fill="#1f2937" text-anchor="middle">이만큼의 중단 시간을</text>
  <text x="585" y="274" font-size="16" fill="#1f2937" text-anchor="middle">감수한다</text>
</svg>
