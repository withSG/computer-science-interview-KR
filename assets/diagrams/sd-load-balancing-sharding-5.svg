<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">리샤딩 문제</title>
  <desc id="d">같은 key=100이 샤드 3개일 때는 hash(100) % 3 = 1로 샤드1에, 샤드 4개로 늘면 hash(100) % 4 = 0으로 샤드0에 배정되어 이사해야 합니다. 샤드 수가 3에서 4로 바뀌면 전체 키의 약 75%가 자리를 옮깁니다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 행 1: 샤드 3개일 때 -->
  <text x="56" y="78" font-size="17" font-weight="bold" fill="#111827">샤드 3개일 때</text>
  <rect x="212" y="48" width="120" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="272" y="78" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">key=100</text>
  <line x1="336" y1="72" x2="370" y2="72" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="376" y="48" width="250" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="501" y="78" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash(100) % 3 = 1</text>
  <line x1="630" y1="72" x2="664" y2="72" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="670" y="48" width="120" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="730" y="79" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">샤드1</text>

  <!-- 이사 화살표 -->
  <line x1="730" y1="102" x2="730" y2="160" stroke="#b91c1c" stroke-width="3" marker-end="url(#ah-red)"/>
  <text x="746" y="137" font-size="17" font-weight="bold" fill="#b91c1c">이사해야 함</text>

  <!-- 행 2: 샤드 4개로 -->
  <text x="56" y="198" font-size="17" font-weight="bold" fill="#111827">샤드 4개로</text>
  <rect x="212" y="168" width="120" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="272" y="198" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">key=100</text>
  <line x1="336" y1="192" x2="370" y2="192" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="376" y="168" width="250" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="501" y="198" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash(100) <tspan fill="#b91c1c" font-weight="bold">% 4 = 0</tspan></text>
  <line x1="630" y1="192" x2="664" y2="192" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="670" y="168" width="120" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="730" y="199" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">샤드0</text>

  <!-- 전체 영향 -->
  <rect x="40" y="252" width="800" height="170" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="288" font-size="18" font-weight="bold" fill="#111827">샤드 수가 3→4로 바뀌면 전체 키의 <tspan fill="#b91c1c">약 75%</tspan>가 자리를 옮긴다</text>
  <rect x="64" y="306" width="752" height="44" rx="6" fill="#e5e7eb"/>
  <rect x="64" y="306" width="564" height="44" rx="6" fill="#b91c1c"/>
  <text x="346" y="334" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">약 75% 자리 이동</text>
  <text x="722" y="334" font-size="16" fill="#374151" text-anchor="middle">나머지</text>
  <text x="64" y="396" font-size="17" fill="#111827">데이터가 수 테라바이트라면 이 작업 중에 서비스를 어떻게 할 것인가?</text>
</svg>
