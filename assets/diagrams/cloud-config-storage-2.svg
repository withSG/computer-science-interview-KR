<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">볼륨: 컨테이너 밖에 데이터를 두는 방법</title>
  <desc id="d">Pod 내부의 컨테이너 A와 컨테이너 B가 각자의 이미지 레이어를 가지고, 공용 볼륨으로 /data 경로를 연결하여 데이터를 공유하거나 유지하는 구조 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>
  
  <!-- Pod 테두리 영역 -->
  <rect x="40" y="30" width="800" height="440" rx="12" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="440" y="65" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Pod</text>
  
  <!-- 컨테이너 A -->
  <rect x="70" y="90" width="280" height="260" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="125" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">컨테이너 A</text>
  <text x="100" y="165" font-size="13" font-weight="bold" fill="#1f2933">/app</text>
  <text x="110" y="195" font-size="11.5" fill="#52606d">(이미지</text>
  <text x="110" y="220" font-size="11.5" fill="#52606d"> 레이어,</text>
  <text x="110" y="245" font-size="11.5" fill="#52606d"> 재시작 시</text>
  <text x="110" y="270" font-size="11.5" fill="#52606d"> 초기화)</text>
  <text x="100" y="319" font-size="13" font-weight="bold" fill="#1f2933">/data</text>
  
  <!-- 컨테이너 B -->
  <rect x="530" y="90" width="280" height="260" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="670" y="125" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">컨테이너 B</text>
  <text x="560" y="165" font-size="13" font-weight="bold" fill="#1f2933">/app</text>
  <text x="570" y="195" font-size="11.5" fill="#52606d">(이미지</text>
  <text x="570" y="220" font-size="11.5" fill="#52606d"> 레이어,</text>
  <text x="570" y="245" font-size="11.5" fill="#52606d"> 각자 별도)</text>
  <text x="730" y="319" font-size="13" font-weight="bold" fill="#1f2933">/data</text>

  <!-- 연결선: /data 라인 -->
  <path d="M145,315 L440,315 M440,315 L720,315" stroke="#1f2933" stroke-width="2"/>
  
  <!-- 화살표: 볼륨으로 연결 -->
  <path d="M440,315 L440,373" stroke="#1f2933" stroke-width="2" marker-end="url(#a-ink)"/>
  
  <!-- 볼륨 박스 -->
  <rect x="350" y="375" width="180" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="418" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">볼륨</text>
  
  <!-- 부가 설명 텍스트 -->
  <text x="550" y="405" font-size="11.5" fill="#52606d">Pod 수명 또는</text>
  <text x="550" y="425" font-size="11.5" fill="#52606d">그 이상 유지</text>
</svg>