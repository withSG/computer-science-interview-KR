<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">fail2ban 차단 흐름</title>
  <desc id="d">sshd가 인증 실패 로그를 /var/log에 남기고, fail2ban이 이를 감시하다 findtime 안에 maxretry 초과를 감지하면 방화벽에 차단 규칙을 추가해 bantime 동안 DROP한 뒤 규칙을 제거한다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 참여자 머리 -->
  <rect x="40" y="24" width="120" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="100" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">sshd</text>
  <rect x="220" y="24" width="140" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="290" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/var/log</text>
  <rect x="420" y="24" width="160" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="500" y="52" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">fail2ban</text>
  <rect x="680" y="24" width="160" height="44" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="760" y="52" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">방화벽</text>

  <!-- 생명선 -->
  <line x1="100" y1="68" x2="100" y2="476" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="290" y1="68" x2="290" y2="476" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="500" y1="68" x2="500" y2="218" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="500" y1="292" x2="500" y2="476" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="760" y1="68" x2="760" y2="330" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="760" y1="460" x2="760" y2="476" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 1. sshd -> /var/log : 인증 실패 로그 -->
  <circle cx="142" cy="102" r="11" fill="#374151"/>
  <text x="142" y="107" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="161" y="108" font-size="15" font-weight="bold" fill="#111827">인증 실패 로그</text>
  <line x1="102" y1="122" x2="286" y2="122" stroke="#374151" stroke-width="2" marker-end="url(#a-ink)"/>

  <!-- 2. fail2ban -> /var/log : 감시 -->
  <circle cx="376" cy="160" r="11" fill="#1d4ed8"/>
  <text x="376" y="165" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="395" y="166" font-size="16" font-weight="bold" fill="#1d4ed8">감시</text>
  <line x1="498" y1="180" x2="294" y2="180" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a-blue)"/>

  <!-- 3. findtime 안에 maxretry 초과 감지 -->
  <circle cx="376" cy="255" r="11" fill="#b45309"/>
  <text x="376" y="260" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="400" y="218" width="200" height="74" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="500" y="248" font-size="16" fill="#92400e" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="17" font-weight="bold">findtime</tspan> 안에</text>
  <text x="500" y="274" font-size="16" fill="#92400e" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="17" font-weight="bold">maxretry</tspan> 초과 감지</text>

  <!-- 4. 차단 규칙 추가 -->
  <circle cx="530" cy="333" r="11" fill="#b91c1c"/>
  <text x="530" y="338" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="549" y="339" font-size="16" font-weight="bold" fill="#b91c1c">차단 규칙 추가</text>
  <line x1="502" y1="354" x2="676" y2="354" stroke="#b91c1c" stroke-width="2" marker-end="url(#a-red)"/>

  <!-- 5. bantime 동안 DROP -->
  <rect x="680" y="330" width="160" height="130" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="760" cy="360" r="11" fill="#b91c1c"/>
  <text x="760" y="365" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="760" y="400" font-size="16" fill="#991b1b" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="17" font-weight="bold">bantime</tspan> 동안</text>
  <text x="760" y="428" font-size="19" font-weight="bold" fill="#991b1b" text-anchor="middle">DROP</text>

  <!-- 6. 규칙 제거 -->
  <circle cx="530" cy="421" r="11" fill="#047857"/>
  <text x="530" y="426" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="549" y="427" font-size="16" font-weight="bold" fill="#047857">규칙 제거</text>
  <line x1="502" y1="442" x2="676" y2="442" stroke="#047857" stroke-width="2" marker-end="url(#a-green)"/>
</svg>
