<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">백분위수 (Percentile)</title>
  <desc id="d">백분위수 P50, P95, P99의 정의와 예시, 그리고 P99의 중요성을 설명하는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 메인 콘테이너 박스 -->
  <rect x="20" y="20" width="840" height="350" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 섹션 1: 정의 목록 -->
  <g>
    <!-- P50 (Median) -->
    <rect x="40" y="40" width="130" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="105" y="61" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">P50 (Median):</text>
    <text x="180" y="61" font-size="13" fill="#1f2933">50%의 요청이 이 시간 내 완료</text>

    <!-- P95 -->
    <rect x="40" y="82" width="130" height="32" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
    <text x="105" y="103" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">P95:</text>
    <text x="180" y="103" font-size="13" fill="#1f2933">95%의 요청이 이 시간 내 완료</text>

    <!-- P99 -->
    <rect x="40" y="124" width="130" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="105" y="145" font-size="13" fill="#dc2626" font-weight="bold" text-anchor="middle">P99:</text>
    <text x="180" y="145" font-size="13" fill="#1f2933">99%의 요청이 이 시간 내 완료</text>
  </g>

  <!-- 구분선 -->
  <line x1="40" y1="171" x2="840" y2="171" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 섹션 2: 예시 -->
  <g>
    <text x="40" y="197" font-size="13" font-weight="bold" fill="#52606d">예:</text>

    <!-- P50 예시 -->
    <text x="40" y="227" font-size="13" font-weight="bold" fill="#2563eb">P50: 50ms</text>
    <path d="M125,223 L210,223" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="222" y="227" font-size="13" fill="#1f2933">절반의 요청은 50ms 이내</text>

    <!-- P99 예시 -->
    <text x="40" y="259" font-size="13" font-weight="bold" fill="#dc2626">P99: 500ms</text>
    <path d="M135,255 L210,255" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="222" y="259" font-size="13" fill="#1f2933">1%의 요청은 500ms 초과</text>
  </g>

  <!-- 구분선 -->
  <line x1="40" y1="285" x2="840" y2="285" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 섹션 3: 핵심 결론 -->
  <g>
    <rect x="40" y="300" width="800" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="440" y="330" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">평균보다 P99가 더 중요 (느린 요청 파악)</text>
  </g>
</svg>