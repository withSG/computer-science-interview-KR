<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">백분위수 (Percentile)</title>
  <desc id="d">P50(Median), P95, P99는 각각 50%, 95%, 99%의 요청이 그 시간 내에 완료됨을 뜻한다. 예를 들어 P50이 50ms면 절반의 요청은 50ms 이내, P99가 500ms면 1%의 요청은 500ms를 넘는다. 평균보다 P99가 더 중요하다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- 정의: 전체 요청 중 이 시간 내 완료된 비율 -->
  <rect x="24" y="24" width="150" height="38" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="99" y="49" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">P50 (Median)</text>
  <rect x="190" y="31" width="320" height="24" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="190.5" y="31.5" width="160" height="23" rx="4" fill="#3b82f6"/>
  <text x="528" y="49" font-size="16" fill="#1f2933"><tspan font-weight="bold">50%</tspan>의 요청이 이 시간 내 완료</text>

  <rect x="24" y="76" width="150" height="38" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="99" y="101" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2933">P95</text>
  <rect x="190" y="83" width="320" height="24" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="190.5" y="83.5" width="304" height="23" rx="4" fill="#64748b"/>
  <text x="528" y="101" font-size="16" fill="#1f2933"><tspan font-weight="bold">95%</tspan>의 요청이 이 시간 내 완료</text>

  <rect x="24" y="128" width="150" height="38" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="99" y="153" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">P99</text>
  <rect x="190" y="135" width="320" height="24" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="190.5" y="135.5" width="316.8" height="23" rx="4" fill="#dc2626"/>
  <text x="528" y="153" font-size="16" fill="#1f2933"><tspan font-weight="bold">99%</tspan>의 요청이 이 시간 내 완료</text>

  <line x1="24" y1="188" x2="856" y2="188" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 예 -->
  <text x="24" y="216" font-size="16" font-weight="bold" fill="#374151">예:</text>

  <rect x="24" y="232" width="150" height="38" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="99" y="257" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">P50: 50ms</text>
  <line x1="182" y1="251" x2="218" y2="251" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <text x="232" y="257" font-size="16" fill="#1f2933">절반의 요청은 <tspan font-weight="bold" fill="#1d4ed8">50ms 이내</tspan></text>

  <rect x="24" y="282" width="150" height="38" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="99" y="307" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">P99: 500ms</text>
  <line x1="182" y1="301" x2="218" y2="301" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a-red)"/>
  <text x="232" y="307" font-size="16" fill="#1f2933">1%의 요청은 <tspan font-weight="bold" fill="#b91c1c">500ms 초과</tspan></text>

  <!-- 결론 -->
  <rect x="24" y="344" width="832" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="376" font-size="18" font-weight="bold" text-anchor="middle" fill="#92400e">평균보다 P99가 더 중요 (느린 요청 파악)</text>
</svg>
