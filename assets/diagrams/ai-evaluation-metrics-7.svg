<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">무작위 K-Fold와 시계열 분할</title>
  <desc id="d">무작위 K-Fold는 학습·검증 구간을 시간축에 섞어, 검증 구간의 정답을 오른쪽(미래) 학습 구간이 이미 알고 있게 된다. 시계열 분할은 split 1~4에서 학습 구간을 누적하고 검증 구간을 항상 학습 구간의 오른쪽에 두어, 과거로 학습해 미래를 예측한다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="690" fill="#ffffff"/>

  <!-- ===== [안티패턴] 무작위 K-Fold ===== -->
  <rect x="24" y="24" width="832" height="272" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="48" y="58" font-size="18" font-weight="bold" fill="#b91c1c">[안티패턴] 무작위 K-Fold</text>

  <text x="48" y="105" font-size="15" fill="#4b5563">시간축</text>
  <text x="136" y="88" font-size="14" fill="#4b5563">과거</text>
  <text x="828" y="88" font-size="14" fill="#4b5563" text-anchor="end">미래</text>
  <line x1="136" y1="100" x2="826" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 오른쪽 학습 구간 → 검증 구간 (정답이 새어 듦) -->
  <path d="M424,194 C424,164 326,164 326,192" stroke="#dc2626" stroke-width="1.75" stroke-dasharray="5 4" fill="none" marker-end="url(#ahr)"/>
  <path d="M540,194 C540,144 308,144 308,192" stroke="#dc2626" stroke-width="1.75" stroke-dasharray="5 4" fill="none" marker-end="url(#ahr)"/>
  <path d="M772,194 C772,114 290,114 290,192" stroke="#dc2626" stroke-width="1.75" stroke-dasharray="5 4" fill="none" marker-end="url(#ahr)"/>

  <rect x="136" y="196" width="112" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="192" y="223" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="252" y="196" width="112" height="44" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="308" y="223" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <rect x="368" y="196" width="112" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="424" y="223" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="484" y="196" width="112" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="540" y="223" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="600" y="196" width="112" height="44" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="656" y="223" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <rect x="716" y="196" width="112" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="772" y="223" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>

  <line x1="308" y1="282" x2="308" y2="246" stroke="#b91c1c" stroke-width="1.75" marker-end="url(#ahr)"/>
  <text x="322" y="276" font-size="16" font-weight="bold" fill="#b91c1c">이 검증 구간의 정답을 오른쪽 학습 구간이 이미 알고 있다</text>

  <!-- ===== [개선] 시계열 분할 ===== -->
  <rect x="24" y="316" width="832" height="350" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="48" y="350" font-size="18" font-weight="bold" fill="#047857">[개선] 시계열 분할 — 항상 과거로 학습해 미래를 예측</text>

  <text x="48" y="397" font-size="15" fill="#4b5563">시간축</text>
  <text x="136" y="380" font-size="14" fill="#4b5563">과거</text>
  <text x="828" y="380" font-size="14" fill="#4b5563" text-anchor="end">미래</text>
  <line x1="136" y1="392" x2="826" y2="392" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- split 1 -->
  <text x="48" y="438" font-size="16" font-weight="bold" fill="#1f2937">split 1</text>
  <rect x="136" y="412" width="112" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="192" y="437" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="252" y="412" width="112" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="308" y="437" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>

  <!-- split 2 -->
  <text x="48" y="490" font-size="16" font-weight="bold" fill="#1f2937">split 2</text>
  <rect x="136" y="464" width="228" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="250" y="489" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="368" y="464" width="112" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="424" y="489" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>

  <!-- split 3 -->
  <text x="48" y="542" font-size="16" font-weight="bold" fill="#1f2937">split 3</text>
  <rect x="136" y="516" width="344" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="308" y="541" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="484" y="516" width="112" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="540" y="541" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>

  <!-- split 4 -->
  <text x="48" y="594" font-size="16" font-weight="bold" fill="#1f2937">split 4</text>
  <rect x="136" y="568" width="460" height="40" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="366" y="593" font-size="15" fill="#1e3a8a" text-anchor="middle">학습</text>
  <rect x="600" y="568" width="112" height="40" rx="4" fill="#c2410c" stroke="#9a3412" stroke-width="1"/>
  <text x="656" y="593" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>

  <text x="48" y="642" font-size="16" fill="#374151">학습 구간은 누적되고, 검증 구간은 항상 학습 구간의 오른쪽에 있다</text>
</svg>
