<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">고정 창과 미끄러지는 창</title>
  <desc id="d">Fixed Window는 12:00, 12:01 창의 경계가 벽처럼 고정되어 있다. Sliding Window는 현재 시각이 12:01:00, 12:01:02, 12:01:30으로 바뀔 때마다 창이 12:00:00 ~ 12:01:00, 12:00:02 ~ 12:01:02, 12:00:30 ~ 12:01:30으로 현재를 따라 미끄러진다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ===== Fixed Window ===== -->
  <text x="32" y="44" font-size="18" font-weight="bold" fill="#111827">Fixed Window<tspan font-size="15" font-weight="normal" fill="#4b5563"> — 창이 벽처럼 고정</tspan></text>

  <rect x="200" y="64" width="300" height="44" fill="#eff6ff"/>
  <rect x="500" y="64" width="300" height="44" fill="#dbeafe"/>
  <text x="350" y="91.5" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">12:00 창</text>
  <text x="650" y="91.5" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">12:01 창</text>
  <line x1="200" y1="56" x2="200" y2="116" stroke="#111827" stroke-width="4"/>
  <line x1="500" y1="56" x2="500" y2="116" stroke="#111827" stroke-width="4"/>
  <line x1="800" y1="56" x2="800" y2="116" stroke="#111827" stroke-width="4"/>

  <!-- ===== Sliding Window ===== -->
  <text x="32" y="160" font-size="18" font-weight="bold" fill="#111827">Sliding Window<tspan font-size="15" font-weight="normal" fill="#4b5563"> — 창이 현재를 따라 계속 미끄러진다</tspan></text>

  <!-- 현재 12:01:00 -->
  <text x="32" y="203" font-size="16" fill="#111827">현재 <tspan font-weight="bold">12:01:00</tspan></text>
  <rect x="200" y="180" width="300" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="350" y="203.5" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">12:00:00 ~ 12:01:00</text>
  <line x1="500" y1="172" x2="500" y2="224" stroke="#b91c1c" stroke-width="3"/>

  <!-- 현재 12:01:02 -->
  <text x="32" y="255" font-size="16" fill="#111827">현재 <tspan font-weight="bold">12:01:02</tspan></text>
  <rect x="210" y="232" width="300" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="360" y="255.5" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">12:00:02 ~ 12:01:02</text>
  <line x1="510" y1="224" x2="510" y2="276" stroke="#b91c1c" stroke-width="3"/>

  <!-- 현재 12:01:30 -->
  <text x="32" y="307" font-size="16" fill="#111827">현재 <tspan font-weight="bold">12:01:30</tspan></text>
  <rect x="350" y="284" width="300" height="36" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="500" y="307.5" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">12:00:30 ~ 12:01:30</text>
  <line x1="650" y1="276" x2="650" y2="328" stroke="#b91c1c" stroke-width="3"/>

  <!-- 시간축 -->
  <line x1="200" y1="352" x2="840" y2="352" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="200" y1="346" x2="200" y2="358" stroke="#374151" stroke-width="1.5"/>
  <line x1="350" y1="346" x2="350" y2="358" stroke="#374151" stroke-width="1.5"/>
  <line x1="500" y1="346" x2="500" y2="358" stroke="#374151" stroke-width="1.5"/>
  <line x1="650" y1="346" x2="650" y2="358" stroke="#374151" stroke-width="1.5"/>
  <line x1="800" y1="346" x2="800" y2="358" stroke="#374151" stroke-width="1.5"/>
  <text x="200" y="378" font-size="15" fill="#374151" text-anchor="middle">12:00:00</text>
  <text x="350" y="378" font-size="15" fill="#374151" text-anchor="middle">12:00:30</text>
  <text x="500" y="378" font-size="15" fill="#374151" text-anchor="middle">12:01:00</text>
  <text x="650" y="378" font-size="15" fill="#374151" text-anchor="middle">12:01:30</text>
  <text x="800" y="378" font-size="15" fill="#374151" text-anchor="middle">12:02:00</text>
  <text x="846" y="340" font-size="15" fill="#374151" text-anchor="end">시간</text>

  <!-- 범례 -->
  <line x1="40" y1="402" x2="40" y2="424" stroke="#b91c1c" stroke-width="3"/>
  <text x="52" y="418" font-size="15" fill="#374151">현재 시각 — 창은 항상 지금부터 과거 1분</text>
</svg>
