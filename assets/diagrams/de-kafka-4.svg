<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파티션은 여러 브로커에 복제된다</title>
  <desc id="d">Partition 0의 리더 및 팔로워 브로커 복제 구조와 ISR 설명 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 메인 콘테이너 영역 (Partition 0) -->
  <rect x="24" y="24" width="832" height="392" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="44" y="55.6" font-size="16" font-weight="bold" fill="#1f2933">Partition 0 (replication.factor = 3)</text>

  <!-- 브로커 박스 1 (Leader) -->
  <rect x="44" y="74" width="280" height="44" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="100.5" font-size="13" font-weight="bold" fill="#1f2933">Broker 1 : <tspan fill="#2563eb">[Leader]</tspan></text>

  <!-- 설명 화살표 & 텍스트 -->
  <path d="M430,96 L332,96" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="440" y="100.5.5" font-size="13" fill="#2563eb" font-weight="bold">← 쓰기와 읽기는 모두 리더가 처리</text>

  <!-- 브로커 박스 2 (Follower) -->
  <rect x="44" y="128" width="280" height="44" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="58" y="154.5" font-size="13" font-weight="bold" fill="#1f2933">Broker 2 : <tspan fill="#52606d">[Follower]</tspan></text>

  <!-- 설명 화살표 & 텍스트 -->
  <path d="M380,150 L332,150" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text x="390" y="154.5" font-size="13" fill="#52606d">← 리더를 따라 복제</text>

  <!-- 브로커 박스 3 (Follower) -->
  <rect x="44" y="182" width="280" height="44" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="58" y="208.5" font-size="13" font-weight="bold" fill="#1f2933">Broker 3 : <tspan fill="#52606d">[Follower]</tspan></text>

  <!-- ISR 관련 정보 영역 -->
  <rect x="44" y="246" width="792" height="150" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  
  <text x="64" y="278.5.5" font-size="14" font-weight="bold" fill="#1f2933">ISR (In-Sync Replicas) = 리더를 충분히 따라잡은 복제본의 집합</text>
  <text x="64" y="309.5" font-size="13" fill="#52606d">- 위 상태에서 ISR = {B1, B2, B3}</text>
  <text x="64" y="337.5" font-size="13" fill="#52606d">- B3이 뒤처지면 ISR = {B1, B2} 로 축소된다</text>
  <text x="64" y="365.5" font-size="13" fill="#52606d">- 리더가 죽으면 ISR 안에서 새 리더가 뽑힌다</text>
</svg>