<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파티션 복제와 ISR</title>
  <desc id="d">replication.factor가 3인 Partition 0은 Broker 1이 리더로 쓰기와 읽기를 처리하고 Broker 2, 3이 리더를 따라 복제한다. 평소 ISR은 {B1, B2, B3}이고 B3이 뒤처지면 {B1, B2}로 줄며, 리더가 죽으면 ISR 안에서 새 리더가 뽑힌다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="24" y="50" font-size="20" font-weight="700" fill="#111827">Partition 0 <tspan font-size="16" font-weight="400" fill="#4b5563">(replication.factor = 3)</tspan></text>

  <!-- ===== 브로커 3대 ===== -->
  <rect x="72" y="108" width="160" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="152" y="131" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Broker 1</text>
  <text x="152" y="153" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Leader</text>

  <rect x="72" y="188" width="160" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="152" y="211" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Broker 2</text>
  <text x="152" y="233" font-size="15" fill="#4b5563" text-anchor="middle">Follower</text>

  <rect x="72" y="268" width="160" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="152" y="291" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Broker 3</text>
  <text x="152" y="313" font-size="15" fill="#4b5563" text-anchor="middle">Follower</text>

  <!-- 복제: 리더 → 팔로워 -->
  <path d="M72,136 H46 V296 H68" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M46,216 H68" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <text x="248" y="141" font-size="15" font-weight="700" fill="#1d4ed8">← 쓰기와 읽기는 모두 리더가 처리</text>
  <text x="248" y="221" font-size="15" fill="#374151">← 리더를 따라 복제</text>
  <text x="248" y="301" font-size="15" fill="#374151">← 리더를 따라 복제</text>

  <!-- ===== ISR 두 상태 ===== -->
  <text x="590" y="88" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">정상 상태</text>
  <text x="770" y="88" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">B3이 뒤처지면</text>

  <!-- 정상: ISR = {B1, B2, B3} -->
  <rect x="546" y="104" width="88" height="224" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <rect x="558" y="118" width="64" height="36" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="590" y="142" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">B1</text>
  <rect x="558" y="198" width="64" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="590" y="222" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">B2</text>
  <rect x="558" y="278" width="64" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="590" y="302" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">B3</text>
  <text x="590" y="362" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">ISR = {B1, B2, B3}</text>

  <!-- B3 뒤처짐: ISR = {B1, B2} -->
  <rect x="726" y="104" width="88" height="144" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <rect x="738" y="118" width="64" height="36" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="770" y="142" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">B1</text>
  <rect x="738" y="198" width="64" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="770" y="222" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">B2</text>
  <rect x="738" y="278" width="64" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="770" y="302" font-size="16" font-weight="700" fill="#4b5563" text-anchor="middle">B3</text>
  <text x="770" y="268" font-size="14" fill="#b91c1c" text-anchor="middle">뒤처져 빠짐</text>
  <text x="770" y="362" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">ISR = {B1, B2}</text>
  <text x="770" y="384" font-size="15" fill="#374151" text-anchor="middle">로 축소된다</text>

  <!-- ===== ISR 정의와 리더 선출 ===== -->
  <rect x="24" y="404" width="832" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="434" font-size="16" fill="#111827"><tspan font-weight="700" fill="#047857">ISR (In-Sync Replicas)</tspan> = 리더를 충분히 따라잡은 복제본의 집합</text>
  <text x="44" y="462" font-size="16" font-weight="700" fill="#111827">리더가 죽으면 ISR 안에서 새 리더가 뽑힌다</text>
</svg>
