<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">학습 순서 권장</title>
  <desc id="d">프론트엔드 핵심 개념의 추천 학습 순서를 단계별로 보여주는 플로우차트</desc>
  <rect width="880" height="770" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="440" y="45" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">학습 순서 권장</text>

  <!-- Step 1 -->
  <g>
    <rect x="220" y="70" width="440" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="100.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1. HTML/CSS 기초 (시멘틱, 반응형, Flexbox/Grid)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,120 L440,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 -->
  <g>
    <rect x="220" y="150" width="440" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="180.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2. 브라우저 기초 (CRP, DOM/CSSOM)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,200 L440,230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3 -->
  <g>
    <rect x="220" y="230" width="440" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="260.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3. JavaScript 심화 (실행 컨텍스트, 이벤트 루프)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,280 L440,310" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4 -->
  <g>
    <rect x="220" y="310" width="440" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="340.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">4. TypeScript (타입 시스템, 제네릭)</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,360 L440,390" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 5 -->
  <g>
    <rect x="220" y="390" width="440" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="420.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">5. 빌드 도구 (Webpack, Babel)</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M440,440 L440,470" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 6 -->
  <g>
    <rect x="220" y="470" width="440" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="500.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">6. React 아키텍처 (가상 DOM, Fiber, Hooks)</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M440,520 L440,550" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 7 -->
  <g>
    <rect x="220" y="550" width="440" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="580.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">7. Next.js 렌더링 (SSR, RSC)</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M440,600 L440,630" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 8 -->
  <g>
    <rect x="220" y="630" width="440" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="660.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">8. 프론트엔드 아키텍처 (상태 관리, 컴포넌트 설계)</text>
  </g>
</svg>