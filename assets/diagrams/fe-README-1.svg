  <text x="526.5" y="527.5" font-size="15" fill="#1e3a8a" text-anchor="middle">RSC</text>
  <line x1="148" y1="546" x2="148" y2="575" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>

