<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">권장 폴더 구조</title>
  <desc id="d">src 아래 features, shared, app, styles 폴더를 둔 디렉터리 트리. features 아래는 auth, dashboard 같은 도메인(feature) 단위로 나누고, 각 feature 안은 components, hooks, api, store, types 같은 layer 단위로 나눈다. 여러 feature가 함께 쓰는 것은 shared에 둔다.</desc>
  <rect width="880" height="690" fill="#ffffff"/>

  <!-- 요점 캡션 -->
  <text x="40" y="44" font-size="16" fill="#111827"><tspan font-weight="bold">혼합형</tspan><tspan> — 최상위는 </tspan><tspan font-weight="bold" fill="#1d4ed8">feature 기반</tspan><tspan>, 각 feature 내부는 </tspan><tspan font-weight="bold" fill="#047857">layer 기반</tspan></text>

  <!-- feature 행 강조 띠 -->
  <rect x="88" y="128" width="596" height="30" rx="6" fill="#eff6ff"/>
  <rect x="88" y="308" width="596" height="30" rx="6" fill="#eff6ff"/>

  <!-- 트리 연결선 -->
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <line x1="47" y1="96" x2="47" y2="653"/>
    <line x1="47" y1="113" x2="63" y2="113"/>
    <line x1="47" y1="473" x2="63" y2="473"/>
    <line x1="47" y1="623" x2="63" y2="623"/>
    <line x1="47" y1="653" x2="63" y2="653"/>

    <line x1="75" y1="126" x2="75" y2="443"/>
    <line x1="75" y1="143" x2="91" y2="143"/>
    <line x1="75" y1="323" x2="91" y2="323"/>
    <line x1="75" y1="443" x2="91" y2="443"/>

    <line x1="103" y1="156" x2="103" y2="293"/>
    <line x1="103" y1="173" x2="119" y2="173"/>
    <line x1="103" y1="203" x2="119" y2="203"/>
    <line x1="103" y1="233" x2="119" y2="233"/>
    <line x1="103" y1="263" x2="119" y2="263"/>
    <line x1="103" y1="293" x2="119" y2="293"/>

    <line x1="103" y1="336" x2="103" y2="413"/>
    <line x1="103" y1="353" x2="119" y2="353"/>
    <line x1="103" y1="383" x2="119" y2="383"/>
    <line x1="103" y1="413" x2="119" y2="413"/>

    <line x1="75" y1="486" x2="75" y2="593"/>
    <line x1="75" y1="503" x2="91" y2="503"/>
    <line x1="75" y1="533" x2="91" y2="533"/>
    <line x1="75" y1="563" x2="91" y2="563"/>
    <line x1="75" y1="593" x2="91" y2="593"/>
  </g>

  <!-- 트리 항목 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" fill="#111827">
    <text x="40" y="88" font-weight="bold">src/</text>
    <text x="68" y="118" font-weight="bold">features/</text>
    <text x="96" y="148" font-weight="bold" fill="#1d4ed8">auth/</text>
    <text x="124" y="178">components/</text>
    <text x="124" y="208">hooks/</text>
    <text x="124" y="238">api/</text>
    <text x="124" y="268">store/</text>
    <text x="124" y="298">types/</text>
    <text x="96" y="328" font-weight="bold" fill="#1d4ed8">dashboard/</text>
    <text x="124" y="358">components/</text>
    <text x="124" y="388">hooks/</text>
    <text x="124" y="418">api/</text>
    <text x="96" y="448" fill="#4b5563">...</text>
    <text x="68" y="478" font-weight="bold">shared/</text>
    <text x="96" y="508">components/</text>
    <text x="96" y="538">hooks/</text>
    <text x="96" y="568">utils/</text>
    <text x="96" y="598">types/</text>
    <text x="68" y="628" font-weight="bold">app/</text>
    <text x="68" y="658" font-weight="bold">styles/</text>
  </g>

  <!-- 원본 주석 -->
  <g font-size="15" fill="#4b5563">
    <text x="270" y="118">도메인(기능)별 모듈</text>
    <text x="270" y="178">auth 관련 컴포넌트</text>
    <text x="270" y="208">auth 관련 커스텀 훅</text>
    <text x="270" y="238">auth API 호출 함수</text>
    <text x="270" y="268">Zustand/Redux slice</text>
    <text x="270" y="298">auth 관련 타입</text>
    <text x="270" y="478">공통 모듈</text>
    <text x="270" y="508">공통 UI (Button, Modal 등)</text>
    <text x="270" y="538">공통 커스텀 훅</text>
    <text x="270" y="568">유틸 함수</text>
    <text x="270" y="598">공통 타입</text>
    <text x="270" y="628">라우팅, 프로바이더 설정</text>
    <text x="270" y="658">글로벌 스타일, 테마</text>
  </g>

  <!-- feature 단위 표시 -->
  <rect x="490" y="130" width="182" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="581" y="148" font-size="15" fill="#1d4ed8" text-anchor="middle">feature (도메인) 단위</text>
  <rect x="490" y="310" width="182" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="581" y="328" font-size="15" fill="#1d4ed8" text-anchor="middle">feature (도메인) 단위</text>

  <!-- layer 단위 괄호 -->
  <path d="M482,162 H492 V302 H482" stroke="#047857" stroke-width="2" fill="none"/>
  <text x="508" y="226" font-size="16" font-weight="bold" fill="#047857">layer 기반</text>
  <text x="508" y="248" font-size="15" fill="#374151">feature 내부 구조</text>
  <path d="M482,342 H492 V422 H482" stroke="#047857" stroke-width="2" fill="none"/>
  <text x="508" y="387" font-size="16" font-weight="bold" fill="#047857">layer 기반</text>
</svg>
