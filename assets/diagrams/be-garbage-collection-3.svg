<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Mark-Sweep-Compact 단계별 메모리 상태</title>
  <desc id="d">Mark는 루트에서 탐색해 살아있는 객체 A, B, C에 표시하고, Sweep은 표시 안 된 영역을 가용 리스트에 반환해 구멍이 흩어진 단편화 상태를 남기며, Compact는 살아있는 객체를 한쪽으로 밀어 붙여 큰 연속 공간을 확보한다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- ① Mark -->
  <circle cx="46" cy="46" r="14" fill="#111827"/>
  <text x="46" y="51" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="70" y="53" font-size="19" font-weight="bold" fill="#111827">Mark</text>
  <text x="70" y="80" font-size="15" fill="#374151">루트에서 탐색해</text>
  <text x="70" y="101" font-size="15" fill="#374151">살아있는 객체에 표시</text>

  <rect x="280" y="40" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="306" y="75" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>
  <rect x="336" y="40" width="52" height="56" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="392" y="40" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="418" y="75" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">B</text>
  <rect x="448" y="40" width="52" height="56" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="504" y="40" width="52" height="56" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="560" y="40" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="586" y="75" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">C</text>
  <rect x="616" y="40" width="52" height="56" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>

  <text x="688" y="62" font-size="15" font-weight="bold" fill="#111827">Mark 후</text>
  <text x="688" y="86" font-size="15" fill="#1d4ed8">A·B·C만 표시됨</text>

  <line x1="474" y1="102" x2="474" y2="132" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ② Sweep -->
  <circle cx="46" cy="146" r="14" fill="#111827"/>
  <text x="46" y="151" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="70" y="153" font-size="19" font-weight="bold" fill="#111827">Sweep</text>
  <text x="70" y="180" font-size="15" fill="#374151">표시 안 된 영역을</text>
  <text x="70" y="201" font-size="15" fill="#374151">가용 리스트에 반환</text>

  <rect x="280" y="140" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="306" y="175" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>
  <rect x="336" y="140" width="52" height="56" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="392" y="140" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="418" y="175" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">B</text>
  <rect x="448" y="140" width="52" height="56" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="504" y="140" width="52" height="56" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="560" y="140" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="586" y="175" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">C</text>
  <rect x="616" y="140" width="52" height="56" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="688" y="162" font-size="15" font-weight="bold" fill="#111827">Sweep 직후</text>
  <text x="688" y="186" font-size="15" fill="#b91c1c">구멍이 흩어짐(단편화)</text>

  <line x1="474" y1="202" x2="474" y2="232" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ③ Compact -->
  <circle cx="46" cy="246" r="14" fill="#111827"/>
  <text x="46" y="251" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="70" y="253" font-size="19" font-weight="bold" fill="#111827">Compact</text>
  <text x="70" y="280" font-size="15" fill="#374151">살아있는 객체를 한쪽으로</text>
  <text x="70" y="301" font-size="15" fill="#374151">밀어 붙여 단편화 제거</text>

  <rect x="280" y="240" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="306" y="275" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>
  <rect x="336" y="240" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="362" y="275" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">B</text>
  <rect x="392" y="240" width="52" height="56" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="418" y="275" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">C</text>
  <rect x="448" y="240" width="220" height="56" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="558" y="273" font-size="15" fill="#047857" text-anchor="middle">연속된 빈 공간</text>

  <text x="688" y="262" font-size="15" font-weight="bold" fill="#111827">Compact 후</text>
  <text x="688" y="286" font-size="15" fill="#047857">큰 연속 공간 확보</text>

  <!-- 범례 -->
  <line x1="32" y1="322" x2="848" y2="322" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="32" y="336" width="18" height="18" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="58" y="350" font-size="15" fill="#111827">살아있는 객체 (Mark로 표시됨)</text>
  <rect x="300" y="336" width="18" height="18" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="326" y="350" font-size="15" fill="#111827">표시 안 된 객체</text>
  <rect x="470" y="336" width="18" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="496" y="350" font-size="15" fill="#111827">빈 공간 (가용 리스트)</text>
</svg>
