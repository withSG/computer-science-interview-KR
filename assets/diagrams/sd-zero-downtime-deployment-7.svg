<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세 가지 검사 비교</title>
  <desc id="d">Startup, Readiness, Liveness 검사가 각각 묻는 질문, 동작, 해당 상황을 표로 비교한다. Readiness 실패는 LB 대상에서만 제외되고 Liveness 실패는 컨테이너 재시작으로 이어진다.</desc>
  <rect width="880" height="310" fill="#ffffff"/>

  <!-- 표 바탕과 머리행 -->
  <rect x="24" y="24" width="832" height="260" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="25" y="25" width="830" height="43" fill="#f3f4f6"/>

  <!-- 첫 열 색 면 (검사 이름) -->
  <rect x="25" y="68" width="129" height="72" fill="#eff6ff"/>
  <rect x="25" y="140" width="129" height="72" fill="#fffbeb"/>
  <rect x="25" y="212" width="129" height="71" fill="#fef2f2"/>

  <!-- 격자선 -->
  <line x1="24" y1="68" x2="856" y2="68" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="24" y1="140" x2="856" y2="140" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="212" x2="856" y2="212" stroke="#d1d5db" stroke-width="1"/>
  <line x1="154" y1="24" x2="154" y2="284" stroke="#d1d5db" stroke-width="1"/>
  <line x1="394" y1="24" x2="394" y2="284" stroke="#d1d5db" stroke-width="1"/>
  <line x1="624" y1="24" x2="624" y2="284" stroke="#d1d5db" stroke-width="1"/>

  <!-- 머리행 -->
  <text x="40" y="51" font-size="15" font-weight="bold" fill="#374151">검사</text>
  <text x="170" y="51" font-size="15" font-weight="bold" fill="#374151">묻는 질문</text>
  <text x="410" y="51" font-size="15" font-weight="bold" fill="#374151">동작</text>
  <text x="640" y="51" font-size="15" font-weight="bold" fill="#374151">해당 상황</text>

  <!-- Startup -->
  <text x="40" y="110" font-size="18" font-weight="bold" fill="#1d4ed8">Startup</text>
  <text x="170" y="110" font-size="16" fill="#111827">"기동이 끝났나?"</text>
  <text font-size="15" font-weight="bold" fill="#1d4ed8"><tspan x="410" y="98">통과 전까지 다른 검사는</tspan><tspan x="410" y="120">쉬어간다</tspan></text>
  <text font-size="15" fill="#374151"><tspan x="640" y="98">기동이 오래 걸리는</tspan><tspan x="640" y="120">애플리케이션용</tspan></text>

  <!-- Readiness -->
  <text x="40" y="182" font-size="18" font-weight="bold" fill="#b45309">Readiness</text>
  <text x="170" y="182" font-size="16" fill="#111827">"지금 트래픽을 받아도 되나?"</text>
  <text x="410" y="181" font-size="15" font-weight="bold" fill="#b45309">실패 → LB 대상에서만 제외</text>
  <text font-size="15" fill="#374151"><tspan x="640" y="170">기동 중, 일시적 과부하,</tspan><tspan x="640" y="192">종료 시작 시점</tspan></text>

  <!-- Liveness -->
  <text x="40" y="254" font-size="18" font-weight="bold" fill="#b91c1c">Liveness</text>
  <text x="170" y="254" font-size="16" fill="#111827">"죽이고 다시 띄워야 하나?"</text>
  <text x="410" y="253" font-size="15" font-weight="bold" fill="#b91c1c">실패 → 컨테이너 재시작</text>
  <text font-size="15" fill="#374151"><tspan x="640" y="242">데드락처럼 스스로</tspan><tspan x="640" y="264">회복 불가능한 상태</tspan></text>
</svg>
