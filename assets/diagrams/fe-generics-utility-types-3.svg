<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">분배 조건부 타입의 평가</title>
  <desc id="d">NoString&lt;string | number | boolean&gt;는 유니온의 멤버마다 조건이 따로 적용되어 never, number, boolean이 되고, 다시 합칠 때 never가 사라져 number | boolean이 된다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 입력 -->
  <rect x="230" y="24" width="420" height="48" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="54" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">NoString&lt;string | number | boolean&gt;</text>

  <!-- ① 분배 -->
  <path d="M440,72 V116 M155,116 H725" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="454" y="100" font-size="15" fill="#374151"><tspan font-weight="bold">분배</tspan> — 각 멤버에 조건을 따로 적용</text>
  <line x1="155" y1="116" x2="155" y2="156" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="440" y1="116" x2="440" y2="156" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="725" y1="116" x2="725" y2="156" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- ② 멤버별 조건 -->
  <g font-size="16" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" text-anchor="middle">
    <rect x="30" y="158" width="250" height="64" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="155" y="185"><tspan font-weight="bold">string</tspan> extends string</text>
    <text x="155" y="209">? never : string</text>

    <rect x="315" y="158" width="250" height="64" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="440" y="185"><tspan font-weight="bold">number</tspan> extends string</text>
    <text x="440" y="209">? never : number</text>

    <rect x="600" y="158" width="250" height="64" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="725" y="185"><tspan font-weight="bold">boolean</tspan> extends string</text>
    <text x="725" y="209">? never : boolean</text>
  </g>

  <line x1="155" y1="223" x2="155" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="167" y="247" font-size="14" fill="#4b5563">참</text>
  <line x1="440" y1="223" x2="440" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="452" y="247" font-size="14" fill="#4b5563">거짓</text>
  <line x1="725" y1="223" x2="725" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="737" y="247" font-size="14" fill="#4b5563">거짓</text>

  <!-- 멤버별 결과: never | number | boolean -->
  <rect x="75" y="262" width="160" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="155" y="290" font-size="17" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">never</text>
  <text x="297" y="292" font-size="22" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">|</text>
  <rect x="360" y="262" width="160" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="440" y="290" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">number</text>
  <text x="582" y="292" font-size="22" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">|</text>
  <rect x="645" y="262" width="160" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="725" y="290" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">boolean</text>

  <text x="155" y="334" font-size="15" fill="#4b5563" text-anchor="middle">never는 유니온에서 사라진다</text>

  <!-- ③ 합침 -->
  <path d="M725,307 V342 H440" fill="none" stroke="#047857" stroke-width="2"/>
  <line x1="440" y1="307" x2="440" y2="384" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="454" y="370" font-size="15" fill="#374151"><tspan font-weight="bold">합침</tspan> — 결과를 다시 유니온으로</text>

  <rect x="310" y="386" width="260" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="417" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">number | boolean</text>
</svg>
