<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">헬스체크 실패부터 실제 복구까지의 타임라인</title>
  <desc id="d">t=10s에 장애가 나면 5초 간격 헬스체크가 3번 실패한 t=25s에 unhealthy로 판정된다. 감지 시간은 interval × threshold + timeout 정도이고, 실제 복구 시간은 감지, 전환, 전파(TTL, 커넥션 재수립)를 더한 값이다.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="610" fill="#ffffff"/>

  <!-- 단계 구간 (감지 / 전환 / 전파) -->
  <rect x="24" y="74" width="832" height="226" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="24" y="318" width="832" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="24" y="430" width="832" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>

  <text x="836" y="194" font-size="20" font-weight="bold" fill="#92400e" text-anchor="end">감지</text>
  <text x="836" y="372" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="end">전환</text>
  <text x="836" y="461" font-size="20" font-weight="bold" fill="#374151" text-anchor="end">전파</text>

  <!-- 시간축 -->
  <path d="M120,48 L120,412" stroke="#374151" stroke-width="2.5" fill="none"/>
  <path d="M120,412 L120,474" stroke="#374151" stroke-width="2.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ax)"/>

  <!-- 시각 라벨 -->
  <g font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">
    <text x="96" y="54">t=0</text>
    <text x="96" y="104">t=10s</text>
    <text x="96" y="148">t=15s</text>
    <text x="96" y="192">t=20s</text>
    <text x="96" y="236">t=25s</text>
    <text x="96" y="348">t=25s</text>
    <text x="96" y="392">t=25s~</text>
    <text x="96" y="460">t=?</text>
  </g>

  <!-- 축 위 표식 -->
  <circle cx="120" cy="48" r="6" fill="#047857"/>
  <circle cx="120" cy="98" r="9" fill="#ffffff"/>
  <path d="M114,92 L126,104 M126,92 L114,104" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="142" r="7" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <path d="M117,139 L123,145 M123,139 L117,145" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="186" r="7" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <path d="M117,183 L123,189 M123,183 L117,189" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="230" r="8" fill="#b45309"/>
  <path d="M116.5,226.5 L123.5,233.5 M123.5,226.5 L116.5,233.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="342" r="6" fill="#1d4ed8"/>
  <circle cx="120" cy="386" r="6" fill="#1d4ed8"/>
  <circle cx="120" cy="454" r="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>

  <!-- 사건 -->
  <text x="144" y="54" font-size="16" font-weight="bold" fill="#047857">정상 응답 중</text>
  <text x="144" y="104" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#b91c1c">장애 발생</tspan> (프로세스가 응답을 멈춤)</text>
  <text x="144" y="148" font-size="16" fill="#1f2937"><tspan font-weight="bold">헬스체크 1차 실패</tspan><tspan dx="14" font-size="15" fill="#4b5563">(interval 5s, timeout 2s)</tspan></text>
  <text x="144" y="192" font-size="16" font-weight="bold" fill="#1f2937">2차 실패</text>
  <text x="144" y="236" font-size="16" fill="#1f2937"><tspan font-weight="bold">3차 실패 → </tspan><tspan font-weight="bold" fill="#b91c1c">unhealthy 판정</tspan><tspan dx="14" font-size="15" fill="#4b5563">(unhealthy threshold = 3)</tspan></text>

  <rect x="136" y="256" width="496" height="34" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="152" y="279" font-size="16" font-weight="bold" fill="#92400e">↑ 여기까지가 "감지 시간" ≒ interval × threshold + timeout</text>

  <text x="144" y="348" font-size="16" fill="#1f2937">로드 밸런서가 해당 타깃을 제외 → 트래픽이 정상 타깃으로</text>
  <text x="144" y="392" font-size="16" fill="#1f2937"><tspan fill="#4b5563">(DB라면)</tspan> Standby 승격 + 엔드포인트 전환</text>

  <text x="144" y="460" font-size="16" fill="#1f2937">클라이언트/리졸버의 DNS 캐시가 만료될 때까지 옛 주소로 갈 수 있음 (TTL)</text>

  <!-- 실제 복구 시간 공식 -->
  <rect x="24" y="500" width="832" height="86" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="125" y="521" width="140" height="44" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="195" y="549" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">실제 복구 시간</text>
  <text x="283" y="550" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">=</text>
  <rect x="301" y="521" width="76" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="339" y="549" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">감지</text>
  <text x="395" y="550" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">+</text>
  <rect x="413" y="521" width="76" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="451" y="549" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">전환</text>
  <text x="507" y="550" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">+</text>
  <rect x="525" y="521" width="230" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="640" y="549" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">전파(TTL, 커넥션 재수립)</text>
</svg>
