<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">헬스체크가 감지 시간을 결정한다</title>
  <desc id="d">장애 발생 시 헬스체크 실패에 따른 unhealthy 판정, 감지 시간, 로드 밸런서 제외 및 실제 복구 시간을 나타내는 타임라인 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- 메인 타임라인 수직선 -->
  <path d="M 120,40 L 120,490" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- t=0 정상 응답 중 -->
  <rect x="30" y="40" width="60" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="60" y="57" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">t=0</text>
  <circle cx="120" cy="53" r="5" fill="#059669"/>
  <text x="145" y="57.5" font-size="13" font-weight="bold" fill="#059669">정상 응답 중</text>

  <!-- t=10s 장애 발생 -->
  <rect x="30" y="85" width="60" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="102" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">t=10s</text>
  <circle cx="120" cy="98" r="5" fill="#dc2626"/>
  <text x="145" y="102.5" font-size="13" font-weight="bold" fill="#dc2626">장애 발생 (프로세스가 응답을 멈춤)</text>

  <!-- 감지 시간 영역 (t=10s ~ t=25s) 배경 박스 -->
  <rect x="180" y="130" width="660" height="150" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <!-- 헬스체크 트리가지 연결선 -->
  <path d="M 120,150 L 210,150" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M 210,150 L 210,230" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M 210,150 L 230,150" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M 210,190 L 230,190" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M 210,230 L 230,230" stroke="#d97706" stroke-width="1.5" fill="none"/>

  <!-- t=15s 헬스체크 1차 실패 -->
  <rect x="30" y="137" width="60" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="60" y="154" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">t=15s</text>
  <text x="238" y="154.5" font-size="13" font-weight="bold" fill="#1f2933">├── 헬스체크 1차 실패</text>
  <text x="415" y="154.5" font-size="13" fill="#52606d">(interval 5s, timeout 2s)</text>

  <!-- t=20s 2차 실패 -->
  <rect x="30" y="177" width="60" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="60" y="194" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">t=20s</text>
  <text x="238" y="194.5" font-size="13" font-weight="bold" fill="#1f2933">├── 2차 실패</text>

  <!-- t=25s 3차 실패 -->
  <rect x="30" y="217" width="60" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="234" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">t=25s</text>
  <text x="238" y="234.5" font-size="13" font-weight="bold" fill="#dc2626">└── 3차 실패 → unhealthy 판정</text>
  <text x="495" y="234.5" font-size="13" fill="#52606d">(unhealthy threshold = 3)</text>

  <!-- "감지 시간" 주석 화살표 및 라벨 -->
  <path d="M 260,265 L 200,265" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="270" y="269.5" font-size="13" font-weight="bold" fill="#d97706">여기까지가 "감지 시간" ≒ interval × threshold + timeout</text>

  <!-- 타임라인 중앙 하향 화살표 -->
  <path d="M 120,285 L 120,310" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>

  <!-- t=25s 로드 밸런서 타깃 제외 -->
  <rect x="30" y="312" width="60" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="60" y="329" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">t=25s</text>
  <circle cx="120" cy="325" r="5" fill="#2563eb"/>
  <text x="145" y="329.5" font-size="13" fill="#1f2933">로드 밸런서가 해당 타깃을 제외 → 트래픽이 정상 타깃으로</text>

  <!-- t=25s~ Standby 승격 -->
  <rect x="30" y="352" width="60" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="60" y="369" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">t=25s~</text>
  <circle cx="120" cy="365" r="5" fill="#2563eb"/>
  <text x="145" y="369.5" font-size="13" fill="#1f2933">(DB라면) Standby 승격 + 엔드포인트 전환</text>

  <!-- t=? DNS 캐시 만료 -->
  <rect x="30" y="392" width="60" height="26" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="60" y="409" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">t=?</text>
  <circle cx="120" cy="405" r="5" fill="#52606d"/>
  <text x="145" y="409.5" font-size="13" fill="#1f2933">클라이언트/리졸버의 DNS 캐시가 만료될 때까지 옛 주소로 갈 수 있음 (TTL)</text>

  <!-- 구획 구분선 -->
  <path d="M 30,445 L 850,445" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5 4" fill="none"/>

  <!-- 하단 요약 박스 -->
  <rect x="30" y="470" width="820" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="505" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">실제 복구 시간 = 감지 + 전환 + 전파(TTL, 커넥션 재수립)</text>
</svg>