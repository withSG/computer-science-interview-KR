<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Redux 데이터 흐름</title>
  <desc id="d">View가 dispatch(Action)을 보내면 순수 함수인 Reducer가 새 상태를 만들고, Store가 갱신된 뒤 View가 업데이트되는 한 방향 흐름.</desc>
  <rect width="880" height="170" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- View -->
  <rect x="24" y="32" width="100" height="64" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="74" y="70" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">View</text>

  <path d="M128,64 L165,64" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- dispatch(Action) -->
  <rect x="169" y="32" width="176" height="64" rx="32" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="257" y="70" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">dispatch(Action)</text>

  <path d="M349,64 L386,64" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Reducer (순수함수) -->
  <rect x="390" y="32" width="130" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="455" y="59" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Reducer</text>
  <text x="455" y="82" font-size="15" fill="#1e3a8a" text-anchor="middle">(순수함수)</text>

  <path d="M524,64 L561,64" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- Store -->
  <rect x="565" y="32" width="100" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="615" y="70" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Store</text>

  <path d="M669,64 L706,64" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- View 업데이트 -->
  <rect x="710" y="32" width="146" height="64" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="783" y="70" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">View 업데이트</text>

  <!-- 3대 원칙 대응 메모 -->
  <text x="257" y="124" font-size="14" fill="#4b5563" text-anchor="middle">상태 변경은</text>
  <text x="257" y="144" font-size="14" fill="#4b5563" text-anchor="middle">Action으로만</text>
  <text x="455" y="124" font-size="14" fill="#4b5563" text-anchor="middle">이전 상태 + Action</text>
  <text x="455" y="144" font-size="14" fill="#4b5563" text-anchor="middle">→ 새 상태</text>
  <text x="615" y="124" font-size="14" fill="#4b5563" text-anchor="middle">단일 스토어</text>
</svg>
