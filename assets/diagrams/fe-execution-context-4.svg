<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">생성 단계와 실행 단계의 변수 상태</title>
  <desc id="d">생성 단계가 끝난 직후 demo의 VariableEnvironment에는 a가 undefined, fn이 함수 전체로 등록되어 있고, LexicalEnvironment의 b는 초기화되지 않아 접근하면 TDZ 에러가 난다. 실행 단계에서 a = 1로 a가 1이 되고, b = 2에서 b가 초기화되며 TDZ가 끝난다.</desc>
  <defs>
    <marker id="ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="490" fill="#ffffff"/>

  <!-- 1. 생성 단계 종료 시점 -->
  <circle cx="37" cy="30" r="13" fill="#111827"/>
  <text x="37" y="35.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="60" y="36" font-size="18" font-weight="bold" fill="#111827">생성 단계 종료 시점</text>

  <!-- VariableEnvironment 머리 -->
  <path d="M24,64 A10,10 0 0 1 34,54 L846,54 A10,10 0 0 1 856,64 L856,94 L24,94 Z" fill="#eff6ff"/>
  <text x="44" y="80" font-size="17" font-weight="bold" fill="#1d4ed8">VariableEnvironment</text>

  <!-- a : undefined -->
  <text x="60" y="130" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a</text>
  <text x="86" y="130" font-size="17" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:</text>
  <rect x="100" y="107" width="180" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="190" y="129.5" font-size="17" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">undefined</text>
  <line x1="340" y1="124" x2="292" y2="124" stroke="#374151" stroke-width="1.5" marker-end="url(#ah-dark)"/>
  <text x="352" y="129.5" font-size="16" fill="#1f2937">var는 초기화까지</text>

  <!-- fn : <function> -->
  <text x="60" y="178" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">fn</text>
  <text x="86" y="178" font-size="17" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:</text>
  <rect x="100" y="155" width="180" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="190" y="177.5" font-size="17" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;function&gt;</text>
  <line x1="340" y1="172" x2="292" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#ah-dark)"/>
  <text x="352" y="177.5" font-size="16" fill="#1f2937">함수 선언문은 통째로</text>

  <!-- LexicalEnvironment 머리 -->
  <rect x="24" y="210" width="832" height="40" fill="#f5f3ff"/>
  <line x1="24" y1="210" x2="856" y2="210" stroke="#6b7280" stroke-width="1.5"/>
  <text x="44" y="236" font-size="17" font-weight="bold" fill="#6d28d9">LexicalEnvironment</text>

  <!-- b : <uninitialized> -->
  <text x="60" y="286" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">b</text>
  <text x="86" y="286" font-size="17" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:</text>
  <rect x="100" y="263" width="180" height="34" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="190" y="285.5" font-size="17" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;uninitialized&gt;</text>
  <line x1="340" y1="280" x2="292" y2="280" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ah-red)"/>
  <text x="352" y="285.5" font-size="16" font-weight="bold" fill="#b91c1c">접근하면 TDZ 에러</text>

  <!-- 환경 테두리 -->
  <rect x="24" y="54" width="832" height="264" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 2. 실행 단계 진행 -->
  <circle cx="37" cy="358" r="13" fill="#111827"/>
  <text x="37" y="363.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="60" y="364" font-size="18" font-weight="bold" fill="#111827">실행 단계 진행</text>

  <!-- a = 1 → a: 1 -->
  <rect x="44" y="383" width="120" height="34" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="104" y="405.5" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a = 1</text>
  <line x1="176" y1="400" x2="224" y2="400" stroke="#374151" stroke-width="1.5" marker-end="url(#ah-dark)"/>
  <rect x="236" y="383" width="120" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="296" y="405.5" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a: 1</text>

  <!-- b = 2 → b: 2 -->
  <rect x="44" y="431" width="120" height="34" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="104" y="453.5" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">b = 2</text>
  <line x1="176" y1="448" x2="224" y2="448" stroke="#374151" stroke-width="1.5" marker-end="url(#ah-dark)"/>
  <rect x="236" y="431" width="120" height="34" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="296" y="453.5" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">b: 2</text>
  <text x="376" y="453.5" font-size="16" font-weight="bold" fill="#047857">여기서 초기화, TDZ 종료</text>
</svg>
