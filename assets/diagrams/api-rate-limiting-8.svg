<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fixed Window 고정 창과 카운터</title>
  <desc id="d">시간을 12:00~12:01, 12:01~12:02, 12:02~12:03처럼 고정된 1분 창으로 자르고, 창마다 0에서 시작하는 카운터를 하나씩 둔다. 창이 바뀌면 카운터를 0으로 리셋한다.</desc>
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="56" y="40" font-size="16" fill="#374151">고정된 창마다 카운터 하나</text>

  <!-- 창 3개 -->
  <rect x="56" y="60" width="768" height="104" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <line x1="312" y1="60" x2="312" y2="202" stroke="#111827" stroke-width="3"/>
  <line x1="568" y1="60" x2="568" y2="202" stroke="#111827" stroke-width="3"/>

  <text x="184" y="98" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">12:00 ~ 12:01</text>
  <rect x="120" y="116" width="128" height="32" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="184" y="137.5" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">카운터 = 0</text>

  <text x="440" y="98" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">12:01 ~ 12:02</text>
  <rect x="376" y="116" width="128" height="32" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="137.5" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">카운터 = 0</text>

  <text x="696" y="98" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">12:02 ~ 12:03</text>
  <rect x="632" y="116" width="128" height="32" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="696" y="137.5" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">카운터 = 0</text>

  <!-- 시간축 -->
  <line x1="56" y1="194" x2="846" y2="194" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="846" y="222" font-size="15" fill="#374151" text-anchor="end">시간</text>

  <!-- 창 경계 -->
  <text x="312" y="224" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">창 전환 → 카운터 0으로 리셋</text>
  <text x="568" y="224" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">창 전환 → 카운터 0으로 리셋</text>
</svg>
