<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">추정 안티패턴과 개선</title>
  <desc id="d">추정을 소수점까지 계산하는 안티패턴과 그 이유, 86,400을 10만으로 반올림해 자릿수 단위로 계산하는 개선안을 나란히 비교하고, URL 단축기 예에서 그 숫자로 내린 판단(쓰기는 단일 RDB, 읽기는 캐시, 11TB는 보관 정책·파티셔닝, 주제는 읽기 확장)을 보여준다.</desc>
  <rect width="880" height="640" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 안티패턴 -->
  <rect x="32" y="24" width="388" height="284" rx="8" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="48" y="40" width="84" height="28" rx="14" fill="#b91c1c"/>
  <text x="90" y="59" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">안티패턴</text>
  <text x="144" y="60" font-size="16" font-weight="bold" fill="#111827">추정을 소수점까지 계산한다</text>

  <rect x="48" y="84" width="356" height="68" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
  <g font-size="15" fill="#111827">
    <text x="62" y="112">"86,400으로 나누면 <tspan font-weight="bold" fill="#b91c1c">115.74 QPS</tspan>이고,</text>
    <text x="62" y="136">피크 계수를 <tspan font-weight="bold" fill="#b91c1c">3.2</tspan>로 잡으면..."</text>
  </g>

  <text x="48" y="184" font-size="15" font-weight="bold" fill="#b91c1c">왜 문제인가</text>
  <g font-size="15" fill="#1f2937">
    <text x="52" y="212">•</text>
    <text x="68" y="212">면접관은 계산 능력을 보는 게 아니다.</text>
    <text x="68" y="234">자릿수가 맞는지만 본다.</text>
    <text x="52" y="264">•</text>
    <text x="68" y="264">정밀하게 계산하려다 5분이 10분이 되고,</text>
    <text x="68" y="286">정작 설계 시간이 사라진다.</text>
  </g>

  <!-- 안티패턴 → 개선 -->
  <line x1="424" y1="118" x2="454" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 개선 -->
  <rect x="460" y="24" width="388" height="284" rx="8" fill="#f0fdf6" stroke="#047857" stroke-width="1.5"/>
  <rect x="476" y="40" width="58" height="28" rx="14" fill="#047857"/>
  <text x="505" y="59" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">개선</text>

  <rect x="476" y="84" width="356" height="68" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1"/>
  <g font-size="15" fill="#111827">
    <text x="490" y="112"><tspan font-weight="bold" fill="#047857">86,400 → 10만</tspan>으로 반올림하고</text>
    <text x="490" y="136">계산은 전부 자릿수 단위로.</text>
  </g>

  <g font-size="15" fill="#1f2937">
    <text x="476" y="184">"<tspan font-weight="bold" fill="#047857">대략 100 QPS</tspan>, 피크 잡아서</text>
    <text x="476" y="206"><tspan font-weight="bold" fill="#047857">수백 QPS 수준</tspan>"이면 충분하다.</text>
  </g>

  <rect x="476" y="226" width="356" height="66" rx="6" fill="#d1fae5"/>
  <g font-size="15" font-weight="bold" fill="#065f46">
    <text x="490" y="253">대신 그 숫자로 무엇을 판단했는지를</text>
    <text x="490" y="277">반드시 말한다.</text>
  </g>

  <!-- 개선 → 판단 예 -->
  <line x1="654" y1="310" x2="654" y2="337" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 판단 예 -->
  <rect x="32" y="340" width="816" height="276" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
  <text x="48" y="370" font-size="16" font-weight="bold" fill="#111827">예: URL 단축기에서 그 숫자로 내린 판단</text>

  <rect x="48" y="388" width="240" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="48" y="440" width="240" height="42" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="48" y="492" width="240" height="42" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <g font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="168" y="414">피크 수백 QPS의 쓰기</text>
    <text x="168" y="466">피크 수만 QPS의 읽기</text>
    <text x="168" y="518">5년 11TB</text>
  </g>

  <g stroke="#374151" stroke-width="1.5">
    <line x1="296" y1="409" x2="330" y2="409" marker-end="url(#arr)"/>
    <line x1="296" y1="461" x2="330" y2="461" marker-end="url(#arr)"/>
    <line x1="296" y1="513" x2="330" y2="513" marker-end="url(#arr)"/>
  </g>

  <g font-size="15" fill="#1f2937">
    <text x="344" y="414"><tspan font-weight="bold" fill="#111827">단일 RDB로 충분하다.</tspan> 여기서 샤딩을 꺼내면 과잉 설계다</text>
    <text x="344" y="466"><tspan font-weight="bold" fill="#111827">DB 단독으로는 부담이다.</tspan> 캐시가 이 설계의 중심이 된다</text>
    <text x="344" y="518">단일 인스턴스에 부담이므로 <tspan font-weight="bold" fill="#111827">보관 정책이나 파티셔닝</tspan>을 논의해야 한다</text>
  </g>

  <rect x="48" y="552" width="784" height="48" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <text x="440" y="582" font-size="16" fill="#111827" text-anchor="middle">즉 이 문제의 진짜 주제는 "짧은 코드 생성 방식"이 아니라 <tspan font-weight="bold" fill="#1d4ed8">읽기 확장</tspan>이다</text>
</svg>
