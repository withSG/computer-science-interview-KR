<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실제 계산: URL 단축기 및 안티패턴 비교</title>
  <desc id="d">시스템 디자인 인터뷰에서의 URL 단축기 계산 예시와 추정 계산 안티패턴을 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="780" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Section 1: Anti-pattern vs Improvement -->
  <rect x="24" y="24" width="832" height="236" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="6"/>
  <text x="44" y="52" font-size="16" font-weight="bold" fill="#dc2626">안티패턴: 추정을 소수점까지 계산한다</text>
  
  <rect x="44" y="68" width="792" height="36" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="56" y="91" font-size="13" fill="#dc2626">"86,400으로 나누면 115.74 QPS이고, 피크 계수를 3.2로 잡으면..."</text>

  <text x="44" y="128" font-size="14" font-weight="bold" fill="#1f2933">왜 문제인가:</text>
  <text x="60" y="149" font-size="13" fill="#52606d">• 면접관은 계산 능력을 보는 게 아니다. 자릿수가 맞는지만 본다.</text>
  <text x="60" y="169" font-size="13" fill="#52606d">• 정밀하게 계산하려다 5분이 10분이 되고, 정작 설계 시간이 사라진다.</text>

  <rect x="44" y="185" width="792" height="63" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="56" y="206" font-size="14" font-weight="bold" fill="#059669">개선:</text>
  <text x="100" y="206" font-size="13" fill="#1f2933">86,400 → 10만으로 반올림하고 계산은 전부 자릿수 단위로.</text>
  <text x="56" y="224" font-size="13" fill="#1f2933">"대략 100 QPS, 피크 잡아서 수백 QPS 수준"이면 충분하다.</text>
  <text x="56" y="240" font-size="13" fill="#1f2933">대신 그 숫자로 무엇을 판단했는지를 반드시 말한다.</text>

  <!-- Section 2: Main Scenario Title & Premise -->
  <rect x="24" y="280" width="832" height="476" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="6"/>
  <text x="44" y="310" font-size="16" font-weight="bold" fill="#1f2933">### 실제 계산: URL 단축기</text>
  
  <rect x="44" y="324" width="792" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="56" y="346" font-size="13" font-weight="bold" fill="#2563eb">전제:</text>
  <text x="100" y="346" font-size="13" fill="#1f2933">하루 신규 URL 1,000만 개, 읽기:쓰기 = 100:1, 데이터 5년 보관</text>

  <!-- Left Side: Calculation Boxes -->
  <!-- [쓰기 QPS] -->
  <rect x="44" y="372" width="380" height="76" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="56" y="393" font-size="14" font-weight="bold" fill="#1f2933">[쓰기 QPS]</text>
  <text x="70" y="413" font-size="13" fill="#1f2933">1,000만 / 10만 초 = 100 QPS</text>
  <text x="70" y="433" font-size="13" fill="#52606d">피크는 평균의 2~5배로 잡는다 → 200~500 QPS</text>

  <!-- [읽기 QPS] -->
  <rect x="44" y="458" width="380" height="56" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="56" y="479" font-size="14" font-weight="bold" fill="#1f2933">[읽기 QPS]</text>
  <text x="70" y="499" font-size="13" fill="#1f2933">100 × 100 = 10,000 QPS (피크 2만~5만)</text>

  <!-- [저장량] -->
  <rect x="44" y="524" width="380" height="118" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="56" y="545" font-size="14" font-weight="bold" fill="#1f2933">[저장량]</text>
  <text x="70" y="565" font-size="11.5" fill="#52606d">레코드 하나 ≈ short_code(8B) + long_url(~500B) + 메타(~100B) ≈ 600B</text>
  <text x="70" y="585" font-size="13" fill="#1f2933">하루   1,000만 × 600B  = 6GB</text>
  <text x="70" y="605" font-size="13" fill="#1f2933">1년    6GB × 365      ≈ 2.2TB</text>
  <text x="70" y="625" font-size="13" fill="#1f2933">5년                   ≈ 11TB</text>

  <!-- [대역폭] -->
  <rect x="44" y="652" width="380" height="84" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="56" y="673" font-size="14" font-weight="bold" fill="#1f2933">[대역폭]</text>
  <text x="70" y="693" font-size="13" fill="#1f2933">읽기 10,000 QPS × 600B ≈ 6MB/s</text>
  <text x="70" y="713" font-size="11.5" fill="#52606d">(리다이렉트라 응답 자체는 더 작다)</text>

  <!-- Connecting Lines / Arrows -->
  <path d="M424,410 L456,410" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M424,486 L456,486" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M424,583 L456,583" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Right Side: Judgments / Deductions -->
  <rect x="456" y="372" width="380" height="364" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="472" y="396" font-size="14" font-weight="bold" fill="#1f2933">이 숫자에서 곧바로 나오는 판단들</text>

  <!-- Judgment 1 -->
  <rect x="472" y="412" width="348" height="64" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="484" y="433" font-size="13" fill="#1f2933">• 피크 수백 QPS의 쓰기는 <tspan font-weight="bold" fill="#059669">단일 RDB로 충분하다.</tspan></text>
  <text x="496" y="453" font-size="13" fill="#52606d">여기서 샤딩을 꺼내면 과잉 설계다</text>

  <!-- Judgment 2 -->
  <rect x="472" y="488" width="348" height="64" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="484" y="509" font-size="13" fill="#1f2933">• 피크 수만 QPS의 읽기는 <tspan font-weight="bold" fill="#2563eb">DB 단독으로는 부담이다.</tspan></text>
  <text x="496" y="529" font-size="13" fill="#52606d">캐시가 이 설계의 중심이 된다</text>

  <!-- Judgment 3 -->
  <rect x="472" y="564" width="348" height="64" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="4"/>
  <text x="484" y="585" font-size="13" fill="#1f2933">• 5년 11TB는 단일 인스턴스에 부담이므로</text>
  <text x="496" y="605" font-size="13" font-weight="bold" fill="#d97706">보관 정책이나 파티셔닝<tspan font-weight="normal" fill="#52606d">을 논의해야 한다</tspan></text>

  <!-- Conclusion -->
  <rect x="472" y="640" width="348" height="80" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="4"/>
  <text x="484" y="663" font-size="13" fill="#1f2933">• 즉 이 문제의 진짜 주제는</text>
  <text x="496" y="683" font-size="13" fill="#52606d">"짧은 코드 생성 방식"이 아니라</text>
  <text x="496" y="703" font-size="14" font-weight="bold" fill="#7c3aed">읽기 확장<tspan font-weight="normal" fill="#1f2933">이다</tspan></text>
</svg>