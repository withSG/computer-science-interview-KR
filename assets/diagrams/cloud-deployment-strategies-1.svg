<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1. 왜 필요한가 — "새벽 2시 점검"의 진짜 비용</title>
  <desc id="d">다운타임이 필요한 배포로 인해 발생하는 배포의 악순환을 보여주는 순서도 다이어그램입니다.</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="570" fill="#ffffff"/>
  
  <rect x="250" y="30" width="380" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="60.05" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">다운타임이 필요한 배포</text>

  <path d="M440,80 L440,110" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="180" y="110" width="520" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="140.05" fill="#1f2933" font-size="13" text-anchor="middle">배포를 자주 못 한다 (점검 공지, 새벽 대기조 필요)</text>

  <path d="M440,160 L440,190" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="220" y="190" width="440" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="220.05" fill="#1f2933" font-size="13" text-anchor="middle">한 번 배포할 때 변경이 많이 쌓인다</text>

  <path d="M440,240 L440,270" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="130" y="270" width="620" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="300.05" fill="#1f2933" font-size="13" text-anchor="middle">터졌을 때 원인 후보가 수십 개다 → 복구가 오래 걸린다</text>

  <path d="M440,320 L440,350" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="230" y="350" width="420" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="380.05" fill="#1f2933" font-size="13" text-anchor="middle">배포가 더 무서워진다 → 더 미룬다</text>

  <path d="M440,400 L440,430" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="380" y="430" width="120" height="36" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="452.55" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">(악순환)</text>

  <path d="M380,448 C 60,448 60,55 240,55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
</svg>