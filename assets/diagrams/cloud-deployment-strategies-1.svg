<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">다운타임 배포의 악순환</title>
  <desc id="d">다운타임이 필요한 배포에서 출발해, 배포를 자주 못 함 → 변경이 많이 쌓임 → 원인 후보가 많아 복구가 오래 걸림 → 배포가 더 무서워져 더 미룸이 다시 첫 단계로 돌아가는 악순환을 보여 줍니다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- 출발점 -->
  <rect x="48" y="24" width="320" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="208" y="58" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">다운타임이 필요한 배포</text>
  <path d="M208,80 L208,124" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- ① 왼쪽 위 -->
  <rect x="48" y="128" width="320" height="88" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="208" y="164" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">① 배포를 자주 못 한다</text>
  <text x="208" y="192" font-size="15" fill="#374151" text-anchor="middle">(점검 공지, 새벽 대기조 필요)</text>

  <!-- ② 오른쪽 위 -->
  <rect x="512" y="128" width="320" height="88" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="672" y="164" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">② 한 번 배포할 때</text>
  <text x="672" y="192" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">변경이 많이 쌓인다</text>

  <!-- ③ 오른쪽 아래 -->
  <rect x="512" y="300" width="320" height="88" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="672" y="336" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">③ 터졌을 때 원인 후보가 수십 개다</text>
  <text x="672" y="364" font-size="16" fill="#b91c1c" text-anchor="middle">→ 복구가 오래 걸린다</text>

  <!-- ④ 왼쪽 아래 -->
  <rect x="48" y="300" width="320" height="88" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="208" y="336" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">④ 배포가 더 무서워진다</text>
  <text x="208" y="364" font-size="16" fill="#b91c1c" text-anchor="middle">→ 더 미룬다</text>

  <!-- 순환 화살표 -->
  <path d="M368,172 L508,172" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M672,216 L672,296" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M512,344 L372,344" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M208,300 L208,220" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- 가운데 -->
  <rect x="384" y="236" width="112" height="46" rx="23" fill="#b91c1c"/>
  <text x="440" y="266" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">악순환</text>
</svg>
