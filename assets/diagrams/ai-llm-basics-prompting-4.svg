<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Chain-of-Thought — 중간 계산을 출력하게 만든다</title>
  <desc id="d">안티패턴과 개선 방법을 비교하는 다이어그램. 안티패턴은 즉시 답을 요구하여 검산이 불가능하고, 개선안은 단계별 계산 과정을 출력하도록 유도합니다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 안티패턴 그룹 영역 -->
  <rect x="24" y="24" width="832" height="146" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="40" y="12" width="90" height="24" rx="4" fill="#dc2626"/>
  <text x="85" y="28.6" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">안티패턴:</text>

  <!-- 안티패턴 내용 -->
  <!-- 프롬프트 박스 -->
  <rect x="44" y="48" width="792" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="60" y="72.6" fill="#1f2933" font-size="13">"주문 3건의 총액과 부가세를 계산해서 숫자만 답하세요."</text>

  <!-- 화살표 및 설명 -->
  <text x="44" y="118.6" fill="#dc2626" font-size="14" font-weight="bold">→</text>
  <text x="64" y="118.6" fill="#dc2626" font-size="13">중간 단계 없이 그럴듯한 숫자가 나온다. 검산 불가능.</text>


  <!-- 개선 그룹 영역 -->
  <rect x="24" y="194" width="832" height="152" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="182" width="60" height="24" rx="4" fill="#059669"/>
  <text x="70" y="198.6" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">개선:</text>

  <!-- 개선 내용 -->
  <!-- 프롬프트 박스 -->
  <rect x="44" y="218" width="792" height="60" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="60" y="242.6" fill="#1f2933" font-size="13">"먼저 각 주문의 금액을 나열하고, 합계를 구한 뒤, 부가세 10%를 계산하세요.</text>
  <text x="73" y="262.6" fill="#1f2933" font-size="13">마지막 줄에 '최종: &lt;숫자&gt;' 형식으로 답하세요."</text>

  <!-- 화살표 및 설명 -->
  <text x="44" y="308.6" fill="#059669" font-size="14" font-weight="bold">→</text>
  <text x="64" y="308.6" fill="#059669" font-size="13">중간 값이 출력되므로 사람이 어디서 틀렸는지 볼 수 있다.</text>
</svg>