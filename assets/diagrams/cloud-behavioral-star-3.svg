<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">STAR 네 요소의 답변 시간 배분</title>
  <desc id="d">2분 내외 답변을 말하는 순서대로 나눈 막대 그림. Situation과 Task가 각각 약 10%(~15초), Action이 약 60%(~70초), Result가 약 20%(~25초)를 차지한다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 열 머리 -->
  <text x="28" y="46" font-size="15" fill="#4b5563">요소</text>
  <text x="196" y="46" font-size="15" fill="#4b5563">답변 시간 배분 (말하는 순서 →)</text>

  <!-- 행 음영 -->
  <rect x="24" y="64" width="832" height="64" fill="#f8fafc"/>
  <rect x="24" y="192" width="832" height="64" fill="#f8fafc"/>

  <!-- 요소 사이 이어지는 경계 -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="246" y1="112" x2="246" y2="144"/>
    <line x1="296" y1="176" x2="296" y2="208"/>
    <line x1="596" y1="240" x2="596" y2="272"/>
  </g>

  <!-- S -->
  <rect x="28" y="78" width="34" height="36" rx="6" fill="#64748b"/>
  <text x="45" y="103" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="74" y="92" font-size="17" font-weight="700" fill="#111827">Situation</text>
  <text x="74" y="114" font-size="15" fill="#4b5563">상황</text>
  <rect x="196" y="82" width="50" height="28" rx="4" fill="#64748b"/>
  <text x="258" y="102" font-size="17" font-weight="700" fill="#111827">약 10%<tspan dx="8" font-size="15" font-weight="400" fill="#4b5563">(~15초)</tspan></text>

  <!-- T -->
  <rect x="28" y="142" width="34" height="36" rx="6" fill="#0e7490"/>
  <text x="45" y="167" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
  <text x="74" y="156" font-size="17" font-weight="700" fill="#111827">Task</text>
  <text x="74" y="178" font-size="15" fill="#4b5563">과제</text>
  <rect x="246" y="146" width="50" height="28" rx="4" fill="#0e7490"/>
  <text x="308" y="166" font-size="17" font-weight="700" fill="#111827">약 10%<tspan dx="8" font-size="15" font-weight="400" fill="#4b5563">(~15초)</tspan></text>

  <!-- A -->
  <rect x="28" y="206" width="34" height="36" rx="6" fill="#1d4ed8"/>
  <text x="45" y="231" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="74" y="220" font-size="17" font-weight="700" fill="#111827">Action</text>
  <text x="74" y="242" font-size="15" fill="#4b5563">행동</text>
  <rect x="296" y="210" width="300" height="28" rx="4" fill="#1d4ed8"/>
  <text x="608" y="230" font-size="17" font-weight="700" fill="#1d4ed8">약 60%<tspan dx="8" font-size="15" font-weight="400" fill="#4b5563">(~70초)</tspan></text>

  <!-- R -->
  <rect x="28" y="270" width="34" height="36" rx="6" fill="#047857"/>
  <text x="45" y="295" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
  <text x="74" y="284" font-size="17" font-weight="700" fill="#111827">Result</text>
  <text x="74" y="306" font-size="15" fill="#4b5563">결과</text>
  <rect x="596" y="274" width="100" height="28" rx="4" fill="#047857"/>
  <text x="708" y="294" font-size="17" font-weight="700" fill="#111827">약 20%<tspan dx="8" font-size="15" font-weight="400" fill="#4b5563">(~25초)</tspan></text>

  <!-- 전체 목표 괄호 -->
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="196" y1="334" x2="696" y2="334"/>
    <line x1="196" y1="326" x2="196" y2="334"/>
    <line x1="696" y1="326" x2="696" y2="334"/>
  </g>
  <text x="446" y="360" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">전체 목표 = 2분 내외</text>
</svg>
