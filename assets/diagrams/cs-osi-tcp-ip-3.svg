<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">홉마다 바뀌는 것, 안 바뀌는 것</title>
  <desc id="d">L2 MAC 주소는 홉마다 변경되고 L3 IP 주소는 종단 간에 유지됨을 보여주는 네트워크 경로 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 상단 장치 노드 구조 -->
  <!-- [내 PC] -->
  <rect x="40" y="30" width="120" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="54" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[내 PC]</text>
  <text x="100" y="90" font-size="12" fill="#52606d" text-anchor="middle">MAC:AA</text>
  <text x="100" y="108" font-size="12" fill="#2563eb" text-anchor="middle">IP:192.0.2.10</text>

  <!-- 연결선 1 -->
  <path d="M160,50 L250,50" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- [공유기] -->
  <rect x="250" y="30" width="120" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="310" y="54" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[공유기]</text>
  <text x="310" y="90" font-size="12" fill="#52606d" text-anchor="middle">MAC:BB</text>

  <!-- 연결선 2 -->
  <path d="M370,50 L460,50" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- [ISP 라우터] -->
  <rect x="460" y="30" width="130" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="525" y="54" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[ISP 라우터]</text>
  <text x="525" y="90" font-size="12" fill="#52606d" text-anchor="middle">MAC:CC</text>

  <!-- 생략선 -->
  <path d="M590,50 L640,50" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="665" y="54" font-size="14" fill="#52606d" text-anchor="middle">...</text>
  <path d="M690,50 L720,50" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- [서버] -->
  <rect x="720" y="30" width="120" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="780" y="54" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[서버]</text>
  <text x="780" y="90" font-size="12" fill="#52606d" text-anchor="middle">MAC:ZZ</text>
  <text x="780" y="108" font-size="12" fill="#2563eb" text-anchor="middle">IP:203.0.113.5</text>

  <!-- 구분선 -->
  <path d="M40,135 L840,135" stroke="#cbd2d9" stroke-width="1" fill="none"/>

  <!-- 구간 패킷 정보 표기 -->
  <!-- 구간 1 -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="790" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="15" y="22" font-size="13" font-weight="bold" fill="#d97706">구간 1:</text>
    <text x="75" y="22" font-size="13" fill="#1f2933">출발MAC=AA, 도착MAC=BB</text>
    <line x1="320" y1="6" x2="320" y2="30" stroke="#cbd2d9" stroke-width="1"/>
    <text x="335" y="22" font-size="13" fill="#2563eb">출발IP=192.0.2.10, 도착IP=203.0.113.5</text>
  </g>

  <!-- 구간 2 -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="790" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="15" y="22" font-size="13" font-weight="bold" fill="#d97706">구간 2:</text>
    <text x="75" y="22" font-size="13" fill="#1f2933">출발MAC=BB, 도착MAC=CC</text>
    <line x1="320" y1="6" x2="320" y2="30" stroke="#cbd2d9" stroke-width="1"/>
    <text x="335" y="22" font-size="13" fill="#2563eb">출발IP=192.0.2.10, 도착IP=203.0.113.5</text>
  </g>

  <!-- 구간 N -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="790" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="15" y="22" font-size="13" font-weight="bold" fill="#d97706">구간 N:</text>
    <text x="75" y="22" font-size="13" fill="#1f2933">출발MAC=YY, 도착MAC=ZZ</text>
    <line x1="320" y1="6" x2="320" y2="30" stroke="#cbd2d9" stroke-width="1"/>
    <text x="335" y="22" font-size="13" fill="#2563eb">출발IP=192.0.2.10, 도착IP=203.0.113.5</text>
  </g>

  <!-- 하단 괄호 및 설명 라벨 -->
  <!-- 홉마다 새로 씀 (MAC 범위: x=115 ~ x=330) -->
  <path d="M115,306 L115,316 L222.5,316 L222.5,324 L222.5,316 L330,316 L330,306" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <rect x="150" y="330" width="145" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="222.5" y="347" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">홉마다 새로 씀</text>

  <!-- 끝까지 그대로 (IP 범위: x=375 ~ x=770) -->
  <path d="M375,306 L375,316 L572.5,316 L572.5,324 L572.5,316 L770,316 L770,306" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <rect x="500" y="330" width="145" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="572.5" y="347" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">끝까지 그대로</text>
</svg>