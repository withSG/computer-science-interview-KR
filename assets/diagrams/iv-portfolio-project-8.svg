<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커밋 히스토리 A와 B 비교</title>
  <desc id="d">update, final_real 같은 메시지만 남은 히스토리 A는 정보를 담지 않고, feat·fix·refactor·test·docs 단위로 나뉜 히스토리 B는 무엇을 왜 했는지 읽히고 리뷰가 가능하다는 비교.</desc>
  <defs>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 히스토리 A -->
  <rect x="24" y="24" width="404" height="382" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="58" font-size="18" font-weight="bold" fill="#1f2933">히스토리 A</text>
  <line x1="60" y1="100" x2="60" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="60" cy="100" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="60" cy="136" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="60" cy="172" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="60" cy="208" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="60" cy="244" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="60" cy="280" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" fill="#1f2933">
    <text x="82" y="105">update</text>
    <text x="82" y="141">update2</text>
    <text x="82" y="177">final</text>
    <text x="82" y="213">final_real</text>
    <text x="82" y="249">수정</text>
    <text x="82" y="285">커밋</text>
  </g>
  <line x1="60" y1="290" x2="60" y2="320" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahr)"/>
  <rect x="40" y="326" width="372" height="64" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="226" y="364" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">히스토리가 정보를 담지 않는다</text>

  <!-- 히스토리 B -->
  <rect x="452" y="24" width="404" height="382" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="472" y="58" font-size="18" font-weight="bold" fill="#1f2933">히스토리 B</text>
  <line x1="488" y1="100" x2="488" y2="244" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="488" cy="100" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="488" cy="136" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="488" cy="172" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="488" cy="208" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <circle cx="488" cy="244" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#1f2933">
    <text x="508" y="105"><tspan font-weight="bold">feat:</tspan> 장바구니 수량 변경 기능 추가</text>
    <text x="508" y="141"><tspan font-weight="bold">fix:</tspan> 수량 0일 때 삭제되지 않던 문제 수정</text>
    <text x="508" y="177"><tspan font-weight="bold">refactor:</tspan> 장바구니 계산 로직 훅으로 분리</text>
    <text x="508" y="213"><tspan font-weight="bold">test:</tspan> 장바구니 합계 계산 테스트 추가</text>
    <text x="508" y="249"><tspan font-weight="bold">docs:</tspan> 실행 방법 README에 추가</text>
  </g>
  <line x1="488" y1="254" x2="488" y2="320" stroke="#047857" stroke-width="2" marker-end="url(#ahg)"/>
  <rect x="468" y="326" width="372" height="64" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="654" y="352" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">무엇을 왜 했는지 읽힌다</text>
  <text x="654" y="376" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">단위가 쪼개져 있어 리뷰가 가능하다</text>
</svg>
