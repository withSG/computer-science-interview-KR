<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커밋 히스토리가 드러내는 것</title>
  <desc id="d">히스토리 A(나쁜 예)와 히스토리 B(좋은 예)의 커밋 로그와 각각의 특징을 비교하는 다이어그램</desc>
  
  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 히스토리 A 영역 (빨강 계열) -->
  <rect x="30" y="30" width="395" height="330" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  
  <!-- 히스토리 A 제목 -->
  <text x="50" y="65" font-size="16" font-weight="bold" fill="#dc2626">[히스토리 A]</text>
  
  <!-- 히스토리 A 커밋 목록 -->
  <circle cx="65" cy="100" r="4" fill="#dc2626"/>
  <text x="80" y="104" font-size="13" fill="#1f2933">update</text>

  <circle cx="65" cy="130" r="4" fill="#dc2626"/>
  <text x="80" y="134" font-size="13" fill="#1f2933">update2</text>

  <circle cx="65" cy="160" r="4" fill="#dc2626"/>
  <text x="80" y="164" font-size="13" fill="#1f2933">final</text>

  <circle cx="65" cy="190" r="4" fill="#dc2626"/>
  <text x="80" y="194" font-size="13" fill="#1f2933">final_real</text>

  <circle cx="65" cy="220" r="4" fill="#dc2626"/>
  <text x="80" y="224" font-size="13" fill="#1f2933">수정</text>

  <circle cx="65" cy="250" r="4" fill="#dc2626"/>
  <text x="80" y="254" font-size="13" fill="#1f2933">커밋</text>

  <!-- 히스토리 A 연결선 및 특징 설명 -->
  <path d="M 50,285 L 50,305 L 65,305" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="75" y="309" font-size="13" font-weight="bold" fill="#dc2626">히스토리가 정보를 담지 않는다</text>


  <!-- 히스토리 B 영역 (초록 계열) -->
  <rect x="455" y="30" width="395" height="330" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  
  <!-- 히스토리 B 제목 -->
  <text x="475" y="65" font-size="16" font-weight="bold" fill="#059669">[히스토리 B]</text>

  <!-- 히스토리 B 커밋 목록 -->
  <circle cx="490" cy="100" r="4" fill="#059669"/>
  <text x="505" y="104" font-size="13" fill="#1f2933">feat: 장바구니 수량 변경 기능 추가</text>

  <circle cx="490" cy="130" r="4" fill="#059669"/>
  <text x="505" y="134" font-size="13" fill="#1f2933">fix: 수량 0일 때 삭제되지 않던 문제 수정</text>

  <circle cx="490" cy="160" r="4" fill="#059669"/>
  <text x="505" y="164" font-size="13" fill="#1f2933">refactor: 장바구니 계산 로직 훅으로 분리</text>

  <circle cx="490" cy="190" r="4" fill="#059669"/>
  <text x="505" y="194" font-size="13" fill="#1f2933">test: 장바구니 합계 계산 테스트 추가</text>

  <circle cx="490" cy="220" r="4" fill="#059669"/>
  <text x="505" y="224" font-size="13" fill="#1f2933">docs: 실행 방법 README에 추가</text>

  <!-- 히스토리 B 연결선 및 특징 설명 -->
  <path d="M 475,255 L 475,285 L 490,285" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="289" font-size="13" font-weight="bold" fill="#059669">무엇을 왜 했는지 읽힌다</text>
  <text x="500" y="314" font-size="13" font-weight="bold" fill="#059669">단위가 쪼개져 있어 리뷰가 가능하다</text>

</svg>