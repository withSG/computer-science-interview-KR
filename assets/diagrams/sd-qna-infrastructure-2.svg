<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">L4 vs L7 비교</title>
  <desc id="d">L4 Transport Layer와 L7 Application Layer의 특징 및 라우팅 방식 비교 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Legend -->
  <rect x="580" y="24" width="12" height="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="2"/>
  <text x="600" y="34.2" font-size="12" fill="#52606d">L4 (전송 계층)</text>
  <rect x="710" y="24" width="12" height="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="2"/>
  <text x="730" y="34.2" font-size="12" fill="#52606d">L7 (응용 계층)</text>

  <!-- Title -->
  <text x="40" y="35.6" font-size="16" font-weight="bold" fill="#1f2933">L4 vs L7 비교</text>

  <!-- Card 1: L4 -->
  <g transform="translate(40, 60)">
    <!-- Main Box -->
    <rect x="0" y="0" width="380" height="400" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
    
    <!-- Header Box -->
    <rect x="0" y="0" width="380" height="54" fill="#2563eb" rx="8"/>
    <!-- Overwrite bottom rounded corners of header -->
    <rect x="0" y="44" width="380" height="10" fill="#2563eb"/>
    <text x="190" y="32.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L4 (Transport Layer)</text>

    <!-- Content Items -->
    <!-- Bullet 1 -->
    <circle cx="32" cy="90" r="4" fill="#2563eb"/>
    <text x="48" y="94.2" font-size="14" fill="#1f2933">- TCP/UDP 기반</text>

    <!-- Bullet 2 -->
    <circle cx="32" cy="140" r="4" fill="#2563eb"/>
    <text x="48" y="144.2" font-size="14" fill="#1f2933">- IP:Port로 라우팅</text>

    <!-- Bullet 3 -->
    <circle cx="32" cy="190" r="4" fill="#2563eb"/>
    <text x="48" y="194.2" font-size="14" fill="#1f2933">- 패킷 내용 확인 안 함</text>

    <!-- Bullet 4 -->
    <circle cx="32" cy="240" r="4" fill="#2563eb"/>
    <text x="48" y="244.2" font-size="14" fill="#1f2933">- 빠른 성능</text>
  </g>

  <!-- Card 2: L7 -->
  <g transform="translate(460, 60)">
    <!-- Main Box -->
    <rect x="0" y="0" width="380" height="400" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
    
    <!-- Header Box -->
    <rect x="0" y="0" width="380" height="54" fill="#7c3aed" rx="8"/>
    <!-- Overwrite bottom rounded corners of header -->
    <rect x="0" y="44" width="380" height="10" fill="#7c3aed"/>
    <text x="190" y="32.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L7 (Application Layer)</text>

    <!-- Content Items -->
    <!-- Bullet 1 -->
    <circle cx="32" cy="85" r="4" fill="#7c3aed"/>
    <text x="48" y="89.2" font-size="14" fill="#1f2933">- HTTP 기반</text>

    <!-- Bullet 2 -->
    <circle cx="32" cy="130" r="4" fill="#7c3aed"/>
    <text x="48" y="134.2" font-size="14" fill="#1f2933">- URL, Header, Cookie로 라우팅</text>

    <!-- Bullet 3 -->
    <circle cx="32" cy="180" r="4" fill="#7c3aed"/>
    <text x="48" y="184.2" font-size="14" fill="#1f2933">- /api/* → API 서버</text>

    <!-- Bullet 4 -->
    <circle cx="32" cy="225" r="4" fill="#7c3aed"/>
    <text x="48" y="229.2" font-size="14" fill="#1f2933">- /static/* → 정적 서버</text>

    <!-- Bullet 5 -->
    <circle cx="32" cy="270" r="4" fill="#7c3aed"/>
    <text x="48" y="274.2" font-size="14" fill="#1f2933">- 더 많은 리소스 사용</text>
  </g>
</svg>