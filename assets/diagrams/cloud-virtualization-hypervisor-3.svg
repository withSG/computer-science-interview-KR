<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Type 1: Bare-metal Hypervisor</title>
  <desc id="d">VM 1, VM 2, VM 3이 하위의 Type 1 Hypervisor(ESXi, Hyper-V, KVM, Xen) 연결되고, 그것이 최하위의 Hardware 연결되는 구조를 나타낸 아키텍처 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- VM 1 -->
  <rect x="80" y="30" width="180" height="50" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="60.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">VM 1</text>

  <!-- VM 2 -->
  <rect x="350" y="30" width="180" height="50" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="60.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">VM 2</text>

  <!-- VM 3 -->
  <rect x="620" y="30" width="180" height="50" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="710" y="60.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">VM 3</text>

  <!-- Connectors from VMs to Hypervisor -->
  <path d="M170,80 L170,140" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M440,80 L440,140" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M710,80 L710,140" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Type 1 Hypervisor -->
  <rect x="80" y="140" width="720" height="80" rx="4" ry="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="173.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Type 1 Hypervisor</text>
  <text x="440" y="198.025" font-size="11.5" fill="#52606d" text-anchor="middle">(ESXi, Hyper-V, KVM, Xen)</text>

  <!-- Connector from Hypervisor to Hardware -->
  <path d="M440,220 L440,260" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Hardware -->
  <rect x="80" y="260" width="720" height="50" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="290.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Hardware</text>
</svg>