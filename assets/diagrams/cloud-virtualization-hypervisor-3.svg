<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Type 1 하이퍼바이저 구조</title>
  <desc id="d">VM 1, VM 2, VM 3이 Type 1 Hypervisor(ESXi, Hyper-V, KVM, Xen) 위에서 돌고, 하이퍼바이저는 호스트 OS 없이 Hardware 위에 직접 설치된다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>

  <!-- VM -->
  <rect x="40" y="24" width="240" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="60" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VM 1</text>
  <rect x="320" y="24" width="240" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="60" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VM 2</text>
  <rect x="600" y="24" width="240" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="720" y="60" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VM 3</text>

  <!-- VM → 하이퍼바이저 연결 -->
  <path d="M160,84 L160,124 M440,84 L440,124 M720,84 L720,124" stroke="#6b7280" stroke-width="2" fill="none"/>

  <!-- Type 1 Hypervisor -->
  <rect x="40" y="124" width="800" height="92" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="162" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">Type 1 Hypervisor</text>
  <text x="440" y="194" font-size="16" fill="#1f2937" text-anchor="middle">(ESXi, Hyper-V, KVM, Xen)</text>

  <!-- 하이퍼바이저 → 하드웨어 (사이에 호스트 OS 없음) -->
  <path d="M440,216 L440,268" stroke="#6b7280" stroke-width="2" fill="none"/>
  <text x="456" y="248" font-size="15" fill="#065f46">하드웨어 위에 직접 설치 · 호스트 OS 불필요</text>

  <!-- Hardware -->
  <rect x="40" y="268" width="800" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="302" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Hardware</text>
</svg>
