<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">아이디어: 손실 함수에 벌금을 붙인다</title>
  <desc id="d">손실 함수의 수식 구조와 람다 값에 따른 과소적합 및 과적합 위험을 나타낸 규제(Regularization) 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Main Title Container -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="832" height="50" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="416" y="31" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">
      손실 = 원래 손실(데이터 적합도) + λ · 페널티(모델 복잡도)
    </text>
  </g>

  <!-- Formula Boxes Block (L1 / L2) -->
  <g transform="translate(24, 94)">
    <!-- L1 (Lasso) Box -->
    <rect x="0" y="0" width="404" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="202" y="41" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">
      L1(Lasso): 손실 + λ · Σ|wᵢ|
    </text>

    <!-- L2 (Ridge) Box -->
    <rect x="428" y="0" width="404" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="630" y="41" font-size="15" font-weight="bold" fill="#7c3aed" text-anchor="middle">
      L2(Ridge): 손실 + λ · Σwᵢ²
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="188" x2="856" y2="188" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Lambda Effect Section Title -->
  <text x="440" y="222" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">
    λ (하이퍼파라미터) 크기에 따른 영향
  </text>

  <!-- Row 1: Large Lambda (Underfitting Risk) -->
  <g transform="translate(24, 246)">
    <!-- Label Badge -->
    <rect x="0" y="0" width="100" height="110" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="50" y="60" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">λ 가 크면</text>

    <!-- Flow Arrow 1 -->
    <path d="M100,55 L124,55" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
    <polygon points="124,50 132,55 124,60" fill="#9aa5b1"/>

    <!-- Process Box 1 -->
    <rect x="132" y="15" width="180" height="80" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="222" y="60" font-size="13" fill="#1f2933" text-anchor="middle">페널티가 지배</text>

    <!-- Flow Arrow 2 -->
    <path d="M312,55 L336,55" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
    <polygon points="336,50 344,55 336,60" fill="#9aa5b1"/>

    <!-- Process Box 2 -->
    <rect x="344" y="15" width="180" height="80" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="434" y="60" font-size="13" fill="#1f2933" text-anchor="middle">가중치가 눌림</text>

    <!-- Flow Arrow 3 -->
    <path d="M524,55 L548,55" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
    <polygon points="548,50 556,55 548,60" fill="#9aa5b1"/>

    <!-- Result Box (Underfitting Warning) -->
    <rect x="556" y="0" width="276" height="110" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="694" y="60" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">과소적합 위험</text>
  </g>

  <!-- Row 2: Small Lambda (Overfitting Risk) -->
  <g transform="translate(24, 386)">
    <!-- Label Badge -->
    <rect x="0" y="0" width="100" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="50" y="60" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">λ 가 작으면</text>

    <!-- Flow Arrow 1 -->
    <path d="M100,55 L124,55" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
    <polygon points="124,50 132,55 124,60" fill="#9aa5b1"/>

    <!-- Process Box 1 -->
    <rect x="132" y="15" width="180" height="80" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="222" y="60" font-size="13" fill="#1f2933" text-anchor="middle">원래 손실이 지배</text>

    <!-- Flow Arrow 2 -->
    <path d="M312,55 L336,55" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
    <polygon points="336,50 344,55 336,60" fill="#9aa5b1"/>

    <!-- Process Box 2 -->
    <rect x="344" y="15" width="180" height="80" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="434" y="60" font-size="13" fill="#1f2933" text-anchor="middle">규제 효과 없음</text>

    <!-- Flow Arrow 3 -->
    <path d="M524,55 L548,55" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
    <polygon points="548,50 556,55 548,60" fill="#9aa5b1"/>

    <!-- Result Box (Overfitting Warning) -->
    <rect x="556" y="0" width="276" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="694" y="60" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">과적합 위험</text>
  </g>
</svg>