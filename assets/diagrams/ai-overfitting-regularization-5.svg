<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">손실 함수에 페널티를 붙이는 정규화와 λ의 역할</title>
  <desc id="d">손실은 원래 손실(데이터 적합도)에 λ·페널티(모델 복잡도)를 더한 값이고, L1은 Σ|wᵢ|, L2는 Σwᵢ²를 페널티로 쓴다. λ가 크면 페널티가 지배해 가중치가 눌려 과소적합 위험, λ가 작으면 원래 손실이 지배해 규제 효과가 없어 과적합 위험이 있다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 1. 전체 식 -->
  <text x="196" y="76" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">손실</text>
  <text x="239" y="76" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">=</text>
  <rect x="259" y="32" width="180" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="349" y="63" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">원래 손실</text>
  <text x="349" y="89" font-size="15" fill="#1f2937" text-anchor="middle">데이터 적합도</text>
  <text x="459.5" y="76" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">+</text>
  <text x="497" y="76" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">λ ·</text>
  <rect x="526" y="32" width="180" height="72" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="616" y="63" font-size="19" font-weight="bold" fill="#6d28d9" text-anchor="middle">페널티</text>
  <text x="616" y="89" font-size="15" fill="#1f2937" text-anchor="middle">모델 복잡도</text>

  <!-- 2. L1 / L2 -->
  <rect x="174" y="128" width="250" height="90" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="299" y="153" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">L1 (Lasso)</text>
  <text x="299" y="181" font-size="19" fill="#111827" text-anchor="middle">손실 + λ · <tspan font-weight="bold" fill="#6d28d9">Σ|wᵢ|</tspan></text>
  <text x="299" y="206" font-size="15" fill="#4b5563" text-anchor="middle">페널티 = 절댓값 합</text>

  <rect x="456" y="128" width="250" height="90" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="581" y="153" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">L2 (Ridge)</text>
  <text x="581" y="181" font-size="19" fill="#111827" text-anchor="middle">손실 + λ · <tspan font-weight="bold" fill="#6d28d9">Σwᵢ²</tspan></text>
  <text x="581" y="206" font-size="15" fill="#4b5563" text-anchor="middle">페널티 = 제곱 합</text>

  <line x1="32" y1="242" x2="848" y2="242" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- 3. λ 크기에 따라 -->
  <text x="32" y="274" font-size="17" font-weight="bold" fill="#111827">λ 크기에 따라</text>

  <!-- λ 가 크면 -->
  <rect x="32" y="290" width="136" height="68" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="100" y="330" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">λ 가 크면</text>
  <line x1="172" y1="324" x2="218" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="222" y="290" width="172" height="68" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="308" y="330" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">페널티가 지배</text>
  <line x1="398" y1="324" x2="444" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="448" y="290" width="172" height="68" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="534" y="330" font-size="16" fill="#111827" text-anchor="middle">가중치가 눌림</text>
  <line x1="624" y1="324" x2="670" y2="324" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="674" y="290" width="172" height="68" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="760" y="331" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">과소적합 위험</text>

  <!-- λ 가 작으면 -->
  <rect x="32" y="378" width="136" height="68" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="100" y="418" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">λ 가 작으면</text>
  <line x1="172" y1="412" x2="218" y2="412" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="222" y="378" width="172" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="308" y="418" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">원래 손실이 지배</text>
  <line x1="398" y1="412" x2="444" y2="412" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="448" y="378" width="172" height="68" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="534" y="418" font-size="16" fill="#111827" text-anchor="middle">규제 효과 없음</text>
  <line x1="624" y1="412" x2="670" y2="412" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="674" y="378" width="172" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="760" y="419" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">과적합 위험</text>
</svg>
