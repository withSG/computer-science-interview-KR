<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">완화와 원인 규명의 분리</title>
  <desc id="d">장애 발생, 감지, 완화, 복구 확인, 원인 규명, 재발 방지 순서의 흐름입니다. 장애 발생부터 완화까지가 MTTR(사용자가 아팠던 시간)이고, 복구 확인 뒤의 원인 규명과 재발 방지는 시간 압박이 없는 구간입니다.</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="18" font-weight="bold" fill="#111827">개선: 완화(mitigation)와 원인 규명(diagnosis)을 분리한다</text>

  <!-- 경계: 여기부터 시간 압박 없음 -->
  <line x1="572" y1="74" x2="572" y2="226" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 단계 상자 -->
  <rect x="40" y="86" width="104" height="54" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="172" y="86" width="104" height="54" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="304" y="86" width="104" height="54" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <rect x="436" y="86" width="104" height="54" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="604" y="86" width="104" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="736" y="86" width="104" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>

  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="92" y="119" fill="#991b1b">장애 발생</text>
    <text x="224" y="119" fill="#991b1b">감지</text>
    <text x="356" y="119" fill="#991b1b">완화</text>
    <text x="488" y="119" fill="#111827">복구 확인</text>
    <text x="656" y="119" fill="#1e3a8a">원인 규명</text>
    <text x="788" y="119" fill="#1e3a8a">재발 방지</text>
  </g>

  <!-- 흐름 화살표 -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <line x1="146" y1="113" x2="169" y2="113" marker-end="url(#ah)"/>
    <line x1="278" y1="113" x2="301" y2="113" marker-end="url(#ah)"/>
    <line x1="410" y1="113" x2="433" y2="113" marker-end="url(#ah)"/>
    <line x1="542" y1="113" x2="601" y2="113" marker-end="url(#ah)"/>
    <line x1="710" y1="113" x2="733" y2="113" marker-end="url(#ah)"/>
  </g>
  <circle cx="572" cy="113" r="4.5" fill="#374151"/>

  <!-- MTTR 구간 -->
  <path d="M40,152 V162 H408 V152" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <line x1="224" y1="162" x2="224" y2="172" stroke="#b91c1c" stroke-width="2"/>
  <text x="224" y="196" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기까지가 MTTR</text>
  <text x="224" y="218" font-size="15" fill="#4b5563" text-anchor="middle">(사용자가 아팠던 시간)</text>

  <!-- 시간 압박 없는 구간 -->
  <path d="M604,152 V162 H840 V152" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="722" y1="162" x2="722" y2="172" stroke="#1d4ed8" stroke-width="2"/>
  <text x="722" y="196" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">여기부터는 시간 압박이 없다</text>
</svg>
