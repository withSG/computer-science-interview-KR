<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">완화와 원인 규명의 분리</title>
  <desc id="d">장애 발생부터 감지, 완화, 복구 확인까지의 MTTR 구간과 그 이후 원인 규명 및 재발 방지 단계를 나타낸 프로세스 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-blue-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Title Heading -->
  <text x="30" y="35" font-size="16" font-weight="bold" fill="#1f2933">개선: 완화(mitigation)와 원인 규명(diagnosis)을 분리한다</text>

  <!-- Region 1: MTTR Area Background -->
  <rect x="24" y="60" width="536" height="110" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Region 2: Post-Recovery Area Background -->
  <rect x="570" y="60" width="286" height="110" rx="8" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Process Boxes (MTTR Group - Blue Accent) -->
  <!-- Box 1: 장애 발생 -->
  <rect x="36" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="86" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">장애 발생</text>

  <!-- Box 2: 감지 -->
  <rect x="172" y="90" width="70" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="207" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">감지</text>

  <!-- Box 3: 완화 -->
  <rect x="278" y="90" width="70" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="313" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">완화</text>

  <!-- Box 4: 복구 확인 -->
  <rect x="384" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="434" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">복구 확인</text>

  <!-- Process Boxes (Post-Recovery Group - Purple Accent) -->
  <!-- Box 5: 원인 규명 -->
  <rect x="600" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">원인 규명</text>

  <!-- Box 6: 재발 방지 -->
  <rect x="736" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="786" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">재발 방지</text>

  <!-- Main Flow Arrows -->
  <path d="M136,115 L172,115" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M242,115 L278,115" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M348,115 L384,115" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Split Connector Line: 복구 확인 -> Branching -->
  <path d="M484,115 L540,115" stroke="#2563eb" stroke-width="2" fill="none"/>
  <path d="M540,115 L540,115 L600,115" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>
  <path d="M540,115 L540,140" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <path d="M700,115 L736,115" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Upward Arrow to 완화 -->
  <path d="M313,205 L313,140" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue-up)"/>

  <!-- Annotation Below 완화: 여기까지가 MTTR (사용자가 아팠던 시간) -->
  <text x="313" y="225" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">여기까지가 MTTR</text>
  <text x="313" y="243" font-size="11.5" fill="#52606d" text-anchor="middle">(사용자가 아팠던 시간)</text>

  <!-- Right Side Bracket & Annotation: └─ 여기부터는 시간 압박이 없다 -->
  <path d="M540,140 L555,140" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="565" y="144" font-size="13" font-weight="bold" fill="#52606d" text-anchor="start">여기부터는 시간 압박이 없다</text>
</svg>