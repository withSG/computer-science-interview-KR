<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">혼동 행렬 — 모든 분류 지표의 출발점</title>
  <desc id="d">예측과 실제 결과를 비교하는 2x2 혼동 행렬 다이어그램과 용어 설명</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Matrix Header Column Labels -->
  <!-- Box 1 Header: 예측: Positive -->
  <rect x="230" y="30" width="290" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="375" y="55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">예측: Positive</text>

  <!-- Box 2 Header: 예측: Negative -->
  <rect x="540" y="30" width="290" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="685" y="55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">예측: Negative</text>

  <!-- Row Header 1: 실제: Positive -->
  <text x="200" y="130" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="end">실제: Positive</text>

  <!-- Row Header 2: 실제: Negative -->
  <text x="200" y="230" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="end">실제: Negative</text>

  <!-- Cell (1,1): TP (True Pos.) / 제대로 잡음 -->
  <rect x="230" y="80" width="290" height="90" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="375" y="113" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">TP (True Pos.)</text>
  <text x="375" y="143" font-size="13" fill="#1f2933" text-anchor="middle">제대로 잡음</text>

  <!-- Cell (1,2): FN (False Neg.) / 놓침 (2종 오류) -->
  <rect x="540" y="80" width="290" height="90" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="685" y="113" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">FN (False Neg.)</text>
  <text x="685" y="143" font-size="13" fill="#1f2933" text-anchor="middle">놓침 (2종 오류)</text>

  <!-- Cell (2,1): FP (False Pos.) / 헛다리 (1종 오류) -->
  <rect x="230" y="180" width="290" height="90" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="375" y="213" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">FP (False Pos.)</text>
  <text x="375" y="243" font-size="13" fill="#1f2933" text-anchor="middle">헛다리 (1종 오류)</text>

  <!-- Cell (2,2): TN (True Neg.) / 제대로 통과 -->
  <rect x="540" y="180" width="290" height="90" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="685" y="213" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">TN (True Neg.)</text>
  <text x="685" y="243" font-size="13" fill="#1f2933" text-anchor="middle">제대로 통과</text>

  <!-- Bottom Explanations Container -->
  <rect x="50" y="305" width="780" height="155" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="6"/>

  <text x="75" y="345" font-size="13" font-weight="bold" fill="#1f2933">이름 읽는 법: 앞글자 = 예측이 맞았나(T/F), 뒷글자 = 무엇이라 예측했나(P/N)</text>
  
  <text x="75" y="390" font-size="13" fill="#52606d">
    <tspan fill="#1f2933" font-weight="bold">FN</tspan> = "Negative라고 예측했는데 틀림" = 실제로는 Positive인데 놓친 것
  </text>
</svg>