<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Kappa 아키텍처 — 하나로 합치기</title>
  <desc id="d">이벤트 로그에서 스트리밍 처리를 거쳐 서빙 레이어로 이어지는 Kappa 아키텍처의 파이프라인 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 제목 (주어진 문서 헤딩) -->
  <text x="440" y="45" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">## 7. Kappa 아키텍처 — 하나로 합치기</text>

  <!-- 1. 이벤트 로그 박스 -->
  <!-- 박스 중심 (440, 115), 너비 560, 높이 70 -->
  <rect x="160" y="80" width="560" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="184" y="108" font-size="14" font-weight="bold" fill="#1f2933">이벤트 로그 (Kafka 등)</text>
  <text x="410" y="108" font-size="11.5" fill="#52606d">← 충분히 긴 보존 기간이 전제</text>
  <text x="184" y="133" font-size="13" fill="#1f2933">모든 원본이 순서대로 남는다</text>

  <!-- 화살표 1: 이벤트 로그 -> 스트리밍 처리 -->
  <path d="M440,150 L440,190" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 2. 스트리밍 처리 박스 -->
  <!-- 박스 중심 (440, 275), 너비 560, 높이 170 -->
  <rect x="160" y="190" width="560" height="170" rx="6" ry="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="184" y="218" font-size="14" font-weight="bold" fill="#1f2933">스트리밍 처리 (단일 코드)</text>
  <text x="184" y="244" font-size="13" fill="#52606d">로직 변경 시:</text>
  <text x="200" y="270" font-size="13" fill="#1f2933">1. 새 버전 잡을 오프셋 0에서 시작</text>
  <text x="200" y="296" font-size="13" fill="#1f2933">2. 새 결과 테이블에 재계산</text>
  <text x="200" y="322" font-size="13" fill="#1f2933">3. 따라잡으면 조회를 전환</text>

  <!-- 화살표 2: 스트리밍 처리 -> 서빙 -->
  <path d="M440,360 L440,400" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 3. 서빙 박스 -->
  <!-- 박스 중심 (440, 435), 너비 180, 높이 70 -->
  <rect x="350" y="400" width="180" height="70" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="440" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서빙</text>

  <!-- 화살표 3: 서빙 -> 조회 -->
  <path d="M530,435 L610,435" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  
  <!-- 조회 텍스트 -->
  <text x="625" y="440" font-size="13" font-weight="bold" fill="#1f2933">조회</text>
</svg>