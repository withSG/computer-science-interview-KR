<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Kappa 아키텍처의 단일 경로</title>
  <desc id="d">충분히 긴 보존 기간을 전제로 모든 원본이 순서대로 남는 이벤트 로그를 단일 코드의 스트리밍 처리가 읽어 서빙으로 보내고 조회한다. 로직이 바뀌면 새 버전 잡을 오프셋 0에서 시작해 새 결과 테이블에 재계산하고, 따라잡으면 조회를 전환한다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 이벤트 로그 -->
  <rect x="200" y="32" width="400" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="65" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">이벤트 로그 (Kafka 등)</text>
  <text x="400" y="94" font-size="15" fill="#1f2937" text-anchor="middle">모든 원본이 순서대로 남는다</text>

  <!-- 전제 조건 콜아웃 -->
  <path d="M632,74 H604" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <rect x="634" y="50" width="222" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="745" y="79" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">충분히 긴 보존 기간이 전제</text>

  <!-- 로그 → 스트리밍 처리 -->
  <path d="M400,116 V156" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 스트리밍 처리 (단일 코드) -->
  <rect x="24" y="158" width="832" height="192" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="48" y="192" font-size="18" font-weight="bold" fill="#6d28d9">스트리밍 처리 (단일 코드)</text>
  <text x="48" y="224" font-size="15" font-weight="bold" fill="#374151">로직 변경 시:</text>

  <!-- 단계 1 -->
  <rect x="46" y="242" width="236" height="82" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="74" cy="283" r="14" fill="#6d28d9"/>
  <text x="74" y="288" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="100" y="277" font-size="16" fill="#111827">새 버전 잡을</text>
  <text x="100" y="300" font-size="16" fill="#111827">오프셋 0에서 시작</text>

  <path d="M284,283 H318" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-violet)"/>

  <!-- 단계 2 -->
  <rect x="322" y="242" width="236" height="82" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="350" cy="283" r="14" fill="#6d28d9"/>
  <text x="350" y="288" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="376" y="277" font-size="16" fill="#111827">새 결과 테이블에</text>
  <text x="376" y="300" font-size="16" fill="#111827">재계산</text>

  <path d="M560,283 H594" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-violet)"/>

  <!-- 단계 3 -->
  <rect x="598" y="242" width="236" height="82" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="626" cy="283" r="14" fill="#6d28d9"/>
  <text x="626" y="288" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="652" y="277" font-size="16" fill="#111827">따라잡으면</text>
  <text x="652" y="300" font-size="16" fill="#111827">조회를 전환</text>

  <!-- 스트리밍 처리 → 서빙 -->
  <path d="M400,350 V390" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 서빙 -->
  <rect x="320" y="392" width="160" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="400" y="428" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">서빙</text>

  <!-- 조회 -->
  <path d="M480,422 H520" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="522" y="398" width="76" height="48" rx="24" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="560" y="428" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">조회</text>
</svg>
