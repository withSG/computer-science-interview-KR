<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Lambda 실행 환경 생명주기</title>
  <desc id="d">첫 호출이나 동시성 부족 때 INIT 단계(콜드 스타트: 코드 다운로드, 마이크로 VM 부팅, 런타임 시작, 핸들러 바깥 초기화)를 거쳐 INVOKE 단계로 간다. 이후 환경은 살아서 기다리다가 다음 호출이 곧 오면 INVOKE만 다시 실행하고(웜 스타트), 한동안 호출이 없으면 SHUTDOWN 후 회수된다.</desc>
  <rect width="880" height="660" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 진입 조건 -->
  <text x="440" y="44" font-size="16" fill="#374151" text-anchor="middle">첫 호출 (또는 동시성 부족으로 새 환경이 필요할 때)</text>
  <line x1="440" y1="56" x2="440" y2="86" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>

  <!-- INIT 단계 -->
  <rect x="24" y="90" width="832" height="176" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="48" y="124" font-size="19" font-weight="bold" fill="#b45309">INIT 단계 (콜드 스타트)</text>
  <text x="832" y="124" font-size="15" fill="#92400e" text-anchor="end">실행 환경당 한 번</text>

  <rect x="48" y="146" width="172" height="100" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="134" y="176" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">①</text>
  <text x="134" y="202" font-size="15" fill="#1f2937" text-anchor="middle">코드/이미지</text>
  <text x="134" y="224" font-size="15" fill="#1f2937" text-anchor="middle">다운로드</text>

  <rect x="252" y="146" width="172" height="100" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="338" y="176" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">②</text>
  <text x="338" y="202" font-size="15" fill="#1f2937" text-anchor="middle">실행 환경</text>
  <text x="338" y="224" font-size="15" fill="#1f2937" text-anchor="middle">(마이크로 VM) 부팅</text>

  <rect x="456" y="146" width="172" height="100" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="542" y="176" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">③</text>
  <text x="542" y="213" font-size="15" fill="#1f2937" text-anchor="middle">런타임 시작</text>

  <rect x="660" y="146" width="172" height="100" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="746" y="176" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">④</text>
  <text x="746" y="202" font-size="15" fill="#1f2937" text-anchor="middle">핸들러 바깥</text>
  <text x="746" y="224" font-size="15" fill="#1f2937" text-anchor="middle">초기화 코드 실행</text>

  <line x1="222" y1="196" x2="249" y2="196" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <line x1="426" y1="196" x2="453" y2="196" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <line x1="630" y1="196" x2="657" y2="196" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>

  <line x1="304" y1="266" x2="304" y2="304" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- INVOKE 단계 -->
  <rect x="24" y="308" width="560" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="48" y="342" font-size="19" font-weight="bold" fill="#047857">INVOKE 단계</text>
  <text x="560" y="342" font-size="15" fill="#065f46" text-anchor="end">호출마다 매번 실행</text>
  <text x="48" y="376" font-size="16" fill="#1f2937">핸들러 함수 실행 → 응답 반환</text>

  <line x1="304" y1="398" x2="304" y2="436" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 대기(웜) 상태 -->
  <rect x="24" y="440" width="560" height="70" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="48" y="481" font-size="16" fill="#1f2937">환경은 살아 있음 (다음 호출을 기다림)</text>
  <rect x="428" y="459" width="136" height="32" rx="16" fill="#047857"/>
  <text x="496" y="480" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">웜 스타트 구간</text>

  <!-- 분기 1: 다음 호출이 곧 오면 → INVOKE로 되돌아감 -->
  <path d="M584,475 L640,475 L640,353 L588,353" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="656" y="402" font-size="15" font-weight="bold" fill="#047857">다음 호출이 곧 오면</text>
  <text x="656" y="425" font-size="15" fill="#1f2937">→ INVOKE만 다시 실행</text>

  <!-- 분기 2: 한동안 호출이 없으면 → SHUTDOWN -->
  <line x1="304" y1="510" x2="304" y2="564" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="320" y="543" font-size="15" font-weight="bold" fill="#374151">한동안 호출이 없으면</text>

  <rect x="24" y="568" width="560" height="64" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="304" y="606" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">SHUTDOWN 후 환경 회수</text>
</svg>
