<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">POST 재시도로 생긴 이중 결제</title>
  <desc id="d">서버가 50,000원 결제를 처리한 뒤 응답 전송 중 네트워크가 끊기자, 클라이언트는 실패로 보고 같은 POST /payments를 재시도하고 서버는 결제를 또 처리해 10만원이 나간다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- 참여자 -->
  <rect x="80" y="24" width="140" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="150" y="52" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">클라이언트</text>
  <rect x="560" y="24" width="140" height="44" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="630" y="52" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">서버</text>

  <!-- 생명선 -->
  <path d="M150,68 L150,440" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M630,68 L630,440" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 단계 번호 -->
  <circle cx="40" cy="116" r="13" fill="#374151"/>
  <text x="40" y="121" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="40" cy="160" r="13" fill="#374151"/>
  <text x="40" y="165" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="40" cy="226" r="13" fill="#374151"/>
  <text x="40" y="231" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="40" cy="274" r="13" fill="#374151"/>
  <text x="40" y="279" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="40" cy="336" r="13" fill="#b91c1c"/>
  <text x="40" y="341" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="40" cy="392" r="13" fill="#b91c1c"/>
  <text x="40" y="397" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

  <!-- 1. 첫 요청 -->
  <text x="390" y="104" font-size="16" fill="#1d4ed8" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">POST /payments</tspan> (50,000원)</text>
  <path d="M150,116 L628,116" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>

  <!-- 2. 결제 처리 완료 -->
  <rect x="624" y="140" width="12" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="648" y="140" width="160" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
  <text x="728" y="166" font-size="16" fill="#1f2937" text-anchor="middle">결제 처리 완료</text>

  <!-- 3. 응답이 끊김 -->
  <text x="480" y="212" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">응답 전송 중 네트워크 끊김</text>
  <path d="M630,226 L332,226" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="7 5" fill="none"/>
  <path d="M308,216 L328,236 M328,216 L308,236" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>

  <!-- 4. 클라이언트 판단 -->
  <rect x="144" y="252" width="12" height="44" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <rect x="166" y="252" width="340" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="182" y="280" font-size="16" fill="#1f2937">"응답이 없네, 실패했나 보다" <tspan font-weight="bold" fill="#b45309">→ 재시도</tspan></text>

  <!-- 5. 재요청 -->
  <text x="390" y="324" font-size="16" fill="#b91c1c" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">POST /payments</tspan> (50,000원)</text>
  <path d="M150,336 L628,336" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#ah-red)"/>

  <!-- 6. 또 결제 처리 -->
  <rect x="624" y="360" width="12" height="64" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <rect x="648" y="360" width="184" height="64" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="740" y="386" font-size="16" fill="#1f2937" text-anchor="middle">또 결제 처리</text>
  <text x="740" y="412" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">10만원 나감</text>
</svg>
