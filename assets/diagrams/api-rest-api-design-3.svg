<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">POST 중복과 Idempotency-Key</title>
  <desc id="d">네트워크 끊김으로 인한 POST 요청 재시도 시 이중 결제가 발생하는 과정 시퀀스 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-red-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title / Context Heading -->
  <text x="40" y="38" font-size="16" font-weight="bold" fill="#1f2933">POST 중복과 Idempotency-Key</text>

  <!-- Lifelines (Vertical Lines) -->
  <line x1="180" y1="90" x2="180" y2="380" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="700" y1="90" x2="700" y2="380" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Actor / Node Boxes -->
  <!-- Client Box -->
  <rect x="115" y="60" width="130" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="84" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트</text>

  <!-- Server Box -->
  <rect x="650" y="60" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="700" y="84" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서버</text>

  <!-- Step 1: First Request -->
  <!-- Arrow -->
  <path d="M 180,130 L 700,130" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Label Badge -->
  <rect x="303" y="115" width="274" height="26" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="440" y="132" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">POST /payments (50,000원)</text>

  <!-- Step 1: Server Processing -->
  <circle cx="700" cy="170" r="4" fill="#52606d"/>
  <text x="684" y="174" font-size="13" fill="#1f2933" text-anchor="end">결제 처리 완료</text>

  <!-- Step 2: Failed Response -->
  <!-- Broken Arrow Line -->
  <path d="M 700,210 L 180,210" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#a-red-left)"/>
  <!-- Network Disruption Symbol / Label Badge -->
  <rect x="290" y="197" width="300" height="26" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="440" y="214" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">&lt;──── 응답 전송 중 네트워크 끊김 ────</text>

  <!-- Step 3: Client Internal Thought & Retry Action -->
  <rect x="50" y="245" width="360" height="32" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="60" y="265" font-size="12.5" fill="#d97706">
    <tspan font-weight="bold" fill="#1f2933">클라이언트:</tspan> "응답이 없네, 실패했나 보다" <tspan font-weight="bold" fill="#dc2626">→</tspan> 재시도
  </text>

  <!-- Step 4: Second Request (Retry) -->
  <!-- Arrow -->
  <path d="M 180,310 L 700,310" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <!-- Label Badge -->
  <rect x="303" y="295" width="274" height="26" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="440" y="312" font-size="13" font-weight="500" fill="#dc2626" text-anchor="middle">POST /payments (50,000원)</text>

  <!-- Step 4: Double Payment Issue on Server -->
  <circle cx="700" cy="350" r="4" fill="#dc2626"/>
  <text x="684" y="354" font-size="13" fill="#1f2933" text-anchor="end">또 결제 처리</text>
  
  <!-- Warning Accent Box for the Problem Result -->
  <rect x="715" y="337" width="115" height="26" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="722" y="354" font-size="12.5" font-weight="bold" fill="#dc2626">← 10만원 나감</text>

</svg>