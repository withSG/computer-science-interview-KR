<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레플리카와 읽기 분산</title>
  <desc id="d">쓰기는 프라이머리 한 대로 들어가고, 프라이머리가 레플리카1·2·3에 비동기 복제하며, 읽기 트래픽은 세 레플리카로 나뉘어 들어갑니다.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- 쓰기 → 프라이머리 -->
  <rect x="24" y="128" width="72" height="44" rx="22" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="156" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">쓰기</text>
  <path d="M96,150 H150" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>

  <rect x="156" y="118" width="150" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="231" y="156" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">프라이머리</text>

  <!-- 비동기 복제 -->
  <text x="373" y="138" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">비동기 복제</text>
  <path d="M306,150 H494" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ap)"/>
  <path d="M440,70 V230" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <path d="M440,70 H494" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ap)"/>
  <path d="M440,230 H494" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ap)"/>

  <!-- 레플리카 -->
  <rect x="500" y="44" width="140" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="570" y="76" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">레플리카1</text>
  <rect x="500" y="124" width="140" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="570" y="156" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">레플리카2</text>
  <rect x="500" y="204" width="140" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="570" y="236" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">레플리카3</text>

  <!-- 읽기 트래픽 → 레플리카들 -->
  <path d="M736,150 H646" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M700,70 V230" stroke="#047857" stroke-width="2.5" fill="none"/>
  <path d="M700,70 H646" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M700,230 H646" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <rect x="736" y="128" width="120" height="44" rx="22" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="796" y="156" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">읽기 트래픽</text>
</svg>
