<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 필요한가</title>
  <desc id="d">이진 탐색의 lowerBound와 upperBound를 이용해 중복 요소 개수 및 경계를 찾는 과정을 나타낸 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 문서 헤딩 -->
  <text x="24" y="38" font-size="16" font-weight="bold" fill="#1f2933">왜 필요한가</text>

  <!-- 메인 다이어그램 구역 -->
  <rect x="24" y="55" width="832" height="350" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 인덱스 라벨 및 값 -->
  <text x="70" y="98" font-size="13" font-weight="bold" fill="#52606d">idx :</text>
  <text x="145" y="98" font-size="13" fill="#52606d" text-anchor="middle">0</text>
  <text x="215" y="98" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text>
  <text x="285" y="98" font-size="13" fill="#d97706" text-anchor="middle">2</text>
  <text x="355" y="98" font-size="13" fill="#d97706" text-anchor="middle">3</text>
  <text x="425" y="98" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">4</text>
  <text x="495" y="98" font-size="13" fill="#52606d" text-anchor="middle">5</text>
  <text x="565" y="98" font-size="13" fill="#52606d" text-anchor="middle">(6)</text>

  <!-- 배열 라벨 및 대괄호/셀 -->
  <text x="70" y="143" font-size="13" font-weight="bold" fill="#52606d">arr :</text>
  <text x="106" y="144" font-size="16" font-weight="bold" fill="#1f2933">[</text>

  <!-- idx 0: 1 -->
  <rect x="118" y="120" width="54" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="145" y="143" font-size="14" fill="#1f2933" text-anchor="middle">1</text>

  <!-- idx 1: 2 (lowerBound 위치) -->
  <rect x="188" y="120" width="54" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="143" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">2</text>

  <!-- idx 2: 2 -->
  <rect x="258" y="120" width="54" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="285" y="143" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">2</text>

  <!-- idx 3: 2 -->
  <rect x="328" y="120" width="54" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="355" y="143" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">2</text>

  <!-- idx 4: 3 (upperBound 위치) -->
  <rect x="398" y="120" width="54" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="425" y="143" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">3</text>

  <!-- idx 5: 5 -->
  <rect x="468" y="120" width="54" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="495" y="143" font-size="14" fill="#1f2933" text-anchor="middle">5</text>

  <text x="532" y="144" font-size="16" font-weight="bold" fill="#1f2933">]</text>

  <!-- 화살표 (↑) -->
  <!-- lowerBound(2) = 1 화살표 (x=215) -->
  <path d="M 215,192 L 215,164" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- upperBound(2) = 4 화살표 (x=425) -->
  <path d="M 425,192 L 425,164" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- lowerBound / upperBound 라벨 -->
  <rect x="125" y="196" width="180" height="28" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="215" y="214" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">lowerBound(2) = 1</text>

  <rect x="335" y="196" width="180" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="425" y="214" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">upperBound(2) = 4</text>

  <!-- 계산식 및 설명 텍스트 상자들 -->
  <!-- 2의 개수 = upperBound(2) - lowerBound(2) = 4 - 1 = 3 -->
  <rect x="50" y="248" width="780" height="34" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="66" y="270" font-size="13" fill="#1f2933">2의 개수 = upperBound(2) - lowerBound(2) = 4 - 1 = 3</text>

  <!-- 2보다 작은 값의 개수 = lowerBound(2) = 1 -->
  <rect x="50" y="292" width="780" height="34" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="66" y="314" font-size="13" fill="#1f2933">2보다 작은 값의 개수 = lowerBound(2) = 1</text>

  <!-- 존재하지 않는 key(예: 4)면 두 값이 같아져 개수 0이 나온다 → 예외 처리가 따로 필요 없다 -->
  <rect x="50" y="336" width="780" height="34" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="66" y="358" font-size="13" fill="#1f2933">존재하지 않는 key(예: 4)면 두 값이 같아져 개수 0이 나온다 → 예외 처리가 따로 필요 없다</text>
</svg>