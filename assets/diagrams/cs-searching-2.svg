<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">lower bound와 upper bound</title>
  <desc id="d">배열 [1, 2, 2, 2, 3, 5]에서 lowerBound(2) = 1, upperBound(2) = 4를 가리키고, 두 값의 차 4 - 1 = 3이 2의 개수, lowerBound(2) = 1이 2보다 작은 값의 개수이며, 없는 key면 두 값이 같아져 개수 0이 나온다는 것을 보여준다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 구간 괄호 -->
  <text x="152" y="44" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">2보다 작은 값 1개</text>
  <path d="M112,64 L112,56 L192,56 L192,64" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="344" y="44" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">2의 개수 = 4 − 1 = 3</text>
  <path d="M208,64 L208,56 L480,56 L480,64" fill="none" stroke="#b45309" stroke-width="2"/>

  <!-- 인덱스 -->
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="40" y="92" text-anchor="start">idx</text>
    <text x="152" y="92">0</text>
    <text x="248" y="92">1</text>
    <text x="344" y="92">2</text>
    <text x="440" y="92">3</text>
    <text x="536" y="92">4</text>
    <text x="632" y="92">5</text>
    <text x="728" y="92">(6)</text>
  </g>

  <!-- 배열 -->
  <text x="40" y="136" font-size="15" fill="#4b5563">arr</text>
  <rect x="110" y="104" width="84" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <g fill="#fef3c7" stroke="#b45309" stroke-width="2">
    <rect x="206" y="104" width="84" height="52" rx="6"/>
    <rect x="302" y="104" width="84" height="52" rx="6"/>
    <rect x="398" y="104" width="84" height="52" rx="6"/>
  </g>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.5">
    <rect x="494" y="104" width="84" height="52" rx="6"/>
    <rect x="590" y="104" width="84" height="52" rx="6"/>
  </g>
  <rect x="686" y="104" width="84" height="52" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <text x="152" y="137" fill="#111827">1</text>
    <text x="248" y="137" fill="#92400e">2</text>
    <text x="344" y="137" fill="#92400e">2</text>
    <text x="440" y="137" fill="#92400e">2</text>
    <text x="536" y="137" fill="#111827">3</text>
    <text x="632" y="137" fill="#111827">5</text>
  </g>

  <!-- 경계 포인터 -->
  <line x1="248" y1="188" x2="248" y2="162" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="536" y1="188" x2="536" y2="162" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ap)"/>
  <text x="248" y="208" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lowerBound(2) = 1</text>
  <text x="248" y="230" font-size="15" fill="#4b5563" text-anchor="middle">key 이상인 첫 위치</text>
  <text x="536" y="208" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">upperBound(2) = 4</text>
  <text x="536" y="230" font-size="15" fill="#4b5563" text-anchor="middle">key 초과인 첫 위치</text>

  <!-- 활용 표 -->
  <g stroke="#d1d5db" stroke-width="1">
    <rect x="24" y="262" width="260" height="46" fill="#f3f4f6"/>
    <rect x="284" y="262" width="572" height="46" fill="#ffffff"/>
    <rect x="24" y="308" width="260" height="46" fill="#f3f4f6"/>
    <rect x="284" y="308" width="572" height="46" fill="#ffffff"/>
    <rect x="24" y="354" width="260" height="52" fill="#f3f4f6"/>
    <rect x="284" y="354" width="572" height="52" fill="#ffffff"/>
  </g>
  <text x="40" y="291" font-size="16" font-weight="bold" fill="#92400e">2의 개수</text>
  <text x="300" y="291" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan fill="#6d28d9">upperBound(2)</tspan> − <tspan fill="#1d4ed8">lowerBound(2)</tspan> = 4 − 1 = <tspan font-weight="bold">3</tspan></text>

  <text x="40" y="337" font-size="16" font-weight="bold" fill="#374151">2보다 작은 값의 개수</text>
  <text x="300" y="337" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan fill="#1d4ed8">lowerBound(2)</tspan> = <tspan font-weight="bold">1</tspan></text>

  <text x="40" y="386" font-size="16" font-weight="bold" fill="#374151">존재하지 않는 key(예: 4)</text>
  <text x="300" y="386" font-size="16" fill="#111827">두 값이 같아져 개수 0이 나온다 → <tspan font-weight="bold" fill="#047857">예외 처리가 따로 필요 없다</tspan></text>
</svg>
