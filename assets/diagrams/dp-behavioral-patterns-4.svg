<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서블릿 필터 체인 왕복</title>
  <desc id="d">요청은 인코딩, CORS, 인증, 로깅 필터를 차례로 지나 Controller에 닿고, 응답은 로깅, 인증, CORS, 인코딩 순으로 거꾸로 돌아 나온다. 각 필터에서 chain.doFilter() 앞의 코드는 들어갈 때, 뒤의 코드는 나올 때 실행된다.</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 위 설명: 들어갈 때 -->
  <text x="96" y="42" font-size="15" fill="#1d4ed8"><tspan font-weight="bold">앞 코드</tspan><tspan fill="#374151">  </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">chain.doFilter()</tspan><tspan fill="#111827"> 앞의 코드 = 들어갈 때 실행</tspan></text>

  <!-- 요청 / 응답 라벨 -->
  <text x="24" y="106" font-size="16" font-weight="bold" fill="#1d4ed8">요청</text>
  <text x="24" y="202" font-size="16" font-weight="bold" fill="#047857">응답</text>

  <!-- 필터 4개: 한 필터가 두 길을 모두 맡는다 -->
  <rect x="96" y="64" width="116" height="168" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="154" y="106" font-size="14" fill="#1d4ed8" text-anchor="middle">앞 코드</text>
  <text x="154" y="154" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">인코딩</text>
  <text x="154" y="202" font-size="14" fill="#047857" text-anchor="middle">뒤 코드</text>

  <rect x="252" y="64" width="116" height="168" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="310" y="106" font-size="14" fill="#1d4ed8" text-anchor="middle">앞 코드</text>
  <text x="310" y="154" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">CORS</text>
  <text x="310" y="202" font-size="14" fill="#047857" text-anchor="middle">뒤 코드</text>

  <rect x="408" y="64" width="116" height="168" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="466" y="106" font-size="14" fill="#1d4ed8" text-anchor="middle">앞 코드</text>
  <text x="466" y="154" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">인증</text>
  <text x="466" y="202" font-size="14" fill="#047857" text-anchor="middle">뒤 코드</text>

  <rect x="564" y="64" width="116" height="168" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="622" y="106" font-size="14" fill="#1d4ed8" text-anchor="middle">앞 코드</text>
  <text x="622" y="154" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">로깅</text>
  <text x="622" y="202" font-size="14" fill="#047857" text-anchor="middle">뒤 코드</text>

  <!-- Controller -->
  <rect x="720" y="64" width="136" height="168" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="788" y="154" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Controller</text>

  <!-- 요청 방향 (왼→오) -->
  <line x1="64" y1="100" x2="94" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="212" y1="100" x2="250" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="368" y1="100" x2="406" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="524" y1="100" x2="562" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="680" y1="100" x2="718" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- 응답 방향 (오→왼) -->
  <line x1="720" y1="196" x2="682" y2="196" stroke="#047857" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="564" y1="196" x2="526" y2="196" stroke="#047857" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="408" y1="196" x2="370" y2="196" stroke="#047857" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="252" y1="196" x2="214" y2="196" stroke="#047857" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="96" y1="196" x2="66" y2="196" stroke="#047857" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- 아래 설명: 나올 때 -->
  <text x="96" y="266" font-size="15" fill="#047857"><tspan font-weight="bold">뒤 코드</tspan><tspan fill="#374151">  </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">chain.doFilter()</tspan><tspan fill="#111827"> 뒤의 코드 = 나올 때 실행 (양파를 벗듯 역순)</tspan></text>
</svg>
