<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">병합 정렬 재귀 트리</title>
  <desc id="d">T(n) = 2T(n/2) + n의 재귀 트리. 레벨 0의 n이 레벨마다 반으로 나뉘어 레벨 k에서 1이 되고, 각 레벨의 총비용은 항상 n이다. 레벨 수는 log₂n이므로 총비용은 n × log₂n, 즉 O(n log n)이다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>

  <!-- 상단 캡션 -->
  <text x="40" y="42" font-size="17" fill="#1f2937">병합 정렬 <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">T(n) = 2T(n/2) + n</tspan></text>
  <text x="722" y="74" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">레벨별 비용</text>

  <!-- 레벨 이름 -->
  <text x="40" y="116" font-size="16" font-weight="bold" fill="#374151">레벨 0</text>
  <text x="40" y="186" font-size="16" font-weight="bold" fill="#374151">레벨 1</text>
  <text x="40" y="256" font-size="16" font-weight="bold" fill="#374151">레벨 2</text>
  <text x="40" y="366" font-size="16" font-weight="bold" fill="#374151">레벨 k</text>

  <!-- 간선 -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="318" y1="130" x2="241" y2="160"/>
    <line x1="342" y1="130" x2="419" y2="160"/>
    <line x1="225" y1="200" x2="192" y2="230"/>
    <line x1="241" y1="200" x2="274" y2="230"/>
    <line x1="419" y1="200" x2="386" y2="230"/>
    <line x1="435" y1="200" x2="468" y2="230"/>
  </g>

  <!-- 레벨 0 -->
  <rect x="140" y="90" width="380" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="330" y="116" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">n</text>

  <!-- 레벨 1 -->
  <rect x="140" y="160" width="186" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="334" y="160" width="186" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="233" y="186" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">n/2</text>
  <text x="427" y="186" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">n/2</text>

  <!-- 레벨 2 -->
  <rect x="140" y="230" width="89" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="237" y="230" width="89" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="334" y="230" width="89" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="431" y="230" width="89" height="40" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="184.5" y="256" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">n/4</text>
  <text x="281.5" y="256" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">n/4</text>
  <text x="378.5" y="256" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">n/4</text>
  <text x="475.5" y="256" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">n/4</text>

  <!-- 생략 -->
  <g fill="#6b7280">
    <circle cx="233" cy="290" r="3"/><circle cx="233" cy="304" r="3"/><circle cx="233" cy="318" r="3"/>
    <circle cx="427" cy="290" r="3"/><circle cx="427" cy="304" r="3"/><circle cx="427" cy="318" r="3"/>
  </g>

  <!-- 레벨 k -->
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5">
    <rect x="140" y="340" width="30" height="40" rx="4"/>
    <rect x="176" y="340" width="30" height="40" rx="4"/>
    <rect x="212" y="340" width="30" height="40" rx="4"/>
    <rect x="248" y="340" width="30" height="40" rx="4"/>
    <rect x="382" y="340" width="30" height="40" rx="4"/>
    <rect x="418" y="340" width="30" height="40" rx="4"/>
    <rect x="454" y="340" width="30" height="40" rx="4"/>
    <rect x="490" y="340" width="30" height="40" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
    <text x="155" y="366">1</text><text x="191" y="366">1</text><text x="227" y="366">1</text><text x="263" y="366">1</text>
    <text x="397" y="366">1</text><text x="433" y="366">1</text><text x="469" y="366">1</text><text x="505" y="366">1</text>
  </g>
  <g fill="#6b7280">
    <circle cx="316" cy="360" r="3"/><circle cx="330" cy="360" r="3"/><circle cx="344" cy="360" r="3"/>
  </g>

  <!-- 레벨별 비용 -->
  <g font-size="16" fill="#1f2937" text-anchor="end">
    <text x="690" y="186">n/2 + n/2 =</text>
    <text x="690" y="256">4 × n/4 =</text>
    <text x="690" y="366">n × 1 =</text>
  </g>
  <g fill="#ecfdf5" stroke="#047857" stroke-width="1.5">
    <rect x="700" y="93" width="44" height="34" rx="6"/>
    <rect x="700" y="163" width="44" height="34" rx="6"/>
    <rect x="700" y="233" width="44" height="34" rx="6"/>
    <rect x="700" y="343" width="44" height="34" rx="6"/>
  </g>
  <g font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">
    <text x="722" y="116">n</text>
    <text x="722" y="186">n</text>
    <text x="722" y="256">n</text>
    <text x="722" y="366">n</text>
  </g>

  <!-- 레벨 수 괄호 -->
  <path d="M760,92 L770,92 L770,378 L760,378" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <line x1="770" y1="235" x2="778" y2="235" stroke="#6d28d9" stroke-width="2"/>
  <text x="786" y="228" font-size="16" font-weight="bold" fill="#6d28d9">레벨 수</text>
  <text x="786" y="252" font-size="17" font-weight="bold" fill="#6d28d9">log₂n</text>

  <!-- 요약 -->
  <rect x="40" y="410" width="800" height="124" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="442" font-size="16" fill="#1f2937">각 레벨의 총비용이 항상 <tspan font-weight="bold" fill="#047857">n</tspan>으로 같다.</text>
  <text x="60" y="472" font-size="16" fill="#1f2937">레벨 수 = 크기가 n → 1이 될 때까지 반으로 나눈 횟수 = <tspan font-weight="bold" fill="#6d28d9">log₂n</tspan></text>
  <text x="60" y="512" font-size="19" font-weight="bold" fill="#111827">총비용 = <tspan fill="#047857">n</tspan> × <tspan fill="#6d28d9">log₂n</tspan>  →</text>
  <rect x="266" y="488" width="120" height="34" rx="17" fill="#1e3a8a"/>
  <text x="326" y="512" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">O(n log n)</text>
</svg>
