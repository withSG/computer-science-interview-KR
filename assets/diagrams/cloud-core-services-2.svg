<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">인스턴스 타입 이름 읽기</title>
  <desc id="d">m6i.xlarge를 네 부분으로 나눈 그림. m은 패밀리(용도), 6은 세대(숫자가 클수록 최신, 대개 가격 대비 성능이 좋다), i는 추가 속성(i = Intel, a = AMD, g = Graviton/ARM), xlarge는 크기(large → xlarge → 2xlarge → 4xlarge ...)다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 인스턴스 타입 문자열 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="46" font-weight="bold" text-anchor="middle">
    <text x="319" y="78" fill="#1d4ed8">m</text>
    <text x="351" y="78" fill="#047857">6</text>
    <text x="383" y="78" fill="#6d28d9">i</text>
    <text x="409" y="78" fill="#4b5563">.</text>
    <text x="501" y="78" fill="#b45309">xlarge</text>
  </g>
  <rect x="306" y="90" width="26" height="5" rx="2" fill="#1d4ed8"/>
  <rect x="338" y="90" width="26" height="5" rx="2" fill="#047857"/>
  <rect x="370" y="90" width="26" height="5" rx="2" fill="#6d28d9"/>
  <rect x="425" y="90" width="152" height="5" rx="2" fill="#b45309"/>

  <!-- 연결선 -->
  <path d="M319,98 V118 H109 V166" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M351,98 V138 H310 V166" fill="none" stroke="#047857" stroke-width="2"/>
  <path d="M383,98 V138 H521 V166" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <path d="M501,98 V118 H744 V166" fill="none" stroke="#b45309" stroke-width="2"/>

  <!-- 1. 패밀리 -->
  <rect x="24" y="166" width="170" height="176" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="44" y="206" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="28" font-weight="bold" fill="#1d4ed8">m</text>
  <text x="44" y="236" font-size="18" font-weight="bold" fill="#111827">패밀리</text>
  <line x1="44" y1="252" x2="174" y2="252" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="280" font-size="15" fill="#1f2937">용도</text>

  <!-- 2. 세대 -->
  <rect x="210" y="166" width="200" height="176" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="230" y="206" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="28" font-weight="bold" fill="#047857">6</text>
  <text x="230" y="236" font-size="18" font-weight="bold" fill="#111827">세대</text>
  <line x1="230" y1="252" x2="390" y2="252" stroke="#a7f3d0" stroke-width="1.5"/>
  <text font-size="15" fill="#1f2937">
    <tspan x="230" y="280">숫자가 클수록 최신</tspan>
    <tspan x="230" y="304">대개 가격 대비</tspan>
    <tspan x="230" y="328">성능이 좋다</tspan>
  </text>

  <!-- 3. 추가 속성 -->
  <rect x="426" y="166" width="190" height="176" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="446" y="206" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="28" font-weight="bold" fill="#6d28d9">i</text>
  <text x="446" y="236" font-size="18" font-weight="bold" fill="#111827">추가 속성</text>
  <line x1="446" y1="252" x2="596" y2="252" stroke="#ddd6fe" stroke-width="1.5"/>
  <text font-size="15" fill="#1f2937">
    <tspan x="446" y="280" font-weight="bold" fill="#6d28d9">i = Intel</tspan>
    <tspan x="446" y="304">a = AMD</tspan>
    <tspan x="446" y="328">g = Graviton/ARM</tspan>
  </text>

  <!-- 4. 크기 -->
  <rect x="632" y="166" width="224" height="176" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="652" y="206" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="28" font-weight="bold" fill="#b45309">xlarge</text>
  <text x="652" y="236" font-size="18" font-weight="bold" fill="#111827">크기</text>
  <line x1="652" y1="252" x2="836" y2="252" stroke="#fde68a" stroke-width="1.5"/>
  <text font-size="15" fill="#1f2937">
    <tspan x="652" y="280">large → <tspan font-weight="bold" fill="#92400e">xlarge</tspan> →</tspan>
    <tspan x="652" y="304">2xlarge → 4xlarge ...</tspan>
  </text>
</svg>
