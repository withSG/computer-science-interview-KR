<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">인스턴스 타입 이름 읽기</title>
  <desc id="d">m6i.xlarge 인스턴스 타입 이름의 구성 요소인 패밀리, 세대, 추가 속성, 크기를 설명하는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 인스턴스 타입 박스들 -->
  <!-- m (패밀리) -->
  <rect x="235" y="40" width="50" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="72" text-anchor="middle" font-size="24" font-weight="bold" fill="#2563eb">m</text>

  <!-- 6 (세대) -->
  <rect x="290" y="40" width="50" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="315" y="72" text-anchor="middle" font-size="24" font-weight="bold" fill="#059669">6</text>

  <!-- i (추가 속성) -->
  <rect x="345" y="40" width="50" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="72" text-anchor="middle" font-size="24" font-weight="bold" fill="#7c3aed">i</text>

  <!-- . (구분자) -->
  <text x="402" y="72" text-anchor="middle" font-size="24" font-weight="bold" fill="#9aa5b1">.</text>

  <!-- xlarge (크기) -->
  <rect x="410" y="40" width="105" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="462" y="72" text-anchor="middle" font-size="24" font-weight="bold" fill="#d97706">xlarge</text>

  <!-- 연결선 (꺾은선) -->
  <!-- 1. 패밀리 (m) -> Y:265 -->
  <path d="M260,90 L260,265 L310,265" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 2. 세대 (6) -> Y:215 -->
  <path d="M315,90 L315,215 L380,215" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 3. 추가 속성 (i) -> Y:165 -->
  <path d="M370,90 L370,165 L430,165" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 4. 크기 (xlarge) -> Y:115 -->
  <path d="M462,90 L462,115 L480,115" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- 설명 레이블 박스 & 텍스트 -->
  <!-- 4. 크기 설명 -->
  <rect x="480" y="98" width="360" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="492" y="119" font-size="13" fill="#1f2933">크기 (large → xlarge → 2xlarge → 4xlarge ...)</text>

  <!-- 3. 추가 속성 설명 -->
  <rect x="430" y="148" width="410" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="442" y="169" font-size="13" fill="#1f2933">추가 속성 (i = Intel, a = AMD, g = Graviton/ARM)</text>

  <!-- 2. 세대 설명 -->
  <rect x="380" y="198" width="460" height="34" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="392" y="219" font-size="13" fill="#1f2933">세대 (숫자가 클수록 최신, 대개 가격 대비 성능이 좋다)</text>

  <!-- 1. 패밀리 설명 -->
  <rect x="310" y="248" width="140" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="322" y="269" font-size="13" fill="#1f2933">패밀리 (용도)</text>
</svg>