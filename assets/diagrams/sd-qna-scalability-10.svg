<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">모놀리식 구조</title>
  <desc id="d">하나의 Monolithic App 안에 User, Order, Product, Pay 모듈이 함께 들어 있고, 모든 모듈이 Single DB 하나를 사용합니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- Monolithic App (one deployable unit) -->
  <rect x="110" y="28" width="660" height="324" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="440" y="66" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Monolithic App</text>
  <text x="440" y="92" font-size="15" fill="#4b5563" text-anchor="middle">단일 배포 단위</text>

  <!-- Modules -->
  <rect x="150" y="116" width="130" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="215" y="148" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">User</text>
  <rect x="300" y="116" width="130" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="365" y="148" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Order</text>
  <rect x="450" y="116" width="130" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="515" y="148" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Product</text>
  <rect x="600" y="116" width="130" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="665" y="148" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Pay</text>

  <!-- All modules share one DB -->
  <path d="M215,168 V200 M365,168 V200 M515,168 V200 M665,168 V200 M215,200 H665 M440,200 V228" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Single DB cylinder -->
  <path d="M330,244 V300 A110,14 0 0 0 550,300 V244 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="440" cy="244" rx="110" ry="14" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="289" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">Single DB</text>
</svg>
