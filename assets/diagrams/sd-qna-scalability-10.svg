<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">모놀리식</title>
  <desc id="d">Monolithic App 박스 안에 User, Order, Product, Pay 모듈과 Single DB가 포함된 아키텍처 다이어그램</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Outer Box: Monolithic App -->
  <rect x="150" y="30" width="580" height="260" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="440" y="65" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Monolithic App</text>

  <!-- Inner Modules Box Container -->
  <rect x="180" y="90" width="520" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Sub Modules -->
  <!-- User -->
  <rect x="195" y="105" width="115" height="50" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="252.5" y="134.55" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">User</text>

  <line x1="318" y1="105" x2="318" y2="155" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Order -->
  <rect x="325" y="105" width="115" height="50" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="382.5" y="134.55" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">Order</text>

  <line x1="448" y1="105" x2="448" y2="155" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Product -->
  <rect x="455" y="105" width="115" height="50" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="512.5" y="134.55" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">Product</text>

  <line x1="578" y1="105" x2="578" y2="155" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Pay -->
  <rect x="585" y="105" width="100" height="50" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="635" y="134.55" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">Pay</text>

  <!-- Single DB Label -->
  <rect x="340" y="200" width="200" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="229.55" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">Single DB</text>
</svg>