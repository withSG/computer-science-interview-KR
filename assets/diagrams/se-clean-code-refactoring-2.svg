<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안전한 리팩터링 절차</title>
  <desc id="d">테스트가 있는지 확인하고(없으면 특성화 테스트로 현재 동작을 고정), 테스트가 전부 초록인지 확인한 뒤, 아주 작은 한 걸음을 옮기고 테스트를 재실행해 빨강이면 그 걸음만 되돌리고 초록이면 커밋한다. 목표 구조가 될 때까지 2~4단계를 반복한다.</desc>
  <rect width="880" height="680" fill="#ffffff"/>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 0. 테스트가 있는가? -->
  <rect x="40" y="24" width="400" height="64" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="62" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">0. 테스트가 있는가?</text>

  <!-- 없다 → 특성화 테스트 -->
  <path d="M440,56 L518,56" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#m-amber)"/>
  <text x="479" y="46" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">없다</text>
  <rect x="520" y="24" width="280" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="660" y="52" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">특성화 테스트부터 작성</text>
  <text x="660" y="74" font-size="15" fill="#4b5563" text-anchor="middle">현재 동작을 고정</text>
  <path d="M660,88 L660,168 L442,168" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#m-amber)"/>

  <!-- 있다 ↓ -->
  <path d="M240,88 L240,134" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>
  <text x="254" y="117" font-size="15" font-weight="bold" fill="#374151">있다</text>

  <!-- 1 -->
  <rect x="40" y="136" width="400" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="164" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">1. 테스트 전부 초록인지 확인</text>
  <text x="240" y="186" font-size="15" fill="#4b5563" text-anchor="middle">시작점 고정</text>

  <path d="M240,200 L240,246" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <!-- 2 -->
  <rect x="40" y="248" width="400" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="240" y="276" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">2. <tspan fill="#1d4ed8">아주 작은</tspan> 한 걸음</text>
  <text x="240" y="298" font-size="15" fill="#4b5563" text-anchor="middle">함수 하나 추출 / 이름 하나 변경</text>

  <path d="M240,312 L240,358" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <!-- 3 -->
  <rect x="40" y="360" width="400" height="64" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="398" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">3. 테스트 재실행</text>

  <!-- 빨강 → 되돌리기 -->
  <path d="M440,392 L518,392" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-red)"/>
  <text x="479" y="382" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">빨강</text>
  <rect x="520" y="360" width="280" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="660" y="388" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">방금 한 걸음만 되돌린다</text>
  <text x="660" y="410" font-size="15" fill="#4b5563" text-anchor="middle">범위가 작아 쉽다</text>

  <!-- 초록 ↓ -->
  <path d="M240,424 L240,470" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#m-green)"/>
  <text x="254" y="453" font-size="15" font-weight="bold" fill="#047857">초록</text>

  <!-- 4 -->
  <rect x="40" y="472" width="400" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="240" y="500" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">4. 커밋</text>
  <text x="240" y="522" font-size="15" fill="#4b5563" text-anchor="middle">여기까지는 안전지대로 확정</text>

  <path d="M240,536 L240,582" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <!-- 5 -->
  <rect x="40" y="584" width="400" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="622" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">5. 목표 구조가 될 때까지 2~4 반복</text>

  <!-- 반복 루프: 5 → 2 -->
  <path d="M440,616 L840,616 L840,280 L442,280" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#m-blue)"/>
  <text x="640" y="604" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2~4 반복</text>
</svg>
