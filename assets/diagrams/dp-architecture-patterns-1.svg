<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레이어드 아키텍처의 계층과 의존 방향</title>
  <desc id="d">위에서부터 Presentation(Controller, DTO)은 HTTP를, Business(Service, Domain)는 비즈니스 규칙을, Persistence(Repository)는 DB를 알고, 맨 아래에 Database(RDB, Redis)가 있다. 의존은 항상 아래로만 향하고 위로 부르지 않는다.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- Presentation -->
  <rect x="40" y="28" width="800" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="68" y="62" font-size="18" font-weight="bold" fill="#1d4ed8">Presentation</text>
  <text x="270" y="62" font-size="16" fill="#111827">Controller, DTO</text>
  <text x="580" y="62" font-size="16" fill="#111827">HTTP를 안다</text>

  <path d="M440,86 V117" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <!-- Business -->
  <rect x="40" y="120" width="800" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="68" y="154" font-size="18" font-weight="bold" fill="#047857">Business</text>
  <text x="270" y="154" font-size="16" fill="#111827">Service, Domain</text>
  <text x="580" y="154" font-size="16" fill="#111827">비즈니스 규칙을 안다</text>

  <path d="M440,178 V209" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <!-- Persistence -->
  <rect x="40" y="212" width="800" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="68" y="246" font-size="18" font-weight="bold" fill="#b45309">Persistence</text>
  <text x="270" y="246" font-size="16" fill="#111827">Repository</text>
  <text x="580" y="246" font-size="16" fill="#111827">DB를 안다</text>

  <path d="M440,270 V301" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <!-- Database -->
  <rect x="40" y="304" width="800" height="56" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="68" y="338" font-size="18" font-weight="bold" fill="#374151">Database</text>
  <text x="270" y="338" font-size="16" fill="#111827">RDB, Redis</text>

  <!-- 규칙 -->
  <rect x="40" y="384" width="800" height="52" rx="8" fill="#fef3c7"/>
  <text x="64" y="416" font-size="17" fill="#78350f"><tspan font-weight="bold">규칙</tspan><tspan dx="14">의존은 항상 아래로만 향한다. 위로 부르지 않는다.</tspan></text>
</svg>
