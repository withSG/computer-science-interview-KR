<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실패 지점의 해상도</title>
  <desc id="d">E2E 테스트만 있으면 "결제 시나리오 실패"만 보고되어 브라우저부터 DB까지 다섯 구간 모두를 로그로 뒤져야 하지만, 단위 테스트가 있으면 실패 메시지가 주문서비스 안의 클래스·메서드·입력을 곧바로 가리킨다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>
  <defs>
    <marker id="ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- ============ 1. E2E만 있을 때 ============ -->
  <rect x="24" y="24" width="832" height="268" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="48" y="62" font-size="19" font-weight="bold" fill="#b91c1c">E2E만 있을 때</text>
  <text x="832" y="62" font-size="16" text-anchor="end" fill="#4b5563">알려 주는 것 <tspan font-weight="bold" fill="#b91c1c">무언가 잘못됐다</tspan></text>

  <rect x="48" y="80" width="784" height="38" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="64" y="105" font-size="15" fill="#4b5563">실패 메시지</text>
  <text x="164" y="105" font-size="16" font-weight="bold" fill="#1f2937">"결제 시나리오 실패"</text>

  <!-- 호출 체인 -->
  <rect x="52" y="140" width="120" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="112" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">브라우저</text>
  <rect x="216" y="140" width="120" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="276" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">API GW</text>
  <rect x="380" y="140" width="120" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">주문서비스</text>
  <rect x="544" y="140" width="120" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="604" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">결제서비스</text>
  <rect x="708" y="140" width="120" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="768" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">DB</text>

  <path d="M176,164 L210,164" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-dark)"/>
  <path d="M340,164 L374,164" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-dark)"/>
  <path d="M504,164 L538,164" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-dark)"/>
  <path d="M668,164 L702,164" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-dark)"/>

  <!-- 어디서 깨졌는지 모름 -->
  <text x="112" y="222" font-size="22" font-weight="bold" text-anchor="middle" fill="#b91c1c">?</text>
  <text x="276" y="222" font-size="22" font-weight="bold" text-anchor="middle" fill="#b91c1c">?</text>
  <text x="440" y="222" font-size="22" font-weight="bold" text-anchor="middle" fill="#b91c1c">?</text>
  <text x="604" y="222" font-size="22" font-weight="bold" text-anchor="middle" fill="#b91c1c">?</text>
  <text x="768" y="222" font-size="22" font-weight="bold" text-anchor="middle" fill="#b91c1c">?</text>

  <path d="M60,234 L60,242 L820,242 L820,234" stroke="#b91c1c" stroke-width="1.5" fill="none"/>
  <path d="M440,242 L440,250" stroke="#b91c1c" stroke-width="1.5" fill="none"/>
  <text x="440" y="272" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">로그를 처음부터 뒤진다</text>

  <!-- ============ 2. 단위 테스트가 있을 때 ============ -->
  <rect x="24" y="312" width="832" height="234" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="48" y="350" font-size="19" font-weight="bold" fill="#1d4ed8">단위 테스트가 있을 때</text>
  <text x="832" y="350" font-size="16" text-anchor="end" fill="#4b5563">알려 주는 것 <tspan font-weight="bold" fill="#1d4ed8">무엇이 잘못됐다</tspan></text>

  <rect x="48" y="368" width="784" height="38" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="64" y="393" font-size="15" fill="#4b5563">실패 메시지</text>
  <text x="164" y="393" font-size="15" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"DiscountPolicy.apply() expected 900 but was 1000"</text>

  <!-- 호출 체인: 주문서비스만 강조 -->
  <rect x="52" y="428" width="120" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="112" y="458" font-size="16" text-anchor="middle" fill="#4b5563">브라우저</text>
  <rect x="216" y="428" width="120" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="276" y="458" font-size="16" text-anchor="middle" fill="#4b5563">API GW</text>
  <rect x="380" y="428" width="120" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="458" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">주문서비스</text>
  <rect x="544" y="428" width="120" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="604" y="458" font-size="16" text-anchor="middle" fill="#4b5563">결제서비스</text>
  <rect x="708" y="428" width="120" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="768" y="458" font-size="16" text-anchor="middle" fill="#4b5563">DB</text>

  <path d="M176,452 L210,452" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#ah-grey)"/>
  <path d="M340,452 L374,452" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#ah-grey)"/>
  <path d="M504,452 L538,452" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#ah-grey)"/>
  <path d="M668,452 L702,452" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#ah-grey)"/>

  <path d="M384,488 L384,496 L496,496 L496,488" stroke="#1d4ed8" stroke-width="1.5" fill="none"/>
  <path d="M440,496 L440,504" stroke="#1d4ed8" stroke-width="1.5" fill="none"/>
  <text x="440" y="526" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">이 클래스, 이 메서드, 이 입력</text>
</svg>
