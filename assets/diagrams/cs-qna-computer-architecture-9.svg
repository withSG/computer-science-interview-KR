<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐시 동작 방식</title>
  <desc id="d">① CPU가 캐시에 데이터를 요청한다. ② 캐시에 데이터가 있으면 Cache Hit로 바로 CPU에 빠르게 반환하고, ③ 없으면 Cache Miss로 메인 메모리에서 읽어 캐시에 저장한 뒤 CPU에 반환한다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- 경우별 구역 -->
  <rect x="24" y="140" width="832" height="86" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <rect x="24" y="246" width="832" height="176" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- 생명선 -->
  <path d="M120,70 V436 M440,70 V436 M760,70 V436" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>

  <!-- 참여자 -->
  <rect x="60" y="24" width="120" height="46" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="120" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">CPU</text>
  <rect x="380" y="24" width="120" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="53" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">캐시</text>
  <rect x="680" y="24" width="160" height="46" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="760" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">메인 메모리</text>

  <!-- ① 요청 -->
  <text x="280" y="104" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">① CPU가 데이터 요청</text>
  <path d="M122,116 H436" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>

  <!-- ② Cache Hit -->
  <path d="M24,168 V146 A6,6 0 0 1 30,140 H222 V160 L214,168 Z" fill="#047857"/>
  <text x="36" y="159" font-size="15" font-weight="bold" fill="#ffffff">캐시에 데이터가 있으면</text>
  <text x="280" y="192" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#047857">② Cache Hit</tspan> → 빠르게 반환</text>
  <path d="M438,204 H124" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>

  <!-- ③ Cache Miss -->
  <path d="M24,274 V252 A6,6 0 0 1 30,246 H146 V266 L138,274 Z" fill="#b91c1c"/>
  <text x="36" y="265" font-size="15" font-weight="bold" fill="#ffffff">캐시에 없으면</text>
  <text x="600" y="298" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#b91c1c">③ Cache Miss</tspan> → 메인 메모리에서 읽기</text>
  <path d="M442,310 H756" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
  <text x="600" y="344" font-size="15" fill="#111827" text-anchor="middle">캐시에 저장</text>
  <path d="M758,356 H444" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
  <text x="280" y="390" font-size="15" fill="#111827" text-anchor="middle">저장 후 반환</text>
  <path d="M438,402 H124" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
</svg>
