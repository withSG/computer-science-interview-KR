<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상속만 vs 브릿지 클래스 수</title>
  <desc id="d">상속만 쓰면 도형과 렌더러의 조합마다 클래스가 생겨 n × m 개가 필요하고, 브릿지는 Shape(추상화 축)와 Renderer(구현 축)를 다리(합성)로 이어 n + m 개로 두 축이 각자 늘어난다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ===== 왼쪽: 상속만 ===== -->
  <rect x="24" y="24" width="300" height="382" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="62" font-size="18" font-weight="bold" fill="#111827">상속만</text>
  <text x="304" y="63" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="end">n × m 개</text>

  <!-- 트리 선 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M68,150 V323"/>
    <path d="M68,185 H92"/>
    <path d="M68,231 H92"/>
    <path d="M68,277 H92"/>
    <path d="M68,323 H92"/>
  </g>
  <rect x="48" y="110" width="110" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="103" y="136" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Shape</text>

  <g font-size="16" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <rect x="92" y="166" width="190" height="38" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="110" y="191"><tspan fill="#b45309">Vector</tspan><tspan fill="#1d4ed8">Circle</tspan></text>
    <rect x="92" y="212" width="190" height="38" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="110" y="237"><tspan fill="#b45309">Raster</tspan><tspan fill="#1d4ed8">Circle</tspan></text>
    <rect x="92" y="258" width="190" height="38" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="110" y="283"><tspan fill="#b45309">Vector</tspan><tspan fill="#1d4ed8">Square</tspan></text>
    <rect x="92" y="304" width="190" height="38" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="110" y="329"><tspan fill="#b45309">Raster</tspan><tspan fill="#1d4ed8">Square</tspan></text>
  </g>

  <text x="174" y="382" font-size="15" fill="#374151" text-anchor="middle"><tspan fill="#1d4ed8" font-weight="bold">도형</tspan> n종 × <tspan fill="#b45309" font-weight="bold">렌더러</tspan> m종</text>

  <!-- ===== 오른쪽: 브릿지 ===== -->
  <rect x="344" y="24" width="512" height="382" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="364" y="62" font-size="18" font-weight="bold" fill="#111827">브릿지</text>
  <text x="836" y="63" font-size="20" font-weight="bold" fill="#047857" text-anchor="end">n + m 개</text>

  <!-- 축 이름 -->
  <text x="364" y="98" font-size="15" font-weight="bold" fill="#1d4ed8">추상화 축</text>
  <text x="640" y="98" font-size="15" font-weight="bold" fill="#b45309">구현 축</text>

  <!-- Shape 트리 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M384,150 V277"/>
    <path d="M384,185 H408"/>
    <path d="M384,231 H408"/>
    <path d="M384,277 H408"/>
    <path d="M660,150 V231"/>
    <path d="M660,185 H684"/>
    <path d="M660,231 H684"/>
  </g>
  <rect x="364" y="110" width="110" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="419" y="136" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Shape</text>

  <g font-size="16" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <rect x="408" y="166" width="124" height="38" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="426" y="191">Circle</text>
    <rect x="408" y="212" width="124" height="38" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="426" y="237">Square</text>
    <rect x="408" y="258" width="124" height="38" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="426" y="283">Triangle</text>
  </g>

  <!-- 다리 -->
  <line x1="478" y1="130" x2="634" y2="130" stroke="#047857" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="556" y="120" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">다리</text>
  <text x="556" y="152" font-size="14" fill="#374151" text-anchor="middle">합성 (renderer 필드)</text>

  <!-- Renderer 트리 -->
  <rect x="640" y="110" width="150" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="715" y="136" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Renderer</text>

  <g font-size="16" fill="#b45309" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <rect x="684" y="166" width="160" height="38" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="700" y="191">VectorRenderer</text>
    <rect x="684" y="212" width="160" height="38" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="700" y="237">RasterRenderer</text>
  </g>

  <text x="600" y="382" font-size="16" fill="#111827" text-anchor="middle">두 축이 서로를 모른 채 각자 늘어난다</text>
</svg>
