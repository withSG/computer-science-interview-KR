<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CSR 렌더링 흐름</title>
  <desc id="d">CSR은 브라우저 요청, 빈 HTML 수신, JS 다운로드를 거친 뒤 마지막 단계에서 클라이언트가 화면을 렌더링한다.</desc>
  <rect width="880" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 단계 번호 -->
  <circle cx="111.5" cy="40" r="15" fill="#475569"/>
  <text x="111.5" y="45" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="330.5" cy="40" r="15" fill="#475569"/>
  <text x="330.5" y="45" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="549.5" cy="40" r="15" fill="#475569"/>
  <text x="549.5" y="45" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="768.5" cy="40" r="15" fill="#1d4ed8"/>
  <text x="768.5" y="45" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 단계 상자 -->
  <rect x="24" y="66" width="175" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="111.5" y="110" font-size="18" fill="#1f2937" text-anchor="middle">브라우저 요청</text>

  <rect x="243" y="66" width="175" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330.5" y="110" font-size="18" fill="#1f2937" text-anchor="middle">빈 HTML</text>

  <rect x="462" y="66" width="175" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="549.5" y="110" font-size="18" fill="#1f2937" text-anchor="middle">JS 다운로드</text>

  <rect x="681" y="66" width="175" height="76" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="768.5" y="98" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    <tspan x="768.5">클라이언트에서</tspan>
    <tspan x="768.5" dy="24">렌더링</tspan>
  </text>

  <!-- 화살표 -->
  <line x1="205" y1="104" x2="237" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="424" y1="104" x2="456" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="643" y1="104" x2="675" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 요약 캡션 -->
  <line x1="24" y1="164" x2="856" y2="164" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="194" font-size="15" fill="#4b5563" text-anchor="middle">렌더링 시점: 런타임 (브라우저)<tspan dx="16">·</tspan><tspan dx="16">HTML 생성 위치: 클라이언트</tspan></text>
</svg>
