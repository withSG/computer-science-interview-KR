<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Push 방식 배포와 CI에 놓인 자격증명</title>
  <desc id="d">Git(앱 코드)에서 CI 파이프라인이 빌드, 테스트, 배포를 거쳐 kubectl apply로 운영 클러스터에 밀어 넣는다. 이를 위해 CI 파이프라인에 클러스터 관리자 자격증명(kubeconfig)이 저장돼 있다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Git (앱 코드) -->
  <rect x="24" y="40" width="140" height="160" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="94" y="116" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Git</text>
  <text x="94" y="142" font-size="15" fill="#374151" text-anchor="middle">(앱 코드)</text>

  <line x1="166" y1="111" x2="220" y2="111" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- CI 파이프라인 -->
  <rect x="224" y="40" width="320" height="160" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="384" y="74" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">CI 파이프라인</text>

  <rect x="246" y="94" width="64" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="278" y="116" font-size="15" fill="#111827" text-anchor="middle">빌드</text>
  <line x1="312" y1="111" x2="342" y2="111" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="346" y="94" width="76" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="384" y="116" font-size="15" fill="#111827" text-anchor="middle">테스트</text>
  <line x1="424" y1="111" x2="454" y2="111" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="458" y="94" width="64" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="490" y="116" font-size="15" fill="#111827" text-anchor="middle">배포</text>

  <rect x="314" y="148" width="140" height="34" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="384" y="170" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubeconfig</text>

  <!-- kubectl apply -->
  <line x1="524" y1="111" x2="700" y2="111" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="623" y="99" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl apply</text>

  <!-- 운영 클러스터 -->
  <rect x="704" y="40" width="152" height="160" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="780" y="126" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">운영 클러스터</text>

  <!-- 자격증명 설명 -->
  <line x1="384" y1="242" x2="384" y2="186" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
  <rect x="134" y="244" width="500" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="384" y="276" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기에 클러스터 관리자 자격증명(kubeconfig)이 저장돼 있다</text>
</svg>
