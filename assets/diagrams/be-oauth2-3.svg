<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">토큰 대체 공격</title>
  <desc id="d">OAuth만으로 로그인을 만들면, 공격자가 자기 구글 계정으로 얻은 유효한 Access Token을 피해 서비스에 제출했을 때 서비스가 토큰 유효성만 보고 UserInfo 호출 뒤 로그인 처리한다. 토큰의 발급 대상(클라이언트 ID, Audience)을 확인할 표준 수단이 없어 다른 앱용 토큰도 통과한다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="24" y="44" font-size="19" font-weight="bold" fill="#b91c1c">토큰 대체 공격 — OAuth만으로 로그인을 만들었을 때</text>

  <!-- ① 공격자 -->
  <rect x="24" y="72" width="248" height="184" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="54" cy="102" r="14" fill="#b91c1c"/>
  <text x="54" y="107.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="78" y="108" font-size="17" font-weight="bold" fill="#b91c1c">공격자</text>
  <line x1="40" y1="124" x2="256" y2="124" stroke="#fca5a5" stroke-width="1"/>
  <text x="40" y="154" font-size="16" fill="#111827">자기 구글 계정으로</text>
  <text x="40" y="178" font-size="16" fill="#111827">정상 로그인</text>
  <rect x="38" y="198" width="220" height="38" rx="19" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="148" y="222" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">유효한 Access Token 획득</text>

  <line x1="278" y1="164" x2="310" y2="164" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ② 제출 -->
  <rect x="316" y="72" width="248" height="184" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="346" cy="102" r="14" fill="#b91c1c"/>
  <text x="346" y="107.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="370" y="108" font-size="17" font-weight="bold" fill="#b91c1c">공격자 → 피해 서비스</text>
  <line x1="332" y1="124" x2="548" y2="124" stroke="#fca5a5" stroke-width="1"/>
  <text x="332" y="154" font-size="16" fill="#111827">피해 서비스에 제출</text>
  <rect x="330" y="174" width="220" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="202" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">“이 토큰으로 로그인해줘”</text>

  <line x1="570" y1="164" x2="602" y2="164" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ③ 피해 서비스 -->
  <rect x="608" y="72" width="248" height="184" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="638" cy="102" r="14" fill="#1d4ed8"/>
  <text x="638" y="107.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="662" y="108" font-size="17" font-weight="bold" fill="#1d4ed8">피해 서비스</text>
  <line x1="624" y1="124" x2="840" y2="124" stroke="#93c5fd" stroke-width="1"/>
  <text x="624" y="154" font-size="16" fill="#111827">“토큰이 유효하네”</text>
  <text x="624" y="184" font-size="16" fill="#111827">→ UserInfo 호출</text>
  <text x="624" y="214" font-size="16" font-weight="bold" fill="#b91c1c">→ 로그인 처리</text>

  <!-- 문제 -->
  <line x1="732" y1="258" x2="732" y2="292" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahr)"/>
  <rect x="24" y="296" width="832" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="44" y="316" width="64" height="32" rx="6" fill="#b91c1c"/>
  <text x="76" y="338" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">문제</text>
  <text x="128" y="338" font-size="17" font-weight="bold" fill="#111827">토큰의 발급 대상(클라이언트 ID, Audience)을 확인할 표준 수단이 없어</text>
  <text x="128" y="368" font-size="17" font-weight="bold" fill="#b91c1c">다른 앱용으로 발급된 토큰도 그대로 통과한다</text>

  <!-- 보충 -->
  <text x="24" y="428" font-size="15" fill="#4b5563">※ Access Token은 “무엇을 할 수 있는가(인가)”만 담고 “누구인가(인증)”는 담지 않는다</text>
  <text x="24" y="456" font-size="15" fill="#4b5563">※ 권한을 가진 쪽이 요청자를 확인하지 않고 대신 행동하는 구조 = 혼동된 대리인(Confused Deputy) 문제</text>
</svg>
