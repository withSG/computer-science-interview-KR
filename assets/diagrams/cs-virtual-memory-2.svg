<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가상 주소 분할과 변환</title>
  <desc id="d">페이지 크기가 4KB(2^12)일 때 32비트 가상 주소는 20비트 페이지 번호와 12비트 오프셋으로 나뉩니다. 페이지 번호만 페이지 테이블 조회로 프레임 번호가 되고, 오프셋은 그대로 통과해 물리 주소를 이룹니다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 전제 조건 -->
  <rect x="100" y="20" width="270" height="34" rx="17" fill="#f3f4f6"/>
  <text x="235" y="43" font-size="16" fill="#1f2937" text-anchor="middle">페이지 크기가 4KB(2<tspan font-size="14" dy="-6">12</tspan><tspan dy="6">)인 경우</tspan></text>

  <!-- 가상 주소 -->
  <text x="100" y="88" font-size="17" font-weight="bold" fill="#111827">가상 주소 (예: 32비트)</text>
  <rect x="100" y="98" width="425" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="312.5" y="132" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">페이지 번호 (20비트)</text>
  <rect x="525" y="98" width="255" height="56" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="652.5" y="132" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">오프셋 (12비트)</text>

  <!-- 페이지 번호 경로: 페이지 테이블 조회 -->
  <line x1="312.5" y1="156" x2="312.5" y2="190" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <rect x="220" y="192" width="185" height="38" rx="19" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="312.5" y="217" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">페이지 테이블 조회</text>
  <line x1="312.5" y1="230" x2="312.5" y2="264" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <rect x="100" y="266" width="425" height="50" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="312.5" y="297" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">프레임 번호</text>
  <line x1="312.5" y1="316" x2="312.5" y2="376" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr-b)"/>

  <!-- 오프셋 경로: 그대로 통과 -->
  <line x1="652.5" y1="156" x2="652.5" y2="190" stroke="#047857" stroke-width="2.5"/>
  <rect x="590" y="192" width="125" height="38" rx="19" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="652.5" y="217" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">그대로 통과</text>
  <line x1="652.5" y1="230" x2="652.5" y2="376" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-g)"/>

  <!-- 물리 주소 -->
  <text x="100" y="368" font-size="17" font-weight="bold" fill="#111827">물리 주소</text>
  <rect x="100" y="380" width="425" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="312.5" y="414" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">프레임 번호</text>
  <rect x="525" y="380" width="255" height="56" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="652.5" y="414" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">오프셋 (12비트)</text>

  <!-- 요점 -->
  <text x="440" y="480" font-size="16" fill="#374151" text-anchor="middle">번역되는 것은 페이지 번호뿐 · 오프셋은 그대로</text>
</svg>
