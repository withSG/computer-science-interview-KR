<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 코드의 비용 vs 가치</title>
  <desc id="d">초기 비용은 테스트 작성 시간 하나이고, 장기 가치는 수동 테스트 시간 절약, 버그 수정 비용 감소, 유지보수 비용 절감이다. 프로젝트가 길어질수록 테스트의 ROI가 증가한다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 시간 축 -->
  <text x="40" y="40" font-size="15" fill="#374151">초기</text>
  <text x="840" y="40" font-size="15" fill="#374151" text-anchor="end">장기</text>
  <line x1="40" y1="56" x2="838" y2="56" stroke="#6b7280" stroke-width="2" marker-end="url(#ak)"/>

  <!-- 초기 비용 -->
  <rect x="40" y="80" width="280" height="176" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="64" y="114" font-size="19" font-weight="bold" fill="#b91c1c">초기 비용</text>
  <line x1="56" y1="132" x2="304" y2="132" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="70" cy="198" r="4" fill="#b91c1c"/>
  <text x="84" y="204" font-size="17" fill="#111827">테스트 작성 시간</text>

  <!-- 장기 가치 -->
  <rect x="360" y="80" width="480" height="176" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="384" y="114" font-size="19" font-weight="bold" fill="#047857">장기 가치</text>
  <line x1="376" y1="132" x2="824" y2="132" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="390" cy="166" r="4" fill="#047857"/>
  <text x="404" y="172" font-size="17" fill="#111827">수동 테스트 시간 절약</text>
  <circle cx="390" cy="198" r="4" fill="#047857"/>
  <text x="404" y="204" font-size="17" fill="#111827">버그 수정 비용 감소</text>
  <circle cx="390" cy="230" r="4" fill="#047857"/>
  <text x="404" y="236" font-size="17" fill="#111827">유지보수 비용 절감</text>

  <!-- 결론 -->
  <line x1="180" y1="262" x2="180" y2="292" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="600" y1="262" x2="600" y2="292" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="40" y="298" width="800" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="333" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">프로젝트가 길어질수록 테스트의 ROI가 증가</text>
</svg>
