<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 코드의 비용 vs 가치</title>
  <desc id="d">테스트 코드의 초기 비용과 장기 가치, 그리고 ROI 증가에 대한 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- Main Title Block from section heading -->
  <rect x="40" y="30" width="800" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">테스트 코드의 비용 vs 가치</text>

  <!-- Left Card: 초기 비용 (Cost - Red accent) -->
  <rect x="40" y="90" width="385" height="170" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="55" y="105" width="355" height="36" rx="4" fill="#dc2626"/>
  <text x="232.5" y="128" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">초기 비용</text>
  
  <!-- Bullet line inside Cost -->
  <circle cx="75" cy="175" r="3" fill="#dc2626"/>
  <text x="88" y="179" font-size="13" font-weight="500" fill="#1f2933">테스트 작성 시간</text>

  <!-- Right Card: 장기 가치 (Value - Green accent) -->
  <rect x="455" y="90" width="385" height="170" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="470" y="105" width="355" height="36" rx="4" fill="#059669"/>
  <text x="647.5" y="128" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">장기 가치</text>

  <!-- Bullets inside Value -->
  <circle cx="490" cy="160" r="3" fill="#059669"/>
  <text x="503" y="164" font-size="13" font-weight="500" fill="#1f2933">수동 테스트 시간 절약</text>

  <circle cx="490" cy="190" r="3" fill="#059669"/>
  <text x="503" y="194" font-size="13" font-weight="500" fill="#1f2933">버그 수정 비용 감소</text>

  <circle cx="490" cy="220" r="3" fill="#059669"/>
  <text x="503" y="224" font-size="13" font-weight="500" fill="#1f2933">유지보수 비용 절감</text>

  <!-- Arrow & Bottom Conclusion Banner -->
  <path d="M440,270 L440,293" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="40" y="300" width="800" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="440" y="331" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">프로젝트가 길어질수록 테스트의 ROI가 증가</text>
</svg>