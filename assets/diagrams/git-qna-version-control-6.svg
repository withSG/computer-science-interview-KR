<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Merge 커밋 그래프</title>
  <desc id="d">D에서 갈라진 feature 브랜치의 A, B, C와 main의 D, E, F가 병합 커밋 G에서 합쳐진다. main은 G를 가리키고 feature는 C를 가리킨다.</desc>
  <rect width="880" height="270" fill="#ffffff"/>

  <!-- edges: main -->
  <line x1="132" y1="170" x2="288" y2="170" stroke="#3b82f6" stroke-width="4"/>
  <line x1="332" y1="170" x2="488" y2="170" stroke="#3b82f6" stroke-width="4"/>
  <line x1="532" y1="170" x2="686" y2="170" stroke="#3b82f6" stroke-width="4"/>
  <!-- edges: feature -->
  <line x1="125.6" y1="154.4" x2="194.4" y2="85.6" stroke="#10b981" stroke-width="4"/>
  <line x1="232" y1="70" x2="388" y2="70" stroke="#10b981" stroke-width="4"/>
  <line x1="432" y1="70" x2="588" y2="70" stroke="#10b981" stroke-width="4"/>
  <line x1="625.6" y1="85.6" x2="693" y2="153" stroke="#10b981" stroke-width="4"/>

  <!-- main commits -->
  <circle cx="110" cy="170" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="110" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">D</text>
  <circle cx="310" cy="170" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="310" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">E</text>
  <circle cx="510" cy="170" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="510" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">F</text>

  <!-- merge commit G -->
  <circle cx="710" cy="170" r="24" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <text x="710" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">G</text>

  <!-- feature commits -->
  <circle cx="210" cy="70" r="22" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <text x="210" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">A</text>
  <circle cx="410" cy="70" r="22" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <text x="410" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">B</text>
  <circle cx="610" cy="70" r="22" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <text x="610" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">C</text>

  <!-- branch tags -->
  <rect x="648" y="57" width="80" height="26" rx="13" fill="#047857"/>
  <text x="688" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">feature</text>
  <rect x="750" y="157" width="60" height="26" rx="13" fill="#1d4ed8"/>
  <text x="780" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main</text>

  <!-- callout -->
  <line x1="710" y1="198" x2="710" y2="214" stroke="#b45309" stroke-width="2"/>
  <text x="710" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">병합 커밋 G 생성</text>
</svg>
