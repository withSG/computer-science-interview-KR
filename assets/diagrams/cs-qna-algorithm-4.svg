<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기수 정렬(LSD) 단계별 동작</title>
  <desc id="d">[170, 45, 75, 90, 802, 24, 2, 66]을 1의 자리, 10의 자리, 100의 자리 순서로 한 자리씩 안정 정렬하면, 각 단계에서 기준 자릿값이 오름차순으로 놓이고 3단계 뒤 [2, 24, 45, 66, 75, 90, 170, 802]로 정렬됩니다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>

  <text x="32" y="44" font-size="16" fill="#111827">낮은 자리부터 한 자리씩 안정 정렬:  <tspan font-weight="bold" fill="#b45309">1의 자리 → 10의 자리 → 100의 자리</tspan></text>

