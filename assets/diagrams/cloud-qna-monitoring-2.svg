<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실제 장애 대응 예시</title>
  <desc id="d">API 응답시간 알림에서 출발해 대시보드(Metrics), Trace(Traces), 로그(Logs)를 차례로 확인하며 원인인 인덱스 없는 테이블 풀 스캔을 찾아가는 5단계 흐름. 각 단계 오른쪽에 활용한 요소를 표시한다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="780" y="42" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">활용 요소</text>

  <!-- 단계 사이 화살표 -->
  <line x1="52" y1="108" x2="52" y2="148" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="194" x2="52" y2="234" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="280" x2="52" y2="320" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="366" x2="52" y2="406" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 1 -->
  <circle cx="52" cy="86" r="18" fill="#1f2937"/>
  <text x="52" y="92" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="88" y="56" width="610" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="92" font-size="17" font-weight="bold" fill="#111827">Alert 발생</text>
  <line x1="248" y1="70" x2="248" y2="102" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="266" y="92" font-size="16" fill="#1f2937">"API 응답시간 &gt; 2초"</text>
  <rect x="722" y="68" width="116" height="36" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="780" y="91" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Metrics</text>

  <!-- 2 -->
  <circle cx="52" cy="172" r="18" fill="#1f2937"/>
  <text x="52" y="178" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="88" y="142" width="610" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="178" font-size="17" font-weight="bold" fill="#111827">대시보드 확인</text>
  <line x1="248" y1="156" x2="248" y2="188" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="266" y="178" font-size="16" fill="#1f2937">어떤 서비스가 느린지</text>
  <rect x="722" y="154" width="116" height="36" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="780" y="177" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Metrics</text>

  <!-- 3 -->
  <circle cx="52" cy="258" r="18" fill="#1f2937"/>
  <text x="52" y="264" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="88" y="228" width="610" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="264" font-size="17" font-weight="bold" fill="#111827">Trace 확인</text>
  <line x1="248" y1="242" x2="248" y2="274" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="266" y="264" font-size="16" fill="#1f2937">DB 쿼리에서 3초 소요</text>
  <rect x="722" y="240" width="116" height="36" rx="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="780" y="263" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">Traces</text>

  <!-- 4 -->
  <circle cx="52" cy="344" r="18" fill="#1f2937"/>
  <text x="52" y="350" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="88" y="314" width="610" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="350" font-size="17" font-weight="bold" fill="#111827">로그 확인</text>
  <line x1="248" y1="328" x2="248" y2="360" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="266" y="350" font-size="16" fill="#1f2937">특정 쿼리 슬로우 로그</text>
  <rect x="722" y="326" width="116" height="36" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="780" y="349" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Logs</text>

  <!-- 5 원인 -->
  <circle cx="52" cy="430" r="18" fill="#b91c1c"/>
  <text x="52" y="436" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="88" y="400" width="750" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="108" y="436" font-size="17" font-weight="bold" fill="#991b1b">원인 파악</text>
  <line x1="248" y1="414" x2="248" y2="446" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="266" y="436" font-size="17" font-weight="bold" fill="#111827">인덱스 없는 테이블 풀 스캔</text>
</svg>
