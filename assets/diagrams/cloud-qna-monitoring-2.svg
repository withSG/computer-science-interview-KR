<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실제 장애 대응 예시</title>
  <desc id="d">Observability 3요소(Metrics, Traces, Logs)를 활용한 5단계 실제 장애 대응 절차 다이어그램</desc>
  <rect width="880" height="620" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="440" y="45" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">실제 장애 대응 예시</text>

  <!-- Step 1 -->
  <rect x="190" y="70" width="500" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="107" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1. Alert 발생: "API 응답시간 &gt; 2초" (Metrics)</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,134 L440,170" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 -->
  <rect x="190" y="170" width="500" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="207" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2. 대시보드 확인: 어떤 서비스가 느린지 (Metrics)</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,234 L440,270" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 3 -->
  <rect x="190" y="270" width="500" height="64" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="307" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3. Trace 확인: DB 쿼리에서 3초 소요 (Traces)</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,334 L440,370" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>

  <!-- Step 4 -->
  <rect x="190" y="370" width="500" height="64" rx="8" ry="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="407" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4. 로그 확인: 특정 쿼리 슬로우 로그 (Logs)</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,434 L440,470" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- Step 5 -->
  <rect x="190" y="470" width="500" height="64" rx="8" ry="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="507" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">5. 원인 파악: 인덱스 없는 테이블 풀 스캔</text>
</svg>