<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Master-Slave 복제 방식 다이어그램</title>
  <desc id="d">Master 노드는 쓰기 전담 역할을 수행하고, 복제 라인을 거쳐 여러 Slave 노드로 데이터를 복사하여 읽기 요청을 분산하는 구조입니다.</desc>
  <defs>
    <marker id="a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="290" fill="#ffffff"/>
  
  <rect x="290" y="35" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="64.9" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Master</text>
  
  <path d="M510,60 L440,60" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-sub)"/>
  <text x="520" y="64.55" font-size="13" fill="#52606d" text-anchor="start">쓰기 전담</text>

  <path d="M360,85 L360,160" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <rect x="340" y="109" width="40" height="22" fill="#ffffff"/>
  <text x="360" y="124.2" font-size="12" fill="#52606d" text-anchor="middle">복제</text>

  <path d="M180,160 L540,160" stroke="#059669" stroke-width="1.5" fill="none"/>
  <path d="M180,160 L180,192" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M360,160 L360,192" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M540,160 L540,192" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="120" y="200" width="120" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="229.9" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Slave</text>

  <rect x="300" y="200" width="120" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="360" y="229.9" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Slave</text>

  <rect x="480" y="200" width="120" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="540" y="229.9" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Slave</text>

  <path d="M710,225 L610,225" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-sub)"/>
  <text x="720" y="229.55" font-size="13" fill="#52606d" text-anchor="start">읽기 분산</text>
</svg>