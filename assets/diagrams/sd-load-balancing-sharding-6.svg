<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">노드 추가 시 키 이동 비율</title>
  <desc id="d">노드가 N개에서 N+1개로 늘 때 나머지 % N 방식은 약 N/(N+1)의 키가 이동하고(노드 3→4면 약 75%), 일관된 해싱은 약 1/(N+1)의 키만 이동합니다(노드 3→4면 약 25%).</desc>
  <rect width="880" height="350" fill="#ffffff"/>

  <text x="40" y="50" font-size="19" font-weight="bold" fill="#111827">노드 N개 → N+1개일 때 이동하는 키</text>

  <!-- 나머지 % N 방식 -->
  <rect x="40" y="74" width="800" height="116" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="64" y="120" font-size="19" font-weight="bold" fill="#b91c1c">나머지 % N 방식</text>
  <text x="64" y="156" font-size="17" fill="#111827">약 <tspan font-weight="bold">N/(N+1)</tspan>의 키가 이동</text>
  <text x="330" y="106" font-size="15" fill="#4b5563">노드 3→4면 (막대 전체 = 전체 키)</text>
  <rect x="330" y="118" width="480" height="44" rx="6" fill="#e5e7eb"/>
  <rect x="330" y="118" width="360" height="44" rx="6" fill="#b91c1c"/>
  <text x="510" y="146" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">약 75%</text>

  <!-- 일관된 해싱 -->
  <rect x="40" y="210" width="800" height="116" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="64" y="256" font-size="19" font-weight="bold" fill="#047857">일관된 해싱</text>
  <text x="64" y="292" font-size="17" fill="#111827">약 <tspan font-weight="bold">1/(N+1)</tspan>의 키가 이동</text>
  <text x="330" y="242" font-size="15" fill="#4b5563">노드 3→4면</text>
  <rect x="330" y="254" width="480" height="44" rx="6" fill="#e5e7eb"/>
  <rect x="330" y="254" width="120" height="44" rx="6" fill="#047857"/>
  <text x="390" y="282" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">약 25%</text>
</svg>
