<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로젝트를 넣는 순서</title>
  <desc id="d">문제, 역할, 선택, 결과 4단계의 프로젝트 기술 순서와 각 단계별 예시 및 주의사항 설명 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- ===== 1단계: [문제] ===== -->
  <!-- 단계 박스 [문제] -->
  <rect x="40" y="30" width="100" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="56.5" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[문제]</text>

  <!-- 단계 설명 -->
  <text x="160" y="56.5" font-size="14" font-weight="bold" fill="#1f2933">어떤 상황에서 무엇이 안 됐나</text>

  <!-- 예시 내용 -->
  <text x="200" y="93.5" font-size="13" fill="#1f2933">"상품 목록 스크롤이 버벅였다"</text>

  <!-- 주석/주의사항 -->
  <text x="200" y="113.5" font-size="11.5" fill="#d97706">※ 여기가 없으면 뒤의 모든 게 자랑으로 들린다</text>

  <!-- 화살표 1 -->
  <path d="M90,74 L90,126" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>


  <!-- ===== 2단계: [역할] ===== -->
  <!-- 단계 박스 [역할] -->
  <rect x="40" y="140" width="100" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="166.5" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[역할]</text>

  <!-- 단계 설명 -->
  <text x="160" y="166.5" font-size="14" font-weight="bold" fill="#1f2933">그 안에서 내가 맡은 부분</text>

  <!-- 예시 내용 -->
  <text x="200" y="203.5" font-size="13" fill="#1f2933">"4명 팀에서 목록 화면 전체를 담당했다"</text>

  <!-- 주석/주의사항 -->
  <text x="200" y="223.5" font-size="11.5" fill="#52606d">※ 팀 성과와 내 성과를 반드시 구분한다</text>

  <!-- 화살표 2 -->
  <path d="M90,184 L90,236" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>


  <!-- ===== 3단계: [선택] (핵심 강조) ===== -->
  <!-- 단계 박스 [선택] -->
  <rect x="40" y="250" width="100" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="90" y="276.5" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">[선택]</text>

  <!-- 단계 설명 -->
  <text x="160" y="276.5" font-size="14" font-weight="bold" fill="#1f2933">왜 그 방법을 골랐나 (대안 대비)</text>

  <!-- 예시 내용 -->
  <text x="200" y="313.5" font-size="13" fill="#1f2933">"페이지네이션도 검토했지만 UX 요구가 무한 스크롤이라 가상화를 택했다"</text>

  <!-- 주석/주의사항 -->
  <text x="200" y="333.5" font-size="11.5" font-weight="bold" fill="#7c3aed">※ 이 조각이 면접에서 가장 비싸다. 대부분 여기를 빼먹는다</text>

  <!-- 화살표 3 -->
  <path d="M90,294 L90,346" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>


  <!-- ===== 4단계: [결과] ===== -->
  <!-- 단계 박스 [결과] -->
  <rect x="40" y="360" width="100" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="90" y="386.5" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">[결과]</text>

  <!-- 단계 설명 -->
  <text x="160" y="386.5" font-size="14" font-weight="bold" fill="#1f2933">무엇이 어떻게 달라졌나</text>

  <!-- 예시 내용 -->
  <text x="200" y="423.5" font-size="13" fill="#1f2933">"스크롤이 부드러워졌고, 렌더링 횟수를 프로파일러로 확인했다"</text>

  <!-- 주석/주의사항 -->
  <text x="200" y="443.5" font-size="11.5" fill="#dc2626">※ 측정한 것만 말한다. 없는 숫자를 지어내지 않는다</text>
</svg>