<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로젝트를 넣는 순서</title>
  <desc id="d">자기소개에서 프로젝트는 문제, 역할, 선택, 결과 순서로 압축하며, 단계마다 묻는 질문과 예시 문장, 주의점을 보여준다. 대안 대비 왜 그 방법을 골랐는지 말하는 선택 단계가 면접에서 가장 비싸다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>

  <!-- 단계 사이 화살표 -->
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="92" y1="131" x2="92" y2="156"/>
    <line x1="92" y1="267" x2="92" y2="292"/>
    <line x1="92" y1="403" x2="92" y2="428"/>
  </g>

  <!-- 1. 문제 -->
  <rect x="24" y="24" width="832" height="104" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="38" width="104" height="76" rx="8" fill="#e0e7ff"/>
  <text x="92" y="68" font-size="14" fill="#3730a3" text-anchor="middle">1단계</text>
  <text x="92" y="95" font-size="19" font-weight="bold" fill="#1e1b4b" text-anchor="middle">[문제]</text>
  <text x="168" y="56" font-size="17" font-weight="bold" fill="#111827">어떤 상황에서 무엇이 안 됐나</text>
  <text x="168" y="84" font-size="16" fill="#374151">“상품 목록 스크롤이 버벅였다”</text>
  <text x="168" y="110" font-size="15" fill="#b45309">※ 여기가 없으면 뒤의 모든 게 자랑으로 들린다</text>

  <!-- 2. 역할 -->
  <rect x="24" y="160" width="832" height="104" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="174" width="104" height="76" rx="8" fill="#e0e7ff"/>
  <text x="92" y="204" font-size="14" fill="#3730a3" text-anchor="middle">2단계</text>
  <text x="92" y="231" font-size="19" font-weight="bold" fill="#1e1b4b" text-anchor="middle">[역할]</text>
  <text x="168" y="192" font-size="17" font-weight="bold" fill="#111827">그 안에서 내가 맡은 부분</text>
  <text x="168" y="220" font-size="16" fill="#374151">“4명 팀에서 목록 화면 전체를 담당했다”</text>
  <text x="168" y="246" font-size="15" fill="#b45309">※ 팀 성과와 내 성과를 반드시 구분한다</text>

  <!-- 3. 선택 (가장 비싼 조각) -->
  <rect x="24" y="296" width="832" height="104" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
  <rect x="40" y="310" width="104" height="76" rx="8" fill="#6d28d9"/>
  <text x="92" y="340" font-size="14" fill="#ffffff" text-anchor="middle">3단계</text>
  <text x="92" y="367" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">[선택]</text>
  <text x="168" y="328" font-size="17" font-weight="bold" fill="#111827">왜 그 방법을 골랐나 (대안 대비)</text>
  <text x="168" y="356" font-size="16" fill="#374151">“페이지네이션도 검토했지만 UX 요구가 무한 스크롤이라 가상화를 택했다”</text>
  <text x="168" y="382" font-size="15" font-weight="bold" fill="#6d28d9">※ 이 조각이 면접에서 가장 비싸다. 대부분 여기를 빼먹는다</text>

  <!-- 4. 결과 -->
  <rect x="24" y="432" width="832" height="104" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="446" width="104" height="76" rx="8" fill="#e0e7ff"/>
  <text x="92" y="476" font-size="14" fill="#3730a3" text-anchor="middle">4단계</text>
  <text x="92" y="503" font-size="19" font-weight="bold" fill="#1e1b4b" text-anchor="middle">[결과]</text>
  <text x="168" y="464" font-size="17" font-weight="bold" fill="#111827">무엇이 어떻게 달라졌나</text>
  <text x="168" y="492" font-size="16" fill="#374151">“스크롤이 부드러워졌고, 렌더링 횟수를 프로파일러로 확인했다”</text>
  <text x="168" y="518" font-size="15" fill="#b45309">※ 측정한 것만 말한다. 없는 숫자를 지어내지 않는다</text>
</svg>
