<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">전체 지도</title>
  <desc id="d">URL 입력부터 파싱, DNS 조회, TCP 연결, TLS 협상, HTTP 교환, 렌더링까지의 전체 흐름 다이어그램</desc>
  <rect width="880" height="770" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- [사용자 입력] -->
  <rect x="360" y="30" width="160" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="55" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">[사용자 입력]</text>

  <!-- Downward Arrow 1 -->
  <path d="M440,70 L440,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 1: URL 파싱 -->
  <rect x="230" y="100" width="200" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="135" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">1. URL 파싱</text>
  
  <text x="450" y="125" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="start">문자열을 구조로 분해</text>
  <text x="450" y="147" fill="#52606d" font-size="12" text-anchor="start">scheme / host / port / path / query</text>

  <!-- Downward Arrow 2 -->
  <path d="M330,160 L330,200" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 2: DNS 조회 -->
  <rect x="230" y="200" width="200" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="235" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">2. DNS 조회</text>
  
  <text x="450" y="225" fill="#059669" font-size="13" font-weight="bold" text-anchor="start">이름(도메인) → 숫자(IP)</text>
  <text x="450" y="247" fill="#52606d" font-size="12" text-anchor="start">캐시 계층을 순서대로 확인</text>

  <!-- Downward Arrow 3 -->
  <path d="M330,260 L330,300" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 3: TCP 연결 -->
  <rect x="230" y="300" width="200" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="335" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">3. TCP 연결</text>
  
  <text x="450" y="325" fill="#d97706" font-size="13" font-weight="bold" text-anchor="start">신뢰할 수 있는 바이트 스트림 확보</text>
  <text x="450" y="347" fill="#52606d" font-size="12" text-anchor="start">3-way handshake (1 RTT)</text>

  <!-- Downward Arrow 4 -->
  <path d="M330,360 L330,400" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 4: TLS 협상 -->
  <rect x="230" y="400" width="200" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="330" y="435" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">4. TLS 협상</text>
  
  <text x="450" y="425" fill="#7c3aed" font-size="13" font-weight="bold" text-anchor="start">HTTPS인 경우에만</text>
  <text x="450" y="447" fill="#52606d" font-size="12" text-anchor="start">인증서 검증 + 세션 키 합의</text>

  <!-- Downward Arrow 5 -->
  <path d="M330,460 L330,500" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 5: HTTP 교환 -->
  <rect x="230" y="500" width="200" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="330" y="535" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">5. HTTP 교환</text>
  
  <text x="450" y="525" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="start">요청 전송 → 응답 수신</text>
  <text x="450" y="547" fill="#52606d" font-size="12" text-anchor="start">상태코드 · 헤더 · 본문</text>

  <!-- Downward Arrow 6 -->
  <path d="M330,560 L330,600" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 6: 렌더링 -->
  <rect x="230" y="600" width="200" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="635" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">6. 렌더링</text>
  
  <text x="450" y="625" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="start">바이트 → DOM/CSSOM → 레이아웃 → 픽셀</text>
  <text x="450" y="647" fill="#52606d" font-size="12" text-anchor="start">Critical Rendering Path</text>
</svg>