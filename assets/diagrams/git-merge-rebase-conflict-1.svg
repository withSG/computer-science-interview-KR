<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">경우 1: Fast-forward</title>
  <desc id="d">Git merge 실행 전과 실행 후의 Fast-forward 병합 동작 과정 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Left Column Zone: 실행 전 -->
  <rect x="24" y="24" width="396" height="292" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="44" y="58" font-size="16" font-weight="bold" fill="#1f2933">실행 전</text>

  <!-- Left Commits (c1 - - c2 - - c3) -->
  <path d="M 120 130 L 190 130" stroke="#52606d" stroke-width="2"/>
  <path d="M 230 130 L 300 130" stroke="#52606d" stroke-width="2"/>

  <!-- Commit c1 -->
  <circle cx="100" cy="130" r="20" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="100" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">c1</text>

  <!-- Commit c2 -->
  <circle cx="210" cy="130" r="20" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="210" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">c2</text>

  <!-- Commit c3 -->
  <circle cx="320" cy="130" r="20" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="320" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">c3</text>

  <!-- Pointer: main at c2 -->
  <path d="M 210 200 L 210 158" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="180" y="208" width="60" height="28" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="226" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">main</text>

  <!-- Pointer: feature at c3 -->
  <rect x="348" y="116" width="60" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="378" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">feature</text>

  <!-- Note: main이 feature의 조상 -->
  <text x="222" y="280" font-size="13" text-anchor="middle" fill="#52606d">main이 feature의 조상</text>


  <!-- Right Column Zone: 실행 후 (git merge feature) -->
  <rect x="460" y="24" width="396" height="292" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="480" y="58" font-size="16" font-weight="bold" fill="#1f2933">실행 후 (git merge feature)</text>

  <!-- Right Commits (c1 - - c2 - - c3) -->
  <path d="M 540 130 L 610 130" stroke="#52606d" stroke-width="2"/>
  <path d="M 650 130 L 720 130" stroke="#52606d" stroke-width="2"/>

  <!-- Commit c1 -->
  <circle cx="520" cy="130" r="20" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="520" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">c1</text>

  <!-- Commit c2 -->
  <circle cx="630" cy="130" r="20" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="630" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">c2</text>

  <!-- Commit c3 -->
  <circle cx="740" cy="130" r="20" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="740" y="134" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">c3</text>

  <!-- Pointers: main and feature both at c3 -->
  <path d="M 710 200 L 730 156" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="675" y="208" width="55" height="28" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="702.5" y="226" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">main</text>

  <path d="M 770 200 L 750 156" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
  <rect x="745" y="208" width="65" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="777.5" y="226" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">feature</text>

  <!-- Note: 새 커밋 없이 포인터만 전진 -->
  <text x="658" y="280" font-size="13" text-anchor="middle" fill="#52606d">새 커밋 없이 포인터만 전진</text>
</svg>