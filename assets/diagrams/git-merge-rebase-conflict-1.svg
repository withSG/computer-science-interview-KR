<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fast-forward 병합 전후</title>
  <desc id="d">main이 feature의 조상일 때 git merge feature를 실행하면 새 커밋 없이 main 포인터만 c2에서 c3로 전진한다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 실행 전 -->
  <rect x="24" y="24" width="832" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="92" font-size="20" font-weight="bold" fill="#1f2937">실행 전</text>
  <text x="48" y="124" font-size="15" fill="#4b5563">main이 feature의 조상</text>

  <line x1="324" y1="100" x2="396" y2="100" stroke="#64748b" stroke-width="2.5"/>
  <line x1="444" y1="100" x2="516" y2="100" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="300" cy="100" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="300" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c1</text>
  <circle cx="420" cy="100" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="420" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c2</text>
  <circle cx="540" cy="100" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="540" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c3</text>

  <line x1="594" y1="100" x2="572" y2="100" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <rect x="598" y="84" width="100" height="32" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="648" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#6d28d9">feature</text>

  <line x1="420" y1="148" x2="420" y2="130" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="380" y="152" width="80" height="32" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="420" y="174" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">main</text>

  <!-- 명령 -->
  <line x1="440" y1="202" x2="440" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <rect x="330" y="212" width="220" height="36" rx="18" fill="#1f2937"/>
  <text x="440" y="236" font-size="16" text-anchor="middle" fill="#ffffff" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git merge feature</text>

  <!-- 실행 후 -->
  <rect x="24" y="266" width="832" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="334" font-size="20" font-weight="bold" fill="#1f2937">실행 후</text>
  <text x="48" y="366" font-size="15" font-weight="bold" fill="#1d4ed8">새 커밋 없이 포인터만 전진</text>

  <line x1="324" y1="342" x2="396" y2="342" stroke="#64748b" stroke-width="2.5"/>
  <line x1="444" y1="342" x2="516" y2="342" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="300" cy="342" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="300" y="348" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c1</text>
  <circle cx="420" cy="342" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="420" y="348" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c2</text>
  <circle cx="540" cy="342" r="24" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="540" y="348" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">c3</text>

  <line x1="594" y1="342" x2="572" y2="342" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <rect x="598" y="326" width="100" height="32" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="648" y="348" font-size="16" font-weight="bold" text-anchor="middle" fill="#6d28d9">feature</text>

  <!-- main 옛 위치(점선) → 새 위치 -->
  <rect x="380" y="394" width="80" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="420" y="416" font-size="16" text-anchor="middle" fill="#64748b">main</text>
  <line x1="466" y1="410" x2="494" y2="410" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <line x1="540" y1="390" x2="540" y2="372" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="500" y="394" width="80" height="32" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="540" y="416" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">main</text>
</svg>
