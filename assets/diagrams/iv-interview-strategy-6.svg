<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대응 흐름</title>
  <desc id="d">모르는 질문을 만났을 때 대처하는 두 가지 전략과 단계를 나타낸 흐름도입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="720" fill="#ffffff"/>

  <!-- 시작 노드 -->
  <rect x="340" y="30" width="200" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="54.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">모르는 질문 도착</text>

  <!-- 선: 시작 노드 -> 조건 분기 -->
  <path d="M440,70 L440,90" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- 분기 노드: 용어 자체를 처음 듣는가? -->
  <rect x="300" y="90" width="280" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="116.2" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">용어 자체를 처음 듣는가?</text>

  <!-- 분기 선 및 라벨 -->
  <!-- 왼쪽 분기: 예 (200, 180) -->
  <path d="M370,134 L370,154 L200,154 L200,180" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="250" y="144" width="30" height="20" fill="#ffffff"/>
  <text x="265" y="158.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">예</text>

  <!-- 오른쪽 분기: 아니오 (680, 180) -->
  <path d="M510,134 L510,154 L680,154 L680,180" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="580" y="144" width="50" height="20" fill="#ffffff"/>
  <text x="605" y="158.0" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">아니오</text>

  <!-- [왼쪽 경로 1] 솔직히 밝히고 되묻는다 -->
  <rect x="80" y="180" width="240" height="130" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="208.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">솔직히 밝히고</text>
  <text x="200" y="232.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">되묻는다</text>
  <text x="200" y="256.55" font-size="13" fill="#52606d" text-anchor="middle">"처음 듣는</text>
  <text x="200" y="280.55" font-size="13" fill="#52606d" text-anchor="middle">용어인데,</text>
  <text x="200" y="304.55" font-size="13" fill="#52606d" text-anchor="middle">어떤 맥락</text>
  <text x="200" y="328.55" font-size="13" fill="#52606d" text-anchor="middle">에서 쓰나요"</text>

  <!-- 선: 왼쪽 1 -> 왼쪽 2 -->
  <path d="M200,340 L200,370" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- [왼쪽 경로 2] 힌트를 받아 그 자리에서 추론 시도 -->
  <rect x="80" y="370" width="240" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="402.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">힌트를 받아</text>
  <text x="200" y="426.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">그 자리에서</text>
  <text x="200" y="450.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">추론 시도</text>

  <!-- [오른쪽 경로 1] 아는 조각부터 꺼낸다 -->
  <rect x="540" y="180" width="280" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="680" y="208.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">아는 조각부터 꺼낸다</text>
  <text x="680" y="232.55" font-size="13" fill="#52606d" text-anchor="middle">"정확히는 모르지만</text>
  <text x="680" y="256.55" font-size="13" fill="#52606d" text-anchor="middle">이름으로 추측하면"</text>

  <!-- 선: 오른쪽 1 -> 오른쪽 2 -->
  <path d="M680,270 L680,300" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- [오른쪽 경로 2] 인접 지식으로 연결 -->
  <rect x="540" y="300" width="280" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="680" y="328.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">인접 지식으로 연결</text>
  <text x="680" y="352.55" font-size="13" fill="#52606d" text-anchor="middle">"비슷한 문제를 X로</text>
  <text x="680" y="376.55" font-size="13" fill="#52606d" text-anchor="middle">풀어본 적은 있는데"</text>

  <!-- 선: 오른쪽 2 -> 오른쪽 3 -->
  <path d="M680,390 L680,420" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- [오른쪽 경로 3] 경계를 명시한다 -->
  <rect x="540" y="420" width="280" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="680" y="448.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">경계를 명시한다</text>
  <text x="680" y="472.55" font-size="13" fill="#52606d" text-anchor="middle">"여기까지는 확신하고</text>
  <text x="680" y="496.55" font-size="13" fill="#52606d" text-anchor="middle">이 뒤는 추측입니다"</text>

  <!-- 선: 왼쪽 2 -> 오른쪽 3 (합류) -->
  <path d="M200,460 L200,470 L540,470" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 선: 오른쪽 3 -> 최종 노드 -->
  <path d="M680,510 L680,550" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- [최종 노드] 끝나고 반드시 찾아본다 -->
  <rect x="540" y="550" width="280" height="80" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="680" y="582.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">끝나고 반드시 찾아본다</text>
  <text x="680" y="606.55" font-size="13" fill="#52606d" text-anchor="middle">(복기 항목에 기록)</text>
</svg>