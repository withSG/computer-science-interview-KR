<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">모르는 질문 대응 흐름</title>
  <desc id="d">모르는 질문이 오면 용어 자체를 처음 듣는지로 갈립니다. 처음 들으면 솔직히 밝히고 되물은 뒤 힌트로 추론하고, 아니면 아는 조각을 꺼내 인접 지식으로 연결합니다. 두 길 모두 경계를 명시한 뒤, 끝나고 반드시 찾아보며 복기 항목에 기록합니다.</desc>
  <rect width="880" height="680" fill="#ffffff"/>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="330" y="24" width="220" height="44" rx="22" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="52" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">모르는 질문 도착</text>
  <path d="M440,68 L440,85" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr-g)"/>

  <!-- 분기 -->
  <polygon points="440,90 620,140 440,190 260,140" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="146" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">용어 자체를 처음 듣는가?</text>

  <path d="M260,140 L220,140 L220,211" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr-y)"/>
  <text x="232" y="186" font-size="16" font-weight="bold" fill="#1d4ed8">예</text>
  <path d="M620,140 L660,140 L660,211" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-n)"/>
  <text x="648" y="186" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">아니오</text>

  <!-- 예: 왼쪽 길 -->
  <rect x="40" y="216" width="360" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="220" y="247" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">솔직히 밝히고 되묻는다</text>
  <text x="220" y="277" font-size="15" fill="#374151" text-anchor="middle">"처음 듣는 용어인데, 어떤 맥락에서 쓰나요"</text>
  <path d="M220,300 L220,323" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr-y)"/>
  <rect x="40" y="328" width="360" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="220" y="376" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">힌트를 받아 그 자리에서 추론 시도</text>

  <!-- 아니오: 오른쪽 길 -->
  <rect x="480" y="216" width="360" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="660" y="247" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">아는 조각부터 꺼낸다</text>
  <text x="660" y="277" font-size="15" fill="#374151" text-anchor="middle">"정확히는 모르지만 이름으로 추측하면"</text>
  <path d="M660,300 L660,323" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-n)"/>
  <rect x="480" y="328" width="360" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="660" y="359" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">인접 지식으로 연결</text>
  <text x="660" y="389" font-size="15" fill="#374151" text-anchor="middle">"비슷한 문제를 X로 풀어본 적은 있는데"</text>

  <!-- 합류 -->
  <path d="M220,412 L220,434 L380,434 L380,455" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr-y)"/>
  <path d="M660,412 L660,434 L500,434 L500,455" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-n)"/>

  <rect x="260" y="460" width="360" height="84" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="440" y="491" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">경계를 명시한다</text>
  <text x="440" y="521" font-size="15" fill="#374151" text-anchor="middle">"여기까지는 확신하고 이 뒤는 추측입니다"</text>
  <path d="M440,544 L440,567" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr-g)"/>

  <rect x="260" y="572" width="360" height="84" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="605" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">끝나고 반드시 찾아본다</text>
  <text x="440" y="633" font-size="15" fill="#374151" text-anchor="middle">(복기 항목에 기록)</text>
</svg>
