<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">오토스케일링 지연 단계를 나타낸 타임라인</title>
  <desc id="d">트래픽 급증 시작부터 헬스체크 통과까지 오토스케일링의 지연 과정을 단계별로 나타낸 다이어그램입니다.</desc>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 메인 프로세스 카드 영역 -->
  <rect x="40" y="30" width="800" height="310" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 메인 수직 타임라인 축 -->
  <path d="M 120,60 L 120,310" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 단계 0: t=0 트래픽 급증 시작 -->
  <circle cx="120" cy="70" r="7" fill="#dc2626"/>
  <rect x="135" y="58" width="36" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="153" y="74.5" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">t=0</text>
  <text x="181" y="74.5" font-size="14" font-weight="bold" fill="#dc2626">트래픽 급증 시작</text>

  <!-- 단계 1: +? 메트릭 수집·집계 지연 -->
  <circle cx="120" cy="115" r="5" fill="#2563eb"/>
  <rect x="135" y="103" width="28" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="149" y="119.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">+?</text>

  <rect x="171" y="100" width="640" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="183" y="119.5" font-size="13" fill="#1f2933">메트릭 수집·집계 지연</text>
  <text x="325" y="119.5" font-size="11.5" fill="#52606d">(지표를 긁어와 평균 내는 시간)</text>

  <!-- 단계 2: +? 스케일링 조건 충족 판정 -->
  <circle cx="120" cy="160" r="5" fill="#2563eb"/>
  <rect x="135" y="148" width="28" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="149" y="164.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">+?</text>

  <rect x="171" y="145" width="640" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="183" y="164.5" font-size="13" fill="#1f2933">스케일링 조건 충족 판정</text>
  <text x="338" y="164.5" font-size="11.5" fill="#52606d">(진동 방지를 위한 "N분간 초과" 조건)</text>

  <!-- 단계 3: +? 인스턴스 프로비저닝 + 부팅 -->
  <circle cx="120" cy="205" r="5" fill="#2563eb"/>
  <rect x="135" y="193" width="28" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="149" y="209.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">+?</text>

  <rect x="171" y="190" width="640" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="183" y="209.5" font-size="13" fill="#1f2933">인스턴스 프로비저닝 + 부팅</text>

  <!-- 단계 4: +? 기동 -->
  <circle cx="120" cy="250" r="5" fill="#2563eb"/>
  <rect x="135" y="238" width="28" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="149" y="254.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">+?</text>

  <rect x="171" y="235" width="640" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="183" y="254.5" font-size="13" fill="#1f2933">기동: 커넥션 풀 생성, 캐시 로딩, JIT 워밍업</text>

  <!-- 단계 5: +? 헬스체크 통과 → 그제서야 트래픽 투입 -->
  <circle cx="120" cy="295" r="5" fill="#059669"/>
  <rect x="135" y="283" width="28" height="24" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="149" y="299.5" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">+?</text>

  <rect x="171" y="280" width="640" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="183" y="299.5" font-size="13" font-weight="bold" fill="#059669">헬스체크 통과</text>
  <path d="M 276,295 L 296,295" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="306" y="299.5" font-size="13" fill="#1f2933">그제서야 트래픽 투입</text>

  <!-- 구분선 -->
  <line x1="60" y1="360" x2="820" y2="360" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- 결론 / 경고 영역 -->
  <rect x="40" y="375" width="800" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="440" y="399.5" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">현실적으로 수 분. 그동안 기존 인스턴스는 이미 무너져 있다.</text>
</svg>