<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">오토스케일링 지연 단계 타임라인</title>
  <desc id="d">트래픽 급증(t=0) 뒤 메트릭 수집·집계, 스케일링 조건 판정, 프로비저닝과 부팅, 기동, 헬스체크 통과까지 길이를 알 수 없는 지연(+?)이 차례로 쌓여 현실적으로 수 분이 걸리고, 그동안 기존 인스턴스는 이미 무너져 있다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 행 줄무늬 -->
  <rect x="24" y="96" width="832" height="56" fill="#f3f4f6"/>
  <rect x="24" y="208" width="832" height="56" fill="#f3f4f6"/>
  <rect x="24" y="320" width="832" height="56" fill="#f3f4f6"/>

  <!-- t=0 기준선과 시간 축 -->
  <path d="M384,76 V396" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M396,68 H830" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar-gray)"/>
  <text x="836" y="56" font-size="14" fill="#4b5563" text-anchor="end">시간</text>

  <!-- 행 0: t=0 -->
  <rect x="40" y="54" width="46" height="28" rx="5" fill="#b91c1c"/>
  <text x="63" y="73.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">t=0</text>
  <text x="98" y="74" font-size="17" font-weight="bold" fill="#b91c1c">트래픽 급증 시작</text>
  <circle cx="384" cy="68" r="7" fill="#b91c1c"/>

  <!-- 행 1 -->
  <text x="52" y="119" font-size="16" font-weight="bold" fill="#1f2937">메트릭 수집·집계 지연</text>
  <text x="52" y="141" font-size="14" fill="#4b5563">(지표를 긁어와 평균 내는 시간)</text>
  <rect x="384" y="110" width="72" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="420" y="129.5" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">+?</text>

  <!-- 행 2 -->
  <text x="52" y="175" font-size="16" font-weight="bold" fill="#1f2937">스케일링 조건 충족 판정</text>
  <text x="52" y="197" font-size="14" fill="#4b5563">(진동 방지를 위한 "N분간 초과" 조건)</text>
  <path d="M456,139 V165" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
  <rect x="456" y="166" width="72" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="492" y="185.5" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">+?</text>

  <!-- 행 3 -->
  <text x="52" y="241.5" font-size="16" font-weight="bold" fill="#1f2937">인스턴스 프로비저닝 + 부팅</text>
  <path d="M528,195 V221" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
  <rect x="528" y="222" width="72" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="564" y="241.5" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">+?</text>

  <!-- 행 4 -->
  <text x="52" y="287" font-size="16" font-weight="bold" fill="#1f2937">기동</text>
  <text x="52" y="309" font-size="14" fill="#4b5563">커넥션 풀 생성, 캐시 로딩, JIT 워밍업</text>
  <path d="M600,251 V277" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
  <rect x="600" y="278" width="72" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="636" y="297.5" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">+?</text>

  <!-- 행 5 -->
  <text x="52" y="353.5" font-size="16" font-weight="bold" fill="#1f2937">헬스체크 통과 → <tspan fill="#047857">그제야 트래픽 투입</tspan></text>
  <path d="M672,307 V333" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>
  <rect x="672" y="334" width="72" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="708" y="353.5" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">+?</text>
  <circle cx="752" cy="348" r="7" fill="#047857"/>
  <path d="M744,363 V396" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <!-- 합계 -->
  <path d="M384,392 V402 H744 V392 M564,402 V412" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <text x="564" y="436" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">현실적으로 수 분</text>
  <rect x="384" y="450" width="360" height="42" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="564" y="476" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">그동안 기존 인스턴스는 이미 무너져 있다</text>
</svg>
