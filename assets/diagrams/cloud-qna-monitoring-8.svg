<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Context Propagation</title>
  <desc id="d">서비스 A, B, C 간의 Context Propagation 다이어그램과 HTTP Headers 전파 예시</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#ffffff"/>

  <!-- Title Section -->
  <text x="40" y="45.6" font-size="16" font-weight="bold" fill="#1f2933">Context Propagation</text>

  <!-- Service Flow Boxes -->
  <rect x="80" y="75" width="160" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="104.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서비스 A</text>

  <path d="M240,100 L350,100" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="360" y="75" width="160" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="104.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서비스 B</text>

  <path d="M520,100 L630,100" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="640" y="75" width="160" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="104.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서비스 C</text>

  <!-- Content Group Container -->
  <rect x="40" y="155" width="800" height="225" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Section 1: HTTP Headers Propagation -->
  <text x="60" y="184.9" font-size="14" font-weight="bold" fill="#1f2933">HTTP Headers로 전파:</text>

  <rect x="60" y="195" width="760" height="65" rx="4" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="80" y="221.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">traceparent: 00-{trace-id}-{span-id}-01</text>
  <text x="80" y="245.55" font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">tracestate: vendor=value</text>

  <!-- Section 2: Example -->
  <text x="60" y="294.9" font-size="14" font-weight="bold" fill="#1f2933">예시:</text>

  <rect x="60" y="305" width="760" height="50" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="80" y="334.2" font-size="12" font-family="'Consolas', 'Courier New', monospace" fill="#059669">traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01</text>
</svg>