<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레이어드와 헥사고날의 의존 방향 비교</title>
  <desc id="d">레이어드에서는 Controller → Service → JpaRepository → DB로 의존이 아래로 흘러 도메인이 기술을 의존한다. 헥사고날에서는 Web·JPA·Kafka·외부 API 어댑터가 모두 포트(인터페이스)를 향해 안쪽으로 의존하고, 가운데 도메인/유스케이스는 기술을 모른다.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- ───── 레이어드 ───── -->
  <rect x="24" y="24" width="360" height="492" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="60" font-size="19" font-weight="bold" fill="#111827">레이어드</text>
  <text x="134" y="60" font-size="15" fill="#374151">의존이 아래로 흐른다</text>

  <rect x="48" y="100" width="180" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="138" y="128" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Controller</text>
  <path d="M138,146 V201" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>

  <rect x="48" y="204" width="180" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="138" y="232" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">Service</text>
  <path d="M138,250 V305" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <text x="156" y="283" font-size="15" font-weight="bold" fill="#b91c1c">도메인이 기술을 의존한다</text>

  <rect x="48" y="308" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="138" y="336" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">JpaRepository</text>
  <path d="M138,354 V409" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>

  <rect x="48" y="412" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="138" y="440" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">DB</text>

  <!-- ───── 헥사고날 ───── -->
  <rect x="400" y="24" width="456" height="492" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="60" font-size="19" font-weight="bold" fill="#111827">헥사고날</text>
  <text x="510" y="60" font-size="15" fill="#374151">의존이 안쪽으로만 향한다</text>

  <rect x="453" y="88" width="150" height="40" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="528" y="114" font-size="16" text-anchor="middle" fill="#111827">Web 어댑터</text>
  <rect x="653" y="88" width="150" height="40" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="728" y="114" font-size="16" text-anchor="middle" fill="#111827">JPA 어댑터</text>

  <path d="M528,130 V161" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <path d="M728,130 V161" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <polygon points="428,274 488,164 768,164 828,274 768,384 488,384" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="628" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#6d28d9">포트(인터페이스)</text>
  <rect x="528" y="220" width="200" height="108" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="628" y="268" font-size="17" font-weight="bold" text-anchor="middle" fill="#047857">도메인/유스케이스</text>
  <text x="628" y="296" font-size="15" text-anchor="middle" fill="#047857">기술을 모른다</text>

  <path d="M528,418 V387" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <path d="M728,418 V387" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <rect x="453" y="420" width="150" height="40" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="528" y="446" font-size="16" text-anchor="middle" fill="#111827">Kafka 어댑터</text>
  <rect x="653" y="420" width="150" height="40" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="728" y="446" font-size="16" text-anchor="middle" fill="#111827">외부 API 어댑터</text>

  <text x="628" y="494" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">모든 화살표가 안쪽을 향한다</text>
</svg>
