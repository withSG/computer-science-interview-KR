<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 답변 예시</title>
  <desc id="d">결제 API 타임아웃 장애의 진단, 원인, 해결 및 결과를 나타낸 구조화된 다이어그램</desc>
  <rect width="880" height="630" fill="#ffffff"/>

  <!-- 메인 제목 -->
  <text x="40" y="44.6" font-size="16" font-weight="bold" fill="#1f2933">### 면접 답변 예시</text>

  <!-- 메인 발언 상자 (큰따옴표 포함 문구) -->
  <rect x="40" y="60" width="800" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="96.55" font-size="13" fill="#1f2933">"결제 API에서 간헐적으로 타임아웃이 발생했습니다.</text>

  <!-- Section 1: 진단 (주황/경고 계열) -->
  <rect x="40" y="140" width="800" height="120" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="169.9" font-size="14" font-weight="bold" fill="#d97706">진단:</text>
  <text x="60" y="194.55" font-size="13" fill="#1f2933">1. 에러 로그에서 'Connection pool exhausted' 확인</text>
  <text x="60" y="219.55" font-size="13" fill="#1f2933">2. DB processlist 확인 → 대부분 Sleep 상태로 대기 중</text>
  <text x="60" y="244.55" font-size="13" fill="#1f2933">3. 슬로우 쿼리 로그 → 특정 조회 쿼리 20초 소요</text>

  <!-- Section 2: 원인 (빨강/문제 계열) -->
  <rect x="40" y="280" width="800" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="309.9" font-size="14" font-weight="bold" fill="#dc2626">원인:</text>
  <text x="60" y="334.55" font-size="13" fill="#1f2933">결제 내역 조회 시 1년치 데이터를 풀스캔하고 있었음</text>

  <!-- Section 3: 해결 (파랑/조치 계열) -->
  <rect x="40" y="370" width="800" height="120" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="399.9" font-size="14" font-weight="bold" fill="#2563eb">해결:</text>
  <text x="60" y="424.55" font-size="13" fill="#1f2933">1. 날짜 컬럼에 인덱스 추가 (20초 → 0.1초)</text>
  <text x="60" y="449.55" font-size="13" fill="#1f2933">2. HikariCP leak detection 활성화</text>
  <text x="60" y="474.55" font-size="13" fill="#1f2933">3. 커넥션 풀 모니터링 대시보드 추가</text>

  <!-- Section 4: 결과 (초록/성공 계열) -->
  <rect x="40" y="510" width="800" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="539.9" font-size="14" font-weight="bold" fill="#059669">결과:</text>
  <text x="60" y="564.55" font-size="13" fill="#1f2933">커넥션 고갈 재발 없음, 조회 성능 200배 개선"</text>
</svg>