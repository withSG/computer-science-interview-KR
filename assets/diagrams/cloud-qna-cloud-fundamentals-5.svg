<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">전가상화 동작 방식</title>
  <desc id="d">전가상화에서는 Guest OS가 특권 명령을 그대로 실행하고 Hypervisor가 이를 에뮬레이션한다. 그래서 Guest OS는 자신이 가상 환경에 있음을 모른다.</desc>
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="40" y="42" font-size="18" font-weight="bold" fill="#111827">전가상화 (Full)</text>

  <!-- Guest OS -->
  <rect x="40" y="64" width="220" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="102" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Guest OS</text>
  <text x="150" y="132" font-size="15" fill="#374151" text-anchor="middle">수정 불필요</text>

  <!-- 특권 명령 -->
  <path d="M266,108 L370,108" stroke="#b45309" stroke-width="2" fill="none"/>
  <rect x="370" y="90" width="140" height="36" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="114" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">특권 명령</text>
  <path d="M510,108 L612,108" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Hypervisor -->
  <rect x="620" y="64" width="220" height="88" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="730" y="102" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Hypervisor</text>
  <text x="730" y="132" font-size="15" fill="#374151" text-anchor="middle">에뮬레이션</text>

  <!-- 결과 -->
  <rect x="40" y="176" width="800" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="56" y="186" width="60" height="30" rx="6" fill="#374151"/>
  <text x="86" y="206" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">결과</text>
  <text x="132" y="207" font-size="17" fill="#111827">Guest OS는 가상 환경임을 <tspan font-weight="bold" fill="#b91c1c">모름</tspan></text>
</svg>
