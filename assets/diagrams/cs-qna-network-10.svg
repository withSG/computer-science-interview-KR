<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DNS 조회 과정</title>
  <desc id="d">도메인의 IP 주소를 찾을 때 브라우저 캐시, OS 캐시, 라우터 캐시, ISP DNS, Root DNS, TLD DNS, 권한 있는 DNS 순서로 조회하는 일곱 단계.</desc>
  <rect width="880" height="200" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 묶음: 캐시 / DNS 서버 -->
  <path d="M27,66 L27,58 L365,58 L365,66" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="196" y="48" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">캐시</text>
  <path d="M393,66 L393,58 L853,58 L853,66" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="623" y="48" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">DNS 서버</text>

  <!-- 조회 단계 (1 → 7) -->
  <rect x="27" y="78" width="94" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="74" y="104" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1</text>
  <text x="74" y="134" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">브라우저</text>
  <text x="74" y="156" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">캐시</text>
  <line x1="125" y1="126" x2="146" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="149" y="78" width="94" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="196" y="104" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2</text>
  <text x="196" y="134" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">OS</text>
  <text x="196" y="156" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">캐시</text>
  <line x1="247" y1="126" x2="268" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="271" y="78" width="94" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="318" y="104" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">3</text>
  <text x="318" y="134" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">라우터</text>
  <text x="318" y="156" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">캐시</text>
  <line x1="369" y1="126" x2="390" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="393" y="78" width="94" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="104" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">4</text>
  <text x="440" y="134" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">ISP</text>
  <text x="440" y="156" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">DNS</text>
  <line x1="491" y1="126" x2="512" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="515" y="78" width="94" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="562" y="104" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">5</text>
  <text x="562" y="134" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Root</text>
  <text x="562" y="156" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">DNS</text>
  <line x1="613" y1="126" x2="634" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="637" y="78" width="94" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="684" y="104" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">6</text>
  <text x="684" y="134" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">TLD</text>
  <text x="684" y="156" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">DNS</text>
  <line x1="735" y1="126" x2="756" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="759" y="78" width="94" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="806" y="104" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">7</text>
  <text x="806" y="134" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">권한 있는</text>
  <text x="806" y="156" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">DNS</text>
</svg>
