<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">퀴즈 2 async/await 실행 추적</title>
  <desc id="d">동기 실행 동안 start, A, B, end가 출력되고 await 뒤의 나머지(resumeRun)와 D가 마이크로 큐에 쌓인 뒤, 콜 스택이 비면 resumeRun이 C를, 그다음 D가 실행되는 과정을 단계별 표로 보여준다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>

  <!-- 머리행 -->
  <rect x="24" y="24" width="832" height="36" fill="#e5e7eb"/>
  <text x="76" y="47" font-size="15" font-weight="bold" fill="#111827">실행 흐름</text>
  <text x="570" y="47" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">출력</text>
  <text x="638" y="47" font-size="15" font-weight="bold" fill="#111827">마이크로 큐</text>

  <!-- 구간 A: 동기 실행 -->
  <rect x="24" y="60" width="832" height="36" fill="#f3f4f6"/>
  <text x="40" y="83" font-size="15" font-weight="bold" fill="#374151">동기 실행</text>

  <!-- 3행 강조 면 -->
  <rect x="24" y="184" width="832" height="88" fill="#fffbeb"/>

  <!-- 구간 B: 콜 스택 비었음 → 마이크로태스크 소진 -->
  <rect x="24" y="404" width="832" height="36" fill="#d1fae5"/>
  <text x="40" y="427" font-size="15" font-weight="bold" fill="#065f46">콜 스택 비었음 → 마이크로태스크 소진</text>

  <!-- 행 구분선 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="24" y1="140" x2="856" y2="140"/>
    <line x1="24" y1="184" x2="856" y2="184"/>
    <line x1="24" y1="272" x2="856" y2="272"/>
    <line x1="24" y1="316" x2="856" y2="316"/>
    <line x1="24" y1="360" x2="856" y2="360"/>
    <line x1="24" y1="484" x2="856" y2="484"/>
  </g>
  <!-- 열 구분선 -->
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="516" y1="24" x2="516" y2="60"/>
    <line x1="624" y1="24" x2="624" y2="60"/>
    <line x1="516" y1="96" x2="516" y2="404"/>
    <line x1="624" y1="96" x2="624" y2="404"/>
    <line x1="516" y1="440" x2="516" y2="528"/>
    <line x1="624" y1="440" x2="624" y2="528"/>
  </g>
  <line x1="24" y1="60" x2="856" y2="60" stroke="#9ca3af" stroke-width="1"/>

  <!-- 단계 번호 -->
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="44" cy="118" r="12" fill="#374151"/>
    <text x="44" y="123">1</text>
    <circle cx="44" cy="162" r="12" fill="#374151"/>
    <text x="44" y="167">2</text>
    <circle cx="44" cy="204" r="12" fill="#374151"/>
    <text x="44" y="209">3</text>
    <circle cx="44" cy="294" r="12" fill="#374151"/>
    <text x="44" y="299">4</text>
    <circle cx="44" cy="338" r="12" fill="#374151"/>
    <text x="44" y="343">5</text>
    <circle cx="44" cy="382" r="12" fill="#374151"/>
    <text x="44" y="387">6</text>
    <circle cx="44" cy="462" r="12" fill="#047857"/>
    <text x="44" y="467">7</text>
    <circle cx="44" cy="506" r="12" fill="#047857"/>
    <text x="44" y="511">8</text>
  </g>

  <!-- 실행 흐름 -->
  <g font-size="15" fill="#111827">
    <text x="76" y="123">'start' 출력</text>
    <text x="76" y="167"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">run()</tspan> 호출 → 'A' 출력</text>
    <text x="104" y="209" font-weight="bold" fill="#92400e"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">await null</tspan> 만남 → 함수 실행 중단</text>
    <text x="104" y="231">나머지(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">console.log('C')</tspan>)를 마이크로태스크로 예약</text>
    <text x="104" y="253" fill="#92400e"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">run()</tspan>은 여기서 즉시 반환된다</text>
    <text x="76" y="299">'B' 출력</text>
    <text x="76" y="343"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Promise.resolve().then(D)</tspan> 등록</text>
    <text x="76" y="387">'end' 출력</text>
    <text x="76" y="467"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#b45309">resumeRun</tspan> 실행 → 'C' 출력</text>
    <text x="76" y="511">그다음 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#6d28d9">D</tspan> 실행 → 'D' 출력</text>
  </g>
  <!-- run() 안에서 이어지는 단계 -->
  <path d="M86,174 V204 H96" stroke="#b45309" stroke-width="1.5" fill="none"/>

  <!-- 출력 열 -->
  <g font-size="15" font-weight="bold" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">
    <text x="570" y="123">'start'</text>
    <text x="570" y="167">'A'</text>
    <text x="570" y="231" font-weight="normal" fill="#4b5563">—</text>
    <text x="570" y="299">'B'</text>
    <text x="570" y="343" font-weight="normal" fill="#4b5563">—</text>
    <text x="570" y="387">'end'</text>
    <text x="570" y="467" fill="#b45309">'C'</text>
    <text x="570" y="511" fill="#6d28d9">'D'</text>
  </g>

  <!-- 마이크로 큐 열 -->
  <g font-size="15" fill="#4b5563">
    <text x="638" y="123">비어 있음</text>
    <text x="638" y="167">비어 있음</text>
    <text x="638" y="511">비어 있음</text>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <!-- 3행 -->
    <rect x="638" y="213" width="100" height="26" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="688" y="231" fill="#b45309">resumeRun</text>
    <!-- 4행 -->
    <rect x="638" y="281" width="100" height="26" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="688" y="299" fill="#b45309">resumeRun</text>
    <!-- 5행 -->
    <rect x="638" y="325" width="100" height="26" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="688" y="343" fill="#b45309">resumeRun</text>
    <rect x="746" y="325" width="34" height="26" rx="5" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="763" y="343" fill="#6d28d9">D</text>
    <!-- 6행 -->
    <rect x="638" y="369" width="100" height="26" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="688" y="387" fill="#b45309">resumeRun</text>
    <rect x="746" y="369" width="34" height="26" rx="5" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="763" y="387" fill="#6d28d9">D</text>
    <!-- 7행 -->
    <rect x="638" y="449" width="34" height="26" rx="5" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="655" y="467" fill="#6d28d9">D</text>
  </g>

  <!-- 바깥 테두리 -->
  <rect x="24" y="24" width="832" height="504" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
</svg>
