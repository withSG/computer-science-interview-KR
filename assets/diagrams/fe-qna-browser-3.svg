<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CRP 단계</title>
  <desc id="d">HTML 파싱, DOM 트리 구축, CSS 파싱을 받은 CSSOM 트리 구축, DOM과 CSSOM을 합친 Render Tree 생성, Layout(Reflow), Paint, Composite로 이어지는 Critical Rendering Path 단계.</desc>
  <rect width="880" height="610" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <g transform="translate(24,0)">
  <!-- 단계 묶음 (왼쪽 괄호 + 이름) -->
  <path d="M186,30 L176,30 L176,216 L186,216" stroke="#2563eb" stroke-width="2" fill="none"/>
  <text x="164" y="128" text-anchor="end" font-size="15" font-weight="700" fill="#1d4ed8">DOM/CSSOM 구축</text>

  <path d="M186,246 L176,246 L176,306 L186,306" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <text x="164" y="281" text-anchor="end" font-size="15" font-weight="700" fill="#6d28d9">트리 결합</text>

  <path d="M186,336 L176,336 L176,576 L186,576" stroke="#059669" stroke-width="2" fill="none"/>
  <text x="164" y="461" text-anchor="end" font-size="15" font-weight="700" fill="#047857">화면 렌더링 단계</text>

  <!-- 1. HTML 파싱 -->
  <rect x="200" y="28" width="340" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="228" cy="51" r="13" fill="#1d4ed8"/>
  <text x="228" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="370" y="57" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">HTML 파싱</text>

  <path d="M370,76 L370,97" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 2. DOM 트리 구축 -->
  <rect x="200" y="100" width="340" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="228" cy="123" r="13" fill="#1d4ed8"/>
  <text x="228" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="370" y="129" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">DOM 트리 구축</text>

  <path d="M370,148 L370,169" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 3. CSSOM 트리 구축 ← CSS 파싱 -->
  <rect x="200" y="172" width="340" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="228" cy="195" r="13" fill="#1d4ed8"/>
  <text x="228" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="370" y="201" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">CSSOM 트리 구축</text>

  <path d="M618,195 L544,195" stroke="#b45309" stroke-width="1.5" fill="none" marker-end="url(#ah-amber)"/>
  <rect x="622" y="172" width="160" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="702" y="201" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">CSS 파싱</text>

  <path d="M370,220 L370,241" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 4. Render Tree 생성 -->
  <rect x="200" y="244" width="340" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="228" cy="276" r="13" fill="#6d28d9"/>
  <text x="228" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="370" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Render Tree 생성</text>
  <text x="370" y="294" text-anchor="middle" font-size="15" fill="#374151">DOM + CSSOM</text>

  <path d="M370,310 L370,331" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 5. Layout (Reflow) -->
  <rect x="200" y="334" width="340" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="228" cy="366" r="13" fill="#047857"/>
  <text x="228" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="370" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Layout (Reflow)</text>
  <text x="370" y="384" text-anchor="middle" font-size="15" fill="#374151">요소 크기와 위치 계산</text>

  <path d="M370,400 L370,421" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 6. Paint -->
  <rect x="200" y="424" width="340" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="228" cy="456" r="13" fill="#047857"/>
  <text x="228" y="461" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text x="370" y="450" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Paint</text>
  <text x="370" y="474" text-anchor="middle" font-size="15" fill="#374151">픽셀로 변환</text>

  <path d="M370,490 L370,511" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 7. Composite -->
  <rect x="200" y="514" width="340" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="228" cy="546" r="13" fill="#047857"/>
  <text x="228" y="551" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
  <text x="370" y="540" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Composite</text>
  <text x="370" y="564" text-anchor="middle" font-size="15" fill="#374151">레이어 합성</text>
  </g>
</svg>
