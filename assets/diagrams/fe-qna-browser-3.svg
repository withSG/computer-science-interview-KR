<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CRP 단계</title>
  <desc id="d">브라우저의 Critical Rendering Path(CRP) 주요 단계를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="880" height="730" fill="#ffffff"/>
  
  <!-- 원본 외곽 상자 (┌─ ... ─┐) -->
  <rect x="30" y="30" width="820" height="670" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 1. HTML 파싱 -->
  <rect x="230" y="65" width="420" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="94" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">HTML 파싱</text>

  <!-- ↓ -->
  <path d="M440,113 L440,137" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 2. DOM 트리 구축 -->
  <rect x="230" y="139" width="420" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="168" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">DOM 트리 구축</text>

  <!-- ↓ -->
  <path d="M440,187 L440,211" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 3. CSSOM 트리 구축 ← CSS 파싱 -->
  <rect x="190" y="213" width="300" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="242" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">CSSOM 트리 구축</text>

  <path d="M520,237 L498,237" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <rect x="528" y="213" width="160" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="608" y="242" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">CSS 파싱</text>

  <!-- ↓ -->
  <path d="M440,261 L440,285" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 4. Render Tree 생성 (DOM + CSSOM) -->
  <rect x="180" y="287" width="520" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="318" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Render Tree 생성 (DOM + CSSOM)</text>

  <!-- ↓ -->
  <path d="M440,339 L440,363" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 5. Layout (Reflow) - 요소 크기와 위치 계산 -->
  <rect x="150" y="365" width="580" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="396" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Layout (Reflow) - 요소 크기와 위치 계산</text>

  <!-- ↓ -->
  <path d="M440,417 L440,441" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 6. Paint - 픽셀로 변환 -->
  <rect x="210" y="443" width="460" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="474" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Paint - 픽셀로 변환</text>

  <!-- ↓ -->
  <path d="M440,495 L440,519" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 7. Composite - 레이어 합성 -->
  <rect x="230" y="521" width="420" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="552" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Composite - 레이어 합성</text>

  <!-- 범례 -->
  <rect x="180" y="615" width="520" height="50" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="200" y="632" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb"/>
  <text x="222" y="645" font-size="11.5" fill="#52606d">DOM/CSSOM 구축</text>

  <rect x="360" y="632" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="382" y="645" font-size="11.5" fill="#52606d">트리 결합</text>

  <rect x="480" y="632" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="502" y="645" font-size="11.5" fill="#52606d">화면 렌더링 단계</text>
</svg>