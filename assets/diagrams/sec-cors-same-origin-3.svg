<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Simple Request와 Preflight 분기 조건</title>
  <desc id="d">요청이 메서드, 직접 설정한 헤더, Content-Type 세 조건을 모두 만족하면 Simple Request로 바로 본 요청을 보내고, 하나라도 어기면 OPTIONS로 허가를 확인하는 Preflight를 먼저 보낸다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>

  <defs>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 질문 -->
  <text x="440" y="44" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">요청이 아래 조건을 <tspan fill="#b91c1c">"모두"</tspan> 만족하는가?</text>

  <!-- 조건 박스 -->
  <rect x="40" y="68" width="800" height="256" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>

  <!-- ① 메서드 -->
  <circle cx="80" cy="100" r="16" fill="#374151"/>
  <text x="80" y="106" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="112" y="106" font-size="17" font-weight="bold" fill="#111827">메서드가 GET, HEAD, POST 중 하나</text>

  <line x1="60" y1="130" x2="820" y2="130" stroke="#d1d5db" stroke-width="1"/>

  <!-- ② 헤더 -->
  <circle cx="80" cy="162" r="16" fill="#374151"/>
  <text x="80" y="168" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="112" y="168" font-size="17" font-weight="bold" fill="#111827">직접 설정한 헤더가 안전 목록 안에만 있다</text>
  <rect x="112" y="184" width="76" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="150" y="204" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Accept</text>
  <rect x="198" y="184" width="150" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="273" y="204" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Accept-Language</text>
  <rect x="358" y="184" width="158" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="437" y="204" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Content-Language</text>
  <rect x="526" y="184" width="126" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="589" y="204" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Content-Type</text>

  <line x1="60" y1="228" x2="820" y2="228" stroke="#d1d5db" stroke-width="1"/>

  <!-- ③ Content-Type -->
  <circle cx="80" cy="260" r="16" fill="#374151"/>
  <text x="80" y="266" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="112" y="266" font-size="17" font-weight="bold" fill="#111827">Content-Type이 아래 셋 중 하나</text>
  <rect x="112" y="280" width="298" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="261" y="300" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">application/x-www-form-urlencoded</text>
  <rect x="420" y="280" width="184" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="512" y="300" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">multipart/form-data</text>
  <rect x="614" y="280" width="110" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="669" y="300" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">text/plain</text>

  <!-- 분기 화살표 -->
  <line x1="240" y1="326" x2="240" y2="396" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <text x="256" y="368" font-size="17" font-weight="bold" fill="#047857">모두 예</text>

  <line x1="640" y1="326" x2="640" y2="396" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar-amber)"/>
  <text x="656" y="368" font-size="17" font-weight="bold" fill="#b45309">하나라도 아니오</text>

  <!-- 결과: Simple Request -->
  <rect x="80" y="400" width="320" height="84" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="240" y="434" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">Simple Request</text>
  <text x="240" y="464" font-size="16" fill="#111827" text-anchor="middle">바로 본 요청 전송</text>

  <!-- 결과: Preflight -->
  <rect x="480" y="400" width="320" height="84" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="640" y="434" font-size="20" font-weight="bold" fill="#b45309" text-anchor="middle">Preflight 먼저</text>
  <text x="640" y="464" font-size="16" fill="#111827" text-anchor="middle">OPTIONS로 허가 확인</text>
</svg>
