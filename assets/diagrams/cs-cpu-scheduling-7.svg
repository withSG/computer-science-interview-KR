<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스케줄링 예시 작업 집합</title>
  <desc id="d">알고리즘 예시에 공통으로 쓰는 네 작업의 표입니다. P1은 도착시각 0에 CPU 버스트 7, P2는 2에 4, P3는 4에 1, P4는 5에 4이며, 버스트 길이를 칸 수로도 나타냈습니다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>

  <!-- 머리행 음영 -->
  <path d="M40,84 V40 A8,8 0 0 1 48,32 H832 A8,8 0 0 1 840,40 V84 Z" fill="#e8eef6"/>

  <!-- 격자 -->
  <line x1="40" y1="84" x2="840" y2="84" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="40" y1="136" x2="840" y2="136" stroke="#d6dde6" stroke-width="1"/>
  <line x1="40" y1="188" x2="840" y2="188" stroke="#d6dde6" stroke-width="1"/>
  <line x1="40" y1="240" x2="840" y2="240" stroke="#d6dde6" stroke-width="1"/>
  <line x1="160" y1="32" x2="160" y2="292" stroke="#d6dde6" stroke-width="1"/>
  <line x1="340" y1="32" x2="340" y2="292" stroke="#d6dde6" stroke-width="1"/>
  <rect x="40" y="32" width="800" height="260" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 머리행 -->
  <text x="100" y="64" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">작업</text>
  <text x="250" y="64" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">도착시각</text>
  <text x="590" y="64" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">CPU 버스트</text>

  <!-- P1: 도착 0, 버스트 7 -->
  <text x="100" y="116" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">P1</text>
  <text x="250" y="116" font-size="18" fill="#111827" text-anchor="middle">0</text>
  <text x="372" y="116" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">7</text>
  <g fill="#dbe7fb" stroke="#1d4ed8" stroke-width="1.2">
    <rect x="404" y="98" width="52" height="24" rx="3"/>
    <rect x="460" y="98" width="52" height="24" rx="3"/>
    <rect x="516" y="98" width="52" height="24" rx="3"/>
    <rect x="572" y="98" width="52" height="24" rx="3"/>
    <rect x="628" y="98" width="52" height="24" rx="3"/>
    <rect x="684" y="98" width="52" height="24" rx="3"/>
    <rect x="740" y="98" width="52" height="24" rx="3"/>
  </g>

  <!-- P2: 도착 2, 버스트 4 -->
  <text x="100" y="168" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">P2</text>
  <text x="250" y="168" font-size="18" fill="#111827" text-anchor="middle">2</text>
  <text x="372" y="168" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">4</text>
  <g fill="#dbe7fb" stroke="#1d4ed8" stroke-width="1.2">
    <rect x="404" y="150" width="52" height="24" rx="3"/>
    <rect x="460" y="150" width="52" height="24" rx="3"/>
    <rect x="516" y="150" width="52" height="24" rx="3"/>
    <rect x="572" y="150" width="52" height="24" rx="3"/>
  </g>

  <!-- P3: 도착 4, 버스트 1 -->
  <text x="100" y="220" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">P3</text>
  <text x="250" y="220" font-size="18" fill="#111827" text-anchor="middle">4</text>
  <text x="372" y="220" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1</text>
  <g fill="#dbe7fb" stroke="#1d4ed8" stroke-width="1.2">
    <rect x="404" y="202" width="52" height="24" rx="3"/>
  </g>

  <!-- P4: 도착 5, 버스트 4 -->
  <text x="100" y="272" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">P4</text>
  <text x="250" y="272" font-size="18" fill="#111827" text-anchor="middle">5</text>
  <text x="372" y="272" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">4</text>
  <g fill="#dbe7fb" stroke="#1d4ed8" stroke-width="1.2">
    <rect x="404" y="254" width="52" height="24" rx="3"/>
    <rect x="460" y="254" width="52" height="24" rx="3"/>
    <rect x="516" y="254" width="52" height="24" rx="3"/>
    <rect x="572" y="254" width="52" height="24" rx="3"/>
  </g>

  <!-- 범례 -->
  <rect x="404" y="310" width="52" height="24" rx="3" fill="#dbe7fb" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="468" y="327" font-size="15" fill="#4b5563">칸 하나 = CPU 버스트 1</text>
</svg>
