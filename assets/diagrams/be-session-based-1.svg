<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HTTP는 로그인을 기억하지 못한다</title>
  <desc id="d">Client가 POST /login으로 로그인해 200 OK를 받지만 서버는 비밀번호 확인 뒤 곧 잊어버려, 이어진 GET /my-orders 요청에는 "누구세요?"라며 401 Unauthorized를 돌려주는 흐름.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="40" y="24" width="140" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="110" y="52" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Client</text>
  <rect x="450" y="24" width="140" height="44" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="520" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>

  <!-- 생명선 -->
  <line x1="110" y1="68" x2="110" y2="376" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="520" y1="68" x2="520" y2="376" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 1. 로그인 요청 -->
  <text x="315" y="110" font-size="16" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /login  (id=kim, pw=****)</text>
  <line x1="112" y1="124" x2="516" y2="124" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 서버: 확인 후 잊어버림 -->
  <rect x="544" y="94" width="220" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="119" font-size="16" fill="#047857">비밀번호 확인 OK</text>
  <text x="560" y="143" font-size="16" font-weight="bold" fill="#b91c1c">… 그리고 잊어버림</text>

  <!-- 2. 로그인 응답 -->
  <text x="315" y="180" font-size="16" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">200 OK  "환영합니다 kim님"</text>
  <line x1="518" y1="194" x2="114" y2="194" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- 3. 다음 요청 -->
  <text x="315" y="270" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /my-orders</text>
  <line x1="112" y1="284" x2="516" y2="284" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 서버: 누구세요? -->
  <rect x="544" y="260" width="150" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="619" y="290" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">"누구세요?"</text>

  <!-- 4. 거절 -->
  <text x="315" y="334" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">401 Unauthorized</text>
  <line x1="518" y1="348" x2="114" y2="348" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
</svg>
