<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1. 왜 필요한가 — HTTP는 당신을 기억하지 못한다</title>
  <desc id="d">HTTP의 무상태성으로 인해 로그인 정보가 유지되지 못하고 다음 요청에서 401 Unauthorized 응답이 발생하는 흐름을 나타낸 시퀀스 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- Document Section Title Header -->
  <rect x="40" y="20" width="800" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="60" y="45" font-size="15" font-weight="bold" fill="#1f2933">1. 왜 필요한가 — HTTP는 당신을 기억하지 못한다</text>

  <!-- Lifelines -->
  <line x1="220" y1="120" x2="220" y2="420" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="500" y1="120" x2="500" y2="420" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Actor Boxes -->
  <rect x="150" y="80" width="140" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="105" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Client</text>

  <rect x="430" y="80" width="140" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="500" y="105" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Server</text>

  <!-- Message 1: POST /login -->
  <path d="M220,160 L500,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="250" y="145" width="220" height="20" fill="#ffffff"/>
  <text x="360" y="159" font-size="12.5" font-weight="bold" fill="#2563eb" text-anchor="middle">POST /login (id=kim, pw=****)</text>

  <!-- Server Action 1 Note -->
  <rect x="520" y="145" width="280" height="30" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="530" y="164" font-size="12" fill="#b45309" text-anchor="start">비밀번호 확인 OK … 그리고 잊어버림</text>

  <!-- Message 2: 200 OK -->
  <path d="M500,220 L220,220" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="260" y="205" width="200" height="20" fill="#ffffff"/>
  <text x="360" y="219" font-size="12.5" font-weight="bold" fill="#059669" text-anchor="middle">200 OK "환영합니다 kim님"</text>

  <!-- Message 3: GET /my-orders -->
  <path d="M220,290 L500,290" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="290" y="275" width="140" height="20" fill="#ffffff"/>
  <text x="360" y="289" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">GET /my-orders</text>

  <!-- Server Action 2 Note -->
  <rect x="520" y="275" width="110" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="575" y="294" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">"누구세요?"</text>

  <!-- Message 4: 401 Unauthorized -->
  <path d="M500,350 L220,350" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="280" y="335" width="160" height="20" fill="#ffffff"/>
  <text x="360" y="349" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">401 Unauthorized</text>
</svg>