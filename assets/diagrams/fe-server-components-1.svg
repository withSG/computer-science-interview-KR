<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RSC Payload 전달 흐름</title>
  <desc id="d">서버에서 Server Component가 실행돼 트리를 만들면, 순수 마크업 부분은 클라이언트가 JS 없이 그대로 쓰고, 클라이언트 컴포넌트 참조는 해당 모듈을 로드해 렌더하라는 지시가 되어 LikeButton의 JS만 다운로드한 뒤 하이드레이션한다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>
  <defs>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 두 구역 -->
  <rect x="24" y="24" width="356" height="522" rx="10" fill="#f3f4f6"/>
  <rect x="500" y="24" width="356" height="522" rx="10" fill="#f3f4f6"/>
  <text x="44" y="60" font-size="18" font-weight="bold" fill="#111827">서버</text>
  <text x="520" y="60" font-size="18" font-weight="bold" fill="#111827">클라이언트</text>

  <!-- 서버: 실행 트리 -->
  <rect x="44" y="84" width="236" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="58" y="112" font-size="16" font-weight="bold" fill="#111827">Server Component 실행</text>

  <path d="M64,128 V224 H88 M64,164 H88" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <rect x="88" y="144" width="216" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="102" y="169" font-size="15" fill="#111827">DB 조회 / 마크다운 파싱</text>

  <rect x="88" y="204" width="120" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="102" y="229" font-size="15" font-weight="bold" fill="#111827">트리 생성</text>

  <path d="M108,244 V354 H132 M108,284 H132" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <rect x="132" y="264" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="146" y="289" font-size="15" fill="#065f46">순수 마크업 부분</text>

  <rect x="132" y="324" width="236" height="60" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="146" y="348" font-size="15" fill="#5b21b6" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;LikeButton count={3}/&gt;</text>
  <text x="146" y="372" font-size="14" fill="#4b5563">(클라이언트 컴포넌트 참조)</text>

  <!-- 전달: RSC Payload -->
  <text x="440" y="236" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">RSC Payload</text>
  <text x="440" y="257" font-size="14" fill="#4b5563" text-anchor="middle">(직렬화된 트리)</text>

  <line x1="296" y1="284" x2="562" y2="284" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="372" y1="354" x2="522" y2="354" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <!-- 클라이언트 -->
  <rect x="568" y="264" width="220" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="678" y="289" font-size="15" fill="#065f46" text-anchor="middle">그대로 사용 (JS 없음)</text>

  <rect x="528" y="324" width="300" height="60" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="678" y="348" font-size="15" fill="#5b21b6" text-anchor="middle">"LikeButton 모듈을 로드해</text>
  <text x="678" y="372" font-size="15" fill="#5b21b6" text-anchor="middle">props {count:3}으로 렌더하라"</text>

  <line x1="678" y1="384" x2="678" y2="404" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <rect x="548" y="410" width="260" height="40" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="678" y="435" font-size="15" fill="#5b21b6" text-anchor="middle">LikeButton의 JS만 다운로드</text>

  <line x1="678" y1="450" x2="678" y2="470" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <rect x="588" y="476" width="180" height="40" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="678" y="501" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">하이드레이션</text>
</svg>
