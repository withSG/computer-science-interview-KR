<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rate Limiting 고정 윈도우의 경계 문제</title>
  <desc id="d">고정 윈도우 방식에서 윈도우 경계 시점에 한도의 두 배에 해당하는 요청이 통과하는 문제를 보여주는 다이어그램입니다.</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 박스 -->
  <rect x="40" y="30" width="800" height="280" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- 제목 (원본: [고정 윈도우의 경계 문제]  한도 = 분당 100) -->
  <text x="60" y="71" font-size="16" font-weight="bold" fill="#1f2933">[고정 윈도우의 경계 문제]</text>
  <text x="280" y="71" font-size="14" fill="#52606d">한도 = 분당 100</text>

  <!-- 윈도우 영역 1 (12:00 윈도우) -->
  <rect x="180" y="100" width="220" height="120" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="290" y="125" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">12:00 윈도우</text>

  <!-- 윈도우 영역 2 (12:01 윈도우) -->
  <rect x="400" y="100" width="220" height="120" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="510" y="125" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">12:01 윈도우</text>

  <!-- 시간축 선 -->
  <line x1="80" y1="180" x2="720" y2="180" stroke="#9aa5b1" stroke-width="2"/>

  <!-- 윈도우 경계선 (12:01:00) -->
  <line x1="400" y1="90" x2="400" y2="230" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="400" y="247" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="bold">12:01:00 (경계)</text>

  <!-- 요청 1: 12:00:59 100건 통과 -->
  <circle cx="370" cy="180" r="5" fill="#2563eb"/>
  <rect x="255" y="142" width="110" height="24" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="310" y="158" font-size="13" fill="#1f2933" text-anchor="middle">12:00:59</text>
  <text x="370" y="202" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">100건 통과</text>

  <!-- 요청 2: 12:01:01 100건 통과 -->
  <circle cx="430" cy="180" r="5" fill="#2563eb"/>
  <rect x="435" y="142" width="110" height="24" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="490" y="158" font-size="13" fill="#1f2933" text-anchor="middle">12:01:01</text>
  <text x="430" y="202" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">100건 통과</text>

  <!-- 경계 버스트 강조 구간 (2초 사이) -->
  <rect x="350" y="108" width="100" height="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="400" y="121" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">2초 사이</text>

  <!-- 화살표 및 결과 메시지 (→ 2초 사이에 200건. 한도의 두 배가 통과한다) -->
  <path d="M 60,270 L 100,270" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <text x="110" y="275" font-size="14" font-weight="bold" fill="#dc2626">2초 사이에 200건. 한도의 두 배가 통과한다</text>
</svg>