<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">고정 윈도우의 경계 문제</title>
  <desc id="d">한도가 분당 100인 고정 윈도우에서 12:00:59에 100건(12:00 윈도우), 12:01:01에 100건(12:01 윈도우)이 통과한다. 경계를 사이에 둔 2초 동안 200건, 한도의 두 배가 통과한다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 머리: 제목과 한도 -->
  <text x="40" y="47" font-size="20" font-weight="bold" fill="#111827">고정 윈도우의 경계 문제</text>
  <rect x="650" y="22" width="190" height="36" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="745" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">한도 = 분당 100</text>

  <!-- 두 윈도우 영역 -->
  <rect x="40" y="96" width="400" height="194" fill="#eff6ff"/>
  <rect x="440" y="96" width="400" height="194" fill="#f5f3ff"/>
  <text x="60" y="124" font-size="17" font-weight="bold" fill="#1d4ed8">12:00 윈도우</text>
  <text x="820" y="124" text-anchor="end" font-size="17" font-weight="bold" fill="#6d28d9">12:01 윈도우</text>

  <!-- 경계선 -->
  <text x="440" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">윈도우 경계</text>
  <line x1="440" y1="92" x2="440" y2="290" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 막대: 12:00:59 100건 -->
  <text x="290" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">100건 통과</text>
  <rect x="262" y="172" width="56" height="118" fill="#3b82f6"/>

  <!-- 막대: 12:01:01 100건 -->
  <text x="590" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d28d9">100건 통과</text>
  <rect x="562" y="172" width="56" height="118" fill="#8b5cf6"/>

  <!-- 시간축 -->
  <line x1="40" y1="290" x2="846" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#axis)"/>
  <line x1="290" y1="290" x2="290" y2="298" stroke="#374151" stroke-width="2"/>
  <line x1="440" y1="290" x2="440" y2="298" stroke="#b91c1c" stroke-width="2"/>
  <line x1="590" y1="290" x2="590" y2="298" stroke="#374151" stroke-width="2"/>
  <text x="290" y="316" text-anchor="middle" font-size="15" fill="#1f2937">12:00:59</text>
  <text x="440" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">12:01:00</text>
  <text x="590" y="316" text-anchor="middle" font-size="15" fill="#1f2937">12:01:01</text>

  <!-- 2초 구간 -->
  <path d="M290,328 V338 H590 V328" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="362" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">2초 사이에 200건</text>

  <!-- 결론 -->
  <rect x="190" y="384" width="500" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="414" text-anchor="middle" font-size="18" font-weight="bold" fill="#b91c1c">한도의 두 배가 통과한다</text>
</svg>
