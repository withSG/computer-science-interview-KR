<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커넥션 풀 사용</title>
  <desc id="d">커넥션 풀 초기화 및 요청 1, 요청 2의 커넥션 재사용 과정과 장점을 설명하는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Section 1: Initialization -->
  <rect x="40" y="40" width="800" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="70.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">초기화: 풀에 N개 연결 생성</text>

  <!-- Section 2: Flow 1 (Request 1) -->
  <rect x="40" y="120" width="120" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="150.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">요청 1</text>

  <path d="M160,145 L210,145" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="220" y="120" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="305" y="150.5" font-size="13" fill="#1f2933" text-anchor="middle">풀에서 연결 획득</text>

  <path d="M390,145 L440,145" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="450" y="120" width="120" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="510" y="150.5" font-size="13" fill="#1f2933" text-anchor="middle">쿼리</text>

  <path d="M570,145 L620,145" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="630" y="120" width="170" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="715" y="150.5" font-size="13" fill="#1f2933" text-anchor="middle">풀에 반환</text>

  <!-- Section 3: Flow 2 (Request 2) -->
  <rect x="40" y="210" width="120" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="100" y="240.5" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">요청 2</text>

  <path d="M160,235 L210,235" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="220" y="210" width="170" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="305" y="240.5" font-size="13" fill="#1f2933" text-anchor="middle">풀에서 연결 획득</text>

  <path d="M390,235 L440,235" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="450" y="210" width="120" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="510" y="240.5" font-size="13" fill="#1f2933" text-anchor="middle">쿼리</text>

  <path d="M570,235 L620,235" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="630" y="210" width="170" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="715" y="240.5" font-size="13" fill="#1f2933" text-anchor="middle">풀에 반환</text>

  <!-- Section 4: Advantage / Summary -->
  <rect x="40" y="300" width="800" height="140" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="375.5" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">장점: 연결 재사용으로 오버헤드 감소</text>
</svg>