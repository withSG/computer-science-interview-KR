<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커넥션 풀 사용</title>
  <desc id="d">초기화 때 풀에 N개 연결을 만들어 두고, 요청 1과 요청 2는 풀에서 연결을 획득해 쿼리한 뒤 풀에 반환한다. 반환된 연결이 재사용되어 오버헤드가 줄어든다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 초기화 -->
  <rect x="24" y="56" width="110" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="79" y="86" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">초기화</text>
  <path d="M136,80 L178,80" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <rect x="184" y="24" width="672" height="112" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="2"/>
  <text x="204" y="54" font-size="17" font-weight="bold" fill="#065f46">풀에 N개 연결 생성</text>
  <text x="836" y="54" font-size="15" fill="#047857" text-anchor="end">커넥션 풀</text>
  <rect x="204" y="70" width="112" height="44" rx="22" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="260" y="97" font-size="16" fill="#065f46" text-anchor="middle">연결 1</text>
  <rect x="332" y="70" width="112" height="44" rx="22" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="388" y="97" font-size="16" fill="#065f46" text-anchor="middle">연결 2</text>
  <rect x="460" y="70" width="112" height="44" rx="22" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="516" y="97" font-size="16" fill="#065f46" text-anchor="middle">연결 3</text>
  <text x="612" y="97" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">…</text>
  <rect x="652" y="70" width="112" height="44" rx="22" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="708" y="97" font-size="16" fill="#065f46" text-anchor="middle">연결 N</text>

  <!-- 요청 1 -->
  <rect x="24" y="176" width="110" height="56" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="79" y="210" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">요청 1</text>
  <path d="M136,204 L178,204" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="184" y="176" width="200" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="284" y="210" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">풀에서 연결 획득</text>
  <path d="M386,204 L422,204" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="428" y="176" width="140" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="498" y="210" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">쿼리</text>
  <path d="M570,204 L606,204" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="612" y="176" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="702" y="210" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">풀에 반환</text>

  <!-- 요청 2 -->
  <rect x="24" y="264" width="110" height="56" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="79" y="298" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">요청 2</text>
  <path d="M136,292 L178,292" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="184" y="264" width="200" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="284" y="298" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">풀에서 연결 획득</text>
  <path d="M386,292 L422,292" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="428" y="264" width="140" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="498" y="298" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">쿼리</text>
  <path d="M570,292 L606,292" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="612" y="264" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="702" y="298" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">풀에 반환</text>

  <!-- 반환된 연결이 풀로 돌아감 -->
  <path d="M794,204 L836,204" stroke="#047857" stroke-width="2" fill="none"/>
  <path d="M794,292 L836,292 L836,142" stroke="#047857" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ag)"/>
  <text x="824" y="162" font-size="15" font-weight="bold" fill="#047857" text-anchor="end">연결 재사용</text>

  <!-- 장점 -->
  <rect x="24" y="356" width="832" height="66" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="396" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle"><tspan fill="#92400e">장점:</tspan> 연결 재사용으로 오버헤드 감소</text>
</svg>
