<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SPA(CSR)가 잃은 두 가지</title>
  <desc id="d">첫째, HTML 도착 뒤 흰 화면, JS 다운로드, JS 실행, API 호출을 모두 거쳐야 콘텐츠가 보여 첫 화면이 늦다. 둘째, 크롤러가 받은 HTML에는 빈 div id="root"만 있어 상품명·가격·설명이 없으므로 검색 엔진과 SNS가 내용을 못 본다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 1) 첫 화면이 늦다 -->
  <rect x="24" y="24" width="832" height="172" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="700" fill="#111827">1) 첫 화면이 늦다</text>

  <rect x="46" y="76" width="100" height="54" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="96" y="108" font-size="15" text-anchor="middle" fill="#1f2937">HTML 도착</text>

  <rect x="182" y="76" width="88" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="226" y="108" font-size="15" text-anchor="middle" fill="#4b5563">흰 화면</text>

  <rect x="306" y="76" width="112" height="54" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="362" y="108" font-size="15" text-anchor="middle" fill="#1f2937">JS 다운로드</text>

  <rect x="454" y="76" width="88" height="54" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="498" y="108" font-size="15" text-anchor="middle" fill="#1f2937">JS 실행</text>

  <rect x="578" y="76" width="92" height="54" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="624" y="108" font-size="15" text-anchor="middle" fill="#1f2937">API 호출</text>

  <rect x="706" y="76" width="128" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="770" y="108" font-size="15" font-weight="700" text-anchor="middle" fill="#047857">그제야 콘텐츠</text>

  <g stroke="#475569" stroke-width="2" marker-end="url(#ah)">
    <line x1="150" y1="103" x2="178" y2="103"/>
    <line x1="274" y1="103" x2="302" y2="103"/>
    <line x1="422" y1="103" x2="450" y2="103"/>
    <line x1="546" y1="103" x2="574" y2="103"/>
    <line x1="674" y1="103" x2="702" y2="103"/>
  </g>

  <path d="M46 140 V148 H670 V140 M358 148 V156" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="358" y="178" font-size="15" text-anchor="middle" fill="#374151">HTML 수신 후 여러 단계의 클라이언트 측 처리가 끝나야 비로소 화면 표시</text>

  <!-- 2) 검색 엔진과 SNS가 내용을 못 본다 -->
  <rect x="24" y="216" width="832" height="228" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="248" font-size="18" font-weight="700" fill="#111827">2) 검색 엔진과 SNS가 내용을 못 본다</text>

  <rect x="44" y="268" width="404" height="156" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <path d="M52 268 H440 Q448 268 448 276 V304 H44 V276 Q44 268 52 268 Z" fill="#334155"/>
  <text x="62" y="292" font-size="15" font-weight="700" fill="#ffffff">크롤러가 받은 HTML</text>
  <text x="64" y="340" font-size="18" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div id="root"&gt;&lt;/div&gt;</text>

  <rect x="64" y="358" width="112" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="120" y="386" font-size="15" text-anchor="middle" fill="#4b5563">상품명 <tspan fill="#b91c1c" font-weight="700">없음</tspan></text>
  <rect x="190" y="358" width="112" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="246" y="386" font-size="15" text-anchor="middle" fill="#4b5563">가격 <tspan fill="#b91c1c" font-weight="700">없음</tspan></text>
  <rect x="316" y="358" width="112" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="372" y="386" font-size="15" text-anchor="middle" fill="#4b5563">설명 <tspan fill="#b91c1c" font-weight="700">없음</tspan></text>

  <line x1="456" y1="346" x2="494" y2="346" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ahr)"/>

  <rect x="500" y="268" width="336" height="156" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="520" y="302" font-size="17" font-weight="700" fill="#b91c1c">상품명도 가격도 설명도</text>
  <text x="520" y="326" font-size="17" font-weight="700" fill="#b91c1c">그 안에 없다</text>
  <line x1="520" y1="344" x2="816" y2="344" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="520" y="372" font-size="15" fill="#374151">빈 HTML 스켈레톤만 전달되어</text>
  <text x="520" y="398" font-size="15" font-weight="700" fill="#1f2937">검색 엔진 색인·SNS 미리보기 생성 불가</text>
</svg>
