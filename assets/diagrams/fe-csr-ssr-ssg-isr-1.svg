<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 렌더링 전략이라는 게 생겼나 - CSR의 문제점</title>
  <desc id="d">첫 화면이 늦어지는 CSR 흐름과 검색 엔진 및 SNS가 내용을 보지 못하는 문제점을 나타낸 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title (From Section Heading) -->
  <text x="30" y="42" font-size="16" font-weight="bold" fill="#1f2933">1. 왜 렌더링 전략이라는 게 생겼나</text>

  <!-- Section 1: 1) 첫 화면이 늦다 -->
  <g id="section-1">
    <!-- Section Container Frame -->
    <rect x="30" y="65" width="820" height="185" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    
    <!-- Section Header Block -->
    <rect x="30" y="65" width="820" height="38" rx="8" fill="#fef3c7"/>
    <!-- Overlap adjust for top rounded corners only -->
    <rect x="30" y="90" width="820" height="13" fill="#fef3c7"/>
    <line x1="30" y1="103" x2="850" y2="103" stroke="#fcd34d" stroke-width="1"/>
    
    <text x="50" y="89" font-size="14" font-weight="bold" fill="#b45309">1) 첫 화면이 늦다</text>

    <!-- Sequence Diagram Steps -->
    <!-- Step 1: HTML 도착 -->
    <rect x="50" y="125" width="105" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="102" y="154" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">HTML 도착</text>

    <!-- Arrow 1 -->
    <path d="M155,150 L175,150" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

    <!-- Step 2: 흰 화면 (Highlighted Warning) -->
    <rect x="175" y="125" width="95" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="222" y="154" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">흰 화면</text>

    <!-- Arrow 2 -->
    <path d="M270,150 L290,150" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

    <!-- Step 3: JS 다운로드 -->
    <rect x="290" y="125" width="115" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="347" y="154" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">JS 다운로드</text>

    <!-- Arrow 3 -->
    <path d="M405,150 L425,150" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

    <!-- Step 4: JS 실행 -->
    <rect x="425" y="125" width="95" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="472" y="154" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">JS 실행</text>

    <!-- Arrow 4 -->
    <path d="M520,150 L540,150" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

    <!-- Step 5: API 호출 -->
    <rect x="540" y="125" width="100" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="590" y="154" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">API 호출</text>

    <!-- Arrow 5 -->
    <path d="M640,150 L660,150" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

    <!-- Step 6: 그제서야 콘텐츠 (Success Result) -->
    <rect x="660" y="125" width="145" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="732" y="154" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">그제야 콘텐츠</text>

    <!-- Annotation / Sub-note -->
    <text x="440" y="215" font-size="11.5" fill="#d97706" text-anchor="middle">※ HTML 수신 후 여러 단계의 클라이언트 측 처리가 완료되어야 비로소 화면이 표시됩니다.</text>
  </g>

  <!-- Section 2: 2) 검색 엔진과 SNS가 내용을 못 본다 -->
  <g id="section-2">
    <!-- Section Container Frame -->
    <rect x="30" y="270" width="820" height="200" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>

    <!-- Section Header Block -->
    <rect x="30" y="270" width="820" height="38" rx="8" fill="#fee2e2"/>
    <!-- Overlap adjust for top rounded corners only -->
    <rect x="30" y="295" width="820" height="13" fill="#fee2e2"/>
    <line x1="30" y1="308" x2="850" y2="308" stroke="#fca5a5" stroke-width="1"/>

    <text x="50" y="294" font-size="14" font-weight="bold" fill="#991b1b">2) 검색 엔진과 SNS가 내용을 못 본다</text>

    <!-- Content Block: Empty Root Line -->
    <g id="crawler-html">
      <text x="60" y="342" font-size="13" font-weight="bold" fill="#1f2933">크롤러가 받은 HTML:</text>
      
      <!-- Code Box -->
      <rect x="205" y="322" width="180" height="32" rx="4" fill="#1f2933"/>
      <text x="215" y="343" font-family="monospace, sans-serif" font-size="13" fill="#60a5fa" font-weight="bold">&lt;div id="root"&gt;&lt;/div&gt;</text>
    </g>

    <!-- Content Block: Missing Information -->
    <g id="missing-info">
      <!-- Cross Icon / Alert Line -->
      <rect x="60" y="375" width="760" height="70" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      
      <circle cx="90" cy="410" r="14" fill="#dc2626"/>
      <path d="M83,403 L97,417 M97,403 L83,417" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

      <text x="120" y="415" font-size="13.5" font-weight="bold" fill="#dc2626">상품명도 가격도 설명도 그 안에 없다</text>
      <text x="400" y="414" font-size="12" fill="#52606d">(빈 HTML 스켈레톤만 전달되어 검색 엔진 색인 및 SNS 미리보기 생성 불가)</text>
    </g>
  </g>
</svg>