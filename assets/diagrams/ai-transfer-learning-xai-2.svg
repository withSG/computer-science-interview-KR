<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">특징 추출과 파인튜닝 비교</title>
  <desc id="d">특징 추출은 사전학습 층을 모두 동결하고 새 분류 층만 학습해 학습 대상 파라미터가 수천 개이고, 파인튜닝은 초기 층만 동결한 채 후반 층을 낮은 lr(1e-4)로, 새 분류 층을 높은 lr(1e-3)로 학습해 학습 대상 파라미터가 수백만 개라는 차이를 나란히 비교한다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 열 제목 -->
  <text x="228" y="52" text-anchor="middle" fill="#111827"><tspan font-size="20" font-weight="bold">특징 추출</tspan><tspan font-size="15" fill="#4b5563" dx="8">Feature Extraction</tspan></text>
  <text x="652" y="52" text-anchor="middle" fill="#111827"><tspan font-size="20" font-weight="bold">파인튜닝</tspan><tspan font-size="15" fill="#4b5563" dx="8">Fine-tuning</tspan></text>
  <line x1="440" y1="30" x2="440" y2="470" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 왼쪽: 특징 추출 -->
  <rect x="32" y="80" width="392" height="174" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="228" y="130" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">사전학습 층 (동결)</text>
  <text x="228" y="162" font-size="15" fill="#374151" text-anchor="middle">가중치가 절대 안 바뀜</text>
  <text x="228" y="188" font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">requires_grad = False</text>
  <text x="228" y="214" font-size="15" fill="#374151" text-anchor="middle">→ 사실상 고정된 특징 변환기</text>

  <line x1="228" y1="254" x2="228" y2="276" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="32" y="278" width="392" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="228" y="310" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">새 분류 층 (학습)</text>
  <text x="228" y="338" font-size="15" fill="#1e3a8a" text-anchor="middle">이 층만 역전파로 갱신</text>

  <rect x="32" y="386" width="392" height="80" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="228" y="418" text-anchor="middle" fill="#374151"><tspan font-size="15">학습 대상 파라미터:</tspan><tspan font-size="18" font-weight="bold" fill="#047857" dx="6">수천 개</tspan></text>
  <text x="228" y="446" font-size="15" fill="#111827" text-anchor="middle">→ 데이터 400장으로도 과적합이 잘 안 난다</text>

  <!-- 오른쪽: 파인튜닝 -->
  <rect x="456" y="80" width="392" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="652" y="121" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">초기 층 (동결)</text>

  <line x1="652" y1="150" x2="652" y2="172" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="456" y="174" width="392" height="80" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="652" y="206" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">후반 층 (해동, 낮은 lr)</text>
  <text x="652" y="234" font-size="16" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">requires_grad = True, lr = 1e-4</text>

  <line x1="652" y1="254" x2="652" y2="276" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="456" y="278" width="392" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="652" y="310" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">새 분류 층 (높은 lr)</text>
  <text x="652" y="338" font-size="16" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lr = 1e-3</text>

  <rect x="456" y="386" width="392" height="80" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="652" y="418" text-anchor="middle" fill="#374151"><tspan font-size="15">학습 대상 파라미터:</tspan><tspan font-size="18" font-weight="bold" fill="#b45309" dx="6">수백만 개</tspan></text>
  <text x="652" y="446" font-size="15" fill="#111827" text-anchor="middle">→ 데이터가 어느 정도 있어야 안전하다</text>

  <!-- 범례 -->
  <rect x="120" y="492" width="36" height="22" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="166" y="509" font-size="15" fill="#374151">동결: 가중치 고정</text>
  <rect x="340" y="492" width="36" height="22" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <rect x="382" y="492" width="36" height="22" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="428" y="509" font-size="15" fill="#374151">학습: 역전파로 갱신 (lr = 학습률)</text>
</svg>
