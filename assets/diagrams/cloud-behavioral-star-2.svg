<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">꼬리 질문은 검증 도구다</title>
  <desc id="d">면접 답변에 대한 세부, 대안, 반사실, 역할 꼬리 질문과 각각의 실제 경험 및 지어낸 답 비교 구조도</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="770" fill="#ffffff"/>

  <!-- 메인 답변 박스 -->
  <rect x="180" y="24" width="520" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="53" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">답변: "Redis 캐시를 도입해서 응답 시간을 크게 줄였습니다"</text>

  <!-- 수직 줄기 선 -->
  <path d="M220,72 L220,685" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- 1. [세부] 가지 -->
  <path d="M220,110 L250,110" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <!-- 질문 박스 -->
  <rect x="250" y="88" width="285" height="44" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="264" y="114" font-size="13" font-weight="bold" fill="#7c3aed">[세부]</text>
  <text x="314" y="114" font-size="13" font-weight="bold" fill="#1f2933">"TTL은 얼마로 잡으셨나요?"</text>
  <!-- 실제 경험 -->
  <rect x="290" y="142" width="510" height="38" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="304" y="166" font-size="13" font-weight="bold" fill="#059669">실제 경험</text>
  <text x="368" y="166" font-size="13" fill="#1f2933">→ "10분입니다. 상품 정보가 그보다 자주 안 바뀌어서요"</text>
  <!-- 지어낸 답 -->
  <rect x="290" y="188" width="510" height="38" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="304" y="212" font-size="13" font-weight="bold" fill="#dc2626">지어낸 답</text>
  <text x="368" y="212" font-size="13" fill="#1f2933">→ "음... 적당히 설정했습니다"</text>

  <!-- 2. [대안] 가지 -->
  <path d="M220,270 L250,270" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <!-- 질문 박스 -->
  <rect x="250" y="248" width="375" height="44" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="264" y="274" font-size="13" font-weight="bold" fill="#7c3aed">[대안]</text>
  <text x="314" y="274" font-size="13" font-weight="bold" fill="#1f2933">"로컬 캐시가 아니라 Redis를 고른 이유는요?"</text>
  <!-- 실제 경험 -->
  <rect x="290" y="302" width="540" height="38" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="304" y="326" font-size="13" font-weight="bold" fill="#059669">실제 경험</text>
  <text x="368" y="326" font-size="13" fill="#1f2933">→ "인스턴스가 6대라 로컬 캐시는 무효화가 어려웠습니다"</text>
  <!-- 지어낸 답 -->
  <rect x="290" y="348" width="540" height="38" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="304" y="372" font-size="13" font-weight="bold" fill="#dc2626">지어낸 답</text>
  <text x="368" y="372" font-size="13" fill="#1f2933">→ "Redis가 더 빠르다고 알고 있어서요"</text>
  <text x="635" y="372" font-size="13" font-weight="bold" fill="#dc2626">← 사실도 아니다</text>

  <!-- 3. [반사실] 가지 -->
  <path d="M220,445 L250,445" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <!-- 질문 박스 -->
  <rect x="250" y="423" width="295" height="44" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="264" y="449" font-size="13" font-weight="bold" fill="#7c3aed">[반사실]</text>
  <text x="328" y="449" font-size="13" font-weight="bold" fill="#1f2933">"캐시가 죽으면 어떻게 되나요?"</text>
  <!-- 실제 경험 -->
  <rect x="290" y="477" width="550" height="58" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="304" y="501" font-size="13" font-weight="bold" fill="#059669">실제 경험</text>
  <text x="368" y="501" font-size="13" fill="#1f2933">→ "폴백으로 DB를 직접 조회하는데, 그때 부하가 3배로</text>
  <text x="384" y="522" font-size="13" fill="#1f2933">뛰는 걸 부하 테스트로 확인해서 상한을 걸어뒀습니다"</text>
  <!-- 지어낸 답 -->
  <rect x="290" y="543" width="550" height="38" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="304" y="567" font-size="13" font-weight="bold" fill="#dc2626">지어낸 답</text>
  <text x="368" y="567" font-size="13" fill="#1f2933">→ "그런 상황은 생각 안 해봤습니다"</text>

  <!-- 4. [역할] 가지 -->
  <path d="M220,643 L250,643" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <!-- 질문 박스 -->
  <rect x="250" y="621" width="345" height="44" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="264" y="647" font-size="13" font-weight="bold" fill="#7c3aed">[역할]</text>
  <text x="314" y="647" font-size="13" font-weight="bold" fill="#1f2933">"이 작업은 어디까지 직접 하셨나요?"</text>
  <!-- 실제 경험 -->
  <rect x="290" y="675" width="530" height="38" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="304" y="699" font-size="13" font-weight="bold" fill="#059669">실제 경험</text>
  <text x="368" y="699" font-size="13" fill="#1f2933">→ "설계와 구현은 제가, 인프라 프로비저닝은 SRE 팀이"</text>
  <!-- 지어낸 답 -->
  <rect x="290" y="721" width="530" height="38" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="304" y="745" font-size="13" font-weight="bold" fill="#dc2626">지어낸 답</text>
  <text x="368" y="745" font-size="13" fill="#1f2933">→ (경계가 모호해지며 답이 길어진다)</text>
</svg>