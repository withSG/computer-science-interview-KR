<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">꼬리 질문 네 가지와 실제 경험·지어낸 답의 차이</title>
  <desc id="d">"Redis 캐시를 도입해서 응답 시간을 크게 줄였습니다"라는 답변에 세부·대안·반사실·역할 꼬리 질문을 던졌을 때, 실제 경험은 구체적인 수치와 근거가 나오고 지어낸 답은 모호해지는 차이를 나란히 비교한다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="720" fill="#ffffff"/>

  <!-- 처음 답변 -->
  <rect x="32" y="24" width="816" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="58.5" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">답변: "Redis 캐시를 도입해서 응답 시간을 크게 줄였습니다"</text>

  <!-- 열 머리 -->
  <rect x="80" y="96" width="378" height="32" rx="6" fill="#047857"/>
  <text x="269" y="117.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">실제 경험</text>
  <rect x="470" y="96" width="378" height="32" rx="6" fill="#b91c1c"/>
  <text x="659" y="117.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">지어낸 답</text>

  <!-- 줄기와 가지 -->
  <line x1="56" y1="80" x2="56" y2="594" stroke="#64748b" stroke-width="2"/>
  <line x1="56" y1="164" x2="77" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="56" y1="300" x2="77" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="56" y1="436" x2="77" y2="436" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="56" y1="594" x2="77" y2="594" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 1. 세부 -->
  <rect x="80" y="149" width="76" height="30" rx="15" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="118" y="169.3" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">세부</text>
  <text x="170" y="170" font-size="17" font-weight="bold" fill="#111827">"TTL은 얼마로 잡으셨나요?"</text>
  <rect x="80" y="190" width="378" height="70" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="94" y="219" font-size="15" fill="#111827">"<tspan font-weight="bold" fill="#047857">10분</tspan>입니다.</text>
  <text x="94" y="241" font-size="15" fill="#111827">상품 정보가 그보다 자주 안 바뀌어서요"</text>
  <rect x="470" y="190" width="378" height="70" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="484" y="230.3" font-size="15" fill="#111827">"음... 적당히 설정했습니다"</text>

  <!-- 2. 대안 -->
  <rect x="80" y="285" width="76" height="30" rx="15" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="118" y="305.3" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">대안</text>
  <text x="170" y="306" font-size="17" font-weight="bold" fill="#111827">"로컬 캐시가 아니라 Redis를 고른 이유는요?"</text>
  <rect x="80" y="326" width="378" height="70" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="94" y="355" font-size="15" fill="#111827">"인스턴스가 <tspan font-weight="bold" fill="#047857">6대</tspan>라</text>
  <text x="94" y="377" font-size="15" fill="#111827">로컬 캐시는 무효화가 어려웠습니다"</text>
  <rect x="470" y="326" width="378" height="70" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="484" y="355" font-size="15" fill="#111827">"Redis가 더 빠르다고 알고 있어서요"</text>
  <text x="484" y="377" font-size="15" font-weight="bold" fill="#b91c1c">↑ 사실도 아니다</text>

  <!-- 3. 반사실 -->
  <rect x="80" y="421" width="76" height="30" rx="15" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="118" y="441.3" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">반사실</text>
  <text x="170" y="442" font-size="17" font-weight="bold" fill="#111827">"캐시가 죽으면 어떻게 되나요?"</text>
  <rect x="80" y="462" width="378" height="92" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="94" y="491" font-size="15" fill="#111827">"폴백으로 DB를 직접 조회하는데,</text>
  <text x="94" y="513" font-size="15" fill="#111827">그때 부하가 <tspan font-weight="bold" fill="#047857">3배</tspan>로 뛰는 걸 부하 테스트로</text>
  <text x="94" y="535" font-size="15" fill="#111827">확인해서 상한을 걸어뒀습니다"</text>
  <rect x="470" y="462" width="378" height="92" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="484" y="513.3" font-size="15" fill="#111827">"그런 상황은 생각 안 해봤습니다"</text>

  <!-- 4. 역할 -->
  <rect x="80" y="579" width="76" height="30" rx="15" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="118" y="599.3" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">역할</text>
  <text x="170" y="600" font-size="17" font-weight="bold" fill="#111827">"이 작업은 어디까지 직접 하셨나요?"</text>
  <rect x="80" y="620" width="378" height="70" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="94" y="649" font-size="15" fill="#111827">"설계와 구현은 제가,</text>
  <text x="94" y="671" font-size="15" fill="#111827">인프라 프로비저닝은 SRE 팀이"</text>
  <rect x="470" y="620" width="378" height="70" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="484" y="660.3" font-size="15" fill="#4b5563">(경계가 모호해지며 답이 길어진다)</text>
</svg>
