<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">하이퍼바이저의 명령 가로채기</title>
  <desc id="d">게스트 OS가 특권 명령을 실행하려 하면 하이퍼바이저가 트랩으로 가로채 그 VM의 가상 자원에만 반영하고 결과만 게스트에게 돌려준다. 게스트는 이 단계를 인지하지 못하며, 실제 하드웨어에는 하이퍼바이저만 접근한다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 게스트 OS -->
  <rect x="40" y="24" width="560" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="58" font-size="16" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold" fill="#1d4ed8">게스트 OS</tspan>: “인터럽트 끄고 페이지 테이블 바꿀게”</text>

  <!-- ① 요청 (아래로) -->
  <path d="M150,82 L150,146" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <text x="164" y="120" font-size="15" fill="#1d4ed8">① 특권 명령 실행 시도</text>

  <!-- ④ 결과 (위로) -->
  <path d="M430,148 L430,84" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ah-purple)"/>
  <text x="444" y="120" font-size="15" fill="#6d28d9">④ 결과만 게스트에게 돌려준다</text>

  <!-- 하이퍼바이저 -->
  <rect x="40" y="150" width="560" height="104" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="64" y="190" font-size="17" font-weight="bold" fill="#1f2937">② 하이퍼바이저가 트랩(가로채기)</text>
  <text x="64" y="228" font-size="16" fill="#1f2937">③ 이 VM의 가상 자원에만 반영</text>

  <!-- 옆 주석 -->
  <path d="M602,202 L638,202" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <rect x="640" y="168" width="216" height="68" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="748" y="197" font-size="15" fill="#92400e" text-anchor="middle">게스트는 이 단계를</text>
  <text x="748" y="220" font-size="15" fill="#92400e" text-anchor="middle">인지하지 못한다</text>

  <!-- 하드웨어 접근 -->
  <path d="M320,256 L320,318" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ah-gray)"/>
  <text x="334" y="292" font-size="15" fill="#374151">하이퍼바이저만 접근</text>

  <rect x="40" y="320" width="560" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="320" y="354" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">실제 하드웨어</text>
</svg>
