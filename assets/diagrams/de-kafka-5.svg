<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커밋 순서와 전달 보장</title>
  <desc id="d">at-most-once는 poll, commit offset, 처리 순서라 처리 중에 죽으면 그 메시지가 영영 유실되고, at-least-once는 poll, 처리, commit offset 순서라 커밋 단계에서 죽으면 재시작 후 같은 메시지를 또 처리해 중복이 생긴다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ===== at-most-once ===== -->
  <rect x="24" y="24" width="404" height="402" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="60" font-size="20" font-weight="700" fill="#b91c1c">at-most-once</text>
  <text x="48" y="86" font-size="15" fill="#374151">처리 <tspan font-weight="700">전에</tspan> 오프셋 커밋</text>

  <rect x="48" y="108" width="200" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="148" y="136" font-size="16" fill="#111827" text-anchor="middle">1. poll</text>
  <line x1="148" y1="152" x2="148" y2="173" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="48" y="176" width="200" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="148" y="204" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="middle">2. commit offset</text>
  <line x1="148" y1="220" x2="148" y2="241" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="48" y="244" width="200" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="148" y="272" font-size="16" fill="#111827" text-anchor="middle">3. 처리</text>

  <line x1="250" y1="266" x2="266" y2="266" stroke="#b91c1c" stroke-width="2"/>
  <rect x="268" y="248" width="140" height="36" rx="18" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="338" y="272" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">여기서 죽으면</text>
  <line x1="338" y1="284" x2="338" y2="317" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>

  <rect x="48" y="320" width="360" height="80" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="228" y="352" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle">그 메시지는 영영 유실</text>
  <text x="228" y="380" font-size="15" fill="#374151" text-anchor="middle">커밋이 먼저 끝나 다시 읽지 않는다</text>

  <!-- ===== at-least-once ===== -->
  <rect x="452" y="24" width="404" height="402" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="476" y="60" font-size="20" font-weight="700" fill="#b45309">at-least-once</text>
  <text x="476" y="86" font-size="15" fill="#374151">처리 <tspan font-weight="700">후에</tspan> 오프셋 커밋</text>

  <rect x="476" y="108" width="200" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="576" y="136" font-size="16" fill="#111827" text-anchor="middle">1. poll</text>
  <line x1="576" y1="152" x2="576" y2="173" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="476" y="176" width="200" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="576" y="204" font-size="16" fill="#111827" text-anchor="middle">2. 처리</text>
  <line x1="576" y1="220" x2="576" y2="241" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="476" y="244" width="200" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="576" y="272" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="middle">3. commit offset</text>

  <line x1="678" y1="266" x2="694" y2="266" stroke="#b45309" stroke-width="2"/>
  <rect x="696" y="248" width="140" height="36" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="766" y="272" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">여기서 죽으면</text>
  <line x1="766" y1="284" x2="766" y2="317" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-amber)"/>

  <rect x="476" y="320" width="360" height="80" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="656" y="352" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle">재시작 후 같은 메시지를 또 처리</text>
  <text x="656" y="380" font-size="15" fill="#374151" text-anchor="middle">= <tspan font-weight="700" fill="#b45309">중복</tspan> (커밋 전이라 다시 읽는다)</text>
</svg>
