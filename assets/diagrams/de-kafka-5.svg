<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커밋 순서가 보장 수준을 결정한다</title>
  <desc id="d">at-most-once와 at-least-once의 커밋 및 처리 순서 비교 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Left Column Group: at-most-once -->
  <rect x="24" y="24" width="404" height="342" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="226" y="55.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[at-most-once]</text>

  <!-- Left Steps -->
  <rect x="136" y="80" width="180" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="226" y="104.55" font-size="13" fill="#1f2933" text-anchor="middle">1. poll</text>

  <path d="M226,120 L226,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="136" y="140" width="180" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="226" y="164.55" font-size="13" fill="#1f2933" text-anchor="middle">2. commit offset</text>

  <path d="M226,180 L226,200" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="136" y="200" width="180" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="226" y="224.55" font-size="13" fill="#1f2933" text-anchor="middle">3. 처리</text>

  <!-- Left Annotation Arrow & Text -->
  <path d="M226,240 L226,270" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <text x="226" y="260.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">← 여기서 죽으면</text>
  
  <rect x="44" y="280" width="364" height="64" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="226" y="318.025" font-size="11.5" fill="#dc2626" text-anchor="middle">그 메시지는 영영 유실</text>

  <!-- Right Column Group: at-least-once -->
  <rect x="452" y="24" width="404" height="342" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="654" y="55.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[at-least-once]</text>

  <!-- Right Steps -->
  <rect x="564" y="80" width="180" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="654" y="104.55" font-size="13" fill="#1f2933" text-anchor="middle">1. poll</text>

  <path d="M654,120 L654,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="564" y="140" width="180" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="654" y="164.55" font-size="13" fill="#1f2933" text-anchor="middle">2. 처리</text>

  <path d="M654,180 L654,200" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="564" y="200" width="180" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="654" y="224.55" font-size="13" fill="#1f2933" text-anchor="middle">3. commit offset</text>

  <!-- Right Annotation Arrow & Text -->
  <path d="M654,240 L654,270" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-amber)"/>
  <text x="654" y="260.55" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">← 여기서 죽으면</text>

  <rect x="472" y="280" width="364" height="64" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="654" y="318.025" font-size="11.5" fill="#d97706" text-anchor="middle">재시작 후 같은 메시지를 또 처리 = 중복</text>
</svg>