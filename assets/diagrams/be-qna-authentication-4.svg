<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OAuth 2.0 Authorization Code 흐름</title>
  <desc id="d">User(Browser)가 소셜 로그인을 눌러 Authorization Server(Google)에서 로그인하고 권한에 동의하면 Authorization Code를 받는다. 이 Code를 Backend Server로 전달하면 Backend Server가 Code로 Access Token을 요청해 발급받는다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="30" y="24" width="240" height="62" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="50" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">User</text>
  <text x="150" y="73" font-size="15" fill="#1e3a8a" text-anchor="middle">(Browser)</text>

  <rect x="320" y="24" width="240" height="62" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="50" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Authorization Server</text>
  <text x="440" y="73" font-size="15" fill="#4c1d95" text-anchor="middle">(Google)</text>

  <rect x="610" y="24" width="240" height="62" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="730" y="61" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">Backend Server</text>

  <!-- 생명선 -->
  <line x1="150" y1="86" x2="150" y2="516" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="440" y1="86" x2="440" y2="516" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="730" y1="86" x2="730" y2="516" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 1 -->
  <line x1="152" y1="140" x2="436" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <circle cx="180" cy="122" r="12" fill="#1d4ed8"/>
  <text x="180" y="127" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="200" y="128" font-size="16" fill="#1e3a8a">소셜 로그인 클릭</text>

  <!-- 2 -->
  <line x1="438" y1="198" x2="154" y2="198" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <circle cx="180" cy="180" r="12" fill="#6d28d9"/>
  <text x="180" y="185" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="200" y="186" font-size="16" fill="#4c1d95">로그인 페이지 리다이렉트</text>

  <!-- 3 -->
  <line x1="152" y1="256" x2="436" y2="256" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <circle cx="180" cy="238" r="12" fill="#1d4ed8"/>
  <text x="180" y="243" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="200" y="244" font-size="16" fill="#1e3a8a">로그인 + 권한 동의</text>

  <!-- 4 -->
  <line x1="438" y1="314" x2="154" y2="314" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <circle cx="180" cy="296" r="12" fill="#6d28d9"/>
  <text x="180" y="301" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="200" y="302" font-size="16" fill="#4c1d95"><tspan font-weight="bold">Authorization Code</tspan> 발급</text>

  <!-- 5 -->
  <line x1="152" y1="372" x2="726" y2="372" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <circle cx="180" cy="354" r="12" fill="#1d4ed8"/>
  <text x="180" y="359" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="200" y="360" font-size="16" fill="#1e3a8a"><tspan font-weight="bold">Code</tspan>를 백엔드 서버로 전달</text>

  <!-- 6 -->
  <line x1="728" y1="430" x2="444" y2="430" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <circle cx="470" cy="412" r="12" fill="#047857"/>
  <text x="470" y="417" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="490" y="418" font-size="16" fill="#064e3b"><tspan font-weight="bold">Code</tspan>로 <tspan font-weight="bold">Access Token</tspan> 요청</text>

  <!-- 7 -->
  <line x1="442" y1="488" x2="726" y2="488" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <circle cx="470" cy="470" r="12" fill="#6d28d9"/>
  <text x="470" y="475" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="490" y="476" font-size="16" fill="#4c1d95"><tspan font-weight="bold">Access Token</tspan> 발급</text>
</svg>
