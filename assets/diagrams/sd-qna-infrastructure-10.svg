<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서킷 브레이커 상태 전이</title>
  <desc id="d">서킷 브레이커는 정상 상태인 CLOSED에서 실패 임계치를 넘으면 OPEN이 되어 요청을 차단하고 fallback을 반환한다. 일정 시간 후 HALF-OPEN에서 일부 요청을 테스트해 성공하면 CLOSED, 실패하면 OPEN으로 돌아간다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="440" y="42" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">장애 서비스 호출 차단으로 연쇄 장애 방지</text>

  <!-- 성공 → CLOSED (위쪽 복귀) -->
  <path d="M762,148 V100 H118 V143" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <rect x="372" y="86" width="136" height="28" fill="#ffffff"/>
  <text x="440" y="106" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">성공 → CLOSED</text>

  <!-- 실패 → OPEN (아래쪽 복귀) -->
  <path d="M762,256 V300 H440 V263" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <rect x="546" y="286" width="110" height="28" fill="#ffffff"/>
  <text x="601" y="306" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패 → OPEN</text>

  <!-- CLOSED -->
  <rect x="32" y="150" width="172" height="104" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="118" y="190" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">CLOSED</text>
  <text x="118" y="222" font-size="15" fill="#1f2937" text-anchor="middle">정상 상태</text>

  <!-- OPEN -->
  <rect x="354" y="150" width="172" height="104" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="182" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">OPEN</text>
  <text x="440" y="212" font-size="15" fill="#1f2937" text-anchor="middle">요청 차단,</text>
  <text x="440" y="234" font-size="15" fill="#1f2937" text-anchor="middle">fallback 반환</text>

  <!-- HALF-OPEN -->
  <rect x="676" y="150" width="172" height="104" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="762" y="190" font-size="20" font-weight="bold" fill="#b45309" text-anchor="middle">HALF-OPEN</text>
  <text x="762" y="222" font-size="15" fill="#1f2937" text-anchor="middle">일부 요청 테스트</text>

  <!-- 전이: CLOSED → OPEN, OPEN → HALF-OPEN -->
  <path d="M210,210 H346" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <text x="279" y="196" font-size="15" fill="#b91c1c" text-anchor="middle">실패 임계치 초과</text>
  <path d="M532,210 H668" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr-ink)"/>
  <text x="601" y="196" font-size="15" fill="#374151" text-anchor="middle">일정 시간 후</text>

  <!-- 범례 -->
  <rect x="226" y="338" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="250" y="351" font-size="15" fill="#1f2937">정상 상태</text>
  <rect x="376" y="338" width="16" height="16" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="400" y="351" font-size="15" fill="#1f2937">차단 상태</text>
  <rect x="526" y="338" width="16" height="16" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="550" y="351" font-size="15" fill="#1f2937">시도 상태</text>
</svg>
