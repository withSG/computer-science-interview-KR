<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4. 서킷 브레이커</title>
  <desc id="d">장애 서비스 호출 차단으로 연쇄 장애 방지를 위한 CLOSED, OPEN, HALF-OPEN 상태 전이 다이어그램</desc>
  <rect width="880" height="580" fill="#ffffff"/>

  <defs>
    <!-- Dark Arrow Marker -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- Green Arrow Marker -->
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <!-- Red Arrow Marker -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Top Text -->
  <text x="440" y="46" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">장애 서비스 호출 차단으로 연쇄 장애 방지</text>

  <!-- CLOSED Box (Normal State: Green) -->
  <rect x="290" y="80" width="180" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="380" y="115" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">CLOSED</text>
  <text x="490" y="114" font-size="13" fill="#52606d">← 정상 상태</text>

  <!-- Transition 1: CLOSED -> OPEN -->
  <path d="M380,140 L380,210" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="325" y="163" width="110" height="24" fill="#ffffff"/>
  <text x="380" y="179" font-size="13" fill="#dc2626" text-anchor="middle">실패 임계치 초과</text>

  <!-- OPEN Box (Error/Blocked State: Red) -->
  <rect x="290" y="210" width="180" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="245" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">OPEN</text>
  <text x="490" y="228" font-size="13" fill="#52606d">← 요청 차단, fallback 반환</text>

  <!-- Transition 2: OPEN -> HALF-OPEN -->
  <path d="M380,270 L380,340" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="338" y="293" width="84" height="24" fill="#ffffff"/>
  <text x="380" y="309" font-size="13" fill="#1f2933" text-anchor="middle">일정 시간 후</text>

  <!-- HALF-OPEN Box (Testing State: Yellow/Orange) -->
  <rect x="290" y="340" width="180" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="375" font-size="16" font-weight="bold" fill="#d97706" text-anchor="middle">HALF-OPEN</text>
  <text x="490" y="390" font-size="13" fill="#52606d">← 일부 요청 테스트</text>

  <!-- Transition 3: HALF-OPEN -> CLOSED (Success) -->
  <path d="M290,370 L180,370 L180,110 L290,110" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-green)"/>
  <rect x="130" y="228" width="100" height="24" fill="#ffffff"/>
  <text x="180" y="244" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">성공 → CLOSED</text>

  <!-- Transition 4: HALF-OPEN -> OPEN (Failure) -->
  <path d="M470,370 L580,370 L580,240 L470,240" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="535" y="293" width="90" height="24" fill="#ffffff"/>
  <text x="580" y="309" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">실패 → OPEN</text>

  <!-- Legend -->
  <rect x="250" y="470" width="380" height="60" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="275" y="492" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="297" y="504" font-size="11.5" fill="#1f2933">정상 상태</text>

  <rect x="385" y="492" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="407" y="504" font-size="11.5" fill="#1f2933">차단 상태</text>

  <rect x="495" y="492" width="16" height="16" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="517" y="504" font-size="11.5" fill="#1f2933">시도 상태</text>
</svg>