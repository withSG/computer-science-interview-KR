<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브라우저 렌더링 흐름</title>
  <desc id="d">HTML 파싱은 DOM으로, CSS 파싱은 CSSOM으로 이어지고, 두 결과가 Render Tree로 합쳐진 뒤 Layout, Paint, Composite 순서로 진행된다.</desc>
  <rect width="880" height="200" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- HTML 갈래 -->
  <rect x="28" y="36" width="116" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="86" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">HTML 파싱</text>
  <path d="M146,60 L172,60" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="176" y="36" width="96" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="224" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">DOM</text>

  <!-- CSS 갈래 -->
  <rect x="28" y="116" width="116" height="48" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="86" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">CSS 파싱</text>
  <path d="M146,140 L172,140" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="176" y="116" width="96" height="48" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="224" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">CSSOM</text>

  <!-- 두 갈래가 합쳐짐 -->
  <path d="M272,60 L296,60 L296,140 L272,140" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M296,100 L318,100" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- Render Tree -->
  <rect x="322" y="76" width="136" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="390" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">Render Tree</text>

  <!-- Layout → Paint → Composite -->
  <path d="M460,100 L486,100" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="490" y="76" width="98" height="48" rx="8" fill="#f8fafc" stroke="#4b5563" stroke-width="1.5"/>
  <text x="539" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Layout</text>

  <path d="M590,100 L616,100" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="620" y="76" width="88" height="48" rx="8" fill="#f8fafc" stroke="#4b5563" stroke-width="1.5"/>
  <text x="664" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Paint</text>

  <path d="M710,100 L736,100" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="740" y="76" width="116" height="48" rx="8" fill="#f8fafc" stroke="#4b5563" stroke-width="1.5"/>
  <text x="798" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Composite</text>
</svg>
