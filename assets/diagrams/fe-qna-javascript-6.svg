<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DOM 트리 구조</title>
  <desc id="d">Document, html, head, title, body, div 요소 및 어트리뷰트, 텍스트 노드로 구성된 DOM 트리 계층 구조 다이어그램</desc>
  <rect width="880" height="580" fill="#ffffff"/>

  <!-- Legend -->
  <g opacity="0.9">
    <rect x="520" y="24" width="336" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
    <rect x="532" y="36" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="554" y="48.5" font-size="11.5" fill="#1f2933">문서 노드</text>

    <rect x="618" y="36" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="640" y="48.5" font-size="11.5" fill="#1f2933">요소 노드</text>

    <rect x="704" y="36" width="16" height="16" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="726" y="48.5" font-size="11.5" fill="#1f2933">어트리뷰트</text>

    <rect x="792" y="36" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="814" y="48.5" font-size="11.5" fill="#1f2933">텍스트</text>
  </g>

  <!-- Connectors (Tree Structure Lines) -->
  <path d="
    M 210 50 L 210 110
    M 210 110 L 210 190
    M 210 190 L 300 190
    M 210 110 L 210 270
    M 210 270 L 390 270
    M 390 270 L 390 350
    M 390 350 L 480 350
    M 210 270 L 210 430
    M 210 430 L 570 430
    M 570 430 L 570 505
    M 570 430 L 660 430
  " fill="none" stroke="#cbd2d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Level 0: Document (문서 노드) -->
  <g>
    <rect x="24" y="20" width="220" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="134" y="55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Document (문서 노드)</text>
  </g>

  <!-- Level 1: html (요소 노드) -->
  <g>
    <rect x="114" y="100" width="192" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="210" y="135" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">html (요소 노드)</text>
  </g>

  <!-- Level 2: head (요소 노드) -->
  <g>
    <rect x="204" y="180" width="192" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="300" y="215" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">head (요소 노드)</text>
  </g>

  <!-- Level 3: title (요소 노드) -->
  <g>
    <rect x="294" y="260" width="192" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="390" y="295" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">title (요소 노드)</text>
  </g>

  <!-- Level 4: "Document" (텍스트 노드) -->
  <g>
    <rect x="384" y="340" width="240" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="504" y="375" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">"Document" (텍스트 노드)</text>
  </g>

  <!-- Level 2: body (요소 노드) -->
  <g>
    <rect x="204" y="420" width="192" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="300" y="455" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">body (요소 노드)</text>
  </g>

  <!-- Level 3: div (요소 노드) -->
  <g>
    <rect x="272" y="500" width="192" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="368" y="535" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">div (요소 노드)</text>
  </g>

  <!-- Level 4: id="app" (어트리뷰트 노드) -->
  <g>
    <rect x="478" y="500" width="192" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="574" y="535" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">id="app" (어트리뷰트 노드)</text>
  </g>

  <!-- Level 4: "Hello" (텍스트 노드) -->
  <g>
    <rect x="684" y="500" width="172" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="770" y="535" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">"Hello" (텍스트 노드)</text>
  </g>
</svg>