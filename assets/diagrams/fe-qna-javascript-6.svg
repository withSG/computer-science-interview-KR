<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DOM 트리 구조</title>
  <desc id="d">Document(문서 노드) 아래 html 요소 노드가 있고, html은 head와 body를 자식으로 가집니다. head 아래 title과 텍스트 노드 "Document", body 아래 div와 그 어트리뷰트 노드 id="app", 텍스트 노드 "Hello"가 이어지는 트리입니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 연결선 -->
  <path d="M 430 88 V 120
           M 430 184 V 200 M 220 216 V 200 H 640 V 216
           M 220 280 V 312
           M 640 280 V 312
           M 220 376 V 408
           M 640 376 V 392 M 530 408 V 392 H 750 V 408" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- 0: Document (문서 노드) -->
  <rect x="320" y="24" width="220" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Document</text>
  <text x="430" y="75" font-size="15" fill="#1d4ed8" text-anchor="middle">문서 노드</text>

  <!-- 1: html -->
  <rect x="335" y="120" width="190" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="430" y="148" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">html</text>
  <text x="430" y="171" font-size="15" fill="#047857" text-anchor="middle">요소 노드</text>

  <!-- 2: head -->
  <rect x="125" y="216" width="190" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="220" y="244" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">head</text>
  <text x="220" y="267" font-size="15" fill="#047857" text-anchor="middle">요소 노드</text>

  <!-- 2: body -->
  <rect x="545" y="216" width="190" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="244" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">body</text>
  <text x="640" y="267" font-size="15" fill="#047857" text-anchor="middle">요소 노드</text>

  <!-- 3: title -->
  <rect x="125" y="312" width="190" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="220" y="340" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">title</text>
  <text x="220" y="363" font-size="15" fill="#047857" text-anchor="middle">요소 노드</text>

  <!-- 3: div -->
  <rect x="545" y="312" width="190" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="340" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">div</text>
  <text x="640" y="363" font-size="15" fill="#047857" text-anchor="middle">요소 노드</text>

  <!-- 4: "Document" (텍스트 노드) -->
  <rect x="120" y="408" width="200" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="220" y="436" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"Document"</text>
  <text x="220" y="459" font-size="15" fill="#6d28d9" text-anchor="middle">텍스트 노드</text>

  <!-- 4: id="app" (어트리뷰트 노드) -->
  <rect x="430" y="408" width="200" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="436" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">id="app"</text>
  <text x="530" y="459" font-size="15" fill="#b45309" text-anchor="middle">어트리뷰트 노드</text>

  <!-- 4: "Hello" (텍스트 노드) -->
  <rect x="650" y="408" width="200" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="750" y="436" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"Hello"</text>
  <text x="750" y="459" font-size="15" fill="#6d28d9" text-anchor="middle">텍스트 노드</text>
</svg>
