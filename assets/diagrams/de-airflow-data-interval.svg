<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">데이터 구간과 실제 실행 시각</title>
  <desc id="d">schedule="@daily"인 DAG에서 3월 2일치 구간은 구간이 닫히는 03-03 00:00에 실행되지만, data_interval_start·logical_date·ds는 구간의 시작인 03-02 00:00을 가리킨다. 태스크 안에서 now()나 today()를 읽으면 실행 시각인 03-03 00:00을 읽게 된다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 전제 -->
  <text x="24" y="38" font-size="15" fill="#374151"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#111827">schedule="@daily"</tspan> · Airflow 2 기본 시간표(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CronDataIntervalTimetable</tspan>) 기준</text>

  <!-- 시간축 -->
  <text x="200" y="86" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">03-01 00:00</text>
  <text x="450" y="86" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">03-02 00:00</text>
  <text x="700" y="86" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">03-03 00:00</text>
  <line x1="184" y1="102" x2="848" y2="102" stroke="#6b7280" stroke-width="2" marker-end="url(#ak)"/>

  <!-- 세로 안내선 -->
  <line x1="200" y1="106" x2="200" y2="186" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="450" y1="106" x2="450" y2="244" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="700" y1="106" x2="700" y2="244" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="200" cy="102" r="5" fill="#111827"/>
  <circle cx="450" cy="102" r="5" fill="#111827"/>
  <circle cx="700" cy="102" r="5" fill="#111827"/>

  <!-- 레인 1: 데이터 구간 -->
  <text x="24" y="148" font-size="16" font-weight="bold" fill="#111827">데이터 구간</text>
  <text x="24" y="168" font-size="14" fill="#4b5563">(data interval)</text>

  <rect x="203" y="122" width="244" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="325" y="147" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[03-01 00:00, 03-02 00:00)</text>
  <text x="325" y="170" font-size="14" fill="#374151" text-anchor="middle">3월 1일치 데이터 수집 구간</text>

  <rect x="453" y="122" width="244" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="575" y="147" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[03-02 00:00, 03-03 00:00)</text>
  <text x="575" y="170" font-size="14" fill="#374151" text-anchor="middle">3월 2일치 데이터 수집 구간</text>

  <!-- 구간 종료 → 실행 -->
  <line x1="450" y1="188" x2="450" y2="238" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="700" y1="188" x2="700" y2="238" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="440" y="218" font-size="14" font-weight="bold" fill="#047857" text-anchor="end">구간 종료 즉시 실행</text>
  <text x="690" y="218" font-size="14" font-weight="bold" fill="#047857" text-anchor="end">구간 종료 즉시 실행</text>

  <!-- 레인 2: 실제 실행 시각 -->
  <text x="24" y="256" font-size="16" font-weight="bold" fill="#111827">실제 실행 시각</text>
  <text x="24" y="276" font-size="14" fill="#4b5563">(start_date 기록)</text>

  <path d="M450,243 L459,252 L450,261 L441,252 z" fill="#059669"/>
  <text x="432" y="257" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">03-02 00:00 실행</text>
  <text x="432" y="279" font-size="14" fill="#374151" text-anchor="end">3월 1일치 데이터 처리</text>

  <path d="M700,243 L709,252 L700,261 L691,252 z" fill="#059669"/>
  <text x="682" y="257" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">03-03 00:00 실행</text>
  <text x="682" y="279" font-size="14" fill="#374151" text-anchor="end">3월 2일치 데이터 처리</text>

  <!-- 레인 3: 값이 가리키는 시각 (03-03 00:00 실행분) -->
  <text x="24" y="364" font-size="16" font-weight="bold" fill="#111827">Airflow 변수가</text>
  <text x="24" y="385" font-size="16" font-weight="bold" fill="#111827">가리키는 시각</text>
  <text x="24" y="408" font-size="14" fill="#4b5563">(03-03 00:00 실행분)</text>

  <line x1="466" y1="322" x2="466" y2="187" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="476" y="214" font-size="14" font-weight="bold" fill="#1d4ed8">구간 시작</text>
  <rect x="250" y="324" width="310" height="134" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="266" y="350" font-size="16" font-weight="bold" fill="#1d4ed8">처리 대상 구간의 시작</text>
  <g font-size="15" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">
    <text x="266" y="376">data_interval_start</text>
    <text x="430" y="376" font-weight="bold" fill="#1d4ed8">= 03-02 00:00</text>
    <text x="266" y="400">logical_date</text>
    <text x="430" y="400" font-weight="bold" fill="#1d4ed8">= 03-02 00:00</text>
    <text x="266" y="444">ds</text>
    <text x="430" y="444" font-weight="bold" fill="#1d4ed8">= "2026-03-02"</text>
  </g>
  <text x="282" y="421" font-size="14" fill="#4b5563">(예전 이름 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">execution_date</tspan>)</text>

  <line x1="700" y1="322" x2="700" y2="270" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <rect x="590" y="324" width="266" height="134" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="606" y="350" font-size="16" font-weight="bold" fill="#b91c1c">안티패턴: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">now() / today()</tspan></text>
  <text x="606" y="378" font-size="15" font-weight="bold" fill="#b91c1c">→ 03-03 00:00 을 읽어 버림</text>
  <text x="606" y="406" font-size="14" fill="#374151">3월 2일치가 아닌</text>
  <text x="606" y="427" font-size="14" fill="#374151">3월 3일을 조회할 위험</text>

  <!-- 핵심 -->
  <rect x="24" y="486" width="832" height="70" rx="6" fill="#f3f4f6"/>
  <text x="440" y="514" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">핵심: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">logical_date(ds)</tspan>는 실제 실행 시각이 아니라</text>
  <text x="440" y="541" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle"><tspan fill="#1d4ed8">처리 대상 데이터 구간의 시작 시각</tspan>을 가리킨다</text>
</svg>
