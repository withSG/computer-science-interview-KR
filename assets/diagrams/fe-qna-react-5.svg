<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">useEffect와 useLayoutEffect 실행 순서</title>
  <desc id="d">렌더링, 커밋, useLayoutEffect 실행, 브라우저 페인트, useEffect 실행의 5단계 순서. useLayoutEffect는 브라우저 페인트 전에 동기로, useEffect는 페인트 후에 비동기로 실행된다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 1. 렌더링 -->
  <circle cx="58" cy="51" r="19" fill="#374151"/>
  <text x="58" y="57" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="96" y="24" width="424" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="120" y="57" font-size="18" font-weight="bold" fill="#111827">렌더링<tspan font-size="16" font-weight="normal" fill="#4b5563">  (Virtual DOM 생성)</tspan></text>

  <path d="M308,80 L308,100" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>

  <!-- 2. 커밋 -->
  <circle cx="58" cy="129" r="19" fill="#374151"/>
  <text x="58" y="135" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="96" y="102" width="424" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="120" y="135" font-size="18" font-weight="bold" fill="#111827">커밋<tspan font-size="16" font-weight="normal" fill="#4b5563">  (Real DOM 업데이트)</tspan></text>

  <path d="M308,158 L308,178" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>

  <!-- 3. useLayoutEffect 실행 -->
  <circle cx="58" cy="207" r="19" fill="#6d28d9"/>
  <text x="58" y="213" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="96" y="180" width="424" height="54" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="120" y="213" font-size="18" font-weight="bold" fill="#5b21b6"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">useLayoutEffect</tspan> 실행</text>

  <path d="M564,207 L526,207" stroke="#6d28d9" stroke-width="1.8" fill="none" marker-end="url(#ah-purple)"/>
  <rect x="568" y="180" width="288" height="54" rx="27" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="712" y="202" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle">브라우저 페인트 전</text>
  <text x="712" y="223" font-size="15" fill="#5b21b6" text-anchor="middle">동기 실행 · 렌더링 차단 O</text>

  <path d="M308,236 L308,256" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>

  <!-- 4. 브라우저 페인트 -->
  <circle cx="58" cy="285" r="19" fill="#b45309"/>
  <text x="58" y="291" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="96" y="258" width="424" height="54" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="120" y="291" font-size="18" font-weight="bold" fill="#92400e">브라우저 페인트<tspan font-size="16" font-weight="normal" fill="#92400e">  (화면 그리기)</tspan></text>

  <path d="M308,314 L308,334" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>

  <!-- 5. useEffect 실행 -->
  <circle cx="58" cy="363" r="19" fill="#1d4ed8"/>
  <text x="58" y="369" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="96" y="336" width="424" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="369" font-size="18" font-weight="bold" fill="#1e40af"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">useEffect</tspan> 실행</text>

  <path d="M564,363 L526,363" stroke="#1d4ed8" stroke-width="1.8" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="568" y="336" width="288" height="54" rx="27" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="712" y="358" font-size="17" font-weight="bold" fill="#1e40af" text-anchor="middle">브라우저 페인트 후</text>
  <text x="712" y="379" font-size="15" fill="#1e40af" text-anchor="middle">비동기 실행 · 렌더링 차단 X</text>
</svg>
