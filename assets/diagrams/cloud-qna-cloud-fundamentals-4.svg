<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">클라우드 모델별 책임 분담</title>
  <desc id="d">On-Prem, IaaS, PaaS, SaaS 네 모델에서 Applications부터 Networking까지 아홉 계층을 사용자(You)와 Vendor 중 누가 관리하는지 보여주는 표. 오른쪽 모델로 갈수록 Vendor가 관리하는 계층이 아래에서부터 늘어나고, SaaS에서도 Data는 사용자가 관리한다.</desc>
