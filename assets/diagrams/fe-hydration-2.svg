<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정상 하이드레이션과 mismatch 비교</title>
  <desc id="d">서버 HTML과 클라이언트 첫 렌더가 같으면 DOM을 재사용하고 이벤트만 부착해 빠르다. 값이 다르면 불일치를 감지해 경고와 함께 서버 HTML을 폐기하고 클라이언트 렌더로 재생성하므로 SSR로 아낀 시간을 도로 반납하고 깜빡임이 생긴다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="230" y="52" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">정상</text>
  <rect x="32" y="66" width="396" height="4" fill="#10b981"/>
  <text x="650" y="52" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">mismatch 발생</text>
  <rect x="452" y="66" width="396" height="4" fill="#ef4444"/>

  <!-- 1행: 서버 HTML vs 클라 렌더 -->
  <rect x="32" y="88" width="396" height="100" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="54" y="128" font-size="15" font-weight="bold" fill="#4b5563">서버 HTML</text>
  <text x="160" y="128" font-size="16" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div&gt;<tspan font-weight="bold" fill="#047857">0</tspan>&lt;/div&gt;</text>
  <text x="54" y="166" font-size="15" font-weight="bold" fill="#4b5563">클라 렌더</text>
  <text x="160" y="166" font-size="16" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div&gt;<tspan font-weight="bold" fill="#047857">0</tspan>&lt;/div&gt;</text>

  <rect x="452" y="88" width="396" height="100" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="474" y="128" font-size="15" font-weight="bold" fill="#4b5563">서버 HTML</text>
  <text x="580" y="128" font-size="16" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div&gt;14:03:<tspan font-weight="bold" fill="#b91c1c">22</tspan>&lt;/div&gt;</text>
  <text x="474" y="166" font-size="15" font-weight="bold" fill="#4b5563">클라 렌더</text>
  <text x="580" y="166" font-size="16" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div&gt;14:03:<tspan font-weight="bold" fill="#b91c1c">25</tspan>&lt;/div&gt;</text>

  <line x1="230" y1="192" x2="230" y2="222" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="650" y1="192" x2="650" y2="222" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2행: 판정 -->
  <rect x="32" y="226" width="396" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="230" y="255" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">일치</text>
  <rect x="452" y="226" width="396" height="46" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="650" y="255" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">불일치 감지</text>

  <line x1="230" y1="276" x2="230" y2="304" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="650" y1="276" x2="650" y2="304" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3행: 처리 -->
  <rect x="32" y="308" width="396" height="68" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="230" y="336" font-size="16" fill="#1f2937" text-anchor="middle">DOM 재사용</text>
  <text x="230" y="360" font-size="16" fill="#1f2937" text-anchor="middle">이벤트만 부착</text>
  <rect x="452" y="308" width="396" height="68" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="650" y="336" font-size="16" fill="#1f2937" text-anchor="middle">경고 + 클라이언트 렌더로 폐기·재생성</text>
  <text x="650" y="360" font-size="15" fill="#4b5563" text-anchor="middle">범위: 가장 가까운 Suspense 경계(없으면 루트)까지</text>

  <line x1="230" y1="380" x2="230" y2="408" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="650" y1="380" x2="650" y2="408" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4행: 결과 -->
  <rect x="32" y="412" width="396" height="58" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="230" y="448" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">빠름</text>
  <rect x="452" y="412" width="396" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="447" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">SSR로 아낀 시간을 도로 반납 + 깜빡임</text>
</svg>
