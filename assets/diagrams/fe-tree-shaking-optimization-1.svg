<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트리 셰이킹의 두 단계</title>
  <desc id="d">1단계에서 번들러(webpack의 optimization.usedExports)가 format.js의 세 export 중 main.js가 import한 formatDate만 used로 표시해 번들 export 목록에 등록하고, 2단계에서 미니파이어(Terser 등)가 export도 호출도 되지 않는 도달 불가능한 코드를 삭제해 최종 번들에는 formatDate만 남는다.</desc>
  <rect width="880" height="680" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="agn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="apu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ── 1단계 ── -->
  <rect x="24" y="24" width="76" height="32" rx="16" fill="#1d4ed8"/>
  <text x="62" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1단계</text>
  <text x="114" y="47" font-size="20" font-weight="700" fill="#111827">번들러가 "표시"한다</text>
  <text x="312" y="46" font-size="15" fill="#4b5563">(webpack: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">optimization.usedExports</tspan>)</text>

  <text x="40" y="88" font-size="15" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">format.js</text>
  <rect x="40" y="96" width="440" height="132" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <rect x="46" y="104" width="428" height="36" rx="4" fill="#dcfce7"/>
  <g font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="58" y="127"><tspan fill="#6d28d9">export function</tspan> formatDate(d)</text>
    <text x="376" y="127">{ ... }</text>
    <text x="58" y="167"><tspan fill="#6d28d9">export function</tspan> formatCurrency(n)</text>
    <text x="376" y="167">{ ... }</text>
    <text x="58" y="207"><tspan fill="#6d28d9">export function</tspan> slugify(s)</text>
    <text x="376" y="207">{ ... }</text>
  </g>

  <!-- 사용 여부 표시 -->
  <line x1="522" y1="122" x2="488" y2="122" stroke="#059669" stroke-width="2" marker-end="url(#agn)"/>
  <rect x="528" y="106" width="328" height="32" rx="16" fill="#ecfdf5" stroke="#059669"/>
  <text x="546" y="127" font-size="15" fill="#111827">main.js가 import함 → <tspan font-weight="700" fill="#047857">used</tspan></text>

  <line x1="522" y1="162" x2="488" y2="162" stroke="#dc2626" stroke-width="2" marker-end="url(#ard)"/>
  <rect x="528" y="146" width="328" height="32" rx="16" fill="#fef2f2" stroke="#dc2626"/>
  <text x="546" y="167" font-size="15" fill="#111827">아무도 import 안 함 → <tspan font-weight="700" fill="#b91c1c">unused</tspan></text>

  <line x1="522" y1="202" x2="488" y2="202" stroke="#dc2626" stroke-width="2" marker-end="url(#ard)"/>
  <rect x="528" y="186" width="328" height="32" rx="16" fill="#fef2f2" stroke="#dc2626"/>
  <text x="546" y="207" font-size="15" fill="#111827">아무도 import 안 함 → <tspan font-weight="700" fill="#b91c1c">unused</tspan></text>

  <!-- 미압축 번들 -->
  <line x1="90" y1="234" x2="90" y2="274" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>
  <text x="110" y="259" font-size="15" fill="#374151">미압축 번들을 열어보면 쓰인 export만 등록돼 있다</text>

  <rect x="40" y="282" width="800" height="106" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <g font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="58" y="311">__webpack_require__.d(__webpack_exports__, {</text>
    <text x="85" y="338"><tspan font-weight="700" fill="#047857">formatDate</tspan>: () =&gt; formatDate</text>
    <text x="400" y="338" fill="#4b5563">// formatCurrency·slugify는 목록에 없다</text>
    <text x="58" y="365">});</text>
  </g>

  <line x1="24" y1="414" x2="856" y2="414" stroke="#d1d5db" stroke-dasharray="6 6"/>

  <!-- ── 2단계 ── -->
  <rect x="24" y="436" width="76" height="32" rx="16" fill="#6d28d9"/>
  <text x="62" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2단계</text>
  <text x="114" y="459" font-size="20" font-weight="700" fill="#111827">미니파이어가 "제거"한다</text>
  <text x="352" y="458" font-size="15" fill="#4b5563">(Terser 등)</text>

  <rect x="40" y="492" width="300" height="68" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="190" y="521" text-anchor="middle" font-size="15" fill="#111827">이 함수는 export도 안 되고</text>
  <text x="190" y="545" text-anchor="middle" font-size="15" fill="#111827">파일 안에서 호출되지도 않는다</text>

  <line x1="344" y1="526" x2="384" y2="526" stroke="#7c3aed" stroke-width="2" marker-end="url(#apu)"/>

  <rect x="390" y="492" width="220" height="68" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="500" y="521" text-anchor="middle" font-size="15" fill="#111827">도달 불가능한 코드</text>
  <text x="500" y="545" text-anchor="middle" font-size="15" fill="#111827">(dead code)</text>

  <line x1="614" y1="526" x2="654" y2="526" stroke="#dc2626" stroke-width="2" marker-end="url(#ard)"/>

  <rect x="660" y="492" width="120" height="68" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="720" y="533" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c">삭제</text>

  <line x1="720" y1="564" x2="720" y2="598" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="40" y="604" width="800" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="637" text-anchor="middle" font-size="18" fill="#111827">최종 번들에는 <tspan font-weight="700" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">formatDate</tspan>만 남는다</text>
</svg>
