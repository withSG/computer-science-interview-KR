<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">L1·L2 정규화 수식</title>
  <desc id="d">정규화된 손실은 원래 손실에 λ·페널티를 더한 값이다. L1은 가중치 절댓값 합을 더해 희소 해(특성 선택)를, L2는 가중치 제곱 합을 더해 가중치 축소(weight decay)를 낳는다. λ가 크면 과소적합, 작으면 과적합 위험이 있다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 일반식 -->
  <rect x="270" y="24" width="340" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="59" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">손실 = 원래 손실 + <tspan fill="#b45309">λ · 페널티</tspan></text>

  <!-- 분기 -->
  <path d="M 440 80 L 440 97" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <path d="M 440 97 L 226 97 L 226 114" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 440 97 L 654 97 L 654 114" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- L1 -->
  <rect x="24" y="120" width="404" height="180" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="48" y="152" font-size="18" font-weight="bold" fill="#1d4ed8">L1 (Lasso)</text>
  <text x="226" y="198" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle">Loss + <tspan fill="#b45309">λ Σ|wᵢ|</tspan></text>
  <text x="226" y="228" font-size="15" fill="#4b5563" text-anchor="middle">페널티 = 가중치 절댓값 합</text>
  <path d="M 48 246 L 404 246" stroke="#93c5fd" stroke-width="1" fill="none"/>
  <text x="226" y="280" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">→ 희소(sparse) 해, 특성 선택 효과</text>

  <!-- L2 -->
  <rect x="452" y="120" width="404" height="180" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="476" y="152" font-size="18" font-weight="bold" fill="#6d28d9">L2 (Ridge)</text>
  <text x="654" y="198" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle">Loss + <tspan fill="#b45309">λ Σwᵢ²</tspan></text>
  <text x="654" y="228" font-size="15" fill="#4b5563" text-anchor="middle">페널티 = 가중치 제곱 합</text>
  <path d="M 476 246 L 832 246" stroke="#c4b5fd" stroke-width="1" fill="none"/>
  <text x="654" y="280" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">→ 가중치를 전반적으로 축소(weight decay)</text>

  <!-- λ -->
  <rect x="24" y="328" width="832" height="148" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="362" font-size="18" font-weight="bold" fill="#1f2937"><tspan fill="#b45309">λ(람다)</tspan>: 정규화 강도</text>

  <text x="48" y="414" font-size="17" font-weight="bold" fill="#1f2937">작으면 규제↓</text>
  <text x="48" y="442" font-size="16" font-weight="bold" fill="#b91c1c">과적합 위험</text>

  <text x="832" y="414" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="end">크면 규제↑</text>
  <text x="832" y="442" font-size="16" font-weight="bold" fill="#b45309" text-anchor="end">과소적합 위험</text>

  <path d="M 196 424 L 684 424" stroke="#4b5563" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="440" y="412" font-size="20" font-weight="bold" fill="#b45309" text-anchor="middle">λ</text>
</svg>
