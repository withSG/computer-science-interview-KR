<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">수식</title>
  <desc id="d">L1 및 L2 정규화 수식과 람다(λ) 정규화 강도 설명 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 수식 상단 박스 -->
  <rect x="240" y="24" width="400" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="53" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">손실 = 원래 손실 + λ · 페널티</text>

  <!-- L1 그룹 -->
  <rect x="30" y="98" width="220" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">L1: Loss + λ Σ|wᵢ|</text>

  <path d="M250,122 L310,122" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="310" y="98" width="540" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="580" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">희소(sparse) 해, 특성 선택 효과</text>

  <!-- L2 그룹 -->
  <rect x="30" y="166" width="220" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">L2: Loss + λ Σwᵢ²</text>

  <path d="M250,190 L310,190" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="310" y="166" width="540" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="580" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">가중치를 전반적으로 축소(weight decay)</text>

  <!-- 하단 람다 설명 박스 -->
  <rect x="30" y="244" width="820" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="278.5" text-anchor="middle" font-size="13" fill="#1f2933">
    <tspan font-weight="bold" fill="#d97706">λ(람다):</tspan> 정규화 강도. 크면 규제↑(과소적합 위험), 작으면 규제↓(과적합 위험)
  </text>
</svg>