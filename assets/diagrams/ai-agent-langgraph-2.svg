<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ReAct 루프 예시</title>
  <desc id="d">"서울과 부산 중 지금 더 따뜻한 곳은?"이라는 질문에 에이전트가 Thought, Action, Observation을 두 번 반복해 두 도시 날씨를 확인한 뒤, 세 번째에 Answer로 "부산이 26도로 3도 더 따뜻합니다"라고 답하는 과정입니다. 매 Observation은 컨텍스트에 붙어 다시 모델로 들어갑니다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 사용자 질문 -->
  <rect x="180" y="24" width="520" height="46" rx="23" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="53" font-size="17" fill="#111827" text-anchor="middle"><tspan font-weight="bold">사용자:</tspan> "서울과 부산 중 지금 더 따뜻한 곳은?"</text>
  <path d="M440,70 L440,100" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <!-- 1회차 -->
  <rect x="120" y="104" width="640" height="120" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="121" y="105" width="159" height="118" fill="#f9fafb"/>
  <path d="M280,104 L280,224 M120,144 L760,144 M120,184 L760,184" stroke="#e5e7eb" stroke-width="1.2" fill="none"/>
  <text x="140" y="130" font-size="16" font-weight="bold" fill="#6d28d9">Thought</text>
  <text x="300" y="130" font-size="16" fill="#111827">두 도시 날씨를 각각 알아야 한다</text>
  <text x="140" y="170" font-size="16" font-weight="bold" fill="#b45309">Action</text>
  <text x="300" y="170" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">get_weather(city="서울")</text>
  <text x="140" y="210" font-size="16" font-weight="bold" fill="#047857">Observation</text>
  <text x="300" y="210" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{"temp": 23, "sky": "맑음"}</text>

  <path d="M440,224 L440,290" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="456" y="263" font-size="15" fill="#374151">결과를 컨텍스트에 붙이고 다시 모델로</text>

  <!-- 2회차 -->
  <rect x="120" y="294" width="640" height="120" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="121" y="295" width="159" height="118" fill="#f9fafb"/>
  <path d="M280,294 L280,414 M120,334 L760,334 M120,374 L760,374" stroke="#e5e7eb" stroke-width="1.2" fill="none"/>
  <text x="140" y="320" font-size="16" font-weight="bold" fill="#6d28d9">Thought</text>
  <text x="300" y="320" font-size="16" fill="#111827">부산도 확인해야 한다</text>
  <text x="140" y="360" font-size="16" font-weight="bold" fill="#b45309">Action</text>
  <text x="300" y="360" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">get_weather(city="부산")</text>
  <text x="140" y="400" font-size="16" font-weight="bold" fill="#047857">Observation</text>
  <text x="300" y="400" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{"temp": 26, "sky": "흐림"}</text>

  <path d="M440,414 L440,470" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <!-- 3회차: 답변 -->
  <rect x="120" y="474" width="640" height="80" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="121" y="475" width="159" height="78" fill="#f9fafb"/>
  <rect x="281" y="515" width="478" height="38" fill="#eff6ff"/>
  <path d="M280,474 L280,554 M120,514 L760,514" stroke="#e5e7eb" stroke-width="1.2" fill="none"/>
  <text x="140" y="500" font-size="16" font-weight="bold" fill="#6d28d9">Thought</text>
  <text x="300" y="500" font-size="16" fill="#111827">둘 다 확인했으니 답할 수 있다</text>
  <text x="140" y="540" font-size="16" font-weight="bold" fill="#1d4ed8">Answer</text>
  <text x="300" y="540" font-size="17" font-weight="bold" fill="#111827">부산이 26도로 3도 더 따뜻합니다</text>
</svg>
