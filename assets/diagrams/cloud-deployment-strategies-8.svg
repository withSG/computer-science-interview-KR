<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1350" width="880" height="1350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">확장-수축 패턴 6단계 절차</title>
  <desc id="d">user_name 컬럼을 full_name으로 바꾸는 파괴적 변경을 Expand, 이중 쓰기, 백필, 읽기 전환, 쓰기 정리, Contract의 여섯 단계로 쪼갠 절차와 단계별 SQL·앱 동작을 보여 준다. 1·3·6단계는 DB 작업, 2·4·5단계는 앱 배포이고, 1~5단계는 언제 멈추거나 롤백해도 동작하며 옛 컬럼을 지우는 6단계만 되돌릴 수 없다.</desc>
  <rect width="880" height="1350" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 요점: 1~5단계는 롤백 가능, 6단계만 되돌릴 수 없다 -->
  <circle cx="40" cy="42" r="8" fill="#047857"/>
  <text x="56" y="48" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#047857">1~5단계</tspan>  어느 시점에 멈춰도, 어느 버전으로 롤백해도 동작</text>
  <circle cx="548" cy="42" r="8" fill="#b91c1c"/>
  <text x="564" y="48" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#b91c1c">6단계</tspan>  되돌릴 수 없는 유일한 단계</text>

  <!-- 단계 연결선 -->
  <line x1="52" y1="140" x2="52" y2="286" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="52" y1="332" x2="52" y2="506" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="52" y1="552" x2="52" y2="796" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="52" y1="842" x2="52" y2="1016" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="52" y1="1062" x2="52" y2="1158" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <circle cx="52" cy="118" r="18" fill="#047857"/>
  <text x="52" y="125" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="52" cy="310" r="18" fill="#047857"/>
  <text x="52" y="317" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="52" cy="530" r="18" fill="#047857"/>
  <text x="52" y="537" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="52" cy="820" r="18" fill="#047857"/>
  <text x="52" y="827" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="52" cy="1040" r="18" fill="#047857"/>
  <text x="52" y="1047" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="52" cy="1182" r="18" fill="#b91c1c"/>
  <text x="52" y="1189" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

  <!-- 단계 카드 -->
  <g>
    <rect x="96" y="88" width="760" height="170" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="116" y="124" font-size="19" font-weight="bold" fill="#111827">1단계 · Expand</text>
    <rect x="754" y="105" width="82" height="26" rx="13" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
    <text x="795" y="123" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">DB 작업</text>
    <text x="116" y="154" font-size="16" fill="#1f2937">새 컬럼을 추가만 한다 (nullable, 기본값 있음)</text>
    <rect x="116" y="170" width="720" height="38" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="132" y="195" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">ALTER TABLE users ADD COLUMN full_name VARCHAR(255) NULL;</text>
    <text x="116" y="238" font-size="15" fill="#374151"><tspan fill="#6b7280" font-weight="bold">→</tspan> 이 시점에 배포는 없다. v1은 새 컬럼의 존재를 모르지만 아무 영향 없다.</text>
  </g>
  <g>
    <rect x="96" y="280" width="760" height="198" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="116" y="316" font-size="19" font-weight="bold" fill="#111827">2단계 · 이중 쓰기</text>
    <rect x="754" y="297" width="82" height="26" rx="13" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="795" y="315" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">앱 배포</text>
    <text x="116" y="346" font-size="16" fill="#1f2937">앱을 배포한다. 쓸 때는 양쪽 다, 읽을 때는 아직 옛 컬럼.</text>
    <rect x="116" y="362" width="720" height="66" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <line x1="174" y1="370" x2="174" y2="420" stroke="#d1d5db" stroke-width="1"/>
    <text x="132" y="388" font-size="15" font-weight="bold" fill="#1d4ed8">쓰기</text>
    <text x="186" y="388" font-size="15" fill="#1d4ed8" font-weight="bold"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">INSERT/UPDATE</tspan> 시 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</tspan>과 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</tspan> 모두 채운다</text>
    <text x="820" y="388" font-size="14" fill="#1d4ed8" text-anchor="end">← 이 단계에서 바뀜</text>
    <text x="132" y="414" font-size="15" font-weight="bold" fill="#374151">읽기</text>
    <text x="186" y="414" font-size="15" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SELECT</tspan> 는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</tspan> 사용</text>
    <text x="116" y="458" font-size="15" fill="#374151"><tspan fill="#6b7280" font-weight="bold">→</tspan> 롤백해도 안전하다. v1이 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</tspan>만 써도 데이터가 온전하다.</text>
  </g>
  <g>
    <rect x="96" y="500" width="760" height="268" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="116" y="536" font-size="19" font-weight="bold" fill="#111827">3단계 · 백필</text>
    <rect x="754" y="517" width="82" height="26" rx="13" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
    <text x="795" y="535" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">DB 작업</text>
    <text x="116" y="566" font-size="16" fill="#1f2937">기존 행의 새 컬럼을 채운다.</text>
    <rect x="116" y="582" width="720" height="136" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="132" y="607" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#4b5563">-- MySQL: UPDATE 에 LIMIT 을 붙일 수 있다</text>
    <text x="132" y="629" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">UPDATE users SET full_name = user_name WHERE full_name IS NULL LIMIT 1000;</text>
    <text x="132" y="661" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#4b5563">-- PostgreSQL: UPDATE 는 LIMIT 을 받지 않는다. 키 집합을 서브쿼리로 끊는다</text>
    <text x="132" y="683" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">UPDATE users SET full_name = user_name</text>
    <text x="140" y="705" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">WHERE id IN (SELECT id FROM users WHERE full_name IS NULL LIMIT 1000);</text>
    <text x="116" y="748" font-size="15" fill="#374151"><tspan fill="#6b7280" font-weight="bold">→</tspan> 배치로 나눠 돌린다. 한 번에 하면 대량 락과 긴 트랜잭션으로 서비스가 멈춘다.</text>
  </g>
  <g>
    <rect x="96" y="790" width="760" height="198" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="116" y="826" font-size="19" font-weight="bold" fill="#111827">4단계 · 읽기 전환</text>
    <rect x="754" y="807" width="82" height="26" rx="13" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="795" y="825" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">앱 배포</text>
    <text x="116" y="856" font-size="16" fill="#1f2937">앱을 배포한다. 읽기를 새 컬럼으로 바꾼다.</text>
    <rect x="116" y="872" width="720" height="66" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <line x1="174" y1="880" x2="174" y2="930" stroke="#d1d5db" stroke-width="1"/>
    <text x="132" y="898" font-size="15" font-weight="bold" fill="#374151">쓰기</text>
    <text x="186" y="898" font-size="15" fill="#111827">여전히 양쪽</text>
    <text x="132" y="924" font-size="15" font-weight="bold" fill="#1d4ed8">읽기</text>
    <text x="186" y="924" font-size="15" fill="#1d4ed8" font-weight="bold"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SELECT</tspan> 는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</tspan> 사용</text>
    <text x="820" y="924" font-size="14" fill="#1d4ed8" text-anchor="end">← 이 단계에서 바뀜</text>
    <text x="116" y="968" font-size="15" fill="#374151"><tspan fill="#6b7280" font-weight="bold">→</tspan> 여기서 문제가 생기면 이전 버전으로 롤백하면 된다. 데이터는 양쪽에 다 있다.</text>
  </g>
  <g>
    <rect x="96" y="1010" width="760" height="120" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="116" y="1046" font-size="19" font-weight="bold" fill="#111827">5단계 · 쓰기 정리</text>
    <rect x="754" y="1027" width="82" height="26" rx="13" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="795" y="1045" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">앱 배포</text>
    <text x="116" y="1076" font-size="16" fill="#1f2937">앱을 배포한다. 옛 컬럼 쓰기를 제거한다.</text>
    <text x="116" y="1110" font-size="15" fill="#374151"><tspan fill="#6b7280" font-weight="bold">→</tspan> 관찰 기간을 충분히 둔다. 며칠 단위가 보통이다.</text>
  </g>
  <g>
    <rect x="96" y="1152" width="760" height="170" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="116" y="1188" font-size="19" font-weight="bold" fill="#111827">6단계 · Contract</text>
    <rect x="754" y="1169" width="82" height="26" rx="13" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
    <text x="795" y="1187" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">DB 작업</text>
    <rect x="620" y="1169" width="124" height="26" rx="13" fill="#b91c1c"/>
    <text x="682" y="1187" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">되돌릴 수 없음</text>
    <text x="116" y="1218" font-size="16" fill="#1f2937">아무도 안 쓰는 게 확인되면 옛 컬럼을 제거한다.</text>
    <rect x="116" y="1234" width="720" height="38" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="132" y="1259" font-size="14" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">ALTER TABLE users DROP COLUMN user_name;</text>
    <text x="116" y="1302" font-size="15" fill="#b91c1c" font-weight="bold"><tspan fill="#b91c1c" font-weight="bold">→</tspan> 되돌릴 수 없는 유일한 단계. 그래서 가장 마지막이고, 가장 늦게 한다.</text>
  </g>
</svg>
