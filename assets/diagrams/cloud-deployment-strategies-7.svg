<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컬럼 이름 변경이 전면 장애로 번지는 순서</title>
  <desc id="d">user_name을 full_name으로 바꾸는 마이그레이션을 먼저 실행하고 Rolling Update를 시작하면 남은 v1 인스턴스가 500 에러를 낸다. 놀라서 롤백해도 스키마는 이미 바뀐 상태라 v1 전체가 죽는 5단계 흐름이다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#ffffff"/>

  <!-- 단계 사이 화살표 -->
  <line x1="52" y1="73" x2="52" y2="104" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="52" y1="149" x2="52" y2="180" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="52" y1="225" x2="52" y2="256" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="52" y1="301" x2="52" y2="332" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 1 -->
  <circle cx="52" cy="52" r="18" fill="#374151"/>
  <text x="52" y="58" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="88" y="24" width="768" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="58" font-size="17" fill="#111827"><tspan font-weight="bold">마이그레이션 실행:</tspan><tspan dx="10" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">user_name</tspan><tspan dx="8">→</tspan><tspan dx="8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">full_name</tspan><tspan dx="6">이름 변경</tspan></text>

  <!-- 2 -->
  <circle cx="52" cy="128" r="18" fill="#374151"/>
  <text x="52" y="134" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="88" y="100" width="768" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="134" font-size="17" fill="#111827">Rolling Update 시작</text>

  <!-- 3 -->
  <circle cx="52" cy="204" r="18" fill="#b91c1c"/>
  <text x="52" y="210" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="88" y="176" width="768" height="56" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="108" y="210" font-size="17" fill="#111827">아직 안 바뀐 v1 인스턴스가 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">user_name</tspan>을 조회<tspan dx="10" font-weight="bold" fill="#b91c1c">→</tspan><tspan dx="10">컬럼이 없다</tspan><tspan dx="10" font-weight="bold" fill="#b91c1c">→</tspan><tspan dx="10" font-weight="bold" fill="#b91c1c">500 에러</tspan></text>

  <!-- 4 -->
  <circle cx="52" cy="280" r="18" fill="#b91c1c"/>
  <text x="52" y="286" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="88" y="252" width="768" height="56" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="108" y="286" font-size="17" fill="#111827">놀라서 롤백<tspan dx="10" font-weight="bold" fill="#b91c1c">→</tspan><tspan dx="10">v2를 전부 내림</tspan><tspan dx="10" font-weight="bold" fill="#b91c1c">→</tspan><tspan dx="10" font-weight="bold" fill="#b91c1c">그런데 스키마는 이미 바뀐 상태</tspan></text>

  <!-- 5 -->
  <circle cx="52" cy="356" r="18" fill="#7f1d1d"/>
  <text x="52" y="362" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="88" y="328" width="768" height="56" rx="8" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="108" y="363" font-size="19" font-weight="bold" fill="#ffffff">v1 전체가 죽는다. 서비스 전면 장애.</text>
</svg>
