<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">애플리케이션과 DB의 비대칭</title>
  <desc id="d">배포 중에는 v1과 v2 애플리케이션 인스턴스가 섞여 있지만 모두 한 벌뿐인 DB에 접근한다. 롤백하면 코드는 되돌아가지만 DROP한 컬럼의 데이터는 되돌아오지 않는다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 버전 묶음 표시 -->
  <text x="128" y="42" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">구버전 (v1)</text>
  <polyline points="40,62 40,52 216,52 216,62" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="42" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">신버전 (v2)</text>
  <polyline points="232,62 232,52 408,52 408,62" fill="none" stroke="#6d28d9" stroke-width="1.5"/>

  <!-- 애플리케이션 인스턴스 -->
  <rect x="40" y="68" width="80" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="80" y="98" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="136" y="68" width="80" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="176" y="98" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="232" y="68" width="80" height="48" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="272" y="98" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">v2</text>
  <rect x="328" y="68" width="80" height="48" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="368" y="98" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">v2</text>

  <!-- 모두 같은 DB로 -->
  <line x1="80" y1="118" x2="162" y2="186" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="176" y1="118" x2="206" y2="184" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="272" y1="118" x2="242" y2="184" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="368" y1="118" x2="286" y2="186" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- DB 원통 -->
  <path d="M124,204 L124,272 A100,16 0 0 0 324,272 L324,204" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <ellipse cx="224" cy="204" rx="100" ry="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="224" y="252" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">DB</text>

  <!-- 설명: 애플리케이션 -->
  <line x1="418" y1="92" x2="446" y2="92" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="448" y="48" width="408" height="88" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="468" y="83" font-size="16" font-weight="bold" fill="#111827">애플리케이션은 여러 벌이고 배포 중 섞인다</text>
  <text x="468" y="113" font-size="16" font-weight="bold" fill="#047857">롤백하면 코드는 되돌아간다</text>

  <!-- 설명: DB -->
  <line x1="334" y1="240" x2="446" y2="240" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="448" y="196" width="408" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="468" y="231" font-size="16" font-weight="bold" fill="#111827">DB는 한 벌이다</text>
  <text x="468" y="261" font-size="16" font-weight="bold" fill="#b91c1c">DROP한 컬럼의 데이터는 되돌아오지 않는다</text>
</svg>
