<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비대칭이 문제의 뿌리</title>
  <desc id="d">애플리케이션 v1과 v2 인스턴스가 섞여 DB에 접근하는 비대칭 구조와 그 설명을 나타낸 다이어그램</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 제목 (주어진 문서 헤딩) -->
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#1f2933">비대칭이 문제의 뿌리</text>

  <!-- 애플리케이션 인스턴스 박스들 -->
  <!-- v1 인스턴스 1 -->
  <rect x="50" y="70" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="93" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>

  <!-- v1 인스턴스 2 -->
  <rect x="130" y="70" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="158" y="93" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>

  <!-- v2 인스턴스 1 -->
  <rect x="210" y="70" width="56" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="238" y="93" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">v2</text>

  <!-- v2 인스턴스 2 -->
  <rect x="290" y="70" width="56" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="318" y="93" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">v2</text>

  <!-- 연결선 (브래킷 형태) 및 화살표 -->
  <!-- v1 연결선 (좌측 2개 인스턴스 묶음 -> 왼쪽 화살표) -->
  <path d="M78,106 L78,135 L158,135 L158,106" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M118,135 L118,218" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- v2 연결선 (우측 2개 인스턴스 묶음 -> 오른쪽 화살표) -->
  <path d="M238,106 L238,135 L318,135 L318,106" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  <path d="M278,135 L278,218" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- DB 박스 -->
  <rect x="50" y="220" width="296" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="198" y="255" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">DB</text>

  <!-- 원본 오른편 설명 텍스트 (원본 라벨 그대로 배치) -->
  <!-- 상단 애플리케이션 관련 설명 -->
  <text x="380" y="80" font-size="13" fill="#1f2933">애플리케이션은 여러 벌이고 배포 중 섞인다</text>
  <text x="380" y="102" font-size="13" fill="#52606d">롤백하면 코드는 되돌아간다</text>

  <!-- 하단 DB 관련 설명 -->
  <text x="380" y="240" font-size="13" fill="#1f2933">DB는 한 벌이다</text>
  <text x="380" y="262" font-size="13" fill="#dc2626">DROP한 컬럼의 데이터는 되돌아오지 않는다</text>

  <!-- 범례 (의미 구분을 위한 설명) -->
  <rect x="50" y="315" width="12" height="12" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="70" y="325" font-size="11.5" fill="#52606d">구버전 (v1)</text>

  <rect x="150" y="315" width="12" height="12" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="170" y="325" font-size="11.5" fill="#52606d">신버전 (v2)</text>

  <rect x="250" y="315" width="12" height="12" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="270" y="325" font-size="11.5" fill="#52606d">단일 데이터베이스</text>
</svg>