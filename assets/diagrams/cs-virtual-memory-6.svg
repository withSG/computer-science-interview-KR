<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스래싱 악순환 구조</title>
  <desc id="d">프로세스들이 필요한 페이지를 다 확보하지 못하면 페이지 폴트 급증, 디스크 I/O 대기, CPU 이용률 하락이 이어지고, OS가 프로세스를 더 올리는 함정 때문에 메모리가 더 부족해져 페이지 폴트가 더 급증하는 악순환이 된다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 시작 조건 -->
  <rect x="32" y="24" width="448" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="256" y="54" font-size="16" fill="#111827" text-anchor="middle">프로세스들이 각자 필요한 페이지를 다 확보하지 못함</text>
  <path d="M192,72 V108" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ink)"/>

  <!-- 순환 화살표 -->
  <g stroke="#b91c1c" stroke-width="2.5" fill="none">
    <path d="M352,144 H522" marker-end="url(#red)"/>
    <path d="M748,176 V294" marker-end="url(#red)"/>
    <path d="M648,332 H586" marker-end="url(#red)"/>
    <path d="M320,332 H258" marker-end="url(#red)"/>
    <path d="M142,300 V182" marker-end="url(#red)"/>
  </g>
  <text x="158" y="244" font-size="16" font-weight="bold" fill="#b91c1c">페이지 폴트 더 급증</text>
  <text x="445" y="250" font-size="28" font-weight="bold" fill="#b91c1c" text-anchor="middle">악순환</text>

  <!-- ① 페이지 폴트 급증 -->
  <rect x="32" y="112" width="320" height="64" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="56" cy="144" r="12" fill="#374151"/>
  <text x="56" y="149" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="80" y="150" font-size="17" font-weight="bold" fill="#111827">페이지 폴트 급증</text>

  <!-- ② 디스크 I/O 대기 -->
  <rect x="528" y="112" width="320" height="64" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="552" cy="144" r="12" fill="#374151"/>
  <text x="552" y="149" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="576" y="139" font-size="16" fill="#111827">디스크 I/O 대기로</text>
  <text x="576" y="162" font-size="16" fill="#111827">Waiting 상태에 몰림</text>

  <!-- ③ CPU 이용률 하락 -->
  <rect x="648" y="300" width="200" height="64" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="672" cy="332" r="12" fill="#374151"/>
  <text x="672" y="337" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="696" y="338" font-size="16" fill="#111827">CPU 이용률 하락</text>

  <!-- ④ OS 판단 (함정) -->
  <rect x="320" y="300" width="260" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="344" cy="332" r="12" fill="#b91c1c"/>
  <text x="344" y="337" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="368" y="327" font-size="16" fill="#111827">OS: "CPU가 놀고 있네?</text>
  <text x="368" y="350" font-size="16" fill="#111827">프로세스를 더 올리자"</text>
  <path d="M450,392 V370" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#red)"/>
  <text x="450" y="414" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기가 함정</text>

  <!-- ⑤ 메모리 더 부족 -->
  <rect x="32" y="300" width="220" height="64" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="56" cy="332" r="12" fill="#374151"/>
  <text x="56" y="337" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="80" y="338" font-size="16" fill="#111827">메모리가 더 부족해짐</text>
</svg>
