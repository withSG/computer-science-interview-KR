<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">viewport meta 유무에 따른 반응형 동작 차이</title>
  <desc id="d">viewport meta가 없을 때는 가상 폭 980px로 렌더링되어 미디어 쿼리가 발동하지 않고, width=device-width 설정 시 실제 폭 375px로 렌더링되어 미디어 쿼리가 정상 동작함을 비교 설명하는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Left Column: viewport meta 없음 (실패/무력화 - 빨강/주황 계열 강조) -->
  <rect x="24" y="20" width="404" height="300" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- Sub-header Left -->
  <rect x="44" y="40" width="364" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="226" y="62.6" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">[viewport meta 없음]</text>

  <!-- Status / Process Left -->
  <text x="226" y="104.9" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">가상 폭 980px로 렌더링</text>

  <!-- Screen Representation Left (Wide virtual screen scaled down) -->
  <rect x="84" y="125" width="284" height="90" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="226" y="159.55" font-size="13" fill="#1f2933" text-anchor="middle">아주  작은  글씨들</text>
  <text x="226" y="184.55" font-size="13" fill="#1f2933" text-anchor="middle">전체를 축소해서 보여줌</text>

  <!-- Description / Consequence Left -->
  <text x="226" y="244.55" font-size="13" fill="#dc2626" text-anchor="middle">@media (max-width: 768px) 가</text>
  <text x="226" y="269.55" font-size="13" fill="#dc2626" text-anchor="middle">980 기준으로 판정 → 발동 안 함</text>


  <!-- Right Column: width=device-width (성공/정상 동작 - 파랑/초록 계열 강조) -->
  <rect x="452" y="20" width="404" height="300" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Sub-header Right -->
  <rect x="472" y="40" width="364" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="654" y="62.6" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">[width=device-width]</text>

  <!-- Status / Process Right -->
  <text x="654" y="104.9" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">실제 폭 375px로 렌더링</text>

  <!-- Screen Representation Right (Actual device width, readable) -->
  <rect x="584" y="125" width="140" height="90" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="654" y="159.55" font-size="13" fill="#1f2933" text-anchor="middle">읽을 수</text>
  <text x="654" y="184.55" font-size="13" fill="#1f2933" text-anchor="middle">있는 크기</text>

  <!-- Description / Consequence Right -->
  <text x="654" y="244.55" font-size="13" fill="#059669" text-anchor="middle">미디어 쿼리가 실제 화면 폭으로</text>
  <text x="654" y="269.55" font-size="13" fill="#059669" text-anchor="middle">판정 → 정상 동작</text>
</svg>