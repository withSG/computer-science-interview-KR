<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스크립트의 파서 차단</title>
  <desc id="d">HTML 파싱 중 &lt;script src="a.js"&gt;를 발견하면 파싱이 멈추고, a.js 다운로드와 실행이 끝난 뒤에야 HTML 파싱을 이어서 진행하는 타임라인.</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 기준선: 스크립트 발견 / 실행 끝 -->
  <line x1="340" y1="60" x2="340" y2="218" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="630" y1="80" x2="630" y2="218" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 발견 지점 라벨 -->
  <rect x="222" y="24" width="236" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="340" y="48" text-anchor="middle" font-size="15" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;script src="a.js"&gt;</tspan> 발견</text>

  <!-- 행 라벨 -->
  <text x="108" y="120" text-anchor="end" font-size="16" font-weight="bold" fill="#111827">파서</text>
  <text x="108" y="190" text-anchor="end" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a.js</text>

  <!-- 1행: 파서 -->
  <rect x="124" y="90" width="212" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="230" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">HTML 파싱</text>

  <rect x="344" y="90" width="282" height="48" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="485" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">파싱 멈춤</text>

  <rect x="634" y="90" width="222" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="745" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">HTML 파싱 이어서</text>

  <!-- 2행: a.js -->
  <rect x="344" y="160" width="160" height="48" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="424" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">다운로드</text>

  <rect x="508" y="160" width="118" height="48" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="567" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">실행</text>

  <!-- 시간 축 -->
  <line x1="124" y1="238" x2="850" y2="238" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="856" y="266" text-anchor="end" font-size="15" fill="#4b5563">시간</text>
</svg>
