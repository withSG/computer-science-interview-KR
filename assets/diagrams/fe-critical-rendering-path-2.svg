<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 멈추나</title>
  <desc id="d">HTML 파싱 중 동기 스크립트를 발견했을 때 다운로드와 실행으로 인해 파싱이 중단되고 이어서 진행되는 타임라인 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 메인 배경/가이드 영역 -->
  <rect x="40" y="40" width="800" height="240" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 타임라인 막대 및 트랙 -->
  <!-- 1. HTML 파싱 (첫 번째 구간) -->
  <rect x="80" y="80" width="180" height="36" rx="4" fill="#2563eb"/>
  <text x="170" y="103" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">HTML 파싱</text>

  <!-- 2. 다운로드 -->
  <rect x="360" y="130" width="120" height="36" rx="4" fill="#d97706"/>
  <text x="420" y="153" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">다운로드</text>

  <!-- 3. 실행 -->
  <rect x="480" y="180" width="90" height="36" rx="4" fill="#dc2626"/>
  <text x="525" y="203" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">실행</text>

  <!-- 4. HTML 파싱 이어서 -->
  <rect x="570" y="230" width="230" height="36" rx="4" fill="#2563eb"/>
  <text x="685" y="253" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">HTML 파싱 이어서</text>

  <!-- 파싱 중단 및 재개 연결선 -->
  <path d="M 260,98 L 330,98 C 340,98 345,103 345,113 L 345,235 C 345,245 350,248 360,248 L 570,248" fill="none" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 분기/트리 연결선 -->
  <path d="M 345,148 L 360,148" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M 345,198 L 480,198" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- 이벤트/요소 라벨: <script src="a.js"> 발견 -->
  <g>
    <rect x="348" y="86" width="164" height="24" fill="#ffffff" rx="3" stroke="#9aa5b1" stroke-width="1"/>
    <text x="430" y="102" fill="#1f2933" font-size="11.5" text-anchor="middle">&lt;script src="a.js"&gt; 발견</text>
  </g>

  <!-- 타임라인 진행 화살표 (보조) -->
  <path d="M 80,48 L 800,48" stroke="#cbd2d9" stroke-width="1" fill="none" marker-end="url(#a-ink)"/>
  <text x="800" y="42" fill="#52606d" font-size="11" text-anchor="end">시간 흐름</text>
</svg>