<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">메모리 증가 곡선 세 가지 모양</title>
  <desc id="d">힙 사용량 곡선의 모양으로 진단한다. (a) 톱니형은 GC 후 바닥이 같은 높이라 정상, (b) 계단형은 GC 후 바닥이 계속 올라가 누수 의심, (c) 급등 후 OOM은 특정 API 호출과 시각이 일치하며 단일 요청이 대량 적재한 경우다.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#ffffff"/>

  <!-- (a) 톱니형 -->
  <rect x="24" y="24" width="264" height="312" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="56" font-size="17" font-weight="bold" fill="#111827">(a) 톱니형</text>
  <text x="44" y="80" font-size="15" font-weight="bold" fill="#047857">정상</text>
  <path d="M72,252 V102" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
  <path d="M72,252 H266" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
  <text x="48" y="114" font-size="15" fill="#374151">힙</text>
  <text x="266" y="276" font-size="15" fill="#374151" text-anchor="end">시간</text>
  <path d="M78,212 H258" stroke="#047857" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <path d="M84,212 L126,136 L126,212 L168,136 L168,212 L210,136 L210,212 L252,136" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
  <text x="84" y="238" font-size="14" font-weight="bold" fill="#047857">GC 후 바닥</text>
  <text x="156" y="312" font-size="15" fill="#1f2937" text-anchor="middle">GC 후 바닥이 같은 높이</text>

  <!-- (b) 계단형 -->
  <rect x="308" y="24" width="264" height="312" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="328" y="56" font-size="17" font-weight="bold" fill="#111827">(b) 계단형</text>
  <text x="328" y="80" font-size="15" font-weight="bold" fill="#b45309">누수 의심</text>
  <path d="M356,252 V102" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
  <path d="M356,252 H550" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
  <text x="332" y="114" font-size="15" fill="#374151">힙</text>
  <text x="550" y="276" font-size="15" fill="#374151" text-anchor="end">시간</text>
  <path d="M362,236 H410 V212 H452 V188 H494 V164 H540" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <path d="M368,236 L410,176 L410,212 L452,152 L452,188 L494,128 L494,164 L536,112" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
  <text x="500" y="228" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">GC 후 바닥</text>
  <text x="440" y="312" font-size="15" fill="#1f2937" text-anchor="middle">GC 후 바닥이 계속 올라감</text>

  <!-- (c) 급등 후 OOM -->
  <rect x="592" y="24" width="264" height="312" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="612" y="56" font-size="17" font-weight="bold" fill="#111827">(c) 급등 후 OOM</text>
  <text x="612" y="80" font-size="15" font-weight="bold" fill="#b91c1c">단일 요청이 대량 적재</text>
  <path d="M640,252 V102" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
  <path d="M640,252 H834" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
  <text x="616" y="114" font-size="15" fill="#374151">힙</text>
  <text x="834" y="276" font-size="15" fill="#374151" text-anchor="end">시간</text>
  <path d="M740,108 V258" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M652,228 H740 L778,112 V246" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
  <text x="788" y="122" font-size="15" font-weight="bold" fill="#b91c1c">OOM</text>
  <text x="740" y="276" font-size="14" fill="#374151" text-anchor="middle">특정 API 호출</text>
  <text x="724" y="312" font-size="15" fill="#1f2937" text-anchor="middle">특정 API 호출과 시각이 일치</text>
</svg>
