<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가운데에 로그를 하나 둔다</title>
  <desc id="d">Kafka 토픽들을 중앙에 두고 생산자와 소비자를 분리한 이벤트 로그 중심 구조 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 헤더 (제목 및 연결 수) -->
  <text x="30" y="38.6" fill="#1f2933" font-size="16" font-weight="bold">[이벤트 로그 중심]</text>
  <text x="185" y="38.6" fill="#52606d" font-size="14">생산자 3 + 소비자 5 = 8개의 연결</text>

  <!-- 생산자 (왼쪽, 파랑) -->
  <!-- 주문 -->
  <rect x="50" y="80" width="80" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="104.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">주문</text>

  <!-- 결제 -->
  <rect x="50" y="150" width="80" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="174.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">결제</text>

  <!-- 가입 -->
  <rect x="50" y="220" width="80" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="244.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">가입</text>

  <!-- 중앙: Kafka 토픽들 (보라) -->
  <rect x="330" y="140" width="180" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="420" y="174.55" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">[ Kafka 토픽들 ]</text>

  <!-- 소비자 (오른쪽, 초록) -->
  <!-- 재고 -->
  <rect x="710" y="60" width="80" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="750" y="82.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">재고</text>

  <!-- 배송 -->
  <rect x="710" y="110" width="80" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="750" y="132.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">배송</text>

  <!-- 알림 -->
  <rect x="710" y="160" width="80" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="750" y="182.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">알림</text>

  <!-- 분석 -->
  <rect x="710" y="210" width="80" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="750" y="232.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">분석</text>

  <!-- 추천 -->
  <rect x="710" y="260" width="80" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="750" y="282.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">추천</text>

  <!-- 생산자 -> Kafka 토픽들 연결선 및 화살표 -->
  <!-- 주문 ──┐ -->
  <path d="M130,100 L230,100 L230,170" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <!-- 결제 ──┼──> -->
  <path d="M130,170 L330,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 가입 ──┘ -->
  <path d="M130,240 L230,240 L230,170" stroke="#2563eb" stroke-width="1.5" fill="none"/>

  <!-- Kafka 토픽들 -> 소비자 연결선 및 화살표 -->
  <!-- ├──> 재고 -->
  <path d="M510,170 L610,170 L610,78 L710,78" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <!-- ├──> 배송 -->
  <path d="M610,128 L710,128" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <!-- ├──> 알림 -->
  <path d="M510,170 L710,170" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <!-- ├──> 분석 -->
  <path d="M610,228 L710,228" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <!-- └──> 추천 -->
  <path d="M510,170 L610,170 L610,278 L710,278" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 하단 텍스트 -->
  <text x="50" y="334.02" fill="#52606d" font-size="11.5">생산자는 "무슨 일이 일어났는지"만 기록한다</text>
  <text x="50" y="359.02" fill="#52606d" font-size="11.5">누가 읽는지는 알 필요도, 알 방법도 없다</text>
</svg>