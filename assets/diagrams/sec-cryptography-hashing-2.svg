<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3. 비밀번호는 왜 암호화가 아니라 해싱인가</title>
  <desc id="d">회원가입시 입력된 비밀번호가 해시 함수를 거쳐 DB에 저장되고 로그인 시 입력값이 동일한 해시 함수를 거쳐 DB 값과 비교되는 과정을 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Section 1: 회원가입 -->
  <g id="signup-group">
    <!-- Section Box -->
    <rect x="20" y="20" width="840" height="100" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="35" y="45" font-size="14" font-weight="bold" fill="#1f2933">[ 회원가입 ]</text>

    <!-- Node 1: 입력 "hunter2" -->
    <rect x="120" y="55" width="130" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="185" y="79.2" font-size="13" fill="#1f2933" text-anchor="middle">입력 "hunter2"</text>

    <!-- Arrow 1 -->
    <path d="M250,75 L281,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Node 2: 해시 함수 -->
    <rect x="290" y="55" width="110" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="345" y="79.2" font-size="13" fill="#1f2933" text-anchor="middle">해시 함수</text>

    <!-- Arrow 2 -->
    <path d="M400,75 L431,75" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Node 3: "a3f9c2..." -->
    <rect x="440" y="55" width="110" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="495" y="79.2" font-size="13" fill="#1f2933" text-anchor="middle">"a3f9c2..."</text>

    <!-- Arrow 3 with Label -->
    <path d="M550,75 L739,75" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="580" y="65" width="110" height="20" fill="#ffffff"/>
    <text x="635" y="79.05" font-size="11.5" fill="#52606d" text-anchor="middle">DB에 이것만 저장</text>
  </g>

  <!-- Section 2: 로그인 검증 -->
  <g id="login-group">
    <!-- Section Box -->
    <rect x="20" y="140" width="840" height="120" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="35" y="165" font-size="14" font-weight="bold" fill="#1f2933">[ 로그인 검증 ]</text>

    <!-- Node 1: 입력 "hunter2" -->
    <rect x="120" y="175" width="130" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="185" y="199.2" font-size="13" fill="#1f2933" text-anchor="middle">입력 "hunter2"</text>

    <!-- Arrow 1 -->
    <path d="M250,195 L281,195" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Node 2: 같은 해시 함수 -->
    <rect x="290" y="175" width="120" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="350" y="199.2" font-size="13" fill="#1f2933" text-anchor="middle">같은 해시 함수</text>

    <!-- Arrow 2 -->
    <path d="M410,195 L431,195" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Node 3: "a3f9c2..." -->
    <rect x="440" y="175" width="110" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="495" y="199.2" font-size="13" fill="#1f2933" text-anchor="middle">"a3f9c2..."</text>

    <!-- Arrow 3 -->
    <path d="M550,195 L581,195" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Node 4: DB의 값과 비교 -->
    <rect x="590" y="175" width="120" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="650" y="199.2" font-size="13" fill="#1f2933" text-anchor="middle">DB의 값과 비교</text>

    <!-- Result 1: 같다 → 통과 -->
    <rect x="740" y="160" width="105" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="792.5" y="179.05" font-size="11.5" font-weight="bold" fill="#059669" text-anchor="middle">같다 → 통과</text>

    <!-- Result 2: 다르다 → 실패 -->
    <rect x="740" y="200" width="105" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="792.5" y="219.05" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">다르다 → 실패</text>
  </g>

  <!-- Legend / Footnote -->
  <g id="footnote-group">
    <rect x="20" y="280" width="840" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="440" y="304.05" font-size="11.5" fill="#52606d" text-anchor="middle">원본은 어디에도 남지 않고, 서버는 끝까지 비밀번호를 "알지" 못한다.</text>
  </g>
</svg>