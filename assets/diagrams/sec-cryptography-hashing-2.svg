<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비밀번호 해시 저장과 검증</title>
  <desc id="d">회원가입 때는 입력한 비밀번호를 해시 함수에 넣어 나온 해시값만 DB에 저장한다. 로그인 때는 입력값을 같은 해시 함수로 해싱해 DB의 값과 비교하고, 같으면 통과, 다르면 실패한다. 원본은 어디에도 남지 않는다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ① 회원가입 -->
  <text x="32" y="44" font-size="18" font-weight="bold" fill="#111827">① 회원가입</text>

  <rect x="32" y="60" width="150" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="107" y="92" font-size="16" text-anchor="middle" fill="#111827">입력 "hunter2"</text>
  <path d="M184,86 H212" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="216" y="60" width="130" height="52" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="281" y="92" font-size="16" text-anchor="middle" fill="#111827">해시 함수</text>
  <path d="M348,86 H376" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="380" y="60" width="130" height="52" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="445" y="92" font-size="16" text-anchor="middle" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"a3f9c2..."</text>
  <path d="M512,86 H542" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="546" y="60" width="150" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="621" y="92" font-size="16" font-weight="bold" text-anchor="middle" fill="#5b21b6">DB에 이것만 저장</text>

  <!-- DB 값이 비교 단계로 -->
  <path d="M621,114 V182" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ah-purple)"/>

  <!-- ② 로그인 검증 -->
  <text x="32" y="164" font-size="18" font-weight="bold" fill="#111827">② 로그인 검증</text>

  <rect x="32" y="186" width="150" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="107" y="218" font-size="16" text-anchor="middle" fill="#111827">입력 "hunter2"</text>
  <path d="M184,212 H212" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="216" y="186" width="130" height="52" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="281" y="218" font-size="16" text-anchor="middle" fill="#111827"><tspan font-weight="bold">같은</tspan> 해시 함수</text>
  <path d="M348,212 H376" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="380" y="186" width="130" height="52" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="445" y="218" font-size="16" text-anchor="middle" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"a3f9c2..."</text>
  <path d="M512,212 H542" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <rect x="546" y="186" width="150" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="621" y="218" font-size="16" font-weight="bold" text-anchor="middle" fill="#5b21b6">DB의 값과 비교</text>

  <!-- 결과 분기 -->
  <path d="M698,204 L726,186" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <path d="M698,220 L726,238" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>

  <rect x="730" y="160" width="126" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="793" y="186" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">같다 → 통과</text>

  <rect x="730" y="224" width="126" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="793" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">다르다 → 실패</text>

  <!-- 요점 -->
  <rect x="32" y="290" width="824" height="46" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="444" y="319" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">원본은 어디에도 남지 않고, 서버는 끝까지 비밀번호를 "알지" 못한다.</text>
</svg>
