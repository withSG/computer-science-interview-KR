<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">하이드레이션 과정</title>
  <desc id="d">FCP, 하이드레이션 진행 중, TTI의 3단계 과정을 보여주는 다이어그램</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- 메인 프레임 테두리 -->
  <rect x="40" y="30" width="800" height="240" rx="8" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 구역 1: FCP -->
  <path d="M 40 38 A 8 8 0 0 1 48 30 L 832 30 A 8 8 0 0 1 840 38 L 840 100 L 40 100 Z" fill="#eff6ff"/>
  <text x="60" y="61" font-size="16" font-weight="bold" fill="#2563eb">FCP (First Contentful Paint)</text>
  <text x="60" y="85" font-size="13" fill="#52606d">사용자가 콘텐츠를 봄 (정적)</text>

  <!-- 구분선 1 -->
  <line x1="40" y1="100" x2="840" y2="100" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 구역 2: 하이드레이션 진행 중... -->
  <rect x="40" y="100" width="800" height="80" fill="#fffbeb"/>
  <text x="60" y="131" font-size="16" font-weight="bold" fill="#d97706">하이드레이션 진행 중...</text>
  <text x="60" y="155" font-size="13" fill="#52606d">(버튼 클릭해도 반응 없음)</text>

  <!-- 구분선 2 -->
  <line x1="40" y1="180" x2="840" y2="180" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 구역 3: TTI -->
  <path d="M 40 180 L 840 180 L 840 262 A 8 8 0 0 1 832 270 L 48 270 A 8 8 0 0 1 40 262 Z" fill="#ecfdf5"/>
  <text x="60" y="211" font-size="16" font-weight="bold" fill="#059669">TTI (Time To Interactive)</text>
  <text x="60" y="235" font-size="13" fill="#52606d">페이지가 완전히 인터랙티브</text>
</svg>