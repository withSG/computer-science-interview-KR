<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서킷 브레이커 — 아예 시도하지 않는다</title>
  <desc id="d">CLOSED, OPEN, HALF-OPEN 상태 간의 전환을 나타내는 서킷 브레이커 상태 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <defs>
    <!-- Dark Ink Marker -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- Red Marker for Failure / Open -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <!-- Green Marker for Success / Closed -->
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="38" font-size="16" font-weight="bold" fill="#1f2933">③ 서킷 브레이커 — 아예 시도하지 않는다</text>

  <!-- Legend -->
  <g transform="translate(620, 25)">
    <rect x="0" y="0" width="12" height="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="2"/>
    <text x="18" y="10" font-size="11.5" fill="#52606d">정상</text>
    <rect x="70" y="0" width="12" height="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="2"/>
    <text x="88" y="10" font-size="11.5" fill="#52606d">차단/실패</text>
    <rect x="160" y="0" width="12" height="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="2"/>
    <text x="178" y="10" font-size="11.5" fill="#52606d">탐색</text>
  </g>

  <!-- CLOSED Box -->
  <!-- Box Center: (150, 110), Width: 180, Height: 100 -->
  <rect x="60" y="60" width="180" height="100" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="6"/>
  <text x="150" y="90.5" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">CLOSED</text>
  <text x="150" y="114.5" font-size="13" fill="#1f2933" text-anchor="middle">정상 통과</text>
  <text x="150" y="138.5" font-size="13" fill="#1f2933" text-anchor="middle">통계 수집</text>

  <!-- OPEN Box -->
  <!-- Box Center: (630, 110), Width: 180, Height: 100 -->
  <rect x="540" y="60" width="180" height="100" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
  <text x="630" y="90.5" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">OPEN</text>
  <text x="630" y="114.5" font-size="13" fill="#1f2933" text-anchor="middle">즉시 거절</text>
  <text x="630" y="138.5" font-size="13" fill="#1f2933" text-anchor="middle">fallback</text>

  <!-- HALF-OPEN Box -->
  <!-- Box Center: (630, 260), Width: 180, Height: 70 -->
  <rect x="540" y="225" width="180" height="70" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="6"/>
  <text x="630" y="253.5" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">HALF-OPEN</text>
  <text x="630" y="277.5" font-size="13" fill="#1f2933" text-anchor="middle">소수만 통과</text>

  <!-- ARROW 1: CLOSED -> OPEN (Top) -->
  <path d="M 240,95 L 540,95" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <!-- Label for Arrow 1 -->
  <rect x="325" y="81" width="130" height="20" fill="#ffffff"/>
  <text x="390" y="95.5" font-size="13" fill="#dc2626" text-anchor="middle">실패율 임계치 초과</text>

  <!-- ARROW 2: OPEN -> HALF-OPEN (Right Down) -->
  <path d="M 630,160 L 630,225" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Label for Arrow 2 -->
  <rect x="638" y="182" width="90" height="20" fill="#ffffff"/>
  <text x="643" y="196.5" font-size="13" fill="#52606d" text-anchor="start">대기 시간 경과</text>

  <!-- ARROW 3: HALF-OPEN -> CLOSED (Bottom Loop Left) -->
  <path d="M 540,260 L 150,260 L 150,160" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <!-- Label for Arrow 3 -->
  <rect x="290" y="248" width="110" height="20" fill="#ffffff"/>
  <text x="345" y="262.5" font-size="13" fill="#059669" text-anchor="middle">탐색 호출 성공</text>

  <!-- ARROW 4: HALF-OPEN -> OPEN (Self Loop Back on Right) -->
  <!-- From Right of HALF-OPEN (720, 260) -> (760, 260) -> (760, 110) -> OPEN (720, 110) -->
  <path d="M 720,260 L 760,260 L 760,110 L 720,110" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <!-- Labels for Arrow 4 -->
  <rect x="725" y="248" width="30" height="18" fill="#ffffff"/>
  <text x="727" y="261.5" font-size="13" fill="#dc2626" text-anchor="start">실패</text>
  <rect x="768" y="176" width="70" height="20" fill="#ffffff"/>
  <text x="770" y="190.5" font-size="13" fill="#dc2626" text-anchor="start">다시 OPEN</text>

</svg>