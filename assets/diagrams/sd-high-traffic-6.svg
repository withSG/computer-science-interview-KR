<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서킷 브레이커 상태 전이</title>
  <desc id="d">CLOSED(정상 통과, 통계 수집)에서 실패율이 임계치를 넘으면 OPEN(즉시 거절, fallback)이 되고, 대기 시간이 지나면 HALF-OPEN(소수만 통과)으로 간다. 탐색 호출이 성공하면 CLOSED로, 실패하면 다시 OPEN으로 돌아간다.</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 상태 -->
  <rect x="36" y="36" width="160" height="110" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="116" y="70" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle">CLOSED</text>
  <text x="116" y="100" font-size="16" fill="#111827" text-anchor="middle">정상 통과</text>
  <text x="116" y="124" font-size="16" fill="#111827" text-anchor="middle">통계 수집</text>

  <rect x="360" y="36" width="160" height="110" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="70" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">OPEN</text>
  <text x="440" y="100" font-size="16" fill="#111827" text-anchor="middle">즉시 거절</text>
  <text x="440" y="124" font-size="16" fill="#111827" text-anchor="middle">fallback</text>

  <rect x="684" y="36" width="160" height="110" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="764" y="70" font-size="19" font-weight="bold" fill="#b45309" text-anchor="middle">HALF-OPEN</text>
  <text x="764" y="100" font-size="16" fill="#111827" text-anchor="middle">소수만 통과</text>

  <!-- CLOSED → OPEN -->
  <path d="M200,91 H354" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-r)"/>
  <text x="278" y="79" font-size="15" fill="#b91c1c" text-anchor="middle">실패율 임계치 초과</text>

  <!-- OPEN → HALF-OPEN -->
  <path d="M524,91 H678" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-k)"/>
  <text x="602" y="79" font-size="15" fill="#374151" text-anchor="middle">대기 시간 경과</text>

  <!-- HALF-OPEN → OPEN (실패) -->
  <path d="M724,150 V190 H440 V152" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-r)"/>
  <text x="582" y="214" font-size="15" fill="#b91c1c" text-anchor="middle">실패 시 다시 OPEN</text>

  <!-- HALF-OPEN → CLOSED (성공) -->
  <path d="M804,150 V260 H116 V152" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-g)"/>
  <text x="278" y="248" font-size="15" fill="#047857" text-anchor="middle">탐색 호출 성공</text>
</svg>
