<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서버 로컬 카운터는 무너진다</title>
  <desc id="d">Client에서 서버 A, B, C로 요청이 분산되고, 모든 서버가 중앙 Redis 저장소의 단일 카운터를 참조하는 다이어그램</desc>
  <rect width="880" height="260" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Client Node -->
  <rect x="40" y="105" width="110" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="134" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Client</text>

  <!-- Server Nodes -->
  <!-- Server A -->
  <rect x="250" y="35" width="120" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="310" y="62" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서버 A</text>

  <!-- Server B -->
  <rect x="250" y="107" width="120" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="310" y="134" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서버 B</text>

  <!-- Server C -->
  <rect x="250" y="179" width="120" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="310" y="206" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서버 C</text>

  <!-- Client to Servers Arrows -->
  <path d="M150,130 L190,130 L190,58 L250,58" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M150,130 L250,130" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M150,130 L190,130 L190,202 L250,202" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Redis Box Container -->
  <rect x="430" y="85" width="160" height="90" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="510" y="134" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">Redis</text>

  <!-- Servers to Redis Arrows -->
  <path d="M370,58 L410,58 L410,130 L430,130" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M370,130 L430,130" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M370,202 L410,202 L410,130 L430,130" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Note / Description -->
  <text x="610" y="134" font-size="13" fill="#52606d" text-anchor="start">카운터는 여기 하나만 존재</text>
</svg>