<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">카운터를 Redis 한 곳에 두는 구조</title>
  <desc id="d">Client의 요청이 서버 A, B, C로 나뉘어 들어가지만, 세 서버 모두 같은 Redis의 카운터 하나를 본다. 카운터는 Redis에만 하나 존재한다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="337" y="52" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">서버 3대</text>
  <text x="680" y="52" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">중앙 저장소</text>

  <!-- Client -->
  <rect x="40" y="150" width="130" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="105" y="184" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>

  <!-- Client → 서버 -->
  <line x1="172" y1="178" x2="257" y2="102" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gray)"/>
  <line x1="172" y1="178" x2="257" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gray)"/>
  <line x1="172" y1="178" x2="257" y2="254" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gray)"/>

  <!-- 서버 A/B/C -->
  <rect x="262" y="74" width="150" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="337" y="106" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">서버 A</text>
  <rect x="262" y="152" width="150" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="337" y="184" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">서버 B</text>
  <rect x="262" y="230" width="150" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="337" y="262" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">서버 C</text>

  <!-- 서버 → Redis -->
  <line x1="414" y1="100" x2="515" y2="140" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <line x1="414" y1="178" x2="515" y2="178" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <line x1="414" y1="256" x2="515" y2="216" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <!-- Redis -->
  <rect x="520" y="96" width="320" height="164" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="680" y="160" font-size="26" font-weight="bold" fill="#5b21b6" text-anchor="middle">Redis</text>
  <rect x="552" y="182" width="256" height="44" rx="22" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="680" y="210" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle">카운터는 여기 하나만 존재</text>
</svg>
