<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rolling — 조금씩 바꿔 끼운다</title>
  <desc id="d">롤링 배포 전략에서 인스턴스 4대가 v1에서 v2로 순차적으로 교체되는 과정을 나타낸 5단계 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Step Labels (Left) -->
  <text x="60" y="58" font-size="13" font-weight="bold" fill="#52606d" text-anchor="end">1단계</text>
  <text x="60" y="118" font-size="13" font-weight="bold" fill="#52606d" text-anchor="end">2단계</text>
  <text x="60" y="178" font-size="13" font-weight="bold" fill="#52606d" text-anchor="end">3단계</text>
  <text x="60" y="238" font-size="13" font-weight="bold" fill="#52606d" text-anchor="end">4단계</text>
  <text x="60" y="298" font-size="13" font-weight="bold" fill="#52606d" text-anchor="end">5단계</text>

  <!-- Group 1: [v1][v1][v1][v1] -->
  <g transform="translate(80, 36)">
    <rect x="0" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="28" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
    
    <rect x="66" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="94" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
    
    <rect x="132" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="160" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
    
    <rect x="198" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="226" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
  </g>

  <!-- Group 2: [v2][v1][v1][v1]  ← 한 대 교체, 준비 상태 확인 -->
  <g transform="translate(80, 96)">
    <rect x="0" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="28" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="66" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="94" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
    
    <rect x="132" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="160" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
    
    <rect x="198" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="226" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>

    <!-- Arrow and Label -->
    <path d="M280,18 L330,18" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="342" y="22" font-size="13" fill="#1f2933">한 대 교체, 준비 상태 확인</text>
  </g>

  <!-- Group 3: [v2][v2][v1][v1] -->
  <g transform="translate(80, 156)">
    <rect x="0" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="28" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="66" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="94" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="132" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="160" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
    
    <rect x="198" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="226" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
  </g>

  <!-- Group 4: [v2][v2][v2][v1] -->
  <g transform="translate(80, 216)">
    <rect x="0" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="28" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="66" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="94" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="132" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="160" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="198" y="0" width="56" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="226" y="22" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">v1</text>
  </g>

  <!-- Group 5: [v2][v2][v2][v2] -->
  <g transform="translate(80, 276)">
    <rect x="0" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="28" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="66" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="94" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="132" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="160" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
    
    <rect x="198" y="0" width="56" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="226" y="22" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">v2</text>
  </g>
</svg>