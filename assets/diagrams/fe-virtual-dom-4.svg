<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">크로스 플랫폼 렌더러 구조</title>
  <desc id="d">컴포넌트 코드와 Virtual DOM 트리는 공통이고, 트리를 해석하는 렌더러만 react-dom과 react-native로 바뀌어 각각 HTML 요소와 네이티브 View를 만든다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 공통 구간 -->
  <rect x="160" y="32" width="280" height="56" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="300" y="66" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">컴포넌트 코드 (공통)</text>

  <path d="M300,88 V124" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-gray)"/>

  <rect x="160" y="130" width="280" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="300" y="164" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Virtual DOM 트리 (공통)</text>

  <!-- 분기 -->
  <path d="M300,186 V216 H160 V248" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M300,216 H440 V248" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ah-purple)"/>

  <!-- 렌더러 -->
  <rect x="50" y="254" width="220" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="160" y="286" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">react-dom</text>

  <rect x="330" y="254" width="220" height="52" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="286" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">react-native</text>

  <path d="M160,306 V342" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M440,306 V342" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ah-purple)"/>

  <!-- 결과물 -->
  <rect x="50" y="348" width="220" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="380" font-size="16" fill="#111827" text-anchor="middle">HTML 요소</text>

  <rect x="330" y="348" width="220" height="52" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="440" y="380" font-size="16" fill="#111827" text-anchor="middle">네이티브 View</text>

  <!-- 오른쪽 설명: 공통 구간 -->
  <path d="M586,32 H600 V186 H586" stroke="#6b7280" stroke-width="2" fill="none"/>
  <text x="620" y="88" font-size="18" font-weight="bold" fill="#111827">공통</text>
  <text x="620" y="114" font-size="15" fill="#374151">"무엇을 그릴지"만 담음</text>
  <text x="620" y="138" font-size="15" fill="#374151">재조정 로직 그대로</text>

  <!-- 오른쪽 설명: 교체 구간 -->
  <path d="M586,254 H600 V400 H586" stroke="#6b7280" stroke-width="2" fill="none"/>
  <text x="620" y="320" font-size="18" font-weight="bold" fill="#111827">렌더러만 교체 (커밋 단계)</text>
  <text x="620" y="346" font-size="15" fill="#374151">"어떻게 그릴지"는 렌더러 몫</text>
</svg>
