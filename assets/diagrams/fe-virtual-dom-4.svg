<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">크로스 플랫폼</title>
  <desc id="d">React의 Virtual DOM 트리가 react-dom과 react-native 렌더러를 거쳐 각각 HTML 요소와 네이티브 View로 매핑되는 크로스 플랫폼 구조 다이어그램</desc>
  
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Level 1: 컴포넌트 코드 (공통) -->
  <rect x="330" y="30" width="220" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="58" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">컴포넌트 코드 (공통)</text>

  <!-- Line 1 -> 2 -->
  <path d="M440,76 L440,110" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Level 2: Virtual DOM 트리 (공통) -->
  <rect x="320" y="110" width="240" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="138" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Virtual DOM 트리 (공통)</text>

  <!-- Fork Lines (Level 2 -> Level 3) -->
  <!-- Left branch to react-dom -->
  <path d="M440,156 L440,180 L250,180 L250,210" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Right branch to react-native -->
  <path d="M440,156 L440,180 L630,180 L630,210" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Level 3: Renderers -->
  <!-- react-dom -->
  <rect x="160" y="210" width="180" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="238" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">react-dom</text>

  <!-- react-native -->
  <rect x="540" y="210" width="180" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="238" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">react-native</text>

  <!-- Line 3 -> 4 (Left) -->
  <path d="M250,256 L250,290" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Line 3 -> 4 (Right) -->
  <path d="M630,256 L630,290" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Level 4: Targets -->
  <!-- HTML 요소 -->
  <rect x="160" y="290" width="180" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="318" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">HTML 요소</text>

  <!-- 네이티브 View -->
  <rect x="540" y="290" width="180" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="318" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">네이티브 View</text>
</svg>