<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GitHub Flow 브랜치 흐름</title>
  <desc id="d">main 하나와 수명이 짧은 feature 브랜치로만 이뤄진다. feature는 main에서 갈라져 커밋 두어 개 뒤 PR을 거쳐 다시 main으로 합쳐지고, main은 항상 배포 가능한 상태를 유지한다.</desc>
  <rect width="880" height="310" fill="#ffffff"/>
  <defs>
    <marker id="ah-feat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 레인 배경 -->
  <rect x="24" y="40" width="832" height="80" rx="6" fill="#fef2f2"/>
  <rect x="24" y="130" width="832" height="80" rx="6" fill="#ecfdf5"/>

  <!-- 레인 이름 -->
  <text x="40" y="86" font-size="17" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main</text>
  <text x="40" y="176" font-size="17" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">feature</text>

  <!-- main 레일 -->
  <line x1="150" y1="80" x2="662" y2="80" stroke="#b91c1c" stroke-width="3" marker-end="url(#ah-main)"/>

  <!-- feature 몸통 -->
  <line x1="215" y1="170" x2="255" y2="170" stroke="#047857" stroke-width="3"/>
  <line x1="385" y1="170" x2="425" y2="170" stroke="#047857" stroke-width="3"/>
  <line x1="555" y1="170" x2="595" y2="170" stroke="#047857" stroke-width="3"/>

  <!-- 갈라져 나온다 (점선) -->
  <path d="M180 87 C180 135 192 170 208 170" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M350 87 C350 135 362 170 378 170" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M520 87 C520 135 532 170 548 170" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- PR 로 합쳐 들어간다 (화살표) -->
  <path d="M262 170 C280 170 290 155 290 91" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-feat)"/>
  <path d="M432 170 C450 170 460 155 460 91" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-feat)"/>
  <path d="M602 170 C620 170 630 155 630 91" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-feat)"/>

  <!-- 커밋 점 -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="180" cy="80" r="7" fill="#b91c1c"/>
    <circle cx="290" cy="80" r="7" fill="#b91c1c"/>
    <circle cx="350" cy="80" r="7" fill="#b91c1c"/>
    <circle cx="460" cy="80" r="7" fill="#b91c1c"/>
    <circle cx="520" cy="80" r="7" fill="#b91c1c"/>
    <circle cx="630" cy="80" r="7" fill="#b91c1c"/>
    <circle cx="215" cy="170" r="7" fill="#047857"/>
    <circle cx="255" cy="170" r="7" fill="#047857"/>
    <circle cx="385" cy="170" r="7" fill="#047857"/>
    <circle cx="425" cy="170" r="7" fill="#047857"/>
    <circle cx="555" cy="170" r="7" fill="#047857"/>
    <circle cx="595" cy="170" r="7" fill="#047857"/>
  </g>

  <!-- PR 표시 -->
  <rect x="270" y="114" width="38" height="24" rx="12" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="289" y="131" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">PR</text>
  <rect x="440" y="114" width="38" height="24" rx="12" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="459" y="131" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">PR</text>
  <rect x="610" y="114" width="38" height="24" rx="12" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="629" y="131" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">PR</text>

  <!-- 레인 설명 -->
  <text x="686" y="86" font-size="16" font-weight="bold" fill="#111827">항상 배포 가능한 상태</text>
  <text x="686" y="176" font-size="16" font-weight="bold" fill="#111827">PR을 거쳐 들어온다</text>

  <!-- 범례 -->
  <rect x="24" y="232" width="832" height="54" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="60" y1="259" x2="120" y2="259" stroke="#374151" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="134" y="264" font-size="16" fill="#111827">main에서 갈라져 나온다</text>
  <line x1="460" y1="259" x2="518" y2="259" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-ink)"/>
  <text x="532" y="264" font-size="16" fill="#111827">main으로 합쳐 들어간다</text>
</svg>
