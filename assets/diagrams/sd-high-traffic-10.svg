<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">티켓 오픈 설계 일곱 가지</title>
  <desc id="d">티켓 오픈 설계를 일곱 항목으로 정리했다. 정적 자산과 대기실은 전량 CDN, 입장은 처리 능력 기준 초당 N명, 좌석 조회는 Redis 캐시, 좌석 선점은 DB에 가지 않는 Redis 원자 연산, 결제는 타임아웃과 서킷 브레이커를 건 외부 PG 동기 호출, 확정 후 알림·메일·통계는 큐로 비동기 처리하고, 이벤트 전용 클러스터/DB로 분리해 일반 서비스에 영향이 없게 한다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1 -->
  <circle cx="52" cy="49" r="15" fill="#1d4ed8"/>
  <text x="52" y="54.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="78" y="24" width="286" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="94" y="55" font-size="16" font-weight="bold" fill="#1f2937">정적 자산 + 대기실 페이지</text>
  <path d="M366,49 H402" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ar-blue)"/>
  <rect x="410" y="24" width="430" height="50" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="426" y="55" font-size="16" fill="#1d4ed8"><tspan font-weight="bold">전량 CDN</tspan></text>
  <!-- 2 -->
  <circle cx="52" cy="109" r="15" fill="#1d4ed8"/>
  <text x="52" y="114.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="78" y="84" width="286" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="94" y="115" font-size="16" font-weight="bold" fill="#1f2937">대기실 입장 제어</text>
  <path d="M366,109 H402" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ar-blue)"/>
  <rect x="410" y="84" width="430" height="50" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="426" y="115" font-size="16" fill="#1f2937">실제 처리 능력 기준으로 <tspan font-weight="bold">초당 N명씩 입장</tspan></text>
  <!-- 3 -->
  <circle cx="52" cy="169" r="15" fill="#6d28d9"/>
  <text x="52" y="174.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="78" y="144" width="286" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="94" y="175" font-size="16" font-weight="bold" fill="#1f2937">좌석 조회</text>
  <path d="M366,169 H402" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ar-violet)"/>
  <rect x="410" y="144" width="430" height="50" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="426" y="175" font-size="16" fill="#6d28d9"><tspan font-weight="bold">Redis 캐시</tspan><tspan font-size="15" fill="#4b5563"> (수 초 지연 허용, 표시용)</tspan></text>
  <!-- 4 -->
  <circle cx="52" cy="229" r="15" fill="#6d28d9"/>
  <text x="52" y="234.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="78" y="204" width="286" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="94" y="235" font-size="16" font-weight="bold" fill="#1f2937">좌석 선점</text>
  <path d="M366,229 H402" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ar-violet)"/>
  <rect x="410" y="204" width="430" height="50" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="426" y="235" font-size="16" fill="#6d28d9"><tspan font-weight="bold">Redis 원자 연산.</tspan><tspan font-weight="bold" fill="#1f2937"> DB에 가지 않는다</tspan></text>
  <!-- 5 -->
  <circle cx="52" cy="289" r="15" fill="#b45309"/>
  <text x="52" y="294.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="78" y="264" width="286" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="94" y="295" font-size="16" font-weight="bold" fill="#1f2937">결제</text>
  <path d="M366,289 H402" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ar-amber)"/>
  <rect x="410" y="264" width="430" height="50" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="426" y="295" font-size="16" fill="#b45309"><tspan font-weight="bold">외부 PG 동기 호출</tspan><tspan font-size="15" fill="#4b5563"> (타임아웃 + 서킷 브레이커)</tspan></text>
  <!-- 6 -->
  <circle cx="52" cy="349" r="15" fill="#047857"/>
  <text x="52" y="354.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="78" y="324" width="286" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="94" y="355" font-size="16" font-weight="bold" fill="#1f2937">확정 후 알림·메일·통계</text>
  <path d="M366,349 H402" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ar-green)"/>
  <rect x="410" y="324" width="430" height="50" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="426" y="355" font-size="16" fill="#047857"><tspan font-weight="bold">큐로 비동기</tspan></text>
  <!-- 7 -->
  <circle cx="52" cy="409" r="15" fill="#374151"/>
  <text x="52" y="414.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="78" y="384" width="286" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="94" y="415" font-size="16" font-weight="bold" fill="#1f2937">이벤트 전용 클러스터/DB로 분리</text>
  <path d="M366,409 H402" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ar-slate)"/>
  <rect x="410" y="384" width="430" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="426" y="415" font-size="16" fill="#374151"><tspan font-weight="bold">일반 서비스에 영향 없게</tspan></text>
</svg>
