<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세마포어로 푸는 생산자-소비자</title>
  <desc id="d">버퍼 크기 N인 생산자-소비자에서 세마포어 empty = N, full = 0과 뮤텍스 mutex를 쓴다. 생산자의 full.release()가 소비자의 full.acquire()를, 소비자의 empty.release()가 생산자의 empty.acquire()를 깨우는 알림이 되어, 획득하는 쪽과 해제하는 쪽이 서로 다르다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="28" y="48" font-size="18" font-weight="700" fill="#111827">버퍼 크기 N인 생산자-소비자</text>

  <!-- 초깃값 -->
  <rect x="28" y="66" width="264" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="92" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">empty = N</text>
  <text x="160" y="115" font-size="14" fill="#374151" text-anchor="middle">세마포어 · 빈 칸 수</text>

  <rect x="308" y="66" width="264" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="92" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full = 0</text>
  <text x="440" y="115" font-size="14" fill="#374151" text-anchor="middle">세마포어 · 채워진 칸 수</text>

  <rect x="588" y="66" width="264" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="720" y="92" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mutex</text>
  <text x="720" y="115" font-size="14" fill="#374151" text-anchor="middle">뮤텍스 · 버퍼 보호</text>

  <!-- 열 머리 -->
  <text x="178" y="172" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">생산자</text>
  <text x="702" y="172" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">소비자</text>

  <!-- 생산자 -->
  <rect x="28" y="186" width="300" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="44" y="212" font-size="16" font-weight="700" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">empty.acquire()</text>
  <text x="316" y="211" font-size="14" fill="#92400e" text-anchor="end">← 가득 차면 대기</text>

  <rect x="28" y="236" width="300" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="262" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mutex.lock()</text>

  <rect x="56" y="286" width="272" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="72" y="311" font-size="15" fill="#111827">버퍼에 넣기</text>

  <rect x="28" y="336" width="300" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="362" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mutex.unlock()</text>

  <rect x="28" y="386" width="300" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="44" y="412" font-size="16" font-weight="700" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full.release()</text>

  <!-- 소비자 -->
  <rect x="552" y="186" width="300" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="568" y="212" font-size="16" font-weight="700" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full.acquire()</text>
  <text x="840" y="211" font-size="14" fill="#1e3a8a" text-anchor="end">← 비면 대기</text>

  <rect x="552" y="236" width="300" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="568" y="262" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mutex.lock()</text>

  <rect x="580" y="286" width="272" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="596" y="311" font-size="15" fill="#111827">버퍼에서 꺼내기</text>

  <rect x="552" y="336" width="300" height="40" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="568" y="362" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mutex.unlock()</text>

  <rect x="552" y="386" width="300" height="40" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="568" y="412" font-size="16" font-weight="700" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">empty.release()</text>

  <!-- 알림 화살표 -->
  <line x1="332" y1="406" x2="547" y2="207" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arB)"/>
  <line x1="548" y1="406" x2="333" y2="207" stroke="#b45309" stroke-width="2.5" marker-end="url(#arO)"/>
  <rect x="338" y="349" width="84" height="26" rx="5" fill="#ffffff"/>
  <text x="380" y="367" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">full 알림</text>
  <rect x="455" y="349" width="92" height="26" rx="5" fill="#ffffff"/>
  <text x="501" y="367" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">empty 알림</text>

  <!-- 주의 -->
  <rect x="28" y="450" width="824" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="478" font-size="15" fill="#7f1d1d"><tspan font-weight="700" fill="#b91c1c">주의: </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">empty.acquire()</tspan>와 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">mutex.lock()</tspan>의 순서를 바꾸면 데드락이 난다</text>
</svg>
