<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세 가지 캐시 매핑 방식</title>
  <desc id="d">같은 네 블록 A~D를 직접 매핑은 집합마다 한 자리, 2-way 집합 연관은 집합 안 두 자리, 완전 연관은 어느 칸에나 둔다. 자리 선택지가 늘수록 태그 비교는 1번, 2번, N번으로 늘고 충돌은 잦음에서 크게 감소, 없음으로 줄어든다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- ── 열 1: 직접 매핑 -->
  <rect x="28" y="24" width="264" height="368" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="29" y="25" width="262" height="52" rx="9" fill="#dbeafe"/>
  <text x="160" y="58" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">직접 매핑<tspan font-size="15" font-weight="normal"> Direct-mapped</tspan></text>
  <text x="160" y="118" font-size="15" fill="#374151" text-anchor="middle">블록은 정해진 한 자리에만</text>

  <text x="82" y="171" font-size="15" font-weight="bold" fill="#4b5563">Set0</text>
  <rect x="128" y="150" width="110" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="183" y="172" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">A</text>
  <text x="82" y="209" font-size="15" font-weight="bold" fill="#4b5563">Set1</text>
  <rect x="128" y="188" width="110" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="183" y="210" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">B</text>
  <text x="82" y="247" font-size="15" font-weight="bold" fill="#4b5563">Set2</text>
  <rect x="128" y="226" width="110" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="183" y="248" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">C</text>
  <text x="82" y="285" font-size="15" font-weight="bold" fill="#4b5563">Set3</text>
  <rect x="128" y="264" width="110" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="183" y="286" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">D</text>

  <line x1="44" y1="314" x2="276" y2="314" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="160" y="344" font-size="16" fill="#111827" text-anchor="middle">비교 1번, 회로 단순</text>
  <text x="160" y="372" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">충돌 잦음</text>

  <!-- ── 열 2: 2-way 집합 연관 -->
  <rect x="308" y="24" width="264" height="368" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="309" y="25" width="262" height="52" rx="9" fill="#ede9fe"/>
  <text x="440" y="58" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">2-way 집합 연관</text>
  <text x="440" y="108" font-size="15" fill="#374151" text-anchor="middle">블록은 정해진 집합 안</text>
  <text x="440" y="129" font-size="15" fill="#374151" text-anchor="middle">2개 자리 중 하나에</text>

  <text x="350" y="203" font-size="15" font-weight="bold" fill="#4b5563">Set0</text>
  <rect x="396" y="177" width="136" height="42" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="401" y="182" width="60" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="431" y="204" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">A</text>
  <rect x="467" y="182" width="60" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="497" y="204" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">B</text>

  <text x="350" y="257" font-size="15" font-weight="bold" fill="#4b5563">Set1</text>
  <rect x="396" y="231" width="136" height="42" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="401" y="236" width="60" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="431" y="258" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">C</text>
  <rect x="467" y="236" width="60" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="497" y="258" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">D</text>

  <line x1="324" y1="314" x2="556" y2="314" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="440" y="344" font-size="16" fill="#111827" text-anchor="middle">비교 2번</text>
  <text x="440" y="372" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">충돌 크게 감소</text>

  <!-- ── 열 3: 완전 연관 -->
  <rect x="588" y="24" width="264" height="368" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="589" y="25" width="262" height="52" rx="9" fill="#fef3c7"/>
  <text x="720" y="58" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">완전 연관</text>
  <text x="720" y="118" font-size="15" fill="#374151" text-anchor="middle">블록은 어디든</text>

  <rect x="611" y="174" width="218" height="42" rx="6" fill="#fffbeb" stroke="#92400e" stroke-width="1.5"/>
  <rect x="615" y="179" width="48" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="639" y="201" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">A</text>
  <rect x="669" y="179" width="48" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="693" y="201" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">B</text>
  <rect x="723" y="179" width="48" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="747" y="201" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">C</text>
  <rect x="777" y="179" width="48" height="32" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="801" y="201" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">D</text>
  <text x="720" y="246" font-size="15" fill="#374151" text-anchor="middle">어느 칸이든 가능</text>
  <text x="720" y="270" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">→ 전 칸을 다 비교</text>

  <line x1="604" y1="314" x2="836" y2="314" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="720" y="344" font-size="16" fill="#111827" text-anchor="middle">비교 N번, 회로 비쌈</text>
  <text x="720" y="372" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">충돌 없음</text>
</svg>
