<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세 가지 매핑 방식</title>
  <desc id="d">직접 매핑, 2-way 집합 연관, 완전 연관 방식의 캐시 매핑 방식 비교 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title / Section Heading -->
  <text x="24" y="32" font-size="16" font-weight="bold" fill="#1f2933">세 가지 매핑 방식</text>

  <!-- Section 1: 직접 매핑 Direct-mapped -->
  <rect x="24" y="50" width="264" height="316" rx="8" ry="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- Header Block 1 -->
  <rect x="36" y="62" width="240" height="60" rx="4" ry="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="156" y="85" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[직접 매핑 Direct-mapped]</text>
  <text x="156" y="107" font-size="11.5" fill="#52606d" text-anchor="middle">블록은 정해진 한 자리에만</text>

  <!-- Grid 1 -->
  <g transform="translate(76, 136)">
    <!-- Set 0 -->
    <text x="0" y="22" font-size="13" font-weight="bold" fill="#1f2933">Set0</text>
    <rect x="45" y="0" width="100" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="95" y="20" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text>

    <!-- Set 1 -->
    <text x="0" y="58" font-size="13" font-weight="bold" fill="#1f2933">Set1</text>
    <rect x="45" y="36" width="100" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="95" y="56" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>

    <!-- Set 2 -->
    <text x="0" y="94" font-size="13" font-weight="bold" fill="#1f2933">Set2</text>
    <rect x="45" y="72" width="100" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="95" y="92" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>

    <!-- Set 3 -->
    <text x="0" y="130" font-size="13" font-weight="bold" fill="#1f2933">Set3</text>
    <rect x="45" y="108" width="100" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="95" y="128" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">D</text>
  </g>

  <!-- Description 1 -->
  <text x="36" y="318" font-size="11.5" fill="#1f2933">비교 1번, 회로 단순</text>
  <text x="36" y="340" font-size="11.5" fill="#dc2626">충돌 잦음</text>


  <!-- Section 2: 2-way 집합 연관 -->
  <rect x="308" y="50" width="264" height="316" rx="8" ry="8" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- Header Block 2 -->
  <rect x="320" y="62" width="240" height="60" rx="4" ry="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="82" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">[2-way 집합 연관]</text>
  <text x="440" y="100" font-size="11.5" fill="#52606d" text-anchor="middle">블록은 정해진 집합 안</text>
  <text x="440" y="114" font-size="11.5" fill="#52606d" text-anchor="middle">2개 자리 중 하나에</text>

  <!-- Grid 2 -->
  <g transform="translate(350, 154)">
    <!-- Set 0 -->
    <text x="0" y="22" font-size="13" font-weight="bold" fill="#1f2933">Set0</text>
    <rect x="45" y="0" width="60" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="75" y="20" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text>
    <rect x="105" y="0" width="60" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="135" y="20" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>

    <!-- Set 1 -->
    <text x="0" y="70" font-size="13" font-weight="bold" fill="#1f2933">Set1</text>
    <rect x="45" y="48" width="60" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="75" y="68" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>
    <rect x="105" y="48" width="60" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="135" y="68" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">D</text>
  </g>

  <!-- Description 2 -->
  <text x="320" y="318" font-size="11.5" fill="#1f2933">비교 2번</text>
  <text x="320" y="340" font-size="11.5" fill="#059669">충돌 크게 감소</text>


  <!-- Section 3: 완전 연관 -->
  <rect x="592" y="50" width="264" height="316" rx="8" ry="8" fill="#fffbeb" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- Header Block 3 -->
  <rect x="604" y="62" width="240" height="60" rx="4" ry="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="724" y="85" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[완전 연관]</text>
  <text x="724" y="107" font-size="11.5" fill="#52606d" text-anchor="middle">블록은 어디든</text>

  <!-- Grid 3 -->
  <g transform="translate(624, 154)">
    <rect x="0" y="0" width="50" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="25" y="20" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text>
    <rect x="50" y="0" width="50" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="75" y="20" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>
    <rect x="100" y="0" width="50" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="125" y="20" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>
    <rect x="150" y="0" width="50" height="32" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="175" y="20" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">D</text>

    <!-- Label & Arrow inside section -->
    <text x="100" y="58" font-size="11.5" fill="#52606d" text-anchor="middle">어느 칸이든 가능</text>
    <path d="M20,72 L36,72" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="44" y="76" font-size="11.5" fill="#1f2933">전 칸을 다 비교</text>
  </g>

  <!-- Description 3 -->
  <text x="604" y="318" font-size="11.5" fill="#1f2933">비교 N번, 회로 비쌈</text>
  <text x="604" y="340" font-size="11.5" fill="#059669">충돌 없음</text>
</svg>