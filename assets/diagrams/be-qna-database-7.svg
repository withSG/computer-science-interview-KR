<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">엔티티 생명주기</title>
  <desc id="d">엔티티는 비영속(new)에서 영속(managed)이 되고, 영속 상태에서 준영속(detached) 또는 삭제(removed) 중 하나로 넘어간다.</desc>
  <rect width="880" height="260" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. 비영속 -->
  <rect x="40" y="92" width="180" height="76" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="130" y="126" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">비영속</text>
  <text x="130" y="152" font-size="15" text-anchor="middle" fill="#4b5563">(new)</text>

  <!-- 비영속 → 영속 -->
  <path d="M222,130 H300" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 2. 영속 -->
  <rect x="306" y="86" width="186" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="399" y="125" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">영속</text>
  <text x="399" y="152" font-size="15" text-anchor="middle" fill="#1e40af">(managed)</text>

  <!-- 영속 → 준영속 / 삭제 (분기) -->
  <path d="M494,130 H556" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M556,130 V68 H622" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M556,130 V192 H622" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 3a. 준영속 -->
  <rect x="630" y="30" width="210" height="76" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="735" y="64" font-size="20" font-weight="bold" text-anchor="middle" fill="#78350f">준영속</text>
  <text x="735" y="90" font-size="15" text-anchor="middle" fill="#92400e">(detached)</text>

  <!-- 또는 -->
  <text x="735" y="136" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">또는</text>

  <!-- 3b. 삭제 -->
  <rect x="630" y="154" width="210" height="76" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="735" y="188" font-size="20" font-weight="bold" text-anchor="middle" fill="#7f1d1d">삭제</text>
  <text x="735" y="214" font-size="15" text-anchor="middle" fill="#991b1b">(removed)</text>
</svg>
