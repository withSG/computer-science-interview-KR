<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HTTP/2 멀티플렉싱</title>
  <desc id="d">클라이언트가 단일 연결에서 요청1·2·3을 동시에 보내고, 서버의 응답은 요청 순서와 달리 응답2, 응답1, 응답3 순으로 돌아오는 모습.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  </defs>

  <!-- 단일 연결 영역 -->
  <rect x="112" y="88" width="656" height="288" fill="#f1f5f9"/>
  <text x="440" y="118" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">단일 연결에서 동시에 여러 요청/응답</text>

  <!-- 참여자 -->
  <rect x="32" y="24" width="160" height="48" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="112" y="54" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">클라이언트</text>
  <rect x="688" y="24" width="160" height="48" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="768" y="54" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">서버</text>
  <line x1="112" y1="72" x2="112" y2="392" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="768" y1="72" x2="768" y2="392" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 요청 (실선, 클라이언트 → 서버) -->
  <line x1="116" y1="152" x2="762" y2="152" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#mb)"/>
  <text x="100" y="158" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="end">요청1</text>
  <line x1="116" y1="188" x2="762" y2="188" stroke="#047857" stroke-width="2.5" marker-end="url(#mg)"/>
  <text x="100" y="194" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">요청2</text>
  <line x1="116" y1="224" x2="762" y2="224" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#mp)"/>
  <text x="100" y="230" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="end">요청3</text>

  <!-- 응답 (점선, 서버 → 클라이언트) -->
  <line x1="764" y1="276" x2="118" y2="276" stroke="#047857" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#mg)"/>
  <text x="780" y="282" font-size="16" font-weight="bold" fill="#047857">응답2</text>
  <line x1="764" y1="312" x2="118" y2="312" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#mb)"/>
  <text x="780" y="318" font-size="16" font-weight="bold" fill="#1d4ed8">응답1</text>
  <line x1="764" y1="348" x2="118" y2="348" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#mp)"/>
  <text x="780" y="354" font-size="16" font-weight="bold" fill="#6d28d9">응답3</text>

  <!-- 순서 비교 -->
  <text x="300" y="422" font-size="16" fill="#1f2937" text-anchor="middle">요청 순서  <tspan font-weight="bold" fill="#1d4ed8">1</tspan> → <tspan font-weight="bold" fill="#047857">2</tspan> → <tspan font-weight="bold" fill="#6d28d9">3</tspan></text>
  <line x1="440" y1="404" x2="440" y2="428" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="580" y="422" font-size="16" fill="#1f2937" text-anchor="middle">응답 순서  <tspan font-weight="bold" fill="#047857">2</tspan> → <tspan font-weight="bold" fill="#1d4ed8">1</tspan> → <tspan font-weight="bold" fill="#6d28d9">3</tspan></text>
</svg>
