<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SSE(Server-Sent Events) 특징</title>
  <desc id="d">HTTP 기반 단방향 자동 재연결 텍스트 데이터 통신 특징 다이어그램</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 제목 섹션 -->
  <text x="24" y="38" font-size="16" font-weight="bold" fill="#1f2933">특징:</text>

  <!-- 카드 1: HTTP 기반 -->
  <g transform="translate(24, 60)">
    <rect width="396" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="12" fill="#2563eb"/>
    <text x="28" y="34" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="48" y="34" font-size="14" font-weight="bold" fill="#1f2933">HTTP 기반</text>
    <text x="48" y="66" font-size="13" fill="#52606d">(방화벽 친화적)</text>
  </g>

  <!-- 카드 2: 단방향 -->
  <g transform="translate(460, 60)">
    <rect width="396" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="12" fill="#059669"/>
    <text x="28" y="34" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="48" y="34" font-size="14" font-weight="bold" fill="#1f2933">단방향</text>
    
    <!-- 서버 -> 클라이언트 흐름 시각화 -->
    <rect x="48" y="52" width="70" height="26" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="83" y="69" font-size="12" fill="#1f2933" text-anchor="middle">서버</text>
    
    <path d="M124,65 L170,65" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    
    <rect x="176" y="52" width="90" height="26" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="221" y="69" font-size="12" fill="#1f2933" text-anchor="middle">클라이언트만</text>
  </g>

  <!-- 카드 3: 자동 재연결 -->
  <g transform="translate(24, 180)">
    <rect width="396" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="12" fill="#d97706"/>
    <text x="28" y="34" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="48" y="34" font-size="14" font-weight="bold" fill="#1f2933">자동 재연결</text>
    <text x="48" y="66" font-size="13" fill="#52606d">연결 유실 시 EventSource가 자동 복구</text>
  </g>

  <!-- 카드 4: 텍스트 데이터 -->
  <g transform="translate(460, 180)">
    <rect width="396" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="12" fill="#7c3aed"/>
    <text x="28" y="34" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="48" y="34" font-size="14" font-weight="bold" fill="#1f2933">텍스트 데이터</text>
    <text x="48" y="66" font-size="13" fill="#52606d">UTF-8 인코딩 (JSON/문자열 전송)</text>
  </g>
</svg>