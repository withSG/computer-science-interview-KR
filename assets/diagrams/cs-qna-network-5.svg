<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SSE 특징</title>
  <desc id="d">SSE는 HTTP 기반으로 서버에서 클라이언트로만 이벤트를 보내며, 연결이 끊기면 EventSource가 자동 재연결하고 텍스트 데이터를 전송한다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  </defs>

  <!-- 개념도: 서버 → 클라이언트 단방향 -->
  <rect x="40" y="32" width="160" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="120" y="70" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">서버</text>
  <rect x="680" y="32" width="160" height="64" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="760" y="60" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">클라이언트</text>
  <text x="760" y="84" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">EventSource</text>

  <line x1="206" y1="64" x2="672" y2="64" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>
  <rect x="268" y="51" width="72" height="26" rx="13" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="304" y="69" font-size="14" fill="#1d4ed8" text-anchor="middle">이벤트</text>
  <rect x="404" y="51" width="72" height="26" rx="13" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="69" font-size="14" fill="#1d4ed8" text-anchor="middle">이벤트</text>
  <rect x="540" y="51" width="72" height="26" rx="13" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="576" y="69" font-size="14" fill="#1d4ed8" text-anchor="middle">이벤트</text>
  <text x="440" y="38" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">HTTP</text>
  <text x="440" y="100" font-size="15" fill="#374151" text-anchor="middle">서버 → 클라이언트 한 방향</text>

  <!-- 특징 목록 -->
  <rect x="24" y="128" width="832" height="52" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="56" cy="154" r="14" fill="#1d4ed8"/>
  <text x="56" y="159" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="160" font-size="17" font-weight="bold" fill="#111827">HTTP 기반</text>
  <text x="252" y="160" font-size="16" fill="#374151">방화벽 친화적</text>

  <rect x="24" y="190" width="832" height="52" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="56" cy="216" r="14" fill="#1d4ed8"/>
  <text x="56" y="221" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="222" font-size="17" font-weight="bold" fill="#111827">단방향</text>
  <text x="252" y="222" font-size="16" fill="#374151">서버 → 클라이언트만</text>

  <rect x="24" y="252" width="832" height="52" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="56" cy="278" r="14" fill="#1d4ed8"/>
  <text x="56" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="84" y="284" font-size="17" font-weight="bold" fill="#111827">자동 재연결</text>
  <text x="252" y="284" font-size="16" fill="#374151">연결 유실 시 EventSource가 자동 복구</text>

  <rect x="24" y="314" width="832" height="52" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="56" cy="340" r="14" fill="#1d4ed8"/>
  <text x="56" y="345" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="84" y="346" font-size="17" font-weight="bold" fill="#111827">텍스트 데이터</text>
  <text x="252" y="346" font-size="16" fill="#374151">UTF-8 인코딩 (JSON/문자열 전송)</text>
</svg>
