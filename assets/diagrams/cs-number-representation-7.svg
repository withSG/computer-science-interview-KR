<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">값 계산해 보기</title>
  <desc id="d">0.1을 2진수로 변환, 정규화, 지수 필드 E 계산 및 52비트 가수 필드 M의 잘림과 반올림 과정을 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Step 1: 0.1 을 2진수로 -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="820" height="44" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="20" y="27" font-size="14" font-weight="bold" fill="#1f2933">0.1 을 2진수로:</text>
    <text x="160" y="27" font-size="14" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">0.0001100110011001100...</text>
    <text x="440" y="27" font-size="13" fill="#52606d">("0011" 무한 반복)</text>
  </g>

  <!-- Step 2: 정규화 -->
  <g transform="translate(30, 94)">
    <rect x="0" y="0" width="820" height="96" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="20" y="32" font-size="14" font-weight="bold" fill="#1f2933">정규화:</text>
    
    <!-- 수식 영역 -->
    <text x="160" y="32" font-size="14" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">
      1.<tspan fill="#2563eb" font-weight="bold">100110011001100...</tspan> × 2<tspan dy="-6" font-size="11" fill="#7c3aed" font-weight="bold">-4</tspan><tspan dy="6" font-size="14"> </tspan>
    </text>

    <!-- 가수 포인터 line & label -->
    <path d="M 176,42 L 176,56 L 316,56 L 316,42" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <text x="246" y="73" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">└──── 가수 ────┘</text>

    <!-- 지수 포인터 line & label -->
    <path d="M 346,42 L 346,56 L 416,56 L 416,42" fill="none" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="381" y="73" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="bold">└ 지수 -4</text>
  </g>

  <!-- Step 3: 지수 필드 E -->
  <g transform="translate(30, 208)">
    <rect x="0" y="0" width="820" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="20" y="27" font-size="14" font-weight="bold" fill="#7c3aed">지수 필드 E = -4 + 1023 = 1019</text>
  </g>

  <!-- Step 4: 가수 필드 M -->
  <g transform="translate(30, 262)">
    <rect x="0" y="0" width="820" height="88" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="20" y="32" font-size="14" font-weight="bold" fill="#2563eb">가수 필드 M =</text>

    <!-- 가수 비트 스트링 -->
    <g transform="translate(145, 18)" font-family="'Consolas', 'Courier New', monospace" font-size="13.5">
      <!-- 52 비트 저장 영역 -->
      <text x="0" y="14" fill="#1f2933">1001100110011001100110011001100110011001100110011001</text>
      <!-- 파이프 구분선 및 잘리는 부분 -->
      <text x="432" y="14" fill="#dc2626" font-weight="bold">|1001...</text>
    </g>

    <!-- 화살표 (잘리는 위치 가리킴) -->
    <path d="M 581,60 L 581,38" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- 설명 각주 -->
    <text x="581" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">52비트에서 잘리고 반올림</text>
  </g>
</svg>