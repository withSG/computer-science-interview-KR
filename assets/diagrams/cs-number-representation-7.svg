<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">0.1을 double로 인코딩</title>
  <desc id="d">0.1을 2진수로 바꾸면 0.0001100110011001100...처럼 0011이 무한 반복됩니다. 정규화하면 1.100110011001100... × 2의 -4승이 되고, 지수 필드 E는 -4 + 1023 = 1019, 가수 필드 M은 1001이 반복되는 비트열을 52비트에서 잘라 반올림한 값입니다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 단계 연결선 -->
  <g stroke="#d1d5db" stroke-width="2">
    <line x1="40" y1="63" x2="40" y2="139"/>
    <line x1="40" y1="173" x2="40" y2="273"/>
    <line x1="40" y1="307" x2="40" y2="389"/>
  </g>
  <!-- 단계 번호 -->
  <g font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="40" cy="46" r="15" fill="#1f2937"/><text x="40" y="52">1</text>
    <circle cx="40" cy="156" r="15" fill="#1f2937"/><text x="40" y="162">2</text>
    <circle cx="40" cy="290" r="15" fill="#1f2937"/><text x="40" y="296">3</text>
    <circle cx="40" cy="406" r="15" fill="#1f2937"/><text x="40" y="412">4</text>
  </g>

  <!-- ① 0.1 을 2진수로 -->
  <text x="72" y="52" font-size="17" font-weight="bold" fill="#111827">0.1을 2진수로</text>
  <rect x="110" y="75" width="56" height="32" rx="4" fill="#fef3c7"/>
  <rect x="172" y="75" width="56" height="32" rx="4" fill="#fef3c7"/>
  <rect x="234" y="75" width="56" height="32" rx="4" fill="#fef3c7"/>
  <rect x="296" y="75" width="56" height="32" rx="4" fill="#fef3c7"/>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="20" fill="#111827">
    <text x="72" y="98">0.0</text>
    <text x="116" y="98">0011</text>
    <text x="178" y="98">0011</text>
    <text x="240" y="98">0011</text>
    <text x="302" y="98">0011</text>
    <text x="358" y="98">00...</text>
  </g>
  <text x="436" y="97" font-size="16" font-weight="bold" fill="#b45309">← "0011" 무한 반복</text>

  <!-- ② 정규화 -->
  <text x="72" y="162" font-size="17" font-weight="bold" fill="#111827">정규화</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="20" fill="#111827">
    <text x="72" y="208">1.</text>
    <text x="94" y="208" font-weight="bold" fill="#1d4ed8">100110011001100...</text>
    <text x="304" y="208">× 2</text>
    <text x="339" y="197" font-size="15" font-weight="bold" fill="#6d28d9">-4</text>
  </g>
  <path d="M96,218 V226 H290 V218" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="193" y="250" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">가수</text>
  <path d="M326,218 V226 H356 V218" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="341" y="250" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">지수 -4</text>

  <!-- ③ 지수 필드 E -->
  <text x="72" y="296" font-size="17" font-weight="bold" fill="#111827">지수 필드 E</text>
  <text x="72" y="342" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="20" fill="#111827" xml:space="preserve">E = <tspan font-weight="bold" fill="#6d28d9">-4</tspan> + 1023 = <tspan font-weight="bold" fill="#6d28d9">1019</tspan></text>
  <text x="193" y="366" font-size="14" fill="#4b5563" text-anchor="middle">bias</text>

  <!-- ④ 가수 필드 M -->
  <text x="72" y="412" font-size="17" font-weight="bold" fill="#111827">가수 필드 M</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" font-weight="bold" fill="#1d4ed8">
    <text x="72" y="458">1001</text>
    <text x="118" y="458">1001</text>
    <text x="164" y="458">1001</text>
    <text x="210" y="458">1001</text>
    <text x="256" y="458">1001</text>
    <text x="302" y="458">1001</text>
    <text x="348" y="458">1001</text>
    <text x="394" y="458">1001</text>
    <text x="440" y="458">1001</text>
    <text x="486" y="458">1001</text>
    <text x="532" y="458">1001</text>
    <text x="578" y="458">1001</text>
    <text x="624" y="458">1001</text>
  </g>
  <line x1="674" y1="432" x2="674" y2="468" stroke="#b91c1c" stroke-width="3"/>
  <text x="684" y="458" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="18" fill="#4b5563">1001...</text>
  <path d="M74,470 V478 H662 V470" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="368" y="500" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">52비트</text>
  <path d="M674,512 V478" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="674" y="534" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">52비트에서 잘리고 반올림</text>
</svg>
