<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실제 버그 시나리오</title>
  <desc id="d">React에서 index를 key로 사용할 때 맨 앞에 항목을 추가하면 체크 상태가 엉뚱한 항목으로 옮겨가는 재조정 버그 과정 다이어그램</desc>
  <rect width="880" height="770" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">실제 버그 시나리오</text>

  <!-- Section 1: Top Row (추가 전 & React가 기억하는 상태) -->
  <g id="section-1">
    <!-- Panel 1: [추가 전] -->
    <rect x="30" y="60" width="400" height="110" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
    <text x="45" y="88" font-size="14" font-weight="bold" fill="#1f2933">[추가 전]</text>
    
    <text x="55" y="118" font-size="13" fill="#1f2933">index 0: "우유 사기"</text>
    <rect x="230" y="103" width="85" height="22" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="272.5" y="118" font-size="11.5" text-anchor="middle" fill="#7c3aed">done=false</text>

    <text x="55" y="148" font-size="13" fill="#1f2933">index 1: "설거지"</text>
    <rect x="230" y="133" width="85" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="272.5" y="148" font-size="11.5" text-anchor="middle" fill="#059669">done=true</text>

    <!-- Panel 2: React가 기억하는 상태 -->
    <rect x="450" y="60" width="400" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="465" y="88" font-size="14" font-weight="bold" fill="#2563eb">React가 기억하는 상태</text>

    <rect x="475" y="103" width="105" height="22" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="527.5" y="118" font-size="12" text-anchor="middle" fill="#1f2933">key 0</text>
    <path d="M580,114 L610,114" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="615" y="103" width="85" height="22" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="657.5" y="118" font-size="11.5" text-anchor="middle" fill="#7c3aed">done=false</text>

    <rect x="475" y="133" width="105" height="22" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="527.5" y="148" font-size="12" text-anchor="middle" fill="#1f2933">key 1</text>
    <path d="M580,144 L610,144" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="615" y="133" width="85" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="657.5" y="148" font-size="11.5" text-anchor="middle" fill="#059669">done=true</text>
  </g>

  <!-- Transition Arrow -->
  <g id="transition">
    <path d="M230,170 L230,205" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
    <rect x="245" y="178" width="160" height="22" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="325" y="193" font-size="12" font-weight="bold" text-anchor="middle" fill="#d97706">맨 앞에 "운동하기" 삽입</text>
  </g>

  <!-- Section 2: [추가 후 - 데이터] -->
  <g id="section-2">
    <rect x="30" y="215" width="820" height="135" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
    <text x="45" y="243" font-size="14" font-weight="bold" fill="#1f2933">[추가 후 - 데이터]</text>

    <text x="55" y="273" font-size="13" fill="#1f2933">index 0: "운동하기"</text>
    <text x="55" y="301" font-size="13" fill="#1f2933">index 1: "우유 사기"</text>
    <text x="55" y="329" font-size="13" fill="#1f2933">index 2: "설거지"</text>
  </g>

  <!-- Section 3: [React의 재조정 - key가 index일 때] -->
  <g id="section-3">
    <rect x="30" y="370" width="820" height="185" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="45" y="398" font-size="14" font-weight="bold" fill="#dc2626">[React의 재조정 - key가 index일 때]</text>

    <!-- Key 0 -->
    <text x="55" y="433" font-size="13" font-weight="bold" fill="#1f2933">key 0 :</text>
    <text x="108" y="433" font-size="13" fill="#1f2933">기존 것 재사용</text>
    <path d="M205,429 L220,429" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="228" y="433" font-size="13" fill="#52606d">done=false 유지, text만 "운동하기"로 교체</text>

    <!-- Key 1 -->
    <text x="55" y="471" font-size="13" font-weight="bold" fill="#1f2933">key 1 :</text>
    <text x="108" y="471" font-size="13" fill="#1f2933">기존 것 재사용</text>
    <path d="M205,467 L220,467" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="228" y="471" font-size="13" fill="#52606d">done=true  유지, text만 "우유 사기"로 교체</text>
    <rect x="525" y="456" width="60" height="22" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="555" y="471" font-size="12" font-weight="bold" text-anchor="middle" fill="#dc2626">← 버그!</text>

    <!-- Key 2 -->
    <text x="55" y="509" font-size="13" font-weight="bold" fill="#1f2933">key 2 :</text>
    <text x="108" y="509" font-size="13" fill="#1f2933">새로 마운트</text>
    <path d="M190,505 L205,505" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="213" y="509" font-size="13" fill="#52606d">done=false, text="설거지"</text>
    <rect x="525" y="494" width="60" height="22" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="555" y="509" font-size="12" font-weight="bold" text-anchor="middle" fill="#dc2626">← 버그!</text>
  </g>

  <!-- Section 4: [화면] -->
  <g id="section-4">
    <rect x="30" y="575" width="820" height="165" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="45" y="603" font-size="14" font-weight="bold" fill="#1f2933">[화면]</text>

    <!-- Line 1 -->
    <rect x="55" y="618" width="22" height="22" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="66" y="633" font-size="12" text-anchor="middle" fill="#ffffff"></text>
    <text x="87" y="633" font-size="13" fill="#1f2933">[ ] 운동하기</text>

    <!-- Line 2 (Bug Highlighted) -->
    <rect x="55" y="652" width="22" height="22" rx="3" fill="#059669" stroke="#059669" stroke-width="1.5"/>
    <path d="M60,663 L64,668 L72,658" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="87" y="667" font-size="13" font-weight="bold" fill="#dc2626">[v] 우유 사기</text>
    <text x="210" y="667" font-size="13" fill="#dc2626">← 체크한 적 없는데 체크됨</text>

    <!-- Line 3 (Bug Highlighted) -->
    <rect x="55" y="686" width="22" height="22" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="87" y="701" font-size="13" fill="#1f2933">[ ] 설거지</text>
    <text x="210" y="701" font-size="13" fill="#dc2626">← 체크했는데 풀림</text>
  </g>
</svg>