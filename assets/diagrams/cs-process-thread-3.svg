<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동시성 vs 병렬성</title>
  <desc id="d">동시성(단일 코어)에서는 T1과 T2가 시간 구간을 번갈아가며 실행되고, 병렬성(멀티 코어)에서는 Core1과 Core2가 같은 시간 내내 실제로 동시에 실행된다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <rect x="690" y="28" width="18" height="18" rx="3" fill="#1d4ed8"/>
  <text x="716" y="43" font-size="15" fill="#374151">실행 중</text>
  <rect x="784" y="28" width="18" height="18" rx="3" fill="#cbd5e1"/>
  <text x="810" y="43" font-size="15" fill="#374151">대기</text>

  <!-- 동시성 (단일 코어) -->
  <rect x="24" y="60" width="832" height="184" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="94" font-size="20" font-weight="bold" fill="#111827">동시성<tspan font-size="16" font-weight="normal" fill="#374151"> (단일 코어)</tspan></text>
  <text x="832" y="94" font-size="15" fill="#4b5563" text-anchor="end">번갈아가며 실행 · 시분할</text>

  <text x="48" y="138" font-size="18" font-weight="bold" fill="#111827">T1</text>
  <rect x="128" y="114" width="128" height="36" fill="#1d4ed8"/>
  <rect x="256" y="114" width="128" height="36" fill="#cbd5e1"/>
  <rect x="384" y="114" width="128" height="36" fill="#1d4ed8"/>
  <rect x="512" y="114" width="128" height="36" fill="#cbd5e1"/>
  <rect x="640" y="114" width="128" height="36" fill="#1d4ed8"/>

  <text x="48" y="186" font-size="18" font-weight="bold" fill="#111827">T2</text>
  <rect x="128" y="162" width="128" height="36" fill="#cbd5e1"/>
  <rect x="256" y="162" width="128" height="36" fill="#1d4ed8"/>
  <rect x="384" y="162" width="128" height="36" fill="#cbd5e1"/>
  <rect x="512" y="162" width="128" height="36" fill="#1d4ed8"/>
  <rect x="640" y="162" width="128" height="36" fill="#cbd5e1"/>

  <path d="M128,220 L786,220" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="796" y="225" font-size="15" fill="#374151">시간</text>

  <!-- 병렬성 (멀티 코어) -->
  <rect x="24" y="262" width="832" height="184" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="296" font-size="20" font-weight="bold" fill="#111827">병렬성<tspan font-size="16" font-weight="normal" fill="#374151"> (멀티 코어)</tspan></text>
  <text x="832" y="296" font-size="15" fill="#4b5563" text-anchor="end">실제로 동시에 실행</text>

  <text x="48" y="340" font-size="18" font-weight="bold" fill="#111827">Core1</text>
  <rect x="128" y="316" width="640" height="36" fill="#1d4ed8"/>

  <text x="48" y="388" font-size="18" font-weight="bold" fill="#111827">Core2</text>
  <rect x="128" y="364" width="640" height="36" fill="#1d4ed8"/>

  <path d="M128,422 L786,422" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="796" y="427" font-size="15" fill="#374151">시간</text>
</svg>
