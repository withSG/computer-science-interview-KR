<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 후 복기 프로세스</title>
  <desc id="d">면접 종료 후 시간 단계별 복기 방법과 행동 지침을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 시작 노드: 면접 종료 -->
  <rect x="50" y="230" width="120" height="40" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="2"/>
  <text x="110" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">면접 종료</text>

  <!-- 메인 분기 트리 (경로선) -->
  <path d="M170,250 L200,250" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M200,70 L200,450" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- 1단계: 30분 내 -->
  <path d="M200,70 L220,70" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <rect x="220" y="50" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">30분 내</text>
  
  <path d="M320,70 L360,70" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <rect x="360" y="38" width="470" height="64" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="380" y="63" font-size="13" font-weight="bold" fill="#1f2933">기억나는 질문 전부 나열 <tspan font-weight="normal" fill="#52606d">(답변 품질은 신경 쓰지 말고 질문만)</tspan></text>
  <text x="380" y="88" font-size="11.5" fill="#52606d">시간이 지나면 막힌 질문부터 잊힌다</text>

  <!-- 2단계: 당일 -->
  <path d="M200,180 L220,180" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <rect x="220" y="160" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">당일</text>
  
  <path d="M320,180 L360,180" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <rect x="360" y="148" width="470" height="64" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="380" y="173" font-size="13" font-weight="bold" fill="#1f2933">각 질문에 자가 진단 표시</text>
  <text x="380" y="198" font-size="12" fill="#52606d"><tspan fill="#059669" font-weight="bold">[O]</tspan> 잘 답함   <tspan fill="#d97706" font-weight="bold">[△]</tspan> 답했지만 근거 약함   <tspan fill="#dc2626" font-weight="bold">[X]</tspan> 못 답함</text>

  <!-- 3단계: 3일 내 -->
  <path d="M200,310 L220,310" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <rect x="220" y="290" width="100" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="270" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">3일 내</text>
  
  <path d="M320,310 L360,310" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  
  <rect x="360" y="278" width="470" height="64" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="380" y="303" font-size="13" font-weight="bold" fill="#1f2933">[X]와 [△]를 실제로 공부해서 모범 답변 작성</text>
  
  <path d="M380,313 L392,313 L392,323 L398,323" stroke="#7c3aed" stroke-width="1.2" fill="none" marker-end="url(#a-purple)"/>
  <text x="404" y="327" font-size="12" fill="#7c3aed" font-weight="bold">개념 파일이나 개인 노트에 반영</text>

  <!-- 4단계: 다음 면접 전 -->
  <path d="M200,450 L220,450" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <rect x="220" y="430" width="100" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="270" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">다음 면접 전</text>
  
  <path d="M320,450 L360,450" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  
  <rect x="360" y="418" width="470" height="64" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="380" y="443" font-size="13" font-weight="bold" fill="#1f2933">이 기록을 먼저 읽고 들어간다</text>
  <text x="380" y="468" font-size="11.5" fill="#52606d">같은 질문이 다른 회사에서 반복되는 비율이 매우 높다</text>
</svg>