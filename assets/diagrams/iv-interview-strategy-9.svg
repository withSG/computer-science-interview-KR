<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 후 복기 순서</title>
  <desc id="d">면접이 끝난 뒤 30분 내에는 질문을 전부 적고, 당일에는 O·△·X로 자가 진단하고, 3일 내에는 X와 △를 공부해 모범 답변을 쓰고, 다음 면접 전에는 이 기록을 먼저 읽는다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="24" y="24" width="144" height="44" rx="22" fill="#1f2937"/>
  <text x="96" y="52.3" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">면접 종료</text>

  <!-- 시간 축 -->
  <line x1="96" y1="68" x2="96" y2="110" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="96" y1="154" x2="96" y2="226" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="96" y1="270" x2="96" y2="342" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="96" y1="386" x2="96" y2="450" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 1. 30분 내 -->
  <rect x="24" y="114" width="144" height="40" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="96" y="140" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">30분 내</text>
  <line x1="168" y1="134" x2="196" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="200" y="92" width="656" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="220" y="126" font-size="17" font-weight="bold" fill="#111827">기억나는 질문 전부 나열<tspan font-size="15" font-weight="normal" fill="#4b5563"> (답변 품질은 신경 쓰지 말고 질문만)</tspan></text>
  <text x="220" y="155" font-size="15" fill="#4b5563">시간이 지나면 막힌 질문부터 잊힌다</text>

  <!-- 2. 당일 -->
  <rect x="24" y="230" width="144" height="40" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="96" y="256" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">당일</text>
  <line x1="168" y1="250" x2="196" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="200" y="200" width="656" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="220" y="234" font-size="17" font-weight="bold" fill="#111827">각 질문에 자가 진단 표시</text>
  <rect x="220" y="252" width="112" height="32" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="234" y="273.2" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#047857">[O]</tspan> 잘 답함</text>
  <rect x="344" y="252" width="188" height="32" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="358" y="273.2" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#b45309">[△]</tspan> 답했지만 근거 약함</text>
  <rect x="544" y="252" width="112" height="32" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="558" y="273.2" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#b91c1c">[X]</tspan> 못 답함</text>

  <!-- 3. 3일 내 -->
  <rect x="24" y="346" width="144" height="40" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="96" y="372" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3일 내</text>
  <line x1="168" y1="366" x2="196" y2="366" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="200" y="324" width="656" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="220" y="358" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#b91c1c">[X]</tspan>와 <tspan fill="#b45309">[△]</tspan>를 실제로 공부해서 모범 답변 작성</text>
  <text x="220" y="387" font-size="15" fill="#374151">→ 개념 파일이나 개인 노트에 반영</text>

  <!-- 4. 다음 면접 전 -->
  <rect x="24" y="454" width="144" height="40" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="96" y="480" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">다음 면접 전</text>
  <line x1="168" y1="474" x2="196" y2="474" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="200" y="432" width="656" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="220" y="466" font-size="17" font-weight="bold" fill="#111827">이 기록을 먼저 읽고 들어간다</text>
  <text x="220" y="495" font-size="15" fill="#4b5563">같은 질문이 다른 회사에서 반복되는 비율이 매우 높다</text>
</svg>
