<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구동 시 실행 순서</title>
  <desc id="d">애플리케이션 구동 시 @PostConstruct(빈 초기화 후), CommandLineRunner/ApplicationRunner(애플리케이션 시작 후), @EventListener로 받는 ApplicationReadyEvent 순서로 실행된다.</desc>
  <rect width="880" height="220" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 단계 번호 -->
  <circle cx="114" cy="40" r="16" fill="#1d4ed8"/>
  <text x="114" y="46" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="395" cy="40" r="16" fill="#1d4ed8"/>
  <text x="395" y="46" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="721" cy="40" r="16" fill="#1d4ed8"/>
  <text x="721" y="46" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 1. @PostConstruct -->
  <rect x="24" y="70" width="180" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="114" y="124" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">@PostConstruct</text>
  <text x="114" y="152" font-size="15" fill="#374151" text-anchor="middle">빈 초기화 후</text>

  <!-- 2. CommandLineRunner / ApplicationRunner -->
  <rect x="270" y="70" width="250" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="395" y="110" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">CommandLineRunner /</text>
  <text x="395" y="134" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ApplicationRunner</text>
  <text x="395" y="164" font-size="15" fill="#374151" text-anchor="middle">애플리케이션 시작 후</text>

  <!-- 3. ApplicationReadyEvent -->
  <rect x="586" y="70" width="270" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="721" y="124" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ApplicationReadyEvent</text>
  <text x="721" y="152" font-size="15" fill="#374151" text-anchor="middle">@EventListener로 받음</text>

  <!-- 순서 화살표 -->
  <path d="M210,130 L264,130" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
  <path d="M526,130 L580,130" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
</svg>
