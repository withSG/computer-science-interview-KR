<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">모델 복잡도와 편향-분산 곡선</title>
  <desc id="d">모델 복잡도가 커질수록 편향²은 줄고 분산은 늘며, 둘에 노이즈를 더한 총 오차는 U자를 그린다. 총 오차가 최소가 되는 지점의 왼쪽은 과소적합, 오른쪽은 과적합이다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 축 -->
  <text x="110" y="46" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">오차</text>
  <path d="M110,440 L110,58" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ax)"/>
  <path d="M110,440 L630,440" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ax)"/>
  <text x="640" y="450" font-size="16" font-weight="bold" fill="#374151">모델 복잡도</text>

  <!-- 최소 지점 구분선 -->
  <path d="M379.2,292.1 L379.2,478" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>

