  <!-- 곡선 라벨 -->
  <text x="640" y="85" font-size="17" font-weight="bold" fill="#6d28d9">총 오차</text>
  <text x="640" y="107" font-size="15" fill="#6d28d9">= 편향² + 분산 + 노이즈</text>
  <text x="640" y="144" font-size="17" font-weight="bold" fill="#b45309">분산</text>
  <text x="640" y="417" font-size="17" font-weight="bold" fill="#1d4ed8">편향²</text>

  <!-- 최소 지점 -->
  <text x="379.2" y="224" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">총 오차가 최소가 되는 지점</text>
  <path d="M379.2,232.1 L379.2,272.1" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#gr)"/>
  <circle cx="379.2" cy="282.1" r="6" fill="#047857"/>

  <!-- 교차점 -->
  <circle cx="401.9" cy="378.4" r="5" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <path d="M407.9,385.4 L415.9,408.4" stroke="#374151" stroke-width="1.5" fill="none"/>
