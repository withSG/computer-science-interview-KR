  <!-- 구간 -->
  <text x="245" y="470" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">← 과소적합</text>
  <text x="500" y="470" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">과적합 →</text>
</svg>
