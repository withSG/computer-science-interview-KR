<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">불린 플래그 상태의 8가지 조합</title>
  <desc id="d">isLoading, data, error 세 값의 2 × 2 × 2 = 8가지 조합을 표로 나열한다. 시작 전, 로딩 중, 성공, 실패 4가지만 정상이고, 나머지 4가지는 로딩 중인데 데이터가 있음처럼 존재할 수 없는 상태인데도 타입이 허용한다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>

  <!-- 머리행 -->
  <rect x="40" y="24" width="800" height="44" fill="#e5e7eb"/>
  <text x="125" y="52" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">isLoading</text>
  <text x="280" y="52" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">data</text>
  <text x="420" y="52" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">error</text>
  <text x="506" y="52" font-size="16" font-weight="bold" fill="#111827">의미</text>

  <!-- 구역 1: 유효 -->
  <rect x="40" y="68" width="800" height="36" fill="#d1fae5"/>
  <text x="56" y="92" font-size="15" font-weight="bold" fill="#065f46">유효한 조합 4가지</text>

  <!-- 행 1~4 -->
  <rect x="40" y="104" width="800" height="152" fill="#ffffff"/>
  <g font-size="16" text-anchor="middle">
    <text x="125" y="128" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">false</text>
    <text x="280" y="128" fill="#4b5563">없음</text>
    <text x="420" y="128" fill="#4b5563">없음</text>

    <text x="125" y="166" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">true</text>
    <text x="280" y="166" fill="#4b5563">없음</text>
    <text x="420" y="166" fill="#4b5563">없음</text>

    <text x="125" y="204" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">false</text>
    <text x="280" y="204" fill="#111827" font-weight="bold">있음</text>
    <text x="420" y="204" fill="#4b5563">없음</text>

    <text x="125" y="242" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">false</text>
    <text x="280" y="242" fill="#4b5563">없음</text>
    <text x="420" y="242" fill="#111827" font-weight="bold">있음</text>
  </g>
  <g>
    <rect x="506" y="111" width="56" height="24" rx="12" fill="#d1fae5"/>
    <text x="534" y="128" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">정상</text>
    <text x="578" y="128" font-size="16" fill="#111827">시작 전</text>

    <rect x="506" y="149" width="56" height="24" rx="12" fill="#d1fae5"/>
    <text x="534" y="166" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">정상</text>
    <text x="578" y="166" font-size="16" fill="#111827">로딩 중</text>

    <rect x="506" y="187" width="56" height="24" rx="12" fill="#d1fae5"/>
    <text x="534" y="204" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">정상</text>
    <text x="578" y="204" font-size="16" fill="#111827">성공</text>

    <rect x="506" y="225" width="56" height="24" rx="12" fill="#d1fae5"/>
    <text x="534" y="242" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">정상</text>
    <text x="578" y="242" font-size="16" fill="#111827">실패</text>
  </g>

  <!-- 구역 2: 무효 -->
  <rect x="40" y="256" width="800" height="36" fill="#fee2e2"/>
  <text x="56" y="280" font-size="15" font-weight="bold" fill="#991b1b">유효하지 않은 조합 4가지 (컴파일러가 막지 못함)</text>

  <!-- 행 5~8 -->
  <rect x="40" y="292" width="800" height="152" fill="#fef2f2"/>
  <g font-size="16" text-anchor="middle">
    <text x="125" y="316" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">true</text>
    <text x="280" y="316" fill="#111827" font-weight="bold">있음</text>
    <text x="420" y="316" fill="#4b5563">없음</text>

    <text x="125" y="354" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">true</text>
    <text x="280" y="354" fill="#4b5563">없음</text>
    <text x="420" y="354" fill="#111827" font-weight="bold">있음</text>

    <text x="125" y="392" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">false</text>
    <text x="280" y="392" fill="#111827" font-weight="bold">있음</text>
    <text x="420" y="392" fill="#111827" font-weight="bold">있음</text>

    <text x="125" y="430" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">true</text>
    <text x="280" y="430" fill="#111827" font-weight="bold">있음</text>
    <text x="420" y="430" fill="#111827" font-weight="bold">있음</text>
  </g>
  <g>
    <rect x="506" y="299" width="56" height="24" rx="12" fill="#fecaca"/>
    <text x="534" y="316" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">???</text>
    <text x="578" y="316" font-size="16" fill="#111827">로딩 중인데 데이터가 있음</text>

    <rect x="506" y="337" width="56" height="24" rx="12" fill="#fecaca"/>
    <text x="534" y="354" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">???</text>
    <text x="578" y="354" font-size="16" fill="#111827">로딩 중인데 실패</text>

    <rect x="506" y="375" width="56" height="24" rx="12" fill="#fecaca"/>
    <text x="534" y="392" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">???</text>
    <text x="578" y="392" font-size="16" fill="#111827">성공이면서 실패</text>

    <rect x="506" y="413" width="56" height="24" rx="12" fill="#fecaca"/>
    <text x="534" y="430" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">???</text>
    <text x="578" y="430" font-size="16" fill="#111827">셋 다 동시에</text>
  </g>

  <!-- 격자선 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="40" y1="142" x2="840" y2="142"/>
    <line x1="40" y1="180" x2="840" y2="180"/>
    <line x1="40" y1="218" x2="840" y2="218"/>
  </g>
  <g stroke="#fecaca" stroke-width="1">
    <line x1="40" y1="330" x2="840" y2="330"/>
    <line x1="40" y1="368" x2="840" y2="368"/>
    <line x1="40" y1="406" x2="840" y2="406"/>
  </g>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="210" y1="24" x2="210" y2="68"/>
    <line x1="350" y1="24" x2="350" y2="68"/>
    <line x1="210" y1="104" x2="210" y2="256"/>
    <line x1="350" y1="104" x2="350" y2="256"/>
    <line x1="210" y1="292" x2="210" y2="444"/>
    <line x1="350" y1="292" x2="350" y2="444"/>
  </g>
  <g stroke="#6b7280" stroke-width="2">
    <line x1="490" y1="24" x2="490" y2="68"/>
    <line x1="490" y1="104" x2="490" y2="256"/>
    <line x1="490" y1="292" x2="490" y2="444"/>
  </g>
  <line x1="40" y1="68" x2="840" y2="68" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="40" y1="256" x2="840" y2="256" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="40" y="24" width="800" height="420" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 요약 -->
  <rect x="40" y="468" width="800" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="507" font-size="19" font-weight="bold" fill="#92400e" text-anchor="middle">2 × 2 × 2 = 8가지 조합 중 4가지만 유효하다</text>
</svg>
