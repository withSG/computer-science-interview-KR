<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 395" width="880" height="395" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">시크릿이 새는 경로들</title>
  <desc id="d">시크릿 유출이 발생하는 6가지 주요 경로와 각 설명에 대한 목록 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="395" fill="#ffffff"/>

  <!-- 메인 콘테이너/구역 -->
  <rect x="24" y="20" width="832" height="355" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="44" y="52" font-size="16" font-weight="bold" fill="#1f2933">시크릿이 새는 경로들</text>

  <!-- 항목 1 -->
  <g transform="translate(44, 70)">
    <rect x="0" y="0" width="220" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="23" font-size="13" font-weight="bold" fill="#dc2626">① 코드에 하드코딩</text>
    <path d="M220,18 L260,18" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="240" y="11" font-size="11.5" fill="#dc2626" text-anchor="middle">→</text>
    <rect x="260" y="0" width="532" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="272" y="23" font-size="13" fill="#1f2933">저장소 접근 권한 = 시크릿 접근 권한</text>
  </g>

  <!-- 항목 2 -->
  <g transform="translate(44, 116)">
    <rect x="0" y="0" width="220" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="23" font-size="13" font-weight="bold" fill="#dc2626">② 로그에 출력</text>
    <path d="M220,18 L260,18" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="240" y="11" font-size="11.5" fill="#dc2626" text-anchor="middle">→</text>
    <rect x="260" y="0" width="532" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="272" y="23" font-size="13" fill="#1f2933">echo, 디버그 로그, 에러 스택 트레이스</text>
  </g>

  <!-- 항목 3 -->
  <g transform="translate(44, 162)">
    <rect x="0" y="0" width="220" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="23" font-size="13" font-weight="bold" fill="#dc2626">③ 아티팩트에 포함</text>
    <path d="M220,18 L260,18" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="240" y="11" font-size="11.5" fill="#dc2626" text-anchor="middle">→</text>
    <rect x="260" y="0" width="532" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="272" y="23" font-size="13" fill="#1f2933">.env 파일을 그대로 업로드</text>
  </g>

  <!-- 항목 4 -->
  <g transform="translate(44, 208)">
    <rect x="0" y="0" width="220" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="23" font-size="13" font-weight="bold" fill="#dc2626">④ 포크 PR에서 탈취</text>
    <path d="M220,18 L260,18" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="240" y="11" font-size="11.5" fill="#dc2626" text-anchor="middle">→</text>
    <rect x="260" y="0" width="532" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="272" y="23" font-size="13" fill="#1f2933">외부인이 워크플로를 수정한 PR을 올림</text>
  </g>

  <!-- 항목 5 -->
  <g transform="translate(44, 254)">
    <rect x="0" y="0" width="220" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="23" font-size="13" font-weight="bold" fill="#dc2626">⑤ 서드파티 액션 경유</text>
    <path d="M220,18 L260,18" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="240" y="11" font-size="11.5" fill="#dc2626" text-anchor="middle">→</text>
    <rect x="260" y="0" width="532" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="272" y="23" font-size="13" fill="#1f2933">이름만 비슷한 액션이 시크릿을 외부로 전송</text>
  </g>

  <!-- 항목 6 -->
  <g transform="translate(44, 300)">
    <rect x="0" y="0" width="220" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="23" font-size="13" font-weight="bold" fill="#dc2626">⑥ 장기 액세스 키 보관</text>
    <path d="M220,18 L260,18" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="240" y="11" font-size="11.5" fill="#dc2626" text-anchor="middle">→</text>
    <rect x="260" y="0" width="532" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="272" y="23" font-size="13" fill="#1f2933">유출 시 만료가 없어 피해가 무기한</text>
  </g>
</svg>