<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">시크릿 유출 경로 여섯 가지</title>
  <desc id="d">하드코딩, 로그 출력, 아티팩트 포함, 포크 PR, 서드파티 액션, 장기 액세스 키 보관의 여섯 경로와 각각 시크릿이 어떻게 새는지를 한 줄씩 짝지어 보여 준다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ① -->
  <rect x="24" y="24" width="296" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="52" cy="48" r="14" fill="#b91c1c"/>
  <text x="52" y="53" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="78" y="54" font-size="16" font-weight="bold" fill="#b91c1c">코드에 하드코딩</text>
  <line x1="328" y1="48" x2="360" y2="48" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="368" y="24" width="488" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="388" y="54" font-size="16" fill="#1f2937">저장소 접근 권한 = 시크릿 접근 권한</text>

  <!-- ② -->
  <rect x="24" y="82" width="296" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="52" cy="106" r="14" fill="#b91c1c"/>
  <text x="52" y="111" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="78" y="112" font-size="16" font-weight="bold" fill="#b91c1c">로그에 출력</text>
  <line x1="328" y1="106" x2="360" y2="106" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="368" y="82" width="488" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="388" y="112" font-size="16" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">echo</tspan>, 디버그 로그, 에러 스택 트레이스</text>

  <!-- ③ -->
  <rect x="24" y="140" width="296" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="52" cy="164" r="14" fill="#b91c1c"/>
  <text x="52" y="169" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="78" y="170" font-size="16" font-weight="bold" fill="#b91c1c">아티팩트에 포함</text>
  <line x1="328" y1="164" x2="360" y2="164" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="368" y="140" width="488" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="388" y="170" font-size="16" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.env</tspan> 파일을 그대로 업로드</text>

  <!-- ④ -->
  <rect x="24" y="198" width="296" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="52" cy="222" r="14" fill="#b91c1c"/>
  <text x="52" y="227" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="78" y="228" font-size="16" font-weight="bold" fill="#b91c1c">포크 PR에서 탈취</text>
  <line x1="328" y1="222" x2="360" y2="222" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="368" y="198" width="488" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="388" y="228" font-size="16" fill="#1f2937">외부인이 워크플로를 수정한 PR을 올림</text>

  <!-- ⑤ -->
  <rect x="24" y="256" width="296" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="52" cy="280" r="14" fill="#b91c1c"/>
  <text x="52" y="285" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="78" y="286" font-size="16" font-weight="bold" fill="#b91c1c">서드파티 액션 경유</text>
  <line x1="328" y1="280" x2="360" y2="280" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="368" y="256" width="488" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="388" y="286" font-size="16" fill="#1f2937">이름만 비슷한 액션이 시크릿을 외부로 전송</text>

  <!-- ⑥ -->
  <rect x="24" y="314" width="296" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="52" cy="338" r="14" fill="#b91c1c"/>
  <text x="52" y="343" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="78" y="344" font-size="16" font-weight="bold" fill="#b91c1c">장기 액세스 키 보관</text>
  <line x1="328" y1="338" x2="360" y2="338" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="368" y="314" width="488" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="388" y="344" font-size="16" fill="#1f2937">유출 시 만료가 없어 피해가 무기한</text>
</svg>
