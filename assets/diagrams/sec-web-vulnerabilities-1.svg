<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stored XSS 다이어그램</title>
  <desc id="d">공격자, 서버 DB, 피해자 전원 간의 Stored XSS 공격 및 피해 흐름을 나타낸 시퀀스 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title block from markdown section header -->
  <text x="40" y="38" font-size="16" font-weight="bold" fill="#1f2933">유형 1. Stored XSS — 서버에 저장되어 모두에게 터진다</text>

  <!-- Lifelines -->
  <path d="M 160,110 L 160,450" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M 440,110 L 440,450" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M 720,110 L 720,450" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- Top Actor Boxes -->
  <!-- [공격자] -->
  <rect x="90" y="60" width="140" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="160" y="90" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">공격자</text>

  <!-- [서버 DB] -->
  <rect x="370" y="60" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="90" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">서버 DB</text>

  <!-- [피해자 전원] -->
  <rect x="650" y="60" width="140" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="720" y="90" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">피해자 전원</text>

  <!-- Message 1: 공격자 -> 서버 DB -->
  <path d="M 160,160 L 440,160" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="175" y="136" width="235" height="20" fill="#ffffff" rx="3"/>
  <text x="292" y="151" font-size="13" fill="#dc2626" text-anchor="middle">댓글 "&lt;img src=x onerror=...&gt;"</text>

  <!-- Action Note on DB: 그대로 저장 -->
  <rect x="448" y="172" width="85" height="22" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="3"/>
  <text x="490" y="187" font-size="11.5" font-weight="bold" fill="#d97706" text-anchor="middle">그대로 저장</text>

  <!-- Message 2: 피해자 전원 -> 서버 DB (게시글 조회 요청) -->
  <path d="M 720,230 L 440,230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="522" y="206" width="115" height="20" fill="#ffffff" rx="3"/>
  <text x="580" y="221" font-size="13" fill="#2563eb" text-anchor="middle">게시글 조회 요청</text>

  <!-- Message 3: 서버 DB -> 피해자 전원 (저장된 문자열을 HTML에 삽입) -->
  <path d="M 440,290 L 720,290" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="472" y="266" width="215" height="20" fill="#ffffff" rx="3"/>
  <text x="580" y="281" font-size="13" fill="#2563eb" text-anchor="middle">저장된 문자열을 HTML에 삽입</text>

  <!-- Action Note on Victim: 스크립트 실행 -->
  <rect x="670" y="302" width="100" height="22" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="720" y="317" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">스크립트 실행</text>

  <!-- Message 4: 피해자 전원 -> 공격자 (쿠키 전송) -->
  <path d="M 720,380 L 160,380" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="405" y="356" width="70" height="20" fill="#ffffff" rx="3"/>
  <text x="440" y="371" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">쿠키 전송</text>
</svg>