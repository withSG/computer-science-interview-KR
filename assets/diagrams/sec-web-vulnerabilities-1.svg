<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stored XSS 공격 흐름</title>
  <desc id="d">공격자가 스크립트가 든 댓글을 한 번 저장하면, 서버가 그 문자열을 게시글 HTML에 그대로 넣어 내려주고, 게시글을 여는 사용자마다 브라우저에서 스크립트가 실행되어 쿠키가 공격자에게 전송된다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 반복 구간 띠: ③~⑥ -->
  <rect x="24" y="226" width="832" height="248" rx="8" fill="#fff7ed"/>
  <text x="160" y="254" font-size="15" font-weight="bold" fill="#9a3412">③~⑥ 게시글을 여는 사용자마다 반복</text>

  <!-- 생명선 -->
  <line x1="140" y1="88" x2="140" y2="494" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="440" y1="88" x2="440" y2="494" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="740" y1="88" x2="740" y2="494" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 참여자 -->
  <rect x="60" y="24" width="160" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="140" y="62" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">공격자</text>

  <rect x="360" y="24" width="160" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="62" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">서버 DB</text>

  <rect x="626" y="24" width="228" height="64" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="740" y="51" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">피해자 전원</text>
  <text x="740" y="76" font-size="15" fill="#374151" text-anchor="middle">게시글을 여는 모든 사용자</text>

  <!-- ① 댓글 작성 -->
  <text x="290" y="120" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">① 댓글 작성</text>
  <text x="290" y="143" font-size="15" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"&lt;img src=x onerror=...&gt;"</text>
  <line x1="144" y1="160" x2="434" y2="160" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>

  <!-- ② 그대로 저장 -->
  <rect x="360" y="176" width="160" height="36" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="199" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">② 그대로 저장</text>

  <!-- ③ 게시글 조회 요청 -->
  <text x="590" y="284" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">③ 게시글 조회 요청</text>
  <line x1="736" y1="296" x2="446" y2="296" stroke="#4b5563" stroke-width="2" marker-end="url(#ar-gray)"/>

  <!-- ④ 저장된 문자열을 HTML에 삽입 -->
  <text x="590" y="342" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">④ 저장된 문자열을 HTML에 삽입</text>
  <line x1="444" y1="354" x2="734" y2="354" stroke="#b45309" stroke-width="2" marker-end="url(#ar-amber)"/>

  <!-- ⑤ 스크립트 실행 -->
  <rect x="660" y="372" width="160" height="36" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="740" y="395" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">⑤ 스크립트 실행</text>

  <!-- ⑥ 쿠키 전송 -->
  <text x="590" y="440" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">⑥ 세션 쿠키 전송</text>
  <line x1="736" y1="452" x2="146" y2="452" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar-red)"/>
</svg>
