<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 답변 예시</title>
  <desc id="d">신규 기능 배포 직후 장애 발생부터 대응, 원인 분석, 재발 방지 및 결과를 나타낸 타임라인 및 요약 다이어그램</desc>
  <rect width="880" height="780" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 제목 헤딩 -->
  <text x="40" y="41" font-size="16" font-weight="bold" fill="#1f2933">면접 답변 예시</text>

  <!-- 메인 인용 박스 / 상황 설명 -->
  <rect x="40" y="60" width="800" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="90" font-size="13" font-weight="bold" fill="#dc2626">"신규 기능 배포 직후 에러율이 30%로 급증한 적이 있습니다.</text>

  <!-- 대응 섹션 -->
  <rect x="40" y="130" width="800" height="230" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="161" font-size="14" font-weight="bold" fill="#1f2933">대응:</text>

  <!-- 타임라인 항목 1 -->
  <circle cx="80" cy="195" r="6" fill="#dc2626"/>
  <path d="M80,201 L80,249" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="100" y="180" width="720" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="115" y="200" font-size="13" fill="#1f2933">1. (0분) 알림 확인 즉시 Slack에 장애 선언</text>

  <!-- 타임라인 항목 2 -->
  <circle cx="80" cy="255" r="6" fill="#d97706"/>
  <path d="M80,261 L80,309" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="100" y="240" width="720" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="115" y="260" font-size="13" font-weight="bold" fill="#2563eb">2. (2분) kubectl rollout undo로 즉시 롤백</text>

  <!-- 타임라인 항목 3 -->
  <circle cx="80" cy="315" r="6" fill="#059669"/>
  <rect x="100" y="300" width="720" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="115" y="320" font-size="13" fill="#059669">3. (5분) 에러율 정상화 확인</text>

  <!-- 원인 분석 및 재발 방지 (2열 배치) -->
  <!-- 원인 분석 -->
  <rect x="40" y="380" width="390" height="220" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="411" font-size="14" font-weight="bold" fill="#d97706">원인 분석:</text>
  
  <text x="60" y="445" font-size="13" fill="#1f2933">- 새 버전에서 외부 API 엔드포인트가 변경됨</text>
  <text x="60" y="480" font-size="13" fill="#1f2933">- 환경변수는 구버전 값 그대로</text>

  <!-- 재발 방지 -->
  <rect x="450" y="380" width="390" height="220" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="411" font-size="14" font-weight="bold" fill="#7c3aed">재발 방지:</text>
  
  <text x="470" y="445" font-size="13" fill="#1f2933">1. 환경변수 변경 시 PR 리뷰 필수</text>
  <text x="470" y="480" font-size="13" fill="#1f2933">2. 스테이징에서 외부 연동 테스트 추가</text>
  <text x="470" y="515" font-size="13" fill="#1f2933">3. Canary 배포로 5%부터 점진적 확대</text>

  <!-- 결과 섹션 -->
  <rect x="40" y="620" width="800" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="655" font-size="14" font-weight="bold" fill="#059669">결과:</text>
  <text x="60" y="695" font-size="16" font-weight="bold" fill="#1f2933">MTTR 5분 → 업무 시간 서비스 영향 최소화"</text>
</svg>