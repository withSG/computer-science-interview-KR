<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컨텍스트 스위칭 과정</title>
  <desc id="d">Process A 실행 중부터 PCB 저장, Process B의 PCB 복원을 거쳐 Process B 실행으로 전환되는 컨텍스트 스위칭 순서도</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Process A 실행 중 -->
  <rect x="230" y="30" width="420" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="60" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Process A 실행 중</text>

  <!-- Arrow 1 -->
  <path d="M440,80 L440,120" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 1. Process A의 상태(컨텍스트)를 PCB에 저장 -->
  <rect x="230" y="120" width="420" height="190" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="254" y="150" font-size="14" fill="#1f2933" font-weight="bold">1. Process A의 상태(컨텍스트)를 PCB에 저장</text>
  <text x="274" y="185" font-size="13" fill="#52606d">- PC (Program Counter)</text>
  <text x="274" y="215" font-size="13" fill="#52606d">- CPU 레지스터</text>
  <text x="274" y="245" font-size="13" fill="#52606d">- 메모리 관리 정보</text>
  <text x="274" y="275" font-size="13" fill="#52606d">- I/O 상태 정보</text>

  <!-- Arrow 2 -->
  <path d="M440,310 L440,350" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 2. Process B의 상태를 PCB에서 복원 -->
  <rect x="230" y="350" width="420" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="254" y="380" font-size="14" fill="#1f2933" font-weight="bold">2. Process B의 상태를 PCB에서 복원</text>

  <!-- Arrow 3 -->
  <path d="M440,400 L440,440" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Process B 실행 중 -->
  <rect x="230" y="440" width="420" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="470" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Process B 실행 중</text>
</svg>