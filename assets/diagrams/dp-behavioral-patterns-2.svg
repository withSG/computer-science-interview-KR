<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">템플릿 메서드와 전략 비교</title>
  <desc id="d">Template Method는 DataImporter.run()이 validateFile, parse, saveAll 흐름을 고정하고 parse()만 서브클래스가 상속으로 채운다. Strategy는 ShippingCalculator가 ShippingPolicy를 보유(합성)하고 구현체를 런타임에 갈아 끼운다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arr-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="440" y1="30" x2="440" y2="396" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ===== Template Method ===== -->
  <text x="24" y="48" font-size="19" font-weight="bold" fill="#1d4ed8">Template Method</text>
  <text x="24" y="74" font-size="15" fill="#374151">상속으로 "빈칸"을 채운다</text>

  <rect x="24" y="92" width="396" height="226" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="40" y="122" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DataImporter.run()</text>
  <rect x="300" y="104" width="104" height="28" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="352" y="123" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">흐름 고정</text>

  <rect x="40" y="146" width="170" height="38" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="125" y="170" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">validateFile()</text>
  <line x1="125" y1="184" x2="125" y2="202" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="40" y="206" width="170" height="38" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="125" y="230" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">parse()</text>
  <line x1="125" y1="244" x2="125" y2="262" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="40" y="266" width="170" height="38" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="125" y="290" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">saveAll()</text>

  <!-- 서브클래스가 parse()를 채운다 -->
  <path d="M350,340 L350,225 L214,225" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="284" y="215" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">서브클래스가 채움</text>

  <rect x="276" y="340" width="144" height="54" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="348" y="363" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CsvImporter</text>
  <text x="348" y="384" font-size="14" fill="#b45309" text-anchor="middle">서브클래스</text>

  <!-- ===== Strategy ===== -->
  <text x="464" y="48" font-size="19" font-weight="bold" fill="#047857">Strategy</text>
  <text x="464" y="74" font-size="15" fill="#374151">합성으로 "부품"을 갈아 끼운다</text>

  <rect x="540" y="92" width="240" height="44" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="660" y="120" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ShippingCalculator</text>

  <line x1="660" y1="136" x2="660" y2="176" stroke="#374151" stroke-width="2" marker-end="url(#arr-k)"/>
  <text x="674" y="162" font-size="15" fill="#374151">보유 (has-a)</text>

  <rect x="500" y="180" width="320" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="660" y="208" font-size="16" text-anchor="middle" fill="#111827"><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ShippingPolicy</tspan><tspan fill="#047857" font-size="15"> (인터페이스)</tspan></text>

  <!-- 갈아 끼우는 부품 -->
  <path d="M660,224 L667,236 L653,236 Z" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <line x1="660" y1="236" x2="660" y2="254" stroke="#047857" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="480" y="254" width="360" height="142" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="660" y="280" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">런타임 교체 가능 — 이 중 하나를 끼운다</text>

  <rect x="496" y="294" width="160" height="38" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="576" y="318" font-size="14" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">StandardShipping</text>
  <rect x="664" y="294" width="160" height="38" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="744" y="318" font-size="14" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ExpressShipping</text>
  <rect x="580" y="344" width="160" height="38" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="660" y="368" font-size="14" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SameDayShipping</text>
</svg>
