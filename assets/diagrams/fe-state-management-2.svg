<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">어디에 둘지 정하는 순서</title>
  <desc id="d">상태를 어느 분류(서버, URL, 클라이언트 전역, 로컬)에 둘지 결정하는 의사결정 나무 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">어디에 둘지 정하는 순서</text>

  <!-- Connectors Level 1 (Q1 -> Box1, Q2) -->
  <path d="M440,112 L440,140 L130,140 L130,170" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M440,112 L440,140 L570,140 L570,183" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Label '예' (Q1 -> Box1) -->
  <rect x="268" y="128" width="32" height="22" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="284" y="142.55" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">예</text>

  <!-- Label '아니오' (Q1 -> Q2) -->
  <rect x="483" y="128" width="44" height="22" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="505" y="142.55" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">아니오</text>

  <!-- Connectors Level 2 (Q2 -> Box2, Q3) -->
  <path d="M570,237 L570,265 L350,265 L350,305" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M570,237 L570,265 L710,265 L710,313" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Label '예' (Q2 -> Box2) -->
  <rect x="444" y="254" width="32" height="22" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="460" y="268.55" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">예</text>

  <!-- Label '아니오' (Q2 -> Q3) -->
  <rect x="618" y="254" width="44" height="22" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="640" y="268.55" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">아니오</text>

  <!-- Connectors Level 3 (Q3 -> Box3, Box4) -->
  <path d="M710,367 L710,395 L570,395 L570,435" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M710,367 L710,395 L760,395 L760,435" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Label '예' (Q3 -> Box3) -->
  <rect x="624" y="384" width="32" height="22" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="640" y="398.55" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">예</text>

  <!-- Label '아니오' (Q3 -> Box4) -->
  <rect x="713" y="384" width="44" height="22" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="735" y="398.55" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">아니오</text>

  <!-- Question 1 -->
  <rect x="320" y="68" width="240" height="44" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="94.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">이 값을 서버가 알고 있나?</text>

  <!-- Question 2 -->
  <rect x="450" y="183" width="240" height="54" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="570" y="203.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">새로고침·링크 공유 후에도</text>
  <text x="570" y="221.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">같은 화면이어야 하나?</text>

  <!-- Question 3 -->
  <rect x="600" y="313" width="220" height="54" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="710" y="333.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">두 개 이상의 화면이</text>
  <text x="710" y="351.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">동시에 이 값을 읽나?</text>

  <!-- Box 1: 서버 상태 -->
  <rect x="40" y="170" width="180" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="196.9" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">서버 상태</text>
  <text x="130" y="217.375" font-size="12.5" fill="#52606d" text-anchor="middle">TanStack Query</text>
  <text x="130" y="235.375" font-size="12.5" fill="#52606d" text-anchor="middle">/ SWR</text>

  <!-- Box 2: URL 상태 -->
  <rect x="260" y="305" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="350" y="333.9" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">URL 상태</text>
  <text x="350" y="354.375" font-size="12.5" fill="#52606d" text-anchor="middle">searchParams</text>

  <!-- Box 3: 클라이언트 전역 -->
  <rect x="475" y="435" width="190" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="570" y="463.9" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">클라이언트 전역</text>
  <text x="570" y="484.375" font-size="12.5" fill="#52606d" text-anchor="middle">Zustand / Redux</text>

  <!-- Box 4: 로컬 상태 -->
  <rect x="680" y="435" width="160" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="760" y="463.9" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">로컬 상태</text>
  <text x="760" y="484.375" font-size="12.5" fill="#52606d" text-anchor="middle">useState</text>
</svg>