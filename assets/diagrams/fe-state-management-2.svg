<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상태를 어디에 둘지 묻는 순서</title>
  <desc id="d">세 질문을 순서대로 묻는다. 서버가 아는 값이면 서버 상태, 새로고침·링크 공유 후에도 같은 화면이어야 하면 URL 상태, 두 개 이상의 화면이 동시에 읽으면 클라이언트 전역, 모두 아니면 로컬 상태에 둔다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 연결선: 아니오 (아래로) -->
  <line x1="170" y1="104" x2="170" y2="159" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="182" y="138" font-size="15" font-weight="bold" fill="#374151">아니오</text>
  <line x1="170" y1="220" x2="170" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="182" y="254" font-size="15" font-weight="bold" fill="#374151">아니오</text>
  <path d="M170,336 L170,424 L573,424" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="182" y="390" font-size="15" font-weight="bold" fill="#374151">아니오</text>

  <!-- 연결선: 예 (오른쪽으로) -->
  <line x1="492" y1="76" x2="573" y2="76" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="532" y="66" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">예</text>
  <line x1="492" y1="192" x2="573" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="532" y="182" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">예</text>
  <line x1="492" y1="308" x2="573" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="532" y="298" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">예</text>

  <!-- 질문 1 -->
  <rect x="32" y="48" width="460" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="62" cy="76" r="15" fill="#334155"/>
  <text x="62" y="81.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="90" y="81.5" font-size="16" font-weight="bold" fill="#1f2937">이 값을 서버가 알고 있나?</text>

  <!-- 질문 2 -->
  <rect x="32" y="164" width="460" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="62" cy="192" r="15" fill="#334155"/>
  <text x="62" y="197.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="90" y="197.5" font-size="16" font-weight="bold" fill="#1f2937">새로고침·링크 공유 후에도 같은 화면이어야 하나?</text>

  <!-- 질문 3 -->
  <rect x="32" y="280" width="460" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="62" cy="308" r="15" fill="#334155"/>
  <text x="62" y="313.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="90" y="313.5" font-size="16" font-weight="bold" fill="#1f2937">두 개 이상의 화면이 동시에 이 값을 읽나?</text>

  <!-- 결과: 서버 상태 -->
  <rect x="580" y="36" width="276" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="718" y="72" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">서버 상태</text>
  <text x="718" y="97" font-size="15" fill="#374151" text-anchor="middle">TanStack Query / SWR</text>

  <!-- 결과: URL 상태 -->
  <rect x="580" y="152" width="276" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="718" y="188" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">URL 상태</text>
  <text x="718" y="213" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">searchParams</text>

  <!-- 결과: 클라이언트 전역 -->
  <rect x="580" y="268" width="276" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="718" y="304" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">클라이언트 전역</text>
  <text x="718" y="329" font-size="15" fill="#374151" text-anchor="middle">Zustand / Redux</text>

  <!-- 결과: 로컬 상태 -->
  <rect x="580" y="384" width="276" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="718" y="420" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">로컬 상태</text>
  <text x="718" y="445" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">useState</text>
</svg>
