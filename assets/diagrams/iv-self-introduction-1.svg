<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">자기소개 키워드가 질문이 되는 흐름</title>
  <desc id="d">지원자가 말한 WebSocket과 Redux를 면접관이 메모하고, 각 키워드에서 첫 질문과 꼬리 질문이 이어진다. 자기소개에 넣은 단어가 그날의 시험 범위가 된다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- 왼쪽 단계 라벨 -->
  <text x="24" y="73" font-size="15" font-weight="bold" fill="#4b5563">지원자 발화</text>
  <text x="24" y="187" font-size="15" font-weight="bold" fill="#4b5563">면접관 메모</text>
  <text x="24" y="299" font-size="15" font-weight="bold" fill="#4b5563">질문</text>
  <text x="24" y="411" font-size="15" font-weight="bold" fill="#4b5563">꼬리 질문</text>

  <!-- 1. 지원자 발화 -->
  <rect x="148" y="24" width="708" height="88" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="502" y="60" font-size="17" fill="#111827" text-anchor="middle">"실시간 채팅 서비스를 만들면서 <tspan font-weight="bold" fill="#1d4ed8">WebSocket</tspan>을 처음 다뤘고,</text>
  <text x="502" y="90" font-size="17" fill="#111827" text-anchor="middle">상태 관리는 <tspan font-weight="bold" fill="#6d28d9">Redux</tspan>를 썼습니다."</text>

  <!-- 발화 → 메모 -->
  <path d="M502,112 V152" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>

  <!-- 2. 면접관 메모 -->
  <rect x="372" y="156" width="260" height="52" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="502" y="189" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle"><tspan fill="#1d4ed8">WebSocket</tspan> / <tspan fill="#6d28d9">Redux</tspan></text>

  <!-- 분기 -->
  <path d="M502,208 V228" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M320,228 H684" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M320,228 V254" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M684,228 V254" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ah-purple)"/>

  <!-- 3. 질문 -->
  <rect x="148" y="258" width="344" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="287" font-size="16" fill="#111827" text-anchor="middle">"WebSocket을 왜 선택하셨죠?</text>
  <text x="320" y="312" font-size="16" fill="#111827" text-anchor="middle">폴링은 안 되나요?"</text>

  <rect x="512" y="258" width="344" height="72" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="684" y="287" font-size="16" fill="#111827" text-anchor="middle">"Redux 대신 Context API를</text>
  <text x="684" y="312" font-size="16" fill="#111827" text-anchor="middle">고려하진 않으셨나요?"</text>

  <!-- 질문 → 꼬리 질문 -->
  <path d="M320,330 V366" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M684,330 V366" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ah-purple)"/>

  <!-- 4. 꼬리 질문 -->
  <rect x="148" y="370" width="344" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="399" font-size="16" fill="#111827" text-anchor="middle">"연결이 끊기면</text>
  <text x="320" y="424" font-size="16" fill="#111827" text-anchor="middle">어떻게 처리하셨나요?"</text>

  <rect x="512" y="370" width="344" height="72" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="684" y="399" font-size="16" fill="#111827" text-anchor="middle">"리듀서에서 불변성은</text>
  <text x="684" y="424" font-size="16" fill="#111827" text-anchor="middle">어떻게 유지하셨어요?"</text>

  <!-- 요점 -->
  <rect x="148" y="468" width="708" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="502" y="498" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">자기소개에 넣은 단어가 곧 그날의 시험 범위가 된다</text>
</svg>
