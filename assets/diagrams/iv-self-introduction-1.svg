<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">자기소개는 인사가 아니라 어젠다 세팅이다</title>
  <desc id="d">지원자의 발화에서 추출된 키워드가 면접관의 질문으로 꼬리를 물고 이어지는 흐름을 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 1. 지원자 발화 노드 -->
  <rect x="200" y="30" width="480" height="80" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="216" y="52" font-size="13" font-weight="bold" fill="#52606d">[지원자 발화]</text>
  <text x="440" y="75" font-size="14" fill="#1f2933" text-anchor="middle">"실시간 채팅 서비스를 만들면서 WebSocket을 처음 다뤘고,</text>
  <text x="440" y="96" font-size="14" fill="#1f2933" text-anchor="middle">상태 관리는 Redux를 썼습니다."</text>

  <!-- 발화 -> 메모 화살표 & 라벨 -->
  <path d="M440,110 L440,180" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="390" y="133" width="100" height="22" fill="#ffffff"/>
  <text x="440" y="148" font-size="12" fill="#52606d" text-anchor="middle">면접관 메모</text>

  <!-- 2. 면접관 메모 키워드 노드 -->
  <rect x="330" y="180" width="220" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="207" font-size="15" font-weight="bold" fill="#d97706" text-anchor="middle">WebSocket / Redux</text>

  <!-- 분기선 (키워드 -> 각 기술 질문) -->
  <path d="M440,224 L440,244" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M220,244 L660,244" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  
  <!-- 왼쪽 분기 (WebSocket) 화살표 -->
  <path d="M220,244 L220,270" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- 오른쪽 분기 (Redux) 화살표 -->
  <path d="M660,244 L660,270" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 3. 질문 노드 - 1차 (WebSocket) -->
  <rect x="60" y="270" width="320" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="297" font-size="13.5" fill="#1f2933">"WebSocket을 왜</text>
  <text x="80" y="318" font-size="13.5" fill="#1f2933">선택하셨죠?</text>
  <text x="80" y="328" font-size="13.5" fill="#1f2933">폴링은 안 되나요?"</text>

  <!-- 3. 질문 노드 - 1차 (Redux) -->
  <rect x="500" y="270" width="320" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="520" y="297" font-size="13.5" fill="#1f2933">"Redux 대신 Context API를</text>
  <text x="520" y="318" font-size="13.5" fill="#1f2933">고려하진 않으셨나요?"</text>

  <!-- 1차 -> 2차 화살표 (WebSocket) -->
  <path d="M220,340 L220,380" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 1차 -> 2차 화살표 (Redux) -->
  <path d="M660,340 L660,380" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 4. 질문 노드 - 2차 (WebSocket 꼬리질문) -->
  <rect x="60" y="380" width="320" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="411" font-size="13.5" fill="#1f2933">"연결이 끊기면</text>
  <text x="80" y="432" font-size="13.5" fill="#1f2933">어떻게 처리하셨나요?"</text>

  <!-- 4. 질문 노드 - 2차 (Redux 꼬리질문) -->
  <rect x="500" y="380" width="320" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="520" y="411" font-size="13.5" fill="#1f2933">"리듀서에서 불변성은</text>
  <text x="520" y="432" font-size="13.5" fill="#1f2933">어떻게 유지하셨어요?"</text>
</svg>