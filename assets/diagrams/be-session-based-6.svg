<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세션 고정 공격 흐름</title>
  <desc id="d">공격자가 서버에서 세션 ID X를 발급받아 링크로 피해자에게 심고, 피해자가 X 상태로 로그인하면 서버가 X를 kim과 연결해 공격자의 X도 kim으로 인식하는 과정.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="50" y="24" width="120" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="110" y="50" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">공격자</text>
  <rect x="380" y="24" width="120" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="50" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">피해자</text>
  <rect x="640" y="24" width="120" height="40" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="700" y="50" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">서버</text>

  <!-- 생명선 -->
  <line x1="110" y1="64" x2="110" y2="352" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="440" y1="64" x2="440" y2="352" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="700" y1="64" x2="700" y2="352" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- (1) 공격자 → 서버 -->
  <text x="126" y="106" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#b91c1c">(1)</tspan> 방문해서 세션 ID "X"를 발급받음</text>
  <line x1="110" y1="120" x2="696" y2="120" stroke="#b91c1c" stroke-width="2" marker-end="url(#mr)"/>

  <!-- (2) 공격자 → 피해자 -->
  <text x="126" y="164" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#b91c1c">(2)</tspan> "이 링크로 들어와"</text>
  <text x="154" y="188" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">?SESSIONID=X</text>
  <line x1="110" y1="202" x2="436" y2="202" stroke="#b91c1c" stroke-width="2" marker-end="url(#mr)"/>

  <!-- (3) 피해자 → 서버 -->
  <text x="456" y="246" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#1d4ed8">(3)</tspan> 세션 ID X 상태로 로그인</text>
  <line x1="440" y1="260" x2="696" y2="260" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mb)"/>
  <rect x="716" y="242" width="140" height="36" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="786" y="266" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">X ← kim 연결</text>

  <!-- (4) 공격자 → 서버 -->
  <text x="126" y="306" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#b91c1c">(4)</tspan> 공격자도 X를 갖고 있다</text>
  <line x1="110" y1="320" x2="696" y2="320" stroke="#b91c1c" stroke-width="2" marker-end="url(#mr)"/>
  <rect x="716" y="302" width="140" height="36" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="786" y="326" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">kim으로 인식</text>

  <!-- 방어 -->
  <rect x="24" y="382" width="832" height="50" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="413" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#047857">방어:</tspan> 인증 성공 직후 세션 ID를 새로 발급 → 공격자가 들고 있던 X는 무효</text>
</svg>
