<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 필요한가 — 서버 한 대의 천장</title>
  <desc id="d">로드 밸런서가 없을 때와 있을 때의 서버 구조 및 요청 흐름 비교 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <!-- Dark Ink Arrowhead -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- Blue Arrowhead -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title Labels -->
  <text x="210" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[로드 밸런서가 없을 때]</text>
  <text x="630" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[로드 밸런서가 있을 때]</text>

  <!-- Middle Divider Line -->
  <path d="M420,25 L420,365" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

  <!-- ==================== LEFT SIDE: Without Load Balancer ==================== -->

  <!-- User Box (Left) -->
  <rect x="150" y="70" width="120" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="210" y="94" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자</text>

  <!-- Left Side Speech / Thought Labels -->
  <text x="220" y="140" font-size="11.5" fill="#52606d">"IP가 3개인데 뭘 쓰지?"</text>
  <text x="220" y="180" font-size="11.5" fill="#52606d">"2번이 죽은 건 어떻게 알지?"</text>

  <!-- User Arrow Down (Left) -->
  <path d="M210,110 L210,212" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Left Side Servers -->
  <!-- Server 1 (Left) -->
  <rect x="40" y="220" width="100" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="90" y="244" font-size="13" fill="#1f2933" text-anchor="middle">10.0.0.1</text>

  <!-- Server 2 (Left - Dead) -->
  <rect x="160" y="220" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="244" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">10.0.0.2</text>
  <text x="210" y="280" font-size="13" fill="#dc2626" text-anchor="middle">(죽음)</text>

  <!-- Server 3 (Left) -->
  <rect x="280" y="220" width="100" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="330" y="244" font-size="13" fill="#1f2933" text-anchor="middle">10.0.0.3</text>


  <!-- ==================== RIGHT SIDE: With Load Balancer ==================== -->

  <!-- User Box (Right) -->
  <rect x="520" y="70" width="120" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="580" y="94" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자</text>
  <text x="650" y="94" font-size="13" fill="#2563eb">api.example.com 하나만 안다</text>

  <!-- User to Load Balancer Arrow -->
  <path d="M580,110 L580,148" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Load Balancer Box -->
  <rect x="500" y="150" width="160" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="580" y="176" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Load Balancer</text>
  <text x="670" y="176" font-size="13" fill="#52606d">죽은 서버는 알아서 뺀다</text>

  <!-- Distribution Lines from Load Balancer -->
  <!-- Vertical down from LB -->
  <path d="M580,194 L580,210" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- Horizontal branching line -->
  <path d="M490,210 L670,210" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- Arrow down to Server 1 -->
  <path d="M490,210 L490,228" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Arrow down to Server 2 -->
  <path d="M580,210 L580,228" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Arrow down to Server 3 -->
  <path d="M670,210 L670,228" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Right Side Servers -->
  <!-- Server 1 (Right) -->
  <rect x="440" y="230" width="100" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="490" y="254" font-size="13" fill="#1f2933" text-anchor="middle">10.0.0.1</text>

  <!-- Server 2 (Right - Excluded) -->
  <rect x="530" y="230" width="100" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="580" y="254" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">10.0.0.2</text>
  <text x="580" y="290" font-size="13" fill="#dc2626" text-anchor="middle">(제외됨)</text>

  <!-- Server 3 (Right) -->
  <rect x="620" y="230" width="100" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="670" y="254" font-size="13" fill="#1f2933" text-anchor="middle">10.0.0.3</text>
</svg>