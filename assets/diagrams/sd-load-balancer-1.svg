<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">로드 밸런서가 없을 때와 있을 때</title>
  <desc id="d">로드 밸런서가 없으면 사용자가 서버 IP 3개 중 무엇을 쓸지, 2번(10.0.0.2)이 죽었는지를 스스로 알아야 한다. 로드 밸런서가 있으면 사용자는 api.example.com 하나만 알고, 로드 밸런서가 죽은 10.0.0.2를 제외한 채 나머지 서버로 요청을 보낸다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 패널 -->
  <rect x="24" y="24" width="400" height="362" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="456" y="24" width="400" height="362" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="224" y="58" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">로드 밸런서가 없을 때</text>
  <text x="656" y="58" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">로드 밸런서가 있을 때</text>

  <!-- ===== 왼쪽: 로드 밸런서 없음 ===== -->
  <rect x="84" y="76" width="280" height="104" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="224" y="102" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사용자</text>
  <text x="224" y="134" font-size="15" fill="#b91c1c" text-anchor="middle">“IP가 3개인데 뭘 쓰지?”</text>
  <text x="224" y="160" font-size="15" fill="#b91c1c" text-anchor="middle">“2번이 죽은 건 어떻게 알지?”</text>

  <line x1="184" y1="180" x2="98" y2="292" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah-gray)"/>
  <line x1="224" y1="180" x2="224" y2="292" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah-gray)"/>
  <line x1="264" y1="180" x2="350" y2="292" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah-gray)"/>

  <rect x="40" y="296" width="112" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="96" y="331" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.0.0.1</text>

  <rect x="168" y="296" width="112" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="224" y="320" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.0.0.2</text>
  <text x="224" y="344" font-size="15" fill="#b91c1c" text-anchor="middle">(죽음)</text>

  <rect x="296" y="296" width="112" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="352" y="331" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.0.0.3</text>

  <!-- ===== 오른쪽: 로드 밸런서 있음 ===== -->
  <rect x="526" y="76" width="260" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="656" y="100" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사용자</text>
  <text x="656" y="124" font-size="15" fill="#1d4ed8" text-anchor="middle">api.example.com 하나만 안다</text>

  <line x1="656" y1="136" x2="656" y2="168" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="526" y="172" width="260" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="656" y="197" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Load Balancer</text>
  <text x="656" y="221" font-size="15" fill="#1f2937" text-anchor="middle">죽은 서버는 알아서 뺀다</text>

  <line x1="600" y1="232" x2="530" y2="292" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="712" y1="232" x2="782" y2="292" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="656" y1="232" x2="656" y2="294" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="647" y1="254" x2="665" y2="272" stroke="#b91c1c" stroke-width="3"/>
  <line x1="665" y1="254" x2="647" y2="272" stroke="#b91c1c" stroke-width="3"/>

  <rect x="472" y="296" width="112" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="528" y="331" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.0.0.1</text>

  <rect x="600" y="296" width="112" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="656" y="320" font-size="15" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.0.0.2</text>
  <text x="656" y="344" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">(제외됨)</text>

  <rect x="728" y="296" width="112" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="784" y="331" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">10.0.0.3</text>
</svg>
