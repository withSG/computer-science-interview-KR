<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ETag와 조건부 요청</title>
  <desc id="d">1차 요청에서 서버가 200 OK와 함께 ETag "v3-a1b2c3"를 보내고, 2차 요청에서 클라이언트가 그 값을 If-None-Match로 보내면 서버가 본문 없이 304 Not Modified로 답하는 흐름.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 단계 구역 -->
  <rect x="24" y="80" width="832" height="246" rx="10" fill="#f5f7fa"/>
  <rect x="24" y="342" width="832" height="232" rx="10" fill="#f5f7fa"/>

  <!-- 생명선 -->
  <line x1="250" y1="64" x2="250" y2="574" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="720" y1="64" x2="720" y2="574" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 참여자 -->
  <rect x="150" y="24" width="200" height="40" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="50" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">클라이언트 (캐시)</text>
  <rect x="640" y="24" width="160" height="40" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="720" y="50" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">오리진 서버</text>

  <!-- 단계 라벨 -->
  <text x="40" y="110" font-size="18" font-weight="bold" fill="#111827">1차 요청</text>
  <text x="40" y="372" font-size="18" font-weight="bold" fill="#111827">2차 요청</text>
  <text x="40" y="396" font-size="15" fill="#4b5563">캐시 만료 또는</text>
  <text x="40" y="418" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">no-cache</text>

  <!-- ① 1차 GET -->
  <rect x="335" y="96" width="300" height="36" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="351" y="119" font-size="15" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /api/products/1</text>
  <line x1="252" y1="142" x2="716" y2="142" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- ② 200 OK + ETag + 본문 -->
  <rect x="335" y="168" width="300" height="128" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="351" y="192" font-size="16" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">200 OK</text>
  <text x="351" y="216" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ETag: <tspan font-weight="bold" fill="#6d28d9">"v3-a1b2c3"</tspan></text>
  <text x="351" y="238" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Cache-Control: no-cache</text>
  <rect x="351" y="250" width="268" height="32" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <text x="485" y="271" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">본문</text>
  <line x1="718" y1="306" x2="254" y2="306" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- ③ 2차 조건부 GET -->
  <rect x="335" y="358" width="300" height="62" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="351" y="381" font-size="15" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /api/products/1</text>
  <text x="351" y="405" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">If-None-Match: <tspan font-weight="bold" fill="#6d28d9">"v3-a1b2c3"</tspan></text>
  <line x1="252" y1="430" x2="716" y2="430" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- ④ 304 Not Modified, 본문 없음 -->
  <rect x="335" y="456" width="300" height="84" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="351" y="480" font-size="16" font-weight="bold" fill="#b45309" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">304 Not Modified</text>
  <rect x="351" y="492" width="268" height="34" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="485" y="514" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">본문이 없다. 헤더만 오간다</text>
  <line x1="718" y1="550" x2="254" y2="550" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
</svg>
