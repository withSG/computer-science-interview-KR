<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스냅샷 기반 커밋</title>
  <desc id="d">커밋1~3은 각각 그 시점의 A.java와 B.java 내용을 모두 가리킨다. 커밋2에서 B는 안 바뀌어 커밋1과 같은 내용#b1을 재사용하고, 복사하지 않고 같은 내용을 참조한다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="24" y="42" font-size="19" font-weight="bold" fill="#111827">스냅샷 기반<tspan dx="14" font-size="16" font-weight="normal" fill="#4b5563">커밋마다 그 시점의 전체 파일 목록을 가리킨다</tspan></text>

  <!-- 행 이름 -->
  <text x="24" y="114" font-size="15" font-weight="bold" fill="#1d4ed8">A.java의 내용</text>
  <text x="24" y="218" font-size="15" font-weight="bold" fill="#111827">커밋 (스냅샷)</text>
  <text x="24" y="322" font-size="15" font-weight="bold" fill="#6d28d9">B.java의 내용</text>

  <!-- A.java 내용 객체 -->
  <rect x="210" y="84" width="180" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="300" y="114" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">내용#a1</text>
  <rect x="430" y="84" width="400" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="630" y="114" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">내용#a2</text>

  <!-- 커밋 -->
  <rect x="240" y="190" width="120" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="300" y="218" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">커밋1</text>
  <rect x="460" y="190" width="120" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="520" y="218" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">커밋2</text>
  <rect x="680" y="190" width="120" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="740" y="218" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">커밋3</text>

  <!-- 커밋 → A.java -->
  <line x1="300" y1="188" x2="300" y2="136" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="310" y="167" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">A.java</text>
  <line x1="520" y1="188" x2="520" y2="136" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="530" y="167" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">A.java</text>
  <line x1="740" y1="188" x2="740" y2="136" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="750" y="167" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">A.java</text>

  <!-- 커밋 → B.java -->
  <line x1="300" y1="236" x2="300" y2="288" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="310" y="267" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">B.java</text>
  <line x1="520" y1="236" x2="520" y2="288" stroke="#047857" stroke-width="2" marker-end="url(#ahg)"/>
  <text x="530" y="267" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">B.java</text>
  <line x1="740" y1="236" x2="740" y2="288" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="750" y="267" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">B.java</text>

  <!-- B.java 내용 객체 -->
  <rect x="210" y="292" width="400" height="48" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="410" y="322" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">내용#b1</text>
  <rect x="650" y="292" width="180" height="48" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="740" y="322" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">내용#b2</text>

  <!-- 재사용 설명 -->
  <line x1="520" y1="342" x2="520" y2="360" stroke="#047857" stroke-width="1.5"/>
  <text x="520" y="382" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">커밋2: B는 안 바뀜, 같은 것 재사용</text>

  <!-- 읽는 법 -->
  <line x1="24" y1="404" x2="856" y2="404" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="430" font-size="15" fill="#374151">여러 커밋에 걸친 상자 하나 = 같은 내용 하나를 함께 가리킴 (복사가 아니라 참조)</text>
</svg>
