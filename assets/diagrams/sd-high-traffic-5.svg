<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">장애가 번지지 않게 — 네 가지 장치</title>
  <desc id="d">추천 서비스 지연으로 인한 연쇄 장애 발생 과정 다이어그램</desc>
  <defs>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-darkred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>
  
  <rect x="140" y="40" width="600" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="68.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">추천 서비스가 느려진다 (죽지도 않았다. 그냥 느리다)</text>
  
  <path d="M440,88 L440,128" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  
  <rect x="140" y="128" width="600" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="156.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">상품 API가 추천을 호출하고 기다린다 (타임아웃 없음)</text>
  
  <path d="M440,176 L440,216" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
  
  <rect x="140" y="216" width="600" height="48" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="440" y="244.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">기다리는 동안 요청 처리 스레드가 하나씩 묶인다</text>
  
  <path d="M440,264 L440,304" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  
  <rect x="140" y="304" width="600" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="332.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">스레드 풀 고갈 → 추천과 무관한 주문 API도 처리 못 함</text>
  
  <path d="M440,352 L440,392" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#a-darkred)"/>
  
  <rect x="140" y="392" width="600" height="48" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="420.55" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">헬스체크도 응답 못 함 → LB가 전 인스턴스를 제외 → 전체 장애</text>
</svg>