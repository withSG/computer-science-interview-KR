<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">연쇄 장애가 번지는 순서</title>
  <desc id="d">추천 서비스가 느려지기만 해도, 타임아웃 없이 기다리는 상품 API의 스레드가 묶이고, 스레드 풀이 고갈되어 무관한 주문 API까지 멈추며, 헬스체크 실패로 LB가 전 인스턴스를 제외해 전체 장애가 되는 다섯 단계.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 1 -->
  <rect x="80" y="24" width="720" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="112" cy="51" r="14" fill="#b45309"/>
  <text x="112" y="56.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="140" y="57" font-size="17" fill="#111827"><tspan font-weight="bold">추천 서비스가 느려진다</tspan><tspan font-size="15" fill="#4b5563">  (죽지도 않았다. 그냥 느리다)</tspan></text>
  <path d="M440,82 V102" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect x="80" y="108" width="720" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="112" cy="135" r="14" fill="#b45309"/>
  <text x="112" y="140.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="140" y="141" font-size="17" fill="#111827"><tspan font-weight="bold">상품 API가 추천을 호출하고 기다린다</tspan><tspan font-size="15" fill="#4b5563">  (타임아웃 없음)</tspan></text>
  <path d="M440,166 V186" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect x="80" y="192" width="720" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="112" cy="219" r="14" fill="#c2410c"/>
  <text x="112" y="224.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="140" y="225" font-size="17" font-weight="bold" fill="#111827">기다리는 동안 요청 처리 스레드가 하나씩 묶인다</text>
  <path d="M440,250 V270" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect x="80" y="276" width="720" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="112" cy="303" r="14" fill="#b91c1c"/>
  <text x="112" y="308.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="140" y="309" font-size="17" font-weight="bold" fill="#111827">스레드 풀 고갈 → 추천과 무관한 주문 API도 처리 못 함</text>
  <path d="M440,334 V354" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 5 -->
  <rect x="80" y="360" width="720" height="54" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="112" cy="387" r="14" fill="#991b1b"/>
  <text x="112" y="392.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="140" y="393" font-size="17" font-weight="bold" fill="#111827">헬스체크도 응답 못 함 → LB가 전 인스턴스를 제외 → <tspan fill="#991b1b" font-size="19">전체 장애</tspan></text>
</svg>
