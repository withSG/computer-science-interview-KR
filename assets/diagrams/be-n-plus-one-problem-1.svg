<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">N+1 쿼리가 나가는 시점</title>
  <desc id="d">findAll()은 team 조회 쿼리 1번만 내고 members가 비어 있는 Team 객체 10개를 만든다. 반복문에서 team.getMembers().size()로 연관 데이터에 처음 접근할 때 팀마다 member 조회 쿼리가 나가 쿼리 2~11이 된다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 레인 머리 -->
  <text x="24" y="42" font-size="15" font-weight="700" fill="#4b5563">애플리케이션 (코드 · 객체)</text>
  <text x="480" y="42" font-size="15" font-weight="700" fill="#4b5563">DB로 나가는 SQL</text>
  <line x1="24" y1="56" x2="856" y2="56" stroke="#d1d5db" stroke-width="1"/>
  <line x1="458" y1="64" x2="458" y2="606" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ① 조회 시점 -->
  <text x="24" y="90" font-size="18" font-weight="700" fill="#111827">① 조회 시점</text>

  <rect x="24" y="108" width="290" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="169" y="137" font-size="16" text-anchor="middle" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">teamRepository.findAll()</text>

  <line x1="318" y1="132" x2="474" y2="132" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="480" y="97" width="376" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="496" y="123" font-size="16" font-weight="700" fill="#b91c1c">쿼리 1</text>
  <text x="496" y="153" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">select * from team</text>

  <path d="M 540 171 V 248 H 446" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="24" y="184" width="416" height="128" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="40" y="210" font-size="16" font-weight="700" fill="#111827">Team 객체 10개 생성</text>
  <g font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">
    <rect x="40" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="79" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="118" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="157" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="196" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="235" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="274" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="313" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="352" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="391" y="222" width="34" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <text x="57" y="240">1</text>
    <text x="96" y="240">2</text>
    <text x="135" y="240">3</text>
    <text x="174" y="240">4</text>
    <text x="213" y="240">5</text>
    <text x="252" y="240">6</text>
    <text x="291" y="240">7</text>
    <text x="330" y="240">8</text>
    <text x="369" y="240">9</text>
    <text x="408" y="240">10</text>
  </g>
  <g fill="#ffffff" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 2">
    <rect x="46" y="248" width="22" height="14"/>
    <rect x="85" y="248" width="22" height="14"/>
    <rect x="124" y="248" width="22" height="14"/>
    <rect x="163" y="248" width="22" height="14"/>
    <rect x="202" y="248" width="22" height="14"/>
    <rect x="241" y="248" width="22" height="14"/>
    <rect x="280" y="248" width="22" height="14"/>
    <rect x="319" y="248" width="22" height="14"/>
    <rect x="358" y="248" width="22" height="14"/>
    <rect x="397" y="248" width="22" height="14"/>
    <rect x="40" y="283" width="22" height="14"/>
  </g>
  <text x="70" y="295" font-size="15" fill="#374151">각 Team.members 는 "아직 안 채워진 컬렉션 래퍼"</text>

  <line x1="24" y1="336" x2="856" y2="336" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ② 처음 접근하는 시점 -->
  <text x="24" y="370" font-size="18" font-weight="700" fill="#111827">② 연관 데이터에 처음 접근하는 시점</text>

  <rect x="24" y="386" width="416" height="194" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="412" font-size="15" font-weight="700" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">for (Team team : teams)</text>
  <text x="424" y="412" font-size="15" text-anchor="end" fill="#4b5563">팀마다 반복</text>

  <rect x="44" y="426" width="376" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="232" y="455" font-size="16" text-anchor="middle" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">team.getMembers().size()</text>

  <line x1="232" y1="476" x2="232" y2="504" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="44" y="508" width="376" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <rect x="60" y="527" width="22" height="14" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="92" y="539" font-size="16" fill="#111827">컬렉션이 비어 있음을 확인 → 초기화 요청</text>

  <line x1="424" y1="534" x2="474" y2="534" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="480" y="499" width="376" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="496" y="525" font-size="16" font-weight="700" fill="#b91c1c">쿼리 2 ~ 11<tspan font-size="15" font-weight="400" fill="#4b5563">  · 팀마다 1번</tspan></text>
  <text x="496" y="555" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">select * from member where team_id = ?</text>

  <text x="480" y="604" font-size="18" font-weight="700" fill="#111827">총 11번 = 1 + 10</text>
</svg>
