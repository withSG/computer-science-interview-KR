<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정확히 어느 순간에 터지는가</title>
  <desc id="d">findAll 호출부터 반복문 안에서 getMembers 호출 시 추가 쿼리가 발생하는 N+1 문제의 흐름도</desc>
  <rect width="880" height="560" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="42" font-size="16" font-weight="bold" fill="#1f2933">### 1.2 정확히 어느 순간에 터지는가</text>

  <!-- Step 1: teamRepository.findAll() -->
  <rect x="40" y="75" width="230" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="155" y="100" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">teamRepository.findAll()</text>

  <path d="M 155,115 L 155,145 L 210,145" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- SQL Query 1 -->
  <rect x="218" y="125" width="210" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="323" y="150" font-size="13" font-weight="bold" stroke="none" fill="#1f2933" text-anchor="middle">select * from team</text>

  <!-- Query 1 Label -->
  <rect x="446" y="133" width="76" height="24" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="484" y="149" font-size="11.5" font-weight="bold" fill="#d97706" text-anchor="middle">← 쿼리 1</text>

  <path d="M 323,165 L 323,195 L 378,195" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <!-- Step 1 Result: Objects created -->
  <rect x="386" y="175" width="454" height="60" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="406" y="198" font-size="13" font-weight="bold" fill="#1f2933">Team 객체 10개 생성</text>
  <text x="406" y="220" font-size="11.5" fill="#52606d">각 Team.members 는 "아직 안 채워진 컬렉션 래퍼"</text>

  <!-- Section Separator Line -->
  <path d="M 40,255 L 840,255" fill="none" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Step 2: Loop -->
  <rect x="40" y="275" width="230" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="155" y="300" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">for (Team team : teams)</text>

  <path d="M 155,315 L 155,345 L 210,345" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/>

  <!-- Getter call -->
  <rect x="218" y="325" width="240" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="338" y="350" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">team.getMembers().size()</text>

  <path d="M 338,365 L 338,395 L 393,395" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/>

  <!-- Collection check -->
  <rect x="401" y="375" width="320" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="561" y="400" font-size="13" fill="#1f2933" text-anchor="middle">컬렉션이 비어 있음을 확인 → 초기화 요청</text>

  <path d="M 561,415 L 561,445 L 616,445" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/>

  <!-- N Queries execution -->
  <rect x="238" y="470" width="370" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="423" y="495" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">select * from member where team_id = ?</text>

  <!-- Query 2~11 Label -->
  <rect x="616" y="478" width="114" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="673" y="494" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">← 쿼리 2 ~ 11</text>
</svg>