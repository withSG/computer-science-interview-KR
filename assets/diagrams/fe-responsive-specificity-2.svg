<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">모바일 퍼스트가 유리한 진짜 이유</title>
  <desc id="d">데스크톱 퍼스트의 되돌리기 사슬과 모바일 퍼스트의 속성 추가 방식을 비교하는 구조도</desc>
  <rect width="880" height="730" fill="#ffffff"/>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Section 1: Desktop First -->
  <g>
    <!-- Card Container -->
    <rect x="24" y="24" width="832" height="310" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    
    <!-- Title Section -->
    <rect x="40" y="40" width="140" height="28" rx="4" fill="#dc2626"/>
    <text x="110" y="58" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">[데스크톱 퍼스트]</text>
    <text x="195" y="58" font-size="14" fill="#52606d">기본을 크게 잡고 좁아지면 되돌린다</text>

    <!-- Base Code Box -->
    <rect x="40" y="80" width="800" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="56" y="102" font-family="Consolas, monospace" font-size="13" fill="#1f2933">.sidebar { float: left; width: 240px; border-right: 1px solid; padding: 24px; }</text>

    <!-- Media Query Code Box -->
    <rect x="40" y="130" width="800" height="60" rx="4" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="56" y="153" font-family="Consolas, monospace" font-size="13" fill="#1f2933">@media (max-width: 768px) {</text>
    <text x="76" y="173" font-family="Consolas, monospace" font-size="13" fill="#1f2933">.sidebar { float: none; width: auto; border-right: none; padding: 12px; }</text>
    <text x="56" y="180" font-family="Consolas, monospace" font-size="13" fill="#1f2933">}</text>

    <!-- Arrow Annotation -->
    <path d="M 180,270 L 180,183" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
    
    <text x="200" y="215" font-size="13" font-weight="bold" fill="#dc2626">↑ 앞에서 준 걸 하나하나 취소하는 "되돌리기 사슬"</text>
    <text x="212" y="240" font-size="12.5" fill="#52606d">속성을 추가할 때마다 취소 코드도 같이 추가해야 한다</text>
    <text x="212" y="265" font-size="12.5" fill="#52606d">하나 빠뜨리면 모바일에서만 깨진다</text>
  </g>

  <!-- Section 2: Mobile First -->
  <g>
    <!-- Card Container -->
    <rect x="24" y="360" width="832" height="346" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    
    <!-- Title Section -->
    <rect x="40" y="376" width="130" height="28" rx="4" fill="#059669"/>
    <text x="105" y="394" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">[모바일 퍼스트]</text>
    <text x="185" y="394" font-size="14" fill="#52606d">기본을 작게 잡고 넓어지면 더한다</text>

    <!-- Base Code Box -->
    <rect x="40" y="416" width="800" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="56" y="438" font-family="Consolas, monospace" font-size="13" fill="#1f2933">.sidebar { padding: 12px; }</text>

    <!-- Media Query Code Box -->
    <rect x="40" y="466" width="800" height="60" rx="4" fill="#ffffff" stroke="#9aa5b1"/>
    <text x="56" y="489" font-family="Consolas, monospace" font-size="13" fill="#1f2933">@media (min-width: 769px) {</text>
    <text x="76" y="509" font-family="Consolas, monospace" font-size="13" fill="#1f2933">.sidebar { float: left; width: 240px; border-right: 1px solid; padding: 24px; }</text>
    <text x="56" y="516" font-family="Consolas, monospace" font-size="13" fill="#1f2933">}</text>

    <!-- Arrow Annotation -->
    <path d="M 180,565 L 180,519" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
    
    <text x="200" y="550" font-size="13" font-weight="bold" fill="#059669">↑ 취소가 아니라 "추가"만 한다</text>
  </g>
</svg>