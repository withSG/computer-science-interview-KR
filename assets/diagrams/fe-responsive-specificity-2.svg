<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">데스크톱 퍼스트와 모바일 퍼스트의 덮어쓰기 차이</title>
  <desc id="d">데스크톱 퍼스트는 기본 .sidebar에 float, width, border-right, padding을 크게 준 뒤 @media (max-width: 768px)에서 네 속성을 하나하나 취소하는 되돌리기 사슬이 생긴다. 모바일 퍼스트는 기본에 padding: 12px만 두고 @media (min-width: 769px)에서 속성을 추가만 한다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>

  <!-- ===== 왼쪽: 데스크톱 퍼스트 ===== -->
  <rect x="24" y="24" width="408" height="580" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="40" y="40" width="150" height="32" rx="6" fill="#b91c1c"/>
  <text x="115" y="62" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">데스크톱 퍼스트</text>
  <text x="40" y="98" font-size="15" fill="#374151">기본을 크게 잡고 좁아지면 되돌린다</text>

  <!-- 기본 스타일 -->
  <rect x="40" y="114" width="376" height="162" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827">
    <text x="56" y="142">.sidebar {</text>
    <text x="74" y="166">float: left;</text>
    <text x="74" y="190">width: 240px;</text>
    <text x="74" y="214">border-right: 1px solid;</text>
    <text x="74" y="238">padding: 24px;</text>
    <text x="56" y="262">}</text>
  </g>

  <!-- 미디어 쿼리: 되돌리기 -->
  <rect x="40" y="290" width="376" height="208" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <rect x="52" y="346" width="352" height="100" rx="4" fill="#fef2f2"/>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827">
    <text x="56" y="316" font-weight="bold" fill="#b91c1c">@media (max-width: 768px) {</text>
    <text x="74" y="340">.sidebar {</text>
    <text x="92" y="364">float: none;</text>
    <text x="92" y="388">width: auto;</text>
    <text x="92" y="412">border-right: none;</text>
    <text x="92" y="436">padding: 12px;</text>
    <text x="74" y="460">}</text>
    <text x="56" y="484">}</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">
    <rect x="336" y="349" width="56" height="21" rx="10.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="364" y="365">취소</text>
    <rect x="336" y="373" width="56" height="21" rx="10.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="364" y="389">취소</text>
    <rect x="336" y="397" width="56" height="21" rx="10.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="364" y="413">취소</text>
    <rect x="336" y="421" width="56" height="21" rx="10.5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="364" y="437">취소</text>
  </g>

  <text x="40" y="532" font-size="16" font-weight="bold" fill="#b91c1c">앞에서 준 걸 하나하나 취소하는 "되돌리기 사슬"</text>
  <text x="40" y="558" font-size="15" fill="#374151">속성을 추가할 때마다 취소 코드도 같이 추가해야 한다</text>
  <text x="40" y="582" font-size="15" fill="#374151">하나 빠뜨리면 모바일에서만 깨진다</text>

  <!-- ===== 오른쪽: 모바일 퍼스트 ===== -->
  <rect x="448" y="24" width="408" height="580" rx="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <rect x="464" y="40" width="134" height="32" rx="6" fill="#047857"/>
  <text x="531" y="62" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">모바일 퍼스트</text>
  <text x="464" y="98" font-size="15" fill="#374151">기본을 작게 잡고 넓어지면 더한다</text>

  <!-- 기본 스타일 -->
  <rect x="464" y="114" width="376" height="90" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827">
    <text x="480" y="142">.sidebar {</text>
    <text x="498" y="166">padding: 12px;</text>
    <text x="480" y="190">}</text>
  </g>

  <!-- 미디어 쿼리: 추가 -->
  <rect x="464" y="290" width="376" height="208" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <rect x="476" y="346" width="352" height="100" rx="4" fill="#ecfdf5"/>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827">
    <text x="480" y="316" font-weight="bold" fill="#047857">@media (min-width: 769px) {</text>
    <text x="498" y="340">.sidebar {</text>
    <text x="516" y="364">float: left;</text>
    <text x="516" y="388">width: 240px;</text>
    <text x="516" y="412">border-right: 1px solid;</text>
    <text x="516" y="436">padding: 24px;</text>
    <text x="498" y="460">}</text>
    <text x="480" y="484">}</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">
    <rect x="760" y="349" width="56" height="21" rx="10.5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
    <text x="788" y="365">추가</text>
    <rect x="760" y="373" width="56" height="21" rx="10.5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
    <text x="788" y="389">추가</text>
    <rect x="760" y="397" width="56" height="21" rx="10.5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
    <text x="788" y="413">추가</text>
    <rect x="760" y="421" width="56" height="21" rx="10.5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
    <text x="788" y="437">추가</text>
  </g>

  <text x="464" y="532" font-size="16" font-weight="bold" fill="#047857">취소가 아니라 "추가"만 한다</text>
</svg>
