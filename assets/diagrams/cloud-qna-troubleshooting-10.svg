<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 답변 예시</title>
  <desc id="d">이벤트 프로모션 대규모 트래픽 대응 경험에 대한 면접 답변 예시 구조도</desc>
  <rect width="880" height="770" fill="#ffffff"/>

  <!-- Main Background Container -->
  <rect x="24" y="24" width="832" height="722" rx="12" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Title / Quote Header -->
  <rect x="44" y="44" width="792" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="74" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">"이벤트 프로모션 때 평소 대비 10배 트래픽이 예상되었습니다."</text>

  <!-- Section 1: 준비 (Yellow/Orange Theme) -->
  <rect x="44" y="110" width="792" height="180" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="64" y="137" font-size="16" font-weight="bold" fill="#d97706">준비:</text>

  <!-- Sub-block 1 -->
  <rect x="64" y="152" width="752" height="122" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="84" y="177" font-size="14" font-weight="bold" fill="#1f2933">1. 부하 테스트로 병목 구간 파악</text>
  
  <rect x="104" y="190" width="340" height="68" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="124" y="229" font-size="13" fill="#dc2626">- API 서버: CPU 80%에서 응답 지연</text>

  <rect x="456" y="190" width="340" height="68" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="476" y="229" font-size="13" fill="#dc2626">- DB: 커넥션 풀 고갈</text>

  <!-- Section 2: 대응 조치 (Blue Theme) -->
  <rect x="44" y="306" width="792" height="200" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="64" y="333" font-size="16" font-weight="bold" fill="#2563eb">2. 대응 조치</text>

  <rect x="64" y="348" width="366" height="64" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="84" y="385" font-size="13" fill="#1f2933">- HPA 설정 (max 20 → 50)</text>

  <rect x="450" y="348" width="366" height="64" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="470" y="385" font-size="13" fill="#1f2933">- Redis 캐시 적용 (상품 목록, TTL 1분)</text>

  <rect x="64" y="424" width="366" height="64" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="84" y="461" font-size="13" fill="#1f2933">- DB Read Replica 추가</text>

  <rect x="450" y="424" width="366" height="64" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="470" y="461" font-size="13" fill="#1f2933">- CDN으로 이미지 서빙</text>

  <!-- Section 3: 이벤트 당일 모니터링 (Purple Theme) -->
  <rect x="44" y="522" width="792" height="106" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="64" y="549" font-size="16" font-weight="bold" fill="#7c3aed">3. 이벤트 당일 모니터링</text>

  <rect x="64" y="562" width="366" height="50" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="84" y="592" font-size="13" fill="#1f2933">- 실시간 대시보드 상시 확인</text>

  <rect x="450" y="562" width="366" height="50" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="470" y="592" font-size="13" fill="#1f2933">- 슬랙 알림 즉시 대응 체계</text>

  <!-- Section 4: 결과 (Green Theme) -->
  <rect x="44" y="644" width="792" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="64" y="671" font-size="16" font-weight="bold" fill="#059669">결과:</text>

  <text x="64" y="702" font-size="13" font-weight="bold" fill="#059669">- 피크 시 Pod 35개까지 확장</text>
  <text x="320" y="702" font-size="13" font-weight="bold" fill="#059669">- 평균 응답시간 150ms 유지</text>
  <text x="580" y="702" font-size="13" font-weight="bold" fill="#059669">- 장애 없이 이벤트 종료</text>
</svg>