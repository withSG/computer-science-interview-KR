<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이벤트 트래픽 대응 답변</title>
  <desc id="d">평소 대비 10배 트래픽이 예상된 이벤트를 부하 테스트로 병목 파악, 대응 조치, 당일 모니터링의 세 단계로 준비해 피크 시 Pod 35개 확장, 평균 응답시간 150ms 유지, 장애 없는 종료라는 결과를 낸 면접 답변 구조.</desc>
  <rect width="880" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 단계 축 (왼쪽) -->
  <line x1="68" y1="79" x2="68" y2="114" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="68" y1="158" x2="68" y2="449" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="28" y="41" width="80" height="34" rx="17" fill="#334155"/>
  <text x="68" y="63" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">상황</text>

  <rect x="28" y="120" width="80" height="34" rx="17" fill="#334155"/>
  <text x="68" y="143" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">준비</text>

  <rect x="28" y="455" width="80" height="34" rx="17" fill="#334155"/>
  <text x="68" y="478" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">결과</text>

  <!-- 상황 -->
  <rect x="124" y="28" width="728" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="148" y="64" font-size="17" fill="#0f172a">“이벤트 프로모션 때 평소 대비 <tspan font-weight="bold" fill="#1d4ed8">10배</tspan> 트래픽이 예상되었습니다.”</text>

  <!-- 준비 1 -->
  <rect x="124" y="112" width="728" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="152" cy="137" r="14" fill="#1d4ed8"/>
  <text x="152" y="142" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="176" y="142" font-size="16" font-weight="bold" fill="#0f172a">부하 테스트로 병목 구간 파악</text>
  <line x1="436" y1="124" x2="436" y2="176" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="458" cy="137" r="3" fill="#475569"/>
  <text x="470" y="142" font-size="16" fill="#1f2937">API 서버: CPU 80%에서 응답 지연</text>
  <circle cx="458" cy="163" r="3" fill="#475569"/>
  <text x="470" y="168" font-size="16" fill="#1f2937">DB: 커넥션 풀 고갈</text>

  <!-- 준비 2 -->
  <rect x="124" y="200" width="728" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="152" cy="225" r="14" fill="#1d4ed8"/>
  <text x="152" y="230" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="176" y="230" font-size="16" font-weight="bold" fill="#0f172a">대응 조치</text>
  <line x1="436" y1="212" x2="436" y2="316" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="458" cy="225" r="3" fill="#475569"/>
  <text x="470" y="230" font-size="16" fill="#1f2937">HPA 설정 (max 20 → 50)</text>
  <circle cx="458" cy="251" r="3" fill="#475569"/>
  <text x="470" y="256" font-size="16" fill="#1f2937">Redis 캐시 적용 (상품 목록, TTL 1분)</text>
  <circle cx="458" cy="277" r="3" fill="#475569"/>
  <text x="470" y="282" font-size="16" fill="#1f2937">DB Read Replica 추가</text>
  <circle cx="458" cy="303" r="3" fill="#475569"/>
  <text x="470" y="308" font-size="16" fill="#1f2937">CDN으로 이미지 서빙</text>

  <!-- 준비 3 -->
  <rect x="124" y="340" width="728" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="152" cy="365" r="14" fill="#1d4ed8"/>
  <text x="152" y="370" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="176" y="370" font-size="16" font-weight="bold" fill="#0f172a">이벤트 당일 모니터링</text>
  <line x1="436" y1="352" x2="436" y2="404" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="458" cy="365" r="3" fill="#475569"/>
  <text x="470" y="370" font-size="16" fill="#1f2937">실시간 대시보드 상시 확인</text>
  <circle cx="458" cy="391" r="3" fill="#475569"/>
  <text x="470" y="396" font-size="16" fill="#1f2937">슬랙 알림 즉시 대응 체계</text>

  <!-- 결과 -->
  <rect x="124" y="440" width="232" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="478" font-size="16" fill="#064e3b" text-anchor="middle">피크 시 Pod <tspan font-weight="bold" fill="#047857">35개</tspan>까지 확장</text>

  <rect x="372" y="440" width="232" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="488" y="478" font-size="16" fill="#064e3b" text-anchor="middle">평균 응답시간 <tspan font-weight="bold" fill="#047857">150ms</tspan> 유지</text>

  <rect x="620" y="440" width="232" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="736" y="478" font-size="16" fill="#064e3b" text-anchor="middle"><tspan font-weight="bold" fill="#047857">장애 없이</tspan> 이벤트 종료</text>
</svg>
