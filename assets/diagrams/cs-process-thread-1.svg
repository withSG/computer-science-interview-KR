<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로세스 메모리 구조</title>
  <desc id="d">Stack, Heap, Data, Code 영역으로 구성된 프로세스 메모리 구조 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>
  
  <text x="440" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">프로세스 메모리 구조</text>

  <!-- Stack Area -->
  <rect x="240" y="60" width="220" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Stack</text>

  <path d="M470,90 L520,90" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="530" y="94" text-anchor="start" font-size="13" fill="#52606d">지역 변수, 함수 호출 정보</text>

  <!-- Free Space & Arrows -->
  <rect x="240" y="120" width="220" height="120" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="4 4"/>
  
  <path d="M350,135 L350,165" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M350,225 L350,195" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- Heap Area -->
  <rect x="240" y="240" width="220" height="60" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="350" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Heap</text>

  <path d="M470,270 L520,270" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="530" y="274" text-anchor="start" font-size="13" fill="#52606d">동적 할당 메모리</text>

  <!-- Data Area -->
  <rect x="240" y="300" width="220" height="60" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Data</text>

  <path d="M470,330 L520,330" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="530" y="334" text-anchor="start" font-size="13" fill="#52606d">전역 변수, 정적 변수</text>

  <!-- Code Area -->
  <rect x="240" y="360" width="220" height="60" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="350" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Code</text>

  <path d="M470,390 L520,390" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="530" y="394" text-anchor="start" font-size="13" fill="#52606d">실행할 코드</text>
</svg>