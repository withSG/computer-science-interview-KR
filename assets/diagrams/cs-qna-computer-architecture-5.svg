<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">패리티 비트 (Parity Bit)</title>
  <desc id="d">짝수 패리티와 홀수 패리티의 개념 정의 및 데이터 1011001과 1011000에 대한 패리티 비트 설정 및 전송 예시 다이어그램</desc>
  
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 제목 영역 -->
  <text x="40" y="44" font-size="16" font-weight="bold" fill="#1f2933">패리티 비트 (Parity Bit)</text>

  <!-- 정의 상자 -->
  <rect x="40" y="65" width="800" height="90" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- 짝수 패리티 정의 -->
  <rect x="60" y="80" width="90" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="105" y="96" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">짝수 패리티</text>
  <text x="160" y="96" font-size="13" fill="#1f2933">: 전체 1의 개수가 짝수가 되도록 패리티 비트 설정</text>

  <!-- 홀수 패리티 정의 -->
  <rect x="60" y="116" width="90" height="24" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="105" y="132" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="middle">홀수 패리티</text>
  <text x="160" y="132" font-size="13" fill="#1f2933">: 전체 1의 개수가 홀수가 되도록 패리티 비트 설정</text>

  <!-- 예시 섹션 라벨 -->
  <text x="40" y="185" font-size="14" font-weight="bold" fill="#1f2933">예시 (짝수 패리티):</text>

  <!-- ==================== 예시 1 카드 ==================== -->
  <rect x="40" y="200" width="800" height="140" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>

  <!-- 데이터 그룹 -->
  <text x="70" y="240" font-size="13" font-weight="bold" fill="#52606d">데이터:</text>
  <rect x="130" y="220" width="120" height="32" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="190" y="241" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle" letter-spacing="2">1011001</text>

  <!-- 화살표 1 -->
  <path d="M260,236 L300,236" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 1의 개수 계산 -->
  <rect x="310" y="220" width="180" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="400" y="241" font-size="13" fill="#2563eb" text-anchor="middle">1의 개수 = 4개 (짝수)</text>

  <!-- 패리티 비트 설정 -->
  <text x="70" y="295" font-size="13" font-weight="bold" fill="#52606d">패리티 비트:</text>
  <rect x="155" y="275" width="32" height="32" rx="4" fill="#059669" stroke="#059669" stroke-width="1"/>
  <text x="171" y="296" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>

  <!-- 화살표 2 -->
  <path d="M197,291 L237,291" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 전송 데이터 결과 -->
  <text x="247" y="295" font-size="13" font-weight="bold" fill="#52606d">전송:</text>
  <!-- 데이터 부분 -->
  <rect x="290" y="275" width="120" height="32" rx="4 0 0 4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="350" y="296" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle" letter-spacing="2">1011001</text>
  <!-- 패리티 비트 부분 -->
  <rect x="410" y="275" width="32" height="32" rx="0 4 4 0" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="426" y="296" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">0</text>


  <!-- ==================== 예시 2 카드 ==================== -->
  <rect x="40" y="360" width="800" height="140" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>

  <!-- 데이터 그룹 -->
  <text x="70" y="400" font-size="13" font-weight="bold" fill="#52606d">데이터:</text>
  <rect x="130" y="380" width="120" height="32" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="190" y="401" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle" letter-spacing="2">1011000</text>

  <!-- 화살표 1 -->
  <path d="M260,396 L300,396" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 1의 개수 계산 -->
  <rect x="310" y="380" width="180" height="32" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="400" y="401" font-size="13" fill="#d97706" text-anchor="middle">1의 개수 = 3개 (홀수)</text>

  <!-- 패리티 비트 설정 -->
  <text x="70" y="455" font-size="13" font-weight="bold" fill="#52606d">패리티 비트:</text>
  <rect x="155" y="435" width="32" height="32" rx="4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
  <text x="171" y="456" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- 화살표 2 -->
  <path d="M197,451 L237,451" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 전송 데이터 결과 -->
  <text x="247" y="455" font-size="13" font-weight="bold" fill="#52606d">전송:</text>
  <!-- 데이터 부분 -->
  <rect x="290" y="435" width="120" height="32" rx="4 0 0 4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="350" y="456" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle" letter-spacing="2">1011000</text>
  <!-- 패리티 비트 부분 -->
  <rect x="410" y="435" width="32" height="32" rx="0 4 4 0" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="426" y="456" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">1</text>

</svg>