<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">짝수·홀수 패리티 비트</title>
  <desc id="d">짝수 패리티는 전체 1의 개수가 짝수, 홀수 패리티는 홀수가 되도록 패리티 비트를 설정한다. 짝수 패리티 예시로 데이터 1011001은 1의 개수가 4개(짝수)라 패리티 비트 0을 붙여 1011001 0을, 데이터 1011000은 3개(홀수)라 패리티 비트 1을 붙여 1011000 1을 전송한다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 정의 -->
  <rect x="40" y="26" width="110" height="34" rx="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="95" y="49" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">짝수 패리티</text>
  <text x="166" y="49" font-size="16" fill="#111827">전체 1의 개수가 <tspan font-weight="bold" fill="#1d4ed8">짝수</tspan>가 되도록 패리티 비트 설정</text>
