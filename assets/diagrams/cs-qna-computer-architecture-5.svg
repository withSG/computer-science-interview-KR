  <text x="95" y="95" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">홀수 패리티</text>
  <text x="166" y="95" font-size="16" fill="#111827">전체 1의 개수가 <tspan font-weight="bold" fill="#6d28d9">홀수</tspan>가 되도록 패리티 비트 설정</text>

  <line x1="40" y1="130" x2="840" y2="130" stroke="#e5e7eb" stroke-width="1.5"/>

