<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">cron이 사람을 배신하는 지점</title>
  <desc id="d">내 터미널과 cron 환경의 차이점을 비교하는 다이어그램</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 내 터미널 그룹 -->
  <rect x="80" y="40" width="340" height="240" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="75" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">내 터미널</text>

  <!-- 내 터미널 박스 -->
  <rect x="100" y="95" width="300" height="165" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="120" y="125" font-size="13" fill="#1f2933">~/.bashrc 실행</text>
  <text x="120" y="153" font-size="13" fill="#1f2933">PATH 풍부</text>
  <text x="120" y="181" font-size="13" fill="#1f2933">환경 변수 전부</text>
  <text x="120" y="209" font-size="13" fill="#1f2933">현재 디렉토리 있음</text>
  <text x="120" y="237" font-size="13" fill="#1f2933">출력이 화면에 보임</text>

  <!-- cron 그룹 -->
  <rect x="460" y="40" width="340" height="240" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="630" y="75" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">cron</text>

  <!-- cron 박스 -->
  <rect x="480" y="95" width="300" height="165" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="500" y="125" font-size="13" fill="#1f2933">프로파일 안 읽음</text>
  <text x="500" y="153" font-size="13" fill="#1f2933">PATH 매우 짧음</text>
  <text x="500" y="181" font-size="13" fill="#1f2933">거의 없음</text>
  <text x="500" y="209" font-size="13" fill="#1f2933">홈 디렉토리에서 시작</text>
  <text x="500" y="237" font-size="13" fill="#1f2933">출력이 사라지거나 메일</text>
</svg>