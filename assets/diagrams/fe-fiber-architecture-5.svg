<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">current 트리와 workInProgress 트리의 더블 버퍼링</title>
  <desc id="d">화면에 반영된 current 트리와 계산 중인 workInProgress 트리의 각 fiber(App, List, Item)가 alternate로 짝을 가리킨다. render 단계는 workInProgress만 수정하므로 중간에 버려도 current는 멀쩡하고, commit이 끝나면 두 트리의 역할을 맞바꾼다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- current 트리 패널 -->
  <rect x="40" y="24" width="320" height="316" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="60" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">current 트리</text>
  <text x="200" y="86" font-size="15" fill="#1e3a8a" text-anchor="middle">(화면에 반영된 것)</text>

  <!-- workInProgress 트리 패널 -->
  <rect x="520" y="24" width="320" height="316" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="680" y="60" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">workInProgress 트리</text>
  <text x="680" y="86" font-size="15" fill="#065f46" text-anchor="middle">(계산 중인 것)</text>

  <!-- 트리 간선 (부모-자식) -->
  <line x1="200" y1="164" x2="200" y2="196" stroke="#374151" stroke-width="2"/>
  <line x1="200" y1="240" x2="200" y2="272" stroke="#374151" stroke-width="2"/>
  <line x1="680" y1="164" x2="680" y2="196" stroke="#374151" stroke-width="2"/>
  <line x1="680" y1="240" x2="680" y2="272" stroke="#374151" stroke-width="2"/>

  <!-- current 노드 -->
  <rect x="130" y="120" width="140" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="149" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">App</text>
  <rect x="130" y="196" width="140" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="225" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">List</text>
  <rect x="130" y="272" width="140" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="301" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Item</text>

  <!-- workInProgress 노드 -->
  <rect x="610" y="120" width="140" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="680" y="149" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">App'</text>
  <rect x="610" y="196" width="140" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="680" y="225" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">List'</text>
  <rect x="610" y="272" width="140" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="680" y="301" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Item'</text>

  <!-- alternate 양방향 연결 -->
  <line x1="274" y1="142" x2="606" y2="142" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ah-purple)" marker-end="url(#ah-purple)"/>
  <text x="440" y="130" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">alternate</text>
  <line x1="274" y1="218" x2="606" y2="218" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ah-purple)" marker-end="url(#ah-purple)"/>
  <text x="440" y="206" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">alternate</text>
  <line x1="274" y1="294" x2="606" y2="294" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ah-purple)" marker-end="url(#ah-purple)"/>
  <text x="440" y="282" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">alternate</text>

  <!-- 동작 설명 -->
  <rect x="40" y="368" width="800" height="128" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>

  <circle cx="76" cy="400" r="15" fill="#047857"/>
  <text x="76" y="406" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="104" y="406" font-size="16" fill="#111827"><tspan font-weight="bold">render 단계</tspan>에서는 <tspan font-weight="bold" fill="#065f46">workInProgress</tspan>만 수정한다.</text>
  <text x="104" y="434" font-size="16" fill="#111827">→ 중간에 버려도 <tspan font-weight="bold" fill="#1e3a8a">current</tspan>는 멀쩡하다.</text>

  <circle cx="76" cy="466" r="15" fill="#374151"/>
  <text x="76" y="472" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="104" y="472" font-size="16" fill="#111827"><tspan font-weight="bold">commit이 끝나면</tspan> 두 트리의 역할을 맞바꾼다 (포인터 교체).</text>
</svg>
