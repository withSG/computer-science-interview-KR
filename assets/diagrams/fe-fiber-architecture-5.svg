<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">더블 버퍼링</title>
  <desc id="d">React의 current 트리와 workInProgress 트리 간의 alternate 포인터 연결 및 더블 버퍼링 메커니즘을 설명하는 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <!-- Alternate bidirectional arrow marker (Ink) -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- Alternate bidirectional arrow marker (Purple) -->
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <!-- Downward single arrow marker -->
    <marker id="a-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <!-- Left Container: current 트리 -->
  <rect x="40" y="30" width="360" height="310" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="65" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">current 트리</text>
  <text x="220" y="88" font-size="13" fill="#52606d" text-anchor="middle">(화면에 반영된 것)</text>

  <!-- Right Container: workInProgress 트리 -->
  <rect x="480" y="30" width="360" height="310" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="65" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">workInProgress 트리</text>
  <text x="660" y="88" font-size="13" fill="#52606d" text-anchor="middle">(계산 중인 것)</text>

  <!-- Left Tree Nodes (current) -->
  <rect x="150" y="120" width="140" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="145" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">App</text>

  <rect x="150" y="190" width="140" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="215" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">List</text>

  <rect x="150" y="260" width="140" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="285" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Item</text>

  <!-- Left Vertical Lines -->
  <path d="M220,160 L220,190" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M220,230 L220,260" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <!-- Right Tree Nodes (workInProgress) -->
  <rect x="590" y="120" width="140" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="660" y="145" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">App'</text>

  <rect x="590" y="190" width="140" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="660" y="215" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">List'</text>

  <rect x="590" y="260" width="140" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="660" y="285" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Item'</text>

  <!-- Right Vertical Lines -->
  <path d="M660,160 L660,190" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M660,230 L660,260" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <!-- Horizontal Bidirectional Alternate Connections -->
  <!-- App <-> App' -->
  <path d="M290,140 L590,140" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <rect x="390" y="128" width="100" height="24" fill="#ffffff"/>
  <text x="440" y="144" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">alternate</text>

  <!-- List <-> List' -->
  <path d="M290,210 L590,210" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <rect x="390" y="198" width="100" height="24" fill="#ffffff"/>
  <text x="440" y="214" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">alternate</text>

  <!-- Item <-> Item' -->
  <path d="M290,280 L590,280" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <rect x="390" y="268" width="100" height="24" fill="#ffffff"/>
  <text x="440" y="284" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">alternate</text>

  <!-- Explanatory Text Area at Bottom -->
  <rect x="40" y="360" width="800" height="110" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <text x="60" y="392" font-size="13" fill="#1f2933">render 단계에서는 workInProgress만 수정한다.</text>
  <text x="60" y="418" font-size="13" fill="#d97706">→ 중간에 버려도 current는 멀쩡하다.</text>
  <text x="60" y="444" font-size="13" fill="#1f2933">commit이 끝나면 두 트리의 역할을 맞바꾼다(포인터 교체).</text>
</svg>