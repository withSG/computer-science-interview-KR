<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파일 시스템 구성</title>
  <desc id="d">파일 시스템의 메타 영역과 데이터 영역의 구성을 설명하는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 프레임 Container -->
  <rect x="40" y="30" width="800" height="280" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>

  <!-- 메타 영역 Section -->
  <rect x="50" y="40" width="780" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="360" y="48" width="160" height="28" rx="4" fill="#2563eb"/>
  <text x="440" y="66.8" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">메타 영역</text>

  <text x="70" y="104.5" fill="#1f2933" font-size="13">- 수퍼블록: 파일 시스템 전체 정보</text>
  <text x="70" y="134.5" fill="#1f2933" font-size="13">- i-node: 파일 속성 (권한, 크기, 시간)</text>
  <text x="70" y="164.5" fill="#1f2933" font-size="13">- 디렉토리: 파일명 ↔ i-node 번호 매핑</text>

  <!-- 영역 구분선 -->
  <line x1="40" y1="200" x2="840" y2="200" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 데이터 영역 Section -->
  <rect x="50" y="210" width="780" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="360" y="218" width="160" height="28" rx="4" fill="#059669"/>
  <text x="440" y="236.8" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">데이터 영역</text>

  <text x="70" y="274.5" fill="#1f2933" font-size="13">- 실제 파일 내용</text>
</svg>