<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파일 시스템 구성</title>
  <desc id="d">파일 시스템은 메타 영역과 데이터 영역으로 나뉜다. 메타 영역에는 파일 시스템 전체 정보를 담은 슈퍼블록, 파일 속성을 담은 i-node, 파일명과 i-node 번호를 매핑하는 디렉터리가 있고, 데이터 영역에는 실제 파일 내용이 있다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>

  <!-- 메타 영역 -->
  <rect x="40" y="24" width="800" height="204" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M48,24 H180 V228 H48 A8,8 0 0 1 40,220 V32 A8,8 0 0 1 48,24 Z" fill="#1d4ed8"/>
  <text x="110" y="133" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">메타 영역</text>

  <rect x="200" y="44" width="620" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="220" y="74" font-size="17" font-weight="bold" fill="#1e3a8a">슈퍼블록</text>
  <line x1="340" y1="54" x2="340" y2="82" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="360" y="74" font-size="16" fill="#1f2937">파일 시스템 전체 정보</text>

  <rect x="200" y="102" width="620" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="220" y="132" font-size="17" font-weight="bold" fill="#1e3a8a">i-node</text>
  <line x1="340" y1="112" x2="340" y2="140" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="360" y="132" font-size="16" fill="#1f2937">파일 속성 (권한, 크기, 시간)</text>

  <rect x="200" y="160" width="620" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="220" y="190" font-size="17" font-weight="bold" fill="#1e3a8a">디렉터리</text>
  <line x1="340" y1="170" x2="340" y2="198" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="360" y="190" font-size="16" fill="#1f2937">파일명 ↔ i-node 번호 매핑</text>

  <!-- 데이터 영역 -->
  <rect x="40" y="244" width="800" height="80" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <path d="M48,244 H180 V324 H48 A8,8 0 0 1 40,316 V252 A8,8 0 0 1 48,244 Z" fill="#047857"/>
  <text x="110" y="291" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">데이터 영역</text>

  <rect x="200" y="260" width="620" height="48" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="220" y="290" font-size="17" font-weight="bold" fill="#064e3b">실제 파일 내용</text>
</svg>
