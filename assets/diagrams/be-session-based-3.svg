<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세션 저장 위치 세 가지</title>
  <desc id="d">[1] 애플리케이션 메모리는 WAS 안의 HashMap에 세션을 두어 프로세스가 죽으면 세션도 사라지고, [2] Redis 등 외부 캐시는 WAS #1과 WAS #2가 Redis 하나를 함께 써서 빠르지만 별도 운영이 필요하며, [3] 관계형 DB는 WAS가 MySQL에 두어 느리지만 영속한다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 패널 -->
  <rect x="24" y="20" width="256" height="316" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="312" y="20" width="256" height="316" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="600" y="20" width="256" height="316" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- [1] 애플리케이션 메모리 -->
  <text x="42" y="54" font-size="17" font-weight="bold" fill="#111827">[1] 애플리케이션 메모리</text>
  <rect x="48" y="80" width="208" height="164" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="152" y="111" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">WAS</text>
  <rect x="80" y="176" width="144" height="50" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="152" y="207" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">HashMap</text>
  <line x1="40" y1="262" x2="264" y2="262" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="152" y="292" font-size="16" fill="#374151" text-anchor="middle">프로세스가 죽으면</text>
  <text x="152" y="315" font-size="16" fill="#374151" text-anchor="middle">세션도 함께 사라짐</text>

  <!-- [2] Redis 등 외부 캐시 -->
  <text x="330" y="54" font-size="17" font-weight="bold" fill="#111827">[2] Redis 등 외부 캐시</text>
  <rect x="328" y="80" width="104" height="50" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="380" y="111" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">WAS #1</text>
  <rect x="448" y="80" width="104" height="50" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="500" y="111" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">WAS #2</text>
  <path d="M380,130 V152 H500 V130" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="440" y1="152" x2="440" y2="174" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="380" y="176" width="120" height="50" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="207" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Redis</text>
  <line x1="328" y1="262" x2="552" y2="262" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="440" y="292" font-size="16" fill="#374151" text-anchor="middle">빠름 / 별도 운영</text>

  <!-- [3] 관계형 DB -->
  <text x="618" y="54" font-size="17" font-weight="bold" fill="#111827">[3] 관계형 DB</text>
  <rect x="668" y="80" width="120" height="50" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="728" y="111" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">WAS</text>
  <line x1="728" y1="130" x2="728" y2="174" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="668" y="176" width="120" height="50" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="728" y="207" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">MySQL</text>
  <line x1="616" y1="262" x2="840" y2="262" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="728" y="292" font-size="16" fill="#374151" text-anchor="middle">느림 / 영속</text>

  <!-- 범례 -->
  <rect x="24" y="351" width="20" height="16" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="54" y="365" font-size="15" fill="#374151">세션이 저장되는 곳</text>
</svg>
