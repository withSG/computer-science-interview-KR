<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">알림 시스템 대략적 설계</title>
  <desc id="d">주문·결제·마케팅 등 서비스들이 API로 Notification Service에 요청하면, Notification Service가 검증·템플릿 처리 후 Message Queue(Kafka)에 발행하고, Push(FCM)·SMS(Twilio)·Email(SES) Worker가 채널별로 나눠 발송한다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. 서비스들 -->
  <rect x="180" y="24" width="520" height="68" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">서비스들</text>
  <text x="440" y="77" font-size="15" fill="#4b5563" text-anchor="middle">주문, 결제, 마케팅...</text>

  <line x1="440" y1="92" x2="440" y2="134" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="454" y="119" font-size="15" font-weight="bold" fill="#374151">API</text>

  <!-- 2. Notification Service -->
  <rect x="180" y="138" width="520" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="168" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Notification Service</text>
  <text x="440" y="194" font-size="15" fill="#1f2937" text-anchor="middle">검증, 템플릿 처리, 큐 발행</text>

  <line x1="440" y1="210" x2="440" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3. Message Queue -->
  <rect x="180" y="254" width="520" height="72" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="284" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Message Queue (Kafka)</text>
  <text x="440" y="310" font-size="15" fill="#1f2937" text-anchor="middle">priority별 토픽, 순서 보장</text>

  <!-- 팬아웃 -->
  <line x1="440" y1="326" x2="440" y2="358" stroke="#374151" stroke-width="2"/>
  <line x1="164" y1="358" x2="716" y2="358" stroke="#374151" stroke-width="2"/>
  <line x1="164" y1="357" x2="164" y2="392" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="358" x2="440" y2="392" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="716" y1="357" x2="716" y2="392" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4. Workers -->
  <rect x="44" y="396" width="240" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="164" y="430" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">Push Worker</text>
  <text x="164" y="458" font-size="16" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FCM</text>

  <rect x="320" y="396" width="240" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="430" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">SMS Worker</text>
  <text x="440" y="458" font-size="16" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Twilio</text>

  <rect x="596" y="396" width="240" height="84" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="716" y="430" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">Email Worker</text>
  <text x="716" y="458" font-size="16" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SES</text>
</svg>
