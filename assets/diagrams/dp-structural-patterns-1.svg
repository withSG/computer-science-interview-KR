<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">데코레이터 호출 흐름</title>
  <desc id="d">sender.send()를 부르면 LoggingSender가 시작 시각을 기록하고, 안쪽의 RetryingSender가 1회차 SmsSender.send() 실패 뒤 2회차에 성공해 반환하며, 마지막으로 LoggingSender가 소요 시간을 로깅한다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 진입 -->
  <rect x="100" y="24" width="170" height="38" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="185" y="49" font-size="16" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">sender.send()</text>
  <path d="M185,62 V92" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- LoggingSender (바깥) -->
  <rect x="100" y="96" width="680" height="360" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="124" font-size="17" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">LoggingSender</text>

  <circle cx="134" cy="156" r="12" fill="#1d4ed8"/>
  <text x="134" y="161" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="156" y="162" font-size="16" fill="#111827">시작 시각 기록</text>

  <!-- RetryingSender (안쪽) -->
  <rect x="132" y="182" width="616" height="210" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="152" y="210" font-size="17" font-weight="700" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RetryingSender</text>

  <!-- 1회차 -->
  <circle cx="166" cy="250" r="12" fill="#6d28d9"/>
  <text x="166" y="255" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="188" y="256" font-size="16" font-weight="700" fill="#111827">1회차</text>
  <path d="M238,250 H306" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="310" y="230" width="220" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="420" y="256" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SmsSender.send()</text>
  <path d="M530,250 H596" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="600" y="234" width="80" height="32" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="640" y="256" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">실패</text>

  <!-- 2회차 -->
  <circle cx="166" cy="306" r="12" fill="#6d28d9"/>
  <text x="166" y="311" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="188" y="312" font-size="16" font-weight="700" fill="#111827">2회차</text>
  <path d="M238,306 H306" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="310" y="286" width="220" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="420" y="312" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SmsSender.send()</text>
  <path d="M530,306 H596" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="600" y="290" width="80" height="32" rx="16" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="640" y="312" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">성공</text>

  <!-- 반환 -->
  <circle cx="166" cy="360" r="12" fill="#6d28d9"/>
  <text x="166" y="365" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="188" y="366" font-size="16" font-weight="700" fill="#111827">반환</text>

  <!-- 다시 LoggingSender -->
  <circle cx="134" cy="424" r="12" fill="#1d4ed8"/>
  <text x="134" y="429" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="156" y="430" font-size="16" fill="#111827">소요 시간 로깅</text>
</svg>
