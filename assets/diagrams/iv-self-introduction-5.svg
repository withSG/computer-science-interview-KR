<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 [선택]이 가장 비싼가 - 약한 예시 vs 강한 예시 비교</title>
  <desc id="d">[약함]과 [강함] 두 가지 답변 방식을 비교하여, 문제 인식부터 대안 검토, 선택, 트레이드오프 수용까지 포함된 답변의 우수성을 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- [약함] 세션 영역 -->
  <g>
    <!-- [약함] 태그 박스 -->
    <rect x="30" y="30" width="80" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="70" y="52.55" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">[약함]</text>

    <!-- [약함] 본문 박스 -->
    <rect x="120" y="30" width="730" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
    <text x="135" y="52.55" font-size="13" fill="#1f2933">"Next.js를 사용해서 SEO를 개선했습니다."</text>

    <!-- 화살표 -->
    <path d="M160,80 L160,95" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- [약함] 설명 박스 -->
    <rect x="180" y="80" width="670" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="195" y="102.55" font-size="13" fill="#52606d">→ 유행이라서 쓴 건지 필요해서 쓴 건지 구분되지 않는다.</text>
  </g>

  <!-- 구분선 -->
  <line x1="30" y1="145" x2="850" y2="145" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- [강함] 세션 영역 -->
  <g>
    <!-- [강함] 태그 박스 -->
    <rect x="30" y="175" width="80" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="70" y="197.55" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">[강함]</text>

    <!-- [강함] 본문 박스 -->
    <rect x="120" y="175" width="730" height="205" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="135" y="202.55" font-size="13" fill="#1f2933">"검색 유입과 링크 공유가 중요한 서비스인데 CSR이라 초기 HTML이 거의 비어</text>
    <text x="135" y="232.55" font-size="13" fill="#1f2933">있었습니다. 자바스크립트를 실행하는 크롤러는 결국 내용을 읽어가지만</text>
    <text x="135" y="262.55" font-size="13" fill="#1f2933">SNS 미리보기처럼 실행하지 않는 쪽에서는 빈 카드가 나왔습니다.</text>
    <text x="135" y="292.55" font-size="13" fill="#1f2933">메타 태그만 따로 처리하는 방법도 검토했는데, 마침 라우팅 구조를</text>
    <text x="135" y="322.55" font-size="13" fill="#1f2933">새로 짜야 하는 시점이라 Next.js로 옮겼습니다.</text>
    <text x="135" y="352.55" font-size="13" fill="#1f2933">대신 빌드와 배포가 복잡해지는 건 감수했습니다."</text>

    <!-- 화살표 -->
    <path d="M160,395 L160,410" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- [강함] 설명 박스 -->
    <rect x="180" y="395" width="670" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="195" y="417.55" font-size="13" font-weight="bold" fill="#7c3aed">→ 문제 인식 → 대안 검토 → 선택 → 트레이드오프 수용까지 다 들어 있다.</text>
  </g>
</svg>