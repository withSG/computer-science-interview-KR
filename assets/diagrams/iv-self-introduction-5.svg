<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">약한 답변과 강한 답변</title>
  <desc id="d">"Next.js를 사용해서 SEO를 개선했습니다"라는 약한 답변은 유행이라 쓴 건지 필요해서 쓴 건지 구분되지 않는다. 강한 답변은 문장마다 문제 인식, 대안 검토, 선택, 트레이드오프 수용이 차례로 들어 있다.</desc>
  <rect width="880" height="530" fill="#ffffff"/>

  <!-- [약함] -->
  <rect x="24" y="24" width="832" height="100" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="44" y="46" width="84" height="32" rx="16" fill="#b91c1c"/>
  <text x="86" y="67.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">[약함]</text>
  <text x="252" y="68" font-size="17" fill="#111827">“Next.js를 사용해서 SEO를 개선했습니다.”</text>
  <text x="252" y="104" font-size="16" font-weight="bold" fill="#b91c1c">→ 유행이라서 쓴 건지 필요해서 쓴 건지 구분되지 않는다.</text>

  <!-- [강함] -->
  <rect x="24" y="148" width="832" height="358" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <rect x="44" y="168" width="84" height="32" rx="16" fill="#047857"/>
  <text x="86" y="189.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">[강함]</text>

  <!-- 조각 표시 막대 -->
  <g fill="#10b981">
    <rect x="236" y="219" width="4" height="101" rx="2"/>
    <rect x="236" y="335" width="4" height="23" rx="2"/>
    <rect x="236" y="373" width="4" height="23" rx="2"/>
    <rect x="236" y="411" width="4" height="23" rx="2"/>
  </g>

  <!-- 조각 이름 -->
  <g font-size="15" font-weight="bold" fill="#065f46" text-anchor="end">
    <text x="222" y="236">① 문제 인식</text>
    <text x="222" y="352">② 대안 검토</text>
    <text x="222" y="390">③ 선택</text>
    <text x="222" y="428">④ 트레이드오프 수용</text>
  </g>

  <!-- 답변 원문 -->
  <g font-size="16" fill="#111827">
    <text x="252" y="236">“검색 유입과 링크 공유가 중요한 서비스인데 CSR이라 초기 HTML이</text>
    <text x="252" y="262">거의 비어 있었습니다. 자바스크립트를 실행하는 크롤러는</text>
    <text x="252" y="288">결국 내용을 읽어가지만 SNS 미리보기처럼 실행하지 않는 쪽에서는</text>
    <text x="252" y="314">빈 카드가 나왔습니다.</text>
    <text x="252" y="352">메타 태그만 따로 처리하는 방법도 검토했는데,</text>
    <text x="252" y="390">마침 라우팅 구조를 새로 짜야 하는 시점이라 Next.js로 옮겼습니다.</text>
    <text x="252" y="428">대신 빌드와 배포가 복잡해지는 건 감수했습니다.”</text>
  </g>

  <line x1="44" y1="454" x2="836" y2="454" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="252" y="484" font-size="16" font-weight="bold" fill="#047857">→ 문제 인식 → 대안 검토 → 선택 → 트레이드오프 수용까지 다 들어 있다.</text>
</svg>
