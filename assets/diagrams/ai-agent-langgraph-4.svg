<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">요청 단위 관측 항목</title>
  <desc id="d">에이전트 요청 하나마다 남길 네 가지 기록과 그 쓰임입니다. 총 LLM 호출 수·토큰·비용은 폭주 탐지, 도구별 호출 횟수·성공률·지연은 문제 도구 식별, 종료 사유는 리밋 비율 경보, 전체 궤적은 사후 디버깅의 유일한 단서입니다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 루트 -->
  <rect x="24" y="24" width="264" height="44" rx="8" fill="#1f2937"/>
  <text x="156" y="52" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">요청 단위로 남길 것</text>

  <!-- 트리 줄기 -->
  <path d="M56,68 L56,315 M56,117 L88,117 M56,183 L88,183 M56,249 L88,249 M56,315 L88,315" stroke="#9ca3af" stroke-width="2" fill="none"/>

  <!-- 1 -->
  <rect x="88" y="92" width="420" height="50" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="123" font-size="16" fill="#111827">총 LLM 호출 수 / 총 토큰 / 총 비용</text>
  <path d="M514,117 L552,117" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="566" y="123" font-size="16" fill="#111827">폭주 탐지</text>

  <!-- 2 -->
  <rect x="88" y="158" width="420" height="50" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="189" font-size="16" fill="#111827">도구별 호출 횟수 · 성공률 · 지연</text>
  <path d="M514,183 L552,183" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="566" y="189" font-size="16" fill="#111827">어느 도구가 문제인지</text>

  <!-- 3 -->
  <rect x="88" y="224" width="420" height="50" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="255" font-size="16" fill="#111827">종료 사유 (정상 / 예산 소진 / 하드 리밋)</text>
  <path d="M514,249 L552,249" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="566" y="255" font-size="16" fill="#111827">리밋 비율이 오르면 경보</text>

  <!-- 4 (강조) -->
  <rect x="88" y="290" width="420" height="50" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="108" y="321" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#6d28d9">전체 궤적</tspan> (Thought-Action-Observation)</text>
  <path d="M514,315 L552,315" stroke="#6d28d9" stroke-width="1.8" fill="none" marker-end="url(#ahp)"/>
  <text x="566" y="321" font-size="16" font-weight="bold" fill="#6d28d9">사후 디버깅의 유일한 단서</text>
</svg>
