<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">메모리 주소의 세 조각</title>
  <desc id="d">32비트 메모리 주소를 Tag, Index, Offset으로 나누고 각 조각의 역할을 설명합니다. Index로 캐시 집합을 찾고, Tag를 비교해 히트와 미스를 가르고, Offset으로 라인 안의 바이트를 꺼내는 조회 순서도 함께 보입니다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 주소 막대 -->
  <text x="40" y="42" font-size="17" font-weight="700" fill="#111827">메모리 주소 (예: 32비트)</text>
  <rect x="40" y="58" width="320" height="56" fill="#dbeafe"/>
  <rect x="360" y="58" width="260" height="56" fill="#ede9fe"/>
  <rect x="620" y="58" width="220" height="56" fill="#fef3c7"/>
  <rect x="40" y="58" width="800" height="56" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="360" y1="58" x2="360" y2="114" stroke="#374151" stroke-width="2"/>
  <line x1="620" y1="58" x2="620" y2="114" stroke="#374151" stroke-width="2"/>
  <text x="200" y="93" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Tag</text>
  <text x="490" y="93" font-size="20" font-weight="700" fill="#6d28d9" text-anchor="middle">Index</text>
  <text x="730" y="93" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">Offset</text>

  <!-- 연결선 -->
  <line x1="200" y1="116" x2="200" y2="146" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="490" y1="116" x2="490" y2="146" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <line x1="730" y1="116" x2="730" y2="146" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>

  <!-- Tag 설명 -->
  <rect x="40" y="150" width="308" height="112" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="56" y="178" font-size="16" font-weight="700" fill="#1d4ed8">② 맞는 블록인지 확인</text>
  <text x="56" y="204" font-size="15" fill="#111827">그 자리에 있는 게 정말 내가 찾는</text>
  <text x="56" y="226" font-size="15" fill="#111827">블록인지 확인하는 표식</text>
  <text x="56" y="250" font-size="15" font-weight="700" fill="#111827"><tspan fill="#047857">같으면 히트</tspan> · <tspan fill="#b91c1c">다르면 미스</tspan></text>

  <!-- Index 설명 -->
  <rect x="372" y="150" width="236" height="112" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="388" y="178" font-size="16" font-weight="700" fill="#6d28d9">① 자리 찾기</text>
  <text x="388" y="204" font-size="15" fill="#111827">캐시의 몇 번째 집합(set)에</text>
  <text x="388" y="226" font-size="15" fill="#111827">들어가는가</text>

  <!-- Offset 설명 -->
  <rect x="632" y="150" width="208" height="112" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="648" y="178" font-size="16" font-weight="700" fill="#b45309">③ 바이트 꺼내기</text>
  <text x="648" y="204" font-size="15" fill="#111827">캐시 라인 안에서</text>
  <text x="648" y="226" font-size="15" fill="#111827">몇 번째 바이트인가</text>
  <text x="648" y="248" font-size="15" fill="#374151">(라인 64B → 6비트)</text>

  <!-- 조회 순서 -->
  <text x="40" y="300" font-size="16" font-weight="700" fill="#111827">조회 순서</text>
  <rect x="40" y="314" width="176" height="44" rx="22" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="128" y="341" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">① Index로 자리 찾기</text>
  <line x1="218" y1="336" x2="242" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="244" y="314" width="110" height="44" rx="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="299" y="341" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">② Tag 비교</text>
  <line x1="356" y1="336" x2="380" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="382" y="314" width="204" height="44" rx="22" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="484" y="341" font-size="15" font-weight="700" fill="#111827" text-anchor="middle"><tspan fill="#047857">같으면 히트</tspan> / <tspan fill="#b91c1c">다르면 미스</tspan></text>
  <line x1="588" y1="336" x2="612" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="614" y="314" width="226" height="44" rx="22" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="727" y="341" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">③ Offset으로 바이트 꺼내기</text>
</svg>
