<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4. 캐시는 어떻게 찾는가 — 매핑 방식</title>
  <desc id="d">메모리 주소(Tag, Index, Offset)의 구성을 표시하고 각 비트 필드가 의미하는 바를 연결하여 설명하는 다이어그램</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title Label -->
  <text x="440" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">메모리 주소 (예: 32비트)</text>

  <!-- Memory Address Block Structure -->
  <!-- Tag Box -->
  <rect x="140" y="55" width="260" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">Tag</text>

  <!-- Index Box -->
  <rect x="400" y="55" width="180" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="490" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">Index</text>

  <!-- Offset Box -->
  <rect x="580" y="55" width="160" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="660" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">Offset</text>

  <!-- Connector Lines with Arrows -->
  <!-- Tag Arrow -->
  <path d="M270,95 L270,220" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Index Arrow -->
  <path d="M490,95 L490,170" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Offset Arrow -->
  <path d="M660,95 L660,120" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <!-- Description Text Blocks -->
  <!-- Offset Descriptions -->
  <text x="670" y="129" text-anchor="start" font-size="13" fill="#1f2933">캐시 라인 안에서 몇 번째 바이트인가</text>
  <text x="670" y="149" text-anchor="start" font-size="13" fill="#52606d">(라인 64B → 6비트)</text>

  <!-- Index Description -->
  <text x="500" y="179" text-anchor="start" font-size="13" fill="#1f2933">캐시의 몇 번째 집합(set)에 들어가는가</text>

  <!-- Tag Descriptions -->
  <text x="280" y="229" text-anchor="start" font-size="13" fill="#1f2933">그 자리에 있는 게 정말 내가 찾는 블록인지</text>
  <text x="280" y="249" text-anchor="start" font-size="13" fill="#1f2933">확인하는 표식</text>
</svg>