<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스레드 메모리 구조</title>
  <desc id="d">한 프로세스 안에서 Code, Data, Heap 영역은 모든 스레드가 공유하고, Stack은 스레드 T1, T2, T3마다 Stack1, Stack2, Stack3로 따로 할당된다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 프로세스 -->
  <rect x="24" y="24" width="832" height="372" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="48" y="56" font-size="18" font-weight="bold" fill="#111827">프로세스</text>

  <!-- 공유 영역 -->
  <rect x="48" y="72" width="784" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="72" y="118" font-size="20" font-weight="bold" fill="#1d4ed8">공유</text>
  <text x="72" y="146" font-size="15" fill="#374151">모든 스레드가</text>
  <text x="72" y="166" font-size="15" fill="#374151">함께 사용</text>

  <rect x="192" y="96" width="192" height="72" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="288" y="139" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Code</text>
  <rect x="404" y="96" width="192" height="72" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="500" y="139" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Data</text>
  <rect x="616" y="96" width="192" height="72" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="712" y="139" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Heap</text>

  <!-- 독립 영역 -->
  <rect x="48" y="246" width="784" height="128" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="72" y="294" font-size="20" font-weight="bold" fill="#b45309">독립</text>
  <text x="72" y="322" font-size="15" fill="#374151">스레드마다</text>
  <text x="72" y="342" font-size="15" fill="#374151">별개</text>

  <!-- 세 스레드가 같은 공유 영역에 닿는 연결선 -->
  <path d="M288,268 L288,226 L712,226 L712,268" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M500,268 L500,196" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#up)"/>

  <rect x="192" y="270" width="192" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="288" y="305" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">Stack1</text>
  <text x="288" y="333" font-size="15" fill="#4b5563" text-anchor="middle">스레드 T1</text>
  <rect x="404" y="270" width="192" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="305" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">Stack2</text>
  <text x="500" y="333" font-size="15" fill="#4b5563" text-anchor="middle">스레드 T2</text>
  <rect x="616" y="270" width="192" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="712" y="305" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">Stack3</text>
  <text x="712" y="333" font-size="15" fill="#4b5563" text-anchor="middle">스레드 T3</text>
</svg>
