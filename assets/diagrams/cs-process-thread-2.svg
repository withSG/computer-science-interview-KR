<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스레드 메모리 구조</title>
  <desc id="d">프로세스 내부에서 Code, Data, Heap 영역은 공유되고 각 스레드별 Stack 영역은 독립적으로 할당된 메모리 구조를 보여주는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Outer Container: Process -->
  <rect x="40" y="40" width="800" height="260" rx="8" ry="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="60" y="68" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="start">프로세스</text>

  <!-- Shared Memory Section (Code, Data, Heap) -->
  <g id="shared-memory">
    <rect x="60" y="85" width="240" height="85" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4" ry="4"/>
    <text x="180" y="132" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Code</text>

    <rect x="320" y="85" width="240" height="85" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4" ry="4"/>
    <text x="440" y="132" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Data</text>

    <rect x="580" y="85" width="240" height="85" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4" ry="4"/>
    <text x="700" y="132" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Heap (공유)</text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="185" x2="820" y2="185" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Independent Memory Section (Stack1, Stack2, Stack3) -->
  <g id="independent-memory">
    <rect x="60" y="198" width="240" height="85" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4" ry="4"/>
    <text x="180" y="233" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Stack1</text>
    <text x="180" y="258" font-size="13" fill="#52606d" text-anchor="middle">(T1)</text>

    <rect x="320" y="198" width="240" height="85" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4" ry="4"/>
    <text x="440" y="233" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Stack2</text>
    <text x="440" y="258" font-size="13" fill="#52606d" text-anchor="middle">(T2)</text>

    <rect x="580" y="198" width="240" height="85" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4" ry="4"/>
    <text x="700" y="233" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Stack3  (독립)</text>
    <text x="700" y="258" font-size="13" fill="#52606d" text-anchor="middle">(T3)</text>
  </g>
</svg>