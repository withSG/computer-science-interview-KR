<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">혼동 행렬</title>
  <desc id="d">실제 Positive·Negative와 예측 Positive·Negative를 교차한 2×2 표. 실제 Positive 행은 TP와 FN, 실제 Negative 행은 FP와 TN이다. Precision은 예측 Positive 열, Recall은 실제 Positive 행에서 계산한다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <g transform="translate(24,0)">

  <!-- 머리행 -->
  <rect x="190" y="40" width="200" height="54" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="390" y="40" width="200" height="54" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="290" y="73" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">예측 Positive</text>
  <text x="490" y="73" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">예측 Negative</text>

  <!-- 머리열 -->
  <rect x="40" y="94" width="150" height="120" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="214" width="150" height="120" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="160" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">실제 Positive</text>
  <text x="115" y="280" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">실제 Negative</text>

  <!-- 칸 -->
  <rect x="190" y="94" width="200" height="120" fill="#ecfdf5" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="390" y="94" width="200" height="120" fill="#fef2f2" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="190" y="214" width="200" height="120" fill="#fef2f2" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="390" y="214" width="200" height="120" fill="#ecfdf5" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="290" y="164" font-size="30" font-weight="bold" fill="#047857" text-anchor="middle">TP</text>
  <text x="490" y="164" font-size="30" font-weight="bold" fill="#b91c1c" text-anchor="middle">FN</text>
  <text x="290" y="284" font-size="30" font-weight="bold" fill="#b91c1c" text-anchor="middle">FP</text>
  <text x="490" y="284" font-size="30" font-weight="bold" fill="#047857" text-anchor="middle">TN</text>

  <!-- Recall: 실제 Positive 행 -->
  <path d="M 604 102 L 612 102 L 612 206 L 604 206" stroke="#6d28d9" stroke-width="2" fill="none"/>
  <text x="626" y="148" font-size="16" font-weight="bold" fill="#6d28d9">Recall = TP / (TP+FN)</text>
  <text x="626" y="172" font-size="15" fill="#4b5563">실제 양성 중 잡아낸 비율</text>

  <!-- Precision: 예측 Positive 열 -->
  <path d="M 198 346 L 198 354 L 382 354 L 382 346" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <text x="290" y="382" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Precision = TP / (TP+FP)</text>
  <text x="290" y="405" font-size="15" fill="#4b5563" text-anchor="middle">양성 예측 중 진짜 양성 비율</text>

  <!-- 범례 -->
  <rect x="460" y="366" width="20" height="20" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="490" y="382" font-size="15" fill="#1f2937">맞춘 예측 (TP, TN)</text>
  <rect x="460" y="396" width="20" height="20" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="490" y="412" font-size="15" fill="#1f2937">틀린 예측 (FN, FP)</text>
  </g>
</svg>
