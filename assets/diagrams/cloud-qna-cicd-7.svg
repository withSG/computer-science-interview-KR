<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 피라미드</title>
  <desc id="d">Unit Test, Integration Test, E2E Test의 범위와 속도, 비용 관계를 나타낸 테스트 피라미드 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 피라미드 구역 (아래에서 위로) -->
  <!-- 1층: Unit Test -->
  <polygon points="120,330 520,330 460,250 180,250" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <!-- 2층: Integration Test -->
  <polygon points="180,250 460,250 400,170 240,170" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <!-- 3층: E2E Test -->
  <polygon points="240,170 400,170 320,60" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>

  <!-- 중앙 세로 구분선 (원래 다이어그램의 │ 및 ▲) -->
  <line x1="320" y1="330" x2="320" y2="40" stroke="#1f2933" stroke-width="1.5"/>
  <polygon points="320,30 314,44 326,44" fill="#1f2933"/>

  <!-- 라벨 및 보조 설명 -->
  <!-- 3층 라벨 -->
  <text x="540" y="109" font-size="14" fill="#1f2933" font-weight="bold">E2E Test</text>
  <text x="540" y="129" font-size="13" fill="#dc2626">(느림, 비용↑)</text>

  <!-- 2층 라벨 -->
  <text x="540" y="204" font-size="14" fill="#1f2933" font-weight="bold">Integration Test</text>
  <text x="540" y="224" font-size="13" fill="#2563eb">(중간)</text>

  <!-- 1층 라벨 -->
  <text x="540" y="284" font-size="14" fill="#1f2933" font-weight="bold">Unit Test</text>
  <text x="540" y="304" font-size="13" fill="#059669">(빠름, 비용↓)</text>

  <!-- 하단 화살표 및 라벨 -->
  <text x="140" y="380" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">많음</text>
  <path d="M190,375 L450,375" stroke="#1f2933" stroke-width="1.5" fill="none" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/>
  <text x="500" y="380" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">적음</text>
</svg>