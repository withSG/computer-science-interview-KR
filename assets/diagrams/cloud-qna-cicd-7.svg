<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 피라미드</title>
  <desc id="d">아래층 Unit Test는 빠르고 비용이 낮으며 많고, 가운데 Integration Test는 중간, 꼭대기 E2E Test는 느리고 비용이 높으며 적다는 테스트 피라미드입니다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <g transform="translate(50,0)">
  <!-- 테스트 수 축 (위: 적음, 아래: 많음) -->
  <line x1="120" y1="80" x2="120" y2="340" stroke="#374151" stroke-width="2" marker-start="url(#ax)" marker-end="url(#ax)"/>
  <text x="120" y="64" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">적음</text>
  <text x="120" y="370" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">많음</text>
  <text x="104" y="216" font-size="15" fill="#374151" text-anchor="end">테스트 수</text>

  <!-- 피라미드 -->
  <polygon points="380,60 457,170 303,170" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <polygon points="303,170 457,170 523.5,265 236.5,265" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="236.5,265 523.5,265 590,360 170,360" fill="#d1fae5" stroke="#047857" stroke-width="2"/>

  <text x="380" y="152" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">E2E Test</text>
  <text x="380" y="224" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Integration Test</text>
  <text x="380" y="319" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Unit Test</text>

  <!-- 층별 특성 -->
  <line x1="452" y1="147" x2="626" y2="147" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="640" y="153" font-size="16" font-weight="bold" fill="#b91c1c">느림, 비용↑</text>

  <line x1="502" y1="218" x2="626" y2="218" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="640" y="224" font-size="16" font-weight="bold" fill="#1d4ed8">중간</text>

  <line x1="568" y1="313" x2="626" y2="313" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="640" y="319" font-size="16" font-weight="bold" fill="#047857">빠름, 비용↓</text>
  </g>
</svg>
