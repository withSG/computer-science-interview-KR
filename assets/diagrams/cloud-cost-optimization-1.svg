<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컴퓨팅 과금 모델: 약정과 유연성의 교환</title>
  <desc id="d">On-Demand, Savings Plans, Reserved Instance, Spot 4가지 컴퓨팅 과금 모델의 유연성, 할인율, 특징 및 사용 케이스를 비교하는 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Top Indicators -->
  <!-- Left: High Flexibility / Low Discount -->
  <text x="120" y="28" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">유연성 높음</text>
  <text x="120" y="48" font-size="13" fill="#52606d" text-anchor="middle">할인 없음</text>
  <path d="M120,58 L120,82" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Right: Low Flexibility / High Discount -->
  <text x="760" y="28" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">유연성 낮음</text>
  <text x="760" y="48" font-size="13" fill="#52606d" text-anchor="middle">할인 큼</text>
  <path d="M760,58 L760,82" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- Box 1: On-Demand -->
  <g transform="translate(30, 90)">
    <rect width="180" height="180" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="90" y="29.55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">On-Demand</text>
    <text x="20" y="81.55" font-size="13" fill="#1f2933">쓴 만큼</text>
    <text x="20" y="103.55" font-size="13" fill="#1f2933">즉시 과금</text>
  </g>

  <!-- Box 2: Savings Plans -->
  <g transform="translate(240, 90)">
    <rect width="180" height="180" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="90" y="29.55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Savings Plans</text>
    <text x="20" y="81.55" font-size="13" fill="#1f2933">시간당 금액을</text>
    <text x="20" y="103.55" font-size="13" fill="#1f2933">약정</text>
    <text x="20" y="125.55" font-size="13" fill="#1f2933">(1년/3년)</text>
  </g>

  <!-- Box 3: Reserved Instance -->
  <g transform="translate(450, 90)">
    <rect width="180" height="180" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="90" y="24.55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Reserved</text>
    <text x="90" y="44.55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Instance</text>
    <text x="20" y="81.55" font-size="13" fill="#1f2933">특정 타입을</text>
    <text x="20" y="103.55" font-size="13" fill="#1f2933">약정</text>
    <text x="20" y="125.55" font-size="13" fill="#1f2933">(1년/3년)</text>
  </g>

  <!-- Box 4: Spot -->
  <g transform="translate(660, 90)">
    <rect width="180" height="180" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="90" y="29.55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Spot</text>
    <text x="20" y="81.55" font-size="13" fill="#1f2933">남는 용량을</text>
    <text x="20" y="103.55" font-size="13" fill="#1f2933">빌림</text>
    <text x="20" y="125.55" font-size="13" fill="#1f2933">중단 가능</text>
  </g>

  <!-- Bottom Arrows & Labels -->
  <!-- Bottom 1: On-Demand -->
  <path d="M120,312 L120,278" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="30" y="327.025" font-size="11.5" fill="#52606d">예측 불가능한</text>
  <text x="30" y="343.025" font-size="11.5" fill="#52606d">스파이크</text>

  <!-- Bottom 2: Savings Plans -->
  <path d="M330,312 L330,278" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="240" y="327.025" font-size="11.5" fill="#52606d">기술 스택이</text>
  <text x="240" y="343.025" font-size="11.5" fill="#52606d">바뀔 수 있는</text>
  <text x="240" y="359.025" font-size="11.5" fill="#52606d">장기 워크로드</text>

  <!-- Bottom 3: Reserved Instance -->
  <path d="M540,312 L540,278" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="450" y="327.025" font-size="11.5" fill="#52606d">구성이 확정된</text>
  <text x="450" y="343.025" font-size="11.5" fill="#52606d">장기 워크로드</text>

  <!-- Bottom 4: Spot -->
  <path d="M750,312 L750,278" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
  <text x="660" y="327.025" font-size="11.5" fill="#52606d">중단돼도 되는</text>
  <text x="660" y="343.025" font-size="11.5" fill="#52606d">배치·비동기 작업</text>
</svg>