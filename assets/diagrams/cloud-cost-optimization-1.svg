<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컴퓨팅 과금 모델: 약정과 유연성의 교환</title>
  <desc id="d">On-Demand, Savings Plans, Reserved Instance, Spot 네 과금 모델을 왼쪽(유연성 높음, 할인 없음)에서 오른쪽(유연성 낮음, 할인 큼) 순으로 늘어놓고, 각 모델의 방식과 잘 맞는 워크로드를 보여 준다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 교환 축: 유연성은 왼쪽이 크고, 할인은 오른쪽이 크다 -->
  <text x="24" y="44" font-size="16" font-weight="bold" fill="#1e40af">유연성 높음</text>
  <polygon points="124,29 758,37 758,39 124,47" fill="#93c5fd"/>
  <text x="856" y="44" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="end">유연성 낮음</text>

  <text x="24" y="80" font-size="16" font-weight="bold" fill="#92400e">할인 없음</text>
  <polygon points="124,73 758,65 758,83 124,75" fill="#fcd34d"/>
  <text x="856" y="80" font-size="16" font-weight="bold" fill="#92400e" text-anchor="end">할인 큼</text>

  <!-- On-Demand -->
  <path d="M24,154 V112 Q24,104 32,104 H212 Q220,104 220,112 V154 Z" fill="#dbeafe"/>
  <rect x="24" y="104" width="196" height="146" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="24" y1="154" x2="220" y2="154" stroke="#2563eb" stroke-width="1"/>
  <text x="122" y="136" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">On-Demand</text>
  <text x="122" y="190" font-size="16" fill="#111827" text-anchor="middle">쓴 만큼</text>
  <text x="122" y="214" font-size="16" fill="#111827" text-anchor="middle">즉시 과금</text>

  <!-- Savings Plans -->
  <path d="M236,154 V112 Q236,104 244,104 H424 Q432,104 432,112 V154 Z" fill="#ede9fe"/>
  <rect x="236" y="104" width="196" height="146" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="236" y1="154" x2="432" y2="154" stroke="#7c3aed" stroke-width="1"/>
  <text x="334" y="136" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">Savings Plans</text>
  <text x="334" y="190" font-size="16" fill="#111827" text-anchor="middle">시간당 금액을 약정</text>
  <text x="334" y="214" font-size="16" fill="#374151" text-anchor="middle">(1년/3년)</text>

  <!-- Reserved Instance -->
  <path d="M448,154 V112 Q448,104 456,104 H636 Q644,104 644,112 V154 Z" fill="#d1fae5"/>
  <rect x="448" y="104" width="196" height="146" rx="8" fill="none" stroke="#059669" stroke-width="1.5"/>
  <line x1="448" y1="154" x2="644" y2="154" stroke="#059669" stroke-width="1"/>
  <text x="546" y="136" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">Reserved Instance</text>
  <text x="546" y="190" font-size="16" fill="#111827" text-anchor="middle">특정 타입을 약정</text>
  <text x="546" y="214" font-size="16" fill="#374151" text-anchor="middle">(1년/3년)</text>

  <!-- Spot -->
  <path d="M660,154 V112 Q660,104 668,104 H848 Q856,104 856,112 V154 Z" fill="#fef3c7"/>
  <rect x="660" y="104" width="196" height="146" rx="8" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <line x1="660" y1="154" x2="856" y2="154" stroke="#d97706" stroke-width="1"/>
  <text x="758" y="136" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">Spot</text>
  <text x="758" y="190" font-size="16" fill="#111827" text-anchor="middle">남는 용량을 빌림</text>
  <text x="758" y="214" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">중단 가능</text>

  <!-- 워크로드 → 모델 -->
  <line x1="122" y1="298" x2="122" y2="256" stroke="#6b7280" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="334" y1="298" x2="334" y2="256" stroke="#6b7280" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="546" y1="298" x2="546" y2="256" stroke="#6b7280" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="758" y1="298" x2="758" y2="256" stroke="#6b7280" stroke-width="1.5" marker-end="url(#up)"/>

  <rect x="24" y="300" width="196" height="92" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="122" y="340" font-size="15" fill="#1f2937" text-anchor="middle">예측 불가능한</text>
  <text x="122" y="362" font-size="15" fill="#1f2937" text-anchor="middle">스파이크</text>

  <rect x="236" y="300" width="196" height="92" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="334" y="329" font-size="15" fill="#1f2937" text-anchor="middle">기술 스택이</text>
  <text x="334" y="351" font-size="15" fill="#1f2937" text-anchor="middle">바뀔 수 있는</text>
  <text x="334" y="373" font-size="15" fill="#1f2937" text-anchor="middle">장기 워크로드</text>

  <rect x="448" y="300" width="196" height="92" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="546" y="340" font-size="15" fill="#1f2937" text-anchor="middle">구성이 확정된</text>
  <text x="546" y="362" font-size="15" fill="#1f2937" text-anchor="middle">장기 워크로드</text>

  <rect x="660" y="300" width="196" height="92" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="758" y="340" font-size="15" fill="#1f2937" text-anchor="middle">중단돼도 되는</text>
  <text x="758" y="362" font-size="15" fill="#1f2937" text-anchor="middle">배치·비동기 작업</text>
</svg>
