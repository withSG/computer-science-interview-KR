<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파라메트릭 서치 단조성 조건</title>
  <desc id="d">파라메트릭 서치에서 조건을 만족하는 최댓값을 찾는 이진 탐색의 단조성 판정 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 상단 수열 및 판정 섹션 -->
  <g transform="translate(0, 0)">
    <!-- 컬럼 1: x=1, O -->
    <rect x="70" y="30" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="110" y="52" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">x  :  1</text>
    <rect x="70" y="74" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="110" y="96" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">판정:  O</text>

    <!-- 컬럼 2: x=2, O -->
    <rect x="160" y="30" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="200" y="52" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">2</text>
    <rect x="160" y="74" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="200" y="96" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">O</text>

    <!-- 컬럼 3: x=3, O -->
    <rect x="250" y="30" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="290" y="52" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">3</text>
    <rect x="250" y="74" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="290" y="96" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">O</text>

    <!-- 컬럼 4: x=4, O (경계/답) -->
    <rect x="340" y="30" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="380" y="52" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">4</text>
    <rect x="340" y="74" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="4"/>
    <text x="380" y="96" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">O</text>

    <!-- 컬럼 5: x=5, X -->
    <rect x="430" y="30" width="80" height="36" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5" rx="4"/>
    <text x="470" y="52" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">5</text>
    <rect x="430" y="74" width="80" height="36" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="470" y="96" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">X</text>

    <!-- 컬럼 6: x=6, X -->
    <rect x="520" y="30" width="80" height="36" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5" rx="4"/>
    <text x="560" y="52" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <rect x="520" y="74" width="80" height="36" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="560" y="96" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">X</text>

    <!-- 컬럼 7: x=7, X -->
    <rect x="610" y="30" width="80" height="36" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5" rx="4"/>
    <text x="650" y="52" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">7</text>
    <rect x="610" y="74" width="80" height="36" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="650" y="96" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">X</text>

    <!-- 컬럼 8: x=8, X -->
    <rect x="700" y="30" width="80" height="36" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5" rx="4"/>
    <text x="740" y="52" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">8</text>
    <rect x="700" y="74" width="80" height="36" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
    <text x="740" y="96" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">X</text>

    <!-- 화살표 및 답 라벨 -->
    <path d="M 380,165 L 380,118" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
    <rect x="235" y="170" width="290" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <text x="380" y="190" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">답 = 4 (조건을 만족하는 최댓값)</text>
  </g>

  <!-- 하단 단조성 주의사항 박스 -->
  <rect x="40" y="235" width="800" height="75" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="6"/>
  
  <!-- 주의사항 1행: 판정 예시 및 설명 -->
  <text x="440" y="265" fill="#1f2933" font-size="13" text-anchor="middle">
    판정이 <tspan fill="#059669" font-weight="bold">O</tspan> <tspan fill="#dc2626" font-weight="bold">X</tspan> <tspan fill="#059669" font-weight="bold">O</tspan> <tspan fill="#dc2626" font-weight="bold">X</tspan> <tspan fill="#059669" font-weight="bold">O</tspan> 처럼 뒤죽박죽이면 이진 탐색은 성립하지 않는다.
  </text>
  
  <!-- 주의사항 2행: 핵심 조언 -->
  <text x="440" y="292" fill="#d97706" font-size="13" font-weight="bold" text-anchor="middle">
    파라메트릭 서치를 쓰기 전에 반드시 이 단조성을 확인해야 한다.
  </text>
</svg>