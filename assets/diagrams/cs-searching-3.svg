<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">판정의 단조성과 답</title>
  <desc id="d">x가 1부터 8까지일 때 판정이 O O O O X X X X처럼 한 번만 바뀌므로 그 경계에서 답 4(조건을 만족하는 최댓값)를 이진 탐색으로 찾을 수 있다. 판정이 O X O X O처럼 뒤죽박죽이면 이진 탐색이 성립하지 않으므로 단조성을 먼저 확인해야 한다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 머리 열 -->
  <g fill="#e5e7eb" stroke="#9ca3af" stroke-width="1">
    <rect x="60" y="58" width="88" height="44"/>
    <rect x="60" y="102" width="88" height="52"/>
  </g>
  <text x="104" y="86" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-style="italic">x</text>
  <text x="104" y="134" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">판정</text>

  <!-- x 값 행 -->
  <g fill="#f9fafb" stroke="#9ca3af" stroke-width="1">
    <rect x="148" y="58" width="84" height="44"/>
    <rect x="232" y="58" width="84" height="44"/>
    <rect x="316" y="58" width="84" height="44"/>
    <rect x="400" y="58" width="84" height="44"/>
    <rect x="484" y="58" width="84" height="44"/>
    <rect x="568" y="58" width="84" height="44"/>
    <rect x="652" y="58" width="84" height="44"/>
    <rect x="736" y="58" width="84" height="44"/>
  </g>
  <g font-size="17" fill="#111827" text-anchor="middle">
    <text x="190" y="86">1</text>
    <text x="274" y="86">2</text>
    <text x="358" y="86">3</text>
    <text x="442" y="86" font-weight="bold">4</text>
    <text x="526" y="86">5</text>
    <text x="610" y="86">6</text>
    <text x="694" y="86">7</text>
    <text x="778" y="86">8</text>
  </g>

  <!-- 판정 행 -->
  <g fill="#d1fae5" stroke="#9ca3af" stroke-width="1">
    <rect x="148" y="102" width="84" height="52"/>
    <rect x="232" y="102" width="84" height="52"/>
    <rect x="316" y="102" width="84" height="52"/>
  </g>
  <g fill="#fee2e2" stroke="#9ca3af" stroke-width="1">
    <rect x="484" y="102" width="84" height="52"/>
    <rect x="568" y="102" width="84" height="52"/>
    <rect x="652" y="102" width="84" height="52"/>
    <rect x="736" y="102" width="84" height="52"/>
  </g>
  <rect x="400" y="102" width="84" height="52" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <text x="190" y="135" fill="#047857">O</text>
    <text x="274" y="135" fill="#047857">O</text>
    <text x="358" y="135" fill="#047857">O</text>
    <text x="442" y="135" fill="#065f46">O</text>
    <text x="526" y="135" fill="#b91c1c">X</text>
    <text x="610" y="135" fill="#b91c1c">X</text>
    <text x="694" y="135" fill="#b91c1c">X</text>
    <text x="778" y="135" fill="#b91c1c">X</text>
  </g>

  <!-- 경계선 -->
  <line x1="484" y1="48" x2="484" y2="166" stroke="#111827" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="484" y="38" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">경계</text>

  <!-- 범례 -->
  <text x="676" y="190" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#047857">O</tspan> = 예</text>
  <text x="746" y="190" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#b91c1c">X</tspan> = 아니오</text>

  <!-- 답 -->
  <line x1="442" y1="194" x2="442" y2="160" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="442" y="216" font-size="17" fill="#1d4ed8" text-anchor="middle"><tspan font-weight="bold">답 = 4</tspan> (조건을 만족하는 최댓값)</text>

  <!-- 주의: 단조성 -->
  <rect x="24" y="250" width="832" height="114" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="48" y="292" font-size="16" fill="#111827">판정이</text>
  <rect x="108" y="270" width="34" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="148" y="270" width="34" height="32" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="188" y="270" width="34" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="228" y="270" width="34" height="32" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="268" y="270" width="34" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="125" y="292" fill="#047857">O</text>
    <text x="165" y="292" fill="#b91c1c">X</text>
    <text x="205" y="292" fill="#047857">O</text>
    <text x="245" y="292" fill="#b91c1c">X</text>
    <text x="285" y="292" fill="#047857">O</text>
  </g>
  <text x="316" y="292" font-size="16" fill="#111827">처럼 뒤죽박죽이면 <tspan font-weight="bold" fill="#b91c1c">이진 탐색은 성립하지 않는다.</tspan></text>
  <text x="48" y="338" font-size="16" font-weight="bold" fill="#92400e">파라메트릭 서치를 쓰기 전에 반드시 이 단조성을 확인해야 한다.</text>
</svg>
