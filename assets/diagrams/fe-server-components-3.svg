<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Next.js 캐싱 계층</title>
  <desc id="d">요청은 브라우저의 Router Cache에서 서버의 Full Route Cache, Request Memoization, Data Cache를 차례로 거쳐 실제 데이터 소스에 닿는다. 계층마다 캐시 대상과 유지 기간이 다르다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 브라우저 구역 -->
  <rect x="24" y="24" width="832" height="92" rx="10" fill="#eff6ff"/>
  <text x="44" y="76" font-size="17" font-weight="bold" fill="#1d4ed8">브라우저</text>

  <rect x="148" y="42" width="692" height="56" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="178" cy="70" r="15" fill="#1d4ed8"/>
  <text x="178" y="75" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="206" y="76" font-size="17" font-weight="bold" fill="#111827">Router Cache</text>
  <text x="470" y="75" font-size="15" fill="#374151">RSC payload, 세션 동안</text>

  <line x1="260" y1="98" x2="260" y2="148" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 서버 구역 -->
  <rect x="24" y="132" width="832" height="296" rx="10" fill="#ecfdf5"/>
  <text x="44" y="188" font-size="17" font-weight="bold" fill="#047857">서버</text>

  <rect x="148" y="154" width="692" height="56" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <circle cx="178" cy="182" r="15" fill="#047857"/>
  <text x="178" y="187" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="206" y="188" font-size="17" font-weight="bold" fill="#111827">Full Route Cache</text>
  <text x="470" y="187" font-size="15" fill="#374151">렌더된 HTML + RSC payload (정적 라우트만)</text>

  <line x1="260" y1="210" x2="260" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="278" y="236" font-size="15" fill="#065f46">미스면 아래로 내려가 렌더링</text>

  <rect x="148" y="256" width="692" height="56" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <circle cx="178" cy="284" r="15" fill="#047857"/>
  <text x="178" y="289" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="206" y="290" font-size="17" font-weight="bold" fill="#111827">Request Memoization</text>
  <text x="470" y="289" font-size="15" fill="#374151">단일 렌더 패스 동안만</text>

  <line x1="260" y1="312" x2="260" y2="338" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="148" y="344" width="692" height="56" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <circle cx="178" cy="372" r="15" fill="#047857"/>
  <text x="178" y="377" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="206" y="378" font-size="17" font-weight="bold" fill="#111827">Data Cache</text>
  <text x="470" y="377" font-size="15" fill="#374151">fetch 응답, 요청·배포를 넘어 지속</text>

  <line x1="260" y1="400" x2="260" y2="450" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 데이터 소스 -->
  <rect x="148" y="456" width="692" height="52" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="178" y="488" font-size="16" font-weight="bold" fill="#111827">실제 데이터 소스 (DB, 외부 API)</text>
</svg>
