<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">B+ Tree 구조와 장점</title>
  <desc id="d">B+ Tree는 B-Tree와 달리 내부 노드에 키만 저장하고, 리프 노드에 키와 데이터, 다음 리프 포인터를 저장한다. 리프가 링크드 리스트로 연결돼 범위 검색이 효율적이고 내부 노드에 키를 더 많이 담아 팬아웃이 커진다. 예로 MySQL InnoDB 인덱스가 B+ Tree다.</desc>
  <rect width="880" height="590" fill="#ffffff"/>

  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 1. B-Tree와의 차이: 구조 -->
  <rect x="24" y="24" width="832" height="340" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="56" font-size="17" font-weight="bold" fill="#111827">B-Tree와의 차이</text>

  <!-- 내부 노드: 키만 -->
  <rect x="376" y="76" width="128" height="40" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="440" y1="76" x2="440" y2="116" stroke="#1d4ed8" stroke-width="1"/>
  <text x="408" y="102" text-anchor="middle" font-size="16" fill="#111827">키</text>
  <text x="472" y="102" text-anchor="middle" font-size="16" fill="#111827">키</text>
  <text x="528" y="102" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#1d4ed8">내부 노드:</tspan> 키만 저장 (데이터 없음)</text>

  <!-- 자식 연결 -->
  <line x1="384" y1="116" x2="178" y2="176" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <line x1="440" y1="116" x2="440" y2="176" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <line x1="496" y1="116" x2="702" y2="176" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gray)"/>

  <!-- 리프 1 -->
  <rect x="80" y="180" width="192" height="80" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <rect x="81" y="220" width="158" height="39" fill="#fef3c7"/>
  <rect x="241" y="181" width="30" height="78" fill="#dbeafe"/>
  <line x1="80" y1="220" x2="240" y2="220" stroke="#374151" stroke-width="1"/>
  <line x1="160" y1="180" x2="160" y2="260" stroke="#374151" stroke-width="1"/>
  <line x1="240" y1="180" x2="240" y2="260" stroke="#374151" stroke-width="1"/>
  <text x="120" y="206" text-anchor="middle" font-size="16" fill="#111827">키</text>
  <text x="200" y="206" text-anchor="middle" font-size="16" fill="#111827">키</text>
  <text x="120" y="246" text-anchor="middle" font-size="15" fill="#92400e">데이터</text>
  <text x="200" y="246" text-anchor="middle" font-size="15" fill="#92400e">데이터</text>
  <circle cx="256" cy="220" r="4.5" fill="#1d4ed8"/>

  <!-- 리프 2 -->
  <rect x="344" y="180" width="192" height="80" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <rect x="345" y="220" width="158" height="39" fill="#fef3c7"/>
  <rect x="505" y="181" width="30" height="78" fill="#dbeafe"/>
  <line x1="344" y1="220" x2="504" y2="220" stroke="#374151" stroke-width="1"/>
  <line x1="424" y1="180" x2="424" y2="260" stroke="#374151" stroke-width="1"/>
  <line x1="504" y1="180" x2="504" y2="260" stroke="#374151" stroke-width="1"/>
  <text x="384" y="206" text-anchor="middle" font-size="16" fill="#111827">키</text>
  <text x="464" y="206" text-anchor="middle" font-size="16" fill="#111827">키</text>
  <text x="384" y="246" text-anchor="middle" font-size="15" fill="#92400e">데이터</text>
  <text x="464" y="246" text-anchor="middle" font-size="15" fill="#92400e">데이터</text>
  <circle cx="520" cy="220" r="4.5" fill="#1d4ed8"/>

  <!-- 리프 3 -->
  <rect x="608" y="180" width="192" height="80" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <rect x="609" y="220" width="158" height="39" fill="#fef3c7"/>
  <rect x="769" y="181" width="30" height="78" fill="#dbeafe"/>
  <line x1="608" y1="220" x2="768" y2="220" stroke="#374151" stroke-width="1"/>
  <line x1="688" y1="180" x2="688" y2="260" stroke="#374151" stroke-width="1"/>
  <line x1="768" y1="180" x2="768" y2="260" stroke="#374151" stroke-width="1"/>
  <text x="648" y="206" text-anchor="middle" font-size="16" fill="#111827">키</text>
  <text x="728" y="206" text-anchor="middle" font-size="16" fill="#111827">키</text>
  <text x="648" y="246" text-anchor="middle" font-size="15" fill="#92400e">데이터</text>
  <text x="728" y="246" text-anchor="middle" font-size="15" fill="#92400e">데이터</text>
  <line x1="772" y1="254" x2="796" y2="186" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 다음 리프 포인터 -->
  <line x1="256" y1="220" x2="340" y2="220" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>
  <line x1="520" y1="220" x2="604" y2="220" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>

  <text x="440" y="292" text-anchor="middle" font-size="16" fill="#111827"><tspan font-weight="bold">리프 노드:</tspan> 키 + <tspan font-weight="bold" fill="#92400e">데이터</tspan> 저장 + <tspan font-weight="bold" fill="#1d4ed8">다음 리프 포인터</tspan></text>

  <!-- 범위 검색 -->
  <line x1="80" y1="314" x2="796" y2="314" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-blue)"/>
  <text x="440" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">① 범위 검색: 리프를 따라 순차 스캔</text>

  <!-- 2. 장점 -->
  <rect x="24" y="384" width="832" height="108" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="48" y="414" font-size="17" font-weight="bold" fill="#047857">장점</text>
  <text x="48" y="446" font-size="16" fill="#111827">① 범위 검색 효율적 (리프 노드 링크드 리스트로 연결)</text>
  <text x="48" y="474" font-size="16" fill="#111827">② 내부 노드에 더 많은 키 저장 → 팬아웃 증가</text>

  <!-- 3. 예 -->
  <rect x="24" y="512" width="832" height="54" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="48" y="545" font-size="17" fill="#111827"><tspan font-weight="bold" fill="#b45309">예:</tspan> MySQL InnoDB 인덱스 = <tspan font-weight="bold">B+ Tree</tspan></text>
</svg>
