<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">B+ Tree (B-Tree의 변형 - 실제 DB에서 주로 사용)</title>
  <desc id="d">B-Tree와의 차이점, 장점, 그리고 MySQL InnoDB 인덱스와 같은 적용 예시를 설명하는 B+ Tree 사양 전사 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 제목 헤딩 -->
  <rect x="24" y="24" width="832" height="44" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="44" y="51" font-size="16" font-weight="bold" fill="#1f2933">B+ Tree (B-Tree의 변형 - 실제 DB에서 주로 사용)</text>

  <!-- 메인 구역 패널 -->
  <!-- 1. B-Tree 와의 차이 -->
  <g transform="translate(24, 88)">
    <rect x="0" y="0" width="832" height="124" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="832" height="34" rx="8" fill="#2563eb"/>
    <!-- fill overlay for bottom rounded corner fix -->
    <rect x="0" y="26" width="832" height="8" fill="#2563eb"/>
    <text x="16" y="22" font-size="14" font-weight="bold" fill="#ffffff">B-Tree 와의 차이:</text>

    <text x="32" y="58" font-size="13" fill="#1f2933">- 내부 노드: 키만 저장 (데이터 없음)</text>
    <text x="32" y="82" font-size="13" fill="#1f2933">- 리프 노드: 키 + 데이터 저장 + 다음 리프 포인터</text>
  </g>

  <!-- 2. 장점 -->
  <g transform="translate(24, 232)">
    <rect x="0" y="0" width="832" height="124" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="832" height="34" rx="8" fill="#059669"/>
    <rect x="0" y="26" width="832" height="8" fill="#059669"/>
    <text x="16" y="22" font-size="14" font-weight="bold" fill="#ffffff">장점:</text>

    <text x="32" y="58" font-size="13" fill="#1f2933">- 범위 검색 효율적 (리프 노드 링크드 리스트로 연결)</text>
    <text x="32" y="82" font-size="13" fill="#1f2933">- 내부 노드에 더 많은 키 저장 → 팬아웃 증가</text>
  </g>

  <!-- 3. 예 -->
  <g transform="translate(24, 376)">
    <rect x="0" y="0" width="832" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="24" y="42" font-size="14" font-weight="bold" fill="#d97706">예: MySQL InnoDB 인덱스 = B+ Tree</text>
  </g>

  <!-- 푸터 안내 / 장식선 -->
  <line x1="24" y1="480" x2="856" y2="480" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="440" y="502" font-size="11.5" fill="#52606d" text-anchor="middle">Data Structure Q&amp;A - B+ Tree Specification Diagram</text>
</svg>