<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sidecar 패턴</title>
  <desc id="d">하나의 Pod 안에 App Container와 Sidecar Container가 함께 들어 있고, 두 컨테이너는 localhost로 통신하며 네트워크와 볼륨을 공유한다. 예로 앱 컨테이너와 로그 수집 컨테이너를 든다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>

  <!-- Pod -->
  <rect x="40" y="24" width="800" height="278" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="68" y="60" font-size="20" font-weight="bold" fill="#1f2937">Pod</text>

  <!-- App Container -->
  <rect x="90" y="84" width="280" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="124" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">App Container</text>
  <text x="230" y="154" font-size="15" fill="#374151" text-anchor="middle">예: 앱 컨테이너</text>

  <!-- 컨테이너 간 연결 -->
  <line x1="370" y1="140" x2="510" y2="140" stroke="#475569" stroke-width="2"/>
  <text x="440" y="128" font-size="14" fill="#374151" text-anchor="middle">localhost</text>

  <!-- Sidecar Container -->
  <rect x="510" y="84" width="280" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="124" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">Sidecar Container</text>
  <text x="650" y="154" font-size="15" fill="#374151" text-anchor="middle">예: 로그 수집 컨테이너</text>

  <!-- 공유 자원 연결 -->
  <line x1="230" y1="180" x2="230" y2="218" stroke="#475569" stroke-width="2"/>
  <line x1="650" y1="180" x2="650" y2="218" stroke="#475569" stroke-width="2"/>

  <!-- 공유 네트워크/볼륨 -->
  <rect x="90" y="218" width="700" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="440" y="252" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">공유 네트워크/볼륨</text>
</svg>
