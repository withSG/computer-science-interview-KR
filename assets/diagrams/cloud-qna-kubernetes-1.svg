<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sidecar 패턴</title>
  <desc id="d">Kubernetes Pod 내의 App Container와 Sidecar Container가 네트워크와 볼륨을 공유하는 Sidecar 패턴 구조 다이어그램</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- Pod Outer Box -->
  <rect x="180" y="40" width="520" height="205" rx="12" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="440" y="68" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Pod</text>

  <!-- App Container -->
  <rect x="220" y="88" width="170" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="305" y="123" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">App</text>
  <text x="305" y="145" font-size="13" fill="#52606d" text-anchor="middle">Container</text>

  <!-- Connection Line -->
  <path d="M390,128 L490,128" stroke="#52606d" stroke-width="2" fill="none"/>

  <!-- Sidecar Container -->
  <rect x="490" y="88" width="170" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="575" y="123" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Sidecar</text>
  <text x="575" y="145" font-size="13" fill="#52606d" text-anchor="middle">Container</text>

  <!-- Shared Network/Volume Zone -->
  <rect x="220" y="183" width="440" height="42" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="209" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">공유 네트워크/볼륨</text>

  <!-- Footnote outside Pod -->
  <text x="440" y="274" font-size="12.5" fill="#52606d" text-anchor="middle">예: 앱 컨테이너 + 로그 수집 컨테이너</text>
</svg>