<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1. 왜 필요한가 — 되돌릴 수 있어야 하는 것과, 되돌리면 안 되는 것</title>
  <desc id="d">양방향 암호화와 단방향 해싱의 흐름 및 특징을 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- [ 암호화 — 양방향 ] 영역 -->
  <rect x="24" y="20" width="404" height="280" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="44" y="49" font-size="16" font-weight="bold" fill="#2563eb">[ 암호화 — 양방향 ]</text>

  <!-- 암호화 흐름 요소 -->
  <!-- 평문 -->
  <rect x="44" y="70" width="70" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="79" y="93" font-size="13" text-anchor="middle" fill="#1f2933">평문</text>

  <!-- 평문 -> 암호문 화살표 (암호화(키)) -->
  <path d="M 114 88 L 290 88" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="157" y="74" width="90" height="20" fill="#ffffff" rx="2"/>
  <text x="202" y="89" font-size="13" text-anchor="middle" fill="#2563eb">암호화(키)</text>

  <!-- 암호문 -->
  <rect x="290" y="70" width="80" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="330" y="93" font-size="13" text-anchor="middle" fill="#1f2933">암호문</text>

  <!-- 복호화 화살표: 암호문 -> 평문 -->
  <path d="M 330 106 L 330 140 L 79 140 L 79 113" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="157" y="130" width="90" height="20" fill="#ffffff" rx="2"/>
  <text x="202" y="145" font-size="13" text-anchor="middle" fill="#2563eb">복호화(키)</text>

  <!-- 암호화 설명 텍스트 -->
  <text x="44" y="200" font-size="13" fill="#1f2933">키를 가진 사람은 원본을 되찾는다.</text>
  <text x="44" y="222" font-size="13" fill="#1f2933">그것이 목적이다.</text>


  <!-- [ 해싱 — 단방향 ] 영역 -->
  <rect x="452" y="20" width="404" height="280" rx="8" fill="#ecfdf5" stroke="#cbd2d9" stroke-width="1"/>
  <text x="472" y="49" font-size="16" font-weight="bold" fill="#059669">[ 해싱 — 단방향 ]</text>

  <!-- 해싱 흐름 요소 -->
  <!-- 입력 -->
  <rect x="472" y="70" width="70" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="507" y="93" font-size="13" text-anchor="middle" fill="#1f2933">입력</text>

  <!-- 입력 -> 해시값 화살표 (해시) -->
  <path d="M 542 88 L 650 88" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="568" y="74" width="56" height="20" fill="#ffffff" rx="2"/>
  <text x="596" y="89" font-size="13" text-anchor="middle" fill="#059669">해시</text>

  <!-- 해시값 (고정 길이) -->
  <rect x="650" y="70" width="160" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="730" y="93" font-size="13" text-anchor="middle" fill="#1f2933">해시값 (고정 길이)</text>

  <!-- X 되돌아오는 화살표가 없다 -->
  <text x="730" y="140" font-size="13" text-anchor="middle" font-weight="bold" fill="#dc2626">X 되돌아오는 화살표가 없다</text>

  <!-- 해싱 설명 텍스트 -->
  <text x="472" y="200" font-size="13" fill="#1f2933">키가 없고, 되돌리는 연산 자체가</text>
  <text x="472" y="222" font-size="13" fill="#1f2933">정의되지 않는다.</text>

</svg>