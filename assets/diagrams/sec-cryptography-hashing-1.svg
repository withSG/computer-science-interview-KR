<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">암호화와 해싱의 방향 차이</title>
  <desc id="d">암호화는 평문을 키로 암호문으로 바꾸고 같은 키로 복호화해 원본을 되찾는 양방향 흐름이다. 해싱은 입력을 고정 길이 해시값으로 바꾸기만 하고 되돌아오는 화살표가 없는 단방향 흐름이다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 암호화: 양방향 -->
  <rect x="24" y="24" width="404" height="292" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="48" y="62" font-size="20" font-weight="bold" fill="#1d4ed8">암호화 — 양방향</text>

  <rect x="56" y="112" width="100" height="56" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="106" y="146" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">평문</text>

  <rect x="296" y="112" width="108" height="56" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="350" y="146" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">암호문</text>

  <path d="M158,140 H292" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <text x="226" y="126" font-size="16" text-anchor="middle" fill="#1d4ed8">암호화(키)</text>

  <path d="M350,170 V206 H106 V172" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <text x="228" y="232" font-size="16" text-anchor="middle" fill="#1d4ed8">복호화(키)</text>

  <text x="48" y="274" font-size="16" fill="#1f2937">키를 가진 사람은 원본을 되찾는다.</text>
  <text x="48" y="298" font-size="16" fill="#1f2937">그것이 목적이다.</text>

  <!-- 해싱: 단방향 -->
  <rect x="452" y="24" width="404" height="292" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="476" y="62" font-size="20" font-weight="bold" fill="#047857">해싱 — 단방향</text>

  <rect x="484" y="112" width="100" height="56" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="534" y="146" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">입력</text>

  <rect x="700" y="112" width="132" height="56" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="766" y="136" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">해시값</text>
  <text x="766" y="158" font-size="14" text-anchor="middle" fill="#374151">(고정 길이)</text>

  <path d="M586,140 H696" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <text x="641" y="126" font-size="16" text-anchor="middle" fill="#047857">해시</text>

  <path d="M766,170 V206 H534 V174" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M638,194 L662,218 M662,194 L638,218" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <text x="650" y="244" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">되돌아오는 화살표가 없다</text>

  <text x="476" y="274" font-size="16" fill="#1f2937">키가 없고, 되돌리는 연산 자체가</text>
  <text x="476" y="298" font-size="16" fill="#1f2937">정의되지 않는다.</text>
</svg>
