<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cache-Aside (Lazy Loading)</title>
  <desc id="d">Cache-Aside 패턴의 동작 순서를 나타낸 다이어그램. Application, Cache, Database 간의 데이터 흐름과 1~6단계 번호가 표시되어 있습니다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title / Section Header -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">Cache-Aside (Lazy Loading)</text>

  <!-- Application Box -->
  <rect x="60" y="100" width="180" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="155" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Application</text>

  <!-- Cache Box -->
  <rect x="640" y="100" width="180" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="730" y="155" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Cache</text>

  <!-- Database Box -->
  <rect x="60" y="340" width="180" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="395" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Database</text>

  <!-- Flow 1: Application -> Cache (GET user:42) -->
  <path d="M 240,125 L 640,125" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="375" y="108" width="130" height="22" fill="#ffffff"/>
  <text x="440" y="123" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">1. GET user:42</text>

  <!-- Flow 2: Cache -> Application (miss (null)) -->
  <path d="M 640,175 L 240,175" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="370" y="158" width="140" height="22" fill="#ffffff"/>
  <text x="440" y="173" font-size="13" fill="#d97706" font-weight="bold" text-anchor="middle">2. miss (null)</text>

  <!-- Flow 3: Application -> Database (SELECT ... WHERE id=42) -->
  <path d="M 150,200 L 150,340" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="158" y="258" width="230" height="22" fill="#ffffff"/>
  <text x="165" y="273" font-size="13" fill="#7c3aed" font-weight="bold" text-anchor="start">3. SELECT ... WHERE id=42</text>

  <!-- Flow 4 & 5: Database -> Cache (4. row / 5. SET user:42 (TTL 10m)) -->
  <path d="M 240,390 L 730,390 L 730,200" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-green)"/>

  <rect x="340" y="378" width="60" height="22" fill="#ffffff"/>
  <text x="370" y="393" font-size="13" fill="#059669" font-weight="bold" text-anchor="middle">4. row</text>

  <rect x="525" y="288" width="200" height="22" fill="#ffffff"/>
  <text x="722" y="303" font-size="13" fill="#059669" font-weight="bold" text-anchor="end">5. SET user:42 (TTL 10m)</text>

  <!-- Flow 6: Response Return (6. 응답 반환) -->
  <rect x="370" y="428" width="100" height="22" fill="#ffffff"/>
  <text x="420" y="443" font-size="13" fill="#52606d" font-weight="bold" text-anchor="middle">6. 응답 반환</text>
</svg>