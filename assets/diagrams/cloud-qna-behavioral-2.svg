<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MSA 전환 Action 흐름</title>
  <desc id="d">처음 3개월에 8개 서비스로 분리 설계하고 개발을 시작했지만, 의존성 복잡도 과소평가 등 문제가 발생해 서비스 수를 8개에서 4개로 줄이는 등 대응을 시도한 3단계 흐름입니다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 1. 처음 3개월 -->
  <rect x="24" y="24" width="248" height="264" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="24" y="24" width="248" height="48" rx="8" fill="#1d4ed8"/>
  <rect x="24" y="60" width="248" height="12" fill="#1d4ed8"/>
  <text x="148" y="54" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 처음 3개월</text>
  <rect x="36" y="88" width="224" height="68" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="50" y="116" font-size="16" fill="#1f2937">도메인 분석 후</text>
  <text x="50" y="139" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#1d4ed8">8개</tspan> 서비스로 분리 설계</text>
  <rect x="36" y="168" width="224" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="50" y="197" font-size="16" fill="#1f2937">각 서비스 개발 시작</text>

  <line x1="278" y1="156" x2="310" y2="156" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2. 문제 발생 -->
  <rect x="316" y="24" width="248" height="264" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="316" y="24" width="248" height="48" rx="8" fill="#b91c1c"/>
  <rect x="316" y="60" width="248" height="12" fill="#b91c1c"/>
  <text x="440" y="54" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 문제 발생</text>
  <rect x="328" y="88" width="224" height="68" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="342" y="116" font-size="16" fill="#1f2937">서비스 간 의존성</text>
  <text x="342" y="139" font-size="16" fill="#1f2937">복잡도 과소평가</text>
  <rect x="328" y="168" width="224" height="46" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="342" y="197" font-size="16" fill="#1f2937">통합 테스트 환경 부재</text>
  <rect x="328" y="226" width="224" height="46" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="342" y="255" font-size="16" fill="#1f2937">팀원들의 MSA 경험 부족</text>

  <line x1="570" y1="156" x2="602" y2="156" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3. 대응 시도 -->
  <rect x="608" y="24" width="248" height="264" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <rect x="608" y="24" width="248" height="48" rx="8" fill="#b45309"/>
  <rect x="608" y="60" width="248" height="12" fill="#b45309"/>
  <text x="732" y="54" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 대응 시도</text>
  <rect x="620" y="88" width="224" height="68" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="634" y="116" font-size="16" fill="#1f2937">서비스 수 축소</text>
  <text x="634" y="139" font-size="16" font-weight="bold" fill="#b45309">(8개 → 4개)</text>
  <rect x="620" y="168" width="224" height="46" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="634" y="197" font-size="16" fill="#1f2937">스터디 세션 진행</text>
  <rect x="620" y="226" width="224" height="46" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="634" y="255" font-size="16" fill="#1f2937">일정 재협상 시도</text>
</svg>
