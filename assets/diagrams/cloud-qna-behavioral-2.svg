<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">STAR 답변 구조 - Action (행동)</title>
  <desc id="d">실패했던 프로젝트 경험에서 Action 단계의 시간 경과 및 단계별 대응 상황을 보여주는 다이어그램입니다.</desc>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 카드리스트 / 과정 흐름 영역 -->
  <!-- Step 1: 처음 3개월 (초기 진행) -->
  <rect x="24" y="24" width="256" height="320" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="24" y="24" width="256" height="48" rx="8" fill="#2563eb"/>
  <!-- 상단 모서리 커버용 rect -->
  <rect x="24" y="64" width="256" height="8" fill="#2563eb"/>
  <text x="152" y="53.6" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1. 처음 3개월</text>

  <text x="40" y="103.55" font-size="13" fill="#1f2933" text-anchor="start">- 도메인 분석 후 8개 서비스로</text>
  <text x="52" y="127.55" font-size="13" fill="#1f2933" text-anchor="start">분리 설계</text>
  <text x="40" y="159.55" font-size="13" fill="#1f2933" text-anchor="start">- 각 서비스 개발 시작</text>

  <!-- Step 1 -> Step 2 연결 화살표 -->
  <path d="M280,184 L312,184" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2: 문제 발생 (경고/위험) -->
  <rect x="312" y="24" width="256" height="320" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="312" y="24" width="256" height="48" rx="8" fill="#dc2626"/>
  <rect x="312" y="64" width="256" height="8" fill="#dc2626"/>
  <text x="440" y="53.6" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2. 문제 발생</text>

  <text x="328" y="103.55" font-size="13" fill="#1f2933" text-anchor="start">- 서비스 간 의존성 복잡도</text>
  <text x="340" y="127.55" font-size="13" fill="#1f2933" text-anchor="start">과소평가</text>
  <text x="328" y="159.55" font-size="13" fill="#1f2933" text-anchor="start">- 통합 테스트 환경 부재</text>
  <text x="328" y="191.55" font-size="13" fill="#1f2933" text-anchor="start">- 팀원들의 MSA 경험 부족</text>

  <!-- Step 2 -> Step 3 연결 화살표 -->
  <path d="M568,184 L600,184" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a-amber)"/>

  <!-- Step 3: 대응 시도 (개선/조율) -->
  <rect x="600" y="24" width="256" height="320" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="600" y="24" width="256" height="48" rx="8" fill="#d97706"/>
  <rect x="600" y="64" width="256" height="8" fill="#d97706"/>
  <text x="728" y="53.6" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">3. 대응 시도</text>

  <text x="616" y="103.55" font-size="13" fill="#1f2933" text-anchor="start">- 서비스 수 축소</text>
  <text x="628" y="127.55" font-size="13" fill="#1f2933" text-anchor="start">(8개 → 4개)</text>
  <text x="616" y="159.55" font-size="13" fill="#1f2933" text-anchor="start">- 스터디 세션 진행</text>
  <text x="616" y="191.55" font-size="13" fill="#1f2933" text-anchor="start">- 일정 재협상 시도</text>

  <!-- 하단 수평 시간선 안내 바 (원작 의미 시각적 보완) -->
  <line x1="24" y1="365" x2="856" y2="365" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
</svg>