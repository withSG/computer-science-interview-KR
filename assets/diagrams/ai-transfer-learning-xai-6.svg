<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SHAP 인과 오독 사례</title>
  <desc id="d">SHAP에서 앱 접속 빈도의 기여가 크다는 결과를 인과로 읽고 푸시 알림을 보냈지만 이탈률은 그대로였다. 접속 감소는 이탈의 원인이 아니라 증상일 수 있기 때문이며, 개선책은 설명을 가설로만 쓰고 A/B 테스트나 가정을 명시한 인과추론으로 효과를 확인하는 것이다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 1. 안티패턴 -->
  <rect x="24" y="24" width="832" height="180" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="44" y="54" font-size="18" font-weight="bold" fill="#b91c1c">안티패턴</text>

  <rect x="40" y="72" width="240" height="112" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="160" y="110" font-size="16" fill="#111827" text-anchor="middle">SHAP 결과에서</text>
  <text x="160" y="134" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">'앱 접속 빈도'</tspan>의 기여가</text>
  <text x="160" y="158" font-size="16" fill="#111827" text-anchor="middle">크게 나왔다</text>

  <line x1="286" y1="128" x2="314" y2="128" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="320" y="72" width="240" height="112" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="440" y="110" font-size="16" fill="#111827" text-anchor="middle">"접속을 늘리는 캠페인을</text>
  <text x="440" y="134" font-size="16" fill="#111827" text-anchor="middle">하면 이탈이 줄겠다"고</text>
  <text x="440" y="158" font-size="16" fill="#111827" text-anchor="middle">결론</text>

  <line x1="566" y1="128" x2="594" y2="128" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="600" y="72" width="240" height="112" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="720" y="110" font-size="16" fill="#111827" text-anchor="middle">푸시 알림을 대량 발송</text>
  <text x="720" y="134" font-size="16" fill="#111827" text-anchor="middle">접속 수는 늘었지만</text>
  <text x="720" y="158" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">이탈률은 그대로</text>

  <!-- 2. 왜 문제인가 -->
  <rect x="24" y="224" width="832" height="140" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="44" y="254" font-size="18" font-weight="bold" fill="#b45309">왜 문제인가</text>
  <rect x="158" y="236" width="104" height="26" rx="13" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="210" y="254" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">상관 ≠ 인과</text>
  <text x="44" y="290" font-size="16" fill="#111827">모델이 학습한 것은 "이탈할 사람은 접속을 안 한다"는 <tspan font-weight="bold" fill="#92400e">상관</tspan>이다.</text>
  <text x="44" y="318" font-size="16" fill="#111827">접속 감소는 이탈의 <tspan font-weight="bold" fill="#92400e">원인이 아니라 증상(선행 지표)</tspan>일 수 있다.</text>
  <text x="44" y="346" font-size="16" font-weight="bold" fill="#111827">증상을 인위적으로 없앤다고 원인이 사라지지 않는다.</text>

  <!-- 3. 개선 -->
  <rect x="24" y="384" width="832" height="192" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="44" y="414" font-size="18" font-weight="bold" fill="#047857">개선</text>

  <rect x="40" y="432" width="240" height="128" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <circle cx="160" cy="458" r="14" fill="#047857"/>
  <text x="160" y="464" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="160" y="498" font-size="16" fill="#111827" text-anchor="middle">설명은 <tspan font-weight="bold" fill="#047857">'가설 생성'</tspan>까지만</text>
  <text x="160" y="522" font-size="16" fill="#111827" text-anchor="middle">쓴다. 결론이 아니라</text>
  <text x="160" y="546" font-size="16" fill="#111827" text-anchor="middle">실험 후보 목록이다</text>

  <rect x="320" y="432" width="240" height="128" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <circle cx="440" cy="458" r="14" fill="#047857"/>
  <text x="440" y="464" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="440" y="498" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#047857">A/B 테스트</tspan>로</text>
  <text x="440" y="522" font-size="16" fill="#111827" text-anchor="middle">개입 효과를</text>
  <text x="440" y="546" font-size="16" fill="#111827" text-anchor="middle">실제로 측정한다</text>

  <rect x="600" y="432" width="240" height="128" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <circle cx="720" cy="458" r="14" fill="#047857"/>
  <text x="720" y="464" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="720" y="498" font-size="16" fill="#111827" text-anchor="middle">실험이 불가능하면</text>
  <text x="720" y="522" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#047857">인과추론 기법</tspan>을 쓰되,</text>
  <text x="720" y="546" font-size="16" fill="#111827" text-anchor="middle">가정이 무엇인지 명시한다</text>
</svg>
