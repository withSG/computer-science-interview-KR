<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">면접 답변 구조화</title>
  <desc id="d">결론, 근거, 사례, 확장으로 이어지는 4단계 면접 답변 구조 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Step 1: 결론 -->
  <g id="step1">
    <rect x="50" y="40" width="130" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="70" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[1] 결론</text>
    <text x="210" y="70" font-size="13" font-weight="bold" fill="#1f2933">한 문장. "A는 B입니다" / "저는 C를 선택했습니다"</text>
    <text x="730" y="70" font-size="11.5" fill="#52606d">(5~10초)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M115,90 L115,130" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <text x="115" y="115" font-size="13" fill="#1f2933" text-anchor="middle">↓</text>

  <!-- Step 2: 근거 -->
  <g id="step2">
    <rect x="50" y="140" width="130" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="115" y="170" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[2] 근거</text>
    <text x="210" y="170" font-size="13" fill="#1f2933">왜 그런가. 원리·이유 1~2개</text>
    <text x="730" y="170" font-size="11.5" fill="#52606d">(15~30초)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M115,190 L115,230" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <text x="115" y="215" font-size="13" fill="#1f2933" text-anchor="middle">↓</text>

  <!-- Step 3: 사례 -->
  <g id="step3">
    <rect x="50" y="240" width="130" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="115" y="270" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[3] 사례</text>
    <text x="210" y="270" font-size="13" fill="#1f2933">내가 겪은 것 또는 구체적 상황</text>
    <text x="730" y="270" font-size="11.5" fill="#52606d">(15~30초)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M115,290 L115,330" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <text x="115" y="315" font-size="13" fill="#1f2933" text-anchor="middle">↓</text>

  <!-- Step 4: 확장 -->
  <g id="step4">
    <rect x="50" y="340" width="130" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="115" y="370" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">[4] 확장</text>
    <text x="210" y="370" font-size="13" fill="#1f2933">"더 들어가면 D도 있습니다" — 꼬리 질문 미끼</text>
    <text x="730" y="370" font-size="11.5" fill="#52606d">(5초, 선택)</text>
  </g>
</svg>