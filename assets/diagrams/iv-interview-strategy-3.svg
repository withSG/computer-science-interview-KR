<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">결론 먼저 답변 구조</title>
  <desc id="d">면접 답변을 결론, 근거, 사례, 확장 네 단계 순서로 말하고, 단계별 권장 시간(5~10초, 15~30초, 15~30초, 선택 5초)을 더하면 40초에서 1분 15초 남짓이 된다는 것을 보여 주는 그림입니다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. 결론 -->
  <rect x="24" y="24" width="832" height="64" rx="8" fill="#ffffff"/>
  <path d="M32,24 H174 V88 H32 A8,8 0 0 1 24,80 V32 A8,8 0 0 1 32,24 Z" fill="#1d4ed8"/>
  <rect x="24" y="24" width="832" height="64" rx="8" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="54" cy="56" r="15" fill="#ffffff"/>
  <text x="54" y="62" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1</text>
  <text x="80" y="63" font-size="19" font-weight="bold" fill="#ffffff">결론</text>
  <text x="198" y="52" font-size="17" font-weight="bold" fill="#111827">한 문장</text>
  <text x="198" y="76" font-size="15" fill="#374151">"A는 B입니다" / "저는 C를 선택했습니다"</text>
  <rect x="724" y="38" width="116" height="36" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="782" y="62" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">5~10초</text>

  <line x1="99" y1="92" x2="99" y2="114" stroke="#374151" stroke-width="2" marker-end="url(#dn)"/>

  <!-- 2. 근거 -->
  <rect x="24" y="120" width="832" height="64" rx="8" fill="#ffffff"/>
  <path d="M32,120 H174 V184 H32 A8,8 0 0 1 24,176 V128 A8,8 0 0 1 32,120 Z" fill="#f3f4f6"/>
  <rect x="24" y="120" width="832" height="64" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="54" cy="152" r="15" fill="#374151"/>
  <text x="54" y="158" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="80" y="159" font-size="19" font-weight="bold" fill="#111827">근거</text>
  <text x="198" y="148" font-size="17" font-weight="bold" fill="#111827">왜 그런가</text>
  <text x="198" y="172" font-size="15" fill="#374151">원리·이유 1~2개</text>
  <rect x="724" y="134" width="116" height="36" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="782" y="158" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">15~30초</text>

  <line x1="99" y1="188" x2="99" y2="210" stroke="#374151" stroke-width="2" marker-end="url(#dn)"/>

  <!-- 3. 사례 -->
  <rect x="24" y="216" width="832" height="64" rx="8" fill="#ffffff"/>
  <path d="M32,216 H174 V280 H32 A8,8 0 0 1 24,272 V224 A8,8 0 0 1 32,216 Z" fill="#f3f4f6"/>
  <rect x="24" y="216" width="832" height="64" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="54" cy="248" r="15" fill="#374151"/>
  <text x="54" y="254" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="80" y="255" font-size="19" font-weight="bold" fill="#111827">사례</text>
  <text x="198" y="254" font-size="17" font-weight="bold" fill="#111827">내가 겪은 것 또는 구체적 상황</text>
  <rect x="724" y="230" width="116" height="36" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="782" y="254" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">15~30초</text>

  <line x1="99" y1="284" x2="99" y2="306" stroke="#374151" stroke-width="2" marker-end="url(#dn)"/>

  <!-- 4. 확장 (선택) -->
  <rect x="24" y="312" width="832" height="64" rx="8" fill="#ffffff"/>
  <path d="M32,312 H174 V376 H32 A8,8 0 0 1 24,368 V320 A8,8 0 0 1 32,312 Z" fill="#f5f3ff"/>
  <rect x="24" y="312" width="832" height="64" rx="8" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="54" cy="344" r="15" fill="#6d28d9"/>
  <text x="54" y="350" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="80" y="351" font-size="19" font-weight="bold" fill="#6d28d9">확장</text>
  <text x="198" y="340" font-size="17" font-weight="bold" fill="#111827">"더 들어가면 D도 있습니다"</text>
  <text x="198" y="364" font-size="15" fill="#374151">꼬리 질문 미끼</text>
  <rect x="724" y="326" width="116" height="36" rx="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="782" y="350" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">5초, 선택</text>

  <!-- 합계 -->
  <line x1="24" y1="398" x2="856" y2="398" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="840" y="428" font-size="17" font-weight="bold" fill="#111827" text-anchor="end">합계 40초 ~ 1분 15초 남짓</text>
</svg>
