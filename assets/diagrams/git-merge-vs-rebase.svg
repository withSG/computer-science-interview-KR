<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">같은 분기, 다른 결과</title>
  <desc id="d">c2에서 갈라진 같은 상태에서 git merge는 두 부모를 가진 병합 커밋 M을 만들어 분기와 합류를 남기고, git rebase는 c3, c4를 c6 위의 새 커밋 c3', c4'로 옮겨 직선 히스토리를 만들며 옛 c3, c4는 참조를 잃는다.</desc>
  <rect width="880" height="680" fill="#ffffff"/>

  <!-- ── 공통 초기 상태 -->
  <rect x="24" y="20" width="516" height="180" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="52" font-size="17" font-weight="bold" fill="#111827">공통 초기 상태 (merge base: c2)</text>

  <line x1="90" y1="100" x2="116" y2="100" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="156" y1="100" x2="182" y2="100" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="222" y1="100" x2="248" y2="100" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="151.2" y1="112.9" x2="186.8" y2="143.1" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="222" y1="156" x2="248" y2="156" stroke="#1d4ed8" stroke-width="2.5"/>

  <circle cx="70" cy="100" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="70" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="136" cy="100" r="20" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="136" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">c2</text>
  <circle cx="202" cy="100" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="202" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c5</text>
  <circle cx="268" cy="100" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="268" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c6</text>
  <circle cx="202" cy="156" r="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="202" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c3</text>
  <circle cx="268" cy="156" r="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="268" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c4</text>

  <line x1="288" y1="100" x2="300" y2="100" stroke="#1f2937" stroke-width="2"/>
  <rect x="300" y="87" width="64" height="26" rx="13" fill="#1f2937"/>
  <text x="332" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">main</text>
  <line x1="288" y1="156" x2="300" y2="156" stroke="#1f2937" stroke-width="2"/>
  <rect x="300" y="143" width="86" height="26" rx="13" fill="#1f2937"/>
  <text x="343" y="161" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">feature</text>

  <!-- 범례 -->
  <rect x="556" y="20" width="300" height="180" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="584" cy="55" r="9" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="604" y="60" font-size="15" fill="#1f2937">merge base (공통 조상)</text>
  <circle cx="584" cy="85" r="9" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="604" y="90" font-size="15" fill="#1f2937">병합 커밋 (M)</text>
  <circle cx="584" cy="115" r="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="604" y="120" font-size="15" fill="#1f2937">기존 브랜치 커밋</text>
  <circle cx="584" cy="145" r="9" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="604" y="150" font-size="15" fill="#1f2937">rebase된 새 커밋</text>
  <circle cx="584" cy="175" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="604" y="180" font-size="15" fill="#1f2937">참조 잃은 커밋</text>

  <!-- ── git merge -->
  <rect x="24" y="216" width="832" height="170" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="248" font-size="17" font-weight="bold" fill="#111827">git merge (3-way merge)</text>

  <line x1="90" y1="296" x2="116" y2="296" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="156" y1="296" x2="182" y2="296" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="222" y1="296" x2="248" y2="296" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="151.2" y1="308.9" x2="186.8" y2="339.1" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="222" y1="352" x2="248" y2="352" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="288" y1="296" x2="312" y2="296" stroke="#047857" stroke-width="3.5"/>
  <line x1="283.2" y1="339.1" x2="317.2" y2="310.2" stroke="#047857" stroke-width="3.5"/>

  <circle cx="70" cy="296" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="70" y="302" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="136" cy="296" r="20" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="136" y="302" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">c2</text>
  <circle cx="202" cy="296" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="202" y="302" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c5</text>
  <circle cx="268" cy="296" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="268" y="302" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c6</text>
  <circle cx="202" cy="352" r="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="202" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c3</text>
  <circle cx="268" cy="352" r="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="268" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">c4</text>
  <circle cx="334" cy="296" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="334" y="302" text-anchor="middle" font-size="17" font-weight="bold" fill="#047857">M</text>

  <line x1="356" y1="296" x2="370" y2="296" stroke="#1f2937" stroke-width="2"/>
  <rect x="370" y="283" width="64" height="26" rx="13" fill="#1f2937"/>
  <text x="402" y="301" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">main</text>

  <text x="576" y="296" font-size="15" fill="#1f2937">• 분기/합류 기록 보존</text>
  <text x="576" y="324" font-size="15" fill="#1f2937">• 기존 커밋 해시 유지</text>
  <text x="576" y="352" font-size="15" fill="#1f2937">• 두 부모를 가지는 병합 커밋(M) 생성</text>

  <!-- ── git rebase -->
  <rect x="24" y="402" width="832" height="200" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="434" font-size="17" font-weight="bold" fill="#111827">git rebase</text>

  <line x1="268" y1="468" x2="268" y2="480" stroke="#1f2937" stroke-width="2"/>
  <rect x="236" y="442" width="64" height="26" rx="13" fill="#1f2937"/>
  <text x="268" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">main</text>

  <line x1="90" y1="500" x2="116" y2="500" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="156" y1="500" x2="182" y2="500" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="222" y1="500" x2="248" y2="500" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="288" y1="500" x2="314" y2="500" stroke="#6d28d9" stroke-width="2.5"/>
  <line x1="354" y1="500" x2="380" y2="500" stroke="#6d28d9" stroke-width="2.5"/>
  <line x1="151.2" y1="512.9" x2="186.8" y2="543.1" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="222" y1="556" x2="248" y2="556" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>

  <circle cx="70" cy="500" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="70" y="506" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c1</text>
  <circle cx="136" cy="500" r="20" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="136" y="506" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">c2</text>
  <circle cx="202" cy="500" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="202" y="506" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c5</text>
  <circle cx="268" cy="500" r="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="268" y="506" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">c6</text>
  <circle cx="334" cy="500" r="20" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="334" y="506" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">c3'</text>
  <circle cx="400" cy="500" r="20" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="400" y="506" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">c4'</text>

  <line x1="420" y1="500" x2="432" y2="500" stroke="#1f2937" stroke-width="2"/>
  <rect x="432" y="487" width="86" height="26" rx="13" fill="#1f2937"/>
  <text x="475" y="505" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">feature</text>

  <circle cx="202" cy="556" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="202" y="562" text-anchor="middle" font-size="16" fill="#4b5563">c3</text>
  <circle cx="268" cy="556" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="268" y="562" text-anchor="middle" font-size="16" fill="#4b5563">c4</text>
  <text x="300" y="561" font-size="15" fill="#4b5563">참조 잃은 커밋</text>

  <text x="576" y="482" font-size="15" fill="#1f2937">• 최신 main(c6) 위로 재구성하여</text>
  <text x="590" y="506" font-size="15" fill="#1f2937">깔끔한 직선 히스토리</text>
  <text x="576" y="540" font-size="15" fill="#1f2937">• 재배치된 커밋은 새로운 커밋 해시</text>
  <text x="590" y="564" font-size="15" fill="#1f2937">(c3', c4')를 가짐</text>

  <!-- 결론 -->
  <rect x="24" y="618" width="832" height="44" rx="8" fill="#f3f4f6"/>
  <text x="440" y="646" text-anchor="middle" font-size="16" fill="#111827">결론: 히스토리 보존과 흐름 기록에는 <tspan font-weight="bold">merge</tspan>, 가독성과 선형 추적에는 <tspan font-weight="bold">rebase</tspan>가 유리합니다.</text>
</svg>
