<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SLA, SLO, SLI 관계도</title>
  <desc id="d">SLA 안에 SLO가 있고, SLO 안에 SLI가 중첩되어 포함된 관계도 다이어그램입니다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <rect x="100" y="30" width="680" height="370" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="75" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SLA</text>
  <text x="440" y="105" font-size="13" fill="#52606d" text-anchor="middle">(고객과의 계약, 위반 시 보상)</text>
  <text x="440" y="135" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">99.5%</text>
  <rect x="140" y="150" width="600" height="230" rx="6" ry="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="185" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SLO</text>
  <text x="440" y="215" font-size="13" fill="#52606d" text-anchor="middle">(내부 목표, SLA보다 높게 설정)</text>
  <text x="440" y="245" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">99.9%</text>
  <rect x="180" y="260" width="520" height="100" rx="4" ry="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="295" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SLI</text>
  <text x="440" y="322" font-size="13" fill="#52606d" text-anchor="middle">(실제 측정 지표)</text>
  <text x="440" y="348" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">현재: 99.95% ✓</text>
</svg>