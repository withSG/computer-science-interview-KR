<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SLA·SLO·SLI 관계도</title>
  <desc id="d">SLA(고객 계약, 99.5%) 안에 SLO(내부 목표, 99.9%)가, 그 안에 SLI(실제 측정 지표, 현재 99.95%)가 중첩된 관계를 보여줍니다. SLO는 SLA보다 높게 잡고, 측정값 SLI는 두 기준을 모두 넘고 있습니다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- SLA (가장 바깥) -->
  <rect x="24" y="24" width="832" height="322" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="48" y="62" font-size="22" font-weight="bold" fill="#1e3a8a">SLA</text>
  <text x="48" y="90" font-size="15" fill="#374151">고객과의 계약, 위반 시 보상</text>
  <text x="776" y="76" font-size="26" font-weight="bold" fill="#1d4ed8" text-anchor="end">99.5%</text>

  <!-- SLO -->
  <rect x="52" y="110" width="776" height="208" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="76" y="148" font-size="22" font-weight="bold" fill="#78350f">SLO</text>
  <text x="76" y="176" font-size="15" fill="#374151">내부 목표, SLA보다 높게 설정</text>
  <text x="776" y="162" font-size="26" font-weight="bold" fill="#b45309" text-anchor="end">99.9%</text>

  <!-- SLI (가장 안쪽) -->
  <rect x="80" y="196" width="720" height="94" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="104" y="234" font-size="22" font-weight="bold" fill="#064e3b">SLI</text>
  <text x="104" y="262" font-size="15" fill="#374151">실제 측정 지표</text>
  <text x="776" y="248" font-size="26" font-weight="bold" fill="#047857" text-anchor="end">현재: 99.95% ✓</text>
</svg>
