<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">카파 아키텍처 흐름</title>
  <desc id="d">소스 데이터가 단일 스트리밍 레이어를 거쳐 서빙으로, 다시 조회로 이어지는 한 줄 흐름. 모든 처리를 스트리밍으로 통합하고(재처리도 스트림 재생) 람다의 이중 코드베이스 문제를 해결한다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="#ffffff"/>

  <!-- 연결선 -->
  <line x1="154" y1="62" x2="222" y2="62" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <line x1="476" y1="62" x2="526" y2="62" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <line x1="690" y1="62" x2="742" y2="62" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 소스 데이터 -->
  <rect x="24" y="38" width="130" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="89" y="68" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">소스 데이터</text>

  <!-- 스트리밍 레이어(단일) -->
  <rect x="226" y="30" width="250" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="351" y="57" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">스트리밍 레이어</text>
  <text x="351" y="80" font-size="15" fill="#5b21b6" text-anchor="middle">(단일)</text>

  <!-- 서빙 -->
  <rect x="530" y="38" width="160" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="610" y="68" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">서빙</text>

  <!-- 조회 -->
  <rect x="746" y="38" width="110" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="801" y="68" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">조회</text>

  <!-- 설명 -->
  <rect x="24" y="128" width="832" height="48" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="24" y="128" width="6" height="48" fill="#6d28d9"/>
  <text x="48" y="158" font-size="16" fill="#1f2937">모든 처리를 스트리밍으로 통합 <tspan fill="#5b21b6">(재처리도 스트림 재생)</tspan></text>

  <rect x="24" y="188" width="832" height="48" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <rect x="24" y="188" width="6" height="48" fill="#047857"/>
  <text x="48" y="218" font-size="16" fill="#1f2937">람다의 이중 코드베이스 문제 해결</text>
</svg>
