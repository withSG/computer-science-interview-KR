<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sliding Window Counter 추정</title>
  <desc id="d">현재 시각 12:01:15, 창 크기 1분일 때 슬라이딩 윈도는 12:00:15 ~ 12:01:15를 덮는다. 12:00 창(요청 8건)과는 75%가 겹치고 12:01 창(요청 3건)은 그대로 더해 추정치 = 8 × 0.75 + 3 = 9가 된다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 조건 -->
  <text x="40" y="42" font-size="18" font-weight="bold" fill="#111827">현재 시각 12:01:15  (창 크기 1분)</text>
  <text x="40" y="72" font-size="16" fill="#374151">슬라이딩 윈도가 덮는 구간: <tspan font-weight="bold" fill="#1d4ed8">12:00:15 ~ 12:01:15</tspan></text>

  <!-- 시간 눈금 -->
  <g font-size="15" text-anchor="middle">
    <text x="80" y="112" fill="#4b5563">12:00</text>
    <text x="440" y="112" fill="#4b5563">12:01</text>
    <text x="800" y="112" fill="#4b5563">12:02</text>
    <text x="170" y="112" fill="#1d4ed8" font-weight="bold">12:00:15</text>
    <text x="530" y="112" fill="#1d4ed8" font-weight="bold">현재 12:01:15</text>
  </g>

  <!-- 고정 창 두 개 -->
  <rect x="80" y="126" width="360" height="52" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="440" y="126" width="360" height="52" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="260" y="158" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">12:00 창 (요청 8건)</text>
  <text x="620" y="158" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">12:01 창 (요청 3건)</text>

  <!-- 슬라이딩 윈도 경계 안내선 -->
  <line x1="170" y1="118" x2="170" y2="196" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="530" y1="118" x2="530" y2="196" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 슬라이딩 윈도 막대 -->
  <rect x="170" y="198" width="270" height="42" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="305" y="224" font-size="15" fill="#92400e" text-anchor="middle">12:00:15부터 겹침 = 이전 창의 75%</text>
  <rect x="440" y="198" width="90" height="42" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="485" y="224" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">현재 창</text>

  <path d="M170,248 L170,256 L530,256 L530,248" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="350" y="280" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">슬라이딩 윈도 (1분)</text>

  <!-- 추정 계산 -->
  <rect x="80" y="302" width="720" height="78" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="336" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">추정치 = <tspan fill="#b45309">8 × 0.75</tspan> + <tspan fill="#1d4ed8">3</tspan> = 9</text>
  <text x="440" y="364" font-size="15" fill="#374151" text-anchor="middle">(<tspan fill="#92400e">이전 창 카운터 × 겹치는 비율</tspan>) + <tspan fill="#1e40af">현재 창 카운터</tspan></text>
</svg>
