<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">④ 벌크헤드 — 자원을 칸으로 나눈다</title>
  <desc id="d">벌크헤드 유무에 따른 스레드 풀 자원 격리와 장애 전파 차단 비교 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Main Title -->
  <rect x="40" y="30" width="800" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="55.6" font-size="16" font-weight="bold" fill="#1f2933">④ 벌크헤드 — 자원을 칸으로 나눈다</text>

  <!-- Section 1: 벌크헤드 없음 -->
  <rect x="40" y="90" width="800" height="165" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  
  <rect x="60" y="105" width="130" height="28" rx="4" fill="#dc2626"/>
  <text x="125" y="123.8" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[벌크헤드 없음]</text>
  <text x="205" y="123.8" font-size="13" font-weight="bold" fill="#dc2626">스레드 풀 200개를 모두가 공유</text>

  <!-- Flow 1 -->
  <rect x="60" y="150" width="150" height="38" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="135" y="173.3" font-size="13" fill="#1f2933" text-anchor="middle">추천 호출이 느려짐</text>

  <path d="M210,169 L235,169" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="245" y="150" width="275" height="38" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="382.5" y="173.3" font-size="13" fill="#1f2933" text-anchor="middle">200개 중 190개가 추천 대기로 묶임</text>

  <path d="M520,169 L545,169" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="555" y="150" width="265" height="38" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="687.5" y="173.3" font-size="13" fill="#1f2933" text-anchor="middle">→ 결제가 쓸 스레드가 10개뿐</text>

  <path d="M687.5,188 L687.5,202" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="622.5" y="202" width="130" height="32" rx="4" fill="#dc2626"/>
  <text x="687.5" y="222.2" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">→ 결제도 장애</text>


  <!-- Section 2: 벌크헤드 있음 -->
  <rect x="40" y="275" width="800" height="195" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>

  <rect x="60" y="290" width="130" height="28" rx="4" fill="#059669"/>
  <text x="125" y="308.8" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[벌크헤드 있음]</text>
  <text x="205" y="308.8" font-size="13" font-weight="bold" fill="#059669">호출 대상별로 칸을 나눈다</text>

  <!-- Table -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="250" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="24.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">│ 결제 전용 100 │</text>

    <rect x="250" y="0" width="250" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="375" y="24.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">│ 추천 전용 20 │</text>

    <rect x="500" y="0" width="250" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="625" y="24.6" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">│ 리뷰 전용 20 │</text>
  </g>

  <!-- Footer Descriptions -->
  <text x="60" y="402" font-size="13" fill="#059669" font-weight="bold">추천이 20개를 다 먹어도 결제의 100개는 그대로다</text>

  <g transform="translate(60, 418)">
    <text x="0" y="18" font-size="13" fill="#1f2933">추천 호출은 21번째부터 즉시 거절</text>
    <path d="M225,13 L255,13" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="265" y="0" width="80" height="26" rx="4" fill="#059669"/>
    <text x="305" y="17.1" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">빠른 실패</text>
  </g>
</svg>