<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">벌크헤드 유무에 따른 스레드 풀 비교</title>
  <desc id="d">공유 스레드 풀 200개에서는 느려진 추천 호출이 190개를 묶어 결제까지 장애가 나지만, 결제 100·추천 20·리뷰 20으로 칸을 나누면 추천이 20개를 다 먹어도 결제의 100개는 그대로이고 추천 호출은 21번째부터 즉시 거절된다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ── 벌크헤드 없음 -->
  <rect x="24" y="24" width="832" height="280" rx="10" fill="#fff7f7" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="40" y="40" width="132" height="34" rx="17" fill="#b91c1c"/>
  <text x="106" y="63" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">벌크헤드 없음</text>
  <text x="188" y="63.5" font-size="18" font-weight="bold" fill="#1f2937">스레드 풀 200개를 모두가 공유</text>

  <!-- 원인 -->
  <rect x="120" y="92" width="168" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="204" y="117.5" font-size="15" fill="#1f2937" text-anchor="middle">추천 호출이 느려짐</text>
  <path d="M204,133 V153" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar-red)"/>

  <!-- 공유 풀 막대 (1칸 = 4px) -->
  <rect x="40" y="160" width="40" height="60" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="60" y="196" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">10</text>
  <rect x="80" y="160" width="760" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="470" y="196" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">200개 중 190개가 추천 대기로 묶임</text>

  <!-- 결과 -->
  <path d="M60,221 V239" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ar-ink)"/>
  <rect x="40" y="246" width="222" height="42" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="151" y="272" font-size="15" fill="#1f2937" text-anchor="middle">결제가 쓸 스레드가 10개뿐</text>
  <path d="M263,267 H299" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar-red)"/>
  <rect x="306" y="246" width="124" height="42" rx="6" fill="#b91c1c"/>
  <text x="368" y="273" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">결제도 장애</text>

  <!-- ── 벌크헤드 있음 -->
  <rect x="24" y="324" width="832" height="232" rx="10" fill="#f3fcf7" stroke="#86efac" stroke-width="1.5"/>
  <rect x="40" y="340" width="132" height="34" rx="17" fill="#047857"/>
  <text x="106" y="363" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">벌크헤드 있음</text>
  <text x="188" y="363.5" font-size="18" font-weight="bold" fill="#1f2937">호출 대상별로 칸을 나눈다</text>

  <!-- 칸으로 나눈 풀 (같은 축척 1칸 = 4px) -->
  <rect x="40" y="396" width="400" height="60" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="240" y="432" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">결제 전용 100</text>
  <rect x="452" y="396" width="80" height="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="492" y="421" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">추천 전용<tspan x="492" dy="21">20</tspan></text>
  <rect x="544" y="396" width="80" height="60" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="584" y="421" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">리뷰 전용<tspan x="584" dy="21">20</tspan></text>

  <!-- 결과 -->
  <text x="40" y="492" font-size="16" fill="#1f2937">추천이 20개를 다 먹어도</text>
  <text x="40" y="517" font-size="16" font-weight="bold" fill="#047857">결제의 100개는 그대로다</text>

  <text x="452" y="492" font-size="16" fill="#1f2937">추천 호출은 21번째부터 즉시 거절</text>
  <path d="M452,519 H480" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ar-ink)"/>
  <rect x="488" y="503" width="104" height="32" rx="6" fill="#047857"/>
  <text x="540" y="524.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">빠른 실패</text>
</svg>
