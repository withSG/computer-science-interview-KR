<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">바이트에서 화면까지</title>
  <desc id="d">HTML 바이트는 문자(인코딩 해석), 토큰, 노드를 거쳐 DOM 트리가 되고, CSS 바이트는 CSSOM 트리가 됩니다. 두 트리가 합쳐져 렌더 트리가 되고 Layout(위치·크기 계산), Paint(그리기 명령 생성), Composite(레이어 합성 → 화면) 순으로 렌더링 파이프라인이 이어집니다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 줄 이름 -->
  <text x="24" y="60" font-size="16" font-weight="700" fill="#374151">HTML</text>
  <text x="24" y="140" font-size="16" font-weight="700" fill="#374151">CSS</text>

  <!-- HTML 파싱 줄 -->
  <rect x="88" y="32" width="80" height="44" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="128" y="60" font-size="16" fill="#1f2937" text-anchor="middle">바이트</text>
  <line x1="170" y1="54" x2="210" y2="54" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="212" y="32" width="156" height="44" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="290" y="60" font-size="16" fill="#1f2937" text-anchor="middle">문자(인코딩 해석)</text>
  <line x1="370" y1="54" x2="410" y2="54" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="412" y="32" width="72" height="44" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="448" y="60" font-size="16" fill="#1f2937" text-anchor="middle">토큰</text>
  <line x1="486" y1="54" x2="526" y2="54" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="528" y="32" width="72" height="44" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="564" y="60" font-size="16" fill="#1f2937" text-anchor="middle">노드</text>
  <line x1="602" y1="54" x2="642" y2="54" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="644" y="32" width="136" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="712" y="60" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">DOM 트리</text>

  <!-- CSS 줄 -->
  <rect x="88" y="112" width="120" height="44" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="148" y="140" font-size="16" fill="#1f2937" text-anchor="middle">CSS 바이트</text>
  <line x1="210" y1="134" x2="518" y2="134" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="520" y="112" width="140" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="590" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">CSSOM 트리</text>

  <!-- 두 트리가 렌더 트리로 -->
  <line x1="712" y1="78" x2="712" y2="194" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="590" y1="158" x2="590" y2="194" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 렌더링 파이프라인 묶음 표시 -->
  <path d="M492,196 L480,196 L480,484 L492,484" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="466" y="334" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="end">렌더링</text>
  <text x="466" y="356" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="end">파이프라인</text>

  <!-- 렌더 트리 -->
  <rect x="520" y="196" width="260" height="48" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="650" y="226" font-size="18" font-weight="700" fill="#4c1d95" text-anchor="middle">렌더 트리</text>
  <line x1="650" y1="246" x2="650" y2="278" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Layout -->
  <rect x="500" y="280" width="300" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="650" y="308" font-size="16" fill="#1f2937" text-anchor="middle"><tspan font-weight="700">Layout</tspan>(위치·크기 계산)</text>
  <line x1="650" y1="326" x2="650" y2="358" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Paint -->
  <rect x="500" y="360" width="300" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="650" y="388" font-size="16" fill="#1f2937" text-anchor="middle"><tspan font-weight="700">Paint</tspan>(그리기 명령 생성)</text>
  <line x1="650" y1="406" x2="650" y2="438" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Composite -->
  <rect x="500" y="440" width="300" height="44" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="650" y="468" font-size="16" fill="#064e3b" text-anchor="middle"><tspan font-weight="700">Composite</tspan>(레이어 합성 → 화면)</text>
</svg>
