<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">응답을 받은 다음 — 렌더링으로 넘어가는 지점</title>
  <desc id="d">HTML 파싱 과정 및 CSSOM과의 결합, Layout, Paint, Composite 과정으로 이어지는 브라우저 렌더링 파이프라인 흐름도</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <!-- Dynamic Arrow Markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">7. 응답을 받은 다음 — 렌더링으로 넘어가는 지점</text>

  <!-- Section Backgrounds -->
  <!-- HTML Parsing Section -->
  <rect x="24" y="60" width="832" height="70" rx="6" fill="#f8fafc" stroke="#e4e7eb" stroke-width="1"/>
  <text x="36" y="80" font-size="11.5" font-weight="bold" fill="#52606d">HTML 파싱 과정</text>

  <!-- Render Tree & Pipeline Section -->
  <rect x="390" y="150" width="466" height="325" rx="6" fill="#f8fafc" stroke="#e4e7eb" stroke-width="1"/>
  <text x="402" y="170" font-size="11.5" font-weight="bold" fill="#52606d">렌더링 파이프라인</text>

  <!-- HTML Parsing Line Nodes -->
  <!-- 바이트 -->
  <rect x="36" y="88" width="76" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="74" y="108" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">바이트</text>

  <path d="M112,104 L138,104" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 문자(인코딩 해석) -->
  <rect x="146" y="88" width="154" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="223" y="108" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">문자(인코딩 해석)</text>

  <path d="M300,104 L326,104" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 토큰 -->
  <rect x="334" y="88" width="76" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="372" y="108" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">토큰</text>

  <path d="M410,104 L436,104" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 노드 -->
  <rect x="444" y="88" width="76" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="482" y="108" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">노드</text>

  <path d="M520,104 L546,104" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- DOM 트리 -->
  <rect x="554" y="88" width="112" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="108" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">DOM 트리</text>

  <!-- CSS 바이트 및 CSSOM 트리 -->
  <!-- CSS 바이트 -->
  <rect x="36" y="178" width="112" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="92" y="198" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">CSS 바이트</text>

  <!-- CSS 바이트 -> CSSOM 트리 연결선 -->
  <path d="M148,194 L552,194" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- CSSOM 트리 -->
  <rect x="554" y="178" width="112" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="198" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">CSSOM 트리</text>

  <!-- DOM 트리 & CSSOM 트리 -> 렌더 트리 연결선 -->
  <!-- DOM 트리에서 Down -->
  <path d="M610,120 L610,230" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <!-- CSSOM 트리에서 Down & Fusion Point -->
  <path d="M610,210 L610,232" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 렌더 트리 -->
  <rect x="510" y="240" width="200" height="38" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="610" y="263" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">렌더 트리</text>

  <path d="M610,278 L610,298" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Layout(위치·크기 계산) -->
  <rect x="500" y="306" width="220" height="38" rx="4" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="610" y="329" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Layout(위치·크기 계산)</text>

  <path d="M610,344 L610,364" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Paint(그리기 명령 생성) -->
  <rect x="490" y="372" width="240" height="38" rx="4" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="610" y="395" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Paint(그리기 명령 생성)</text>

  <path d="M610,410 L610,430" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Composite(레이어 합성 → 화면) -->
  <rect x="470" y="438" width="280" height="38" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="610" y="461" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Composite(레이어 합성 → 화면)</text>
</svg>