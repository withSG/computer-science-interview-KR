<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">확장-수축 패턴 6단계</title>
  <desc id="d">user_name 컬럼을 full_name으로 바꾸는 변경을 6단계로 나눈 표. 단계마다 앱이 읽고 쓰는 컬럼과 DB 컬럼 상태가 바뀌며, 1~5단계는 롤백할 수 있고 옛 컬럼을 지우는 6단계(Contract)만 되돌릴 수 없다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 캡션 -->
  <text x="24" y="42" font-size="17" font-weight="bold" fill="#111827">예시: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</tspan> 컬럼을 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</tspan>으로 바꾸는 변경을 6단계로 쪼갠다</text>

  <!-- 머리행 -->
  <rect x="24" y="60" width="206" height="42" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="230" y="60" width="140" height="42" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="370" y="60" width="160" height="42" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="530" y="60" width="176" height="42" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="706" y="60" width="150" height="42" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="127" y="87" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">단계</text>
  <text x="300" y="87" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">앱 읽기</text>
  <text x="450" y="87" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">앱 쓰기</text>
  <text x="618" y="87" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">DB 컬럼</text>
  <text x="781" y="87" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">롤백</text>

  <!-- 단계 열 -->
  <rect x="24" y="102" width="206" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="128" font-size="16" font-weight="bold" fill="#111827">1단계 · Expand</text>
  <text x="40" y="150" font-size="14" fill="#4b5563">새 컬럼 추가만 · 배포 없음</text>

  <rect x="24" y="162" width="206" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="188" font-size="16" font-weight="bold" fill="#111827">2단계 · 이중 쓰기</text>
  <text x="40" y="210" font-size="14" fill="#4b5563">앱 배포</text>

  <rect x="24" y="222" width="206" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="248" font-size="16" font-weight="bold" fill="#111827">3단계 · 백필</text>
  <text x="40" y="270" font-size="14" fill="#4b5563">기존 행을 배치로 채움</text>

  <rect x="24" y="282" width="206" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="308" font-size="16" font-weight="bold" fill="#111827">4단계 · 읽기 전환</text>
  <text x="40" y="330" font-size="14" fill="#4b5563">앱 배포</text>

  <rect x="24" y="342" width="206" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="368" font-size="16" font-weight="bold" fill="#111827">5단계 · 쓰기 정리</text>
  <text x="40" y="390" font-size="14" fill="#4b5563">앱 배포 · 며칠 관찰</text>

  <rect x="24" y="402" width="206" height="60" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="40" y="428" font-size="16" font-weight="bold" fill="#b91c1c">6단계 · Contract</text>
  <text x="40" y="450" font-size="14" fill="#b91c1c">옛 컬럼 제거 · 파괴적 변경</text>

  <!-- 앱 읽기 열 -->
  <rect x="230" y="102" width="140" height="180" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="300" y="198" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</text>
  <rect x="230" y="282" width="140" height="180" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="378" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</text>

  <!-- 앱 쓰기 열 -->
  <rect x="370" y="102" width="160" height="60" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="450" y="138" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</text>
  <rect x="370" y="162" width="160" height="180" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="228" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">양쪽 모두</text>
  <text x="450" y="256" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</text>
  <text x="450" y="280" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</text>
  <rect x="370" y="342" width="160" height="120" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="408" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</text>

  <!-- DB 컬럼 열 -->
  <rect x="530" y="102" width="176" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="546" y="128" font-size="14" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</text>
  <text x="546" y="150" font-size="14" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">+ full_name (NULL)</text>

  <rect x="530" y="162" width="176" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="546" y="188" font-size="14" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</text>
  <text x="546" y="210" font-size="14" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</text>

  <rect x="530" y="222" width="176" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="546" y="248" font-size="14" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</text>
  <text x="546" y="270" font-size="14" font-weight="bold" fill="#1d4ed8"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</tspan> 백필 완료</text>

  <rect x="530" y="282" width="176" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="546" y="308" font-size="14" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</text>
  <text x="546" y="330" font-size="14" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</text>

  <rect x="530" y="342" width="176" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="546" y="368" font-size="14" fill="#4b5563"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_name</tspan> (방치)</text>
  <text x="546" y="390" font-size="14" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</text>

  <rect x="530" y="402" width="176" height="60" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="546" y="428" font-size="14" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DROP user_name</text>
  <text x="546" y="450" font-size="14" fill="#1d4ed8"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">full_name</tspan>만 남음</text>

  <!-- 롤백 열 -->
  <rect x="706" y="102" width="150" height="300" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="781" y="230" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">롤백 가능</text>
  <text x="781" y="260" font-size="14" fill="#065f46" text-anchor="middle">v1·v2 모두</text>
  <text x="781" y="282" font-size="14" fill="#065f46" text-anchor="middle">데이터 손실 없이</text>
  <text x="781" y="304" font-size="14" fill="#065f46" text-anchor="middle">호환 동작</text>
  <rect x="706" y="402" width="150" height="60" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="781" y="438" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">롤백 불가</text>

  <!-- 결론 -->
  <text x="24" y="494" font-size="15" fill="#111827">1~5단계는 언제든 롤백 가능 · <tspan font-weight="bold" fill="#b91c1c">6단계(Contract)만 되돌릴 수 없어</tspan> 충분히 관찰한 뒤 가장 마지막에 한다</text>
</svg>
