<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">진단 절차</title>
  <desc id="d">Old 영역 메모리 누수 증상 발생 시 GC 로그 확인, 힙 덤프 확보, MAT/VisualVM 분석, 참조 경로 확인으로 이어지는 진단 절차 다이어그램</desc>
  
  <rect width="880" height="730" fill="#ffffff"/>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Step 0: Symptom -->
  <rect x="200" y="30" width="480" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="60.5" fill="#dc2626" font-size="14" font-weight="bold" text-anchor="middle">증상: Old 영역 사용량이 GC 후에도 계속 우상향</text>

  <!-- Arrow 0 -> 1 -->
  <path d="M440,80 L440,120" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- Step 1: GC Log -->
  <rect x="140" y="120" width="600" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="152.5" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">1. GC 로그 확인 (-Xlog:gc*)</text>
  <text x="440" y="180.5" fill="#52606d" font-size="13" text-anchor="middle">Full GC가 자주 도는데 회수량이 적다 → 누수 의심</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,200 L440,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2: Heap Dump -->
  <rect x="140" y="240" width="600" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="270.5" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">2. 힙 덤프 확보 (jmap 또는 -XX:+HeapDumpOnOutOfMemoryError)</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,290 L440,330" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3: Tool Analysis Container -->
  <rect x="100" y="330" width="680" height="220" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="365.5" fill="#7c3aed" font-size="15" font-weight="bold" text-anchor="middle">3. MAT / VisualVM 으로 열기</text>

  <!-- Inner Branch 1: Dominator Tree -->
  <rect x="130" y="390" width="620" height="60" rx="6" ry="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="150" y="425.5" fill="#7c3aed" font-size="14" font-weight="bold">├─ Dominator Tree :</text>
  <text x="315" y="425.5" fill="#1f2933" font-size="13">누가 메모리를 제일 많이 붙잡고 있나</text>

  <!-- Inner Branch 2: Path to GC Roots -->
  <rect x="130" y="465" width="620" height="60" rx="6" ry="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="150" y="500.5" fill="#7c3aed" font-size="14" font-weight="bold">└─ Path to GC Roots :</text>
  <text x="330" y="500.5" fill="#1f2933" font-size="13">그 객체가 왜 아직 살아있나 (참조 경로)</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,550 L440,590" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 4: Root Cause Confirmation -->
  <rect x="100" y="590" width="680" height="60" rx="8" ry="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="625.5" fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle">4. 참조 경로의 출발점이 static 필드 / 리스너 목록 / 캐시라면 확정</text>
</svg>