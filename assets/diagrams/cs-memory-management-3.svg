<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">메모리 누수 진단 절차</title>
  <desc id="d">Old 영역 사용량이 GC 후에도 계속 우상향하는 증상에서 출발해 GC 로그 확인, 힙 덤프 확보, MAT/VisualVM의 Dominator Tree와 Path to GC Roots 분석을 거쳐, 참조 경로의 출발점이 static 필드·리스너 목록·캐시이면 누수를 확정하는 4단계 절차.</desc>
  <rect width="880" height="640" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 증상 -->
  <rect x="24" y="24" width="832" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="44" y="38" width="56" height="28" rx="14" fill="#b91c1c"/>
  <text x="72" y="58" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">증상</text>
  <text x="116" y="59" font-size="17" font-weight="bold" fill="#7f1d1d">Old 영역 사용량이 GC 후에도 계속 우상향</text>

  <line x1="440" y1="80" x2="440" y2="108" stroke="#4b5563" stroke-width="2" marker-end="url(#m-gray)"/>

  <!-- 1 -->
  <rect x="24" y="110" width="832" height="84" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="62" cy="138" r="17" fill="#1d4ed8"/>
  <text x="62" y="144" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="96" y="144" font-size="18" font-weight="bold" fill="#111827">GC 로그 확인 <tspan font-size="16" font-weight="normal" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(-Xlog:gc*)</tspan></text>
  <text x="96" y="176" font-size="16" fill="#374151">Full GC가 자주 도는데 회수량이 적다 <tspan font-weight="bold" fill="#b91c1c">→ 누수 의심</tspan></text>

  <line x1="440" y1="194" x2="440" y2="222" stroke="#4b5563" stroke-width="2" marker-end="url(#m-gray)"/>

  <!-- 2 -->
  <rect x="24" y="224" width="832" height="84" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="62" cy="252" r="17" fill="#1d4ed8"/>
  <text x="62" y="258" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="96" y="258" font-size="18" font-weight="bold" fill="#111827">힙 덤프 확보</text>
  <text x="96" y="290" font-size="16" fill="#374151"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">jmap</tspan> 또는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">-XX:+HeapDumpOnOutOfMemoryError</tspan></text>

  <line x1="440" y1="308" x2="440" y2="336" stroke="#4b5563" stroke-width="2" marker-end="url(#m-gray)"/>

  <!-- 3 -->
  <rect x="24" y="338" width="832" height="172" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="62" cy="366" r="17" fill="#1d4ed8"/>
  <text x="62" y="372" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="96" y="372" font-size="18" font-weight="bold" fill="#111827">MAT / VisualVM 으로 열기</text>

  <rect x="96" y="392" width="362" height="98" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="426" font-size="17" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Dominator Tree</text>
  <text x="116" y="462" font-size="16" fill="#1f2937">누가 메모리를 제일 많이 붙잡고 있나</text>

  <rect x="474" y="392" width="362" height="98" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="494" y="426" font-size="17" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Path to GC Roots</text>
  <text x="494" y="462" font-size="16" fill="#1f2937">그 객체가 왜 아직 살아있나 (참조 경로)</text>

  <line x1="440" y1="510" x2="440" y2="538" stroke="#4b5563" stroke-width="2" marker-end="url(#m-gray)"/>

  <!-- 4 -->
  <rect x="24" y="540" width="832" height="72" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="62" cy="576" r="17" fill="#047857"/>
  <text x="62" y="582" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="96" y="582" font-size="17" fill="#064e3b">참조 경로의 출발점이</text>
  <rect x="270" y="561" width="119" height="30" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="329.5" y="582" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">static 필드</text>
  <text x="400" y="582" font-size="17" fill="#064e3b" text-anchor="middle">/</text>
  <rect x="412" y="561" width="109" height="30" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="466.5" y="582" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">리스너 목록</text>
  <text x="533" y="582" font-size="17" fill="#064e3b" text-anchor="middle">/</text>
  <rect x="545" y="561" width="60" height="30" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="575" y="582" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">캐시</text>
  <text x="617" y="582" font-size="17" font-weight="bold" fill="#047857">라면 확정</text>
</svg>
