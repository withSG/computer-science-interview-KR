<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서비스가 늘어날수록 연결선이 제곱으로 는다</title>
  <desc id="d">직접 연결 구조에서 생산자 3개와 소비자 5개 간의 11개 연결선을 보여주고, 새 소비자 추가 시 생산자 전부를 고쳐야 함을 나타내는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 상단 제목/설명 라벨 -->
  <text x="40" y="42" font-size="14" font-weight="bold" fill="#1f2933">[직접 연결]  생산자 3, 소비자 5 — 아래처럼만 붙여도 연결선 11개 (다 붙으면 15개)</text>

  <!-- 생산자 박스 (왼쪽) -->
  <!-- 주문 -->
  <rect x="60" y="80" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="104" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">주문</text>

  <!-- 결제 -->
  <rect x="60" y="210" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="234" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">결제</text>

  <!-- 가입 -->
  <rect x="60" y="340" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="364" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">가입</text>

  <!-- 소비자 박스 (오른쪽) -->
  <!-- 재고 -->
  <rect x="680" y="80" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="730" y="104" font-size="13" fill="#1f2933" text-anchor="middle">재고</text>

  <!-- 배송 -->
  <rect x="680" y="145" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="730" y="169" font-size="13" fill="#1f2933" text-anchor="middle">배송</text>

  <!-- 알림 -->
  <rect x="680" y="210" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="730" y="234" font-size="13" fill="#1f2933" text-anchor="middle">알림</text>

  <!-- 분석 -->
  <rect x="680" y="275" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="730" y="299" font-size="13" fill="#1f2933" text-anchor="middle">분석</text>

  <!-- 추천 -->
  <rect x="680" y="340" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="730" y="364" font-size="13" fill="#1f2933" text-anchor="middle">추천</text>

  <!-- 연결선 (주문 ──┬──> ) -->
  <path d="M 160 100 L 320 100" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M 320 100 L 320 295" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <!-- 주문 -> 재고 -->
  <path d="M 320 100 L 680 100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 주문 -> 배송 -->
  <path d="M 320 165 L 680 165" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 주문 -> 알림 -->
  <path d="M 320 230 L 680 230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 주문 -> 분석 -->
  <path d="M 320 295 L 680 295" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 연결선 (결제 ──┬──> ) -->
  <path d="M 160 230 L 420 230" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M 420 100 L 420 360" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <!-- 결제 -> 재고 -->
  <path d="M 420 100 L 680 100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 결제 -> 알림 -->
  <path d="M 420 230 L 680 230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 결제 -> 분석 -->
  <path d="M 420 295 L 680 295" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 결제 -> 추천 -->
  <path d="M 420 360 L 680 360" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 연결선 (가입 ──┬──> ) -->
  <path d="M 160 360 L 520 360" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M 520 230 L 520 360" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <!-- 가입 -> 알림 -->
  <path d="M 520 230 L 680 230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 가입 -> 분석 -->
  <path d="M 520 295 L 680 295" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- 가입 -> 추천 -->
  <path d="M 520 360 L 680 360" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 하단 하이라이트 경고 박스 및 메시지 -->
  <rect x="180" y="440" width="520" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="440" y="466" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">새 소비자 하나가 늘 때마다 생산자 전부를 고쳐야 한다</text>
</svg>