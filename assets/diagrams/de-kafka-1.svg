<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서비스가 늘어날수록 연결선이 제곱으로 는다</title>
  <desc id="d">직접 연결 구조에서 생산자 3개(주문·결제·가입)가 소비자 5개(재고·배송·알림·분석·추천)를 직접 호출해 일부만 붙여도 연결선이 11개(다 붙으면 15개)가 되고, 새 소비자 하나가 늘 때마다 생산자 전부를 고쳐야 한다는 그림.</desc>
  <rect width="880" height="490" fill="#ffffff"/>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="m3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="mk" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 머리말 -->
  <rect x="24" y="22" width="92" height="32" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="70" y="44" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">직접 연결</text>
  <text x="132" y="44" font-size="16" fill="#1f2937">생산자 3, 소비자 5 — 아래처럼만 붙여도 <tspan font-weight="700" fill="#b91c1c">연결선 11개</tspan> (다 붙으면 15개)</text>

  <text x="140" y="90" font-size="14" fill="#4b5563" text-anchor="middle">생산자</text>
  <text x="740" y="90" font-size="14" fill="#4b5563" text-anchor="middle">소비자</text>

  <!-- 아직 안 붙은 연결 4개 (다 붙으면 15개) -->
  <g stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5" fill="none">
    <path d="M200,168 L679,338"/>
    <path d="M200,228 L679,180"/>
    <path d="M200,304 L679,134"/>
    <path d="M200,312 L679,190"/>
  </g>

  <!-- 주문 → 재고·배송·알림·분석 -->
  <g stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#m1)">
    <path d="M200,136 L679,114"/>
    <path d="M200,144 L679,170"/>
    <path d="M200,152 L679,226"/>
    <path d="M200,160 L679,282"/>
  </g>
  <!-- 결제 → 재고·알림·분석·추천 -->
  <g stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#m2)">
    <path d="M200,220 L679,124"/>
    <path d="M200,236 L679,236"/>
    <path d="M200,244 L679,292"/>
    <path d="M200,252 L679,348"/>
  </g>
  <!-- 가입 → 알림·분석·추천 -->
  <g stroke="#0d9488" stroke-width="1.8" fill="none" marker-end="url(#m3)">
    <path d="M200,320 L679,246"/>
    <path d="M200,328 L679,302"/>
    <path d="M200,336 L679,358"/>
  </g>

  <!-- 생산자 -->
  <rect x="80" y="122" width="120" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="149" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">주문</text>
  <text x="140" y="171" font-size="14" fill="#1e40af" text-anchor="middle">연결선 4개</text>
  <rect x="80" y="206" width="120" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="233" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle">결제</text>
  <text x="140" y="255" font-size="14" fill="#5b21b6" text-anchor="middle">연결선 4개</text>
  <rect x="80" y="290" width="120" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="140" y="317" font-size="17" font-weight="700" fill="#115e59" text-anchor="middle">가입</text>
  <text x="140" y="339" font-size="14" fill="#115e59" text-anchor="middle">연결선 3개</text>

  <!-- 소비자 -->
  <rect x="680" y="104" width="120" height="40" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="740" y="130" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">재고</text>
  <rect x="680" y="160" width="120" height="40" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="740" y="186" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">배송</text>
  <rect x="680" y="216" width="120" height="40" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="740" y="242" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">알림</text>
  <rect x="680" y="272" width="120" height="40" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="740" y="298" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">분석</text>
  <rect x="680" y="328" width="120" height="40" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="740" y="354" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">추천</text>

  <!-- 범례 -->
  <path d="M80,395 L118,395" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#mk)"/>
  <text x="128" y="400" font-size="15" fill="#374151">붙어 있는 연결 11개</text>
  <path d="M320,395 L358,395" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5" fill="none"/>
  <text x="368" y="400" font-size="15" fill="#374151">아직 안 붙은 연결 4개 (다 붙으면 15개)</text>

  <!-- 결론 -->
  <rect x="160" y="424" width="560" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="452" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle">새 소비자 하나가 늘 때마다 생산자 전부를 고쳐야 한다</text>
</svg>
