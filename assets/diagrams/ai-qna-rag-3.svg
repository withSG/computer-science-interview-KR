<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">임베딩의 원리</title>
  <desc id="d">텍스트 문장이 각각 벡터로 변환되고, 문장 간 의미적 유사성에 따라 유사함과 다름을 나타내는 코사인 유사도 계산 원리 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Row 1: "고양이는 귀엽다" -->
  <rect x="40" y="30" width="220" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="58" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">"고양이는 귀엽다"</text>

  <path d="M 260 53 L 320 53" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="330" y="30" width="300" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="480" y="58" font-size="14" font-family="'Consolas', 'Courier New', monospace" font-weight="bold" fill="#1f2933" text-anchor="middle">[0.2, 0.8, -0.3, ...]</text>

  <!-- Row 2: "강아지는 사랑스럽다" -->
  <rect x="40" y="100" width="220" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="150" y="128" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">"강아지는 사랑스럽다"</text>

  <path d="M 260 123 L 320 123" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <rect x="330" y="100" width="300" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="480" y="128" font-size="14" font-family="'Consolas', 'Courier New', monospace" font-weight="bold" fill="#1f2933" text-anchor="middle">[0.3, 0.7, -0.2, ...]</text>

  <rect x="650" y="100" width="90" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="695" y="128" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">(유사)</text>

  <!-- Row 3: "오늘 날씨가 좋다" -->
  <rect x="40" y="170" width="220" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="198" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">"오늘 날씨가 좋다"</text>

  <path d="M 260 193 L 320 193" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>

  <rect x="330" y="170" width="300" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="480" y="198" font-size="14" font-family="'Consolas', 'Courier New', monospace" font-weight="bold" fill="#1f2933" text-anchor="middle">[-0.5, 0.1, 0.9, ...]</text>

  <rect x="650" y="170" width="90" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="695" y="198" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">(다름)</text>

  <!-- Divider Line -->
  <line x1="40" y1="242" x2="840" y2="242" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Formula Section -->
  <rect x="40" y="262" width="800" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="292" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">유사도 = 코사인 유사도(벡터1, 벡터2)</text>
</svg>