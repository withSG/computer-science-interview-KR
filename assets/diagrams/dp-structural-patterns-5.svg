<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컴포지트 파일 트리 크기 계산</title>
  <desc id="d">FolderNode("/") 아래 FileNode(1KB)와 FolderNode("docs"), docs 아래 FileNode(2KB)와 FileNode(3KB)가 있는 트리. 호출부가 root.size()를 한 번 부르면 재귀로 1KB + (2KB + 3KB) = 6KB가 된다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 트리 연결선 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M390,82 V111 H230 V140"/>
    <path d="M390,111 H560 V140"/>
    <path d="M560,192 V221 H450 V250"/>
    <path d="M560,221 H670 V250"/>
  </g>

  <!-- 1행: 호출부 → root -->
  <rect x="24" y="30" width="100" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="74" y="62" font-size="16" fill="#111827" text-anchor="middle">호출부</text>
  <line x1="128" y1="56" x2="294" y2="56" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="211" y="44" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">root.size()</text>

  <rect x="300" y="30" width="180" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="390" y="62" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FolderNode("/")</text>
  <text x="500" y="62" font-size="16" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= 1KB + (2KB + 3KB) = 6KB</text>

  <!-- 2행 -->
  <rect x="160" y="140" width="140" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="230" y="162" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FileNode</text>
  <text x="230" y="183" font-size="15" fill="#374151" text-anchor="middle">(1KB)</text>

  <rect x="460" y="140" width="200" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="560" y="172" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FolderNode("docs")</text>
  <text x="680" y="172" font-size="16" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= 2KB + 3KB</text>

  <!-- 3행 -->
  <rect x="380" y="250" width="140" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="272" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FileNode</text>
  <text x="450" y="293" font-size="15" fill="#374151" text-anchor="middle">(2KB)</text>

  <rect x="600" y="250" width="140" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="670" y="272" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FileNode</text>
  <text x="670" y="293" font-size="15" fill="#374151" text-anchor="middle">(3KB)</text>

  <!-- 범례 -->
  <rect x="40" y="336" width="18" height="18" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="68" y="351" font-size="15" fill="#111827">FolderNode = 가지(composite)</text>
  <rect x="330" y="336" width="18" height="18" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="358" y="351" font-size="15" fill="#111827">FileNode = 잎(leaf)</text>
  <text x="560" y="351" font-size="15" fill="#374151">→ 둘 다 같은 타입 Node</text>

  <!-- 요점 -->
  <rect x="24" y="374" width="832" height="82" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="44" y="406" font-size="17" font-weight="bold" fill="#065f46"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">root.size()</tspan> 한 번이면 재귀가 알아서 6KB를 만든다.</text>
  <text x="44" y="437" font-size="16" fill="#111827">호출부는 파일인지 폴더인지 신경 쓰지 않는다.</text>
</svg>
