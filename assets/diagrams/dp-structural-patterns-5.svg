<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">컴포지트 (Composite) 패턴 구조</title>
  <desc id="d">FolderNode와 FileNode로 구성된 트리 구조 및 재귀적 크기 계산 흐름 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 트리 구조 연결선 (가지) -->
  <!-- 루트 FolderNode("/") -> FileNode(1KB) & FolderNode("docs") -->
  <path d="M440,80 L440,105 L260,105 L260,130" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M440,105 L620,105 L620,130" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- FolderNode("docs") -> FileNode(2KB) & FileNode(3KB) -->
  <path d="M620,180 L620,205 L510,205 L510,230" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M620,205 L730,205 L730,230" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- 노드 박스 및 텍스트 -->

  <!-- Root: FolderNode("/") -->
  <!-- 폭 계산: FolderNode("/") -> font-size 13 * (10개 영/기호*0.55 + 1공백*0.3 + 2쌍따옴표*0.55) = ~160, rect width = 180 -->
  <g transform="translate(350, 30)">
    <rect width="180" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="90" y="29.5" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">FolderNode("/")</text>
  </g>

  <!-- Level 1 Left: FileNode (1KB) -->
  <!-- 폭 계산: FileNode -> 130, (1KB) -> 80 -> rect width = 150 -->
  <g transform="translate(185, 130)">
    <rect width="150" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="75" y="22.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">FileNode</text>
    <text x="75" y="38.0" font-size="11.5" fill="#52606d" text-anchor="middle">(1KB)</text>
  </g>

  <!-- Level 1 Right: FolderNode("docs") -->
  <g transform="translate(520, 130)">
    <rect width="200" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="100" y="29.5" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">FolderNode("docs")</text>
  </g>

  <!-- Level 2 Left: FileNode (2KB) -->
  <g transform="translate(435, 230)">
    <rect width="150" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="75" y="22.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">FileNode</text>
    <text x="75" y="38.0" font-size="11.5" fill="#52606d" text-anchor="middle">(2KB)</text>
  </g>

  <!-- Level 2 Right: FileNode (3KB) -->
  <g transform="translate(655, 230)">
    <rect width="150" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="75" y="22.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">FileNode</text>
    <text x="75" y="38.0" font-size="11.5" fill="#52606d" text-anchor="middle">(3KB)</text>
  </g>

  <!-- 하단 부가 설명 및 문구 (원본 텍스트 완벽 전사) -->
  <g transform="translate(40, 315)">
    <!-- 하단 문구 영역 배경 박스 -->
    <rect width="800" height="85" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    
    <!-- 원본 텍스트 1: root.size() 한 번이면 재귀가 알아서 6KB를 만든다. -->
    <text x="400" y="34.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">root.size() 한 번이면 재귀가 알아서 6KB를 만든다.</text>
    
    <!-- 원본 텍스트 2: 호출부는 파일인지 폴더인지 신경 쓰지 않는다. -->
    <text x="400" y="59.5" font-size="13" fill="#52606d" text-anchor="middle">호출부는 파일인지 폴더인지 신경 쓰지 않는다.</text>
  </g>
</svg>