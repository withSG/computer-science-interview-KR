<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배열 순회와 캐시 라인</title>
  <desc id="d">arr[0]을 읽으면 a0부터 a15까지 64바이트 캐시 라인이 통째로 캐시에 올라와, 첫 읽기만 캐시 미스이고 arr[1]부터 arr[15]까지는 캐시 히트, arr[16]에서 다시 미스가 나 다음 라인을 로드한다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 요점 -->
  <text x="440" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[0]</tspan>을 읽는 순간 → 캐시 라인 64바이트가 통째로 올라온다</text>

  <!-- 메모리 줄 -->
  <text x="96" y="119" text-anchor="end" font-size="16" font-weight="bold" fill="#111827">메모리</text>

  <text x="106" y="76" font-size="15" fill="#1d4ed8"><tspan font-weight="bold">한 번에 캐시로 (64B)</tspan> · 캐시 라인 하나 = int 16개</text>
  <rect x="106" y="87" width="620" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>

  <g font-size="15" fill="#111827" text-anchor="middle">
    <rect x="112" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="150" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="188" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="226" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="264" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="302" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="340" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="378" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="416" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="454" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="492" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="530" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="568" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="606" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="644" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <rect x="682" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
    <text x="131" y="118">a0</text>
    <text x="169" y="118">a1</text>
    <text x="207" y="118">a2</text>
    <text x="245" y="118">a3</text>
    <text x="283" y="118">a4</text>
    <text x="321" y="118">a5</text>
    <text x="359" y="118">a6</text>
    <text x="397" y="118">a7</text>
    <text x="435" y="118">a8</text>
    <text x="473" y="118">a9</text>
    <text x="511" y="118">a10</text>
    <text x="549" y="118">a11</text>
    <text x="587" y="118">a12</text>
    <text x="625" y="118">a13</text>
    <text x="663" y="118">a14</text>
    <text x="701" y="118">a15</text>
  </g>

  <!-- 다음 캐시 라인 -->
  <text x="765" y="76" text-anchor="middle" font-size="15" fill="#374151">다음 라인</text>
  <rect x="740" y="87" width="50" height="52" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="746" y="93" width="38" height="40" fill="#ffffff" stroke="#6b7280"/>
  <text x="765" y="118" text-anchor="middle" font-size="15" fill="#111827">a16</text>
  <text x="818" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#4b5563">…</text>

  <!-- 칸별 읽기 결과 -->
  <text x="96" y="169" text-anchor="end" font-size="15" font-weight="bold" fill="#374151">읽기 결과</text>
  <rect x="112" y="150" width="38" height="28" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="131" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">미스</text>
  <rect x="150" y="150" width="570" height="28" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="435" y="169" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">캐시 히트 15번 (빠름)</text>
  <rect x="746" y="150" width="38" height="28" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="765" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">미스</text>

  <line x1="32" y1="200" x2="848" y2="200" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 읽기 순서 -->
  <g font-size="16" fill="#111827" text-anchor="end">
    <text x="232" y="231"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[0]</tspan> 읽기</text>
    <text x="232" y="267"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[1]</tspan> 읽기</text>
    <text x="232" y="303"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[2]</tspan> 읽기</text>
    <text x="232" y="369"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[15]</tspan> 읽기</text>
    <text x="232" y="405"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[16]</tspan> 읽기</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="244" y1="226" x2="282" y2="226"/>
    <line x1="244" y1="262" x2="282" y2="262"/>
    <line x1="244" y1="298" x2="282" y2="298"/>
    <line x1="244" y1="364" x2="282" y2="364"/>
    <line x1="244" y1="400" x2="282" y2="400"/>
  </g>

  <rect x="292" y="212" width="150" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="367" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">캐시 미스 (느림)</text>
  <text x="458" y="231" font-size="15" fill="#374151">하지만 <tspan font-weight="bold" fill="#111827">a1~a15</tspan>가 딸려 옴</text>

  <rect x="292" y="248" width="150" height="28" rx="14" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="367" y="267" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">캐시 히트 (빠름)</text>

  <rect x="292" y="284" width="150" height="28" rx="14" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="367" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">캐시 히트</text>

  <g fill="#6b7280">
    <circle cx="190" cy="323" r="2.5"/>
    <circle cx="190" cy="331" r="2.5"/>
    <circle cx="190" cy="339" r="2.5"/>
    <circle cx="367" cy="323" r="2.5"/>
    <circle cx="367" cy="331" r="2.5"/>
    <circle cx="367" cy="339" r="2.5"/>
  </g>

  <rect x="292" y="350" width="150" height="28" rx="14" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="367" y="369" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">캐시 히트</text>

  <rect x="292" y="386" width="150" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="367" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">캐시 미스</text>
  <text x="458" y="405" font-size="15" fill="#374151">다음 라인 로드</text>
</svg>
