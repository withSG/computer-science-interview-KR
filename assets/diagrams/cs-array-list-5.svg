<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배열을 순회할 때의 캐시 지역성</title>
  <desc id="d">arr[0] 읽기 시 64바이트 캐시 라인이 통째로 로드되어 arr[1]부터 arr[15]까지는 캐시 히트가 발생하고 arr[16]에서 다시 캐시 미스가 발생하는 과정을 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Top note -->
  <text x="440" y="38" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="bold">arr[0]을 읽는 순간 → 캐시 라인 64바이트가 통째로 올라온다</text>

  <!-- Memory Section Box -->
  <rect x="40" y="60" width="800" height="135" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="55" y="102" font-size="13" font-weight="bold" fill="#1f2933">메모리:</text>

  <!-- Array Elements -->
  <!-- a0 to a4 -->
  <rect x="120" y="80" width="42" height="35" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="141" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">a0</text>

  <rect x="166" y="80" width="42" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="187" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">a1</text>

  <rect x="212" y="80" width="42" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="233" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">a2</text>

  <rect x="258" y="80" width="42" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="279" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">a3</text>

  <rect x="304" y="80" width="42" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="325" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">a4</text>

  <text x="366" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#52606d">...</text>

  <!-- a15 -->
  <rect x="390" y="80" width="46" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="413" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">a15</text>

  <!-- a16 -->
  <rect x="440" y="80" width="46" height="35" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="463" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">a16</text>

  <text x="506" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#52606d">...</text>

  <!-- Bracket for Cache Line (a0 ~ a15) -->
  <!-- Left x: 120, Right x: 436, Center x: 278 -->
  <path d="M 120 123 L 120 140 L 436 140 L 436 123" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <line x1="278" y1="140" x2="278" y2="152" stroke="#2563eb" stroke-width="1.5"/>
  <text x="278" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">한 번에 캐시로 (64B)</text>

  <!-- Trace / Access Log Section -->
  <g font-size="13">
    <!-- Line 1: arr[0] -->
    <text x="200" y="225" font-weight="bold" fill="#1f2933">arr[0] 읽기</text>
    <path d="M 275 221 L 305 221" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <rect x="312" y="208" width="370" height="26" rx="4" fill="#fef2f2"/>
    <text x="320" y="225" fill="#dc2626" font-weight="bold">캐시 미스(느림). 하지만 a1~a15가 딸려 옴</text>

    <!-- Line 2: arr[1] -->
    <text x="200" y="260" font-weight="bold" fill="#1f2933">arr[1] 읽기</text>
    <path d="M 275 256 L 305 256" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="312" y="243" width="145" height="26" rx="4" fill="#ecfdf5"/>
    <text x="320" y="260" fill="#059669" font-weight="bold">캐시 히트 (빠름)</text>

    <!-- Line 3: arr[2] -->
    <text x="200" y="295" font-weight="bold" fill="#1f2933">arr[2] 읽기</text>
    <path d="M 275 291 L 305 291" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="312" y="278" width="100" height="26" rx="4" fill="#ecfdf5"/>
    <text x="320" y="295" fill="#059669" font-weight="bold">캐시 히트</text>

    <!-- Line 4: Ellipsis -->
    <text x="230" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#52606d">...</text>

    <!-- Line 5: arr[15] -->
    <text x="192" y="365" font-weight="bold" fill="#1f2933">arr[15] 읽기</text>
    <path d="M 275 361 L 305 361" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="312" y="348" width="100" height="26" rx="4" fill="#ecfdf5"/>
    <text x="320" y="365" fill="#059669" font-weight="bold">캐시 히트</text>

    <!-- Line 6: arr[16] -->
    <text x="192" y="400" font-weight="bold" fill="#1f2933">arr[16] 읽기</text>
    <path d="M 275 396 L 305 396" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <rect x="312" y="383" width="245" height="26" rx="4" fill="#fef2f2"/>
    <text x="320" y="400" fill="#dc2626" font-weight="bold">캐시 미스. 다음 라인 로드</text>
  </g>

  <!-- Legend -->
  <rect x="180" y="445" width="520" height="35" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="220" y="457" width="12" height="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="238" y="467" font-size="12" fill="#1f2933">캐시 미스 (Cache Miss)</text>

  <rect x="440" y="457" width="12" height="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="458" y="467" font-size="12" fill="#1f2933">캐시 히트 (Cache Hit)</text>
</svg>