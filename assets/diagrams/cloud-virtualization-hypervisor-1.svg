<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가상화(Virtualization) 구조</title>
  <desc id="d">하나의 물리 서버 위에 Hypervisor 가상화 계층을 두고, 그 위에 서로 다른 OS를 가진 3대의 VM이 격리되어 작동하며 하드웨어 자원을 공유하는 구조 다이어그램</desc>
  
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 바깥 큰 박스: 물리 서버 (1대) -->
  <rect x="40" y="40" width="800" height="420" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="440" y="76" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">물리 서버 (1대)</text>

  <!-- VM 1 (Ubuntu) -->
  <g id="vm1">
    <rect x="70" y="100" width="230" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="185" y="140" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">VM 1</text>
    <text x="185" y="175" font-size="13" fill="#1f2933" text-anchor="middle">Ubuntu</text>
  </g>

  <!-- VM 2 (CentOS) -->
  <g id="vm2">
    <rect x="325" y="100" width="230" height="110" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="440" y="140" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">VM 2</text>
    <text x="440" y="175" font-size="13" fill="#1f2933" text-anchor="middle">CentOS</text>
  </g>

  <!-- VM 3 (Windows) -->
  <g id="vm3">
    <rect x="580" y="100" width="230" height="110" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="695" y="140" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">VM 3</text>
    <text x="695" y="175" font-size="13" fill="#1f2933" text-anchor="middle">Windows</text>
  </g>

  <!-- Hypervisor (가상화 계층) -->
  <rect x="70" y="240" width="740" height="90" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="278" font-size="16" font-weight="bold" fill="#d97706" text-anchor="middle">Hypervisor</text>
  <text x="440" y="308" font-size="13" fill="#52606d" text-anchor="middle">(가상화 계층)</text>

  <!-- Hardware (CPU, Memory, Storage) -->
  <rect x="70" y="350" width="740" height="80" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="396" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Hardware (CPU, Memory, Storage)</text>
</svg>