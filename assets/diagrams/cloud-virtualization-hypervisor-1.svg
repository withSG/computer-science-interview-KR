<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가상화 구조</title>
  <desc id="d">물리 서버 1대 안에서 Hardware(CPU, Memory, Storage) 위에 Hypervisor(가상화 계층)가 있고, 그 위에서 Ubuntu, CentOS, Windows를 각각 가진 VM 1~3이 따로 돈다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 물리 서버 (바깥 경계) -->
  <rect x="24" y="24" width="832" height="402" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="48" y="60" font-size="18" font-weight="bold" fill="#1f2937">물리 서버 (1대)</text>

  <!-- VM 1 -->
  <rect x="48" y="80" width="248" height="116" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="172" y="112" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VM 1</text>
  <rect x="72" y="130" width="200" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="172" y="159" font-size="16" fill="#1f2937" text-anchor="middle">Ubuntu</text>

  <!-- VM 2 -->
  <rect x="316" y="80" width="248" height="116" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="112" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VM 2</text>
  <rect x="340" y="130" width="200" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="440" y="159" font-size="16" fill="#1f2937" text-anchor="middle">CentOS</text>

  <!-- VM 3 -->
  <rect x="584" y="80" width="248" height="116" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="708" y="112" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VM 3</text>
  <rect x="608" y="130" width="200" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="708" y="159" font-size="16" fill="#1f2937" text-anchor="middle">Windows</text>

  <!-- Hypervisor -->
  <rect x="48" y="216" width="784" height="80" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="250" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">Hypervisor</text>
  <text x="440" y="279" font-size="16" fill="#92400e" text-anchor="middle">(가상화 계층)</text>

  <!-- Hardware -->
  <rect x="48" y="316" width="784" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="368" font-size="18" font-weight="bold" fill="#1f2937">Hardware</text>
  <rect x="240" y="336" width="176" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="328" y="367" font-size="16" fill="#1f2937" text-anchor="middle">CPU</text>
  <rect x="436" y="336" width="176" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="524" y="367" font-size="16" fill="#1f2937" text-anchor="middle">Memory</text>
  <rect x="632" y="336" width="176" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="720" y="367" font-size="16" fill="#1f2937" text-anchor="middle">Storage</text>
</svg>
