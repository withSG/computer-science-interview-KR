<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BST와 B-Tree의 디스크 I/O 비교</title>
  <desc id="d">디스크는 블록(4KB~16KB) 단위로 읽는다. BST는 노드 1개에 디스크 I/O 1번이 들어 깊이만큼 I/O가 늘고, B-Tree는 노드 1개에 수십~수백 개 키를 담아 트리 높이가 낮아진다. 레코드 1,000,000개에서 BST 높이는 약 20, 차수 1000인 B-Tree 높이는 약 2~3이다.</desc>
  <rect width="880" height="620" fill="#ffffff"/>

  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 전제: 디스크 읽기 단위 -->
  <rect x="24" y="24" width="832" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="57" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">디스크 읽기 단위 = 블록 (4KB~16KB)</text>

  <!-- 왼쪽: BST -->
  <rect x="24" y="100" width="404" height="312" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="226" y="134" text-anchor="middle" font-size="20" font-weight="bold" fill="#b91c1c">BST</text>
  <rect x="181" y="152" width="90" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="226" y="180" text-anchor="middle" font-size="16" fill="#111827">키 1개</text>
  <text x="226" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">노드 1개 = 1번 디스크 I/O</text>
  <line x1="226" y1="238" x2="226" y2="262" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>
  <rect x="54" y="268" width="344" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="226" y="296" text-anchor="middle" font-size="16" fill="#111827">깊이가 깊으면 <tspan font-weight="bold" fill="#b91c1c">I/O 횟수 많음</tspan></text>

  <!-- 오른쪽: B-Tree -->
  <rect x="452" y="100" width="404" height="312" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="654" y="134" text-anchor="middle" font-size="20" font-weight="bold" fill="#047857">B-Tree</text>
  <rect x="482" y="152" width="344" height="44" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <line x1="525" y1="152" x2="525" y2="196" stroke="#047857" stroke-width="1"/>
  <line x1="568" y1="152" x2="568" y2="196" stroke="#047857" stroke-width="1"/>
  <line x1="611" y1="152" x2="611" y2="196" stroke="#047857" stroke-width="1"/>
  <line x1="654" y1="152" x2="654" y2="196" stroke="#047857" stroke-width="1"/>
  <line x1="697" y1="152" x2="697" y2="196" stroke="#047857" stroke-width="1"/>
  <line x1="740" y1="152" x2="740" y2="196" stroke="#047857" stroke-width="1"/>
  <line x1="783" y1="152" x2="783" y2="196" stroke="#047857" stroke-width="1"/>
  <g font-size="16" fill="#111827" text-anchor="middle">
    <text x="503.5" y="180">키</text>
    <text x="546.5" y="180">키</text>
    <text x="589.5" y="180">키</text>
    <text x="632.5" y="180">키</text>
    <text x="675.5" y="180">…</text>
    <text x="718.5" y="180">키</text>
    <text x="761.5" y="180">키</text>
    <text x="804.5" y="180">키</text>
  </g>
  <text x="654" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">노드 1개 = 수십~수백 개 키</text>
  <line x1="654" y1="238" x2="654" y2="262" stroke="#047857" stroke-width="2" marker-end="url(#ar-green)"/>
  <rect x="482" y="268" width="344" height="44" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="654" y="296" text-anchor="middle" font-size="16" fill="#111827">디스크 1번 읽기로 더 많은 키 검색</text>
  <line x1="654" y1="318" x2="654" y2="342" stroke="#047857" stroke-width="2" marker-end="url(#ar-green)"/>
  <rect x="482" y="348" width="344" height="44" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="654" y="376" text-anchor="middle" font-size="16" fill="#111827">트리 높이 낮아져 <tspan font-weight="bold" fill="#047857">I/O 횟수 최소화</tspan></text>

  <!-- 아래: 레코드 1,000,000개일 때 트리 높이 -->
  <rect x="24" y="436" width="832" height="160" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="470" font-size="18" font-weight="bold" fill="#111827">n=1,000,000 레코드</text>
  <rect x="664" y="457" width="18" height="18" rx="2" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="690" y="471" font-size="14" fill="#4b5563">= 트리 레벨 1개</text>

  <text x="48" y="514" font-size="16" fill="#111827">BST 높이</text>
  <g fill="#f87171" stroke="#b91c1c" stroke-width="1">
    <rect x="272" y="494" width="21" height="28" rx="2"/>
    <rect x="297" y="494" width="21" height="28" rx="2"/>
    <rect x="322" y="494" width="21" height="28" rx="2"/>
    <rect x="347" y="494" width="21" height="28" rx="2"/>
    <rect x="372" y="494" width="21" height="28" rx="2"/>
    <rect x="397" y="494" width="21" height="28" rx="2"/>
    <rect x="422" y="494" width="21" height="28" rx="2"/>
    <rect x="447" y="494" width="21" height="28" rx="2"/>
    <rect x="472" y="494" width="21" height="28" rx="2"/>
    <rect x="497" y="494" width="21" height="28" rx="2"/>
    <rect x="522" y="494" width="21" height="28" rx="2"/>
    <rect x="547" y="494" width="21" height="28" rx="2"/>
    <rect x="572" y="494" width="21" height="28" rx="2"/>
    <rect x="597" y="494" width="21" height="28" rx="2"/>
    <rect x="622" y="494" width="21" height="28" rx="2"/>
    <rect x="647" y="494" width="21" height="28" rx="2"/>
    <rect x="672" y="494" width="21" height="28" rx="2"/>
    <rect x="697" y="494" width="21" height="28" rx="2"/>
    <rect x="722" y="494" width="21" height="28" rx="2"/>
    <rect x="747" y="494" width="21" height="28" rx="2"/>
  </g>
  <text x="784" y="515" font-size="18" font-weight="bold" fill="#b91c1c">~20</text>

  <text x="48" y="562" font-size="16" fill="#111827">B-Tree 높이 (차수 1000)</text>
  <rect x="272" y="542" width="21" height="28" rx="2" fill="#34d399" stroke="#047857" stroke-width="1"/>
  <rect x="297" y="542" width="21" height="28" rx="2" fill="#34d399" stroke="#047857" stroke-width="1"/>
  <rect x="322" y="542" width="21" height="28" rx="2" fill="#d1fae5" stroke="#047857" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="359" y="563" font-size="18" font-weight="bold" fill="#047857">~2~3</text>
</svg>
