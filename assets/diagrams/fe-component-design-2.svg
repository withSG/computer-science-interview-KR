<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">props 폭발과 합성 비교</title>
  <desc id="d">props 폭발 방식에서는 사용처 A·B·C가 모두 Modal 하나에 기대어 Modal이 모든 경우를 props로 알아야 하므로 사용처가 늘면 Modal이 커진다. 합성 방식에서는 사용처가 각자 Modal, Modal.Header 같은 조각을 조립하므로 사용처가 늘어도 Modal은 그대로다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ① props 폭발 -->
  <rect x="24" y="24" width="832" height="244" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="58" font-size="20" font-weight="bold" fill="#b91c1c">props 폭발</text>

  <rect x="48" y="81" width="120" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="107" font-size="16" fill="#111827" text-anchor="middle">사용처 A</text>
  <rect x="48" y="127" width="120" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="153" font-size="16" fill="#111827" text-anchor="middle">사용처 B</text>
  <rect x="48" y="173" width="120" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="199" font-size="16" fill="#111827" text-anchor="middle">사용처 C</text>

  <path d="M168,101 H200 V193 M168,193 H200" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <path d="M168,147 H233" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>

  <rect x="240" y="72" width="568" height="150" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="260" y="102"><tspan font-size="18" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Modal</tspan><tspan dx="14" font-size="15" fill="#b91c1c">모든 경우를 props로 알아야</tspan></text>

  <g font-size="14" fill="#991b1b" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <rect x="260" y="116" width="56" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="288" y="134">title</text>
    <rect x="324" y="116" width="80" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="364" y="134">subtitle</text>
    <rect x="412" y="116" width="48" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="436" y="134">icon</text>
    <rect x="468" y="116" width="48" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="492" y="134">body</text>
    <rect x="524" y="116" width="134" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="591" y="134">showCloseButton</text>
    <rect x="666" y="116" width="102" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="717" y="134">confirmText</text>

    <rect x="260" y="150" width="96" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="308" y="168">cancelText</text>
    <rect x="364" y="150" width="126" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="427" y="168">confirmVariant</text>
    <rect x="498" y="150" width="88" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="542" y="168">onConfirm</text>
    <rect x="594" y="150" width="80" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="634" y="168">onCancel</text>
    <rect x="682" y="150" width="102" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="733" y="168">footerAlign</text>

    <rect x="260" y="184" width="150" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="335" y="202">hideFooterDivider</text>
  </g>

  <text x="44" y="252" font-size="16" font-weight="bold" fill="#b91c1c">사용처가 늘면 Modal이 커진다</text>

  <!-- ② 합성 -->
  <rect x="24" y="292" width="832" height="244" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="44" y="326" font-size="20" font-weight="bold" fill="#047857">합성</text>

  <rect x="48" y="349" width="120" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="375" font-size="16" fill="#111827" text-anchor="middle">사용처 A</text>
  <rect x="48" y="395" width="120" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="421" font-size="16" fill="#111827" text-anchor="middle">사용처 B</text>
  <rect x="48" y="441" width="120" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="108" y="467" font-size="16" fill="#111827" text-anchor="middle">사용처 C</text>

  <path d="M168,369 H200 V461 M168,461 H200" fill="none" stroke="#047857" stroke-width="2"/>
  <path d="M168,415 H233" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <rect x="240" y="391" width="180" height="48" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="330" y="421" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">각자 조각을 조립</text>

  <path d="M420,415 H493" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <rect x="500" y="369" width="252" height="92" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <g font-size="14" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <rect x="520" y="385" width="56" height="26" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="548" y="403">Modal</text>
    <rect x="584" y="385" width="110" height="26" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="639" y="403">Modal.Header</text>
    <rect x="520" y="419" width="94" height="26" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="567" y="437">Modal.Body</text>
    <rect x="622" y="419" width="110" height="26" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="677" y="437">Modal.Footer</text>
  </g>

  <text x="44" y="520" font-size="16" font-weight="bold" fill="#047857">사용처가 늘어도 그대로</text>
</svg>
