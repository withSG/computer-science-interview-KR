<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">개선 1 — children과 슬롯</title>
  <desc id="d">props 폭발 방식과 합성 방식을 비교하여, 사용처 증가 시 컴포넌트 구조의 변화 차이를 보여주는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Left Container: [props 폭발] -->
  <rect x="24" y="24" width="396" height="292" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="24" y="24" width="396" height="40" rx="8" fill="#fef2f2"/>
  <path d="M24,64 L420,64" stroke="#fca5a5" stroke-width="1"/>
  <text x="44" y="48.5" font-size="16" font-weight="bold" fill="#dc2626">[props 폭발]</text>

  <!-- Left Side: Consumers A, B, C -->
  <rect x="44" y="80" width="90" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="89" y="102.5" font-size="13" text-anchor="middle" fill="#1f2933">사용처 A</text>

  <rect x="44" y="126" width="90" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="89" y="148.5" font-size="13" text-anchor="middle" fill="#1f2933">사용처 B</text>

  <rect x="44" y="172" width="90" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="89" y="194.5" font-size="13" text-anchor="middle" fill="#1f2933">사용처 C</text>

  <!-- Left Converging Arrows -->
  <path d="M134,98 L154,98 L154,144 L180,144" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <path d="M134,144 L180,144" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <path d="M134,190 L154,190 L154,144 L180,144" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Left Target Box: Modal -->
  <rect x="189" y="80" width="211" height="128" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="294.5" y="112.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Modal</text>
  <text x="294.5" y="142.5" font-size="13" text-anchor="middle" fill="#52606d">모든 경우를</text>
  <text x="294.5" y="166.5" font-size="13" text-anchor="middle" fill="#52606d">props로 알아야</text>

  <!-- Left Subtext -->
  <text x="44" y="254.5" font-size="13" fill="#dc2626">사용처가 늘면 Modal이 커진다</text>


  <!-- Right Container: [합성] -->
  <rect x="460" y="24" width="396" height="292" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="460" y="24" width="396" height="40" rx="8" fill="#eff6ff"/>
  <path d="M460,64 L856,64" stroke="#bfdbfe" stroke-width="1"/>
  <text x="480" y="48.5" font-size="16" font-weight="bold" fill="#2563eb">[합성]</text>

  <!-- Right Side: Consumers A, B, C -->
  <rect x="480" y="80" width="90" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="525" y="102.5" font-size="13" text-anchor="middle" fill="#1f2933">사용처 A</text>

  <rect x="480" y="126" width="90" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="525" y="148.5" font-size="13" text-anchor="middle" fill="#1f2933">사용처 B</text>

  <rect x="480" y="172" width="90" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="525" y="194.5" font-size="13" text-anchor="middle" fill="#1f2933">사용처 C</text>

  <!-- Right Converging Arrows to "각자 조각을 조립" -->
  <path d="M570,98 L590,98 L590,144 L616,144" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M570,144 L616,144" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M570,190 L590,190 L590,144 L616,144" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Right Side Assembly Step -->
  <rect x="625" y="121" width="160" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="705" y="148.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">각자 조각을 조립</text>

  <!-- Downward Arrow to Compound Components -->
  <path d="M705,167 L705,199" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Right Target Box: Modal / Modal.Header / ... -->
  <rect x="480" y="208" width="350" height="42" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="655" y="233.5" font-size="13" text-anchor="middle" fill="#1f2933">Modal / Modal.Header / ...</text>

  <!-- Right Subtext -->
  <text x="480" y="282.5" font-size="13" fill="#2563eb">사용처가 늘어도 그대로</text>
</svg>