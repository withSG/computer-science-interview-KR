<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이벤트 전파 3단계</title>
  <desc id="d">이벤트가 Window에서 Document, body, div를 거쳐 타깃인 button까지 내려가는 캡처링 단계, button에 도달하는 타깃 단계, 다시 button에서 Window까지 올라가는 버블링 단계를 보여 줍니다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 노드 사이 연결선 -->
  <path d="M 440 84 V 112 M 440 156 V 184 M 440 228 V 256 M 440 300 V 328" fill="none" stroke="#9ca3af" stroke-width="2"/>

  <!-- 전파 경로 노드 -->
  <rect x="340" y="40" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="68" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Window</text>

  <rect x="340" y="112" width="200" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="140" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Document</text>

  <rect x="340" y="184" width="200" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="212" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">body</text>

  <rect x="340" y="256" width="200" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="284" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">div</text>

  <rect x="340" y="328" width="200" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="440" y="356" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">button</text>
  <text x="440" y="379" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Target</text>

  <!-- ① 캡처링: Window → Target -->
  <path d="M 336 62 H 300 V 360 H 332" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="282" y="190" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="end">① 캡처링</text>
  <text x="282" y="214" font-size="16" fill="#1d4ed8" text-anchor="end">(위 → 아래)</text>
  <text x="282" y="250" font-size="14" fill="#4b5563" text-anchor="end">세 번째 인수 true면</text>
  <text x="282" y="270" font-size="14" fill="#4b5563" text-anchor="end">이 단계에서 캐치</text>

  <!-- ③ 버블링: Target → Window -->
  <path d="M 544 360 H 580 V 62 H 548" fill="none" stroke="#6d28d9" stroke-width="3" marker-end="url(#ap)"/>
  <text x="598" y="190" font-size="19" font-weight="bold" fill="#6d28d9">③ 버블링</text>
  <text x="598" y="214" font-size="16" fill="#6d28d9">(아래 → 위)</text>
  <text x="598" y="250" font-size="14" fill="#4b5563">브라우저 기본값:</text>
  <text x="598" y="270" font-size="14" fill="#4b5563">이 단계에서 캐치</text>

  <!-- ② 타깃 -->
  <text x="440" y="428" font-size="19" font-weight="bold" fill="#b45309" text-anchor="middle">② 타깃</text>
  <text x="440" y="452" font-size="16" fill="#b45309" text-anchor="middle">(이벤트 타깃 도달)</text>
</svg>
