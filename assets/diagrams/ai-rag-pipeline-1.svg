<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1260" width="880" height="1260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">전체 파이프라인</title>
  <desc id="d">RAG의 오프라인 인덱싱 파이프라인과 온라인 질의 파이프라인을 나타낸 상세 흐름도</desc>
  <rect width="880" height="1260" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 오프라인 구역 -->
  <rect x="40" y="30" width="800" height="430" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="440" y="65" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">━━━━━━━━━ 오프라인: 인덱싱 (배포·문서 갱신 시 1회) ━━━━━━━━━</text>

  <!-- [1] 로드 -->
  <rect x="70" y="90" width="130" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="117" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[1] 로드</text>
  
  <text x="220" y="117" font-size="13" fill="#1f2933">PDF, HTML, Notion, DB</text>
  <text x="220" y="147" font-size="13" fill="#52606d">→ 텍스트 + 메타데이터(제목, 작성일, 권한)</text>

  <path d="M440,160 L440,185" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- [2] 청킹 -->
  <rect x="70" y="190" width="130" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="217" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[2] 청킹</text>
  
  <text x="220" y="217" font-size="13" fill="#1f2933">긴 문서를 검색 단위로 분할</text>

  <path d="M440,240 L440,265" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- [3] 임베딩 -->
  <rect x="70" y="270" width="130" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="297" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[3] 임베딩</text>
  
  <text x="220" y="297" font-size="13" fill="#1f2933">각 청크 → 벡터</text>

  <path d="M440,320 L440,345" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- [4] 인덱싱 -->
  <rect x="70" y="350" width="130" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="377" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[4] 인덱싱</text>
  
  <text x="220" y="377" font-size="13" fill="#1f2933">벡터 DB 저장 + BM25 등 키워드 인덱스 구축</text>


  <!-- 온라인 구역 -->
  <rect x="40" y="490" width="800" height="730" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="440" y="525" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">━━━━━━━━━ 온라인: 질의 (사용자 요청마다) ━━━━━━━━━━━━━━━━━</text>

  <!-- 사용자 질문 -->
  <rect x="350" y="550" width="180" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="575" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자 질문</text>

  <path d="M440,590 L440,615" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- [5] 쿼리 처리 -->
  <rect x="70" y="620" width="160" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="647" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[5] 쿼리 처리</text>
  
  <text x="250" y="647" font-size="13" fill="#1f2933">대화 맥락 병합 · 재작성 · 확장</text>

  <path d="M440,668 L440,693" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- [6] 검색 -->
  <rect x="70" y="698" width="160" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="725" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[6] 검색</text>
  
  <text x="250" y="725" font-size="13" fill="#1f2933">벡터 검색 + 키워드 검색 → 후보 N개 (예: 50)</text>

  <path d="M440,746 L440,771" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- [7] 재순위 -->
  <rect x="70" y="776" width="160" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="803" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[7] 재순위</text>
  
  <text x="250" y="803" font-size="13" fill="#1f2933">Cross-encoder로 다시 채점 → 최종 K개 (예: 5)</text>

  <path d="M440,824 L440,849" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- [8] 컨텍스트 조립 -->
  <rect x="70" y="854" width="160" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="881" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[8] 컨텍스트 조립</text>
  
  <text x="250" y="881" font-size="13" fill="#1f2933">번호 붙여 프롬프트에 삽입, 토큰 예산 안에 맞춤</text>

  <path d="M440,902 L440,927" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- [9] 생성 -->
  <rect x="70" y="932" width="160" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="959" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[9] 생성</text>
  
  <text x="250" y="959" font-size="13" fill="#1f2933">LLM → 답변 + 인용</text>

  <path d="M440,980 L440,1005" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- [10] 검증 -->
  <rect x="70" y="1010" width="160" height="44" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="150" y="1037" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[10] 검증</text>
  
  <text x="250" y="1037" font-size="13" fill="#1f2933">인용이 실제 컨텍스트에 있는지 대조</text>
</svg>