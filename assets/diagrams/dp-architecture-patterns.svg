<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MVC, MVP, MVVM 데이터 흐름 비교</title>
  <desc id="d">MVC, MVP, MVVM 아키텍처 패턴의 View, 중재자, Model 간의 데이터 흐름과 참조 관계를 비교하는 다이어그램입니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커: 잉크(검은색/Dark) -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- 화살표 마커: 파랑 -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <!-- 화살표 마커: 보라 -->
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <!-- 화살표 마커: 주황 -->
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 메인 제목 -->
  <text x="440" y="34" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">MVC · MVP · MVVM 데이터 흐름 비교</text>

  <!-- 범례 (Legend) -->
  <g transform="translate(100, 48)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
    <text x="36" y="14" font-size="11" font-weight="400" fill="#52606d">직접 조작 / 이벤트 전달</text>

    <line x1="180" y1="10" x2="210" y2="10" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-amber)"/>
    <text x="216" y="14" font-size="11" font-weight="400" fill="#52606d">상태 변경 통지(옵저버)</text>

    <line x1="370" y1="10" x2="400" y2="10" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
    <text x="406" y="14" font-size="11" font-weight="400" fill="#52606d">명령형 뷰 조종</text>

    <line x1="520" y1="10" x2="550" y2="10" stroke="#2563eb" stroke-width="2" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>
    <text x="556" y="14" font-size="11" font-weight="400" fill="#52606d">자동 양방향 데이터 바인딩</text>
  </g>

  <!-- 세로 구분선 -->
  <line x1="300" y1="80" x2="300" y2="440" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="580" y1="80" x2="580" y2="440" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== 1. MVC 패널 ==================== -->
  <text x="160" y="105" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">MVC Pattern</text>
  
  <!-- Controller (x: 40, y: 130, w: 100, h: 50) -->
  <rect x="40" y="130" width="100" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="90" y="160" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">Controller</text>

  <!-- Model (x: 180, y: 130, w: 100, h: 50) -->
  <rect x="180" y="130" width="100" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="230" y="160" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">Model</text>

  <!-- View (x: 40, y: 270, w: 240, h: 50) -->
  <rect x="40" y="270" width="240" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="300" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">View</text>

  <!-- MVC 화살표 및 라벨 -->
  <!-- 입력 -> Controller -->
  <path d="M 90,95 L 90,130" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="75" y="102" width="30" height="16" fill="#ffffff"/>
  <text x="90" y="114" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle">입력</text>

  <!-- Controller -> Model (조작) -->
  <path d="M 140,155 L 180,155" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="146" y="142" width="28" height="14" fill="#ffffff"/>
  <text x="160" y="153" font-size="11" font-weight="400" fill="#1f2933" text-anchor="middle">조작</text>

  <!-- Controller -> View (View 선택) -->
  <path d="M 90,180 L 90,270" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="42" y="217" width="56" height="16" fill="#ffffff"/>
  <text x="70" y="229" font-size="11" font-weight="400" fill="#1f2933" text-anchor="middle">View 선택</text>

  <!-- Model -> View (상태 변경 통지) -->
  <path d="M 230,180 L 230,270" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-amber)"/>
  <rect x="181" y="212" width="98" height="26" fill="#ffffff"/>
  <text x="230" y="223" font-size="11" font-weight="400" fill="#d97706" text-anchor="middle">상태 변경 통지</text>
  <text x="230" y="235" font-size="11" font-weight="400" fill="#d97706" text-anchor="middle">(옵저버)</text>

  <!-- View -> Model (직접 조회) -->
  <path d="M 200,270 L 200,180" stroke="#52606d" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#a-ink)"/>
  <rect x="145" y="332" width="130" height="16" fill="#ffffff"/>
  <text x="210" y="344" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">View가 Model 직접 조회 가능</text>

  <!-- MVC 설명 카드 -->
  <rect x="40" y="365" width="240" height="60" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="160" y="387" font-size="11" font-weight="400" fill="#1f2933" text-anchor="middle">Controller가 전체 흐름 지휘</text>
  <text x="160" y="407" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">View가 Model을 직접 볼 수 있음</text>


  <!-- ==================== 2. MVP 패널 ==================== -->
  <text x="440" y="105" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">MVP Pattern</text>

  <!-- View (x: 370, y: 120, w: 140, h: 40) -->
  <rect x="370" y="120" width="140" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="145" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">View</text>

  <!-- Presenter (x: 370, y: 210, w: 140, h: 40) -->
  <rect x="370" y="210" width="140" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="235" font-size="13" font-weight="500" fill="#7c3aed" text-anchor="middle">Presenter</text>

  <!-- Model (x: 370, y: 300, w: 140, h: 40) -->
  <rect x="370" y="300" width="140" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="325" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">Model</text>

  <!-- MVP 화살표 및 라벨 (세로 배치: 내려가는 화살표 라벨은 왼쪽, 올라가는 화살표 라벨은 오른쪽) -->
  <!-- View -> Presenter (이벤트 전달) -->
  <path d="M 425,160 L 425,210" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="417" y="189" font-size="11" font-weight="400" fill="#1f2933" text-anchor="end">이벤트</text>

  <!-- Presenter -> View ("이걸 그려라") -->
  <path d="M 455,210 L 455,160" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="463" y="189" font-size="11" font-weight="400" fill="#7c3aed" text-anchor="start">명령</text>

  <!-- Presenter -> Model (조작) -->
  <path d="M 425,250 L 425,300" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="417" y="279" font-size="11" font-weight="400" fill="#1f2933" text-anchor="end">조작</text>

  <!-- Model -> Presenter (결과) -->
  <path d="M 455,300 L 455,250" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="463" y="279" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start">결과</text>

  <!-- MVP 설명 카드 -->
  <rect x="320" y="365" width="240" height="60" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="387" font-size="11" font-weight="400" fill="#1f2933" text-anchor="middle">Presenter가 중간 통로를 완전 차단</text>
  <text x="440" y="407" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">View와 Model은 서로 완전히 무지함</text>


  <!-- ==================== 3. MVVM 패널 ==================== -->
  <text x="730" y="105" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">MVVM Pattern</text>

  <!-- View (x: 660, y: 120, w: 140, h: 40) -->
  <rect x="660" y="120" width="140" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="145" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">View</text>

  <!-- ViewModel (x: 660, y: 210, w: 140, h: 40) -->
  <rect x="660" y="210" width="140" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="730" y="235" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">ViewModel</text>

  <!-- Model (x: 660, y: 300, w: 140, h: 40) -->
  <rect x="660" y="300" width="140" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="730" y="325" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">Model</text>

  <!-- MVVM 화살표 및 라벨 (세로 배치) -->
  <!-- View <==> ViewModel (데이터 바인딩) -->
  <path d="M 730,160 L 730,210" stroke="#2563eb" stroke-width="2" fill="none" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>
  <text x="740" y="183" font-size="11" font-weight="500" fill="#2563eb" text-anchor="start">데이터</text>
  <text x="740" y="196" font-size="11" font-weight="500" fill="#2563eb" text-anchor="start">바인딩</text>

  <!-- ViewModel -> Model (조작) -->
  <path d="M 715,250 L 715,300" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Model -> ViewModel (결과) -->
  <path d="M 745,300 L 745,250" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- MVVM 설명 카드 -->
  <rect x="610" y="365" width="240" height="60" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="730" y="387" font-size="11" font-weight="400" fill="#1f2933" text-anchor="middle">바인딩으로 View-ViewModel 자동 동기화</text>
  <text x="730" y="407" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">ViewModel은 View의 존재를 몰라 독립적</text>


  <!-- 하단 요약 캡션 -->
  <text x="440" y="472" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">결론: MVC는 View-Model 직접 접근이 허용되고, MVP는 Presenter가 제어하며, MVVM은 바인딩으로 결합도를 낮춘다.</text>
</svg>