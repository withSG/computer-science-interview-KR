<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 790" width="880" height="790" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MVC · MVP · MVVM 데이터 흐름 비교</title>
  <desc id="d">MVC는 Controller가 흐름을 지휘하고 View가 Model을 직접 조회하거나 상태 변경 통지를 받는다. MVP는 Presenter가 View와 Model 사이를 완전히 막고 View를 명령형으로 조종하며, MVVM은 View와 ViewModel이 데이터 바인딩으로 자동 동기화되고 ViewModel은 View를 모른다.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-violet-start" viewBox="0 0 10 10" refX="0" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="790" fill="#ffffff"/>

  <!-- ───── MVC ───── -->
  <rect x="24" y="24" width="832" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="60" font-size="22" font-weight="bold" fill="#111827">MVC</text>
  <text x="138" y="59" font-size="16" fill="#374151">Controller가 흐름을 지휘. View는 Model을 직접 볼 수 있다</text>

  <text x="440" y="96" font-size="15" text-anchor="middle" fill="#374151">입력</text>
  <path d="M440,102 V121" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>

  <rect x="60" y="124" width="140" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">View</text>
  <rect x="350" y="124" width="180" height="56" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="#6d28d9">Controller</text>
  <rect x="680" y="124" width="140" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="750" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857">Model</text>

  <path d="M532,152 H677" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="605" y="142" font-size="15" text-anchor="middle" fill="#111827">조작</text>
  <path d="M348,152 H203" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="275" y="142" font-size="15" text-anchor="middle" fill="#111827">View 선택</text>

  <!-- View → Model 직접 조회 (안쪽 경로) -->
  <path d="M160,181 V216 H720 V183" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-amber)"/>
  <rect x="290" y="205" width="300" height="22" fill="#f8fafc"/>
  <text x="440" y="221" font-size="15" text-anchor="middle" fill="#b45309">View가 Model을 직접 조회하기도 한다</text>

  <!-- Model → View 상태 변경 통지 (바깥 경로) -->
  <path d="M780,181 V254 H100 V183" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="344" y="243" width="192" height="22" fill="#f8fafc"/>
  <text x="440" y="259" font-size="15" text-anchor="middle" fill="#047857">상태 변경 통지(옵저버)</text>

  <!-- ───── MVP ───── -->
  <rect x="24" y="300" width="832" height="204" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="336" font-size="22" font-weight="bold" fill="#111827">MVP</text>
  <text x="138" y="335" font-size="16" fill="#374151">Presenter가 가운데를 완전히 막는다. View와 Model은 서로 모른다</text>

  <rect x="60" y="362" width="140" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="400" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">View</text>
  <rect x="350" y="362" width="180" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="400" font-size="18" font-weight="bold" text-anchor="middle" fill="#6d28d9">Presenter</text>
  <rect x="680" y="362" width="140" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="750" y="400" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857">Model</text>

  <path d="M202,382 H347" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="275" y="372" font-size="15" text-anchor="middle" fill="#111827">이벤트 전달</text>
  <path d="M348,406 H203" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="275" y="429" font-size="15" text-anchor="middle" fill="#111827">"이걸 그려라"</text>
  <path d="M532,382 H677" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="605" y="372" font-size="15" text-anchor="middle" fill="#111827">조작</text>
  <path d="M678,406 H533" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="605" y="429" font-size="15" text-anchor="middle" fill="#111827">결과</text>

  <text x="60" y="463" font-size="15" fill="#374151">View는 인터페이스 뒤에 있어 가짜로 바꿔 끼울 수 있고,</text>
  <text x="60" y="487" font-size="15" fill="#374151">Presenter가 View를 명령형으로 조종한다 (<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">showError()</tspan>, <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTitle()</tspan>)</text>

  <!-- ───── MVVM ───── -->
  <rect x="24" y="520" width="832" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="556" font-size="22" font-weight="bold" fill="#111827">MVVM</text>
  <text x="138" y="555" font-size="16" fill="#374151">ViewModel은 View를 모른다. 바인딩이 알아서 동기화한다</text>

  <rect x="60" y="582" width="140" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="620" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">View</text>
  <rect x="350" y="582" width="180" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="620" font-size="18" font-weight="bold" text-anchor="middle" fill="#6d28d9">ViewModel</text>
  <rect x="680" y="582" width="140" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="750" y="620" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857">Model</text>

  <path d="M206,614 H344" fill="none" stroke="#6d28d9" stroke-width="3" marker-start="url(#ah-violet-start)" marker-end="url(#ah-violet)"/>
  <text x="275" y="600" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d28d9">데이터 바인딩</text>
  <text x="275" y="640" font-size="15" text-anchor="middle" fill="#6d28d9">(자동 동기화)</text>
  <path d="M532,602 H677" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="605" y="592" font-size="15" text-anchor="middle" fill="#111827">조작</text>
  <path d="M678,626 H533" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="605" y="649" font-size="15" text-anchor="middle" fill="#111827">결과</text>

  <text x="60" y="682" font-size="15" fill="#374151">ViewModel은 "화면에 필요한 상태"를 노출할 뿐 누가 보는지 모른다</text>

  <!-- ───── 요약 ───── -->
  <rect x="24" y="716" width="832" height="50" rx="10" fill="#f3f4f6"/>
  <text x="44" y="747" font-size="16" fill="#111827"><tspan font-weight="bold">View → Model 직접 접근</tspan><tspan dx="18">MVC </tspan><tspan font-weight="bold" fill="#b45309">가능</tspan><tspan>  ·  MVP 불가 (Presenter 경유)  ·  MVVM 불가 (바인딩 경유)</tspan></text>
</svg>
