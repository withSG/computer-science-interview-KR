<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">L1 마름모와 L2 원 제약 영역에 손실 등고선이 처음 닿는 지점</title>
  <desc id="d">같은 손실 등고선이 비제약 최적점 w*에서 바깥으로 넓어질 때, L1 마름모에는 축 위 꼭짓점에서 처음 닿아 그 축의 가중치(w₁)가 정확히 0이 되고, L2 원에는 매끄러운 경계의 축이 아닌 곳에서 닿아 모든 가중치가 작아지되 0은 아니다.</desc>
  <rect width="880" height="610" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="440" y1="24" x2="440" y2="586" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ===== L1 패널 (원점 156,290) ===== -->
  <text x="226" y="44" font-size="19" font-weight="bold" fill="#b45309" text-anchor="middle">L1 제약 (마름모) <tspan font-size="16" font-weight="normal" fill="#4b5563">Lasso</tspan></text>

  <polygon points="228,290 156,218 84,290 156,362" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <line x1="46" y1="290" x2="398" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="156" y1="384" x2="156" y2="84" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="406" y="296" font-size="17" font-weight="bold" fill="#111827">w₁</text>
  <text x="146" y="98" font-size="17" font-weight="bold" fill="#111827" text-anchor="end">w₂</text>
  <circle cx="228" cy="290" r="4" fill="#b45309"/>
  <circle cx="84" cy="290" r="4" fill="#b45309"/>
  <circle cx="156" cy="362" r="4" fill="#b45309"/>

  <ellipse cx="266" cy="175" rx="39.5" ry="13.2" fill="none" stroke="#60a5fa" stroke-width="1.5" transform="rotate(-18 266 175)"/>
  <ellipse cx="266" cy="175" rx="79" ry="26.3" fill="none" stroke="#3b82f6" stroke-width="1.5" transform="rotate(-18 266 175)"/>
  <ellipse cx="266" cy="175" rx="119.7" ry="39.9" fill="none" stroke="#1d4ed8" stroke-width="2.5" transform="rotate(-18 266 175)"/>
  <circle cx="266" cy="175" r="4.5" fill="#1d4ed8"/>
  <line x1="264" y1="106" x2="266" y2="168" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="180" y="100" font-size="15" font-weight="bold" fill="#1d4ed8">비제약 최적점 w*</text>
  <line x1="318" y1="255" x2="309" y2="206" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="300" y="272" font-size="15" fill="#1d4ed8">손실 등고선</text>

  <circle cx="156" cy="218" r="6.5" fill="#b91c1c"/>
  <line x1="138" y1="198" x2="151" y2="213" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="140" y="170" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">첫 접점 (최적 해)</text>
  <text x="140" y="192" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">w₁ = 0</text>

  <text x="48" y="420" font-size="16" fill="#1f2937">꼭짓점이 축 위에 뾰족하게 있다</text>
  <text x="48" y="448" font-size="16" fill="#1f2937">손실 등고선이 확장되며 처음 닿는 곳이</text>
  <text x="48" y="472" font-size="16" fill="#1f2937">꼭짓점일 확률이 높다</text>
  <text x="48" y="502" font-size="17" font-weight="bold" fill="#b45309">→ 그 축의 가중치가 정확히 0</text>
  <rect x="40" y="520" width="372" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="226" y="545" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">특성을 아예 버림</text>
  <text x="226" y="569" font-size="15" fill="#1f2937" text-anchor="middle">희소 해(sparse solution) · 특성 선택 효과</text>

  <!-- ===== L2 패널 (원점 584,290) ===== -->
  <text x="654" y="44" font-size="19" font-weight="bold" fill="#6d28d9" text-anchor="middle">L2 제약 (원) <tspan font-size="16" font-weight="normal" fill="#4b5563">Ridge</tspan></text>

  <circle cx="584" cy="290" r="72" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <line x1="474" y1="290" x2="826" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="584" y1="384" x2="584" y2="84" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="834" y="296" font-size="17" font-weight="bold" fill="#111827">w₁</text>
  <text x="574" y="98" font-size="17" font-weight="bold" fill="#111827" text-anchor="end">w₂</text>

  <ellipse cx="694" cy="175" rx="39.5" ry="13.2" fill="none" stroke="#60a5fa" stroke-width="1.5" transform="rotate(-18 694 175)"/>
  <ellipse cx="694" cy="175" rx="79" ry="26.3" fill="none" stroke="#3b82f6" stroke-width="1.5" transform="rotate(-18 694 175)"/>
  <ellipse cx="694" cy="175" rx="110.4" ry="36.8" fill="none" stroke="#1d4ed8" stroke-width="2.5" transform="rotate(-18 694 175)"/>
  <circle cx="694" cy="175" r="4.5" fill="#1d4ed8"/>
  <line x1="692" y1="106" x2="694" y2="168" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="608" y="100" font-size="15" font-weight="bold" fill="#1d4ed8">비제약 최적점 w*</text>
  <line x1="740" y1="255" x2="734" y2="203" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="722" y="272" font-size="15" fill="#1d4ed8">손실 등고선</text>

  <circle cx="604.5" cy="221" r="6.5" fill="#b91c1c"/>
  <line x1="570" y1="198" x2="599" y2="217" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="568" y="170" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">첫 접점 (최적 해)</text>
  <text x="568" y="192" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">w₁, w₂ ≠ 0</text>

  <text x="476" y="420" font-size="16" fill="#1f2937">경계가 매끄러워 모서리가 없다</text>
  <text x="476" y="448" font-size="16" fill="#1f2937">처음 닿는 곳이 하필 축 위일 확률은</text>
  <text x="476" y="472" font-size="16" fill="#1f2937">사실상 0이다</text>
  <text x="476" y="502" font-size="17" font-weight="bold" fill="#6d28d9">→ 모든 가중치가 작아지되 0은 아님</text>
  <rect x="468" y="520" width="372" height="62" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="654" y="557" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">모든 특성을 조금씩 줄임</text>
</svg>
