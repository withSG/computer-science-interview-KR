<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ARM의 부상</title>
  <desc id="d">1단계 모바일 시대에는 배터리 수명이 중요해 낮은 전력의 ARM이 채택되었고(Apple A 시리즈, Qualcomm Snapdragon 등), 2단계로 Apple M1/M2, AWS Graviton, Microsoft Windows on ARM을 통해 서버/데스크톱으로 침투했다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- 1단계: 모바일 시대 -->
  <rect x="24" y="24" width="832" height="148" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="60" cy="54" r="14" fill="#1d4ed8"/>
  <text x="60" y="59.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="60.5" font-size="19" font-weight="bold" fill="#1e3a8a">모바일 시대</text>

  <rect x="48" y="84" width="196" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="146" y="121.5" font-size="16" fill="#1f2937" text-anchor="middle">배터리 수명이 중요</text>

  <line x1="250" y1="116" x2="300" y2="116" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="308" y="84" width="236" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="426" y="122" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">낮은 전력의 ARM 채택</text>

  <line x1="550" y1="116" x2="600" y2="116" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="608" y="84" width="224" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="720" y="110.5" font-size="15" fill="#1f2937" text-anchor="middle">
    <tspan x="720" y="110.5">Apple A 시리즈,</tspan>
    <tspan x="720" dy="22">Qualcomm Snapdragon 등</tspan>
  </text>

  <!-- 단계 전환 -->
  <line x1="440" y1="178" x2="440" y2="210" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 2단계: 서버/데스크톱 침투 -->
  <rect x="24" y="218" width="832" height="228" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <circle cx="60" cy="248" r="14" fill="#6d28d9"/>
  <text x="60" y="253.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="254.5" font-size="19" font-weight="bold" fill="#4c1d95">서버/데스크톱 침투</text>

  <!-- Apple M1/M2 -->
  <rect x="48" y="276" width="248" height="150" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="172" y="310" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Apple M1/M2</text>
  <text x="172" y="335" font-size="15" fill="#4b5563" text-anchor="middle">(ARM 기반)</text>
  <line x1="172" y1="346" x2="172" y2="364" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="64" y="370" width="216" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="172" y="395.5" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">x86 대비 성능/와트 압도</text>

  <!-- AWS Graviton -->
  <rect x="316" y="276" width="248" height="150" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="440" y="345" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">AWS Graviton</text>
  <text x="440" y="370" font-size="15" fill="#4b5563" text-anchor="middle">(ARM 기반 서버)</text>

  <!-- Microsoft Windows on ARM -->
  <rect x="584" y="276" width="248" height="150" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="708" y="345" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Windows on ARM</text>
  <text x="708" y="370" font-size="15" fill="#4b5563" text-anchor="middle">(Microsoft)</text>
</svg>
