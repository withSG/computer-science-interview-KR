<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ARM의 부상</title>
  <desc id="d">모바일 시대에서의 ARM 채택 원인과 서버/데스크탑 분야로의 침투 및 확장 사례를 나타낸 다이어그램입니다.</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 상단 그룹: 모바일 시대 -->
  <rect x="24" y="20" width="832" height="150" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="40" y="49.6" font-size="16" font-weight="bold" fill="#1f2933">모바일 시대:</text>

  <!-- 모바일 시대 화살표 1: 배터리 수명이 중요 -> 낮은 전력의 ARM 채택 -->
  <rect x="40" y="65" width="220" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="150" y="87.55" font-size="13" fill="#1f2933" text-anchor="middle">배터리 수명이 중요</text>

  <path d="M260,83 L340,83" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="340" y="65" width="230" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="455" y="87.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">낮은 전력의 ARM 채택</text>

  <!-- 모바일 시대 화살표 2: Apple A 시리즈, Qualcomm Snapdragon 등 -->
  <path d="M455,101 L455,117" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="40" y="120" width="800" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="142.55" font-size="13" fill="#52606d" text-anchor="middle">Apple A 시리즈, Qualcomm Snapdragon 등</text>

  <!-- 하단 그룹: 서버/데스크탑 침투 -->
  <rect x="24" y="190" width="832" height="160" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="40" y="219.6" font-size="16" font-weight="bold" fill="#1f2933">서버/데스크탑 침투:</text>

  <!-- 하단 항목 1: Apple M1/M2 -> x86 대비 성능/와트 압도 -->
  <rect x="40" y="235" width="240" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="160" y="255.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">Apple M1/M2 (ARM 기반)</text>

  <path d="M280,251 L350,251" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="350" y="235" width="270" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="485" y="255.55" font-size="13" fill="#1f2933" text-anchor="middle">x86 대비 성능/와트 압도</text>

  <!-- 하단 항목 2: AWS Graviton -->
  <rect x="40" y="273" width="310" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="195" y="293.55" font-size="13" fill="#1f2933" text-anchor="middle">AWS Graviton (ARM 기반 서버)</text>

  <!-- 하단 항목 3: Microsoft Windows on ARM -->
  <rect x="40" y="311" width="310" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="195" y="331.55" font-size="13" fill="#1f2933" text-anchor="middle">Microsoft Windows on ARM</text>
</svg>