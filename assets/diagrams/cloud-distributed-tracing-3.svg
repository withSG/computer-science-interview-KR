<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">traceparent 헤더</title>
  <desc id="d">W3C Trace Context의 traceparent 및 tracestate 헤더 구조 다이어그램</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 헤더 이름 -->
  <text x="30" y="38" font-size="14" font-weight="bold" fill="#1f2933">traceparent:</text>

  <!-- traceparent 값 박스들 -->
  <!-- version: 00 -->
  <rect x="125" y="20" width="36" height="28" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="143" y="38" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">00</text>

  <!-- 구분자 - -->
  <text x="166" y="38" font-size="13" font-weight="bold" fill="#9aa5b1" text-anchor="middle">-</text>

  <!-- trace-id: 4bf92f3577b34da6a3ce929d0e0e4736 -->
  <rect x="173" y="20" width="280" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="313" y="38" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">4bf92f3577b34da6a3ce929d0e0e4736</text>

  <!-- 구분자 - -->
  <text x="458" y="38" font-size="13" font-weight="bold" fill="#9aa5b1" text-anchor="middle">-</text>

  <!-- parent-id: 00f067aa0ba902b7 -->
  <rect x="465" y="20" width="150" height="28" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="540" y="38" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">00f067aa0ba902b7</text>

  <!-- 구분자 - -->
  <text x="620" y="38" font-size="13" font-weight="bold" fill="#9aa5b1" text-anchor="middle">-</text>

  <!-- trace-flags: 01 -->
  <rect x="627" y="20" width="36" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="645" y="38" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">01</text>

  <!-- 지시선 및 수직 연장선 -->
  <!-- 1. trace-flags 지시선 -->
  <path d="M645,48 L645,62 L710,62" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- 2. parent-id 지시선 -->
  <path d="M540,48 L540,122 L570,122" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <!-- 3. trace-id 지시선 -->
  <path d="M313,48 L313,182 L340,182" fill="none" stroke="#059669" stroke-width="1.5"/>
  <!-- 4. version 지시선 -->
  <path d="M143,48 L143,212 L200,212" fill="none" stroke="#2563eb" stroke-width="1.5"/>

  <!-- 설명 텍스트 라벨 (원본 다이어그램 문자열 100% 일치) -->
  
  <!-- trace-flags 설명 -->
  <text x="715" y="66" font-size="13" font-weight="bold" fill="#7c3aed">trace-flags</text>
  <text x="715" y="92" font-size="13" fill="#52606d">01 = 샘플링됨 / 00 = 아님</text>

  <!-- parent-id 설명 -->
  <text x="575" y="126" font-size="13" font-weight="bold" fill="#d97706">parent-id (8바이트, 16 hex)</text>
  <text x="575" y="152" font-size="13" fill="#52606d">= 요청을 보낸 쪽의 span_id</text>

  <!-- trace-id 설명 -->
  <text x="345" y="186" font-size="13" stroke="none"><tspan font-weight="bold" fill="#059669">trace-id (16바이트, 32 hex)</tspan><tspan fill="#52606d"> = 요청 전체 식별. 절대 안 바뀐다</tspan></text>

  <!-- version 설명 -->
  <text x="205" y="216" font-size="13" stroke="none"><tspan font-weight="bold" fill="#2563eb">version</tspan><tspan fill="#52606d"> (현재 00)</tspan></text>

  <!-- 하단 구분선 -->
  <line x1="30" y1="260" x2="850" y2="260" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- tracestate 영역 -->
  <text x="30" y="308" font-size="14" font-weight="bold" fill="#1f2933">tracestate:</text>
  
  <rect x="125" y="290" width="225" height="28" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="237" y="308" font-size="13" fill="#1f2933" text-anchor="middle">vendorA=abc,vendorB=def</text>

  <!-- tracestate 주석 화살표 및 설명 -->
  <path d="M365,304 L415,304" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="425" y="308" font-size="13" fill="#52606d">벤더별 부가 정보</text>

</svg>