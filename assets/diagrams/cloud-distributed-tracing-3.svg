<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">traceparent 헤더 구조</title>
  <desc id="d">traceparent 값 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01을 version(현재 00), trace-id(16바이트, 32 hex, 요청 전체 식별, 절대 안 바뀜), parent-id(8바이트, 16 hex, 요청을 보낸 쪽의 span_id), trace-flags(01 = 샘플링됨, 00 = 아님) 네 필드로 나눈다. tracestate는 벤더별 부가 정보를 담는다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- traceparent 값 -->
  <text x="56" y="70" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">traceparent:</text>

  <rect x="188" y="46" width="38" height="36" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="207" y="70" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">00</text>
  <text x="233" y="70" font-size="17" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">-</text>

  <rect x="240" y="46" width="342" height="36" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="411" y="70" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">4bf92f3577b34da6a3ce929d0e0e4736</text>
  <text x="589" y="70" font-size="17" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">-</text>

  <rect x="596" y="46" width="180" height="36" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="686" y="70" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">00f067aa0ba902b7</text>
  <text x="783" y="70" font-size="17" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">-</text>

  <rect x="790" y="46" width="38" height="36" rx="5" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="809" y="70" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">01</text>

  <!-- 지시선 -->
  <line x1="207" y1="84" x2="207" y2="122" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="335" y1="84" x2="335" y2="122" stroke="#047857" stroke-width="2"/>
  <line x1="620" y1="84" x2="620" y2="122" stroke="#b45309" stroke-width="2"/>
  <line x1="809" y1="84" x2="809" y2="122" stroke="#6d28d9" stroke-width="2"/>

  <!-- 필드 설명 카드 -->
  <rect x="24" y="122" width="199" height="118" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="40" y="151" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">version</text>
  <text x="40" y="178" font-size="15" fill="#111827">현재 00</text>

  <rect x="235" y="122" width="199" height="118" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="251" y="151" font-size="17" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">trace-id</text>
  <text x="251" y="178" font-size="15" fill="#111827">16바이트, 32 hex</text>
  <text x="251" y="201" font-size="15" fill="#111827">= 요청 전체 식별</text>
  <text x="251" y="224" font-size="15" font-weight="bold" fill="#047857">절대 안 바뀐다</text>

  <rect x="446" y="122" width="199" height="118" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="462" y="151" font-size="17" font-weight="bold" fill="#b45309" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">parent-id</text>
  <text x="462" y="178" font-size="15" fill="#111827">8바이트, 16 hex</text>
  <text x="462" y="201" font-size="15" fill="#111827">= 요청을 보낸 쪽의</text>
  <text x="462" y="224" font-size="15" font-weight="bold" fill="#b45309" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">span_id</text>

  <rect x="657" y="122" width="199" height="118" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="673" y="151" font-size="17" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">trace-flags</text>
  <text x="673" y="178" font-size="15" fill="#111827">01 = 샘플링됨</text>
  <text x="673" y="201" font-size="15" fill="#111827">00 = 아님</text>

  <line x1="24" y1="266" x2="856" y2="266" stroke="#d1d5db" stroke-width="1"/>

  <!-- tracestate -->
  <text x="56" y="312" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">tracestate:</text>
  <rect x="188" y="288" width="256" height="36" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="316" y="312" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">vendorA=abc,vendorB=def</text>
  <line x1="518" y1="306" x2="450" y2="306" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="528" y="311.5" font-size="16" fill="#374151">벤더별 부가 정보</text>
</svg>
