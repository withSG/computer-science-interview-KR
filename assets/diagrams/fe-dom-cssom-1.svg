<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="880" height="670" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HTML 바이트에서 DOM 트리까지</title>
  <desc id="d">바이트가 인코딩 해석으로 문자가 되고, 토큰화로 토큰이 되고, 노드 객체가 생성된 뒤 부모-자식 관계로 연결되어 DOM 트리가 되는 다섯 단계를 단계별 예시 값과 함께 보여줍니다. 각 단계의 예시는 일부만 보여 주며 나머지는 …로 줄였습니다.</desc>
  <rect width="880" height="670" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- ① 바이트 -->
  <rect x="32" y="32" width="168" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="116" y="64" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">① 바이트</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="232" y="41" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="251" y="63">3C</text>
    <rect x="276" y="41" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="295" y="63">68</text>
    <rect x="320" y="41" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="339" y="63">74</text>
    <rect x="364" y="41" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="383" y="63">6D</text>
    <rect x="408" y="41" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="427" y="63">6C</text>
    <rect x="452" y="41" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="471" y="63">3E</text>
  </g>
  <text x="500" y="63" font-size="16" fill="#4b5563">…</text>

  <!-- 인코딩 해석 -->
  <path d="M116,88 V134" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="136" y="117" font-size="15" fill="#1d4ed8">인코딩 해석 (<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Content-Type</tspan> / <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;meta charset&gt;</tspan>)</text>

  <!-- ② 문자 -->
  <rect x="32" y="140" width="168" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="116" y="172" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">② 문자</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="232" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="251" y="171">&lt;</text>
    <rect x="276" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="295" y="171">h</text>
    <rect x="320" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="339" y="171">t</text>
    <rect x="364" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="383" y="171">m</text>
    <rect x="408" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="427" y="171">l</text>
    <rect x="452" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="471" y="171">&gt;</text>
    <rect x="496" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="515" y="171">&lt;</text>
    <rect x="540" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="559" y="171">b</text>
    <rect x="584" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="603" y="171">o</text>
    <rect x="628" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="647" y="171">d</text>
    <rect x="672" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="691" y="171">y</text>
    <rect x="716" y="149" width="38" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="735" y="171">&gt;</text>
  </g>
  <text x="764" y="171" font-size="16" fill="#4b5563">…</text>

  <!-- 토큰화 -->
  <path d="M116,196 V242" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="136" y="225" font-size="15" fill="#1d4ed8">토큰화 (HTML 파서)</text>

  <!-- ③ 토큰 -->
  <rect x="32" y="248" width="168" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="116" y="280" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">③ 토큰</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="232" y="257" width="137" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="300.5" y="279">StartTag:html</text>
    <rect x="377" y="257" width="137" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="445.5" y="279">StartTag:body</text>
    <rect x="522" y="257" width="158" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="601" y="279">Character:"안녕"</text>
    <rect x="688" y="257" width="121" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="748.5" y="279">EndTag:body</text>
  </g>
  <text x="818" y="279" font-size="16" fill="#4b5563">…</text>

  <!-- 노드 객체 생성 -->
  <path d="M116,304 V350" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="136" y="333" font-size="15" fill="#1d4ed8">노드 객체 생성</text>

  <!-- ④ 노드 -->
  <rect x="32" y="356" width="168" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="116" y="388" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">④ 노드</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="232" y="365" width="155" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="309.5" y="387">HTMLHtmlElement</text>
    <rect x="395" y="365" width="155" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="472.5" y="387">HTMLBodyElement</text>
    <rect x="558" y="365" width="60" height="34" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="588" y="387">Text</text>
  </g>
  <text x="628" y="387" font-size="16" fill="#4b5563">…</text>

  <!-- 부모-자식 관계로 연결 -->
  <path d="M116,412 V458" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="136" y="441" font-size="15" fill="#1d4ed8">부모-자식 관계로 연결</text>

  <!-- ⑤ DOM 트리 (일부만 표시, 나머지는 …) -->
  <rect x="32" y="464" width="168" height="176" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="116" y="558" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">⑤ DOM 트리</text>

  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M248,508 V575 H270"/>
    <path d="M248,533 H270"/>
    <path d="M288,594 V617 H310"/>
  </g>
  <text x="278" y="535" font-size="16" fill="#4b5563">…</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="232" y="472" width="155" height="34" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="309.5" y="494">HTMLHtmlElement</text>
    <rect x="272" y="558" width="155" height="34" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="349.5" y="580">HTMLBodyElement</text>
    <rect x="312" y="600" width="113" height="34" rx="4" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="368.5" y="622">Text "안녕"</text>
  </g>
  <text x="435" y="622" font-size="16" fill="#4b5563">…</text>
</svg>
