<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LCP 시간의 네 조각</title>
  <desc id="d">LCP까지의 시간은 [1] TTFB, [2] 리소스 발견 지연, [3] 리소스 다운로드, [4] 렌더 지연 네 조각이 차례로 이어진 것이다. 각 조각 아래에 그 구간이 무엇을 기다리는 시간인지 적었다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="270" fill="#ffffff"/>

  <!-- 요점 캡션 -->
  <text x="24" y="36" font-size="18" font-weight="bold" fill="#111827">LCP까지의 시간 = [1] + [2] + [3] + [4]</text>

  <!-- 조각 막대 -->
  <rect x="24" y="58" width="176" height="64" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="112" y="84" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">[1]</text>
  <text x="112" y="108" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">TTFB</text>

  <rect x="206" y="58" width="176" height="64" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="294" y="84" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">[2]</text>
  <text x="294" y="108" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">리소스 발견 지연</text>

  <rect x="388" y="58" width="176" height="64" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="476" y="84" font-size="15" font-weight="bold" fill="#064e3b" text-anchor="middle">[3]</text>
  <text x="476" y="108" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">리소스 다운로드</text>

  <rect x="570" y="58" width="176" height="64" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="658" y="84" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">[4]</text>
  <text x="658" y="108" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">렌더 지연</text>

  <!-- 시간축 → LCP -->
  <line x1="24" y1="140" x2="762" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="768" y1="52" x2="768" y2="150" stroke="#111827" stroke-width="3"/>
  <text x="780" y="96" font-size="22" font-weight="bold" fill="#111827">LCP</text>

  <g stroke="#374151" stroke-width="2">
    <line x1="24" y1="133" x2="24" y2="147"/>
    <line x1="203" y1="133" x2="203" y2="147"/>
    <line x1="385" y1="133" x2="385" y2="147"/>
    <line x1="567" y1="133" x2="567" y2="147"/>
  </g>

  <!-- 조각별 설명 -->
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="112" y="176">서버가 첫 바이트를<tspan x="112" dy="22">보내기까지</tspan></text>
    <text x="294" y="176">브라우저가 그 이미지의<tspan x="294" dy="22">존재를 알기까지</tspan></text>
    <text x="476" y="176">실제로 받는 시간</text>
    <text x="658" y="176">받았는데 화면에<tspan x="658" dy="22">그리기까지</tspan></text>
    <text x="658" y="224" fill="#4b5563">(메인 스레드가<tspan x="658" dy="22">막혀 있었다)</tspan></text>
  </g>
</svg>
