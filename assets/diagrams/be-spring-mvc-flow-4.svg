<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Filter · Interceptor · AOP의 층</title>
  <desc id="d">요청은 서블릿 컨테이너가 관리하는 Filter, DispatcherServlet, Spring MVC가 관리하는 Interceptor, Spring 컨테이너가 관리하는 AOP Proxy를 차례로 지나 Controller / Service / Repository에 닿고, 돌아 나오며 DispatcherServlet에서 응답이 생성된다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- [1] Filter -->
  <rect x="104" y="24" width="672" height="442" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="128" y="57" font-size="19" font-weight="bold" fill="#1d4ed8">[1] Filter</text>
  <rect x="252" y="37" width="190" height="28" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="347" y="56" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">서블릿 컨테이너가 관리</text>
  <text x="128" y="88" font-size="15" fill="#1f2937">아직 Spring이 아니다 · HttpServletRequest/Response를 통째로 교체 가능</text>

  <!-- DispatcherServlet -->
  <rect x="128" y="108" width="624" height="334" rx="10" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="152" y="137" font-size="17" font-weight="bold" fill="#1f2937">DispatcherServlet</text>

  <!-- [2] Interceptor -->
  <rect x="152" y="156" width="460" height="262" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="176" y="188" font-size="19" font-weight="bold" fill="#047857">[2] Interceptor</text>
  <rect x="352" y="168" width="164" height="28" rx="14" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="434" y="187" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Spring MVC가 관리</text>
  <text x="176" y="217" font-size="15" fill="#1f2937">핸들러가 누구인지 안다</text>

  <!-- [3] AOP Proxy -->
  <rect x="176" y="234" width="412" height="160" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="200" y="266" font-size="19" font-weight="bold" fill="#6d28d9">[3] AOP Proxy</text>
  <rect x="348" y="246" width="200" height="28" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="448" y="265" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">Spring 컨테이너가 관리</text>
  <text x="200" y="295" font-size="15" fill="#1f2937">HTTP를 전혀 모른다</text>

  <rect x="200" y="312" width="364" height="60" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="382" y="348" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Controller / Service / Repository</text>

  <!-- 요청 → -->
  <rect x="24" y="322" width="60" height="40" rx="20" fill="#111827"/>
  <text x="54" y="348" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">요청</text>
  <line x1="86" y1="342" x2="198" y2="342" stroke="#111827" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- → 응답 생성 → 응답 -->
  <line x1="566" y1="342" x2="630" y2="342" stroke="#111827" stroke-width="2.5" marker-end="url(#ak)"/>
  <rect x="632" y="320" width="100" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="682" y="348" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">응답 생성</text>
  <line x1="734" y1="342" x2="794" y2="342" stroke="#111827" stroke-width="2.5" marker-end="url(#ak)"/>
  <rect x="796" y="322" width="60" height="40" rx="20" fill="#111827"/>
  <text x="826" y="348" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">응답</text>
</svg>
