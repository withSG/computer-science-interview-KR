<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">에이전트 도입 판단 흐름</title>
  <desc id="d">작업이 들어오면 세 가지 질문을 차례로 거쳐 단순 LLM 호출, RAG, 워크플로우, 에이전트 중 하나를 고릅니다. 가장 단순한 방식부터 시도하고, 절차를 코드로 다 적을 수 없을 때만 에이전트를 씁니다.</desc>
  <rect width="880" height="610" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="100" y="24" width="200" height="40" rx="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200" y="50" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">작업이 들어온다</text>
  <path d="M200,64 L200,96" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <!-- 질문 1 -->
  <rect x="40" y="100" width="320" height="52" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="132" font-size="16" fill="#111827" text-anchor="middle">모델이 이미 아는 지식으로 되나?</text>
  <path d="M360,126 L456,126" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="408" y="114" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">예</text>
  <path d="M200,152 L200,224" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="212" y="194" font-size="15" font-weight="bold" fill="#111827">아니오</text>

  <!-- 결과 1: 단순 LLM 호출 -->
  <rect x="460" y="79" width="380" height="94" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="482" y="108" font-size="18" font-weight="bold" fill="#1d4ed8">단순 LLM 호출</text>
  <text x="482" y="136" font-size="15" fill="#374151">분류·요약·추출</text>
  <text x="482" y="158" font-size="15" fill="#374151">1회, 빠르고 저렴</text>

  <!-- 질문 2 -->
  <rect x="40" y="228" width="320" height="52" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="260" font-size="16" fill="#111827" text-anchor="middle">외부 지식이 필요한가?</text>
  <path d="M360,254 L456,254" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="408" y="242" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">예</text>

  <!-- 결과 2: RAG -->
  <rect x="460" y="228" width="380" height="52" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="482" y="260" font-size="18" font-weight="bold" fill="#1d4ed8">RAG</text>

  <!-- RAG 로도 부족하면 질문 3 으로 -->
  <path d="M650,280 L650,326 L200,326 L200,366" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="662" y="309" font-size="15" font-weight="bold" fill="#111827">여전히 부족</text>

  <!-- 질문 3 -->
  <rect x="40" y="370" width="320" height="52" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="402" font-size="16" fill="#111827" text-anchor="middle">절차를 코드로 다 적을 수 있나?</text>
  <path d="M360,396 L456,396" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="408" y="384" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">예</text>
  <path d="M200,422 L200,540 L456,540" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="212" y="480" font-size="15" font-weight="bold" fill="#111827">아니오</text>

  <!-- 결과 3: 워크플로우 -->
  <rect x="460" y="349" width="380" height="94" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="482" y="378" font-size="18" font-weight="bold" fill="#1d4ed8">워크플로우</text>
  <text x="482" y="406" font-size="15" fill="#374151">흐름은 <tspan font-weight="bold" fill="#111827">개발자가</tspan> 정하고</text>
  <text x="482" y="428" font-size="15" fill="#374151">각 단계에 LLM을 쓴다</text>

  <!-- 결과 4: 에이전트 -->
  <rect x="460" y="493" width="380" height="94" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="482" y="522" font-size="18" font-weight="bold" fill="#6d28d9">에이전트</text>
  <text x="482" y="550" font-size="15" fill="#374151">경로를 <tspan font-weight="bold" fill="#111827">모델이</tspan> 결정</text>
  <text x="482" y="572" font-size="15" fill="#374151">비싸고 느리고 디버깅이 어렵다</text>
</svg>
