<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐시 스탬피드</title>
  <desc id="d">만료 직전에는 App의 5000 rps를 캐시가 받아 DB가 한산하지만, 만료 순간에는 키가 없어 5000 rps가 전부 캐시를 통과해 DB로 몰리고 5000개 동시 쿼리가 커넥션 풀 고갈과 장애로 이어진다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ① 만료 직전 -->
  <rect x="24" y="24" width="400" height="500" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="224" y="60" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">① 만료 직전</text>

  <rect x="124" y="84" width="200" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="224" y="122" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Cache</text>

  <line x1="224" y1="250" x2="224" y2="156" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="240" y="208" font-size="16" font-weight="bold" fill="#1d4ed8">5000 rps</text>

  <rect x="124" y="252" width="200" height="56" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="224" y="286" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">App</text>

  <rect x="124" y="408" width="200" height="56" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="224" y="442" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">DB</text>
  <text x="224" y="500" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">DB는 한산</text>

  <!-- ② 만료 순간 -->
  <rect x="456" y="24" width="400" height="500" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="656" y="60" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">② 만료 순간</text>

  <rect x="556" y="84" width="200" height="64" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="656" y="110" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Cache</text>
  <text x="656" y="135" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">(키 없음)</text>

  <line x1="656" y1="250" x2="656" y2="156" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="672" y="208" font-size="16" font-weight="bold" fill="#1d4ed8">5000 rps</text>

  <rect x="556" y="252" width="200" height="56" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="656" y="286" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">App</text>

  <line x1="656" y1="310" x2="656" y2="394" stroke="#b91c1c" stroke-width="6" marker-end="url(#ah-red)"/>
  <text x="676" y="358" font-size="16" font-weight="bold" fill="#b91c1c">5000 rps 전부 통과</text>

  <rect x="556" y="408" width="200" height="56" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="656" y="442" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">DB</text>
  <text x="656" y="500" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">5000개 동시 쿼리 → 커넥션 풀 고갈 → 장애</text>
</svg>
