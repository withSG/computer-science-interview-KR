<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Filter 예외와 @ControllerAdvice의 경계</title>
  <desc id="d">Filter에서 던진 예외는 DispatcherServlet의 예외 처리 구간 밖이라 @ControllerAdvice가 잡지 못하고, 서블릿 컨테이너가 에러 페이지 경로(Spring Boot는 /error → BasicErrorController)로 다시 디스패치해 Spring Boot 기본 에러 응답이 나간다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 구간 밖: Filter -->
  <rect x="24" y="24" width="380" height="136" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="54" font-size="16" font-weight="bold" fill="#b91c1c">DispatcherServlet의 예외 처리 구간 밖</text>
  <rect x="84" y="74" width="260" height="60" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="214" y="110" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">Filter에서 던진 예외</text>

  <!-- 구간 안: @ControllerAdvice -->
  <rect x="496" y="24" width="360" height="136" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="516" y="54" font-size="16" font-weight="bold" fill="#1d4ed8">DispatcherServlet의 예외 처리 구간</text>
  <rect x="546" y="74" width="260" height="60" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="676" y="110" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">@ControllerAdvice</text>

  <!-- 막힌 화살표 -->
  <line x1="346" y1="104" x2="434" y2="104" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="450" cy="104" r="15" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <path d="M442,96 L458,112 M458,96 L442,112" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="450" y="194" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">@ControllerAdvice가 못 잡는다</text>

  <!-- 컨테이너가 다시 디스패치 -->
  <line x1="214" y1="136" x2="214" y2="226" stroke="#374151" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="24" y="228" width="440" height="72" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="244" y="258" font-size="15" fill="#374151" text-anchor="middle">서블릿 컨테이너가</text>
  <text x="244" y="283" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">에러 페이지 경로로 다시 디스패치</text>

  <line x1="466" y1="264" x2="510" y2="264" stroke="#374151" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="512" y="228" width="344" height="72" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="684" y="258" font-size="15" fill="#374151" text-anchor="middle">Spring Boot는</text>
  <text x="684" y="284" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/error → BasicErrorController</text>

  <line x1="684" y1="302" x2="684" y2="338" stroke="#374151" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="512" y="340" width="344" height="76" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="684" y="370" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Spring Boot 기본 에러 응답</text>
  <text x="684" y="396" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">timestamp, status, error, path</text>
</svg>
