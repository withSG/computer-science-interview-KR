<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세 영역과 명령어</title>
  <desc id="d">작업 디렉터리, 스테이징 영역(index), 로컬 저장소 세 영역과 원격 저장소를 열로 세우고, git add·commit은 오른쪽으로, git restore·restore --staged·reset --hard는 왼쪽으로 내용을 옮기는 화살표로 보인다. restore는 index를, restore --staged는 HEAD를 기준으로 되돌리고, reset --hard는 세 영역을 전부 특정 커밋 상태로 만든다. push와 fetch는 로컬 저장소와 원격 저장소 사이를 오간다.</desc>
  <rect width="880" height="700" fill="#ffffff"/>

  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-brown" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 세 영역 묶음 -->
  <rect x="24" y="24" width="688" height="534" rx="10" fill="#f8fafc"/>
  <text x="40" y="48" font-size="15" font-weight="bold" fill="#4b5563">세 영역</text>

  <!-- 영역 상자 -->
  <rect x="34" y="62" width="184" height="110" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="126" y="94" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">작업 디렉터리</text>
  <text x="126" y="122" font-size="15" fill="#1d4ed8" text-anchor="middle">Working Dir</text>
  <text x="126" y="150" font-size="15" fill="#4b5563" text-anchor="middle">눈에 보이는 파일</text>

  <rect x="276" y="62" width="184" height="110" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="368" y="94" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">스테이징 영역</text>
  <text x="368" y="122" font-size="15" fill="#b45309" text-anchor="middle">Index <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(.git/index)</tspan></text>

  <rect x="518" y="62" width="184" height="110" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="610" y="94" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">로컬 저장소</text>
  <text x="610" y="122" font-size="15" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.git/objects</text>
  <text x="610" y="150" font-size="15" fill="#4b5563" text-anchor="middle">커밋으로 확정된 이력</text>

  <rect x="728" y="62" width="124" height="110" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="790" y="94" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">원격 저장소</text>
  <text x="790" y="122" font-size="15" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">origin</text>

  <!-- 영역 세로선 -->
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5" fill="none">
    <line x1="126" y1="172" x2="126" y2="540"/>
    <line x1="368" y1="172" x2="368" y2="540"/>
    <line x1="610" y1="172" x2="610" y2="670"/>
    <line x1="790" y1="172" x2="790" y2="670"/>
  </g>

  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" text-anchor="middle">
    <!-- 1. git add -->
    <circle cx="126" cy="222" r="4.5" fill="#1d4ed8"/>
    <line x1="126" y1="222" x2="368" y2="222" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar-blue)"/>
    <text x="247" y="210" fill="#1d4ed8">git add</text>

    <!-- 2. git commit -->
    <circle cx="368" cy="282" r="4.5" fill="#1d4ed8"/>
    <line x1="368" y1="282" x2="610" y2="282" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar-blue)"/>
    <text x="489" y="270" fill="#1d4ed8">git commit</text>

    <!-- 3. restore file -->
    <circle cx="368" cy="352" r="4.5" fill="#b45309"/>
    <line x1="368" y1="352" x2="126" y2="352" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar-brown)"/>
    <text x="247" y="340" fill="#b45309">git restore &lt;file&gt;</text>

    <!-- 4. restore staged -->
    <circle cx="610" cy="432" r="4.5" fill="#b45309"/>
    <line x1="610" y1="432" x2="368" y2="432" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar-brown)"/>
    <text x="489" y="420" fill="#b45309">git restore --staged &lt;file&gt;</text>

    <!-- 5. reset hard -->
    <circle cx="610" cy="512" r="4.5" fill="#b91c1c"/>
    <line x1="610" y1="512" x2="126" y2="512" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar-red)"/>
    <circle cx="368" cy="512" r="5.5" fill="#b91c1c"/>
    <text x="489" y="500" fill="#b91c1c">git reset --hard &lt;c&gt;</text>

    <!-- 6. git push / 7. git fetch -->
    <circle cx="610" cy="592" r="4.5" fill="#047857"/>
    <line x1="610" y1="592" x2="790" y2="592" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
    <text x="700" y="580" fill="#047857">git push</text>

    <circle cx="790" cy="652" r="4.5" fill="#047857"/>
    <line x1="790" y1="652" x2="610" y2="652" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
    <text x="700" y="640" fill="#047857">git fetch</text>
  </g>

  <!-- 되돌리기 설명 -->
  <g font-size="15" fill="#4b5563" text-anchor="middle">
    <text x="247" y="378">index 내용으로 파일을 되돌린다</text>
    <text x="489" y="458">HEAD 내용으로 index만 되돌린다</text>
    <text x="489" y="538">세 영역을 전부 특정 커밋 상태로</text>
  </g>

  <!-- pull 정의 -->
  <rect x="34" y="598" width="506" height="48" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="50" y="628" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#047857">git pull</tspan> = <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git fetch</tspan> + <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git merge</tspan> (또는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">--rebase</tspan> 시 rebase)</text>
</svg>
