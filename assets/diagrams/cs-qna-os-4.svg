<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">다단계 피드백 큐 (MLFQ, Multilevel Feedback Queue) — 선점</title>
  <desc id="d">MLFQ 스케줄링의 구조, 프로세스 이동 경로, 장점 및 Linux CFS 연관성에 대한 요약 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 헤더 영역 -->
  <rect x="24" y="24" width="832" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="440" y="53" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">#### 6. 다단계 피드백 큐 (MLFQ, Multilevel Feedback Queue) — 선점</text>

  <!-- 메인 흐름 및 구조 섹션 -->
  <!-- 1. 여러 개의 Ready Queue -->
  <rect x="24" y="92" width="832" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">여러 개의 Ready Queue (높은 우선순위 ~ 낮은 우선순위)</text>

  <!-- 연결 화살표 1 -->
  <path d="M440,152 L440,172" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 2. 새 프로세스 배치 -->
  <rect x="200" y="172" width="480" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">새 프로세스는 가장 높은 우선순위 큐에 배치</text>

  <!-- 연결 화살표 2 -->
  <path d="M440,216 L440,236" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 3. 강등 조건 -->
  <rect x="200" y="236" width="480" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">할당량 내 완료 못하면 → 낮은 우선순위 큐로 이동</text>

  <!-- 장점 및 특성 섹션 (분할 박스) -->
  <rect x="24" y="300" width="832" height="110" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  
  <text x="44" y="330" font-size="14" font-weight="bold" fill="#059669">장점:</text>
  <text x="95" y="330" font-size="13" fill="#1f2933">I/O 위주 프로세스(짧은 CPU 버스트)가 높은 우선순위 유지</text>
  <text x="95" y="360" font-size="13" fill="#1f2933">CPU 위주 프로세스는 점점 낮은 큐로 이동</text>

  <!-- 하단 꼬리표/연관성 -->
  <path d="M440,410 L440,430" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  
  <rect x="200" y="430" width="480" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="440" y="454" text-anchor="middle" font-size="13" fill="#52606d">→ Linux의 CFS(Completely Fair Scheduler)도 이 개념 기반</text>
</svg>