<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">다단계 피드백 큐</title>
  <desc id="d">우선순위별로 여러 개의 Ready Queue가 있고, 새 프로세스는 가장 높은 우선순위 큐에 들어가며 할당량 내에 끝나지 못하면 한 단계 낮은 큐로 내려간다. 그래서 I/O 위주 프로세스는 높은 우선순위를 유지하고 CPU 위주 프로세스는 점점 낮은 큐로 이동한다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="17" font-weight="bold" fill="#111827">여러 개의 Ready Queue (높은 우선순위 ~ 낮은 우선순위)</text>

  <!-- 새 프로세스 진입 -->
  <rect x="40" y="74" width="140" height="44" rx="22" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="110" y="102" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">새 프로세스</text>
  <line x1="182" y1="96" x2="226" y2="96" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <text x="110" y="144" font-size="15" fill="#374151" text-anchor="middle">가장 높은 우선순위</text>
  <text x="110" y="164" font-size="15" fill="#374151" text-anchor="middle">큐에 배치</text>

  <!-- 큐 1 -->
  <rect x="230" y="70" width="340" height="52" rx="6" fill="#f8fafc" stroke="#4b5563" stroke-width="1.5"/>
  <text x="246" y="102" font-size="16" font-weight="bold" fill="#111827">큐 1 · 높은 우선순위</text>
  <rect x="460" y="80" width="96" height="32" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="508" y="102" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">I/O 위주</text>

  <!-- 큐 2 -->
  <rect x="230" y="160" width="340" height="52" rx="6" fill="#f8fafc" stroke="#4b5563" stroke-width="1.5"/>
  <text x="246" y="192" font-size="16" font-weight="bold" fill="#111827">큐 2</text>

  <!-- 생략 -->
  <text x="400" y="244" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">⋮</text>

  <!-- 큐 n -->
  <rect x="230" y="262" width="340" height="52" rx="6" fill="#f8fafc" stroke="#4b5563" stroke-width="1.5"/>
  <text x="246" y="294" font-size="16" font-weight="bold" fill="#111827">큐 n · 낮은 우선순위</text>
  <rect x="452" y="272" width="104" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="504" y="294" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">CPU 위주</text>

  <!-- 강등 화살표 -->
  <path d="M570,104 C618,104 618,178 574,178" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#down)"/>
  <path d="M570,196 C618,196 618,280 574,280" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#down)"/>
  <text x="636" y="186" font-size="16" font-weight="bold" fill="#92400e">할당량 내 완료 못하면</text>
  <text x="636" y="210" font-size="16" fill="#1f2937">→ 낮은 우선순위 큐로 이동</text>

  <!-- 장점 -->
  <text x="40" y="360" font-size="17" font-weight="bold" fill="#047857">장점</text>
  <rect x="40" y="374" width="390" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="58" y="406" font-size="16" font-weight="bold" fill="#111827">I/O 위주 프로세스(짧은 CPU 버스트)</text>
  <text x="58" y="436" font-size="16" font-weight="bold" fill="#1d4ed8">→ 높은 우선순위 유지</text>
  <rect x="450" y="374" width="390" height="88" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="468" y="406" font-size="16" font-weight="bold" fill="#111827">CPU 위주 프로세스</text>
  <text x="468" y="436" font-size="16" font-weight="bold" fill="#92400e">→ 점점 낮은 큐로 이동</text>

  <!-- 참고 -->
  <rect x="40" y="484" width="800" height="48" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="440" y="514" font-size="16" fill="#374151" text-anchor="middle">Windows 스케줄러도 이 개념 기반 (Linux CFS는 다른 계열)</text>
</svg>
