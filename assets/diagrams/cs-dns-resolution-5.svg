<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 790" width="880" height="790" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">주소창 입력부터 IP를 얻기까지</title>
  <desc id="d">"https://www.example.com" 입력 후 URL 파싱, 브라우저 DNS 캐시, OS 조회, 재귀 리졸버 질의 순으로 확인하며 hit이면 끝나고, 모두 miss면 재귀 리졸버가 루트·TLD·권한 서버에 반복 질의해 A 레코드를 얻는다. 리졸버가 TTL만큼 캐시하고 응답하면 IP를 확보해 TCP·TLS 핸드셰이크와 HTTP 요청으로 이어진다.</desc>
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="790" fill="#ffffff"/>

  <!-- 시작: 사용자 입력 -->
  <rect x="24" y="24" width="392" height="44" rx="22" fill="#1f2937"/>
  <text x="44" y="52" font-size="16" fill="#ffffff"><tspan font-weight="bold">사용자:</tspan> <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"https://www.example.com"</tspan> 입력</text>

  <line x1="52" y1="69" x2="52" y2="97" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>

  <!-- 1. URL 파싱 -->
  <rect x="24" y="100" width="832" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="52" cy="126" r="14" fill="#1f2937"/>
  <text x="52" y="131" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="80" y="132" font-size="16" font-weight="bold" fill="#111827">URL 파싱</text>
  <line x1="158" y1="126" x2="190" y2="126" stroke="#374151" stroke-width="1.5" marker-end="url(#ar-ink)"/>
  <rect x="198" y="110" width="116" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="256" y="131" font-size="15" fill="#111827" text-anchor="middle">스킴(https)</text>
  <rect x="324" y="110" width="220" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="434" y="131" font-size="15" fill="#111827" text-anchor="middle">호스트(www.example.com)</text>
  <rect x="554" y="110" width="80" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="594" y="131" font-size="15" fill="#111827" text-anchor="middle">경로(/)</text>

  <line x1="52" y1="153" x2="52" y2="181" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>

  <!-- 2. 브라우저 DNS 캐시 -->
  <rect x="24" y="184" width="572" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="52" cy="208" r="14" fill="#1f2937"/>
  <text x="52" y="213" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="80" y="214" font-size="16" font-weight="bold" fill="#111827">브라우저 DNS 캐시 조회</text>
  <line x1="598" y1="208" x2="648" y2="208" stroke="#047857" stroke-width="2" marker-end="url(#ar-green)"/>
  <rect x="652" y="184" width="204" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="754" y="214" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">hit이면 끝</text>

  <line x1="52" y1="233" x2="52" y2="261" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <text x="64" y="253" font-size="14" fill="#4b5563">miss</text>

  <!-- 3. OS 조회 -->
  <rect x="24" y="264" width="572" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="52" cy="288" r="14" fill="#1f2937"/>
  <text x="52" y="293" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="80" y="294" font-size="16" font-weight="bold" fill="#111827">OS 조회</text>
  <text x="152" y="294" font-size="15" fill="#4b5563">(hosts 파일 우선 → OS 캐시)</text>
  <line x1="598" y1="288" x2="648" y2="288" stroke="#047857" stroke-width="2" marker-end="url(#ar-green)"/>
  <rect x="652" y="264" width="204" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="754" y="294" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">hit이면 끝</text>

  <line x1="52" y1="313" x2="52" y2="341" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <text x="64" y="333" font-size="14" fill="#4b5563">miss</text>

  <!-- 4. 스텁 리졸버 → 재귀 리졸버 -->
  <rect x="24" y="344" width="572" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="52" cy="376" r="14" fill="#1f2937"/>
  <text x="52" y="381" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="80" y="382" font-size="16" font-weight="bold" fill="#111827">스텁 리졸버가 재귀 리졸버로 질의</text>
  <rect x="338" y="362" width="124" height="28" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1"/>
  <text x="400" y="381" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">UDP 53번 포트</text>
  <line x1="598" y1="376" x2="648" y2="376" stroke="#047857" stroke-width="2" marker-end="url(#ar-green)"/>
  <rect x="652" y="344" width="204" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="754" y="370" font-size="15" fill="#374151" text-anchor="middle">재귀 리졸버 캐시</text>
  <text x="754" y="394" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">hit이면 끝</text>

  <line x1="52" y1="409" x2="52" y2="437" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>
  <text x="64" y="429" font-size="14" fill="#4b5563">miss</text>

  <!-- 5. 재귀 리졸버의 반복 질의 -->
  <rect x="24" y="440" width="832" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="52" cy="466" r="14" fill="#1f2937"/>
  <text x="52" y="471" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="80" y="472" font-size="16" font-weight="bold" fill="#111827">재귀 리졸버의 반복 질의</text>

  <rect x="80" y="490" width="72" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="116" y="518" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">루트</text>
  <line x1="154" y1="518" x2="268" y2="518" stroke="#374151" stroke-width="1.5" marker-end="url(#ar-ink)"/>
  <text x="211" y="506" font-size="15" fill="#4b5563" text-anchor="middle">"com은 저기"</text>

  <rect x="272" y="490" width="64" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="304" y="518" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">TLD</text>
  <line x1="338" y1="518" x2="532" y2="518" stroke="#374151" stroke-width="1.5" marker-end="url(#ar-ink)"/>
  <text x="436" y="506" font-size="15" fill="#4b5563" text-anchor="middle">"example.com은 ns1이"</text>

  <rect x="536" y="490" width="104" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="588" y="518" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">권한 서버</text>
  <line x1="642" y1="518" x2="696" y2="518" stroke="#374151" stroke-width="1.5" marker-end="url(#ar-ink)"/>

  <rect x="700" y="490" width="104" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="752" y="518" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">A 레코드</text>

  <line x1="52" y1="553" x2="52" y2="581" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>

  <!-- 6. 캐시하고 응답 -->
  <rect x="24" y="584" width="832" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="52" cy="608" r="14" fill="#1f2937"/>
  <text x="52" y="613" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="80" y="614" font-size="16" font-weight="bold" fill="#111827">재귀 리졸버가 TTL만큼 캐시하고 응답</text>

  <line x1="52" y1="633" x2="52" y2="661" stroke="#374151" stroke-width="2" marker-end="url(#ar-ink)"/>

  <!-- 7. IP 확보 이후 -->
  <rect x="24" y="664" width="832" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="52" cy="700" r="14" fill="#1f2937"/>
  <text x="52" y="705" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="80" y="678" width="96" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="128" y="706" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">IP 확보</text>
  <line x1="178" y1="700" x2="212" y2="700" stroke="#374151" stroke-width="1.5" marker-end="url(#ar-ink)"/>
  <rect x="216" y="678" width="244" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="338" y="706" font-size="16" fill="#111827" text-anchor="middle">TCP 3-way 핸드셰이크(443)</text>
  <line x1="462" y1="700" x2="496" y2="700" stroke="#374151" stroke-width="1.5" marker-end="url(#ar-ink)"/>
  <rect x="500" y="678" width="140" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="570" y="706" font-size="16" fill="#111827" text-anchor="middle">TLS 핸드셰이크</text>
  <line x1="642" y1="700" x2="676" y2="700" stroke="#374151" stroke-width="1.5" marker-end="url(#ar-ink)"/>
  <rect x="680" y="678" width="112" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="736" y="706" font-size="16" fill="#111827" text-anchor="middle">HTTP 요청</text>

  <text x="24" y="766" font-size="14" fill="#4b5563">※ 여기서부터 이어지는 흐름은 03-tcp-udp.md와 05-ssl-tls-handshake.md에서 다룹니다.</text>
</svg>
