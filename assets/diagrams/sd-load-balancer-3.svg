<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">헬스체크 깊이 차이가 만드는 사고</title>
  <desc id="d">애플리케이션은 데드락으로 모든 요청에 500을 반환하지만 OS의 TCP 스택은 연결을 계속 받아주는 상황이다. TCP 연결만 확인하는 L4 LB는 정상으로 보고 죽은 서버로 계속 트래픽을 보내고, GET /health로 확인하는 L7 LB는 500을 받아 즉시 제외한다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 전제 -->
  <rect x="24" y="24" width="832" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">L4 헬스체크 통과 = “TCP 3-way handshake가 됐다”</text>

  <!-- 상황: 서버 한 대의 두 층 -->
  <rect x="24" y="88" width="832" height="140" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="40" y="164" font-size="17" font-weight="bold" fill="#b45309">[상황]</text>

  <rect x="116" y="104" width="724" height="54" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="136" y="137" font-size="16" font-weight="bold" fill="#b91c1c">애플리케이션</text>
  <text x="276" y="137" font-size="15" fill="#7f1d1d">데드락에 걸려 모든 요청에 500을 반환 중</text>

  <rect x="116" y="158" width="724" height="54" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="136" y="191" font-size="16" font-weight="bold" fill="#047857">OS의 TCP 스택</text>
  <text x="276" y="191" font-size="15" fill="#064e3b">멀쩡해서 연결은 계속 받아준다</text>

  <!-- 헬스체크가 닿는 깊이 -->
  <line x1="224" y1="300" x2="224" y2="211" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <text x="238" y="268" font-size="15" font-weight="bold" fill="#374151">TCP 연결</text>

  <line x1="656" y1="300" x2="656" y2="150" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="670" y="268" font-size="15" font-weight="bold" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /health</text>

  <!-- 판단과 결과 -->
  <rect x="24" y="300" width="400" height="132" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="224" y="332" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">L4 LB</text>
  <text x="224" y="366" font-size="16" fill="#111827" text-anchor="middle">“연결 성공 → 정상!”</text>
  <text x="224" y="404" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">→ 죽은 서버로 계속 트래픽을 보낸다</text>

  <rect x="456" y="300" width="400" height="132" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="656" y="332" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">L7 LB</text>
  <text x="656" y="366" font-size="16" fill="#111827" text-anchor="middle">“GET /health → 500”</text>
  <text x="656" y="404" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">→ 즉시 제외</text>
</svg>
