<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 850" width="880" height="850" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">유니온 파일시스템(overlay2) 동작 원리</title>
  <desc id="d">merged, upperdir, lowerdir3~1 층과 파일 a.txt~d.txt를 격자로 놓고, 각 파일이 merged에서 어느 층의 것으로 보이는지와 겹쳐 보이기(위층 우선), copy-up, whiteout 세 가지 동작을 보여 준다.</desc>
  <rect width="880" height="850" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 요점 -->
  <text x="24" y="44" font-size="18" font-weight="bold" fill="#111827">overlay2: 같은 경로의 파일이 여러 층에 있으면 위층이 이긴다</text>

  <!-- 머리행 -->
  <rect x="24" y="64" width="228" height="36" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="88" font-size="15" font-weight="bold" fill="#374151">층 ↓ · 파일 →</text>
  <rect x="264" y="64" width="142" height="36" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="335" y="88" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a.txt</text>
  <rect x="414" y="64" width="142" height="36" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="485" y="88" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">b.txt</text>
  <rect x="564" y="64" width="142" height="36" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="635" y="88" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">c.txt</text>
  <rect x="714" y="64" width="142" height="36" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="785" y="88" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">d.txt</text>

  <!-- merged -->
  <rect x="24" y="108" width="228" height="68" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="40" y="136" font-size="17" font-weight="bold" fill="#1e3a8a">merged</text>
  <text x="40" y="160" font-size="14" fill="#1e3a8a">컨테이너가 실제로 보는 /</text>

  <rect x="264" y="108" width="142" height="68" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="335" y="138" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v2</text>
  <text x="335" y="160" font-size="14" fill="#1e3a8a" text-anchor="middle">upper 적용</text>
  <rect x="414" y="108" width="142" height="68" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="485" y="138" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">수정본</text>
  <text x="485" y="160" font-size="14" fill="#1e3a8a" text-anchor="middle">copy-up 된 것</text>
  <rect x="564" y="108" width="142" height="68" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="635" y="138" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">원본</text>
  <text x="635" y="160" font-size="14" fill="#1e3a8a" text-anchor="middle">lower2 것</text>
  <rect x="714" y="108" width="142" height="68" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="785" y="138" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">보이지 않음</text>
  <text x="785" y="160" font-size="14" fill="#b91c1c" text-anchor="middle">삭제로 처리됨</text>

  <!-- 겹쳐 보이기 -->
  <text x="40" y="204" font-size="15" font-weight="bold" fill="#1d4ed8">▲ 겹쳐 보이기</text>
  <text x="347" y="203" font-size="14" font-weight="bold" fill="#1d4ed8">① 위층이 이김</text>

  <!-- upperdir -->
  <rect x="24" y="220" width="228" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="40" y="246" font-size="17" font-weight="bold" fill="#92400e">upperdir</text>
  <text x="40" y="268" font-size="14" fill="#92400e">쓰기 가능, 컨테이너 전용</text>

  <rect x="264" y="220" width="142" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="335" y="246" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">v2</text>
  <text x="335" y="268" font-size="14" fill="#92400e" text-anchor="middle">신규/수정</text>
  <rect x="414" y="220" width="142" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="485" y="257" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">수정본</text>
  <rect x="564" y="220" width="142" height="64" rx="6" fill="none" stroke="#d6a45a" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="714" y="220" width="142" height="64" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="785" y="246" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">③ whiteout</text>
  <text x="785" y="268" font-size="14" fill="#b91c1c" text-anchor="middle">“없음” 표식</text>

  <!-- lowerdir 묶음 -->
  <rect x="24" y="296" width="832" height="230" rx="8" fill="#f5f3ff"/>
  <text x="40" y="319" font-size="15" font-weight="bold" fill="#5b21b6">읽기 전용 · 여러 컨테이너가 공유</text>

  <!-- lowerdir3 -->
  <rect x="32" y="330" width="220" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="354" font-size="16" font-weight="bold" fill="#5b21b6">lowerdir3</text>
  <text x="44" y="375" font-size="14" fill="#5b21b6">이미지 레이어 L3</text>
  <rect x="264" y="330" width="142" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="335" y="354" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">v1 (원래 버전)</text>
  <text x="335" y="375" font-size="14" fill="#4b5563" text-anchor="middle">가려짐</text>
  <rect x="414" y="330" width="142" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="564" y="330" width="142" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="714" y="330" width="142" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- lowerdir2 -->
  <rect x="32" y="394" width="220" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="418" font-size="16" font-weight="bold" fill="#5b21b6">lowerdir2</text>
  <text x="44" y="439" font-size="14" fill="#5b21b6">이미지 레이어 L2</text>
  <rect x="264" y="394" width="142" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="414" y="394" width="142" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="485" y="428" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">원본</text>
  <rect x="564" y="394" width="142" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="635" y="428" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">원본</text>
  <rect x="714" y="394" width="142" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- lowerdir1 -->
  <rect x="32" y="458" width="220" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="482" font-size="16" font-weight="bold" fill="#5b21b6">lowerdir1</text>
  <text x="44" y="503" font-size="14" fill="#5b21b6">이미지 레이어 L1 · 공유 베이스</text>
  <rect x="264" y="458" width="142" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="414" y="458" width="142" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="564" y="458" width="142" height="56" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="714" y="458" width="142" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="785" y="482" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">원본 (삭제 대상)</text>
  <text x="785" y="503" font-size="14" fill="#5b21b6" text-anchor="middle">그대로 남음</text>

  <!-- 보이는 출처 화살표 (파랑) -->
  <line x1="335" y1="218" x2="335" y2="180" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a-blue)"/>
  <line x1="485" y1="218" x2="485" y2="180" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a-blue)"/>
  <line x1="635" y1="392" x2="635" y2="180" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a-blue)"/>

  <!-- copy-up 화살표 (주황) -->
  <line x1="440" y1="392" x2="440" y2="288" stroke="#b45309" stroke-width="2" marker-end="url(#a-amber)"/>
  <text x="450" y="319" font-size="14" font-weight="bold" fill="#b45309">② copy-up <tspan font-weight="normal">· 통째 복사</tspan></text>

  <!-- 동작 설명 -->
  <rect x="24" y="546" width="832" height="66" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="574" font-size="16" font-weight="bold" fill="#1d4ed8">① 겹쳐 보이기</text>
  <text x="40" y="596" font-size="14" fill="#1d4ed8">(upperdir 우선)</text>
  <text x="264" y="574" font-size="15" fill="#111827">같은 경로면 위층(upper) 파일이 아래층을 가린다</text>
  <text x="264" y="596" font-size="15" fill="#374151"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a.txt</tspan>: lower의 v1 대신 upper의 v2가 merged에 보임</text>

  <rect x="24" y="622" width="832" height="66" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="40" y="650" font-size="16" font-weight="bold" fill="#b45309">② copy-up</text>
  <text x="40" y="672" font-size="14" fill="#b45309">(읽기 전용 파일 수정 시)</text>
  <text x="264" y="650" font-size="15" fill="#111827">lower 파일을 upper로 통째 복사한 뒤 upper 것을 고친다</text>
  <text x="264" y="672" font-size="15" fill="#374151">대용량 파일은 복사 비용 발생 — 예: <tspan font-weight="bold" fill="#b91c1c">1GB 파일 1줄 변경 시 1GB 복사</tspan></text>

  <rect x="24" y="698" width="832" height="66" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="40" y="726" font-size="16" font-weight="bold" fill="#b91c1c">③ whiteout</text>
  <text x="40" y="748" font-size="14" fill="#b91c1c">(파일 삭제 시)</text>
  <text x="264" y="726" font-size="15" fill="#111827">upper에 “없음” 표식만 남기고 lower 원본은 그대로 → 이미지 크기 안 줄어듦</text>
  <text x="264" y="748" font-size="15" fill="#374151">merged에서는 삭제된 것으로 처리되어 보이지 않음</text>

  <!-- 결론 -->
  <text x="440" y="798" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">결론: overlay2는 읽기 전용 lowerdir을 공유해 효율을 높이고,
    <tspan x="440" dy="22">변경 사항은 upperdir에 copy-up과 whiteout으로 기록한다.</tspan></text>
</svg>
