<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TLB 동작 과정</title>
  <desc id="d">가상 주소 접근 시 TLB를 먼저 조회합니다. Hit면 곧바로 물리주소를 반환하고, Miss면 페이지 테이블 조회, TLB 업데이트를 거쳐 물리주소를 반환합니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="330" y="28" width="220" height="50" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="440" y="59" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">가상 주소 접근</text>
  <line x1="440" y1="78" x2="440" y2="108" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- TLB 조회 -->
  <rect x="330" y="110" width="220" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="145" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">TLB 조회</text>

  <!-- 분기 -->
  <line x1="440" y1="166" x2="440" y2="194" stroke="#374151" stroke-width="2.5"/>
  <line x1="250" y1="194" x2="630" y2="194" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="194" x2="250" y2="236" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <line x1="630" y1="194" x2="630" y2="236" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr-o)"/>
  <text x="264" y="223" font-size="18" font-weight="bold" fill="#047857">Hit</text>
  <text x="644" y="223" font-size="18" font-weight="bold" fill="#b45309">Miss</text>

  <!-- Hit 경로 -->
  <rect x="130" y="240" width="240" height="56" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="250" y="274" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">물리주소 반환</text>
  <text x="250" y="326" font-size="15" fill="#047857" text-anchor="middle">페이지 테이블을 건드리지 않음</text>

  <!-- Miss 경로 -->
  <circle cx="486" cy="268" r="14" fill="#b45309"/>
  <text x="486" y="274" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="510" y="240" width="240" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="630" y="274" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">페이지 테이블 조회</text>
  <line x1="630" y1="296" x2="630" y2="324" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr-o)"/>

  <circle cx="486" cy="354" r="14" fill="#b45309"/>
  <text x="486" y="360" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="510" y="326" width="240" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="630" y="360" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">TLB 업데이트</text>
  <line x1="630" y1="382" x2="630" y2="410" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr-o)"/>

  <circle cx="486" cy="440" r="14" fill="#b45309"/>
  <text x="486" y="446" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="510" y="412" width="240" height="56" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="630" y="446" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">물리주소 반환</text>
</svg>
