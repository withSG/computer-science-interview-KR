<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">고정 소수점 (Fixed Point)</title>
  <desc id="d">16비트 고정 소수점 표현 구조: 부호 1비트, 정수부 7비트, 소수부 8비트로 구성되어 3.25를 나타내는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Top Title / Heading Note -->
  <text x="440" y="36" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">16비트, 부호 1 + 정수부 7 + 소수부 8 로 정한 경우</text>

  <!-- Section Column Headers / Bit Field Labels -->
  <!-- Sign (1 bit) -->
  <text x="135" y="80" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">부호</text>

  <!-- Integer Part (7 bits) -->
  <text x="310" y="80" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">정수부(7)</text>

  <!-- Fractional Part (8 bits) -->
  <text x="630" y="80" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">소수부(8)</text>

  <!-- Main Bit Representation Boxes -->
  <!-- Sign Box: x=100, y=95, w=70, h=50 -->
  <rect x="100" y="95" width="70" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="126" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">0</text>

  <!-- Integer Box: x=170, y=95, w=280, h=50 -->
  <rect x="170" y="95" width="280" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="310" y="126" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle" letter-spacing="2px">0000011</text>

  <!-- Fractional Box: x=450, y=95, w=360, h=50 -->
  <rect x="450" y="95" width="360" height="50" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="630" y="126" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle" letter-spacing="2px">0100 0000</text>

  <!-- Value Conversions below Boxes -->
  <!-- Integer part value = 3 -->
  <text x="310" y="180" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">= 3</text>

  <!-- Fractional part value = 0.25 -->
  <text x="630" y="180" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">= 0.25</text>

  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Final Calculated Value Section -->
  <!-- Arrow -> -->
  <path d="M370,240 L400,240" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>

  <!-- Value Label -->
  <text x="415" y="245" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="start">값 3.25</text>

</svg>