<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 답변 예시</title>
  <desc id="d">배포 후 3일 뒤 서비스 지연 현상에 대한 진단, 원인, 해결 및 결과 과정을 나타낸 기술 문제 해결 다이어그램</desc>
  <rect width="880" height="730" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="440" y="45.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">면접 답변 예시</text>

  <!-- 상단 요약 설명 -->
  <rect x="40" y="70" width="800" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="94.6" font-size="13" fill="#1f2933" text-anchor="middle">"서비스가 배포 후 3일이 지나면 느려지는 현상이 있었습니다.</text>

  <!-- Section 1: 진단 (Blue) -->
  <rect x="40" y="130" width="800" height="125" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="159.9" font-size="14" font-weight="bold" fill="#2563eb">진단:</text>
  <text x="60" y="184.6" font-size="13" fill="#1f2933">1. Kubernetes에서 Pod가 OOMKilled로 재시작되는 것 확인</text>
  <text x="60" y="208.6" font-size="13" fill="#1f2933">2. 메모리 그래프가 계단식 증가 패턴</text>
  <text x="60" y="232.6" font-size="13" fill="#1f2933">3. heap dump 분석 → 사용자 세션 객체가 수백만 개</text>

  <!-- 연결 화살표 1 -->
  <path d="M440,255 L440,285" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Section 2: 원인 (Red) -->
  <rect x="40" y="285" width="800" height="105" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="314.9" font-size="14" font-weight="bold" fill="#dc2626">원인:</text>
  <text x="60" y="339.6" font-size="13" fill="#1f2933">Redis 세션 저장 로직에서 예외 발생 시</text>
  <text x="60" y="363.6" font-size="13" fill="#1f2933">로컬 HashMap에 백업 저장하는데, 삭제 로직이 없었음</text>

  <!-- 연결 화살표 2 -->
  <path d="M440,390 L440,420" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Section 3: 해결 (Green) -->
  <rect x="40" y="420" width="800" height="125" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="449.9" font-size="14" font-weight="bold" fill="#059669">해결:</text>
  <text x="60" y="474.6" font-size="13" fill="#1f2933">1. HashMap 대신 Caffeine Cache (maxSize, TTL 설정)</text>
  <text x="60" y="498.6" font-size="13" fill="#1f2933">2. Redis 연결 실패 시 재시도 로직 추가</text>
  <text x="60" y="522.6" font-size="13" fill="#1f2933">3. 메모리 사용량 80% 알림 설정</text>

  <!-- 연결 화살표 3 -->
  <path d="M440,545 L440,575" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Section 4: 결과 (Purple) -->
  <rect x="40" y="575" width="800" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="604.9" font-size="14" font-weight="bold" fill="#7c3aed">결과:</text>
  <text x="60" y="629.6" font-size="13" fill="#1f2933">메모리 안정적 유지, OOMKilled 재발 없음"</text>
</svg>