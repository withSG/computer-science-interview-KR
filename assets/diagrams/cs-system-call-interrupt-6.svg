<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">PIO와 DMA 전송 비교</title>
  <desc id="d">PIO 방식에서는 디스크의 데이터를 CPU가 읽어 메모리에 써서 모든 바이트가 CPU 레지스터를 거치고, DMA 방식에서는 CPU가 DMA 컨트롤러에 전송을 지시한 뒤 다른 작업을 하는 동안 디스크에서 메모리로 직접 전송되고 완료 인터럽트로 알린다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="int" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <line x1="690" y1="38" x2="738" y2="38" stroke="#047857" stroke-width="4" marker-end="url(#data)"/>
  <text x="750" y="44" font-size="15" font-weight="bold" fill="#047857">데이터 이동</text>

  <!-- ===== PIO 방식 ===== -->
  <text x="24" y="44" font-size="20" font-weight="bold" fill="#111827">PIO 방식</text>
  <text x="134" y="44" font-size="15" fill="#4b5563">(Programmed I/O)</text>

  <rect x="80" y="76" width="160" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="160" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">디스크</text>
  <rect x="360" y="76" width="160" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="114" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">CPU</text>
  <rect x="640" y="76" width="160" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="720" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">메모리</text>

  <line x1="244" y1="108" x2="354" y2="108" stroke="#047857" stroke-width="4" marker-end="url(#data)"/>
  <text x="298" y="95" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">① 읽기</text>
  <line x1="524" y1="108" x2="634" y2="108" stroke="#047857" stroke-width="4" marker-end="url(#data)"/>
  <text x="578" y="95" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">② 쓰기</text>

  <text x="440" y="174" font-size="16" fill="#1f2937" text-anchor="middle">모든 바이트가 <tspan font-weight="bold" fill="#92400e">CPU 레지스터</tspan>를 한 번씩 거쳐 간다</text>

  <line x1="24" y1="200" x2="856" y2="200" stroke="#d1d5db" stroke-width="1"/>

  <!-- ===== DMA 방식 ===== -->
  <text x="24" y="240" font-size="20" font-weight="bold" fill="#111827">DMA 방식</text>
  <text x="134" y="240" font-size="15" fill="#4b5563">(Direct Memory Access)</text>

  <!-- CPU -->
  <rect x="80" y="264" width="180" height="216" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="304" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">CPU</text>
  <rect x="94" y="384" width="152" height="82" rx="6" fill="#ffffff"/>
  <text x="170" y="418" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">3. CPU는 그동안</text>
  <text x="170" y="444" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">다른 작업</text>

  <!-- DMA 컨트롤러 -->
  <rect x="510" y="264" width="220" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="620" y="302" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">DMA 컨트롤러</text>

  <!-- 1. 지시 / 4. 완료 인터럽트 -->
  <line x1="264" y1="286" x2="504" y2="286" stroke="#1d4ed8" stroke-width="2" marker-end="url(#cmd)"/>
  <text x="384" y="275" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. “이만큼 옮겨줘”</text>
  <line x1="506" y1="310" x2="266" y2="310" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#int)"/>
  <text x="384" y="336" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">4. 완료 인터럽트</text>

  <!-- 디스크 → 메모리 -->
  <rect x="400" y="416" width="160" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="480" y="454" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">디스크</text>
  <rect x="680" y="416" width="160" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="760" y="454" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">메모리</text>
  <line x1="564" y1="448" x2="674" y2="448" stroke="#047857" stroke-width="4" marker-end="url(#data)"/>

  <!-- 2. 직접 전송 -->
  <line x1="620" y1="332" x2="620" y2="438" stroke="#6d28d9" stroke-width="2" marker-end="url(#ctl)"/>
  <text x="632" y="390" font-size="16" font-weight="bold" fill="#6d28d9">2. 직접 전송</text>
</svg>
