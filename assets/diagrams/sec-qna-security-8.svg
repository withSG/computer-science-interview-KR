<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OAuth + JWT (소셜 로그인) 인증 흐름</title>
  <desc id="d">사용자, Google, 우리 서버 간의 OAuth 코드 교환 및 자체 JWT 발급 시퀀스 흐름도</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="440" y="36" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">OAuth + JWT (소셜 로그인)</text>

  <!-- Lifelines (Vertical Lines) -->
  <path d="M160,100 L160,450" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M440,100 L440,450" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M720,100 L720,450" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Participant Headers -->
  <!-- 1. 사용자 -->
  <rect x="100" y="60" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자</text>

  <!-- 2. Google -->
  <rect x="380" y="60" width="120" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Google</text>

  <!-- 3. 우리 서버 -->
  <rect x="660" y="60" width="120" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="720" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">우리 서버</text>

  <!-- Step 1: 사용자 -> Google: 로그인 -->
  <path d="M160,140 L440,140" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="250" y="127" width="100" height="24" fill="#ffffff" rx="4"/>
  <text x="300" y="143" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">1. 로그인</text>

  <!-- Step 2: Google -> 우리 서버: Authorization Code -->
  <path d="M440,200 L720,200" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <rect x="500" y="187" width="160" height="24" fill="#ffffff" rx="4"/>
  <text x="580" y="203" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2. Authorization Code</text>

  <!-- Step 3: 우리 서버 -> Google: Code -> Access Token 교환 -->
  <path d="M720,260 L440,260" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="480" y="247" width="200" height="24" fill="#ffffff" rx="4"/>
  <text x="580" y="263" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3. Code → Access Token 교환</text>

  <!-- Step 4: 우리 서버: 사용자 정보 확인 후 자체 JWT 발급 -->
  <rect x="630" y="305" width="180" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="327" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">4. 사용자 정보 확인 후</text>
  <text x="720" y="345" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">자체 JWT 발급</text>

  <!-- Step 5: 사용자: 우리 JWT로 API 요청 -->
  <path d="M160,400 L720,400" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="350" y="387" width="180" height="24" fill="#ffffff" rx="4"/>
  <text x="440" y="403" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">5. 우리 JWT로 API 요청</text>
</svg>