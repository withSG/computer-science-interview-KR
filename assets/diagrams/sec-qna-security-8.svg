<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OAuth + JWT 소셜 로그인 흐름</title>
  <desc id="d">사용자가 Google에 로그인하면 Google이 우리 서버에 Authorization Code를 넘기고, 우리 서버가 Code를 Access Token으로 교환한 뒤 사용자 정보를 확인해 자체 JWT를 발급하며, 사용자는 우리 JWT로 API를 요청한다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="75" y="24" width="150" height="52" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="150" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">사용자</text>
  <rect x="365" y="24" width="150" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Google</text>
  <rect x="655" y="24" width="150" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="730" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">우리 서버</text>

  <!-- 생명선 -->
  <line x1="150" y1="76" x2="150" y2="440" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="440" y1="76" x2="440" y2="440" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="730" y1="76" x2="730" y2="286" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="730" y1="352" x2="730" y2="440" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 1. 사용자 → Google: 로그인 -->
  <circle cx="184" cy="115" r="13" fill="#1d4ed8"/>
  <text x="184" y="120" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="206" y="121" font-size="16" fill="#111827">로그인</text>
  <line x1="150" y1="134" x2="439" y2="134" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2. Google → 우리 서버: Authorization Code -->
  <circle cx="474" cy="175" r="13" fill="#1d4ed8"/>
  <text x="474" y="180" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="496" y="181" font-size="16" font-weight="bold" fill="#b45309">Authorization Code</text>
  <line x1="440" y1="194" x2="729" y2="194" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3. 우리 서버 → Google: Code → Access Token 교환 -->
  <circle cx="474" cy="235" r="13" fill="#1d4ed8"/>
  <text x="474" y="240" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="496" y="241" font-size="16" fill="#111827">Code → Access Token 교환</text>
  <line x1="730" y1="254" x2="441" y2="254" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 4. 우리 서버: 사용자 정보 확인 후 자체 JWT 발급 -->
  <rect x="600" y="286" width="256" height="66" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="626" cy="313" r="13" fill="#1d4ed8"/>
  <text x="626" y="318" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="648" y="314" font-size="16" fill="#111827">사용자 정보 확인 후</text>
  <text x="648" y="339" font-size="17" font-weight="bold" fill="#047857">자체 JWT 발급</text>

  <!-- 5. 사용자: 우리 JWT로 API 요청 -->
  <circle cx="184" cy="391" r="13" fill="#1d4ed8"/>
  <text x="184" y="396" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="206" y="397" font-size="16" fill="#111827">우리 <tspan font-weight="bold" fill="#047857">JWT</tspan>로 API 요청</text>
  <line x1="150" y1="410" x2="729" y2="410" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
</svg>
