<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DFS와 BFS 탐색 순서</title>
  <desc id="d">같은 이진 트리(1의 자식 2·3, 2의 자식 4·5)에서 DFS는 1 → 2 → 4 → 5 → 3, BFS는 1 → 2 → 3 → 4 → 5 순서로 방문합니다.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- ===== DFS 패널 ===== -->
  <rect x="24" y="24" width="404" height="400" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="48" y="60" font-size="17" fill="#111827"><tspan font-size="20" font-weight="bold" fill="#1d4ed8">DFS</tspan> (깊이 우선 탐색)</text>
  <text x="48" y="86" font-size="15" fill="#4b5563">스택/재귀 · 한 갈래를 끝까지 먼저</text>

  <!-- 먼저 끝까지 도는 갈래(2의 서브트리) -->
  <rect x="50" y="172" width="196" height="150" rx="14" fill="#eff6ff"/>

  <!-- 간선 -->
  <line x1="226" y1="140" x2="146" y2="216" stroke="#9ca3af" stroke-width="2"/>
  <line x1="226" y1="140" x2="306" y2="216" stroke="#9ca3af" stroke-width="2"/>
  <line x1="146" y1="216" x2="96" y2="292" stroke="#9ca3af" stroke-width="2"/>
  <line x1="146" y1="216" x2="196" y2="292" stroke="#9ca3af" stroke-width="2"/>

  <!-- 노드 -->
  <circle cx="226" cy="140" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="226" y="146" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
  <circle cx="146" cy="216" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="146" y="222" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
  <circle cx="306" cy="216" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="306" y="222" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <circle cx="96" cy="292" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="96" y="298" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">4</text>
  <circle cx="196" cy="292" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="196" y="298" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">5</text>

  <!-- 방문 순서 배지 -->
  <circle cx="254" cy="118" r="13" fill="#1d4ed8"/>
  <text x="254" y="123" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="118" cy="194" r="13" fill="#1d4ed8"/>
  <text x="118" y="199" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="68" cy="270" r="13" fill="#1d4ed8"/>
  <text x="68" y="275" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="224" cy="270" r="13" fill="#1d4ed8"/>
  <text x="224" y="275" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="334" cy="194" r="13" fill="#1d4ed8"/>
  <text x="334" y="199" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  <!-- 탐색 순서 -->
  <text x="48" y="356" font-size="15" font-weight="bold" fill="#374151">탐색 순서</text>
  <circle cx="98" cy="388" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="98" y="394" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1</text>
  <line x1="119" y1="388" x2="141" y2="388" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <circle cx="162" cy="388" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="162" y="394" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2</text>
  <line x1="183" y1="388" x2="205" y2="388" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <circle cx="226" cy="388" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="226" y="394" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4</text>
  <line x1="247" y1="388" x2="269" y2="388" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <circle cx="290" cy="388" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="290" y="394" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">5</text>
  <line x1="311" y1="388" x2="333" y2="388" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <circle cx="354" cy="388" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="354" y="394" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3</text>

  <!-- ===== BFS 패널 ===== -->
  <rect x="452" y="24" width="404" height="400" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="476" y="60" font-size="17" fill="#111827"><tspan font-size="20" font-weight="bold" fill="#047857">BFS</tspan> (너비 우선 탐색)</text>
  <text x="476" y="86" font-size="15" fill="#4b5563">큐 · 같은 레벨부터 차례로</text>

  <!-- 레벨 띠 -->
  <rect x="466" y="110" width="376" height="60" rx="10" fill="#ecfdf5"/>
  <rect x="466" y="186" width="376" height="60" rx="10" fill="#ecfdf5"/>
  <rect x="466" y="262" width="376" height="60" rx="10" fill="#ecfdf5"/>

  <!-- 간선 -->
  <line x1="654" y1="140" x2="574" y2="216" stroke="#9ca3af" stroke-width="2"/>
  <line x1="654" y1="140" x2="734" y2="216" stroke="#9ca3af" stroke-width="2"/>
  <line x1="574" y1="216" x2="524" y2="292" stroke="#9ca3af" stroke-width="2"/>
  <line x1="574" y1="216" x2="624" y2="292" stroke="#9ca3af" stroke-width="2"/>

  <!-- 노드 -->
  <circle cx="654" cy="140" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="654" y="146" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
  <circle cx="574" cy="216" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="574" y="222" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
  <circle cx="734" cy="216" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="734" y="222" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">3</text>
  <circle cx="524" cy="292" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="524" y="298" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">4</text>
  <circle cx="624" cy="292" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="624" y="298" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">5</text>

  <!-- 방문 순서 배지 -->
  <circle cx="682" cy="118" r="13" fill="#047857"/>
  <text x="682" y="123" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="546" cy="194" r="13" fill="#047857"/>
  <text x="546" y="199" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="762" cy="194" r="13" fill="#047857"/>
  <text x="762" y="199" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="496" cy="270" r="13" fill="#047857"/>
  <text x="496" y="275" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="652" cy="270" r="13" fill="#047857"/>
  <text x="652" y="275" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  <!-- 탐색 순서 -->
  <text x="476" y="356" font-size="15" font-weight="bold" fill="#374151">탐색 순서</text>
  <circle cx="526" cy="388" r="18" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="526" y="394" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">1</text>
  <line x1="547" y1="388" x2="569" y2="388" stroke="#047857" stroke-width="1.5" marker-end="url(#ag)"/>
  <circle cx="590" cy="388" r="18" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="590" y="394" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">2</text>
  <line x1="611" y1="388" x2="633" y2="388" stroke="#047857" stroke-width="1.5" marker-end="url(#ag)"/>
  <circle cx="654" cy="388" r="18" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="654" y="394" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">3</text>
  <line x1="675" y1="388" x2="697" y2="388" stroke="#047857" stroke-width="1.5" marker-end="url(#ag)"/>
  <circle cx="718" cy="388" r="18" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="718" y="394" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">4</text>
  <line x1="739" y1="388" x2="761" y2="388" stroke="#047857" stroke-width="1.5" marker-end="url(#ag)"/>
  <circle cx="782" cy="388" r="18" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="782" y="394" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">5</text>

  <!-- 범례 -->
  <circle cx="344" cy="451" r="12" fill="#4b5563"/>
  <text x="344" y="456" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">n</text>
  <text x="366" y="456" font-size="15" fill="#374151">노드 옆 작은 원 = 방문 순서</text>
</svg>
