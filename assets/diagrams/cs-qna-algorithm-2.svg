<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">탐색 순서 예시</title>
  <desc id="d">이진 트리의 DFS(깊이 우선 탐색) 및 BFS(너비 우선 탐색) 탐색 순서 예시 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 제목 섹션 (문서 헤딩) -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">탐색 순서 예시</text>

  <!-- 트리 영역 -->
  <g id="tree">
    <!-- 에지 (연결선) -->
    <line x1="200" y1="80" x2="140" y2="140" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="200" y1="80" x2="260" y2="140" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="140" y1="140" x2="90" y2="200" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="140" y1="140" x2="190" y2="200" stroke="#9aa5b1" stroke-width="2"/>

    <!-- 노드 1 -->
    <circle cx="200" cy="80" r="22" fill="#f8fafc" stroke="#52606d" stroke-width="2"/>
    <text x="200" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

    <!-- 노드 2 -->
    <circle cx="140" cy="140" r="22" fill="#f8fafc" stroke="#52606d" stroke-width="2"/>
    <text x="140" y="145" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

    <!-- 노드 3 -->
    <circle cx="260" cy="140" r="22" fill="#f8fafc" stroke="#52606d" stroke-width="2"/>
    <text x="260" y="145" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

    <!-- 노드 4 -->
    <circle cx="90" cy="200" r="22" fill="#f8fafc" stroke="#52606d" stroke-width="2"/>
    <text x="90" y="205" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

    <!-- 노드 5 -->
    <circle cx="190" cy="200" r="22" fill="#f8fafc" stroke="#52606d" stroke-width="2"/>
    <text x="190" y="205" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>
  </g>

  <!-- DFS 탐색 순서 박스 -->
  <g id="dfs-section">
    <rect x="360" y="70" width="480" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="385" y="123" font-size="14" font-weight="bold" fill="#2563eb">DFS:</text>
    
    <!-- DFS 순서 시퀀스 -->
    <g transform="translate(440, 100)">
      <!-- 노드 1 -->
      <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="20" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>
      <path d="M 42 20 L 68 20" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#a-blue)"/>

      <!-- 노드 2 -->
      <circle cx="90" cy="20" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="90" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>
      <path d="M 112 20 L 138 20" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#a-blue)"/>

      <!-- 노드 4 -->
      <circle cx="160" cy="20" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="160" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>
      <path d="M 182 20 L 208 20" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#a-blue)"/>

      <!-- 노드 5 -->
      <circle cx="230" cy="20" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="230" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>
      <path d="M 252 20 L 278 20" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#a-blue)"/>

      <!-- 노드 3 -->
      <circle cx="300" cy="20" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="300" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>
    </g>
  </g>

  <!-- BFS 탐색 순서 박스 -->
  <g id="bfs-section">
    <rect x="360" y="180" width="480" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="385" y="233" font-size="14" font-weight="bold" fill="#059669">BFS:</text>
    
    <!-- BFS 순서 시퀀스 -->
    <g transform="translate(440, 210)">
      <!-- 노드 1 -->
      <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="20" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>
      <path d="M 42 20 L 68 20" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#a-green)"/>

      <!-- 노드 2 -->
      <circle cx="90" cy="20" r="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="90" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>
      <path d="M 112 20 L 138 20" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#a-green)"/>

      <!-- 노드 3 -->
      <circle cx="160" cy="20" r="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="160" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>
      <path d="M 182 20 L 208 20" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#a-green)"/>

      <!-- 노드 4 -->
      <circle cx="230" cy="20" r="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="230" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>
      <path d="M 252 20 L 278 20" stroke="#059669" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#a-green)"/>

      <!-- 노드 5 -->
      <circle cx="300" cy="20" r="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="300" y="25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>
    </g>
  </g>

  <!-- 색상 범례 (의미 구분을 위한 범례) -->
  <g id="legend" transform="translate(360, 310)">
    <rect x="0" y="0" width="480" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    
    <rect x="20" y="14" width="12" height="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="38" y="24" font-size="11.5" fill="#52606d">DFS (깊이 우선 탐색)</text>
    
    <rect x="230" y="14" width="12" height="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="248" y="24" font-size="11.5" fill="#52606d">BFS (너비 우선 탐색)</text>
  </g>
</svg>