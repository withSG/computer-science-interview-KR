<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">재조정 과정</title>
  <desc id="d">Root부터 엘리먼트 타입을 비교해 같은 타입이면 속성만 업데이트하고 자식을 key로 재귀 비교하며, 다른 타입이면 이전 트리를 제거하고 새 트리를 만든 뒤, 변경사항을 수집해 실제 DOM에 반영하는 6단계 흐름.</desc>
  <rect width="880" height="660" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 1. Root부터 비교 시작 -->
  <rect x="300" y="24" width="280" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="342" cy="52" r="15" fill="#1d4ed8"/>
  <text x="342" y="57.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="368" y="58" font-size="17" font-weight="bold" fill="#111827">Root부터 비교 시작</text>

  <path d="M440,80 V114" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 분기: 타입 비교 -->
  <polygon points="440,116 540,152 440,188 340,152" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="158" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">타입 비교</text>

  <path d="M440,188 V208" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M230,208 H650" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M230,207 V250" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M650,207 V250" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="218" y="238" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="end">같은 타입</text>
  <text x="662" y="238" font-size="16" font-weight="bold" fill="#b91c1c">다른 타입</text>

  <!-- 2. 같은 타입 → 속성만 업데이트 -->
  <rect x="64" y="252" width="332" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="96" cy="280" r="15" fill="#1d4ed8"/>
  <text x="96" y="285.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="122" y="286" font-size="17" font-weight="bold" fill="#111827">속성만 업데이트</text>

  <!-- 3. 다른 타입 → 이전 트리 제거, 새 트리 생성 -->
  <rect x="484" y="252" width="332" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="516" cy="280" r="15" fill="#1d4ed8"/>
  <text x="516" y="285.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="542" y="286" font-size="17" font-weight="bold" fill="#111827">이전 트리 제거, 새 트리 생성</text>

  <path d="M230,308 V342" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 4. 자식 재귀적 비교 (key 활용) -->
  <rect x="64" y="344" width="332" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="96" cy="372" r="15" fill="#1d4ed8"/>
  <text x="96" y="377.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="122" y="378" font-size="17" font-weight="bold" fill="#111827">자식 재귀적 비교 (key 활용)</text>

  <!-- 재귀: 자식마다 타입 비교로 돌아감 -->
  <path d="M64,372 H40 V152 H336" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrb)"/>
  <text x="56" y="142" font-size="15" font-weight="bold" fill="#1d4ed8">자식마다 재귀적으로 반복</text>

  <!-- 4 → 5, 3 → 5 -->
  <path d="M230,400 V472 H298" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M650,308 V472 H582" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 5. 변경사항 수집 -->
  <rect x="300" y="444" width="280" height="56" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="342" cy="472" r="15" fill="#6d28d9"/>
  <text x="342" y="477.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="368" y="478" font-size="17" font-weight="bold" fill="#111827">변경사항 수집</text>

  <path d="M440,500 V534" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 6. 실제 DOM에 반영 -->
  <rect x="300" y="536" width="280" height="56" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="342" cy="564" r="15" fill="#047857"/>
  <text x="342" y="569.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="368" y="570" font-size="17" font-weight="bold" fill="#111827">실제 DOM에 반영</text>

  <!-- 범례 -->
  <rect x="64" y="619" width="16" height="16" rx="3" fill="#1d4ed8"/>
  <text x="88" y="632" font-size="15" fill="#374151">비교 및 가상 DOM 연산 (1~4)</text>
  <rect x="330" y="619" width="16" height="16" rx="3" fill="#6d28d9"/>
  <text x="354" y="632" font-size="15" fill="#374151">diff 수집 (5)</text>
  <rect x="496" y="619" width="16" height="16" rx="3" fill="#047857"/>
  <text x="520" y="632" font-size="15" fill="#374151">실제 DOM 패치 (6)</text>
</svg>
