<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브라우저는 문서를 두 번 만든다</title>
  <desc id="d">index.html 파일에서 DOM 트리와 접근성 트리가 생성되어 각각 화면 렌더링과 운영체제 접근성 API를 거쳐 스크린 리더로 이어지는 과정 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title / Heading -->
  <text x="440" y="36" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">2. 브라우저는 문서를 두 번 만든다</text>

  <!-- index.html Box -->
  <rect x="360" y="60" width="160" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="84" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">index.html</text>

  <!-- Split Branch Lines -->
  <path d="M440,100 L440,120" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M220,120 L660,120" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  
  <path d="M220,120 L220,148" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M660,120 L660,148" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Left Flow: DOM Tree -->
  <rect x="130" y="150" width="180" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="176" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">DOM 트리</text>

  <path d="M220,194 L220,448" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="130" y="450" width="180" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="476" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">화면 렌더링</text>

  <!-- Right Flow: Accessibility Tree and Details -->
  <!-- Main Accessibility Tree Box -->
  <rect x="440" y="150" width="410" height="170" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  
  <!-- Accessibility Tree Header -->
  <rect x="560" y="160" width="200" height="34" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="660" y="181" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">접근성 트리</text>

  <!-- Tree Items -->
  <text x="470" y="218" fill="#52606d" font-size="13">├─</text>
  <text x="490" y="218" fill="#1f2933" font-size="13" font-weight="bold">role(역할):</text>
  <text x="565" y="218" fill="#52606d" font-size="13">이게 버튼인가 링크인가 제목인가</text>

  <text x="470" y="250" fill="#52606d" font-size="13">├─</text>
  <text x="490" y="250" fill="#1f2933" font-size="13" font-weight="bold">name(이름):</text>
  <text x="572" y="250" fill="#52606d" font-size="13">뭐라고 읽을 것인가</text>

  <text x="470" y="282" fill="#52606d" font-size="13">├─</text>
  <text x="490" y="282" fill="#1f2933" font-size="13" font-weight="bold">state(상태):</text>
  <text x="572" y="282" fill="#52606d" font-size="13">눌렸나 열렸나 비활성인가</text>

  <!-- Arrow down from Tree Details -->
  <path d="M476,288 L476,338" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- OS Accessibility API Box -->
  <rect x="520" y="340" width="280" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="366" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">운영체제 접근성 API</text>

  <!-- Arrow down to Screen Readers -->
  <path d="M476,370 L476,428" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Screen Readers Box -->
  <rect x="520" y="430" width="280" height="64" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="456" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">NVDA / VoiceOver / TalkBack</text>
  <text x="660" y="477" fill="#52606d" font-size="12" text-anchor="middle">(스크린 리더)</text>
</svg>