<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DOM 트리와 접근성 트리</title>
  <desc id="d">브라우저는 index.html을 파싱해 DOM 트리와 접근성 트리를 따로 만든다. DOM 트리는 화면 렌더링으로, role·name·state를 담은 접근성 트리는 운영체제 접근성 API를 거쳐 NVDA·VoiceOver·TalkBack 같은 스크린 리더로 간다.</desc>
  <rect width="880" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 원본 문서 -->
  <rect x="360" y="24" width="160" height="46" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="53" text-anchor="middle" font-size="17" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">index.html</text>

  <!-- 갈래 -->
  <line x1="440" y1="70" x2="440" y2="106" stroke="#374151" stroke-width="2"/>
  <text x="454" y="94" font-size="14" fill="#4b5563">브라우저가 파싱</text>
  <path d="M440,106 H170 V132" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M440,106 H598 V132" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- 왼쪽: DOM 트리 → 화면 렌더링 -->
  <rect x="40" y="136" width="260" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">DOM 트리</text>

  <line x1="170" y1="188" x2="170" y2="484" stroke="#6b7280" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="40" y="488" width="260" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="526" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">화면 렌더링</text>

  <!-- 오른쪽: 접근성 트리 -->
  <rect x="340" y="136" width="516" height="200" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="167" font-size="18" font-weight="700" fill="#1e3a8a">접근성 트리 <tspan font-size="15" font-weight="400" fill="#4b5563">(accessibility tree)</tspan></text>

  <rect x="356" y="184" width="484" height="136" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <line x1="356" y1="229" x2="840" y2="229" stroke="#bfdbfe" stroke-width="1"/>
  <line x1="356" y1="275" x2="840" y2="275" stroke="#bfdbfe" stroke-width="1"/>
  <line x1="496" y1="184" x2="496" y2="320" stroke="#bfdbfe" stroke-width="1"/>

  <text x="372" y="212" font-size="16" fill="#1d4ed8"><tspan font-weight="700" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">role</tspan><tspan fill="#4b5563" font-size="15"> (역할)</tspan></text>
  <text x="512" y="212" font-size="16" fill="#111827">이게 버튼인가 링크인가 제목인가</text>

  <text x="372" y="258" font-size="16" fill="#1d4ed8"><tspan font-weight="700" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</tspan><tspan fill="#4b5563" font-size="15"> (이름)</tspan></text>
  <text x="512" y="258" font-size="16" fill="#111827">뭐라고 읽을 것인가</text>

  <text x="372" y="303" font-size="16" fill="#1d4ed8"><tspan font-weight="700" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">state</tspan><tspan fill="#4b5563" font-size="15"> (상태)</tspan></text>
  <text x="512" y="303" font-size="16" fill="#111827">눌렸나 열렸나 비활성인가</text>

  <!-- 접근성 트리 → OS API → 스크린 리더 -->
  <line x1="598" y1="336" x2="598" y2="378" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="448" y="382" width="300" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="598" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">운영체제 접근성 API</text>

  <line x1="598" y1="430" x2="598" y2="484" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <rect x="418" y="488" width="360" height="64" rx="8" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="598" y="514" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">스크린 리더</text>
  <text x="598" y="539" text-anchor="middle" font-size="15" fill="#ffffff">NVDA / VoiceOver / TalkBack</text>

  <!-- 요점 -->
  <text x="440" y="592" text-anchor="middle" font-size="16" fill="#111827">스크린 리더가 읽는 것은 <tspan font-weight="700" fill="#b91c1c">DOM이 아니라</tspan> <tspan font-weight="700" fill="#1d4ed8">접근성 트리</tspan></text>
</svg>
