<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">.git 폴더 구조</title>
  <desc id="d">.git 폴더 아래 HEAD(현재 브랜치), objects/(모든 데이터: blob, tree, commit), refs/(브랜치, 태그 포인터), config(설정)가 있는 디렉터리 트리.</desc>
  <rect width="880" height="290" fill="#ffffff"/>

  <!-- root -->
  <text x="160" y="56" font-size="20" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.git/</text>

  <!-- tree lines -->
  <line x1="172" y1="68" x2="172" y2="242" stroke="#9ca3af" stroke-width="2"/>
  <line x1="172" y1="104" x2="198" y2="104" stroke="#9ca3af" stroke-width="2"/>
  <line x1="172" y1="150" x2="198" y2="150" stroke="#9ca3af" stroke-width="2"/>
  <line x1="172" y1="196" x2="198" y2="196" stroke="#9ca3af" stroke-width="2"/>
  <line x1="172" y1="242" x2="198" y2="242" stroke="#9ca3af" stroke-width="2"/>

  <!-- row bands -->
  <rect x="198" y="86" width="520" height="36" rx="6" fill="#f3f4f6"/>
  <rect x="198" y="132" width="520" height="36" rx="6" fill="#eff6ff"/>
  <rect x="198" y="178" width="520" height="36" rx="6" fill="#eff6ff"/>
  <rect x="198" y="224" width="520" height="36" rx="6" fill="#f3f4f6"/>

  <!-- HEAD (file) -->
  <text x="212" y="110" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HEAD</text>
  <text x="350" y="110" font-size="16" fill="#374151">현재 브랜치</text>

  <!-- objects/ (folder) -->
  <text x="212" y="156" font-size="17" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">objects/</text>
  <text x="350" y="156" font-size="16" fill="#374151">모든 데이터 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(blob, tree, commit)</tspan></text>

  <!-- refs/ (folder) -->
  <text x="212" y="202" font-size="17" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">refs/</text>
  <text x="350" y="202" font-size="16" fill="#374151">브랜치, 태그 포인터</text>

  <!-- config (file) -->
  <text x="212" y="248" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">config</text>
  <text x="350" y="248" font-size="16" fill="#374151">설정</text>
</svg>
