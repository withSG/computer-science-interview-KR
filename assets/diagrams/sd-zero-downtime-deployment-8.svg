<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">preStop 대기 구간 타임라인</title>
  <desc id="d">Pod가 Terminating으로 바뀐 t=0부터 preStop sleep 15가 끝나는 t=15까지 쿠버네티스는 Endpoints 제거를 전파하고 애플리케이션은 정상 처리한다. t=15에 SIGTERM, t≤60 안에 안 끝나면 SIGKILL.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="510" fill="#ffffff"/>

  <!-- 시간 축 연결선 -->
  <line x1="68" y1="65" x2="68" y2="86" stroke="#9ca3af" stroke-width="2"/>
  <line x1="68" y1="296" x2="68" y2="339" stroke="#9ca3af" stroke-width="2"/>
  <line x1="68" y1="375" x2="68" y2="437" stroke="#9ca3af" stroke-width="2"/>

  <!-- 시간 라벨 -->
  <rect x="24" y="29" width="88" height="36" rx="18" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="68" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">t=0</text>

  <rect x="24" y="86" width="88" height="210" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="68" y="197" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">t=0~15</text>

  <rect x="24" y="339" width="88" height="36" rx="18" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="68" y="363" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle">t=15</text>

  <rect x="24" y="437" width="88" height="36" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="68" y="461" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">t≤60</text>

  <!-- t=0 -->
  <rect x="132" y="24" width="724" height="46" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="152" y="53" font-size="17" font-weight="bold" fill="#111827">Pod가 Terminating 상태로 전환</text>

  <!-- t=0~15 구간 (두 갈래가 동시에 진행) -->
  <rect x="132" y="86" width="724" height="210" rx="8" fill="#eff6ff"/>
  <text x="186" y="112" font-size="15" font-weight="bold" fill="#1e40af">쿠버네티스 · LB 쪽</text>
  <text x="556" y="112" font-size="15" font-weight="bold" fill="#1e40af">Pod 쪽 (preStop · 애플리케이션)</text>

  <line x1="170" y1="70" x2="170" y2="120" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="540" y1="70" x2="540" y2="120" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="140" y="124" width="346" height="64" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text font-size="15" fill="#111827"><tspan x="156" y="151">쿠버네티스가 Endpoints에서 이 Pod를</tspan><tspan x="156" y="173">제거하기 시작 (비동기)</tspan></text>

  <rect x="510" y="124" width="338" height="64" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="526" y="162" font-size="15" fill="#111827">preStop 훅 시작: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">sleep 15</tspan></text>

  <line x1="170" y1="188" x2="170" y2="208" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="540" y1="188" x2="540" y2="208" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="140" y="212" width="346" height="64" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text font-size="15" fill="#111827"><tspan x="156" y="239">그동안 LB/kube-proxy가 이 Pod를</tspan><tspan x="156" y="261">제외하는 작업이 전파된다</tspan></text>

  <rect x="510" y="212" width="338" height="64" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text font-size="15" fill="#111827"><tspan x="526" y="239">애플리케이션은 아직 SIGTERM을 못 받았다</tspan><tspan x="526" y="261" font-weight="bold" fill="#047857">→ 정상적으로 요청 처리 중</tspan></text>

  <!-- t=15 -->
  <line x1="170" y1="276" x2="170" y2="335" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="540" y1="276" x2="540" y2="335" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="132" y="339" width="724" height="68" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text font-size="16" fill="#111827"><tspan x="152" y="366" font-weight="bold" fill="#5b21b6">preStop 종료 → 이제 SIGTERM 전송</tspan><tspan x="152" y="392" font-size="15">→ 새 요청은 이미 오지 않는 상태. 진행 중인 것만 처리하고 종료</tspan></text>

  <!-- t≤60 -->
  <line x1="170" y1="407" x2="170" y2="428" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="132" y="432" width="724" height="46" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="152" y="461" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">terminationGracePeriodSeconds</tspan> 안에 안 끝나면 <tspan font-weight="bold" fill="#b91c1c">SIGKILL</tspan></text>
</svg>
