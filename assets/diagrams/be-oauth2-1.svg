<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비밀번호 위임 방식의 문제</title>
  <desc id="d">사용자가 친구찾기 서비스에 구글 아이디와 비밀번호를 입력하면, 서비스는 그 비밀번호로 로그인해 주소록뿐 아니라 메일, 드라이브, 결제수단, 비밀번호 변경까지 Google 계정 전체에 접근하게 됩니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 사용자 -->
  <rect x="24" y="32" width="140" height="60" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="94" y="69" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">사용자</text>

  <!-- 친구찾기 서비스 -->
  <rect x="616" y="32" width="240" height="60" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="736" y="69" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">친구찾기 서비스</text>

  <!-- 1단계: 비밀번호 입력 -->
  <line x1="170" y1="62" x2="608" y2="62" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="389" y="50" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">"구글 아이디/비번을 여기 입력하세요"</text>
  <text x="389" y="84" font-size="14" fill="#4b5563" text-anchor="middle">사용자가 구글 아이디·비밀번호를 건넴</text>

  <!-- 2단계: 사용자 비번으로 로그인 -->
  <line x1="736" y1="98" x2="736" y2="152" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="720" y="131" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="end">사용자 비번으로 로그인</text>

  <!-- Google 계정 전체 -->
  <rect x="24" y="154" width="832" height="154" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="48" y="192" font-size="20" font-weight="bold" fill="#b91c1c">Google 계정 전체</text>

  <rect x="48" y="210" width="92" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="94" y="236" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">주소록</text>

  <rect x="156" y="210" width="76" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="194" y="236" font-size="16" fill="#991b1b" text-anchor="middle">메일</text>

  <rect x="248" y="210" width="100" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="298" y="236" font-size="16" fill="#991b1b" text-anchor="middle">드라이브</text>

  <rect x="364" y="210" width="100" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="414" y="236" font-size="16" fill="#991b1b" text-anchor="middle">결제수단</text>

  <rect x="480" y="210" width="140" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="550" y="236" font-size="16" fill="#991b1b" text-anchor="middle">비밀번호 변경</text>

  <text x="640" y="236" font-size="18" font-weight="bold" fill="#991b1b">…</text>

  <!-- 묶음 표시 -->
  <path d="M50,260 v8 h88 v-8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="94" y="290" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">서비스가 원한 것</text>
  <path d="M156,260 v8 h510 v-8" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="411" y="290" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">비밀번호 하나로 함께 열리는 나머지 전부</text>
</svg>
