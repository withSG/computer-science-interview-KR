<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 필요한가 — 비밀번호를 통째로 넘기는 시대</title>
  <desc id="d">사용자가 친구찾기 서비스에 구글 아이디와 비밀번호를 입력하면, 해당 서비스가 비밀번호로 로그인하여 주소록, 메일, 드라이브 등 구글 계정 전체에 접근하는 위험한 구조를 보여주는 다이어그램입니다.</desc>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-red-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L5,10 L10,0 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 사용자 박스 -->
  <rect x="30" y="30" width="120" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="90" y="60.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">사용자</text>

  <!-- 친구찾기 서비스 박스 -->
  <rect x="660" y="30" width="180" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="750" y="60.5" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">친구찾기 서비스</text>

  <!-- 화살표: 사용자 -> 친구찾기 서비스 -->
  <path d="M150,55 L660,55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>

  <!-- 화살표 라벨 (배경 박스 + 텍스트) -->
  <rect x="235" y="41" width="340" height="28" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="405" y="59.5" font-size="13" fill="#dc2626" text-anchor="middle">"구글 아이디/비번을 여기 입력하세요"</text>

  <!-- 화살표: 친구찾기 서비스 -> Google 계정 전체 -->
  <path d="M750,80 L750,150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red-down)"/>

  <!-- 수직 화살표 라벨 (배경 박스 + 텍스트) -->
  <rect x="655" y="100" width="190" height="26" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="750" y="117.5" font-size="12" fill="#dc2626" text-anchor="middle">사용자 비번으로 로그인</text>

  <!-- Google 계정 전체 경고 박스 -->
  <rect x="180" y="150" width="660" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>

  <!-- Google 계정 전체 내용 -->
  <text x="510" y="210" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">Google 계정 전체</text>
  <text x="510" y="245" font-size="14" fill="#1f2933" text-anchor="middle">(주소록, 메일, 드라이브, 결제수단, 비밀번호 변경…)</text>
</svg>