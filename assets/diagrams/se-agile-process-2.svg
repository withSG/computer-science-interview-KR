<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스크럼의 흐름: 백로그에서 회고까지</title>
  <desc id="d">PO가 우선순위로 정렬한 제품 백로그에서 스프린트 계획으로 이번 주기 분량을 뽑아 스프린트 백로그를 만들고, 길이가 고정된(보통 2주) 스프린트 동안 매일 15분 데일리 스크럼을 한 뒤, 스프린트 리뷰에서 증분을, 스프린트 회고에서 다음 스프린트의 개선 액션을 낸다.</desc>
  <rect width="880" height="650" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <rect x="620" y="30" width="36" height="20" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="664" y="46" font-size="15" fill="#374151">이벤트</text>
  <rect x="730" y="30" width="36" height="20" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="774" y="46" font-size="15" fill="#374151">산출물</text>

  <!-- 제품 백로그 -->
  <rect x="40" y="40" width="320" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="67" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">제품 백로그</text>
  <text x="200" y="92" font-size="15" fill="#374151" text-anchor="middle">(Product Backlog)</text>
  <line x1="398" y1="72" x2="366" y2="72" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="408" y="78" font-size="16" fill="#374151">PO가 우선순위 순으로 정렬</text>

  <!-- 스프린트 계획 -->
  <line x1="200" y1="104" x2="200" y2="126" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="110" y="130" width="180" height="36" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="200" y="154" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">스프린트 계획</text>
  <text x="310" y="154" font-size="16" fill="#374151">위에서부터 이번 주기 분량만 뽑는다</text>
  <line x1="200" y1="166" x2="200" y2="192" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 스프린트 백로그 -->
  <rect x="40" y="196" width="320" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="223" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">스프린트 백로그</text>
  <text x="200" y="248" font-size="15" fill="#374151" text-anchor="middle">(Sprint Backlog)</text>
  <line x1="200" y1="260" x2="200" y2="294" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 스프린트 -->
  <rect x="40" y="298" width="800" height="170" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="60" y="330" font-size="18" font-weight="bold" fill="#92400e">스프린트</text>
  <text x="140" y="330" font-size="16" fill="#374151">(길이 고정, 보통 2주)</text>

  <!-- 날짜 -->
  <line x1="198" y1="366" x2="282" y2="366" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="378" y1="366" x2="478" y2="366" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="542" y1="366" x2="642" y2="366" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="102" y="348" width="96" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="150" y="372" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Day 1</text>
  <rect x="282" y="348" width="96" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330" y="372" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Day 2</text>
  <text x="510" y="372" font-size="18" font-weight="bold" fill="#4b5563" text-anchor="middle">···</text>
  <rect x="642" y="348" width="96" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="690" y="372" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Day 10</text>

  <!-- 매일 데일리 스크럼 -->
  <path d="M150,384 L150,402 M330,384 L330,402 M690,384 L690,402 M150,402 L690,402 M420,402 L420,414" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <rect x="300" y="416" width="240" height="34" rx="17" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="420" y="439" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">데일리 스크럼 · 매일 15분</text>

  <!-- 스프린트 리뷰 → 증분 -->
  <line x1="200" y1="468" x2="200" y2="498" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="110" y="502" width="180" height="36" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="200" y="526" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">스프린트 리뷰</text>
  <line x1="290" y1="520" x2="398" y2="520" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="404" y="490" width="436" height="60" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="424" y="515" font-size="18" font-weight="bold" fill="#1e3a8a">증분(Increment)</text>
  <text x="424" y="539" font-size="16" fill="#374151">= 잠재적으로 출시 가능한 결과물</text>

  <!-- 스프린트 회고 → 개선 액션 -->
  <line x1="200" y1="538" x2="200" y2="576" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="110" y="580" width="180" height="36" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="200" y="604" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">스프린트 회고</text>
  <line x1="290" y1="598" x2="398" y2="598" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="404" y="574" width="436" height="48" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="424" y="604" font-size="16" fill="#111827">다음 스프린트의 개선 액션</text>
</svg>
