<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스크럼 — 각 부품이 푸는 문제</title>
  <desc id="d">제품 백로그에서 스프린트 계획을 거쳐 스프린트 백로그, 스프린트 진행, 스프린트 리뷰 및 회고로 이어지는 스크럼 프로세스 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="660" fill="#ffffff"/>

  <!-- Outer Container Box -->
  <rect x="24" y="24" width="832" height="612" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 1. Product Backlog -->
  <rect x="54" y="54" width="360" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="83" font-size="14" font-weight="bold" fill="#1f2933">제품 백로그(Product Backlog)</text>
  <text x="246" y="83" font-size="13" fill="#2563eb">← PO가 우선순위 순으로 정렬</text>

  <!-- Flow 1: Product Backlog -> Sprint Backlog -->
  <path d="M 120 102 L 120 184" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="128" y="132" width="370" height="22" fill="#ffffff" rx="3" stroke="#cbd2d9" stroke-width="1"/>
  <text x="134" y="147" font-size="12" fill="#52606d">[스프린트 계획] 위에서부터 이번 주기 분량만 뽑는다</text>

  <!-- 2. Sprint Backlog -->
  <rect x="54" y="186" width="230" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="169" y="213" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">스프린트 백로그(Sprint Backlog)</text>

  <!-- Flow 2: Sprint Backlog -> Sprint Box -->
  <path d="M 169 230 L 169 280 L 212 280" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 3. Sprint Group Container -->
  <rect x="214" y="246" width="582" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="234" y="271" font-size="13" font-weight="bold" fill="#7c3aed">스프린트 (길이 고정, 보통 2주)</text>

  <!-- Sprint Days Sequence Inside Container -->
  <rect x="234" y="286" width="542" height="54" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="254" y="318" font-size="13" font-weight="bold" fill="#1f2933">Day 1</text>
  <text x="296" y="318" font-size="13" fill="#52606d">─</text>
  <text x="312" y="318" font-size="13" font-weight="bold" fill="#1f2933">Day 2</text>
  <text x="354" y="318" font-size="13" fill="#52606d">─ ... ─</text>
  <text x="404" y="318" font-size="13" font-weight="bold" fill="#1f2933">Day 10</text>

  <text x="464" y="318" font-size="12" fill="#7c3aed">└ 매일 15분 [데일리 스크럼]</text>

  <!-- Flow 3: Sprint Container -> Review & Increment / Retrospective -->
  <path d="M 505 356 L 505 408" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 4. Sprint Review & Increment Row -->
  <rect x="214" y="410" width="136" height="42" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="282" y="436" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[스프린트 리뷰]</text>

  <path d="M 350 431 L 388 431" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Increment Box -->
  <rect x="390" y="402" width="406" height="58" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="406" y="426" font-size="14" font-weight="bold" fill="#059669">증분(Increment)</text>
  <text x="406" y="447" font-size="12" fill="#52606d">= 잠재적으로 출시 가능한 결과물</text>

  <!-- Flow 4: Sprint Review -> Sprint Retrospective -->
  <path d="M 282 452 L 282 508" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 5. Sprint Retrospective & Action Row -->
  <rect x="214" y="510" width="136" height="42" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="282" y="536" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[스프린트 회고]</text>

  <path d="M 350 531 L 388 531" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Improvement Action Box -->
  <rect x="390" y="510" width="406" height="42" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="406" y="536" font-size="13" fill="#1f2933">다음 스프린트의 개선 액션</text>
</svg>