<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">java.io가 교과서인 이유</title>
  <desc id="d">FileInputStream, InputStreamReader, BufferedReader로 이어지는 어댑터 및 데코레이터 패턴의 흐름을 나타낸 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Node 1: FileInputStream -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="110" y="29.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">FileInputStream</text>
    
    <text x="250" y="29.5" text-anchor="start" font-size="13" fill="#52606d">원본. byte를 읽는다</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M140,80 L140,120" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Node 2: InputStreamReader -->
  <g transform="translate(30, 120)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="29.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">InputStreamReader</text>
    
    <text x="250" y="29.5" text-anchor="start" font-size="13" fill="#1f2933">어댑터. InputStream을 받아 Reader를 구현한다 → 인터페이스가 바뀐다</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M140,170 L140,210" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Node 3: BufferedReader -->
  <g transform="translate(30, 210)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="110" y="29.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">BufferedReader</text>
    
    <text x="250" y="21.5" text-anchor="start" font-size="13" fill="#1f2933">데코레이터. Reader를 받아 Reader를 구현한다 → 인터페이스는 그대로,</text>
    <text x="250" y="42.5" text-anchor="start" font-size="13" fill="#1f2933">버퍼링과 readLine() 기능만 얹는다</text>
  </g>
</svg>