<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">java.io 어댑터와 데코레이터</title>
  <desc id="d">FileInputStream(원본, byte를 읽는다)을 InputStreamReader가 받아 Reader를 구현하므로 인터페이스가 바뀌는 어댑터이고, 그것을 BufferedReader가 받아 다시 Reader를 구현하므로 인터페이스는 그대로 두고 버퍼링과 readLine() 기능만 얹는 데코레이터다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. 원본 -->
  <rect x="40" y="30" width="260" height="48" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="170" y="60" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FileInputStream</text>
  <rect x="332" y="39" width="104" height="30" rx="15" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="384" y="59" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">원본</text>
  <text x="456" y="60" font-size="16" fill="#111827">byte를 읽는다</text>

  <!-- 화살표 1 -->
  <path d="M170,78 V132" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="184" y="111" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">InputStream</text>

  <!-- 2. 어댑터 -->
  <rect x="40" y="136" width="260" height="48" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="170" y="166" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">InputStreamReader</text>
  <rect x="332" y="145" width="104" height="30" rx="15" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="384" y="165" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">어댑터</text>
  <text x="456" y="154" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">InputStream</tspan>을 받아 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Reader</tspan>를 구현한다</text>
  <text x="456" y="180" font-size="16" font-weight="700" fill="#b45309">→ 인터페이스가 바뀐다</text>

  <!-- 화살표 2 -->
  <path d="M170,184 V250" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text x="184" y="223" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Reader</text>

  <!-- 3. 데코레이터 -->
  <rect x="40" y="254" width="260" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="170" y="284" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">BufferedReader</text>
  <rect x="332" y="263" width="104" height="30" rx="15" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="384" y="283" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">데코레이터</text>
  <text x="456" y="258" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Reader</tspan>를 받아 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Reader</tspan>를 구현한다</text>
  <text x="456" y="284" font-size="16" font-weight="700" fill="#1d4ed8">→ 인터페이스는 그대로,</text>
  <text x="474" y="308" font-size="16" fill="#111827">버퍼링과 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">readLine()</tspan> 기능만 얹는다</text>

  <!-- 판별 기준 -->
  <rect x="40" y="340" width="800" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="372" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">인터페이스가 바뀌면 <tspan fill="#b45309">어댑터</tspan>, 그대로면 <tspan fill="#1d4ed8">데코레이터</tspan></text>
</svg>
