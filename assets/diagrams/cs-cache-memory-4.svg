<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">접근 순서를 메모리 배치와 맞춘다</title>
  <desc id="d">코드 A의 연속 접근과 코드 B의 건너뜀 접근 방식을 캐시 메모리 라인 관점에서 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- Section 1: Code A -->
  <g id="code-a-group">
    <!-- Code A Title Label: font-size 14, text width ~156px -> box width 200px -->
    <rect x="40" y="30" width="200" height="32" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="140" y="51" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">코드 A의 접근 순서 (연속)</text>

    <!-- Code A Memory Array Boxes -->
    <!-- Block 1 -->
    <rect x="40" y="80" width="310" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="55" y="105" font-size="13" font-weight="bold" fill="#1f2933">a00</text>
    <text x="110" y="105" font-size="13" font-weight="bold" fill="#1f2933">a01</text>
    <text x="165" y="105" font-size="13" font-weight="bold" fill="#1f2933">a02</text>
    <text x="220" y="105" font-size="13" font-weight="bold" fill="#1f2933">a03</text>
    <text x="280" y="105" font-size="13" fill="#52606d">...</text>

    <!-- Block 2 -->
    <rect x="360" y="80" width="230" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="380" y="105" font-size="13" font-weight="bold" fill="#1f2933">a10</text>
    <text x="435" y="105" font-size="13" font-weight="bold" fill="#1f2933">a11</text>
    <text x="495" y="105" font-size="13" fill="#52606d">...</text>

    <!-- Code A Arrows (→ → → →) -->
    <path d="M 75,135 L 95,135" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <path d="M 130,135 L 150,135" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <path d="M 185,135 L 205,135" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <path d="M 240,135 L 260,135" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <!-- Code A Annotation Text -->
    <text x="280" y="139" font-size="13" font-weight="bold" fill="#059669">한 라인 로드로 이후 15개 히트</text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="180" x2="840" y2="180" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Section 2: Code B -->
  <g id="code-b-group">
    <!-- Code B Title Label: font-size 14, text width ~176px -> box width 220px -->
    <rect x="40" y="210" width="220" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="150" y="231" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">코드 B의 접근 순서 (건너뜀)</text>

    <!-- Code B Memory Array Boxes -->
    <!-- Block 1 -->
    <rect x="40" y="260" width="160" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="65" y="285" font-size="13" font-weight="bold" fill="#1f2933">a00</text>
    <text x="135" y="285" font-size="13" fill="#52606d">...</text>

    <!-- Block 2 -->
    <rect x="220" y="260" width="160" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="245" y="285" font-size="13" font-weight="bold" fill="#1f2933">a10</text>
    <text x="315" y="285" font-size="13" fill="#52606d">...</text>

    <!-- Block 3 -->
    <rect x="400" y="260" width="160" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="425" y="285" font-size="13" font-weight="bold" fill="#1f2933">a20</text>
    <text x="495" y="285" font-size="13" fill="#52606d">...</text>

    <!-- Code B Arrows (↓ ↓ ↓) -->
    <path d="M 77,310 L 77,340" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <path d="M 257,310 L 257,340" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <path d="M 437,310 L 437,340" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- Code B Annotation Text: text width ~465px -> text group starting at x=40 -->
    <text x="40" y="375" font-size="13" font-weight="bold" fill="#dc2626">40,000바이트씩 점프 → 매번 새 캐시 라인 → 배열이 크면 Capacity Miss까지 겹침</text>
  </g>
</svg>