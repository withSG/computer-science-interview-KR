<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">퀵 정렬 균등 분할과 편향 분할</title>
  <desc id="d">균등 분할(평균)은 n이 n/2 두 개로 갈라져 깊이 log n × 레벨당 n = O(n log n)이고, 편향 분할(최악)은 한쪽이 0개, 다른 쪽이 n-1, n-2…로 줄어 깊이 n × 레벨당 n = O(n²)이 된다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <rect x="24" y="16" width="404" height="414" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="452" y="16" width="404" height="414" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="226" y="50" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle">균등 분할 (평균)</text>
  <text x="654" y="50" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">편향 분할 (최악)</text>
  <line x1="261" y1="110" x2="191" y2="144" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="281" y1="110" x2="351" y2="144" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="181" y1="182" x2="151" y2="220" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="201" y1="182" x2="231" y2="220" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="341" y1="182" x2="311" y2="220" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="361" y1="182" x2="391" y2="220" stroke="#6b7280" stroke-width="1.6"/>
  <rect x="231" y="72" width="80" height="38" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="271" y="97" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">n</text>
  <rect x="151" y="144" width="80" height="38" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="191" y="169" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">n/2</text>
  <rect x="311" y="144" width="80" height="38" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="351" y="169" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">n/2</text>
  <text x="151" y="240" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">…</text>
  <text x="231" y="240" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">…</text>
  <text x="311" y="240" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">…</text>
  <text x="391" y="240" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">…</text>
  <path d="M52,72 H44 V246 H52" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="58" y="155" font-size="16" font-weight="bold" fill="#047857"><tspan x="58">깊이</tspan><tspan x="58" dy="21">log n</tspan></text>
  <line x1="620" y1="110" x2="570" y2="144" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="640" y1="110" x2="700" y2="144" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="690" y1="182" x2="640" y2="216" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="710" y1="182" x2="770" y2="216" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="780" y1="254" x2="826" y2="292" stroke="#6b7280" stroke-width="1.6"/>
  <rect x="590" y="72" width="80" height="38" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="630" y="97" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">n</text>
  <rect x="538" y="144" width="64" height="38" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="570" y="168" font-size="16" fill="#4b5563" text-anchor="middle">0개</text>
  <rect x="660" y="144" width="80" height="38" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="700" y="169" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">n-1</text>
  <rect x="608" y="216" width="64" height="38" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="640" y="240" font-size="16" fill="#4b5563" text-anchor="middle">0개</text>
  <rect x="730" y="216" width="80" height="38" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="770" y="241" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">n-2</text>
  <text x="832" y="312" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">…</text>
  <path d="M478,72 H470 V318 H478" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="484" y="191" font-size="16" font-weight="bold" fill="#b91c1c"><tspan x="484">깊이</tspan><tspan x="484" dy="21">n</tspan></text>
  <rect x="44" y="346" width="364" height="66" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="226" y="372" font-size="16" fill="#111827" text-anchor="middle">깊이 log n × 레벨당 n</text>
  <text x="226" y="400" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">= O(n log n)</text>
  <rect x="472" y="346" width="364" height="66" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="654" y="372" font-size="16" fill="#111827" text-anchor="middle">깊이 n × 레벨당 n</text>
  <text x="654" y="400" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">= O(n²)</text>
</svg>
