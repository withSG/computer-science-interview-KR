<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">bcrypt 해시 문자열 읽기</title>
  <desc id="d">bcrypt 해시 문자열 $2b$12$Kx7Q9pLmN2vR4sT6uW8yZeAbCdEfGhIjKlMnOpQrStUvWxYz01234를 알고리즘 식별자, cost = 12(반복 2^12회), Salt(22자, 자동 생성), 해시 결과로 나누어 보여준다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>

  <text x="24" y="40" font-size="17" font-weight="bold" fill="#111827">알고리즘 · cost · Salt가 전부 한 문자열에 들어 있다</text>

  <!-- 해시 문자열 -->
  <text x="53" y="93" font-size="19" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">$</text>
  <rect x="62" y="64" width="44" height="44" rx="4" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="84" y="93" font-size="19" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">2b</text>
  <text x="115" y="93" font-size="19" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">$</text>
  <rect x="124" y="64" width="44" height="44" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="146" y="93" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">12</text>
  <text x="177" y="93" font-size="19" font-weight="bold" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">$</text>
  <rect x="186" y="64" width="274" height="44" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="323" y="93" font-size="19" font-weight="bold" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Kx7Q9pLmN2vR4sT6uW8yZe</text>
  <rect x="462" y="64" width="376" height="44" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="650" y="93" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">AbCdEfGhIjKlMnOpQrStUvWxYz01234</text>

  <!-- 해시 결과 -->
  <path d="M650,110 V150 H664" fill="none" stroke="#047857" stroke-width="1.8"/>
  <rect x="666" y="133" width="100" height="34" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="716" y="155" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">해시 결과</text>

  <!-- Salt -->
  <path d="M323,110 V196 H337" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <rect x="339" y="179" width="214" height="34" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="446" y="201" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Salt (22자, 자동 생성)</text>

  <!-- cost -->
  <path d="M146,110 V242 H160" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <rect x="162" y="225" width="236" height="34" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="280" y="247" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">cost = 12 (반복 2^12회)</text>

  <!-- 알고리즘 식별자 -->
  <path d="M84,110 V288 H98" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <rect x="100" y="271" width="144" height="34" rx="4" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="172" y="293" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">알고리즘 식별자</text>
</svg>
