<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">우아한 종료 절차</title>
  <desc id="d">종료 신호(SIGTERM)를 받으면 ① 준비 상태를 false로 바꿔 LB가 새 요청을 보내지 않게 하고, LB가 제외를 반영할 때까지 몇 초 기다린 뒤, ② 이미 받은 요청을 끝까지 처리하고, ③ 커넥션 풀·메시지 컨슈머·스케줄러를 닫고, ④ 프로세스를 종료한다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 유예 시간 괄호 (Kubernetes) -->
  <line x1="324" y1="47" x2="846" y2="47" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="520" y1="424" x2="846" y2="424" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M836,47 H846 V424 H836" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="834" y="300" font-size="14" fill="#4b5563" text-anchor="end">Kubernetes</text>
  <text x="834" y="322" font-size="14" fill="#374151" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">terminationGracePeriodSeconds</text>
  <text x="834" y="344" font-size="14" fill="#4b5563" text-anchor="end">강제 종료까지의 유예 시간</text>

  <!-- 시작: SIGTERM -->
  <rect x="24" y="24" width="300" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="174" y="53" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">종료 신호(SIGTERM) 수신</text>

  <line x1="60" y1="70" x2="60" y2="98" stroke="#374151" stroke-width="2" marker-end="url(#m-ink)"/>

  <!-- ① -->
  <rect x="24" y="100" width="496" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="44" y="132" font-size="17" font-weight="bold" fill="#111827">① 준비 상태를 즉시 false로 바꾼다</text>
  <line x1="520" y1="126" x2="562" y2="126" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
  <rect x="568" y="100" width="248" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="692" y="132" font-size="16" fill="#1e3a8a" text-anchor="middle">LB가 새 요청을 안 보낸다</text>

  <!-- 대기 구간 -->
  <rect x="24" y="168" width="792" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="60" y1="152" x2="60" y2="244" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-amber)"/>
  <text x="84" y="194" font-size="16" font-weight="bold" fill="#b45309">몇 초 대기</text>
  <text x="84" y="219" font-size="15" fill="#374151">※ LB가 제외를 반영하는 데 시간이 걸린다. 여기서 몇 초 기다려야 한다.</text>
  <text x="800" y="194" font-size="14" fill="#4b5563" text-anchor="end">Kubernetes: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">preStop</tspan> 훅으로 이 대기를 만든다</text>

  <!-- ② -->
  <rect x="24" y="246" width="496" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="44" y="278" font-size="17" font-weight="bold" fill="#111827">② 이미 받은 요청은 끝까지 처리한다</text>

  <line x1="60" y1="298" x2="60" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#m-ink)"/>

  <!-- ③ -->
  <rect x="24" y="322" width="496" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="44" y="354" font-size="17" font-weight="bold" fill="#111827">③ 커넥션 풀, 메시지 컨슈머, 스케줄러를 정리하고 닫는다</text>

  <line x1="60" y1="374" x2="60" y2="396" stroke="#374151" stroke-width="2" marker-end="url(#m-ink)"/>

  <!-- ④ -->
  <rect x="24" y="398" width="496" height="52" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="44" y="430" font-size="17" font-weight="bold" fill="#111827">④ 프로세스 종료</text>
</svg>
