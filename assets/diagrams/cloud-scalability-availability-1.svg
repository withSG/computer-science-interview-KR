<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Scale-up과 Scale-out</title>
  <desc id="d">Scale-up은 2 vCPU·8 GB 서버를 16 vCPU·64 GB로 교체해 키우므로 교체 중 다운타임이 생기고 1대가 죽으면 서비스 전체가 멈춘다. Scale-out은 같은 2 vCPU·8 GB 서버를 LB 뒤에 여러 대 두어 무중단으로 증설하고, 1대가 죽어도 나머지가 요청을 받는다.</desc>
  <rect width="880" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ===== 왼쪽: Scale-up ===== -->
  <rect x="24" y="24" width="404" height="482" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="226" y="62" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">Scale-up (수직 확장)</text>
  <text x="226" y="88" font-size="16" fill="#374151" text-anchor="middle">같은 서버를 더 크게</text>

  <!-- 교체 후: 큰 서버 -->
  <rect x="116" y="112" width="220" height="128" rx="8" fill="#ffffff" stroke="#92400e" stroke-width="2"/>
  <text x="226" y="170" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="middle">16 vCPU</text>
  <text x="226" y="200" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="middle">64 GB</text>

  <!-- 교체 화살표 -->
  <path d="M226,318 L226,246" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="242" y="274" font-size="15" font-weight="bold" fill="#b91c1c">인스턴스 교체</text>
  <text x="242" y="295" font-size="15" font-weight="bold" fill="#b91c1c">= 다운타임</text>

  <!-- 교체 전: 작은 서버 -->
  <rect x="172" y="320" width="108" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="350" font-size="16" fill="#1f2933" text-anchor="middle">2 vCPU</text>
  <text x="226" y="374" font-size="16" fill="#1f2933" text-anchor="middle">8 GB</text>

  <!-- 결과 -->
  <rect x="48" y="414" width="356" height="64" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="226" y="452" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">1대가 죽으면 서비스 전체 정지</text>

  <!-- ===== 오른쪽: Scale-out ===== -->
  <rect x="452" y="24" width="404" height="482" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="654" y="62" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">Scale-out (수평 확장)</text>
  <text x="654" y="88" font-size="16" fill="#374151" text-anchor="middle">같은 서버를 더 많이</text>

  <!-- LB -->
  <rect x="594" y="128" width="120" height="48" rx="8" fill="#ffffff" stroke="#065f46" stroke-width="2"/>
  <text x="654" y="158" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">LB</text>

  <!-- 분배선 -->
  <path d="M654,176 L654,262" stroke="#047857" stroke-width="2" fill="none"/>
  <path d="M524,262 L784,262" stroke="#047857" stroke-width="2" fill="none"/>
  <path d="M524,262 L524,317" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <path d="M654,262 L654,317" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <path d="M784,262 L784,317" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

  <!-- 같은 서버 3대 -->
  <rect x="470" y="320" width="108" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="524" y="350" font-size="16" fill="#1f2933" text-anchor="middle">2 vCPU</text>
  <text x="524" y="374" font-size="16" fill="#1f2933" text-anchor="middle">8 GB</text>

  <rect x="600" y="320" width="108" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="654" y="350" font-size="16" fill="#1f2933" text-anchor="middle">2 vCPU</text>
  <text x="654" y="374" font-size="16" fill="#1f2933" text-anchor="middle">8 GB</text>

  <rect x="730" y="320" width="108" height="70" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="784" y="350" font-size="16" fill="#1f2933" text-anchor="middle">2 vCPU</text>
  <text x="784" y="374" font-size="16" fill="#1f2933" text-anchor="middle">8 GB</text>

  <!-- 결과 -->
  <rect x="476" y="414" width="356" height="64" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="654" y="440" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">무중단 증설 가능</text>
  <text x="654" y="464" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">1대 죽어도 나머지가 받는다</text>
</svg>
