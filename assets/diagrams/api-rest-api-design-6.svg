<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">7. HATEOAS와 리처드슨 성숙도 모델</title>
  <desc id="d">리처드슨 성숙도 모델의 Level 0부터 Level 3까지의 단계와 각 레벨에 대한 설명 및 부가 설명을 나타낸 SVG 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Level 3 (하이퍼미디어) -->
  <g>
    <rect x="70" y="30" width="300" height="80" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="86" y="65" font-size="14" font-weight="bold" fill="#7c3aed">Level 3</text>
    <text x="146" y="65" font-size="14" fill="#1f2933">하이퍼미디어(HATEOAS)</text>
    
    <text x="400" y="65" font-size="13" fill="#1f2933">응답에 다음 행동 링크 포함</text>
    <text x="400" y="90" font-size="11.5" fill="#52606d">└ 극소수. Spring HATEOAS 등을 써야 함</text>
  </g>

  <!-- Arrow Level 2 -> Level 3 -->
  <path d="M220,140 L220,118" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="206" y="129" font-size="13" fill="#1f2933">▲</text>

  <!-- Level 2 (HTTP 메서드 + 상태 코드) - 실무 표준 강조 -->
  <g>
    <rect x="70" y="140" width="300" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="86" y="175" font-size="14" font-weight="bold" fill="#2563eb">Level 2</text>
    <text x="146" y="175" font-size="14" fill="#1f2933">HTTP 메서드 + 상태 코드</text>
    
    <text x="400" y="175" font-size="13" fill="#1f2933">GET/POST/PUT/DELETE, 200/201/404</text>
    <text x="400" y="200" font-size="11.5" fill="#2563eb" font-weight="bold">└ 실무에서 말하는 "REST API"는 대개 여기</text>
  </g>

  <!-- Arrow Level 1 -> Level 2 -->
  <path d="M220,250 L220,228" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="206" y="239" font-size="13" fill="#1f2933">▲</text>

  <!-- Level 1 (자원) -->
  <g>
    <rect x="70" y="250" width="300" height="80" rx="8" ry="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="86" y="285" font-size="14" font-weight="bold" fill="#52606d">Level 1</text>
    <text x="146" y="285" font-size="14" fill="#1f2933">자원(Resource)</text>
    
    <text x="400" y="285" font-size="13" fill="#1f2933">/users/1 처럼 URI가 자원을 가리킴</text>
    <text x="400" y="310" font-size="11.5" fill="#52606d">└ 근데 전부 POST로 호출</text>
  </g>

  <!-- Arrow Level 0 -> Level 1 -->
  <path d="M220,360 L220,338" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="206" y="349" font-size="13" fill="#1f2933">▲</text>

  <!-- Level 0 (단일 엔드포인트) -->
  <g>
    <rect x="70" y="360" width="300" height="80" rx="8" ry="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="86" y="395" font-size="14" font-weight="bold" fill="#52606d">Level 0</text>
    <text x="146" y="395" font-size="14" fill="#1f2933">단일 엔드포인트</text>
    
    <text x="400" y="395" font-size="13" fill="#1f2933">POST /api 하나에 body로 명령을 담아 보냄</text>
    <text x="400" y="420" font-size="11.5" fill="#52606d">└ SOAP·구식 RPC. "POX의 늪"</text>
  </g>
</svg>