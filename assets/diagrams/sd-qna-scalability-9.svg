<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">복제 방식 - Master-Master (Multi-Master)</title>
  <desc id="d">Master 1과 Master 2가 양방향으로 복제되며 두 노드 모두 읽기 및 쓰기를 처리하는 다이어그램</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="160" fill="#ffffff"/>

  <!-- Master 1 Box -->
  <rect x="230" y="20" width="160" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="64.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Master 1</text>

  <!-- Master 2 Box -->
  <rect x="490" y="20" width="160" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="64.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Master 2</text>

  <!-- Top Arrow: Master 2 -> Master 1 (Leftward) -->
  <path d="M 490 48 L 390 48" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Bottom Arrow: Master 1 -> Master 2 (Rightward) -->
  <path d="M 390 72 L 490 72" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Sub-labels under boxes -->
  <text x="310" y="124.025" fill="#52606d" font-size="11.5" text-anchor="middle">읽기/쓰기</text>
  <text x="570" y="124.025" fill="#52606d" font-size="11.5" text-anchor="middle">읽기/쓰기</text>
</svg>