<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4단계 절차</title>
  <desc id="d">측정, 원인, 조치, 결과의 4단계 성능 개선 절차와 각 단계별 세부 설명 및 주의사항을 나타낸 다이어그램입니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- Top Main Process Boxes -->
  <!-- [1] 측정 -->
  <rect x="24" y="30" width="168" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="108" y="60.5" fill="#2563eb" font-size="16" font-weight="bold" text-anchor="middle">[1] 측정</text>

  <!-- [2] 원인 -->
  <rect x="248" y="30" width="168" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="332" y="60.5" fill="#2563eb" font-size="16" font-weight="bold" text-anchor="middle">[2] 원인</text>

  <!-- [3] 조치 -->
  <rect x="472" y="30" width="168" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="556" y="60.5" fill="#2563eb" font-size="16" font-weight="bold" text-anchor="middle">[3] 조치</text>

  <!-- [4] 결과 -->
  <rect x="696" y="30" width="160" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="776" y="60.5" fill="#059669" font-size="16" font-weight="bold" text-anchor="middle">[4] 결과</text>

  <!-- Horizontal Arrows -->
  <path d="M192,55 L248,55" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M416,55 L472,55" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M640,55 L696,55" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Middle Sub-label Section -->
  <!-- [1] Sub-label -->
  <text x="108" y="103.0" fill="#52606d" font-size="13" text-anchor="middle">무엇이</text>
  <text x="108" y="123.0" fill="#52606d" font-size="13" text-anchor="middle">얼마나</text>
  <text x="108" y="143.0" fill="#52606d" font-size="13" text-anchor="middle">느렸나</text>

  <!-- [2] Sub-label -->
  <text x="332" y="103.0" fill="#52606d" font-size="13" text-anchor="middle">왜 느린가</text>

  <!-- [3] Sub-label -->
  <text x="556" y="103.0" fill="#52606d" font-size="13" text-anchor="middle">무엇을 했나</text>

  <!-- [4] Sub-label -->
  <text x="776" y="103.0" fill="#52606d" font-size="13" text-anchor="middle">같은 지표로</text>
  <text x="776" y="123.0" fill="#52606d" font-size="13" text-anchor="middle">다시 측정</text>

  <!-- Vertical Arrows -->
  <path d="M108,155 L108,205" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-sub)"/>
  <path d="M332,155 L332,205" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-sub)"/>
  <path d="M556,155 L556,205" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-sub)"/>
  <path d="M776,155 L776,205" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-sub)"/>

  <!-- Bottom Detailed Explanation Boxes -->
  <!-- [1] Detail Box -->
  <rect x="24" y="210" width="168" height="150" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="108" y="244.0" fill="#1f2933" font-size="13" text-anchor="middle">"개선 전"</text>
  <text x="108" y="268.0" fill="#1f2933" font-size="13" text-anchor="middle">숫자가 없으면</text>
  <text x="108" y="292.0" fill="#1f2933" font-size="13" text-anchor="middle">개선도 없다</text>

  <!-- [2] Detail Box -->
  <rect x="218" y="210" width="228" height="150" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="332" y="235.0" fill="#1f2933" font-size="13" text-anchor="middle">추측이 아닌</text>
  <text x="332" y="259.0" fill="#1f2933" font-size="13" text-anchor="middle">도구로 확인</text>
  <text x="332" y="283.0" fill="#1f2933" font-size="13" text-anchor="middle">(프로파일러,</text>
  <text x="332" y="307.0" fill="#1f2933" font-size="13" text-anchor="middle">네트워크 탭,</text>
  <text x="332" y="331.0" fill="#1f2933" font-size="13" text-anchor="middle">쿼리 로그)</text>

  <!-- [3] Detail Box -->
  <rect x="472" y="210" width="168" height="150" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="556" y="244.0" fill="#1f2933" font-size="13" text-anchor="middle">조치는 하나씩</text>
  <text x="556" y="268.0" fill="#1f2933" font-size="13" text-anchor="middle">묶어서 하면</text>
  <text x="556" y="292.0" fill="#1f2933" font-size="13" text-anchor="middle">무엇이 효과인지</text>
  <text x="556" y="316.0" fill="#1f2933" font-size="13" text-anchor="middle">알 수 없다</text>

  <!-- [4] Detail Box -->
  <rect x="666" y="210" width="220" height="150" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="776" y="244.0" fill="#1f2933" font-size="13" text-anchor="middle">"개선 후"</text>
  <text x="776" y="268.0" fill="#1f2933" font-size="13" text-anchor="middle">측정 조건이</text>
  <text x="776" y="292.0" fill="#1f2933" font-size="13" text-anchor="middle">[1]과 같아야</text>
  <text x="776" y="316.0" fill="#1f2933" font-size="13" text-anchor="middle">비교가 성립</text>
</svg>