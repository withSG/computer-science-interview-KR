<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">성능 개선 4단계 절차</title>
  <desc id="d">성능 개선 경험을 [1] 측정, [2] 원인, [3] 조치, [4] 결과 순서로 정리하는 절차. 단계마다 답할 질문과 지켜야 할 원칙을 적었고, [1]과 [4]는 같은 지표와 같은 조건에서 측정해야 비교가 성립한다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- [1] 측정 -->
  <path d="M24,72 V34 A10,10 0 0 1 34,24 H198 A10,10 0 0 1 208,34 V72 Z" fill="#1d4ed8"/>
  <rect x="24" y="24" width="184" height="276" rx="10" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="92" cy="48" r="14" fill="#ffffff"/>
  <text x="92" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">1</text>
  <text x="116" y="55" font-size="19" font-weight="bold" fill="#ffffff">측정</text>
  <text x="116" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">무엇이 얼마나</text>
  <text x="116" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">느렸나</text>
  <rect x="36" y="148" width="160" height="140" rx="6" fill="#f1f5f9"/>
  <text x="116" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">"개선 전"</text>
  <text x="116" y="198" text-anchor="middle" font-size="15" fill="#1f2937">숫자가 없으면</text>
  <text x="116" y="220" text-anchor="middle" font-size="15" fill="#1f2937">개선도 없다</text>

  <path d="M210,48 H237" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [2] 원인 -->
  <path d="M240,72 V34 A10,10 0 0 1 250,24 H414 A10,10 0 0 1 424,34 V72 Z" fill="#475569"/>
  <rect x="240" y="24" width="184" height="276" rx="10" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="308" cy="48" r="14" fill="#ffffff"/>
  <text x="308" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">2</text>
  <text x="332" y="55" font-size="19" font-weight="bold" fill="#ffffff">원인</text>
  <text x="332" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">왜 느린가</text>
  <rect x="252" y="148" width="160" height="140" rx="6" fill="#f1f5f9"/>
  <text x="332" y="176" text-anchor="middle" font-size="15" fill="#1f2937">추측이 아닌</text>
  <text x="332" y="198" text-anchor="middle" font-size="15" fill="#1f2937">도구로 확인</text>
  <text x="332" y="220" text-anchor="middle" font-size="15" fill="#1f2937">(프로파일러,</text>
  <text x="332" y="242" text-anchor="middle" font-size="15" fill="#1f2937">네트워크 탭,</text>
  <text x="332" y="264" text-anchor="middle" font-size="15" fill="#1f2937">쿼리 로그)</text>

  <path d="M426,48 H453" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [3] 조치 -->
  <path d="M456,72 V34 A10,10 0 0 1 466,24 H630 A10,10 0 0 1 640,34 V72 Z" fill="#475569"/>
  <rect x="456" y="24" width="184" height="276" rx="10" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="524" cy="48" r="14" fill="#ffffff"/>
  <text x="524" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">3</text>
  <text x="548" y="55" font-size="19" font-weight="bold" fill="#ffffff">조치</text>
  <text x="548" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">무엇을 했나</text>
  <rect x="468" y="148" width="160" height="140" rx="6" fill="#f1f5f9"/>
  <text x="548" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">조치는 하나씩</text>
  <text x="548" y="198" text-anchor="middle" font-size="15" fill="#1f2937">묶어서 하면</text>
  <text x="548" y="220" text-anchor="middle" font-size="15" fill="#1f2937">무엇이 효과인지</text>
  <text x="548" y="242" text-anchor="middle" font-size="15" fill="#1f2937">알 수 없다</text>

  <path d="M642,48 H669" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [4] 결과 -->
  <path d="M672,72 V34 A10,10 0 0 1 682,24 H846 A10,10 0 0 1 856,34 V72 Z" fill="#1d4ed8"/>
  <rect x="672" y="24" width="184" height="276" rx="10" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="740" cy="48" r="14" fill="#ffffff"/>
  <text x="740" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">4</text>
  <text x="764" y="55" font-size="19" font-weight="bold" fill="#ffffff">결과</text>
  <text x="764" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">같은 지표로</text>
  <text x="764" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">다시 측정</text>
  <rect x="684" y="148" width="160" height="140" rx="6" fill="#f1f5f9"/>
  <text x="764" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">"개선 후"</text>
  <text x="764" y="198" text-anchor="middle" font-size="15" fill="#1f2937">측정 조건이</text>
  <text x="764" y="220" text-anchor="middle" font-size="15" fill="#1f2937">[1]과 같아야</text>
  <text x="764" y="242" text-anchor="middle" font-size="15" fill="#1f2937">비교가 성립</text>

  <!-- [1] ↔ [4] 같은 조건 -->
  <path d="M116,304 V326 H764 V304" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-start="url(#arrb)" marker-end="url(#arrb)"/>
  <text x="440" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">[1]과 [4]는 같은 지표·같은 조건에서 측정</text>
</svg>
