<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">옮겨간다면 — 스트랭글러 피그</title>
  <desc id="d">모놀리식에서 MSA로 단계적으로 전환하는 스트랭글러 피그 패턴의 1단계부터 4단계까지의 과정</desc>

  <!-- 배경 -->
  <rect width="880" height="620" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커: 잉크/기본 (#1f2933) -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- 화살표 마커: 파랑 (#2563eb) -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <!-- 화살표 마커: 초록 (#059669) -->
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ==================== [1단계] ==================== -->
  <g id="step1">
    <!-- 단계 제목 -->
    <text x="30" y="38" font-size="14" font-weight="bold" fill="#1f2933">[1단계] 앞에 라우팅 계층을 세운다 — 아직 전부 모놀리식으로 보낸다</text>

    <!-- 클라이언트 -->
    <rect x="50" y="55" width="120" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="110" y="79" font-size="13" text-anchor="middle" fill="#1f2933">클라이언트</text>

    <!-- 화살표 1 -->
    <path d="M170,75 L220,75" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- [프록시/게이트웨이] -->
    <rect x="220" y="55" width="160" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="300" y="79" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">[프록시/게이트웨이]</text>

    <!-- 화살표 2 -->
    <path d="M380,75 L430,75" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- 모놀리식 -->
    <rect x="430" y="55" width="120" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="490" y="79" font-size="13" text-anchor="middle" fill="#d97706" font-weight="bold">모놀리식</text>
  </g>

  <!-- 구분선 1 -->
  <path d="M30,120 L850,120" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== [2단계] ==================== -->
  <g id="step2">
    <!-- 단계 제목 -->
    <text x="30" y="153" font-size="14" font-weight="bold" fill="#1f2933">[2단계] 기능 하나를 새 서비스로 빼고, 그 경로만 라우팅을 바꾼다</text>

    <!-- 클라이언트 -->
    <rect x="50" y="195" width="120" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="110" y="219" font-size="13" text-anchor="middle" fill="#1f2933">클라이언트</text>

    <!-- 화살표 1 -->
    <path d="M170,215 L230,215" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- [게이트웨이] -->
    <rect x="230" y="195" width="130" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="295" y="219" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">[게이트웨이]</text>

    <!-- 분기 화살표 -> 알림 서비스 -->
    <path d="M360,215 L400,215 L400,180 L430,180" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <!-- 분기 화살표 -> 모놀리식 -->
    <path d="M360,215 L400,215 L400,250 L430,250" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- 알림 서비스 -->
    <rect x="430" y="160" width="130" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="495" y="184" font-size="13" text-anchor="middle" fill="#059669" font-weight="bold">알림 서비스</text>

    <!-- 부가 설명 라벨 1 -->
    <text x="580" y="184" font-size="13" fill="#059669">(새로 뺀 것)</text>

    <!-- 모놀리식 -->
    <rect x="430" y="230" width="130" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="495" y="254" font-size="13" text-anchor="middle" fill="#d97706" font-weight="bold">모놀리식</text>

    <!-- 부가 설명 라벨 2 -->
    <text x="580" y="254" font-size="13" fill="#52606d">(나머지 전부)</text>
  </g>

  <!-- 구분선 2 -->
  <path d="M30,300 L850,300" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== [3단계] ==================== -->
  <g id="step3">
    <!-- 단계 제목 -->
    <text x="30" y="333" font-size="14" font-weight="bold" fill="#1f2933">[3단계] 옮길 때마다 모놀리식이 얇아진다</text>

    <!-- 클라이언트 -->
    <rect x="50" y="420" width="120" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="110" y="444" font-size="13" text-anchor="middle" fill="#1f2933">클라이언트</text>

    <!-- 화살표 1 -->
    <path d="M170,440 L230,440" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- [게이트웨이] -->
    <rect x="230" y="420" width="130" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="295" y="444" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">[게이트웨이]</text>

    <!-- 분기 화살표들 -->
    <path d="M360,440 L400,440 L400,370 L430,370" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <path d="M360,440 L400,440 L400,420 L430,420" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <path d="M360,440 L400,440 L400,470 L430,470" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <path d="M360,440 L400,440 L400,520 L430,520" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- 알림 서비스 -->
    <rect x="430" y="350" width="130" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="495" y="374" font-size="13" text-anchor="middle" fill="#059669" font-weight="bold">알림 서비스</text>

    <!-- 검색 서비스 -->
    <rect x="430" y="400" width="130" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="495" y="424" font-size="13" text-anchor="middle" fill="#059669" font-weight="bold">검색 서비스</text>

    <!-- 결제 서비스 -->
    <rect x="430" y="450" width="130" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="495" y="474" font-size="13" text-anchor="middle" fill="#059669" font-weight="bold">결제 서비스</text>

    <!-- 모놀리식 (남은 핵심) -->
    <rect x="430" y="500" width="130" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="495" y="524" font-size="13" text-anchor="middle" fill="#d97706" font-weight="bold">모놀리식</text>

    <!-- 부가 설명 라벨 3 -->
    <text x="570" y="524" font-size="13" fill="#52606d">(남은 핵심)</text>
  </g>

  <!-- 구분선 3 -->
  <path d="M30,565 L850,565" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== [4단계] ==================== -->
  <g id="step4">
    <!-- 단계 제목 -->
    <text x="30" y="598" font-size="14" font-weight="bold" fill="#1f2933">[4단계] 남은 것이 없으면 모놀리식을 내린다</text>
  </g>
</svg>