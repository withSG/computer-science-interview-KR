<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 800" width="880" height="800" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스트랭글러 피그 전환 4단계</title>
  <desc id="d">클라이언트 앞에 게이트웨이를 세운 뒤 알림·검색·결제 서비스처럼 기능을 하나씩 새 서비스로 빼고 그 경로만 라우팅을 바꾼다. 옮길 때마다 모놀리식이 얇아지고, 남은 것이 없으면 모놀리식을 내린다.</desc>
  <rect width="880" height="800" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 단계 사이 세로 진행선 -->
  <line x1="56" y1="56" x2="56" y2="154" stroke="#d1d5db" stroke-width="3"/>
  <line x1="56" y1="188" x2="56" y2="334" stroke="#d1d5db" stroke-width="3"/>
  <line x1="56" y1="368" x2="56" y2="618" stroke="#d1d5db" stroke-width="3"/>

  <!-- ===== 1단계 ===== -->
  <rect x="24" y="24" width="64" height="30" rx="15" fill="#1f2937"/>
  <text x="56" y="45" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1단계</text>
  <text x="106" y="45" font-size="17" font-weight="bold" fill="#111827">앞에 라우팅 계층을 세운다 — 아직 전부 모놀리식으로 보낸다</text>

  <rect x="106" y="76" width="116" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="164" y="106" font-size="16" fill="#111827" text-anchor="middle">클라이언트</text>
  <line x1="224" y1="100" x2="262" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="266" y="76" width="170" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="351" y="106" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">프록시/게이트웨이</text>
  <line x1="438" y1="100" x2="506" y2="100" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <rect x="510" y="76" width="346" height="48" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="683" y="106" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">모놀리식</text>

  <!-- ===== 2단계 ===== -->
  <rect x="24" y="156" width="64" height="30" rx="15" fill="#1f2937"/>
  <text x="56" y="177" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2단계</text>
  <text x="106" y="177" font-size="17" font-weight="bold" fill="#111827">기능 하나를 새 서비스로 빼고, 그 경로만 라우팅을 바꾼다</text>

  <rect x="106" y="230" width="116" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="164" y="260" font-size="16" fill="#111827" text-anchor="middle">클라이언트</text>
  <line x1="224" y1="254" x2="262" y2="254" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="266" y="230" width="170" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="351" y="260" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">게이트웨이</text>
  <line x1="438" y1="254" x2="470" y2="254" stroke="#374151" stroke-width="2"/>
  <line x1="470" y1="226" x2="470" y2="282" stroke="#374151" stroke-width="2"/>
  <line x1="470" y1="226" x2="506" y2="226" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="470" y1="282" x2="506" y2="282" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>

  <rect x="510" y="204" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="585" y="232" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">알림 서비스</text>
  <text x="676" y="232" font-size="15" font-weight="bold" fill="#047857">← 새로 뺀 것</text>
  <rect x="510" y="260" width="280" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="650" y="288" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">모놀리식 <tspan font-size="15" font-weight="normal">(나머지 전부)</tspan></text>

  <!-- ===== 3단계 ===== -->
  <rect x="24" y="336" width="64" height="30" rx="15" fill="#1f2937"/>
  <text x="56" y="357" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3단계</text>
  <text x="106" y="357" font-size="17" font-weight="bold" fill="#111827">옮길 때마다 모놀리식이 얇아진다</text>

  <rect x="106" y="463" width="116" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="164" y="493" font-size="16" fill="#111827" text-anchor="middle">클라이언트</text>
  <line x1="224" y1="487" x2="262" y2="487" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="266" y="463" width="170" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="351" y="493" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">게이트웨이</text>
  <line x1="438" y1="487" x2="470" y2="487" stroke="#374151" stroke-width="2"/>
  <line x1="470" y1="406" x2="470" y2="568" stroke="#374151" stroke-width="2"/>
  <line x1="470" y1="406" x2="506" y2="406" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="470" y1="460" x2="506" y2="460" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="470" y1="514" x2="506" y2="514" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="470" y1="568" x2="506" y2="568" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>

  <rect x="510" y="384" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="585" y="412" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">알림 서비스</text>
  <rect x="510" y="438" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="585" y="466" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">검색 서비스</text>
  <rect x="510" y="492" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="585" y="520" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">결제 서비스</text>
  <rect x="510" y="546" width="210" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="615" y="574" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">모놀리식 <tspan font-size="15" font-weight="normal">(남은 핵심)</tspan></text>

  <!-- ===== 4단계 ===== -->
  <rect x="24" y="620" width="64" height="30" rx="15" fill="#1f2937"/>
  <text x="56" y="641" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4단계</text>
  <text x="106" y="641" font-size="17" font-weight="bold" fill="#111827">남은 것이 없으면 모놀리식을 내린다</text>

  <rect x="106" y="668" width="116" height="48" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="164" y="698" font-size="16" fill="#111827" text-anchor="middle">클라이언트</text>
  <line x1="224" y1="692" x2="262" y2="692" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="266" y="668" width="170" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="351" y="698" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">게이트웨이</text>
  <line x1="438" y1="692" x2="506" y2="692" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="510" y="670" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="585" y="698" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">새 서비스들</text>
  <rect x="510" y="728" width="150" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="585" y="756" font-size="16" fill="#4b5563" text-anchor="middle">모놀리식</text>
  <text x="676" y="756" font-size="15" font-weight="bold" fill="#4b5563">← 내림</text>
</svg>
