<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트랜스파일과 폴리필 비교</title>
  <desc id="d">트랜스파일은 빌드 타임에 코드 형태를 바꾸고 Babel이 담당하며 번들 크기 영향이 작다. 폴리필은 없는 기능을 만들어 넣는 코드로, 번들에 실려 런타임에 실행되어 전역을 채우고 core-js 같은 라이브러리가 담당하며 추가한 만큼 번들이 커진다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 열 배경 -->
  <rect x="24" y="100" width="108" height="392" fill="#f3f4f6"/>
  <rect x="144" y="100" width="350" height="392" fill="#f5f8ff"/>
  <rect x="506" y="100" width="350" height="392" fill="#faf7ff"/>

  <!-- 머리행 -->
  <rect x="144" y="24" width="350" height="68" rx="8" fill="#dbeafe"/>
  <text x="319" y="54" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">트랜스파일</text>
  <text x="319" y="78" font-size="14" fill="#1e3a8a" text-anchor="middle">대상: 문법(syntax)</text>

  <rect x="506" y="24" width="350" height="68" rx="8" fill="#ede9fe"/>
  <text x="681" y="54" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">폴리필</text>
  <text x="681" y="78" font-size="14" fill="#5b21b6" text-anchor="middle">대상: 런타임 API</text>

  <!-- 행 구분선 -->
  <line x1="24" y1="148" x2="856" y2="148" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="196" x2="856" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="244" x2="856" y2="244" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="292" x2="856" y2="292" stroke="#d1d5db" stroke-width="1"/>

  <!-- 1. 하는 일 -->
  <text x="36" y="129.5" font-size="15" font-weight="bold" fill="#374151">하는 일</text>
  <text x="160" y="129.5" font-size="16" fill="#111827"><tspan font-weight="bold">코드 형태</tspan>를 바꾼다</text>
  <text x="522" y="129.5" font-size="16" fill="#111827"><tspan font-weight="bold">없는 기능</tspan>을 만들어 넣는다</text>

  <!-- 2. 시점 -->
  <text x="36" y="177.5" font-size="15" font-weight="bold" fill="#374151">시점</text>
  <text x="160" y="177.5" font-size="16" fill="#111827"><tspan font-weight="bold">빌드 타임</tspan>에 끝난다</text>
  <text x="522" y="177.5" font-size="16" fill="#111827"><tspan font-weight="bold">런타임</tspan>에 실행되어 전역을 채운다</text>

  <!-- 3. 번들 크기 -->
  <text x="36" y="225.5" font-size="15" font-weight="bold" fill="#374151">번들 크기</text>
  <text x="160" y="225.5" font-size="16" fill="#111827">영향 <tspan font-weight="bold">작음</tspan></text>
  <text x="522" y="225.5" font-size="16" fill="#111827">추가한 만큼 번들이 <tspan font-weight="bold">커진다</tspan></text>

  <!-- 4. 담당 -->
  <text x="36" y="273.5" font-size="15" font-weight="bold" fill="#374151">담당</text>
  <text x="160" y="273.5" font-size="16" font-weight="bold" fill="#111827">Babel</text>
  <text x="522" y="273.5" font-size="16" fill="#111827"><tspan font-weight="bold">core-js</tspan> 같은 라이브러리</text>

  <!-- 5. 예시 -->
  <text x="36" y="396" font-size="15" font-weight="bold" fill="#374151">예시</text>

  <!-- 트랜스파일 예시 -->
  <rect x="156" y="306" width="326" height="130" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="172" y="336" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">const f = n =&gt; n*2</text>
  <line x1="196" y1="348" x2="196" y2="390" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="212" y="374" font-size="14" font-weight="bold" fill="#1d4ed8">빌드 타임</text>
  <text x="172" y="416" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">var f = function(n){return n*2}</text>

  <!-- 폴리필 예시 -->
  <rect x="518" y="306" width="326" height="116" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="532" y="334" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">if (!Array.prototype.includes) {</text>
  <text x="549" y="357" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Array.prototype.includes =</text>
  <text x="566" y="380" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">function (x) { ... };</text>
  <text x="532" y="403" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">}</text>
  <line x1="540" y1="470" x2="540" y2="426" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="556" y="449" font-size="15" font-weight="bold" fill="#6d28d9">이 코드 자체가 번들에 실려</text>
  <text x="556" y="471" font-size="15" font-weight="bold" fill="#6d28d9">런타임에 실행된다</text>
</svg>
