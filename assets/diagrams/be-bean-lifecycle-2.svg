<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">애플리케이션 기동 시 초기화 시점</title>
  <desc id="d">컨테이너 기동 뒤 Bean마다 생성, 주입, @PostConstruct가 차례로 실행되고, 모든 Bean이 준비된 다음 ApplicationRunner/CommandLineRunner가 실행되며, 마지막으로 ApplicationReadyEvent가 발행되는 순서를 시간축으로 보여줍니다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="note" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 시간축 -->
  <line x1="44" y1="52" x2="44" y2="408" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 컨테이너 기동 -->
  <circle cx="44" cy="44" r="9" fill="#1f2937"/>
  <text x="68" y="50" font-size="17" font-weight="bold" fill="#111827">컨테이너 기동</text>

  <!-- Bean A -->
  <circle cx="44" cy="100" r="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="68" y="105" font-size="16" font-weight="bold" fill="#111827">Bean A</text>
  <rect x="140" y="83" width="64" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="172" y="105" font-size="15" fill="#1f2937" text-anchor="middle">생성</text>
  <line x1="206" y1="100" x2="232" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="236" y="83" width="64" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="268" y="105" font-size="15" fill="#1f2937" text-anchor="middle">주입</text>
  <line x1="302" y1="100" x2="328" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="332" y="83" width="190" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="427" y="105" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">@PostConstruct(A)</text>
  <line x1="600" y1="100" x2="530" y2="100" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#note)"/>
  <text x="612" y="105" font-size="15" fill="#374151">A 하나만 준비된 상태</text>

  <!-- Bean B -->
  <circle cx="44" cy="150" r="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="68" y="155" font-size="16" font-weight="bold" fill="#111827">Bean B</text>
  <rect x="140" y="133" width="64" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="172" y="155" font-size="15" fill="#1f2937" text-anchor="middle">생성</text>
  <line x1="206" y1="150" x2="232" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="236" y="133" width="64" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="268" y="155" font-size="15" fill="#1f2937" text-anchor="middle">주입</text>
  <line x1="302" y1="150" x2="328" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="332" y="133" width="190" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="427" y="155" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">@PostConstruct(B)</text>

  <!-- Bean C -->
  <circle cx="44" cy="200" r="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="68" y="205" font-size="16" font-weight="bold" fill="#111827">Bean C</text>
  <rect x="140" y="183" width="64" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="172" y="205" font-size="15" fill="#1f2937" text-anchor="middle">생성</text>
  <line x1="206" y1="200" x2="232" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="236" y="183" width="64" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="268" y="205" font-size="15" fill="#1f2937" text-anchor="middle">주입</text>
  <line x1="302" y1="200" x2="328" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="332" y="183" width="190" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="427" y="205" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">@PostConstruct(C)</text>

  <!-- 모든 Bean 준비 완료 (경계) -->
  <line x1="248" y1="256" x2="856" y2="256" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="36" y="248" width="16" height="16" fill="#1f2937" transform="rotate(45 44 256)"/>
  <text x="68" y="262" font-size="17" font-weight="bold" fill="#111827">모든 Bean 준비 완료</text>

  <!-- Runner -->
  <circle cx="44" cy="316" r="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="68" y="299" width="390" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="263" y="321" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ApplicationRunner / CommandLineRunner 실행</text>
  <line x1="600" y1="316" x2="466" y2="316" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#note)"/>
  <text x="612" y="321" font-size="15" fill="#374151">전부 준비된 상태</text>

  <!-- ApplicationReadyEvent -->
  <circle cx="44" cy="376" r="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="68" y="359" width="260" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="198" y="381" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ApplicationReadyEvent 발행</text>
  <line x1="600" y1="376" x2="336" y2="376" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#note)"/>
  <text x="612" y="381" font-size="15" fill="#374151">Runner까지 끝난 상태</text>

  <!-- 범례 -->
  <rect x="68" y="428" width="28" height="18" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="106" y="442" font-size="15" fill="#374151">시작할 때 코드를 돌릴 수 있는 지점</text>
</svg>
