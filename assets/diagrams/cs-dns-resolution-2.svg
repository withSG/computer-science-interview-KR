<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">재귀 질의와 반복 질의</title>
  <desc id="d">브라우저/OS와 재귀 리졸버 간의 재귀 질의, 그리고 재귀 리졸버가 루트, TLD, 권한 있는 서버로 진행하는 반복 질의 과정을 나타낸 다이어그램</desc>
  
  <rect width="880" height="770" fill="#ffffff"/>

  <defs>
    <!-- Primary Blue Markers -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <!-- Secondary Ink/Gray Markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- Purple/Success Marker -->
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <!-- Green Marker for Final Response -->
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">3. 재귀 질의와 반복 질의</text>

  <!-- Left Column: Client & Recursive Resolver -->
  <!-- [브라우저/OS] Box -->
  <rect x="40" y="80" width="180" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="110" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[브라우저/OS]</text>

  <!-- Arrow ①: 브라우저/OS -> 재귀 리졸버 -->
  <path d="M130,130 L130,220" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Arrow ① Label -->
  <rect x="140" y="160" width="370" height="26" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="148" y="177" font-size="12" fill="#2563eb" font-weight="bold">① 재귀 질의: "www.example.com의 IP 알려줘. 끝까지 찾아서."</text>

  <!-- [재귀 리졸버] Box -->
  <rect x="40" y="220" width="180" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="250" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[재귀 리졸버]</text>

  <!-- Right Column: Servers -->
  <!-- [루트 서버] Box -->
  <rect x="580" y="280" width="180" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="670" y="310" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[루트 서버]</text>

  <!-- [.com TLD 서버] Box -->
  <rect x="580" y="400" width="180" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="670" y="430" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[.com TLD 서버]</text>

  <!-- [권한 있는 서버] Box -->
  <rect x="580" y="520" width="180" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="550" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[권한 있는 서버]</text>


  <!-- Cache Bypass / Short Circuit Line (── 캐시에 있으면 여기서 즉시 응답하고 끝 ──) -->
  <path d="M220,245 L800,245 L800,705 L138,705" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <rect x="420" y="232" width="280" height="24" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="4"/>
  <text x="560" y="248" font-size="12" fill="#d97706" font-weight="bold" text-anchor="middle">── 캐시에 있으면 여기서 즉시 응답하고 끝 ──</text>


  <!-- Iterative Queries & Responses -->

  <!-- ② 반복 질의 -->
  <!-- Request to Root -->
  <path d="M130,290 L580,290" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="180" y="278" width="205" height="22" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="3"/>
  <text x="185" y="293" font-size="11.5" fill="#1f2933">② 반복 질의: "www.example.com?"</text>

  <!-- Response from Root -->
  <path d="M580,320 L130,320" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <rect x="180" y="309" width="275" height="22" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="3"/>
  <text x="185" y="324" font-size="11.5" fill="#52606d">◄── "몰라. com은 이 NS들이 안다" (referral)</text>


  <!-- ③ 반복 질의 -->
  <!-- Request to TLD -->
  <path d="M130,410 L580,410" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="180" y="398" width="205" height="22" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="3"/>
  <text x="185" y="413" font-size="11.5" fill="#1f2933">③ 반복 질의: "www.example.com?"</text>

  <!-- Response from TLD -->
  <path d="M580,440 L130,440" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <rect x="180" y="429" width="360" height="22" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="3"/>
  <text x="185" y="444" font-size="11.5" fill="#52606d">◄── "몰라. example.com은 ns1.example.com이 안다"</text>


  <!-- ④ 반복 질의 -->
  <!-- Request to Authoritative -->
  <path d="M130,530 L580,530" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="180" y="518" width="205" height="22" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="3"/>
  <text x="185" y="533" font-size="11.5" fill="#1f2933">④ 반복 질의: "www.example.com?"</text>

  <!-- Response from Authoritative -->
  <path d="M580,560 L130,560" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="180" y="549" width="265" height="22" fill="#ffffff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="185" y="564" font-size="11.5" fill="#7c3aed" font-weight="bold">◄── "A 레코드 = 203.0.113.5, TTL 300"</text>
  
  <!-- "← 정답" Annotation -->
  <rect x="450" y="549" width="55" height="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="455" y="564" font-size="11.5" fill="#7c3aed" font-weight="bold">← 정답</text>


  <!-- Vertical Guide Line for Recursive Resolver Work Sequence -->
  <path d="M130,270 L130,640" stroke="#2563eb" stroke-width="1.5" fill="none"/>

  <!-- ⑤ TTL 동안 캐시에 저장 -->
  <rect x="40" y="610" width="180" height="30" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="130" y="629" font-size="11.5" fill="#d97706" font-weight="bold" text-anchor="middle">⑤ TTL 동안 캐시에 저장</text>

  <!-- Arrow to ⑥ -->
  <path d="M130,640 L130,690" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- ⑥ 클라이언트에 최종 응답 -->
  <rect x="40" y="690" width="180" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="130" y="709" font-size="12" fill="#059669" font-weight="bold" text-anchor="middle">⑥ 클라이언트에 최종 응답</text>

</svg>