<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 790" width="880" height="790" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">재귀 질의와 반복 질의</title>
  <desc id="d">브라우저/OS는 재귀 리졸버에 재귀 질의를 한 번 보내고, 재귀 리졸버는 캐시에 없으면 루트 서버, .com TLD 서버, 권한 있는 서버에 차례로 반복 질의를 보낸다. 루트와 TLD는 다음 서버를 알려 주고(referral) 권한 있는 서버가 A 레코드를 답하면, 리졸버는 TTL 동안 캐시에 저장한 뒤 클라이언트에 최종 응답한다.</desc>
  <rect width="880" height="790" fill="#ffffff"/>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 두 구간 -->
  <rect x="24" y="20" width="832" height="750" rx="10" fill="#f0fdf4"/>
  <path d="M34,20 L340,20 L340,770 L34,770 A10,10 0 0 1 24,760 L24,30 A10,10 0 0 1 34,20 Z" fill="#eff6ff"/>

  <text x="40" y="50" font-size="18" font-weight="bold" fill="#1d4ed8">재귀 질의</text>
  <text x="40" y="74" font-size="15" fill="#374151">최종 답을 구해 오라고</text>
  <text x="40" y="94" font-size="15" fill="#374151">책임을 통째로 위임</text>

  <text x="356" y="50" font-size="18" font-weight="bold" fill="#047857">반복 질의</text>
  <text x="356" y="74" font-size="15" fill="#374151">아는 만큼만 답하고, 모르면 다음 서버를 알려 줌 (referral)</text>

  <!-- 생명선 -->
  <path d="M94,160 L94,756" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
  <path d="M340,160 L340,756" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 5" fill="none"/>

  <!-- 등장인물 -->
  <rect x="29" y="116" width="130" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="94" y="144" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">브라우저/OS</text>
  <rect x="270" y="116" width="140" height="44" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="340" y="144" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">재귀 리졸버</text>

  <!-- ① 재귀 질의 -->
  <text x="106" y="192" font-size="16" font-weight="bold" fill="#1d4ed8">① 재귀 질의</text>
  <text x="106" y="214" font-size="15" fill="#1f2937">“www.example.com의 IP</text>
  <text x="106" y="234" font-size="15" fill="#1f2937">알려줘. 끝까지 찾아서.”</text>
  <path d="M94,250 L336,250" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>

  <!-- 캐시 적중 시 지름길 -->
  <text x="106" y="284" font-size="15" font-weight="bold" fill="#b45309">캐시에 있으면 여기서</text>
  <text x="106" y="304" font-size="15" font-weight="bold" fill="#b45309">즉시 응답하고 끝</text>
  <path d="M340,320 L98,320" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#aAmber)"/>

  <!-- ② 루트 서버 -->
  <text x="356" y="364" font-size="15" fill="#1f2937"><tspan font-weight="bold" fill="#047857">② 반복 질의:</tspan> “www.example.com?”</text>
  <path d="M340,378 L700,378" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>
  <text x="356" y="406" font-size="15" fill="#374151">“몰라. com은 이 NS들이 안다” (referral)</text>
  <path d="M704,420 L344,420" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#aGray)"/>
  <rect x="704" y="352" width="144" height="80" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.75"/>
  <text x="776" y="398" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">루트 서버</text>

  <!-- ③ .com TLD 서버 -->
  <text x="356" y="464" font-size="15" fill="#1f2937"><tspan font-weight="bold" fill="#047857">③ 반복 질의:</tspan> “www.example.com?”</text>
  <path d="M340,478 L700,478" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>
  <text x="356" y="506" font-size="15" fill="#374151">“몰라. example.com은 ns1.example.com이 안다”</text>
  <path d="M704,520 L344,520" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#aGray)"/>
  <rect x="704" y="452" width="144" height="80" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.75"/>
  <text x="776" y="498" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">.com TLD 서버</text>

  <!-- ④ 권한 있는 서버 -->
  <text x="356" y="564" font-size="15" fill="#1f2937"><tspan font-weight="bold" fill="#047857">④ 반복 질의:</tspan> “www.example.com?”</text>
  <path d="M340,578 L700,578" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#aGreen)"/>
  <text x="356" y="606" font-size="15" font-weight="bold" fill="#6d28d9">“A 레코드 = 203.0.113.5, TTL 300”</text>
  <rect x="622" y="590" width="52" height="22" rx="11" fill="#6d28d9"/>
  <text x="648" y="606" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">정답</text>
  <path d="M704,620 L344,620" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#aPurple)"/>
  <rect x="704" y="552" width="144" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="776" y="598" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">권한 있는 서버</text>

  <!-- ⑤ 캐시 저장 -->
  <rect x="246" y="652" width="188" height="38" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.75"/>
  <text x="340" y="677" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">⑤ TTL 동안 캐시에 저장</text>

  <!-- ⑥ 최종 응답 -->
  <text x="106" y="724" font-size="16" font-weight="bold" fill="#1d4ed8">⑥ 클라이언트에 최종 응답</text>
  <path d="M340,740 L98,740" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>
</svg>
