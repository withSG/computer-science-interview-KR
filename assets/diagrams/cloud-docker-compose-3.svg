<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">depends_on 기동 타임라인</title>
  <desc id="d">t=0s에 mysql, t=1s에 backend 컨테이너가 start한다. t=3s에 backend가 DB 커넥션을 시도하지만 MySQL은 아직 초기화 중이라 Connection refused로 실패하고 죽으며, t=25s에 MySQL이 준비 완료될 때 backend는 이미 죽어 있다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 시간축 (t=3s 이후 생략 구간) -->
  <path d="M160,72 H504" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M516,72 H700" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <path d="M500,82 L508,62 M512,82 L520,62" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="712" y="77" font-size="14" fill="#4b5563">시간</text>
  <path d="M170,64 V80 M240,64 V80 M380,64 V80 M640,64 V80" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="170" y="52" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">t=0s</text>
  <text x="240" y="52" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">t=1s</text>
  <text x="380" y="52" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">t=3s</text>
  <text x="640" y="52" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">t=25s</text>

  <!-- t=3s, t=25s 보조선 -->
  <path d="M380,84 V124 M640,84 V134 M640,160 V284" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- mysql 레인 -->
  <text x="24" y="152" font-size="17" font-weight="bold" fill="#111827">mysql</text>
  <text x="170" y="116" font-size="15" fill="#111827">mysql 컨테이너 start</text>
  <rect x="170" y="128" width="462" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="530" y="152" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">MySQL은 아직 초기화 중</text>
  <circle cx="640" cy="146" r="8" fill="#047857"/>
  <text x="656" y="152" font-size="16" font-weight="bold" fill="#047857">MySQL 준비 완료</text>

  <!-- t=3s: 커넥션 시도 -->
  <path d="M380,248 V170" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="394" y="200" font-size="15" fill="#111827">backend가 DB 커넥션 시도</text>
  <text x="394" y="224" font-size="15" font-weight="bold" fill="#b91c1c">✗ Connection refused</text>

  <!-- backend 레인 -->
  <text x="24" y="274" font-size="17" font-weight="bold" fill="#111827">backend</text>
  <rect x="240" y="250" width="140" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="240" y="312" font-size="15" fill="#111827">backend 컨테이너 start</text>
  <circle cx="394" cy="268" r="12" fill="#b91c1c"/>
  <text x="394" y="274" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">✗</text>
  <path d="M410,268 H634" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="656" y="274" font-size="16" font-weight="bold" fill="#b91c1c">backend는 이미 죽었다</text>
</svg>
