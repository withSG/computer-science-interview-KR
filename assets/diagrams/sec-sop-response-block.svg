<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SOP는 응답 읽기를 막는다</title>
  <desc id="d">evil.com의 JS가 bank.com/api/me 를 fetch하면 브라우저는 쿠키까지 포함한 실제 HTTP 요청을 보내고 서버는 요청을 처리해 200 OK와 JSON을 돌려준다. 브라우저는 Access-Control-Allow-Origin 헤더가 없거나 불일치하면 응답을 JS에 넘기지 않고 TypeError만 전달한다.</desc>
  <rect width="880" height="690" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="24" y="40" font-size="16" fill="#374151">evil.com의 JS가 bank.com/api/me 를 fetch 했을 때</text>

  <!-- 참여자 -->
  <rect x="30" y="60" width="160" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="110" y="90" font-size="17" font-weight="bold" text-anchor="middle" fill="#b91c1c">evil.com JS</text>
  <rect x="280" y="60" width="160" height="48" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="360" y="90" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">브라우저</text>
  <rect x="520" y="60" width="180" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="610" y="90" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d4ed8">bank.com 서버</text>

  <!-- 생명선 -->
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="110" y1="108" x2="110" y2="596"/>
    <line x1="360" y1="108" x2="360" y2="596"/>
    <line x1="610" y1="108" x2="610" y2="596"/>
  </g>

  <!-- ① fetch -->
  <line x1="110" y1="160" x2="357" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="235" y="148" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">① fetch()</text>

  <!-- ② 실제 요청 -->
  <line x1="360" y1="224" x2="607" y2="224" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="485" y="212" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">② 실제 HTTP 요청 전송</text>
  <text x="485" y="248" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d28d9">(쿠키까지 포함해서!)</text>

  <!-- ③ 서버 처리 -->
  <rect x="500" y="276" width="220" height="64" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="610" y="302" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">③ 요청을 처리한다</text>
  <text x="610" y="326" font-size="15" text-anchor="middle" fill="#374151">(조회면 조회, 송금이면 송금)</text>

  <!-- ④ 응답 -->
  <line x1="610" y1="384" x2="363" y2="384" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="485" y="372" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">④ 200 OK + JSON 응답</text>

  <!-- ⑤ 헤더 확인 -->
  <rect x="210" y="416" width="300" height="88" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="360" y="442" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">⑤ <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Allow-Origin</tspan></text>
  <text x="360" y="466" font-size="15" text-anchor="middle" fill="#111827">헤더를 확인한다</text>
  <text x="360" y="492" font-size="15" font-weight="bold" text-anchor="middle" fill="#b91c1c">없거나 불일치 → JS에 넘기지 않음</text>

  <!-- ⑥ TypeError -->
  <line x1="360" y1="552" x2="113" y2="552" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="235" y="540" font-size="15" font-weight="bold" text-anchor="middle" fill="#b91c1c">⑥ TypeError</text>
  <text x="235" y="576" font-size="15" text-anchor="middle" fill="#374151">(응답 내용은 못 봄)</text>

  <!-- 구간 괄호 -->
  <path d="M746,140 H758 V344 H746" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="770" y="236" font-size="16" font-weight="bold" fill="#047857">여기까지는</text>
  <text x="770" y="258" font-size="16" font-weight="bold" fill="#047857">그냥 간다</text>
  <path d="M746,408 H758 V584 H746" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="770" y="474" font-size="16" font-weight="bold" fill="#b91c1c">응답</text>
  <text x="770" y="496" font-size="16" font-weight="bold" fill="#b91c1c">읽기만</text>
  <text x="770" y="518" font-size="16" font-weight="bold" fill="#b91c1c">막는다</text>

  <!-- 결론 -->
  <rect x="24" y="616" width="832" height="50" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1"/>
  <text x="440" y="647" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">요청은 서버에 도달해 처리된다. 브라우저가 응답을 JS에 넘기지 않을 뿐이다.</text>
</svg>
