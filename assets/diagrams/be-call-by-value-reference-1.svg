<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">증명 1 — 원시 타입</title>
  <desc id="d">main 프레임과 modify 프레임에서 원시 타입 변수 a의 값 10이 x로 복사되고, modify 프레임 내에서 x가 999로 변경되지만 곧 사라짐을 보여주는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- main 프레임 그룹 -->
  <g>
    <!-- main 프레임 제목 -->
    <text x="170" y="55" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">main 프레임</text>
    
    <!-- main 변수 박스 a | 10 -->
    <rect x="70" y="75" width="200" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <line x1="170" y1="75" x2="170" y2="125" stroke="#9aa5b1" stroke-width="1"/>
    <text x="120" y="105" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">a</text>
    <text x="220" y="105" fill="#1f2933" font-size="14" text-anchor="middle">10</text>
  </g>

  <!-- modify 프레임 영역 (상단) -->
  <g>
    <!-- modify 프레임 제목 -->
    <text x="510" y="55" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">modify 프레임</text>
    
    <!-- modify 변수 박스 x | 10 -->
    <rect x="410" y="75" width="200" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <line x1="510" y1="75" x2="510" y2="125" stroke="#9aa5b1" stroke-width="1"/>
    <text x="460" y="105" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">x</text>
    <text x="560" y="105" fill="#1f2933" font-size="14" text-anchor="middle">10</text>
  </g>

  <!-- 복사 화살표 및 라벨 -->
  <path d="M270,100 L410,100" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="315" y="86" width="50" height="26" fill="#ffffff"/>
  <text x="340" y="104" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">복사▶</text>

  <!-- 프레임 내부 변경 화살표 및 라벨 -->
  <path d="M510,125 L510,195" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="518" y="147" width="70" height="26" fill="#ffffff"/>
  <text x="523" y="165" fill="#52606d" font-size="13" text-anchor="start">x = 999</text>

  <!-- modify 프레임 영역 (하단: 변경 후) -->
  <g>
    <!-- modify 변수 박스 x | 999 -->
    <rect x="410" y="195" width="200" height="50" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
    <line x1="510" y1="195" x2="510" y2="245" stroke="#9aa5b1" stroke-width="1"/>
    <text x="460" y="225" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">x</text>
    <text x="560" y="225" fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle">999</text>

    <!-- 부가 주석: ← 이 프레임은 곧 사라진다 -->
    <text x="625" y="224" fill="#dc2626" font-size="13" text-anchor="start">← 이 프레임은 곧 사라진다</text>
  </g>
</svg>