<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컨텍스트 윈도우 예산</title>
  <desc id="d">컨텍스트 윈도우는 입력과 출력을 합친 토큰 상한으로, 시스템 프롬프트(고정, 매 호출마다 재전송)·대화 이력(늘어남, 누적)·RAG 컨텍스트(Top-K에 비례)·질문(짧음)·출력(max_tokens만큼 확보)이 나눠 쓴다. 대화가 길어지면 대화 이력이 계속 자라 출력 자리를 잡아먹는다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 전체 폭 = 컨텍스트 윈도우 -->
  <line x1="26" y1="38" x2="248" y2="38" stroke="#374151" stroke-width="1.5" marker-start="url(#dim)"/>
  <line x1="632" y1="38" x2="854" y2="38" stroke="#374151" stroke-width="1.5" marker-end="url(#dim)"/>
  <text x="440" y="44" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">컨텍스트 윈도우 = 입력 + 출력의 토큰 상한</text>

  <!-- ===== 기본 구성 ===== -->
  <rect x="24" y="64" width="832" height="68" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="28" y="68" width="150" height="60" rx="3" fill="#ede9fe"/>
  <text x="103" y="104" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">시스템 프롬프트</text>
  <rect x="182" y="68" width="150" height="60" rx="3" fill="#fde68a"/>
  <text x="257" y="104" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">대화 이력</text>
  <rect x="336" y="68" width="170" height="60" rx="3" fill="#dbeafe"/>
  <text x="421" y="104" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">RAG 컨텍스트</text>
  <rect x="510" y="68" width="96" height="60" rx="3" fill="#d1fae5"/>
  <text x="558" y="104" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">질문</text>
  <rect x="610" y="68" width="242" height="60" rx="3" fill="#e5e7eb"/>
  <text x="731" y="104" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">출력</text>

  <text x="103" y="160" font-size="15" fill="#374151" text-anchor="middle">고정</text>
  <text x="103" y="181" font-size="15" fill="#374151" text-anchor="middle">매 호출마다 재전송</text>
  <text x="257" y="160" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">늘어남 (누적)</text>
  <text x="421" y="160" font-size="15" fill="#374151" text-anchor="middle">Top-K에 비례</text>
  <text x="558" y="160" font-size="15" fill="#374151" text-anchor="middle">짧음</text>
  <text x="731" y="160" font-size="15" fill="#374151" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">max_tokens</tspan>만큼 확보</text>

  <!-- ===== 대화가 길어지면 ===== -->
  <text x="24" y="228" font-size="16" font-weight="bold" fill="#111827">대화가 길어지면 (윈도우 크기는 그대로)</text>
  <rect x="24" y="240" width="832" height="68" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="28" y="244" width="150" height="60" rx="3" fill="#ede9fe"/>
  <text x="103" y="280" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">시스템 프롬프트</text>
  <rect x="182" y="244" width="334" height="60" rx="3" fill="#fde68a"/>
  <text x="349" y="280" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">대화 이력</text>
  <rect x="520" y="244" width="170" height="60" rx="3" fill="#dbeafe"/>
  <text x="605" y="280" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">RAG 컨텍스트</text>
  <rect x="694" y="244" width="96" height="60" rx="3" fill="#d1fae5"/>
  <text x="742" y="280" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">질문</text>
  <rect x="794" y="244" width="58" height="60" rx="3" fill="#fecaca"/>
  <text x="823" y="280" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">출력</text>

  <text x="349" y="334" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">계속 자람 →</text>
  <text x="852" y="334" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">출력 자리 부족</text>

  <!-- 요점 -->
  <rect x="170" y="360" width="540" height="66" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="388" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">대화 이력이 계속 자라서 출력 자리를 잡아먹는 것이</text>
  <text x="440" y="411" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">장시간 대화형 서비스에서 가장 흔한 사고다</text>
</svg>
