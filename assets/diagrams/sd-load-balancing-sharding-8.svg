<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">단일 프라이머리와 다중 마스터 비교</title>
  <desc id="d">단일 프라이머리는 쓰기가 P 한 곳으로만 들어가 순서가 한 곳에서 정해지므로 충돌이 생길 수 없고, 다중 마스터는 M1과 M2가 각각 쓰기를 받고 양방향 복제하므로 같은 행을 동시에 고치면 무엇이 최종 값인지 아무도 모릅니다.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 왼쪽: 단일 프라이머리 -->
  <rect x="24" y="24" width="404" height="322" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="226" y="60" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">단일 프라이머리</text>

  <text x="140" y="102" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">쓰기</text>
  <path d="M140,110 V134" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <rect x="104" y="140" width="72" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="175" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">P</text>

  <path d="M176,168 H232" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M232,134 V202" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M232,134 H280" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ak)"/>
  <path d="M232,202 H280" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ak)"/>
  <rect x="286" y="112" width="80" height="44" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="326" y="140" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">R1</text>
  <rect x="286" y="180" width="80" height="44" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="326" y="208" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">R2</text>

  <text x="226" y="264" font-size="16" fill="#111827" text-anchor="middle">순서가 P 한 곳에서 정해진다</text>
  <rect x="48" y="282" width="356" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="226" y="310" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">→ 충돌이 생길 수 없다</text>

  <!-- 오른쪽: 다중 마스터 -->
  <rect x="452" y="24" width="404" height="322" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="654" y="60" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">다중 마스터</text>

  <text x="530" y="102" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">쓰기</text>
  <path d="M530,110 V134" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="494" y="140" width="72" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="530" y="175" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">M1</text>

  <text x="778" y="102" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">쓰기</text>
  <path d="M778,110 V134" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="742" y="140" width="72" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="778" y="175" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">M2</text>

  <text x="654" y="156" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">양방향 복제</text>
  <path d="M572,168 H736" stroke="#b91c1c" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>

  <text x="654" y="264" font-size="16" fill="#111827" text-anchor="middle">M1과 M2가 같은 행을 동시에 고치면</text>
  <rect x="476" y="282" width="356" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="654" y="310" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">무엇이 최종 값인지 아무도 모른다</text>
</svg>
