<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">신경망은 특징을 계층으로 쌓는다</title>
  <desc id="d">신경망의 계층적 특징 추출 과정을 설명하는 트라이 구조 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Root Input Box -->
  <rect x="40" y="30" width="150" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="115" y="57" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">입력 이미지</text>

  <!-- Main Tree Trunk Line -->
  <path d="M 115,74 V 460" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- Branch 1: 초기 층 -->
  <path d="M 115,130 H 150" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  
  <rect x="150" y="105" width="290" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="135" font-size="14" font-weight="bold" fill="#2563eb">초기 층</text>
  <text x="215" y="135" font-size="13" fill="#1f2933">: 에지, 색상 경계, 방향성 있는 선</text>

  <path d="M 440,130 L 475,130" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="485" y="105" width="355" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="500" y="134" font-size="11.5" fill="#52606d">→ 고양이든 X-ray든 위성 사진이든 똑같이 필요하다</text>

  <!-- Branch 2: 중간 층 -->
  <path d="M 115,220 H 150" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <rect x="150" y="195" width="290" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="165" y="225" font-size="14" font-weight="bold" fill="#7c3aed">중간 층</text>
  <text x="215" y="225" font-size="13" fill="#1f2933">: 질감, 반복 패턴, 모서리 조합</text>

  <path d="M 440,220 L 475,220" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="485" y="195" width="355" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="500" y="224" font-size="11.5" fill="#52606d">→ 상당 부분 공유되지만 도메인 색이 조금 묻기 시작</text>

  <!-- Branch 3: 후반 층 -->
  <path d="M 115,310 H 150" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <rect x="150" y="285" width="290" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="165" y="315" font-size="14" font-weight="bold" fill="#d97706">후반 층</text>
  <text x="215" y="315" font-size="13" fill="#1f2933">: 눈, 바퀴, 얼굴 같은 부분 구조</text>

  <path d="M 440,310 L 475,310" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <rect x="485" y="285" width="355" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="500" y="314" font-size="11.5" fill="#52606d">→ 학습한 도메인에 특화됨</text>

  <!-- Branch 4: 출력 층 -->
  <path d="M 115,400 H 150" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <rect x="150" y="375" width="290" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="165" y="405" font-size="14" font-weight="bold" fill="#dc2626">출력 층</text>
  <text x="215" y="405" font-size="13" fill="#1f2933">: "이 1000개 클래스 중</text>
  <text x="227" y="425" font-size="13" fill="#1f2933">무엇인가"</text>

  <path d="M 440,430 L 475,430" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="485" y="405" width="355" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="500" y="434" font-size="11.5" fill="#52606d">→ 완전히 원래 과제 전용. 우리 과제와 무관</text>
</svg>