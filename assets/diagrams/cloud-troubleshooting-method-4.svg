<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이분 탐색으로 범위 좁히기</title>
  <desc id="d">클라이언트, DNS, CDN, LB, 앱 서버, DB로 이어지는 요청 경로(앱 서버는 캐시·큐·외부 API도 호출)를 네 번의 질문으로 반씩 가릅니다. LB 뒤쪽, 앱 내부 또는 앱이 부르는 무언가, DB 또는 커넥션 획득 대기 순으로 좁혀 커넥션 풀 고갈에 도달합니다.</desc>
  <rect width="880" height="680" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="24" y="45" font-size="14" fill="#4b5563">점선: 각 질문이 경로를 가르는 지점</text>

  <!-- 가르는 지점 (질문 번호) -->
  <g stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="360" y1="54" x2="360" y2="116"/>
    <line x1="488" y1="54" x2="488" y2="116"/>
    <line x1="638" y1="54" x2="638" y2="186"/>
    <line x1="756" y1="54" x2="756" y2="116"/>
  </g>
  <g fill="#6d28d9">
    <circle cx="360" cy="40" r="13"/>
    <circle cx="488" cy="40" r="13"/>
    <circle cx="638" cy="40" r="13"/>
    <circle cx="756" cy="40" r="13"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="360" y="45">1</text>
    <text x="488" y="45">2</text>
    <text x="638" y="45">3</text>
    <text x="756" y="45">4</text>
  </g>

  <!-- 요청 경로 -->
  <g fill="#f9fafb" stroke="#374151" stroke-width="1.5">
    <rect x="24" y="62" width="104" height="44" rx="8"/>
    <rect x="160" y="62" width="64" height="44" rx="8"/>
    <rect x="260" y="62" width="64" height="44" rx="8"/>
    <rect x="396" y="62" width="56" height="44" rx="8"/>
    <rect x="524" y="62" width="92" height="44" rx="8"/>
    <rect x="792" y="62" width="64" height="44" rx="8"/>
    <rect x="664" y="132" width="192" height="44" rx="8"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="76" y="90">클라이언트</text>
    <text x="192" y="90">DNS</text>
    <text x="292" y="90">CDN</text>
    <text x="424" y="90">LB</text>
    <text x="570" y="90">앱 서버</text>
    <text x="824" y="90">DB</text>
    <text x="760" y="160">캐시 / 큐 / 외부 API</text>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none">
    <line x1="130" y1="84" x2="157" y2="84" marker-end="url(#ah)"/>
    <line x1="226" y1="84" x2="257" y2="84" marker-end="url(#ah)"/>
    <line x1="326" y1="84" x2="393" y2="84" marker-end="url(#ah)"/>
    <line x1="454" y1="84" x2="521" y2="84" marker-end="url(#ah)"/>
    <line x1="618" y1="84" x2="789" y2="84" marker-end="url(#ah)"/>
    <path d="M570,108 V154 H661" marker-end="url(#ah)"/>
  </g>

  <!-- 질문 1 -->
  <rect x="24" y="208" width="832" height="96" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="452" y1="222" x2="452" y2="290" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="244" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#6d28d9">질문 1:</tspan> LB 앞인가 뒤인가?</text>
  <text x="44" y="278" font-size="15" fill="#374151">LB 접근 로그의 응답 시간과 클라이언트 체감 시간을 비교</text>
  <text x="476" y="244" font-size="15" fill="#111827">→ LB가 이미 3초를 기록하고 있다</text>
  <rect x="468" y="258" width="290" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="480" y="279" font-size="15" font-weight="bold" fill="#1d4ed8">⇒ 뒤쪽. DNS·CDN은 후보에서 제외</text>

  <!-- 질문 2 -->
  <rect x="24" y="324" width="832" height="96" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="452" y1="338" x2="452" y2="406" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="360" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#6d28d9">질문 2:</tspan> 앱인가 앱 바깥인가?</text>
  <text x="44" y="394" font-size="15" fill="#374151">앱 로그의 “요청 처리 시간”과 LB 기록을 비교</text>
  <text x="476" y="360" font-size="15" fill="#111827">→ 앱도 3초로 기록</text>
  <rect x="468" y="374" width="270" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="480" y="395" font-size="15" font-weight="bold" fill="#1d4ed8">⇒ 앱 내부 또는 앱이 부르는 무언가</text>

  <!-- 질문 3 -->
  <rect x="24" y="440" width="832" height="96" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="452" y1="454" x2="452" y2="522" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="476" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#6d28d9">질문 3:</tspan> 앱 자신인가 의존성인가?</text>
  <text x="44" y="510" font-size="15" fill="#374151">트레이스에서 자기 코드 구간과 외부 호출 구간의 시간 분포</text>
  <text x="476" y="476" font-size="15" fill="#111827">→ DB 호출이 2.9초</text>
  <rect x="468" y="490" width="226" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="480" y="511" font-size="15" font-weight="bold" fill="#1d4ed8">⇒ DB 또는 커넥션 획득 대기</text>

  <!-- 질문 4 -->
  <rect x="24" y="556" width="832" height="100" rx="10" fill="#fffafa" stroke="#b91c1c" stroke-width="2"/>
  <line x1="452" y1="570" x2="452" y2="642" stroke="#fecaca" stroke-width="1.5"/>
  <text x="44" y="592" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#6d28d9">질문 4:</tspan> DB가 느린가, 커넥션을 못 받는가?</text>
  <text x="44" y="626" font-size="15" fill="#374151">DB 쪽 쿼리 실행 시간 vs 앱의 커넥션 획득 대기 시간</text>
  <text x="476" y="592" font-size="15" fill="#111827">→ 쿼리는 10ms, 획득 대기가 2.8초</text>
  <rect x="468" y="604" width="170" height="38" rx="6" fill="#b91c1c"/>
  <text x="482" y="629" font-size="18" font-weight="bold" fill="#ffffff">⇒ 커넥션 풀 고갈</text>
</svg>
