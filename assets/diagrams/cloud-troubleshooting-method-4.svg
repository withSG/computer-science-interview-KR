<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3단계. 이분 탐색으로 범위를 좁힌다</title>
  <desc id="d">시스템 구성요소 간 데이터 흐름과 단계별 장애 원인 추적을 위한 4가지 질문 및 탐색 과정</desc>
  <rect width="880" height="770" fill="#ffffff"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- SECTION 1: Architecture Top Flow -->
  <rect x="24" y="20" width="832" height="180" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Top Line Nodes -->
  <!-- Client -->
  <rect x="40" y="45" width="105" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="92.5" y="70" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">클라이언트</text>

  <!-- Flow Arrow 1 -->
  <path d="M 145 65 L 175 65" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- DNS -->
  <rect x="175" y="45" width="70" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="70" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">DNS</text>

  <!-- Flow Arrow 2 -->
  <path d="M 245 65 L 275 65" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- CDN -->
  <rect x="275" y="45" width="70" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="70" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">CDN</text>

  <!-- Flow Arrow 3 -->
  <path d="M 345 65 L 375 65" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- LB -->
  <rect x="375" y="45" width="60" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="405" y="70" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">LB</text>

  <!-- Flow Arrow 4 -->
  <path d="M 435 65 L 465 65" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 앱 서버 -->
  <rect x="465" y="45" width="95" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="512.5" y="70" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">앱 서버</text>

  <!-- Flow Arrow 5 -->
  <path d="M 560 65 L 590 65" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- DB -->
  <rect x="590" y="45" width="60" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="70" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">DB</text>

  <!-- Branch Arrow from 앱 서버 down and right to 캐시 / 큐 / 외부 API -->
  <path d="M 512.5 85 L 512.5 135 L 590 135" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 캐시 / 큐 / 외부 API -->
  <rect x="590" y="115" width="180" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="680" y="140" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">캐시 / 큐 / 외부 API</text>

  <!-- SECTION 2: Questions & Decision Tree -->

  <!-- 질문 1 -->
  <g transform="translate(24, 220)">
    <rect width="832" height="110" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="20" y="32" font-size="14" font-weight="bold" fill="#1f2933">질문 1: LB 앞인가 뒤인가?</text>
    <text x="35" y="58" font-size="12" fill="#52606d">LB 접근 로그의 응답 시간과 클라이언트 체감 시간을 비교</text>
    
    <!-- Answer Arrow & Verdict -->
    <path d="M 35 83 L 55 83" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="65" y="87" font-size="13" font-weight="bold" fill="#1f2933">LB가 이미 3초를 기록하고 있다</text>

    <!-- Fat Arrow & Conclusion -->
    <text x="310" y="87" font-size="14" font-weight="bold" fill="#2563eb">⇒</text>
    <rect x="335" y="67" font-size="13" width="280" height="28" rx="4" fill="#eff6ff"/>
    <text x="345" y="86" font-size="13" font-weight="bold" fill="#2563eb">뒤쪽. DNS·CDN은 후보에서 제외</text>
  </g>

  <!-- 질문 2 -->
  <g transform="translate(24, 350)">
    <rect width="832" height="110" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="20" y="32" font-size="14" font-weight="bold" fill="#1f2933">질문 2: 앱인가 앱 바깥인가?</text>
    <text x="35" y="58" font-size="12" fill="#52606d">앱 로그의 "요청 처리 시간"과 LB 기록을 비교</text>
    
    <!-- Answer Arrow & Verdict -->
    <path d="M 35 83 L 55 83" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="65" y="87" font-size="13" font-weight="bold" fill="#1f2933">앱도 3초로 기록</text>

    <!-- Fat Arrow & Conclusion -->
    <text x="200" y="87" font-size="14" font-weight="bold" fill="#d97706">⇒</text>
    <rect x="225" y="67" font-size="13" width="280" height="28" rx="4" fill="#fffbeb"/>
    <text x="235" y="86" font-size="13" font-weight="bold" fill="#d97706">앱 내부 또는 앱이 부르는 무언가</text>
  </g>

  <!-- 질문 3 -->
  <g transform="translate(24, 480)">
    <rect width="832" height="110" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="20" y="32" font-size="14" font-weight="bold" fill="#1f2933">질문 3: 앱 자신인가 의존성인가?</text>
    <text x="35" y="58" font-size="12" fill="#52606d">트레이스에서 자기 코드 구간과 외부 호출 구간의 시간 분포</text>
    
    <!-- Answer Arrow & Verdict -->
    <path d="M 35 83 L 55 83" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="65" y="87" font-size="13" font-weight="bold" fill="#1f2933">DB 호출이 2.9초</text>

    <!-- Fat Arrow & Conclusion -->
    <text x="200" y="87" font-size="14" font-weight="bold" fill="#dc2626">⇒</text>
    <rect x="225" y="67" font-size="13" width="260" height="28" rx="4" fill="#fef2f2"/>
    <text x="235" y="86" font-size="13" font-weight="bold" fill="#dc2626">DB 또는 커넥션 획득 대기</text>
  </g>

  <!-- 질문 4 -->
  <g transform="translate(24, 610)">
    <rect width="832" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="20" y="32" font-size="14" font-weight="bold" fill="#1f2933">질문 4: DB가 느린가, 커넥션을 못 받는가?</text>
    <text x="35" y="58" font-size="12" fill="#52606d">DB 쪽 쿼리 실행 시간 vs 앱의 커넥션 획득 대기 시간</text>
    
    <!-- Answer Arrow & Verdict -->
    <path d="M 35 88 L 55 88" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="65" y="92" font-size="13" font-weight="bold" fill="#1f2933">쿼리는 10ms, 획득 대기가 2.8초</text>

    <!-- Fat Arrow & Conclusion -->
    <text x="300" y="92" font-size="14" font-weight="bold" fill="#dc2626">⇒</text>
    <rect x="325" y="72" font-size="13" width="140" height="28" rx="4" fill="#fef2f2"/>
    <text x="335" y="91" font-size="13" font-weight="bold" fill="#dc2626">커넥션 풀 고갈</text>
  </g>
</svg>