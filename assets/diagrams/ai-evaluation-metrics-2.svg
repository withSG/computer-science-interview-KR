<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세 지표 유도하기</title>
  <desc id="d">Accuracy, Precision, Recall, F1 지표의 유도 공식과 계산 예시 및 각 지표별 설명을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Section 1: Accuracy (파랑) -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="832" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#2563eb">Accuracy</text>
    <text x="95" y="28" font-size="14" font-weight="bold" fill="#1f2933">= (TP + TN) / 전체 = (210 + 9560) / 10000 = 0.977</text>
    
    <rect x="16" y="44" width="790" height="52" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="30" y="66" font-size="13" font-weight="bold" fill="#1f2933">"전체 중 맞춘 비율"</text>
    <path d="M 160 62 L 185 62" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="195" y="66" font-size="13" fill="#52606d">분모가 전체라 다수 클래스에 지배당한다</text>
  </g>

  <!-- Section 2: Precision (초록) -->
  <g transform="translate(24, 150)">
    <rect x="0" y="0" width="832" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#059669">Precision</text>
    <text x="100" y="28" font-size="14" font-weight="bold" fill="#1f2933">= TP / (TP + FP)   = 210 / 350 = 0.600</text>
    
    <rect x="16" y="44" width="790" height="52" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="30" y="66" font-size="13" font-weight="bold" fill="#1f2933">"스팸이라 판정한 것 중 진짜 스팸의 비율"</text>
    <path d="M 315 62 L 340 62" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="350" y="66" font-size="13" fill="#52606d">분모가 '내가 잡은 것'. 헛다리를 짚으면 떨어진다</text>
  </g>

  <!-- Section 3: Recall (주황) -->
  <g transform="translate(24, 276)">
    <rect x="0" y="0" width="832" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#d97706">Recall</text>
    <text x="80" y="28" font-size="14" font-weight="bold" fill="#1f2933">= TP / (TP + FN)   = 210 / 300 = 0.700</text>
    
    <rect x="16" y="44" width="790" height="52" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="30" y="66" font-size="13" font-weight="bold" fill="#1f2933">"실제 스팸 중 내가 잡은 비율"</text>
    <path d="M 225 62 L 250 62" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
    <text x="260" y="66" font-size="13" fill="#52606d">분모가 '실제 정답'. 놓치면 떨어진다</text>
  </g>

  <!-- Section 4: F1 (보라) -->
  <g transform="translate(24, 402)">
    <rect x="0" y="0" width="832" height="110" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="16" y="28" font-size="16" font-weight="bold" fill="#7c3aed">F1</text>
    <text x="50" y="28" font-size="14" font-weight="bold" fill="#1f2933">= 2 · P · R / (P + R) = 2 × 0.6 × 0.7 / 1.3 ≈ 0.646</text>
    
    <rect x="16" y="44" width="790" height="52" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="30" y="66" font-size="13" fill="#1f2933">둘의 조화평균. 한쪽이 낮으면 크게 끌려 내려간다</text>
  </g>

  <!-- Marker Definitions -->
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>