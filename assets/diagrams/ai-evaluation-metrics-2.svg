<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" width="880" height="644" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정확도·정밀도·재현율·F1 유도</title>
  <desc id="d">스팸 필터 혼동 행렬(TP 210, FN 90, FP 140, TN 9,560)에서 Accuracy 0.977, Precision 0.600, Recall 0.700, F1 약 0.646을 계산하는 식과, 지표마다 분자·분모로 쓰는 칸이 어떻게 다른지를 작은 혼동 행렬로 보여 준다.</desc>
  <rect width="880" height="644" fill="#ffffff"/>

  <!-- 범례 -->
  <text x="24" y="42" font-size="15" fill="#374151">작은 표(혼동 행렬)에서</text>
  <rect x="204" y="29" width="16" height="16" rx="3" fill="#374151"/>
  <text x="228" y="42" font-size="15" fill="#111827">분자</text>
  <rect x="284" y="29" width="16" height="16" rx="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
  <text x="308" y="42" font-size="15" fill="#111827">분모에만 포함</text>
  <rect x="430" y="29" width="16" height="16" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="454" y="42" font-size="15" fill="#111827">계산에 안 들어감</text>

  <!-- ── Accuracy ── -->
  <rect x="24" y="64" width="832" height="132" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="48" y="96" width="46" height="32" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="71" y="117" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TP</text>
  <rect x="98" y="96" width="46" height="32" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="121" y="117" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">FN</text>
  <rect x="48" y="132" width="46" height="32" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="71" y="153" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">FP</text>
  <rect x="98" y="132" width="46" height="32" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="121" y="153" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TN</text>

  <text x="172" y="98" fill="#111827"><tspan font-size="20" font-weight="bold" fill="#1d4ed8">Accuracy</tspan><tspan font-size="17"> = (TP + TN) / 전체</tspan></text>
  <text x="172" y="124" font-size="16" fill="#374151">= (210 + 9560) / 10000</text>
  <text x="172" y="154" font-size="16" font-weight="bold" fill="#111827">“전체 중 맞춘 비율”</text>
  <text x="172" y="178" font-size="16" fill="#4b5563">→ 분모가 전체라 다수 클래스에 지배당한다</text>

  <text x="832" y="126" font-size="32" font-weight="bold" fill="#1d4ed8" text-anchor="end">0.977</text>
  <rect x="692" y="144" width="140" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="692" y="144" width="136.8" height="10" rx="5" fill="#1d4ed8"/>

  <!-- ── Precision ── -->
  <rect x="24" y="208" width="832" height="132" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="48" y="240" width="46" height="32" rx="4" fill="#047857" stroke="#047857" stroke-width="1.2"/>
  <text x="71" y="261" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TP</text>
  <rect x="98" y="240" width="46" height="32" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="121" y="261" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">FN</text>
  <rect x="48" y="276" width="46" height="32" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
  <text x="71" y="297" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">FP</text>
  <rect x="98" y="276" width="46" height="32" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="121" y="297" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">TN</text>

  <text x="172" y="242" fill="#111827"><tspan font-size="20" font-weight="bold" fill="#047857">Precision</tspan><tspan font-size="17"> = TP / (TP + FP)</tspan></text>
  <text x="172" y="268" font-size="16" fill="#374151">= 210 / 350</text>
  <text x="172" y="298" font-size="16" font-weight="bold" fill="#111827">“스팸이라 판정한 것 중 진짜 스팸의 비율”</text>
  <text x="172" y="322" font-size="16" fill="#4b5563">→ 분모가 '내가 잡은 것'. 헛다리를 짚으면 떨어진다</text>

  <text x="832" y="270" font-size="32" font-weight="bold" fill="#047857" text-anchor="end">0.600</text>
  <rect x="692" y="288" width="140" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="692" y="288" width="84" height="10" rx="5" fill="#047857"/>

  <!-- ── Recall ── -->
  <rect x="24" y="352" width="832" height="132" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="48" y="384" width="46" height="32" rx="4" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
  <text x="71" y="405" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TP</text>
  <rect x="98" y="384" width="46" height="32" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="121" y="405" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">FN</text>
  <rect x="48" y="420" width="46" height="32" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="71" y="441" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">FP</text>
  <rect x="98" y="420" width="46" height="32" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="121" y="441" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">TN</text>

  <text x="172" y="386" fill="#111827"><tspan font-size="20" font-weight="bold" fill="#b45309">Recall</tspan><tspan font-size="17"> = TP / (TP + FN)</tspan></text>
  <text x="172" y="412" font-size="16" fill="#374151">= 210 / 300</text>
  <text x="172" y="442" font-size="16" font-weight="bold" fill="#111827">“실제 스팸 중 내가 잡은 비율”</text>
  <text x="172" y="466" font-size="16" fill="#4b5563">→ 분모가 '실제 정답'. 놓치면 떨어진다</text>

  <text x="832" y="414" font-size="32" font-weight="bold" fill="#b45309" text-anchor="end">0.700</text>
  <rect x="692" y="432" width="140" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="692" y="432" width="98" height="10" rx="5" fill="#b45309"/>

  <!-- ── F1 ── -->
  <rect x="24" y="496" width="832" height="124" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="48" y="520" width="96" height="32" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
  <text x="96" y="541" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">P 0.600</text>
  <rect x="48" y="564" width="96" height="32" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="96" y="585" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">R 0.700</text>

  <text x="172" y="530" fill="#111827"><tspan font-size="20" font-weight="bold" fill="#6d28d9">F1</tspan><tspan font-size="17"> = 2 · P · R / (P + R)</tspan></text>
  <text x="172" y="556" font-size="16" fill="#374151">= 2 × 0.6 × 0.7 / 1.3</text>
  <text x="172" y="588" font-size="16" fill="#111827"><tspan font-weight="bold">둘의 조화평균.</tspan> 한쪽이 낮으면 크게 끌려 내려간다</text>

  <text x="832" y="558" font-size="32" font-weight="bold" fill="#6d28d9" text-anchor="end">≈ 0.646</text>
  <rect x="692" y="576" width="140" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="692" y="576" width="90.4" height="10" rx="5" fill="#6d28d9"/>
</svg>
