<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">축의 구조</title>
  <desc id="d">면접 합격 판단을 위한 4가지 축(기초 이해, 문제 해결, 소통, 성장 가능성)의 구조와 핵심 상세 내용을 설명하는 표 다이어그램입니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 상단: 합격 판단 (Header Span) -->
  <rect x="40" y="40" width="800" height="50" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="1.5"/>
  <text x="440" y="70" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">합격 판단</text>

  <!-- 1열: 기초 이해 (최소 기준선) -->
  <rect x="40" y="90" width="200" height="50" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="140" y="120" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">1. 기초 이해</text>

  <rect x="40" y="140" width="200" height="170" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="140" y="170" font-size="13" fill="#1f2933" text-anchor="middle">개념을 정확히</text>
  <text x="140" y="195" font-size="13" fill="#1f2933" text-anchor="middle">알고, 왜 그런</text>
  <text x="140" y="220" font-size="13" fill="#1f2933" text-anchor="middle">지 설명 가능</text>

  <rect x="40" y="310" width="200" height="150" fill="#fef2f2" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="140" y="340" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">최소 기준선</text>
  <text x="140" y="365" font-size="13" fill="#dc2626" text-anchor="middle">(못 넘으면</text>
  <text x="140" y="390" font-size="13" fill="#dc2626" text-anchor="middle">거기서 끝)</text>

  <!-- 2열: 문제 해결 (변별력) -->
  <rect x="240" y="90" width="200" height="50" fill="#ecfdf5" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="340" y="120" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">2. 문제 해결</text>

  <rect x="240" y="140" width="200" height="170" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="340" y="170" font-size="13" fill="#1f2933" text-anchor="middle">모르는 상황</text>
  <text x="340" y="195" font-size="13" fill="#1f2933" text-anchor="middle">에서 가설을</text>
  <text x="340" y="220" font-size="13" fill="#1f2933" text-anchor="middle">세우고 좁힘</text>

  <rect x="240" y="310" width="200" height="150" fill="#ecfdf5" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="340" y="340" font-size="13" fill="#059669" text-anchor="middle">변별력이</text>
  <text x="340" y="365" font-size="13" fill="#059669" text-anchor="middle">가장 큰 축</text>

  <!-- 3열: 소통 (감점) -->
  <rect x="440" y="90" width="200" height="50" fill="#fffbeb" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="540" y="120" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">3. 소통</text>

  <rect x="440" y="140" width="200" height="170" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="540" y="170" font-size="13" fill="#1f2933" text-anchor="middle">상대 수준에</text>
  <text x="540" y="195" font-size="13" fill="#1f2933" text-anchor="middle">맞춰 설명하고</text>
  <text x="540" y="220" font-size="13" fill="#1f2933" text-anchor="middle">질문 의도를</text>
  <text x="540" y="245" font-size="13" fill="#1f2933" text-anchor="middle">되묻기</text>

  <rect x="440" y="310" width="200" height="150" fill="#fffbeb" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="540" y="340" font-size="13" fill="#d97706" text-anchor="middle">여기서 감점</text>
  <text x="540" y="365" font-size="13" fill="#d97706" text-anchor="middle">나는 걸</text>
  <text x="540" y="390" font-size="13" fill="#d97706" text-anchor="middle">본인만 모름</text>

  <!-- 4열: 성장 가능성 (가중치) -->
  <rect x="640" y="90" width="200" height="50" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="740" y="112" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">4. 성장</text>
  <text x="740" y="130" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">가능성</text>

  <rect x="640" y="140" width="200" height="170" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="740" y="170" font-size="13" fill="#1f2933" text-anchor="middle">학습 습관,</text>
  <text x="740" y="195" font-size="13" fill="#1f2933" text-anchor="middle">피드백 수용</text>
  <text x="740" y="220" font-size="13" fill="#1f2933" text-anchor="middle">실패의 해석</text>

  <rect x="640" y="310" width="200" height="150" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="740" y="340" font-size="13" fill="#7c3aed" text-anchor="middle">신입에서</text>
  <text x="740" y="365" font-size="13" fill="#7c3aed" text-anchor="middle">가중치가</text>
  <text x="740" y="390" font-size="13" fill="#7c3aed" text-anchor="middle">가장 크다</text>
</svg>