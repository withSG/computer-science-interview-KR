<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">합격 판단의 네 축</title>
  <desc id="d">기초 이해, 문제 해결, 소통, 성장 가능성 네 축이 합격 판단으로 모이며, 축마다 보는 것과 그 축의 성격(최소 기준선, 변별력이 가장 큰 축, 본인만 모르는 감점, 신입 가중치 최대)을 정리한 그림입니다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 합격 판단 -->
  <rect x="24" y="24" width="832" height="52" rx="8" fill="#1f2937"/>
  <text x="440" y="57" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">합격 판단</text>

  <!-- 네 축에서 합격 판단으로 -->
  <line x1="122" y1="118" x2="122" y2="84" stroke="#374151" stroke-width="2" marker-end="url(#up)"/>
  <line x1="334" y1="118" x2="334" y2="84" stroke="#374151" stroke-width="2" marker-end="url(#up)"/>
  <line x1="546" y1="118" x2="546" y2="84" stroke="#374151" stroke-width="2" marker-end="url(#up)"/>
  <line x1="758" y1="118" x2="758" y2="84" stroke="#374151" stroke-width="2" marker-end="url(#up)"/>

  <!-- 1. 기초 이해 -->
  <rect x="24" y="124" width="196" height="242" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="24" y="124" width="196" height="50" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="122" y="155" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. 기초 이해</text>
  <text x="122" y="208" font-size="15" fill="#111827" text-anchor="middle"><tspan x="122">개념을 정확히 알고,</tspan><tspan x="122" dy="22">왜 그런지 설명 가능</tspan></text>
  <rect x="36" y="286" width="172" height="68" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="122" y="314" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">최소 기준선</text>
  <text x="122" y="337" font-size="15" fill="#7f1d1d" text-anchor="middle">(못 넘으면 거기서 끝)</text>

  <!-- 2. 문제 해결 -->
  <rect x="236" y="124" width="196" height="242" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="236" y="124" width="196" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="334" y="155" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">2. 문제 해결</text>
  <text x="334" y="208" font-size="15" fill="#111827" text-anchor="middle"><tspan x="334">모르는 상황에서</tspan><tspan x="334" dy="22">가설을 세우고 좁힘</tspan></text>
  <rect x="248" y="286" width="172" height="68" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="334" y="314" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">변별력이</text>
  <text x="334" y="337" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">가장 큰 축</text>

  <!-- 3. 소통 -->
  <rect x="448" y="124" width="196" height="242" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="448" y="124" width="196" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="546" y="155" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">3. 소통</text>
  <text x="546" y="208" font-size="15" fill="#111827" text-anchor="middle"><tspan x="546">상대 수준에 맞춰</tspan><tspan x="546" dy="22">설명하고,</tspan><tspan x="546" dy="22">질문 의도를 되묻기</tspan></text>
  <rect x="460" y="286" width="172" height="68" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="546" y="314" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">여기서 감점 나는 걸</text>
  <text x="546" y="337" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">본인만 모름</text>

  <!-- 4. 성장 가능성 -->
  <rect x="660" y="124" width="196" height="242" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="660" y="124" width="196" height="50" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="758" y="155" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">4. 성장 가능성</text>
  <text x="758" y="208" font-size="15" fill="#111827" text-anchor="middle"><tspan x="758">학습 습관,</tspan><tspan x="758" dy="22">피드백 수용,</tspan><tspan x="758" dy="22">실패의 해석</tspan></text>
  <rect x="672" y="286" width="172" height="68" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="758" y="314" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">신입에서 가중치가</text>
  <text x="758" y="337" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">가장 크다</text>
</svg>
