<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">필드 주입과 생성자 주입의 객체 완성 시점</title>
  <desc id="d">필드 주입은 객체 생성 뒤 주입 전까지 paymentService == null인 반쯤 만들어진 순간이 있다. 생성자 주입은 의존성을 먼저 준비한 뒤 객체를 만들므로 태어난 순간부터 완전한 상태다.</desc>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="280" fill="#ffffff"/>

  <!-- ───── 필드 주입 ───── -->
  <rect x="24" y="24" width="832" height="124" rx="10" fill="#f3f4f6"/>
  <text x="44" y="82" font-size="18" font-weight="bold" fill="#111827">필드 주입</text>

  <rect x="320" y="52" width="116" height="48" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="378" y="82" font-size="16" fill="#111827" text-anchor="middle">객체 생성</text>

  <path d="M440,76 H468" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="472" y="44" width="236" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="590" y="69" font-size="15" fill="#b91c1c" text-anchor="middle">이 시점</text>
  <text x="590" y="94" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">paymentService == null</text>
  <text x="590" y="133" font-size="14" fill="#b91c1c" text-anchor="middle">"반쯤 만들어진 객체"</text>

  <path d="M712,76 H740" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="744" y="52" width="96" height="48" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="792" y="82" font-size="16" fill="#111827" text-anchor="middle">주입</text>

  <!-- ───── 생성자 주입 ───── -->
  <rect x="24" y="164" width="832" height="88" rx="10" fill="#f3f4f6"/>
  <text x="44" y="214" font-size="18" font-weight="bold" fill="#111827">생성자 주입</text>

  <rect x="168" y="184" width="116" height="48" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="226" y="214" font-size="16" fill="#111827" text-anchor="middle">의존성 준비</text>

  <path d="M288,208 H316" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="320" y="184" width="116" height="48" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="378" y="214" font-size="16" fill="#111827" text-anchor="middle">객체 생성</text>

  <path d="M436,208 H472" fill="none" stroke="#047857" stroke-width="2"/>

  <rect x="472" y="188" width="368" height="40" rx="20" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="656" y="214" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">태어난 순간부터 완전한 상태</text>
</svg>
