<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AVL 트리의 균형 유지</title>
  <desc id="d">Balance Factor(BF)는 왼쪽 높이에서 오른쪽 높이를 뺀 값이고 허용 범위는 -1, 0, 1이다. 예시 트리에서 루트 3의 BF는 0, 노드 4의 BF는 -1이다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- 정의 띠: BF 공식 + 허용 범위 -->
  <rect x="24" y="24" width="832" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="67" font-size="20" fill="#111827"><tspan font-weight="bold">Balance Factor (BF)</tspan><tspan> = 왼쪽 높이 - 오른쪽 높이</tspan></text>
  <line x1="540" y1="40" x2="540" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="562" y="66" font-size="16" font-weight="bold" fill="#374151">허용 범위</text>
  <rect x="648" y="42" width="52" height="36" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="674" y="66.5" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">-1</text>
  <rect x="710" y="42" width="52" height="36" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="736" y="66.5" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">0</text>
  <rect x="772" y="42" width="52" height="36" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="798" y="66.5" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">1</text>

  <!-- 간선 -->
  <g stroke="#6b7280" stroke-width="2">
    <line x1="440" y1="170" x2="330" y2="250"/>
    <line x1="440" y1="170" x2="550" y2="250"/>
    <line x1="330" y1="250" x2="250" y2="330"/>
    <line x1="550" y1="250" x2="630" y2="330"/>
  </g>

  <!-- 노드 -->
  <g fill="#ffffff" stroke="#1f2937" stroke-width="2">
    <circle cx="440" cy="170" r="24"/>
    <circle cx="330" cy="250" r="24"/>
    <circle cx="550" cy="250" r="24"/>
    <circle cx="250" cy="330" r="24"/>
    <circle cx="630" cy="330" r="24"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="440" y="177">3</text>
    <text x="330" y="257">2</text>
    <text x="550" y="257">4</text>
    <text x="250" y="337">1</text>
    <text x="630" y="337">5</text>
  </g>

  <!-- BF 표시 -->
  <rect x="478" y="138" width="70" height="30" rx="15" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="513" y="159" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">BF=0</text>
  <rect x="588" y="218" width="80" height="30" rx="15" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="628" y="239" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">BF=-1</text>
</svg>
