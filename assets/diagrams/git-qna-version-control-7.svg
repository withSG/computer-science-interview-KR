<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rebase 커밋 그래프</title>
  <desc id="d">feature 커밋이 main의 F 뒤에 A', B', C'로 재적용되어 D, E, F, A', B', C'가 한 줄로 이어지는 선형 히스토리가 된다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- bracket: 커밋 재적용 -->
  <text x="590" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#047857">커밋 재적용</text>
  <line x1="448" y1="72" x2="732" y2="72" stroke="#047857" stroke-width="2"/>
  <line x1="448" y1="72" x2="448" y2="82" stroke="#047857" stroke-width="2"/>
  <line x1="732" y1="72" x2="732" y2="82" stroke="#047857" stroke-width="2"/>

  <!-- edges: main -->
  <line x1="132" y1="220" x2="208" y2="220" stroke="#3b82f6" stroke-width="4"/>
  <line x1="252" y1="220" x2="328" y2="220" stroke="#3b82f6" stroke-width="4"/>
  <!-- edges: feature -->
  <line x1="366.9" y1="205.9" x2="453.1" y2="134.1" stroke="#10b981" stroke-width="4"/>
  <line x1="492" y1="120" x2="568" y2="120" stroke="#10b981" stroke-width="4"/>
  <line x1="612" y1="120" x2="688" y2="120" stroke="#10b981" stroke-width="4"/>

  <!-- main commits -->
  <circle cx="110" cy="220" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="110" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">D</text>
  <circle cx="230" cy="220" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="230" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">E</text>
  <circle cx="350" cy="220" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="350" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">F</text>

  <!-- rebased feature commits (dashed = reapplied) -->
  <circle cx="470" cy="120" r="22" fill="#d1fae5" stroke="#047857" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="470" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">A'</text>
  <circle cx="590" cy="120" r="22" fill="#d1fae5" stroke="#047857" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="590" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">B'</text>
  <circle cx="710" cy="120" r="22" fill="#d1fae5" stroke="#047857" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="710" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">C'</text>

  <!-- branch tags -->
  <rect x="748" y="107" width="80" height="26" rx="13" fill="#047857"/>
  <text x="788" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">feature</text>
  <rect x="392" y="207" width="60" height="26" rx="13" fill="#1d4ed8"/>
  <text x="422" y="225" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main</text>

  <!-- caption: linear history -->
  <rect x="236" y="262" width="408" height="36" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="286" text-anchor="middle" font-size="17" fill="#111827"><tspan font-weight="700">선형 히스토리</tspan>: D → E → F → A' → B' → C'</text>
</svg>
