<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ArgoCD (클러스터 내부) 구성 요소</title>
  <desc id="d">Repo Server, Application Controller, API Server로 구성된 ArgoCD 클러스터 내부 아키텍처 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  
  <!-- Outer Container: ArgoCD (클러스터 내부) -->
  <rect x="20" y="20" width="840" height="390" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="none" rx="8"/>
  <text x="440" y="47" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">ArgoCD (클러스터 내부)</text>

  <!-- Component 1: Repo Server -->
  <rect x="50" y="70" width="180" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="140" y="105" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Repo Server</text>

  <!-- Repo Server Description -->
  <text x="260" y="95" font-size="13" fill="#1f2933">Git 저장소를 clone하고 Helm/Kustomize</text>
  <text x="260" y="117" font-size="13" fill="#1f2933">를 렌더링해 순수 매니페스트를 만든다</text>

  <!-- Arrow 1: Repo Server -> Application Controller -->
  <path d="M140,130 L140,180" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="148" y="146" width="135" height="18" fill="#ffffff" rx="2"/>
  <text x="150" y="160" font-size="11.5" fill="#2563eb">렌더링된 매니페스트</text>

  <!-- Component 2: Application Controller -->
  <rect x="50" y="180" width="180" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="140" y="208" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Application</text>
  <text x="140" y="228" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Controller</text>

  <!-- Application Controller Description -->
  <text x="260" y="205" font-size="13" fill="#1f2933">원하는 상태 vs 실제 상태를 비교하고</text>
  <text x="260" y="227" font-size="13" fill="#1f2933">차이가 있으면 apply 한다.</text>
  <text x="260" y="249" font-size="13" fill="#1f2933">이게 조정 루프(reconciliation loop)다.</text>

  <!-- Connector Line: Application Controller - API Server -->
  <path d="M140,250 L140,300" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <!-- Component 3: API Server -->
  <rect x="50" y="300" width="180" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="140" y="335" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">API Server</text>

  <!-- API Server Description -->
  <text x="260" y="325" font-size="13" fill="#1f2933">웹 UI, CLI, API 제공</text>
  <text x="260" y="347" font-size="13" fill="#1f2933">RBAC, SSO 연동</text>
</svg>