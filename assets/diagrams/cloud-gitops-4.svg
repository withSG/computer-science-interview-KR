<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ArgoCD 구성 요소</title>
  <desc id="d">클러스터 안의 ArgoCD는 Repo Server, Application Controller, API Server 세 구성 요소로 이뤄진다. Repo Server가 렌더링한 매니페스트를 Application Controller가 받아 실제 상태와 비교하고 차이가 있으면 apply 하는 조정 루프를 돈다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="490" fill="#ffffff"/>

  <!-- 클러스터 내부 컨테이너 -->
  <rect x="24" y="24" width="832" height="442" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="48" y="58" font-size="18" font-weight="bold" fill="#111827">ArgoCD <tspan font-weight="normal" fill="#4b5563">(클러스터 내부)</tspan></text>

  <!-- 1. Repo Server -->
  <rect x="56" y="84" width="270" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="191" y="122" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Repo Server</text>
  <text x="360" y="110" font-size="16" fill="#111827">Git 저장소를 clone하고 Helm/Kustomize를 렌더링해</text>
  <text x="360" y="134" font-size="16" fill="#111827">순수 매니페스트를 만든다</text>

  <!-- 화살표: 렌더링된 매니페스트 -->
  <line x1="191" y1="150" x2="191" y2="216" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="206" y="189" font-size="15" fill="#1d4ed8">렌더링된 매니페스트</text>

  <!-- 2. Application Controller (핵심) -->
  <rect x="56" y="220" width="270" height="96" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="191" y="274" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Application Controller</text>
  <text x="360" y="250" font-size="16" fill="#111827">원하는 상태 vs 실제 상태를 비교하고</text>
  <text x="360" y="274" font-size="16" fill="#111827">차이가 있으면 apply 한다.</text>
  <text x="360" y="298" font-size="16" font-weight="bold" fill="#1d4ed8">이게 조정 루프(reconciliation loop)다.</text>

  <!-- 연결선: Controller - API Server -->
  <line x1="191" y1="316" x2="191" y2="372" stroke="#64748b" stroke-width="2"/>

  <!-- 3. API Server -->
  <rect x="56" y="372" width="270" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="191" y="410" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">API Server</text>
  <text x="360" y="398" font-size="16" fill="#111827">웹 UI, CLI, API 제공</text>
  <text x="360" y="422" font-size="16" fill="#111827">RBAC, SSO 연동</text>
</svg>
