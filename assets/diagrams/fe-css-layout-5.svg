<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">z-index 숫자 경쟁이 지는 이유</title>
  <desc id="d">.header가 새 stacking context를 만들어 안쪽 .dropdown의 z-index 999999는 .header 안에서만 유효하고, 문서 루트에서는 .header=10과 .content=20이 비교되어 .content가 .dropdown 위로 온다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 왼쪽: DOM 구조와 stacking context -->
  <rect x="24" y="24" width="560" height="300" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="44" y="54" font-size="17" font-weight="bold" fill="#111827">문서 루트<tspan font-size="15" font-weight="normal" fill="#4b5563"> (stacking context)</tspan></text>

  <!-- .header -->
  <rect x="44" y="72" width="520" height="164" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="100" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#1d4ed8">.header</tspan>  position:relative; <tspan font-weight="bold">z-index:10</tspan>; opacity:0.99</text>
  <rect x="60" y="112" width="224" height="26" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="74" y="130" font-size="14" font-weight="bold" fill="#b91c1c">새 stacking context 생성!</text>

  <!-- .dropdown (header 안) -->
  <rect x="64" y="150" width="480" height="70" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="80" y="177" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#b45309">.dropdown</tspan>  position:absolute; <tspan font-weight="bold">z-index:999999</tspan></text>
  <text x="80" y="204" font-size="15" fill="#92400e">이 값은 .header 안에서만 유효</text>

  <!-- .content -->
  <rect x="44" y="252" width="520" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="283" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#047857">.content</tspan>  position:relative; <tspan font-weight="bold">z-index:20</tspan></text>

  <!-- 오른쪽: 문서 루트에서의 판정 -->
  <text x="608" y="54" font-size="16" font-weight="bold" fill="#111827">문서 루트에서 쌓이는 순서</text>
  <text x="624" y="90" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">앞</text>
  <line x1="624" y1="258" x2="624" y2="102" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="624" y="282" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">뒤</text>

  <rect x="644" y="72" width="212" height="64" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="99" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#047857">.content</tspan>  z-index:20</text>
  <text x="660" y="124" font-size="15" fill="#374151">위로 온다</text>

  <text x="750" y="159" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">20 &gt; 10</text>

  <rect x="644" y="172" width="212" height="96" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="660" y="198" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#1d4ed8">.header</tspan>  z-index:10</text>
  <text x="660" y="224" font-size="15" fill="#374151">안의 .dropdown까지</text>
  <text x="660" y="248" font-size="15" fill="#374151">통째로 이 층에 깔림</text>

  <!-- 결과 -->
  <rect x="24" y="348" width="832" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="44" y="382" font-size="16" font-weight="bold" fill="#b91c1c">결과</text>
  <text x="96" y="382" font-size="16" font-weight="bold" fill="#111827">.content가 .dropdown 위로 온다<tspan font-size="15" font-weight="normal" fill="#374151">  (.header=10 vs .content=20 으로 판정)</tspan></text>
</svg>
