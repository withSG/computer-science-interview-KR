<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서버를 늘리면 세션이 깨진다 - 해법 3가지</title>
  <desc id="d">Sticky Session, Session Clustering, 외부 세션 저장소 방식의 구조 비교 다이어그램</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-ink-both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-ink-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 그룹 1: Sticky Session -->
  <g id="sticky-session">
    <text x="135" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Sticky Session</text>
    
    <!-- 서버 1 -->
    <rect x="35" y="55" width="50" height="55" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
    <text x="60" y="78" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>
    <text x="60" y="98" font-size="13" fill="#52606d" text-anchor="middle">A,B</text>

    <!-- 서버 2 -->
    <rect x="110" y="55" width="50" height="55" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
    <text x="135" y="78" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>
    <text x="135" y="98" font-size="13" fill="#52606d" text-anchor="middle">C,D</text>

    <!-- 서버 3 -->
    <rect x="185" y="55" width="50" height="55" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
    <text x="210" y="78" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>
    <text x="210" y="98" font-size="13" fill="#52606d" text-anchor="middle">E,F</text>

    <!-- 설명 -->
    <text x="135" y="145" font-size="13" fill="#1f2933" text-anchor="middle">각자 자기 것만</text>
    <text x="135" y="170" font-size="13" fill="#dc2626" text-anchor="middle">→ 서버가 죽으면 소실</text>
  </g>

  <!-- 구분선 1 -->
  <line x1="285" y1="25" x2="285" y2="340" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 그룹 2: Session Clustering -->
  <g id="session-clustering">
    <text x="440" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Session Clustering</text>

    <!-- 서버 1 -->
    <rect x="340" y="55" width="50" height="55" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
    <text x="365" y="78" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>
    <text x="365" y="98" font-size="13" fill="#52606d" text-anchor="middle">ABC</text>

    <!-- 서버 2 -->
    <rect x="415" y="55" width="50" height="55" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
    <text x="440" y="78" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>
    <text x="440" y="98" font-size="13" fill="#52606d" text-anchor="middle">ABC</text>

    <!-- 서버 3 -->
    <rect x="490" y="55" width="50" height="55" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
    <text x="515" y="78" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>
    <text x="515" y="98" font-size="13" fill="#52606d" text-anchor="middle">ABC</text>

    <!-- 양방향 화살표 1 <-> 2 -->
    <path d="M390,82 L415,82" stroke="#1f2933" stroke-width="1.5" fill="none" marker-start="url(#a-ink-rev)" marker-end="url(#a-ink)"/>

    <!-- 양방향 화살표 2 <-> 3 -->
    <path d="M465,82 L490,82" stroke="#1f2933" stroke-width="1.5" fill="none" marker-start="url(#a-ink-rev)" marker-end="url(#a-ink)"/>

    <!-- 설명 -->
    <text x="440" y="145" font-size="13" fill="#1f2933" text-anchor="middle">모두가 전부 복사</text>
    <text x="440" y="170" font-size="13" fill="#dc2626" text-anchor="middle">→ 복제 비용 폭발</text>
  </g>

  <!-- 구분선 2 -->
  <line x1="595" y1="25" x2="595" y2="340" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 그룹 3: 외부 세션 저장소 -->
  <g id="external-session-store">
    <text x="745" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">외부 세션 저장소</text>

    <!-- 서버 1 -->
    <rect x="645" y="55" width="50" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="670" y="77" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

    <!-- 서버 2 -->
    <rect x="720" y="55" width="50" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="745" y="77" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

    <!-- 서버 3 -->
    <rect x="795" y="55" width="50" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="820" y="77" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

    <!-- 연결선 및 외부 저장소 지정 화살표 -->
    <!-- 서버 1,2,3 하단 선 -->
    <path d="M670,90 L670,115" stroke="#1f2933" stroke-width="1.5" fill="none"/>
    <path d="M745,90 L745,115" stroke="#1f2933" stroke-width="1.5" fill="none"/>
    <path d="M820,90 L820,115" stroke="#1f2933" stroke-width="1.5" fill="none"/>
    
    <!-- 가로 합류선 -->
    <path d="M670,115 L820,115" stroke="#1f2933" stroke-width="1.5" fill="none"/>

    <!-- 중앙에서 Redis로 내려가는 화살표 -->
    <path d="M745,115 L745,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Redis 박스 -->
    <rect x="630" y="140" width="230" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="745" y="165" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Redis  A,B,C,D,E</text>
  </g>
</svg>