<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세션 공유 해법 3가지</title>
  <desc id="d">Sticky Session은 WAS마다 자기 세션만 들고 있어 서버가 죽으면 소실되고, Session Clustering은 모든 WAS가 세션을 전부 복사해 복제 비용이 폭발한다. 외부 세션 저장소는 모든 WAS가 공용 Redis에 세션을 두어 WAS가 무상태가 된다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ① Sticky Session -->
  <rect x="24" y="24" width="832" height="116" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="52" cy="70" r="14" fill="#111827"/>
  <text x="52" y="75" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="76" font-size="18" font-weight="bold" fill="#111827">Sticky</text>
  <text x="76" y="100" font-size="18" font-weight="bold" fill="#111827">Session</text>

  <rect x="216" y="48" width="84" height="68" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="258" y="73" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 1</text>
  <text x="258" y="100" font-size="16" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">A,B</text>
  <rect x="336" y="48" width="84" height="68" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="378" y="73" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 2</text>
  <text x="378" y="100" font-size="16" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">C,D</text>
  <rect x="456" y="48" width="84" height="68" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="498" y="73" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 3</text>
  <text x="498" y="100" font-size="16" fill="#b45309" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">E,F</text>

  <text x="576" y="60" font-size="16" fill="#111827">각자 자기 것만</text>
  <text x="576" y="87" font-size="16" font-weight="bold" fill="#b91c1c">→ 서버가 죽으면 소실</text>
  <text x="576" y="113" font-size="15" fill="#4b5563">배포·서버 축소 때도 세션 끊김</text>

  <!-- ② Session Clustering -->
  <rect x="24" y="156" width="832" height="160" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="52" cy="206" r="14" fill="#111827"/>
  <text x="52" y="211" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="76" y="212" font-size="18" font-weight="bold" fill="#111827">Session</text>
  <text x="76" y="236" font-size="18" font-weight="bold" fill="#111827">Clustering</text>

  <rect x="216" y="180" width="84" height="68" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="258" y="205" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 1</text>
  <text x="258" y="232" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">A,B,C</text>
  <rect x="336" y="180" width="84" height="68" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="378" y="205" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 2</text>
  <text x="378" y="232" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">A,B,C</text>
  <rect x="456" y="180" width="84" height="68" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="498" y="205" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 3</text>
  <text x="498" y="232" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">A,B,C</text>

  <!-- 서로 복제 -->
  <path d="M304,214 L332,214" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <path d="M424,214 L452,214" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <path d="M258,254 Q378,314 498,254" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-start="url(#ak)" marker-end="url(#ak)"/>

  <text x="576" y="208" font-size="16" fill="#111827">모두가 전부 복사</text>
  <text x="576" y="235" font-size="16" font-weight="bold" fill="#b91c1c">→ 복제 비용 폭발</text>
  <text x="576" y="261" font-size="15" fill="#4b5563">세션 쓰기 1번에 n-1번 전송</text>

  <!-- ③ 외부 세션 저장소 -->
  <rect x="24" y="332" width="832" height="190" rx="10" fill="#f9fafb" stroke="#047857" stroke-width="2"/>
  <circle cx="52" cy="382" r="14" fill="#111827"/>
  <text x="52" y="387" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="76" y="388" font-size="18" font-weight="bold" fill="#111827">외부 세션</text>
  <text x="76" y="412" font-size="18" font-weight="bold" fill="#111827">저장소</text>

  <rect x="216" y="356" width="84" height="68" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="258" y="381" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 1</text>
  <text x="258" y="408" font-size="15" fill="#4b5563" text-anchor="middle">없음</text>
  <rect x="336" y="356" width="84" height="68" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="378" y="381" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 2</text>
  <text x="378" y="408" font-size="15" fill="#4b5563" text-anchor="middle">없음</text>
  <rect x="456" y="356" width="84" height="68" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="498" y="381" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">WAS 3</text>
  <text x="498" y="408" font-size="15" fill="#4b5563" text-anchor="middle">없음</text>

  <line x1="258" y1="426" x2="258" y2="454" stroke="#047857" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="378" y1="426" x2="378" y2="454" stroke="#047857" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="498" y1="426" x2="498" y2="454" stroke="#047857" stroke-width="1.8" marker-end="url(#ag)"/>

  <rect x="216" y="458" width="324" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="378" y="486" font-size="17" fill="#111827" text-anchor="middle"><tspan font-weight="bold">Redis</tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#047857" dx="12">A,B,C,D,E</tspan></text>

  <text x="576" y="408" font-size="16" fill="#111827">WAS는 완전한 무상태</text>
  <text x="576" y="435" font-size="16" font-weight="bold" fill="#047857">→ 실무 표준</text>
  <text x="576" y="461" font-size="15" fill="#4b5563">단, Redis가 SPOF → 이중화</text>
</svg>
