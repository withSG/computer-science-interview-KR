<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">자기소개 시간 배분</title>
  <desc id="d">1분 버전은 현재 좌표 10초, 강점과 근거 35초, 지원 연결 15초로 합계 60초이고, 3분 버전은 현재 좌표 15초, 강점 1과 근거 50초, 강점 2와 근거 40초, 지원 동기 35초, 마무리 한 문장 10초로 합계 150초(2분 30초)임을 같은 시간축 위 막대로 보여준다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- 행 배경 띠 -->
  <rect x="24" y="64" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="136" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="222" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="294" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="366" width="832" height="36" fill="#f3f4f6"/>

  <!-- 눈금선 (30초 간격, 1초 = 3.5) -->
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="301" y1="64" x2="301" y2="172"/>
    <line x1="406" y1="64" x2="406" y2="172"/>
    <line x1="511" y1="64" x2="511" y2="172"/>
    <line x1="616" y1="64" x2="616" y2="172"/>
    <line x1="721" y1="64" x2="721" y2="172"/>
    <line x1="826" y1="64" x2="826" y2="172"/>
    <line x1="301" y1="222" x2="301" y2="410"/>
    <line x1="406" y1="222" x2="406" y2="410"/>
    <line x1="511" y1="222" x2="511" y2="410"/>
    <line x1="616" y1="222" x2="616" y2="410"/>
    <line x1="721" y1="222" x2="721" y2="410"/>
    <line x1="826" y1="222" x2="826" y2="410"/>
  </g>
  <line x1="196" y1="64" x2="196" y2="172" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="196" y1="222" x2="196" y2="410" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 1분 버전 -->
  <text x="24" y="48" font-size="19" font-weight="bold" fill="#111827">1분 버전</text>
  <text x="112" y="48" font-size="15" font-weight="bold" fill="#1d4ed8">합계 60초</text>

  <text x="40" y="87.5" font-size="16" fill="#111827">현재 좌표</text>
  <rect x="196" y="72" width="35" height="20" rx="3" fill="#2563eb"/>
  <text x="239" y="87.5" font-size="15" font-weight="bold" fill="#1f2937">10초</text>

  <text x="40" y="123.5" font-size="16" fill="#111827">강점 + 근거</text>
  <rect x="231" y="108" width="122.5" height="20" rx="3" fill="#2563eb"/>
  <text x="292.25" y="123.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">35초</text>

  <text x="40" y="159.5" font-size="16" fill="#111827">지원 연결</text>
  <rect x="353.5" y="144" width="52.5" height="20" rx="3" fill="#2563eb"/>
  <text x="414" y="159.5" font-size="15" font-weight="bold" fill="#1f2937">15초</text>

  <!-- 3분 버전 -->
  <text x="24" y="206" font-size="19" font-weight="bold" fill="#111827">3분 버전</text>
  <text x="112" y="206" font-size="15" font-weight="bold" fill="#047857">합계 150초 (2분 30초)</text>

  <text x="40" y="245.5" font-size="16" fill="#111827">현재 좌표</text>
  <rect x="196" y="230" width="52.5" height="20" rx="3" fill="#047857"/>
  <text x="256.5" y="245.5" font-size="15" font-weight="bold" fill="#1f2937">15초</text>

  <text x="40" y="281.5" font-size="16" fill="#111827">강점 1 + 근거</text>
  <rect x="248.5" y="266" width="175" height="20" rx="3" fill="#047857"/>
  <text x="336" y="281.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">50초</text>

  <text x="40" y="317.5" font-size="16" fill="#111827">강점 2 + 근거</text>
  <rect x="423.5" y="302" width="140" height="20" rx="3" fill="#047857"/>
  <text x="493.5" y="317.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">40초</text>

  <text x="40" y="353.5" font-size="16" fill="#111827">지원 동기</text>
  <rect x="563.5" y="338" width="122.5" height="20" rx="3" fill="#047857"/>
  <text x="624.75" y="353.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">35초</text>

  <text x="40" y="389.5" font-size="16" fill="#111827">마무리 한 문장</text>
  <rect x="686" y="374" width="35" height="20" rx="3" fill="#047857"/>
  <text x="729" y="389.5" font-size="15" font-weight="bold" fill="#1f2937">10초</text>

  <!-- 시간축 -->
  <line x1="196" y1="410" x2="826" y2="410" stroke="#6b7280" stroke-width="1.5"/>
  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="196" y1="410" x2="196" y2="416"/>
    <line x1="301" y1="410" x2="301" y2="416"/>
    <line x1="406" y1="410" x2="406" y2="416"/>
    <line x1="511" y1="410" x2="511" y2="416"/>
    <line x1="616" y1="410" x2="616" y2="416"/>
    <line x1="721" y1="410" x2="721" y2="416"/>
    <line x1="826" y1="410" x2="826" y2="416"/>
  </g>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="196" y="434">0초</text>
    <text x="301" y="434">30초</text>
    <text x="406" y="434">60초</text>
    <text x="511" y="434">90초</text>
    <text x="616" y="434">120초</text>
    <text x="721" y="434">150초</text>
    <text x="826" y="434">180초</text>
  </g>
</svg>
