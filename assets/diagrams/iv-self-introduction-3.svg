<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">시간 배분</title>
  <desc id="d">1분 버전과 3분 버전 자기소개의 항목별 시간 배분 비율을 시각화한 바 차트 다이어그램</desc>
  
  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 1분 버전 그룹 -->
  <g>
    <!-- 섹션 헤더 -->
    <text x="30" y="36.6" font-size="16" font-weight="bold" fill="#1f2933">1분 버전</text>
    
    <!-- Row 1: 현재 좌표 -->
    <text x="30" y="70.1" font-size="13" fill="#1f2933">├─ 현재 좌표</text>
    <rect x="160" y="55" width="48" height="22" rx="3" fill="#2563eb"/>
    <text x="218" y="70.1" font-size="13" fill="#52606d">(10초)</text>
    
    <!-- Row 2: 강점 + 근거 -->
    <text x="30" y="102.1" font-size="13" fill="#1f2933">├─ 강점 + 근거</text>
    <rect x="160" y="87" width="168" height="22" rx="3" fill="#2563eb"/>
    <text x="338" y="102.1" font-size="13" fill="#52606d">(35초)</text>
    
    <!-- Row 3: 지원 연결 -->
    <text x="30" y="134.1" font-size="13" fill="#1f2933">└─ 지원 연결</text>
    <rect x="160" y="119" width="72" height="22" rx="3" fill="#2563eb"/>
    <text x="242" y="134.1" font-size="13" fill="#52606d">(15초)</text>
  </g>

  <!-- 구분선 -->
  <line x1="30" y1="162" x2="850" y2="162" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 3분 버전 그룹 -->
  <g>
    <!-- 섹션 헤더 -->
    <text x="30" y="196.6" font-size="16" font-weight="bold" fill="#1f2933">3분 버전</text>
    
    <!-- Row 1: 현재 좌표 -->
    <text x="30" y="230.1" font-size="13" fill="#1f2933">├─ 현재 좌표</text>
    <rect x="175" y="215" width="72" height="22" rx="3" fill="#059669"/>
    <text x="257" y="230.1" font-size="13" fill="#52606d">(15초)</text>
    
    <!-- Row 2: 강점 1 + 근거 -->
    <text x="30" y="262.1" font-size="13" fill="#1f2933">├─ 강점 1 + 근거</text>
    <rect x="175" y="247" width="240" height="22" rx="3" fill="#059669"/>
    <text x="425" y="262.1" font-size="13" fill="#52606d">(50초)</text>
    
    <!-- Row 3: 강점 2 + 근거 -->
    <text x="30" y="294.1" font-size="13" fill="#1f2933">├─ 강점 2 + 근거</text>
    <rect x="175" y="279" width="192" height="22" rx="3" fill="#059669"/>
    <text x="377" y="294.1" font-size="13" fill="#52606d">(40초)</text>
    
    <!-- Row 4: 지원 동기 -->
    <text x="30" y="326.1" font-size="13" fill="#1f2933">├─ 지원 동기</text>
    <rect x="175" y="311" width="168" height="22" rx="3" fill="#059669"/>
    <text x="353" y="326.1" font-size="13" fill="#52606d">(35초)</text>
    
    <!-- Row 5: 마무리 한 문장 -->
    <text x="30" y="358.1" font-size="13" fill="#1f2933">└─ 마무리 한 문장</text>
    <rect x="175" y="343" width="48" height="22" rx="3" fill="#059669"/>
    <text x="233" y="358.1" font-size="13" fill="#52606d">(10초)</text>
  </g>
</svg>