<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">commit 단계의 세 하위 단계와 페인트, useEffect 순서</title>
  <desc id="d">전 구간 동기로 중단되지 않는 commit 단계는 mutation 이전, mutation, layout 세 조각으로 나뉘고, 그 뒤 브라우저 페인트가 일어난 다음 useEffect가 비동기로 실행된다. useLayoutEffect와 ref 연결은 페인트 전인 layout 단계에서 실행된다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>

  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- commit 단계 컨테이너 -->
  <rect x="40" y="24" width="800" height="364" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="64" y="63" font-size="20" font-weight="bold" fill="#1e3a8a">commit 단계</text>
  <rect x="196" y="42" width="196" height="30" rx="15" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="294" y="62" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">전 구간 동기, 중단 불가</text>

  <!-- 1. mutation 이전 -->
  <rect x="64" y="92" width="752" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="100" cy="128" r="17" fill="#1d4ed8"/>
  <text x="100" y="134" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="134" y="134" font-size="18" font-weight="bold" fill="#111827">mutation 이전</text>
  <text x="300" y="121" font-size="16" fill="#111827">변경 직전의 DOM 상태를 읽는다</text>
  <text x="300" y="147" font-size="15" fill="#4b5563">(예: 스크롤 위치 저장)</text>

  <line x1="100" y1="166" x2="100" y2="189" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 2. mutation -->
  <rect x="64" y="192" width="752" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="100" cy="228" r="17" fill="#1d4ed8"/>
  <text x="100" y="234" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="134" y="234" font-size="18" font-weight="bold" fill="#111827">mutation</text>
  <text x="300" y="221" font-size="16" fill="#111827">실제 DOM 삽입·수정·삭제</text>
  <text x="300" y="247" font-size="15" fill="#4b5563">이전 레이아웃 effect의 cleanup도 여기서 실행</text>

  <line x1="100" y1="266" x2="100" y2="289" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 3. layout -->
  <rect x="64" y="292" width="752" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="100" cy="328" r="17" fill="#1d4ed8"/>
  <text x="100" y="334" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="134" y="334" font-size="18" font-weight="bold" fill="#111827">layout</text>
  <text x="300" y="321" font-size="16" fill="#111827">DOM은 바뀌었지만 아직 화면에 안 그려진 시점</text>
  <text x="300" y="347" font-size="15" fill="#4b5563"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#111827">useLayoutEffect</tspan>, <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#111827">ref</tspan> 연결이 여기서 실행</text>

  <!-- commit 끝 → 페인트 -->
  <line x1="440" y1="390" x2="440" y2="416" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 브라우저 페인트 -->
  <rect x="40" y="420" width="800" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="64" y="456" font-size="18" font-weight="bold" fill="#92400e">브라우저 페인트</text>
  <text x="300" y="456" font-size="16" fill="#92400e">사용자가 처음 보는 시점</text>

  <!-- 페인트 → useEffect (비동기) -->
  <line x1="440" y1="482" x2="440" y2="512" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-purple)"/>

  <!-- useEffect -->
  <rect x="40" y="516" width="800" height="60" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="64" y="552" font-size="18" font-weight="bold" fill="#5b21b6" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">useEffect</text>
  <text x="300" y="552" font-size="16" fill="#5b21b6">비동기로 이후에 실행</text>
</svg>
