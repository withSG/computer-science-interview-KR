<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">고정 용량과 오토스케일링</title>
  <desc id="d">고정 용량은 피크에 맞춘 용량을 상시 유지해 수요가 낮은 시간의 차이가 낭비가 되고, 오토스케일링은 수요를 따라 용량이 움직입니다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- 패널 구분선 -->
  <line x1="450" y1="24" x2="450" y2="360" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ===== 왼쪽: 고정 용량 ===== -->
  <text x="224" y="42" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">고정 용량</text>

  <!-- 낭비 영역: 고정 용량선과 실제 수요 사이 -->
  <path d="M64,110 L384,110 L384,262 C340,262 318,258 292,222 C262,170 250,124 224,124 C200,124 190,170 160,220 C130,258 110,262 64,262 Z" fill="#fee2e2"/>
  <text x="112" y="196" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">낭비</text>

  <!-- 실제 수요 -->
  <path d="M64,262 C110,262 130,258 160,220 C190,170 200,124 224,124 C250,124 262,170 292,222 C318,258 340,262 384,262" fill="none" stroke="#374151" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="224" y="224" font-size="16" fill="#374151" text-anchor="middle">실제 수요</text>

  <!-- 고정 용량 -->
  <path d="M64,110 H384" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <!-- 축 -->
  <path d="M64,300 V86" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#ah-ink)"/>
  <path d="M64,300 H388" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#ah-ink)"/>
  <text x="64" y="74" font-size="15" fill="#374151" text-anchor="middle">용량</text>
  <text x="398" y="305" font-size="15" fill="#374151">시간</text>

  <text x="224" y="346" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">피크에 맞춰 상시 유지</text>

  <!-- ===== 오른쪽: 오토스케일링 ===== -->
  <text x="654" y="42" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">오토스케일링</text>

  <!-- 실제 수요 -->
  <path d="M494,262 C540,262 560,258 590,220 C620,170 630,124 654,124 C680,124 692,170 722,222 C748,258 770,262 814,262" fill="none" stroke="#374151" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="654" y="224" font-size="16" fill="#374151" text-anchor="middle">실제 수요</text>

  <!-- 수요를 따라 움직이는 용량 -->
  <path d="M494,248 C540,248 558,244 586,206 C614,158 628,110 654,110 C680,110 694,158 726,208 C752,244 770,248 814,248" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <!-- 축 -->
  <path d="M494,300 V86" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#ah-ink)"/>
  <path d="M494,300 H818" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#ah-ink)"/>
  <text x="494" y="74" font-size="15" fill="#374151" text-anchor="middle">용량</text>
  <text x="826" y="305" font-size="15" fill="#374151">시간</text>

  <text x="654" y="346" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">수요를 따라 용량이 움직임</text>

  <!-- 범례 -->
  <path d="M282,392 H318" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <text x="326" y="397" font-size="15" fill="#111827">용량</text>
  <path d="M392,392 H428" fill="none" stroke="#374151" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="436" y="397" font-size="15" fill="#111827">실제 수요</text>
  <rect x="536" y="383" width="24" height="18" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="568" y="397" font-size="15" fill="#111827">낭비</text>
</svg>
