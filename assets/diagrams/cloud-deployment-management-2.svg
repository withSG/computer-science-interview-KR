<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">롤링 업데이트 진행 순서</title>
  <desc id="d">replicas 4, maxSurge 1, maxUnavailable 0 조건에서 새 v2 Pod를 하나 추가하고, 그 Pod가 Ready가 되면 v1 Pod 하나를 종료하는 과정을 t0부터 t8까지 반복해 v2 네 개로 교체를 마친다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 설정값 -->
  <rect x="32" y="24" width="256" height="72" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">replicas: 4</text>
  <text x="160" y="80" font-size="15" fill="#374151" text-anchor="middle">목표 복제본 수</text>

  <rect x="312" y="24" width="256" height="72" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">maxSurge: 1</text>
  <text x="440" y="80" font-size="15" fill="#374151" text-anchor="middle">최대 5개까지 동시에 존재 가능</text>

  <rect x="592" y="24" width="256" height="72" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="720" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">maxUnavailable: 0</text>
  <text x="720" y="80" font-size="15" fill="#374151" text-anchor="middle">항상 4개는 Ready 유지</text>

  <!-- 범례 -->
  <rect x="110" y="120" width="44" height="28" rx="5" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="132" y="140" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <text x="164" y="140" font-size="15" fill="#374151">구버전</text>
  <rect x="250" y="120" width="44" height="28" rx="5" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="272" y="140" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <text x="304" y="140" font-size="15" fill="#374151">신버전</text>
  <rect x="390" y="120" width="56" height="28" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="418" y="140" font-size="14" fill="#4b5563" text-anchor="middle">종료</text>
  <text x="456" y="140" font-size="15" fill="#374151">방금 종료된 v1 자리</text>

  <!-- 시간 축 -->
  <text x="40" y="186" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">시간</text>
  <line x1="40" y1="198" x2="40" y2="546" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- t0 -->
  <text x="78" y="205" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">t0</text>
  <rect x="110" y="180" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="148" y="206" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="196" y="180" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="234" y="206" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="282" y="180" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="320" y="206" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="368" y="180" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="406" y="206" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>

  <!-- t1 -->
  <text x="78" y="259" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">t1</text>
  <rect x="110" y="234" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="148" y="260" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="196" y="234" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="234" y="260" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="282" y="234" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="320" y="260" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="368" y="234" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="406" y="260" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="454" y="234" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="492" y="260" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <text x="556" y="260" font-size="15" fill="#065f46" font-weight="bold">새 Pod 1개 추가 (총 5개)</text>

  <!-- t2 -->
  <text x="78" y="313" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">t2</text>
  <rect x="110" y="288" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="148" y="314" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="196" y="288" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="234" y="314" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="282" y="288" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="320" y="314" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="368" y="288" width="76" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="406" y="313" font-size="14" fill="#4b5563" text-anchor="middle">종료</text>
  <rect x="454" y="288" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="492" y="314" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <text x="556" y="314" font-size="15" fill="#374151" font-weight="bold">v2가 Ready 되면 v1 하나 종료</text>

  <!-- t3 -->
  <text x="78" y="367" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">t3</text>
  <rect x="110" y="342" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="148" y="368" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="196" y="342" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="234" y="368" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="282" y="342" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="320" y="368" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="368" y="342" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="406" y="368" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="454" y="342" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="492" y="368" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>

  <!-- t4 -->
  <text x="78" y="421" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">t4</text>
  <rect x="110" y="396" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="148" y="422" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="196" y="396" width="76" height="40" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="234" y="422" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">v1</text>
  <rect x="282" y="396" width="76" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="421" font-size="14" fill="#4b5563" text-anchor="middle">종료</text>
  <rect x="368" y="396" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="406" y="422" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="454" y="396" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="492" y="422" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>

  <!-- … -->
  <text x="78" y="470" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">…</text>
  <text x="320" y="470" font-size="15" fill="#374151" text-anchor="middle">t5 ~ t7도 같은 방식으로 한 개씩 교체</text>

  <!-- t8 -->
  <text x="78" y="515" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">t8</text>
  <rect x="110" y="490" width="76" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="148" y="515" font-size="14" fill="#4b5563" text-anchor="middle">종료</text>
  <rect x="196" y="490" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="234" y="516" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="282" y="490" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="320" y="516" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="368" y="490" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="406" y="516" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="454" y="490" width="76" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="492" y="516" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <text x="556" y="516" font-size="17" fill="#047857" font-weight="bold">완료</text>
</svg>
