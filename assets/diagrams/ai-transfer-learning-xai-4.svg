<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SHAP 기여도 폭포 차트</title>
  <desc id="d">기준값 0.20에서 출발해 연체이력 +0.31, 부채비율 +0.12, 소득 −0.06, 근속연수 −0.03을 차례로 더하면 합계 +0.34로 이 건의 예측값 0.54에 도달한다. 기여도의 합은 정확히 예측값 − 기준값과 같다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 상단: 기준값 → 이 건의 예측값 (축 위 위치에 맞춤) -->
  <text x="400" y="40" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">기준값(모든 예측의 평균)</text>
  <line x1="496" y1="35" x2="612" y2="35" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="672" y="40" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">이 건의 예측값</text>

  <!-- 열 머리 -->
  <text x="48" y="72" font-size="14" fill="#4b5563">특성</text>
  <text x="290" y="72" font-size="14" fill="#4b5563" text-anchor="end">기여도</text>

  <!-- 기준값·예측값 안내선 -->
  <line x1="400" y1="52" x2="400" y2="374" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="672" y1="52" x2="672" y2="374" stroke="#111827" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 행 0: 기준값 -->
  <text x="48" y="104" font-size="16" font-weight="bold" fill="#111827">기준값</text>
  <circle cx="400" cy="99" r="7" fill="#6b7280"/>
  <text x="416" y="104" font-size="16" font-weight="bold" fill="#374151">base = 0.20</text>

  <!-- 행 1: 연체이력 +0.31 (0.20 → 0.51) -->
  <text x="48" y="154" font-size="16" fill="#111827">연체이력</text>
  <text x="290" y="154" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="end">+0.31</text>
  <polygon points="400,136 640,136 648,149 640,162 400,162" fill="#dc2626"/>
  <line x1="648" y1="162" x2="648" y2="186" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 행 2: 부채비율 +0.12 (0.51 → 0.63) -->
  <text x="48" y="204" font-size="16" fill="#111827">부채비율</text>
  <text x="290" y="204" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="end">+0.12</text>
  <polygon points="648,186 736,186 744,199 736,212 648,212" fill="#dc2626"/>
  <line x1="744" y1="212" x2="744" y2="236" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 행 3: 소득 −0.06 (0.63 → 0.57) -->
  <text x="48" y="254" font-size="16" fill="#111827">소득</text>
  <text x="290" y="254" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="end">−0.06</text>
  <polygon points="744,236 704,236 696,249 704,262 744,262" fill="#2563eb"/>
  <line x1="696" y1="262" x2="696" y2="286" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 행 4: 근속연수 −0.03 (0.57 → 0.54) -->
  <text x="48" y="304" font-size="16" fill="#111827">근속연수</text>
  <text x="290" y="304" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="end">−0.03</text>
  <polygon points="696,286 680,286 672,299 680,312 696,312" fill="#2563eb"/>

  <!-- 구분선 -->
  <line x1="40" y1="328" x2="820" y2="328" stroke="#d1d5db" stroke-width="1"/>

  <!-- 행 5: 합계 +0.34 (0.20 → 0.54) -->
  <text x="48" y="358" font-size="16" font-weight="bold" fill="#111827">합계</text>
  <text x="290" y="358" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">+0.34</text>
  <polygon points="400,340 664,340 672,353 664,366 400,366" fill="#4b5563"/>
  <circle cx="672" cy="353" r="7" fill="#111827"/>
  <text x="688" y="358" font-size="16" font-weight="bold" fill="#111827">0.54</text>

  <!-- 값 축 -->
  <line x1="320" y1="384" x2="800" y2="384" stroke="#6b7280" stroke-width="1"/>
  <line x1="320" y1="384" x2="320" y2="390" stroke="#6b7280" stroke-width="1"/>
  <line x1="400" y1="384" x2="400" y2="390" stroke="#6b7280" stroke-width="1"/>
  <line x1="480" y1="384" x2="480" y2="390" stroke="#6b7280" stroke-width="1"/>
  <line x1="560" y1="384" x2="560" y2="390" stroke="#6b7280" stroke-width="1"/>
  <line x1="640" y1="384" x2="640" y2="390" stroke="#6b7280" stroke-width="1"/>
  <line x1="720" y1="384" x2="720" y2="390" stroke="#6b7280" stroke-width="1"/>
  <line x1="800" y1="384" x2="800" y2="390" stroke="#6b7280" stroke-width="1"/>
  <text x="320" y="408" font-size="14" fill="#4b5563" text-anchor="middle">0.1</text>
  <text x="400" y="408" font-size="14" fill="#4b5563" text-anchor="middle">0.2</text>
  <text x="480" y="408" font-size="14" fill="#4b5563" text-anchor="middle">0.3</text>
  <text x="560" y="408" font-size="14" fill="#4b5563" text-anchor="middle">0.4</text>
  <text x="640" y="408" font-size="14" fill="#4b5563" text-anchor="middle">0.5</text>
  <text x="720" y="408" font-size="14" fill="#4b5563" text-anchor="middle">0.6</text>
  <text x="800" y="408" font-size="14" fill="#4b5563" text-anchor="middle">0.7</text>
  <text x="290" y="408" font-size="14" fill="#4b5563" text-anchor="end">예측값</text>

  <!-- 범례 -->
  <polygon points="48,436 70,436 78,445 70,454 48,454" fill="#dc2626"/>
  <text x="88" y="451" font-size="15" fill="#111827">+ 예측값을 올리는 기여</text>
  <polygon points="330,436 308,436 300,445 308,454 330,454" fill="#2563eb"/>
  <text x="340" y="451" font-size="15" fill="#111827">− 예측값을 내리는 기여</text>
  <polygon points="560,436 582,436 590,445 582,454 560,454" fill="#4b5563"/>
  <text x="600" y="451" font-size="15" fill="#111827">합계 = 예측값 − 기준값</text>

  <!-- 결론 상자 -->
  <rect x="40" y="476" width="800" height="100" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="60" y="508" font-size="18" font-weight="bold" fill="#111827">최종 예측 = 0.20 + 0.34 = 0.54</text>
  <text x="60" y="536" font-size="15" fill="#111827">각 막대의 합이 정확히 (예측값 − 기준값)과 같다</text>
  <text x="60" y="562" font-size="15" font-weight="bold" fill="#047857">→ "이 사람이 평균보다 위험하다고 판정된 이유의 몫"을 숫자로 나눌 수 있다</text>
</svg>
