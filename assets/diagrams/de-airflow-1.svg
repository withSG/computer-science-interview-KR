<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Airflow DAG 예시: 순차 실행 후 병렬 적재</title>
  <desc id="d">Sensor인 wait_source가 소스 파일을 기다린 뒤 extract, transform, validate가 차례로 실행되고, validate 다음에 서로 의존하지 않는 load_mart와 load_cache가 병렬로 실행된다. validate가 실패하면 뒤따르는 적재(load_mart, load_cache)가 전부 멈춘다.</desc>
  <rect width="880" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 화살표의 뜻 -->
  <line x1="24" y1="34" x2="62" y2="34" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="74" y="39" font-size="15" fill="#374151">선후 관계 = 방향성(Directed)</text>
  <text x="320" y="39" font-size="15" fill="#374151">되돌아오는 화살표 없음 = 비순환(Acyclic)</text>

  <!-- 순차 구간 화살표 -->
  <line x1="156" y1="150" x2="190" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="306" y1="150" x2="340" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="456" y1="150" x2="490" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <!-- validate 다음 갈래 -->
  <path d="M646,150 H684 V85 H721" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M646,150 H684 V215 H721" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- wait_source : Sensor -->
  <rect x="24" y="121" width="130" height="58" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="89" y="145" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">wait_source</text>
  <text x="89" y="168" font-size="14" fill="#b45309" text-anchor="middle">Sensor (대기)</text>

  <!-- extract : Task -->
  <rect x="194" y="121" width="110" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="249" y="145" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">extract</text>
  <text x="249" y="168" font-size="14" fill="#1d4ed8" text-anchor="middle">Task (처리)</text>

  <!-- transform : Task -->
  <rect x="344" y="121" width="110" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="399" y="145" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">transform</text>
  <text x="399" y="168" font-size="14" fill="#1d4ed8" text-anchor="middle">Task (처리)</text>

  <!-- validate : Validation -->
  <rect x="494" y="121" width="150" height="58" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="569" y="145" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">validate</text>
  <text x="569" y="168" font-size="14" fill="#6d28d9" text-anchor="middle">Validation (검증)</text>

  <!-- load_mart : Load -->
  <rect x="726" y="56" width="130" height="58" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="791" y="80" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">load_mart</text>
  <text x="791" y="103" font-size="14" fill="#047857" text-anchor="middle">Load (적재)</text>

  <!-- load_cache : Load -->
  <rect x="726" y="186" width="130" height="58" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="791" y="210" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">load_cache</text>
  <text x="791" y="233" font-size="14" fill="#047857" text-anchor="middle">Load (적재)</text>

  <!-- 병렬 설명 (두 적재 사이) -->
  <text x="791" y="146" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">병렬 실행</text>
  <text x="791" y="166" font-size="14" fill="#374151" text-anchor="middle">서로 의존하지 않음</text>

  <!-- 노드 아래 설명 -->
  <text x="24" y="206" font-size="15" fill="#4b5563">소스 파일 도착까지 대기</text>
  <text x="569" y="206" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패하면 뒤 적재가 전부 멈춤</text>
  <text x="569" y="227" font-size="14" fill="#b91c1c" text-anchor="middle">(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">load_mart</tspan> · <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">load_cache</tspan>)</text>
</svg>
