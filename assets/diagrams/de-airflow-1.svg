<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">DAG — 방향성 비순환 그래프</title>
  <desc id="d">wait_source, extract, transform, validate 태스크가 순차적으로 실행되고, validate 이후 load_mart와 load_cache가 병렬로 실행되는 Airflow DAG 흐름도입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="230" fill="#ffffff"/>

  <!-- Legend -->
  <rect x="30" y="24" width="12" height="12" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="48" y="34.025" font-size="11.5" fill="#52606d">Sensor (대기)</text>
  
  <rect x="150" y="24" width="12" height="12" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="168" y="34.025" font-size="11.5" fill="#52606d">Task (처리)</text>
  
  <rect x="250" y="24" width="12" height="12" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="268" y="34.025" font-size="11.5" fill="#52606d">Validation (검증)</text>
  
  <rect x="370" y="24" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="388" y="34.025" font-size="11.5" fill="#52606d">Load (적재)</text>

  <!-- Arrows -->
  <path d="M142,80 L168,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M262,80 L288,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M392,80 L418,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M522,80 L548,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M470,102 L470,165 L548,165" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Nodes -->
  <!-- wait_source -->
  <rect x="30" y="58" width="112" height="44" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="86" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">wait_source</text>

  <!-- extract -->
  <rect x="168" y="58" width="94" height="44" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="215" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">extract</text>

  <!-- transform -->
  <rect x="288" y="58" width="104" height="44" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">transform</text>

  <!-- validate -->
  <rect x="418" y="58" width="104" height="44" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">validate</text>

  <!-- load_mart -->
  <rect x="548" y="58" width="104" height="44" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">load_mart</text>

  <!-- load_cache -->
  <rect x="548" y="143" width="104" height="44" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="169.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">load_cache</text>
</svg>