<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Redux 단방향 데이터 흐름</title>
  <desc id="d">Action이 dispatch로 Reducer(순수함수)에 전달되고, Reducer가 만든 새 state가 Store에 들어가며, View(컴포넌트)는 Store를 구독하고 다시 Action을 만든다. 상태를 바꾸는 유일한 통로가 dispatch이므로 누가 바꿨는지는 액션 로그로 알 수 있다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>

  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Store 에서 바깥으로 돌아 Action 으로 들어가는 선 -->
  <path d="M740,302 L800,302 L800,44 L84,44 L84,122 L135,122" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#m-ink)"/>

  <!-- Action → Reducer : dispatch -->
  <line x1="320" y1="122" x2="555" y2="122" stroke="#1d4ed8" stroke-width="3" marker-end="url(#m-blue)"/>
  <text x="438" y="108" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">dispatch</text>
  <text x="438" y="147" font-size="14" fill="#1d4ed8" text-anchor="middle">상태 변경의 유일한 통로</text>

  <!-- Reducer → Store : 새 state -->
  <line x1="650" y1="160" x2="650" y2="259" stroke="#475569" stroke-width="2" marker-end="url(#m-ink)"/>
  <text x="664" y="215" font-size="15" fill="#374151">새 state</text>

  <!-- Store → View : 구독 -->
  <line x1="560" y1="302" x2="325" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#m-ink)"/>
  <text x="440" y="290" font-size="15" fill="#374151" text-anchor="middle">구독</text>

  <!-- View → Action -->
  <line x1="230" y1="264" x2="230" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#m-ink)"/>

  <!-- 노드: Action -->
  <rect x="140" y="84" width="180" height="76" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="128" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Action</text>

  <!-- 노드: Reducer (순수함수) -->
  <rect x="560" y="84" width="180" height="76" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="650" y="116" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Reducer</text>
  <text x="650" y="141" font-size="15" fill="#4b5563" text-anchor="middle">(순수함수)</text>

  <!-- 노드: Store -->
  <rect x="560" y="264" width="180" height="76" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="650" y="308" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Store</text>

  <!-- 노드: View (컴포넌트) -->
  <rect x="140" y="264" width="180" height="76" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="296" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">View</text>
  <text x="230" y="321" font-size="15" fill="#4b5563" text-anchor="middle">(컴포넌트)</text>

  <!-- 요점 -->
  <rect x="24" y="380" width="832" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="48" y="411" font-size="16" fill="#1f2937">상태를 바꾸는 유일한 통로는 <tspan font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">dispatch</tspan> 하나다.</text>
  <text x="48" y="438" font-size="16" fill="#1f2937">그래서 "누가 바꿨나"는 액션 로그만 보면 답이 나온다.</text>
</svg>
