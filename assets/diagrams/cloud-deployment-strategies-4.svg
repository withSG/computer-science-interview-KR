<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Canary 배포 흐름</title>
  <desc id="d">LB가 가중치 라우팅으로 트래픽의 95%를 Stable(v1 네 대), 5%를 Canary(v2 한 대)로 보낸다. 카나리의 에러율, p95 지연, 비즈니스 지표를 사람 또는 자동 분석으로 관찰해 정상이면 25%, 50%, 100%로 넓히고, 이상이면 즉시 0%로 되돌린다. 이때 영향받은 사용자는 5%다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- LB -->
  <rect x="24" y="44" width="150" height="148" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="99" y="112" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">LB</text>
  <text x="99" y="138" font-size="15" fill="#374151" text-anchor="middle">가중치 라우팅</text>

  <!-- 95% → Stable -->
  <line x1="174" y1="80" x2="338" y2="80" stroke="#2563eb" stroke-width="7" marker-end="url(#m-blue)"/>
  <text x="260" y="64" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">95%</text>

  <!-- 5% → Canary -->
  <line x1="174" y1="150" x2="344" y2="150" stroke="#d97706" stroke-width="2.5" marker-end="url(#m-amber)"/>
  <text x="260" y="138" font-size="20" font-weight="bold" fill="#b45309" text-anchor="middle">5%</text>

  <!-- Stable: v1 x4 -->
  <rect x="356" y="55" width="70" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="391" y="86" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="436" y="55" width="70" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="471" y="86" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="516" y="55" width="70" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="551" y="86" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="596" y="55" width="70" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="631" y="86" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <text x="686" y="87" font-size="20" font-weight="bold" fill="#1d4ed8">Stable</text>

  <!-- Canary: v2 x1 -->
  <rect x="356" y="125" width="70" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="391" y="156" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">v2</text>
  <text x="446" y="157" font-size="20" font-weight="bold" fill="#b45309">Canary</text>

  <!-- 관찰 -->
  <line x1="391" y1="175" x2="391" y2="222" stroke="#374151" stroke-width="2" marker-end="url(#m-ink)"/>
  <rect x="196" y="226" width="390" height="58" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="391" y="261" font-size="16" fill="#111827" text-anchor="middle">에러율 / p95 지연 / 비즈니스 지표 관찰</text>

  <line x1="642" y1="255" x2="594" y2="255" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m-gray)"/>
  <text x="652" y="260" font-size="15" fill="#4b5563">사람 또는 자동 분석</text>

  <!-- 분기 -->
  <line x1="391" y1="284" x2="391" y2="316" stroke="#374151" stroke-width="2"/>
  <line x1="200" y1="316" x2="600" y2="316" stroke="#374151" stroke-width="2"/>
  <line x1="200" y1="315" x2="200" y2="368" stroke="#059669" stroke-width="2" marker-end="url(#m-green)"/>
  <line x1="600" y1="315" x2="600" y2="368" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
  <text x="212" y="350" font-size="16" font-weight="bold" fill="#047857">정상</text>
  <text x="612" y="350" font-size="16" font-weight="bold" fill="#b91c1c">이상</text>

  <!-- 정상: 25% ▶ 50% ▶ 100% -->
  <rect x="40" y="374" width="320" height="76" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="52" y="390" width="72" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="88" y="419" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">25%</text>
  <line x1="126" y1="412" x2="160" y2="412" stroke="#059669" stroke-width="2" marker-end="url(#m-green)"/>
  <rect x="164" y="390" width="72" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="419" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">50%</text>
  <line x1="238" y1="412" x2="272" y2="412" stroke="#059669" stroke-width="2" marker-end="url(#m-green)"/>
  <rect x="276" y="390" width="72" height="44" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="312" y="419" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">100%</text>

  <!-- 이상: 즉시 0% -->
  <rect x="450" y="374" width="300" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="405" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">즉시 0%로 되돌림</text>
  <text x="600" y="432" font-size="15" fill="#b91c1c" text-anchor="middle">(영향받은 사용자는 5%)</text>
</svg>
