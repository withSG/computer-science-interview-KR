<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Canary 배포 전략 다이어그램</title>
  <desc id="d">가중치 라우팅을 통해 Stable과 Canary로 트래픽을 분산하고 지표를 관찰하여 롤아웃 또는 롤백하는 Canary 배포 흐름도</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- LB (가중치 라우팅) -->
  <rect x="230" y="30" width="180" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="320" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">LB (가중치 라우팅)</text>

  <!-- LB 분기선 -->
  <!-- 95% -> Stable -->
  <path d="M 230 50 L 150 50 L 150 115 L 210 115" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="130" y="72.5" width="40" height="20" rx="3" fill="#ffffff"/>
  <text x="150" y="86.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">95%</text>

  <!-- 5% -> Canary -->
  <path d="M 410 50 L 490 50 L 490 115 L 430 115" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="470" y="72.5" width="40" height="20" rx="3" fill="#ffffff"/>
  <text x="490" y="86.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">5%</text>

  <!-- Stable 그룹 [v1][v1][v1][v1] -->
  <g transform="translate(220, 95)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="20" y="24" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">[v1]</text>

    <rect x="46" y="0" width="40" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="66" y="24" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">[v1]</text>

    <rect x="92" y="0" width="40" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="112" y="24" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">[v1]</text>

    <rect x="138" y="0" width="40" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="158" y="24" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">[v1]</text>
  </g>
  <text x="415" y="120" font-size="14" font-weight="bold" fill="#2563eb">Stable</text>

  <!-- Canary 그룹 [v2] -->
  <g transform="translate(380, 95)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="20" y="24" text-anchor="middle" font-size="13" fill="#d97706" font-weight="bold">[v2]</text>
  </g>
  <text x="535" y="120" font-size="14" font-weight="bold" fill="#d97706">Canary</text>

  <!-- Canary에서 관측 박스로 화살표 -->
  <path d="M 400 135 L 400 195" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 관측 박스 -->
  <rect x="250" y="195" width="300" height="75" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="270" y="222" font-size="13" fill="#1f2933">에러율 / p95 지연 /</text>
  <text x="270" y="247" font-size="13" fill="#1f2933">비즈니스 지표 관찰</text>

  <!-- 주석: 사람 또는 자동 분석 -->
  <path d="M 550 232.5 L 590 232.5" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-ink)"/>
  <text x="600" y="236.5" font-size="13" fill="#52606d">← 사람 또는 자동 분석</text>

  <!-- 관측 박스 하단 분기선 -->
  <path d="M 400 270 L 400 320" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M 230 320 L 570 320" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- 정상 분기 (좌) -->
  <path d="M 230 320 L 230 365" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="180" y="307.5" width="36" height="20" rx="3" fill="#ffffff"/>
  <text x="198" y="321.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">정상</text>

  <!-- 이상 분기 (우) -->
  <path d="M 570 320 L 570 365" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="584" y="307.5" width="36" height="20" rx="3" fill="#ffffff"/>
  <text x="602" y="321.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">이상</text>

  <!-- 정상 결과: 25% ▶ 50% ▶ 100% -->
  <rect x="120" y="365" width="220" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="230" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">25% ▶ 50% ▶ 100%</text>

  <!-- 이상 결과: 즉시 0%로 되돌림 (영향받은 사용자는 5%) -->
  <rect x="460" y="365" width="220" height="65" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="570" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">즉시 0%로 되돌림</text>
  <text x="570" y="414" text-anchor="middle" font-size="12" fill="#dc2626">(영향받은 사용자는 5%)</text>
</svg>