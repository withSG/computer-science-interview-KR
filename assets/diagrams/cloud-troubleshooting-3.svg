<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Probe 세 종류 비교</title>
  <desc id="d">startup, readiness, liveness probe가 각각 묻는 것, 실패했을 때의 동작, 용도를 한 표로 비교합니다. readiness만 실패해도 컨테이너를 죽이지 않고 엔드포인트에서 제외됩니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- 표 틀 -->
  <rect x="24" y="24" width="832" height="40" fill="#f1f5f9"/>
  <rect x="24" y="24" width="832" height="324" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="24" y1="64" x2="856" y2="64" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="24" y1="172" x2="856" y2="172" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="260" x2="856" y2="260" stroke="#d1d5db" stroke-width="1"/>
  <line x1="254" y1="24" x2="254" y2="348" stroke="#d1d5db" stroke-width="1"/>
  <line x1="604" y1="24" x2="604" y2="348" stroke="#d1d5db" stroke-width="1"/>

  <!-- 머리행 -->
  <text x="40" y="50" font-size="15" font-weight="bold" fill="#374151">Probe · 묻는 것</text>
  <text x="270" y="50" font-size="15" font-weight="bold" fill="#374151">동작</text>
  <text x="620" y="50" font-size="15" font-weight="bold" fill="#374151">용도</text>

  <!-- startup -->
  <text x="40" y="106" font-size="18" font-weight="bold" fill="#1d4ed8">startup probe</text>
  <text x="40" y="134" font-size="15" fill="#374151">“아직 부팅 중인가?”</text>
  <text x="270" y="98" font-size="15" fill="#111827">•</text>
  <text x="286" y="98" font-size="15" fill="#111827">성공할 때까지 liveness/readiness를</text>
  <text x="286" y="122" font-size="15" fill="#111827">아예 시작하지 않는다</text>
  <text x="270" y="150" font-size="15" fill="#111827">•</text>
  <text x="286" y="150" font-size="15" fill="#111827">실패가 임계치를 넘으면 컨테이너를 <tspan font-weight="bold" fill="#b91c1c">죽인다</tspan></text>
  <text x="620" y="112" font-size="15" fill="#111827">기동이 오래 걸리는 앱을</text>
  <text x="620" y="136" font-size="15" fill="#111827">위한 유예 장치</text>

  <!-- readiness -->
  <text x="40" y="208" font-size="18" font-weight="bold" fill="#047857">readiness probe</text>
  <text x="40" y="236" font-size="15" fill="#374151">“지금 트래픽을 받아도 되나?”</text>
  <text x="270" y="209" font-size="15" fill="#111827">•</text>
  <text x="286" y="209" font-size="15" fill="#111827">실패해도 컨테이너를 <tspan font-weight="bold" fill="#047857">죽이지 않는다</tspan></text>
  <text x="270" y="235" font-size="15" fill="#111827">•</text>
  <text x="286" y="235" font-size="15" fill="#111827">Service의 엔드포인트 목록에서 제외될 뿐</text>
  <text x="620" y="209" font-size="15" fill="#111827">일시적 과부하나</text>
  <text x="620" y="233" font-size="15" fill="#111827">의존성 지연에 대응</text>

  <!-- liveness -->
  <text x="40" y="296" font-size="18" font-weight="bold" fill="#b45309">liveness probe</text>
  <text x="40" y="324" font-size="15" fill="#374151">“이 컨테이너는 회생 불가인가?”</text>
  <text x="270" y="297" font-size="15" fill="#111827">•</text>
  <text x="286" y="297" font-size="15" fill="#111827">실패가 임계치를 넘으면</text>
  <text x="286" y="321" font-size="15" fill="#111827">컨테이너를 <tspan font-weight="bold" fill="#b91c1c">재시작한다</tspan></text>
  <text x="620" y="297" font-size="15" fill="#111827">데드락처럼 프로세스는</text>
  <text x="620" y="321" font-size="15" fill="#111827">살아 있으나 응답 불능일 때만</text>
</svg>
