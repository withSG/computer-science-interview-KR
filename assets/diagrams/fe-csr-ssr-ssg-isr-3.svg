<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ISR (Incremental Static Regeneration)</title>
  <desc id="d">revalidate = 60 인 페이지에서의 시간 경과(t=0s, 30s, 75s, 76s, 80s)에 따른 사용자 요청 처리 및 백그라운드 재생성 흐름 다이어그램</desc>
  
  <defs>
    <!-- Arrow heads -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Top Title / Configuration Card -->
  <rect x="24" y="24" width="832" height="44" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="51" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">revalidate = 60 인 페이지</text>

  <!-- Timeline vertical axis line -->
  <line x1="100" y1="90" x2="100" y2="500" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Timeline node 1: t=0s -->
  <circle cx="100" cy="115" r="6" fill="#059669"/>
  <rect x="34" y="100" width="52" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="60" y="119" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">t=0s</text>

  <!-- Row t=0s elements -->
  <rect x="115" y="98" width="90" height="34" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="160" y="119" font-size="13" fill="#1f2933" text-anchor="middle">사용자 A</text>

  <line x1="205" y1="115" x2="230" y2="115" stroke="#52606d" stroke-width="1.5"/>

  <rect x="230" y="98" width="230" height="34" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="345" y="119" font-size="13" fill="#1f2933" text-anchor="middle">캐시 HTML, 생성된 지 0초</text>

  <path d="M460,115 L580,115" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="520" y="107" font-size="11.5" fill="#059669" text-anchor="middle">즉시 응답</text>

  <rect x="590" y="98" width="80" height="34" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="630" y="119" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">[FRESH]</text>


  <!-- Timeline node 2: t=30s -->
  <circle cx="100" cy="180" r="6" fill="#059669"/>
  <rect x="34" y="165" width="52" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="60" y="184" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">t=30s</text>

  <!-- Row t=30s elements -->
  <rect x="115" y="163" width="90" height="34" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="160" y="184" font-size="13" fill="#1f2933" text-anchor="middle">사용자 B</text>

  <line x1="205" y1="180" x2="230" y2="180" stroke="#52606d" stroke-width="1.5"/>

  <rect x="230" y="163" width="230" height="34" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="345" y="184" font-size="13" fill="#1f2933" text-anchor="middle">30초 &lt; 60초, 아직 신선</text>

  <path d="M460,180 L580,180" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="520" y="172" font-size="11.5" fill="#059669" text-anchor="middle">즉시 응답</text>

  <rect x="590" y="163" width="80" height="34" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="630" y="184" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">[FRESH]</text>


  <!-- Timeline node 3: t=75s -->
  <circle cx="100" cy="275" r="6" fill="#d97706"/>
  <rect x="34" y="260" width="52" height="30" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="60" y="279" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">t=75s</text>

  <!-- Row t=75s elements -->
  <rect x="115" y="258" width="90" height="34" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="160" y="279" font-size="13" fill="#1f2933" text-anchor="middle">사용자 C</text>

  <line x1="205" y1="275" x2="230" y2="275" stroke="#52606d" stroke-width="1.5"/>

  <rect x="230" y="258" width="230" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="345" y="279" font-size="13" fill="#d97706" text-anchor="middle">75초 &gt; 60초, 만료됨</text>

  <!-- Branching tree lines for t=75s -->
  <!-- Top branch (STALE response) -->
  <path d="M460,275 L485,275 L485,245 L505,245" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
  <text x="595" y="249" font-size="13" fill="#1f2933">일단 오래된 HTML 즉시 응답</text>

  <rect x="765" y="228" width="80" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="805" y="249" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[STALE]</text>

  <!-- Bottom branch (Background Regeneration) -->
  <path d="M460,275 L485,275 L485,305 L505,305" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="510" y="288" width="245" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="632" y="309" font-size="13" fill="#7c3aed" text-anchor="middle">동시에 백그라운드 재생성 시작</text>
  
  <text x="632" y="337" font-size="11.5" fill="#52606d" text-anchor="middle">(C는 기다리지 않는다)</text>


  <!-- Timeline node 4: t=76s -->
  <circle cx="100" cy="390" r="6" fill="#7c3aed"/>
  <rect x="34" y="375" width="52" height="30" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="60" y="394" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">t=76s</text>

  <!-- Row t=76s elements -->
  <rect x="115" y="373" width="115" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="172" y="394" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">재생성 완료</text>

  <path d="M230,390 L275,390" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="280" y="373" width="105" height="34" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="332" y="394" font-size="13" fill="#1f2933" text-anchor="middle">캐시 교체</text>


  <!-- Timeline node 5: t=80s -->
  <circle cx="100" cy="470" r="6" fill="#059669"/>
  <rect x="34" y="455" width="52" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="60" y="474" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">t=80s</text>

  <!-- Row t=80s elements -->
  <rect x="115" y="453" width="90" height="34" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="160" y="474" font-size="13" fill="#1f2933" text-anchor="middle">사용자 D</text>

  <line x1="205" y1="470" x2="230" y2="470" stroke="#52606d" stroke-width="1.5"/>

  <rect x="230" y="453" width="230" height="34" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="345" y="474" font-size="13" fill="#1f2933" text-anchor="middle">새로 만들어진 HTML</text>

  <path d="M460,470 L580,470" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="520" y="462" font-size="11.5" fill="#059669" text-anchor="middle">즉시 응답</text>

  <rect x="590" y="453" width="80" height="34" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="630" y="474" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">[FRESH]</text>

</svg>