<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ISR 재검증 타임라인</title>
  <desc id="d">revalidate = 60인 페이지에서 시간에 따라 요청이 어떻게 처리되는지 보여준다. 0초와 30초의 요청은 신선한 캐시로 즉시 응답하고, 75초의 사용자 C는 만료된 HTML을 즉시 받으며 동시에 백그라운드 재생성이 시작된다. 76초에 재생성이 끝나 캐시가 교체되고 80초의 사용자 D는 새 HTML을 즉시 받는다.</desc>
  <rect width="880" height="650" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="24" y="44" font-size="18" font-weight="700" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">revalidate = 60</tspan> 인 페이지</text>

  <!-- 열 머리 -->
  <text x="84" y="84" font-size="15" font-weight="700" text-anchor="end" fill="#4b5563">시각</text>
  <text x="124" y="84" font-size="15" font-weight="700" fill="#4b5563">요청과 캐시 판정</text>
  <text x="656" y="84" font-size="15" font-weight="700" fill="#4b5563">응답</text>
  <line x1="24" y1="96" x2="856" y2="96" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- 캐시 상태 세로 막대 -->
  <rect x="96" y="112" width="8" height="138" fill="#10b981"/>
  <rect x="96" y="250" width="8" height="240" fill="#f59e0b"/>
  <rect x="96" y="490" width="8" height="86" fill="#10b981"/>

  <!-- t=0s 사용자 A -->
  <text x="84" y="138" font-size="16" font-weight="700" text-anchor="end" fill="#111827">t=0s</text>
  <circle cx="100" cy="132" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <rect x="124" y="114" width="90" height="36" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="169" y="137" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">사용자 A</text>
  <text x="232" y="137" font-size="15" fill="#1f2937">캐시 HTML, 생성된 지 0초</text>
  <line x1="596" y1="132" x2="644" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="656" y="137" font-size="15" font-weight="700" fill="#111827">즉시 응답</text>
  <rect x="740" y="117" width="88" height="30" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="784" y="137" font-size="15" font-weight="700" text-anchor="middle" fill="#047857">FRESH</text>

  <!-- t=30s 사용자 B -->
  <text x="84" y="202" font-size="16" font-weight="700" text-anchor="end" fill="#111827">t=30s</text>
  <circle cx="100" cy="196" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <rect x="124" y="178" width="90" height="36" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="169" y="201" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">사용자 B</text>
  <text x="232" y="201" font-size="15" fill="#1f2937">30초 &lt; 60초, 아직 신선</text>
  <line x1="596" y1="196" x2="644" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="656" y="201" font-size="15" font-weight="700" fill="#111827">즉시 응답</text>
  <rect x="740" y="181" width="88" height="30" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="784" y="201" font-size="15" font-weight="700" text-anchor="middle" fill="#047857">FRESH</text>

  <!-- t=60s 만료 기준 -->
  <text x="84" y="256" font-size="16" font-weight="700" text-anchor="end" fill="#b45309">t=60s</text>
  <circle cx="100" cy="250" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <rect x="124" y="234" width="424" height="32" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="140" y="255" font-size="15" fill="#92400e">60초 경과 — 자동 재생성 없음, 다음 요청이 와야 시작</text>
  <line x1="556" y1="250" x2="856" y2="250" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- t=75s 사용자 C -->
  <text x="84" y="324" font-size="16" font-weight="700" text-anchor="end" fill="#111827">t=75s</text>
  <circle cx="100" cy="318" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <rect x="124" y="300" width="90" height="36" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="169" y="323" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">사용자 C</text>
  <text x="232" y="323" font-size="15" font-weight="700" fill="#b91c1c">75초 &gt; 60초, 만료됨</text>

  <path d="M169 336 V424" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="169" y1="372" x2="222" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="169" y1="424" x2="222" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <text x="232" y="377" font-size="15" fill="#1f2937">일단 오래된 HTML</text>
  <line x1="596" y1="372" x2="644" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="656" y="377" font-size="15" font-weight="700" fill="#111827">즉시 응답</text>
  <rect x="740" y="357" width="88" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="784" y="377" font-size="15" font-weight="700" text-anchor="middle" fill="#b45309">STALE</text>

  <rect x="232" y="398" width="320" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="248" y="420" font-size="15" font-weight="700" fill="#1e3a8a">동시에 백그라운드 재생성 시작</text>
  <text x="248" y="442" font-size="15" fill="#374151">(C는 기다리지 않는다)</text>

  <line x1="300" y1="452" x2="300" y2="468" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- t=76s 재생성 완료 -->
  <text x="84" y="496" font-size="16" font-weight="700" text-anchor="end" fill="#047857">t=76s</text>
  <circle cx="100" cy="490" r="7" fill="#ffffff" stroke="#047857" stroke-width="2.5"/>
  <rect x="232" y="472" width="136" height="36" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="300" y="495" font-size="15" font-weight="700" text-anchor="middle" fill="#065f46">재생성 완료</text>
  <line x1="372" y1="490" x2="404" y2="490" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="408" y="472" width="112" height="36" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="464" y="495" font-size="15" font-weight="700" text-anchor="middle" fill="#065f46">캐시 교체</text>

  <!-- t=80s 사용자 D -->
  <text x="84" y="562" font-size="16" font-weight="700" text-anchor="end" fill="#111827">t=80s</text>
  <circle cx="100" cy="556" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <rect x="124" y="538" width="90" height="36" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="169" y="561" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">사용자 D</text>
  <text x="232" y="561" font-size="15" fill="#1f2937">새로 만들어진 HTML</text>
  <line x1="596" y1="556" x2="644" y2="556" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="656" y="561" font-size="15" font-weight="700" fill="#111827">즉시 응답</text>
  <rect x="740" y="541" width="88" height="30" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="784" y="561" font-size="15" font-weight="700" text-anchor="middle" fill="#047857">FRESH</text>

  <!-- 범례 -->
  <line x1="24" y1="596" x2="856" y2="596" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="24" y="612" width="8" height="22" fill="#10b981"/>
  <text x="42" y="628" font-size="15" fill="#1f2937">막대 초록: 캐시가 신선한 구간 (FRESH)</text>
  <rect x="340" y="612" width="8" height="22" fill="#f59e0b"/>
  <text x="358" y="628" font-size="15" fill="#1f2937">막대 주황: 만료 후 재생성 완료 전, 오래된 HTML (STALE)</text>
</svg>
