<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IAM의 네 가지 구성 요소</title>
  <desc id="d">AWS 계정 내의 신원(User, Group, Role)과 권한(Policy) 간의 관계를 나타낸 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 바운더리: AWS 계정 -->
  <rect x="24" y="24" width="832" height="452" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="440" y="56" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">AWS 계정</text>

  <!-- 세션 영역: 신원 (Identity) -->
  <rect x="44" y="74" width="460" height="382" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="64" y="100" fill="#2563eb" font-size="14" font-weight="bold">[ 신원(Identity) ]</text>

  <!-- 세션 영역: 권한 (Permission) -->
  <rect x="524" y="74" width="312" height="382" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="544" y="100" fill="#059669" font-size="14" font-weight="bold">[ 권한(Permission) ]</text>

  <!-- 1. User 박스 -->
  <rect x="64" y="130" width="130" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="129" y="160" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">User</text>
  <text x="129" y="180" fill="#52606d" font-size="11.5" text-anchor="middle">(사람)</text>

  <!-- 2. Group 박스 -->
  <rect x="244" y="130" width="130" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="309" y="160" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Group</text>
  <text x="309" y="180" fill="#52606d" font-size="11.5" text-anchor="middle">(묶음)</text>

  <!-- 3. Role 박스 -->
  <rect x="64" y="250" width="130" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="129" y="280" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Role</text>
  <text x="129" y="300" fill="#52606d" font-size="11.5" text-anchor="middle">(역할)</text>

  <!-- 4. Policy 박스 -->
  <rect x="554" y="130" width="250" height="200" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="679" y="160" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Policy</text>
  <text x="679" y="180" fill="#52606d" font-size="11.5" text-anchor="middle">(JSON 문서)</text>
  <text x="580" y="215" fill="#1f2933" font-size="13">Effect</text>
  <text x="580" y="240" fill="#1f2933" font-size="13">Action</text>
  <text x="580" y="265" fill="#1f2933" font-size="13">Resource</text>
  <text x="580" y="290" fill="#1f2933" font-size="13">Condition</text>

  <!-- 연결선: User -> Group -->
  <path d="M194,165 L244,165" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 연결선 계통: (User, Group, Role) -> Policy -->
  <!-- User/Group/Role 3곳에서 나오는 합선 및 Policy 연결 -->
  <path d="M374,165 L430,165" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M129,200 L129,220 L430,220" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M194,285 L430,285" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- 세 라인의 수직 연결선 및 Policy로 들어가는 수평 화살표 -->
  <path d="M430,165 L430,285" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M430,230 L554,230" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Role 아래 신뢰 정책 및 수직 화살표 -->
  <path d="M129,320 L129,360" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="145" y="345" fill="#7c3aed" font-size="11.5">누가 맡을 수 있나 = 신뢰 정책(Trust Policy)</text>

  <!-- 대상 서비스 목록 -->
  <rect x="64" y="380" width="420" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="274" y="404" fill="#1f2933" font-size="13" text-anchor="middle">EC2 / Lambda / ECS Task / 다른 계정 / 외부 IdP</text>
</svg>