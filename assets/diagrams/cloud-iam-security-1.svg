<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IAM의 네 가지 구성 요소</title>
  <desc id="d">AWS 계정 안에서 신원(User, Group, Role)이 모두 권한(Policy, JSON 문서)과 연결되고, User는 Group에 묶이며, Role은 신뢰 정책으로 EC2, Lambda, ECS Task, 다른 계정, 외부 IdP 중 누가 맡을 수 있는지 정한다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- AWS 계정 -->
  <rect x="24" y="24" width="832" height="462" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="48" y="54" font-size="18" font-weight="bold" fill="#1f2937">AWS 계정</text>

  <!-- 신원 영역 -->
  <rect x="48" y="70" width="512" height="392" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="72" y="100" font-size="17" font-weight="bold" fill="#1d4ed8">신원(Identity)</text>

  <!-- 권한 영역 -->
  <rect x="584" y="70" width="248" height="392" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="608" y="100" font-size="17" font-weight="bold" fill="#047857">권한(Permission)</text>

  <!-- 연결선: User·Group·Role → Policy -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M436,156 H520"/>
    <path d="M142,192 V224 H520"/>
    <path d="M212,292 H520"/>
    <path d="M520,156 V292"/>
    <path d="M520,224 H604" marker-end="url(#ah-ink)"/>
    <path d="M212,156 H292" marker-end="url(#ah-ink)"/>
  </g>
  <circle cx="520" cy="224" r="4" fill="#374151"/>

  <!-- User -->
  <rect x="72" y="120" width="140" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="142" y="151" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">User</text>
  <text x="142" y="176" font-size="15" fill="#374151" text-anchor="middle">(사람)</text>

  <!-- Group -->
  <rect x="296" y="120" width="140" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="366" y="151" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Group</text>
  <text x="366" y="176" font-size="15" fill="#374151" text-anchor="middle">(묶음)</text>

  <!-- Role -->
  <rect x="72" y="256" width="140" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="142" y="287" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Role</text>
  <text x="142" y="312" font-size="15" fill="#374151" text-anchor="middle">(역할)</text>

  <!-- Policy -->
  <rect x="608" y="120" width="200" height="208" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="708" y="151" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Policy</text>
  <text x="708" y="176" font-size="15" fill="#374151" text-anchor="middle">(JSON 문서)</text>
  <line x1="628" y1="192" x2="788" y2="192" stroke="#6ee7b7" stroke-width="1.5"/>
  <g font-size="16" fill="#065f46" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="640" y="220">Effect</text>
    <text x="640" y="246">Action</text>
    <text x="640" y="272">Resource</text>
    <text x="640" y="298">Condition</text>
  </g>

  <!-- Role의 신뢰 정책 -->
  <path d="M142,328 V386" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ah-purple)"/>
  <text x="160" y="364" font-size="15" fill="#6d28d9">누가 맡을 수 있나 = <tspan font-weight="bold">신뢰 정책(Trust Policy)</tspan></text>
  <rect x="72" y="392" width="448" height="46" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="296" y="421" font-size="16" fill="#111827" text-anchor="middle">EC2 / Lambda / ECS Task / 다른 계정 / 외부 IdP</text>
</svg>
