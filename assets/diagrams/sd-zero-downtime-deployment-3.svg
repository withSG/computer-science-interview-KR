<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">keep-alive 커넥션 경쟁</title>
  <desc id="d">서버 keep-alive 타임아웃(5초)이 로드 밸런서 유휴 타임아웃(60초)보다 짧아, t=5.000에 서버가 FIN을 보내는 순간 t=5.001에 LB가 같은 연결로 새 요청을 보내고, 서버가 RST로 응답해 클라이언트는 ECONNRESET이나 502를 받는 과정.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 타임아웃 비교 (길이 비례) -->
  <text x="24" y="51" font-size="15" font-weight="bold" fill="#1f2937">서버 keep-alive 타임아웃</text>
  <rect x="250" y="34" width="48" height="24" rx="3" fill="#2563eb"/>
  <text x="310" y="51" font-size="15" fill="#1f2937"><tspan font-weight="bold" fill="#1d4ed8">5초</tspan>  — 더 짧다 → 서버가 먼저 연결을 닫는다</text>
  <text x="24" y="91" font-size="15" font-weight="bold" fill="#1f2937">로드 밸런서 유휴 타임아웃</text>
  <rect x="250" y="74" width="576" height="24" rx="3" fill="#4b5563"/>
  <text x="814" y="91" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="end">60초</text>

  <!-- 참여자 -->
  <rect x="316" y="130" width="128" height="36" rx="6" fill="#1f2937"/>
  <text x="380" y="154" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">로드 밸런서</text>
  <rect x="536" y="130" width="128" height="36" rx="6" fill="#1f2937"/>
  <text x="600" y="154" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">서버</text>
  <line x1="380" y1="166" x2="380" y2="536" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="600" y1="166" x2="600" y2="536" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- t=0 -->
  <text x="24" y="211" font-size="15" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">t=0</text>
  <rect x="392" y="188" width="196" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="490" y="210" font-size="15" fill="#1f2937" text-anchor="middle">요청 처리 완료. 연결 유지.</text>
  <text x="38" y="250" font-size="18" font-weight="bold" fill="#4b5563" text-anchor="middle">⋮</text>

  <!-- t=5.000 서버 FIN -->
  <text x="24" y="285" font-size="15" font-weight="bold" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">t=5.000</text>
  <line x1="600" y1="280" x2="384" y2="351" stroke="#374151" stroke-width="2.5" marker-end="url(#arr-ink)"/>
  <rect x="510" y="292" width="42" height="22" rx="4" fill="#ffffff"/>
  <text x="531" y="309" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">FIN</text>
  <text x="614" y="285" font-size="15" fill="#1f2937">"5초 지났네"</text>
  <text x="614" y="308" font-size="15" fill="#1f2937">→ <tspan font-weight="bold">FIN 전송</tspan> (연결 종료 시작)</text>

  <!-- t=5.001 LB 새 요청 -->
  <text x="24" y="319" font-size="15" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">t=5.001</text>
  <line x1="380" y1="314" x2="596" y2="385" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="468" y="343" width="72" height="24" rx="4" fill="#ffffff"/>
  <text x="504" y="361" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">새 요청</text>
  <text x="366" y="319" font-size="15" fill="#1f2937" text-anchor="end">"이 연결 아직 살아있지"</text>
  <text x="366" y="342" font-size="15" fill="#1f2937" text-anchor="end">→ <tspan font-weight="bold" fill="#b91c1c">새 요청 전송</tspan></text>

  <!-- 도착: 닫히는 중인 연결 -->
  <text x="614" y="390" font-size="15" font-weight="bold" fill="#b91c1c">이미 닫히는 중인 연결에</text>
  <text x="614" y="412" font-size="15" font-weight="bold" fill="#b91c1c">요청을 씀</text>

  <!-- RST -->
  <line x1="600" y1="440" x2="384" y2="479" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="470" y="438" width="42" height="22" rx="4" fill="#ffffff"/>
  <text x="491" y="455" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">RST</text>
  <text x="614" y="446" font-size="15" fill="#1f2937">서버는 <tspan font-weight="bold" fill="#b91c1c">RST 응답</tspan></text>

  <!-- 결과 -->
  <line x1="376" y1="496" x2="338" y2="496" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="24" y="468" width="310" height="56" rx="8" fill="#b91c1c"/>
  <text x="179" y="490" font-size="15" fill="#ffffff" text-anchor="middle">클라이언트는</text>
  <text x="179" y="513" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">ECONNRESET / 502</text>
</svg>
