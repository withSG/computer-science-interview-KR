<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">WAS 2대와 세션 불일치</title>
  <desc id="d">로드밸런서가 요청 1은 WAS #1로, 요청 2는 WAS #2로 번갈아 보낸다. 세션 {a3f9: kim}은 WAS #1 메모리에만 있어 WAS #2는 "그런 세션 없는데요"라고 응답한다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 요청 -->
  <rect x="24" y="70" width="88" height="40" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="68" y="96" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">요청 1</text>
  <rect x="24" y="210" width="88" height="40" rx="20" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="68" y="236" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">요청 2</text>

  <line x1="114" y1="90" x2="146" y2="90" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="114" y1="230" x2="146" y2="230" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 로드밸런서 -->
  <rect x="150" y="40" width="150" height="240" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="225" y="148" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Load</text>
  <text x="225" y="172" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Balancer</text>
  <text x="225" y="202" font-size="15" fill="#4b5563" text-anchor="middle">번갈아 전달</text>

  <line x1="302" y1="90" x2="340" y2="90" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="302" y1="230" x2="340" y2="230" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <!-- WAS #1 -->
  <rect x="344" y="40" width="260" height="100" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="70" font-size="18" font-weight="bold" fill="#1d4ed8">WAS #1</text>
  <text x="360" y="113" font-size="15" fill="#4b5563">메모리</text>
  <rect x="420" y="90" width="168" height="36" rx="4" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
  <text x="436" y="114" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{a3f9: kim}</text>

  <!-- WAS #2 -->
  <rect x="344" y="180" width="260" height="100" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="360" y="210" font-size="18" font-weight="bold" fill="#b91c1c">WAS #2</text>
  <text x="360" y="253" font-size="15" fill="#4b5563">메모리</text>
  <rect x="420" y="230" width="168" height="36" rx="4" fill="#f8fafc" stroke="#9ca3af" stroke-width="1"/>
  <text x="436" y="254" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{}</text>

  <!-- 결과 -->
  <rect x="624" y="70" width="232" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="740" y="96" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">로그인 성공</text>
  <rect x="624" y="210" width="232" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="740" y="236" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">“그런 세션 없는데요”</text>

  <!-- 요점 -->
  <rect x="24" y="308" width="832" height="46" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="440" y="337" font-size="16" fill="#111827" text-anchor="middle">세션은 <tspan font-weight="bold">WAS #1의 메모리에만</tspan> 있다 → WAS #2로 간 요청 2는 <tspan font-weight="bold" fill="#b91c1c">로그아웃 상태</tspan></text>
</svg>
