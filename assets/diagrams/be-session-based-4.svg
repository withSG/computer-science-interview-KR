<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">서버를 늘리면 세션이 깨진다</title>
  <desc id="d">로드밸런서가 요청 1과 요청 2를 서로 다른 WAS로 전달할 때 세션 메모리 불일치로 인해 발생하는 문제를 보여주는 다이어그램</desc>
  <rect width="880" height="260" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title / Section Heading from document -->
  <text x="30" y="32" font-size="16" font-weight="bold" fill="#1f2933">4. 서버를 늘리면 세션이 깨진다</text>

  <!-- Labels on left -->
  <text x="30" y="88.2" font-size="13" font-weight="bold" fill="#2563eb">요청 1</text>
  <text x="30" y="178.2" font-size="13" font-weight="bold" fill="#dc2626">요청 2</text>

  <!-- Arrows from Requests to Load Balancer -->
  <path d="M78,84 L142,84" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M78,174 L142,174" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Load Balancer Box -->
  <rect x="150" y="60" width="160" height="138" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="230" y="133.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Load Balancer</text>

  <!-- Arrows from Load Balancer to WAS -->
  <path d="M318,84 L382,84" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M318,174 L382,174" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- WAS #1 Row -->
  <rect x="390" y="66" width="75" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="427.5" y="88.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">WAS #1</text>

  <text x="480" y="88.2" font-size="13" fill="#1f2933">메모리: {a3f9: kim}</text>
  <text x="630" y="88.2" font-size="13" fill="#059669">← 로그인 성공</text>

  <!-- WAS #2 Row -->
  <rect x="390" y="156" width="75" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="427.5" y="178.2" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">WAS #2</text>

  <text x="480" y="178.2" font-size="13" fill="#1f2933">메모리: {}</text>
  <text x="560" y="178.2" font-size="13" fill="#dc2626">← "그런 세션 없는데요"</text>
</svg>