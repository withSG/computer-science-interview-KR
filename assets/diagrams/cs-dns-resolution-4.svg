<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A 레코드와 CNAME 레코드의 조회 차이</title>
  <desc id="d">A 레코드는 www.example.com을 203.0.113.5로 바로 매핑해 조회 1회로 끝나고, CNAME 레코드는 cdn.provider.net을 가리켜 그 이름을 다시 조회해야 A 203.0.113.77을 얻는다. A는 IP가 바뀌면 내가 고쳐야 하고, CNAME은 조회가 한 번 더 필요하지만 대상이 IP를 바꿔도 내 설정은 그대로다.</desc>
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="510" fill="#ffffff"/>

  <!-- 왼쪽: A 레코드 -->
  <rect x="24" y="24" width="404" height="462" rx="10" fill="#f5f9ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="226" y="56" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A 레코드</text>
  <text x="226" y="80" font-size="15" fill="#4b5563" text-anchor="middle">도메인 → IPv4</text>

  <rect x="106" y="100" width="240" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="226" y="128" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">www.example.com</text>

  <line x1="226" y1="146" x2="226" y2="193" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>
  <rect x="240" y="157" width="32" height="26" rx="4" fill="#dbeafe"/>
  <text x="256" y="175" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>

  <rect x="106" y="196" width="240" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="226" y="224" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">203.0.113.5</text>

  <rect x="44" y="368" width="364" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="70" cy="391" r="12" fill="#047857"/>
  <text x="70" y="397" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <text x="92" y="397" font-size="16" fill="#111827">조회 1회로 끝</text>

  <rect x="44" y="424" width="364" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="70" cy="447" r="12" fill="#b91c1c"/>
  <text x="70" y="453" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text>
  <text x="92" y="453" font-size="16" fill="#111827">IP가 바뀌면 내가 고쳐야 함</text>

  <!-- 오른쪽: CNAME 레코드 -->
  <rect x="452" y="24" width="404" height="462" rx="10" fill="#faf8ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="654" y="56" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">CNAME 레코드</text>
  <text x="654" y="80" font-size="15" fill="#4b5563" text-anchor="middle">도메인 → 다른 도메인</text>

  <rect x="534" y="100" width="240" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="654" y="128" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">www.example.com</text>

  <line x1="654" y1="146" x2="654" y2="193" stroke="#6d28d9" stroke-width="2" marker-end="url(#ar-purple)"/>
  <rect x="668" y="157" width="68" height="26" rx="4" fill="#ede9fe"/>
  <text x="702" y="175" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">CNAME</text>

  <rect x="534" y="196" width="240" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="654" y="224" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">cdn.provider.net</text>

  <line x1="654" y1="242" x2="654" y2="289" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>
  <text x="640" y="271" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="end">여기서 다시 조회</text>
  <rect x="668" y="253" width="32" height="26" rx="4" fill="#dbeafe"/>
  <text x="684" y="271" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>

  <rect x="534" y="292" width="240" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="654" y="320" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">203.0.113.77</text>

  <rect x="472" y="368" width="364" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="498" cy="391" r="12" fill="#b91c1c"/>
  <text x="498" y="397" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text>
  <text x="520" y="397" font-size="16" fill="#111827">조회가 한 번 더 필요(약간의 지연)</text>

  <rect x="472" y="424" width="364" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="498" cy="447" r="12" fill="#047857"/>
  <text x="498" y="453" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <text x="520" y="453" font-size="16" fill="#111827">대상이 IP를 바꿔도 내 설정은 그대로</text>
</svg>
