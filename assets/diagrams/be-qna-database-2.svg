<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">2NF 예시</title>
  <desc id="d">1NF 테이블에서 (학생ID, 과목코드)가 성적과 학생이름을 결정하지만 학생이름은 학생ID만으로 결정되는 부분 종속이다. 2NF는 이를 학생(학생ID, 학생이름)과 성적(학생ID, 과목코드, 성적) 두 테이블로 분해한다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- ===== 1NF : 부분 함수 종속 ===== -->
  <rect x="24" y="20" width="832" height="246" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="48" y="54" font-size="18" font-weight="bold" fill="#b91c1c">1NF — 부분 함수 종속</text>
  <text x="832" y="54" font-size="15" text-anchor="end" fill="#4b5563"><tspan font-weight="bold" text-decoration="underline">밑줄</tspan> = 기본키</text>

  <!-- 부분 종속 화살표 (학생ID → 학생이름) -->
  <text x="440" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">학생ID → 학생이름 (부분 종속)</text>
  <path d="M215,130 V100 H665 V126" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>

  <!-- 속성 행 -->
  <rect x="140" y="132" width="150" height="46" fill="#e0e7ff" stroke="#64748b" stroke-width="1"/>
  <rect x="290" y="132" width="150" height="46" fill="#e0e7ff" stroke="#64748b" stroke-width="1"/>
  <rect x="440" y="132" width="150" height="46" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <rect x="590" y="132" width="150" height="46" fill="#fee2e2" stroke="#64748b" stroke-width="1"/>
  <text x="215" y="161" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a" text-decoration="underline">학생ID</text>
  <text x="365" y="161" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a" text-decoration="underline">과목코드</text>
  <text x="515" y="161" font-size="16" text-anchor="middle" fill="#1f2937">성적</text>
  <text x="665" y="161" font-size="16" text-anchor="middle" fill="#991b1b">학생이름</text>

  <!-- 복합키 전체 → 성적, 학생이름 -->
  <path d="M146,184 V192 H434 V184" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <path d="M290,192 V214 H665 V184" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M515,214 V184" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="478" y="242" font-size="16" text-anchor="middle" fill="#1d4ed8">(학생ID, 과목코드) → 성적, 학생이름</text>

  <!-- ===== 분해 ===== -->
  <path d="M440,270 V302" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="456" y="292" font-size="15" font-weight="bold" fill="#374151">분해</text>

  <!-- ===== 2NF ===== -->
  <rect x="24" y="310" width="832" height="206" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="48" y="344" font-size="18" font-weight="bold" fill="#047857">2NF</text>

  <!-- 학생 테이블 -->
  <rect x="64" y="362" width="280" height="34" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="204" y="385" font-size="16" font-weight="bold" text-anchor="middle" fill="#065f46">학생</text>
  <rect x="64" y="396" width="140" height="46" fill="#e0e7ff" stroke="#64748b" stroke-width="1"/>
  <rect x="204" y="396" width="140" height="46" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="134" y="425" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a" text-decoration="underline">학생ID</text>
  <text x="274" y="425" font-size="16" text-anchor="middle" fill="#1f2937">학생이름</text>
  <text x="64" y="472" font-size="15" font-weight="bold" fill="#047857">✓ 부분 함수 종속 제거</text>
  <text x="64" y="494" font-size="15" fill="#4b5563">(독립 테이블 분리)</text>

  <!-- 성적 테이블 -->
  <rect x="426" y="362" width="390" height="34" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="621" y="385" font-size="16" font-weight="bold" text-anchor="middle" fill="#065f46">성적</text>
  <rect x="426" y="396" width="130" height="46" fill="#e0e7ff" stroke="#64748b" stroke-width="1"/>
  <rect x="556" y="396" width="130" height="46" fill="#e0e7ff" stroke="#64748b" stroke-width="1"/>
  <rect x="686" y="396" width="130" height="46" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="491" y="425" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a" text-decoration="underline">학생ID</text>
  <text x="621" y="425" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a" text-decoration="underline">과목코드</text>
  <text x="751" y="425" font-size="16" text-anchor="middle" fill="#1f2937">성적</text>
  <text x="426" y="472" font-size="15" font-weight="bold" fill="#047857">✓ 완전 함수 종속만 남음</text>
  <text x="426" y="494" font-size="15" fill="#4b5563">(기본키 전체에 종속)</text>
</svg>
