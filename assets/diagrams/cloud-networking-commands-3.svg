<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">출력 읽기</title>
  <desc id="d">tcpdump 출력 결과 분석 다이어그램과 출발지/목적지 포트 매핑</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 메인 프레임 / 터미널 배경 -->
  <rect x="24" y="24" width="832" height="230" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- 헤더 영역 (문서 헤딩) -->
  <text x="44" y="58" font-size="16" font-weight="bold" fill="#1f2933">출력 읽기</text>
  <line x1="24" y1="74" x2="856" y2="74" stroke="#cbd2d9" stroke-width="1"/>

  <!-- tcpdump 로그 라인 1 -->
  <!-- Highlight Boxes for Line 1 -->
  <rect x="202" y="90" width="138" height="28" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="358" y="90" width="130" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>

  <g font-size="13" font-family="'Consolas', 'Courier New', monospace" fill="#1f2933">
    <!-- Line 1 Text -->
    <text x="44" y="108">14:23:01.123456 IP</text>
    <text x="206" y="108" fill="#2563eb" font-weight="bold">10.0.0.42.54321</text>
    <text x="345" y="108" fill="#52606d">&gt;</text>
    <text x="362" y="108" fill="#7c3aed" font-weight="bold">10.0.5.20.8080</text>
    <text x="488" y="108">: Flags [S], seq 1, win 64240</text>

    <!-- Line 2 Text -->
    <text x="44" y="150">14:23:01.125001 IP 10.0.5.20.8080 &gt; 10.0.0.42.54321: Flags [S.], seq 9, ack 2, win 65160</text>

    <!-- Line 3 Text -->
    <text x="44" y="192">14:23:01.125100 IP 10.0.0.42.54321 &gt; 10.0.5.20.8080: Flags [.], ack 10, win 64240</text>
  </g>

  <!-- 가이드 연결선 (ASCII: └────┬────┘) -->
  <!-- 출발지 포인터 -->
  <path d="M206,122 L206,212 L336,212 L336,222" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M340,122 L340,212 L210,212" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="271" y1="212" x2="271" y2="284" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- 목적지 포인터 -->
  <path d="M362,122 L362,212 L488,212 L488,222" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M492,122 L492,212 L366,212" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="427" y1="212" x2="427" y2="284" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>

  <!-- 하단 설명 박스 (ASCII: 출발지:포트 / 목적지:포트) -->
  <!-- 출발지:포트 박스 -->
  <rect x="201" y="288" width="140" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="271" y="312" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">출발지:포트</text>

  <!-- 목적지:포트 박스 -->
  <rect x="357" y="288" width="140" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="427" y="312" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">목적지:포트</text>
</svg>