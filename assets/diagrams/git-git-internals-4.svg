<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">HEAD와 브랜치는 그냥 포인터다</title>
  <desc id="d">브랜치 생성 전과 git switch -c feature 실행 후의 커밋 그래프 및 HEAD와 브랜치 포인터 변화를 나타낸 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Left Side: 브랜치 생성 전 -->
  <text x="50" y="44" font-size="16" font-weight="bold" fill="#1f2933">브랜치 생성 전</text>

  <!-- Commits Left -->
  <rect x="50" y="70" width="54" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="77" y="92" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c1</text>

  <path d="M129,88 L113,88" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="138" y="70" width="54" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="165" y="92" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c2</text>

  <path d="M217,88 L201,88" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="226" y="70" width="54" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="253" y="92" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c3</text>

  <path d="M253,137 L253,115" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <text x="253" y="154" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">main</text>

  <text x="253" y="181" font-size="13" fill="#52606d" text-anchor="middle">(HEAD ──&gt; main)</text>

  <!-- Divider Line -->
  <line x1="440" y1="30" x2="440" y2="210" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right Side: git switch -c feature 실행 후 -->
  <text x="480" y="44" font-size="16" font-weight="bold" fill="#1f2933">git switch -c feature 실행 후</text>

  <!-- Commits Right -->
  <rect x="480" y="70" width="54" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="507" y="92" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c1</text>

  <path d="M559,88 L543,88" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="568" y="70" width="54" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="595" y="92" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c2</text>

  <path d="M647,88 L631,88" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="656" y="70" width="54" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="683" y="92" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">c3</text>

  <path d="M683,137 L683,115" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <text x="683" y="154" font-size="13" font-weight="bold" text-anchor="middle">
    <tspan fill="#2563eb">main</tspan><tspan fill="#52606d">, </tspan><tspan fill="#059669">feature</tspan>
  </text>

  <text x="683" y="181" font-size="13" fill="#52606d" text-anchor="middle">(HEAD ──&gt; feature)</text>

  <!-- Bottom Text Description -->
  <rect x="30" y="240" width="820" height="60" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="275" font-size="13" fill="#1f2933" text-anchor="middle">
    커밋 그래프는 손도 대지 않는다. .git/refs/heads/feature 파일 하나가 생기고 .git/HEAD 한 줄이 바뀐 게 전부다.
  </text>
</svg>