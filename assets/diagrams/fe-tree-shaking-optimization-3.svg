<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이유 2: 파이프라인 왕복이 없다</title>
  <desc id="d">Babel, Webpack, Terser를 거치며 파싱을 반복하는 기존 조합과 단일 AST 위에서 파싱-변환-의존성분석-압축을 한 번에 처리하는 esbuild의 구조적 차이 비교 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- [기존 조합] 영역 -->
  <rect x="24" y="20" width="832" height="220" rx="8" fill="#fffbeb" stroke="#9aa5b1" stroke-width="1"/>
  
  <rect x="40" y="35" width="90" height="26" rx="4" fill="#d97706"/>
  <text x="85" y="52" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">[기존 조합]</text>

  <!-- 1행: 소스 -> Babel이 파싱해 AST 생성 -> 변환 -> 다시 문자열로 출력 -->
  <rect x="40" y="80" width="60" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="70" y="104.5" fill="#1f2933" font-size="13" text-anchor="middle">소스</text>

  <path d="M100,100 L114,100" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="120" y="80" width="180" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="104.5" fill="#1f2933" font-size="13" text-anchor="middle">Babel이 파싱해 AST 생성</text>

  <path d="M300,100 L314,100" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="320" y="80" width="60" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="350" y="104.5" fill="#1f2933" font-size="13" text-anchor="middle">변환</text>

  <path d="M380,100 L394,100" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="400" y="80" width="140" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="470" y="104.5" fill="#1f2933" font-size="13" text-anchor="middle">다시 문자열로 출력</text>

  <!-- 파이프라인 줄바꿈 연결선 -->
  <path d="M540,100 L830,100 L830,145 L50,145 L50,180 L54,180" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>

  <!-- 2행: Webpack이 그 문자열을 다시 파싱해 AST 생성 -> 의존성 분석 -> 변환 -> 출력 -> Terser가 또 파싱 -> 압축 -> 출력 -->
  <rect x="60" y="160" width="280" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="184.5" fill="#1f2933" font-size="13" text-anchor="middle">Webpack이 그 문자열을 다시 파싱해 AST 생성</text>

  <path d="M340,180 L354,180" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="360" y="160" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="405" y="184.5" fill="#1f2933" font-size="13" text-anchor="middle">의존성 분석</text>

  <path d="M450,180 L464,180" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="470" y="160" width="50" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="495" y="184.5" fill="#1f2933" font-size="13" text-anchor="middle">변환</text>

  <path d="M520,180 L534,180" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="540" y="160" width="50" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="565" y="184.5" fill="#1f2933" font-size="13" text-anchor="middle">출력</text>

  <path d="M590,180 L604,180" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="610" y="160" width="110" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="665" y="184.5" fill="#1f2933" font-size="13" text-anchor="middle">Terser가 또 파싱</text>

  <path d="M720,180 L734,180" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="740" y="160" width="50" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="765" y="184.5" fill="#1f2933" font-size="13" text-anchor="middle">압축</text>

  <path d="M790,180 L804,180" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="810" y="160" width="36" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="828" y="184.5" fill="#1f2933" font-size="11.5" text-anchor="middle">출력</text>

  <text x="440" y="224" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle">같은 코드를 세 번 파싱하고 세 번 문자열로 찍어낸다.</text>

  <!-- [esbuild] 영역 -->
  <rect x="24" y="255" width="832" height="115" rx="8" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>

  <rect x="40" y="270" width="70" height="26" rx="4" fill="#2563eb"/>
  <text x="75" y="287" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">[esbuild]</text>

  <!-- 소스 -> 파싱 -> (변환 · 의존성 분석 · 압축을 같은 AST 위에서 처리) -> 출력 -->
  <rect x="40" y="310" width="60" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="70" y="334.5" fill="#1f2933" font-size="13" text-anchor="middle">소스</text>

  <path d="M100,330 L114,330" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="120" y="310" width="60" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="150" y="334.5" fill="#1f2933" font-size="13" text-anchor="middle">파싱</text>

  <path d="M180,330 L194,330" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="200" y="310" width="560" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="480" y="334.5" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">(변환 · 의존성 분석 · 압축을 같은 AST 위에서 처리)</text>

  <path d="M760,330 L774,330" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="780" y="310" width="60" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="810" y="334.5" fill="#1f2933" font-size="13" text-anchor="middle">출력</text>
</svg>