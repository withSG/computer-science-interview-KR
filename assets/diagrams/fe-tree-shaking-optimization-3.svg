<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파싱 왕복 비교</title>
  <desc id="d">기존 조합은 소스를 Babel, Webpack, Terser가 차례로 파싱해 AST를 만들고 작업한 뒤 다시 문자열로 출력하므로 같은 코드를 세 번 파싱하고 세 번 문자열로 찍어낸다. esbuild는 한 번 파싱한 AST 위에서 변환·의존성 분석·압축을 모두 처리한 뒤 한 번 출력한다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- ── 기존 조합 ── -->
  <rect x="24" y="25" width="6" height="26" fill="#b91c1c"/>
  <text x="42" y="45" font-size="18" font-weight="700" fill="#111827">기존 조합</text>

  <!-- 범례 -->
  <rect x="560" y="31" width="18" height="18" rx="3" fill="#fef2f2" stroke="#dc2626"/>
  <text x="586" y="45" font-size="15" fill="#111827">파싱</text>
  <rect x="660" y="31" width="18" height="18" rx="3" fill="#fffbeb" stroke="#d97706"/>
  <text x="686" y="45" font-size="15" fill="#111827">문자열로 출력</text>

  <rect x="205" y="62" width="110" height="36" rx="18" fill="#eff6ff" stroke="#2563eb"/>
  <text x="260" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">소스</text>
  <line x1="260" y1="100" x2="260" y2="118" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>

  <g font-size="17" font-weight="700" fill="#111827">
    <text x="40" y="160">Babel</text>
    <text x="40" y="260">Webpack</text>
    <text x="40" y="360">Terser</text>
  </g>

  <g font-size="16" fill="#111827" text-anchor="middle">
    <!-- Babel -->
    <rect x="150" y="124" width="220" height="60" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="260" y="160">파싱해 AST 생성</text>
    <rect x="402" y="124" width="220" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="512" y="160">변환</text>
    <rect x="658" y="124" width="182" height="60" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="749" y="160">다시 문자열로 출력</text>

    <!-- Webpack -->
    <rect x="150" y="224" width="220" height="60" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="260" y="249">그 문자열을 다시 파싱해</text>
    <text x="260" y="272">AST 생성</text>
    <rect x="402" y="224" width="120" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="462" y="260">의존성 분석</text>
    <rect x="554" y="224" width="68" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="588" y="260">변환</text>
    <rect x="658" y="224" width="182" height="60" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="749" y="260">출력</text>

    <!-- Terser -->
    <rect x="150" y="324" width="220" height="60" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="260" y="360">또 파싱</text>
    <rect x="402" y="324" width="220" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="512" y="360">압축</text>
    <rect x="658" y="324" width="182" height="60" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="749" y="360">출력</text>
  </g>

  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="372" y1="154" x2="398" y2="154" marker-end="url(#ag)"/>
    <line x1="624" y1="154" x2="654" y2="154" marker-end="url(#ag)"/>
    <line x1="372" y1="254" x2="398" y2="254" marker-end="url(#ag)"/>
    <line x1="524" y1="254" x2="550" y2="254" marker-end="url(#ag)"/>
    <line x1="624" y1="254" x2="654" y2="254" marker-end="url(#ag)"/>
    <line x1="372" y1="354" x2="398" y2="354" marker-end="url(#ag)"/>
    <line x1="624" y1="354" x2="654" y2="354" marker-end="url(#ag)"/>
    <path d="M749,188 V204 H260 V218" marker-end="url(#ag)"/>
    <path d="M749,288 V304 H260 V318" marker-end="url(#ag)"/>
  </g>

  <text x="40" y="424" font-size="17" font-weight="700" fill="#b91c1c">같은 코드를 세 번 파싱하고 세 번 문자열로 찍어낸다.</text>

  <line x1="24" y1="450" x2="856" y2="450" stroke="#d1d5db" stroke-dasharray="6 6"/>

  <!-- ── esbuild ── -->
  <rect x="24" y="469" width="6" height="26" fill="#047857"/>
  <text x="42" y="489" font-size="18" font-weight="700" fill="#111827">esbuild</text>

  <g font-size="16" fill="#111827" text-anchor="middle">
    <rect x="40" y="538" width="80" height="44" rx="22" fill="#eff6ff" stroke="#2563eb"/>
    <text x="80" y="566" font-weight="700" fill="#1d4ed8">소스</text>
    <rect x="156" y="538" width="90" height="44" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="201" y="566">파싱</text>

    <rect x="282" y="514" width="420" height="92" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="492" y="540" font-size="15" font-weight="700" fill="#047857">같은 AST 위에서 처리</text>
    <rect x="298" y="554" width="90" height="38" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="343" y="579">변환</text>
    <rect x="427" y="554" width="130" height="38" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="492" y="579">의존성 분석</text>
    <rect x="596" y="554" width="90" height="38" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="641" y="579">압축</text>

    <rect x="738" y="538" width="102" height="44" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="789" y="566">출력</text>
  </g>

  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="122" y1="560" x2="152" y2="560" marker-end="url(#ag)"/>
    <line x1="248" y1="560" x2="278" y2="560" marker-end="url(#ag)"/>
    <line x1="704" y1="560" x2="734" y2="560" marker-end="url(#ag)"/>
  </g>
</svg>
