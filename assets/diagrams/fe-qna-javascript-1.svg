<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실행 컨텍스트의 구성</title>
  <desc id="d">Execution Context는 Lexical Environment, Variable Environment, This Binding 세 가지로 구성됩니다. Lexical Environment 안에는 변수와 함수를 저장하는 Environment Record와 스코프 체인을 이루는 Outer Lexical Environment Reference가 있고, Variable Environment는 var 선언 변수를 저장합니다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- Execution Context (바깥 틀) -->
  <rect x="24" y="20" width="832" height="400" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="48" y="58" fill="#111827"><tspan font-size="20" font-weight="bold">Execution Context</tspan><tspan font-size="16" fill="#4b5563" dx="10">(실행 컨텍스트)</tspan></text>

  <!-- 1. Lexical Environment -->
  <rect x="48" y="80" width="784" height="196" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="72" y="113" fill="#5b21b6"><tspan font-size="18" font-weight="bold">Lexical Environment</tspan><tspan font-size="16" fill="#4b5563" dx="8">(렉시컬 환경)</tspan></text>

  <!-- Environment Record -->
  <rect x="72" y="132" width="300" height="120" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="222" y="164" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Environment Record</text>
  <text x="222" y="188" font-size="15" fill="#4b5563" text-anchor="middle">(환경 레코드)</text>
  <line x1="92" y1="204" x2="352" y2="204" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="222" y="233" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">변수, 함수 저장</text>

  <!-- Outer Lexical Environment Reference -->
  <rect x="392" y="132" width="416" height="120" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="164" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Outer Lexical Environment Reference</text>
  <text x="600" y="188" font-size="15" fill="#4b5563" text-anchor="middle">(외부 참조)</text>
  <line x1="412" y1="204" x2="788" y2="204" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="600" y="233" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">스코프 체인</text>

  <!-- 2. Variable Environment -->
  <rect x="48" y="296" width="380" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="72" y="327" fill="#b45309"><tspan font-size="18" font-weight="bold">Variable Environment</tspan><tspan font-size="16" fill="#4b5563" dx="8">(변수 환경)</tspan></text>
  <rect x="72" y="342" width="332" height="38" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="238" y="367" font-size="16" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#b45309">var</tspan> 선언 변수 저장</text>

  <!-- 3. This Binding -->
  <rect x="452" y="296" width="380" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="642" y="352" fill="#047857" text-anchor="middle"><tspan font-size="18" font-weight="bold">This Binding</tspan><tspan font-size="16" fill="#4b5563" dx="8">(this 바인딩)</tspan></text>
</svg>
