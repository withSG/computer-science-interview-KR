<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실행 컨텍스트의 구성</title>
  <desc id="d">Execution Context, Lexical Environment, Variable Environment, This Binding의 구성 요소와 하위 항목을 보여주는 트리 구조 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Root Node: Execution Context -->
  <rect x="290" y="40" width="300" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="73" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">Execution Context</text>

  <!-- Level 1 Connections (Vertical line down from root to horizontal bus) -->
  <path d="M440,96 L440,126" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <!-- Horizontal Bus -->
  <path d="M180,126 L700,126" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <!-- Vertical Drops to Level 1 Nodes -->
  <path d="M180,126 L180,150" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <path d="M440,126 L440,150" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <path d="M700,126 L700,150" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- Level 1 Node 1: Lexical Environment -->
  <g>
    <rect x="30" y="150" width="300" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="180" y="180" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Lexical Environment (렉시컬 환경)</text>
  </g>

  <!-- Level 1 Node 2: Variable Environment -->
  <g>
    <rect x="350" y="150" width="180" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="440" y="180" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Variable Environment</text>
    <text x="440" y="195" fill="#52606d" font-size="11.5" text-anchor="middle">(변수 환경)</text>
  </g>

  <!-- Level 1 Node 3: This Binding -->
  <g>
    <rect x="590" y="150" width="220" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="700" y="180" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">This Binding (this 바인딩)</text>
  </g>

  <!-- Branch lines for Lexical Environment Children -->
  <path d="M180,200 L180,240" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M180,240 L180,310" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M180,240 L220,240" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M180,310 L220,310" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Level 2 Children under Lexical Environment -->
  <!-- Child 1: Environment Record -->
  <g>
    <rect x="220" y="220" width="610" height="42" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="236" y="246" fill="#1f2933" font-size="13" font-weight="bold">Environment Record (환경 레코드)</text>
    <text x="480" y="246" fill="#52606d" font-size="13">- 변수, 함수 저장</text>
  </g>

  <!-- Child 2: Outer Lexical Environment Reference -->
  <g>
    <rect x="220" y="290" width="610" height="42" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="236" y="316" fill="#1f2933" font-size="13" font-weight="bold">Outer Lexical Environment Reference (외부 참조)</text>
    <text x="590" y="316" fill="#52606d" font-size="13">- 스코프 체인</text>
  </g>

  <!-- Branch line for Variable Environment Child -->
  <path d="M440,200 L440,380" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M440,380 L470,380" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Level 2 Child under Variable Environment -->
  <g>
    <rect x="470" y="360" width="220" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="486" y="385" fill="#1f2933" font-size="13">var 선언 변수 저장</text>
  </g>
</svg>