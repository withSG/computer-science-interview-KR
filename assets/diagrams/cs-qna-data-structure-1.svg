<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BST의 문제점</title>
  <desc id="d">정렬된 순서로 데이터 삽입 시 한쪽으로 편향되는 이진 탐색 트리와 O(n) 검색 시간 복잡도를 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1.5 L8,5 L0,8.5 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <rect x="24" y="24" width="832" height="422" rx="12" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="54" y="61" font-size="16" font-weight="bold" fill="#1f2933">BST의 문제점</text>
  <line x1="54" y1="76" x2="826" y2="76" stroke="#cbd2d9" stroke-width="1"/>
  
  <text x="54" y="109" font-size="13" font-weight="bold" fill="#52606d">// 정렬된 순서로 삽입 시 편향</text>
  
  <g>
    <line x1="126" y1="145" x2="164" y2="145" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
    <line x1="206" y1="145" x2="244" y2="145" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
    <line x1="286" y1="145" x2="324" y2="145" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
    <line x1="366" y1="145" x2="404" y2="145" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

    <circle cx="106" cy="145" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="106" y="150" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

    <circle cx="186" cy="145" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="186" y="150" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

    <circle cx="266" cy="145" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="266" y="150" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

    <circle cx="346" cy="145" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="346" y="150" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

    <circle cx="426" cy="145" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="426" y="150" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>
  </g>

  <g>
    <line x1="211" y1="223" x2="249" y2="247" stroke="#9aa5b1" stroke-width="1.5"/>
    <line x1="271" y1="273" x2="309" y2="297" stroke="#9aa5b1" stroke-width="1.5"/>
    <line x1="331" y1="323" x2="369" y2="347" stroke="#9aa5b1" stroke-width="1.5"/>
    <line x1="391" y1="373" x2="429" y2="397" stroke="#9aa5b1" stroke-width="1.5"/>

    <circle cx="198" cy="212" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="198" y="217" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

    <circle cx="258" cy="262" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="258" y="267" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

    <circle cx="318" cy="312" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="318" y="317" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

    <circle cx="378" cy="362" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="378" y="367" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

    <circle cx="438" cy="412" r="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="438" y="417" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>
  </g>

  <g>
    <rect x="490" y="287" x2="800" width="310" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="645" y="317" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">// 검색: O(n) - 연결 리스트와 동일</text>
  </g>
</svg>