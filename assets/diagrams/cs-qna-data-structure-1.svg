<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정렬 삽입으로 편향된 BST</title>
  <desc id="d">1, 2, 3, 4, 5를 정렬된 순서로 삽입하면 이진 탐색 트리가 한쪽으로 편향되어 한 줄이 되고, 검색이 연결 리스트와 같은 O(n)이 되는 것을 보여준다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- ① 삽입 순서 -->
  <text x="40" y="50" font-size="17" font-weight="bold" fill="#111827">① 정렬된 순서로 삽입</text>
  <g fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5">
    <rect x="96" y="70" width="48" height="40" rx="8"/>
    <rect x="196" y="70" width="48" height="40" rx="8"/>
    <rect x="296" y="70" width="48" height="40" rx="8"/>
    <rect x="396" y="70" width="48" height="40" rx="8"/>
    <rect x="496" y="70" width="48" height="40" rx="8"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="150" y1="90" x2="190" y2="90"/>
    <line x1="250" y1="90" x2="290" y2="90"/>
    <line x1="350" y1="90" x2="390" y2="90"/>
    <line x1="450" y1="90" x2="490" y2="90"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="120" y="96">1</text>
    <text x="220" y="96">2</text>
    <text x="320" y="96">3</text>
    <text x="420" y="96">4</text>
    <text x="520" y="96">5</text>
  </g>

  <!-- ② 편향된 트리 -->
  <text x="40" y="158" font-size="17" font-weight="bold" fill="#111827">② 한쪽으로 편향된 트리</text>
  <g stroke="#6b7280" stroke-width="2">
    <line x1="120" y1="200" x2="220" y2="255"/>
    <line x1="220" y1="255" x2="320" y2="310"/>
    <line x1="320" y1="310" x2="420" y2="365"/>
    <line x1="420" y1="365" x2="520" y2="420"/>
  </g>
  <g fill="#fef2f2" stroke="#b91c1c" stroke-width="2">
    <circle cx="120" cy="200" r="22"/>
    <circle cx="220" cy="255" r="22"/>
    <circle cx="320" cy="310" r="22"/>
    <circle cx="420" cy="365" r="22"/>
    <circle cx="520" cy="420" r="22"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="120" y="206">1</text>
    <text x="220" y="261">2</text>
    <text x="320" y="316">3</text>
    <text x="420" y="371">4</text>
    <text x="520" y="426">5</text>
  </g>

  <!-- ③ 결과 -->
  <rect x="620" y="250" width="236" height="112" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="738" y="296" font-size="22" font-weight="bold" fill="#b91c1c" text-anchor="middle">③ 검색: O(n)</text>
  <text x="738" y="332" font-size="17" fill="#111827" text-anchor="middle">연결 리스트와 동일</text>
</svg>
