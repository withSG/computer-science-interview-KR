<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">유니온 파일시스템이 하는 일</title>
  <desc id="d">Upper 레이어와 Lower 레이어들이 유니온 파일시스템을 통해 merged 뷰로 합성되는 구조를 나타낸 다이어그램</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 상단 박스: merged (컨테이너가 실제로 보는 /) -->
  <g id="merged-section">
    <!-- 외각 merged 박스 라벨 -->
    <text x="60" y="48" font-size="14" font-weight="bold" fill="#1f2933">merged (컨테이너가 실제로 보는 /)</text>
    
    <!-- merged 박스 테두리 및 배경 -->
    <rect x="60" y="60" width="760" height="110" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

    <!-- 첫 번째 항목: /etc/nginx/nginx.conf  ← upper 것 -->
    <rect x="80" y="78" width="220" height="32" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="90" y="98" font-size="13" fill="#1f2933" font-family="monospace">/etc/nginx/nginx.conf</text>
    
    <path d="M 310 94 L 340 94" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <text x="350" y="98" font-size="13" font-weight="bold" fill="#7c3aed">← upper 것</text>

    <!-- 두 번째 항목: /usr/sbin/nginx        ← lower 것 -->
    <rect x="80" y="122" width="220" height="32" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="90" y="142" font-size="13" fill="#1f2933" font-family="monospace">/usr/sbin/nginx</text>
    
    <path d="M 310 138 L 340 138" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="350" y="142" font-size="13" font-weight="bold" fill="#52606d">← lower 것</text>
  </g>

  <!-- 연결 화살표 및 라벨: ▲ 겹쳐 보이기 -->
  <g id="connector">
    <path d="M 440 250 L 440 172" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a-blue)"/>
    
    <rect x="380" y="200" width="120" height="24" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="12"/>
    <text x="440" y="216" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">▲ 겹쳐 보이기</text>
  </g>

  <!-- 하단 큰 박스: 레이어 모음 -->
  <g id="layers-section">
    <!-- 하단 박스 외곽 -->
    <rect x="60" y="250" width="760" height="220" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>

    <!-- upperdir 레이어 -->
    <rect x="80" y="270" width="720" height="40" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="95" y="294" font-size="13" font-weight="bold" fill="#7c3aed" font-family="monospace">upperdir</text>
    <text x="180" y="294" font-size="13" fill="#1f2933">쓰기 가능, 컨테이너 전용</text>

    <!-- lowerdir3 레이어 -->
    <rect x="80" y="318" width="720" height="40" rx="3" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="95" y="342" font-size="13" font-weight="bold" fill="#52606d" font-family="monospace">lowerdir3</text>
    <text x="180" y="342" font-size="13" fill="#1f2933">이미지 레이어 L3</text>

    <!-- lowerdir2 레이어 -->
    <rect x="80" y="366" width="720" height="40" rx="3" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="95" y="390" font-size="13" font-weight="bold" fill="#52606d" font-family="monospace">lowerdir2</text>
    <text x="180" y="390" font-size="13" fill="#1f2933">이미지 레이어 L2</text>
    <path d="M 330 386 L 360 386" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="370" y="390" font-size="13" font-weight="bold" fill="#059669">← 읽기 전용, 여러 컨테이너가 공유</text>

    <!-- lowerdir1 레이어 -->
    <rect x="80" y="414" width="720" height="40" rx="3" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="95" y="438" font-size="13" font-weight="bold" fill="#52606d" font-family="monospace">lowerdir1</text>
    <text x="180" y="438" font-size="13" fill="#1f2933">이미지 레이어 L1</text>
  </g>

  <!-- 추가 마커 정의 (초록색, 잉크색) -->
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
</svg>