<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">유니온 파일시스템이 하는 일</title>
  <desc id="d">읽기 전용 이미지 레이어 lowerdir1~3과 컨테이너 전용 쓰기 레이어 upperdir를 겹쳐, 컨테이너가 실제로 보는 merged 디렉터리 하나로 보여 준다. 같은 경로면 위층이 이겨 /etc/nginx/nginx.conf는 upper 것, /usr/sbin/nginx는 lower 것이 보인다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="530" fill="#ffffff"/>

  <!-- merged: 컨테이너가 실제로 보는 / -->
  <rect x="77" y="28" width="540" height="156" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="97" y="60" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">merged</text>
  <text x="171" y="60" font-size="16" fill="#1f2937">컨테이너가 실제로 보는 /</text>

  <rect x="97" y="76" width="500" height="44" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="113" y="104" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/etc/nginx/nginx.conf</text>
  <rect x="457" y="84" width="124" height="28" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="519" y="103" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">← upper 것</text>

  <rect x="97" y="128" width="500" height="44" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="113" y="156" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/usr/sbin/nginx</text>
  <rect x="457" y="136" width="124" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="519" y="155" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">← lower 것</text>

  <!-- 겹쳐 보이기 -->
  <line x1="347" y1="256" x2="347" y2="191" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="365" y="216" font-size="16" font-weight="bold" fill="#1d4ed8">겹쳐 보이기</text>
  <text x="365" y="238" font-size="14" fill="#4b5563">같은 경로면 위층이 이김</text>

  <!-- 레이어 스택 -->
  <rect x="77" y="256" width="540" height="248" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>

  <rect x="93" y="272" width="508" height="46" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="109" y="301" font-size="16" font-weight="bold" fill="#b45309" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">upperdir</text>
  <text x="221" y="301" font-size="16" fill="#1f2937">컨테이너 쓰기 레이어</text>

  <rect x="93" y="334" width="508" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="109" y="363" font-size="16" font-weight="bold" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lowerdir3</text>
  <text x="221" y="363" font-size="16" fill="#1f2937">이미지 레이어 L3</text>

  <rect x="93" y="388" width="508" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="109" y="417" font-size="16" font-weight="bold" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lowerdir2</text>
  <text x="221" y="417" font-size="16" fill="#1f2937">이미지 레이어 L2</text>

  <rect x="93" y="442" width="508" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="109" y="471" font-size="16" font-weight="bold" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lowerdir1</text>
  <text x="221" y="471" font-size="16" fill="#1f2937">이미지 레이어 L1</text>

  <!-- 오른쪽 속성 주석 -->
  <path d="M629,274 H639 V316 H629" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="655" y="291" font-size="16" font-weight="bold" fill="#b45309">쓰기 가능</text>
  <text x="655" y="311" font-size="15" fill="#1f2937">컨테이너 전용</text>

  <path d="M629,336 H639 V486 H629 M639,411 H647" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="657" y="404" font-size="16" font-weight="bold" fill="#374151">읽기 전용</text>
  <text x="657" y="426" font-size="15" fill="#1f2937">여러 컨테이너가 공유</text>
</svg>
