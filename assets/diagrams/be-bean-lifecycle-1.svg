<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 950" width="880" height="950" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Bean 생명주기 아홉 단계</title>
  <desc id="d">컨테이너 기동부터 인스턴스화, 의존성 주입, Aware 콜백, 초기화 전 후처리, 초기화 콜백, 초기화 후 후처리, 사용, 소멸 콜백까지 아홉 단계를 순서대로 보여줍니다. @PostConstruct는 5단계에서 원본 객체를 대상으로 호출되고, AOP 프록시는 7단계에서야 만들어집니다.</desc>
  <rect width="880" height="950" fill="#ffffff"/>
  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 단계 사이 화살표 -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#down)">
    <line x1="56" y1="79" x2="56" y2="93"/>
    <line x1="56" y1="151" x2="56" y2="165"/>
    <line x1="56" y1="223" x2="56" y2="237"/>
    <line x1="56" y1="295" x2="56" y2="309"/>
    <line x1="56" y1="445" x2="56" y2="459"/>
    <line x1="56" y1="567" x2="56" y2="581"/>
    <line x1="56" y1="683" x2="56" y2="697"/>
    <line x1="56" y1="755" x2="56" y2="769"/>
  </g>

  <!-- [1] 컨테이너 기동 -->
  <rect x="24" y="24" width="832" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="50" r="15" fill="#334155"/>
  <text x="56" y="55" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="56" font-size="17" font-weight="bold" fill="#111827">컨테이너 기동</text>
  <text x="250" y="55" font-size="15" fill="#1f2937">클래스 스캔 → BeanDefinition(설계도) 등록</text>

  <!-- [2] 인스턴스화 -->
  <rect x="24" y="96" width="832" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="122" r="15" fill="#334155"/>
  <text x="56" y="127" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="128" font-size="17" font-weight="bold" fill="#111827">인스턴스화</text>
  <text x="250" y="127" font-size="15" fill="#1f2937">생성자 호출. 생성자 주입도 이때 이뤄진다</text>

  <!-- [3] 의존성 주입 -->
  <rect x="24" y="168" width="832" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="194" r="15" fill="#334155"/>
  <text x="56" y="199" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="84" y="200" font-size="17" font-weight="bold" fill="#111827">의존성 주입</text>
  <text x="250" y="199" font-size="15" fill="#1f2937">필드 주입, Setter 주입이 채워진다</text>

  <!-- [4] Aware 콜백 -->
  <rect x="24" y="240" width="832" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="266" r="15" fill="#334155"/>
  <text x="56" y="271" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="84" y="272" font-size="17" font-weight="bold" fill="#111827">Aware 콜백</text>
  <text x="250" y="271" font-size="15" fill="#1f2937">BeanNameAware, BeanFactoryAware 등</text>

  <!-- [5] 초기화 전 후처리 -->
  <rect x="24" y="312" width="832" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="56" cy="338" r="15" fill="#b45309"/>
  <text x="56" y="343" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="84" y="344" font-size="17" font-weight="bold" fill="#111827">초기화 전 후처리</text>
  <text x="250" y="343" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">BeanPostProcessor.postProcessBeforeInitialization</text>
  <path d="M262,352 V410 M262,374 H276 M262,410 H276" stroke="#a8a29e" stroke-width="1.5" fill="none"/>
  <text x="284" y="379" font-size="15" fill="#1f2937">ApplicationContextAware 도 여기서 처리</text>
  <rect x="280" y="395" width="310" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="292" y="415" font-size="15" font-weight="bold" fill="#92400e">이 안에서 @PostConstruct 가 호출된다</text>
  <text x="606" y="405" font-size="14" fill="#92400e">원본 객체를 대상으로 호출</text>
  <text x="606" y="424" font-size="14" fill="#92400e">프록시는 [7]에서야 생성</text>

  <!-- [6] 초기화 콜백 -->
  <rect x="24" y="462" width="832" height="102" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="489" r="15" fill="#334155"/>
  <text x="56" y="494" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="84" y="495" font-size="17" font-weight="bold" fill="#111827">초기화 콜백</text>
  <rect x="250" y="474" width="340" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="262" y="494" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">InitializingBean.afterPropertiesSet()</text>
  <line x1="270" y1="506" x2="270" y2="519" stroke="#64748b" stroke-width="2" marker-end="url(#down)"/>
  <rect x="250" y="522" width="340" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="262" y="542" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@Bean(initMethod = "...")<tspan font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"> 지정 메서드</tspan></text>

  <!-- [7] 초기화 후 후처리 -->
  <rect x="24" y="584" width="832" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <circle cx="56" cy="610" r="15" fill="#b45309"/>
  <text x="56" y="615" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="84" y="616" font-size="17" font-weight="bold" fill="#111827">초기화 후 후처리</text>
  <text x="250" y="615" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">BeanPostProcessor.postProcessAfterInitialization</text>
  <path d="M262,624 V648 H276" stroke="#a8a29e" stroke-width="1.5" fill="none"/>
  <rect x="280" y="633" width="240" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="292" y="653" font-size="15" font-weight="bold" fill="#92400e">AOP 프록시가 만들어지는 지점</text>

  <!-- [8] 사용 -->
  <rect x="24" y="700" width="832" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="56" cy="726" r="15" fill="#047857"/>
  <text x="56" y="731" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="84" y="732" font-size="17" font-weight="bold" fill="#111827">사용</text>

  <!-- [9] 소멸 콜백 -->
  <rect x="24" y="772" width="832" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="56" cy="799" r="15" fill="#b91c1c"/>
  <text x="56" y="804" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <text x="84" y="805" font-size="17" font-weight="bold" fill="#111827">소멸 콜백</text>
  <text x="84" y="829" font-size="15" fill="#4b5563">(컨테이너 종료)</text>
  <rect x="250" y="784" width="260" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="262" y="804" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@PreDestroy</text>
  <line x1="270" y1="816" x2="270" y2="829" stroke="#64748b" stroke-width="2" marker-end="url(#down)"/>
  <rect x="250" y="832" width="260" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="262" y="852" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DisposableBean.destroy()</text>
  <line x1="270" y1="864" x2="270" y2="877" stroke="#64748b" stroke-width="2" marker-end="url(#down)"/>
  <rect x="250" y="880" width="260" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="262" y="900" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@Bean(destroyMethod = "...")</text>
</svg>
