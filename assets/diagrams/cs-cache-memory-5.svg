<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">False Sharing 발생 과정</title>
  <desc id="d">Core1은 counterA만, Core2는 counterB만 수정하지만 두 변수가 같은 64바이트 캐시 라인에 있어서, Core1이 쓸 때마다 Core2의 라인 전체가 무효화되고 매번 캐시 미스가 나 싱글 스레드보다 느려질 수도 있다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 코어 -->
  <rect x="230" y="24" width="150" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="305" y="53" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Core1</text>
  <rect x="440" y="24" width="150" height="46" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="515" y="53" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">Core2</text>

  <line x1="305" y1="74" x2="305" y2="144" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-b)"/>
  <text x="316" y="114" font-size="15" fill="#1d4ed8">이것만 수정</text>
  <line x1="515" y1="74" x2="515" y2="144" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-p)"/>
  <text x="526" y="114" font-size="15" fill="#6d28d9">이것만 수정</text>

  <!-- 캐시 라인 -->
  <text x="184" y="178" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">캐시 라인</text>
  <text x="184" y="200" font-size="15" fill="#4b5563" text-anchor="end">(64바이트)</text>
  <rect x="200" y="150" width="210" height="64" fill="#dbeafe"/>
  <rect x="410" y="150" width="210" height="64" fill="#ede9fe"/>
  <rect x="620" y="150" width="220" height="64" fill="#f3f4f6"/>
  <line x1="410" y1="150" x2="410" y2="214" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="620" y1="150" x2="620" y2="214" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="200" y="150" width="640" height="64" rx="4" fill="none" stroke="#111827" stroke-width="2.5"/>
  <text x="305" y="188" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">counterA</text>
  <text x="515" y="188" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">counterB</text>
  <text x="730" y="188" font-size="15" fill="#4b5563" text-anchor="middle">(padding)</text>

  <!-- 두 변수 묶음 -->
  <path d="M206,224 L206,232 L614,232 L614,224" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <text x="410" y="258" font-size="15" fill="#374151" text-anchor="middle">논리적으로는 아무 관계 없는 두 변수지만,</text>
  <text x="410" y="281" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">같은 캐시 라인에 있으므로</text>

  <!-- 결과 사슬 -->
  <rect x="24" y="310" width="200" height="68" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="124" y="350" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Core1이 쓸 때마다</text>
  <line x1="228" y1="344" x2="266" y2="344" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-k)"/>
  <rect x="270" y="310" width="270" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="405" y="338" font-size="16" fill="#111827" text-anchor="middle">Core2의 라인 전체가</text>
  <text x="405" y="362" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">무효화(Invalidate)</text>
  <line x1="544" y1="344" x2="582" y2="344" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-k)"/>
  <rect x="586" y="310" width="270" height="68" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="721" y="338" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">매번 캐시 미스</text>
  <text x="721" y="362" font-size="15" fill="#111827" text-anchor="middle">싱글 스레드보다 느려질 수도 있다</text>
</svg>
