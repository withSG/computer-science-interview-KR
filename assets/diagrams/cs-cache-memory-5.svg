<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">False Sharing을 피한다</title>
  <desc id="d">False Sharing 문제와 캐시 라인의 구조를 설명하는 다이어그램</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <text x="80" y="52" font-size="14" font-weight="bold" fill="#1f2933">캐시 라인 (64바이트)</text>
  <rect x="80" y="65" width="720" height="70" fill="none" stroke="#9aa5b1" stroke-width="2" rx="4"/>
  <rect x="82" y="67" width="228" height="66" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="195.0" y="104.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">counterA</text>
  <rect x="312" y="67" width="228" height="66" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="3"/>
  <text x="425.0" y="104.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">counterB</text>
  <rect x="542" y="67" width="256" height="66" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="4 3" rx="3"/>
  <text x="670.0" y="104.55" font-size="13" fill="#52606d" text-anchor="middle">(padding)</text>
  <path d="M195.0,205 L195.0,139" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="195.0" y="228" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Core1이</text>
  <text x="195.0" y="248" font-size="13" fill="#1f2933" text-anchor="middle">이것만 수정</text>
  <path d="M425.0,205 L425.0,139" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="425.0" y="228" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">Core2가</text>
  <text x="425.0" y="248" font-size="13" fill="#1f2933" text-anchor="middle">이것만 수정</text>
  <rect x="80" y="285" width="720" height="110" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="105" y="311" font-size="13" fill="#1f2933">논리적으로는 아무 관계 없는 두 변수지만,</text>
  <text x="105" y="335" font-size="13" fill="#1f2933">같은 캐시 라인에 있으므로 Core1이 쓸 때마다 Core2의 라인 전체가 <tspan font-weight="bold" fill="#dc2626">무효화(Invalidate)</tspan>된다.</text>
  <text x="105" y="365" font-size="13" font-weight="bold" fill="#dc2626">→ 매번 캐시 미스. 싱글 스레드보다 느려질 수도 있다.</text>
</svg>