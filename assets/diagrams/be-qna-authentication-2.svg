<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT 구조</title>
  <desc id="d">JWT 문자열 xxxxx.yyyyy.zzzzz 는 점으로 구분된 세 부분으로, 앞에서부터 Header(알고리즘), Payload(데이터), Signature(서명)이다.</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 토큰 문자열 -->
  <rect x="40" y="26" width="800" height="80" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="65" y="40" width="210" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="75" font-size="26" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">xxxxx</text>
  <text x="305" y="80" font-size="40" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.</text>
  <rect x="335" y="40" width="210" height="52" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="75" font-size="26" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">yyyyy</text>
  <text x="575" y="80" font-size="40" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.</text>
  <rect x="605" y="40" width="210" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="710" y="75" font-size="26" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">zzzzz</text>

  <!-- 연결선 -->
  <line x1="170" y1="110" x2="170" y2="146" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="440" y1="110" x2="440" y2="146" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="710" y1="110" x2="710" y2="146" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <!-- 각 부분 -->
  <rect x="45" y="150" width="250" height="114" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="182" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Header</text>
  <text x="170" y="210" font-size="17" fill="#111827" text-anchor="middle">알고리즘</text>
  <text x="170" y="244" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">alg · typ</text>

  <rect x="315" y="150" width="250" height="114" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="182" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">Payload</text>
  <text x="440" y="210" font-size="17" fill="#111827" text-anchor="middle">데이터</text>
  <text x="440" y="244" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">sub · name · iat · exp</text>

  <rect x="585" y="150" width="250" height="114" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="710" y="182" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">Signature</text>
  <text x="710" y="210" font-size="17" fill="#111827" text-anchor="middle">서명</text>
  <text x="710" y="244" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">header.payload + secret</text>
</svg>
