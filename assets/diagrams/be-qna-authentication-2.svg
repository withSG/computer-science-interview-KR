<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT 구조</title>
  <desc id="d">Header, Payload, Signature 세 부분으로 구성된 JWT 구조를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="280" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title/Header Section -->
  <text x="40" y="35" font-size="16" font-weight="bold" fill="#1f2933">JWT 구조</text>

  <!-- JWT Token Representation Outer Box -->
  <rect x="230" y="60" width="420" height="60" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Token Parts -->
  <rect x="240" y="70" width="120" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="94.5" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">xxxxx</text>

  <text x="370" y="95" font-size="20" font-weight="bold" fill="#52606d" text-anchor="middle">.</text>

  <rect x="380" y="70" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="94.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">yyyyy</text>

  <text x="510" y="95" font-size="20" font-weight="bold" fill="#52606d" text-anchor="middle">.</text>

  <rect x="520" y="70" width="120" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="580" y="94.5" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">zzzzz</text>

  <!-- Connecting Lines and Arrows -->
  <!-- Header Connection -->
  <path d="M300,120 L300,200 L300,200" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M300,200 L320,200" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Payload Connection -->
  <path d="M440,120 L440,170 L440,170" stroke="#059669" stroke-width="1.5" fill="none"/>
  <path d="M440,170 L460,170" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Signature Connection -->
  <path d="M580,120 L580,140 L580,140" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
  <path d="M580,140 L600,140" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Labels -->
  <!-- Header Label -->
  <rect x="325" y="180" width="180" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="204.5.5" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Header (알고리즘)</text>

  <!-- Payload Label -->
  <rect x="465" y="150" width="170" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="174.5" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">Payload (데이터)</text>

  <!-- Signature Label -->
  <rect x="605" y="120" width="170" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="690" y="144.5" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Signature (서명)</text>
</svg>