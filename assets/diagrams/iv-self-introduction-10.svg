<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1분 자기소개 3단 구조</title>
  <desc id="d">[1] 현재 좌표 10~15초, [2] 강점 + 근거 25~35초, [3] 지원 연결 10~15초를 차례로 말해 총 45~65초가 된다. 각 칸의 폭은 걸리는 시간에 비례하며, [2]에 심은 키워드가 다음 질문이 된다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 시간 순서 머리띠 (폭 = 시간 비율) -->
  <polygon points="24,24 206,24 220,52 206,80 24,80" fill="#1d4ed8"/>
  <polygon points="214,24 654,24 668,52 654,80 214,80 228,52" fill="#047857"/>
  <polygon points="662,24 842,24 856,52 842,80 662,80 676,52" fill="#b45309"/>

  <text x="115" y="47" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">[1] 현재 좌표</text>
  <text x="115" y="70" font-size="15" fill="#ffffff" text-anchor="middle">10~15초</text>
  <text x="441" y="47" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">[2] 강점 + 근거</text>
  <text x="441" y="70" font-size="15" fill="#ffffff" text-anchor="middle">25~35초</text>
  <text x="759" y="47" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">[3] 지원 연결</text>
  <text x="759" y="70" font-size="15" fill="#ffffff" text-anchor="middle">10~15초</text>

  <!-- [1] 현재 좌표 -->
  <rect x="24" y="88" width="182" height="168" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="38" y="116" font-size="16" font-weight="bold" fill="#1e3a8a">"저는 지금 누구인가"</text>
  <text x="38" y="148" font-size="15" fill="#1f2937">이름 + 지금 무엇을<tspan x="38" dy="22">하는 사람인지 한 문장</tspan></text>
  <text x="38" y="214" font-size="15" fill="#1d4ed8">※ 과거 연대기가<tspan x="38" dy="22">아니라 현재 위치</tspan></text>

  <!-- [2] 강점 + 근거 -->
  <rect x="214" y="88" width="440" height="168" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="228" y="116" font-size="16" font-weight="bold" fill="#064e3b">"그렇게 말할 수 있는 이유"</text>
  <text x="228" y="148" font-size="15" fill="#1f2937">강점 1~2개 + 각각을 뒷받침하는 구체 사건</text>
  <text x="228" y="214" font-size="15" font-weight="bold" fill="#047857">※ 여기 심은 키워드가 다음 질문이 된다</text>

  <!-- [3] 지원 연결 -->
  <rect x="662" y="88" width="182" height="168" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="676" y="116" font-size="16" font-weight="bold" fill="#78350f">"그래서 왜 여기인가"</text>
  <text x="676" y="148" font-size="15" fill="#1f2937">회사/직무의 구체적<tspan x="676" dy="22">무엇과 내 강점을</tspan><tspan x="676" dy="22">잇는다</tspan></text>

  <!-- 총 시간 -->
  <path d="M24,270 V280 H844 V270" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M434,280 V290" stroke="#374151" stroke-width="1.5" fill="none"/>
  <text x="434" y="314" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">총 45~65초</text>
</svg>
