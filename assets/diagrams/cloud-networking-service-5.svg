<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LoadBalancer 하나 뒤의 Ingress 라우팅</title>
  <desc id="d">인터넷 트래픽이 외부에 노출된 LoadBalancer 1개와 Ingress Controller를 거친 뒤, Host: shop.example.com 요청 중 /api/v1/cart 경로는 ClusterIP cart-svc로, 그 외 전부(/)는 ClusterIP storefront-svc로 가서 각 Pods에 닿는다.</desc>
  <rect width="880" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 인터넷 -->
  <rect x="290" y="24" width="140" height="40" rx="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="50" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">인터넷</text>
  <line x1="360" y1="64" x2="360" y2="96" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- LoadBalancer -->
  <rect x="210" y="100" width="300" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="134" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">LoadBalancer 1개</text>
  <line x1="514" y1="128" x2="534" y2="128" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="544" y="123" font-size="15" font-weight="bold" fill="#1e3a8a">여기만 외부 노출</text>
  <text x="544" y="145" font-size="15" fill="#374151">인증서도 여기</text>

  <line x1="360" y1="156" x2="360" y2="192" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Ingress Controller -->
  <rect x="210" y="196" width="300" height="72" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="360" y="226" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Ingress Controller</text>
  <text x="360" y="251" font-size="15" fill="#4b5563" text-anchor="middle">(nginx / traefik 등)</text>
  <line x1="514" y1="232" x2="534" y2="232" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="544" y="227" font-size="15" fill="#374151">실제로 트래픽을 처리하는 Pod</text>
  <text x="544" y="249" font-size="15" fill="#374151">Ingress 규칙을 읽어 설정으로 변환</text>

  <line x1="360" y1="268" x2="360" y2="296" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Host 조건 -->
  <rect x="236" y="300" width="248" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="360" y="326" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Host: shop.example.com</text>
  <line x1="494" y1="320" x2="534" y2="320" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="544" y="325" font-size="15" fill="#374151">호스트·경로를 보고 서비스로 분기 (L7)</text>

  <!-- 분기 -->
  <path d="M360,340 L360,364" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M360,364 L220,364 L220,436" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M360,364 L500,364 L500,436" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ah-green)"/>
  <text x="208" y="406" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/api/v1/cart</text>
  <text x="512" y="406" font-size="16" font-weight="bold" fill="#047857">그 외 전부 (/)</text>

  <!-- ClusterIP 서비스 -->
  <rect x="110" y="440" width="220" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="220" y="466" font-size="15" fill="#374151" text-anchor="middle">ClusterIP</text>
  <text x="220" y="492" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">cart-svc</text>

  <rect x="390" y="440" width="220" height="68" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="500" y="466" font-size="15" fill="#374151" text-anchor="middle">ClusterIP</text>
  <text x="500" y="492" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">storefront-svc</text>

  <line x1="220" y1="508" x2="220" y2="542" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="500" y1="508" x2="500" y2="542" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Pods -->
  <rect x="150" y="546" width="140" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="220" y="576" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Pods</text>
  <rect x="430" y="546" width="140" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="500" y="576" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Pods</text>
</svg>
