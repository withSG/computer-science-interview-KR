<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레이어 단방향 import 규칙</title>
  <desc id="d">app → features → entities → shared 순으로 위 레이어만 아래 레이어를 import할 수 있다. 형제 기능인 features/auth와 features/order는 서로 import할 수 없고, shared/Button.tsx가 features/auth를 import하는 것처럼 아래에서 위로 향하면 규칙 위반이다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="no" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- app -->
  <rect x="120" y="24" width="500" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="370" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">app</text>
  <text x="644" y="55" font-size="15" fill="#4b5563">라우팅, 프로바이더</text>

  <line x1="370" y1="78" x2="370" y2="128" stroke="#047857" stroke-width="2" marker-end="url(#ok)"/>
  <text x="384" y="108" font-size="15" font-weight="bold" fill="#047857">import 가능</text>

  <!-- features -->
  <rect x="120" y="130" width="500" height="150" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="370" y="158" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">features</text>
  <text x="644" y="205" font-size="15" fill="#4b5563">기능</text>

  <rect x="144" y="174" width="180" height="52" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="234" y="205" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">features/auth</text>
  <rect x="416" y="174" width="180" height="52" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="506" y="205" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">features/order</text>

  <line x1="330" y1="200" x2="410" y2="200" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#no)" marker-end="url(#no)"/>
  <circle cx="370" cy="200" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <path d="M364.5,194.5 L375.5,205.5 M375.5,194.5 L364.5,205.5" stroke="#b91c1c" stroke-width="2.5" fill="none"/>
  <text x="370" y="258" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">형제끼리는 금지</text>

  <line x1="370" y1="282" x2="370" y2="332" stroke="#047857" stroke-width="2" marker-end="url(#ok)"/>
  <text x="384" y="312" font-size="15" font-weight="bold" fill="#047857">import 가능</text>

  <!-- entities -->
  <rect x="120" y="334" width="500" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="370" y="366" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">entities</text>
  <text x="644" y="365" font-size="15" fill="#4b5563">도메인 개체</text>

  <line x1="370" y1="388" x2="370" y2="438" stroke="#047857" stroke-width="2" marker-end="url(#ok)"/>
  <text x="384" y="418" font-size="15" font-weight="bold" fill="#047857">import 가능</text>

  <!-- shared -->
  <rect x="120" y="440" width="500" height="52" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="370" y="472" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">shared</text>
  <text x="644" y="471" font-size="15" fill="#4b5563">도메인 모름</text>
  <rect x="144" y="452" width="116" height="28" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="202" y="471" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Button.tsx</text>

  <!-- 위반: 아래에서 위로 import -->
  <path d="M142,466 H70 V200 H138" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#no)"/>
  <rect x="32" y="321" width="76" height="26" rx="4" fill="#ffffff"/>
  <text x="70" y="339" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">✕ 위반</text>

  <!-- 설명 -->
  <rect x="24" y="516" width="832" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="548" font-size="16" font-weight="bold" fill="#111827">아래 레이어는 위 레이어를 절대 모른다.</text>
  <text x="48" y="580" font-size="15" fill="#b91c1c">✕ <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">shared/Button.tsx</tspan> 안에 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">features/auth</tspan>가 import돼 있다면 규칙 위반이다.</text>
</svg>
