<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레이어 구조</title>
  <desc id="d">UI Layer(컴포넌트, JSX)가 Business Logic Layer(커스텀 훅, 서비스)에, Business Logic Layer가 Data Access Layer(API 호출 함수, React Query)에 의존하는 단방향 구조. 하위 레이어가 상위 레이어에 의존하는 역방향은 금지된다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 상위 / 하위 표시 -->
  <text x="40" y="66" font-size="15" fill="#4b5563">상위</text>
  <text x="40" y="322" font-size="15" fill="#4b5563">하위</text>

  <!-- UI Layer -->
  <rect x="96" y="24" width="544" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="66" font-size="18" font-weight="bold" fill="#1d4ed8">UI Layer</text>
  <rect x="348" y="43" width="88" height="34" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="392" y="66" font-size="15" fill="#111827" text-anchor="middle">컴포넌트</text>
  <rect x="446" y="43" width="60" height="34" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="476" y="66" font-size="15" fill="#111827" text-anchor="middle">JSX</text>

  <!-- 의존 화살표 1 -->
  <line x1="210" y1="98" x2="210" y2="148" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="224" y="129" font-size="15" fill="#374151">의존</text>

  <!-- Business Logic Layer -->
  <rect x="96" y="152" width="544" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="194" font-size="18" font-weight="bold" fill="#6d28d9">Business Logic Layer</text>
  <rect x="348" y="171" width="92" height="34" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="394" y="194" font-size="15" fill="#111827" text-anchor="middle">커스텀 훅</text>
  <rect x="450" y="171" width="74" height="34" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="487" y="194" font-size="15" fill="#111827" text-anchor="middle">서비스</text>

  <!-- 의존 화살표 2 -->
  <line x1="210" y1="226" x2="210" y2="276" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="224" y="257" font-size="15" fill="#374151">의존</text>

  <!-- Data Access Layer -->
  <rect x="96" y="280" width="544" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="120" y="322" font-size="18" font-weight="bold" fill="#047857">Data Access Layer</text>
  <rect x="348" y="299" width="124" height="34" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="410" y="322" font-size="15" fill="#111827" text-anchor="middle">API 호출 함수</text>
  <rect x="482" y="299" width="128" height="34" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="546" y="322" font-size="15" fill="#111827" text-anchor="middle">React Query</text>

  <!-- 역방향 금지 -->
  <line x1="690" y1="346" x2="690" y2="32" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ah-red)"/>
  <circle cx="690" cy="188" r="13" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <line x1="684" y1="182" x2="696" y2="194" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="696" y1="182" x2="684" y2="194" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="716" y="172" font-size="16" font-weight="bold" fill="#b91c1c">역방향 의존 금지</text>
  <text x="716" y="198" font-size="15" fill="#374151">하위 레이어는</text>
  <text x="716" y="220" font-size="15" fill="#374151">상위 레이어를 모름</text>
</svg>
