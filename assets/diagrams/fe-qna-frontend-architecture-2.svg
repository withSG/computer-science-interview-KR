<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레이어 구조</title>
  <desc id="d">프론트엔드 아키텍처의 레이어 구조와 단방향 의존 관계를 나타낸 다이어그램입니다.</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- UI Layer -->
  <rect x="120" y="40" width="240" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="74.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">UI Layer</text>

  <!-- UI Layer -> 오른쪽 설명 -->
  <path d="M360,70 L420,70" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="435" y="74.5" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2933">컴포넌트, JSX</text>

  <!-- UI Layer -> Business Logic Layer 의존 화살표 -->
  <path d="M240,100 L240,160" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="210" y="119" width="60" height="22" rx="4" fill="#ffffff"/>
  <text x="240" y="134" text-anchor="middle" font-size="11.5" fill="#52606d">(의존)</text>

  <!-- Business Logic Layer -->
  <rect x="120" y="160" width="240" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="240" y="194.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Business Logic Layer</text>

  <!-- Business Logic Layer -> 오른쪽 설명 -->
  <path d="M360,190 L420,190" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="435" y="194.5" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2933">커스텀 훅, 서비스</text>

  <!-- Business Logic Layer -> Data Access Layer 의존 화살표 -->
  <path d="M240,220 L240,280" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="210" y="239" width="60" height="22" rx="4" fill="#ffffff"/>
  <text x="240" y="254" text-anchor="middle" font-size="11.5" fill="#52606d">(의존)</text>

  <!-- Data Access Layer -->
  <rect x="120" y="280" width="240" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="240" y="314.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Data Access Layer</text>

  <!-- Data Access Layer -> 오른쪽 설명 -->
  <path d="M360,310 L420,310" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="435" y="314.5" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2933">API 호출 함수, React Query</text>
</svg>