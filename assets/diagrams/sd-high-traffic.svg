<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 830" width="880" height="830" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">계층별 트래픽 흡수 깔때기</title>
  <desc id="d">초당 1,000,000건 요청이 ① CDN·브라우저 캐시에서 100,000건, ② 로드 밸런서·API Gateway에서 80,000건, ③ 애플리케이션과 Redis 캐시에서 8,000건으로 줄어 ④ DB에 도달한다. 오른쪽 열은 각 계층을 늘리기가 사실상 무제한에서 어려움으로 바뀌는 것을 보여준다.</desc>
  <rect width="880" height="830" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 입력 -->
  <text x="362" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">1,000,000 req/s</text>
  <line x1="362" y1="56" x2="362" y2="77" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="788" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">늘리기</text>

  <!-- ① CDN -->
  <rect x="24" y="80" width="676" height="120" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="112" font-size="18" font-weight="bold" fill="#111827">① CDN / 브라우저 캐시</text>
  <text x="44" y="138" font-size="15" fill="#1f2937">정적 파일, 이미지, 캐시 가능한 API 응답</text>
  <text x="44" y="162" font-size="15" fill="#1f2937">여기서 끝난 요청은 원본 서버 비용이 0</text>
  <text x="44" y="186" font-size="14" fill="#4b5563">수단: 엣지 캐시, 정적 자산 분리</text>
  <rect x="728" y="118" width="120" height="44" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="788" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">사실상 무제한</text>

  <!-- ① → ② -->
  <line x1="362" y1="202" x2="362" y2="257" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="378" y="236"><tspan font-size="17" font-weight="bold" fill="#111827">100,000 req/s</tspan><tspan dx="10" font-size="15" fill="#4b5563">(90% 흡수)</tspan></text>

  <!-- ② LB / Gateway -->
  <rect x="62" y="260" width="600" height="98" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="82" y="292" font-size="18" font-weight="bold" fill="#111827">② 로드 밸런서 / API Gateway</text>
  <text x="82" y="318" font-size="15" fill="#1f2937">요청 수 제한, 봇 차단, 인증 실패 조기 거절</text>
  <text x="82" y="342" font-size="14" fill="#4b5563">수단: WAF · 대상: 봇, 매크로, 잘못된 요청</text>
  <rect x="728" y="287" width="120" height="44" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="788" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">쉬움</text>

  <!-- ② → ③ -->
  <line x1="362" y1="360" x2="362" y2="415" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="378" y="394"><tspan font-size="17" font-weight="bold" fill="#111827">80,000 req/s</tspan><tspan dx="10" font-size="15" fill="#4b5563">(20,000 차단·거절, 요청 수 초과분은 429)</tspan></text>

  <!-- ③ 애플리케이션 + Redis -->
  <rect x="100" y="418" width="524" height="120" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="120" y="450" font-size="18" font-weight="bold" fill="#111827">③ 애플리케이션 + Redis 캐시</text>
  <text x="120" y="476" font-size="15" fill="#1f2937">캐시 적중이면 DB에 가지 않는다</text>
  <text x="120" y="500" font-size="15" fill="#1f2937">무거운 작업은 큐로 넘긴다</text>
  <text x="120" y="524" font-size="14" fill="#4b5563">수단: 캐시, 비동기화, 무상태 설계 · 대상: 반복 조회, 즉시성 없는 작업</text>
  <rect x="728" y="452" width="120" height="52" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="788" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">쉬움</text>
  <text x="788" y="494" text-anchor="middle" font-size="14" fill="#047857">(무상태라면)</text>

  <!-- ③ → ④ -->
  <line x1="362" y1="540" x2="362" y2="595" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="378" y="574"><tspan font-size="17" font-weight="bold" fill="#111827">8,000 req/s</tspan><tspan dx="10" font-size="15" fill="#4b5563">(캐시 적중률 90% 가정)</tspan></text>

  <!-- ④ DB -->
  <rect x="138" y="598" width="448" height="98" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="158" y="630" font-size="18" font-weight="bold" fill="#b91c1c">④ DB — 가장 비싸고 가장 늘리기 어렵다</text>
  <text x="158" y="656" font-size="15" fill="#1f2937">여기까지 온 것은 다 처리해야 한다</text>
  <text x="158" y="680" font-size="14" fill="#4b5563">수단: 읽기 복제본, 샤딩, 인덱스</text>
  <rect x="728" y="625" width="120" height="44" rx="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="788" y="652" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">어려움</text>

  <!-- 결론 -->
  <rect x="24" y="726" width="832" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="758" font-size="17" font-weight="bold" fill="#111827">위로 갈수록 늘리기 쉽고, 아래로 갈수록 어렵다</text>
  <text x="44" y="786" font-size="15" fill="#374151">모든 최적화는 아래 계층에 도달하는 요청 수를 줄이는 방향으로 간다</text>
</svg>
