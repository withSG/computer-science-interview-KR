<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정상 TLS와 중간자 공격의 채널 비교</title>
  <desc id="d">정상 통신은 Client와 Server 사이에 하나의 TLS 암호화 채널이 있지만, MITM에서는 Attacker가 TLS 채널 A와 B를 따로 맺고 가운데서 풀어 평문을 읽은 뒤 다시 암호화해 전달하며, 양쪽 모두 정상 통신으로 인식합니다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- ===== 정상 ===== -->
  <rect x="32" y="22" width="68" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="66" y="44" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">정상</text>

  <!-- TLS 채널 (파이프) -->
  <rect x="184" y="84" width="512" height="32" fill="#dbeafe"/>
  <line x1="184" y1="84" x2="696" y2="84" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="184" y1="116" x2="696" y2="116" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="106" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">TLS</text>
  <text x="440" y="146" font-size="15" fill="#4b5563" text-anchor="middle">하나의 암호화 채널</text>

  <rect x="40" y="72" width="140" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="106" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>
  <rect x="700" y="72" width="140" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="770" y="106" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>

  <!-- 구분선 -->
  <line x1="32" y1="176" x2="848" y2="176" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- ===== MITM ===== -->
  <rect x="32" y="196" width="80" height="32" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="72" y="218" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">MITM</text>

  <!-- TLS 채널 A -->
  <rect x="184" y="258" width="182" height="32" fill="#dbeafe"/>
  <line x1="184" y1="258" x2="366" y2="258" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="184" y1="290" x2="366" y2="290" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="275" y="280" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">TLS 채널 A</text>

  <!-- TLS 채널 B -->
  <rect x="514" y="258" width="182" height="32" fill="#dbeafe"/>
  <line x1="514" y1="258" x2="696" y2="258" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="514" y1="290" x2="696" y2="290" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="605" y="280" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">TLS 채널 B</text>

  <rect x="40" y="246" width="140" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="280" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>
  <rect x="370" y="246" width="140" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="440" y="280" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">Attacker</text>
  <rect x="700" y="246" width="140" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="770" y="280" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>

  <!-- Attacker 설명 -->
  <line x1="440" y1="302" x2="440" y2="326" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="196" y="326" width="488" height="110" rx="8" fill="#fff7f7" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="358" font-size="16" fill="#111827" text-anchor="middle">채널 A를 풀어서 <tspan font-weight="bold" fill="#b91c1c">평문을 읽고,</tspan></text>
  <text x="440" y="384" font-size="16" fill="#111827" text-anchor="middle">채널 B로 다시 암호화해 전달한다.</text>
  <text x="440" y="418" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">양쪽 모두 정상 통신으로 인식한다.</text>
</svg>
