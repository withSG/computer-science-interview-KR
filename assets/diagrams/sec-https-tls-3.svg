<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">중간자 공격은 어떤 조건에서 성립하는가</title>
  <desc id="d">정상 TLS 통신과 중간자 공격(MITM)의 TLS 채널 구조 비교 다이어그램</desc>
  <defs>
    <!-- Normal / Ink Marker -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <!-- Attacker / Red Marker -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <!-- Sub-line Marker -->
    <marker id="a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- ==================== SECTION 1: [ 정상 ] ==================== -->
  <g transform="translate(0, 0)">
    <!-- Group Label -->
    <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">[ 정상 ]</text>

    <!-- Normal Flow Box: Client -->
    <rect x="70" y="65" width="110" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="92" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Client</text>

    <!-- Connection Line: TLS -->
    <path d="M180,87 L700,87" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    
    <!-- TLS Label Box -->
    <rect x="365" y="74" width="150" height="26" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="440" y="91" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">TLS</text>

    <!-- Normal Flow Box: Server -->
    <rect x="700" y="65" width="110" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="755" y="92" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Server</text>

    <!-- Sub explanation -->
    <text x="440" y="125" font-size="12" fill="#52606d" text-anchor="middle">(하나의 암호화 채널)</text>
  </g>

  <!-- Horizontal Divider -->
  <line x1="40" y1="150" x2="840" y2="150" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== SECTION 2: [ MITM ] ==================== -->
  <g transform="translate(0, 160)">
    <!-- Group Label -->
    <text x="40" y="35" font-size="16" font-weight="bold" fill="#dc2626">[ MITM ]</text>

    <!-- MITM Flow Box: Client -->
    <rect x="70" y="55" width="110" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="82" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Client</text>

    <!-- Channel A Line -->
    <path d="M180,77 L385,77" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <!-- Channel A Label -->
    <rect x="225" y="64" width="115" height="26" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="282.5" y="81" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">TLS 채널 A</text>

    <!-- MITM Flow Box: Attacker -->
    <rect x="385" y="55" width="110" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="440" y="82" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Attacker</text>

    <!-- Channel B Line -->
    <path d="M495,77 L700,77" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <!-- Channel B Label -->
    <rect x="540" y="64" width="115" height="26" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="597.5" y="81" font-size="12.5" font-weight="bold" fill="#dc2626" text-anchor="middle">TLS 채널 B</text>

    <!-- MITM Flow Box: Server -->
    <rect x="700" y="55" width="110" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="755" y="82" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Server</text>

    <!-- Attacker Annotation Lines and Text -->
    <!-- Vertical connector from Attacker -->
    <path d="M440,99 L440,122 L460,122" stroke="#52606d" stroke-width="1.5" fill="none"/>

    <!-- Annotation Box -->
    <rect x="460" y="108" width="350" height="64" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="472" y="131" font-size="12" fill="#1f2933">채널 A를 풀어서 평문을 읽고,</text>
    <text x="472" y="149" font-size="12" fill="#1f2933">채널 B로 다시 암호화해 전달한다.</text>
    <text x="472" y="167" font-size="12" fill="#1f2933">양쪽 모두 정상 통신으로 인식한다.</text>
  </g>
</svg>