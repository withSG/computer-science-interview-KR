<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DNS 조회 순서</title>
  <desc id="d">DNS 조회가 브라우저 캐시, OS 캐시, 라우터, ISP DNS, Root DNS 순서로 이어지는 흐름을 왼쪽에서 오른쪽으로 보여준다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="120" fill="#ffffff"/>

  <g fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5">
    <rect x="24" y="28" width="128" height="64" rx="10"/>
    <rect x="200" y="28" width="128" height="64" rx="10"/>
    <rect x="376" y="28" width="128" height="64" rx="10"/>
    <rect x="552" y="28" width="128" height="64" rx="10"/>
    <rect x="728" y="28" width="128" height="64" rx="10"/>
  </g>

  <g fill="#1e3a8a" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="88" y="65.5">브라우저 캐시</text>
    <text x="264" y="65.5">OS 캐시</text>
    <text x="440" y="65.5">라우터</text>
    <text x="616" y="65.5">ISP DNS</text>
    <text x="792" y="65.5">Root DNS</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M158,60 L194,60"/>
    <path d="M334,60 L370,60"/>
    <path d="M510,60 L546,60"/>
    <path d="M686,60 L722,60"/>
  </g>
</svg>
