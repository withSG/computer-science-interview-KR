<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브라우저 이벤트 루프의 한 사이클</title>
  <desc id="d">태스크 큐 실행, 마이크로태스크 큐 비우기, 렌더링 기회 단계로 구성된 브라우저 이벤트 루프의 한 사이클과 반복 과정 다이어그램</desc>
  <rect width="880" height="630" fill="#ffffff"/>

  <defs>
    <!-- Arrow markers -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Main Outer Container Box -->
  <rect x="40" y="30" width="800" height="510" rx="12" ry="12" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  
  <!-- Outer Title Header Box -->
  <rect x="230" y="15" width="420" height="32" rx="16" ry="16" fill="#1f2933"/>
  <text x="440" y="36" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">한 번의 반복(tick)</text>

  <!-- Step 1 Box -->
  <rect x="70" y="70" width="740" height="90" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="106" fill="#1f2933" font-size="15" font-weight="bold" text-anchor="middle">1. 태스크 큐에서 태스크 하나를 꺼내 끝까지 실행</text>
  <text x="440" y="136" fill="#52606d" font-size="13" text-anchor="middle">(중간에 끊기지 않는다 = run-to-completion)</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,160 L440,198" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 Box -->
  <rect x="70" y="200" width="740" height="90" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="236" fill="#1f2933" font-size="15" font-weight="bold" text-anchor="middle">2. 마이크로태스크 큐를 전부 비운다</text>
  <text x="440" y="266" fill="#52606d" font-size="13" text-anchor="middle">(처리 중 새로 추가된 것도 이번에 다 처리)</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,290 L440,328" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 3 Box Container -->
  <rect x="70" y="330" width="740" height="180" rx="8" ry="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="361" fill="#1f2933" font-size="15" font-weight="bold" text-anchor="middle">3. 렌더링 기회 (필요할 때만, 대략 화면 주사율에 맞춰)</text>

  <!-- Sub-item 1 -->
  <text x="130" y="401" fill="#059669" font-size="14" font-weight="bold">├</text>
  <text x="150" y="401" fill="#1f2933" font-size="13.5">requestAnimationFrame 콜백 실행</text>

  <!-- Sub-item 2 -->
  <text x="130" y="438" fill="#059669" font-size="14" font-weight="bold">├</text>
  <text x="150" y="438" fill="#1f2933" font-size="13.5">스타일 계산 → 레이아웃 → 페인트 → 합성</text>

  <!-- Sub-item 3 -->
  <text x="130" y="475" fill="#059669" font-size="14" font-weight="bold">└</text>
  <text x="150" y="475" fill="#52606d" font-size="13">이 단계는 매 tick마다 일어나지 않는다</text>

  <!-- Loop Arrow and Text -->
  <path d="M 440,540 Q 420,580 435,580" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
  <path d="M 435,580 A 12,12 0 1,0 445,568" stroke="#1f2933" stroke-width="2" fill="none"/>
  <text x="465" y="582" fill="#1f2933" font-size="15" font-weight="bold">반복</text>
</svg>