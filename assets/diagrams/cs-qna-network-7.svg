<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Non-blocking I/O (동기 논블로킹)</title>
  <desc id="d">Non-blocking I/O 모델의 흐름, 특징 및 예시를 보여주는 SVG 다이어그램</desc>

  <defs>
    <!-- Arrow Markers -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- Title Section Header -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">2. Non-blocking I/O (동기 논블로킹)</text>
  <line x1="30" y1="50" x2="850" y2="50" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Flow Section -->
  <!-- Step 1: read() 호출 -->
  <rect x="30" y="80" width="80" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="103" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">호출자</text>

  <path d="M110,98 L200,98" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="200" y="80" width="120" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="103" font-size="13" fill="#1f2933" text-anchor="middle">read() 호출</text>

  <path d="M320,98 L410,98" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="410" y="80" width="310" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="565" y="103" font-size="13" fill="#1f2933" text-anchor="middle">즉시 반환 (EAGAIN/EWOULDBLOCK)</text>

  <!-- Step 2: 다른 작업 -->
  <path d="M110,138 L410,138" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M110,125 L110,150" stroke="#cbd2d9" stroke-width="1"/>

  <rect x="410" y="126" width="120" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="470" y="149" font-size="13" fill="#1f2933" text-anchor="middle">다른 작업</text>

  <!-- Step 3: read() 재호출 (폴링) -->
  <path d="M110,184 L410,184" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M110,165 L110,195" stroke="#cbd2d9" stroke-width="1"/>

  <path d="M320,184 L410,184" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="410" y="172" width="180" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="195" font-size="13" fill="#1f2933" text-anchor="middle">read() 재호출 (폴링)</text>

  <!-- Step 4: ...반복... -->
  <path d="M110,230 L410,230" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M110,210 L110,240" stroke="#cbd2d9" stroke-width="1"/>

  <text x="420" y="235" font-size="13" font-weight="bold" fill="#52606d">...반복...</text>

  <!-- Step 5: 데이터 있으면 반환 -->
  <path d="M110,276 L410,276" stroke="#059669" stroke-width="1.5" fill="none"/>
  <path d="M110,255 L110,285" stroke="#cbd2d9" stroke-width="1"/>

  <path d="M320,276 L410,276" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="410" y="258" width="180" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="281" font-size="13" fill="#1f2933" text-anchor="middle">데이터 있으면 반환</text>

  <!-- Features Section -->
  <rect x="30" y="320" width="820" height="110" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="50" y="348" font-size="14" font-weight="bold" fill="#d97706">특징:</text>
  <text x="70" y="376" font-size="13" fill="#1f2933">- 호출자가 계속 확인해야 함 (Busy Waiting)</text>
  <text x="70" y="404" font-size="13" fill="#1f2933">- CPU 낭비 발생 가능</text>

  <!-- Example Section -->
  <rect x="30" y="445" width="820" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="50" y="475" font-size="13" font-weight="bold" fill="#1f2933">예:</text>
  <text x="80" y="475" font-size="13" fill="#52606d">Unix Non-blocking 소켓 + read() 반복 호출</text>
</svg>