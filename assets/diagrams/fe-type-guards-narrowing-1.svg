<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">분기마다 좁혀지고 합류하면 다시 합쳐지는 v의 타입</title>
  <desc id="d">function f(v: string | number | null)에서 v === null 검사와 typeof v === "string" 검사를 거치며 v의 타입이 null, string, number로 좁혀지는 과정. null 경로는 return으로 끊기고, string과 number 분기가 합류하는 지점에서 v는 다시 string | number가 된다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <rect x="660" y="92" width="36" height="22" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="708" y="108" font-size="14" fill="#374151">그 지점의 v 타입</text>
  <polygon points="660,139 668,128 688,128 696,139 688,150 668,150" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="708" y="144" font-size="14" fill="#374151">타입 가드(검사)</text>

  <!-- 함수 시그니처 -->
  <rect x="250" y="24" width="380" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="49" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">function f(v: string | number | null)</text>
  <line x1="440" y1="64" x2="440" y2="86" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>

  <!-- 시작 타입 -->
  <rect x="300" y="90" width="280" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="115" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">v: string | number | null</text>
  <line x1="440" y1="130" x2="440" y2="146" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>

  <!-- 검사 1: v === null? -->
  <polygon points="350,172 372,150 508,150 530,172 508,194 372,194" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="177" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">v === null?</text>

  <!-- yes → v: null -->
  <path d="M350,172 H160 V236" fill="none" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>
  <text x="170" y="216" font-size="15" font-weight="bold" fill="#374151">yes</text>
  <rect x="90" y="240" width="140" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="265" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">v: null</text>
  <line x1="160" y1="280" x2="160" y2="306" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>
  <rect x="110" y="310" width="100" height="36" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="333" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">return</text>
  <text x="160" y="372" font-size="14" fill="#4b5563" text-anchor="middle"><tspan x="160" dy="0">흐름이 끊겨</tspan><tspan x="160" dy="20">합류 지점에 오지 않음</tspan></text>

  <!-- no → v: string | number -->
  <path d="M530,172 H600 V236" fill="none" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>
  <text x="610" y="216" font-size="15" font-weight="bold" fill="#374151">no</text>
  <rect x="490" y="240" width="220" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="600" y="265" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">v: string | number</text>
  <line x1="600" y1="280" x2="600" y2="306" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>

  <!-- 검사 2: typeof v === "string"? -->
  <polygon points="465,332 487,310 713,310 735,332 713,354 487,354" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="600" y="337" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">typeof v === "string"?</text>

  <!-- yes → v: string -->
  <path d="M465,332 H420 V406" fill="none" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>
  <text x="430" y="386" font-size="15" font-weight="bold" fill="#374151">yes</text>
  <rect x="345" y="410" width="150" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="420" y="435" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">v: string</text>

  <!-- no → v: number -->
  <path d="M735,332 H770 V406" fill="none" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>
  <text x="780" y="386" font-size="15" font-weight="bold" fill="#374151">no</text>
  <rect x="695" y="410" width="150" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="770" y="435" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">v: number</text>

  <!-- 합류 -->
  <path d="M420,450 V486 H770 V450" fill="none" stroke="#4b5563" stroke-width="1.75"/>
  <line x1="600" y1="486" x2="600" y2="512" stroke="#4b5563" stroke-width="1.75" marker-end="url(#ah)"/>
  <rect x="430" y="516" width="340" height="48" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="600" y="546" text-anchor="middle"><tspan font-size="15" font-weight="bold" fill="#1f2937">(합류 지점) </tspan><tspan font-size="17" font-weight="bold" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">v: string | number</tspan></text>

  <!-- 요점 -->
  <rect x="40" y="512" width="350" height="56" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="215" y="535" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle"><tspan x="215" dy="0">분기가 합쳐지면</tspan><tspan x="215" dy="21">좁혀졌던 타입도 다시 합쳐진다</tspan></text>
  <line x1="392" y1="540" x2="426" y2="540" stroke="#6d28d9" stroke-width="1.75" stroke-dasharray="4 3"/>
</svg>
