<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">명령어 예시</title>
  <desc id="d">ADD R1, R2, R3은 R1 = R2 + R3(ALU 연산), LOAD R1, 100은 R1 = MEM[100](메모리 읽기), STORE R1, 200은 MEM[200] = R1(메모리 쓰기), JUMP 300은 PC = 300(분기)으로 동작한다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 표 틀 -->
  <rect x="24" y="24" width="832" height="284" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <path d="M24,68 V32 A8,8 0 0 1 32,24 H848 A8,8 0 0 1 856,32 V68 Z" fill="#f3f4f6"/>
  <path d="M24,68 H856" stroke="#d1d5db" stroke-width="1.5" fill="none"/>
  <path d="M24,128 H856 M24,188 H856 M24,248 H856" stroke="#e5e7eb" stroke-width="1" fill="none"/>

  <text x="64" y="51" font-size="15" font-weight="bold" fill="#374151">명령어</text>
  <text x="350" y="51" font-size="15" font-weight="bold" fill="#374151">동작</text>
  <text x="620" y="51" font-size="15" font-weight="bold" fill="#374151">종류</text>

  <!-- ADD -->
  <text x="64" y="104" font-size="18" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ADD R1, R2, R3</text>
  <path d="M262,98 H321" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="350" y="104" font-size="18" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">R1 = R2 + R3</text>
  <rect x="620" y="82" width="140" height="32" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="690" y="103" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ALU 연산</text>

  <!-- LOAD -->
  <text x="64" y="164" font-size="18" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">LOAD R1, 100</text>
  <path d="M262,158 H321" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="350" y="164" font-size="18" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">R1 = MEM[100]</text>
  <rect x="620" y="142" width="140" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="690" y="163" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">메모리 읽기</text>

  <!-- STORE -->
  <text x="64" y="224" font-size="18" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">STORE R1, 200</text>
  <path d="M262,218 H321" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="350" y="224" font-size="18" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">MEM[200] = R1</text>
  <rect x="620" y="202" width="140" height="32" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="690" y="223" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">메모리 쓰기</text>

  <!-- JUMP -->
  <text x="64" y="284" font-size="18" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">JUMP 300</text>
  <path d="M262,278 H321" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="350" y="284" font-size="18" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">PC = 300</text>
  <rect x="620" y="262" width="140" height="32" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="690" y="283" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">분기</text>
</svg>
