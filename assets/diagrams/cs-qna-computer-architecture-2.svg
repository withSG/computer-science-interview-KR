<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">명령어 예시</title>
  <desc id="d">CPU의 주요 명령어인 ADD, LOAD, STORE, JUMP의 구문과 실행 결과 및 연산 종류를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">명령어 예시</text>

  <!-- Row 1: ADD -->
  <g>
    <rect x="40" y="80" width="220" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="150" y="110" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">ADD R1, R2, R3</text>

    <path d="M270,105 L340,105" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <rect x="350" y="80" width="240" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="470" y="110" font-size="13" fill="#1f2933" text-anchor="middle">R1 = R2 + R3</text>

    <rect x="610" y="80" width="230" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="725" y="110" font-size="13" fill="#52606d" text-anchor="middle">(ALU 연산)</text>
  </g>

  <!-- Row 2: LOAD -->
  <g>
    <rect x="40" y="145" width="220" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="150" y="175" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">LOAD R1, 100</text>

    <path d="M270,170 L340,170" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <rect x="350" y="145" width="240" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="470" y="175" font-size="13" fill="#1f2933" text-anchor="middle">R1 = MEM[100]</text>

    <rect x="610" y="145" width="230" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="725" y="175" font-size="13" fill="#52606d" text-anchor="middle">(메모리 읽기)</text>
  </g>

  <!-- Row 3: STORE -->
  <g>
    <rect x="40" y="210" width="220" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="150" y="240" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">STORE R1, 200</text>

    <path d="M270,235 L340,235" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

    <rect x="350" y="210" width="240" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="470" y="240" font-size="13" fill="#1f2933" text-anchor="middle">MEM[200] = R1</text>

    <rect x="610" y="210" width="230" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="725" y="240" font-size="13" fill="#52606d" text-anchor="middle">(메모리 쓰기)</text>
  </g>

  <!-- Row 4: JUMP -->
  <g>
    <rect x="40" y="275" width="220" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="150" y="305" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">JUMP 300</text>

    <path d="M270,300 L340,300" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

    <rect x="350" y="275" width="240" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="470" y="305" font-size="13" fill="#1f2933" text-anchor="middle">PC = 300</text>

    <rect x="610" y="275" width="230" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="725" y="305" font-size="13" fill="#52606d" text-anchor="middle">(분기)</text>
  </g>
</svg>