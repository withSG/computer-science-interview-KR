<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 264" width="880" height="264" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">최적화 문제를 결정 문제로</title>
  <desc id="d">바로 풀기 어려운 최적화 문제 "조건을 만족하는 최댓값 x는 얼마인가?"를 계산하기 쉬운 결정 문제 "x일 때 조건을 만족하는가? (예/아니오)"로 바꿔치기한다.</desc>
  <rect width="880" height="264" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 최적화 문제 -->
  <rect x="24" y="24" width="832" height="76" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="48" y="68" font-size="18" font-weight="bold" fill="#111827">최적화 문제</text>
  <text x="200" y="68" font-size="17" fill="#111827">“조건을 만족하는 최댓값 x는 얼마인가?”</text>
  <rect x="660" y="44" width="172" height="36" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="746" y="67" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">바로 풀기 어렵다</text>

  <!-- 바꿔치기 -->
  <line x1="110" y1="108" x2="110" y2="155" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="128" y="138" font-size="16" font-weight="bold" fill="#1d4ed8">바꿔치기</text>

  <!-- 결정 문제 -->
  <rect x="24" y="164" width="832" height="76" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="48" y="208" font-size="18" font-weight="bold" fill="#111827">결정 문제</text>
  <text x="200" y="208" font-size="17" fill="#111827">“x일 때 조건을 만족하는가? (예/아니오)”</text>
  <rect x="660" y="184" width="172" height="36" rx="18" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="746" y="207" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">계산하기 쉽다</text>
</svg>
