<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">재시도 전략</title>
  <desc id="d">실패 시 재시도 단계 및 재시도 대상 조건을 나타낸 구조도</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">재시도 전략</text>

  <!-- Left Card: 실패 시 재시도 -->
  <rect x="30" y="60" width="395" height="430" rx="6" ry="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="50" y="93" font-size="14" font-weight="bold" fill="#1f2933">실패 시 재시도:</text>

  <!-- Step 1 -->
  <rect x="50" y="115" width="355" height="48" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="144" font-size="13" font-weight="bold" fill="#2563eb">- 1차:</text>
  <text x="125" y="144" font-size="13" fill="#1f2933">즉시</text>

  <!-- Arrow 1 to 2 -->
  <path d="M227.5,163 L227.5,183" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 -->
  <rect x="50" y="185" width="355" height="48" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="214" font-size="13" font-weight="bold" fill="#2563eb">- 2차:</text>
  <text x="125" y="214" font-size="13" fill="#1f2933">1분 후</text>

  <!-- Arrow 2 to 3 -->
  <path d="M227.5,233 L227.5,253" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3 -->
  <rect x="50" y="255" width="355" height="48" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="284" font-size="13" font-weight="bold" fill="#2563eb">- 3차:</text>
  <text x="125" y="284" font-size="13" fill="#1f2933">5분 후</text>

  <!-- Arrow 3 to 4 -->
  <path d="M227.5,303 L227.5,323" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4 -->
  <rect x="50" y="325" width="355" height="48" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="354" font-size="13" font-weight="bold" fill="#2563eb">- 4차:</text>
  <text x="125" y="354" font-size="13" fill="#1f2933">30분 후</text>

  <!-- Arrow 4 to Final -->
  <path d="M227.5,373 L227.5,393" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Final Failure Step -->
  <rect x="50" y="395" width="355" height="75" rx="4" ry="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="70" y="426" font-size="13" font-weight="bold" fill="#dc2626">- 최종 실패:</text>
  <text x="155" y="426" font-size="13" fill="#1f2933">DLQ 이동</text>

  <!-- Right Card: 재시도 대상 -->
  <rect x="455" y="60" width="395" height="430" rx="6" ry="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="475" y="93" font-size="14" font-weight="bold" fill="#1f2933">재시도 대상:</text>

  <!-- Rule 1: 네트워크 오류 -->
  <rect x="475" y="115" width="355" height="100" rx="4" ry="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="495" y="152" font-size="13" fill="#1f2933">- 네트워크 오류</text>
  <path d="M625,148 L655,148" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="665" y="152" font-size="13" font-weight="bold" fill="#059669">재시도</text>

  <!-- Rule 2: 유효하지 않은 토큰 -->
  <rect x="475" y="230" width="355" height="100" rx="4" ry="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="495" y="267" font-size="13" fill="#1f2933">- 유효하지 않은 토큰</text>
  <path d="M650,263 L680,263" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="690" y="267" font-size="13" font-weight="bold" fill="#dc2626">토큰 삭제, 재시도 안함</text>

  <!-- Rule 3: Rate limit -->
  <rect x="475" y="345" width="355" height="100" rx="4" ry="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="495" y="382" font-size="13" fill="#1f2933">- Rate limit</text>
  <path d="M580,378 L610,378" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="620" y="382" font-size="13" font-weight="bold" fill="#d97706">백오프 후 재시도</text>
</svg>