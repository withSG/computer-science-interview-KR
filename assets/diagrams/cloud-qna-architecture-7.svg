<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">알림 발송 재시도 전략</title>
  <desc id="d">실패 시 1차 즉시, 2차 1분 후, 3차 5분 후, 4차 30분 후에 재시도하고 최종 실패하면 DLQ로 옮긴다. 네트워크 오류는 재시도, 유효하지 않은 토큰은 토큰을 삭제하고 재시도하지 않으며, Rate limit은 백오프 후 재시도한다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. 실패 시 재시도 -->
  <text x="24" y="44" font-size="18" font-weight="bold" fill="#111827">실패 시 재시도</text>

  <rect x="24" y="64" width="136" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="92" y="98" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1차</text>
  <text x="92" y="126" font-size="16" fill="#111827" text-anchor="middle">즉시</text>
  <line x1="162" y1="106" x2="194" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="198" y="64" width="136" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="266" y="98" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2차</text>
  <text x="266" y="126" font-size="16" fill="#111827" text-anchor="middle">1분 후</text>
  <line x1="336" y1="106" x2="368" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="372" y="64" width="136" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="98" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3차</text>
  <text x="440" y="126" font-size="16" fill="#111827" text-anchor="middle">5분 후</text>
  <line x1="510" y1="106" x2="542" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="546" y="64" width="136" height="84" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="614" y="98" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4차</text>
  <text x="614" y="126" font-size="16" fill="#111827" text-anchor="middle">30분 후</text>
  <line x1="684" y1="106" x2="716" y2="106" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="720" y="64" width="136" height="84" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="788" y="98" font-size="18" font-weight="bold" fill="#991b1b" text-anchor="middle">최종 실패</text>
  <text x="788" y="126" font-size="16" fill="#111827" text-anchor="middle">DLQ 이동</text>

  <line x1="24" y1="180" x2="856" y2="180" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 2. 재시도 대상 -->
  <text x="24" y="216" font-size="18" font-weight="bold" fill="#111827">재시도 대상</text>

  <rect x="24" y="236" width="280" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="164" y="270" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">네트워크 오류</text>
  <line x1="306" y1="264" x2="374" y2="264" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="378" y="236" width="478" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="617" y="270" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">재시도</text>

  <rect x="24" y="308" width="280" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="164" y="342" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">유효하지 않은 토큰</text>
  <line x1="306" y1="336" x2="374" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="378" y="308" width="478" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="617" y="342" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">토큰 삭제, 재시도 안함</text>

  <rect x="24" y="380" width="280" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="164" y="414" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Rate limit</text>
  <line x1="306" y1="408" x2="374" y2="408" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="378" y="380" width="478" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="617" y="414" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">백오프 후 재시도</text>
</svg>
