<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">다층 방어 Security Model</title>
  <desc id="d">인터넷에서 시작하여 클라우드 보안 그룹, OS 방화벽, fail2ban, sshd 설정, 사용자/sudo 권한, SELinux/AppArmor로 이어지는 6단계 다층 방어 체계 다이어그램</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Top Level: 인터넷 -->
  <rect x="360" y="24" width="160" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="46.2" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">인터넷</text>

  <!-- Downward Arrow -->
  <path d="M440,60 L440,89" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>

  <!-- Layer 1: 클라우드 보안 그룹 / 네트워크 ACL -->
  <rect x="40" y="90" width="490" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="125.55" font-size="13" fill="#1f2933" font-weight="bold">1. 클라우드 보안 그룹 / 네트워크 ACL</text>
  <text x="560" y="125.55" font-size="13" fill="#52606d">어떤 IP가 어떤 포트에 닿는가</text>

  <!-- Layer 2: OS 방화벽 -->
  <rect x="40" y="160" width="490" height="60" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="56" y="195.55" font-size="13" fill="#1f2933" font-weight="bold">2. OS 방화벽 (iptables / firewalld / ufw)</text>
  <text x="560" y="195.55" font-size="13" fill="#52606d">인스턴스 내부의 두 번째 관문</text>

  <!-- Layer 3: fail2ban -->
  <rect x="40" y="230" width="490" height="60" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="56" y="265.55" font-size="13" fill="#1f2933" font-weight="bold">3. fail2ban</text>
  <text x="560" y="265.55" font-size="13" fill="#52606d">반복 실패한 IP를 자동 차단</text>

  <!-- Layer 4: sshd 설정 -->
  <rect x="40" y="300" width="490" height="60" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="335.55" font-size="13" fill="#1f2933" font-weight="bold">4. sshd 설정 (키 인증, root 금지, 사용자 제한)</text>
  <text x="560" y="335.55" font-size="13" fill="#52606d">누가 로그인할 수 있는가</text>

  <!-- Layer 5: 사용자/sudo 권한 -->
  <rect x="40" y="370" width="490" height="60" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="56" y="405.55" font-size="13" fill="#1f2933" font-weight="bold">5. 사용자/sudo 권한</text>
  <text x="560" y="405.55" font-size="13" fill="#52606d">들어온 뒤 무엇을 할 수 있는가</text>

  <!-- Layer 6: SELinux / AppArmor -->
  <rect x="40" y="440" width="490" height="60" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="56" y="475.55" font-size="13" fill="#1f2933" font-weight="bold">6. SELinux / AppArmor, 파일 권한</text>
  <text x="560" y="475.55" font-size="13" fill="#52606d">프로세스가 무엇에 접근할 수 있는가</text>
</svg>