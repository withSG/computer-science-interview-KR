<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">그래서 무엇을 어떻게 설정하나</title>
  <desc id="d">URL별 Cache-Control 설정 헤더와 그 설정 이유를 보여주는 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Background Cards -->
  <!-- Item 1: Static Asset -->
  <rect x="40" y="30" width="800" height="145" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Header box -->
  <rect x="55" y="45" width="770" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <!-- Cache-Control box -->
  <rect x="55" y="87" width="415" height="26" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>

  <!-- Item 2: Entrypoint -->
  <rect x="40" y="195" width="800" height="155" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <!-- Header box -->
  <rect x="55" y="210" width="770" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <!-- Cache-Control box -->
  <rect x="55" y="252" width="230" height="26" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>

  <!-- Item 3: User Response -->
  <rect x="40" y="370" width="800" height="135" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <!-- Header box -->
  <rect x="55" y="385" width="770" height="36" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <!-- Cache-Control box -->
  <rect x="55" y="427" width="280" height="26" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>

  <!-- Content: Item 1 -->
  <text x="70" y="70" font-size="16" font-weight="bold" fill="#2563eb">/assets/app.a3f9c1.js</text>
  <text x="320" y="69" font-size="13" fill="#52606d">← 파일명에 내용 해시가 들어간 정적 자산</text>
  
  <text x="65" y="104" font-size="13" font-weight="bold" fill="#1f2933">Cache-Control: public, max-age=31536000, immutable</text>
  
  <text x="55" y="134" font-size="13" font-weight="bold" fill="#1f2933">이유:</text>
  <text x="95" y="134" font-size="13" fill="#1f2933">내용이 바뀌면 파일명이 바뀐다. 같은 URL의 내용은 절대 안 바뀌므로</text>
  <text x="95" y="156" font-size="13" fill="#1f2933">1년이든 영원이든 캐시해도 안전하다. 재검증조차 필요 없다.</text>

  <!-- Content: Item 2 -->
  <text x="70" y="235" font-size="16" font-weight="bold" fill="#d97706">/index.html</text>
  <text x="210" y="234" font-size="13" fill="#52606d">← 어떤 자산을 불러올지 가리키는 진입점</text>

  <text x="65" y="269" font-size="13" font-weight="bold" fill="#1f2933">Cache-Control: no-cache</text>

  <text x="55" y="299" font-size="13" font-weight="bold" fill="#1f2933">이유:</text>
  <text x="95" y="299" font-size="13" fill="#1f2933">배포하면 참조하는 자산 파일명이 바뀐다. 이걸 캐시하면 사용자가</text>
  <text x="95" y="321" font-size="13" fill="#1f2933">옛날 자산을 계속 본다. 매번 재검증하되 안 바뀌었으면 304로 싸게 끝낸다.</text>

  <!-- Content: Item 3 -->
  <text x="70" y="410" font-size="16" font-weight="bold" fill="#dc2626">/api/me</text>
  <text x="180" y="409" font-size="13" fill="#52606d">← 사용자별 응답</text>

  <text x="65" y="444" font-size="13" font-weight="bold" fill="#1f2933">Cache-Control: private, no-store</text>

  <text x="55" y="474" font-size="13" font-weight="bold" fill="#1f2933">이유:</text>
  <text x="95" y="474" font-size="13" fill="#1f2933">CDN에 저장되면 다른 사용자에게 내 정보가 나갈 수 있다.</text>
</svg>