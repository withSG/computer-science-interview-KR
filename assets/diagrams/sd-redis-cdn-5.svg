<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">경로별 Cache-Control 설정</title>
  <desc id="d">해시가 붙은 정적 자산은 public, max-age=31536000, immutable로 영원히 캐시하고, 진입점 /index.html은 no-cache로 매번 재검증하며, 사용자별 응답 /api/me는 private, no-store로 저장을 막는 세 가지 설정과 그 이유.</desc>
  <rect width="880" height="560" fill="#ffffff"/>

  <!-- 1. 정적 자산 -->
  <rect x="24" y="24" width="832" height="164" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="48" y="62" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/assets/app.a3f9c1.js</text>
  <text x="300" y="61" font-size="15" fill="#374151">파일명에 내용 해시가 들어간 정적 자산</text>
  <rect x="708" y="42" width="128" height="30" rx="15" fill="#1d4ed8"/>
  <text x="772" y="62" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">영원히 캐시</text>
  <rect x="48" y="82" width="442" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="62" y="104" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Cache-Control: <tspan font-weight="bold" fill="#111827">public, max-age=31536000, immutable</tspan></text>
  <text x="48" y="146" font-size="15" font-weight="bold" fill="#111827">이유</text>
  <text x="96" y="146" font-size="15" fill="#1f2937">내용이 바뀌면 파일명이 바뀐다. 같은 URL의 내용은 절대 안 바뀌므로</text>
  <text x="96" y="168" font-size="15" fill="#1f2937">1년이든 영원이든 캐시해도 안전하다. 재검증조차 필요 없다.</text>

  <!-- 2. 진입점 HTML -->
  <rect x="24" y="208" width="832" height="164" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="48" y="246" font-size="18" font-weight="bold" fill="#b45309" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/index.html</text>
  <text x="300" y="245" font-size="15" fill="#374151">어떤 자산을 불러올지 가리키는 진입점</text>
  <rect x="708" y="226" width="128" height="30" rx="15" fill="#b45309"/>
  <text x="772" y="246" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">매번 재검증</text>
  <rect x="48" y="266" width="222" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="62" y="288" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Cache-Control: <tspan font-weight="bold" fill="#111827">no-cache</tspan></text>
  <text x="48" y="330" font-size="15" font-weight="bold" fill="#111827">이유</text>
  <text x="96" y="330" font-size="15" fill="#1f2937">배포하면 참조하는 자산 파일명이 바뀐다. 이걸 캐시하면 사용자가</text>
  <text x="96" y="352" font-size="15" fill="#1f2937">옛날 자산을 계속 본다. 매번 재검증하되 안 바뀌었으면 304로 싸게 끝낸다.</text>

  <!-- 3. 사용자별 응답 -->
  <rect x="24" y="392" width="832" height="142" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="48" y="430" font-size="18" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/api/me</text>
  <text x="300" y="429" font-size="15" fill="#374151">사용자별 응답</text>
  <rect x="708" y="410" width="128" height="30" rx="15" fill="#b91c1c"/>
  <text x="772" y="430" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">저장 금지</text>
  <rect x="48" y="450" width="294" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="62" y="472" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Cache-Control: <tspan font-weight="bold" fill="#111827">private, no-store</tspan></text>
  <text x="48" y="514" font-size="15" font-weight="bold" fill="#111827">이유</text>
  <text x="96" y="514" font-size="15" fill="#1f2937">CDN에 저장되면 다른 사용자에게 내 정보가 나갈 수 있다.</text>
</svg>
