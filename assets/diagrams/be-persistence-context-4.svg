<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">지연 로딩 프록시의 구조</title>
  <desc id="d">Member를 상속한 Member$HibernateProxy는 id = 5를 orders.member_id로부터 이미 알고 있고 target은 null로 미초기화 상태다. getId()는 target 없이 반환해 SQL이 나가지 않고, getName()은 target이 없으면 영속성 컨텍스트에 초기화를 요청해 이때 SELECT가 실행된다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>

  <defs>
    <marker id="inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 부모 클래스와 상속 -->
  <rect x="24" y="24" width="180" height="48" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="114" y="54" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Member</text>
  <path d="M114,120 L114,73" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#inh)"/>
  <text x="132" y="102" font-size="15" fill="#111827">Member 를 상속함 <tspan font-size="14" fill="#4b5563">(런타임에 만들어진 자식 클래스)</tspan></text>

  <!-- 프록시 객체 -->
  <path d="M24,166 L24,130 Q24,120 34,120 L514,120 Q524,120 524,130 L524,166 Z" fill="#eff6ff"/>
  <rect x="24" y="120" width="500" height="276" rx="10" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <line x1="24" y1="166" x2="524" y2="166" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="44" y="150" font-size="18" font-weight="bold" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Member$HibernateProxy</text>

  <!-- 필드 -->
  <text x="44" y="198" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">id</text>
  <text x="124" y="198" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= 5</text>
  <text x="200" y="198" font-size="15" font-weight="bold" fill="#047857">(이미 알고 있음)</text>
  <text x="200" y="222" font-size="14" fill="#4b5563"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">orders.member_id</tspan> 로부터</text>

  <text x="44" y="258" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">target</text>
  <text x="124" y="258" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">= null</text>
  <text x="200" y="258" font-size="15" font-weight="bold" fill="#b91c1c">(아직 미초기화)</text>

  <line x1="24" y1="278" x2="524" y2="278" stroke="#93c5fd" stroke-width="1.2"/>

  <!-- 메서드 -->
  <text x="44" y="312" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">getId()</text>
  <path d="M150,307 L188,307" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="200" y="312" font-size="15" fill="#111827">target 없이 반환</text>

  <text x="44" y="352" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">getName()</text>
  <path d="M150,347 L188,347" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="200" y="352" font-size="15" fill="#111827">target 없으면</text>
  <text x="200" y="376" font-size="15" fill="#111827">영속성 컨텍스트에 초기화 요청</text>

  <!-- 결과 -->
  <path d="M532,307 L588,307" stroke="#047857" stroke-width="1.8" fill="none" marker-end="url(#ar-g)"/>
  <rect x="596" y="289" width="260" height="36" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="726" y="313" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">SQL 안 나감</text>

  <path d="M532,359 L588,359" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#ar-r)"/>
  <rect x="596" y="341" width="260" height="36" rx="18" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="726" y="365" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">여기서 SELECT</text>
</svg>
