<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">.git 디렉터리 구조</title>
  <desc id="d">.git 디렉터리 안의 파일과 하위 디렉터리를 들여쓰기 트리로 보이고, 오른쪽 열에 각각이 담는 내용(HEAD는 현재 위치, index는 스테이징 영역, objects/는 모든 객체, refs/는 브랜치와 태그, logs/는 reflog 등)을 적었다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>

  <!-- 머리행 -->
  <rect x="24" y="24" width="832" height="38" fill="#e5e7eb"/>
  <text x="40" y="49" font-size="15" font-weight="bold" fill="#1f2937">경로</text>
  <text x="330" y="49" font-size="15" font-weight="bold" fill="#1f2937">담긴 내용</text>

  <!-- 줄무늬 (홀수 행) -->
  <rect x="24" y="98" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="170" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="242" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="314" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="386" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="458" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="530" width="832" height="36" fill="#f3f4f6"/>
  <line x1="24" y1="566" x2="856" y2="566" stroke="#9ca3af" stroke-width="1"/>

  <!-- 트리 가이드선 -->
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <!-- .git/ 의 자식들 -->
    <line x1="50" y1="94" x2="50" y2="548"/>
    <line x1="50" y1="116" x2="64" y2="116"/>
    <line x1="50" y1="152" x2="64" y2="152"/>
    <line x1="50" y1="188" x2="64" y2="188"/>
    <line x1="50" y1="224" x2="64" y2="224"/>
    <line x1="50" y1="332" x2="64" y2="332"/>
    <line x1="50" y1="476" x2="64" y2="476"/>
    <line x1="50" y1="512" x2="64" y2="512"/>
    <line x1="50" y1="548" x2="64" y2="548"/>
    <!-- objects/ 의 자식들 -->
    <line x1="82" y1="238" x2="82" y2="296"/>
    <line x1="82" y1="260" x2="96" y2="260"/>
    <line x1="82" y1="296" x2="96" y2="296"/>
    <!-- refs/ 의 자식들 -->
    <line x1="82" y1="346" x2="82" y2="440"/>
    <line x1="82" y1="368" x2="96" y2="368"/>
    <line x1="82" y1="404" x2="96" y2="404"/>
    <line x1="82" y1="440" x2="96" y2="440"/>
  </g>

  <!-- 경로 열 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16">
    <text x="40" y="86" font-weight="bold" fill="#1d4ed8">.git/</text>
    <text x="72" y="122" fill="#111827">HEAD</text>
    <text x="72" y="158" fill="#111827">config</text>
    <text x="72" y="194" fill="#111827">index</text>
    <text x="72" y="230" font-weight="bold" fill="#1d4ed8">objects/</text>
    <text x="104" y="266" fill="#111827">d6/70460b...</text>
    <text x="104" y="302" font-weight="bold" fill="#1d4ed8">pack/</text>
    <text x="72" y="338" font-weight="bold" fill="#1d4ed8">refs/</text>
    <text x="104" y="374" fill="#111827">heads/main</text>
    <text x="104" y="410" fill="#111827">tags/v1.0.0</text>
    <text x="104" y="446" fill="#111827">remotes/origin/main</text>
    <text x="72" y="482" fill="#111827">packed-refs</text>
    <text x="72" y="518" font-weight="bold" fill="#1d4ed8">logs/</text>
    <text x="72" y="554" font-weight="bold" fill="#1d4ed8">hooks/</text>
  </g>

  <!-- 설명 열 -->
  <g font-size="15" fill="#1f2937">
    <text x="330" y="121">현재 위치. 보통 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#b45309">"ref: refs/heads/main"</tspan> 한 줄</text>
    <text x="330" y="157">이 저장소 설정 (remote, user 등)</text>
    <text x="330" y="193">스테이징 영역 그 자체 (바이너리 파일)</text>
    <text x="330" y="229">모든 blob/tree/commit/tag</text>
    <text x="330" y="265">느슨한 객체(loose object), zlib 압축</text>
    <text x="330" y="301">팩파일. 객체가 많아지면 여기로 뭉쳐진다</text>
    <text x="330" y="373">브랜치. 내용은 커밋 해시 40자 한 줄</text>
    <text x="330" y="409">태그</text>
    <text x="330" y="481">refs를 한 파일로 모아둔 것 <tspan fill="#4b5563">(<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">refs/</tspan> 파일이 없어도 여기 있을 수 있다)</tspan></text>
    <text x="330" y="517">reflog. HEAD와 각 브랜치가 지나온 이력</text>
    <text x="330" y="553">pre-commit 등 훅 스크립트</text>
  </g>

  <!-- 범례 -->
  <text x="40" y="600" font-size="14" fill="#4b5563"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#1d4ed8">이름/</tspan>  굵은 파랑 + 끝에 / = 디렉터리</text>
  <text x="330" y="600" font-size="14" fill="#4b5563"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">이름</tspan>  보통 글씨 = 파일</text>
</svg>
