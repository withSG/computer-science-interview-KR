<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">발상 - 해밍 코드 위치 및 패리티 비트 감시 범위</title>
  <desc id="d">위치 1부터 7까지의 이진수 및 패리티/데이터 비트 배치와 P1, P2, P4 각 패리티 비트의 감시 범위를 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 메인 박스 영역 -->
  <rect x="24" y="24" width="832" height="392" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 섹션 1: 비트 위치 표 -->
  <!-- 행 라벨 -->
  <text x="50" y="65" font-size="13" font-weight="bold" fill="#52606d">위치:</text>
  <text x="50" y="105" font-size="13" font-weight="bold" fill="#52606d">이진수:</text>

  <!-- 위치 1 ~ 7 열 -->
  <!-- Col 1 (P1) -->
  <rect x="230" y="44" width="70" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="265" y="63" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text>
  <rect x="230" y="84" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="265" y="103" font-size="13" fill="#1f2933" text-anchor="middle">001</text>
  <rect x="230" y="124" width="70" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="265" y="143" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">P1</text>

  <!-- Col 2 (P2) -->
  <rect x="310" y="44" width="70" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="345" y="63" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">2</text>
  <rect x="310" y="84" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="345" y="103" font-size="13" fill="#1f2933" text-anchor="middle">010</text>
  <rect x="310" y="124" width="70" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="345" y="143" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">P2</text>

  <!-- Col 3 (d1) -->
  <rect x="390" y="44" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="425" y="63" font-size="14" fill="#1f2933" text-anchor="middle">3</text>
  <rect x="390" y="84" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="425" y="103" font-size="13" fill="#1f2933" text-anchor="middle">011</text>
  <rect x="390" y="124" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="425" y="143" font-size="14" fill="#1f2933" text-anchor="middle">d1</text>

  <!-- Col 4 (P4) -->
  <rect x="470" y="44" width="70" height="30" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="505" y="63" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">4</text>
  <rect x="470" y="84" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="505" y="103" font-size="13" fill="#1f2933" text-anchor="middle">100</text>
  <rect x="470" y="124" width="70" height="30" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="505" y="143" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">P4</text>

  <!-- Col 5 (d2) -->
  <rect x="550" y="44" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="585" y="63" font-size="14" fill="#1f2933" text-anchor="middle">5</text>
  <rect x="550" y="84" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="585" y="103" font-size="13" fill="#1f2933" text-anchor="middle">101</text>
  <rect x="550" y="124" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="585" y="143" font-size="14" fill="#1f2933" text-anchor="middle">d2</text>

  <!-- Col 6 (d3) -->
  <rect x="630" y="44" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="665" y="63" font-size="14" fill="#1f2933" text-anchor="middle">6</text>
  <rect x="630" y="84" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="665" y="103" font-size="13" fill="#1f2933" text-anchor="middle">110</text>
  <rect x="630" y="124" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="665" y="143" font-size="14" fill="#1f2933" text-anchor="middle">d3</text>

  <!-- Col 7 (d4) -->
  <rect x="710" y="44" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="745" y="63" font-size="14" fill="#1f2933" text-anchor="middle">7</text>
  <rect x="710" y="84" width="70" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="745" y="103" font-size="13" fill="#1f2933" text-anchor="middle">111</text>
  <rect x="710" y="124" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="745" y="143" font-size="14" fill="#1f2933" text-anchor="middle">d4</text>

  <!-- 구분선 -->
  <line x1="50" y1="180" x2="830" y2="180" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 섹션 2: 패리티 감시 범위 설명 -->

  <!-- P1 그룹 -->
  <rect x="50" y="200" width="780" height="55" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="70" y="232" font-size="13" font-weight="bold" fill="#2563eb">P1(001)</text>
  <text x="140" y="232" font-size="13" fill="#1f2933">은</text>
  <text x="165" y="232" font-size="13" font-weight="bold" fill="#1f2933">001,011,101,111</text>
  <!-- 화살표 -->
  <path d="M305,228 L325,228" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="340" y="232" font-size="13" font-weight="bold" fill="#2563eb">위치 1,3,5,7 감시</text>
  <text x="510" y="232" font-size="13" fill="#52606d">(1의 자리 비트가 1)</text>

  <!-- P2 그룹 -->
  <rect x="50" y="270" width="780" height="55" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="70" y="302" font-size="13" font-weight="bold" fill="#059669">P2(010)</text>
  <text x="140" y="302" font-size="13" fill="#1f2933">은</text>
  <text x="165" y="302" font-size="13" font-weight="bold" fill="#1f2933">010,011,110,111</text>
  <!-- 화살표 -->
  <path d="M305,298 L325,298" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="340" y="302" font-size="13" font-weight="bold" fill="#059669">위치 2,3,6,7 감시</text>
  <text x="510" y="302" font-size="13" fill="#52606d">(2의 자리 비트가 1)</text>

  <!-- P4 그룹 -->
  <rect x="50" y="340" width="780" height="55" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="70" y="372" font-size="13" font-weight="bold" fill="#7c3aed">P4(100)</text>
  <text x="140" y="372" font-size="13" fill="#1f2933">은</text>
  <text x="165" y="372" font-size="13" font-weight="bold" fill="#1f2933">100,101,110,111</text>
  <!-- 화살표 -->
  <path d="M305,368 L325,368" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="340" y="372" font-size="13" font-weight="bold" fill="#7c3aed">위치 4,5,6,7 감시</text>
  <text x="510" y="372" font-size="13" fill="#52606d">(4의 자리 비트가 1)</text>
</svg>