<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">해밍 코드 패리티 감시 범위</title>
  <desc id="d">위치 1~7을 이진수 001~111로 쓰고 P1, P2, d1, P4, d2, d3, d4를 배치한다. P1(001)은 1의 자리 비트가 1인 위치 1,3,5,7을, P2(010)는 2의 자리 비트가 1인 위치 2,3,6,7을, P4(100)는 4의 자리 비트가 1인 위치 4,5,6,7을 감시한다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="32" y="42" font-size="18" font-weight="bold" fill="#111827">패리티 Pn은 위치 번호의 n의 자리 비트가 1인 자리를 모두 감시한다</text>

  <!-- 위치 5 열 강조 (세로로 읽기) -->
  <rect x="454" y="62" width="68" height="294" rx="6" fill="#fef9c3"/>

  <!-- 머리 행: 위치 / 이진수 / 역할 -->
  <g font-size="15" font-weight="bold" fill="#4b5563">
    <text x="40" y="90">위치</text>
    <text x="40" y="124">이진수</text>
    <text x="40" y="158">배치</text>
  </g>
  <g font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="232" y="90">1</text>
    <text x="296" y="90">2</text>
    <text x="360" y="90">3</text>
    <text x="424" y="90">4</text>
    <text x="488" y="90">5</text>
    <text x="552" y="90">6</text>
    <text x="616" y="90">7</text>
  </g>
  <g font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="232" y="124">001</text>
    <text x="296" y="124">010</text>
    <text x="360" y="124">011</text>
    <text x="424" y="124">100</text>
    <text x="488" y="124">101</text>
    <text x="552" y="124">110</text>
    <text x="616" y="124">111</text>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="232" y="158" fill="#1d4ed8">P1</text>
    <text x="296" y="158" fill="#065f46">P2</text>
    <text x="360" y="158" fill="#4b5563">d1</text>
    <text x="424" y="158" fill="#6d28d9">P4</text>
    <text x="488" y="158" fill="#4b5563">d2</text>
    <text x="552" y="158" fill="#4b5563">d3</text>
    <text x="616" y="158" fill="#4b5563">d4</text>
  </g>
  <text x="672" y="158" font-size="14" font-weight="bold" fill="#4b5563">→ 감시하는 위치</text>
  <line x1="32" y1="176" x2="848" y2="176" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ── P1 행 -->
  <text x="40" y="210" font-size="17" font-weight="bold" fill="#1d4ed8">P1(001)</text>
  <text x="40" y="231" font-size="14" fill="#4b5563">1의 자리 비트가 1</text>
  <g stroke-width="1.5">
    <rect x="204" y="190" width="56" height="44" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <rect x="268" y="190" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="332" y="190" width="56" height="44" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <rect x="396" y="190" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="460" y="190" width="56" height="44" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <rect x="524" y="190" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="588" y="190" width="56" height="44" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
  </g>
  <g font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="232" y="218">00<tspan fill="#1d4ed8" font-weight="bold">1</tspan></text>
    <text x="360" y="218">01<tspan fill="#1d4ed8" font-weight="bold">1</tspan></text>
    <text x="488" y="218">10<tspan fill="#1d4ed8" font-weight="bold">1</tspan></text>
    <text x="616" y="218">11<tspan fill="#1d4ed8" font-weight="bold">1</tspan></text>
  </g>
  <text x="672" y="218" font-size="16" font-weight="bold" fill="#1d4ed8">위치 1, 3, 5, 7</text>

  <!-- ── P2 행 -->
  <text x="40" y="266" font-size="17" font-weight="bold" fill="#065f46">P2(010)</text>
  <text x="40" y="287" font-size="14" fill="#4b5563">2의 자리 비트가 1</text>
  <g stroke-width="1.5">
    <rect x="204" y="246" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="268" y="246" width="56" height="44" rx="4" fill="#d1fae5" stroke="#047857"/>
    <rect x="332" y="246" width="56" height="44" rx="4" fill="#d1fae5" stroke="#047857"/>
    <rect x="396" y="246" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="460" y="246" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="524" y="246" width="56" height="44" rx="4" fill="#d1fae5" stroke="#047857"/>
    <rect x="588" y="246" width="56" height="44" rx="4" fill="#d1fae5" stroke="#047857"/>
  </g>
  <g font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="296" y="274">0<tspan fill="#065f46" font-weight="bold">1</tspan>0</text>
    <text x="360" y="274">0<tspan fill="#065f46" font-weight="bold">1</tspan>1</text>
    <text x="552" y="274">1<tspan fill="#065f46" font-weight="bold">1</tspan>0</text>
    <text x="616" y="274">1<tspan fill="#065f46" font-weight="bold">1</tspan>1</text>
  </g>
  <text x="672" y="274" font-size="16" font-weight="bold" fill="#065f46">위치 2, 3, 6, 7</text>

  <!-- ── P4 행 -->
  <text x="40" y="322" font-size="17" font-weight="bold" fill="#6d28d9">P4(100)</text>
  <text x="40" y="343" font-size="14" fill="#4b5563">4의 자리 비트가 1</text>
  <g stroke-width="1.5">
    <rect x="204" y="302" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="268" y="302" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="332" y="302" width="56" height="44" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="396" y="302" width="56" height="44" rx="4" fill="#ede9fe" stroke="#6d28d9"/>
    <rect x="460" y="302" width="56" height="44" rx="4" fill="#ede9fe" stroke="#6d28d9"/>
    <rect x="524" y="302" width="56" height="44" rx="4" fill="#ede9fe" stroke="#6d28d9"/>
    <rect x="588" y="302" width="56" height="44" rx="4" fill="#ede9fe" stroke="#6d28d9"/>
  </g>
  <g font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="424" y="330"><tspan fill="#6d28d9" font-weight="bold">1</tspan>00</text>
    <text x="488" y="330"><tspan fill="#6d28d9" font-weight="bold">1</tspan>01</text>
    <text x="552" y="330"><tspan fill="#6d28d9" font-weight="bold">1</tspan>10</text>
    <text x="616" y="330"><tspan fill="#6d28d9" font-weight="bold">1</tspan>11</text>
  </g>
  <text x="672" y="330" font-size="16" font-weight="bold" fill="#6d28d9">위치 4, 5, 6, 7</text>

  <!-- 세로로 읽기 메모 -->
  <rect x="40" y="385" width="16" height="16" rx="3" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/>
  <text x="66" y="399" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#111827">세로로 읽기:</tspan> 위치 5(=101)는 P4와 P1이 감시하고 P2는 감시하지 않는다.</text>
  <text x="66" y="425" font-size="15" fill="#374151">위치마다 감시자 조합이 전부 다르니, 조합만 보고 위치를 역산할 수 있다.</text>
</svg>
