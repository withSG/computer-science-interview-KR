<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">퍼사드 패턴 구조</title>
  <desc id="d">클라이언트는 단순한 인터페이스인 Facade 하나만 호출하고, Facade가 복잡한 서브시스템 A, B, C를 호출한다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 클라이언트 -->
  <rect x="360" y="24" width="160" height="52" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="440" y="56" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">클라이언트</text>

  <path d="M440,76 V116" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Facade -->
  <rect x="280" y="118" width="320" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="149" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Facade</text>
  <text x="440" y="175" font-size="15" fill="#1f2937" text-anchor="middle">단순한 인터페이스</text>

  <!-- 서브시스템 묶음 -->
  <rect x="150" y="246" width="580" height="156" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>

  <!-- Facade -> A, B, C -->
  <path d="M440,190 V284" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path d="M250,222 H630" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M250,221 V284" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path d="M630,221 V284" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>

  <rect x="190" y="286" width="120" height="56" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="250" y="321" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">A</text>

  <rect x="380" y="286" width="120" height="56" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="321" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">B</text>

  <rect x="570" y="286" width="120" height="56" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="630" y="321" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text>

  <text x="440" y="381" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">복잡한 서브시스템</text>
</svg>
