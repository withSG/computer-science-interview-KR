<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구조</title>
  <desc id="d">클라이언트가 Facade를 거쳐 복잡한 서브시스템 A, B, C를 호출하는 구조 다이어그램</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 클라이언트 -->
  <g transform="translate(340, 30)">
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="100" y="28.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트</text>
  </g>

  <!-- 클라이언트 -> Facade 화살표 -->
  <path d="M440,78 L440,118" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Facade 영역 -->
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="240" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="32.55" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">Facade</text>
  </g>

  <!-- Facade 설명 주석 -->
  <text x="580" y="152.55" font-size="13" fill="#52606d">← 단순한 인터페이스</text>

  <!-- Facade -> 서브시스템 분기 선들 -->
  <!-- 중앙 세로줄 내려오기 -->
  <path d="M440,176 L440,210" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <!-- 가로 분기선 -->
  <path d="M220,210 L660,210" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <!-- 각 서브시스템으로 내려가는 화살표 -->
  <path d="M220,210 L220,248" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M440,210 L440,248" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M660,210 L660,248" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 서브시스템 A -->
  <g transform="translate(160, 250)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="60" y="29.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text>
  </g>

  <!-- 서브시스템 B -->
  <g transform="translate(380, 250)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="60" y="29.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>
  </g>

  <!-- 서브시스템 C -->
  <g transform="translate(600, 250)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="60" y="29.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>
  </g>

  <!-- 서브시스템 설명 주석 -->
  <text x="740" y="279.55" font-size="13" fill="#52606d">← 복잡한 서브시스템</text>
</svg>