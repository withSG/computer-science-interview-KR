<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로토타입 구조</title>
  <desc id="d">Person 생성자 함수, Person.prototype 객체, me 인스턴스 간의 프로토타입 참조 관계를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Person (생성자 함수) -->
  <g>
    <rect x="50" y="40" width="280" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="190" y="72" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Person (생성자 함수)</text>
    <text x="70" y="102" fill="#1f2933" font-size="13">prototype</text>
  </g>

  <!-- Person.prototype (프로토타입 객체) -->
  <g>
    <rect x="430" y="40" width="300" height="230" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="450" y="72" fill="#1f2933" font-size="14" font-weight="bold">Person.prototype</text>
    
    <rect x="450" y="90" width="260" height="50" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="470" y="120" fill="#1f2933" font-size="13">constructor → Person</text>

    <rect x="450" y="150" width="260" height="50" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="470" y="180" fill="#1f2933" font-size="13">sayHi: function</text>
  </g>

  <!-- me (인스턴스) -->
  <g>
    <rect x="110" y="180" width="220" height="120" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="220" y="212" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">me (인스턴스)</text>
    <text x="130" y="242" fill="#1f2933" font-size="13">name: 'Lee'</text>
    <text x="130" y="272" fill="#1f2933" font-size="13">__proto__</text>
  </g>

  <!-- Connections / Arrows -->
  <!-- Person.prototype arrow -->
  <path d="M 210 98 L 418 98" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- me.__proto__ arrow -->
  <path d="M 210 268 L 380 268 L 380 115 L 418 115" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
</svg>