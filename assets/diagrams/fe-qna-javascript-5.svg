<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로토타입 구조</title>
  <desc id="d">생성자 함수 Person의 prototype 프로퍼티와 인스턴스 me의 __proto__가 모두 Person.prototype 객체를 가리키고, Person.prototype의 constructor는 다시 Person을 가리키는 관계입니다. Person.prototype에는 sayHi 메서드가 있습니다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Person (생성자 함수) -->
  <rect x="24" y="24" width="280" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="44" y="58" fill="#111827"><tspan font-size="19" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Person</tspan><tspan font-size="16" fill="#1d4ed8"> (생성자 함수)</tspan></text>
  <rect x="44" y="76" width="240" height="38" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="60" y="101" font-size="16" fill="#1d4ed8" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">prototype</text>

  <!-- Person.prototype -->
  <rect x="548" y="56" width="308" height="156" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="568" y="90" font-size="19" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Person.prototype</text>
  <rect x="568" y="106" width="268" height="38" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="584" y="131" font-size="16" fill="#047857" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">constructor</text>
  <rect x="568" y="154" width="268" height="38" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="584" y="179" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">sayHi: function</text>

  <!-- me (인스턴스) -->
  <rect x="24" y="250" width="280" height="152" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="44" y="284" fill="#111827"><tspan font-size="19" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">me</tspan><tspan font-size="16" fill="#6d28d9"> (인스턴스)</tspan></text>
  <rect x="44" y="300" width="240" height="38" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="60" y="325" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name: 'Lee'</text>
  <rect x="44" y="348" width="240" height="38" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="60" y="373" font-size="16" fill="#6d28d9" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">__proto__</text>

  <!-- prototype → Person.prototype -->
  <path d="M 290 95 H 544" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <!-- constructor → Person -->
  <path d="M 562 125 H 310" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <!-- __proto__ → Person.prototype -->
  <path d="M 290 367 H 420 V 198 H 544" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ap)"/>
  <!-- new Person('Lee') -->
  <path d="M 164 180 V 244" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ak)"/>
  <text x="180" y="218" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">new Person('Lee')</text>

  <!-- 핵심 요약 -->
  <rect x="464" y="262" width="392" height="124" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="484" y="294" font-size="16" font-weight="bold" fill="#111827">생성자 함수의 prototype 프로퍼티가</text>
  <text x="484" y="320" font-size="16" font-weight="bold" fill="#111827">인스턴스의 프로토타입이 됨</text>
  <text x="484" y="358" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Person.prototype === me.__proto__</text>
</svg>
