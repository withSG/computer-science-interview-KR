<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 부정확한가</title>
  <desc id="d">직접 조작과 Virtual DOM의 최선 및 최악의 경우 성능 비교와 Virtual DOM의 실제 효용 다이어그램</desc>
  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>

  <text x="40" y="41" font-size="16" font-weight="bold" fill="#1f2933">왜 부정확한가</text>

  <!-- Group 1: 직접 조작 -->
  <rect x="40" y="70" width="800" height="176" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <rect x="60" y="88" width="200" height="32" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="160" y="109" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">직접 조작 (수동 최적화)</text>

  <path d="M75,104 L75,212 M75,154 L100,154 M75,212 L100,212" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <rect x="100" y="134" width="720" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="116" y="159" font-size="13" fill="#1f2933"><tspan font-weight="bold" fill="#059669">최선의 경우: </tspan>React보다 빠름 (사람이 정확히 최소 변경만 함)</text>

  <rect x="100" y="192" width="720" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="116" y="217" font-size="13" fill="#1f2933"><tspan font-weight="bold" fill="#dc2626">최악의 경우: </tspan>매우 느림 (실수로 전체를 다시 그림, 어긋난 상태)</text>

  <!-- Group 2: Virtual DOM -->
  <rect x="40" y="260" width="800" height="176" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <rect x="60" y="278" width="130" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="299" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Virtual DOM</text>

  <path d="M75,294 L75,402 M75,344 L100,344 M75,402 L100,402" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <rect x="100" y="324" width="720" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="116" y="349" font-size="13" fill="#1f2933"><tspan font-weight="bold" fill="#d97706">최선의 경우: </tspan>직접 조작보다 약간 느림 (diffing 오버헤드)</text>

  <rect x="100" y="382" width="720" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="116" y="407" font-size="13" fill="#1f2933"><tspan font-weight="bold" fill="#2563eb">최악의 경우: </tspan>여전히 괜찮음 (diffing이 바뀐 부분만 반영)</text>

  <!-- Upward Arrow & Callout -->
  <path d="M460,454 L460,429" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#a-purple)"/>

  <rect x="160" y="454" width="600" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="460" y="481" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">"성능의 바닥을 보장한다"가 Virtual DOM의 실제 효용</text>
</svg>