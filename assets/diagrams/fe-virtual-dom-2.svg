<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">직접 조작과 Virtual DOM의 성능 폭</title>
  <desc id="d">세로축이 빠름에서 느림까지를 나타내고, 두 방식의 최선의 경우와 최악의 경우를 막대 양 끝에 표시한다. 직접 조작은 React보다 빠른 경우부터 매우 느린 경우까지 폭이 넓고, Virtual DOM은 최선이 직접 조작보다 약간 느리지만 최악도 여전히 괜찮아 성능의 바닥을 보장한다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="ah-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 세로축: 위 빠름, 아래 느림 -->
  <text x="48" y="84" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">빠름</text>
  <line x1="48" y1="444" x2="48" y2="98" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-axis)"/>
  <text x="48" y="466" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">느림</text>

  <!-- 열 머리 -->
  <text x="104" y="52" font-size="19" font-weight="bold" fill="#b91c1c">직접 조작 (수동 최적화)</text>
  <text x="484" y="52" font-size="19" font-weight="bold" fill="#1d4ed8">Virtual DOM</text>

  <!-- 성능의 바닥 (Virtual DOM 최악의 경우 높이) -->
  <line x1="62" y1="262" x2="490" y2="262" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="474" y="251" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="end">성능의 바닥</text>

  <!-- 직접 조작: 폭이 넓다 -->
  <rect x="113" y="112" width="14" height="312" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="120" cy="112" r="8" fill="#b91c1c"/>
  <circle cx="120" cy="424" r="8" fill="#b91c1c"/>
  <text x="144" y="118" font-size="16" font-weight="bold" fill="#111827">최선의 경우: React보다 빠름</text>
  <text x="144" y="141" font-size="15" fill="#4b5563">(사람이 정확히 최소 변경만 함)</text>
  <text x="144" y="422" font-size="16" font-weight="bold" fill="#111827">최악의 경우: 매우 느림</text>
  <text x="144" y="445" font-size="15" fill="#4b5563">(실수로 전체를 다시 그림, 어긋난 상태)</text>

  <!-- Virtual DOM: 폭이 좁다 -->
  <rect x="493" y="150" width="14" height="112" rx="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="500" cy="150" r="8" fill="#1d4ed8"/>
  <circle cx="500" cy="262" r="8" fill="#1d4ed8"/>
  <text x="524" y="156" font-size="16" font-weight="bold" fill="#111827">최선의 경우: 직접 조작보다 약간 느림</text>
  <text x="524" y="179" font-size="15" fill="#4b5563">(diffing 오버헤드)</text>
  <text x="524" y="268" font-size="16" font-weight="bold" fill="#111827">최악의 경우: 여전히 괜찮음</text>
  <text x="524" y="291" font-size="15" fill="#4b5563">(diffing이 바뀐 부분만 반영)</text>

  <!-- 실제 효용 -->
  <line x1="500" y1="478" x2="500" y2="275" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <rect x="220" y="480" width="560" height="46" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="500" y="509" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle">"성능의 바닥을 보장한다"가 Virtual DOM의 실제 효용</text>
</svg>
