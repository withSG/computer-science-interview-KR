<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 피라미드 vs 아이스크림 콘</title>
  <desc id="d">권장 형태인 피라미드는 단위 테스트가 가장 넓고 E2E가 가장 좁아 수 초~수십 초에 돌고 실패 원인이 바로 보인다. 안티패턴인 아이스크림 콘은 수동 테스트와 E2E가 넓고 단위 테스트가 거의 없어 수십 분이 걸리고 원인 추적에 반나절이 든다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 좌우 구분선 -->
  <path d="M440,32 L440,424" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>

  <!-- ============ 왼쪽: 권장 · 피라미드 ============ -->
  <text x="230" y="52" font-size="19" font-weight="bold" text-anchor="middle" fill="#047857">권장 · 피라미드</text>

  <!-- E2E (꼭대기) -->
  <polygon points="160,76 202,140 118,140" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="160" y="128" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">E2E</text>
  <!-- 통합 -->
  <polygon points="114,146 206,146 240,226 80,226" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="193" font-size="17" font-weight="bold" text-anchor="middle" fill="#92400e">통합</text>
  <!-- 단위 (바닥) -->
  <polygon points="78,232 242,232 280,320 40,320" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="160" y="282" font-size="17" font-weight="bold" text-anchor="middle" fill="#065f46">단위</text>

  <!-- 층별 특성 -->
  <text x="296" y="114" font-size="15" fill="#374151">느림, 비쌈, 불안정</text>
  <path d="M308,126 L308,258" stroke="#6b7280" stroke-width="1.5" fill="none" marker-start="url(#ah-grey)" marker-end="url(#ah-grey)"/>
  <text x="296" y="282" font-size="15" fill="#374151">빠름, 쌈, 안정적</text>

  <!-- 실행 결과 -->
  <rect x="36" y="344" width="388" height="80" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="54" y="376" font-size="15" fill="#4b5563">실행 시간</text>
  <text x="140" y="376" font-size="16" font-weight="bold" fill="#047857">수 초 ~ 수십 초</text>
  <text x="54" y="406" font-size="15" fill="#4b5563">실패하면</text>
  <text x="140" y="406" font-size="16" font-weight="bold" fill="#047857">원인이 바로 보인다<tspan font-size="15" font-weight="normal"> (빠른 피드백)</tspan></text>

  <!-- ============ 오른쪽: 안티패턴 · 아이스크림 콘 ============ -->
  <text x="650" y="52" font-size="19" font-weight="bold" text-anchor="middle" fill="#b91c1c">안티패턴 · 아이스크림 콘</text>

  <!-- 수동 테스트 (맨 위, 가장 넓음) -->
  <polygon points="464,76 696,76 688,132 472,132" fill="#fecaca" stroke="#991b1b" stroke-width="1.5"/>
  <text x="580" y="110" font-size="17" font-weight="bold" text-anchor="middle" fill="#991b1b">수동 테스트</text>
  <!-- E2E 다수 -->
  <polygon points="476,138 684,138 664,200 496,200" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="580" y="175" font-size="17" font-weight="bold" text-anchor="middle" fill="#b91c1c">E2E 다수</text>
  <!-- 통합 -->
  <polygon points="500,206 660,206 638,262 522,262" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="580" y="240" font-size="17" font-weight="bold" text-anchor="middle" fill="#92400e">통합</text>
  <!-- 단위 (끝, 가장 좁음) -->
  <polygon points="526,268 634,268 580,320" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="580" y="290" font-size="16" font-weight="bold" text-anchor="middle" fill="#065f46">단위</text>

  <!-- 층별 특성 -->
  <text x="712" y="99" font-size="15" fill="#374151">사람이 다 누른다<tspan x="712" dy="21">비쌈, 느림</tspan></text>
  <text x="712" y="175" font-size="15" fill="#374151">느리고 자주 깨진다</text>
  <text x="712" y="290" font-size="15" fill="#374151">거의 없다</text>

  <!-- 실행 결과 -->
  <rect x="456" y="344" width="388" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="474" y="376" font-size="15" fill="#4b5563">실행 시간</text>
  <text x="560" y="376" font-size="16" font-weight="bold" fill="#b91c1c">수십 분</text>
  <text x="474" y="406" font-size="15" fill="#4b5563">실패하면</text>
  <text x="560" y="406" font-size="16" font-weight="bold" fill="#b91c1c">원인 추적에 반나절</text>

  <!-- 결론 -->
  <text x="440" y="458" font-size="15" text-anchor="middle" fill="#374151"><tspan font-weight="bold">결론:</tspan> 아래층에서 잡을 수 있는 것을 위층에서 잡으려 하면 같은 확신을 훨씬 비싸게 산다</text>
</svg>
