<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DIP 의존 역전 전과 후</title>
  <desc id="d">의존 역전 전에는 OrderService가 MySqlOrderRepository에 컴파일 의존해 화살표가 아래로만 흐른다. 의존 역전 후에는 OrderService가 OrderRepository 인터페이스에 의존하고 MySqlOrderRepository가 그 인터페이스를 implements 하므로 구현체의 화살표가 위로 뒤집힌다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 층위 라벨 -->
  <text x="66" y="117" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">상위 모듈</text>
  <text x="66" y="333" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">하위 모듈</text>

  <!-- 왼쪽: 의존 역전 전 -->
  <rect x="116" y="24" width="364" height="392" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="298" y="60" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">의존 역전 전</text>

  <rect x="163" y="88" width="270" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="298" y="118" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">OrderService</text>

  <line x1="298" y1="138" x2="298" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="312" y="225" font-size="15" fill="#374151">컴파일 의존</text>

  <rect x="163" y="304" width="270" height="48" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="298" y="334" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">MySqlOrderRepository</text>

  <text x="298" y="392" font-size="16" fill="#374151" text-anchor="middle">화살표가 아래로만 흐름</text>

  <!-- 오른쪽: 의존 역전 후 -->
  <rect x="492" y="24" width="364" height="392" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="674" y="60" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle">의존 역전 후</text>

  <rect x="539" y="88" width="270" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="674" y="118" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">OrderService</text>

  <line x1="674" y1="138" x2="674" y2="192" stroke="#374151" stroke-width="2" marker-end="url(#arr-ink)"/>

  <rect x="514" y="196" width="320" height="48" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="674" y="226" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">OrderRepository <tspan font-weight="normal" fill="#6d28d9">(interface)</tspan></text>

  <line x1="674" y1="302" x2="674" y2="248" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr-purple)"/>
  <text x="690" y="281" font-size="15" font-weight="bold" fill="#6d28d9">implements</text>

  <rect x="539" y="304" width="270" height="48" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="674" y="334" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">MySqlOrderRepository</text>

  <text x="674" y="392" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">구현체의 화살표가 위로 뒤집힘 = 역전</text>
</svg>
