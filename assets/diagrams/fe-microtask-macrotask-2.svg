<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">한 사이클의 실행 순서</title>
  <desc id="d">매크로태스크 큐에서는 T1 하나만, 마이크로태스크 큐에서는 전부를 꺼낸다. 사이클 1은 T1 실행, m1 m2 등 마이크로태스크 전부 소진, 렌더링 기회 순이고, 사이클 2도 T2 실행, 마이크로태스크 전부 소진, 렌더링 기회 순으로 반복된다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 매크로태스크 큐 -->
  <text x="234" y="42" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">매크로태스크 큐</text>
  <rect x="146" y="56" width="56" height="42" rx="6" fill="#1d4ed8"/>
  <text x="174" y="83" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">T1</text>
  <rect x="206" y="56" width="56" height="42" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="234" y="83" font-size="16" fill="#1d4ed8" text-anchor="middle">T2</text>
  <rect x="266" y="56" width="56" height="42" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="294" y="83" font-size="16" fill="#1d4ed8" text-anchor="middle">T3</text>
  <path d="M148,104 v6 h52 v-6" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="174" y1="110" x2="174" y2="171" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="186" y="146" font-size="15" font-weight="bold" fill="#1d4ed8">하나만</text>

  <!-- 마이크로태스크 큐 -->
  <text x="496" y="42" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">마이크로태스크 큐</text>
  <rect x="408" y="56" width="56" height="42" rx="6" fill="#6d28d9"/>
  <text x="436" y="83" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">m1</text>
  <rect x="468" y="56" width="56" height="42" rx="6" fill="#6d28d9"/>
  <text x="496" y="83" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">m2</text>
  <rect x="528" y="56" width="56" height="42" rx="6" fill="#6d28d9"/>
  <text x="556" y="82" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">...</text>
  <path d="M410,104 v6 h172 v-6" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <line x1="496" y1="110" x2="496" y2="171" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="508" y="146" font-size="15" font-weight="bold" fill="#6d28d9">전부</text>

  <!-- 사이클 1 -->
  <rect x="24" y="190" width="92" height="32" rx="16" fill="#e5e7eb"/>
  <text x="70" y="212" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사이클 1</text>
  <rect x="144" y="176" width="180" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="234" y="212" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">T1 실행</text>
  <line x1="328" y1="206" x2="367" y2="206" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="372" y="176" width="248" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="496" y="212" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">m1 m2 ... 전부 소진</text>
  <line x1="624" y1="206" x2="659" y2="206" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="664" y="176" width="192" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="760" y="211" font-size="16" fill="#4b5563" text-anchor="middle">(렌더링 기회)</text>

  <!-- 다음 사이클로 -->
  <path d="M760,240 V256 H234 V271" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 사이클 2 -->
  <rect x="24" y="290" width="92" height="32" rx="16" fill="#e5e7eb"/>
  <text x="70" y="312" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사이클 2</text>
  <rect x="144" y="276" width="180" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="234" y="312" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">T2 실행</text>
  <line x1="328" y1="306" x2="367" y2="306" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="372" y="276" width="248" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="496" y="312" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">마이크로태스크 전부 소진</text>
  <line x1="624" y1="306" x2="659" y2="306" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="664" y="276" width="192" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="760" y="311" font-size="16" fill="#4b5563" text-anchor="middle">(렌더링 기회)</text>
</svg>
