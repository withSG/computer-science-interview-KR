<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">400과 422가 갈리는 지점</title>
  <desc id="d">요청은 객체 변환(역직렬화)을 거친 뒤 의미 검사(비즈니스 규칙)를 받는다. age에 "스물"을 보내면 객체 변환에서 실패해 400, 음수 나이나 최소 주문금액 미달 쿠폰은 변환은 통과하고 의미 검사에서 걸려 422다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 머리행: 처리 단계 -->
  <rect x="24" y="24" width="220" height="68" rx="6" fill="#f3f4f6"/>
  <text x="134" y="64" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">요청</text>
  <path d="M246,58 H261" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="264" y="24" width="230" height="68" rx="6" fill="#f3f4f6"/>
  <text x="379" y="52" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">① 객체 변환 (역직렬화)</text>
  <text x="379" y="77" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">여기서 실패 → 400</text>
  <path d="M496,58 H511" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="514" y="24" width="230" height="68" rx="6" fill="#f3f4f6"/>
  <text x="629" y="52" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">② 의미 검사 (비즈니스 규칙)</text>
  <text x="629" y="77" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">여기서 실패 → 422</text>
  <path d="M746,58 H761" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="764" y="24" width="92" height="68" rx="6" fill="#f3f4f6"/>
  <text x="810" y="64" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">응답</text>

  <!-- 예 1: 400 -->
  <rect x="24" y="112" width="220" height="104" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="40" y="146" font-size="15" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /users</text>
  <text x="40" y="176" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ "age": "스물" }</text>

  <rect x="264" y="112" width="230" height="44" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="379" y="140" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패</text>
  <rect x="514" y="112" width="230" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="629" y="140" font-size="15" fill="#4b5563" text-anchor="middle">도달 안 함</text>
  <rect x="764" y="112" width="92" height="44" rx="6" fill="#b45309"/>
  <text x="810" y="142" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">400</text>

  <text x="264" y="186" font-size="15" fill="#374151">JSON 문법은 멀쩡하지만 age가 숫자 필드라</text>
  <text x="264" y="208" font-size="15" fill="#374151">객체로 변환하는 단계에서 이미 실패한다</text>

  <line x1="24" y1="232" x2="856" y2="232" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 예 2: 422 -->
  <rect x="24" y="248" width="220" height="80" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="40" y="280" font-size="15" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /users</text>
  <text x="40" y="310" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ "age": -5 }</text>

  <rect x="264" y="248" width="230" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="379" y="276" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">통과</text>
  <rect x="514" y="248" width="230" height="44" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="629" y="276" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패</text>
  <rect x="764" y="248" width="92" height="44" rx="6" fill="#6d28d9"/>
  <text x="810" y="278" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">422</text>

  <text x="264" y="320" font-size="15" fill="#374151">타입은 맞다. 나이가 음수라는 게 말이 안 될 뿐</text>

  <line x1="24" y1="344" x2="856" y2="344" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 예 3: 422 -->
  <rect x="24" y="360" width="220" height="104" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="40" y="392" font-size="15" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /orders</text>
  <text x="40" y="422" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ "couponId": 7,</text>
  <text x="57" y="446" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"amount": 3000 }</text>

  <rect x="264" y="360" width="230" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="379" y="388" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">통과</text>
  <rect x="514" y="360" width="230" height="44" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="629" y="388" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">실패</text>
  <rect x="764" y="360" width="92" height="44" rx="6" fill="#6d28d9"/>
  <text x="810" y="390" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">422</text>

  <text x="264" y="434" font-size="15" fill="#374151">형식은 완벽하다. 이 쿠폰의 최소 주문금액이 5000원일 뿐</text>

  <!-- 경계 요약 -->
  <rect x="24" y="488" width="832" height="48" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <text x="44" y="518" font-size="16" font-weight="bold" fill="#111827">경계: 요청을 이해했는가</text>
  <line x1="244" y1="500" x2="244" y2="524" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="264" y="518" font-size="16" fill="#111827">이해조차 못 함 → <tspan font-weight="bold" fill="#b45309">400</tspan></text>
  <line x1="472" y1="500" x2="472" y2="524" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="492" y="518" font-size="16" fill="#111827">이해했지만 받아들일 수 없음 → <tspan font-weight="bold" fill="#6d28d9">422</tspan></text>
</svg>
