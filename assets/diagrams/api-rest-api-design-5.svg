<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">400 vs 422 상태 코드 비교</title>
  <desc id="d">REST API에서 400 Bad Request와 422 Unprocessable Entity 에러 상태 코의 차이를 보여주는 예시 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Section 1: 400 Bad Request Example -->
  <g id="example-1">
    <!-- Request Box -->
    <rect x="40" y="30" width="310" height="110" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="40" y="30" width="310" height="32" rx="6" fill="#eff6ff"/>
    <path d="M40,62 L350,62" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="56" y="51" fill="#2563eb" font-size="14" font-weight="bold">POST /users</text>
    <text x="56" y="90" fill="#1f2933" font-family="monospace" font-size="13">{ "age": "스물" }</text>

    <!-- Arrow -->
    <path d="M350,85 L420,85" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>

    <!-- Status Code Tag -->
    <rect x="430" y="65" width="60" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="460" y="90" fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle">400.</text>

    <!-- Description Box -->
    <rect x="500" y="55" width="340" height="60" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="512" y="80" fill="#1f2933" font-size="13">JSON 문법은 멀쩡하지만 age가 숫자 필드라</text>
    <text x="512" y="100" fill="#1f2933" font-size="13">객체로 변환하는 단계에서 이미 실패한다</text>
  </g>

  <!-- Section 2: 422 Unprocessable Entity Example 1 -->
  <g id="example-2">
    <!-- Request Box -->
    <rect x="40" y="180" width="310" height="110" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="40" y="180" width="310" height="32" rx="6" fill="#eff6ff"/>
    <path d="M40,212 L350,212" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="56" y="201" fill="#2563eb" font-size="14" font-weight="bold">POST /users</text>
    <text x="56" y="240" fill="#1f2933" font-family="monospace" font-size="13">{ "age": -5 }</text>

    <!-- Arrow -->
    <path d="M350,235 L420,235" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

    <!-- Status Code Tag -->
    <rect x="430" y="215" width="60" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="460" y="240" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">422.</text>

    <!-- Description Box -->
    <rect x="500" y="215" width="340" height="40" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="512" y="240" fill="#1f2933" font-size="13">타입은 맞다. 나이가 음수라는 게 말이 안 될 뿐</text>
  </g>

  <!-- Section 3: 422 Unprocessable Entity Example 2 -->
  <g id="example-3">
    <!-- Request Box -->
    <rect x="40" y="330" width="310" height="130" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="40" y="330" width="310" height="32" rx="6" fill="#eff6ff"/>
    <path d="M40,362 L350,362" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="56" y="351" fill="#2563eb" font-size="14" font-weight="bold">POST /orders</text>
    <text x="56" y="390" fill="#1f2933" font-family="monospace" font-size="13">{ "couponId": 7, "amount": 3000 }</text>

    <!-- Arrow -->
    <path d="M350,395 L420,395" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

    <!-- Status Code Tag -->
    <rect x="430" y="375" width="60" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="460" y="400" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">422.</text>

    <!-- Description Box -->
    <rect x="500" y="365" width="340" height="60" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="512" y="390" fill="#1f2933" font-size="13">형식은 완벽하다. 이 쿠폰의 최소 주문금액이</text>
    <text x="512" y="410" fill="#1f2933" font-size="13">5000원일 뿐</text>
  </g>
</svg>