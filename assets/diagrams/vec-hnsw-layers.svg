<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 820" width="880" height="820" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HNSW 계층 그래프와 탐색 경로</title>
  <desc id="d">HNSW는 Layer 2(희소)·Layer 1·Layer 0(전체) 세 층의 그래프로 이루어집니다. 탐색은 최상위 레이어 진입점 A에서 시작해 쿼리에 더 가까운 H로 멀리 점프하고, 더 가까운 이웃이 없으면 아래 레이어로 내려가 Layer 0에서 정밀 탐색한 뒤 Top-K를 반환합니다. 아래에는 검색 과정과 주요 파라미터 M, ef_construction, ef_search를 정리했습니다.</desc>
  <rect width="880" height="820" fill="#ffffff"/>
  <defs>
    <marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ===== Layer 2 (희소) ===== -->
  <rect x="28" y="24" width="824" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="54" font-size="18" font-weight="bold" fill="#111827">Layer 2</text>
  <text x="48" y="78" font-size="15" fill="#4b5563">(희소)</text>
  <text x="48" y="102" font-size="15" fill="#4b5563">비유: 고속도로</text>
  <line x1="246" y1="72" x2="601" y2="72" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/>
  <circle cx="424" cy="48" r="11" fill="#b91c1c"/>
  <text x="424" y="53" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="192" cy="72" r="11" fill="#b91c1c"/>
  <text x="192" y="77" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="228" y="46" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">진입점</text>
  <circle cx="228" cy="72" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="228" y="78" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">A</text>
  <circle cx="620" cy="72" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="620" y="78" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">H</text>
  <text x="668" y="78" font-size="16" font-weight="bold" fill="#111827">먼 거리 점프</text>

  <!-- Layer 2 → Layer 1 -->
  <line x1="228" y1="89" x2="228" y2="187" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="620" y1="89" x2="620" y2="185" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#mr)"/>
  <text x="640" y="143" font-size="15" fill="#b91c1c">더 가까운 이웃 없으면 아래로</text>

  <!-- ===== Layer 1 ===== -->
  <rect x="28" y="156" width="824" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="198" font-size="18" font-weight="bold" fill="#111827">Layer 1</text>
  <text x="48" y="222" font-size="15" fill="#4b5563">비유: 국도</text>
  <line x1="244" y1="204" x2="380" y2="204" stroke="#9ca3af" stroke-width="2"/>
  <line x1="412" y1="204" x2="604" y2="204" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="228" cy="204" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="228" y="210" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">A</text>
  <circle cx="396" cy="204" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="396" y="210" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">D</text>
  <circle cx="620" cy="204" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="620" y="210" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">H</text>
  <text x="668" y="210" font-size="16" font-weight="bold" fill="#111827">중간 이동</text>

  <!-- Layer 1 → Layer 0 -->
  <line x1="228" y1="221" x2="228" y2="331" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="396" y1="221" x2="396" y2="331" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="620" y1="221" x2="620" y2="329" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#mr)"/>
  <text x="640" y="275" font-size="15" fill="#b91c1c">더 가까운 이웃 없으면 아래로</text>

  <!-- ===== Layer 0 (전체) ===== -->
  <rect x="28" y="288" width="824" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="330" font-size="18" font-weight="bold" fill="#111827">Layer 0</text>
  <text x="48" y="354" font-size="15" fill="#4b5563">(전체)</text>
  <text x="48" y="378" font-size="15" fill="#4b5563">비유: 골목길</text>
  <line x1="244" y1="348" x2="268" y2="348" stroke="#9ca3af" stroke-width="2"/>
  <line x1="300" y1="348" x2="324" y2="348" stroke="#9ca3af" stroke-width="2"/>
  <line x1="356" y1="348" x2="380" y2="348" stroke="#9ca3af" stroke-width="2"/>
  <line x1="412" y1="348" x2="436" y2="348" stroke="#9ca3af" stroke-width="2"/>
  <line x1="468" y1="348" x2="492" y2="348" stroke="#9ca3af" stroke-width="2"/>
  <line x1="524" y1="348" x2="548" y2="348" stroke="#9ca3af" stroke-width="2"/>
  <line x1="604" y1="348" x2="583" y2="348" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/>
  <circle cx="228" cy="348" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="228" y="354" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">A</text>
  <circle cx="284" cy="348" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="284" y="354" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">B</text>
  <circle cx="340" cy="348" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="340" y="354" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text>
  <circle cx="396" cy="348" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="396" y="354" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">D</text>
  <circle cx="452" cy="348" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="452" y="354" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">E</text>
  <circle cx="508" cy="348" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="508" y="354" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">F</text>
  <circle cx="564" cy="348" r="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="564" y="354" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">G</text>
  <circle cx="620" cy="348" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="620" y="354" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">H</text>
  <circle cx="564" cy="312" r="11" fill="#b91c1c"/>
  <text x="564" y="317" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="564" y1="367" x2="564" y2="382" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="2 3"/>
  <polygon points="564,384 573,393 564,402 555,393" fill="#b91c1c"/>
  <text x="582" y="398" font-size="15" font-weight="bold" fill="#b91c1c">쿼리 벡터</text>
  <text x="668" y="344" font-size="16" font-weight="bold" fill="#111827">이웃끼리만 연결</text>
  <text x="668" y="368" font-size="15" fill="#374151">모든 벡터가 여기 있다</text>

  <!-- 범례 -->
  <line x1="40" y1="447" x2="74" y2="447" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/>
  <text x="86" y="452" font-size="15" fill="#374151">탐색 경로</text>
  <line x1="190" y1="447" x2="226" y2="447" stroke="#9ca3af" stroke-width="2"/>
  <text x="236" y="452" font-size="15" fill="#374151">노드 간 연결</text>
  <line x1="360" y1="447" x2="396" y2="447" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="406" y="452" font-size="15" fill="#374151">레이어 간 같은 노드</text>
  <line x1="570" y1="447" x2="604" y2="447" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#mr)"/>
  <text x="616" y="452" font-size="15" fill="#374151">아래 레이어로 이동</text>

  <!-- 검색 과정 -->
  <rect x="28" y="476" width="824" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="506" font-size="17" font-weight="bold" fill="#111827">검색 과정</text>
  <circle cx="62" cy="533" r="11" fill="#b91c1c"/>
  <text x="62" y="538" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="539" font-size="16" fill="#1f2937">최상위 레이어 진입점에서 시작</text>
  <circle cx="62" cy="563" r="11" fill="#b91c1c"/>
  <text x="62" y="568" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="569" font-size="16" fill="#1f2937">이웃 중 쿼리에 더 가까운 노드로 이동, 더 가까운 이웃이 없으면 아래 레이어로</text>
  <circle cx="62" cy="593" r="11" fill="#b91c1c"/>
  <text x="62" y="598" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="84" y="599" font-size="16" fill="#1f2937">Layer 0에서 정밀 탐색 → Top-K 반환</text>

  <!-- 주요 파라미터 -->
  <rect x="28" y="636" width="824" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="666" font-size="17" font-weight="bold" fill="#111827">주요 파라미터</text>
  <line x1="268" y1="684" x2="268" y2="780" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="528" y1="684" x2="528" y2="780" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="48" y="704" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">M</text>
  <text x="48" y="732" font-size="15" fill="#1f2937">노드당 최대 연결 수</text>
  <text x="48" y="756" font-size="15" fill="#4b5563">인덱스 구축 시 설정 (메모리)</text>
  <text x="288" y="704" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ef_construction</text>
  <text x="288" y="732" font-size="15" fill="#1f2937">인덱스 구축 시 탐색 폭</text>
  <text x="548" y="704" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ef_search</text>
  <text x="644" y="704" font-size="15" font-weight="bold" fill="#b45309">(런타임 변경)</text>
  <text x="548" y="732" font-size="15" fill="#1f2937">검색 시 탐색 후보 폭</text>
  <text x="548" y="756" font-size="15" fill="#1f2937">높이면: Recall 상승, 지연 증가</text>
  <text x="548" y="780" font-size="15" fill="#1f2937">낮추면: 검색 속도 향상</text>
</svg>
