<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HNSW 계층 그래프와 상위에서 하위로 내려오는 탐색 경로</title>
  <desc id="d">HNSW 인덱스의 Layer 2, Layer 1, Layer 0 계층 그래프 구조에서 진입점 노드부터 쿼리에 가까운 노드로 이동한 뒤 하위 레이어로 내려가 최종 정밀 탐색을 수행하는 경로를 보여줍니다.</desc>
  <rect width="880" height="620" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마크 정의 -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 메인 제목 -->
  <text x="440" y="36" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">HNSW 계층 그래프 및 탐색 경로 (Hierarchical Navigable Small World)</text>
  <text x="440" y="58" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">상위 레이어에서 멀리 점프한 후 하위 레이어로 내려가 촘촘하게 정밀 탐색합니다</text>

  <!-- 좌측 레이어 영역 (Layer 2, Layer 1, Layer 0) -->
  
  <!-- LAYER 2 (최상위) -->
  <g transform="translate(40, 80)">
    <!-- 레이어 배경 카드 -->
    <rect x="0" y="0" width="560" height="120" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#2563eb">Layer 2 (희소 계층)</text>
    <text x="160" y="24" font-size="11.5" fill="#52606d">비유: 고속도로 (먼 거리 빠른 점프)</text>

    <!-- 그래프 간선 (일반) -->
    <line x1="80" y1="70" x2="260" y2="70" stroke="#cbd2d9" stroke-width="1.5"/>
    <line x1="260" y1="70" x2="480" y2="70" stroke="#cbd2d9" stroke-width="1.5"/>

    <!-- 탐색 경로 (굵은 빨간선) -->
    <line x1="80" y1="70" x2="480" y2="70" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>

    <!-- 노드 A -->
    <circle cx="80" cy="70" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="74" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">A</text>
    
    <!-- 진입점 라벨 -->
    <rect x="40" y="25" width="80" height="20" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="80" y="39" font-size="11" font-weight="500" fill="#2563eb" text-anchor="middle">진입점 (Start)</text>

    <!-- 노드 H -->
    <circle cx="480" cy="70" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="480" y="74" font-size="13" font-weight="500" fill="#dc2626" text-anchor="middle">H</text>

    <!-- 경로 라벨 -->
    <rect x="230" y="48" width="100" height="18" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="280" y="61" font-size="11" fill="#dc2626" text-anchor="middle">먼 거리 점프</text>
  </g>

  <!-- LAYER 1 (중간) -->
  <g transform="translate(40, 230)">
    <!-- 레이어 배경 카드 -->
    <rect x="0" y="0" width="560" height="120" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#7c3aed">Layer 1 (중간 계층)</text>
    <text x="160" y="24" font-size="11.5" fill="#52606d">비유: 국도 (중간 이동)</text>

    <!-- 그래프 간선 -->
    <line x1="80" y1="70" x2="260" y2="70" stroke="#cbd2d9" stroke-width="1.5"/>
    <line x1="260" y1="70" x2="480" y2="70" stroke="#cbd2d9" stroke-width="1.5"/>

    <!-- 노드들 -->
    <!-- 노드 A -->
    <circle cx="80" cy="70" r="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="80" y="74" font-size="13" font-weight="500" fill="#7c3aed" text-anchor="middle">A</text>

    <!-- 노드 D -->
    <circle cx="260" cy="70" r="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="260" y="74" font-size="13" font-weight="500" fill="#7c3aed" text-anchor="middle">D</text>

    <!-- 노드 H -->
    <circle cx="480" cy="70" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="480" y="74" font-size="13" font-weight="500" fill="#dc2626" text-anchor="middle">H</text>
    
    <!-- 더 가까운 이웃 없음 설명 -->
    <rect x="360" y="25" width="180" height="20" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="450" y="39" font-size="11" fill="#d97706" text-anchor="middle">이웃 중 더 가까운 노드 없음</text>
  </g>

  <!-- LAYER 0 (하위/전체) -->
  <g transform="translate(40, 380)">
    <!-- 레이어 배경 카드 -->
    <rect x="0" y="0" width="560" height="130" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#059669">Layer 0 (전체 노드 계층)</text>
    <text x="180" y="24" font-size="11.5" fill="#52606d">비유: 골목길 (이웃끼리 촘촘한 연결, 정밀 탐색)</text>

    <!-- 그래프 간선들 -->
    <line x1="80" y1="75" x2="135" y2="75" stroke="#cbd2d9" stroke-width="1.5"/>
    <line x1="135" y1="75" x2="190" y2="75" stroke="#cbd2d9" stroke-width="1.5"/>
    <line x1="190" y1="75" x2="260" y2="75" stroke="#cbd2d9" stroke-width="1.5"/>
    <line x1="260" y1="75" x2="315" y2="75" stroke="#cbd2d9" stroke-width="1.5"/>
    <line x1="315" y1="75" x2="370" y2="75" stroke="#cbd2d9" stroke-width="1.5"/>
    <line x1="370" y1="75" x2="425" y2="75" stroke="#cbd2d9" stroke-width="1.5"/>
    <line x1="425" y1="75" x2="480" y2="75" stroke="#cbd2d9" stroke-width="1.5"/>

    <!-- 탐색 경로 (Layer 0 정밀 탐색) -->
    <line x1="480" y1="75" x2="425" y2="75" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>

    <!-- 노드들 A ~ H -->
    <!-- A -->
    <circle cx="80" cy="75" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="80" y="79" font-size="12" fill="#059669" text-anchor="middle">A</text>
    <!-- B -->
    <circle cx="135" cy="75" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="135" y="79" font-size="12" fill="#059669" text-anchor="middle">B</text>
    <!-- C -->
    <circle cx="190" cy="75" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="190" y="79" font-size="12" fill="#059669" text-anchor="middle">C</text>
    <!-- D -->
    <circle cx="260" cy="75" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="260" y="79" font-size="12" fill="#059669" text-anchor="middle">D</text>
    <!-- E -->
    <circle cx="315" cy="75" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="315" y="79" font-size="12" fill="#059669" text-anchor="middle">E</text>
    <!-- F -->
    <circle cx="370" cy="75" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="370" y="79" font-size="12" fill="#059669" text-anchor="middle">F</text>
    <!-- G (최종 탐색 타겟) -->
    <circle cx="425" cy="75" r="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="425" y="79" font-size="12" font-weight="600" fill="#dc2626" text-anchor="middle">G</text>
    <!-- H -->
    <circle cx="480" cy="75" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="480" y="79" font-size="12" fill="#059669" text-anchor="middle">H</text>

    <!-- 쿼리 벡터 위치 표시 -->
    <line x1="410" y1="110" x2="420" y2="92" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a-red)"/>
    <rect x="360" y="105" width="90" height="20" rx="3" fill="#dc2626"/>
    <text x="405" y="119" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">쿼리 벡터 (Query)</text>
  </g>

  <!-- 수직 점프/하강 경로 (동일 노드의 계층 간 연결) -->
  <!-- Layer 2 H -> Layer 1 H -->
  <line x1="520" y1="166" x2="520" y2="284" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-red)"/>
  <rect x="528" y="215" width="80" height="18" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="568" y="228" font-size="11" font-weight="500" fill="#dc2626" text-anchor="middle">아래로 이동</text>

  <!-- Layer 1 H -> Layer 0 H -->
  <line x1="520" y1="316" x2="520" y2="439" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-red)"/>
  <rect x="528" y="368" width="80" height="18" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="568" y="381" font-size="11" font-weight="500" fill="#dc2626" text-anchor="middle">아래로 이동</text>

  <!-- 동일 노드 연결 가이드 점선 (A, D) -->
  <line x1="120" y1="164" x2="120" y2="286" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="120" y1="314" x2="120" y2="441" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="300" y1="314" x2="300" y2="441" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 우측 설명 카드 영역 (파라미터 및 탐색 절차) -->
  <g transform="translate(630, 80)">
    <!-- 검색 과정 패널 -->
    <rect x="0" y="0" width="210" height="190" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="600" fill="#2563eb">검색 단계 (Search Steps)</text>

    <text x="16" y="52" font-size="11.5" font-weight="600" fill="#1f2933">1. 최상위 진입점 시작</text>
    <text x="28" y="68" font-size="11" fill="#52606d">Layer 2의 [A]에서 탐색</text>

    <text x="16" y="92" font-size="11.5" font-weight="600" fill="#1f2933">2. 이웃 노드 이동</text>
    <text x="28" y="108" font-size="11" fill="#52606d">쿼리와 더 가까운 [H]로 점프</text>

    <text x="16" y="132" font-size="11.5" font-weight="600" fill="#1f2933">3. 하위 레이어 하강</text>
    <text x="28" y="148" font-size="11" fill="#52606d">더 가까운 이웃 없으면 Down</text>

    <text x="16" y="172" font-size="11.5" font-weight="600" fill="#1f2933">4. Layer 0 정밀 탐색</text>

    <!-- 주요 파라미터 패널 -->
    <rect x="0" y="210" width="210" height="220" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="16" y="236" font-size="13" font-weight="600" fill="#1f2933">주요 튜닝 파라미터</text>

    <text x="16" y="262" font-size="11.5" font-weight="600" fill="#2563eb">M</text>
    <text x="32" y="262" font-size="11" fill="#52606d">노드당 최대 연결 수</text>
    <text x="16" y="278" font-size="11" fill="#52606d">인덱스 구축 시 설정 (메모리)</text>

    <line x1="16" y1="290" x2="194" y2="290" stroke="#cbd2d9" stroke-width="1"/>

    <text x="16" y="310" font-size="11.5" font-weight="600" fill="#2563eb">ef_construction</text>
    <text x="16" y="326" font-size="11" fill="#52606d">인덱스 구축 시 탐색 폭</text>

    <line x1="16" y1="338" x2="194" y2="338" stroke="#cbd2d9" stroke-width="1"/>

    <text x="16" y="358" font-size="11.5" font-weight="600" fill="#d97706">ef_search (런타임 변경)</text>
    <text x="16" y="374" font-size="11" fill="#52606d">검색 시 탐색 후보 폭</text>
    <text x="16" y="390" font-size="11" fill="#d97706">↑ 높이면 Recall 상승, 지연 증가</text>
    <text x="16" y="406" font-size="11" fill="#059669">↓ 낮추면 검색 속도 향상</text>
  </g>

  <!-- 범례 및 하단 결론 캡션 -->
  <g transform="translate(40, 530)">
    <rect x="0" y="0" width="800" height="40" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    
    <!-- 범례 아이템들 -->
    <line x1="20" y1="20" x2="50" y2="20" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>
    <text x="56" y="24" font-size="11" fill="#1f2933">탐색 경로</text>

    <line x1="130" y1="20" x2="160" y2="20" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="166" y="24" font-size="11" fill="#1f2933">계층 간 동일 노드 이동</text>

    <circle cx="280" cy="20" r="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="292" y="24" font-size="11" fill="#1f2933">진입 노드</text>

    <circle cx="360" cy="20" r="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="372" y="24" font-size="11" fill="#1f2933">경과/최종 노드</text>

    <rect x="470" y="13" width="14" height="14" fill="#dc2626"/>
    <text x="490" y="24" font-size="11" fill="#1f2933">쿼리 벡터</text>
  </g>

  <!-- 최종 결론 캡션 -->
  <text x="440" y="595" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">결론: HNSW는 상위 계층의 성큼성큼 이동과 하위 계층의 정밀 탐색을 결합하여 고속 벡터 검색을 수행합니다.</text>
</svg>