<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접관의 속 질문과 겉 질문</title>
  <desc id="d">면접관이 머릿속으로 확인하려는 네 가지 질문이 각각 어떤 겉 질문으로 바뀌어 나오는지 왼쪽에서 오른쪽으로 대응시킨 그림입니다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="208" y="46" font-size="18" font-weight="bold" fill="#3730a3" text-anchor="middle">면접관의 머릿속 질문</text>
  <line x1="24" y1="58" x2="392" y2="58" stroke="#4338ca" stroke-width="2.5"/>
  <text x="668" y="46" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">겉으로 나오는 질문</text>
  <line x1="480" y1="58" x2="856" y2="58" stroke="#9ca3af" stroke-width="2.5"/>

  <!-- 1행 -->
  <rect x="24" y="76" width="368" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="208" y="108" font-size="16" font-weight="bold" fill="#1e1b4b" text-anchor="middle">기본기가 무너져 있진 않나?</text>
  <line x1="402" y1="102" x2="468" y2="102" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="480" y="76" width="376" height="52" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="668" y="108" font-size="16" fill="#111827" text-anchor="middle">"이벤트 루프를 설명해주세요"</text>

  <!-- 2행 -->
  <rect x="24" y="142" width="368" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="208" y="174" font-size="16" font-weight="bold" fill="#1e1b4b" text-anchor="middle">막혔을 때 스스로 뚫을 수 있나?</text>
  <line x1="402" y1="168" x2="468" y2="168" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="480" y="142" width="376" height="52" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="668" y="174" font-size="16" fill="#111827" text-anchor="middle">"그럼 이 경우엔 어떻게 하시겠어요?"</text>

  <!-- 3행 -->
  <rect x="24" y="208" width="368" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="208" y="240" font-size="16" font-weight="bold" fill="#1e1b4b" text-anchor="middle">설명을 알아들을 수 있게 하나?</text>
  <line x1="402" y1="234" x2="468" y2="234" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="480" y="208" width="376" height="52" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="668" y="240" font-size="16" fill="#111827" text-anchor="middle">"리액트를 모르는 사람에게 설명한다면?"</text>

  <!-- 4행 -->
  <rect x="24" y="274" width="368" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="208" y="306" font-size="16" font-weight="bold" fill="#1e1b4b" text-anchor="middle">6개월 뒤에도 성장해 있을까?</text>
  <line x1="402" y1="300" x2="468" y2="300" stroke="#4338ca" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="480" y="274" width="376" height="52" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="668" y="306" font-size="16" fill="#111827" text-anchor="middle">"어떤 식으로 공부하고 계세요?"</text>
</svg>
