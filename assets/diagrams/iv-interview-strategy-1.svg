<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접관이 앉아 있는 이유</title>
  <desc id="d">면접관의 머릿속 질문과 겉으로 나오는 질문의 대응 관계를 나타낸 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title / Heading -->
  <text x="30" y="42" font-size="16" font-weight="bold" fill="#1f2933">면접관이 앉아 있는 이유</text>

  <!-- Table Container Background & Headers -->
  <rect x="30" y="60" width="820" height="250" fill="#f8fafc" rx="8" ry="8" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Column Headers Background -->
  <rect x="30" y="60" width="820" height="45" fill="#eff6ff" rx="8" ry="8"/>
  <rect x="30" y="97" width="820" height="8" fill="#eff6ff"/>
  <line x1="30" y1="105" x2="850" y2="105" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Column Titles -->
  <text x="210" y="88" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">면접관의 머릿속 질문</text>
  <text x="635" y="88" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">겉으로 나오는 질문</text>

  <!-- Row Divider Lines -->
  <line x1="40" y1="155" x2="840" y2="155" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="205" x2="840" y2="205" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="40" y1="255" x2="840" y2="255" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Row 1 -->
  <!-- Left Box -->
  <rect x="50" y="117" width="320" height="28" fill="#ffffff" rx="4" ry="4" stroke="#9aa5b1" stroke-width="1"/>
  <text x="210" y="135" font-size="13" fill="#1f2933" text-anchor="middle">기본기가 무너져 있진 않나?</text>
  <!-- Arrow -->
  <path d="M380,131 L430,131" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Right Box -->
  <rect x="440" y="117" width="390" height="28" fill="#ffffff" rx="4" ry="4" stroke="#9aa5b1" stroke-width="1"/>
  <text x="635" y="135" font-size="13" fill="#1f2933" text-anchor="middle">"이벤트 루프를 설명해주세요"</text>

  <!-- Row 2 -->
  <!-- Left Box -->
  <rect x="50" y="167" width="320" height="28" fill="#ffffff" rx="4" ry="4" stroke="#9aa5b1" stroke-width="1"/>
  <text x="210" y="185" font-size="13" fill="#1f2933" text-anchor="middle">막혔을 때 스스로 뚫을 수 있나?</text>
  <!-- Arrow -->
  <path d="M380,181 L430,181" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Right Box -->
  <rect x="440" y="167" width="390" height="28" fill="#ffffff" rx="4" ry="4" stroke="#9aa5b1" stroke-width="1"/>
  <text x="635" y="185" font-size="13" fill="#1f2933" text-anchor="middle">"그럼 이 경우엔 어떻게 하시겠어요?"</text>

  <!-- Row 3 -->
  <!-- Left Box -->
  <rect x="50" y="217" width="320" height="28" fill="#ffffff" rx="4" ry="4" stroke="#9aa5b1" stroke-width="1"/>
  <text x="210" y="235" font-size="13" fill="#1f2933" text-anchor="middle">설명을 알아들을 수 있게 하나?</text>
  <!-- Arrow -->
  <path d="M380,231 L430,231" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Right Box -->
  <rect x="440" y="217" width="390" height="28" fill="#ffffff" rx="4" ry="4" stroke="#9aa5b1" stroke-width="1"/>
  <text x="635" y="235" font-size="13" fill="#1f2933" text-anchor="middle">"리액트를 모르는 사람에게 설명한다면?"</text>

  <!-- Row 4 -->
  <!-- Left Box -->
  <rect x="50" y="267" width="320" height="28" fill="#ffffff" rx="4" ry="4" stroke="#9aa5b1" stroke-width="1"/>
  <text x="210" y="285" font-size="13" fill="#1f2933" text-anchor="middle">6개월 뒤에도 성장해 있을까?</text>
  <!-- Arrow -->
  <path d="M380,281 L430,281" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Right Box -->
  <rect x="440" y="267" width="390" height="28" fill="#ffffff" rx="4" ry="4" stroke="#9aa5b1" stroke-width="1"/>
  <text x="635" y="285" font-size="13" fill="#1f2933" text-anchor="middle">"어떤 식으로 공부하고 계세요?"</text>
</svg>