<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OpenTelemetry Collector 구조</title>
  <desc id="d">애플리케이션은 OTel API/SDK로 계측한 데이터를 OTLP(gRPC/HTTP)로만 내보내고, OpenTelemetry Collector가 receivers, processors, exporters를 거쳐 Jaeger, Grafana Tempo, SaaS APM 같은 백엔드로 보낸다. 백엔드 교체는 Collector 설정 변경으로 끝난다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 애플리케이션 -->
  <rect x="24" y="24" width="832" height="76" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="48" y="68" font-size="18" font-weight="bold" fill="#1f2937">애플리케이션</text>
  <rect x="200" y="38" width="632" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="224" y="68" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#1d4ed8">OTel API/SDK</tspan>  (자동 계측 또는 수동 계측)</text>

  <!-- OTLP -->
  <path d="M440,100 V160" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="458" y="128" font-size="16" font-weight="bold" fill="#1d4ed8">OTLP (gRPC / HTTP)</text>
  <text x="458" y="150" font-size="14" fill="#4b5563">애플리케이션은 OTLP로만 내보냄</text>

  <!-- Collector -->
  <rect x="24" y="168" width="832" height="224" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="48" y="200" font-size="18" font-weight="bold" fill="#1f2937">OpenTelemetry Collector</text>

  <rect x="48" y="216" width="230" height="156" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="68" y="245" font-size="17" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">receivers</text>
  <path d="M60,258 H266" stroke="#d1d5db" stroke-width="1"/>
  <text font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan x="68" y="284">OTLP</tspan><tspan x="68" dy="24">Jaeger</tspan><tspan x="68" dy="24">Zipkin</tspan></text>

  <path d="M278,294 H317" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="325" y="216" width="230" height="156" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="345" y="245" font-size="17" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">processors</text>
  <path d="M337,258 H543" stroke="#d1d5db" stroke-width="1"/>
  <text font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan x="345" y="284">batch</tspan><tspan x="345" dy="24">tail_sampling</tspan><tspan x="345" dy="24">attributes</tspan></text>

  <path d="M555,294 H594" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="602" y="216" width="230" height="156" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="622" y="245" font-size="17" font-weight="bold" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">exporters</text>
  <path d="M614,258 H820" stroke="#d1d5db" stroke-width="1"/>
  <text font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan x="622" y="284">Jaeger</tspan><tspan x="622" dy="24">Tempo</tspan><tspan x="622" dy="24">Datadog</tspan><tspan x="622" dy="24">S3 …</tspan></text>

  <!-- 백엔드 -->
  <path d="M717,372 V448" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="24" y="456" width="832" height="76" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="48" y="500" font-size="18" font-weight="bold" fill="#6d28d9">백엔드</text>
  <rect x="160" y="470" width="190" height="48" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="255" y="500" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Jaeger</text>
  <rect x="374" y="470" width="220" height="48" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="484" y="500" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Grafana Tempo</text>
  <rect x="618" y="470" width="214" height="48" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="725" y="500" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">SaaS APM</text>

  <text x="48" y="566" font-size="15" fill="#4b5563">백엔드 교체는 Collector 설정 변경으로 끝남</text>
</svg>
