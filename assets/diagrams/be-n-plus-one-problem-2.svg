<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컬렉션 fetch join과 LIMIT</title>
  <desc id="d">team 3개와 member 5명을 조인하면 5행이 나오고, LIMIT 2는 그중 앞 2행(A팀 김, A팀 이)만 남긴다. 팀 2개를 원했지만 결과는 멤버 2명만 가진 A팀 하나이고, A팀의 멤버 박이 통째로 사라진다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="24" y="40" font-size="17" font-weight="700" fill="#111827">데이터 상태</text>
  <text x="440" y="40" font-size="17" font-weight="700" fill="#111827">JOIN 결과 (5행)</text>
  <g font-size="15" font-weight="700" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="24" y="70">team</text>
    <text x="172" y="70">member</text>
  </g>

  <!-- team 테이블 -->
  <rect x="24" y="82" width="128" height="38" fill="#f3f4f6"/>
  <rect x="24" y="120" width="128" height="38" fill="#dbeafe"/>
  <rect x="24" y="158" width="128" height="38" fill="#d1fae5"/>
  <rect x="24" y="196" width="128" height="38" fill="#fef3c7"/>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="72" y1="82" x2="72" y2="234"/>
    <line x1="24" y1="158" x2="152" y2="158"/>
    <line x1="24" y1="196" x2="152" y2="196"/>
  </g>
  <line x1="24" y1="120" x2="152" y2="120" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="24" y="82" width="128" height="152" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <g font-size="15" font-weight="700" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="48" y="106">id</text>
    <text x="112" y="106">name</text>
  </g>
  <g font-size="16" fill="#111827" text-anchor="middle">
    <text x="48" y="145">1</text>
    <text x="112" y="145">A팀</text>
    <text x="48" y="183">2</text>
    <text x="112" y="183">B팀</text>
    <text x="48" y="221">3</text>
    <text x="112" y="221">C팀</text>
  </g>

  <!-- member 테이블 -->
  <rect x="172" y="82" width="198" height="38" fill="#f3f4f6"/>
  <rect x="172" y="120" width="198" height="38" fill="#dbeafe"/>
  <rect x="172" y="158" width="198" height="38" fill="#dbeafe"/>
  <rect x="172" y="196" width="198" height="38" fill="#dbeafe"/>
  <rect x="172" y="234" width="198" height="38" fill="#d1fae5"/>
  <rect x="172" y="272" width="198" height="38" fill="#fef3c7"/>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="220" y1="82" x2="220" y2="310"/>
    <line x1="280" y1="82" x2="280" y2="310"/>
    <line x1="172" y1="158" x2="370" y2="158"/>
    <line x1="172" y1="196" x2="370" y2="196"/>
    <line x1="172" y1="234" x2="370" y2="234"/>
    <line x1="172" y1="272" x2="370" y2="272"/>
  </g>
  <line x1="172" y1="120" x2="370" y2="120" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="172" y="82" width="198" height="228" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <g font-size="15" font-weight="700" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="196" y="106">id</text>
    <text x="250" y="106">name</text>
    <text x="325" y="106">team_id</text>
  </g>
  <g font-size="16" fill="#111827" text-anchor="middle">
    <text x="196" y="145">11</text><text x="250" y="145">김</text><text x="325" y="145">1</text>
    <text x="196" y="183">12</text><text x="250" y="183">이</text><text x="325" y="183">1</text>
    <text x="196" y="221">13</text><text x="250" y="221">박</text><text x="325" y="221">1</text>
    <text x="196" y="259">14</text><text x="250" y="259">최</text><text x="325" y="259">2</text>
    <text x="196" y="297">15</text><text x="250" y="297">정</text><text x="325" y="297">3</text>
  </g>

  <!-- JOIN 화살표 -->
  <text x="404" y="244" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">JOIN</text>
  <line x1="378" y1="256" x2="430" y2="256" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- JOIN 결과 테이블 -->
  <rect x="440" y="82" width="190" height="38" fill="#f3f4f6"/>
  <rect x="440" y="120" width="190" height="38" fill="#dbeafe"/>
  <rect x="440" y="158" width="190" height="38" fill="#dbeafe"/>
  <rect x="440" y="196" width="190" height="38" fill="#dbeafe"/>
  <rect x="440" y="234" width="190" height="38" fill="#d1fae5"/>
  <rect x="440" y="272" width="190" height="38" fill="#fef3c7"/>
  <rect x="440" y="196" width="190" height="114" fill="#ffffff" fill-opacity="0.6"/>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="535" y1="82" x2="535" y2="310"/>
    <line x1="440" y1="158" x2="630" y2="158"/>
    <line x1="440" y1="234" x2="630" y2="234"/>
    <line x1="440" y1="272" x2="630" y2="272"/>
  </g>
  <line x1="440" y1="120" x2="630" y2="120" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="440" y="82" width="190" height="228" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <g font-size="15" font-weight="700" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="487" y="106">team</text>
    <text x="582" y="106">member</text>
  </g>
  <g font-size="16" fill="#111827" text-anchor="middle">
    <text x="487" y="145">A팀</text><text x="582" y="145">김</text>
    <text x="487" y="183">A팀</text><text x="582" y="183">이</text>
  </g>
  <g font-size="16" fill="#4b5563" text-anchor="middle">
    <text x="487" y="221">A팀</text><text x="582" y="221">박</text>
    <text x="487" y="259">B팀</text><text x="582" y="259">최</text>
    <text x="487" y="297">C팀</text><text x="582" y="297">정</text>
  </g>
  <rect x="538" y="199" width="89" height="32" rx="3" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- LIMIT 2 절단선과 주석 -->
  <path d="M 638 124 H 646 V 192 H 638" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <g font-size="15" font-weight="700" fill="#b91c1c">
    <text x="658" y="152">LIMIT 2 를 걸면</text>
    <text x="658" y="174">여기까지만 잘린다</text>
  </g>
  <line x1="430" y1="196" x2="856" y2="196" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="8 5"/>
  <g font-size="15" fill="#b91c1c">
    <text x="658" y="220">A팀의 멤버 한 명이</text>
    <text x="658" y="240">통째로 사라진다</text>
  </g>

  <!-- 원했던 것 vs 실제 -->
  <rect x="24" y="340" width="404" height="150" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="40" y="368" font-size="15" fill="#4b5563">원했던 것  <tspan font-size="17" font-weight="700" fill="#047857">"팀 2개"</tspan></text>
  <rect x="40" y="384" width="60" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="116" y="384" width="40" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="164" y="384" width="40" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="212" y="384" width="40" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="40" y="432" width="60" height="36" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="116" y="432" width="40" height="36" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1"/>
  <g font-size="16" fill="#111827" text-anchor="middle">
    <text x="70" y="408" font-weight="700">A팀</text>
    <text x="136" y="408">김</text>
    <text x="184" y="408">이</text>
    <text x="232" y="408">박</text>
    <text x="70" y="456" font-weight="700">B팀</text>
    <text x="136" y="456">최</text>
  </g>

  <rect x="452" y="340" width="404" height="150" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="468" y="368" font-size="15" fill="#4b5563">실제로 나온 것  <tspan font-size="17" font-weight="700" fill="#b91c1c">"A팀 하나(멤버 2명)"</tspan></text>
  <rect x="468" y="384" width="60" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="544" y="384" width="40" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="592" y="384" width="40" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="640" y="384" width="40" height="36" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="468" y="432" width="60" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="544" y="432" width="40" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g font-size="16" text-anchor="middle">
    <text x="498" y="408" font-weight="700" fill="#111827">A팀</text>
    <text x="564" y="408" fill="#111827">김</text>
    <text x="612" y="408" fill="#111827">이</text>
    <text x="660" y="408" fill="#b91c1c">박</text>
    <text x="498" y="456" font-weight="700" fill="#6b7280">B팀</text>
    <text x="564" y="456" fill="#6b7280">최</text>
  </g>
  <text x="694" y="407" font-size="15" font-weight="700" fill="#b91c1c">사라짐</text>
  <text x="598" y="455" font-size="15" fill="#4b5563">나오지 않음</text>

  <!-- 요점 -->
  <rect x="24" y="510" width="832" height="46" rx="8" fill="#f3f4f6"/>
  <text x="440" y="539" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">LIMIT 2 는 팀 2개가 아니라 조인 결과 2행을 의미한다</text>
</svg>
