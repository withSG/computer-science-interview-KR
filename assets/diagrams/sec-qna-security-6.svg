<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Authorization Code Grant 흐름 (가장 일반적)</title>
  <desc id="d">사용자, Client Server, Authorization Server 간의 OAuth 2.0 Authorization Code Grant 인증 흐름 시퀀스 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="620" fill="#ffffff"/>

  <!-- 제목 헤딩 -->
  <text x="30" y="40" font-size="16" font-weight="bold" fill="#1f2933">Authorization Code Grant 흐름 (가장 일반적)</text>

  <!-- 생명선 (Lifelines) -->
  <line x1="160" y1="130" x2="160" y2="470" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="160" y1="530" x2="160" y2="580" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="720" y1="130" x2="720" y2="470" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 화살표 1: 1. 로그인 버튼 클릭 -->
  <path d="M160,170 L720,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="365" y="156" width="150" height="22" fill="#ffffff" rx="3"/>
  <text x="440" y="172" font-size="13" fill="#1f2933" text-anchor="middle">1. 로그인 버튼 클릭</text>

  <!-- 화살표 2: 2. 로그인 페이지 (Google) -->
  <path d="M720,230 L160,230" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="345" y="216" width="190" height="22" fill="#ffffff" rx="3"/>
  <text x="440" y="232" font-size="13" fill="#1f2933" text-anchor="middle">2. 로그인 페이지 (Google)</text>

  <!-- 화살표 3: 3. 로그인 + 권한 동의 -->
  <path d="M160,290 L720,290" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="350" y="276" width="180" height="22" fill="#ffffff" rx="3"/>
  <text x="440" y="292" font-size="13" fill="#1f2933" text-anchor="middle">3. 로그인 + 권한 동의</text>

  <!-- 화살표 4: 4. Authorization Code + redirect -->
  <path d="M720,350 L160,350" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="300" y="336" width="280" height="22" fill="#ffffff" rx="3"/>
  <text x="440" y="352" font-size="13" fill="#1f2933" text-anchor="middle">4. Authorization Code + redirect</text>

  <!-- 화살표 5: 5. Code -> Access Token 교환 -->
  <path d="M160,490 L720,490" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="325" y="476" width="230" height="22" fill="#ffffff" rx="3"/>
  <text x="440" y="492" font-size="13" fill="#1f2933" text-anchor="middle">5. Code → Access Token 교환</text>

  <!-- 화살표 6: 6. Access Token 발급 -->
  <path d="M720,550 L160,550" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="355" y="536" width="170" height="22" fill="#ffffff" rx="3"/>
  <text x="440" y="552" font-size="13" fill="#1f2933" text-anchor="middle">6. Access Token 발급</text>

  <!-- 박스: 사용자 (브라우저) [위] -->
  <rect x="80" y="70" width="160" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="160" y="94.55" font-size="13" fill="#1f2933" text-anchor="middle">사용자</text>
  <text x="160" y="114.55" font-size="13" fill="#1f2933" text-anchor="middle">(브라우저)</text>

  <!-- 박스: Authorization Server [통합형] -->
  <rect x="620" y="70" width="200" height="520" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="720" y="94.55" font-size="13" fill="#1f2933" text-anchor="middle">Authorization</text>
  <text x="720" y="114.55" font-size="13" fill="#1f2933" text-anchor="middle">Server</text>

  <!-- 박스: Client Server [아래] -->
  <rect x="80" y="470" width="160" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="160" y="494.55" font-size="13" fill="#1f2933" text-anchor="middle">Client</text>
  <text x="160" y="514.55" font-size="13" fill="#1f2933" text-anchor="middle">Server</text>
</svg>