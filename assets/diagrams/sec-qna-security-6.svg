<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Authorization Code Grant 흐름</title>
  <desc id="d">사용자(브라우저)가 Authorization Server에서 로그인하고 권한에 동의하면 Authorization Code와 함께 redirect되고, 그 Code를 받은 Client Server가 Authorization Server와 Code를 Access Token으로 교환해 발급받는 6단계 흐름.</desc>
  <rect width="880" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="60" y="24" width="220" height="52" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="170" y="56" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">사용자 (브라우저)</text>
  <rect x="580" y="24" width="260" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="710" y="56" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Authorization Server</text>

  <!-- 생명선 -->
  <line x1="170" y1="76" x2="170" y2="314" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="710" y1="76" x2="710" y2="590" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 1. 로그인 버튼 클릭 -->
  <circle cx="232" cy="115" r="13" fill="#1d4ed8"/>
  <text x="232" y="120" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="254" y="121" font-size="16" fill="#111827">로그인 버튼 클릭</text>
  <line x1="170" y1="134" x2="709" y2="134" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2. 로그인 페이지 (Google) -->
  <circle cx="232" cy="175" r="13" fill="#1d4ed8"/>
  <text x="232" y="180" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="254" y="181" font-size="16" fill="#111827">로그인 페이지 (Google)</text>
  <line x1="710" y1="194" x2="171" y2="194" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>

  <!-- 3. 로그인 + 권한 동의 -->
  <circle cx="232" cy="235" r="13" fill="#1d4ed8"/>
  <text x="232" y="240" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="254" y="241" font-size="16" fill="#111827">로그인 + 권한 동의</text>
  <line x1="170" y1="254" x2="709" y2="254" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 4. Authorization Code + redirect -->
  <circle cx="232" cy="295" r="13" fill="#1d4ed8"/>
  <text x="232" y="300" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="254" y="301" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#b45309">Authorization Code</tspan> + redirect</text>
  <line x1="710" y1="314" x2="171" y2="314" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>

  <!-- 브라우저 → Client Server (redirect) -->
  <line x1="170" y1="320" x2="170" y2="395" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="186" y="364" font-size="15" fill="#4b5563">redirect로 Code 전달</text>

  <!-- Client Server -->
  <rect x="60" y="396" width="220" height="52" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="170" y="428" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Client Server</text>
  <line x1="170" y1="448" x2="170" y2="590" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 5. Code → Access Token 교환 -->
  <circle cx="232" cy="487" r="13" fill="#1d4ed8"/>
  <text x="232" y="492" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="254" y="493" font-size="16" fill="#111827">Code → Access Token 교환</text>
  <line x1="170" y1="506" x2="709" y2="506" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 6. Access Token 발급 -->
  <circle cx="232" cy="547" r="13" fill="#1d4ed8"/>
  <text x="232" y="552" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="254" y="553" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#047857">Access Token</tspan> 발급</text>
  <line x1="710" y1="566" x2="171" y2="566" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
</svg>
