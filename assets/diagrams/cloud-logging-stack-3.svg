<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상관관계 ID로 로그 묶기</title>
  <desc id="d">Gateway가 trace_id를 만들어 traceparent 헤더로 전달하고, order-service, payment-service, notify-worker가 같은 헤더를 이어 받아 모든 로그에 같은 trace_id를 남긴다. 그 ID로 한 번 검색하면 4개 서비스의 로그가 시간순으로 한 화면에 모인다.</desc>
  <rect width="880" height="530" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Gateway -->
  <rect x="24" y="24" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="124" y="51" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Gateway</text>
  <text x="248" y="52" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#1d4ed8">trace_id</tspan> 생성 후 헤더로 전달</text>

  <line x1="124" y1="70" x2="124" y2="124" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="144" y="81" width="588" height="32" rx="6" fill="#f3f4f6"/>
  <text x="158" y="102" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">traceparent: 00-<tspan font-weight="bold" fill="#1d4ed8">4bf92f3577b34da6a3ce929d0e0e4736</tspan>-00f067aa0ba902b7-01</text>

  <!-- order-service -->
  <rect x="24" y="128" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="124" y="155" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">order-service</text>
  <rect x="248" y="131" width="420" height="38" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="264" y="156" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">log{<tspan font-weight="bold" fill="#1d4ed8">trace_id=4bf92f...</tspan>, msg="주문 생성"}</text>

  <line x1="124" y1="174" x2="124" y2="224" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="144" y="205" font-size="15" fill="#4b5563">같은 헤더를 그대로 다음 호출에 전달</text>

  <!-- payment-service -->
  <rect x="24" y="228" width="200" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="124" y="255" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">payment-service</text>
  <rect x="248" y="231" width="420" height="38" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="264" y="256" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">log{<tspan font-weight="bold" fill="#1d4ed8">trace_id=4bf92f...</tspan>, msg="결제 타임아웃"}</text>
  <text x="684" y="256" font-size="17" font-weight="bold" fill="#b91c1c">← 여기!</text>

  <line x1="124" y1="274" x2="124" y2="324" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="144" y="305" font-size="15" fill="#4b5563">(Kafka 메시지 헤더에 실어 전달)</text>

  <!-- notify-worker -->
  <rect x="24" y="328" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="124" y="355" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">notify-worker</text>
  <rect x="248" y="331" width="420" height="38" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="264" y="356" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">log{<tspan font-weight="bold" fill="#1d4ed8">trace_id=4bf92f...</tspan>, msg="알림 발송 실패"}</text>

  <!-- 검색 -->
  <rect x="24" y="400" width="832" height="106" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="437" font-size="17" font-weight="bold" fill="#1d4ed8">검색</text>
  <rect x="96" y="414" width="392" height="36" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="112" y="438" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{namespace="prod"} |= "<tspan font-weight="bold" fill="#1d4ed8">4bf92f3577b34da6</tspan>"</text>
  <line x1="100" y1="479" x2="136" y2="479" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="146" y="485" font-size="16" font-weight="bold" fill="#111827">4개 서비스의 로그가 시간순으로 한 화면에</text>
</svg>
