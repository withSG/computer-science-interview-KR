<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ELK Stack 로그 수집 구조</title>
  <desc id="d">여러 Filebeat(경량 수집기)가 모은 로그가 Logstash(수집/변환/전송)를 거쳐 Elasticsearch(검색/저장 엔진)에 저장되고 Kibana(시각화/검색 UI)에서 조회되는 흐름.</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Filebeat x3 -->
  <rect x="24" y="24" width="148" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="98" y="54" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Filebeat</text>
  <rect x="24" y="88" width="148" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="98" y="118" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Filebeat</text>
  <rect x="24" y="152" width="148" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="98" y="182" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Filebeat</text>
  <text x="98" y="228" font-size="15" fill="#4b5563" text-anchor="middle">(경량 수집기)</text>

  <!-- Filebeat → Logstash -->
  <line x1="174" y1="50" x2="219" y2="90" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="174" y1="112" x2="219" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="174" y1="174" x2="219" y2="134" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Logstash -->
  <rect x="224" y="52" width="176" height="120" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="312" y="106" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">Logstash</text>
  <text x="312" y="134" font-size="15" fill="#374151" text-anchor="middle">(수집/변환/전송)</text>

  <!-- Logstash → Elasticsearch -->
  <line x1="402" y1="112" x2="447" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Elasticsearch -->
  <rect x="452" y="52" width="176" height="120" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="540" y="106" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Elasticsearch</text>
  <text x="540" y="134" font-size="15" fill="#374151" text-anchor="middle">(검색/저장 엔진)</text>

  <!-- Elasticsearch → Kibana -->
  <line x1="630" y1="112" x2="675" y2="112" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Kibana -->
  <rect x="680" y="52" width="176" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="768" y="106" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Kibana</text>
  <text x="768" y="134" font-size="15" fill="#374151" text-anchor="middle">(시각화/검색 UI)</text>
</svg>
