<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서비스 간 통신</title>
  <desc id="d">동기 통신(REST API, gRPC)은 즉시 응답이 필요할 때 쓰지만 서비스 간 강결합과 장애 전파가 단점이다. 비동기 통신(Message Queue: Kafka, RabbitMQ)은 느슨한 결합과 높은 가용성이 장점이고 최종 일관성과 디버깅 어려움이 단점이다.</desc>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- ===== 동기 통신 ===== -->
  <path d="M24,96 V34 A10,10 0 0 1 34,24 H422 A10,10 0 0 1 432,34 V96 Z" fill="#dbeafe"/>
  <line x1="24" y1="96" x2="432" y2="96" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="24" y="24" width="408" height="332" rx="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="44" y="56" font-size="20" font-weight="700" fill="#1e3a8a">동기 통신</text>
  <text x="44" y="83" font-size="16" fill="#1f2937">REST API, gRPC</text>

  <!-- 동기: 요청 → 응답 대기 -->
  <rect x="72" y="116" width="100" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="122" y="153" font-size="16" fill="#111827" text-anchor="middle">서비스 A</text>
  <rect x="284" y="116" width="100" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="334" y="153" font-size="16" fill="#111827" text-anchor="middle">서비스 B</text>
  <line x1="176" y1="136" x2="278" y2="136" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="280" y1="160" x2="178" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="228" y="128" font-size="15" fill="#1d4ed8" text-anchor="middle">요청</text>
  <text x="228" y="180" font-size="15" fill="#1d4ed8" text-anchor="middle">응답</text>

  <rect x="40" y="200" width="376" height="64" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="56" y="224" font-size="15" font-weight="700" fill="#047857">쓰는 경우</text>
  <text x="56" y="250" font-size="16" fill="#111827">즉시 응답 필요한 경우</text>

  <rect x="40" y="276" width="376" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="56" y="300" font-size="15" font-weight="700" fill="#b91c1c">단점</text>
  <text x="56" y="326" font-size="16" fill="#111827">서비스 간 강결합, 장애 전파 가능</text>

  <!-- ===== 비동기 통신 ===== -->
  <path d="M448,96 V34 A10,10 0 0 1 458,24 H846 A10,10 0 0 1 856,34 V96 Z" fill="#ede9fe"/>
  <line x1="448" y1="96" x2="856" y2="96" stroke="#6d28d9" stroke-width="1"/>
  <rect x="448" y="24" width="408" height="332" rx="10" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="468" y="56" font-size="20" font-weight="700" fill="#4c1d95">비동기 통신</text>
  <text x="468" y="83" font-size="16" fill="#1f2937">Message Queue (Kafka, RabbitMQ)</text>

  <!-- 비동기: 큐를 거쳐 전달 -->
  <rect x="476" y="116" width="86" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="519" y="153" font-size="15" fill="#111827" text-anchor="middle">서비스 A</text>
  <rect x="598" y="116" width="108" height="64" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="652" y="143" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">Message</text>
  <text x="652" y="163" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">Queue</text>
  <rect x="742" y="116" width="86" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="785" y="153" font-size="15" fill="#111827" text-anchor="middle">서비스 B</text>
  <line x1="564" y1="148" x2="594" y2="148" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="708" y1="148" x2="738" y2="148" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrP)"/>

  <rect x="464" y="200" width="376" height="64" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="480" y="224" font-size="15" font-weight="700" fill="#047857">장점</text>
  <text x="480" y="250" font-size="16" fill="#111827">느슨한 결합, 높은 가용성</text>

  <rect x="464" y="276" width="376" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="480" y="300" font-size="15" font-weight="700" fill="#b91c1c">단점</text>
  <text x="480" y="326" font-size="16" fill="#111827">최종 일관성, 디버깅 어려움</text>
</svg>
