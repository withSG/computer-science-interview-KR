<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">서비스 간 통신</title>
  <desc id="d">동기 통신과 비동기 통신의 특징 및 단점 비교 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">서비스 간 통신</text>

  <!-- 동기 통신 구역 -->
  <g>
    <!-- 배경 박스 -->
    <rect x="30" y="60" width="395" height="240" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- 메인 타이틀 -->
    <rect x="50" y="80" width="355" height="40" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
    <text x="227" y="104.2" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">동기 통신: REST API, gRPC</text>

    <!-- 특징 1 -->
    <path d="M70,150 L100,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="110" y="154.2" font-size="13" fill="#1f2933">즉시 응답 필요한 경우</text>

    <!-- 단점 구역 -->
    <path d="M70,200 L100,200" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="110" y="204.2" font-size="13" fill="#1f2933">단점: 서비스 간 강결합, 장애 전파 가능</text>
  </g>

  <!-- 비동기 통신 구역 -->
  <g>
    <!-- 배경 박스 -->
    <rect x="455" y="60" width="395" height="240" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    
    <!-- 메인 타이틀 -->
    <rect x="475" y="80" width="355" height="40" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="652" y="104.2" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">비동기 통신: Message Queue (Kafka, RabbitMQ)</text>

    <!-- 특징 1 -->
    <path d="M495,150 L525,150" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <text x="535" y="154.2" font-size="13" fill="#1f2933">느슨한 결합, 높은 가용성</text>

    <!-- 단점 구역 -->
    <path d="M495,200 L525,200" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <text x="535" y="204.2" font-size="13" fill="#1f2933">단점: 최종 일관성, 디버깅 어려움</text>
  </g>
</svg>