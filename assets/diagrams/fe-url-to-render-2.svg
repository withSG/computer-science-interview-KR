<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">URL 구성 요소 분해</title>
  <desc id="d">https://user:pw@shop.example.com:443/items/12?color=red&amp;size=L#reviews 를 scheme(https), userinfo(user:pw), host(shop.example.com), port(443), path(/items/12), query(color=red&amp;size=L), fragment(reviews)의 일곱 조각으로 나눈 그림.</desc>
  <rect width="880" height="170" fill="#ffffff"/>

  <!-- URL 문자열: 한 글자 11px 격자에 고정(textLength) -->
  <rect x="36" y="32" width="808" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="55" y="66" font-size="20" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" textLength="770" lengthAdjust="spacing" fill="#4b5563"><tspan fill="#1d4ed8" font-weight="bold">https</tspan>://<tspan fill="#6d28d9" font-weight="bold">user:pw</tspan>@<tspan fill="#047857" font-weight="bold">shop.example.com</tspan>:<tspan fill="#b45309" font-weight="bold">443</tspan><tspan fill="#0e7490" font-weight="bold">/items/12</tspan>?<tspan fill="#be185d" font-weight="bold">color=red&amp;size=L</tspan>#<tspan fill="#b91c1c" font-weight="bold">reviews</tspan></text>

  <!-- 괄호 + 라벨 -->
  <g fill="none" stroke-width="2">
    <path d="M57,94 V102 H108 V94 M82.5,102 V116" stroke="#1d4ed8"/>
    <path d="M145,94 V102 H218 V94 M181.5,102 V116" stroke="#6d28d9"/>
    <path d="M233,94 V102 H405 V94 M319,102 V116" stroke="#047857"/>
    <path d="M420,94 V102 H449 V94 M434.5,102 V116" stroke="#b45309"/>
    <path d="M454,94 V102 H548 V94 M501,102 V116" stroke="#0e7490"/>
    <path d="M563,94 V102 H735 V94 M649,102 V116" stroke="#be185d"/>
    <path d="M750,94 V102 H823 V94 M786.5,102 V116" stroke="#b91c1c"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="82.5" y="140" fill="#1d4ed8">scheme</text>
    <text x="181.5" y="140" fill="#6d28d9">userinfo</text>
    <text x="319" y="140" fill="#047857">host</text>
    <text x="434.5" y="140" fill="#b45309">port</text>
    <text x="501" y="140" fill="#0e7490">path</text>
    <text x="649" y="140" fill="#be185d">query</text>
    <text x="786.5" y="140" fill="#b91c1c">fragment</text>
  </g>
</svg>
