<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">URL 파싱 다이어그램</title>
  <desc id="d">URL의 각 구성 요소인 scheme, userinfo, host, port, path, query, fragment를 분해하여 시각적으로 연결한 다이어그램</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- URL 문자열 표시 영역 -->
  <rect x="24" y="30" width="832" height="54" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="63" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle" letter-spacing="0.5">https://user:pw@shop.example.com:443/items/12?color=red&amp;size=L#reviews</text>

  <!-- 브래킷 연결선 (ASCII └─┬─┘ 스타일을 깨끗한 패스로 복원) -->
  <!-- 1. scheme: https (x: 44 ~ 89, center: 66.5) -->
  <path d="M44,92 L44,102 L89,102 M89,92 L89,102 M66.5,102 L66.5,152" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 2. userinfo: user:pw (x: 104 ~ 160, center: 132) -->
  <path d="M104,92 L104,102 L160,102 M160,92 L160,102 M132,102 L132,152" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 3. host: shop.example.com (x: 175 ~ 319, center: 247) -->
  <path d="M175,92 L175,102 L319,102 M319,92 L319,102 M247,102 L247,152" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 4. port: 443 (x: 335 ~ 359, center: 347) -->
  <path d="M335,92 L335,102 L359,102 M359,92 L359,102 M347,102 L347,152" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <!-- 5. path: /items/12 (x: 367 ~ 439, center: 403) -->
  <path d="M367,92 L367,102 L439,102 M439,92 L439,102 M403,102 L403,152" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 6. query: color=red&size=L (x: 447 ~ 607, center: 527) -->
  <path d="M447,92 L447,102 L607,102 M607,92 L607,102 M527,102 L527,152" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 7. fragment: reviews (x: 615 ~ 671, center: 643) -->
  <path d="M615,92 L615,102 L671,102 M671,92 M643,102 L643,152" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- 파싱 요소 박스 및 라벨 -->
  <!-- scheme -->
  <rect x="24" y="160" width="85" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="66.5" y="183.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">scheme</text>

  <!-- userinfo -->
  <rect x="115" y="160" width="85" height="38" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="157.5" y="183.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">userinfo</text>

  <!-- host -->
  <rect x="210" y="160" width="75" height="38" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="247.5" y="183.55" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">host</text>

  <!-- port -->
  <rect x="295" y="160" width="70" height="38" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="183.55" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">port</text>

  <!-- path -->
  <rect x="375" y="160" width="70" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="183.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">path</text>

  <!-- query -->
  <rect x="455" y="160" width="75" height="38" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="492.5" y="183.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">query</text>

  <!-- fragment -->
  <rect x="540" y="160" width="95" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="587.5" y="183.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">fragment</text>

  <!-- 범례 (주요 구분 영역 안내) -->
  <rect x="655" y="160" width="201" height="38" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="755.5" y="183.05" font-size="11.5" fill="#52606d" text-anchor="middle">URL 구조 해석 요소 (7개)</text>
</svg>