<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rolling Deployment 단계</title>
  <desc id="d">서버 4대를 v1에서 v2로 한 대씩 순차 교체한다(Before, Step 1~3, After). 추가 인프라가 필요 없지만 배포 중 v1과 v2가 혼재하고 롤백이 느리다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <text x="24" y="46" font-size="19" font-weight="bold" fill="#111827">순차적으로 서버를 교체</text>
  <rect x="580" y="30" width="30" height="20" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="3"/>
  <text x="620" y="46" font-size="15" fill="#374151">이번 단계에서 교체된 서버</text>

  <!-- Before -->
  <text x="40" y="99" font-size="17" font-weight="bold" fill="#4b5563">Before</text>
  <rect x="160" y="72" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="215" y="99" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>
  <rect x="288" y="72" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="343" y="99" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>
  <rect x="416" y="72" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="471" y="99" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>
  <rect x="544" y="72" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="599" y="99" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>

  <!-- Step 1 -->
  <text x="40" y="155" font-size="17" font-weight="bold" fill="#111827">Step 1</text>
  <rect x="160" y="128" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="3"/>
  <text x="215" y="155" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="288" y="128" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="343" y="155" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>
  <rect x="416" y="128" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="471" y="155" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>
  <rect x="544" y="128" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="599" y="155" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>

  <!-- Step 2 -->
  <text x="40" y="211" font-size="17" font-weight="bold" fill="#111827">Step 2</text>
  <rect x="160" y="184" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="215" y="211" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="288" y="184" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="3"/>
  <text x="343" y="211" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="416" y="184" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="471" y="211" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>
  <rect x="544" y="184" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="599" y="211" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>

  <!-- Step 3 -->
  <text x="40" y="267" font-size="17" font-weight="bold" fill="#111827">Step 3</text>
  <rect x="160" y="240" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="215" y="267" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="288" y="240" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="343" y="267" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="416" y="240" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="3"/>
  <text x="471" y="267" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="544" y="240" width="110" height="42" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="599" y="267" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">v1</text>

  <!-- After -->
  <text x="40" y="323" font-size="17" font-weight="bold" fill="#4b5563">After</text>
  <rect x="160" y="296" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="215" y="323" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="288" y="296" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="343" y="323" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="416" y="296" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="471" y="323" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>
  <rect x="544" y="296" width="110" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="3"/>
  <text x="599" y="323" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">v2</text>

  <!-- 혼재 구간 -->
  <path d="M672,128 H684 V282 H672" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="700" y="200" font-size="16" font-weight="bold" fill="#b45309">배포 중</text>
  <text x="700" y="224" font-size="16" font-weight="bold" fill="#b45309">v1, v2 혼재</text>

  <!-- 장단점 -->
  <rect x="24" y="370" width="404" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="44" y="403" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#047857">장점</tspan><tspan dx="14">추가</tspan> 인프라 불필요</text>
  <rect x="452" y="370" width="404" height="54" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="472" y="403" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#b91c1c">단점</tspan><tspan dx="14">배포</tspan> 중 v1, v2 혼재, 롤백 느림</text>
</svg>
