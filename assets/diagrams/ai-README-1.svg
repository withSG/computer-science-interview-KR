<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">학습 순서 권장</title>
  <desc id="d">ML 기초부터 AI Agent까지 AI 엔지니어링 추천 학습 순서를 보여주는 다이어그램</desc>
  <rect width="880" height="570" fill="#ffffff"/>
  
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="440" y="45" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">학습 순서 권장</text>

  <!-- Step 0: ML 기초 (선택) -->
  <g>
    <rect x="180" y="70" width="520" height="56" rx="8" ry="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="440" y="103" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">0. ML 기초 (과적합, 정규화, 평가지표) — 선택</text>
  </g>

  <!-- Arrow 0 -> 1 -->
  <path d="M440,126 L440,154" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-gray)"/>

  <!-- Step 1: LLM 기초 -->
  <g>
    <rect x="180" y="156" width="520" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="189" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1. LLM 기초 (모델 이해, 프롬프트 엔지니어링)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,212 L440,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2: 임베딩과 벡터 DB -->
  <g>
    <rect x="180" y="242" width="520" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="275" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2. 임베딩과 벡터 DB (유사도 검색)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,298 L440,326" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3: RAG 파이프라인 -->
  <g>
    <rect x="180" y="328" width="520" height="56" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="361" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3. RAG 파이프라인 (청킹, 검색, 생성)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,384 L440,412" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4: AI Agent -->
  <g>
    <rect x="180" y="414" width="520" height="56" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="440" y="447" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">4. AI Agent (LangGraph, 도구 사용, 플로우 엔지니어링)</text>
  </g>

  <!-- 범례 -->
  <g>
    <rect x="220" y="500" width="440" height="36" rx="4" ry="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <rect x="235" y="513" width="12" height="12" rx="2" ry="2" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="253" y="523" font-size="11.5" fill="#52606d">선택과목</text>
    <rect x="330" y="513" width="12" height="12" rx="2" ry="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="348" y="523" font-size="11.5" fill="#52606d">핵심 과정</text>
    <rect x="440" y="513" width="12" height="12" rx="2" ry="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="458" y="523" font-size="11.5" fill="#52606d">심화/응용 과정</text>
  </g>
</svg>