<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AI 엔지니어링 권장 학습 순서</title>
  <desc id="d">0단계 ML 기초(선택)에서 시작해 LLM 기초, 임베딩과 벡터 DB, RAG 파이프라인을 거쳐 AI Agent까지 위에서 아래로 차례로 학습하는 순서와 단계별 세부 주제를 보여 준다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 세로 흐름 화살표 (번호 사이) -->
  <line x1="72" y1="92" x2="72" y2="150" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-gray)"/>
  <line x1="72" y1="204" x2="72" y2="262" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="72" y1="316" x2="72" y2="374" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="72" y1="428" x2="72" y2="486" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <!-- 0. ML 기초 (선택) -->
  <circle cx="72" cy="66" r="22" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="72" y="73" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">0</text>
  <rect x="120" y="24" width="570" height="84" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="144" y="58" font-size="19" font-weight="bold" fill="#374151">ML 기초</text>
  <rect x="144" y="70" width="70" height="26" rx="13" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="179" y="88" font-size="15" fill="#374151" text-anchor="middle">과적합</text>
  <rect x="224" y="70" width="70" height="26" rx="13" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="259" y="88" font-size="15" fill="#374151" text-anchor="middle">정규화</text>
  <rect x="304" y="70" width="86" height="26" rx="13" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="347" y="88" font-size="15" fill="#374151" text-anchor="middle">평가지표</text>

  <!-- 1. LLM 기초 -->
  <circle cx="72" cy="178" r="22" fill="#1d4ed8"/>
  <text x="72" y="185" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="120" y="136" width="570" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144" y="170" font-size="19" font-weight="bold" fill="#111827">LLM 기초</text>
  <rect x="144" y="182" width="92" height="26" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="190" y="200" font-size="15" fill="#1e40af" text-anchor="middle">모델 이해</text>
  <rect x="246" y="182" width="168" height="26" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="330" y="200" font-size="15" fill="#1e40af" text-anchor="middle">프롬프트 엔지니어링</text>

  <!-- 2. 임베딩과 벡터 DB -->
  <circle cx="72" cy="290" r="22" fill="#1d4ed8"/>
  <text x="72" y="297" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="120" y="248" width="570" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144" y="282" font-size="19" font-weight="bold" fill="#111827">임베딩과 벡터 DB</text>
  <rect x="144" y="294" width="108" height="26" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="198" y="312" font-size="15" fill="#1e40af" text-anchor="middle">유사도 검색</text>

  <!-- 3. RAG 파이프라인 -->
  <circle cx="72" cy="402" r="22" fill="#1d4ed8"/>
  <text x="72" y="409" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="120" y="360" width="570" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144" y="394" font-size="19" font-weight="bold" fill="#111827">RAG 파이프라인</text>
  <rect x="144" y="406" width="58" height="26" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="173" y="424" font-size="15" fill="#1e40af" text-anchor="middle">청킹</text>
  <rect x="212" y="406" width="58" height="26" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="241" y="424" font-size="15" fill="#1e40af" text-anchor="middle">검색</text>
  <rect x="280" y="406" width="58" height="26" rx="13" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="309" y="424" font-size="15" fill="#1e40af" text-anchor="middle">생성</text>

  <!-- 4. AI Agent -->
  <circle cx="72" cy="514" r="22" fill="#6d28d9"/>
  <text x="72" y="521" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="120" y="472" width="570" height="84" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="144" y="506" font-size="19" font-weight="bold" fill="#111827">AI Agent</text>
  <rect x="144" y="518" width="110" height="26" rx="13" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="199" y="536" font-size="15" fill="#5b21b6" text-anchor="middle">LangGraph</text>
  <rect x="264" y="518" width="92" height="26" rx="13" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="310" y="536" font-size="15" fill="#5b21b6" text-anchor="middle">도구 사용</text>
  <rect x="366" y="518" width="154" height="26" rx="13" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="443" y="536" font-size="15" fill="#5b21b6" text-anchor="middle">플로우 엔지니어링</text>

  <!-- 오른쪽 구분 괄호 -->
  <path d="M700,30 L708,30 L708,102 L700,102" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="722" y="72" font-size="16" font-weight="bold" fill="#4b5563">선택</text>

  <path d="M700,142 L708,142 L708,438 L700,438" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="722" y="296" font-size="16" font-weight="bold" fill="#1d4ed8">핵심 과정</text>

  <path d="M700,478 L708,478 L708,550 L700,550" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="722" y="520" font-size="16" font-weight="bold" fill="#6d28d9">심화/응용 과정</text>
</svg>
