<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SSH 키 생성과 파일 위치</title>
  <desc id="d">RSA 키(구형 시스템 호환용)와 Ed25519 키(권장)를 만드는 ssh-keygen 명령, 그리고 ~/.ssh/ 아래 id_rsa(개인키, 절대 공유 금지), id_rsa.pub(공개키, 서버에 등록), known_hosts, authorized_keys, config 파일의 역할을 보여줍니다.</desc>
  <rect width="880" height="530" fill="#ffffff"/>

  <!-- RSA 키 생성 -->
  <rect x="32" y="20" width="816" height="92" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="52" y="50" font-size="17" font-weight="bold" fill="#1f2937">RSA 키 생성</text>
  <rect x="158" y="32" width="146" height="26" rx="13" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="231" y="50" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">구형 시스템 호환용</text>
  <rect x="52" y="66" width="776" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="68" y="89" font-size="16" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ssh-keygen -t rsa -b 4096 -C "your_email@example.com"</text>

  <!-- Ed25519 키 생성 -->
  <rect x="32" y="128" width="816" height="92" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="2"/>
  <text x="52" y="158" font-size="17" font-weight="bold" fill="#1f2937">Ed25519 키 생성</text>
  <rect x="200" y="140" width="56" height="26" rx="13" fill="#047857"/>
  <text x="228" y="158" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">권장</text>
  <rect x="52" y="174" width="776" height="34" rx="5" fill="#ffffff" stroke="#a7d8c2" stroke-width="1"/>
  <text x="68" y="197" font-size="16" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ssh-keygen -t ed25519 -C "your_email@example.com"</text>

  <!-- 파일 위치 -->
  <line x1="32" y1="248" x2="848" y2="248" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="40" y="278" font-size="16" font-weight="bold" fill="#374151">파일 위치</text>

  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M60,320 V496"/>
    <path d="M60,344 H76 M60,382 H76 M60,420 H76 M60,458 H76 M60,496 H76"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="148" y1="344" x2="248" y2="344"/>
    <line x1="184" y1="382" x2="248" y2="382"/>
    <line x1="192" y1="420" x2="248" y2="420"/>
    <line x1="228" y1="458" x2="248" y2="458"/>
    <line x1="148" y1="496" x2="248" y2="496"/>
  </g>

  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" fill="#1f2937">
    <text x="52" y="312" font-size="18" font-weight="bold" fill="#1d4ed8">~/.ssh/</text>
    <text x="84" y="350" font-weight="bold" fill="#b91c1c">id_rsa</text>
    <text x="84" y="388" font-weight="bold" fill="#047857">id_rsa.pub</text>
    <text x="84" y="426">known_hosts</text>
    <text x="84" y="464">authorized_keys</text>
    <text x="84" y="502">config</text>
  </g>

  <g font-size="16" fill="#1f2937">
    <text x="260" y="350" font-weight="bold" fill="#b91c1c">개인키</text>
    <text x="260" y="388"><tspan font-weight="bold" fill="#047857">공개키</tspan><tspan fill="#4b5563"> (서버에 등록)</tspan></text>
    <text x="260" y="426">접속했던 서버 목록</text>
    <text x="260" y="464">접속 허용된 공개키<tspan fill="#4b5563"> (서버)</tspan></text>
    <text x="260" y="502">SSH 설정</text>
  </g>
  <rect x="322" y="331" width="128" height="26" rx="13" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="386" y="349" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">절대 공유 금지!</text>
</svg>
