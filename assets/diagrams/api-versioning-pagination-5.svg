<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정렬 키 선택 — 여기서 가장 많이 틀린다</title>
  <desc id="d">created_at 중복 시 커서 페이징에서 데이터(id=97)가 누락되는 문제를 보여주는 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 데이터 그룹 영역 -->
  <rect x="40" y="30" width="800" height="230" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5" rx="8"/>
  <text x="60" y="65" font-size="14" font-weight="bold" fill="#1f2933">데이터 (created_at이 같은 글 4개)</text>

  <!-- 데이터 행들 -->
  <!-- id=100 (1페이지 포함) -->
  <rect x="60" y="85" width="760" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="80" y="106" font-size="13" font-weight="bold" fill="#2563eb">id=100</text>
  <text x="200" y="106" font-size="13" fill="#1f2933">created_at = 10:00:00</text>

  <!-- id=99 (1페이지 포함) -->
  <rect x="60" y="122" width="760" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="80" y="143" font-size="13" font-weight="bold" fill="#2563eb">id=99</text>
  <text x="200" y="143" font-size="13" fill="#1f2933">created_at = 10:00:00</text>

  <!-- id=98 (1페이지 포함) -->
  <rect x="60" y="159" width="760" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="80" y="180" font-size="13" font-weight="bold" fill="#2563eb">id=98</text>
  <text x="200" y="180" font-size="13" fill="#1f2933">created_at = 10:00:00</text>

  <!-- id=97 (누락된 행) -->
  <rect x="60" y="196" width="760" height="32" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="80" y="217" font-size="13" font-weight="bold" fill="#dc2626">id=97</text>
  <text x="200" y="217" font-size="13" fill="#1f2933">created_at = 10:00:00</text>

  <!-- id=96 (2페이지 포함) -->
  <rect x="60" y="233" width="760" height="20" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="80" y="247" font-size="13" font-weight="bold" fill="#52606d">id=96</text>
  <text x="200" y="247" font-size="13" fill="#52606d">created_at = 09:59:00</text>

  <!-- 1페이지 결과 영역 -->
  <g transform="translate(0, 280)">
    <rect x="40" y="0" width="800" height="85" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
    
    <text x="60" y="32" font-size="13" font-weight="bold" fill="#1f2933">1페이지 LIMIT 3</text>
    
    <!-- 화살표 -->
    <path d="M180,27 L205,27" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    
    <rect x="215" y="12" width="145" height="30" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="4"/>
    <text x="287.5" y="31.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[100, 99, 98]</text>
    
    <text x="380" y="32" font-size="13" fill="#52606d">커서 = '10:00:00'</text>
  </g>

  <!-- 2페이지 결과 및 오류 영역 -->
  <g transform="translate(0, 385)">
    <rect x="40" y="0" width="800" height="115" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/>
    
    <text x="60" y="38" font-size="13" font-weight="bold" fill="#1f2933">2페이지 WHERE created_at &lt; '10:00:00'</text>
    
    <!-- 화살표 -->
    <path d="M335,33 L360,33" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    
    <rect x="370" y="18" width="100" height="30" fill="#ffffff" stroke="#dc2626" stroke-width="1" rx="4"/>
    <text x="420" y="37.5" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">[96, ...]</text>
    
    <!-- 오류 지적 화살표 및 경고 -->
    <path d="M500,33 L480,33" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <rect x="505" y="18" width="225" height="30" fill="#dc2626" rx="4"/>
    <text x="617.5" y="37.5" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">id=97이 통째로 사라졌다</text>
    
    <text x="60" y="82" font-size="11.5" fill="#dc2626">※ created_at이 10:00:00으로 동일하여 id=97 데이터가 조건(&lt; '10:00:00')에 의해 스킵됨</text>
  </g>
</svg>