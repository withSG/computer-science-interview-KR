<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐시 무효화 조합</title>
  <desc id="d">모든 키에 TTL을 안전망으로 깔고, 중요한 키는 이벤트 기반으로, 연관 관계가 넓으면 태그로 무효화하는 세 가지를 겹쳐 쓰는 다층 방어를 보여 준다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <text x="40" y="40" font-size="18" font-weight="bold" fill="#111827">세 가지를 겹쳐 쓰는 다층 방어</text>

  <!-- 1: TTL -->
  <rect x="40" y="64" width="800" height="68" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M48,64 H380 V132 H48 Q40,132 40,124 V72 Q40,64 48,64 Z" fill="#dbeafe"/>
  <line x1="380" y1="64" x2="380" y2="132" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="210" y="105" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">모든 키에 TTL</text>
  <text x="408" y="104" font-size="16" fill="#374151">무효화가 실패해도 결국 복구되는 안전망</text>

  <text x="210" y="159" font-size="26" font-weight="bold" fill="#4b5563" text-anchor="middle">+</text>

  <!-- 2: 이벤트 기반 -->
  <rect x="40" y="168" width="800" height="68" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <path d="M48,168 H380 V236 H48 Q40,236 40,228 V176 Q40,168 48,168 Z" fill="#d1fae5"/>
  <line x1="380" y1="168" x2="380" y2="236" stroke="#047857" stroke-width="1.5"/>
  <text x="210" y="209" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">중요한 키는 이벤트 기반</text>
  <text x="408" y="208" font-size="16" fill="#374151">정확성이 필요한 곳만 골라서</text>

  <text x="210" y="263" font-size="26" font-weight="bold" fill="#4b5563" text-anchor="middle">+</text>

  <!-- 3: 태그 -->
  <rect x="40" y="272" width="800" height="68" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <path d="M48,272 H380 V340 H48 Q40,340 40,332 V280 Q40,272 48,272 Z" fill="#ede9fe"/>
  <line x1="380" y1="272" x2="380" y2="340" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="210" y="313" font-size="20" font-weight="bold" fill="#5b21b6" text-anchor="middle">연관 관계가 넓으면 태그</text>
  <text x="408" y="312" font-size="16" fill="#374151">한 변경이 여러 캐시를 낡게 만들 때만</text>
</svg>
