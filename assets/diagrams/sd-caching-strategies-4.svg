<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">조합</title>
  <desc id="d">캐시 무효화 전략인 모든 키에 TTL, 중요한 키는 이벤트 기반, 연관 관계가 넓으면 태그의 세 가지 요소를 플러스 기호로 조합한 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- Row 1: 모든 키에 TTL -->
  <rect x="40" y="30" width="300" height="48" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="59" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">모든 키에 TTL</text>
  <path d="M340,54 L420,54" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="435" y="58" fill="#52606d" font-size="13">← 무효화가 실패해도 결국 복구되는 안전망</text>

  <!-- Plus 1 -->
  <text x="190" y="103" fill="#9aa5b1" font-size="16" font-weight="bold" text-anchor="middle">+</text>

  <!-- Row 2: 중요한 키는 이벤트 기반 -->
  <rect x="40" y="120" width="300" height="48" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="190" y="149" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">중요한 키는 이벤트 기반</text>
  <path d="M340,144 L420,144" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="435" y="148" fill="#52606d" font-size="13">← 정확성이 필요한 곳만 골라서</text>

  <!-- Plus 2 -->
  <text x="190" y="193" fill="#9aa5b1" font-size="16" font-weight="bold" text-anchor="middle">+</text>

  <!-- Row 3: 연관 관계가 넓으면 태그 -->
  <rect x="40" y="210" width="300" height="48" rx="6" ry="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="190" y="239" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">연관 관계가 넓으면 태그</text>
  <path d="M340,234 L420,234" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="435" y="238" fill="#52606d" font-size="13">← 한 변경이 여러 캐시를 낡게 만들 때만</text>
</svg>