<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">흐름제어 (Flow Control)</title>
  <desc id="d">송신자의 슬라이딩 윈도우와 수신자의 Window Size 4를 나타내는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <rect x="24" y="24" width="832" height="292" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- 송신자 라벨 -->
  <text x="60" y="88.2" font-size="14" font-weight="bold" fill="#1f2933">송신자:</text>
  
  <!-- 패킷 시퀀스 -->
  <!-- 윈도우 내부 패킷 (1~4): 강조 색상 (파랑) -->
  <g id="window-packets">
    <rect x="130" y="60" width="40" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="150" y="84.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[1]</text>
    
    <rect x="180" y="60" width="40" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="200" y="84.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[2]</text>
    
    <rect x="230" y="60" width="40" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="250" y="84.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[3]</text>
    
    <rect x="280" y="60" width="40" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="300" y="84.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">[4]</text>
  </g>
  
  <!-- 윈도우 외부 패킷 (5~8...) -->
  <g id="outside-packets">
    <rect x="330" y="60" width="40" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="350" y="84.2" font-size="13" fill="#52606d" text-anchor="middle">[5]</text>
    
    <rect x="380" y="60" width="40" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="400" y="84.2" font-size="13" fill="#52606d" text-anchor="middle">[6]</text>
    
    <rect x="430" y="60" width="40" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="450" y="84.2" font-size="13" fill="#52606d" text-anchor="middle">[7]</text>
    
    <rect x="480" y="60" width="40" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="500" y="84.2" font-size="13" fill="#52606d" text-anchor="middle">[8]</text>
    
    <text x="535" y="84.2" font-size="16" font-weight="bold" fill="#52606d">...</text>
  </g>
  
  <!-- 윈도우 표시 (└──윈도우──┘) -->
  <path d="M 150,108 L 150,122 L 300,122 L 300,108" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="195" y="113" width="60" height="18" fill="#f8fafc"/>
  <text x="225" y="126.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">윈도우</text>
  
  <!-- 수신자 정보 구역 -->
  <g id="receiver-info">
    <text x="60" y="198.2" font-size="14" font-weight="bold" fill="#1f2933">수신자:</text>
    <text x="130" y="198.2" font-size="14" font-weight="bold" fill="#059669">Window Size = 4</text>
    
    <rect x="130" y="220" width="236" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="4"/>
    <text x="248" y="242.55" font-size="13" fill="#059669" text-anchor="middle">"한 번에 4개까지 받을 수 있어요"</text>
  </g>
</svg>