<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">슬라이딩 윈도우 흐름제어</title>
  <desc id="d">수신자가 Window Size = 4를 통보하면 송신자는 1~4번을 윈도우로 묶어 한 번에 보내고, 5번 이후는 윈도우 밖에 둔다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
  </defs>

  <!-- 송신자 -->
  <text x="32" y="102" font-size="17" font-weight="bold" fill="#111827">송신자</text>
  <text x="302" y="48" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">윈도우 (4개)</text>
  <text x="622" y="48" font-size="15" fill="#4b5563" text-anchor="middle">윈도우 밖</text>

  <rect x="150" y="70" width="64" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="182" y="102" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">1</text>
  <rect x="230" y="70" width="64" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="262" y="102" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">2</text>
  <rect x="310" y="70" width="64" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="342" y="102" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">3</text>
  <rect x="390" y="70" width="64" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="422" y="102" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">4</text>

  <rect x="470" y="70" width="64" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="502" y="102" font-size="18" fill="#4b5563" text-anchor="middle">5</text>
  <rect x="550" y="70" width="64" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="582" y="102" font-size="18" fill="#4b5563" text-anchor="middle">6</text>
  <rect x="630" y="70" width="64" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="662" y="102" font-size="18" fill="#4b5563" text-anchor="middle">7</text>
  <rect x="710" y="70" width="64" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="742" y="102" font-size="18" fill="#4b5563" text-anchor="middle">8</text>
  <text x="812" y="102" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>

  <!-- 윈도우 테두리 -->
  <rect x="142" y="62" width="320" height="68" rx="10" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- 통보 화살표 -->
  <line x1="302" y1="206" x2="302" y2="136" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <text x="316" y="176" font-size="16" font-weight="bold" fill="#047857">Window Size 통보</text>

  <!-- 수신자 -->
  <text x="32" y="260" font-size="17" font-weight="bold" fill="#111827">수신자</text>
  <rect x="142" y="208" width="400" height="92" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="342" y="244" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Window Size = 4</text>
  <text x="342" y="278" font-size="16" fill="#1f2937" text-anchor="middle">“한 번에 4개까지 받을 수 있어요”</text>
</svg>
