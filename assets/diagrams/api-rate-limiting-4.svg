<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Token Bucket 동작</title>
  <desc id="d">토큰이 일정 속도(초당 1개)로 충전되는 용량 10짜리 버킷에 현재 토큰이 4개 있다. 넘치는 토큰은 버린다. 요청 1개당 토큰 1개를 소비하며, 토큰이 있으면 즉시 통과하고 없으면 거절한다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 충전 -->
  <text x="350" y="42" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">일정 속도로 토큰 충전 (초당 1개)</text>
  <line x1="350" y1="54" x2="350" y2="94" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 버킷: 용량 10칸, 현재 토큰 4개 -->
  <rect x="170" y="100" width="360" height="76" fill="#eff6ff"/>
  <path d="M170,100 L170,176 L530,176 L530,100" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
  <g>
    <circle cx="197" cy="138" r="12" fill="#1d4ed8"/>
    <circle cx="231" cy="138" r="12" fill="#1d4ed8"/>
    <circle cx="265" cy="138" r="12" fill="#1d4ed8"/>
    <circle cx="299" cy="138" r="12" fill="#1d4ed8"/>
    <circle cx="333" cy="138" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="367" cy="138" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="401" cy="138" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="435" cy="138" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="469" cy="138" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="503" cy="138" r="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- 버킷 설명(범례 겸용) -->
  <text x="556" y="128" font-size="16" font-weight="bold" fill="#111827">용량 10 <tspan font-size="15" font-weight="normal" fill="#4b5563">(넘치면 버림)</tspan></text>
  <text x="556" y="160" font-size="16" font-weight="bold" fill="#1d4ed8">현재 토큰 4개</text>

  <!-- 요청이 토큰을 소비 -->
  <line x1="350" y1="178" x2="350" y2="222" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="40" y="226" width="110" height="46" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="95" y="255" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">요청</text>
  <line x1="150" y1="249" x2="226" y2="249" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="230" y="226" width="240" height="46" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="350" y="255" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">요청 1개당 토큰 1개 소비</text>

  <!-- 결과 분기 -->
  <path d="M350,272 L350,292" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M350,292 L220,292 L220,318" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <path d="M350,292 L480,292 L480,318" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>

  <rect x="110" y="322" width="220" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="220" y="344" font-size="15" fill="#047857" text-anchor="middle">토큰이 있으면</text>
  <text x="220" y="368" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">즉시 통과</text>
  <rect x="370" y="322" width="220" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="480" y="344" font-size="15" fill="#b91c1c" text-anchor="middle">토큰이 없으면</text>
  <text x="480" y="368" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">거절</text>
</svg>
