<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Token Bucket — 안 쓴 만큼 모아뒀다 쓴다</title>
  <desc id="d">일정 속도로 토큰이 충전되어 버킷에 담기고, 요청 1개당 토큰 1개를 소비하여 토큰 여부에 따라 즉시 통과 또는 거절되는 Token Bucket 알고리즘 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- Top Text: 일정 속도로 토큰 충전 (초당 1개) -->
  <text x="440" y="44" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">일정 속도로 토큰 충전 (초당 1개)</text>

  <!-- Arrow 1: Top to Bucket -->
  <path d="M440,55 L440,95" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Bucket Box -->
  <rect x="290" y="105" width="300" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

  <!-- Bucket Content: Tokens (●  ●  ●  ●) -->
  <circle cx="380" cy="140" r="8" fill="#2563eb"/>
  <circle cx="420" cy="140" r="8" fill="#2563eb"/>
  <circle cx="460" cy="140" r="8" fill="#2563eb"/>
  <circle cx="500" cy="140" r="8" fill="#2563eb"/>

  <!-- Bucket Side Label: 용량 10 (넘치면 버림) / 현재 토큰 4개 -->
  <text x="605" y="144" fill="#52606d" font-size="13">용량 10 (넘치면 버림) / 현재 토큰 4개</text>

  <!-- Arrow 2: Bucket to Bottom Text -->
  <path d="M440,175 L440,255" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Arrow 2 Label: 요청 1개당 토큰 1개 소비 -->
  <rect x="340" y="203" width="200" height="24" fill="#ffffff"/>
  <text x="440" y="219" fill="#1f2933" font-size="13" text-anchor="middle">요청 1개당 토큰 1개 소비</text>

  <!-- Bottom Result Box -->
  <rect x="220" y="265" width="440" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="295" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">토큰이 있으면 즉시 통과, 없으면 거절</text>
</svg>