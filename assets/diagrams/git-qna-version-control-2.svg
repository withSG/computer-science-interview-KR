<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GitHub Flow 브랜치 흐름</title>
  <desc id="d">브랜치는 main과 feature 두 가지뿐입니다. main에서 feature를 분기해 작업하고 다시 main으로 병합합니다.</desc>
  <rect width="880" height="280" fill="#ffffff"/>
  <defs>
    <marker id="m-feat" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#b45309"/></marker>
    <marker id="m-ink" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#374151"/></marker>
  </defs>

  <!-- 요점 -->
  <text x="32" y="44" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#1d4ed8">main</tspan>에서 <tspan fill="#b45309">feature</tspan> 분기 → 다시 <tspan fill="#1d4ed8">main</tspan>으로 병합 · 브랜치는 이 둘뿐</text>

  <!-- 브랜치 이름 -->
  <text x="32" y="115" font-size="16" font-weight="bold" fill="#1d4ed8">main</text>
  <text x="32" y="185" font-size="16" font-weight="bold" fill="#b45309">feature</text>

  <!-- 레인 -->
  <line x1="150" y1="180" x2="848" y2="180" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="150" y1="110" x2="848" y2="110" stroke="#1d4ed8" stroke-width="4"/>

  <!-- feature: main에서 분기 → main으로 병합 -->
  <path d="M220,119 Q220,180 268,180" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-feat)"/>
  <line x1="280" y1="180" x2="520" y2="180" stroke="#b45309" stroke-width="3"/>
  <path d="M529,180 Q580,180 580,123" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#m-feat)"/>

  <!-- 커밋 -->
  <g fill="#ffffff" stroke-width="3">
    <circle cx="220" cy="110" r="7" stroke="#1d4ed8"/>
    <circle cx="580" cy="110" r="7" stroke="#1d4ed8"/>
    <circle cx="280" cy="180" r="7" stroke="#b45309"/>
    <circle cx="400" cy="180" r="7" stroke="#b45309"/>
    <circle cx="520" cy="180" r="7" stroke="#b45309"/>
  </g>

  <!-- 범례 -->
  <path d="M32,240 L72,240" fill="none" stroke="#374151" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m-ink)"/>
  <text x="82" y="245" font-size="15" fill="#374151">분기</text>
  <path d="M140,240 L180,240" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#m-ink)"/>
  <text x="190" y="245" font-size="15" fill="#374151">병합</text>
  <circle cx="256" cy="240" r="7" fill="#ffffff" stroke="#374151" stroke-width="3"/>
  <text x="272" y="245" font-size="15" fill="#374151">커밋</text>
</svg>
