<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GitHub Flow</title>
  <desc id="d">main 브랜치와 feature 브랜치 간의 분기 및 병합 관계를 나타내는 GitHub Flow 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="160" fill="#ffffff"/>

  <!-- main branch line & text -->
  <text x="40" y="55" font-size="14" font-weight="bold" fill="#1f2933">main</text>
  <path d="M90,50 L840,50" stroke="#1f2933" stroke-width="2" fill="none"/>

  <!-- feature branch line & text -->
  <text x="40" y="115" font-size="14" font-weight="bold" fill="#2563eb">feature</text>
  <path d="M105,110 L340,110" stroke="#2563eb" stroke-width="2" fill="none"/>
  <path d="M340,110 L440,110 L440,60" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- divergence arrow (first ↑) from main to feature -->
  <path d="M200,60 L200,100" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-blue)"/>
</svg>