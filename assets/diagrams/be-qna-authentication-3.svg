<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Access·Refresh Token 흐름</title>
  <desc id="d">로그인하면 Access Token과 Refresh Token이 발급되고, API 요청에는 Access Token을 쓴다. Access Token이 만료되면 Refresh Token으로 재발급받아 다시 API 요청에 쓰고, Refresh Token까지 만료되면 재로그인해 처음 단계로 돌아간다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 단계 레일 -->
  <line x1="52" y1="60" x2="52" y2="318" stroke="#d1d5db" stroke-width="3"/>

  <!-- 되돌아가는 화살표 -->
  <path d="M724,232 H766 V146 H728" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M724,318 H826 V60 H728" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>

  <!-- 1 -->
  <circle cx="52" cy="60" r="16" fill="#111827"/>
  <text x="52" y="66" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="88" y="34" width="230" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="203" y="66" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">로그인</text>
  <line x1="322" y1="60" x2="360" y2="60" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="366" y="34" width="358" height="52" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="545" y="66" font-size="17" fill="#111827" text-anchor="middle"><tspan fill="#1d4ed8" font-weight="bold">Access Token</tspan> + <tspan fill="#b45309" font-weight="bold">Refresh Token</tspan> 발급</text>

  <!-- 2 -->
  <circle cx="52" cy="146" r="16" fill="#111827"/>
  <text x="52" y="152" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="88" y="120" width="230" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="203" y="152" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">API 요청 시</text>
  <line x1="322" y1="146" x2="360" y2="146" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="366" y="120" width="358" height="52" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="545" y="152" font-size="17" fill="#111827" text-anchor="middle"><tspan fill="#1d4ed8" font-weight="bold">Access Token</tspan> 사용</text>

  <!-- 3 -->
  <circle cx="52" cy="232" r="16" fill="#111827"/>
  <text x="52" y="238" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="88" y="206" width="230" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="203" y="238" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle"><tspan fill="#1d4ed8">Access Token</tspan> 만료</text>
  <line x1="322" y1="232" x2="360" y2="232" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="366" y="206" width="358" height="52" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="545" y="238" font-size="17" fill="#111827" text-anchor="middle"><tspan fill="#b45309" font-weight="bold">Refresh Token</tspan>으로 재발급</text>

  <!-- 4 -->
  <circle cx="52" cy="318" r="16" fill="#111827"/>
  <text x="52" y="324" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="88" y="292" width="230" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="203" y="324" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle"><tspan fill="#b45309">Refresh Token</tspan> 만료</text>
  <line x1="322" y1="318" x2="360" y2="318" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="366" y="292" width="358" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="545" y="324" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">재로그인</text>
</svg>
