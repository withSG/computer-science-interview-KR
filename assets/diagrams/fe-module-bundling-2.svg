<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="880" height="670" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">청크 전략 비교</title>
  <desc id="d">전략 A는 900KB짜리 bundle.js 하나로 묶어 내 코드 한 줄만 고쳐도 900KB 전체를 다시 내려받는다. 전략 B는 vendor.js 700KB, app.js 150KB, home.js 30KB, admin.js 20KB, runtime.js 2KB로 성격별로 나눠, 내 코드를 고치면 app.js만 바뀌고 vendor.js는 브라우저 캐시에서 그대로 재사용한다.</desc>
  <rect width="880" height="670" fill="#ffffff"/>

  <!-- 열 머리 -->
  <text x="48" y="40" font-size="14" font-weight="bold" fill="#374151">파일</text>
  <text x="250" y="40" font-size="14" font-weight="bold" fill="#374151" text-anchor="end">크기</text>
  <text x="268" y="40" font-size="14" fill="#4b5563">막대 길이 = 파일 크기</text>
  <text x="778" y="40" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">내 코드를 고치면</text>
  <line x1="32" y1="54" x2="848" y2="54" stroke="#9ca3af" stroke-width="1"/>

  <!-- ───── 전략 A ───── -->
  <text x="32" y="92" font-size="18" font-weight="bold" fill="#111827">전략 A: 전부 하나로</text>

  <text x="48" y="138" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">bundle.js</text>
  <text x="250" y="138" font-size="15" fill="#111827" text-anchor="end">900KB</text>
  <rect x="268" y="120" width="420" height="24" rx="3" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="704" y="116" width="148" height="32" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="778" y="137" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">전체 다시 받음</text>

  <text x="48" y="180" font-size="15" fill="#b91c1c">내 코드 한 줄만 고쳐도 <tspan font-weight="bold">900KB 전체를 다시 내려받는다</tspan></text>

  <line x1="32" y1="210" x2="848" y2="210" stroke="#d1d5db" stroke-width="1"/>

  <!-- ───── 전략 B ───── -->
  <text x="32" y="250" font-size="18" font-weight="bold" fill="#111827">전략 B: 성격별로 분리</text>

  <!-- vendor.js -->
  <text x="48" y="290" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">vendor.js</text>
  <text x="48" y="311" font-size="14" fill="#4b5563">react, lodash 등</text>
  <text x="250" y="299" font-size="15" fill="#111827" text-anchor="end">700KB</text>
  <rect x="268" y="282" width="327" height="24" rx="3" fill="#6ee7b7" stroke="#047857" stroke-width="1.5"/>
  <rect x="704" y="278" width="148" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="778" y="299" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">캐시 재사용</text>

  <!-- app.js -->
  <text x="48" y="346" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">app.js</text>
  <text x="48" y="367" font-size="14" fill="#4b5563">내 코드</text>
  <text x="250" y="355" font-size="15" fill="#111827" text-anchor="end">150KB</text>
  <rect x="268" y="338" width="70" height="24" rx="3" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="704" y="334" width="148" height="32" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="778" y="355" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">바뀜 → 다시 받음</text>

  <!-- home.js -->
  <text x="48" y="402" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">home.js</text>
  <text x="48" y="423" font-size="14" fill="#4b5563">라우트별 청크</text>
  <text x="250" y="411" font-size="15" fill="#111827" text-anchor="end">30KB</text>
  <rect x="268" y="394" width="14" height="24" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

  <!-- admin.js -->
  <text x="48" y="458" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">admin.js</text>
  <text x="48" y="479" font-size="14" fill="#4b5563">라우트별 청크</text>
  <text x="250" y="467" font-size="15" fill="#111827" text-anchor="end">20KB</text>
  <rect x="268" y="450" width="9" height="24" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

  <!-- runtime.js -->
  <text x="48" y="514" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">runtime.js</text>
  <text x="48" y="535" font-size="14" fill="#4b5563">번들러 런타임</text>
  <text x="250" y="523" font-size="15" fill="#111827" text-anchor="end">2KB</text>
  <rect x="268" y="506" width="2" height="24" fill="#64748b"/>

  <!-- B 결론 -->
  <rect x="32" y="566" width="816" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="598" font-size="15" fill="#111827">내 코드를 고치면 <tspan font-weight="bold" fill="#b91c1c">app.js만 바뀐다.</tspan></text>
  <text x="56" y="626" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#047857">vendor.js</tspan>는 브라우저 캐시에서 그대로 <tspan font-weight="bold" fill="#047857">재사용</tspan>.</text>
</svg>
