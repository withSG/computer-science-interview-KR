<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">var 사용 vs let 사용 시 클로저 환경 레코드 차이</title>
  <desc id="d">var 키워드는 단 하나의 환경 레코드를 공유하여 문제가 발생하지만, let 키워드는 반복마다 새로운 환경 레코드를 생성함을 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- ==================== 상단 섹션: var 사용 ==================== -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">var 사용</text>

  <!-- var 박스 -->
  <rect x="230" y="45" width="420" height="60" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="70" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">함수(또는 전역) 환경 레코드</text>
  
  <text x="330" y="90" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">i : 3</text>
  <text x="490" y="90" font-size="13" fill="#52606d" text-anchor="middle">← 딱 하나만 존재</text>

  <!-- var 화살표 -->
  <path d="M290,140 L350,113" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <path d="M440,140 L440,113" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <path d="M590,140 L530,113" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>

  <!-- var 부가 설명 (오른쪽) -->
  <text x="665" y="127" font-size="11.5" fill="#52606d">세 콜백이 같은 바인딩을 참조</text>

  <!-- var 콜백 라벨들 -->
  <text x="290" y="155" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">콜백0</text>
  <text x="440" y="155" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">콜백1</text>
  <text x="590" y="155" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">콜백2</text>


  <!-- 구분선 -->
  <line x1="30" y1="185" x2="850" y2="185" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>


  <!-- ==================== 하단 섹션: let 사용 ==================== -->
  <text x="30" y="223" font-size="16" font-weight="bold" fill="#1f2933">let 사용</text>

  <!-- let 박스 1 -->
  <rect x="210" y="235" width="160" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290" y="265" font-size="13" fill="#1f2933" text-anchor="middle">반복1: i=0</text>

  <!-- let 박스 2 -->
  <rect x="390" y="235" width="160" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="265" font-size="13" fill="#1f2933" text-anchor="middle">반복2: i=1</text>

  <!-- let 박스 3 -->
  <rect x="570" y="235" width="160" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="650" y="265" font-size="13" fill="#1f2933" text-anchor="middle">반복3: i=2</text>

  <!-- let 부가 설명 (오른쪽) -->
  <text x="745" y="265" font-size="11.5" fill="#52606d">반복마다 새 환경</text>

  <!-- let 화살표 -->
  <path d="M290,325 L290,293" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M470,325 L470,293" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M650,325 L650,293" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- let 콜백 라벨들 -->
  <text x="290" y="340" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">콜백0</text>
  <text x="470" y="340" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">콜백1</text>
  <text x="650" y="340" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">콜백2</text>
</svg>