<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">var와 let 반복문에서 콜백이 붙잡는 바인딩</title>
  <desc id="d">var 루프에서는 함수(또는 전역) 환경 레코드에 i 바인딩이 하나만 있어 세 콜백이 모두 i : 3을 보고 3 3 3을 출력한다. let 루프에서는 반복마다 새 환경(i=0, i=1, i=2)이 생겨 각 콜백이 자기 바인딩을 붙잡고 0 1 2를 출력한다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- ===== var 사용 ===== -->
  <rect x="24" y="24" width="404" height="402" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="48" y="58" font-size="20" font-weight="700" fill="#b91c1c">var 사용</text>
  <text x="48" y="86" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">for (var i = 0; i &lt; 3; i++)</text>

  <rect x="48" y="108" width="356" height="84" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="226" y="136" font-size="15" fill="#111827" text-anchor="middle">함수(또는 전역) 환경 레코드</text>
  <text x="128" y="175" font-size="22" font-weight="700" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">i : 3</text>
  <text x="208" y="174" font-size="15" fill="#b91c1c">← 딱 하나만 존재</text>

  <path d="M102,256 L176,198" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M226,256 L226,198" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M350,256 L276,198" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <rect x="54" y="258" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="284" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">콜백0</text>
  <rect x="178" y="258" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="284" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">콜백1</text>
  <rect x="302" y="258" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="350" y="284" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">콜백2</text>

  <text x="226" y="328" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">세 콜백이 같은 바인딩을 참조</text>

  <rect x="48" y="344" width="356" height="64" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/>
  <text x="226" y="370" font-size="19" font-weight="700" fill="#b91c1c" text-anchor="middle">출력: 3 3 3</text>
  <text x="226" y="396" font-size="15" fill="#374151" text-anchor="middle">콜백이 실행될 때 i는 이미 3</text>

  <!-- ===== let 사용 ===== -->
  <rect x="452" y="24" width="404" height="402" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="476" y="58" font-size="20" font-weight="700" fill="#1d4ed8">let 사용</text>
  <text x="476" y="86" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">for (let i = 0; i &lt; 3; i++)</text>

  <rect x="476" y="108" width="108" height="84" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="530" y="136" font-size="15" fill="#111827" text-anchor="middle">반복1</text>
  <text x="530" y="175" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">i=0</text>
  <rect x="600" y="108" width="108" height="84" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="654" y="136" font-size="15" fill="#111827" text-anchor="middle">반복2</text>
  <text x="654" y="175" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">i=1</text>
  <rect x="724" y="108" width="108" height="84" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="778" y="136" font-size="15" fill="#111827" text-anchor="middle">반복3</text>
  <text x="778" y="175" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">i=2</text>

  <path d="M530,256 L530,198" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <path d="M654,256 L654,198" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <path d="M778,256 L778,198" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)"/>

  <rect x="482" y="258" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="530" y="284" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">콜백0</text>
  <rect x="606" y="258" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="654" y="284" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">콜백1</text>
  <rect x="730" y="258" width="96" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="778" y="284" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">콜백2</text>

  <text x="654" y="328" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">반복마다 새 환경</text>

  <rect x="476" y="344" width="356" height="64" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="654" y="370" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">출력: 0 1 2</text>
  <text x="654" y="396" font-size="15" fill="#374151" text-anchor="middle">각 콜백이 서로 다른 바인딩을 붙잡음</text>
</svg>
