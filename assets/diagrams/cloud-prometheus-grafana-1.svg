<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Prometheus Pull 방식 수집 구조</title>
  <desc id="d">Prometheus가 15초마다 app pod 두 개와 node_exporter의 /metrics에 GET 요청을 보내 메트릭을 긁어온다. Grafana는 PromQL로 Prometheus를 조회하고, Rule Engine은 Alertmanager로 알림을 보낸다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Prometheus (중앙) -->
  <rect x="270" y="24" width="340" height="200" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="440" y="57" font-size="20" font-weight="bold" fill="#9a3412" text-anchor="middle">Prometheus</text>
  <rect x="294" y="74" width="292" height="56" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="440" y="108" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">TSDB</tspan><tspan fill="#4b5563" font-size="15"> (로컬 디스크)</tspan></text>
  <rect x="294" y="146" width="292" height="56" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="440" y="180" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Rule Engine</text>

  <!-- Grafana → Prometheus -->
  <rect x="24" y="74" width="150" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="99" y="108" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Grafana</text>
  <line x1="176" y1="102" x2="266" y2="102" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>
  <text x="220" y="92" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">PromQL</text>

  <!-- Rule Engine → Alertmanager -->
  <line x1="588" y1="174" x2="686" y2="174" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>
  <rect x="690" y="146" width="166" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="773" y="180" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">Alertmanager</text>

  <!-- 스크랩: Prometheus → 타겟 -->
  <line x1="440" y1="226" x2="440" y2="300" stroke="#047857" stroke-width="2.5"/>
  <text x="456" y="256" font-size="16" font-weight="bold" fill="#047857">15초마다 GET /metrics</text>
  <text x="456" y="280" font-size="14" fill="#4b5563">Prometheus가 직접 긁어옴 (scrape)</text>
  <line x1="144" y1="300" x2="736" y2="300" stroke="#047857" stroke-width="2.5"/>
  <line x1="144" y1="299" x2="144" y2="336" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <line x1="440" y1="299" x2="440" y2="336" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <line x1="736" y1="299" x2="736" y2="336" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>

  <!-- 타겟 1: app pod -->
  <rect x="24" y="340" width="240" height="112" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="144" y="374" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">app pod</text>
  <text x="144" y="402" font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:8080</text>
  <text x="144" y="430" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/metrics</text>

  <!-- 타겟 2: app pod -->
  <rect x="320" y="340" width="240" height="112" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="374" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">app pod</text>
  <text x="440" y="402" font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:8080</text>
  <text x="440" y="430" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/metrics</text>

  <!-- 타겟 3: node_exporter -->
  <rect x="616" y="340" width="240" height="112" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="736" y="374" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">node_exporter</text>
  <text x="736" y="402" font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:9100</text>
  <text x="736" y="430" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/metrics</text>
</svg>
