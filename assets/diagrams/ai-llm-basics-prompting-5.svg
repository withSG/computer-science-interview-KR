<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Temperature별 확률 분포</title>
  <desc id="d">원래 분포(T=1.0) 서울 .60, 부산 .22, 대구 .12, 인천 .06이 T=0.2에서는 서울 .99, 부산 .01, 대구 .00, 인천 .00으로 뾰족해져 거의 항상 서울(사실상 argmax)이 되고, T=1.5에서는 서울 .48, 부산 .25, 대구 .17, 인천 .10으로 평탄해져 가끔 인천도 나온다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>

  <text x="440" y="42" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">높은 확률 토큰에 집중되거나(T ↓) 흩어진다(T ↑)</text>

  <!-- ===== 원래 분포 (T=1.0) ===== -->
  <rect x="24" y="70" width="264" height="42" rx="6" fill="#f1f5f9"/>
  <rect x="24" y="100" width="264" height="12" fill="#f1f5f9"/>
  <rect x="24" y="70" width="264" height="208" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="156" y="97" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">원래 분포 (T=1.0)</text>
  <line x1="88" y1="124" x2="88" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="42" y="146" font-size="16" fill="#111827">서울</text>
  <rect x="88" y="129" width="90" height="22" fill="#64748b"/>
  <text x="186" y="146" font-size="16" fill="#111827">.60</text>
  <text x="42" y="182" font-size="16" fill="#111827">부산</text>
  <rect x="88" y="165" width="33" height="22" fill="#64748b"/>
  <text x="129" y="182" font-size="16" fill="#111827">.22</text>
  <text x="42" y="218" font-size="16" fill="#111827">대구</text>
  <rect x="88" y="201" width="18" height="22" fill="#64748b"/>
  <text x="114" y="218" font-size="16" fill="#111827">.12</text>
  <text x="42" y="254" font-size="16" fill="#111827">인천</text>
  <rect x="88" y="237" width="9" height="22" fill="#64748b"/>
  <text x="105" y="254" font-size="16" fill="#111827">.06</text>

  <!-- ===== T=0.2 (뾰족) ===== -->
  <rect x="308" y="70" width="264" height="42" rx="6" fill="#dbeafe"/>
  <rect x="308" y="100" width="264" height="12" fill="#dbeafe"/>
  <rect x="316" y="124" width="248" height="30" rx="4" fill="#eff6ff"/>
  <rect x="308" y="70" width="264" height="208" rx="6" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="97" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">T=0.2 (뾰족)</text>
  <line x1="372" y1="124" x2="372" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="326" y="146" font-size="16" font-weight="bold" fill="#111827">서울</text>
  <rect x="372" y="129" width="149" height="22" fill="#2563eb"/>
  <text x="529" y="146" font-size="16" font-weight="bold" fill="#111827">.99</text>
  <text x="326" y="182" font-size="16" fill="#111827">부산</text>
  <rect x="372" y="165" width="2" height="22" fill="#2563eb"/>
  <text x="382" y="182" font-size="16" fill="#111827">.01</text>
  <text x="326" y="218" font-size="16" fill="#111827">대구</text>
  <text x="380" y="218" font-size="16" fill="#111827">.00</text>
  <text x="326" y="254" font-size="16" fill="#111827">인천</text>
  <text x="380" y="254" font-size="16" fill="#111827">.00</text>

  <!-- ===== T=1.5 (평탄) ===== -->
  <rect x="592" y="70" width="264" height="42" rx="6" fill="#fef3c7"/>
  <rect x="592" y="100" width="264" height="12" fill="#fef3c7"/>
  <rect x="600" y="232" width="248" height="30" rx="4" fill="#fff7ed"/>
  <rect x="592" y="70" width="264" height="208" rx="6" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="724" y="97" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">T=1.5 (평탄)</text>
  <line x1="656" y1="124" x2="656" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="610" y="146" font-size="16" fill="#111827">서울</text>
  <rect x="656" y="129" width="72" height="22" fill="#d97706"/>
  <text x="736" y="146" font-size="16" fill="#111827">.48</text>
  <text x="610" y="182" font-size="16" fill="#111827">부산</text>
  <rect x="656" y="165" width="38" height="22" fill="#d97706"/>
  <text x="702" y="182" font-size="16" fill="#111827">.25</text>
  <text x="610" y="218" font-size="16" fill="#111827">대구</text>
  <rect x="656" y="201" width="26" height="22" fill="#d97706"/>
  <text x="690" y="218" font-size="16" fill="#111827">.17</text>
  <text x="610" y="254" font-size="16" font-weight="bold" fill="#111827">인천</text>
  <rect x="656" y="237" width="15" height="22" fill="#d97706"/>
  <text x="679" y="254" font-size="16" font-weight="bold" fill="#111827">.10</text>

  <!-- 해석 -->
  <text x="440" y="308" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">거의 항상 서울</text>
  <text x="440" y="331" font-size="15" fill="#374151" text-anchor="middle">(사실상 argmax)</text>
  <text x="724" y="308" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">가끔 인천도 나온다</text>
  <text x="724" y="331" font-size="15" fill="#374151" text-anchor="middle">(창의적 == 틀리기도 쉬움)</text>
</svg>
