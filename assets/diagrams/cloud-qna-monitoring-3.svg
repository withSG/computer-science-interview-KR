<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Prometheus·Grafana 아키텍처</title>
  <desc id="d">Grafana가 PromQL로 Prometheus에 쿼리하고, Prometheus는 TSDB에 메트릭을 저장하며 App(:8080/metrics, :8081/metrics)과 Node Exporter(:9100)에서 메트릭을 Pull(scrape) 방식으로 가져온다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arr-q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Grafana -->
  <rect x="200" y="24" width="480" height="76" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="440" y="56" font-size="20" font-weight="bold" fill="#7c2d12" text-anchor="middle">Grafana</text>
  <text x="440" y="84" font-size="16" fill="#374151" text-anchor="middle">(시각화/대시보드)</text>

  <!-- Query (PromQL) -->
  <line x1="440" y1="102" x2="440" y2="154" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-q)"/>
  <text x="456" y="134" font-size="15" font-weight="bold" fill="#1d4ed8">Query (PromQL)</text>

  <!-- Prometheus -->
  <rect x="200" y="158" width="480" height="152" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="190" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Prometheus</text>
  <text x="440" y="214" font-size="16" fill="#374151" text-anchor="middle">(메트릭 저장소)</text>
  <rect x="232" y="232" width="416" height="58" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="440" y="267" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">TSDB (Time Series DB)</text>

  <!-- Pull (scrape) -->
  <line x1="440" y1="312" x2="440" y2="356" stroke="#047857" stroke-width="2"/>
  <line x1="200" y1="356" x2="680" y2="356" stroke="#047857" stroke-width="2"/>
  <line x1="200" y1="356" x2="200" y2="390" stroke="#047857" stroke-width="2" marker-end="url(#arr-p)"/>
  <line x1="440" y1="356" x2="440" y2="390" stroke="#047857" stroke-width="2" marker-end="url(#arr-p)"/>
  <line x1="680" y1="356" x2="680" y2="390" stroke="#047857" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="456" y="340" font-size="15" font-weight="bold" fill="#047857">Pull (scrape)</text>

  <!-- 수집 대상 -->
  <rect x="100" y="394" width="200" height="90" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="200" y="428" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">App</text>
  <text x="200" y="458" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:8080/metrics</text>

  <rect x="340" y="394" width="200" height="90" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="428" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">App</text>
  <text x="440" y="458" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:8081/metrics</text>

  <rect x="580" y="394" width="200" height="90" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="680" y="428" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">Node Exporter</text>
  <text x="680" y="458" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">:9100</text>
</svg>
