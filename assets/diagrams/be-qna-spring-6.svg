<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Spring AOP 프록시 동작 흐름</title>
  <desc id="d">Client의 호출이 Proxy로 가고, Proxy가 Advice를 실행한 뒤 Target 메서드를 호출하고, 다시 Advice를 실행한 다음 Client로 돌아가는 순서를 Client·Proxy·Target 세 참여자의 시퀀스로 보여준다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 참여자 머리 -->
  <rect x="45" y="24" width="170" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="130" y="54" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Client</text>
  <rect x="355" y="24" width="170" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="54" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Proxy</text>
  <rect x="665" y="24" width="170" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="750" y="54" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">Target</text>

  <!-- 생명선 -->
  <line x1="130" y1="72" x2="130" y2="444" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="440" y1="72" x2="440" y2="146" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="440" y1="196" x2="440" y2="320" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="440" y1="370" x2="440" y2="444" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="750" y1="72" x2="750" y2="444" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ① Client → Proxy -->
  <text x="285" y="106" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">① 호출</text>
  <line x1="131" y1="118" x2="438" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ② Advice 실행 -->
  <rect x="355" y="146" width="170" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="177" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">② Advice 실행</text>

  <!-- ③ Proxy → Target -->
  <text x="595" y="230" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">③ Target 메서드 호출</text>
  <line x1="441" y1="242" x2="748" y2="242" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="742" y="236" width="16" height="56" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>

  <!-- Target → Proxy 반환 -->
  <line x1="741" y1="286" x2="442" y2="286" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="595" y="310" font-size="15" fill="#4b5563" text-anchor="middle">반환</text>

  <!-- ④ Advice 실행 -->
  <rect x="355" y="320" width="170" height="50" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="351" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">④ Advice 실행</text>

  <!-- ⑤ Proxy → Client -->
  <text x="285" y="404" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">⑤ 결과 반환</text>
  <line x1="439" y1="416" x2="132" y2="416" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
</svg>
