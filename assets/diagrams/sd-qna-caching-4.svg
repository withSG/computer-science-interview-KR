<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cache Stampede와 해결책</title>
  <desc id="d">많은 요청이 동시에 Cache Miss를 내 DB가 과부하되는 문제와, 이를 막는 Lock (Mutex), Early Expiration, Probabilistic Early Expiration 세 가지 해결책.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 문제 -->
  <rect x="40" y="26" width="64" height="30" rx="15" fill="#b91c1c"/>
  <text x="72" y="47" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">문제</text>
  <text x="120" y="48" font-size="18" font-weight="bold" fill="#111827">많은 요청이 동시에 Cache Miss → DB 과부하</text>

  <!-- 동시 요청 -->
  <rect x="40" y="84" width="110" height="34" rx="6" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="95" y="106" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">요청</text>
  <rect x="40" y="128" width="110" height="34" rx="6" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="95" y="150" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">요청</text>
  <rect x="40" y="172" width="110" height="34" rx="6" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="95" y="194" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">요청</text>
  <rect x="40" y="216" width="110" height="34" rx="6" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="95" y="238" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">요청</text>

  <line x1="152" y1="101" x2="324" y2="142" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <line x1="152" y1="145" x2="324" y2="158" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <line x1="152" y1="189" x2="324" y2="174" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <line x1="152" y1="233" x2="324" y2="190" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah-gray)"/>

  <!-- 캐시: Cache Miss -->
  <rect x="330" y="116" width="180" height="100" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="420" y="156" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">캐시</text>
  <text x="420" y="186" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">Cache Miss</text>

  <!-- 모두 DB로 -->
  <line x1="512" y1="136" x2="664" y2="136" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="512" y1="156" x2="664" y2="156" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="512" y1="176" x2="664" y2="176" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="512" y1="196" x2="664" y2="196" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>

  <!-- DB 과부하 -->
  <rect x="670" y="106" width="170" height="120" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="755" y="158" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>
  <text x="755" y="188" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">과부하</text>

  <!-- 구분선 -->
  <line x1="40" y1="276" x2="840" y2="276" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- 해결책 -->
  <rect x="40" y="298" width="80" height="30" rx="15" fill="#047857"/>
  <text x="80" y="319" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">해결책</text>

  <!-- 1. Lock -->
  <rect x="40" y="344" width="800" height="54" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="72" cy="371" r="15" fill="#047857"/>
  <text x="72" y="377" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="102" y="377" font-size="17" font-weight="bold" fill="#111827">Lock (Mutex)</text>
  <line x1="450" y1="356" x2="450" y2="386" stroke="#86efac" stroke-width="1.5"/>
  <text x="472" y="377" font-size="16" fill="#1f2937">하나의 요청만 DB 조회</text>

  <!-- 2. Early Expiration -->
  <rect x="40" y="408" width="800" height="54" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="72" cy="435" r="15" fill="#047857"/>
  <text x="72" y="441" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="102" y="441" font-size="17" font-weight="bold" fill="#111827">Early Expiration</text>
  <line x1="450" y1="420" x2="450" y2="450" stroke="#86efac" stroke-width="1.5"/>
  <text x="472" y="441" font-size="16" fill="#1f2937">만료 전에 미리 갱신</text>

  <!-- 3. Probabilistic Early Expiration -->
  <rect x="40" y="472" width="800" height="54" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="72" cy="499" r="15" fill="#047857"/>
  <text x="72" y="505" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="102" y="505" font-size="17" font-weight="bold" fill="#111827">Probabilistic Early Expiration</text>
  <line x1="450" y1="484" x2="450" y2="514" stroke="#86efac" stroke-width="1.5"/>
  <text x="472" y="505" font-size="16" fill="#1f2937">확률적으로 미리 갱신</text>
</svg>
