<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DocumentFragment가 왜 싼가</title>
  <desc id="d">DocumentFragment를 사용했을 때와 안티패턴 상황에서의 레이아웃 계산 및 스타일 재계산 차이를 보여주는 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Section 1: 안티패턴 -->
  <rect x="24" y="24" width="832" height="180" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="40" y="55" font-size="16" font-weight="bold" fill="#dc2626">[안티패턴] 매번 살아 있는 문서를 건드린다</text>

  <!-- Flow 1-1 -->
  <rect x="60" y="75" width="90" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="105" y="97" font-size="13" text-anchor="middle" fill="#1f2933">문서</text>

  <path d="M150,93 L320,93" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="210" y="83" width="50" height="20" fill="#ffffff"/>
  <text x="235" y="97" font-size="11.5" text-anchor="middle" fill="#dc2626">변경</text>

  <rect x="320" y="75" width="220" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="430" y="97" font-size="13" text-anchor="middle" fill="#1f2933">스타일/레이아웃 대상</text>

  <text x="560" y="97" font-size="13" font-weight="bold" fill="#dc2626">(1000회 누적)</text>

  <!-- Flow 1-2 -->
  <rect x="60" y="125" width="90" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="105" y="147" font-size="13" text-anchor="middle" fill="#1f2933">문서</text>

  <path d="M150,143 L320,143" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="210" y="133" width="50" height="20" fill="#ffffff"/>
  <text x="235" y="147" font-size="11.5" text-anchor="middle" fill="#dc2626">변경</text>

  <rect x="320" y="125" width="220" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="430" y="147" font-size="13" text-anchor="middle" fill="#1f2933">스타일/레이아웃 대상</text>

  <text x="60" y="182" font-size="14" font-weight="bold" fill="#dc2626">...</text>

  <!-- Section 2: 개선 -->
  <rect x="24" y="224" width="832" height="252" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="40" y="255" font-size="16" font-weight="bold" fill="#059669">[개선] 문서 밖에서 조립 후 한 번에 삽입</text>

  <!-- Fragment Box -->
  <rect x="60" y="275" width="230" height="80" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="76" y="303" font-size="14" font-weight="bold" fill="#1f2933">Fragment</text>
  <text x="76" y="333" font-size="13" fill="#52606d">li li li …</text>

  <!-- Annotations next to Fragment -->
  <text x="306" y="303" font-size="13" fill="#52606d">← 문서에 속하지 않는다</text>
  <text x="320" y="333" font-size="13" fill="#059669">= 렌더 트리 대상이 아님 = 레이아웃 계산 없음</text>

  <!-- Flow 2 Down Arrow -->
  <path d="M175,355 L175,410" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="190" y="373" width="150" height="20" fill="#ffffff"/>
  <text x="195" y="387" font-size="11.5" fill="#059669">appendChild 한 번</text>

  <!-- Flow 2 Horizontal -->
  <rect x="130" y="410" width="90" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="175" y="432" font-size="13" text-anchor="middle" fill="#1f2933">문서</text>

  <path d="M220,428 L320,428" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="320" y="410" width="220" height="36" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="430" y="432" font-size="13" text-anchor="middle" fill="#059669">스타일/레이아웃 1회</text>
</svg>