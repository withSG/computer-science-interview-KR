<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DocumentFragment가 싼 이유</title>
  <desc id="d">안티패턴은 매번 살아 있는 문서를 변경해 스타일/레이아웃 대상이 1000회 누적되고, 개선안은 문서에 속하지 않는 Fragment에 li를 모은 뒤 appendChild 한 번으로 삽입해 스타일/레이아웃이 1회만 일어남을 비교합니다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ===== 안티패턴 ===== -->
  <rect x="24" y="24" width="404" height="282" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#b91c1c">안티패턴</text>
  <text x="44" y="82" font-size="15" fill="#374151">매번 살아 있는 문서를 건드린다</text>

  <!-- 1번째 -->
  <rect x="44" y="104" width="72" height="36" rx="5" fill="#ffffff" stroke="#6b7280"/>
  <text x="80" y="127" font-size="15" fill="#111827" text-anchor="middle">문서</text>
  <path d="M120,126 H190" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#arr-red)"/>
  <text x="155" y="118" font-size="14" fill="#b91c1c" text-anchor="middle">변경</text>
  <rect x="196" y="104" width="188" height="36" rx="5" fill="#ffffff" stroke="#6b7280"/>
  <text x="290" y="127" font-size="15" fill="#111827" text-anchor="middle">스타일/레이아웃 대상</text>

  <!-- 2번째 -->
  <rect x="44" y="154" width="72" height="36" rx="5" fill="#ffffff" stroke="#6b7280"/>
  <text x="80" y="177" font-size="15" fill="#111827" text-anchor="middle">문서</text>
  <path d="M120,176 H190" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#arr-red)"/>
  <text x="155" y="168" font-size="14" fill="#b91c1c" text-anchor="middle">변경</text>
  <rect x="196" y="154" width="188" height="36" rx="5" fill="#ffffff" stroke="#6b7280"/>
  <text x="290" y="177" font-size="15" fill="#111827" text-anchor="middle">스타일/레이아웃 대상</text>

  <!-- … -->
  <g fill="#6b7280">
    <circle cx="80" cy="204" r="2.5"/><circle cx="80" cy="214" r="2.5"/><circle cx="80" cy="224" r="2.5"/>
    <circle cx="290" cy="204" r="2.5"/><circle cx="290" cy="214" r="2.5"/><circle cx="290" cy="224" r="2.5"/>
  </g>

  <!-- 결과 -->
  <rect x="44" y="244" width="364" height="44" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="226" y="273" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">1000회 누적</text>

  <!-- ===== 개선 ===== -->
  <rect x="452" y="24" width="404" height="282" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="472" y="56" font-size="18" font-weight="bold" fill="#047857">개선</text>
  <text x="472" y="82" font-size="15" fill="#374151">문서 밖에서 조립 후 한 번에 삽입</text>

  <!-- Fragment -->
  <rect x="472" y="104" width="180" height="86" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="488" y="130" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Fragment</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="488" y="146" width="40" height="30" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="508" y="166">li</text>
    <rect x="534" y="146" width="40" height="30" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="554" y="166">li</text>
    <rect x="580" y="146" width="40" height="30" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="600" y="166">li</text>
  </g>
  <text x="626" y="166" font-size="16" fill="#4b5563">…</text>

  <text x="664" y="128" font-size="15" fill="#374151">← 문서에 속하지 않는다</text>
  <text x="664" y="154" font-size="15" fill="#047857">= 렌더 트리 대상이 아님</text>
  <text x="664" y="180" font-size="15" fill="#047857">= 레이아웃 계산 없음</text>

  <!-- appendChild 한 번 -->
  <path d="M562,194 V236" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="578" y="220" font-size="15" fill="#047857"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">appendChild</tspan> 한 번</text>

  <!-- 결과 -->
  <rect x="526" y="244" width="72" height="44" rx="5" fill="#ffffff" stroke="#6b7280"/>
  <text x="562" y="271" font-size="15" fill="#111827" text-anchor="middle">문서</text>
  <path d="M602,266 H656" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <rect x="662" y="244" width="174" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="749" y="272" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">스타일/레이아웃 1회</text>
</svg>
