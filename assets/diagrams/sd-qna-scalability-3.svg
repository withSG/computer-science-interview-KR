<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">로드 밸런서 구성</title>
  <desc id="d">들어오는 트래픽을 Load Balancer(Active)가 받아 Server1, Server2, Server3으로 분산하는 구성.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 들어오는 트래픽 -->
  <line x1="40" y1="160" x2="240" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="136" y="146" font-size="16" fill="#374151" text-anchor="middle">들어오는 트래픽</text>

  <!-- 로드 밸런서 -->
  <rect x="256" y="120" width="200" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="356" y="155" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Load Balancer</text>
  <text x="356" y="181" font-size="15" fill="#1d4ed8" text-anchor="middle">(Active)</text>

  <!-- 분산 -->
  <line x1="456" y1="160" x2="560" y2="160" stroke="#475569" stroke-width="2"/>
  <text x="508" y="146" font-size="15" fill="#374151" text-anchor="middle">분산</text>
  <line x1="560" y1="70" x2="560" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="559" y1="70" x2="638" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="160" x2="638" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="559" y1="250" x2="638" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 서버 -->
  <rect x="644" y="40" width="196" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="742" y="76" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">Server1</text>
  <rect x="644" y="130" width="196" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="742" y="166" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">Server2</text>
  <rect x="644" y="220" width="196" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="742" y="256" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">Server3</text>
</svg>
