<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">표기법과 케이스의 조합</title>
  <desc id="d">O(상한)·Ω(하한)·Θ(타이트) 세 표기법과 최선·평균·최악 세 케이스는 서로 다른 축이라, 3×3 아홉 칸 조합이 모두 말이 된다. 예로 삽입 정렬의 최선 케이스는 Θ(n)이다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 케이스 축 머리 -->
  <rect x="330" y="30" width="510" height="50" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="585" y="61" font-size="16" fill="#1f2937" text-anchor="middle"><tspan font-weight="bold">케이스</tspan> — 어떤 입력을 기준으로 함수를 정의할 것인가</text>

  <rect x="330" y="80" width="170" height="48" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="500" y="80" width="170" height="48" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="670" y="80" width="170" height="48" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="415" y="110" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">최선 케이스</text>
  <text x="585" y="110" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">평균 케이스</text>
  <text x="755" y="110" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">최악 케이스</text>

  <!-- 표기법 축 머리 -->
  <rect x="40" y="128" width="140" height="192" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="110" y="200" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">표기법</text>
  <text x="110" y="228" font-size="15" fill="#1f2937" text-anchor="middle">함수를 곡선에</text>
  <text x="110" y="250" font-size="15" fill="#1f2937" text-anchor="middle">가두는 방법</text>

  <rect x="180" y="128" width="150" height="64" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="180" y="192" width="150" height="64" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <rect x="180" y="256" width="150" height="64" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="200" y="166" font-size="17" fill="#111827"><tspan font-weight="bold">O</tspan> (상한)</text>
  <text x="200" y="230" font-size="17" fill="#111827"><tspan font-weight="bold">Ω</tspan> (하한)</text>
  <text x="200" y="294" font-size="17" fill="#111827"><tspan font-weight="bold">Θ</tspan> (타이트)</text>

  <!-- 9칸 -->
  <rect x="330" y="128" width="170" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="500" y="128" width="170" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="670" y="128" width="170" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="330" y="192" width="170" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="500" y="192" width="170" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="670" y="192" width="170" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="330" y="256" width="170" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <rect x="500" y="256" width="170" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="670" y="256" width="170" height="64" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

  <text x="415" y="169" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>
  <text x="585" y="169" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>
  <text x="755" y="169" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>
  <text x="415" y="233" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>
  <text x="585" y="233" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>
  <text x="755" y="233" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>
  <text x="415" y="284" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>
  <text x="415" y="308" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">예: 삽입 정렬 Θ(n)</text>
  <text x="585" y="297" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>
  <text x="755" y="297" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle">✓</text>

  <!-- 결론 -->
  <rect x="40" y="348" width="800" height="78" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="60" y="380" font-size="19" font-weight="bold" fill="#065f46">→ 서로 다른 축이라 9칸 전부 말이 된다</text>
  <text x="60" y="410" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#92400e">예:</tspan> “삽입 정렬의 최선 케이스는 Θ(n)이다”</text>
</svg>
