<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">흔한 오해</title>
  <desc id="d">시간 복잡도 표기법(O, Ω, Θ)과 케이스(최선, 평균, 최악)의 관계를 나타내는 표. 9가지 조합 모두 유효하다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  
  <text x="30" y="42" font-size="16" font-weight="bold" fill="#1f2933">흔한 오해</text>
  
  <rect x="30" y="65" width="820" height="210" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <path d="M 30 73 A 8 8 0 0 1 38 65 L 842 65 A 8 8 0 0 1 850 73 L 850 115 L 30 115 Z" fill="#eff6ff"/>
  
  <line x1="30" y1="115" x2="850" y2="115" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="250" y1="65" x2="250" y2="275" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <line x1="250" y1="168" x2="850" y2="168" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="250" y1="221" x2="850" y2="221" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  
  <line x1="450" y1="65" x2="450" y2="275" stroke="#e4e7eb" stroke-width="1"/>
  <line x1="650" y1="65" x2="650" y2="275" stroke="#e4e7eb" stroke-width="1"/>
  
  <text x="350" y="95" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">최선 케이스</text>
  <text x="550" y="95" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">평균 케이스</text>
  <text x="750" y="95" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">최악 케이스</text>
  
  <text x="50" y="146.5" font-size="13.5" font-weight="bold" fill="#1f2933">O (상한)</text>
  <text x="50" y="199.5" font-size="13.5" font-weight="bold" fill="#1f2933">Ω (하한)</text>
  <text x="50" y="252.5" font-size="13.5" font-weight="bold" fill="#1f2933">Θ (타이트)</text>
  
  <text x="350" y="146.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  <text x="550" y="146.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  <text x="750" y="146.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  
  <text x="350" y="199.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  <text x="550" y="199.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  <text x="750" y="199.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  
  <text x="350" y="252.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  <text x="550" y="252.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  <text x="750" y="252.5" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">✓</text>
  
  <rect x="30" y="295" width="820" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="50" y="324" font-size="13" fill="#1d4ed8">→ 9칸 전부 말이 된다. 예: "삽입 정렬의 최선 케이스는 Θ(n)이다"</text>
