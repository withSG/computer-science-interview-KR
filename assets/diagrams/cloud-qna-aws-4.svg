<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CloudWatch 연동 흐름</title>
  <desc id="d">CloudWatch Alarm(CPU &gt; 70%)이 Auto Scaling Group을 움직여 EC2 인스턴스를 추가하고, 추가된 인스턴스가 ALB에 자동 등록되는 4단계 흐름.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 화살표 -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M440,92 V122" marker-end="url(#ah)"/>
    <path d="M440,196 V226" marker-end="url(#ah)"/>
    <path d="M440,300 V330" marker-end="url(#ah)"/>
  </g>

  <!-- 1 -->
  <rect x="200" y="24" width="480" height="64" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <circle cx="240" cy="56" r="17" fill="#b45309"/>
  <text x="240" y="62" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="274" y="62" font-size="17" font-weight="bold" fill="#111827">CloudWatch Alarm <tspan fill="#b45309">(CPU &gt; 70%)</tspan></text>

  <!-- 2 -->
  <rect x="200" y="128" width="480" height="64" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <circle cx="240" cy="160" r="17" fill="#1d4ed8"/>
  <text x="240" y="166" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="274" y="166" font-size="17" font-weight="bold" fill="#111827">Auto Scaling Group</text>

  <!-- 3 -->
  <rect x="200" y="232" width="480" height="64" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <circle cx="240" cy="264" r="17" fill="#1d4ed8"/>
  <text x="240" y="270" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="274" y="270" font-size="17" font-weight="bold" fill="#111827">EC2 인스턴스 추가</text>

  <!-- 4 -->
  <rect x="200" y="336" width="480" height="64" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <circle cx="240" cy="368" r="17" fill="#1d4ed8"/>
  <text x="240" y="374" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="274" y="374" font-size="17" font-weight="bold" fill="#111827">ALB에 자동 등록</text>
</svg>
