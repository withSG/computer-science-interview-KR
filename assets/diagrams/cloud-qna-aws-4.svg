<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CloudWatch 연동</title>
  <desc id="d">CloudWatch Alarm 발생 시 Auto Scaling Group을 통해 EC2 인스턴스가 추가되고 ALB에 자동 등록되는 흐름도</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>
  
  <text x="440" y="39.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">CloudWatch 연동</text>
  
  <!-- Step 1: CloudWatch Alarm (CPU > 70%) -->
  <rect x="290" y="70" width="300" height="50" rx="6" ry="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="100.25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">CloudWatch Alarm (CPU &gt; 70%)</text>
  
  <!-- Arrow 1 -->
  <path d="M440,120 L440,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Step 2: Auto Scaling Group -->
  <rect x="290" y="170" width="300" height="50" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="200.25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Auto Scaling Group</text>
  
  <!-- Arrow 2 -->
  <path d="M440,220 L440,270" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Step 3: EC2 인스턴스 추가 -->
  <rect x="290" y="270" width="300" height="50" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="300.25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">EC2 인스턴스 추가</text>
  
  <!-- Arrow 3 -->
  <path d="M440,320 L440,370" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Step 4: ALB에 자동 등록 -->
  <rect x="290" y="370" width="300" height="50" rx="6" ry="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="400.25" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">ALB에 자동 등록</text>
</svg>