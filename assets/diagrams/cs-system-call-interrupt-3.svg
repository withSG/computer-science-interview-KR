<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 830" width="880" height="830" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">인터럽트 처리 과정</title>
  <desc id="d">CPU가 명령어를 실행하던 중 장치가 인터럽트 신호를 보내면, 현재 명령어를 끝까지 완료하고 상태 저장, 벡터 테이블 조회, ISR 실행, 완료 통지, 상태 복원을 거쳐 중단 지점부터 실행을 재개하는 7단계를 순서대로 보여 줍니다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="880" height="830" fill="#ffffff"/>

  <!-- 시작: CPU 실행 중 + 장치 신호 -->
  <rect x="40" y="24" width="260" height="44" rx="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="52" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">CPU: 명령어 실행 중</text>

  <rect x="556" y="86" width="260" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="686" y="114" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">장치가 인터럽트 신호 발생</text>
  <path d="M552,108 L102,108" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arr-sig)"/>

  <!-- 흐름 척추 -->
  <path d="M96,70 L96,146" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M96,184 L96,252" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M96,290 L96,332" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M96,370 L96,438" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M96,476 L96,570" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M96,608 L96,650" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M96,688 L96,730" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 1 -->
  <circle cx="96" cy="166" r="16" fill="#1d4ed8"/>
  <text x="96" y="171" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="128" y="140" width="712" height="78" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="148" y="172" font-size="17" font-weight="bold" fill="#111827">현재 명령어를 끝까지 완료</text>
  <text x="148" y="202" font-size="15" font-weight="bold" fill="#b91c1c">명령어 도중에 끊지 않는다</text>

  <!-- 2 -->
  <circle cx="96" cy="272" r="16" fill="#374151"/>
  <text x="96" y="277" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="128" y="246" width="712" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="148" y="278" font-size="17" font-weight="bold" fill="#111827">PC와 상태 레지스터를 저장, 커널 모드 진입</text>

  <!-- 3 -->
  <circle cx="96" cy="352" r="16" fill="#374151"/>
  <text x="96" y="357" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="128" y="326" width="712" height="78" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="148" y="358" font-size="17" font-weight="bold" fill="#111827">인터럽트 번호로 인터럽트 벡터 테이블 조회</text>
  <text x="148" y="388" font-size="15" fill="#374151">(x86에서는 IDT: Interrupt Descriptor Table)</text>

  <!-- 4 -->
  <circle cx="96" cy="458" r="16" fill="#6d28d9"/>
  <text x="96" y="463" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="128" y="432" width="712" height="104" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="148" y="464" font-size="17" font-weight="bold" fill="#111827">ISR(Interrupt Service Routine) 실행</text>
  <text x="148" y="494" font-size="15" fill="#374151">· 같은 종류의 인터럽트는 잠시 막아둔다</text>
  <text x="148" y="520" font-size="15" fill="#374151">· 최소한의 일만 하고 빨리 끝낸다</text>

  <!-- 5 -->
  <circle cx="96" cy="590" r="16" fill="#374151"/>
  <text x="96" y="595" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="128" y="564" width="712" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="148" y="596" font-size="17" font-weight="bold" fill="#111827">인터럽트 처리 완료를 컨트롤러에 알림</text>

  <!-- 6 -->
  <circle cx="96" cy="670" r="16" fill="#374151"/>
  <text x="96" y="675" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="128" y="644" width="712" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="148" y="676" font-size="17" font-weight="bold" fill="#111827">저장했던 상태 복원, 원래 모드로 복귀</text>

  <!-- 7 -->
  <circle cx="96" cy="750" r="16" fill="#047857"/>
  <text x="96" y="755" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="128" y="724" width="712" height="78" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="148" y="756" font-size="17" font-weight="bold" fill="#111827">중단됐던 지점부터 실행 재개</text>
  <text x="148" y="786" font-size="15" fill="#374151">(단, 스케줄러가 개입해 다른 프로세스가 선택될 수도 있다)</text>
</svg>
