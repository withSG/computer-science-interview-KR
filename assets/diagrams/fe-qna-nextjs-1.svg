<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">하이드레이션 과정</title>
  <desc id="d">하이드레이션의 5단계 순서를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 문서 헤딩 -->
  <text x="40" y="42" font-size="16" font-weight="bold" fill="#1f2933">하이드레이션 과정</text>

  <!-- 1. 서버: HTML 렌더링 → 클라이언트 전송 -->
  <rect x="80" y="70" width="720" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="100" y="80" width="230" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="215" y="102" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1. 서버: HTML 렌더링</text>
  <path d="M340,97 L430,97" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="440" y="80" width="220" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="550" y="102" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트 전송</text>

  <!-- 화살표 1 -> 2 -->
  <path d="M440,124 L440,154" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 2. 브라우저: HTML 표시 (정적, 클릭 안됨) -->
  <rect x="80" y="154" width="720" height="54" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="186" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2. 브라우저: HTML 표시 (정적, 클릭 안됨)</text>

  <!-- 화살표 2 -> 3 -->
  <path d="M440,208 L440,238" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 3. JS 다운로드 및 파싱 -->
  <rect x="80" y="238" width="720" height="54" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="270" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3. JS 다운로드 및 파싱</text>

  <!-- 화살표 3 -> 4 -->
  <path d="M440,292 L440,322" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 4. React 하이드레이션: DOM에 이벤트 연결 -->
  <rect x="80" y="322" width="720" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="354" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">4. React 하이드레이션: DOM에 이벤트 연결</text>

  <!-- 화살표 4 -> 5 -->
  <path d="M440,376 L440,406" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 5. 페이지 인터랙티브 (TTI) -->
  <rect x="80" y="406" width="720" height="54" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="438" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">5. 페이지 인터랙티브 (TTI)</text>
</svg>