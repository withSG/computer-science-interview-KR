<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">String Pool과 참조</title>
  <desc id="d">a, b(리터럴)와 d(c.intern())는 Heap 안 String Pool의 같은 "hello" 객체를 가리키고, c(new String)는 풀 밖의 별도 String 객체를 가리킨다. 그 객체에 intern()을 호출하면 풀의 동등한 객체가 반환된다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- ===== Heap ===== -->
  <rect x="24" y="24" width="532" height="422" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="56" font-size="18" font-weight="bold" fill="#111827">Heap</text>

  <!-- String Pool -->
  <rect x="56" y="76" width="468" height="184" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="76" y="104" font-size="16" font-weight="bold" fill="#1d4ed8">String Pool</text>
  <rect x="200" y="116" width="160" height="120" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="280" y="183" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"hello"</text>

  <!-- intern() -->
  <line x1="280" y1="338" x2="280" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="296" y="288" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">intern()</text>
  <text x="296" y="310" font-size="15" fill="#4b5563">풀의 동등한 객체 반환</text>

  <!-- 풀 밖 String 객체 -->
  <rect x="200" y="340" width="160" height="80" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="280" y="372" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">String 객체</text>
  <text x="280" y="400" font-size="16" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">("hello")</text>

  <!-- ===== 변수 ===== -->
  <text x="596" y="90" font-size="16" font-weight="bold" fill="#374151">변수</text>

  <rect x="596" y="106" width="260" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="612" y="132" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#1d4ed8">a</tspan> = "hello"</text>

  <rect x="596" y="156" width="260" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="612" y="182" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#1d4ed8">b</tspan> = "hello"</text>

  <rect x="596" y="206" width="260" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="612" y="232" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#1d4ed8">d</tspan> = c.intern()</text>

  <text x="596" y="276" font-size="15" fill="#1d4ed8">a, b, d → 같은 풀 객체</text>

  <rect x="596" y="356" width="260" height="40" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="612" y="382" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#6d28d9">c</tspan> = new String("hello")</text>

  <text x="596" y="424" font-size="15" fill="#6d28d9">c → 풀 밖의 다른 객체</text>

  <!-- 참조 화살표 -->
  <line x1="594" y1="126" x2="364" y2="126" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="594" y1="176" x2="364" y2="176" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="594" y1="226" x2="364" y2="226" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="594" y1="376" x2="364" y2="376" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
</svg>
