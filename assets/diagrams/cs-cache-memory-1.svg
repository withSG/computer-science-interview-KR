<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">공간적 지역성과 캐시 라인</title>
  <desc id="d">arr[0] 하나만 읽으려 해도 arr[0]부터 arr[15]까지 64바이트 캐시 라인 1개가 통째로 캐시에 적재되어, 이어지는 arr[1]~arr[15] 15번의 접근이 전부 캐시 히트가 되는 과정을 보여줍니다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 요청 -->
  <text x="122" y="42" font-size="17" font-weight="700" fill="#111827">arr[0]을 읽으려고 했을 뿐인데...</text>
  <line x1="166" y1="52" x2="166" y2="84" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 메모리 -->
  <text x="24" y="128" font-size="16" font-weight="700" fill="#111827">메모리</text>

  <!-- 캐시 라인 1개 (arr[0]~arr[15]) -->
  <rect x="110" y="88" width="448" height="68" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="122" y="100" width="88" height="44" rx="4" fill="#1d4ed8"/>
  <text x="166" y="128" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">arr[0]</text>
  <rect x="218" y="100" width="88" height="44" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="262" y="128" font-size="16" fill="#111827" text-anchor="middle">arr[1]</text>
  <rect x="314" y="100" width="88" height="44" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="358" y="128" font-size="16" fill="#111827" text-anchor="middle">arr[2]</text>
  <text x="430" y="128" font-size="18" font-weight="700" fill="#374151" text-anchor="middle">…</text>
  <rect x="458" y="100" width="88" height="44" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="502" y="128" font-size="16" fill="#111827" text-anchor="middle">arr[15]</text>

  <!-- 다음 캐시 라인 -->
  <rect x="572" y="88" width="172" height="68" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="584" y="100" width="88" height="44" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="628" y="128" font-size="16" fill="#4b5563" text-anchor="middle">arr[16]</text>
  <text x="706" y="128" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle">…</text>
  <text x="658" y="180" font-size="14" fill="#4b5563" text-anchor="middle">다음 캐시 라인</text>

  <!-- 64바이트 괄호 -->
  <path d="M122,164 V172 H546 V164" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="334" y="198" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">64바이트 = 캐시 라인 1개</text>
  <text x="334" y="220" font-size="15" fill="#374151" text-anchor="middle">int(4바이트)라면 16개가 한 번에</text>

  <!-- 적재 -->
  <line x1="334" y1="232" x2="334" y2="276" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-ink)"/>
  <text x="350" y="260" font-size="16" font-weight="700" fill="#1d4ed8">통째로 적재</text>

  <!-- 캐시 -->
  <text x="24" y="315" font-size="16" font-weight="700" fill="#111827">캐시</text>
  <rect x="110" y="282" width="448" height="54" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="2"/>
  <text x="334" y="315" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">arr[0] ~ arr[15]</text>

  <!-- 결과 -->
  <rect x="24" y="360" width="832" height="66" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <line x1="42" y1="381" x2="64" y2="381" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="74" y="387" font-size="17" font-weight="700" fill="#047857">arr[1]~arr[15]에 대한 다음 15번의 접근은 전부 캐시 히트</text>
  <text x="74" y="411" font-size="15" fill="#374151">16번에 한 번만 메모리를 기다린다 (배열 순차 접근이 빠른 이유)</text>
</svg>
