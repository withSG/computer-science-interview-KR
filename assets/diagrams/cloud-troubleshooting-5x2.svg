<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">메모리 압박에서 OOM Killer까지</title>
  <desc id="d">메모리 압박이 오면 캐시 회수를 시도하고, 스왑으로 페이지를 밀어내며(이미 응답 시간 붕괴), 그래도 부족하면 OOM Killer가 발동해 oom_score가 가장 높은 프로세스를 골라 SIGKILL로 정리 작업 없이 즉시 종료한다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- 시작: 메모리 압박 -->
  <rect x="24" y="40" width="160" height="76" rx="8" fill="#334155"/>
  <text x="104" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">메모리 압박</text>

  <line x1="184" y1="78" x2="220" y2="78" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 1. 캐시 회수 시도 -->
  <rect x="224" y="40" width="180" height="76" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="246" cy="78" r="13" fill="#4b5563"/>
  <text x="246" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="268" y="84" font-size="17" font-weight="bold" fill="#111827">캐시 회수 시도</text>

  <line x1="404" y1="78" x2="440" y2="78" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2. 스왑 -->
  <rect x="444" y="40" width="200" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="466" cy="78" r="13" fill="#b45309"/>
  <text x="466" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="488" font-size="17" font-weight="bold" fill="#78350f"><tspan x="488" y="72">스왑으로</tspan><tspan x="488" y="96">페이지 밀어내기</tspan></text>

  <line x1="644" y1="78" x2="680" y2="78" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3. 그래도 부족 -->
  <rect x="684" y="40" width="172" height="76" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="706" cy="78" r="13" fill="#b91c1c"/>
  <text x="706" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="728" y="84" font-size="17" font-weight="bold" fill="#991b1b">그래도 부족</text>

  <!-- 스왑 단계 주석 -->
  <line x1="544" y1="136" x2="544" y2="121" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="544" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">여기서 이미 응답 시간 붕괴</text>

  <!-- 3 → OOM -->
  <line x1="770" y1="116" x2="770" y2="186" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>

  <!-- OOM Killer 발동 -->
  <rect x="24" y="190" width="832" height="164" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="48" y="224" font-size="21" font-weight="bold" fill="#991b1b">OOM Killer 발동</text>

  <rect x="48" y="242" width="400" height="88" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="248" y="278" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">oom_score</tspan>가 가장 높은 프로세스 선택</text>
  <text x="248" y="308" text-anchor="middle" font-size="15" fill="#374151">(대체로 메모리를 가장 많이 쓰는 프로세스)</text>

  <line x1="448" y1="286" x2="496" y2="286" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>

  <rect x="500" y="242" width="332" height="88" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="666" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SIGKILL</text>
  <text x="666" y="308" text-anchor="middle" font-size="16" fill="#111827">정리 작업 없이 즉시 종료</text>
</svg>
