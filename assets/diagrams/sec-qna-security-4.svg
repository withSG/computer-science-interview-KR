<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT 구조</title>
  <desc id="d">JWT는 점으로 이어진 Header.Payload.Signature 세 부분이며, 예시 토큰에서 Header와 Payload는 Base64 문자열, 마지막 부분은 Signature다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 형식 xxxxx.yyyyy.zzzzz -->
  <rect x="225" y="36" width="110" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="280" y="68" font-size="24" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">xxxxx</text>
  <text x="360" y="72" font-size="28" font-weight="bold" fill="#111827" text-anchor="middle">.</text>
  <rect x="385" y="36" width="110" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="68" font-size="24" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">yyyyy</text>
  <text x="520" y="72" font-size="28" font-weight="bold" fill="#111827" text-anchor="middle">.</text>
  <rect x="545" y="36" width="110" height="48" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="600" y="68" font-size="24" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">zzzzz</text>

  <path d="M280,84 L280,110" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M440,84 L440,110" stroke="#047857" stroke-width="2"/>
  <path d="M600,84 L600,110" stroke="#6d28d9" stroke-width="2"/>

  <!-- Header.Payload.Signature -->
  <rect x="212" y="110" width="136" height="38" rx="19" fill="#1d4ed8"/>
  <text x="280" y="135" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Header</text>
  <text x="360" y="137" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">.</text>
  <rect x="372" y="110" width="136" height="38" rx="19" fill="#047857"/>
  <text x="440" y="135" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Payload</text>
  <text x="520" y="137" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">.</text>
  <rect x="532" y="110" width="136" height="38" rx="19" fill="#6d28d9"/>
  <text x="600" y="135" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Signature</text>

  <!-- 예시 토큰 -->
  <text x="40" y="194" font-size="15" font-weight="bold" fill="#4b5563">예시 토큰</text>

  <rect x="40" y="208" width="800" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M236,208 L236,252" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="56" y="236" font-size="16" font-weight="bold" fill="#1d4ed8">Header (Base64)</text>
  <text x="252" y="236" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.</text>

  <rect x="40" y="262" width="800" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <path d="M236,262 L236,306" stroke="#047857" stroke-width="1.5"/>
  <text x="56" y="290" font-size="16" font-weight="bold" fill="#047857">Payload (Base64)</text>
  <text x="252" y="290" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6Ik...</text>

  <rect x="40" y="316" width="800" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M236,316 L236,360" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="56" y="344" font-size="16" font-weight="bold" fill="#6d28d9">Signature</text>
  <text x="252" y="344" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c</text>
</svg>
