<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT 구조</title>
  <desc id="d">JWT의 Header, Payload, Signature 3개 구성 요소와 각 Base64 인코딩 문자열 매핑 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="38" font-size="16" font-weight="bold" fill="#1f2933">JWT 구조</text>

  <!-- Top Token String Representation -->
  <!-- Container Box -->
  <rect x="40" y="60" width="800" height="46" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <!-- Token Parts -->
  <rect x="230" y="68" width="80" height="30" rx="4" fill="#eff6ff"/>
  <text x="270" y="88" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">xxxxx</text>

  <text x="320" y="88" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">.</text>

  <rect x="330" y="68" width="80" height="30" rx="4" fill="#ecfdf5"/>
  <text x="370" y="88" font-size="15" font-weight="bold" fill="#059669" text-anchor="middle">yyyyy</text>

  <text x="420" y="88" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">.</text>

  <rect x="430" y="68" width="80" height="30" rx="4" fill="#f5f3ff"/>
  <text x="470" y="88" font-size="15" font-weight="bold" fill="#7c3aed" text-anchor="middle">zzzzz</text>

  <!-- Connecting Lines from xxxxx.yyyyy.zzzzz to Header.Payload.Signature -->
  <path d="M270,98 L270,128" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M370,98 L370,128" stroke="#059669" stroke-width="1.5" fill="none"/>
  <path d="M470,98 L470,128" stroke="#7c3aed" stroke-width="1.5" fill="none"/>

  <!-- Middle Component Labels: Header.Payload.Signature -->
  <rect x="210" y="128" width="120" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="149" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Header</text>

  <text x="340" y="149" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">.</text>

  <rect x="350" y="128" width="120" height="32" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="410" y="149" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">Payload</text>

  <text x="480" y="149" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">.</text>

  <rect x="490" y="128" width="120" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="550" y="149" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Signature</text>

  <!-- Bottom Detailed Base64 Encoding Breakdown Section -->
  
  <!-- Row 1: Header (Base64) -->
  <path d="M270,160 L270,195 L40,195" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-blue)"/>
  <rect x="40" y="200" width="800" height="34" rx="4" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="55" y="222" font-size="13" font-family="monospace" fill="#1f2933">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.</text>
  <rect x="635" y="208" width="195" height="18" rx="3" fill="#ffffff"/>
  <text x="820" y="222" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">← Header (Base64)</text>

  <!-- Row 2: Payload (Base64) -->
  <path d="M410,160 L410,245 L40,245" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-green)"/>
  <rect x="40" y="250" width="800" height="34" rx="4" fill="#ecfdf5" stroke="#9aa5b1" stroke-width="1"/>
  <text x="55" y="272" font-size="13" font-family="monospace" fill="#1f2933">eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6Ik...</text>
  <rect x="625" y="258" width="205" height="18" rx="3" fill="#ffffff"/>
  <text x="820" y="272" font-size="13" font-weight="bold" fill="#059669" text-anchor="end">← Payload (Base64)</text>

  <!-- Row 3: Signature -->
  <path d="M550,160 L550,295 L40,295" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-purple)"/>
  <rect x="40" y="300" width="800" height="34" rx="4" fill="#f5f3ff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="55" y="322" font-size="13" font-family="monospace" fill="#1f2933">SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c</text>
  <rect x="715" y="308" width="115" height="18" rx="3" fill="#ffffff"/>
  <text x="820" y="322" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="end">← Signature</text>
</svg>