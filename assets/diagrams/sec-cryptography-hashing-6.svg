<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비대칭 암호화와 전자서명의 키 사용 방향, 서명 생성·검증 절차</title>
  <desc id="d">비대칭 암호화는 받는 사람의 공개키로 암호화하고 개인키로 복호화하지만, 전자서명은 자기 개인키로 서명하고 보낸 사람의 공개키로 검증한다. 아래는 문서를 해시한 H에 개인키로 서명하는 생성 절차와, 문서의 해시 H'와 서명값을 공개키로 복원한 H를 비교하는 검증 절차다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="590" fill="#ffffff"/>

  <!-- ── 위: 키 사용 방향 비교표 -->
  <rect x="24" y="24" width="832" height="68" fill="#f1f5f9"/>
  <rect x="24" y="24" width="832" height="244" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="92" x2="856" y2="92" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="144" x2="856" y2="144" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="196" x2="856" y2="196" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="144" y1="24" x2="144" y2="268" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="500" y1="24" x2="500" y2="268" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="160" y="53" font-size="18" font-weight="bold" fill="#111827">비대칭 암호화</text>
  <text x="160" y="78" font-size="15" fill="#374151">기밀성</text>
  <text x="516" y="53" font-size="18" font-weight="bold" fill="#111827">전자서명</text>
  <text x="516" y="78" font-size="15" fill="#374151">인증 + 무결성 + 부인 방지</text>

  <text x="40" y="124" font-size="16" font-weight="bold" fill="#111827">보내는 쪽</text>
  <text x="160" y="124" font-size="16" fill="#111827">받는 사람의 <tspan font-weight="bold" fill="#1d4ed8">공개키</tspan>로 암호화</text>
  <text x="516" y="124" font-size="16" fill="#111827">자기 <tspan font-weight="bold" fill="#b45309">개인키</tspan>로 서명</text>

  <text x="40" y="176" font-size="16" font-weight="bold" fill="#111827">받는 쪽</text>
  <text x="160" y="176" font-size="16" fill="#111827">자기 <tspan font-weight="bold" fill="#b45309">개인키</tspan>로 복호화</text>
  <text x="516" y="176" font-size="16" fill="#111827">보낸 사람의 <tspan font-weight="bold" fill="#1d4ed8">공개키</tspan>로 검증</text>

  <text x="40" y="238" font-size="16" font-weight="bold" fill="#111827">결과</text>
  <text x="160" y="238" font-size="16" font-weight="bold" fill="#111827">→ 개인키를 가진 사람만 읽을 수 있다</text>
  <text x="516" y="226" font-size="16" font-weight="bold" fill="#111827">→ 개인키를 가진 사람만 만들 수 있다</text>
  <text x="532" y="251" font-size="16" font-weight="bold" fill="#111827">= 신원 증명</text>

  <!-- ── 아래 1: 서명 생성 -->
  <rect x="24" y="296" width="832" height="88" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="336" font-size="16" font-weight="bold" fill="#111827">서명 생성</text>
  <text x="40" y="358" font-size="14" fill="#4b5563">(보내는 쪽)</text>

  <rect x="170" y="320" width="90" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="215" y="346" font-size="16" fill="#111827" text-anchor="middle">문서</text>
  <line x1="262" y1="340" x2="376" y2="340" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="319" y="330" font-size="15" fill="#374151" text-anchor="middle">해시</text>
  <rect x="380" y="320" width="60" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="346" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">H</text>
  <line x1="442" y1="340" x2="596" y2="340" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="519" y="330" font-size="15" fill="#374151" text-anchor="middle"><tspan font-weight="bold" fill="#b45309">개인키</tspan>로 서명</text>
  <rect x="600" y="320" width="100" height="40" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="650" y="346" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">서명값</text>

  <!-- ── 아래 2: 서명 검증 -->
  <rect x="24" y="400" width="832" height="166" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="478" font-size="16" font-weight="bold" fill="#111827">서명 검증</text>
  <text x="40" y="500" font-size="14" fill="#4b5563">(받는 쪽)</text>

  <rect x="170" y="420" width="90" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="215" y="446" font-size="16" fill="#111827" text-anchor="middle">문서</text>
  <line x1="262" y1="440" x2="376" y2="440" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="319" y="430" font-size="15" fill="#374151" text-anchor="middle">해시</text>
  <rect x="380" y="420" width="60" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="446" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">H'</text>

  <rect x="170" y="500" width="90" height="40" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="215" y="526" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">서명값</text>
  <line x1="262" y1="520" x2="376" y2="520" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="319" y="510" font-size="15" fill="#374151" text-anchor="middle"><tspan font-weight="bold" fill="#1d4ed8">공개키</tspan>로 복원</text>
  <text x="319" y="545" font-size="14" fill="#4b5563" text-anchor="middle">(RSA 기준)</text>
  <rect x="380" y="500" width="60" height="40" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="526" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">H</text>

  <path d="M442,440 H500 V468 H552" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#ar-g)"/>
  <path d="M442,520 H500 V492 H552" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#ar-g)"/>
  <rect x="556" y="456" width="220" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="666" y="486" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">H == H' 이면 유효</text>
</svg>
