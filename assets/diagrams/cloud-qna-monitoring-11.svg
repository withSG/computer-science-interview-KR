<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">알림 계층화</title>
  <desc id="d">알림을 P1 Critical(즉시 대응)부터 P4 Low(정보성)까지 네 등급으로 나누고, 등급별 대응 시점, 알림 경로, 예시를 표로 비교합니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- 머리행 -->
  <path d="M24,34 A10,10 0 0 1 34,24 L846,24 A10,10 0 0 1 856,34 L856,68 L24,68 Z" fill="#e5e7eb"/>
  <text x="40" y="52" font-size="15" font-weight="bold" fill="#111827">등급 · 대응</text>
  <text x="260" y="52" font-size="15" font-weight="bold" fill="#111827">상세</text>
  <text x="556" y="52" font-size="15" font-weight="bold" fill="#111827">예</text>

  <!-- 행 배경 -->
  <rect x="24" y="68" width="832" height="72" fill="#fef2f2"/>
  <rect x="24" y="140" width="832" height="72" fill="#fffbeb"/>
  <rect x="24" y="212" width="832" height="72" fill="#eff6ff"/>
  <path d="M24,284 L856,284 L856,346 A10,10 0 0 1 846,356 L34,356 A10,10 0 0 1 24,346 Z" fill="#f9fafb"/>

  <!-- 격자선 -->
  <line x1="24" y1="68" x2="856" y2="68" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="24" y1="140" x2="856" y2="140" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="212" x2="856" y2="212" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="284" x2="856" y2="284" stroke="#d1d5db" stroke-width="1"/>
  <line x1="244" y1="24" x2="244" y2="356" stroke="#d1d5db" stroke-width="1"/>
  <line x1="540" y1="24" x2="540" y2="356" stroke="#d1d5db" stroke-width="1"/>
  <rect x="24" y="24" width="832" height="332" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- P1 -->
  <rect x="40" y="78" width="40" height="26" rx="6" fill="#b91c1c"/>
  <text x="60" y="97" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">P1</text>
  <text x="92" y="97" font-size="17" font-weight="bold" fill="#111827">Critical</text>
  <text x="40" y="127" font-size="16" fill="#1f2937">즉시 대응</text>
  <text x="260" y="110" font-size="16" fill="#111827">고객 영향 있음, PagerDuty 호출</text>
  <text x="556" y="110" font-size="16" fill="#111827">서비스 다운, 데이터 유실</text>

  <!-- P2 -->
  <rect x="40" y="150" width="40" height="26" rx="6" fill="#b45309"/>
  <text x="60" y="169" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">P2</text>
  <text x="92" y="169" font-size="17" font-weight="bold" fill="#111827">High</text>
  <text x="40" y="199" font-size="16" fill="#1f2937">업무 시간 내 대응</text>
  <text x="260" y="182" font-size="16" fill="#111827">Slack 알림, 당일 해결</text>
  <text x="556" y="182" font-size="16" fill="#111827">에러율 증가, 디스크 80%</text>

  <!-- P3 -->
  <rect x="40" y="222" width="40" height="26" rx="6" fill="#1d4ed8"/>
  <text x="60" y="241" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">P3</text>
  <text x="92" y="241" font-size="17" font-weight="bold" fill="#111827">Medium</text>
  <text x="40" y="271" font-size="16" fill="#1f2937">계획된 시간에 대응</text>
  <text x="260" y="254" font-size="16" fill="#111827">이메일/대시보드</text>
  <text x="556" y="254" font-size="16" fill="#111827">비용 증가, 성능 저하 추세</text>

  <!-- P4 -->
  <rect x="40" y="294" width="40" height="26" rx="6" fill="#4b5563"/>
  <text x="60" y="313" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">P4</text>
  <text x="92" y="313" font-size="17" font-weight="bold" fill="#111827">Low</text>
  <text x="40" y="343" font-size="16" fill="#1f2937">정보성</text>
  <text x="260" y="326" font-size="16" fill="#111827">로그/대시보드에만 기록</text>
  <text x="556" y="326" font-size="16" fill="#111827">배포 완료, 스케일링 이벤트</text>
</svg>
