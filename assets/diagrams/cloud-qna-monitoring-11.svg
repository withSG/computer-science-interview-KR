<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">알림 계층화</title>
  <desc id="d">P1 Critical부터 P4 Low까지 알림 심각도별 대응 및 예시를 보여주는 계층화 구조도</desc>
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- P1 Critical Block -->
  <g>
    <rect x="40" y="30" width="800" height="110" rx="6" ry="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="60" y="62" font-size="16" font-weight="bold" fill="#dc2626">P1 Critical - 즉시 대응</text>
    <text x="60" y="90" font-size="13" fill="#1f2933">고객 영향 있음, PagerDuty 호출</text>
    <text x="60" y="115" font-size="13" fill="#52606d">예: 서비스 다운, 데이터 유실</text>
  </g>

  <!-- P2 High Block -->
  <g>
    <rect x="40" y="160" width="800" height="110" rx="6" ry="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="60" y="192" font-size="16" font-weight="bold" fill="#d97706">P2 High - 업무 시간 내 대응</text>
    <text x="60" y="220" font-size="13" fill="#1f2933">Slack 알림, 당일 해결</text>
    <text x="60" y="245" font-size="13" fill="#52606d">예: 에러율 증가, 디스크 80%</text>
  </g>

  <!-- P3 Medium Block -->
  <g>
    <rect x="40" y="290" width="800" height="110" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="322" font-size="16" font-weight="bold" fill="#2563eb">P3 Medium - 계획된 시간에 대응</text>
    <text x="60" y="350" font-size="13" fill="#1f2933">이메일/대시보드</text>
    <text x="60" y="375" font-size="13" fill="#52606d">예: 비용 증가, 성능 저하 추세</text>
  </g>

  <!-- P4 Low Block -->
  <g>
    <rect x="40" y="420" width="800" height="110" rx="6" ry="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="60" y="452" font-size="16" font-weight="bold" fill="#52606d">P4 Low - 정보성</text>
    <text x="60" y="480" font-size="13" fill="#1f2933">로그/대시보드에만 기록</text>
    <text x="60" y="505" font-size="13" fill="#52606d">예: 배포 완료, 스케일링 이벤트</text>
  </g>
</svg>