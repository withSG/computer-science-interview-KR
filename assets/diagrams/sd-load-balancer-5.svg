<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">최소 연결 (Least Connections)</title>
  <desc id="d">라운드 로빈과 최소 연결 알고리즘의 요청 분산 방식 및 결과 비교 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 상단 요청 패턴 영역 -->
  <rect x="40" y="25" width="800" height="45" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="60" y="52" font-size="13" font-weight="bold" fill="#1f2933">요청 패턴:</text>
  
  <rect x="140" y="34" width="125" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="202.5" y="51" font-size="12" fill="#d97706" text-anchor="middle">리포트생성 8초</text>
  
  <rect x="275" y="34" width="80" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="315" y="51" font-size="12" fill="#2563eb" text-anchor="middle">조회 10ms</text>
  
  <rect x="365" y="34" width="125" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="427.5" y="51" font-size="12" fill="#d97706" text-anchor="middle">리포트생성 8초</text>
  
  <rect x="500" y="34" width="80" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="540" y="51" font-size="12" fill="#2563eb" text-anchor="middle">조회 10ms</text>
  
  <text x="590" y="52" font-size="14" font-weight="bold" fill="#52606d">...</text>

  <!-- 왼쪽: 라운드 로빈 섹션 -->
  <rect x="40" y="90" width="385" height="225" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="none"/>
  <text x="60" y="120" font-size="16" font-weight="bold" fill="#dc2626">라운드 로빈</text>

  <!-- 라운드 로빈 서버1 -->
  <text x="60" y="162" font-size="13" font-weight="bold" fill="#1f2933">서버1</text>
  <path d="M125,158 L105,158" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="135" y="162" font-size="13" fill="#1f2933">리포트, 리포트, 리포트 …</text>

  <!-- 라운드 로빈 서버2 -->
  <text x="60" y="212" font-size="13" font-weight="bold" fill="#1f2933">서버2</text>
  <path d="M125,208 L105,208" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="135" y="212" font-size="13" fill="#1f2933">조회, 조회, 조회 …</text>

  <!-- 라운드 로빈 하단 결론 -->
  <line x1="60" y1="250" x2="405" y2="250" stroke="#cbd2d9" stroke-width="1"/>
  <text x="60" y="280" font-size="13" font-weight="bold" fill="#dc2626">요청 수는 반반, 부하는 완전히 기움</text>

  <!-- 오른쪽: 최소 연결 섹션 -->
  <rect x="455" y="90" width="385" height="225" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="475" y="120" font-size="16" font-weight="bold" fill="#059669">최소 연결</text>

  <!-- 최소 연결 서버1 -->
  <text x="475" y="162" font-size="13" font-weight="bold" fill="#1f2933">서버1</text>
  <path d="M540,158 L520,158" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="550" y="162" font-size="13" fill="#1f2933">리포트 (연결 1개 점유 중)</text>

  <!-- 최소 연결 서버2 -->
  <text x="475" y="212" font-size="13" font-weight="bold" fill="#1f2933">서버2</text>
  <path d="M540,208 L520,208" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="550" y="212" font-size="13" fill="#1f2933">조회, 조회, 조회, 리포트 …</text>

  <!-- 최소 연결 하단 결론 -->
  <line x1="475" y1="250" x2="820" y2="250" stroke="#cbd2d9" stroke-width="1"/>
  <text x="475" y="280" font-size="13" font-weight="bold" fill="#059669">무거운 요청이 자동으로 분산된다</text>
</svg>