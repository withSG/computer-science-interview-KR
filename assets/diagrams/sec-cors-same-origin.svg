<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 880" width="880" height="880" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Preflight 2왕복</title>
  <desc id="d">브라우저가 먼저 OPTIONS 요청으로 허가를 묻고(쿠키와 Authorization 없음) 204 응답의 CORS 헤더를 검사해 통과하면 POST 본 요청을 보낸다. 201 본 응답에도 Access-Control-Allow-Origin과 Allow-Credentials 헤더가 다시 있어야 한다.</desc>
  <rect width="880" height="880" fill="#ffffff"/>

  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="24" y="24" width="144" height="42" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="96" y="51" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Browser</text>
  <rect x="686" y="24" width="176" height="42" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="774" y="51" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">api.example.com</text>

  <!-- 생명선 -->
  <line x1="96" y1="66" x2="96" y2="858" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="774" y1="66" x2="774" y2="858" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== 1단계: Preflight ===== -->
  <rect x="116" y="86" width="160" height="30" rx="15" fill="#1d4ed8"/>
  <text x="196" y="107" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1단계: Preflight</text>

  <!-- OPTIONS 요청 -->
  <text x="435" y="150" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OPTIONS /api/orders</text>
  <line x1="96" y1="160" x2="771" y2="160" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar-blue)"/>
  <rect x="118" y="174" width="634" height="132" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="134" y="200" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Origin: <tspan fill="#1d4ed8">https://app.example.com</tspan></text>
  <text x="134" y="224" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Request-Method: <tspan fill="#1d4ed8">POST</tspan></text>
  <text x="134" y="248" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Request-Headers: <tspan fill="#1d4ed8">authorization, content-type</tspan></text>
  <rect x="130" y="262" width="610" height="32" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="146" y="283" font-size="15" font-weight="bold" fill="#b91c1c">쿠키와 Authorization 헤더는 실리지 않음</text>

  <!-- 204 응답 -->
  <text x="435" y="340" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">204 No Content</text>
  <line x1="774" y1="350" x2="99" y2="350" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar-blue)"/>
  <rect x="118" y="364" width="634" height="138" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="134" y="390" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Allow-Origin: <tspan fill="#1d4ed8">https://app.example.com</tspan></text>
  <text x="134" y="414" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Allow-Methods: <tspan fill="#1d4ed8">GET, POST, PUT, DELETE</tspan></text>
  <text x="134" y="438" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Allow-Headers: <tspan fill="#1d4ed8">Authorization, Content-Type</tspan></text>
  <text x="134" y="462" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Allow-Credentials: <tspan fill="#1d4ed8">true</tspan></text>
  <text x="134" y="486" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Max-Age: <tspan fill="#1d4ed8">3600</tspan></text>

  <!-- 브라우저 검사 -->
  <rect x="40" y="524" width="360" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="56" y="552" font-size="17" font-weight="bold" fill="#92400e">브라우저가 검사 → 통과 → 본 요청 전송</text>

  <!-- ===== 2단계: 본 요청 ===== -->
  <rect x="116" y="592" width="160" height="30" rx="15" fill="#047857"/>
  <text x="196" y="613" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2단계: 본 요청</text>

  <!-- POST 요청 -->
  <text x="435" y="656" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /api/orders</text>
  <line x1="96" y1="666" x2="771" y2="666" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <rect x="118" y="680" width="634" height="42" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="134" y="706" font-size="15" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Origin / Authorization / Content-Type / Cookie</text>

  <!-- 201 응답 -->
  <text x="435" y="756" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">201 Created</text>
  <line x1="774" y1="766" x2="99" y2="766" stroke="#047857" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar-green)"/>
  <rect x="118" y="780" width="634" height="66" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="134" y="806" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Allow-Origin: <tspan fill="#047857">https://app.example.com</tspan></text>
  <text x="134" y="830" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Access-Control-Allow-Credentials: <tspan fill="#047857">true</tspan></text>
  <path d="M584,792 H592 V836 H584" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="604" y="808" font-size="16" font-weight="bold" fill="#b91c1c">본 응답에도</text>
  <text x="604" y="830" font-size="16" font-weight="bold" fill="#b91c1c">필요하다</text>
</svg>
