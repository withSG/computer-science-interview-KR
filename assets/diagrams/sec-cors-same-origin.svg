<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Preflight 2왕복 — OPTIONS와 본 요청은 다른 질문에 답한다</title>
  <desc id="d">브라우저와 서버 간의 CORS Preflight 요청 및 본 요청 과정을 나타낸 시퀀스 다이어그램입니다. 1단계 OPTIONS 요청에는 인증 헤더가 제외되며, 2단계 본 응답에도 CORS 헤더가 포함되어야 함을 설명합니다.</desc>
  <rect width="880" height="720" fill="#ffffff"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="36" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">Preflight 2왕복 — OPTIONS와 본 요청은 다른 질문에 답한다</text>

  <!-- Background Regions for Steps -->
  <!-- Phase 1 Background -->
  <rect x="40" y="110" width="800" height="230" fill="#eff6ff" rx="8" stroke="#cbd2d9" stroke-width="1"/>
  <!-- Phase 2 Background -->
  <rect x="40" y="410" width="800" height="230" fill="#ecfdf5" rx="8" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Phase Badges (Right Side) -->
  <rect x="690" y="125" width="135" height="26" fill="#2563eb" rx="4"/>
  <text x="757.5" y="142" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">1단계: Preflight</text>

  <rect x="690" y="425" width="135" height="26" fill="#059669" rx="4"/>
  <text x="757.5" y="442" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">2단계: 본 요청</text>

  <!-- Lifelines (Vertical Lines) -->
  <line x1="220" y1="90" x2="220" y2="650" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="620" y1="90" x2="620" y2="650" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Lifeline Header Nodes -->
  <rect x="140" y="60" width="160" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
  <text x="220" y="82.5" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">Browser</text>

  <rect x="520" y="60" width="200" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
  <text x="620" y="82.5" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">api.example.com</text>

  <!-- Lifeline Footer Nodes -->
  <rect x="140" y="650" width="160" height="30" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
  <text x="220" y="669.5" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">Browser</text>

  <rect x="520" y="650" width="200" height="30" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
  <text x="620" y="669.5" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">api.example.com</text>

  <!-- ==================== PHASE 1: PREFLIGHT ==================== -->

  <!-- OPTIONS Request Arrow -->
  <path d="M220,150 L620,150" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- OPTIONS Label Box -->
  <rect x="250" y="122" width="340" height="22" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="420" y="137" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">OPTIONS /api/orders</text>

  <!-- OPTIONS Headers Detail -->
  <text x="420" y="168" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Origin: https://app.example.com</text>
  <text x="420" y="183" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Access-Control-Request-Method: POST</text>
  <text x="420" y="198" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Access-Control-Request-Headers: authorization, content-type</text>

  <!-- Warning Badge: No Cookie / Auth Header -->
  <rect x="270" y="208" width="300" height="22" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="420" y="223" font-size="11.5" font-weight="500" fill="#dc2626" text-anchor="middle">⚠ Cookie / Authorization 미전송 (인증 제외)</text>

  <!-- 204 Response Arrow -->
  <path d="M620,270 L220,270" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a-purple)"/>
  
  <!-- 204 Label Box -->
  <rect x="330" y="258" width="180" height="22" fill="#ffffff" stroke="#7c3aed" stroke-width="1" rx="4"/>
  <text x="420" y="273" font-size="11.5" font-weight="600" fill="#7c3aed" text-anchor="middle">204 No Content</text>

  <!-- 204 Headers Detail -->
  <text x="420" y="293" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Access-Control-Allow-Origin: https://app.example.com</text>
  <text x="420" y="308" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Access-Control-Allow-Methods: GET, POST, PUT, DELETE | Max-Age: 3600</text>
  <text x="420" y="323" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Allow-Headers: Authorization, Content-Type | Allow-Credentials: true</text>

  <!-- Intermediate Inspection Step -->
  <rect x="300" y="355" width="240" height="32" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="6"/>
  <text x="420" y="375" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle">브라우저 검사 통과 후 본 요청 전송</text>

  <!-- ==================== PHASE 2: MAIN REQUEST ==================== -->

  <!-- POST Request Arrow -->
  <path d="M220,450 L620,450" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  
  <!-- POST Label Box -->
  <rect x="270" y="432" width="300" height="22" fill="#ffffff" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="420" y="447" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">POST /api/orders</text>

  <!-- POST Headers Detail -->
  <text x="420" y="470" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Headers: Origin | Authorization | Content-Type | Cookie</text>

  <!-- 201 Response Arrow -->
  <path d="M620,530 L220,530" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a-green)"/>

  <!-- 201 Label Box -->
  <rect x="330" y="518" width="180" height="22" fill="#ffffff" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="420" y="533" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">201 Created</text>

  <!-- 201 Headers Detail -->
  <text x="420" y="555" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Access-Control-Allow-Origin: https://app.example.com</text>
  <text x="420" y="570" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">Access-Control-Allow-Credentials: true</text>

  <!-- Notice Badge for Main Response -->
  <rect x="250" y="585" width="340" height="22" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="420" y="600" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">★ 본 응답에도 Access-Control-Allow-Origin 재확인 필수</text>

  <!-- Conclusion Caption -->
  <text x="440" y="700" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">결론: Preflight(OPTIONS)는 요청 가능 여부만 판단하며, 실제 데이터 응답 수신을 위해서 본 응답에도 CORS 헤더가 반드시 필요하다.</text>
</svg>