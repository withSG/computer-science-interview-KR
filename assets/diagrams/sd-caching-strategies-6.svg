<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">2단 캐시 무효화 전파</title>
  <desc id="d">요청은 수 초 TTL의 L1 로컬 캐시를 먼저 보고, miss면 수 분 TTL의 L2 Redis, 다시 miss면 DB로 간다. 데이터가 바뀌면 Redis가 Pub/Sub으로 L1에 무효화를 전파한다.</desc>
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 요청 -->
  <rect x="24" y="50" width="72" height="40" rx="20" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="60" y="76" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">요청</text>
  <line x1="98" y1="70" x2="142" y2="70" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- L1 -->
  <rect x="148" y="30" width="180" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="238" y="64" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">L1 로컬 캐시</text>
  <text x="238" y="90" font-size="15" fill="#1d4ed8" text-anchor="middle">(수 초 TTL)</text>

  <!-- L1 → L2 -->
  <line x1="330" y1="70" x2="424" y2="70" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="377" y="58" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">miss</text>

  <!-- L2 -->
  <rect x="430" y="30" width="180" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="520" y="64" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">L2 Redis</text>
  <text x="520" y="90" font-size="15" fill="#6d28d9" text-anchor="middle">(수 분 TTL)</text>

  <!-- L2 → DB -->
  <line x1="612" y1="70" x2="706" y2="70" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="659" y="58" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">miss</text>

  <!-- DB -->
  <rect x="712" y="30" width="144" height="80" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="784" y="76" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>

  <!-- Pub/Sub 무효화: L2 → L1 -->
  <path d="M520,112 V160 H238 V118" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ah-amber)"/>
  <text x="379" y="190" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">Pub/Sub 무효화</text>
  <text x="379" y="214" font-size="15" fill="#4b5563" text-anchor="middle">데이터가 바뀌면 전 서버에 “이 키 버려라”</text>
</svg>
