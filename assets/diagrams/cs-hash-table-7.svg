<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트리화가 막아 주는 것</title>
  <desc id="d">트리화 없이는 버킷 5의 노드가 K1부터 Kn까지 한 줄 연결 리스트로 이어져 조회가 O(n)이고, 트리화 이후에는 버킷 5가 Red-Black Tree를 가리켜 조회가 O(log n)이다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- ── 트리화 없이 ── -->
  <rect x="24" y="20" width="832" height="88" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="70" font-size="17" font-weight="bold" fill="#111827">트리화 없이</text>
  <rect x="156" y="44" width="80" height="40" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <text x="196" y="70" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">버킷 5</text>
  <line x1="236" y1="64" x2="262" y2="64" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="264" y="46" width="56" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="292" y="70" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">K1</text>
  <line x1="320" y1="64" x2="346" y2="64" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="348" y="46" width="56" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="376" y="70" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">K2</text>
  <line x1="404" y1="64" x2="430" y2="64" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="449" y="69" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">…</text>
  <line x1="468" y1="64" x2="494" y2="64" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="496" y="46" width="56" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="524" y="70" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Kn</text>
  <rect x="676" y="44" width="160" height="40" rx="20" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="756" y="70" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">조회 O(n)</text>

  <!-- ── 트리화 이후 ── -->
  <rect x="24" y="124" width="832" height="152" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="166" font-size="17" font-weight="bold" fill="#111827">트리화 이후</text>
  <rect x="156" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <text x="196" y="166" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">버킷 5</text>
  <line x1="236" y1="160" x2="304" y2="160" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- 트리 모양 (간선 먼저) -->
  <path d="M318,160 L280,202 M318,160 L356,202 M280,202 L260,242 M280,202 L300,242 M356,202 L336,242 M356,202 L376,242" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <circle cx="318" cy="160" r="13" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="280" cy="202" r="12" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="356" cy="202" r="12" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="260" cy="242" r="11" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="300" cy="242" r="11" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="336" cy="242" r="11" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="376" cy="242" r="11" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <text x="404" y="166" font-size="17" font-weight="bold" fill="#111827">Red-Black Tree</text>
  <rect x="676" y="140" width="160" height="40" rx="20" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="756" y="166" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">조회 O(log n)</text>
</svg>
