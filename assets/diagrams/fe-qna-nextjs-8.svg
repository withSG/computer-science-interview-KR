<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">loading.tsx 배치</title>
  <desc id="d">app/ 아래에 page.tsx, loading.tsx, dashboard/ 폴더가 있고 dashboard/ 안에도 page.tsx와 loading.tsx가 있는 디렉터리 트리. loading.tsx는 자동으로 Suspense 경계를 생성한다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 패널 -->
  <rect x="24" y="24" width="832" height="272" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- 트리 연결선 -->
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <path d="M62,76 L62,180"/>
    <path d="M62,100 L86,100"/>
    <path d="M62,140 L86,140"/>
    <path d="M62,180 L86,180"/>
    <path d="M104,196 L104,260"/>
    <path d="M104,220 L126,220"/>
    <path d="M104,260 L126,260"/>
  </g>

  <!-- loading.tsx 강조 면 -->
  <rect x="90" y="127" width="126" height="27" rx="5" fill="#fef3c7"/>
  <rect x="130" y="247" width="126" height="27" rx="5" fill="#fef3c7"/>

  <!-- 항목 -->
  <text x="52" y="66" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">app/</text>
  <text x="96" y="106" font-size="17" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">page.tsx</text>
  <text x="96" y="146" font-size="17" font-weight="bold" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">loading.tsx</text>
  <text x="96" y="186" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">dashboard/</text>
  <text x="136" y="226" font-size="17" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">page.tsx</text>
  <text x="136" y="266" font-size="17" font-weight="bold" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">loading.tsx</text>

  <!-- 주석 열 -->
  <line x1="228" y1="140" x2="416" y2="140" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="428" y="146" font-size="16" fill="#047857">// 자동으로 Suspense 경계 생성</text>
</svg>
