<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DFS와 BFS</title>
  <desc id="d">트리 구조에서의 DFS와 BFS 탐색 순서 및 설명 다이어그램</desc>
  <rect width="880" height="280" fill="#ffffff"/>

  <!-- Left: Tree Structure Group -->
  <g id="tree">
    <!-- Edges -->
    <line x1="200" y1="60" x2="110" y2="135" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="200" y1="60" x2="200" y2="135" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="200" y1="60" x2="290" y2="135" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="110" y1="135" x2="70" y2="215" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="110" y1="135" x2="150" y2="215" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="290" y1="135" x2="290" y2="215" stroke="#9aa5b1" stroke-width="2"/>

    <!-- Node 1 -->
    <circle cx="200" cy="60" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="200" y="64.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">1</text>

    <!-- Node 2 -->
    <circle cx="110" cy="135" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="110" y="139.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">2</text>

    <!-- Node 3 -->
    <circle cx="200" cy="135" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="200" y="139.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">3</text>

    <!-- Node 4 -->
    <circle cx="290" cy="135" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="290" y="139.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">4</text>

    <!-- Node 5 -->
    <circle cx="70" cy="215" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="70" y="219.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">5</text>

    <!-- Node 6 -->
    <circle cx="150" cy="215" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="150" y="219.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">6</text>

    <!-- Node 7 -->
    <circle cx="290" cy="215" r="22" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
    <text x="290" y="219.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">7</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="370" y1="35" x2="370" y2="245" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right: DFS Section -->
  <g id="dfs-section">
    <rect x="390" y="45" width="460" height="85" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="415" y="77.55" font-size="14" font-weight="bold" fill="#7c3aed">DFS:</text>
    <text x="460" y="77.55" font-size="13" font-weight="bold" fill="#1f2933">1 → 2 → 5 → 6 → 3 → 4 → 7</text>
    <text x="415" y="107.03" font-size="11.5" fill="#52606d">한 갈래를 끝까지 판 뒤 되돌아옴</text>
  </g>

  <!-- Right: BFS Section -->
  <g id="bfs-section">
    <rect x="390" y="150" width="460" height="85" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="415" y="182.55" font-size="14" font-weight="bold" fill="#059669">BFS:</text>
    <text x="460" y="182.55" font-size="13" font-weight="bold" fill="#1f2933">1 → 2 → 3 → 4 → 5 → 6 → 7</text>
    <text x="415" y="212.03" font-size="11.5" fill="#52606d">거리 1을 다 본 뒤 거리 2로</text>
  </g>
</svg>