<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실제 장애에서 셋이 이어지는 방식</title>
  <desc id="d">Metrics에서 시작해 Traces를 거쳐 Logs로 원인을 narrowing down하는 장애 조치 흐름도</desc>
  <rect width="880" height="610" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커 (잉크색) -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- 화살표 마커 (빨강색) -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 1단계: [알림] (Metrics) -->
  <g>
    <!-- 박스: 중심 (440, 50), 너비 440, 높이 50 -->
    <rect x="220" y="25" width="440" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="54" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[알림]  주문 API 5xx 비율 0.2% → 4.1% (Metrics)</text>
  </g>

  <!-- 화살표 1 및 설명 -->
  <path d="M440,75 L440,165" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="270" y="108" width="340" height="24" fill="#ffffff"/>
  <text x="440" y="124" font-size="12" fill="#52606d" text-anchor="middle">"무엇이" 잘못됐는지는 알았다. 그런데 어디서?</text>

  <!-- 2단계: [트레이스 조회] (Traces) -->
  <g>
    <!-- 박스: 중심 (440, 190), 너비 440, 높이 50 -->
    <rect x="220" y="165" width="440" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="440" y="194" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[트레이스 조회]  status=500 인 trace 만 필터</text>
  </g>

  <!-- 화살표 2 및 설명 -->
  <path d="M440,215 L440,325" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="200" y="248" width="480" height="44" fill="#ffffff"/>
  <text x="440" y="264" font-size="12" fill="#52606d" text-anchor="middle">order-service → payment-service 구간에서만 3초 넘게 소진</text>
  <text x="440" y="284" font-size="12" fill="#52606d" text-anchor="middle">나머지 구간은 평소와 동일</text>

  <!-- 3단계: [로그 조회] (Logs) -->
  <g>
    <!-- 박스: 중심 (440, 350), 너비 480, 높이 50 -->
    <rect x="200" y="325" width="480" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="440" y="354" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[로그 조회]  trace_id 로 payment-service 로그만 추출</text>
  </g>

  <!-- 화살표 3 및 설명 -->
  <path d="M440,375 L440,485" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="190" y="408" width="500" height="44" fill="#ffffff"/>
  <text x="440" y="424" font-size="11.5" fill="#52606d" text-anchor="middle">"HikariPool-1 - Connection is not available,</text>
  <text x="440" y="444" font-size="11.5" fill="#52606d" text-anchor="middle">request timed out after 3000ms"</text>

  <!-- 4단계: [원인] (Root Cause) -->
  <g>
    <!-- 박스: 중심 (440, 515), 너비 620, 높이 50 -->
    <rect x="130" y="490" width="620" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="440" y="519" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">[원인]  결제 트랜잭션 안에서 외부 PG 호출 → 커넥션 점유 시간 증가 → 풀 고갈</text>
  </g>
</svg>