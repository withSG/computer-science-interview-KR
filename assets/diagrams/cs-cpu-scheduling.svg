<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 740" width="880" height="740" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MLFQ 강등과 승격</title>
  <desc id="d">새 프로세스는 최상위 큐 Q0로 들어오고, 퀀텀을 다 쓰면 Q1, Q2로 한 단계씩 강등되며, 퀀텀을 다 쓰기 전에 I/O로 양보하면 현재 큐를 유지하고, 에이징으로 주기적으로 최상위 큐로 승격되는 MLFQ 구조와 다섯 가지 규칙입니다.</desc>
  <rect width="880" height="740" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 진입 -->
  <rect x="236" y="24" width="348" height="36" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="410" y="48" font-size="16" fill="#111827" text-anchor="middle">새 프로세스는 언제나 최상위 큐로 들어온다</text>
  <path d="M410,62 L410,96" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- Q0 -->
  <rect x="230" y="100" width="360" height="76" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="252" y="133" fill="#1e3a8a"><tspan font-size="22" font-weight="bold">Q0</tspan><tspan dx="12" font-size="17" font-weight="bold">우선순위 高</tspan></text>
  <text x="252" y="161" font-size="16" fill="#1e3a8a">퀀텀 8ms · 큐 안에서 RR</text>

  <!-- Q1 -->
  <rect x="230" y="240" width="360" height="76" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="252" y="273" fill="#78350f"><tspan font-size="22" font-weight="bold">Q1</tspan><tspan dx="12" font-size="17" font-weight="bold">우선순위 중간</tspan></text>
  <text x="252" y="301" font-size="16" fill="#78350f">퀀텀 16ms · 큐 안에서 RR</text>

  <!-- Q2 -->
  <rect x="230" y="380" width="360" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="252" y="413" fill="#111827"><tspan font-size="22" font-weight="bold">Q2</tspan><tspan dx="12" font-size="17" font-weight="bold">우선순위 低</tspan></text>
  <text x="252" y="441" font-size="16" fill="#111827">FCFS</text>

  <!-- ③ 강등 -->
  <path d="M410,178 L410,236" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <text x="426" y="214" font-size="16" font-weight="bold" fill="#b91c1c">③ 퀀텀 다 씀 → 강등</text>
  <path d="M410,318 L410,376" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <text x="426" y="354" font-size="16" font-weight="bold" fill="#b91c1c">③ 퀀텀 다 씀 → 강등</text>

  <!-- ④ I/O 양보 시 유지 -->
  <path d="M592,122 C652,122 652,156 598,156" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-green)"/>
  <text x="660" y="134" font-size="15" font-weight="bold" fill="#047857">④ 퀀텀 다 쓰기 전 I/O 양보</text>
  <text x="660" y="156" font-size="15" font-weight="bold" fill="#047857">→ 현재 큐 유지</text>
  <path d="M592,262 C652,262 652,296 598,296" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-green)"/>
  <text x="660" y="274" font-size="15" font-weight="bold" fill="#047857">④ 퀀텀 다 쓰기 전 I/O 양보</text>
  <text x="660" y="296" font-size="15" font-weight="bold" fill="#047857">→ 현재 큐 유지</text>

  <!-- ⑤ 에이징 승격 -->
  <path d="M228,418 L150,418 L150,138 L226,138" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ah-purple)"/>
  <path d="M228,278 L150,278" fill="none" stroke="#6d28d9" stroke-width="2.5"/>
  <circle cx="150" cy="278" r="4" fill="#6d28d9"/>
  <text x="138" y="332" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="end">⑤ 에이징으로</text>
  <text x="138" y="354" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="end">주기적 승격</text>
  <text x="138" y="376" font-size="15" fill="#6d28d9" text-anchor="end">(최상위 큐로)</text>

  <!-- 규칙 -->
  <rect x="40" y="486" width="800" height="190" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="64" y="516" font-size="17" font-weight="bold" fill="#111827">규칙</text>
  <text x="64" y="546" font-size="15" fill="#111827"><tspan font-weight="bold">①</tspan> 상위 큐에 프로세스가 있으면 하위 큐는 실행되지 않는다</text>
  <text x="64" y="574" font-size="15" fill="#111827"><tspan font-weight="bold">②</tspan> 같은 큐 안에서는 RR</text>
  <text x="64" y="602" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#b91c1c">③</tspan> 퀀텀을 다 쓰면 한 단계 아래로 내려간다</text>
  <text x="64" y="630" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#047857">④</tspan> 퀀텀을 다 쓰기 전에 I/O로 양보하면 현재 큐를 유지한다</text>
  <text x="64" y="658" font-size="15" fill="#111827"><tspan font-weight="bold" fill="#6d28d9">⑤</tspan> 일정 주기마다 모든 프로세스를 최상위 큐로 올린다 (에이징)</text>

  <!-- 핵심 -->
  <text x="40" y="712" font-size="15" fill="#111827"><tspan font-weight="bold">핵심</tspan>  ③+④ → 실행 시간을 미리 몰라도 관찰만으로 "짧은 작업 우선"과 비슷한 효과 · ⑤ → 기아 방지</text>
</svg>
