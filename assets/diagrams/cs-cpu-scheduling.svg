<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">MLFQ 큐 강등·승격 구조 (Q0/Q1/Q2 + 에이징)</title>
  <desc id="d">다단계 피드백 큐(MLFQ)의 프로세스 진입, 퀀텀 소진 시 강등, I/O 양보 시 유지, 에이징에 의한 주기적 승격 구조를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="17" font-weight="600" fill="#1f2933">MLFQ 큐 강등·승격 구조 (Q0/Q1/Q2 + 에이징)</text>

  <!-- Legend -->
  <rect x="520" y="20" width="320" height="30" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <circle cx="535" cy="35" r="4" fill="#2563eb"/>
  <text x="545" y="39" font-size="11" fill="#1f2933">진입</text>
  <circle cx="585" cy="35" r="4" fill="#dc2626"/>
  <text x="595" y="39" font-size="11" fill="#1f2933">퀀텀 소진 강등</text>
  <circle cx="685" cy="35" r="4" fill="#059669"/>
  <text x="695" y="39" font-size="11" fill="#1f2933">I/O 양보 유지</text>
  <circle cx="775" cy="35" r="4" fill="#7c3aed"/>
  <text x="785" y="39" font-size="11" fill="#1f2933">에이징 승격</text>

  <!-- ENTRY POINT -->
  <!-- Start Box / New Process Label -->
  <rect x="50" y="80" width="130" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="99" font-size="12" font-weight="500" fill="#2563eb" text-anchor="middle">새 프로세스 도착</text>

  <!-- Entry Arrow to Q0 -->
  <path d="M180,95 L240,95" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="183" y="82" width="52" height="16" fill="#ffffff"/>
  <text x="209" y="94" font-size="11.5" fill="#2563eb" text-anchor="middle">최상위 진입</text>

  <!-- QUEUE 0 (Top) -->
  <!-- Box size: 480 x 70. x=250, y=60 -->
  <rect x="250" y="60" width="480" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="90" font-size="14" font-weight="600" fill="#2563eb">Q0 (우선순위 高)</text>
  <!-- Quantum Bar representation -->
  <rect x="270" y="100" width="80" height="16" rx="3" fill="#2563eb"/>
  <text x="310" y="112" font-size="11" fill="#ffffff" text-anchor="middle">퀀텀 8ms</text>
  <text x="360" y="112" font-size="11.5" fill="#52606d">RR 방식 스케줄링</text>

  <!-- Q0 I/O Loop (Self Return) -->
  <path d="M730,80 Q780,80 780,95 Q780,110 730,110" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-green)"/>
  <rect x="745" y="87" width="70" height="18" fill="#ffffff"/>
  <text x="780" y="100" font-size="11" fill="#059669" text-anchor="middle">I/O 양보 (유지)</text>

  <!-- Demotion Arrow Q0 -> Q1 -->
  <path d="M490,130 L490,200" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="495" y="155" width="115" height="18" fill="#ffffff"/>
  <text x="552" y="168" font-size="11.5" fill="#dc2626" text-anchor="middle">퀀텀 다 씀 (1단계 강등)</text>

  <!-- QUEUE 1 (Mid) -->
  <!-- Box size: 480 x 70. x=250, y=200 -->
  <rect x="250" y="200" width="480" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="270" y="230" font-size="14" font-weight="600" fill="#d97706">Q1 (우선순위 中)</text>
  <!-- Quantum Bar representation -->
  <rect x="270" y="240" width="160" height="16" rx="3" fill="#d97706"/>
  <text x="350" y="252" font-size="11" fill="#ffffff" text-anchor="middle">퀀텀 16ms</text>
  <text x="440" y="252" font-size="11.5" fill="#52606d">RR 방식 스케줄링</text>

  <!-- Q1 I/O Loop (Self Return) -->
  <path d="M730,220 Q780,220 780,235 Q780,250 730,250" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-green)"/>
  <rect x="745" y="227" width="70" height="18" fill="#ffffff"/>
  <text x="780" y="240" font-size="11" fill="#059669" text-anchor="middle">I/O 양보 (유지)</text>

  <!-- Demotion Arrow Q1 -> Q2 -->
  <path d="M490,270 L490,340" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="495" y="295" width="115" height="18" fill="#ffffff"/>
  <text x="552" y="308" font-size="11.5" fill="#dc2626" text-anchor="middle">퀀텀 다 씀 (1단계 강등)</text>

  <!-- QUEUE 2 (Low) -->
  <!-- Box size: 480 x 70. x=250, y=340 -->
  <rect x="250" y="340" width="480" height="70" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="270" y="370" font-size="14" font-weight="600" fill="#1f2933">Q2 (우선순위 低)</text>
  <rect x="270" y="380" width="240" height="16" rx="3" fill="#9aa5b1"/>
  <text x="390" y="392" font-size="11" fill="#ffffff" text-anchor="middle">FCFS (퀀텀 없음)</text>
  <text x="520" y="392" font-size="11.5" fill="#52606d">선착순 처리</text>

  <!-- AGING PROMOTION ARROWS (Q2 -> Q0, Q1 -> Q0) -->
  <!-- Curve path from Q2 left side (x=250, y=375) back to Q0 left side (x=250, y=95) -->
  <path d="M250,375 Q130,375 130,235 Q130,95 240,95" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>
  <!-- Curve path from Q1 left side (x=250, y=235) merging or pointing up -->
  <path d="M250,235 Q160,235 160,165 Q160,95 240,95" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-purple)"/>

  <!-- Aging Label Box -->
  <rect x="60" y="215" width="110" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="115" y="232" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">에이징 (Aging)</text>
  <text x="115" y="247" font-size="11" fill="#7c3aed" text-anchor="middle">주기적 최상위 승격</text>

  <!-- RULES SUMMARY BOX -->
  <rect x="50" y="440" width="780" height="70" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="70" y="462" font-size="12" font-weight="600" fill="#1f2933">MLFQ 핵심 운영 규칙</text>
  <text x="70" y="482" font-size="11.5" fill="#52606d">1. 상위 큐에 프로세스가 있으면 하위 큐는 실행되지 않음 (우선순위 스케줄링)</text>
  <text x="70" y="498" font-size="11.5" fill="#52606d">2. CPU 집중 작업은 퀀텀 소진으로 강등되며, I/O 집중 작업은 짧은 수행 후 상위 큐를 유지함</text>

  <!-- CAPTION -->
  <text x="440" y="540" font-size="11.5" fill="#52606d" text-anchor="middle">결론: MLFQ는 실행 시간을 사전 지식 없이 관찰하여 대화형(I/O) 작업 우선 및 기아 방지를 동시에 달성한다.</text>
</svg>