<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4. 증명 2 — 참조 타입에서 벌어지는 일</title>
  <desc id="d">Java에서 참조 타입 인자를 전달할 때, 객체 수정(mutate)과 참조 재할당(reassign)이 스택과 히프 메모리 상태 및 참조 값에 미치는 영향을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ================= SECTION 1: [초기 상태] ================= -->
  <g id="section-1">
    <!-- Title -->
    <text x="30" y="38" font-size="14" font-weight="bold" fill="#1f2933">[초기 상태]</text>

    <!-- Header Labels -->
    <text x="160" y="62" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">main 스택</text>
    <text x="560" y="62" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">Heap</text>

    <!-- Main Stack Frame Box -->
    <rect x="40" y="75" width="240" height="50" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <line x1="100" y1="75" x2="100" y2="125" stroke="#cbd2d9" stroke-width="1"/>
    <!-- Stack Variable Labels -->
    <text x="70" y="104" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">s</text>
    <text x="190" y="104" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">0xA1</text>

    <!-- Arrow from s to Heap Object -->
    <path d="M280,100 L440,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Heap Object Box -->
    <rect x="440" y="70" width="240" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="460" y="93" font-size="13" font-weight="bold" fill="#1f2933">StringBuilder</text>
    <text x="460" y="117" font-size="13" fill="#52606d">"Hello"</text>
  </g>

  <!-- Horizontal Divider 1 -->
  <line x1="30" y1="155" x2="850" y2="155" stroke="#e4e7eb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= SECTION 2: [(A) mutate 호출] ================= -->
  <g id="section-2">
    <!-- Title -->
    <text x="30" y="188" font-size="14" font-weight="bold" fill="#2563eb">[(A) mutate 호출 — 참조값이 복사됨]</text>

    <!-- Stack Frames -->
    <!-- s frame -->
    <rect x="40" y="205" width="240" height="45" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="100" y1="205" x2="100" y2="250" stroke="#cbd2d9" stroke-width="1"/>
    <text x="70" y="232" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">s</text>
    <text x="190" y="232" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">0xA1</text>

    <!-- sb frame -->
    <rect x="40" y="260" width="240" height="45" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="100" y1="260" x2="100" y2="305" stroke="#cbd2d9" stroke-width="1"/>
    <text x="70" y="287" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">sb</text>
    <text x="190" y="287" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">0xA1</text>

    <!-- Subtitle under sb -->
    <text x="160" y="325" font-size="11.5" fill="#52606d" text-anchor="middle">(mutate 프레임)</text>

    <!-- Combined Arrows to same Heap Object -->
    <path d="M280,227.5 L360,227.5 L360,255 L440,255" stroke="#2563eb" stroke-width="1.5" fill="none"/>
    <path d="M280,282.5 L360,282.5 L360,255 L440,255" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Heap Object Box -->
    <rect x="440" y="225" width="240" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="460" y="248" font-size="13" font-weight="bold" fill="#1f2933">StringBuilder</text>
    <text x="460" y="272" font-size="13" font-weight="bold" fill="#059669">"Hello World"</text>

    <!-- Annotations -->
    <text x="692" y="260" font-size="13" font-weight="bold" fill="#059669">← 같은 객체를 고쳤다</text>
    <text x="380" y="325" font-size="13" fill="#1f2933">두 변수가 같은 객체를 본다 → 원본에 반영</text>
  </g>

  <!-- Horizontal Divider 2 -->
  <line x1="30" y1="350" x2="850" y2="350" stroke="#e4e7eb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= SECTION 3: [(B) reassign 호출] ================= -->
  <g id="section-3">
    <!-- Title -->
    <text x="30" y="383" font-size="14" font-weight="bold" fill="#7c3aed">[(B) reassign 호출 — 복사본에만 새 주소를 넣음]</text>

    <!-- Stack Frame 1: s -->
    <rect x="40" y="400" width="240" height="45" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <line x1="100" y1="400" x2="100" y2="445" stroke="#cbd2d9" stroke-width="1"/>
    <text x="70" y="427" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">s</text>
    <text x="190" y="427" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">0xA1</text>

    <!-- Arrow from s to Original Heap Object -->
    <path d="M280,422.5 L440,422.5" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Heap Object 1: "Hello World" -->
    <rect x="440" y="400" width="240" height="45" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="460" y="427" font-size="13" font-weight="bold" fill="#1f2933">"Hello World"</text>

    <!-- Stack Frame 2: sb -->
    <rect x="40" y="480" width="240" height="45" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="100" y1="480" x2="100" y2="525" stroke="#cbd2d9" stroke-width="1"/>
    <text x="70" y="507" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">sb</text>
    <text x="190" y="507" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">0xB7</text>

    <!-- Arrow from sb to New Heap Object -->
    <path d="M280,502.5 L440,502.5" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

    <!-- Heap Object 2: "Bye!" -->
    <rect x="440" y="480" width="240" height="45" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="460" y="507" font-size="13" font-weight="bold" fill="#7c3aed">"Bye!"</text>

    <!-- Subtitle under sb -->
    <text x="160" y="548" font-size="11.5" fill="#52606d" text-anchor="middle">(reassign 프레임)</text>

    <!-- Annotations -->
    <text x="692" y="427" font-size="13" fill="#52606d">← s는 그대로</text>
    <text x="692" y="507" font-size="13" font-weight="bold" fill="#7c3aed">← 새 객체</text>
    <text x="380" y="548" font-size="13" fill="#d97706">프레임이 사라지면 이 객체는 GC 대상</text>
  </g>
</svg>