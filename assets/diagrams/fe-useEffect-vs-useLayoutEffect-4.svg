<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">언제 실행되는가</title>
  <desc id="d">useEffect 의존성이 변경되거나 마운트, 언마운트될 때 effect와 cleanup 함수의 실행 순서를 보여주는 다이어그램입니다.</desc>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 마커 정의 -->
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 세로 타임라인 / 연결선 -->
  <path d="M 180,60 L 180,280" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- [마운트] 단계 -->
  <g id="step-mount">
    <rect x="50" y="40" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="65" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[마운트]</text>

    <path d="M 170,60 L 250,60" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <rect x="250" y="40" width="230" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="365" y="65" font-size="13" fill="#1f2933" text-anchor="middle">effect 실행 (roomId: 'A')</text>
  </g>

  <!-- [roomId 'A' → 'B'] 단계 -->
  <g id="step-update">
    <rect x="50" y="125" width="180" height="70" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="140" y="165" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">[roomId 'A' → 'B']</text>

    <!-- 이전 cleanup 연결선 -->
    <path d="M 230,145 L 290,145" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

    <rect x="290" y="125" width="250" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="415" y="150" font-size="13" fill="#1f2933" text-anchor="middle">이전 cleanup ('A' 연결 해제)</text>

    <rect x="555" y="132" width="70" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="590" y="149" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">← 먼저</text>

    <!-- 새 effect 연결선 -->
    <path d="M 230,175 L 290,175" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <rect x="290" y="175" width="250" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="415" y="200" font-size="13" fill="#1f2933" text-anchor="middle">새 effect ('B' 연결)</text>

    <rect x="555" y="182" width="70" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="590" y="199" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">← 나중</text>
  </g>

  <!-- [언마운트] 단계 -->
  <g id="step-unmount">
    <rect x="50" y="260" width="120" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="110" y="285" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">[언마운트]</text>

    <path d="M 170,280 L 250,280" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

    <rect x="250" y="260" width="230" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="365" y="285" font-size="13" fill="#1f2933" text-anchor="middle">cleanup ('B' 연결 해제)</text>
  </g>
</svg>