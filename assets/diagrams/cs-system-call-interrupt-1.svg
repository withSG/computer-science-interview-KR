<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">모드 비트</title>
  <desc id="d">사용자 모드와 커널 모드 간의 권한 차이 및 시스템 콜, 인터럽트, 예외를 통한 모드 전환을 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  <rect x="40" y="30" width="800" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="62" font-size="16" font-weight="bold" fill="#2563eb">사용자 모드 (User Mode, ring 3)</text>
  <text x="80" y="94" font-size="13" fill="#1f2933">할 수 있는 것: 일반 연산, 자기 주소 공간 읽고 쓰기</text>
  <text x="80" y="122" font-size="13" fill="#1f2933">할 수 없는 것: I/O 명령, 페이지 테이블 변경,</text>
  <text x="180" y="150" font-size="13" fill="#1f2933">인터럽트 마스킹, 다른 프로세스 메모리 접근</text>
  <rect x="40" y="270" width="800" height="110" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="302" font-size="16" font-weight="bold" fill="#059669">커널 모드 (Kernel Mode, ring 0)</text>
  <text x="80" y="338" font-size="13" fill="#1f2933">모든 명령어 실행 가능, 전체 물리 메모리 접근 가능</text>
  <path d="M370,180 L370,270" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="235" y="213" width="270" height="24" fill="#ffffff"/>
  <text x="370" y="230" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">시스템 콜 / 인터럽트 / 예외</text>
  <path d="M510,270 L510,180" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="520" y="213" width="130" height="24" fill="#ffffff"/>
  <text x="525" y="230" font-size="13" font-weight="bold" fill="#059669" text-anchor="start">처리 완료 후 복귀</text>
</svg>