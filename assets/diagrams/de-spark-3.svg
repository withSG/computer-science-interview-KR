<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Narrow와 Wide 변환 비교</title>
  <desc id="d">Narrow 변환은 각 파티션이 자기 몫만 처리해 파티션 간 데이터 이동이 없고, Wide 변환은 모든 입력 파티션이 모든 출력 파티션으로 데이터를 보내는 재배치(셔플)가 일어난다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ===== Narrow ===== -->
  <rect x="24" y="24" width="404" height="382" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="44" y="58" font-size="20" font-weight="700" fill="#065f46">Narrow</text>
  <text x="44" y="88" font-size="16" font-weight="700" fill="#1f2937">파티션 간 데이터 이동 없음</text>
  <text x="44" y="112" font-size="16" fill="#374151">각자 자기 몫만 처리</text>

  <rect x="88" y="140" width="72" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="124" y="166" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P0</text>
  <rect x="88" y="204" width="72" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="124" y="230" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P1</text>
  <rect x="88" y="268" width="72" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="124" y="294" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P2</text>

  <line x1="162" y1="160" x2="290" y2="160" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="162" y1="224" x2="290" y2="224" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="162" y1="288" x2="290" y2="288" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect x="292" y="140" width="72" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="328" y="166" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P0'</text>
  <rect x="292" y="204" width="72" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="328" y="230" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P1'</text>
  <rect x="292" y="268" width="72" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="328" y="294" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P2'</text>

  <rect x="44" y="330" width="364" height="56" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="60" y="364" font-size="15" fill="#374151">예:</text>
  <text x="92" y="364" font-size="15" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#065f46">filter, map, select, withColumn</text>

  <!-- ===== Wide ===== -->
  <rect x="452" y="24" width="404" height="382" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="472" y="58" font-size="20" font-weight="700" fill="#991b1b">Wide</text>
  <text x="472" y="88" font-size="16" font-weight="700" fill="#1f2937">파티션 간 재배치 필요</text>
  <text x="472" y="112" font-size="16" font-weight="700" fill="#b91c1c">셔플 발생</text>

  <rect x="516" y="140" width="72" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="552" y="166" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P0</text>
  <rect x="516" y="204" width="72" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="552" y="230" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P1</text>
  <rect x="516" y="268" width="72" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="552" y="294" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P2</text>

  <g stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#ar)">
    <line x1="590" y1="148" x2="718" y2="148"/>
    <line x1="590" y1="160" x2="718" y2="212"/>
    <line x1="590" y1="172" x2="718" y2="276"/>
    <line x1="590" y1="212" x2="718" y2="160"/>
    <line x1="590" y1="224" x2="718" y2="224"/>
    <line x1="590" y1="236" x2="718" y2="288"/>
    <line x1="590" y1="276" x2="718" y2="172"/>
    <line x1="590" y1="288" x2="718" y2="236"/>
    <line x1="590" y1="300" x2="718" y2="300"/>
  </g>

  <rect x="720" y="140" width="72" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="756" y="166" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P0'</text>
  <rect x="720" y="204" width="72" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="756" y="230" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P1'</text>
  <rect x="720" y="268" width="72" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="756" y="294" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">P2'</text>

  <rect x="472" y="330" width="364" height="56" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="488" y="353" font-size="15" fill="#374151">예:</text>
  <text x="520" y="353" font-size="15" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#991b1b">groupBy, join, distinct,</text>
  <text x="520" y="375" font-size="15" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#991b1b">repartition, orderBy</text>
</svg>
