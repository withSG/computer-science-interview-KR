<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">변경 감지 스냅샷 비교</title>
  <desc id="d">em.find(1L) 때 1차 캐시의 엔티티와 스냅샷에 같은 값(name "김개발", age 28)이 담긴다. member.setName("박개발")은 엔티티만 바꾸고 JPA는 아무것도 하지 않는다. 커밋 때 flush가 모든 엔티티를 스냅샷과 비교해 name이 다르므로 UPDATE member SET ... WHERE id = 1을 생성한다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <rect x="360" y="24" width="230" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="475" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">1차 캐시</text>
  <text x="475" y="74" text-anchor="middle" font-size="15" fill="#1e3a8a"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">1L →</tspan> Member 인스턴스</text>
  <rect x="610" y="24" width="230" height="64" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="725" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">스냅샷</text>
  <text x="725" y="74" text-anchor="middle" font-size="15" fill="#065f46"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">1L →</tspan> 필드 값 복사본</text>

  <!-- 시간 흐름 -->
  <line x1="58" y1="148" x2="58" y2="224" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="58" y1="260" x2="58" y2="348" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ① em.find -->
  <circle cx="58" cy="132" r="15" fill="#111827"/>
  <text x="58" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="86" y="138" font-size="16" fill="#111827"><tspan font-weight="700" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.find(1L)</tspan> 호출 시점</text>

  <rect x="360" y="100" width="230" height="96" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="384" y="138" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</text>
  <text x="436" y="138" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="456" y="138" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"김개발"</text>
  <text x="384" y="172" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">age</text>
  <text x="436" y="172" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="456" y="172" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">28</text>

  <rect x="610" y="100" width="230" height="96" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="634" y="138" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</text>
  <text x="686" y="138" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="706" y="138" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"김개발"</text>
  <text x="634" y="172" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">age</text>
  <text x="686" y="172" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="706" y="172" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">28</text>

  <!-- ② setName -->
  <circle cx="58" cy="244" r="15" fill="#111827"/>
  <text x="58" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="86" y="250" font-size="16" fill="#111827"><tspan font-weight="700" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">member.setName("박개발")</tspan> 호출</text>
  <text x="86" y="280" font-size="15" font-weight="700" fill="#b45309">JPA는 여기서 아무것도 하지 않는다</text>

  <rect x="360" y="212" width="230" height="108" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="372" y="232" width="206" height="36" rx="4" fill="#fee2e2"/>
  <text x="384" y="256" font-size="16" font-weight="700" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</text>
  <text x="436" y="256" font-size="16" font-weight="700" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="456" y="256" font-size="16" font-weight="700" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"박개발"</text>
  <text x="566" y="256" text-anchor="end" font-size="14" font-weight="700" fill="#b91c1c">변경</text>
  <text x="384" y="294" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">age</text>
  <text x="436" y="294" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="456" y="294" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">28</text>

  <rect x="610" y="212" width="230" height="108" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="634" y="256" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</text>
  <text x="686" y="256" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="706" y="256" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"김개발"</text>
  <text x="634" y="294" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">age</text>
  <text x="686" y="294" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">=</text>
  <text x="706" y="294" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">28</text>

  <!-- ③ 커밋 → flush -->
  <circle cx="58" cy="368" r="15" fill="#111827"/>
  <text x="58" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="86" y="374" font-size="16" font-weight="700" fill="#111827">커밋 → <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">flush</tspan></text>

  <rect x="360" y="336" width="480" height="184" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="600" y="366" text-anchor="middle" font-size="15" fill="#374151">영속성 컨텍스트의 모든 엔티티를 순회하며 스냅샷과 비교</text>
  <rect x="528" y="382" width="144" height="36" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="600" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</tspan> 이 다름</text>
  <line x1="600" y1="418" x2="600" y2="452" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="441" font-size="15" fill="#374151">생성</text>
  <rect x="384" y="456" width="432" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="600" y="484" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UPDATE member SET ... WHERE id = 1</text>
</svg>
