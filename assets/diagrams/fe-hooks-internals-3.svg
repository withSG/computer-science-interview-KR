<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">오래된 클로저 (Stale Closure) 타임라인</title>
  <desc id="d">React useEffect의 빈 의존성 배열로 인해 발생하는 오래된 클로저 현상 및 시간 경과에 따른 count 상태 변화 흐름도</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 콘텍스트 패널 -->
  <rect x="24" y="24" width="832" height="452" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="8"/>

  <!-- 타이틀 / 헤더 -->
  <rect x="24" y="24" width="832" height="48" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1" rx="8"/>
  <text x="44" y="53" font-size="16" font-weight="bold" fill="#1e40af">오래된 클로저 (Stale Closure)</text>

  <!-- 1. 렌더 1 영역 -->
  <rect x="44" y="92" width="792" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
  <rect x="44" y="92" width="160" height="32" fill="#2563eb" rx="6"/>
  <!-- 오른쪽 위 모서리 둥글기 맞춤용 보정 -->
  <rect x="190" y="92" width="14" height="32" fill="#2563eb"/>
  <text x="124" y="113" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">렌더 1: count = 0</text>

  <!-- 렌더 1 내부 흐름 -->
  <!-- [interval 등록] -->
  <rect x="230" y="132" width="120" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="290" y="156" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">interval 등록</text>

  <path d="M350,152 L382,152" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- [클로저가 count=0을 캡처] -->
  <rect x="390" y="132" width="220" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="500" y="156" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">클로저가 count=0을 캡처</text>

  <!-- 1초 이벤트 -->
  <rect x="44" y="218" width="792" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="6"/>
  <text x="64" y="248" font-size="14" font-weight="bold" fill="#047857">1초:</text>
  
  <rect x="110" y="228" width="150" height="30" fill="#ffffff" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="185" y="247" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">setCount(0 + 1)</text>

  <path d="M260,243 L292,243" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="300" y="228" width="110" height="30" fill="#059669" rx="4"/>
  <text x="355" y="247" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">count = 1</text>

  <!-- 2. 렌더 2 영역 -->
  <rect x="44" y="284" width="792" height="110" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
  <rect x="44" y="284" width="160" height="32" fill="#d97706" rx="6"/>
  <rect x="190" y="284" width="14" height="32" fill="#d97706"/>
  <text x="124" y="305" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">렌더 2: count = 1</text>

  <!-- 렌더 2 내부 설명 박스들 -->
  <rect x="230" y="324" width="210" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="335" y="348" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">deps가 []라서 effect 재실행 안 함</text>

  <rect x="460" y="324" width="356" height="40" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="638" y="348" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">interval은 여전히 렌더 1의 클로저를 실행 중</text>

  <!-- 3초/4초 반복 스태그 -->
  <rect x="44" y="410" width="792" height="50" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
  
  <text x="64" y="440" font-size="13" font-weight="bold" fill="#991b1b">2초:</text>
  <text x="96" y="440" font-size="13" fill="#1f2933">setCount(0 + 1) → count = 1 (변화 없음)</text>

  <line x1="390" y1="418" x2="390" y2="452" stroke="#fca5a5" stroke-width="1"/>

  <text x="410" y="440" font-size="13" font-weight="bold" fill="#991b1b">3초:</text>
  <text x="442" y="440" font-size="13" fill="#1f2933">setCount(0 + 1) → count = 1 (변화 없음)</text>

  <!-- 범례 (Legend) -->
  <rect x="620" y="34" width="220" height="28" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <circle cx="635" cy="48" r="5" fill="#2563eb"/>
  <text x="645" y="52" font-size="11" fill="#52606d">초기 상태</text>
  <circle cx="705" cy="48" r="5" fill="#059669"/>
  <text x="715" y="52" font-size="11" fill="#52606d">상태 변경</text>
  <circle cx="775" cy="48" r="5" fill="#dc2626"/>
  <text x="785" y="52" font-size="11" fill="#52606d">고정/오류</text>
</svg>