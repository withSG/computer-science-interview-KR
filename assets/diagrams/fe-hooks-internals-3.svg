<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">오래된 클로저 타임라인</title>
  <desc id="d">렌더 1(count = 0)에서 등록된 interval은 count=0을 캡처한 클로저를 계속 실행한다. 1초에 count가 1이 되고 렌더 2가 일어나도 deps가 []라서 effect는 재실행되지 않으므로, 2초와 3초에도 setCount(0 + 1)이 실행되어 count는 1에서 변화가 없다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 레인 머리 -->
  <text x="120" y="60" font-size="16" font-weight="bold" fill="#374151">컴포넌트 렌더</text>
  <text x="452" y="60" font-size="16" font-weight="bold" fill="#374151">interval 콜백</text>

  <!-- 시간 축 -->
  <line x1="98" y1="112" x2="98" y2="470" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="98" cy="130" r="6" fill="#1d4ed8"/>
  <circle cx="98" cy="215" r="6" fill="#475569"/>
  <circle cx="98" cy="300" r="6" fill="#1d4ed8"/>
  <circle cx="98" cy="385" r="6" fill="#475569"/>
  <circle cx="98" cy="451" r="6" fill="#475569"/>
  <text x="84" y="136" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="end">렌더 1</text>
  <text x="84" y="221" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">1초</text>
  <text x="84" y="306" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="end">렌더 2</text>
  <text x="84" y="391" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">2초</text>
  <text x="84" y="457" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">3초</text>

  <!-- 렌더 1의 클로저 영역 -->
  <rect x="452" y="90" width="404" height="396" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="472" y="126" font-size="16" font-weight="bold" fill="#6d28d9">클로저가 count=0을 캡처</text>
  <text x="472" y="154" font-size="15" fill="#6d28d9">이 안의 count는 영원히 0</text>

  <!-- 렌더 1 -->
  <rect x="120" y="90" width="290" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="140" y="124" font-size="18" font-weight="bold" fill="#111827">count = 0</text>
  <text x="140" y="153" font-size="15" fill="#1f2937">interval 등록</text>
  <line x1="412" y1="148" x2="448" y2="148" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- 1초 -->
  <rect x="468" y="194" width="152" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="544" y="220" font-size="16" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setCount(0 + 1)</text>
  <line x1="622" y1="215" x2="652" y2="215" stroke="#374151" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect x="656" y="194" width="184" height="42" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="748" y="220" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">count = 1</text>

  <!-- 렌더 2 -->
  <rect x="120" y="260" width="290" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="140" y="294" font-size="18" font-weight="bold" fill="#111827">count = 1</text>
  <text x="140" y="323" font-size="15" fill="#1f2937">deps가 []라서 effect 재실행 안 함</text>
  <text x="472" y="306" font-size="15" font-weight="bold" fill="#6d28d9">interval은 여전히 렌더 1의 클로저를 실행 중</text>

  <!-- 2초 -->
  <rect x="468" y="364" width="152" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="544" y="390" font-size="16" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setCount(0 + 1)</text>
  <line x1="622" y1="385" x2="652" y2="385" stroke="#374151" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect x="656" y="364" width="184" height="42" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="748" y="390" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">count = 1 (변화 없음)</text>

  <!-- 3초 -->
  <rect x="468" y="430" width="152" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="544" y="456" font-size="16" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setCount(0 + 1)</text>
  <line x1="622" y1="451" x2="652" y2="451" stroke="#374151" stroke-width="1.5" marker-end="url(#arr-ink)"/>
  <rect x="656" y="430" width="184" height="42" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="748" y="456" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">count = 1 (변화 없음)</text>
</svg>
