<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">선택 정렬 (Selection Sort)</title>
  <desc id="d">선택 정렬의 회전별 과정을 보여주는 다이어그램입니다. 각 단계에서 최솟값을 찾아 정렬된 구간으로 이동하는 과정을 나타냅니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- Step 1 -->
  <g transform="translate(40, 40)">
    <!-- Array -->
    <rect x="0" y="0" width="50" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="25" y="30.75" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">5</text>

    <rect x="58" y="0" width="50" height="50" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <text x="83" y="30.75" font-size="16" fill="#dc2626" font-weight="bold" text-anchor="middle">1</text>

    <rect x="116" y="0" width="50" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="141" y="30.75" font-size="16" fill="#1f2933" text-anchor="middle">4</text>

    <rect x="174" y="0" width="50" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="199" y="30.75" font-size="16" fill="#1f2933" text-anchor="middle">2</text>

    <!-- Swap Arrow -->
    <path d="M 83,56 C 83,85 25,85 25,56" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-ink)"/>

    <!-- Description Text -->
    <text x="250" y="30.75" font-size="14" fill="#1f2933">최솟값 1 찾음</text>
    <path d="M 345,25 L 365,25" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="375" y="30.75" font-size="14" fill="#1f2933">맨 앞 5와 교환</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(40, 150)">
    <!-- Sorted part -->
    <rect x="0" y="0" width="50" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="25" y="30.75" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle">1</text>

    <!-- Divider line -->
    <line x1="54" y1="-5" x2="54" y2="55" stroke="#52606d" stroke-width="2.5" stroke-dasharray="4 2"/>

    <!-- Unsorted part -->
    <rect x="58" y="0" width="50" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
    <text x="83" y="30.75" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">5</text>

    <rect x="116" y="0" width="50" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="141" y="30.75" font-size="16" fill="#1f2933" text-anchor="middle">4</text>

    <rect x="174" y="0" width="50" height="50" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <text x="199" y="30.75" font-size="16" fill="#dc2626" font-weight="bold" text-anchor="middle">2</text>

    <!-- Swap Arrow -->
    <path d="M 199,56 C 199,85 83,85 83,56" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-ink)"/>

    <!-- Description Text -->
    <text x="250" y="30.75" font-size="14" fill="#1f2933">최솟값 2 찾음</text>
    <path d="M 345,25 L 365,25" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="375" y="30.75" font-size="14" fill="#1f2933">5와 교환</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(40, 260)">
    <!-- Sorted part -->
    <rect x="0" y="0" width="50" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="25" y="30.75" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle">1</text>

    <rect x="58" y="0" width="50" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="83" y="30.75" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle">2</text>

    <!-- Divider line -->
    <line x1="112" y1="-5" x2="112" y2="55" stroke="#52606d" stroke-width="2.5" stroke-dasharray="4 2"/>

    <!-- Unsorted part -->
    <rect x="116" y="0" width="50" height="50" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <text x="141" y="30.75" font-size="16" fill="#dc2626" font-weight="bold" text-anchor="middle">4</text>

    <rect x="174" y="0" width="50" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="199" y="30.75" font-size="16" fill="#1f2933" text-anchor="middle">5</text>

    <!-- Description Text -->
    <text x="250" y="30.75" font-size="14" fill="#1f2933">최솟값 4</text>
    <path d="M 310,25 L 330,25" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="340" y="30.75" font-size="14" fill="#1f2933">이미 제자리</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(40, 370)">
    <!-- Sorted part -->
    <rect x="0" y="0" width="50" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="25" y="30.75" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle">1</text>

    <rect x="58" y="0" width="50" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="83" y="30.75" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle">2</text>

    <rect x="116" y="0" width="50" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="141" y="30.75" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle">4</text>

    <!-- Divider line -->
    <line x1="170" y1="-5" x2="170" y2="55" stroke="#52606d" stroke-width="2.5" stroke-dasharray="4 2"/>

    <!-- Last element -->
    <rect x="174" y="0" width="50" height="50" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="199" y="30.75" font-size="16" fill="#059669" font-weight="bold" text-anchor="middle">5</text>

    <!-- Description Text -->
    <text x="250" y="30.75" font-size="14" fill="#059669" font-weight="bold">완료</text>
  </g>
</svg>