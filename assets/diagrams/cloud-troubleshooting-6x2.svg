<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">리눅스 Load Average 구성</title>
  <desc id="d">리눅스 Load Average는 R 상태(실행 중과 실행 대기) 프로세스와 D 상태(중단 불가 대기, 주로 디스크 I/O) 프로세스를 더한 값이다. R 상태는 CPU 경합을, D 상태는 I/O 경합을 반영한다.</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  <defs>
    <marker id="up-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="up-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 리눅스에서 더해지는 항 표시 -->
  <rect x="596" y="24" width="216" height="28" rx="14" fill="#fef3c7"/>
  <text x="704" y="43" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">리눅스에서 더 들어가는 항</text>

  <!-- 식: Load Average = R + D -->
  <rect x="24" y="64" width="160" height="88" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="104" y="115" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Load Average</text>

  <text x="204" y="118" font-size="30" font-weight="bold" fill="#374151" text-anchor="middle">=</text>

  <rect x="224" y="64" width="284" height="88" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="366" y="100" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">R 상태</text>
  <text x="366" y="130" font-size="16" fill="#1f2937" text-anchor="middle">실행 중 + 실행 대기</text>

  <text x="530" y="118" font-size="30" font-weight="bold" fill="#374151" text-anchor="middle">+</text>

  <rect x="552" y="64" width="304" height="88" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="704" y="100" font-size="20" font-weight="bold" fill="#b45309" text-anchor="middle">D 상태</text>
  <text x="704" y="130" font-size="16" fill="#1f2937" text-anchor="middle">중단 불가 대기, 주로 디스크 I/O</text>

  <!-- 각 항이 반영하는 경합 -->
  <line x1="366" y1="196" x2="366" y2="158" stroke="#1d4ed8" stroke-width="2" marker-end="url(#up-blue)"/>
  <line x1="704" y1="196" x2="704" y2="158" stroke="#b45309" stroke-width="2" marker-end="url(#up-amber)"/>

  <rect x="302" y="200" width="128" height="36" rx="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="366" y="224" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">CPU 경합</text>

  <rect x="640" y="200" width="128" height="36" rx="18" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="704" y="224" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">I/O 경합</text>
</svg>
