  <!-- Section Title -->
  <text x="44" y="55" font-size="14" font-weight="bold" fill="#1f2933">[ Gateway Endpoint 적용 후 ]</text>
  <text x="44" y="77" font-size="13" font-weight="bold" fill="#52606d">Private Subnet 라우팅 테이블</text>

  <!-- Table Header -->
