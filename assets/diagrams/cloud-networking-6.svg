  <text x="54" y="111" font-size="13" font-weight="bold" fill="#1f2933">Destination</text>
  <rect x="264" y="90" width="220" height="32" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="274" y="111" font-size="13" font-weight="bold" fill="#1f2933">Target</text>

  <!-- Table Row 1 -->
  <rect x="44" y="122" width="220" height="36" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="54" y="145" font-size="13" font-family="monospace" fill="#1f2933">10.0.0.0/16</text>
  <rect x="264" y="122" width="220" height="36" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="274" y="145" font-size="13" font-family="monospace" fill="#1f2933">local</text>

  <!-- Table Row 2 (Highlight: S3) -->
  <rect x="44" y="158" width="220" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="54" y="181" font-size="13" font-family="monospace" fill="#059669" font-weight="bold">pl-xxxx (S3 대역)</text>
  <rect x="264" y="158" width="220" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="274" y="181" font-size="13" font-family="monospace" fill="#059669" font-weight="bold">vpce-0a1b2c3d</text>

  <!-- Table Row 3 (Highlight: NAT) -->
  <rect x="44" y="194" width="220" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
