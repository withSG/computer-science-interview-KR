  <rect x="264" y="194" width="220" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="274" y="217" font-size="13" font-family="monospace" fill="#d97706" font-weight="bold">nat-0f9e8d7c</text>

