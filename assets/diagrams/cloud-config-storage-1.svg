<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">환경 중립 이미지와 환경별 설정의 주입</title>
  <desc id="d">코드와 런타임만 담은 환경 중립 이미지와, 환경별 값을 담은 ConfigMap/Secret을 따로 두었다가 Pod 실행 시점에 kubelet이 합쳐 주입하는 구조입니다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 이미지 -->
  <rect x="40" y="32" width="330" height="104" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="205" y="74" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">이미지</text>
  <text x="205" y="108" font-size="16" fill="#1f2937" text-anchor="middle">코드와 런타임만 (환경 중립)</text>

  <!-- + -->
  <circle cx="205" cy="160" r="15" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="205" y="167" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">+</text>

  <!-- ConfigMap / Secret -->
  <rect x="40" y="184" width="330" height="104" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="205" y="220" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">ConfigMap / Secret</text>
  <text x="205" y="248" font-size="16" fill="#1f2937" text-anchor="middle">환경별 값</text>
  <text x="205" y="274" font-size="15" fill="#4b5563" text-anchor="middle">예: DB 주소, 로그 레벨, 비밀번호</text>

  <!-- 합류선 -->
  <path d="M370,84 H430 V236 H370" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M430,160 H514" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Pod 실행 시점 주입 -->
  <rect x="520" y="100" width="320" height="120" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="680" y="150" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">Pod 실행 시점에</text>
  <text x="680" y="182" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">kubelet이 주입</text>
</svg>
