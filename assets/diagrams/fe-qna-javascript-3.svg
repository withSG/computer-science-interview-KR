<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이벤트 루프 구성 요소</title>
  <desc id="d">JavaScript Engine은 Call Stack과 Memory Heap으로 이루어지고, Event Loop는 우선순위가 높은 Microtask Queue와 Macrotask Queue(Task Queue)를 관리합니다. 콜 스택이 비어 있으면 큐의 태스크가 Call Stack으로 이동합니다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- JavaScript Engine -->
  <rect x="24" y="24" width="832" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="48" y="56" font-size="18" font-weight="bold" fill="#1e3a8a">JavaScript Engine</text>

  <rect x="48" y="72" width="380" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="238" y="118" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Call Stack</text>

  <rect x="452" y="72" width="380" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="642" y="118" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Memory Heap</text>

  <!-- Event Loop → Call Stack -->
  <line x1="238" y1="252" x2="238" y2="158" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah-ink)"/>
  <text x="256" y="220" font-size="15" fill="#374151">콜 스택 비어있으면 태스크 이동</text>

  <!-- Event Loop -->
  <rect x="24" y="254" width="832" height="282" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="48" y="286" font-size="18" font-weight="bold" fill="#5b21b6">Event Loop</text>

  <!-- Microtask Queue -->
  <rect x="48" y="302" width="784" height="100" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="72" y="334" font-size="17" font-weight="bold" fill="#111827">Microtask Queue</text>
  <rect x="236" y="315" width="124" height="28" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="298" y="334" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">우선순위 높음</text>

  <g font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" text-anchor="middle">
    <rect x="72" y="354" width="140" height="32" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="142" y="375">Promise.then</text>
    <rect x="224" y="354" width="158" height="32" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="303" y="375">queueMicrotask</text>
    <rect x="394" y="354" width="132" height="32" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="460" y="375">async/await</text>
  </g>

  <!-- Macrotask Queue -->
  <rect x="48" y="418" width="784" height="100" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="450" fill="#111827"><tspan font-size="17" font-weight="bold">Macrotask Queue</tspan><tspan font-size="16" fill="#4b5563" dx="8">(Task Queue)</tspan></text>

  <g font-size="15" fill="#111827" text-anchor="middle">
    <rect x="72" y="470" width="122" height="32" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="133" y="491" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTimeout</text>
    <rect x="206" y="470" width="132" height="32" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="272" y="491" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setInterval</text>
    <rect x="350" y="470" width="64" height="32" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="382" y="491">I/O</text>
    <rect x="426" y="470" width="104" height="32" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="478" y="491">UI 이벤트</text>
  </g>
</svg>
