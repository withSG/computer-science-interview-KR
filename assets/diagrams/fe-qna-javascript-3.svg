<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구성 요소</title>
  <desc id="d">JavaScript Engine과 Event Loop의 구성 요소를 나타낸 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- JavaScript Engine Outer Box -->
  <rect x="40" y="30" width="800" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="58.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">JavaScript Engine</text>

  <!-- Call Stack Box -->
  <rect x="70" y="80" width="350" height="80" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="245" y="129.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Call Stack</text>

  <!-- Memory Heap Box -->
  <rect x="460" y="80" width="350" height="80" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="635" y="129.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Memory Heap</text>

  <!-- Connection Arrow from Event Loop to JavaScript Engine Call Stack -->
  <path d="M245,240 L245,180" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Arrow Label with White Background -->
  <rect x="110" y="198" width="270" height="24" fill="#ffffff" rx="4"/>
  <text x="245" y="214.5" font-size="12" fill="#52606d" text-anchor="middle">(콜 스택 비어있으면 태스크 이동)</text>

  <!-- Event Loop Outer Box -->
  <rect x="40" y="240" width="800" height="250" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="268.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Event Loop</text>

  <!-- Microtask Queue Box -->
  <rect x="70" y="290" width="740" height="80" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="322.6" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Microtask Queue (우선순위 높음)</text>
  <text x="440" y="352.0" font-size="13" fill="#52606d" text-anchor="middle">Promise.then, queueMicrotask, async/await</text>

  <!-- Macrotask Queue Box -->
  <rect x="70" y="390" width="740" height="80" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="422.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Macrotask Queue (Task Queue)</text>
  <text x="440" y="452.0" font-size="13" fill="#52606d" text-anchor="middle">setTimeout, setInterval, I/O, UI 이벤트</text>
</svg>