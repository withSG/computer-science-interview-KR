<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">혼잡 윈도우(cwnd) 변화</title>
  <desc id="d">cwnd는 Slow Start에서 RTT당 두 배로 지수 증가하다 ssthresh에 닿으면 RTT당 1 MSS씩 선형 증가하고, 유실을 감지하면 중복 ACK 3회일 때는 절반으로 줄여 다시 선형 증가하며, 타임아웃일 때는 1로 되돌려 Slow Start부터 다시 시작합니다.</desc>
  <rect width="880" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 단계 구간 -->
  <rect x="112" y="24" width="165" height="416" fill="#eff6ff"/>
  <rect x="277" y="24" width="275" height="416" fill="#ecfdf5"/>
  <rect x="552" y="24" width="294" height="416" fill="#f5f3ff"/>
  <line x1="277" y1="24" x2="277" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="552" y1="24" x2="552" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="194.5" y="52" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">① Slow Start</text>
  <text x="194.5" y="76" font-size="15" fill="#1f2937" text-anchor="middle">지수 증가</text>
  <text x="194.5" y="97" font-size="15" fill="#1f2937" text-anchor="middle">RTT당 2배</text>
  <text x="194.5" y="196" font-size="15" fill="#4b5563" text-anchor="middle">ACK 받을 때마다</text>
  <text x="194.5" y="217" font-size="15" fill="#4b5563" text-anchor="middle">cwnd 증가</text>

  <text x="414.5" y="52" font-size="17" font-weight="700" fill="#047857" text-anchor="middle">② 혼잡 회피</text>
  <text x="414.5" y="76" font-size="15" fill="#1f2937" text-anchor="middle">선형 증가</text>
  <text x="414.5" y="97" font-size="15" fill="#1f2937" text-anchor="middle">RTT당 +1 MSS</text>

  <text x="699" y="52" font-size="17" font-weight="700" fill="#6d28d9" text-anchor="middle">③ Fast Recovery</text>
  <text x="699" y="76" font-size="15" fill="#1f2937" text-anchor="middle">절반으로 감소 후</text>
  <text x="699" y="97" font-size="15" fill="#1f2937" text-anchor="middle">다시 선형 증가</text>

  <!-- ssthresh -->
  <line x1="112" y1="300" x2="846" y2="300" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="102" y="305" font-size="15" font-weight="700" fill="#b45309" text-anchor="end">ssthresh</text>

  <!-- 축 -->
  <line x1="112" y1="440" x2="112" y2="32" stroke="#374151" stroke-width="1.8" marker-end="url(#ah-ink)"/>
  <line x1="112" y1="440" x2="852" y2="440" stroke="#374151" stroke-width="1.8" marker-end="url(#ah-ink)"/>
  <text x="102" y="44" font-size="15" font-weight="700" fill="#1f2937" text-anchor="end">cwnd</text>
  <text x="852" y="468" font-size="15" font-weight="700" fill="#1f2937" text-anchor="end">시간 (RTT)</text>
  <line x1="106" y1="422.5" x2="112" y2="422.5" stroke="#374151" stroke-width="1.5"/>
  <text x="102" y="428" font-size="15" fill="#4b5563" text-anchor="end">초기 cwnd</text>
  <path d="M167,440 v6 M222,440 v6 M277,440 v6 M332,440 v6 M387,440 v6 M442,440 v6 M497,440 v6 M552,440 v6 M607,440 v6 M662,440 v6 M717,440 v6 M772,440 v6 M827,440 v6" stroke="#6b7280" stroke-width="1.5" fill="none"/>

  <!-- 타임아웃 경로 (점선) -->
  <line x1="552" y1="160" x2="606" y2="418" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-gray)"/>
  <polyline points="607,422.5 618,419.9 629,416.9 640,413.5 651,409.5 662,405.0 673,399.8 684,393.8 695,386.9 706,379.1 717,370.0 728,359.6 739,347.6 750,333.9 761,318.1 772,300.0 812,279.6" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.8">
    <circle cx="607" cy="422.5" r="4"/>
    <circle cx="662" cy="405" r="4"/>
    <circle cx="717" cy="370" r="4"/>
    <circle cx="772" cy="300" r="4"/>
  </g>
  <text x="610" y="334" font-size="15" fill="#4b5563">타임아웃(RTO) 시</text>
  <text x="610" y="354" font-size="15" fill="#4b5563">cwnd 1로 리셋</text>

  <!-- 주 경로 (실선) -->
  <polyline points="112,422.5 123,419.9 134,416.9 145,413.5 156,409.5 167,405.0 178,399.8 189,393.8 200,386.9 211,379.1 222,370.0 233,359.6 244,347.6 255,333.9 266,318.1 277,300.0 552,160" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
  <line x1="552" y1="300" x2="812" y2="167.6" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="552" y1="168" x2="552" y2="294" stroke="#b91c1c" stroke-width="3" marker-end="url(#ah-red)"/>
  <g fill="#1d4ed8">
    <circle cx="112" cy="422.5" r="4.5"/>
    <circle cx="167" cy="405" r="4.5"/>
    <circle cx="222" cy="370" r="4.5"/>
    <circle cx="277" cy="300" r="4.5"/>
    <circle cx="332" cy="272" r="4.5"/>
    <circle cx="387" cy="244" r="4.5"/>
    <circle cx="442" cy="216" r="4.5"/>
    <circle cx="497" cy="188" r="4.5"/>
    <circle cx="552" cy="300" r="4.5"/>
    <circle cx="607" cy="272" r="4.5"/>
    <circle cx="662" cy="244" r="4.5"/>
    <circle cx="717" cy="216" r="4.5"/>
    <circle cx="772" cy="188" r="4.5"/>
  </g>
  <circle cx="552" cy="160" r="6.5" fill="#b91c1c"/>
  <text x="566" y="156" font-size="16" font-weight="700" fill="#b91c1c">유실 감지</text>
  <text x="540" y="250" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="end">절반으로 감소</text>
  <text x="540" y="271" font-size="15" fill="#b91c1c" text-anchor="end">중복 ACK 3회</text>

  <!-- 범례 -->
  <line x1="40" y1="500" x2="80" y2="500" stroke="#1d4ed8" stroke-width="3"/>
  <text x="92" y="505" font-size="15" fill="#1f2937">중복 ACK 3회로 유실 감지 → 절반으로 감소, 곧바로 선형 증가 (Fast Recovery)</text>
  <line x1="40" y1="528" x2="80" y2="528" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="92" y="533" font-size="15" fill="#1f2937">타임아웃(RTO)으로 유실 감지 → cwnd 1로 리셋, Slow Start부터 다시</text>

  <!-- AIMD -->
  <rect x="24" y="556" width="832" height="64" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="582" font-size="16" font-weight="700" fill="#111827">AIMD — 천천히 올리고 급히 내린다 → 여러 연결이 대역폭을 공평하게 나눠 가짐</text>
  <text x="44" y="606" font-size="15" fill="#374151">선형 증가(Additive Increase) + 곱셈 감소(Multiplicative Decrease)</text>
</svg>
