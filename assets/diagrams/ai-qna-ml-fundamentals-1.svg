<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">모델 복잡도에 따른 학습·검증 오차</title>
  <desc id="d">모델 복잡도나 학습량이 늘면 학습 오차는 계속 줄지만 검증 오차는 적정 지점(검증 오차 최소)을 지나 다시 커진다. 적정 지점 왼쪽은 과소적합, 오른쪽은 과적합 구간이다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 구간 음영 -->
  <rect x="92" y="60" width="288" height="358" fill="#fffbeb"/>
  <rect x="380" y="60" width="380" height="358" fill="#fef2f2"/>

  <!-- 구간 머리글 -->
  <text x="236" y="90" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">과소적합 구간</text>
  <text x="236" y="112" font-size="15" fill="#4b5563" text-anchor="middle">학습·검증 오차 모두 높음</text>
  <text x="575" y="90" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">과적합 구간</text>
  <text x="575" y="112" font-size="15" fill="#4b5563" text-anchor="middle">검증 오차 다시 증가</text>

  <!-- 축 -->
  <path d="M 90 64 L 90 420 L 764 420" stroke="#374151" stroke-width="2" fill="none" marker-start="url(#ax)" marker-end="url(#ax)"/>
  <text x="90" y="46" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">오차</text>
  <text x="764" y="450" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">모델 복잡도/학습량</text>

  <!-- 적정 지점 -->
  <path d="M 380 60 L 380 418" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>

  <!-- 곡선 -->
  <path d="M 110 150 C 190 310, 340 365, 730 385" stroke="#1d4ed8" stroke-width="3.5" fill="none"/>
  <path d="M 110 130 C 200 250, 300 262, 380 262 C 470 262, 600 195, 730 105" stroke="#b91c1c" stroke-width="3.5" fill="none"/>
  <circle cx="380" cy="262" r="6" fill="#047857" stroke="#ffffff" stroke-width="2"/>

  <!-- 곡선 이름표 -->
  <text x="742" y="112" font-size="16" font-weight="bold" fill="#b91c1c">검증 오차</text>
  <text x="742" y="382" font-size="16" font-weight="bold" fill="#1d4ed8">학습 오차</text>
  <text x="742" y="402" font-size="15" fill="#1d4ed8">(계속 감소)</text>

  <!-- 격차 -->
  <path d="M 694 138 L 706 138 M 700 138 L 700 372 M 694 372 L 706 372" stroke="#374151" stroke-width="1.5" fill="none"/>
  <text x="688" y="262" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">학습·검증 오차 격차</text>
  <text x="688" y="284" font-size="15" fill="#4b5563" text-anchor="end">(generalization gap)</text>

  <!-- 적정 지점 라벨 -->
  <text x="380" y="450" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">적정 지점</text>
  <text x="380" y="472" font-size="15" fill="#047857" text-anchor="middle">(검증 오차 최소)</text>
</svg>
