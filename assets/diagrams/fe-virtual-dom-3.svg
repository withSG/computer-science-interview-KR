<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Virtual DOM이 담당하는 구간</title>
  <desc id="d">상태 변경 뒤 렌더, 비교, 커밋, 레이아웃, 페인트로 이어지는 흐름에서 렌더는 내 코드(느리면 그대로 느림), 비교와 커밋은 Virtual DOM 담당, 레이아웃과 페인트는 브라우저 담당임을 보여 준다.</desc>
  <rect width="880" height="270" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 담당 구간 띠 -->
  <rect x="152" y="64" width="124" height="182" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="292" y="64" width="264" height="182" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="572" y="64" width="264" height="182" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="424" y="48" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Virtual DOM이 담당하는 구간</text>

  <!-- 흐름 -->
  <rect x="24" y="84" width="100" height="52" rx="26" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="74" y="116" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">상태 변경</text>
  <line x1="124" y1="110" x2="161" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="164" y="84" width="100" height="52" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="214" y="116" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">렌더</text>
  <line x1="264" y1="110" x2="301" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="304" y="84" width="100" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="354" y="116" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">비교</text>
  <line x1="404" y1="110" x2="441" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="444" y="84" width="100" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="494" y="116" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">커밋</text>
  <line x1="544" y1="110" x2="581" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="584" y="84" width="100" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="634" y="116" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">레이아웃</text>
  <line x1="684" y1="110" x2="721" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="724" y="84" width="100" height="52" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="774" y="116" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">페인트</text>

  <!-- 담당 표시 -->
  <text x="214" y="176" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">내 코드</text>
  <text x="214" y="202" font-size="15" fill="#92400e" text-anchor="middle">(느리면</text>
  <text x="214" y="224" font-size="15" fill="#92400e" text-anchor="middle">그대로 느림)</text>

  <text x="424" y="176" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VDOM 담당</text>

  <text x="704" y="176" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">브라우저</text>
</svg>
