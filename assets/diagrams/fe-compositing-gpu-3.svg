<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스레드 관점</title>
  <desc id="d">메인 스레드, 합성 스레드, GPU의 역할 분담을 나타낸 스레드 관점 다이어그램</desc>
  
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <text x="30" y="45" font-size="16" font-weight="bold" fill="#1f2933">스레드 관점</text>

  <rect x="30" y="75" width="260" height="40" fill="#eff6ff" rx="4" ry="4"/>
  <rect x="30" y="75" width="260" height="40" stroke="#2563eb" stroke-width="1.5" fill="none" rx="4" ry="4"/>
  <text x="160" y="100" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">메인 스레드</text>

  <rect x="310" y="75" width="260" height="40" fill="#ecfdf5" rx="4" ry="4"/>
  <rect x="310" y="75" width="260" height="40" stroke="#059669" stroke-width="1.5" fill="none" rx="4" ry="4"/>
  <text x="440" y="100" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">합성 스레드</text>

  <rect x="590" y="75" width="260" height="40" fill="#f5f3ff" rx="4" ry="4"/>
  <rect x="590" y="75" width="260" height="40" stroke="#7c3aed" stroke-width="1.5" fill="none" rx="4" ry="4"/>
  <text x="720" y="100" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">GPU</text>

  <line x1="300" y1="75" x2="300" y2="350" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="580" y1="75" x2="580" y2="350" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <line x1="30" y1="125" x2="850" y2="125" stroke="#9aa5b1" stroke-width="1.5"/>

  <rect x="45" y="145" width="230" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="160" y="168" font-size="13" fill="#1f2933" text-anchor="middle">JS 실행</text>

  <rect x="45" y="195" width="230" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="160" y="218" font-size="13" fill="#1f2933" text-anchor="middle">스타일 계산</text>

  <rect x="45" y="245" width="230" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="160" y="268" font-size="13" fill="#1f2933" text-anchor="middle">레이아웃</text>

  <rect x="45" y="295" width="230" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="160" y="318" font-size="13" fill="#1f2933" text-anchor="middle">페인트 기록</text>

  <rect x="325" y="145" width="230" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="440" y="168" font-size="13" fill="#1f2933" text-anchor="middle">스크롤 처리</text>

  <rect x="325" y="195" width="230" height="56" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="440" y="218" font-size="13" fill="#1f2933" text-anchor="middle">합성된 transform/opacity</text>
  <text x="440" y="238" font-size="13" fill="#1f2933" text-anchor="middle">애니메이션 진행</text>

  <rect x="325" y="265" width="230" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="440" y="288" font-size="13" fill="#1f2933" text-anchor="middle">레이어 트리 관리</text>

  <rect x="605" y="145" width="230" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="720" y="168" font-size="13" fill="#1f2933" text-anchor="middle">텍스처 합성</text>

  <rect x="605" y="195" width="230" height="36" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="4"/>
  <text x="720" y="218" font-size="13" fill="#1f2933" text-anchor="middle">래스터 일부</text>

