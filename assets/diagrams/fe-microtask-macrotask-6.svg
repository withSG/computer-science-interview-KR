<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">마이크로태스크 기아</title>
  <desc id="d">starve가 실행될 때마다 queueMicrotask(starve)로 마이크로태스크 큐가 계속 채워져 비지 않으므로, 매크로태스크 큐의 클릭·타이머는 영원히 대기하고 매크로태스크 큐와 렌더링 모두 도달 불가가 된다.</desc>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- 마이크로태스크 큐 -->
  <rect x="24" y="40" width="426" height="190" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="44" y="72" font-size="17" font-weight="bold" fill="#4c1d95">마이크로태스크 큐</text>

  <path d="M79,148 C79,112 298,112 298,146" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <text x="188" y="108" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">queueMicrotask(starve)</text>

  <g font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <rect x="44" y="150" width="70" height="34" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="79" y="172">starve</text>
    <rect x="122" y="150" width="70" height="34" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="157" y="172">starve</text>
    <rect x="200" y="150" width="70" height="34" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="235" y="172">starve</text>
    <rect x="278" y="150" width="40" height="34" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="298" y="172">...</text>
  </g>
  <text x="330" y="172" font-size="15" font-weight="bold" fill="#6d28d9">← 계속 채워짐</text>
  <text x="44" y="214" font-size="15" fill="#374151">처리 중에 계속 새로 들어와 영원히 비지 않음</text>

  <!-- 막힌 경로 -->
  <path d="M452,85 H566" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)"/>
  <path d="M502,77 L518,93 M518,77 L502,93" stroke="#b91c1c" stroke-width="3" fill="none"/>
  <text x="510" y="67" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">도달 불가</text>

  <path d="M452,198 H566" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)"/>
  <path d="M502,190 L518,206 M518,190 L502,206" stroke="#b91c1c" stroke-width="3" fill="none"/>
  <text x="510" y="180" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">도달 불가</text>

  <!-- 매크로태스크 큐 -->
  <rect x="570" y="40" width="286" height="90" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="590" y="68" font-size="16" font-weight="bold" fill="#111827">매크로태스크 큐</text>
  <rect x="746" y="50" width="96" height="26" rx="13" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="794" y="68" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">영원히 대기</text>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <rect x="590" y="86" width="56" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="618" y="106">클릭</text>
    <rect x="654" y="86" width="70" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="689" y="106">타이머</text>
    <rect x="732" y="86" width="44" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="754" y="106">...</text>
  </g>

  <!-- 렌더링 -->
  <rect x="570" y="166" width="286" height="64" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="590" y="204" font-size="16" font-weight="bold" fill="#111827">렌더링</text>

  <!-- 캡션 -->
  <text x="24" y="272" font-size="15" font-weight="bold" fill="#111827">마이크로태스크 큐가 비워질 때까지 매크로태스크 및 렌더링으로 진행하지 못함</text>
</svg>
