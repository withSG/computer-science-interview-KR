<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">변수 환경은 왜 따로 있나</title>
  <desc id="d">함수 진입 시와 블록 진입 시 LexicalEnv와 VariableEnv가 환경 레코드를 참조하는 구조를 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 제목 -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">3-2. 변수 환경은 왜 따로 있나</text>

  <!-- 영역 분할 구역 -->
  <!-- Left Side: 함수 진입 시 -->
  <rect x="24" y="60" width="390" height="250" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="44" y="92" font-size="14" font-weight="bold" fill="#52606d">함수 진입 시</text>

  <!-- Left Labels -->
  <rect x="44" y="120" width="130" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="109" y="144.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">LexicalEnv</text>

  <rect x="44" y="210" width="130" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="109" y="234.5" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">VariableEnv</text>

  <!-- Left Record Box -->
  <rect x="230" y="160" width="160" height="50" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="310" y="189.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[함수 레코드]</text>

  <!-- Left Connectors -->
  <!-- LexicalEnv -> [함수 레코드] -->
  <path d="M174,140 L200,140 L200,185 L221,185" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <!-- VariableEnv -> [함수 레코드] -->
  <path d="M174,230 L200,230 L200,185 L221,185" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>


  <!-- Right Side: 블록 진입 시 -->
  <rect x="440" y="60" width="416" height="250" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="460" y="92" font-size="14" font-weight="bold" fill="#52606d">블록 진입 시</text>

  <!-- Right Labels -->
  <rect x="460" y="120" width="120" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="144.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">LexicalEnv</text>

  <rect x="460" y="220" width="120" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="520" y="244.5" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">VariableEnv</text>

  <!-- Right Record Boxes -->
  <rect x="610" y="120" width="160" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="690" y="144.5" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[블록 레코드 { l: 2 }]</text>

  <rect x="610" y="220" width="220" height="40" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="720" y="244.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[함수 레코드 { v: 2, l: 1 }]</text>

  <!-- Right Connectors -->
  <!-- LexicalEnv -> [블록 레코드 { l: 2 }] -->
  <path d="M580,140 L601,140" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- VariableEnv -> [함수 레코드 { v: 2, l: 1 }] -->
  <path d="M580,240 L601,240" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>

  <!-- outer arrow from Block Record to Function Record -->
  <path d="M770,140 L800,140 L800,231" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="764" y="168" width="36" height="20" fill="#ffffff"/>
  <text x="782" y="182" font-size="11.5" font-weight="bold" fill="#52606d" text-anchor="middle">outer</text>
</svg>