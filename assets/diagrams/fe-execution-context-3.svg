<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">함수 진입과 블록 진입</title>
  <desc id="d">함수 진입 시에는 LexicalEnv와 VariableEnv가 같은 함수 레코드를 가리킨다. 블록 진입 시에는 LexicalEnv만 블록 레코드 { l: 2 }로 바뀌고 그 outer가 함수 레코드 { v: 2, l: 1 }을 가리키며, VariableEnv는 함수 레코드를 그대로 가리킨다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- ① 함수 진입 시 -->
  <rect x="24" y="24" width="832" height="184" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="56" font-size="18" font-weight="bold" fill="#111827">① 함수 진입 시</text>

  <rect x="64" y="76" width="180" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="154" y="104" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">LexicalEnv</text>
  <rect x="64" y="144" width="180" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="154" y="172" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">VariableEnv</text>

  <line x1="244" y1="98" x2="336" y2="122" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="244" y1="166" x2="336" y2="142" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <rect x="340" y="108" width="200" height="48" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="138" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">함수 레코드</text>
  <text x="572" y="138" font-size="16" fill="#374151">← 둘 다 같은 환경 레코드를 가리킴</text>

  <!-- ② 블록 진입 시 -->
  <rect x="24" y="228" width="832" height="218" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="260" font-size="18" font-weight="bold" fill="#111827">② 블록 진입 시</text>

  <rect x="64" y="280" width="180" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="154" y="308" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">LexicalEnv</text>
  <line x1="244" y1="302" x2="296" y2="302" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="300" y="278" width="260" height="48" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="430" y="308" text-anchor="middle" fill="#92400e"><tspan font-size="17" font-weight="bold">블록 레코드</tspan><tspan dx="10" font-size="17" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ l: 2 }</tspan></text>
  <text x="588" y="308" font-size="16" fill="#1d4ed8">← 새 렉시컬 환경으로 갈아 끼움</text>

  <line x1="430" y1="326" x2="430" y2="372" stroke="#334155" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="442" y="355" font-size="15" font-weight="bold" fill="#334155">outer</text>

  <rect x="64" y="378" width="180" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="154" y="406" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">VariableEnv</text>
  <line x1="244" y1="400" x2="296" y2="400" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <rect x="300" y="376" width="300" height="48" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="406" text-anchor="middle" fill="#111827"><tspan font-size="17" font-weight="bold">함수 레코드</tspan><tspan dx="10" font-size="17" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{ v: 2, l: 1 }</tspan></text>
  <text x="628" y="406" font-size="16" fill="#047857">← 변수 환경은 그대로 유지</text>
</svg>
