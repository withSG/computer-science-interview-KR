<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 필요한가</title>
  <desc id="d">일반 실행과 SUID 실행 시 프로세스 권한 및 /etc/shadow 접근 허용/거부 차이를 설명하는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Left Header -->
  <text x="40" y="38.6" font-size="14" font-weight="bold" fill="#1f2933">일반 실행:</text>

  <!-- Left Box 1: user: alice -->
  <rect x="40" y="55" width="220" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="150" y="77.55" font-size="13" fill="#1f2933" text-anchor="middle">user: alice</text>

  <!-- Left Arrow 1 -->
  <path d="M150,91 L150,133" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="131" y="103" width="38" height="18" fill="#ffffff"/>
  <text x="150" y="116.025" font-size="11.5" fill="#52606d" text-anchor="middle">실행</text>

  <!-- Left Box 2: 프로세스 / 실효UID=alice -->
  <rect x="40" y="135" width="220" height="56" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="150" y="157.55" font-size="13" fill="#1f2933" text-anchor="middle">프로세스</text>
  <text x="150" y="177.55" font-size="13" fill="#1f2933" text-anchor="middle">실효UID=alice</text>

  <!-- Left Arrow 2 -->
  <path d="M150,191 L150,263" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>

  <!-- Left Target: /etc/shadow ✗ 거부 -->
  <rect x="40" y="265" width="100" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="90" y="287.55" font-size="13" fill="#dc2626" text-anchor="middle">/etc/shadow</text>
  <text x="155" y="287.55" font-size="13" font-weight="bold" fill="#dc2626">✗ 거부</text>

  <!-- Right Header -->
  <text x="440" y="38.6" font-size="14" font-weight="bold" fill="#1f2933">SUID 실행 (/usr/bin/passwd):</text>

  <!-- Right Box 1: user: alice -->
  <rect x="440" y="55" width="220" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="550" y="77.55" font-size="13" fill="#1f2933" text-anchor="middle">user: alice</text>

  <!-- Right Arrow 1 -->
  <path d="M550,91 L550,133" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="531" y="103" width="38" height="18" fill="#ffffff"/>
  <text x="550" y="116.025" font-size="11.5" fill="#52606d" text-anchor="middle">실행</text>

  <!-- Right Box 2: 프로세스 / 실효UID=root -->
  <rect x="440" y="135" width="220" height="56" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="157.55" font-size="13" fill="#1f2933" text-anchor="middle">프로세스</text>
  <text x="550" y="177.55" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">실효UID=root</text>

  <!-- SUID Annotation -->
  <path d="M660,163 L672,163" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="680" y="167.55" font-size="13" fill="#059669">← 파일 소유자로 승격</text>

  <!-- Right Arrow 2 -->
  <path d="M550,191 L550,263" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Right Target: /etc/shadow ✓ 허용 -->
  <rect x="440" y="265" width="100" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="490" y="287.55" font-size="13" fill="#059669" text-anchor="middle">/etc/shadow</text>
  <text x="555" y="287.55" font-size="13" font-weight="bold" fill="#059669">✓ 허용</text>
</svg>