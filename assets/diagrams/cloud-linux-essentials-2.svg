<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">일반 실행과 SUID 실행의 권한 차이</title>
  <desc id="d">같은 사용자 alice가 실행해도, 일반 실행에서는 프로세스의 실효UID가 alice라 /etc/shadow 접근이 거부되고, SUID가 붙은 /usr/bin/passwd를 실행하면 실효UID가 파일 소유자인 root로 승격되어 접근이 허용된다.</desc>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 가운데 구분선 -->
  <line x1="320" y1="24" x2="320" y2="366" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ===== 왼쪽: 일반 실행 ===== -->
  <text x="160" y="46" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">일반 실행</text>

  <rect x="40" y="68" width="240" height="46" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="97" font-size="16" fill="#111827" text-anchor="middle">user: alice</text>

  <line x1="160" y1="114" x2="160" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#m-ink)"/>
  <text x="174" y="143" font-size="15" fill="#374151">실행</text>

  <rect x="40" y="164" width="240" height="76" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="194" font-size="16" fill="#111827" text-anchor="middle">프로세스</text>
  <text x="160" y="222" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">실효UID=alice</text>

  <line x1="160" y1="240" x2="160" y2="290" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-red)"/>
  <text x="176" y="271" font-size="16" font-weight="bold" fill="#b91c1c">✗ 거부</text>

  <rect x="40" y="294" width="240" height="64" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="160" y="321" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/etc/shadow</text>
  <text x="160" y="345" font-size="15" fill="#4b5563" text-anchor="middle">root만 쓰기 가능</text>

  <!-- ===== 오른쪽: SUID 실행 ===== -->
  <text x="480" y="46" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">SUID 실행 <tspan font-size="16" font-weight="normal" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(/usr/bin/passwd)</tspan></text>

  <rect x="360" y="68" width="240" height="46" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="480" y="97" font-size="16" fill="#111827" text-anchor="middle">user: alice</text>

  <line x1="480" y1="114" x2="480" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#m-ink)"/>
  <text x="494" y="143" font-size="15" fill="#374151">실행</text>

  <rect x="360" y="164" width="240" height="76" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="480" y="194" font-size="16" fill="#111827" text-anchor="middle">프로세스</text>
  <text x="480" y="222" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">실효UID=root</text>

  <!-- 승격 설명 -->
  <line x1="648" y1="216" x2="606" y2="216" stroke="#047857" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="656" y="221" font-size="15" font-weight="bold" fill="#047857">파일 소유자(root)로 승격</text>

  <line x1="480" y1="240" x2="480" y2="290" stroke="#047857" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="496" y="271" font-size="16" font-weight="bold" fill="#047857">✓ 허용</text>

  <rect x="360" y="294" width="240" height="64" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="480" y="321" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">/etc/shadow</text>
  <text x="480" y="345" font-size="15" fill="#4b5563" text-anchor="middle">root만 쓰기 가능</text>
</svg>
