<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SSR 렌더링 흐름</title>
  <desc id="d">SSR은 브라우저 요청을 받은 서버가 HTML을 생성하고, 완성된 HTML을 전송한 뒤 브라우저에서 하이드레이션한다. 매 요청마다 서버에서 생성한다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 레인: 브라우저 -->
  <rect x="24" y="24" width="832" height="120" rx="10" fill="#f1f5f9"/>
  <path d="M34,24 H124 V144 H34 A10,10 0 0 1 24,134 V34 A10,10 0 0 1 34,24 Z" fill="#e2e8f0"/>
  <text x="74" y="90" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">브라우저</text>

  <!-- 레인: 서버 -->
  <rect x="24" y="156" width="832" height="120" rx="10" fill="#eef2ff"/>
  <path d="M34,156 H124 V276 H34 A10,10 0 0 1 24,266 V166 A10,10 0 0 1 34,156 Z" fill="#e0e7ff"/>
  <text x="74" y="222" font-size="16" font-weight="700" fill="#3730a3" text-anchor="middle">서버</text>

  <!-- 화살표 -->
  <path d="M296,84 H400 V174" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M480,216 H500" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M584,178 V84 H684" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 1. 브라우저 요청 -->
  <rect x="140" y="50" width="152" height="68" rx="34" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="90" font-size="16" fill="#1f2937" text-anchor="middle">브라우저 요청</text>

  <!-- 2. 서버에서 HTML 생성 (핵심) -->
  <rect x="324" y="182" width="152" height="68" rx="8" fill="#4338ca" stroke="#312e81" stroke-width="2"/>
  <text x="400" y="213" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <tspan x="400">서버에서</tspan>
    <tspan x="400" dy="22">HTML 생성</tspan>
  </text>

  <!-- 3. 완성된 HTML 전송 -->
  <rect x="508" y="182" width="152" height="68" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="584" y="213" font-size="16" fill="#1f2937" text-anchor="middle">
    <tspan x="584">완성된</tspan>
    <tspan x="584" dy="22">HTML 전송</tspan>
  </text>

  <!-- 4. 하이드레이션 -->
  <rect x="692" y="50" width="152" height="68" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="768" y="90" font-size="16" fill="#1f2937" text-anchor="middle">하이드레이션</text>

  <!-- 단계 번호 -->
  <circle cx="170" cy="50" r="12" fill="#475569" stroke="#ffffff" stroke-width="2"/>
  <text x="170" y="55" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="350" cy="182" r="12" fill="#1e1b4b" stroke="#ffffff" stroke-width="2"/>
  <text x="350" y="187" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="534" cy="182" r="12" fill="#475569" stroke="#ffffff" stroke-width="2"/>
  <text x="534" y="187" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="718" cy="50" r="12" fill="#475569" stroke="#ffffff" stroke-width="2"/>
  <text x="718" y="55" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 요약 캡션 -->
  <line x1="24" y1="298" x2="856" y2="298" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="326" font-size="15" fill="#374151" text-anchor="middle">렌더링 시점: 런타임 (요청 시)<tspan dx="12">·</tspan><tspan dx="12">HTML 생성 위치: 서버</tspan><tspan dx="12">·</tspan><tspan dx="12" font-weight="700" fill="#3730a3">매 요청마다 서버에서 생성</tspan></text>
</svg>
