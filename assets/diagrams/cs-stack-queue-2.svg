<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실제 사용처 - 콜 스택</title>
  <desc id="d">함수 호출(main, f, g) 과정에서 콜 스택에 프레임이 쌓이고 반환되는 과정을 보여주는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Step 1: main 실행 -->
  <text x="110" y="45" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">main 실행</text>
  <rect x="30" y="60" width="160" height="200" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="40" y="200" width="140" height="50" rx="3" ry="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="230" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">main 프레임</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M190,160 L220,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="193" y="137" width="24" height="16" fill="#ffffff"/>
  <text x="205" y="149" font-size="11.5" fill="#2563eb" text-anchor="middle">호출</text>

  <!-- Step 2: f() 호출 -->
  <text x="330" y="45" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">f() 호출</text>
  <rect x="250" y="60" width="160" height="200" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="260" y="145" width="140" height="50" rx="3" ry="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="330" y="175" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">f 프레임</text>
  <rect x="260" y="200" width="140" height="50" rx="3" ry="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="230" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">main 프레임</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M410,160 L440,160" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="413" y="137" width="24" height="16" fill="#ffffff"/>
  <text x="425" y="149" font-size="11.5" fill="#7c3aed" text-anchor="middle">호출</text>

  <!-- Step 3: g() 호출 -->
  <text x="550" y="45" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">g() 호출</text>
  <rect x="470" y="60" width="160" height="200" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="480" y="90" width="140" height="50" rx="3" ry="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="550" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">g 프레임</text>
  <rect x="480" y="145" width="140" height="50" rx="3" ry="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="550" y="175" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">f 프레임</text>
  <rect x="480" y="200" width="140" height="50" rx="3" ry="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="230" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">main 프레임</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M630,160 L660,160" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>
  <rect x="633" y="137" width="24" height="16" fill="#ffffff"/>
  <text x="645" y="149" font-size="11.5" fill="#52606d" text-anchor="middle">반환</text>

  <!-- Step 4: g 반환 -->
  <text x="770" y="45" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">g 반환</text>
  <rect x="690" y="60" width="160" height="200" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="700" y="145" width="140" height="50" rx="3" ry="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="770" y="175" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">f 프레임</text>
  <rect x="700" y="200" width="140" height="50" rx="3" ry="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="770" y="230" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">main 프레임</text>

  <!-- Ground Line / Legend -->
  <line x1="30" y1="290" x2="850" y2="290" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="315" font-size="11" fill="#52606d" text-anchor="middle">콜 스택(Call Stack)의 LIFO(Last-In, First-Out) 동작 구조</text>
</svg>