<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">콜 스택의 프레임 변화</title>
  <desc id="d">main 실행, f() 호출, g() 호출, g 반환의 네 단계에서 콜 스택에 스택 프레임이 쌓이고 걷히는 모습. 호출하면 프레임이 맨 위에 쌓이고, 반환하면 맨 위의 g 프레임이 걷혀 f 프레임과 main 프레임이 남는다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ① main 실행 : x=26..176 -->
  <circle cx="38" cy="42" r="12" fill="#1f2937"/>
  <text x="38" y="47.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="58" y="48" font-size="17" font-weight="bold" fill="#111827">main 실행</text>
  <rect x="26" y="70" width="150" height="180" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="38" y="192" width="126" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="101" y="221" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">main 프레임</text>

  <!-- 호출 화살표 1 -->
  <text x="214" y="150" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">호출</text>
  <line x1="188" y1="160" x2="240" y2="160" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="214" y="184" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">push</text>

  <!-- ② f() 호출 : x=252..402 -->
  <circle cx="264" cy="42" r="12" fill="#1f2937"/>
  <text x="264" y="47.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="284" y="48" font-size="17" font-weight="bold" fill="#111827">f() 호출</text>
  <rect x="252" y="70" width="150" height="180" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="264" y="140" width="126" height="46" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="327" y="169" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">f 프레임</text>
  <rect x="264" y="192" width="126" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="327" y="221" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">main 프레임</text>

  <!-- 호출 화살표 2 -->
  <text x="440" y="150" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">호출</text>
  <line x1="414" y1="160" x2="466" y2="160" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="440" y="184" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">push</text>

  <!-- ③ g() 호출 : x=478..628 -->
  <circle cx="490" cy="42" r="12" fill="#1f2937"/>
  <text x="490" y="47.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="510" y="48" font-size="17" font-weight="bold" fill="#111827">g() 호출</text>
  <rect x="478" y="70" width="150" height="180" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="490" y="88" width="126" height="46" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="553" y="117" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">g 프레임</text>
  <rect x="490" y="140" width="126" height="46" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="553" y="169" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">f 프레임</text>
  <rect x="490" y="192" width="126" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="553" y="221" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">main 프레임</text>

  <!-- 반환 화살표 -->
  <text x="666" y="150" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">반환</text>
  <line x1="640" y1="160" x2="692" y2="160" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <text x="666" y="184" font-size="15" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">pop</text>

  <!-- ④ g 반환 : x=704..854 -->
  <circle cx="716" cy="42" r="12" fill="#1f2937"/>
  <text x="716" y="47.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="736" y="48" font-size="17" font-weight="bold" fill="#111827">g 반환</text>
  <rect x="704" y="70" width="150" height="180" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="716" y="88" width="126" height="46" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="779" y="116" font-size="15" fill="#b91c1c" text-anchor="middle">g 프레임 걷힘</text>
  <rect x="716" y="140" width="126" height="46" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="779" y="169" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">f 프레임</text>
  <rect x="716" y="192" width="126" height="46" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="779" y="221" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">main 프레임</text>

  <!-- 요점 -->
  <rect x="26" y="280" width="828" height="42" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="440" y="306.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">호출 = 맨 위에 프레임 push, 반환 = 맨 위 프레임 pop → 나중에 호출된 g가 먼저 끝난다</text>
</svg>
