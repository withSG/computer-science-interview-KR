<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">임계 구역 문제의 코드 구조</title>
  <desc id="d">진입 구역에서 들어가도 되는지 확인하고 표시한 뒤 임계 구역에서 공유 자원에 접근하고, 퇴출 구역에서 나왔다고 표시한 다음 나머지 구역을 거쳐 다시 진입 구역으로 돌아가는 반복 구조.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <g transform="translate(14,0)">

  <!-- 반복 루프 -->
  <path d="M168,330 H132 V62 H164" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="122" y="202" font-size="17" font-weight="700" fill="#374151" text-anchor="end">반복</text>

  <!-- 1 진입 -->
  <rect x="170" y="34" width="340" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="340" y="68" font-size="17" fill="#1e3a8a" text-anchor="middle"><tspan font-weight="700">진입 구역</tspan> (entry)</text>
  <line x1="546" y1="62" x2="520" y2="62" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arB)"/>
  <text x="554" y="67" font-size="15" fill="#1d4ed8">들어가도 되는지 확인하고 표시</text>

  <line x1="340" y1="92" x2="340" y2="120" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2 임계 -->
  <rect x="170" y="124" width="340" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="340" y="158" font-size="17" fill="#991b1b" text-anchor="middle"><tspan font-weight="700">임계 구역</tspan> (critical section)</text>
  <line x1="546" y1="152" x2="520" y2="152" stroke="#b91c1c" stroke-width="2" marker-end="url(#arR)"/>
  <text x="554" y="157" font-size="15" font-weight="700" fill="#b91c1c">공유 자원 접근</text>

  <line x1="340" y1="182" x2="340" y2="210" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3 퇴출 -->
  <rect x="170" y="214" width="340" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="340" y="248" font-size="17" fill="#1e3a8a" text-anchor="middle"><tspan font-weight="700">퇴출 구역</tspan> (exit)</text>
  <line x1="546" y1="242" x2="520" y2="242" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arB)"/>
  <text x="554" y="247" font-size="15" fill="#1d4ed8">나왔다고 표시</text>

  <line x1="340" y1="272" x2="340" y2="300" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 나머지 -->
  <rect x="170" y="304" width="340" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="340" y="338" font-size="17" fill="#374151" text-anchor="middle"><tspan font-weight="700">나머지 구역</tspan> (remainder)</text>
  </g>
</svg>
