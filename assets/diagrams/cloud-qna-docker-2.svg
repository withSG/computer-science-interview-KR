<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이미지 레이어 구조</title>
  <desc id="d">Docker 이미지의 Layer 1, Layer 2, Layer 3 구조를 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Layer 3 (Top) -->
  <rect x="240" y="60" width="400" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4" ry="4"/>
  <text x="440" y="96" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Layer 3: COPY app.py</text>

  <!-- Layer 2 (Middle) -->
  <rect x="240" y="130" width="400" height="60" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="4" ry="4"/>
  <text x="440" y="166" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Layer 2: apt-get</text>

  <!-- Layer 1 (Bottom) -->
  <rect x="240" y="200" width="400" height="60" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" rx="4" ry="4"/>
  <text x="440" y="236" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Layer 1: ubuntu</text>
</svg>