<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이미지 레이어 구조</title>
  <desc id="d">Dockerfile 명령 하나가 레이어 하나가 되어 아래부터 쌓입니다. FROM ubuntu:20.04가 Layer 1, RUN apt-get update가 Layer 2, COPY app.py /app/가 Layer 3이고, 이 세 레이어를 쌓은 것이 읽기 전용 이미지입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="224" y="54" font-size="14" fill="#4b5563">레이어</text>
  <text x="566" y="54" font-size="14" fill="#4b5563" text-anchor="middle">Dockerfile 명령</text>

  <!-- Layer 3 (맨 위) -->
  <rect x="200" y="70" width="480" height="72" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="224" y="112" font-size="18" font-weight="bold" fill="#111827">Layer 3: COPY app.py</text>
  <rect x="468" y="88" width="196" height="36" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="566" y="111" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">COPY app.py /app/</text>

  <!-- Layer 2 -->
  <rect x="200" y="152" width="480" height="72" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="224" y="194" font-size="18" font-weight="bold" fill="#111827">Layer 2: apt-get</text>
  <rect x="468" y="170" width="196" height="36" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="566" y="193" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RUN apt-get update</text>

  <!-- Layer 1 (맨 아래) -->
  <rect x="200" y="234" width="480" height="72" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="224" y="276" font-size="18" font-weight="bold" fill="#111827">Layer 1: ubuntu</text>
  <rect x="468" y="252" width="196" height="36" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="566" y="275" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FROM ubuntu:20.04</text>

  <!-- 쌓이는 순서: 아래 → 위 -->
  <line x1="170" y1="302" x2="170" y2="80" stroke="#374151" stroke-width="2" marker-end="url(#up)"/>
  <text x="154" y="182" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">빌드 순서</text>
  <text x="154" y="204" font-size="15" fill="#4b5563" text-anchor="end">Layer 1 → 3</text>

  <!-- 이미지 = 세 레이어 묶음 -->
  <path d="M696,70 Q708,70 708,82 L708,176 Q708,188 718,188 Q708,188 708,200 L708,294 Q708,306 696,306" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="730" y="184" font-size="18" font-weight="bold" fill="#111827">이미지</text>
  <text x="730" y="206" font-size="15" fill="#4b5563">(읽기 전용)</text>
</svg>
