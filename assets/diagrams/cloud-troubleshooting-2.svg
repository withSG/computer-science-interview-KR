<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">진단의 기본 순서</title>
  <desc id="d">get, describe, logs, events, exec 다섯 단계를 순서대로 잇고, 단계마다 실행할 kubectl 명령과 그 단계가 답하는 질문, 확인할 항목을 적었습니다.</desc>
  <rect width="880" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 단계 사이 화살표 (번호 원 사이) -->
  <line x1="52" y1="88" x2="52" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="188" x2="52" y2="240" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="288" x2="52" y2="340" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="52" y1="388" x2="52" y2="440" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ① get -->
  <circle cx="52" cy="64" r="20" fill="#1d4ed8"/>
  <text x="52" y="71" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="88" y="24" width="768" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="108" y="56" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl get pods -o wide</text>
  <text x="108" y="86" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">“무엇이 이상한가”</tspan><tspan> — 상태, RESTARTS, 어느 노드에 있나</tspan></text>

  <!-- ② describe -->
  <circle cx="52" cy="164" r="20" fill="#1d4ed8"/>
  <text x="52" y="171" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="88" y="124" width="768" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="108" y="156" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl describe pod &lt;pod&gt;</text>
  <text x="108" y="186" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">“쿠버네티스는 뭘 하려 했나”</tspan><tspan> — Events, Last State, Exit Code, 마운트 정보</tspan></text>

  <!-- ③ logs -->
  <circle cx="52" cy="264" r="20" fill="#1d4ed8"/>
  <text x="52" y="271" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="88" y="224" width="768" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="108" y="256" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl logs &lt;pod&gt; [--previous]</text>
  <text x="108" y="286" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">“애플리케이션은 뭐라 했나”</tspan><tspan> — 스택트레이스, 기동 로그</tspan></text>

  <!-- ④ events -->
  <circle cx="52" cy="364" r="20" fill="#1d4ed8"/>
  <text x="52" y="371" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="88" y="324" width="768" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="108" y="356" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl get events --sort-by=.lastTimestamp</text>
  <text x="108" y="386" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">“주변에서 무슨 일이 있었나”</tspan><tspan> — 노드 이벤트, 축출, 스케줄 실패</tspan></text>

  <!-- ⑤ exec -->
  <circle cx="52" cy="464" r="20" fill="#1d4ed8"/>
  <text x="52" y="471" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="88" y="424" width="768" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="108" y="456" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl exec -it &lt;pod&gt; -- sh</text>
  <text x="108" y="486" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">“안에서 직접 확인”</tspan><tspan> — DNS, 환경변수, 파일, 네트워크 도달성</tspan></text>
</svg>
