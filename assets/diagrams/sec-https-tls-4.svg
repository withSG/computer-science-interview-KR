<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">중간자 공격은 어떤 조건에서 성립하는가</title>
  <desc id="d">중간자 공격이 성립하기 위한 두 가지 조건과 세부 항목을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="45" font-size="16" font-weight="bold" fill="#1f2933">5. 중간자 공격은 어떤 조건에서 성립하는가</text>

  <!-- Condition 1 Block -->
  <g transform="translate(30, 70)">
    <!-- Header Box -->
    <rect x="0" y="0" width="820" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="20" y="25" font-size="14" font-weight="bold" fill="#2563eb">조건 1. 트래픽 경로 위에 자리를 잡는다</text>

    <!-- Content Box -->
    <rect x="0" y="48" width="820" height="82" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="30" y="78" font-size="13" fill="#1f2933">· 같은 Wi-Fi에서 ARP 스푸핑, 악성 공유기 / 가짜 핫스팟</text>
    <text x="30" y="106" font-size="13" fill="#1f2933">· DNS 하이재킹, ISP·백본 수준의 개입, BGP 하이재킹</text>
  </g>

  <!-- Condition 2 Block -->
  <g transform="translate(30, 220)">
    <!-- Header Box -->
    <rect x="0" y="0" width="820" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="20" y="25" font-size="14" font-weight="bold" fill="#dc2626">조건 2. 서버 신원 검증을 뚫는다</text>
    
    <!-- Arrow annotation -->
    <path d="M 310,20 L 375,20" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <rect x="380" y="8" width="165" height="24" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="462.5" y="24" font-size="12" font-weight="bold" text-anchor="middle" fill="#d97706">여기가 실질적인 관문</text>

    <!-- Content Box -->
    <rect x="0" y="48" width="820" height="180" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    
    <!-- Item 1 -->
    <text x="30" y="78" font-size="13" fill="#1f2933">① 애초에 TLS가 아니다 (평문 HTTP)</text>
    
    <!-- Item 2 -->
    <text x="30" y="108" font-size="13" fill="#1f2933">② 클라이언트가 인증서 검증을 꺼놨다</text>
    
    <!-- Item 3 -->
    <text x="30" y="138" font-size="13" fill="#1f2933">③ 사용자가 브라우저 경고를 무시하고 진행한다</text>
    
    <!-- Item 4 -->
    <text x="30" y="168" font-size="13" fill="#1f2933">④ 공격자가 신뢰받는 인증서를 손에 넣었다</text>
    <text x="48" y="196" font-size="13" fill="#52606d">(CA 침해·오발급, 또는 기기에 루트 CA를 설치)</text>
  </g>
</svg>