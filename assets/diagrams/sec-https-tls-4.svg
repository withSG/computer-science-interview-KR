<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MITM이 성립하는 두 조건</title>
  <desc id="d">중간자 공격은 조건 1(트래픽 경로 위에 자리를 잡는다)과 조건 2(서버 신원 검증을 뚫는다)가 모두 필요하며, 실질적인 관문은 조건 2와 그 네 가지 경우입니다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- ===== 조건 1 ===== -->
  <path d="M32,34 A10,10 0 0 1 42,24 H838 A10,10 0 0 1 848,34 V76 H32 Z" fill="#f1f5f9"/>
  <line x1="32" y1="76" x2="848" y2="76" stroke="#94a3b8" stroke-width="1"/>
  <rect x="32" y="24" width="816" height="140" rx="10" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="52" y="36" width="76" height="28" rx="14" fill="#334155"/>
  <text x="90" y="55" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">조건 1</text>
  <text x="144" y="57" font-size="18" font-weight="bold" fill="#111827">트래픽 경로 위에 자리를 잡는다</text>

  <text x="60" y="112" font-size="16" fill="#111827">· 같은 Wi-Fi에서 ARP 스푸핑, 악성 공유기 / 가짜 핫스팟</text>
  <text x="60" y="144" font-size="16" fill="#111827">· DNS 하이재킹, ISP·백본 수준의 개입, BGP 하이재킹</text>

  <!-- 두 조건 연결 -->
  <line x1="440" y1="164" x2="440" y2="178" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="352" y="178" width="176" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="199" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">두 가지가 모두 필요</text>
  <line x1="440" y1="210" x2="440" y2="224" stroke="#6b7280" stroke-width="1.5"/>

  <!-- ===== 조건 2 ===== -->
  <path d="M32,234 A10,10 0 0 1 42,224 H838 A10,10 0 0 1 848,234 V276 H32 Z" fill="#fef2f2"/>
  <line x1="32" y1="276" x2="848" y2="276" stroke="#fca5a5" stroke-width="1"/>
  <rect x="32" y="224" width="816" height="232" rx="10" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <rect x="52" y="236" width="76" height="28" rx="14" fill="#b91c1c"/>
  <text x="90" y="255" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">조건 2</text>
  <text x="144" y="257" font-size="18" font-weight="bold" fill="#111827">서버 신원 검증을 뚫는다</text>
  <rect x="384" y="236" width="222" height="28" rx="14" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="495" y="255" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">← 여기가 실질적인 관문</text>

  <text x="60" y="312" font-size="16" fill="#111827">① 애초에 TLS가 아니다 (평문 HTTP)</text>
  <text x="60" y="344" font-size="16" fill="#111827">② 클라이언트가 인증서 검증을 꺼놨다</text>
  <text x="60" y="376" font-size="16" fill="#111827">③ 사용자가 브라우저 경고를 무시하고 진행한다</text>
  <text x="60" y="408" font-size="16" fill="#111827">④ 공격자가 신뢰받는 인증서를 손에 넣었다</text>
  <text x="84" y="434" font-size="15" fill="#4b5563">(CA 침해·오발급, 또는 기기에 루트 CA를 설치)</text>
</svg>
