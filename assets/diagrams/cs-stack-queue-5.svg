<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">덱 (Deque, Double-Ended Queue)</title>
  <desc id="d">양쪽 끝에서 모두 요소의 추가와 제거가 가능한 덱 구조를 나타낸 다이어그램</desc>
  <rect width="880" height="260" fill="#ffffff"/>

  <defs>
    <!-- Blue Marker for Add Operations -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <!-- Red Marker for Remove Operations -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Container Box (Deque Outer Shadow / Array Container) -->
  <rect x="280" y="80" width="320" height="80" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>

  <!-- Cells (A, B, C, D) -->
  <rect x="290" y="90" width="70" height="60" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="325" y="129" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text>

  <rect x="360" y="90" width="70" height="60" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="395" y="129" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>

  <rect x="430" y="90" width="70" height="60" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="465" y="129" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>

  <rect x="500" y="90" width="70" height="60" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="535" y="129" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">D</text>

  <!-- Top-Left: addFirst ─▶ -->
  <text x="210" y="104" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="end">addFirst</text>
  <path d="M220,100 L270,100" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Top-Right: ◀─ addLast -->
  <text x="670" y="104" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="start">addLast</text>
  <path d="M660,100 L610,100" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Bottom-Left: removeFirst ◀─ -->
  <text x="210" y="144" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="end">removeFirst</text>
  <path d="M270,140 L220,140" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- Bottom-Right: ─▶ removeLast -->
  <text x="670" y="144" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="start">removeLast</text>
  <path d="M610,140 L660,140" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
</svg>