<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">평문 회선 위의 세 가지 위험</title>
  <desc id="d">나에서 카페 공유기, ISP, 백본을 거쳐 서버로 가는 평문 경로의 중간 지점에 공격자가 앉으면 도청(패킷을 읽음), 변조(패킷을 바꿔 흘림), 위장(서버인 척 대신 응답)이 가능하다는 것을 보여 줍니다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="tls1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="tls1-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 경로 캡션 -->
  <text x="24" y="34" font-size="15" fill="#4b5563">패킷이 지나는 경로 (평문 회선)</text>

  <!-- 경로 노드 -->
  <rect x="24" y="50" width="70" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="59" y="80" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">나</text>

  <rect x="187" y="50" width="130" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="252" y="80" font-size="16" fill="#111827" text-anchor="middle">카페 공유기</text>

  <rect x="410" y="50" width="90" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="455" y="80" font-size="16" fill="#111827" text-anchor="middle">ISP</text>

  <rect x="593" y="50" width="90" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="638" y="80" font-size="16" fill="#111827" text-anchor="middle">백본</text>

  <rect x="776" y="50" width="80" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="816" y="80" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">서버</text>

  <!-- 경로 화살표 -->
  <line x1="96" y1="74" x2="183" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#tls1-arr)"/>
  <line x1="319" y1="74" x2="406" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#tls1-arr)"/>
  <line x1="502" y1="74" x2="589" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#tls1-arr)"/>
  <line x1="685" y1="74" x2="772" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#tls1-arr)"/>

  <!-- 공격자 위치 -->
  <line x1="252" y1="146" x2="252" y2="104" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tls1-red)"/>
  <rect x="187" y="148" width="130" height="34" rx="17" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="252" y="170" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기 앉으면 …</text>

  <line x1="455" y1="146" x2="455" y2="104" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tls1-red)"/>
  <rect x="390" y="148" width="130" height="34" rx="17" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="455" y="170" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기 앉으면 …</text>

  <!-- 위험 표: 셀 면 -->
  <rect x="24" y="210" width="832" height="36" fill="#f3f4f6"/>
  <rect x="24" y="246" width="180" height="240" fill="#fef2f2"/>

  <!-- 머리행 -->
  <text x="40" y="234" font-size="15" font-weight="bold" fill="#374151">위험</text>
  <text x="220" y="234" font-size="15" font-weight="bold" fill="#374151">공격자가 하는 일</text>
  <text x="440" y="234" font-size="15" font-weight="bold" fill="#374151">결과</text>

  <!-- ① 도청 -->
  <text x="40" y="278" font-size="18" font-weight="bold" fill="#b91c1c">① 도청</text>
  <text x="40" y="302" font-size="15" fill="#b91c1c">(Eavesdropping)</text>
  <text x="220" y="292" font-size="16" fill="#111827">지나가는 패킷을 읽는다</text>
  <text x="440" y="292" font-size="16" fill="#374151">로그인 ID/비밀번호, 세션 쿠키가 그대로 보인다</text>

  <!-- ② 변조 -->
  <text x="40" y="358" font-size="18" font-weight="bold" fill="#b91c1c">② 변조</text>
  <text x="40" y="382" font-size="15" fill="#b91c1c">(Tampering)</text>
  <text x="220" y="372" font-size="16" fill="#111827">패킷을 바꿔 흘려보낸다</text>
  <text x="440" y="360" font-size="16" fill="#374151">응답 HTML에 악성 스크립트를 끼워 넣거나</text>
  <text x="440" y="384" font-size="16" fill="#374151">다운로드 파일을 악성 파일로 바꿔치기한다</text>

  <!-- ③ 위장 -->
  <text x="40" y="438" font-size="18" font-weight="bold" fill="#b91c1c">③ 위장</text>
  <text x="40" y="462" font-size="15" fill="#b91c1c">(Impersonation)</text>
  <text x="220" y="440" font-size="16" fill="#111827">"내가 그 서버다"라며</text>
  <text x="220" y="464" font-size="16" fill="#111827">대신 응답한다</text>
  <text x="440" y="452" font-size="16" fill="#374151">가짜 로그인 화면을 띄워 자격 증명을 수집한다</text>

  <!-- 격자선 -->
  <line x1="24" y1="246" x2="856" y2="246" stroke="#9ca3af" stroke-width="1"/>
  <line x1="24" y1="326" x2="856" y2="326" stroke="#d1d5db" stroke-width="1"/>
  <line x1="24" y1="406" x2="856" y2="406" stroke="#d1d5db" stroke-width="1"/>
  <line x1="204" y1="210" x2="204" y2="486" stroke="#d1d5db" stroke-width="1"/>
  <line x1="424" y1="210" x2="424" y2="486" stroke="#d1d5db" stroke-width="1"/>
  <rect x="24" y="210" width="832" height="276" fill="none" stroke="#9ca3af" stroke-width="1"/>
</svg>
