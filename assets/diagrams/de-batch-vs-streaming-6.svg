<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">수집 통일, 변환 분리</title>
  <desc id="d">소스에서 Kafka로 수집한 뒤 두 갈래로 나뉜다. 실시간 처리 경로는 스트리밍 잡을 거쳐 실시간 지표(근사값, 즉시)를 내고, 배치 처리 경로는 원본 그대로 레이크에 적재한 뒤 배치/증분 변환으로 확정 지표(정확, 하루 단위)를 낸다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 머리 괄호: 수집 / 변환 -->
  <text x="145" y="42" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">수집: 스트리밍으로 통일</text>
  <path d="M24,64 V56 H266 V64" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="593" y="42" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">변환: 요구 지연에 따라 나눔</text>
  <path d="M518,64 V56 H668 V64" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 소스 → Kafka -->
  <rect x="24" y="98" width="86" height="64" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="67" y="136" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">소스</text>
  <path d="M110,130 H144" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="146" y="98" width="120" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="206" y="136" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Kafka</text>

  <!-- 갈래 -->
  <path d="M266,130 H296" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M296,130 H516" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M296,130 V280 H328" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- 실시간 처리 경로 -->
  <text x="330" y="112" font-size="15" font-weight="bold" fill="#1d4ed8">실시간 처리</text>
  <rect x="518" y="98" width="150" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="593" y="136" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">스트리밍 잡</text>
  <path d="M668,130 H704" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="706" y="98" width="150" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="781" y="125" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">실시간 지표</text>
  <text x="781" y="148" font-size="15" fill="#1f2937" text-anchor="middle">근사값, 즉시</text>

  <!-- 배치 처리 경로 -->
  <text x="330" y="236" font-size="15" font-weight="bold" fill="#047857">배치 처리</text>
  <rect x="330" y="248" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="405" y="275" font-size="15" fill="#1f2937" text-anchor="middle">원본 그대로</text>
  <text x="405" y="298" font-size="15" fill="#1f2937" text-anchor="middle">레이크 적재</text>
  <path d="M480,280 H516" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="518" y="248" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="593" y="286" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">배치/증분 변환</text>
  <path d="M668,280 H704" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="706" y="248" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="781" y="275" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">확정 지표</text>
  <text x="781" y="298" font-size="15" fill="#1f2937" text-anchor="middle">정확, 하루 단위</text>
</svg>
