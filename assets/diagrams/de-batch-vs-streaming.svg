<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">워터마크 마감과 늦은 이벤트</title>
  <desc id="d">이벤트 시간축 위에서 최대 이벤트 시간 10:12에서 지연 설정 5분을 뺀 워터마크 10:07이 09:50~10:00 윈도우를 마감(결과 확정)하고, 10:00~10:10 윈도우는 열어 둔 채, 뒤늦게 도착한 09:55 이벤트를 버리는(DROP) 모습.</desc>
  <rect width="880" height="590" fill="#ffffff"/>
  <defs>
    <marker id="ar-wm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ar-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <circle cx="32" cy="31" r="7" fill="#1d4ed8"/>
  <text x="46" y="36" font-size="15" fill="#111827">정상 이벤트</text>
  <circle cx="152" cy="31" r="7" fill="#b91c1c"/>
  <line x1="148" y1="27" x2="156" y2="35" stroke="#ffffff" stroke-width="2"/>
  <line x1="156" y1="27" x2="148" y2="35" stroke="#ffffff" stroke-width="2"/>
  <text x="166" y="36" font-size="15" fill="#111827">지연 이벤트(버림)</text>
  <line x1="312" y1="31" x2="342" y2="31" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="350" y="36" font-size="15" fill="#111827">워터마크</text>

  <!-- 워터마크 계산: 10:12 - 5분 = 10:07 -->
  <text x="600" y="86" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">지연 설정 −5분</text>
  <line x1="648" y1="100" x2="553" y2="100" stroke="#6d28d9" stroke-width="2" marker-end="url(#ar-wm)"/>
  <text x="537" y="106" font-size="17" font-weight="700" fill="#6d28d9" text-anchor="end">워터마크 = 10:07</text>
  <line x1="652" y1="100" x2="652" y2="292" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- 레인 1: 시간 윈도우 -->
  <text x="24" y="180" font-size="16" font-weight="700" fill="#111827">시간 윈도우</text>
  <text x="24" y="201" font-size="14" fill="#4b5563">(Window State)</text>

  <rect x="190" y="130" width="208" height="110" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="294" y="160" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">09:50 ~ 10:00</text>
  <text x="294" y="182" font-size="15" fill="#374151" text-anchor="middle">윈도우</text>
  <rect x="226" y="196" width="136" height="28" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="294" y="215" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">마감 (결과 확정)</text>

  <rect x="402" y="130" width="208" height="110" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="474" y="160" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">10:00 ~ 10:10</text>
  <text x="474" y="182" font-size="15" fill="#065f46" text-anchor="middle">윈도우</text>
  <rect x="416" y="196" width="116" height="28" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="474" y="215" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">열림 (수집 중)</text>

  <!-- 레인 2: 이벤트 스트림 -->
  <text x="24" y="334" font-size="16" font-weight="700" fill="#111827">이벤트 스트림</text>
  <text x="24" y="355" font-size="14" fill="#4b5563">(Event Stream)</text>
  <line x1="190" y1="330" x2="830" y2="330" stroke="#d1d5db" stroke-width="2"/>

  <text x="295" y="312" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">09:55 (지연)</text>
  <circle cx="295" cy="330" r="9" fill="#b91c1c"/>
  <line x1="290" y1="325" x2="300" y2="335" stroke="#ffffff" stroke-width="2.2"/>
  <line x1="300" y1="325" x2="290" y2="335" stroke="#ffffff" stroke-width="2.2"/>
  <rect x="207" y="352" width="176" height="50" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="295" y="372" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">워터마크(10:07)보다</text>
  <text x="295" y="393" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">뒤처져 버려짐 (DROP)</text>

  <text x="442" y="312" font-size="16" fill="#1d4ed8" text-anchor="middle">10:02</text>
  <circle cx="442" cy="330" r="9" fill="#1d4ed8"/>

  <text x="652" y="312" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">10:12</text>
  <circle cx="652" cy="330" r="9" fill="#1d4ed8"/>
  <text x="652" y="360" font-size="15" fill="#1d4ed8" text-anchor="middle">최대 이벤트 시간</text>

  <!-- 워터마크 선 -->
  <line x1="547" y1="114" x2="547" y2="440" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="7 4"/>

  <!-- 이벤트 시간 축 -->
  <text x="24" y="446" font-size="16" font-weight="700" fill="#111827">이벤트 시간</text>
  <text x="24" y="467" font-size="14" fill="#4b5563">(Event Time)</text>
  <line x1="190" y1="440" x2="850" y2="440" stroke="#374151" stroke-width="1.5" marker-end="url(#ar-axis)"/>
  <line x1="190" y1="440" x2="190" y2="447" stroke="#374151" stroke-width="1.5"/>
  <line x1="400" y1="440" x2="400" y2="447" stroke="#374151" stroke-width="1.5"/>
  <line x1="610" y1="440" x2="610" y2="447" stroke="#374151" stroke-width="1.5"/>
  <line x1="820" y1="440" x2="820" y2="447" stroke="#374151" stroke-width="1.5"/>
  <text x="190" y="466" font-size="15" fill="#374151" text-anchor="middle">09:50</text>
  <text x="400" y="466" font-size="15" fill="#374151" text-anchor="middle">10:00</text>
  <text x="547" y="466" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">10:07</text>
  <text x="610" y="466" font-size="15" fill="#374151" text-anchor="middle">10:10</text>
  <text x="820" y="466" font-size="15" fill="#374151" text-anchor="middle">10:20</text>

  <!-- 결론 -->
  <rect x="24" y="494" width="832" height="72" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="440" y="523" font-size="16" fill="#111827" text-anchor="middle">결론: 최대 이벤트(10:12) − 지연(5분) = <tspan font-weight="700" fill="#6d28d9">워터마크(10:07)</tspan></text>
  <text x="440" y="550" font-size="16" fill="#111827" text-anchor="middle">워터마크 미만인 09:50~10:00 윈도우는 마감되며, 이후 도착한 09:55 이벤트는 폐기된다.</text>
</svg>
