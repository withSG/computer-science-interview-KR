<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비교</title>
  <desc id="d">사용량과 시간 축에 따라 기저 부하(Savings Plans / RI), 변동 구간(Spot), 피크(On-Demand 또는 Spot) 구성을 나타내는 차트</desc>
  
  <!-- 배경 -->
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <!-- 축 화살표 마커 -->
    <marker id="a-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- 지시선 화살표 마커 -->
    <marker id="a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <!-- 그래프 레이어 (면) -->
  <!-- 기저 부하 (Baseline) : 파랑 계열 -->
  <rect x="100" y="210" width="360" height="90" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  
  <!-- 변동 구간 (Variable) : 초록 계열 -->
  <rect x="220" y="130" width="200" height="80" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  
  <!-- 피크 (Peak) : 주황 계열 -->
  <rect x="280" y="70" width="120" height="60" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>

  <!-- 축 (Y축: 사용량, X축: 시간) -->
  <path d="M100,50 L100,300 L520,300" stroke="#1f2933" stroke-width="2" fill="none" marker-start="url(#a-axis)" marker-end="url(#a-axis)"/>

  <!-- 축 라벨 -->
  <text x="100" y="32" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">사용량</text>
  <text x="535" y="304" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">시간</text>

  <!-- 지시선 및 범례 / 설명 라벨 (화살표 & 텍스트) -->
  <!-- 피크 라벨 -->
  <path d="M400,100 L450,100" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-start="url(#a-sub)"/>
  <text x="460" y="104" font-size="13" fill="#1f2933">← 피크: On-Demand 또는 Spot으로 흡수</text>

  <!-- 변동 구간 라벨 -->
  <path d="M420,170 L450,170" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-start="url(#a-sub)"/>
  <text x="460" y="174" font-size="13" fill="#1f2933">← 변동 구간: Spot(중단 가능한 작업) 배치</text>

  <!-- 기저 부하 라벨 -->
  <path d="M460,255 L480,255" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-start="url(#a-sub)"/>
  <text x="490" y="259" font-size="13" fill="#1f2933">← 기저 부하(baseline): Savings Plans / RI로 약정</text>

</svg>