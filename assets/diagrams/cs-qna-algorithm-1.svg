<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동작 과정</title>
  <desc id="d">이진 탐색으로 배열에서 숫자 7을 찾는 3단계 동작 과정 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Initial Info Box -->
  <rect x="40" y="30" width="800" height="70" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="58" font-size="14" font-weight="bold" fill="#1f2933">찾는 값: 7</text>
  <text x="60" y="83" font-size="14" font-weight="bold" fill="#1f2933">배열: [1, 3, 5, 7, 9, 11, 13]</text>

  <!-- Step 1 -->
  <rect x="40" y="120" width="800" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="152" font-size="14" font-weight="bold" fill="#2563eb">1단계: mid=5, 7&gt;5 → 오른쪽 탐색</text>
  <rect x="60" y="168" width="200" height="36" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="160" y="190.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[7, 9, 11, 13]</text>

  <!-- Connection Step 1 -> Step 2 -->
  <path d="M440,220 L440,238" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 2 -->
  <rect x="40" y="240" width="800" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="272" font-size="14" font-weight="bold" fill="#d97706">2단계: mid=9, 7&lt;9 → 왼쪽 탐색</text>
  <rect x="60" y="288" width="80" height="36" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="100" y="310.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[7]</text>

  <!-- Connection Step 2 -> Step 3 -->
  <path d="M440,340 L440,358" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 3 -->
  <rect x="40" y="360" width="800" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="417" font-size="15" font-weight="bold" fill="#059669">3단계: mid=7, 찾음!</text>
</svg>