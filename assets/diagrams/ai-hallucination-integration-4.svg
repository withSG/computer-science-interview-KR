<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 345" width="880" height="345" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비용 상한</title>
  <desc id="d">호출 단위, 사용자 단위, 조직 단위, 호출 전 단계별 비용 상한 설정 방식 다이어그램</desc>
  <defs>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="880" height="345" fill="#ffffff"/>

  <!-- 호출 단위 -->
  <g transform="translate(40, 30)">
    <rect width="140" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="70" y="34.9" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">호출 단위:</text>
    
    <rect x="155" y="0" width="645" height="60" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="175" y="34.55" fill="#1f2933" font-size="13">max_tokens로 응답 길이 상한</text>
  </g>

  <!-- 사용자 단위 -->
  <g transform="translate(40, 105)">
    <rect width="140" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="70" y="34.9" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">사용자 단위:</text>
    
    <rect x="155" y="0" width="645" height="60" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="175" y="34.55" fill="#1f2933" font-size="13">하루 N회 / M토큰 쿼터</text>
  </g>

  <!-- 조직 단위 -->
  <g transform="translate(40, 180)">
    <rect width="140" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="70" y="34.9" fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle">조직 단위:</text>
    
    <rect x="155" y="0" width="645" height="60" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="175" y="34.55" fill="#1f2933" font-size="13">월 예산 초과 시 알림</text>
    <path d="M 335 30 L 360 30" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
    <text x="372" y="34.55" fill="#1f2933" font-size="13">자동 차단</text>
  </g>

  <!-- 호출 전 -->
  <g transform="translate(40, 255)">
    <rect width="140" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="70" y="34.9" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">호출 전:</text>
    
    <rect x="155" y="0" width="645" height="60" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="175" y="34.55" fill="#1f2933" font-size="13">입력 토큰을 세어 임계값 초과 요청은 아예 거절하거나 잘라낸다</text>
  </g>
</svg>