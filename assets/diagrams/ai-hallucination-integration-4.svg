<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LLM 비용 상한 층</title>
  <desc id="d">비용 상한을 호출 단위, 사용자 단위, 조직 단위, 호출 전 네 곳에 두고 각각 어떤 방식으로 막는지 나열한 그림.</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 호출 단위 -->
  <rect x="24" y="24" width="832" height="60" rx="8" fill="#e0e7ff"/>
  <rect x="204" y="25" width="651" height="58" fill="#ffffff"/>
  <rect x="24" y="24" width="832" height="60" rx="8" fill="none" stroke="#4338ca" stroke-width="1.5"/>
  <text x="114" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">호출 단위</text>
  <text x="228" y="60" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="700">max_tokens</tspan>로 응답 길이 상한</text>

  <!-- 사용자 단위 -->
  <rect x="24" y="96" width="832" height="60" rx="8" fill="#e0e7ff"/>
  <rect x="204" y="97" width="651" height="58" fill="#ffffff"/>
  <rect x="24" y="96" width="832" height="60" rx="8" fill="none" stroke="#4338ca" stroke-width="1.5"/>
  <text x="114" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">사용자 단위</text>
  <text x="228" y="132" font-size="16" fill="#111827">하루 N회 / M토큰 쿼터</text>

  <!-- 조직 단위 -->
  <rect x="24" y="168" width="832" height="60" rx="8" fill="#e0e7ff"/>
  <rect x="204" y="169" width="651" height="58" fill="#ffffff"/>
  <rect x="24" y="168" width="832" height="60" rx="8" fill="none" stroke="#4338ca" stroke-width="1.5"/>
  <text x="114" y="204" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">조직 단위</text>
  <rect x="222" y="180" width="180" height="36" rx="6" fill="#fef3c7"/>
  <text x="312" y="204" text-anchor="middle" font-size="16" fill="#78350f">월 예산 초과 시 알림</text>
  <line x1="408" y1="198" x2="444" y2="198" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="450" y="180" width="112" height="36" rx="6" fill="#fee2e2"/>
  <text x="506" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">자동 차단</text>

  <!-- 호출 전 -->
  <rect x="24" y="240" width="832" height="60" rx="8" fill="#e0e7ff"/>
  <rect x="204" y="241" width="651" height="58" fill="#ffffff"/>
  <rect x="24" y="240" width="832" height="60" rx="8" fill="none" stroke="#4338ca" stroke-width="1.5"/>
  <text x="114" y="276" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">호출 전</text>
  <text x="228" y="276" font-size="16" fill="#111827">입력 토큰을 세어 임계값 초과 요청은 아예 거절하거나 잘라낸다</text>
</svg>
