<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세션 인증 6단계 흐름</title>
  <desc id="d">Client, Server, 세션 저장소 사이의 흐름. (1) POST /login, (2) 세션 생성으로 a3f9…: {userId: 7, role: USER} 저장, (3) 200 OK와 Set-Cookie로 세션 ID 전달, (4) GET /my-orders에 Cookie 자동 첨부, (5) 세션 조회로 userId=7 확인, (6) kim의 주문 목록 응답.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="40" y="24" width="120" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="100" y="52" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Client</text>
  <rect x="400" y="24" width="120" height="44" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="460" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>
  <rect x="640" y="24" width="180" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="730" y="52" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">세션 저장소</text>

  <!-- 생명선 -->
  <line x1="100" y1="68" x2="100" y2="536" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="460" y1="68" x2="460" y2="536" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="730" y1="68" x2="730" y2="536" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- (1) 로그인 요청 -->
  <circle cx="136" cy="103" r="12" fill="#1d4ed8"/>
  <text x="136" y="108" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="158" y="108" font-size="16" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /login  id=kim&amp;pw=****</text>
  <line x1="102" y1="122" x2="456" y2="122" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- (2) 세션 생성 -->
  <circle cx="496" cy="159" r="12" fill="#6d28d9"/>
  <text x="496" y="164" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="518" y="164" font-size="16" font-weight="bold" fill="#6d28d9">세션 생성</text>
  <line x1="462" y1="178" x2="726" y2="178" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <!-- 저장소에 기록된 세션 -->
  <rect x="612" y="192" width="236" height="62" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="628" y="216" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold" fill="#b45309">a3f9…</tspan>:</text>
  <text x="628" y="240" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">{userId: 7, role: USER}</text>

  <!-- (3) 쿠키로 전달 -->
  <circle cx="136" cy="209" r="12" fill="#047857"/>
  <text x="136" y="214" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="158" y="214" font-size="16" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">200 OK</text>
  <text x="158" y="238" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Set-Cookie: SESSIONID=<tspan font-weight="bold" fill="#b45309">a3f9…</tspan>;</text>
  <text x="174" y="260" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HttpOnly; Secure; SameSite=Lax</text>
  <line x1="458" y1="278" x2="104" y2="278" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- (4) 쿠키 자동 재전송 -->
  <circle cx="136" cy="317" r="12" fill="#1d4ed8"/>
  <text x="136" y="322" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="158" y="322" font-size="16" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /my-orders</text>
  <text x="158" y="346" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Cookie: SESSIONID=<tspan font-weight="bold" fill="#b45309">a3f9…</tspan></text>
  <line x1="102" y1="362" x2="456" y2="362" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- (5) 세션 조회 -->
  <circle cx="496" cy="397" r="12" fill="#6d28d9"/>
  <text x="496" y="402" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="518" y="402" font-size="16" font-weight="bold" fill="#6d28d9">세션 조회</text>
  <line x1="462" y1="416" x2="726" y2="416" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="518" y="446" font-size="16" fill="#4c1d95"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">userId=7</tspan> 확인</text>
  <line x1="728" y1="460" x2="464" y2="460" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/>

  <!-- (6) 응답 -->
  <circle cx="136" cy="497" r="12" fill="#047857"/>
  <text x="136" y="502" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="158" y="502" font-size="16" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="bold">200 OK</tspan>  [kim의 주문 목록]</text>
  <line x1="458" y1="516" x2="104" y2="516" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
</svg>
