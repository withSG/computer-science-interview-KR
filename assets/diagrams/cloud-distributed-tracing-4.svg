<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Head 샘플링</title>
  <desc id="d">Gateway에서 난수를 뽑아 샘플링 여부를 결정하고 하위 서비스로 전파하는 Head 샘플링 구조도</desc>
  <rect width="880" height="230" fill="#ffffff"/>
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <!-- Root Node (Gateway) -->
  <rect x="24" y="85" width="370" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="209" y="120" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Gateway: 난수를 뽑아 1% 안에 들면 샘플링 결정</text>

  <!-- Tree Branch Line -->
  <path d="M 394,115 L 420,115 L 420,65 L 440,65 M 420,115 L 420,165 L 440,165" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Upper Branch (Sampled) -->
  <rect x="440" y="45" width="165" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="522.5" y="69" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">샘플링됨(flags=01)</text>

  <path d="M 605,65 L 635,65" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <text x="645" y="69.5" font-size="13" fill="#1f2933" text-anchor="start">모든 하위 서비스가 스팬 기록</text>

  <!-- Lower Branch (Not Sampled) -->
  <rect x="440" y="145" width="165" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="522.5" y="169" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">안 됨(flags=00)</text>

  <path d="M 605,165 L 635,165" stroke="#52606d" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-gray)"/>
  <text x="645" y="169.5" font-size="13" fill="#1f2933" text-anchor="start">모든 하위 서비스가 기록 생략 (오버헤드 거의 0)</text>
</svg>