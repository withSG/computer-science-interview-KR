  <rect x="138" y="500" width="44" height="24" rx="4" fill="#dbeafe"/>
  <text x="160" y="517" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">P1</text>
  <text x="216" y="518" font-size="15" fill="#111827">남은 1 소진 후 <tspan font-weight="bold" fill="#047857">종료</tspan></text>
  <text x="616" y="518" font-size="15" fill="#4b5563" text-anchor="middle">—</text>

  <!-- Ready 큐 원형 순환 -->
  <text x="40" y="582" font-size="18" font-weight="bold" fill="#111827">Ready 큐가 원형으로 돈다</text>

