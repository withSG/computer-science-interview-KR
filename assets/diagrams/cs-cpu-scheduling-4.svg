  <rect x="596" y="356" width="40" height="24" rx="4" fill="#ede9fe"/>
  <text x="616" y="373" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">P4</text>
  <rect x="642" y="356" width="40" height="24" rx="4" fill="#dbeafe"/>
  <text x="662" y="373" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">P1</text>

  <!-- 행 6: t=9 -->
  <text x="80" y="410" font-size="15" fill="#111827" text-anchor="middle">t=9</text>
  <rect x="138" y="392" width="44" height="24" rx="4" fill="#ede9fe"/>
  <text x="160" y="409" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">P4</text>
  <text x="216" y="410" font-size="15" fill="#111827">퀀텀 소진</text>
  <rect x="596" y="392" width="40" height="24" rx="4" fill="#dbeafe"/>
  <text x="616" y="409" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">P1</text>
  <rect x="642" y="392" width="40" height="24" rx="4" fill="#ede9fe"/>
  <text x="662" y="409" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">P4</text>

