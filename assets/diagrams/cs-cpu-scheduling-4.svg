<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Round Robin 실행 순서 (퀀텀 2)</title>
  <desc id="d">타임 퀀텀 2로 P1~P4를 Round Robin 스케줄링한 간트 차트, 각 시점의 실행 결과와 Ready 큐 상태 표, 퀀텀을 다 쓴 프로세스가 큐 맨 뒤로 돌아가는 원형 구조입니다.</desc>
  <rect width="880" height="760" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="40" y="42" font-size="19" font-weight="bold" fill="#111827">타임 퀀텀 = 2 인 경우</text>

