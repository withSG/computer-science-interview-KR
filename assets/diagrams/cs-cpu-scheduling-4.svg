  <rect x="770" y="62" width="45" height="48" fill="#dbeafe"/>
  <text x="792.5" y="92" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">P1</text>

  <!-- 시간축 -->
  <line x1="64" y1="116" x2="816" y2="116" stroke="#6b7280" stroke-width="1.5"/>
  <g stroke="#6b7280" stroke-width="1.5">
