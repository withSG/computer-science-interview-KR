<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Round Robin (RR) — 선점</title>
  <desc id="d">Round Robin 스케줄링의 갠트 차트, 시간별 타임라인 진행 상태와 Ready 큐의 원형 순환 구조를 나타낸 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="730" fill="#ffffff"/>

  <!-- 헤더 / 섹션 제목 -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">Round Robin (RR) — 선점</text>
  <text x="30" y="65" font-size="13" font-weight="bold" fill="#2563eb">타임 퀀텀 = 2 인 경우</text>

  <!-- 1. Gantt Chart 구역 -->
  <!-- Timeline Scale Labels -->
  <text x="60" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">0</text>
  <text x="160" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">2</text>
  <text x="260" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">4</text>
  <text x="360" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">6</text>
  <text x="410" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">7</text>
  <text x="510" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">9</text>
  <text x="610" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">11</text>
  <text x="710" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">13</text>
  <text x="810" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">15</text>
  <text x="860" y="97" font-size="12" font-weight="bold" fill="#52606d" text-anchor="middle">16</text>

  <!-- Gantt Chart Blocks -->
  <!-- P1: 0-2 (100px) -->
  <rect x="60" y="105" width="100" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="127" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">P1</text>

  <!-- P2: 2-4 (100px) -->
  <rect x="160" y="105" width="100" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="210" y="127" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">P2</text>

  <!-- P1: 4-6 (100px) -->
  <rect x="260" y="105" width="100" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="127" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">P1</text>

  <!-- P3: 6-7 (50px) -->
  <rect x="360" y="105" width="50" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="385" y="127" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">P3</text>

  <!-- P2: 7-9 (100px) -->
  <rect x="410" y="105" width="100" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="460" y="127" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">P2</text>

  <!-- P4: 9-11 (100px) -->
  <rect x="510" y="105" width="100" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="560" y="127" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">P4</text>

  <!-- P1: 11-13 (100px) -->
  <rect x="610" y="105" width="100" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="660" y="127" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">P1</text>

  <!-- P4: 13-15 (100px) -->
  <rect x="710" y="105" width="100" height="36" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="760" y="127" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">P4</text>

  <!-- P1: 15-16 (50px) -->
  <rect x="810" y="105" width="50" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="835" y="127" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">P1</text>

  <!-- Timeline ticks/end boundary -->
  <line x1="60" y1="100" x2="60" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="160" y1="100" x2="160" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="260" y1="100" x2="260" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="360" y1="100" x2="360" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="410" y1="100" x2="410" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="510" y1="100" x2="510" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="610" y1="100" x2="610" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="710" y1="100" x2="710" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="810" y1="100" x2="810" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="860" y1="100" x2="860" y2="146" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 구분선 -->
  <line x1="30" y1="165" x2="850" y2="165" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 2. 시간별 텍스트 설명 및 Ready 큐 상태 -->
  <!-- Line 1: t=0 -->
  <text x="40" y="195" font-size="13" font-weight="bold" fill="#1f2933">t=0</text>
  <text x="80" y="195" font-size="13" fill="#1f2933">P1 실행 → 퀀텀 소진, 그사이 도착한 P2 뒤로</text>
  <rect x="730" y="179" width="110" height="24" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="785" y="195" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">[P2 P1]</text>

  <!-- Line 2: t=2 -->
  <text x="40" y="225" font-size="13" font-weight="bold" fill="#1f2933">t=2</text>
  <text x="80" y="225" font-size="13" fill="#1f2933">P2 실행 → 퀀텀 소진, t=4에 P3 도착</text>
  <rect x="730" y="209" width="110" height="24" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="785" y="225" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">[P1 P3 P2]</text>

  <!-- Line 3: t=4 -->
  <text x="40" y="255" font-size="13" font-weight="bold" fill="#1f2933">t=4</text>
  <text x="80" y="255" font-size="13" fill="#1f2933">P1 실행 → 퀀텀 소진, t=5에 P4 도착</text>
  <rect x="730" y="239" width="110" height="24" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="785" y="255" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">[P3 P2 P4 P1]</text>

  <!-- Line 4: t=6 -->
  <text x="40" y="285" font-size="13" font-weight="bold" fill="#1f2933">t=6</text>
  <text x="80" y="285" font-size="13" fill="#1f2933">P3 실행 → 1만 쓰고 종료(t=7)</text>
  <rect x="730" y="269" width="110" height="24" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="785" y="285" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">[P2 P4 P1]</text>

  <!-- Line 5: t=7 -->
  <text x="40" y="315" font-size="13" font-weight="bold" fill="#1f2933">t=7</text>
  <text x="80" y="315" font-size="13" fill="#1f2933">P2 실행 → 남은 2를 다 쓰고 종료(t=9)</text>
  <rect x="730" y="299" width="110" height="24" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="785" y="315" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">[P4 P1]</text>

  <!-- Line 6: t=9 -->
  <text x="40" y="345" font-size="13" font-weight="bold" fill="#1f2933">t=9</text>
  <text x="80" y="345" font-size="13" fill="#1f2933">P4 실행 → 퀀텀 소진</text>
  <rect x="730" y="329" width="110" height="24" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="785" y="345" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">[P1 P4]</text>

  <!-- Line 7: t=11 -->
  <text x="40" y="375" font-size="13" font-weight="bold" fill="#1f2933">t=11</text>
  <text x="80" y="375" font-size="13" fill="#1f2933">P1 실행 → 퀀텀 소진</text>
  <rect x="730" y="359" width="110" height="24" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="785" y="375" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">[P4 P1]</text>

  <!-- Line 8: t=13 -->
  <text x="40" y="405" font-size="13" font-weight="bold" fill="#1f2933">t=13</text>
  <text x="80" y="405" font-size="13" fill="#1f2933">P4 실행 → 종료(t=15) / t=15 P1이 남은 1 소진 후 종료</text>

  <!-- 구분선 -->
  <line x1="30" y1="430" x2="850" y2="430" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 3. Ready 큐 순환 다이어그램 구역 -->
  <!-- 구역 제목 -->
  <text x="440" y="462" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Ready 큐가 원형으로 돈다</text>

  <!-- Queue Nodes: P1, P2, P3, P4 -->
  <!-- Node P1 -->
  <rect x="230" y="550" width="80" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="578" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">P1</text>

  <!-- Node P2 -->
  <rect x="350" y="550" width="80" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="578" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">P2</text>

  <!-- Node P3 -->
  <rect x="470" y="550" width="80" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="510" y="578" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">P3</text>

  <!-- Node P4 -->
  <rect x="590" y="550" width="80" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="578" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">P4</text>

  <!-- Inter-node Arrows -->
  <path d="M310,573 L350,573" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M430,573 L470,573" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M550,573 L590,573" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Top Return Loop (Top Feedback) -->
  <path d="M270,550 L270,500 L630,500 L630,550" stroke="#1f2933" stroke-width="1.5" fill="none" marker-start="url(#a-ink)"/>

  <!-- Bottom Feedback Loop with Text Box -->
  <path d="M270,596 L270,660 L630,660 L630,596" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Bottom Label Box with White Background -->
  <rect x="350" y="647" width="180" height="26" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="440" y="664" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">퀀텀 소진 → 맨 뒤로</text>
</svg>