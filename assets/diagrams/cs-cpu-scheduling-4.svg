  <rect x="159" y="62" width="92" height="48" fill="#d1fae5"/>
  <text x="205" y="92" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">P2</text>
  <rect x="253" y="62" width="92" height="48" fill="#dbeafe"/>
  <text x="299" y="92" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">P1</text>
  <rect x="347" y="62" width="45" height="48" fill="#fef3c7"/>
  <text x="369.5" y="92" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">P3</text>
  <rect x="394" y="62" width="92" height="48" fill="#d1fae5"/>
  <text x="440" y="92" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">P2</text>
  <rect x="488" y="62" width="92" height="48" fill="#ede9fe"/>
  <text x="534" y="92" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">P4</text>
  <rect x="582" y="62" width="92" height="48" fill="#dbeafe"/>
