<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">꼬리 지연 증폭</title>
  <desc id="d">화면 하나가 백엔드 호출 20번을 쓰고 각 호출이 99% 확률로 빠를 때, 20번 모두 빠를 확률은 0.99의 20제곱으로 약 0.82라서 사용자의 약 18%가 한 번 이상 느린 호출을 만난다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 1. 전제: 화면 하나 → 호출 20번 -->
  <rect x="32" y="50" width="128" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="96" y="82" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">화면 하나</text>
  <line x1="166" y1="76" x2="206" y2="76" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5">
    <rect x="216" y="63" width="26" height="26" rx="4"/>
    <rect x="247" y="63" width="26" height="26" rx="4"/>
    <rect x="278" y="63" width="26" height="26" rx="4"/>
    <rect x="309" y="63" width="26" height="26" rx="4"/>
    <rect x="340" y="63" width="26" height="26" rx="4"/>
    <rect x="371" y="63" width="26" height="26" rx="4"/>
    <rect x="402" y="63" width="26" height="26" rx="4"/>
    <rect x="433" y="63" width="26" height="26" rx="4"/>
    <rect x="464" y="63" width="26" height="26" rx="4"/>
    <rect x="495" y="63" width="26" height="26" rx="4"/>
    <rect x="526" y="63" width="26" height="26" rx="4"/>
    <rect x="557" y="63" width="26" height="26" rx="4"/>
    <rect x="588" y="63" width="26" height="26" rx="4"/>
    <rect x="619" y="63" width="26" height="26" rx="4"/>
    <rect x="650" y="63" width="26" height="26" rx="4"/>
    <rect x="681" y="63" width="26" height="26" rx="4"/>
    <rect x="712" y="63" width="26" height="26" rx="4"/>
    <rect x="743" y="63" width="26" height="26" rx="4"/>
    <rect x="774" y="63" width="26" height="26" rx="4"/>
    <rect x="805" y="63" width="26" height="26" rx="4"/>
  </g>
  <path d="M216,98 V106 H831 V98" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <text x="523.5" y="132" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">백엔드 호출 20번</tspan> · 각 호출이 99% 확률로 빠름</text>

  <!-- 2. 계산 -->
  <line x1="440" y1="144" x2="440" y2="170" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="170" y="176" width="540" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="212" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">20번 모두 빠를 확률 = 0.99<tspan font-size="14" dy="-9">20</tspan><tspan dy="9"> ≈ 0.82</tspan></text>

  <!-- 3. 결과: 사용자 비율 막대 -->
  <line x1="440" y1="240" x2="440" y2="266" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="60" y="262" font-size="14" fill="#4b5563">사용자 전체 (100%)</text>
  <rect x="60" y="274" width="621" height="48" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="370.5" y="304" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">20번 모두 빠름 · 약 82%</text>
  <rect x="684" y="274" width="136" height="48" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="752" y="305" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">약 18%</text>

  <line x1="752" y1="322" x2="752" y2="340" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="820" y="362" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="end">사용자의 약 18%가 한 번 이상 느린 호출을 만난다</text>

  <!-- 결론 -->
  <rect x="120" y="384" width="640" height="48" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="414" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">개별 API의 p99는 훌륭한데 화면 체감은 나쁜 이유</text>
</svg>
