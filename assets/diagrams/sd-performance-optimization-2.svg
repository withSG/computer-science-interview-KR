<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">꼬리 지연 증폭 (Tail Amplification)</title>
  <desc id="d">화면 하나를 그리는 데 백엔드 호출 20번이 필요할 때 p99 지연이 어떻게 체감 성능 저하로 증폭되는지 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 메인 수식 & 조건 카드 영역 -->
  <rect x="40" y="30" width="800" height="150" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 상단 전제 조건 설명 -->
  <text x="60" y="70" font-size="14" fill="#1f2933" font-weight="bold">화면 하나를 그리는 데 백엔드 호출 20번이 필요하다고 하자.</text>
  <text x="60" y="96" font-size="14" fill="#1f2933">각 호출이 99% 확률로 빠르다면,</text>

  <!-- 수식 강조 박스 -->
  <rect x="60" y="118" width="760" height="44" rx="6" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="80" y="145" font-size="16" font-weight="bold" fill="#2563eb">20번 모두 빠를 확률 = 0.99^20 ≈ 0.82</text>

  <!-- 연결 화살표 (→) -->
  <path d="M440,190 L440,212" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- 결과 & 결론 영역 (경고/결과 강조) -->
  <rect x="40" y="220" width="800" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>

  <text x="60" y="260" font-size="14" font-weight="bold" fill="#d97706">→ 사용자의 약 18%가 한 번 이상 느린 호출을 만난다.</text>
  <text x="80" y="295" font-size="14" fill="#1f2933">개별 API의 p99는 훌륭한데 화면 체감은 나쁜 이유다.</text>
</svg>