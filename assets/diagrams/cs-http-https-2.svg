<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">요청과 응답의 구조</title>
  <desc id="d">HTTP 메시지의 구조를 보여주는 다이어그램으로, 시작 줄, 헤더, 빈 줄(CRLF 구분자), 본문의 4단계 구성을 설명합니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- Left Structure Card Block -->
  <!-- Start Line Block -->
  <rect x="40" y="40" width="410" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="245" y="75" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">시작 줄 (Start Line)</text>

  <!-- Headers Block -->
  <rect x="40" y="100" width="410" height="80" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="245" y="132" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">헤더 (Headers)</text>
  <text x="245" y="157" fill="#52606d" font-size="14" text-anchor="middle">...</text>

  <!-- Empty Line Block -->
  <rect x="40" y="180" width="410" height="50" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="245" y="209" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">(빈 줄)</text>

  <!-- Body Block -->
  <rect x="40" y="230" width="410" height="80" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
  <text x="245" y="275" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">본문 (Body)</text>

  <!-- Right Annotations / Descriptions -->
  <!-- Start Line Annotation -->
  <text x="480" y="60" fill="#1f2933" font-size="13">요청: 메서드 경로 버전</text>
  <text x="480" y="82" fill="#1f2933" font-size="13">응답: 버전 상태코드 상태메시지</text>

  <!-- Headers Annotation -->
  <text x="480" y="145" fill="#1f2933" font-size="13">이름: 값  형태로 여러 줄</text>

  <!-- Empty Line Annotation -->
  <text x="480" y="209" fill="#1f2933" font-size="13">← 헤더 끝을 알리는 CRLF</text>
  <text x="670" y="209" fill="#d97706" font-size="13" font-weight="bold">이 빈 줄이 구분자다</text>

  <!-- Body Annotation -->
  <text x="480" y="275" fill="#1f2933" font-size="13">없을 수도 있다</text>
</svg>