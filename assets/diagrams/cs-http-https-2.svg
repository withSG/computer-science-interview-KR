<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HTTP 메시지의 구조</title>
  <desc id="d">HTTP 메시지는 위에서부터 시작 줄, 헤더, 빈 줄, 본문 순서로 이어진다. 시작 줄은 요청이면 메서드·경로·버전, 응답이면 버전·상태코드·상태메시지이고, 헤더는 이름: 값 형태로 여러 줄이며, 헤더 끝을 알리는 CRLF 빈 줄이 구분자이고, 본문은 없을 수도 있다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 설명 열 행 구분선 -->
  <line x1="440" y1="112" x2="856" y2="112" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="440" y1="200" x2="856" y2="200" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="440" y1="252" x2="856" y2="252" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ① 시작 줄 -->
  <rect x="24" y="24" width="400" height="88" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="48" y="74" font-size="18" font-weight="bold" fill="#1e3a8a">시작 줄 (Start Line)</text>

  <text x="452" y="56" font-size="16" font-weight="bold" fill="#1d4ed8">요청</text>
  <rect x="500" y="36" width="66" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="533" y="56" font-size="15" fill="#1f2937" text-anchor="middle">메서드</text>
  <rect x="574" y="36" width="52" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="600" y="56" font-size="15" fill="#1f2937" text-anchor="middle">경로</text>
  <rect x="634" y="36" width="52" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="660" y="56" font-size="15" fill="#1f2937" text-anchor="middle">버전</text>

  <text x="452" y="94" font-size="16" font-weight="bold" fill="#047857">응답</text>
  <rect x="500" y="74" width="52" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="526" y="94" font-size="15" fill="#1f2937" text-anchor="middle">버전</text>
  <rect x="560" y="74" width="82" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="601" y="94" font-size="15" fill="#1f2937" text-anchor="middle">상태코드</text>
  <rect x="650" y="74" width="98" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="699" y="94" font-size="15" fill="#1f2937" text-anchor="middle">상태메시지</text>

  <!-- ② 헤더 -->
  <rect x="24" y="112" width="400" height="88" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="148" font-size="18" font-weight="bold" fill="#1f2937">헤더 (Headers)</text>
  <text x="48" y="178" font-size="16" fill="#4b5563">...</text>

  <rect x="452" y="142" width="82" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="493" y="161" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">이름: 값</text>
  <text x="546" y="162" font-size="16" fill="#374151">형태로 여러 줄</text>

  <!-- ③ 빈 줄 -->
  <rect x="24" y="200" width="400" height="52" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="48" y="232" font-size="18" font-weight="bold" fill="#92400e">(빈 줄)</text>
  <text x="120" y="231" font-size="16" fill="#92400e">← 헤더 끝을 알리는 CRLF</text>

  <text x="452" y="232" font-size="17" font-weight="bold" fill="#b45309">이 빈 줄이 구분자다</text>

  <!-- ④ 본문 -->
  <rect x="24" y="252" width="400" height="64" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="48" y="290" font-size="18" font-weight="bold" fill="#1f2937">본문 (Body)</text>

  <text x="452" y="290" font-size="16" fill="#374151">없을 수도 있다</text>
</svg>
