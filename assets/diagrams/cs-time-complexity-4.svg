<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">점근 표기법의 상한과 하한</title>
  <desc id="d">n이 n₀ 이상인 구간에서 알고리즘의 실제 비용 f(n)은 위로 c₁·g(n)(O, 상한)을 넘지 않고 아래로 c₂·g(n)(Ω, 하한) 밑으로 내려가지 않는다. n₀ 이전 구간은 신경 쓰지 않는다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- n < n0 구간: 신경 쓰지 않음 -->
  <rect x="111" y="58" width="165" height="341" fill="#f3f4f6"/>
  <text x="193.5" y="82" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">n &lt; n₀</text>
  <text x="193.5" y="106" font-size="15" fill="#4b5563" text-anchor="middle">신경 쓰지 않는다</text>

  <!-- n >= n0 구간: 두 곡선 사이 띠 -->
  <polygon points="276,328.3 293.8,316.5 311.5,304.1 329.3,291.1 347,277.7 364.8,263.7 382.5,249.2 400.3,234.2 418,218.8 435.8,202.9 453.5,186.6 471.3,169.8 489,152.7 506.8,135.1 524.5,117.1 542.3,98.7 560,80 560,270 542.3,277.6 524.5,285.1 506.8,292.4 489,299.5 471.3,306.5 453.5,313.3 435.8,319.9 418,326.4 400.3,332.6 382.5,338.7 364.8,344.6 347,350.3 329.3,355.8 311.5,361 293.8,366.1 276,370.9" fill="#e0e7ff" fill-opacity="0.55"/>
  <text x="372" y="82" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">n ≥ n₀</text>
  <text x="372" y="106" font-size="15" fill="#374151" text-anchor="middle">이 지점 이후로만 성립</text>

  <!-- n0 경계 -->
  <line x1="276" y1="58" x2="276" y2="400" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 곡선 -->
  <path d="M110,400 L128.8,398.9 L147.5,396.9 L166.3,394.3 L185,391.2 L203.8,387.6 L222.5,383.8 L241.3,379.5 L260,375 L278.8,370.1 L297.5,365 L316.3,359.7 L335,354 L353.8,348.2 L372.5,342.1 L391.3,335.8 L410,329.2 L428.8,322.5 L447.5,315.6 L466.3,308.4 L485,301.1 L503.8,293.6 L522.5,285.9 L541.3,278 L560,270" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="9 5"/>
  <path d="M110,400 L128.8,397.3 L147.5,392.3 L166.3,385.9 L185,378.2 L203.8,369.6 L222.5,360 L241.3,349.6 L260,338.4 L278.8,326.5 L297.5,313.9 L316.3,300.7 L335,286.9 L353.8,272.4 L372.5,257.4 L391.3,241.9 L410,225.8 L428.8,209.2 L447.5,192.2 L466.3,174.6 L485,156.6 L503.8,138.1 L522.5,119.2 L541.3,99.8 L560,80" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="9 5"/>
  <path d="M110,374 L128.8,372.3 L147.5,369.1 L166.3,365 L185,360.1 L203.8,354.6 L222.5,348.5 L241.3,341.9 L260,334.7 L278.8,327.2 L297.5,319.1 L316.3,310.7 L335,301.9 L353.8,292.7 L372.5,283.1 L391.3,273.2 L410,263 L428.8,252.4 L447.5,241.5 L466.3,230.3 L485,218.8 L503.8,207 L522.5,195 L541.3,182.6 L560,170" fill="none" stroke="#111827" stroke-width="3.5"/>

  <!-- 축 -->
  <line x1="110" y1="400" x2="110" y2="52" stroke="#374151" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="110" y1="400" x2="606" y2="400" stroke="#374151" stroke-width="2" marker-end="url(#ax)"/>
  <text x="110" y="38" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">실행 비용</text>
  <text x="620" y="406" font-size="18" font-weight="bold" font-style="italic" fill="#1f2937">n</text>
  <text x="276" y="426" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">n₀</text>

  <!-- 곡선 이름 -->
  <text x="576" y="86" font-size="17" font-weight="bold" fill="#1d4ed8">c₁·g(n)</text>
  <text x="576" y="108" font-size="15" fill="#1d4ed8"><tspan font-weight="bold">O</tspan> : 이 위로는 못 올라감</text>

  <text x="576" y="176" font-size="17" font-weight="bold" fill="#111827">f(n)</text>
  <text x="576" y="198" font-size="15" fill="#111827">알고리즘의 실제 비용</text>

  <text x="576" y="276" font-size="17" font-weight="bold" fill="#6d28d9">c₂·g(n)</text>
  <text x="576" y="298" font-size="15" fill="#6d28d9"><tspan font-weight="bold">Ω</tspan> : 이 아래로는 안 내려감</text>

  <!-- Θ -->
  <rect x="576" y="318" width="264" height="58" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="590" y="342" font-size="15" fill="#1f2937">위아래로 같은 곡선 g(n)에 끼임</text>
  <text x="590" y="365" font-size="15" fill="#1f2937">= O와 Ω 동시 만족 → <tspan font-weight="bold">Θ(g(n))</tspan></text>
</svg>
