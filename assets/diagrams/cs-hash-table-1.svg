<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">키가 해시 함수를 거쳐 버킷에 놓이는 과정</title>
  <desc id="d">"alice@ex.com"은 hash() % 8을 거쳐 인덱스 3, "bob@ex.com"은 인덱스 6이 되어 크기 8인 버킷 배열의 해당 칸에 곧장 놓인다. 인덱스 계산 한 번과 배열 접근 한 번이 평균 O(1)의 이유다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="124" y="46" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">key</text>
  <text x="360" y="46" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">해시 함수</text>
  <text x="520" y="46" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">인덱스</text>
  <text x="660" y="46" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">버킷 배열</text>

  <!-- 버킷 배열 (8칸: 0~7) -->
  <rect x="600" y="70" width="120" height="40" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600" y="110" width="120" height="40" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600" y="150" width="120" height="40" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600" y="190" width="120" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="600" y="230" width="120" height="40" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600" y="270" width="120" height="40" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="600" y="310" width="120" height="40" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <rect x="600" y="350" width="120" height="40" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="660" y="216" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">alice</text>
  <text x="660" y="336" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">bob</text>
  <!-- 칸 번호 -->
  <text x="736" y="96" font-size="15" fill="#4b5563">0</text>
  <text x="736" y="136" font-size="15" fill="#4b5563">1</text>
  <text x="736" y="176" font-size="15" fill="#4b5563">2</text>
  <text x="736" y="216" font-size="15" font-weight="bold" fill="#1d4ed8">3</text>
  <text x="736" y="256" font-size="15" fill="#4b5563">4</text>
  <text x="736" y="296" font-size="15" fill="#4b5563">5</text>
  <text x="736" y="336" font-size="15" font-weight="bold" fill="#6d28d9">6</text>
  <text x="736" y="376" font-size="15" fill="#4b5563">7</text>

  <!-- alice 경로 (인덱스 3) -->
  <rect x="24" y="188" width="200" height="44" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="124" y="215" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"alice@ex.com"</text>
  <line x1="226" y1="210" x2="268" y2="210" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="272" y="188" width="176" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="215" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash() % 8</text>
  <line x1="450" y1="210" x2="494" y2="210" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <circle cx="520" cy="210" r="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="520" y="217" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">3</text>
  <line x1="544" y1="210" x2="596" y2="210" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- bob 경로 (인덱스 6) -->
  <rect x="24" y="308" width="200" height="44" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="124" y="335" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"bob@ex.com"</text>
  <line x1="226" y1="330" x2="268" y2="330" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <rect x="272" y="308" width="176" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="335" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash() % 8</text>
  <line x1="450" y1="330" x2="494" y2="330" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <circle cx="520" cy="330" r="22" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="520" y="337" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">6</text>
  <line x1="544" y1="330" x2="596" y2="330" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>

  <!-- 요점 -->
  <rect x="24" y="414" width="832" height="44" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="440" y="442" font-size="16" fill="#111827" text-anchor="middle">키가 아무리 길어도 <tspan font-weight="bold">인덱스 계산 1번 + 배열 접근 1번</tspan> → <tspan font-weight="bold" fill="#1d4ed8">평균 O(1)</tspan></text>
</svg>
