<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">워터폴로 읽기</title>
  <desc id="d">분산 트레이싱의 스팬 워터폴 다이어그램. 각 서비스 호출의 계층 구조와 소요 시간을 시각화한다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M5,10 L0,0 L10,0 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Timeline Grid Lines -->
  <!-- 0ms -> x=310, 1000ms -> x=460, 2000ms -> x=610, 2800ms -> x=730 -->
  <g stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="310" y1="50" x2="310" y2="320"/>
    <line x1="460" y1="50" x2="460" y2="320"/>
    <line x1="610" y1="50" x2="610" y2="320"/>
    <line x1="730" y1="50" x2="730" y2="320"/>
  </g>

  <!-- Timeline Labels -->
  <g font-size="12" fill="#52606d" font-weight="bold">
    <text x="310" y="40" text-anchor="middle">0ms</text>
    <text x="460" y="40" text-anchor="middle">1000ms</text>
    <text x="610" y="40" text-anchor="middle">2000ms</text>
    <text x="730" y="40" text-anchor="middle">2800ms</text>
  </g>

  <!-- Tree Guide Lines -->
  <g stroke="#9aa5b1" stroke-width="1.5" fill="none">
    <!-- Root line at left of Gateway -->
    <path d="M 24,78 L 24,312"/>
    <path d="M 24,78 L 38,78"/>
    
    <!-- order-service branch -->
    <path d="M 24,114 L 62,114 L 62,238"/>
    
    <!-- order-service children branches -->
    <path d="M 62,150 L 80,150"/>
    <path d="M 62,186 L 80,186"/>
    <path d="M 62,222 L 80,222"/>

    <!-- payment children branches -->
    <path d="M 82,222 L 100,222 L 100,294"/>
    <path d="M 100,258 L 118,258"/>
    <path d="M 100,294 L 118,294"/>
  </g>

  <!-- Span Rows -->

  <!-- Row 1: Gateway -->
  <g>
    <text x="42" y="82.55" font-size="13" fill="#1f2933" font-weight="bold">Gateway</text>
    <rect x="310" y="68" width="420" height="20" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="742" y="82.55" font-size="13" fill="#1f2933" font-weight="bold">2800ms</text>
  </g>

  <!-- Row 2: order-service -->
  <g>
    <text x="66" y="118.55" font-size="13" fill="#1f2933" font-weight="bold">order-service</text>
    <rect x="312" y="104" width="414" height="20" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="742" y="118.55" font-size="13" fill="#1f2933" font-weight="bold">2760ms</text>
  </g>

  <!-- Row 3: inventory -->
  <g>
    <text x="84" y="154.55" font-size="13" fill="#1f2933">inventory</text>
    <rect x="313" y="140" width="8" height="20" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="742" y="154.55" font-size="13" fill="#52606d">15ms</text>
  </g>

  <!-- Row 4: pricing -->
  <g>
    <text x="84" y="190.55" font-size="13" fill="#1f2933">pricing</text>
    <rect x="316" y="176" width="12" height="20" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="742" y="190.55" font-size="13" fill="#52606d">28ms</text>
  </g>

  <!-- Row 5: payment -->
  <g>
    <text x="84" y="226.55" font-size="13" fill="#1f2933" font-weight="bold">payment</text>
    <rect x="320" y="212" width="402" height="20" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="742" y="226.55" font-size="13" fill="#1f2933" font-weight="bold">2680ms</text>
  </g>

  <!-- Row 6: db:SELECT -->
  <g>
    <text x="122" y="262.55" font-size="13" fill="#1f2933">db:SELECT</text>
    <rect x="321" y="248" width="6" height="20" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="742" y="262.55" font-size="13" fill="#52606d">8ms</text>
  </g>

  <!-- Row 7: HTTP POST /pg -->
  <g>
    <text x="122" y="298.55" font-size="13" fill="#dc2626" font-weight="bold">HTTP POST /pg</text>
    <rect x="323" y="284" width="397" height="20" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="742" y="298.55" font-size="13" fill="#dc2626" font-weight="bold">2650ms</text>
  </g>

  <!-- Highlight Arrow & Annotation -->
  <g>
    <!-- Arrow pointing up to the HTTP POST /pg bar/duration area -->
    <line x1="700" y1="340" x2="700" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="700" y="360.025" font-size="11.5" fill="#dc2626" font-weight="bold" text-anchor="middle">여기서 2.65초</text>
  </g>
</svg>