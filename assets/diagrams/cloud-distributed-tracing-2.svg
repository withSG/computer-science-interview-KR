<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">워터폴로 읽는 스팬 트리</title>
  <desc id="d">0ms부터 2800ms까지의 시간축 위에 Gateway 2800ms, order-service 2760ms, inventory 15ms, pricing 28ms, payment 2680ms, db:SELECT 8ms, HTTP POST /pg 2650ms 스팬을 트리 들여쓰기로 놓았다. HTTP POST /pg 구간이 2.65초를 차지한다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 시간 축 -->
  <text x="260" y="36" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">0ms</text>
  <text x="442.1" y="36" font-size="15" fill="#374151" text-anchor="middle">1000ms</text>
  <text x="624.3" y="36" font-size="15" fill="#374151" text-anchor="middle">2000ms</text>
  <text x="770" y="36" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">2800ms</text>
  <line x1="260" y1="48" x2="770" y2="48" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="260" y1="44" x2="260" y2="386" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="442.1" y1="44" x2="442.1" y2="386" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="624.3" y1="44" x2="624.3" y2="386" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="770" y1="44" x2="770" y2="386" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="442.1" y1="44" x2="442.1" y2="52" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="624.3" y1="44" x2="624.3" y2="52" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="770" y1="44" x2="770" y2="52" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 트리 연결선 -->
  <path d="M32,98 V133 H44" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M58,146 V271 H70 M58,179 H70 M58,225 H70" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M84,284 V363 H96 M84,317 H96" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Gateway 0–2800 -->
  <text x="24" y="92.5" font-size="16" font-weight="bold" fill="#111827">Gateway</text>
  <rect x="260" y="75" width="510" height="24" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="856" y="92.5" font-size="16" fill="#111827" text-anchor="end">2800ms</text>

  <!-- order-service 20–2780 -->
  <text x="50" y="138.5" font-size="16" font-weight="bold" fill="#111827">order-service</text>
  <rect x="263.6" y="121" width="502.7" height="24" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="856" y="138.5" font-size="16" fill="#111827" text-anchor="end">2760ms</text>

  <!-- inventory 20–35 -->
  <text x="76" y="184.5" font-size="16" fill="#111827">inventory</text>
  <rect x="263.6" y="167" width="2.8" height="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="856" y="184.5" font-size="16" fill="#111827" text-anchor="end">15ms</text>

  <!-- pricing 35–63 -->
  <text x="76" y="230.5" font-size="16" fill="#111827">pricing</text>
  <rect x="266.4" y="213" width="5.1" height="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="856" y="230.5" font-size="16" fill="#111827" text-anchor="end">28ms</text>

  <!-- payment 100–2780 -->
  <text x="76" y="276.5" font-size="16" font-weight="bold" fill="#111827">payment</text>
  <rect x="278.2" y="259" width="488.1" height="24" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="856" y="276.5" font-size="16" fill="#111827" text-anchor="end">2680ms</text>

  <!-- db:SELECT 105–113 -->
  <text x="102" y="322.5" font-size="16" fill="#111827">db:SELECT</text>
  <rect x="279.1" y="305" width="3" height="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="856" y="322.5" font-size="16" fill="#111827" text-anchor="end">8ms</text>

  <!-- HTTP POST /pg 125–2775 -->
  <text x="102" y="368.5" font-size="16" font-weight="bold" fill="#b91c1c">HTTP POST /pg</text>
  <rect x="282.8" y="351" width="482.7" height="24" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="856" y="368.5" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="end">2650ms</text>

  <!-- 여기서 2.65초 -->
  <path d="M282.8,382 V394 H765.5 V382" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <line x1="524" y1="394" x2="524" y2="402" stroke="#b91c1c" stroke-width="2"/>
  <text x="524" y="426" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">여기서 2.65초</text>
</svg>
