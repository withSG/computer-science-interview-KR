<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JVM 구조</title>
  <desc id="d">JVM의 구성 요소인 Class Loader, Runtime Data Area, Execution Engine의 구조를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Outer Container: JVM -->
  <rect x="24" y="24" width="832" height="452" rx="12" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <rect x="24" y="24" width="832" height="44" rx="12" fill="#eff6ff"/>
  <!-- Corner correction for header rect bottom edge -->
  <rect x="24" y="56" width="832" height="12" fill="#eff6ff"/>
  <line x1="24" y1="68" x2="856" y2="68" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="51" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">JVM</text>

  <!-- 1. Class Loader Section -->
  <rect x="48" y="88" width="784" height="84" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="117" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Class Loader</text>
  <text x="440" y="147" font-size="13" fill="#52606d" text-anchor="middle">(Bootstrap → Extension → Application)</text>

  <!-- 2. Runtime Data Area Section -->
  <rect x="48" y="192" width="784" height="172" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="219" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Runtime Data Area</text>

  <!-- Runtime Data Area Inner Boxes -->
  <!-- Box 1: Method Area -->
  <rect x="68" y="236" width="232" height="108" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="184" y="283" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Method</text>
  <text x="184" y="303" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Area</text>

  <!-- Box 2: Heap -->
  <rect x="324" y="236" width="232" height="108" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="293" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Heap</text>

  <!-- Box 3: PC Register, JVM Stack, Native Method -->
  <rect x="580" y="236" width="232" height="108" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="696" y="268" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">PC Register</text>
  <text x="696" y="293" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">JVM Stack</text>
  <text x="696" y="318" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Native Method</text>

  <!-- 3. Execution Engine Section -->
  <rect x="48" y="384" width="784" height="72" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="411" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Execution Engine</text>
  <text x="440" y="437" font-size="13" fill="#52606d" text-anchor="middle">(Interpreter, JIT Compiler, GC)</text>
</svg>