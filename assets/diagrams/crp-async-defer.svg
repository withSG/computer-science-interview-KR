<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기본, async, defer 스크립트의 파싱·다운로드·실행 타임라인 비교</title>
  <desc id="d">기본, async, defer 속성에 따른 HTML 파싱, 스크립트 다운로드, 스크립트 실행 시점과 DOMContentLoaded 이벤트 간의 관계를 보여주는 타임라인 다이어그램입니다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="42" font-size="17" font-weight="600" fill="#1f2933">기본 / async / defer 스크립트 실행 타임라인</text>
  <text x="40" y="64" font-size="11.5" fill="#52606d">스크립트 속성에 따른 HTML 파싱 차단 여부 및 실행 시점 비교</text>

  <!-- Legend -->
  <rect x="520" y="28" width="320" height="40" fill="#f8fafc" rx="4" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="532" y="43" width="14" height="10" fill="#2563eb" rx="2"/>
  <text x="550" y="52" font-size="11" fill="#1f2933">HTML 파싱</text>
  
  <rect x="625" y="43" width="14" height="10" fill="#d97706" rx="2"/>
  <text x="643" y="52" font-size="11" fill="#1f2933">다운로드</text>

  <rect x="710" y="43" width="14" height="10" fill="#dc2626" rx="2"/>
  <text x="728" y="52" font-size="11" fill="#1f2933">실행</text>

  <!-- Main Timeline Grid / Track Structure -->
  <!-- Header Axis -->
  <line x1="200" y1="100" x2="800" y2="100" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <text x="800" y="90" font-size="11.5" font-weight="600" fill="#1f2933" text-anchor="end">시간 (Time)</text>

  <!-- Vertical Milestone Guidelines -->
  <!-- t1: Script discovered (x=270) -->
  <line x1="270" y1="100" x2="270" y2="400" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="270" y="90" font-size="11" fill="#52606d" text-anchor="middle">스크립트 발견</text>

  <!-- t2: Download finished for async (x=450) -->
  <line x1="450" y1="100" x2="450" y2="400" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- t3: HTML Parsing complete (x=630) -->
  <line x1="630" y1="100" x2="630" y2="400" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="630" y="90" font-size="11" fill="#52606d" text-anchor="middle">DOM 파싱 완료</text>

  <!-- t4: DOMContentLoaded event line (x=730) -->
  <line x1="730" y1="100" x2="730" y2="400" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M730,105 L730,400" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a-purple)"/>
  <rect x="662" y="105" width="136" height="18" fill="#ffffff" rx="2"/>
  <text x="730" y="118" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">DOMContentLoaded</text>

  <!-- LANE 1: 기본 (Default Script) -->
  <rect x="40" y="130" width="800" height="80" fill="#f8fafc" rx="6" stroke="#cbd2d9" stroke-width="1"/>
  <text x="55" y="162" font-size="14" font-weight="600" fill="#1f2933">기본</text>
  <text x="55" y="182" font-size="11" fill="#52606d">&lt;script src="..."&gt;</text>

  <!-- Lane 1 Tracks -->
  <!-- HTML Parsing Part 1 -->
  <rect x="200" y="150" width="70" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="235" y="164" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">HTML 파싱</text>
  
  <!-- Paused indicator -->
  <rect x="270" y="138" width="180" height="16" fill="#fef2f2" rx="2"/>
  <text x="360" y="150" font-size="11" fill="#dc2626" font-weight="500" text-anchor="middle">파싱 중단 (파서 차단)</text>

  <!-- Download -->
  <rect x="270" y="158" width="100" height="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="3"/>
  <text x="320" y="172" font-size="11.5" font-weight="500" fill="#d97706" text-anchor="middle">다운로드</text>

  <!-- Execution -->
  <rect x="370" y="158" width="80" height="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="3"/>
  <text x="410" y="172" font-size="11.5" font-weight="500" fill="#dc2626" text-anchor="middle">실행</text>

  <!-- HTML Parsing Part 2 -->
  <rect x="450" y="150" width="180" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="540" y="164" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">HTML 파싱 재개</text>


  <!-- LANE 2: async Script -->
  <rect x="40" y="220" width="800" height="80" fill="#f8fafc" rx="6" stroke="#cbd2d9" stroke-width="1"/>
  <text x="55" y="252" font-size="14" font-weight="600" fill="#1f2933">async</text>
  <text x="55" y="272" font-size="11" fill="#52606d">&lt;script async&gt;</text>

  <!-- Lane 2 Tracks -->
  <!-- HTML Parsing Part 1 (Parallel with Download) -->
  <rect x="200" y="238" width="250" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="325" y="252" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">HTML 파싱 (병행)</text>

  <!-- Download (Parallel) -->
  <rect x="270" y="264" width="180" height="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="3"/>
  <text x="360" y="278" font-size="11.5" font-weight="500" fill="#d97706" text-anchor="middle">다운로드 (병행)</text>

  <!-- Execution (Interrupts) -->
  <rect x="450" y="238" width="80" height="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="3"/>
  <text x="490" y="252" font-size="11.5" font-weight="500" fill="#dc2626" text-anchor="middle">실행</text>
  
  <text x="490" y="278" font-size="11" fill="#dc2626" text-anchor="middle">다운로드 즉시 실행</text>

  <!-- HTML Parsing Part 2 -->
  <rect x="530" y="238" width="100" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="580" y="252" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">HTML 파싱</text>


  <!-- LANE 3: defer Script -->
  <rect x="40" y="310" width="800" height="80" fill="#f8fafc" rx="6" stroke="#cbd2d9" stroke-width="1"/>
  <text x="55" y="342" font-size="14" font-weight="600" fill="#1f2933">defer</text>
  <text x="55" y="362" font-size="11" fill="#52606d">&lt;script defer&gt;</text>

  <!-- Lane 3 Tracks -->
  <!-- HTML Parsing Uninterrupted -->
  <rect x="200" y="328" width="430" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="415" y="342" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">HTML 파싱 중단 없이 진행</text>

  <!-- Download (Parallel) -->
  <rect x="270" y="354" width="230" height="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="3"/>
  <text x="385" y="368" font-size="11.5" font-weight="500" fill="#d97706" text-anchor="middle">다운로드 (병행)</text>

  <!-- Execution (Post-Parsing, Pre-DOMContentLoaded) -->
  <rect x="630" y="328" width="80" height="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="3"/>
  <text x="670" y="342" font-size="11.5" font-weight="500" fill="#dc2626" text-anchor="middle">실행</text>
  <text x="670" y="368" font-size="11" fill="#059669" font-weight="500" text-anchor="middle">DOMContentLoaded 전 실행</text>


  <!-- Summary Box / Conclusion Banner -->
  <rect x="40" y="410" width="800" height="50" fill="#ecfdf5" rx="6" stroke="#059669" stroke-width="1.5"/>
  <text x="55" y="432" font-size="13" font-weight="600" fill="#059669">요약 및 권장사항:</text>
  <text x="55" y="449" font-size="11.5" fill="#1f2933">· DOM 조작 및 타 스크립트 의존 시 <tspan font-weight="600" fill="#059669">defer</tspan> 사용 (파싱 완료 후 순서대로 실행 보장)</text>
  <text x="480" y="449" font-size="11.5" fill="#1f2933">· 독립적인 분석 태그 등은 <tspan font-weight="600" fill="#d97706">async</tspan> 사용 (다운로드 완료 즉시 실행)</text>

  <!-- Caption Footer -->
  <text x="440" y="485" font-size="11.5" fill="#52606d" text-anchor="middle">결론: defer는 HTML 파싱을 차단하지 않고 DOMContentLoaded 직전에 순서대로 실행되므로 가장 안전한 기본값입니다.</text>
</svg>