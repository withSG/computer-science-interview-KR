<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">공유 데이터베이스 안티패턴</title>
  <desc id="d">주문·재고·배송 서비스는 나눴지만 하나의 공유 DB를 함께 쓴다. 재고 서비스가 테이블 컬럼 하나를 바꾸면 주문·배송 서비스가 동시에 깨져 독립 배포가 불가능한 분산된 모놀리식이 된다.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- 캡션 -->
  <rect x="40" y="24" width="88" height="30" rx="6" fill="#b91c1c"/>
  <text x="84" y="45" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">안티패턴</text>
  <text x="142" y="46" font-size="20" font-weight="bold" fill="#111827">서비스는 나눴는데 DB는 하나</text>

  <!-- 서비스 3개 -->
  <rect x="40" y="84" width="260" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="170" y="111" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">주문 서비스</text>
  <text x="170" y="136" font-size="15" fill="#b91c1c" text-anchor="middle">동시에 깨짐</text>

  <rect x="40" y="168" width="260" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="170" y="195" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">재고 서비스</text>
  <text x="170" y="220" font-size="15" fill="#92400e" text-anchor="middle">테이블 컬럼 하나 변경</text>

  <rect x="40" y="252" width="260" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="170" y="279" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">배송 서비스</text>
  <text x="170" y="304" font-size="15" fill="#b91c1c" text-anchor="middle">동시에 깨짐</text>

  <!-- 모두 같은 DB로 -->
  <path d="M304,116 L522,176" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <path d="M304,200 L522,202" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <path d="M304,284 L522,228" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>

  <!-- 하나의 공유 DB (원통) -->
  <path d="M530,136 L530,266 A150,22 0 0 0 830,266 L830,136 Z" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="680" cy="136" rx="150" ry="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="680" y="222" font-size="22" font-weight="bold" fill="#b91c1c" text-anchor="middle">하나의 공유 DB</text>

  <!-- 결과 -->
  <rect x="40" y="342" width="800" height="104" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="372" font-size="16" fill="#1f2937" text-anchor="middle">재고 서비스가 테이블 컬럼 하나를 바꾸면 → 주문·배송 서비스가 동시에 깨진다 → 독립 배포 불가</text>
  <text x="440" y="400" font-size="16" fill="#1f2937" text-anchor="middle">서비스를 나눈 이유는 사라지고, 네트워크 호출 비용만 새로 생긴다</text>
  <text x="440" y="430" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">DB를 공유하는 순간 서비스가 아니라 그냥 분산된 모놀리식</text>
</svg>
