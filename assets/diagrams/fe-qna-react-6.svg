<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FLUX 단방향 데이터 흐름</title>
  <desc id="d">Action에서 Dispatcher, Store, View 순서로 한 방향으로만 흐르고, View에서 사용자 인터랙션이 일어나면 다시 Action부터 시작하는 순환 구조.</desc>
  <rect width="880" height="250" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <text x="44" y="40" font-size="15" fill="#4b5563">단방향 데이터 흐름 · 순환 구조</text>

  <!-- 1. Action -->
  <rect x="44" y="62" width="156" height="68" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="122" y="103" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Action</text>

  <path d="M204,96 L252,96" stroke="#1e3a8a" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- 2. Dispatcher -->
  <rect x="256" y="62" width="156" height="68" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="334" y="103" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Dispatcher</text>

  <path d="M416,96 L464,96" stroke="#1e3a8a" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- 3. Store -->
  <rect x="468" y="62" width="156" height="68" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="546" y="103" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Store</text>

  <path d="M628,96 L676,96" stroke="#1e3a8a" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- 4. View -->
  <rect x="680" y="62" width="156" height="68" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="758" y="103" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">View</text>

  <!-- 되돌아가는 경로: View → (사용자 인터랙션) → Action 다시 시작 -->
  <path d="M758,132 L758,206 L122,206 L122,136" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ah-amber)"/>
  <text x="744" y="176" font-size="16" font-weight="bold" fill="#b45309" text-anchor="end">사용자 인터랙션</text>
  <text x="136" y="176" font-size="16" font-weight="bold" fill="#b45309">Action (다시 시작)</text>
</svg>
