<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">'use client' 경계 위치 비교</title>
  <desc id="d">'use client'를 최상위 Layout에 두면 import로 이어진 Sidebar, PostList, LikeButton까지 전부 클라이언트 번들에 들어가고, 말단인 LikeButton에 두면 나머지는 서버에 남고 LikeButton만 번들에 들어간다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- ───── 왼쪽: 경계를 위에 두면 ───── -->
  <rect x="24" y="24" width="408" height="432" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="58" font-size="18" font-weight="bold" fill="#111827">경계를 위에 두면</text>

  <text x="44" y="93" font-size="14" font-weight="bold" fill="#b45309">경계</text>
  <line x1="80" y1="88" x2="416" y2="88" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>

  <rect x="56" y="108" width="200" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="156" y="131" font-size="14" fill="#9a3412" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">'use client'</text>
  <text x="156" y="153" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Layout</text>

  <line x1="156" y1="164" x2="156" y2="195" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="56" y="200" width="200" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="156" y="234" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Sidebar</text>

  <line x1="156" y1="256" x2="156" y2="287" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="56" y="292" width="200" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="156" y="326" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">PostList</text>

  <line x1="156" y1="348" x2="156" y2="379" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="56" y="384" width="200" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="156" y="418" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">LikeButton</text>

  <path d="M270,108 H280 V440 H270" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="292" y="280" font-size="16" font-weight="bold" fill="#b45309">전부 번들에 포함</text>

  <!-- ───── 오른쪽: 경계를 아래에 두면 ───── -->
  <rect x="448" y="24" width="408" height="432" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="468" y="58" font-size="18" font-weight="bold" fill="#111827">경계를 아래에 두면</text>

  <rect x="480" y="108" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="580" y="142" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Layout</text>
  <text x="696" y="141" font-size="15" fill="#374151">(서버)</text>

  <line x1="580" y1="164" x2="580" y2="195" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="480" y="200" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="580" y="234" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Sidebar</text>
  <text x="696" y="233" font-size="15" fill="#374151">(서버)</text>

  <line x1="580" y1="256" x2="580" y2="287" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="480" y="292" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="580" y="326" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">PostList</text>
  <text x="696" y="325" font-size="15" fill="#374151">(서버)</text>

  <text x="464" y="371" font-size="14" font-weight="bold" fill="#b45309">경계</text>
  <line x1="500" y1="366" x2="840" y2="366" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="580" y1="348" x2="580" y2="379" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="480" y="384" width="200" height="56" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="580" y="407" font-size="14" fill="#9a3412" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">'use client'</text>
  <text x="580" y="429" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">LikeButton</text>

  <path d="M694,384 H704 V440 H694" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="716" y="418" font-size="16" font-weight="bold" fill="#b45309">이것만 번들에</text>

  <!-- 범례 -->
  <rect x="44" y="474" width="18" height="18" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="70" y="489" font-size="15" fill="#111827">클라이언트 번들에 포함</text>
  <rect x="256" y="474" width="18" height="18" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="282" y="489" font-size="15" fill="#111827">서버</text>
  <line x1="340" y1="483" x2="370" y2="483" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="378" y="489" font-size="15" fill="#111827">'use client' 경계 — 그 파일부터 import로 이어지는 모듈이 번들에</text>

  <!-- 규칙 -->
  <rect x="24" y="508" width="832" height="48" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="44" y="538" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#92400e">규칙</tspan><tspan dx="14">'use client'는</tspan> 트리의 가능한 한 말단(leaf)에 두어 클라이언트 JS 번들 크기를 최적화</text>
</svg>
