<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">use client 모듈 경계 위치에 따른 클라이언트 번들 포함 범위 비교</title>
  <desc id="d">경계를 위에 둘 때 전체 컴포넌트가 번들에 포함되는 안티패턴과, 경계를 아래에 두어 LikeButton만 번들에 포함되는 올바른 패턴을 비교하는 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title / Heading -->
  <text x="440" y="36" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">3.2 'use client'는 컴포넌트 표시가 아니라 모듈 경계다</text>

  <!-- Left Column Area (비효율적인 경계 설정) -->
  <rect x="30" y="60" width="395" height="385" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="227" y="90" fill="#dc2626" font-size="16" font-weight="bold" text-anchor="middle">경계를 위에 두면</text>
  <line x1="50" y1="102" x2="405" y2="102" stroke="#dc2626" stroke-width="1"/>

  <!-- Left Nodes -->
  <rect x="110" y="120" width="235" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="227" y="147" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">['use client'] Layout</text>

  <path d="M227,164 L227,190" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="130" y="190" width="195" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="227" y="217" fill="#dc2626" font-size="13" text-anchor="middle">Sidebar</text>

  <path d="M227,234 L227,260" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="130" y="260" width="195" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="227" y="287" fill="#dc2626" font-size="13" text-anchor="middle">PostList</text>

  <path d="M227,304 L227,330" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <rect x="130" y="330" width="195" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="227" y="357" fill="#dc2626" font-size="13" text-anchor="middle">LikeButton</text>

  <!-- Left Annotation Note -->
  <path d="M60,400 L118,400" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="122" y="388" width="130" height="24" fill="#ffffff" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="187" y="404" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle">→ 전부 번들에 포함</text>


  <!-- Right Column Area (권장되는 경계 설정) -->
  <rect x="455" y="60" width="395" height="385" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="652" y="90" fill="#059669" font-size="16" font-weight="bold" text-anchor="middle">경계를 아래에 두면</text>
  <line x1="475" y1="102" x2="830" y2="102" stroke="#059669" stroke-width="1"/>

  <!-- Right Nodes -->
  <rect x="520" y="120" width="170" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="605" y="147" fill="#1f2933" font-size="13" text-anchor="middle">Layout</text>
  <text x="715" y="147" fill="#52606d" font-size="12.5" font-weight="bold">(서버)</text>

  <path d="M605,164 L605,190" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="520" y="190" width="170" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="605" y="217" fill="#1f2933" font-size="13" text-anchor="middle">Sidebar</text>
  <text x="715" y="217" fill="#52606d" font-size="12.5" font-weight="bold">(서버)</text>

  <path d="M605,234 L605,260" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="520" y="260" width="170" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="605" y="287" fill="#1f2933" font-size="13" text-anchor="middle">PostList</text>
  <text x="715" y="287" fill="#52606d" font-size="12.5" font-weight="bold">(서버)</text>

  <path d="M605,304 L605,330" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="485" y="330" width="240" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="605" y="357" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">['use client'] LikeButton</text>

  <!-- Right Annotation Note -->
  <path d="M733" y1="352" x2="743" y2="352" stroke="#059669" stroke-width="1.5" fill="none"/>
  <text x="748" y="356" fill="#059669" font-size="12" font-weight="bold">← 이것만 번들에</text>

  <!-- Footer / Legend -->
  <rect x="30" y="455" width="820" height="35" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="477" fill="#52606d" font-size="11.5" text-anchor="middle">규칙: 'use client'는 트리의 가능한 한 말단(leaf)에 두어 클라이언트 JS 번들 크기를 최적화합니다.</text>
</svg>