<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">absolute 배지의 기준점</title>
  <desc id="d">.badge가 position:absolute; top:0; right:0일 때, .card에 position: relative가 있으면 배지는 카드의 오른쪽 위에 붙고, relative를 빼면 페이지 전체의 오른쪽 위로 날아간다.</desc>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 공통 badge 규칙 -->
  <rect x="24" y="20" width="832" height="48" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <text x="440" y="50" font-size="17" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.badge { position:absolute; top:0; right:0 }</text>

  <!-- 칸 구분선 -->
  <line x1="432" y1="88" x2="432" y2="420" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ───── 왼쪽: .card에 relative가 있을 때 ───── -->
  <text x="40" y="104" font-size="17" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.card { position: relative }</text>
  <rect x="40" y="120" width="368" height="256" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="64" y="160" width="220" height="176" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="174" y="254" font-size="16" fill="#374151" text-anchor="middle">상품 이미지</text>
  <rect x="344" y="120" width="64" height="36" fill="#b91c1c"/>
  <text x="376" y="144" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">NEW</text>
  <text x="224" y="408" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="700" fill="#1d4ed8">기준점: .card</tspan> → 카드 오른쪽 위에 붙음</text>

  <!-- ───── 오른쪽: relative를 뺐을 때 ───── -->
  <text x="456" y="104" font-size="17" font-weight="700" fill="#b91c1c">.card에서 relative를 빼면</text>
  <rect x="456" y="120" width="400" height="256" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="472" y="146" font-size="15" font-weight="700" fill="#4b5563">페이지 전체</text>
  <rect x="488" y="176" width="272" height="168" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="504" y="200" font-size="15" font-weight="700" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.card</text>
  <rect x="504" y="212" width="160" height="116" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="584" y="276" font-size="16" fill="#374151" text-anchor="middle">상품 이미지</text>
  <!-- 원래 자리(빈 점선) → 페이지 오른쪽 위 -->
  <rect x="696" y="176" width="64" height="36" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M728,172 Q736,140 782,139" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="792" y="120" width="64" height="36" fill="#b91c1c"/>
  <text x="824" y="144" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">NEW</text>
  <text x="656" y="408" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">페이지 전체의 오른쪽 위로 날아간다</text>
</svg>
