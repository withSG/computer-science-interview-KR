<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">다섯 값의 기준점 - position relative와 absolute 예시</title>
  <desc id="d">.card 요소가 position relative일 때 position absolute인 .badge 요소가 오른쪽 위에 위치하며, relative가 없으면 badge가 페이지 전체 오른쪽 위로 날아간다는 안내 다이어그램입니다.</desc>
  
  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커 (주황/경고 색상) -->
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- .card 박스 (기준점/부모 영역) -->
  <rect x="40" y="40" width="410" height="240" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  
  <!-- .card 라벨 -->
  <text x="56" y="68" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="start">.card { position: relative }</text>

  <!-- 상품 이미지 영역 (내부 이미지 구획) -->
  <rect x="70" y="100" width="220" height="150" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="180" y="180" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">상품 이미지</text>

  <!-- .badge 박스 (Positioned 자식) -->
  <rect x="330" y="40" width="120" height="60" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <!-- .badge 내부 "NEW" 박스 -->
  <rect x="365" y="52" width="50" height="36" rx="2" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="74" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">NEW</text>

  <!-- 오른쪽 코드 라벨: .badge { position:absolute; top:0; right:0 } -->
  <rect x="475" y="40" width="365" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-dasharray="3 3"/>
  <text x="487" y="63" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">.badge { position:absolute; top:0; right:0 }</text>

  <!-- 설명 텍스트 상자 (주의/경고 모나드) -->
  <rect x="475" y="110" width="365" height="130" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="495" y="163" font-size="13.5" font-weight="bold" fill="#d97706" text-anchor="start">.card에서 relative를 빼면 badge는</text>
  <text x="495" y="193" font-size="13.5" font-weight="bold" fill="#d97706" text-anchor="start">페이지 전체의 오른쪽 위로 날아간다</text>

  <!-- 연관성을 나타내는 연결선 (badge와 오른쪽 설명 연결) -->
  <path d="M450,70 L475,70" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <path d="M450,80 L465,80 L465,175 L475,175" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

</svg>