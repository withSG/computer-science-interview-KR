<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Java 8 HashMap 버킷의 트리 변환</title>
  <desc id="d">한 버킷에 노드가 8개 이상 모이면 버킷 안의 LinkedList가 Red-Black Tree로 바뀌어, 최악의 검색 시간이 O(n)에서 O(log n)으로 줄어드는 것을 같은 8개 노드로 보여준다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahBig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- 변환 전: LinkedList -->
  <rect x="24" y="24" width="832" height="104" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="48" y="70" font-size="18" font-weight="bold" fill="#111827">LinkedList</text>
  <text x="48" y="98" font-size="16" font-weight="bold" fill="#b91c1c">최악 O(n)</text>

  <rect x="236" y="56" width="80" height="40" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="276" y="82" font-size="16" fill="#111827" text-anchor="middle">버킷</text>

  <g stroke="#374151" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="318" y1="76" x2="359" y2="76"/>
    <line x1="400" y1="76" x2="418" y2="76"/>
    <line x1="458" y1="76" x2="476" y2="76"/>
    <line x1="516" y1="76" x2="534" y2="76"/>
    <line x1="574" y1="76" x2="592" y2="76"/>
    <line x1="632" y1="76" x2="650" y2="76"/>
    <line x1="690" y1="76" x2="708" y2="76"/>
    <line x1="748" y1="76" x2="766" y2="76"/>
  </g>
  <g fill="#ffffff" stroke="#b91c1c" stroke-width="1.5">
    <circle cx="380" cy="76" r="17"/>
    <circle cx="438" cy="76" r="17"/>
    <circle cx="496" cy="76" r="17"/>
    <circle cx="554" cy="76" r="17"/>
    <circle cx="612" cy="76" r="17"/>
    <circle cx="670" cy="76" r="17"/>
    <circle cx="728" cy="76" r="17"/>
    <circle cx="786" cy="76" r="17"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="380" y="81">1</text>
    <text x="438" y="81">2</text>
    <text x="496" y="81">3</text>
    <text x="554" y="81">4</text>
    <text x="612" y="81">5</text>
    <text x="670" y="81">6</text>
    <text x="728" y="81">7</text>
    <text x="786" y="81">8</text>
  </g>

  <!-- 전환 조건 -->
  <line x1="276" y1="134" x2="276" y2="192" stroke="#111827" stroke-width="3" marker-end="url(#ahBig)"/>
  <text x="298" y="169" font-size="17" font-weight="bold" fill="#111827">하나의 버킷에 8개 이상</text>

  <!-- 변환 후: Red-Black Tree -->
  <rect x="24" y="198" width="832" height="248" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="48" y="236" font-size="18" font-weight="bold" fill="#111827">Red-Black Tree</text>
  <text x="48" y="264" font-size="16" font-weight="bold" fill="#047857">최악 O(log n)</text>

  <rect x="236" y="222" width="80" height="40" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="276" y="248" font-size="16" fill="#111827" text-anchor="middle">버킷</text>
  <line x1="318" y1="242" x2="589" y2="242" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <g stroke="#6b7280" stroke-width="1.5">
    <line x1="612" y1="242" x2="496" y2="296"/>
    <line x1="612" y1="242" x2="728" y2="296"/>
    <line x1="496" y1="296" x2="438" y2="350"/>
    <line x1="496" y1="296" x2="554" y2="350"/>
    <line x1="728" y1="296" x2="670" y2="350"/>
    <line x1="728" y1="296" x2="786" y2="350"/>
    <line x1="438" y1="350" x2="380" y2="404"/>
  </g>
  <g fill="#ffffff" stroke="#047857" stroke-width="1.5">
    <circle cx="612" cy="242" r="17"/>
    <circle cx="496" cy="296" r="17"/>
    <circle cx="728" cy="296" r="17"/>
    <circle cx="438" cy="350" r="17"/>
    <circle cx="554" cy="350" r="17"/>
    <circle cx="670" cy="350" r="17"/>
    <circle cx="786" cy="350" r="17"/>
    <circle cx="380" cy="404" r="17"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="612" y="247">5</text>
    <text x="496" y="301">3</text>
    <text x="728" y="301">7</text>
    <text x="438" y="355">2</text>
    <text x="554" y="355">4</text>
    <text x="670" y="355">6</text>
    <text x="786" y="355">8</text>
    <text x="380" y="409">1</text>
  </g>
</svg>
