<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대용량 트래픽 대응 3단계</title>
  <desc id="d">대용량 트래픽 대응을 사전 예방(부하 테스트, 캐싱 전략, CDN, Scale Out), 발생 시 대응(Auto Scale, 서킷브레이커, 그레이스풀 디그레이드), 사후 분석(포스트모템, 모니터링, 알림 개선)의 세 단계로 나눈 표.</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="440" y="42" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">대용량 트래픽 대응</text>

  <!-- 단계 머리 -->
  <rect x="32" y="66" width="248" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="62" cy="94" r="14" fill="#1d4ed8"/>
  <text x="62" y="100" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="88" y="101" font-size="19" font-weight="bold" fill="#1d4ed8">사전 예방</text>

  <rect x="316" y="66" width="248" height="56" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="346" cy="94" r="14" fill="#b45309"/>
  <text x="346" y="100" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="372" y="101" font-size="19" font-weight="bold" fill="#92400e">발생 시 대응</text>

  <rect x="600" y="66" width="248" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="630" cy="94" r="14" fill="#047857"/>
  <text x="630" y="100" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="656" y="101" font-size="19" font-weight="bold" fill="#047857">사후 분석</text>

  <!-- 단계 사이 화살표 -->
  <path d="M286,94 H309" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M570,94 H593" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 1. 사전 예방 항목 -->
  <rect x="32" y="136" width="248" height="166" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="56" cy="164" r="4" fill="#1d4ed8"/>
  <text x="70" y="170" font-size="16" fill="#1f2937">부하 테스트</text>
  <circle cx="56" cy="200" r="4" fill="#1d4ed8"/>
  <text x="70" y="206" font-size="16" fill="#1f2937">캐싱 전략</text>
  <circle cx="56" cy="236" r="4" fill="#1d4ed8"/>
  <text x="70" y="242" font-size="16" fill="#1f2937">CDN</text>
  <circle cx="56" cy="272" r="4" fill="#1d4ed8"/>
  <text x="70" y="278" font-size="16" fill="#1f2937">Scale Out</text>

  <!-- 2. 발생 시 대응 항목 -->
  <rect x="316" y="136" width="248" height="166" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <circle cx="340" cy="164" r="4" fill="#b45309"/>
  <text x="354" y="170" font-size="16" fill="#1f2937">Auto Scale</text>
  <circle cx="340" cy="200" r="4" fill="#b45309"/>
  <text x="354" y="206" font-size="16" fill="#1f2937">서킷브레이커</text>
  <circle cx="340" cy="236" r="4" fill="#b45309"/>
  <text x="354" y="242" font-size="16" fill="#1f2937">그레이스풀 디그레이드</text>

  <!-- 3. 사후 분석 항목 -->
  <rect x="600" y="136" width="248" height="166" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="624" cy="164" r="4" fill="#047857"/>
  <text x="638" y="170" font-size="16" fill="#1f2937">포스트모템</text>
  <circle cx="624" cy="200" r="4" fill="#047857"/>
  <text x="638" y="206" font-size="16" fill="#1f2937">모니터링</text>
  <circle cx="624" cy="236" r="4" fill="#047857"/>
  <text x="638" y="242" font-size="16" fill="#1f2937">알림 개선</text>
</svg>
