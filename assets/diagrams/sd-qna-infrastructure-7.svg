<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대응 전략 개요</title>
  <desc id="d">대용량 트래픽 대응 전략을 사전 예방, 발생 시 대응, 사후 분석의 3단계로 나누어 설명하는 구조도</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Legend -->
  <g transform="translate(240, 24)">
    <rect x="0" y="0" width="12" height="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="2"/>
    <text x="18" y="10" font-size="11.5" fill="#52606d">사전 예방</text>

    <rect x="130" y="0" width="12" height="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="2"/>
    <text x="148" y="10" font-size="11.5" fill="#52606d">발생 시 대응</text>

    <rect x="270" y="0" width="12" height="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="2"/>
    <text x="288" y="10" font-size="11.5" fill="#52606d">사후 분석</text>
  </g>

  <!-- Main Container / Header -->
  <rect x="40" y="50" width="800" height="260" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>
  
  <rect x="40" y="50" width="800" height="50" fill="#1f2933" rx="6"/>
  <!-- Fill bottom corners of header rect to match box -->
  <rect x="40" y="90" width="800" height="10" fill="#1f2933"/>
  <text x="440" y="81.6" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">대용량 트래픽 대응</text>

  <!-- Section 1: 사전 예방 -->
  <g transform="translate(60, 115)">
    <!-- Column Header -->
    <rect x="0" y="0" width="240" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="120" y="23.05" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">사전 예방</text>

    <!-- Column Content Box -->
    <rect x="0" y="44" width="240" height="135" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
    <text x="20" y="70.025" fill="#1f2933" font-size="13">- 부하 테스트</text>
    <text x="20" y="98.025" fill="#1f2933" font-size="13">- 캐싱 전략</text>
    <text x="20" y="126.025" fill="#1f2933" font-size="13">- CDN</text>
    <text x="20" y="154.025" fill="#1f2933" font-size="13">- Scale Out</text>
  </g>

  <!-- Section 2: 발생 시 대응 -->
  <g transform="translate(320, 115)">
    <!-- Column Header -->
    <rect x="0" y="0" width="240" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
    <text x="120" y="23.05" fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle">발생 시 대응</text>

    <!-- Column Content Box -->
    <rect x="0" y="44" width="240" height="135" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
    <text x="20" y="70.025" fill="#1f2933" font-size="13">- Auto Scale</text>
    <text x="20" y="98.025" fill="#1f2933" font-size="13">- 서킷브레이커</text>
    <text x="20" y="126.025" fill="#1f2933" font-size="13">- 그레이스풀</text>
    <text x="31" y="154.025" fill="#1f2933" font-size="13">디그레이드</text>
  </g>

  <!-- Section 3: 사후 분석 -->
  <g transform="translate(580, 115)">
    <!-- Column Header -->
    <rect x="0" y="0" width="240" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="120" y="23.05" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">사후 분석</text>

    <!-- Column Content Box -->
    <rect x="0" y="44" width="240" height="135" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
    <text x="20" y="70.025" fill="#1f2933" font-size="13">- 포스트모템</text>
    <text x="20" y="98.025" fill="#1f2933" font-size="13">- 모니터링</text>
    <text x="20" y="126.025" fill="#1f2933" font-size="13">- 알림 개선</text>
  </g>
</svg>