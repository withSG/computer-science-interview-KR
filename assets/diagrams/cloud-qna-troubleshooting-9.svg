<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐싱 전략</title>
  <desc id="d">레벨, 도구, 용도로 구성된 캐싱 전략 테이블 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 표 영역 -->
  <g id="table">
    <!-- 헤더 배경 -->
    <rect x="40" y="40" width="800" height="44" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- 데이터 행 배경 -->
    <rect x="40" y="84" width="800" height="44" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <rect x="40" y="128" width="800" height="44" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <rect x="40" y="172" width="800" height="44" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <rect x="40" y="216" width="800" height="44" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <rect x="40" y="260" width="800" height="44" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>

    <!-- 열 구분선 -->
    <line x1="280" y1="40" x2="280" y2="304" stroke="#9aa5b1" stroke-width="1"/>
    <line x1="520" y1="40" x2="520" y2="304" stroke="#9aa5b1" stroke-width="1"/>

    <!-- 외부 테두리 강하게 -->
    <rect x="40" y="40" width="800" height="264" fill="none" stroke="#9aa5b1" stroke-width="2"/>

    <!-- 헤더 텍스트 -->
    <text x="160" y="67" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">레벨</text>
    <text x="400" y="67" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">도구</text>
    <text x="700" y="67" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">용도</text>

    <!-- 행 1: CDN -->
    <text x="160" y="111" font-size="13" fill="#1f2933" text-anchor="middle">CDN</text>
    <text x="400" y="111" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">CloudFront</text>
    <text x="700" y="111" font-size="13" fill="#52606d" text-anchor="middle">정적 자원</text>

    <!-- 행 2: API Gateway -->
    <text x="160" y="155" font-size="13" fill="#1f2933" text-anchor="middle">API Gateway</text>
    <text x="400" y="155" font-size="13" fill="#059669" font-weight="bold" text-anchor="middle">캐시 정책</text>
    <text x="700" y="155" font-size="13" fill="#52606d" text-anchor="middle">API 응답 캐시</text>

    <!-- 행 3: Application -->
    <text x="160" y="199" font-size="13" fill="#1f2933" text-anchor="middle">Application</text>
    <text x="400" y="199" font-size="13" fill="#d97706" font-weight="bold" text-anchor="middle">Caffeine</text>
    <text x="700" y="199" font-size="13" fill="#52606d" text-anchor="middle">로컬 캐시</text>

    <!-- 행 4: Distributed -->
    <text x="160" y="243" font-size="13" fill="#1f2933" text-anchor="middle">Distributed</text>
    <text x="400" y="243" font-size="13" fill="#dc2626" font-weight="bold" text-anchor="middle">Redis</text>
    <text x="700" y="243" font-size="13" fill="#52606d" text-anchor="middle">세션, 핫데이터</text>

    <!-- 행 5: Database -->
    <text x="160" y="287" font-size="13" fill="#1f2933" text-anchor="middle">Database</text>
    <text x="400" y="287" font-size="13" fill="#7c3aed" font-weight="bold" text-anchor="middle">Query Cache</text>
    <text x="700" y="287" font-size="13" fill="#52606d" text-anchor="middle">쿼리 결과</text>
  </g>
</svg>