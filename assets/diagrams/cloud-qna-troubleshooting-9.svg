<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">캐싱 레벨별 도구와 용도</title>
  <desc id="d">CDN, API Gateway, Application, Distributed, Database 다섯 캐시 레벨마다 쓰는 도구(CloudFront, 캐시 정책, Caffeine, Redis, Buffer Pool)와 용도를 정리한 표.</desc>
  <rect width="880" height="360" fill="#ffffff"/>

  <!-- 행 배경 -->
  <rect x="40" y="30" width="800" height="48" fill="#e2e8f0"/>
  <rect x="40" y="128" width="800" height="50" fill="#f8fafc"/>
  <rect x="40" y="228" width="800" height="50" fill="#f8fafc"/>

  <!-- 가로 구분선 -->
  <line x1="40" y1="78" x2="840" y2="78" stroke="#64748b" stroke-width="1.5"/>
  <line x1="40" y1="128" x2="840" y2="128" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="178" x2="840" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="228" x2="840" y2="228" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="278" x2="840" y2="278" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 세로 구분선 -->
  <line x1="260" y1="30" x2="260" y2="328" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="500" y1="30" x2="500" y2="328" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 바깥 테두리 -->
  <rect x="40" y="30" width="800" height="298" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 머리행 -->
  <text x="60" y="60" font-size="16" font-weight="bold" fill="#0f172a">레벨</text>
  <text x="280" y="60" font-size="16" font-weight="bold" fill="#0f172a">도구</text>
  <text x="520" y="60" font-size="16" font-weight="bold" fill="#0f172a">용도</text>

  <!-- 1. CDN -->
  <text x="60" y="109" font-size="16" font-weight="bold" fill="#111827">CDN</text>
  <text x="280" y="109" font-size="16" fill="#1d4ed8">CloudFront</text>
  <text x="520" y="109" font-size="16" fill="#1f2937">정적 자원</text>

  <!-- 2. API Gateway -->
  <text x="60" y="159" font-size="16" font-weight="bold" fill="#111827">API Gateway</text>
  <text x="280" y="159" font-size="16" fill="#1d4ed8">캐시 정책</text>
  <text x="520" y="159" font-size="16" fill="#1f2937">API 응답 캐시</text>

  <!-- 3. Application -->
  <text x="60" y="209" font-size="16" font-weight="bold" fill="#111827">Application</text>
  <text x="280" y="209" font-size="16" fill="#1d4ed8">Caffeine</text>
  <text x="520" y="209" font-size="16" fill="#1f2937">로컬 캐시</text>

  <!-- 4. Distributed -->
  <text x="60" y="259" font-size="16" font-weight="bold" fill="#111827">Distributed</text>
  <text x="280" y="259" font-size="16" fill="#1d4ed8">Redis</text>
  <text x="520" y="259" font-size="16" fill="#1f2937">세션, 핫데이터</text>

  <!-- 5. Database -->
  <text x="60" y="309" font-size="16" font-weight="bold" fill="#111827">Database</text>
  <text x="280" y="309" font-size="16" fill="#1d4ed8">Buffer Pool</text>
  <text x="520" y="309" font-size="16" fill="#1f2937">데이터 페이지</text>
</svg>
