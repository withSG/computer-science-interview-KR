<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가장 단순한 구현이 깨지는 지점</title>
  <desc id="d">스레드 A와 스레드 B가 동시에 싱글톤 인스턴스를 생성하여 경쟁 상태가 발생하는 과정을 나타낸 시퀀스 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- Title / Heading -->
  <text x="24" y="38" font-size="16" font-weight="bold" fill="#1f2933">가장 단순한 구현이 깨지는 지점</text>

  <!-- Time Axis -->
  <text x="24" y="74" font-size="13" font-weight="bold" fill="#52606d">시간</text>
  <path d="M60,70 L850,70" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Main Container -->
  <rect x="24" y="88" width="832" height="212" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="6"/>

  <!-- Sequence Step 1: Thread A Check -->
  <text x="40" y="121" font-size="13" font-weight="bold" fill="#2563eb">스레드 A:</text>
  <rect x="110" y="102" width="180" height="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="200" y="121" font-size="13" fill="#1f2933" text-anchor="middle">if (instance == null)</text>
  <path d="M296,117 L326,117" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="334" y="121" font-size="13" font-weight="bold" fill="#2563eb">true</text>

  <!-- Context Switch Indicator -->
  <path d="M380,127 L380,152" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="390" y="132" width="210" height="22" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="3"/>
  <text x="495" y="147" font-size="11.5" fill="#d97706" text-anchor="middle">(여기서 스케줄러가 B로 전환)</text>

  <!-- Sequence Step 2: Thread B Check -->
  <text x="40" y="181" font-size="13" font-weight="bold" fill="#7c3aed">스레드 B:</text>
  <rect x="405" y="162" width="180" height="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="4"/>
  <text x="495" y="181" font-size="13" fill="#1f2933" text-anchor="middle">if (instance == null)</text>
  <path d="M591,177 L621,177" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="629" y="181" font-size="13" font-weight="bold" fill="#7c3aed">true</text>

  <!-- Sequence Step 3: Thread B Instantiation -->
  <rect x="405" y="202" width="180" height="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" rx="4"/>
  <text x="495" y="221" font-size="13" fill="#1f2933" text-anchor="middle">new ConnectionPool()</text>
  <text x="595" y="221" font-size="13" fill="#52606d">← 인스턴스 1</text>

  <!-- Sequence Step 4: Thread A Instantiation -->
  <text x="40" y="261" font-size="13" font-weight="bold" fill="#2563eb">스레드 A:</text>
  <rect x="520" y="242" width="180" height="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="610" y="261" font-size="13" fill="#1f2933" text-anchor="middle">new ConnectionPool()</text>
  <text x="710" y="261" font-size="13" font-weight="bold" fill="#dc2626">← 인스턴스 2</text>

  <!-- Result Box -->
  <rect x="24" y="312" width="832" height="58" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="6"/>
  <text x="40" y="335" font-size="13" font-weight="bold" fill="#dc2626">결과:</text>
  <text x="82" y="335" font-size="12" fill="#1f2933">커넥션 40개. 게다가 나중 것이 static 필드를 덮어써서</text>
  <text x="82" y="355" font-size="12" fill="#1f2933">먼저 만들어진 풀의 커넥션 20개는 아무도 반납하지 않는 미아가 된다</text>
</svg>