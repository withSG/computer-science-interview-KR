<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 576" width="880" height="576" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Git Flow 다섯 브랜치의 분기·합류 흐름</title>
  <desc id="d">영구 브랜치 main·develop과 짧은 브랜치 feature/*·release/*·hotfix/*의 흐름. feature는 develop에서 나와 develop으로, release는 develop에서 나와 main(v1.1)과 develop으로, hotfix만 main에서 나와 main(v1.1.1)과 develop 양쪽으로 합류한다.</desc>
  <rect width="880" height="576" fill="#ffffff"/>
  <defs>
    <marker id="ah-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-dev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-feat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ah-rel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 레인 배경 -->
  <rect x="24" y="32" width="832" height="90" rx="6" fill="#fef2f2"/>
  <rect x="24" y="138" width="832" height="76" rx="6" fill="#fffbeb"/>
  <rect x="24" y="228" width="832" height="76" rx="6" fill="#f5f3ff"/>
  <rect x="24" y="318" width="832" height="76" rx="6" fill="#eff6ff"/>
  <rect x="24" y="408" width="832" height="76" rx="6" fill="#ecfdf5"/>

  <!-- 레인 이름 + 수명 -->
  <text x="40" y="84" font-size="17" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">main</text>
  <text x="40" y="106" font-size="14" fill="#4b5563">수명 영구</text>
  <text x="40" y="174" font-size="17" font-weight="bold" fill="#b45309" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hotfix/*</text>
  <text x="40" y="196" font-size="14" fill="#4b5563">수명 짧음</text>
  <text x="40" y="264" font-size="17" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">release/*</text>
  <text x="40" y="286" font-size="14" fill="#4b5563">수명 중간</text>
  <text x="40" y="354" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">develop</text>
  <text x="40" y="376" font-size="14" fill="#4b5563">수명 영구</text>
  <text x="40" y="444" font-size="17" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">feature/*</text>
  <text x="40" y="466" font-size="14" fill="#4b5563">수명 짧음</text>

  <!-- 영구 브랜치 레일 -->
  <line x1="150" y1="86" x2="852" y2="86" stroke="#b91c1c" stroke-width="3" marker-end="url(#ah-main)"/>
  <line x1="150" y1="356" x2="852" y2="356" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ah-dev)"/>

  <!-- develop 은 main v1.0 에서 시작 -->
  <path d="M170 94 L170 345" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-dev)"/>

  <!-- feature: develop → develop -->
  <path d="M195 363 C195 421 205 446 223 446" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-feat)"/>
  <path d="M325 446 C345 446 355 431 355 367" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-feat)"/>
  <rect x="225" y="418" width="100" height="56" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="275" y="442" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">기능 개발</text>
  <text x="275" y="463" font-size="14" fill="#047857" text-anchor="middle">→ develop</text>

  <!-- release: develop → main + develop -->
  <path d="M355 349 C355 296 365 266 383 266" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ah-rel)"/>
  <path d="M535 266 C555 266 565 246 565 97" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ah-rel)"/>
  <path d="M535 266 C555 266 565 286 565 345" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ah-rel)"/>
  <rect x="385" y="238" width="150" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="460" y="262" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">출시 준비(QA)</text>
  <text x="460" y="283" font-size="14" fill="#6d28d9" text-anchor="middle">→ main + develop</text>

  <!-- hotfix: main → main + develop -->
  <path d="M600 93 C600 146 610 176 628 176" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ah-hot)"/>
  <path d="M780 176 C800 176 810 161 810 97" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ah-hot)"/>
  <path d="M780 176 C800 176 810 191 810 345" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ah-hot)"/>
  <rect x="630" y="148" width="150" height="56" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="705" y="172" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">긴급 수정</text>
  <text x="705" y="193" font-size="14" fill="#b45309" text-anchor="middle">→ main + develop</text>

  <!-- 커밋 점 -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="170" cy="86" r="7" fill="#b91c1c"/>
    <circle cx="565" cy="86" r="7" fill="#b91c1c"/>
    <circle cx="600" cy="86" r="7" fill="#b91c1c"/>
    <circle cx="810" cy="86" r="7" fill="#b91c1c"/>
    <circle cx="170" cy="356" r="7" fill="#1d4ed8"/>
    <circle cx="195" cy="356" r="7" fill="#1d4ed8"/>
    <circle cx="265" cy="356" r="7" fill="#1d4ed8"/>
    <circle cx="355" cy="356" r="7" fill="#1d4ed8"/>
    <circle cx="565" cy="356" r="7" fill="#1d4ed8"/>
    <circle cx="810" cy="356" r="7" fill="#1d4ed8"/>
  </g>

  <!-- 릴리스 태그 -->
  <rect x="145" y="44" width="50" height="24" rx="5" fill="#b91c1c"/>
  <text x="170" y="61" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">v1.0</text>
  <rect x="540" y="44" width="50" height="24" rx="5" fill="#b91c1c"/>
  <text x="565" y="61" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">v1.1</text>
  <rect x="777" y="44" width="66" height="24" rx="5" fill="#b91c1c"/>
  <text x="810" y="61" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">v1.1.1</text>

  <!-- 요점 -->
  <rect x="24" y="504" width="832" height="48" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="440" y="534" font-size="16" fill="#111827" text-anchor="middle">feature·release는 develop에서 분기 · <tspan font-weight="bold" fill="#b45309">hotfix만 main에서 분기</tspan>해 main과 develop 양쪽으로 합류</text>
</svg>
