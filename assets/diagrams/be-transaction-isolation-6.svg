<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">갱신 손실 발생 순서</title>
  <desc id="d">재고 10개에서 두 사용자가 동시에 1개씩 주문한다. 트랜잭션 A와 B가 모두 stock 10을 읽고, 각자 10 - 1 = 9로 UPDATE해 A의 차감이 덮어써진다. 2개 팔렸는데 재고는 1개만 줄었다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>

  <text x="40" y="42" font-size="18" font-weight="bold" fill="#1f2937">재고 10개, 두 사용자가 동시에 1개씩 주문</text>

  <!-- 열 머리 -->
  <text x="58" y="92" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">순서</text>
  <rect x="96" y="66" width="260" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="226" y="92" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">트랜잭션 A</text>
  <rect x="376" y="66" width="260" height="40" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="506" y="92" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">트랜잭션 B</text>
  <rect x="656" y="66" width="190" height="40" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="751" y="92" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">DB의 stock</text>

  <!-- 생명선 -->
  <line x1="226" y1="106" x2="226" y2="408" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="506" y1="106" x2="506" y2="408" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 순서 축 -->
  <line x1="58" y1="151" x2="58" y2="379" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="58" cy="151" r="16" fill="#374151"/>
  <text x="58" y="157" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="58" cy="227" r="16" fill="#374151"/>
  <text x="58" y="233" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="58" cy="303" r="16" fill="#374151"/>
  <text x="58" y="309" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="58" cy="379" r="16" fill="#b91c1c"/>
  <text x="58" y="385" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 1: A SELECT -->
  <rect x="96" y="122" width="260" height="58" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="226" y="157" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SELECT stock → 10</text>
  <rect x="656" y="122" width="190" height="58" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="751" y="158" font-size="18" fill="#4b5563" text-anchor="middle">10</text>

  <!-- 2: B SELECT -->
  <rect x="376" y="198" width="260" height="58" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="506" y="233" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SELECT stock → 10</text>
  <rect x="656" y="198" width="190" height="58" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="751" y="234" font-size="18" fill="#4b5563" text-anchor="middle">10</text>

  <!-- 3: A UPDATE -->
  <rect x="96" y="274" width="260" height="58" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="226" y="299" font-size="17" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UPDATE stock = 9</text>
  <text x="226" y="322" font-size="15" fill="#4b5563" text-anchor="middle">(10 - 1)</text>
  <rect x="656" y="274" width="190" height="58" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="751" y="310" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">10 → 9</text>

  <!-- 4: B UPDATE (갱신 손실) -->
  <rect x="376" y="350" width="260" height="58" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="506" y="375" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UPDATE stock = 9</text>
  <text x="506" y="398" font-size="15" fill="#b91c1c" text-anchor="middle">(10 - 1)</text>
  <rect x="656" y="350" width="190" height="58" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="751" y="374" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">9 → 9</text>
  <text x="751" y="398" font-size="15" fill="#b91c1c" text-anchor="middle">A의 차감이 덮어써졌다</text>

  <!-- 결과 -->
  <rect x="40" y="436" width="806" height="50" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="443" y="468" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">2개 팔렸는데 재고는 1개만 줄었다</text>
</svg>
