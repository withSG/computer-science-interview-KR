<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커넥션 풀 없이</title>
  <desc id="d">커넥션 풀이 없을 때 요청 1, 2, 3이 각각 연결 생성, 쿼리, 연결 종료 과정을 거치며 발생하는 비용 문제를 설명하는 다이어그램입니다.</desc>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#1f2933">커넥션 풀 없이</text>

  <!-- 메인 프로세스 영역 -->
  <g>
    <!-- Row 1: 요청 1 -->
    <rect x="30" y="60" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="80" y="84" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">요청 1</text>

    <path d="M130,80 L180,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="180" y="60" width="120" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="240" y="84" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">연결 생성</text>

    <path d="M300,80 L350,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="350" y="60" width="100" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="400" y="84" font-size="13" fill="#1f2933" text-anchor="middle">쿼리</text>

    <path d="M450,80 L500,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="500" y="60" width="120" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="560" y="84" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">연결 종료</text>

    <!-- Row 2: 요청 2 -->
    <rect x="30" y="120" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="80" y="144" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">요청 2</text>

    <path d="M130,140 L180,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="180" y="120" width="120" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="240" y="144" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">연결 생성</text>

    <path d="M300,140 L350,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="350" y="120" width="100" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="400" y="144" font-size="13" fill="#1f2933" text-anchor="middle">쿼리</text>

    <path d="M450,140 L500,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="500" y="120" width="120" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="560" y="144" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">연결 종료</text>

    <!-- Row 3: 요청 3 -->
    <rect x="30" y="180" width="100" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="80" y="204" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">요청 3</text>

    <path d="M130,200 L180,200" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="180" y="180" width="120" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="240" y="204" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">연결 생성</text>

    <path d="M300,200 L350,200" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="350" y="180" width="100" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="400" y="204" font-size="13" fill="#1f2933" text-anchor="middle">쿼리</text>

    <path d="M450,200 L500,200" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <rect x="500" y="180" width="120" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="560" y="204" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">연결 종료</text>
  </g>

  <!-- 문제 영역 -->
  <rect x="30" y="250" width="820" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="50" y="280" font-size="13" font-weight="bold" fill="#dc2626">문제: 연결 생성/종료 비용 (TCP 핸드셰이크, 인증)</text>
</svg>