<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">커넥션 풀 없이</title>
  <desc id="d">커넥션 풀이 없으면 요청 1, 2, 3이 각각 연결 생성 → 쿼리 → 연결 종료를 거친다. 문제는 연결 생성/종료 비용(TCP 핸드셰이크, 인증)이다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 요청 1 -->
  <rect x="66" y="24" width="100" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="116" y="54" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">요청 1</text>
  <line x1="172" y1="48" x2="216" y2="48" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="222" y="24" width="160" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="302" y="54" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">연결 생성</text>
  <line x1="388" y1="48" x2="432" y2="48" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="438" y="24" width="160" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="518" y="54" font-size="16" text-anchor="middle" fill="#1f2933">쿼리</text>
  <line x1="604" y1="48" x2="648" y2="48" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="654" y="24" width="160" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="734" y="54" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">연결 종료</text>

  <!-- 요청 2 -->
  <rect x="66" y="92" width="100" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="116" y="122" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">요청 2</text>
  <line x1="172" y1="116" x2="216" y2="116" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="222" y="92" width="160" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="302" y="122" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">연결 생성</text>
  <line x1="388" y1="116" x2="432" y2="116" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="438" y="92" width="160" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="518" y="122" font-size="16" text-anchor="middle" fill="#1f2933">쿼리</text>
  <line x1="604" y1="116" x2="648" y2="116" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="654" y="92" width="160" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="734" y="122" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">연결 종료</text>

  <!-- 요청 3 -->
  <rect x="66" y="160" width="100" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="116" y="190" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">요청 3</text>
  <line x1="172" y1="184" x2="216" y2="184" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="222" y="160" width="160" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="302" y="190" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">연결 생성</text>
  <line x1="388" y1="184" x2="432" y2="184" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="438" y="160" width="160" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="518" y="190" font-size="16" text-anchor="middle" fill="#1f2933">쿼리</text>
  <line x1="604" y1="184" x2="648" y2="184" stroke="#374151" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="654" y="160" width="160" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="734" y="190" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">연결 종료</text>

  <!-- 문제 -->
  <rect x="66" y="236" width="748" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="272" font-size="17" text-anchor="middle" fill="#1f2933"><tspan font-weight="bold" fill="#b91c1c">문제: 연결 생성/종료 비용</tspan> (TCP 핸드셰이크, 인증)</text>
</svg>
