<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">work factor의 비대칭: 해시를 느리게 하면 사용자와 공격자가 치르는 비용</title>
  <desc id="d">SHA-256 단독, SHA-256 + Salt, bcrypt cost 12 세 단계에서 로그인하는 사용자의 1회 비용과 전수조사하는 공격자의 초당 시도 횟수를 비교한다. bcrypt에서 사용자는 체감 안 되는 지연만 겪지만 공격자의 시도 횟수는 수백만 분의 1로 줄어든다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>

  <!-- 표 바탕 -->
  <rect x="24" y="24" width="832" height="64" fill="#f1f5f9"/>
  <rect x="24" y="296" width="832" height="120" fill="#f0fdf4"/>
  <rect x="24" y="416" width="832" height="80" fill="#f8fafc"/>

  <!-- 격자 -->
  <rect x="24" y="24" width="832" height="472" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="88" x2="856" y2="88" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="184" x2="856" y2="184" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="296" x2="856" y2="296" stroke="#047857" stroke-width="2"/>
  <line x1="24" y1="416" x2="856" y2="416" stroke="#047857" stroke-width="2"/>
  <line x1="224" y1="24" x2="224" y2="496" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="484" y1="24" x2="484" y2="496" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 머리행 -->
  <text x="40" y="62" font-size="16" font-weight="bold" fill="#111827">단계</text>
  <text x="240" y="52" font-size="17" font-weight="bold" fill="#1d4ed8">로그인하는 사용자</text>
  <text x="240" y="75" font-size="14" fill="#4b5563">로그인 1회 = 해시 1회 계산</text>
  <text x="500" y="52" font-size="17" font-weight="bold" fill="#b91c1c">전수조사하는 공격자</text>
  <text x="500" y="75" font-size="14" fill="#4b5563">GPU 병렬화 · 초당 시도 횟수</text>

  <!-- 1. SHA-256 단독 -->
  <text x="40" y="141" font-size="16" font-weight="bold" fill="#111827">1. SHA-256 단독</text>
  <text x="240" y="141" font-size="16" fill="#111827">1회 = 마이크로초 단위</text>
  <rect x="500" y="110" width="340" height="18" rx="3" fill="#dc2626"/>
  <text x="500" y="160" font-size="16" font-weight="bold" fill="#b91c1c">초당 수십억 번 시도 가능</text>

  <!-- 2. SHA-256 + Salt -->
  <text x="40" y="245" font-size="16" font-weight="bold" fill="#111827">2. SHA-256 + Salt</text>
  <text x="240" y="235" font-size="16" fill="#111827">1회 = 마이크로초 단위</text>
  <text x="240" y="259" font-size="14" fill="#4b5563">(차이 없음)</text>
  <rect x="500" y="204" width="340" height="18" rx="3" fill="#d97706"/>
  <text x="500" y="252" font-size="15" font-weight="bold" fill="#b45309">레인보우 테이블은 무력화</text>
  <text x="500" y="276" font-size="15" fill="#374151">특정 사용자 한 명을 노린 공격은 여전히 가능</text>

  <!-- 3. bcrypt cost 12 -->
  <text x="40" y="350" font-size="16" font-weight="bold" fill="#111827">3. bcrypt cost 12</text>
  <text x="40" y="373" font-size="14" fill="#4b5563">(반복 2^12회)</text>
  <text x="240" y="336" font-size="16" fill="#111827">1회 = 수십~수백 밀리초</text>
  <text x="240" y="359" font-size="14" fill="#4b5563">(장비에 따라 다름)</text>
  <text x="240" y="394" font-size="16" font-weight="bold" fill="#047857">→ 체감 안 되는 지연</text>
  <rect x="500" y="316" width="340" height="18" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="500" y="316" width="4" height="18" fill="#047857"/>
  <text x="500" y="364" font-size="16" font-weight="bold" fill="#047857">시도 횟수가 수백만 분의 1로 줄어든다</text>
  <text x="500" y="388" font-size="14" fill="#4b5563">(점선: 1·2단계의 막대 길이)</text>

  <!-- 비대칭 -->
  <text x="40" y="462" font-size="16" font-weight="bold" fill="#111827">비대칭</text>
  <text x="240" y="448" font-size="16" font-weight="bold" fill="#111827">한 번만 계산</text>
  <text x="240" y="473" font-size="16" font-weight="bold" fill="#1d4ed8">→ 무시할 수 있는 비용</text>
  <text x="500" y="448" font-size="16" font-weight="bold" fill="#111827">수십억 번 계산</text>
  <text x="500" y="473" font-size="16" font-weight="bold" fill="#b91c1c">→ 치명적인 비용</text>

  <text x="24" y="528" font-size="14" fill="#4b5563">※ work factor 기준: 사용자 체감을 해치지 않는 선에서 가장 높은 값을 고른다</text>
</svg>
