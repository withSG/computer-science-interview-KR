<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 750" width="880" height="750" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FSD 레이어·슬라이스·세그먼트</title>
  <desc id="d">FSD는 코드를 여섯 레이어(app, pages, widgets, features, entities, shared)로 나누고 위에서 아래로만 의존하게 한다. 레이어 안은 도메인별 슬라이스(features/auth, features/cart)로, 슬라이스 안은 기술별 세그먼트(ui, model, api, lib)로 나누며, 같은 레이어의 다른 슬라이스끼리는 서로 import할 수 없다.</desc>
  <rect width="880" height="750" fill="#ffffff"/>
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="no" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ① 레이어 -->
  <text x="24" y="44" fill="#111827"><tspan font-size="18" font-weight="bold">① 레이어(layer)</tspan><tspan dx="12" font-size="16" font-weight="bold" fill="#1d4ed8">— 위에서 아래로만 의존할 수 있다</tspan></text>

  <!-- app -->
  <rect x="24" y="64" width="832" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="64" width="148" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="98" y="92" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">app</text>
  <text x="192" y="92" font-size="15" fill="#1f2937">전역 설정, 프로바이더, 라우터</text>
  <line x1="98" y1="109" x2="98" y2="127" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dn)"/>

  <!-- pages -->
  <rect x="24" y="128" width="832" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="128" width="148" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="98" y="156" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">pages</text>
  <text x="192" y="156" font-size="15" fill="#1f2937">라우트 단위 화면</text>
  <line x1="98" y1="173" x2="98" y2="191" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dn)"/>

  <!-- widgets -->
  <rect x="24" y="192" width="832" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="192" width="148" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="98" y="220" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">widgets</text>
  <text x="192" y="220" font-size="15" fill="#1f2937">여러 기능을 조합한 큰 UI 블록</text>
  <line x1="98" y1="237" x2="98" y2="255" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dn)"/>

  <!-- features -->
  <rect x="24" y="256" width="832" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="256" width="148" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="98" y="284" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">features</text>
  <text x="192" y="284" font-size="15" fill="#1f2937">사용자가 하는 행동 하나 <tspan fill="#4b5563">(좋아요 누르기, 로그인하기)</tspan></text>
  <line x1="98" y1="301" x2="98" y2="319" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dn)"/>

  <!-- entities -->
  <rect x="24" y="320" width="832" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="320" width="148" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="98" y="348" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">entities</text>
  <text x="192" y="348" font-size="15" fill="#1f2937">도메인 개체 <tspan fill="#4b5563">(User, Product)</tspan></text>
  <line x1="98" y1="365" x2="98" y2="383" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dn)"/>

  <!-- shared -->
  <rect x="24" y="384" width="832" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="384" width="148" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="98" y="412" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">shared</text>
  <text x="192" y="412" font-size="15" fill="#1f2937">도메인을 모르는 공통 코드 <tspan fill="#4b5563">(UI 키트, 유틸)</tspan></text>

  <!-- ② 슬라이스 / ③ 세그먼트 -->
  <text x="24" y="474" fill="#1f2937"><tspan font-size="18" font-weight="bold" fill="#b45309">② 슬라이스(slice)</tspan><tspan dx="12" font-size="16">— 레이어 안의 도메인 구분</tspan><tspan dx="8" font-size="15" fill="#4b5563">(features/auth, features/cart)</tspan></text>
  <text x="50" y="500" font-size="15" font-weight="bold" fill="#b91c1c">✕ 같은 레이어의 다른 슬라이스는 서로 import 금지</text>
  <text x="24" y="534" fill="#1f2937"><tspan font-size="18" font-weight="bold" fill="#6d28d9">③ 세그먼트(segment)</tspan><tspan dx="12" font-size="16">— 슬라이스 안의 기술 구분</tspan><tspan dx="8" font-size="15" fill="#4b5563">(ui, model, api, lib)</tspan></text>

  <!-- 예시: features 레이어 안 -->
  <rect x="24" y="552" width="832" height="174" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="578" fill="#1f2937"><tspan font-size="16" font-weight="bold" fill="#1e3a8a" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">features</tspan><tspan dx="6" font-size="15">레이어</tspan></text>

  <!-- 슬라이스: features/auth -->
  <rect x="48" y="594" width="320" height="108" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="208" y="622" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">features/auth</text>
  <rect x="61" y="638" width="66" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="94" y="665" font-size="15" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ui</text>
  <rect x="137" y="638" width="66" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="170" y="665" font-size="15" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">model</text>
  <rect x="213" y="638" width="66" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="246" y="665" font-size="15" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">api</text>
  <rect x="289" y="638" width="66" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="322" y="665" font-size="15" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lib</text>

  <!-- 슬라이스: features/cart -->
  <rect x="512" y="594" width="320" height="108" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="672" y="622" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">features/cart</text>
  <rect x="525" y="638" width="66" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="558" y="665" font-size="15" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ui</text>
  <rect x="601" y="638" width="66" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="634" y="665" font-size="15" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">model</text>
  <rect x="677" y="638" width="66" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="710" y="665" font-size="15" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">api</text>
  <rect x="753" y="638" width="66" height="44" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="786" y="665" font-size="15" fill="#5b21b6" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lib</text>

  <!-- 형제 슬라이스 간 import 금지 -->
  <line x1="374" y1="630" x2="506" y2="630" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#no)" marker-end="url(#no)"/>
  <circle cx="440" cy="630" r="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <path d="M434,624 L446,636 M446,624 L434,636" stroke="#b91c1c" stroke-width="2.5" fill="none"/>
  <text x="440" y="668" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">서로 import 금지</text>
</svg>
