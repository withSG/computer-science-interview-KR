<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">정상 경로 vs self-invocation</title>
  <desc id="d">정상 경로에서는 Controller의 호출이 Proxy를 거쳐 트랜잭션을 시작한 뒤 원본 processPayment()에 도달한다. self-invocation에서는 Proxy가 createOrder에 대해서만 개입하고, 원본 createOrder() 안의 this.processPayment() 호출은 프록시를 거치지 않아 트랜잭션이 걸리지 않는다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#ffffff"/>

  <!-- ===== 왼쪽: 정상 경로 ===== -->
  <rect x="24" y="24" width="408" height="552" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="44" y="60" font-size="20" font-weight="bold" fill="#1d4ed8">정상 경로</text>
  <line x1="44" y1="76" x2="412" y2="76" stroke="#1d4ed8" stroke-width="2"/>

  <rect x="138" y="100" width="180" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="228" y="128" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Controller</text>

  <line x1="228" y1="144" x2="228" y2="179" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a-blue)"/>

  <rect x="118" y="180" width="220" height="60" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="228" y="205" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Proxy</text>
  <text x="228" y="227" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">트랜잭션 시작</text>

  <!-- 원본 객체 -->
  <rect x="44" y="276" width="368" height="212" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="58" y="300" font-size="14" font-weight="bold" fill="#4b5563">원본 객체</text>

  <line x1="228" y1="240" x2="228" y2="411" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a-blue)"/>

  <rect x="128" y="412" width="200" height="60" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="228" y="447" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">processPayment()</text>

  <!-- 결과 -->
  <rect x="44" y="508" width="368" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="228" y="538" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">트랜잭션 적용</text>

  <!-- ===== 오른쪽: self-invocation ===== -->
  <rect x="448" y="24" width="408" height="552" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="468" y="60" font-size="20" font-weight="bold" fill="#b91c1c">self-invocation</text>
  <line x1="468" y1="76" x2="836" y2="76" stroke="#b91c1c" stroke-width="2"/>

  <rect x="530" y="100" width="180" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="620" y="128" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Controller</text>

  <line x1="620" y1="144" x2="620" y2="179" stroke="#374151" stroke-width="2" marker-end="url(#a-ink)"/>

  <rect x="490" y="180" width="260" height="60" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="620" y="205" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Proxy</text>
  <text x="620" y="227" font-size="14" fill="#374151" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">createOrder</tspan>에 대해서만 개입</text>

  <!-- 원본 객체 -->
  <rect x="468" y="276" width="368" height="212" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="482" y="300" font-size="14" font-weight="bold" fill="#4b5563">원본 객체</text>

  <line x1="620" y1="240" x2="620" y2="315" stroke="#374151" stroke-width="2" marker-end="url(#a-ink)"/>

  <rect x="530" y="316" width="180" height="48" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="620" y="346" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">createOrder()</text>

  <line x1="620" y1="364" x2="620" y2="411" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#a-red)"/>
  <text x="632" y="393" font-size="14" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">this.processPayment()</text>

  <rect x="510" y="412" width="220" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="620" y="437" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">processPayment()</text>
  <text x="620" y="459" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">프록시를 안 거침</text>

  <!-- 결과 -->
  <rect x="468" y="508" width="368" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="652" y="538" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">트랜잭션이 걸리지 않음</text>
</svg>
