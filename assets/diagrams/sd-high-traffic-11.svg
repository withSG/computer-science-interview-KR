<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">큐의 버퍼 효과</title>
  <desc id="d">초당 5,000건이 몰리고 워커 처리 능력이 초당 500건일 때, 큐가 없으면 5,000건이 동시에 DB로 가 커넥션이 고갈되고 전부 실패한다. 큐가 있으면 요청이 큐에 쌓이고 초당 500건씩 소화되어, 응답은 즉시 주고 처리는 10초에 걸쳐 완료된다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 전제 -->
  <text x="32" y="44" font-size="17" fill="#1f2937">초당 <tspan font-weight="bold" fill="#b91c1c">5,000건</tspan>이 몰리는데 워커 처리 능력이 초당 <tspan font-weight="bold" fill="#1d4ed8">500건</tspan>이라면</text>

  <!-- [큐 없음] -->
  <rect x="32" y="86" width="96" height="32" rx="16" fill="#b91c1c"/>
  <text x="80" y="108" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">큐 없음</text>

  <rect x="150" y="72" width="206" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="253" y="108" font-size="16" fill="#111827" text-anchor="middle">5,000건이 동시에 DB로</text>
  <path d="M360,102 H384" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="390" y="72" width="180" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="480" y="108" font-size="16" fill="#111827" text-anchor="middle">커넥션 고갈</text>
  <path d="M574,102 H598" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="604" y="72" width="244" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="726" y="108" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">전부 실패</text>

  <!-- [큐 있음] -->
  <rect x="32" y="170" width="96" height="32" rx="16" fill="#047857"/>
  <text x="80" y="192" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">큐 있음</text>

  <rect x="150" y="156" width="206" height="60" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="253" y="192" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">큐에 쌓임</text>
  <path d="M360,186 H384" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="390" y="156" width="180" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="480" y="192" font-size="16" fill="#111827" text-anchor="middle">초당 500건씩 소화</text>
  <path d="M574,186 H598" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="604" y="156" width="244" height="60" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="726" y="181" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">응답은 즉시</text>
  <text x="726" y="204" font-size="16" fill="#065f46" text-anchor="middle">처리는 10초에 걸쳐 완료</text>

  <!-- 시간축: 초당 500건 × 10초 -->
  <text x="32" y="252" font-size="15" fill="#374151"><tspan x="32" dy="0">시간축으로</tspan><tspan x="32" dy="21">펴서 처리</tspan></text>
  <rect x="150" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="219" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="288" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="357" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="426" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="495" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="564" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="633" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="702" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <rect x="771" y="240" width="69" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
  <g font-size="14" fill="#065f46" text-anchor="middle">
    <text x="184.5" y="261">500건</text>
    <text x="253.5" y="261">500건</text>
    <text x="322.5" y="261">500건</text>
    <text x="391.5" y="261">500건</text>
    <text x="460.5" y="261">500건</text>
    <text x="529.5" y="261">500건</text>
    <text x="598.5" y="261">500건</text>
    <text x="667.5" y="261">500건</text>
    <text x="736.5" y="261">500건</text>
    <text x="805.5" y="261">500건</text>
  </g>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="184.5" y="292">1초</text>
    <text x="253.5" y="292">2초</text>
    <text x="322.5" y="292">3초</text>
    <text x="391.5" y="292">4초</text>
    <text x="460.5" y="292">5초</text>
    <text x="529.5" y="292">6초</text>
    <text x="598.5" y="292">7초</text>
    <text x="667.5" y="292">8초</text>
    <text x="736.5" y="292">9초</text>
    <text x="805.5" y="292">10초</text>
  </g>
</svg>
