<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가상 주소 → 물리 주소 변환 흐름</title>
  <desc id="d">가상 주소가 페이지 테이블을 거쳐 물리 주소로 변환되는 과정을 나타낸 순서도입니다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 가상 주소 (요청/출발점: 파랑) -->
  <g>
    <rect x="330" y="40" width="220" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="73.2" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">가상 주소</text>
    <text x="440" y="97.025" font-size="11.5" fill="#52606d" text-anchor="middle">(프로세스가 사용)</text>
  </g>

  <!-- 첫 번째 화살표 -->
  <path d="M440,120 L440,173" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- 페이지 테이블 (중계/변환: 보라) -->
  <g>
    <rect x="330" y="175" width="220" height="80" rx="8" ry="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="440" y="208.2" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">페이지 테이블</text>
    <text x="440" y="232.025" font-size="11.5" fill="#52606d" text-anchor="middle">(가상→물리 매핑)</text>
  </g>

  <!-- 두 번째 화살표 -->
  <path d="M440,255 L440,308" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- 물리 주소 (결과/목적지: 초록) -->
  <g>
    <rect x="330" y="310" width="220" height="80" rx="8" ry="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="440" y="343.2" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">물리 주소</text>
    <text x="440" y="367.025" font-size="11.5" fill="#52606d" text-anchor="middle">(실제 RAM 위치)</text>
  </g>
</svg>