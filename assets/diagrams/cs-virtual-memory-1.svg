<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">가상 주소에서 물리 주소로</title>
  <desc id="d">프로세스가 사용하는 가상 주소가 가상→물리 매핑을 담은 페이지 테이블을 거쳐 실제 RAM 위치인 물리 주소로 바뀌는 흐름입니다.</desc>
  <rect width="880" height="190" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. 가상 주소 -->
  <rect x="32" y="44" width="224" height="102" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="144" y="88" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">가상 주소</text>
  <text x="144" y="118" font-size="16" fill="#374151" text-anchor="middle">프로세스가 사용</text>

  <line x1="260" y1="95" x2="320" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 2. 페이지 테이블 (변환 지점) -->
  <rect x="328" y="44" width="224" height="102" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
  <text x="440" y="88" font-size="20" font-weight="bold" fill="#4c1d95" text-anchor="middle">페이지 테이블</text>
  <text x="440" y="118" font-size="16" fill="#374151" text-anchor="middle">가상→물리 매핑</text>

  <line x1="556" y1="95" x2="616" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 3. 물리 주소 -->
  <rect x="624" y="44" width="224" height="102" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="736" y="88" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">물리 주소</text>
  <text x="736" y="118" font-size="16" fill="#374151" text-anchor="middle">실제 RAM 위치</text>
</svg>
