<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">갭 락 — 없는 행을 잠근다</title>
  <desc id="d">id 기준으로 정렬된 인덱스에서 레코드 락과 갭 락, 넥스트키 락의 개념을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Section Title / Subtitle from Diagram -->
  <text x="40" y="44" font-size="14" font-weight="bold" fill="#52606d">id 기준으로 정렬된 인덱스</text>

  <!-- Left/Main Structure Container -->
  <!-- Gap Lock (-inf ~ 1) -->
  <rect x="180" y="65" width="220" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="290" y="86" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold">갭 락 (−∞ ~ 1)</text>

  <!-- Record Lock (id = 1) -->
  <rect x="180" y="105" width="220" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="129" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">[ id = 1 ]</text>
  <text x="420" y="129" font-size="13" fill="#52606d">← 레코드 락</text>

  <!-- Gap Lock (1 ~ 3) -->
  <rect x="180" y="151" width="220" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="290" y="172" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold">갭 락 (1 ~ 3)</text>

  <!-- Record Lock (id = 3) -->
  <rect x="180" y="191" width="220" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="215" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">[ id = 3 ]</text>
  <text x="420" y="215" font-size="13" fill="#52606d">← 레코드 락</text>

  <!-- Gap Lock (3 ~ 5) -->
  <rect x="180" y="237" width="220" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="290" y="258" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold">갭 락 (3 ~ 5)</text>

  <!-- Record Lock (id = 5) -->
  <rect x="180" y="277" width="220" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="301" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">[ id = 5 ]</text>
  <text x="420" y="301" font-size="13" fill="#52606d">← 레코드 락</text>

  <!-- Gap Lock (5 ~ +inf) -->
  <rect x="180" y="323" width="220" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="290" y="344" font-size="13" fill="#d97706" text-anchor="middle" font-weight="bold">갭 락 (5 ~ +∞)</text>

  <!-- First Gap Lock Indicator Line -->
  <text x="420" y="86" font-size="13" fill="#52606d">← 갭 락 (−∞ ~ 1)</text>
  <text x="420" y="172" font-size="13" fill="#52606d">← 갭 락 (1 ~ 3)</text>
  <text x="420" y="258" font-size="13" fill="#52606d">← 갭 락 (3 ~ 5)</text>
  <text x="420" y="344" font-size="13" fill="#52606d">← 갭 락 (5 ~ +∞)</text>

  <!-- Divider Line -->
  <line x1="40" y1="385" x2="840" y2="385" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Legend / Footnote Section -->
  <g transform="translate(40, 410)">
    <!-- Record Lock Description -->
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="42.5" y="16.5" font-size="12.5" font-weight="bold" fill="#2563eb" text-anchor="middle">레코드 락</text>
    <text x="95" y="16.5" font-size="13" fill="#1f2933">: 존재하는 행의 수정/삭제를 막는다</text>

    <!-- Gap Lock Description -->
    <rect x="0" y="34" width="85" height="24" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="42.5" y="50.5" font-size="12.5" font-weight="bold" fill="#d97706" text-anchor="middle">갭   락</text>
    <text x="95" y="50.5" font-size="13" fill="#1f2933">: 행과 행 "사이의 빈 공간"에 INSERT하는 것을 막는다</text>

    <!-- Next Key Lock Description -->
    <rect x="0" y="68" width="85" height="24" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="42.5" y="84.5" font-size="12.5" font-weight="bold" fill="#7c3aed" text-anchor="middle">넥스트키 락</text>
    <text x="95" y="84.5" font-size="13" stroke-width="0" fill="#1f2933">= 레코드 락 + 그 앞쪽 갭 락</text>
  </g>
</svg>