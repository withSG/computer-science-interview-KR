<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레코드 락·갭 락·넥스트키 락</title>
  <desc id="d">id 기준으로 정렬된 인덱스에서 id = 1, 3, 5 행에는 레코드 락이, 그 사이와 양 끝 빈 구간(−∞ ~ 1, 1 ~ 3, 3 ~ 5, 5 ~ +∞)에는 갭 락이 걸린다. 넥스트키 락은 레코드 락과 그 앞쪽 갭 락을 합친 것이다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>

  <text x="40" y="44" font-size="17" font-weight="bold" fill="#1f2937">id 기준으로 정렬된 인덱스</text>

  <!-- 넥스트키 락 = 앞쪽 갭 + 레코드 -->
  <path d="M43,118 L43,106 L259,106 L259,118" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="151" y="96" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">넥스트키 락</text>
  <path d="M271,118 L271,106 L487,106 L487,118" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="379" y="96" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">넥스트키 락</text>
  <path d="M499,118 L499,106 L715,106 L715,118" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="607" y="96" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">넥스트키 락</text>

  <!-- 갭 (−∞ ~ 1) -->
  <rect x="40" y="126" width="116" height="80" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="98" y="160" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">갭 락</text>
  <text x="98" y="185" font-size="15" fill="#92400e" text-anchor="middle">(−∞ ~ 1)</text>

  <!-- id = 1 -->
  <rect x="162" y="126" width="100" height="80" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="212" y="160" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">id = 1</text>
  <text x="212" y="185" font-size="15" fill="#1d4ed8" text-anchor="middle">레코드 락</text>

  <!-- 갭 (1 ~ 3) -->
  <rect x="268" y="126" width="116" height="80" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="326" y="160" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">갭 락</text>
  <text x="326" y="185" font-size="15" fill="#92400e" text-anchor="middle">(1 ~ 3)</text>

  <!-- id = 3 -->
  <rect x="390" y="126" width="100" height="80" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="160" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">id = 3</text>
  <text x="440" y="185" font-size="15" fill="#1d4ed8" text-anchor="middle">레코드 락</text>

  <!-- 갭 (3 ~ 5) -->
  <rect x="496" y="126" width="116" height="80" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="554" y="160" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">갭 락</text>
  <text x="554" y="185" font-size="15" fill="#92400e" text-anchor="middle">(3 ~ 5)</text>

  <!-- id = 5 -->
  <rect x="618" y="126" width="100" height="80" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="668" y="160" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">id = 5</text>
  <text x="668" y="185" font-size="15" fill="#1d4ed8" text-anchor="middle">레코드 락</text>

  <!-- 갭 (5 ~ +∞) -->
  <rect x="724" y="126" width="116" height="80" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="782" y="160" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">갭 락</text>
  <text x="782" y="185" font-size="15" fill="#92400e" text-anchor="middle">(5 ~ +∞)</text>

  <!-- 범례 -->
  <rect x="40" y="236" width="800" height="138" rx="8" fill="#f9fafb"/>

  <rect x="64" y="251" width="110" height="30" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="119" y="271" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">레코드 락</text>
  <text x="196" y="272" font-size="16" fill="#1f2937">존재하는 행의 수정/삭제를 막는다</text>

  <rect x="64" y="291" width="110" height="30" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="119" y="311" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">갭 락</text>
  <text x="196" y="312" font-size="16" fill="#1f2937">행과 행 "사이의 빈 공간"에 INSERT하는 것을 막는다</text>

  <rect x="64" y="331" width="110" height="30" rx="4" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="119" y="351" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">넥스트키 락</text>
  <text x="196" y="352" font-size="16" fill="#1f2937">= 레코드 락 + 그 앞쪽 갭 락</text>
</svg>
