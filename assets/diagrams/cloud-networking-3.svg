<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">NAT Gateway의 비대칭 통과</title>
  <desc id="d">Private 서브넷의 App 서버(사설 IP만)는 Public 서브넷의 NAT Gateway(EIP 보유, AZ에 묶인 리소스)와 IGW를 거쳐 인터넷으로 나갑니다. 나가는 요청과 그 응답은 통과하지만, 외부가 먼저 시작한 연결은 NAT에서 막혀 App에 닿지 못합니다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ── 구성 ── -->
  <!-- Private Subnet (AZ-a) -->
  <rect x="24" y="32" width="180" height="176" rx="8" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="38" y="56" font-size="15" font-weight="bold" fill="#6d28d9">Private Subnet</text>
  <text x="38" y="76" font-size="15" fill="#4b5563">(AZ-a)</text>
  <rect x="38" y="92" width="152" height="100" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="114" y="136" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">App 서버</text>
  <text x="114" y="160" font-size="15" text-anchor="middle" fill="#374151">(사설 IP만)</text>

  <!-- Public Subnet (AZ-a) -->
  <rect x="320" y="32" width="240" height="176" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="334" y="56" font-size="15" font-weight="bold" fill="#1d4ed8">Public Subnet</text>
  <text x="334" y="76" font-size="15" fill="#4b5563">(AZ-a)</text>
  <rect x="334" y="92" width="212" height="100" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="120" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">NAT Gateway</text>
  <text x="440" y="145" font-size="15" text-anchor="middle" fill="#374151">(AZ에 묶인 리소스)</text>
  <text x="440" y="172" font-size="15" text-anchor="middle" fill="#92400e">퍼블릭 IP(EIP)를 가짐</text>

  <!-- App → NAT -->
  <line x1="192" y1="142" x2="332" y2="142" stroke="#374151" stroke-width="2" marker-end="url(#m-ink)"/>
  <text x="262" y="112" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">아웃바운드만</text>
  <text x="262" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">통과</text>

  <!-- NAT — IGW — 인터넷 -->
  <line x1="546" y1="142" x2="620" y2="142" stroke="#374151" stroke-width="2"/>
  <rect x="620" y="110" width="96" height="64" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="668" y="148" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">IGW</text>
  <line x1="716" y1="142" x2="776" y2="142" stroke="#374151" stroke-width="2"/>
  <rect x="776" y="110" width="80" height="64" rx="32" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="816" y="148" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">인터넷</text>

  <line x1="24" y1="236" x2="856" y2="236" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- ── ① 나가는 방향 ── -->
  <text x="24" y="270" font-size="16" font-weight="bold" fill="#1d4ed8">① 나가는 방향<tspan dx="10" font-size="15" font-weight="normal" fill="#4b5563">아웃바운드 요청</tspan></text>
  <path d="M803,264 l5,5 l9,-10" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="824" y="270" font-size="16" font-weight="bold" fill="#047857">가능</text>

  <rect x="72" y="294" width="84" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="114" y="318" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">App</text>
  <rect x="398" y="294" width="84" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="318" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">NAT</text>
  <rect x="626" y="294" width="84" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="668" y="318" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">IGW</text>
  <rect x="776" y="294" width="80" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="816" y="318" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">인터넷</text>
  <line x1="158" y1="312" x2="396" y2="312" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#m-blue)"/>
  <line x1="484" y1="312" x2="624" y2="312" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#m-blue)"/>
  <line x1="712" y1="312" x2="774" y2="312" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#m-blue)"/>

  <line x1="24" y1="352" x2="856" y2="352" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ── ② 응답 트래픽 ── -->
  <text x="24" y="382" font-size="16" font-weight="bold" fill="#047857">② 응답 트래픽<tspan dx="10" font-size="15" font-weight="normal" fill="#4b5563">정상 응답</tspan></text>
  <path d="M629,376 l5,5 l9,-10" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="382" font-size="16" font-weight="bold" fill="#047857">가능<tspan font-size="15" font-weight="normal" fill="#374151"> · 연결 추적으로 되돌려줌</tspan></text>

  <rect x="72" y="406" width="84" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="114" y="430" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">App</text>
  <rect x="398" y="406" width="84" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="430" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">NAT</text>
  <rect x="626" y="406" width="84" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="668" y="430" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">IGW</text>
  <rect x="776" y="406" width="80" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="816" y="430" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">인터넷</text>
  <line x1="774" y1="424" x2="712" y2="424" stroke="#047857" stroke-width="2.5" marker-end="url(#m-green)"/>
  <line x1="624" y1="424" x2="484" y2="424" stroke="#047857" stroke-width="2.5" marker-end="url(#m-green)"/>
  <line x1="396" y1="424" x2="158" y2="424" stroke="#047857" stroke-width="2.5" marker-end="url(#m-green)"/>

  <line x1="24" y1="464" x2="856" y2="464" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ── ③ 외부가 먼저 시작 ── -->
  <text x="24" y="494" font-size="16" font-weight="bold" fill="#b91c1c">③ 외부가 먼저 시작<tspan dx="10" font-size="15" font-weight="normal" fill="#4b5563">차단된 외부 접근</tspan></text>
  <path d="M788,483 l12,12 M800,483 l-12,12" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="808" y="494" font-size="16" font-weight="bold" fill="#b91c1c">불가능</text>

  <rect x="72" y="518" width="84" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="114" y="542" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">App</text>
  <rect x="398" y="518" width="84" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="542" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">NAT</text>
  <rect x="776" y="518" width="80" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="816" y="542" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">인터넷</text>
  <line x1="774" y1="536" x2="484" y2="536" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m-red)"/>
  <line x1="396" y1="536" x2="158" y2="536" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m-red)"/>
  <circle cx="277" cy="536" r="14" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <path d="M271,530 l12,12 M283,530 l-12,12" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="277" y="576" font-size="14" text-anchor="middle" fill="#b91c1c">매핑 없음 → 버림</text>
</svg>
