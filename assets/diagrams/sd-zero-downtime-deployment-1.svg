<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">원인 1. 처리 중인 요청을 두고 프로세스가 죽는다</title>
  <desc id="d">요청 처리 중 SIGTERM 전송으로 인해 프로세스가 즉시 종료되어 네트워크 오류가 발생하는 타임라인 다이어그램</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#1f2933">원인 1. 처리 중인 요청을 두고 프로세스가 죽는다</text>

  <!-- Timeline Axis Container -->
  <rect x="30" y="60" width="820" height="290" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>

  <!-- Vertical Timeline Line -->
  <line x1="150" y1="80" x2="150" y2="330" stroke="#cbd2d9" stroke-width="2"/>

  <!-- Event 1: 14:02:10.900 -->
  <circle cx="150" cy="110" r="5" fill="#2563eb"/>
  <rect x="50" y="98" width="90" height="24" rx="4" fill="#eff6ff"/>
  <text x="95" y="114" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">14:02:10.900</text>
  
  <rect x="175" y="93" width="480" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="187" y="114" font-size="13" font-weight="bold" fill="#1f2933">사용자 요청 도착</text>
  <path d="M305,110 L325,110" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="337" y="114" font-size="13" fill="#1f2933">서버가 DB 조회 시작</text>
  <text x="477" y="114" font-size="12" fill="#52606d">(평소 300ms 걸리는 API)</text>

  <!-- Event 2: 14:02:11.000 -->
  <circle cx="150" cy="170" r="5" fill="#d97706"/>
  <rect x="50" y="158" width="90" height="24" rx="4" fill="#fffbeb"/>
  <text x="95" y="174" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">14:02:11.000</text>

  <rect x="175" y="153" width="220" height="34" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="187" y="174" font-size="13" font-weight="bold" fill="#d97706">배포 시스템이 SIGTERM 전송</text>

  <!-- Event 3: 14:02:11.001 -->
  <circle cx="150" cy="230" r="5" fill="#dc2626"/>
  <rect x="50" y="218" width="90" height="24" rx="4" fill="#fef2f2"/>
  <text x="95" y="234" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">14:02:11.001</text>

  <rect x="175" y="213" width="160" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="187" y="234" font-size="13" font-weight="bold" fill="#dc2626">프로세스 즉시 종료</text>

  <!-- Sub-note (└─) -->
  <path d="M190,252 L190,268 L205,268" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="215" y="255" width="455" height="26" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="223" y="272" font-size="12" fill="#52606d">DB 응답을 기다리던 요청은 응답을 못 받고 연결이 끊긴다</text>

  <!-- Result: 사용자 화면 -->
  <rect x="175" y="302" width="105" height="26" rx="4" fill="#1f2933"/>
  <text x="227" y="319" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">사용자 화면:</text>
  
  <rect x="290" y="298" width="130" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="355" y="319" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">"네트워크 오류"</text>
</svg>