<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SIGTERM 직후 즉시 종료되어 잘리는 요청</title>
  <desc id="d">14:02:10.900에 도착해 DB 응답을 기다리던 요청이, 14:02:11.000 SIGTERM 전송 직후 14:02:11.001에 프로세스가 즉시 종료되면서 연결이 끊기고 사용자 화면에는 네트워크 오류가 뜨는 타임라인.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="152" y="34" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="end">시각</text>
  <text x="206" y="34" font-size="14" font-weight="bold" fill="#4b5563">일어나는 일</text>

  <!-- 요청이 살아 있는 구간: 파란 막대 -->
  <line x1="178" y1="76" x2="178" y2="258" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>

  <!-- ① 요청 도착 -->
  <text x="152" y="82" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">14:02:10.900</text>
  <circle cx="178" cy="76" r="8" fill="#1d4ed8"/>
  <rect x="206" y="50" width="650" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="226" y="82" font-size="16" fill="#1f2937"><tspan font-weight="bold">사용자 요청 도착</tspan><tspan fill="#1d4ed8" font-weight="bold">  →  </tspan><tspan font-weight="bold">서버가 DB 조회 시작</tspan></text>
  <text x="226" y="110" font-size="15" fill="#4b5563">평소 300ms 걸리는 API</text>

  <!-- 대기 중 표시 -->
  <text x="206" y="156" font-size="15" fill="#1d4ed8">⋯ 요청은 DB 응답을 기다리는 중</text>

  <!-- ② SIGTERM -->
  <text x="152" y="198" font-size="15" font-weight="bold" fill="#b45309" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">14:02:11.000</text>
  <circle cx="178" cy="192" r="8" fill="#d97706"/>
  <rect x="206" y="172" width="650" height="42" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="226" y="198" font-size="16" font-weight="bold" fill="#b45309">배포 시스템이 SIGTERM 전송</text>

  <!-- ③ 즉시 종료 -->
  <text x="152" y="258" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">14:02:11.001</text>
  <circle cx="178" cy="252" r="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="172" y1="246" x2="184" y2="258" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <line x1="184" y1="246" x2="172" y2="258" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <rect x="206" y="226" width="650" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="226" y="258" font-size="17" font-weight="bold" fill="#b91c1c">프로세스 즉시 종료</text>
  <text x="226" y="288" font-size="15" fill="#1f2937">└─ DB 응답을 기다리던 요청은 응답을 못 받고 연결이 끊긴다</text>

  <!-- 결과 -->
  <line x1="300" y1="306" x2="300" y2="336" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="152" y="372" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="end">사용자 화면</text>
  <rect x="206" y="342" width="200" height="48" rx="8" fill="#b91c1c"/>
  <text x="306" y="373" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">"네트워크 오류"</text>
</svg>
