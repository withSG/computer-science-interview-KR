<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이진 탐색으로 38 찾기</title>
  <desc id="d">정렬된 배열 [2, 5, 8, 12, 13, 17, 23, 38, 56]에서 38을 찾을 때 lo, mid, hi가 움직이며 매 단계 후보가 절반으로 줄어 9, 4, 2, 1개가 되고 3단계에서 인덱스 7을 반환하는 과정.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="24" y="46" font-size="19" font-weight="bold" fill="#111827">정렬된 배열에서 <tspan fill="#047857">38</tspan>을 찾는다</text>

  <!-- 인덱스 머리행 -->
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="62" y="90" text-anchor="start">idx</text>
    <text x="133" y="90">0</text>
    <text x="189" y="90">1</text>
    <text x="245" y="90">2</text>
    <text x="301" y="90">3</text>
    <text x="357" y="90">4</text>
    <text x="413" y="90">5</text>
    <text x="469" y="90">6</text>
    <text x="525" y="90">7</text>
    <text x="581" y="90">8</text>
  </g>

  <!-- ===== 1단계 ===== -->
  <circle cx="38" cy="124" r="15" fill="#1f2937"/>
  <text x="38" y="130" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="62" y="129" font-size="15" fill="#4b5563">arr</text>

  <g stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
    <rect x="108" y="102" width="50" height="44" rx="6"/>
    <rect x="164" y="102" width="50" height="44" rx="6"/>
    <rect x="220" y="102" width="50" height="44" rx="6"/>
    <rect x="276" y="102" width="50" height="44" rx="6"/>
    <rect x="388" y="102" width="50" height="44" rx="6"/>
    <rect x="444" y="102" width="50" height="44" rx="6"/>
    <rect x="500" y="102" width="50" height="44" rx="6"/>
    <rect x="556" y="102" width="50" height="44" rx="6"/>
  </g>
  <rect x="332" y="102" width="50" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="133" y="130">2</text>
    <text x="189" y="130">5</text>
    <text x="245" y="130">8</text>
    <text x="301" y="130">12</text>
    <text x="357" y="130" fill="#92400e">13</text>
    <text x="413" y="130">17</text>
    <text x="469" y="130">23</text>
    <text x="525" y="130">38</text>
    <text x="581" y="130">56</text>
  </g>

  <line x1="133" y1="172" x2="133" y2="151" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="357" y1="172" x2="357" y2="151" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="581" y1="172" x2="581" y2="151" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="133" y="190" fill="#1d4ed8">lo=0</text>
    <text x="357" y="190" fill="#b45309">mid=4</text>
    <text x="581" y="190" fill="#1d4ed8">hi=8</text>
  </g>

  <rect x="628" y="102" width="228" height="92" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="644" y="129" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[4] = 13 &lt; 38</text>
  <text x="644" y="155" font-size="15" fill="#b91c1c">→ 왼쪽 절반은 전부 탈락</text>
  <text x="644" y="180" font-size="15" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lo = 5</text>

  <!-- ===== 2단계 ===== -->
  <circle cx="38" cy="254" r="15" fill="#1f2937"/>
  <text x="38" y="260" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="62" y="259" font-size="15" fill="#4b5563">arr</text>

  <g stroke="#d1d5db" stroke-width="1" fill="#f3f4f6">
    <rect x="108" y="232" width="50" height="44" rx="6"/>
    <rect x="164" y="232" width="50" height="44" rx="6"/>
    <rect x="220" y="232" width="50" height="44" rx="6"/>
    <rect x="276" y="232" width="50" height="44" rx="6"/>
    <rect x="332" y="232" width="50" height="44" rx="6"/>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
    <rect x="388" y="232" width="50" height="44" rx="6"/>
    <rect x="500" y="232" width="50" height="44" rx="6"/>
    <rect x="556" y="232" width="50" height="44" rx="6"/>
  </g>
  <rect x="444" y="232" width="50" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <g font-size="16" fill="#4b5563" text-anchor="middle">
    <text x="133" y="259">x</text>
    <text x="189" y="259">x</text>
    <text x="245" y="259">x</text>
    <text x="301" y="259">x</text>
    <text x="357" y="259">x</text>
  </g>
  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="413" y="260">17</text>
    <text x="469" y="260" fill="#92400e">23</text>
    <text x="525" y="260">38</text>
    <text x="581" y="260">56</text>
  </g>

  <line x1="413" y1="302" x2="413" y2="281" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="469" y1="302" x2="469" y2="281" stroke="#b45309" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="581" y1="302" x2="581" y2="281" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="413" y="320" fill="#1d4ed8">lo=5</text>
    <text x="469" y="320" fill="#b45309">mid=6</text>
    <text x="581" y="320" fill="#1d4ed8">hi=8</text>
  </g>

  <rect x="628" y="232" width="228" height="92" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="644" y="259" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[6] = 23 &lt; 38</text>
  <text x="644" y="285" font-size="15" fill="#b91c1c">→ 또 절반 탈락</text>
  <text x="644" y="310" font-size="15" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">lo = 7</text>

  <!-- ===== 3단계 ===== -->
  <circle cx="38" cy="384" r="15" fill="#1f2937"/>
  <text x="38" y="390" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="62" y="389" font-size="15" fill="#4b5563">arr</text>

  <g stroke="#d1d5db" stroke-width="1" fill="#f3f4f6">
    <rect x="108" y="362" width="50" height="44" rx="6"/>
    <rect x="164" y="362" width="50" height="44" rx="6"/>
    <rect x="220" y="362" width="50" height="44" rx="6"/>
    <rect x="276" y="362" width="50" height="44" rx="6"/>
    <rect x="332" y="362" width="50" height="44" rx="6"/>
    <rect x="388" y="362" width="50" height="44" rx="6"/>
    <rect x="444" y="362" width="50" height="44" rx="6"/>
  </g>
  <rect x="556" y="362" width="50" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="500" y="362" width="50" height="44" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2.5"/>
  <g font-size="16" fill="#4b5563" text-anchor="middle">
    <text x="133" y="389">x</text>
    <text x="189" y="389">x</text>
    <text x="245" y="389">x</text>
    <text x="301" y="389">x</text>
    <text x="357" y="389">x</text>
    <text x="413" y="389">x</text>
    <text x="469" y="389">x</text>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <text x="525" y="390" fill="#065f46">38</text>
    <text x="581" y="390" fill="#111827">56</text>
  </g>

  <line x1="525" y1="432" x2="525" y2="411" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="581" y1="432" x2="581" y2="411" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="525" y="450" fill="#1d4ed8">lo=7</text>
    <text x="525" y="470" fill="#047857">mid=7</text>
    <text x="581" y="450" fill="#1d4ed8">hi=8</text>
  </g>

  <rect x="628" y="362" width="228" height="92" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="644" y="389" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">arr[7] = 38</text>
  <text x="644" y="415" font-size="15" font-weight="bold" fill="#047857">→ 발견</text>
  <text x="644" y="440" font-size="15" font-weight="bold" fill="#065f46">인덱스 7 반환</text>

  <!-- ===== 후보 개수 요약 ===== -->
  <line x1="24" y1="500" x2="856" y2="500" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="24" y="542" font-size="16" font-weight="bold" fill="#111827">후보 개수</text>

  <rect x="130" y="520" width="198" height="32" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="380" y="520" width="88" height="32" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="520" y="520" width="44" height="32" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="616" y="520" width="22" height="32" rx="5" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="229" y="542" fill="#1e3a8a">9</text>
    <text x="424" y="542" fill="#1e3a8a">4</text>
    <text x="542" y="542" fill="#1e3a8a">2</text>
    <text x="627" y="542" fill="#065f46">1</text>
  </g>
  <line x1="338" y1="536" x2="371" y2="536" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <line x1="476" y1="536" x2="511" y2="536" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <line x1="572" y1="536" x2="607" y2="536" stroke="#374151" stroke-width="2" marker-end="url(#ak)"/>
  <text x="654" y="542" font-size="15" fill="#4b5563">(매 단계 절반)</text>
</svg>
