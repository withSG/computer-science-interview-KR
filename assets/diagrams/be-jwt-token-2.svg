<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HS256 vs RS256</title>
  <desc id="d">HS256 대칭키 방식과 RS256 비대칭키 방식의 발급 및 검증 구조 비교 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 전체 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- ==================== LEFT COLUMN: HS256 (대칭키) ==================== -->
  <!-- HS256 구역 배경 -->
  <rect x="24" y="20" width="404" height="350" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- HS256 제목 -->
  <text x="226" y="49.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[HS256 — 대칭키]</text>

  <!-- 발급 서버 섹션 -->
  <text x="120" y="88.2" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">발급 서버</text>
  
  <!-- secret 박스 (HS256 발급) -->
  <rect x="52" y="102" width="64" height="32" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="84" y="122.05" font-size="13" fill="#d97706" text-anchor="middle">secret</text>

  <!-- 서명 화살표 (HS256) -->
  <path d="M116,118 L170,118" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="127" y="106" width="32" height="20" fill="#ffffff"/>
  <text x="143" y="120.05" font-size="11.5" fill="#1f2933" text-anchor="middle">서명</text>

  <!-- JWT 박스 (HS256) -->
  <rect x="172" y="102" width="56" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="122.05" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">JWT</text>

  <!-- JWT 이동 화살표 (HS256) -->
  <path d="M200,134 L200,174" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 검증 서버 섹션 -->
  <text x="120" y="168.2" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">검증 서버</text>

  <!-- secret 박스 (HS256 검증) -->
  <rect x="52" y="182" width="64" height="32" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="84" y="202.05" font-size="13" fill="#d97706" text-anchor="middle">secret</text>

  <!-- 검증 화살표 (HS256) -->
  <path d="M116,198 L170,198" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="127" y="186" width="32" height="20" fill="#ffffff"/>
  <text x="143" y="200.05" font-size="11.5" fill="#1f2933" text-anchor="middle">검증</text>

  <!-- OK 박스 (HS256) -->
  <rect x="172" y="182" width="48" height="32" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="196" y="202.05" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">OK</text>

  <!-- HS256 설명 / 주석 -->
  <rect x="44" y="244" width="364" height="106" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="56" y="272.05" font-size="13" fill="#dc2626">→ 검증하려면 서명할 수 있는</text>
  <text x="74" y="298.05" font-size="13" fill="#dc2626">키를 그대로 줘야 한다</text>


  <!-- ==================== RIGHT COLUMN: RS256 (비대칭키) ==================== -->
  <!-- RS256 구역 배경 -->
  <rect x="452" y="20" width="404" height="350" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- RS256 제목 -->
  <text x="654" y="49.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[RS256 — 비대칭키]</text>

  <!-- 인증 서버 섹션 -->
  <text x="548" y="88.2" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">인증 서버</text>

  <!-- 개인키 박스 -->
  <rect x="480" y="102" width="64" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="512" y="122.05" font-size="13" fill="#7c3aed" text-anchor="middle">개인키</text>

  <!-- 서명 화살표 (RS256) -->
  <path d="M544,118 L598,118" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="555" y="106" width="32" height="20" fill="#ffffff"/>
  <text x="571" y="120.05" font-size="11.5" fill="#1f2933" text-anchor="middle">서명</text>

  <!-- JWT 박스 (RS256) -->
  <rect x="600" y="102" width="56" height="32" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="628" y="122.05" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">JWT</text>

  <!-- JWT 이동 화살표 (RS256) -->
  <path d="M628,134 L628,174" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 검증 서버 A/B/C 섹션 -->
  <text x="548" y="168.2" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">검증 서버 A/B/C</text>

  <!-- 공개키 박스 -->
  <rect x="480" y="182" width="64" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="512" y="202.05" font-size="13" fill="#7c3aed" text-anchor="middle">공개키</text>

  <!-- 검증 화살표 (RS256) -->
  <path d="M544,198 L598,198" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="555" y="186" width="32" height="20" fill="#ffffff"/>
  <text x="571" y="200.05" font-size="11.5" fill="#1f2933" text-anchor="middle">검증</text>

  <!-- OK 박스 (RS256) -->
  <rect x="600" y="182" width="48" height="32" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="624" y="202.05" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">OK</text>

  <!-- RS256 설명 / 주석 -->
  <rect x="472" y="244" width="364" height="106" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="484" y="272.05" font-size="13" fill="#059669">→ 검증만 가능. 공개키가 유출돼도</text>
  <text x="502" y="298.05" font-size="13" fill="#059669">토큰을 만들 수 없다</text>
</svg>