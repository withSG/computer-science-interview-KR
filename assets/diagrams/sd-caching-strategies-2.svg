<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">쓰기 전략</title>
  <desc id="d">Write-Through, Write-Back, Write-Around 쓰기 전략의 캐시 및 DB 상호작용 흐름을 설명하는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <rect width="880" height="770" fill="#ffffff"/>

  <!-- 메인 제목 -->
  <text x="30" y="41" font-size="16" font-weight="bold" fill="#1f2933">3. 쓰기 전략</text>

  <!-- Section 1: Write-Through -->
  <rect x="30" y="60" width="820" height="210" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="50" y="93" font-size="14" font-weight="bold" fill="#2563eb">[Write-Through]</text>
  <text x="180" y="93" font-size="13" fill="#52606d">둘 다, 지금, 동기로</text>

  <!-- 노드: App, Cache, DB -->
  <rect x="70" y="125" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="115" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">App</text>

  <rect x="300" y="125" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="345" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">Cache</text>

  <rect x="530" y="125" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="575" y="149" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">DB</text>

  <!-- 화살표: App -> Cache (write) -->
  <path d="M160,145 L300,145" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="208" y="132" width="44" height="18" fill="#ffffff"/>
  <text x="230" y="145" font-size="11.5" text-anchor="middle" fill="#2563eb">write</text>

  <!-- 화살표: Cache -> DB (write) -->
  <path d="M390,145 L530,145" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="438" y="132" width="44" height="18" fill="#ffffff"/>
  <text x="460" y="145" font-size="11.5" text-anchor="middle" fill="#2563eb">write</text>

  <!-- 화살표: DB -> ... (ack) -->
  <path d="M620,145 L720,145" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="653" y="132" width="34" height="18" fill="#ffffff"/>
  <text x="670" y="145" font-size="11.5" text-anchor="middle" fill="#2563eb">ack</text>

  <!-- 점선: ... -> App -->
  <text x="732" y="149" font-size="13" font-weight="bold" fill="#2563eb">...</text>
  <path d="M750,145 L770,145 L770,195 L115,195 L115,165" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>

  <!-- 부가 설명 -->
  <text x="50" y="240" font-size="13" fill="#1f2933">쓰기 응답이 DB 왕복을 포함한다</text>


  <!-- Section 2: Write-Back -->
  <rect x="30" y="290" width="820" height="230" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="50" y="323" font-size="14" font-weight="bold" fill="#7c3aed">[Write-Back]</text>
  <text x="155" y="323" font-size="13" fill="#52606d">캐시에만 먼저, DB는 나중에</text>

  <!-- 노드: App, Cache, DB -->
  <rect x="70" y="355" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="115" y="379" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">App</text>

  <rect x="300" y="355" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="345" y="379" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">Cache</text>

  <rect x="530" y="445" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="575" y="469" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">DB</text>

  <!-- 화살표: App -> Cache (write) -->
  <path d="M160,365 L300,365" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="208" y="352" width="44" height="18" fill="#ffffff"/>
  <text x="230" y="365" font-size="11.5" text-anchor="middle" fill="#7c3aed">write</text>

  <!-- 화살표: Cache -> App (ack) -->
  <path d="M300,385 L160,385" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="213" y="372" width="34" height="18" fill="#ffffff"/>
  <text x="230" y="385" font-size="11.5" text-anchor="middle" fill="#7c3aed">ack</text>

  <!-- 비고: (여기서 사용자 응답 끝) -->
  <text x="405" y="379" font-size="13" fill="#52606d">(여기서 사용자 응답 끝)</text>

  <!-- 경로: Cache -> DB (비동기 배치) -->
  <path d="M345,395 L345,465 L530,465" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
  <rect x="390" y="452" width="90" height="18" fill="#ffffff"/>
  <text x="435" y="465" font-size="11.5" text-anchor="middle" fill="#7c3aed">(비동기 배치)</text>


  <!-- Section 3: Write-Around -->
  <rect x="30" y="540" width="820" height="200" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="50" y="573" font-size="14" font-weight="bold" fill="#d97706">[Write-Around]</text>
  <text x="175" y="573" font-size="13" fill="#52606d">DB에만 쓰고 캐시는 채우지 않는다</text>

  <!-- 노드: App, DB -->
  <rect x="70" y="605" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="115" y="629" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">App</text>

  <rect x="300" y="605" width="90" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="345" y="629" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">DB</text>

  <!-- 화살표: App -> DB (write) -->
  <path d="M160,615 L300,615" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="208" y="602" width="44" height="18" fill="#ffffff"/>
  <text x="230" y="615" font-size="11.5" text-anchor="middle" fill="#d97706">write</text>

  <!-- 화살표: DB -> App (ack) -->
  <path d="M300,635 L160,635" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="213" y="622" width="34" height="18" fill="#ffffff"/>
  <text x="230" y="635" font-size="11.5" text-anchor="middle" fill="#d97706">ack</text>

  <!-- 하단 부가 설명 및 가이드 -->
  <path d="M115,645 L115,690 L130,690" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="138" y="694" font-size="13" fill="#1f2933">캐시에 새 값을 넣지 않는다. 다음 읽기 때 Cache-Aside로 채워짐</text>
</svg>