<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 800" width="880" height="800" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">쓰기 전략 세 가지</title>
  <desc id="d">Write-Through는 App이 Cache와 DB에 동기로 쓰고 DB의 ack를 받은 뒤 응답한다. Write-Back은 Cache에만 쓰고 바로 ack로 응답을 끝낸 뒤 비동기 배치로 DB에 쓴다. Write-Around는 DB에만 쓰고 캐시에는 새 값을 넣지 않아 다음 읽기 때 Cache-Aside로 채워진다.</desc>
  <rect width="880" height="800" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ───────── Write-Through ───────── -->
  <rect x="24" y="20" width="832" height="236" rx="10" fill="#f5f9ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="52" font-size="19" font-weight="bold" fill="#1d4ed8">Write-Through</text>
  <text x="210" y="52" font-size="16" fill="#374151">둘 다, 지금, 동기로</text>

  <rect x="110" y="68" width="120" height="34" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="90" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">App</text>
  <rect x="380" y="68" width="120" height="34" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="90" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Cache</text>
  <rect x="650" y="68" width="120" height="34" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="710" y="90" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>

  <line x1="170" y1="102" x2="170" y2="220" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="440" y1="102" x2="440" y2="220" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="710" y1="102" x2="710" y2="220" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="164" y="124" width="12" height="88" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1"/>

  <line x1="176" y1="132" x2="437" y2="132" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="305" y="124" font-size="15" fill="#1d4ed8" text-anchor="middle">write</text>
  <line x1="440" y1="168" x2="707" y2="168" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="575" y="160" font-size="15" fill="#1d4ed8" text-anchor="middle">write</text>
  <line x1="710" y1="204" x2="179" y2="204" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="575" y="196" font-size="15" fill="#1d4ed8" text-anchor="middle">ack</text>

  <text x="44" y="242" font-size="15" fill="#1f2937">쓰기 응답이 DB 왕복을 포함한다</text>

  <!-- ───────── Write-Back ───────── -->
  <rect x="24" y="272" width="832" height="250" rx="10" fill="#faf7ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="304" font-size="19" font-weight="bold" fill="#6d28d9">Write-Back</text>
  <text x="176" y="304" font-size="16" fill="#374151">캐시에만 먼저, DB는 나중에</text>

  <rect x="110" y="320" width="120" height="34" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="342" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">App</text>
  <rect x="380" y="320" width="120" height="34" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="342" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Cache</text>
  <rect x="650" y="320" width="120" height="34" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="710" y="342" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>

  <line x1="170" y1="354" x2="170" y2="506" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="440" y1="354" x2="440" y2="506" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="710" y1="354" x2="710" y2="506" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="164" y="376" width="12" height="48" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1"/>

  <line x1="176" y1="384" x2="437" y2="384" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="305" y="376" font-size="15" fill="#6d28d9" text-anchor="middle">write</text>
  <line x1="440" y1="416" x2="179" y2="416" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-purple)"/>
  <text x="305" y="408" font-size="15" fill="#6d28d9" text-anchor="middle">ack</text>

  <line x1="44" y1="442" x2="496" y2="442" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="654" y1="442" x2="836" y2="442" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="575" y="447" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">여기서 사용자 응답 끝</text>

  <line x1="440" y1="488" x2="707" y2="488" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-purple)"/>
  <text x="575" y="480" font-size="15" fill="#6d28d9" text-anchor="middle">(비동기 배치)</text>

  <!-- ───────── Write-Around ───────── -->
  <rect x="24" y="538" width="832" height="238" rx="10" fill="#fffbf2" stroke="#b45309" stroke-width="1.5"/>
  <text x="44" y="570" font-size="19" font-weight="bold" fill="#b45309">Write-Around</text>
  <text x="200" y="570" font-size="16" fill="#374151">DB에만 쓰고 캐시는 채우지 않는다</text>

  <rect x="110" y="586" width="120" height="34" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="608" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">App</text>
  <rect x="380" y="586" width="120" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="608" font-size="16" fill="#4b5563" text-anchor="middle">Cache</text>
  <rect x="650" y="586" width="120" height="34" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="710" y="608" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>

  <line x1="170" y1="620" x2="170" y2="708" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="710" y1="620" x2="710" y2="708" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="164" y="642" width="12" height="52" fill="#fde68a" stroke="#b45309" stroke-width="1"/>

  <line x1="176" y1="650" x2="707" y2="650" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="305" y="642" font-size="15" fill="#b45309" text-anchor="middle">write</text>
  <line x1="710" y1="686" x2="179" y2="686" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-amber)"/>
  <text x="575" y="678" font-size="15" fill="#b45309" text-anchor="middle">ack</text>

  <text x="44" y="744" font-size="15" fill="#1f2937">캐시에 새 값을 넣지 않는다. 다음 읽기 때 Cache-Aside로 채워짐</text>
</svg>
