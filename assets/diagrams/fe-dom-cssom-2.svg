<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DOM 트리와 렌더 트리 비교</title>
  <desc id="d">DOM 트리에서 비시각적 노드 및 display:none 노드가 제외되고 가상 요소가 추가되어 렌더 트리가 형성되는 과정을 보여주는 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Labels -->
  <text x="210" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">DOM 트리</text>
  <text x="670" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">렌더 트리</text>

  <!-- Left Main Box: DOM Tree -->
  <rect x="40" y="60" width="340" height="400" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Left Tree Nodes (DOM) -->
  <text x="60" y="98" font-size="13" fill="#1f2933">html</text>

  <text x="60" y="132" font-size="13" fill="#52606d">├─</text>
  <rect x="80" y="115" width="80" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="120" y="131" font-size="13" fill="#dc2626" text-anchor="middle">head</text>

  <text x="80" y="162" font-size="13" fill="#52606d">│  ├─</text>
  <rect x="115" y="145" width="80" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="155" y="161" font-size="13" fill="#dc2626" text-anchor="middle">meta</text>

  <text x="80" y="192" font-size="13" fill="#52606d">│  ├─</text>
  <rect x="115" y="175" width="80" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="155" y="191" font-size="13" fill="#dc2626" text-anchor="middle">title</text>

  <text x="80" y="222" font-size="13" fill="#52606d">│  └─</text>
  <rect x="115" y="205" width="80" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="155" y="221" font-size="13" fill="#dc2626" text-anchor="middle">style</text>

  <text x="60" y="258" font-size="13" fill="#52606d">└─</text>
  <text x="80" y="258" font-size="13" fill="#1f2933">body</text>

  <text x="80" y="292" font-size="13" fill="#52606d">├─</text>
  <text x="100" y="292" font-size="13" fill="#1f2933">header</text>

  <text x="80" y="326" font-size="13" fill="#52606d">├─</text>
  <text x="100" y="326" font-size="13" fill="#1f2933">main</text>

  <text x="100" y="360" font-size="13" fill="#52606d">└─</text>
  <text x="120" y="360" font-size="13" fill="#1f2933">p</text>

  <text x="80" y="398" font-size="13" fill="#52606d">├─</text>
  <rect x="100" y="381" width="80" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="140" y="397" font-size="13" fill="#dc2626" text-anchor="middle">aside</text>

  <text x="80" y="432" font-size="13" fill="#52606d">└─</text>
  <text x="100" y="432" font-size="13" fill="#1f2933">footer</text>


  <!-- Right Main Box: Render Tree -->
  <rect x="500" y="60" width="340" height="400" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Right Tree Nodes (Render Tree) -->
  <text x="520" y="98" font-size="13" fill="#1f2933">html</text>

  <text x="520" y="132" font-size="13" fill="#52606d">└─</text>
  <text x="540" y="132" font-size="13" fill="#1f2933">body</text>

  <text x="540" y="166" font-size="13" fill="#52606d">├─</text>
  <text x="560" y="166" font-size="13" fill="#1f2933">header</text>

  <text x="540" y="200" font-size="13" fill="#52606d">├─</text>
  <text x="560" y="200" font-size="13" fill="#1f2933">main</text>

  <text x="560" y="234" font-size="13" fill="#52606d">├─</text>
  <rect x="580" y="217" width="90" height="24" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="625" y="233" font-size="13" fill="#7c3aed" text-anchor="middle">::before</text>

  <text x="560" y="268" font-size="13" fill="#52606d">└─</text>
  <text x="580" y="268" font-size="13" fill="#1f2933">p</text>

  <text x="540" y="302" font-size="13" fill="#52606d">└─</text>
  <text x="560" y="302" font-size="13" fill="#1f2933">footer</text>


  <!-- Arrows and Exclusion Labels (Middle Area) -->
  <!-- head 제외 -->
  <path d="M165,127 L430,127" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="360" y="117" width="48" height="20" fill="#ffffff"/>
  <text x="384" y="131" font-size="13" fill="#dc2626" text-anchor="middle">제외 →</text>

  <!-- meta 제외 -->
  <path d="M200,157 L430,157" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="360" y="147" width="36" height="20" fill="#ffffff"/>
  <text x="378" y="161" font-size="13" fill="#dc2626" text-anchor="middle">제외</text>

  <!-- title 제외 -->
  <path d="M200,187 L430,187" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="360" y="177" width="36" height="20" fill="#ffffff"/>
  <text x="378" y="191" font-size="13" fill="#dc2626" text-anchor="middle">제외</text>

  <!-- style 제외 -->
  <path d="M200,217 L430,217" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="360" y="207" width="36" height="20" fill="#ffffff"/>
  <text x="378" y="221" font-size="13" fill="#dc2626" text-anchor="middle">제외</text>

  <!-- aside display:none → 제외 -->
  <path d="M185,393 L430,393" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="290" y="383" width="138" height="20" fill="#ffffff"/>
  <text x="359" y="397" font-size="13" fill="#dc2626" text-anchor="middle">display:none → 제외</text>

  <!-- Arrow pointing to ::before (DOM엔 없던 노드) -->
  <path d="M780,229 L675,229" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="680" y="233" font-size="13" fill="#7c3aed">← DOM엔 없던 노드</text>
</svg>