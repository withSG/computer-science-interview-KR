<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HNSW (Hierarchical Navigable Small World)</title>
  <desc id="d">HNSW 계층적 그래프 구조와 검색 방식, 장단점을 나타낸 다이어그램</desc>
  <rect width="880" height="580" fill="#ffffff"/>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Section Title -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">계층적 그래프 구조로 검색</text>

  <!-- Main Container Background for Layers -->
  <rect x="30" y="55" width="820" height="340" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="8"/>

  <!-- Horizontal Connection Lines for Layers -->
  <!-- Layer 3 -->
  <path d="M 120 95 L 760 95" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <!-- Layer 2 -->
  <path d="M 120 170 L 760 170" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <!-- Layer 1 -->
  <path d="M 120 245 L 760 245" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <!-- Layer 0 -->
  <path d="M 120 320 L 760 320" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Vertical Connection Lines between Layers -->
  <!-- A: x = 120 -->
  <path d="M 120 95 L 120 320" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <!-- B: x = 760 -->
  <path d="M 760 95 L 760 320" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <!-- C: x = 440 -->
  <path d="M 440 170 L 440 320" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <!-- D: x = 226 -->
  <path d="M 226 245 L 226 320" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <!-- E: x = 654 -->
  <path d="M 654 245 L 654 320" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- Layer Labels & Notes -->
  <!-- Layer 3 -->
  <text x="50" y="99" font-size="14" font-weight="bold" fill="#1f2933">Layer 3:</text>
  <text x="800" y="99" font-size="13" fill="#52606d" text-anchor="middle">(희소)</text>

  <!-- Layer 2 -->
  <text x="50" y="174" font-size="14" font-weight="bold" fill="#1f2933">Layer 2:</text>

  <!-- Layer 1 -->
  <text x="50" y="249" font-size="14" font-weight="bold" fill="#1f2933">Layer 1:</text>

  <!-- Layer 0 -->
  <text x="50" y="324" font-size="14" font-weight="bold" fill="#1f2933">Layer 0:</text>
  <text x="800" y="324" font-size="13" fill="#52606d" text-anchor="middle">(밀집)</text>

  <!-- Nodes Overlay -->

  <!-- Layer 3 Nodes -->
  <!-- [A] -->
  <rect x="102" y="77" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="120" y="100" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
  <!-- [B] -->
  <rect x="742" y="77" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="760" y="100" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">B</text>

  <!-- Layer 2 Nodes -->
  <!-- [A] -->
  <rect x="102" y="152" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="120" y="175" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
  <!-- [C] -->
  <rect x="422" y="152" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="440" y="175" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">C</text>
  <!-- [B] -->
  <rect x="742" y="152" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="760" y="175" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">B</text>

  <!-- Layer 1 Nodes -->
  <!-- [A] -->
  <rect x="102" y="227" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="120" y="250" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
  <!-- [D] -->
  <rect x="208" y="227" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="226" y="250" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">D</text>
  <!-- [C] -->
  <rect x="422" y="227" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="440" y="250" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">C</text>
  <!-- [E] -->
  <rect x="636" y="227" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="654" y="250" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">E</text>
  <!-- [B] -->
  <rect x="742" y="227" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="760" y="250" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">B</text>

  <!-- Layer 0 Nodes -->
  <!-- [A] -->
  <rect x="102" y="302" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="120" y="325" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
  <!-- [D] -->
  <rect x="208" y="302" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="226" y="325" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">D</text>
  <!-- [F] -->
  <rect x="315" y="302" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="333" y="325" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">F</text>
  <!-- [C] -->
  <rect x="422" y="302" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="440" y="325" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">C</text>
  <!-- [E] -->
  <rect x="636" y="302" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="654" y="325" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">E</text>
  <!-- [G] -->
  <rect x="689" y="302" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="707" y="325" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">G</text>
  <!-- [B] -->
  <rect x="742" y="302" width="36" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="760" y="325" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">B</text>

  <!-- Lower Section: Search Description and Pros/Cons -->
  <!-- Search flow / process -->
  <rect x="30" y="415" width="820" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="6"/>
  <path d="M 285 435 L 300 435" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="0" fill="none" marker-end="url(#a-blue)"/>
  <text x="45" y="440" font-size="13" font-weight="bold" fill="#1f2933">검색:</text>
  <text x="90" y="440" font-size="13" fill="#1f2933">상위 레이어에서 대략적 위치</text>
  <text x="310" y="440" font-size="13" fill="#1f2933">하위로 정밀 검색</text>

  <!-- Pros Box -->
  <rect x="30" y="470" width="400" height="80" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="6"/>
  <text x="48" y="498" font-size="13" font-weight="bold" fill="#059669">장점:</text>
  <text x="92" y="498" font-size="13" fill="#1f2933">빠른 검색 (log n), 높은 정확도</text>

  <!-- Cons Box -->
  <rect x="450" y="470" width="400" height="80" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="6"/>
  <text x="468" y="498" font-size="13" font-weight="bold" fill="#dc2626">단점:</text>
  <text x="512" y="498" font-size="13" fill="#1f2933">메모리 사용량 많음</text>
</svg>