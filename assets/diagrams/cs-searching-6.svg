<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 음수 간선을 못 다루나</title>
  <desc id="d">다익스트라 알고리즘이 음수 간선을 처리하지 못하는 이유를 설명하는 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="30" y="40.6" font-size="16" font-weight="bold" fill="#1f2933">왜 음수 간선을 못 다루나</text>
  <rect x="30" y="60" width="820" height="210" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M245,110 L575,110" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
  <rect x="398" y="96" width="24" height="20" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="410" y="110.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">(5)</text>
  <path d="M220,135 L220,195" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <rect x="208" y="153" width="24" height="20" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="220" y="167.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">(2)</text>
  <path d="M600,135 L600,220 L245,220" stroke="#dc2626" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#a-red)"/>
  <rect x="583" y="165" width="34" height="20" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="600" y="179.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">(-4)</text>
  <circle cx="220" cy="110" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="114.9" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
  <circle cx="600" cy="110" r="22" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="600" y="114.9" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>
  <circle cx="220" cy="220" r="22" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
  <text x="220" y="224.9" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>
  <rect x="30" y="290" width="820" height="200" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="50" y="321.55" font-size="13" font-weight="bold" fill="#1f2933">A에서 출발:</text>
  <rect x="50" y="336" width="780" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="65" y="360.55" font-size="13" font-weight="bold" fill="#2563eb">1)</text>
  <text x="85" y="360.55" font-size="13" fill="#1f2933">큐에서 가장 가까운 C(거리 2)를 꺼낸다. 교과서 다익스트라는 이 순간 C를 확정하고 방문 표시한다</text>
  <rect x="50" y="386" width="780" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="65" y="410.55" font-size="13" font-weight="bold" fill="#d97706">2)</text>
  <text x="85" y="410.55" font-size="13" fill="#1f2933">이어서 B(거리 5)를 처리하다가 B→C = 5 + (-4) = 1 을 발견</text>
  <rect x="50" y="436" width="780" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="65" y="460.55" font-size="13" font-weight="bold" fill="#dc2626">3)</text>
  <text x="85" y="460.55" font-size="13" fill="#1f2933">그런데 C는 이미 확정돼 다시 보지 않는다 → dist[C]가 2로 남는다 (오답)</text>
</svg>