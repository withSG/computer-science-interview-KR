<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">다익스트라가 음수 간선에서 틀리는 예</title>
  <desc id="d">A→B(5), A→C(2), B→C(-4) 그래프에서 A에서 출발하면 다익스트라는 가장 가까운 C(거리 2)를 먼저 꺼내 확정한다. 이어서 B(거리 5)를 처리하다 B→C = 5 + (-4) = 1을 발견하지만 C는 이미 확정돼 다시 보지 않으므로 dist[C]가 2로 남는다(오답).</desc>
  <rect width="880" height="372" fill="#ffffff"/>
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ===== 그래프 ===== -->
  <rect x="24" y="24" width="368" height="324" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- A → B (5) -->
  <line x1="136" y1="112" x2="276" y2="112" stroke="#4b5563" stroke-width="2.5" marker-end="url(#mk)"/>
  <text x="208" y="98" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">5</text>
  <!-- A → C (2) -->
  <line x1="110" y1="138" x2="110" y2="256" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#mb)"/>
  <text x="92" y="204" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="end">2</text>
  <!-- B → C (-4) -->
  <line x1="289.19" y1="130.73" x2="136.76" y2="267.92" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#mr)"/>
  <text x="228" y="226" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">-4</text>

  <!-- 노드 -->
  <circle cx="110" cy="112" r="26" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="310" cy="112" r="26" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="110" cy="292" r="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="110" y="119" fill="#111827">A</text>
    <text x="310" y="119" fill="#111827">B</text>
    <text x="110" y="299" fill="#1e3a8a">C</text>
  </g>

  <!-- 노드 옆 상태 -->
  <text x="110" y="70" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">출발</text>
  <text x="310" y="70" font-size="15" fill="#374151" text-anchor="middle">거리 5</text>
  <text x="150" y="298" font-size="16" font-weight="bold" fill="#1d4ed8">거리 2로 확정</text>

  <!-- ===== 진행 단계 ===== -->
  <text x="412" y="46" font-size="18" font-weight="bold" fill="#111827">A에서 출발</text>

  <!-- 1 -->
  <rect x="412" y="62" width="444" height="102" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="440" cy="90" r="14" fill="#1d4ed8"/>
  <text x="440" y="95" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="466" y="96" font-size="16" fill="#111827">큐에서 가장 가까운 <tspan font-weight="bold">C(거리 2)</tspan>를 꺼낸다.<tspan x="466" dy="26">교과서 다익스트라는 이 순간 C를 <tspan font-weight="bold" fill="#1d4ed8">확정</tspan>하고</tspan><tspan x="466" dy="26">방문 표시한다</tspan></text>

  <!-- 2 -->
  <rect x="412" y="178" width="444" height="76" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <circle cx="440" cy="206" r="14" fill="#b45309"/>
  <text x="440" y="211" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="466" y="212" font-size="16" fill="#111827">이어서 <tspan font-weight="bold">B(거리 5)</tspan>를 처리하다가<tspan x="466" dy="26"><tspan font-weight="bold" fill="#92400e">B→C = 5 + (-4) = 1</tspan> 을 발견</tspan></text>

  <!-- 3 -->
  <rect x="412" y="268" width="444" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="440" cy="296" r="14" fill="#b91c1c"/>
  <text x="440" y="301" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="466" y="302" font-size="16" fill="#111827">그런데 C는 이미 확정돼 다시 보지 않는다<tspan x="466" dy="26">→ <tspan font-weight="bold">dist[C]가 2로 남는다</tspan> <tspan font-weight="bold" fill="#b91c1c">(오답)</tspan></tspan></text>
</svg>
