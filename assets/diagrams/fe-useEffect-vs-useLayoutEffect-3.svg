<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">useLayoutEffect로 바꿨을 때</title>
  <desc id="d">useLayoutEffect로 툴팁 높이를 잴 때의 5단계 실행 순서. 렌더, 커밋, useLayoutEffect의 높이 측정과 setHeight(32), 다시 렌더와 커밋이 모두 페인트 전에 끝나고, 5단계 페인트에서 사용자는 처음부터 올바른 위치만 보므로 깜빡임이 없다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="24" y="44" font-size="18" font-weight="bold" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">useLayoutEffect</tspan>로 바꿨을 때</text>

  <!-- 번호 사이 화살표 -->
  <path d="M44,110 V136" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ah-ink)"/>
  <path d="M44,174 V200" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ah-ink)"/>
  <path d="M44,238 V264" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ah-ink)"/>
  <path d="M44,302 V328" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#ah-ink)"/>

  <!-- 1. 렌더 -->
  <circle cx="44" cy="92" r="16" fill="#374151"/>
  <text x="44" y="98" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="72" y="68" width="640" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <rect x="84" y="76" width="180" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="174" y="97.5" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">렌더</text>
  <text x="284" y="98" font-size="16" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">height = 0</tspan> (틀린 위치)</text>

  <!-- 2. 커밋 -->
  <circle cx="44" cy="156" r="16" fill="#374151"/>
  <text x="44" y="162" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="72" y="132" width="640" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <rect x="84" y="140" width="180" height="32" rx="16" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
  <text x="174" y="161.5" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">커밋</text>
  <text x="284" y="162" font-size="16" fill="#1f2937">DOM에 반영 <tspan fill="#4b5563">(아직 화면에는 안 보임)</tspan></text>

  <!-- 3. useLayoutEffect -->
  <circle cx="44" cy="220" r="16" fill="#374151"/>
  <text x="44" y="226" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="72" y="196" width="640" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <rect x="84" y="204" width="180" height="32" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="174" y="225.5" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">useLayoutEffect</text>
  <text x="284" y="226" font-size="16" fill="#1f2937">높이 측정  →  <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setHeight(32)</tspan></text>

  <!-- 4. 렌더 + 커밋 -->
  <circle cx="44" cy="284" r="16" fill="#374151"/>
  <text x="44" y="290" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="72" y="260" width="640" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <rect x="84" y="268" width="180" height="32" rx="16" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2"/>
  <text x="174" y="289.5" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">렌더 + 커밋</text>
  <text x="284" y="290" font-size="16" fill="#1f2937">올바른 위치로 갱신 <tspan fill="#4b5563">(아직 화면에는 안 보임)</tspan></text>

  <!-- 5. 페인트 -->
  <circle cx="44" cy="348" r="16" fill="#047857"/>
  <text x="44" y="354" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="72" y="324" width="640" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <rect x="84" y="332" width="180" height="32" rx="16" fill="#1f2937"/>
  <text x="174" y="353.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">페인트</text>
  <text x="284" y="354" font-size="16" fill="#1f2937">사용자는 처음부터 올바른 위치만 본다</text>
  <text x="698" y="354" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">◀ 깜빡임 없음</text>

  <!-- 1~4 구간: 페인트 전 -->
  <path d="M726,92 H740 V284 H726" stroke="#6b7280" stroke-width="1.8" fill="none"/>
  <text x="752" y="172" font-size="16" font-weight="bold" fill="#374151">페인트 전</text>
  <text x="752" y="196" font-size="14" fill="#4b5563">아직 화면에는</text>
  <text x="752" y="216" font-size="14" fill="#4b5563">안 보임</text>
</svg>
