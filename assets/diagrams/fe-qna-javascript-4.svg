<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스코프 체인 동작 원리</title>
  <desc id="d">Global Scope, outer 함수 Scope, inner 함수 Scope 간의 스코프 체인 계층 구조 및 탐색 화살표를 나타낸 다이어그램</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="40" font-size="16" font-weight="bold" fill="#1f2933">스코프 체인 동작 원리</text>

  <!-- Global Scope Outer Card -->
  <rect x="40" y="60" width="800" height="280" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="56" y="72" width="105" height="24" rx="4" ry="4" fill="#2563eb"/>
  <text x="108" y="88.4" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Global Scope</text>

  <!-- outer Scope Card -->
  <rect x="80" y="110" width="720" height="210" rx="8" ry="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="96" y="122" width="145" height="24" rx="4" ry="4" fill="#059669"/>
  <text x="168" y="138.4" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">outer 함수 Scope</text>

  <!-- outerVar Variable -->
  <rect x="100" y="156" width="230" height="28" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="112" y="174.4" font-size="13" fill="#1f2933">outerVar: 'I am from outer'</text>

  <!-- inner Scope Card -->
  <rect x="120" y="194" width="650" height="110" rx="8" ry="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="136" y="206" width="140" height="24" rx="4" ry="4" fill="#d97706"/>
  <text x="206" y="222.4" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">inner 함수 Scope</text>

  <!-- innerVar Variable -->
  <rect x="140" y="240" width="225" height="28" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="152" y="258.4" font-size="13" fill="#1f2933">innerVar: 'I am from inner'</text>

  <!-- Scope Chain Exploration Path -->
  <path d="M 375,254 L 430,254 L 430,170 L 340,170" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>

  <!-- Path Label Box & Text -->
  <rect x="440" y="200" width="275" height="28" rx="4" ry="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="577.5" y="218.4" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">outerVar 접근 가능 (스코프 체인 탐색)</text>
</svg>