<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스코프 체인 동작 원리</title>
  <desc id="d">Global Scope 안에 outer 함수 Scope, 그 안에 inner 함수 Scope가 중첩되어 있고, inner에서 outerVar를 찾을 때 스코프 체인을 따라 안에서 밖으로 올라가 outer의 outerVar에 접근하는 모습입니다. 반대로 outer에서 innerVar를 참조하면 ReferenceError가 납니다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- Global Scope -->
  <rect x="24" y="24" width="832" height="280" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="44" y="54" font-size="18" font-weight="bold" fill="#1d4ed8">Global Scope</text>

  <!-- outer 함수 Scope -->
  <rect x="48" y="72" width="784" height="212" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="68" y="102" font-size="18" font-weight="bold" fill="#047857">outer 함수 Scope</text>
  <rect x="68" y="116" width="300" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="84" y="140" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">outerVar: 'I am from outer'</text>

  <!-- inner 함수 Scope -->
  <rect x="72" y="170" width="736" height="98" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="92" y="200" font-size="18" font-weight="bold" fill="#b45309">inner 함수 Scope</text>
  <rect x="92" y="214" width="300" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="108" y="238" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">innerVar: 'I am from inner'</text>

  <!-- 스코프 체인 탐색: inner → outer -->
  <path d="M 398 232 H 452 V 134 H 378" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="474" y="210" font-size="17" font-weight="bold" fill="#6d28d9">outerVar 접근 가능</text>
  <text x="474" y="236" font-size="15" fill="#6d28d9">(스코프 체인 탐색: 안 → 밖)</text>

  <!-- 방향 요약 -->
  <text x="24" y="340" font-size="16" font-weight="bold" fill="#6d28d9">탐색 방향</text>
  <text x="120" y="340" font-size="16" fill="#111827">안 → 밖 : inner 함수 Scope → outer 함수 Scope → Global Scope</text>
  <text x="24" y="368" font-size="16" font-weight="bold" fill="#b91c1c">반대 방향</text>
  <text x="120" y="368" font-size="16" fill="#111827">outer에서 innerVar 참조 → ReferenceError (하위 스코프 접근 불가)</text>
</svg>
