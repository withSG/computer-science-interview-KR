<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기술 선택 방어 3단 프레임</title>
  <desc id="d">기술 선택을 [1] 대안 검토, [2] 선택 기준, [3] 트레이드오프 수용 순서로 설명하는 프레임. 단계마다 말할 문장의 틀과 주의점을 적었고, 신뢰도를 크게 올리는 [3]이 결정적이다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- [1] 대안 검토 -->
  <path d="M34,24 H264 V124 H34 A10,10 0 0 1 24,114 V34 A10,10 0 0 1 34,24 Z" fill="#eff6ff"/>
  <rect x="24" y="24" width="832" height="100" rx="10" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M264,24 V124" stroke="#1d4ed8" stroke-width="1" fill="none"/>
  <circle cx="54" cy="74" r="15" fill="#1d4ed8"/>
  <text x="54" y="79" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="80" y="81" font-size="19" font-weight="bold" fill="#1d4ed8">대안 검토</text>
  <text x="288" y="64" font-size="17" fill="#111827">"A, B, C를 후보로 놓고 봤습니다"</text>
  <text x="288" y="98" font-size="15" fill="#4b5563">※ 후보를 못 대면 "유행이라 썼다"로 읽힌다</text>

  <path d="M144,126 V149" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [2] 선택 기준 -->
  <path d="M34,152 H264 V276 H34 A10,10 0 0 1 24,266 V162 A10,10 0 0 1 34,152 Z" fill="#ecfdf5"/>
  <rect x="24" y="152" width="832" height="124" rx="10" fill="none" stroke="#047857" stroke-width="1.5"/>
  <path d="M264,152 V276" stroke="#047857" stroke-width="1" fill="none"/>
  <circle cx="54" cy="214" r="15" fill="#047857"/>
  <text x="54" y="219" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="80" y="221" font-size="19" font-weight="bold" fill="#047857">선택 기준</text>
  <text x="288" y="192" font-size="17" fill="#111827">"이 프로젝트에서 중요한 건 X였고, 그 기준으로 B"</text>
  <text x="288" y="224" font-size="15" fill="#4b5563">※ 기준은 프로젝트 상황에서 나와야 한다</text>
  <text x="306" y="248" font-size="15" fill="#4b5563">(팀 숙련도 / 일정 / 요구사항 / 데이터 특성 …)</text>

  <path d="M144,278 V301" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [3] 트레이드오프 수용 (결정적) -->
  <path d="M34,304 H264 V428 H34 A10,10 0 0 1 24,418 V314 A10,10 0 0 1 34,304 Z" fill="#f5f3ff"/>
  <rect x="24" y="304" width="832" height="124" rx="10" fill="none" stroke="#6d28d9" stroke-width="2.5"/>
  <path d="M264,304 V428" stroke="#6d28d9" stroke-width="1" fill="none"/>
  <circle cx="54" cy="354" r="15" fill="#6d28d9"/>
  <text x="54" y="359" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="80" y="361" font-size="19" font-weight="bold" fill="#6d28d9">트레이드오프 수용</text>
  <rect x="80" y="376" width="68" height="26" rx="13" fill="#6d28d9"/>
  <text x="114" y="394" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">결정적</text>
  <text x="288" y="344" font-size="17" fill="#111827">"대신 Y를 감수했고, Z로 완화했습니다"</text>
  <text x="288" y="376" font-size="15" fill="#4b5563">※ 이 조각이 있으면 <tspan font-weight="bold" fill="#6d28d9">신뢰도가 크게 올라간다.</tspan></text>
  <text x="306" y="400" font-size="15" fill="#4b5563">단점을 아는 사람만 이 말을 할 수 있기 때문</text>
</svg>
