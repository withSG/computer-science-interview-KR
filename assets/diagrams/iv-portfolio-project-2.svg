<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기술 선택을 방어하는 3단 프레임</title>
  <desc id="d">대안 검토, 선택 기준, 트레이드오프 수용으로 구성된 기술 선택 방어 프레임 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 프레임 컨테이너 -->
  <rect x="40" y="30" width="800" height="440" rx="12" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>

  <!-- [1] 대안 검토 Block -->
  <g id="step1">
    <rect x="60" y="50" width="760" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="80" y="81" font-size="16" font-weight="bold" fill="#2563eb">[1] 대안 검토</text>
    <text x="80" y="112" font-size="14" font-weight="normal" fill="#1f2933">"A, B, C를 후보로 놓고 봤습니다"</text>
    <text x="80" y="141" font-size="12" font-weight="normal" fill="#52606d">※ 후보를 못 대면 "유행이라 썼다"로 읽힌다</text>
  </g>

  <!-- 구분선 1 -->
  <path d="M 60,180 L 820,180" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- [2] 선택 기준 Block -->
  <g id="step2">
    <rect x="60" y="200" width="760" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="80" y="231" font-size="16" font-weight="bold" fill="#d97706">[2] 선택 기준</text>
    <text x="80" y="262" font-size="14" font-weight="normal" fill="#1f2933">"이 프로젝트에서 중요한 건 X였고, 그 기준으로 B"</text>
    <text x="80" y="290" font-size="12" font-weight="normal" fill="#52606d">※ 기준은 프로젝트 상황에서 나와야 한다</text>
    <text x="96" y="308" font-size="11.5" font-weight="normal" fill="#52606d">(팀 숙련도 / 일정 / 요구사항 / 데이터 특성 …)</text>
  </g>

  <!-- 구분선 2 -->
  <path d="M 60,340 L 820,340" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- [3] 트레이드오프 수용 Block (핵심 단계 강조) -->
  <g id="step3">
    <rect x="60" y="360" width="760" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="80" y="388" font-size="16" font-weight="bold" fill="#7c3aed">[3] 트레이드오프 수용</text>
    <text x="80" y="415" font-size="14" font-weight="normal" fill="#1f2933">"대신 Y를 감수했고, Z로 완화했습니다"</text>
    <text x="80" y="437" font-size="12" font-weight="normal" fill="#52606d">※ 이 조각이 있으면 신뢰도가 크게 올라간다. 단점을 아는 사람만 이 말을 할 수 있기 때문</text>
  </g>
</svg>