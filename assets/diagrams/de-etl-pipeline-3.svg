<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">raw·staging·mart 레이어</title>
  <desc id="d">raw(원본), staging(정제), mart(집계) 세 레이어가 위에서 아래로 이어진다. raw까지는 절대 수정하지 않고, 변환 로직 버그나 지표 정의가 바뀌면 소스를 다시 긁지 않고 raw에서 staging부터 재생성한다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- raw -->
  <rect x="24" y="24" width="556" height="104" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="44" y="68" font-size="19" font-weight="bold" fill="#92400e">raw (원본)</text>
  <text x="44" y="96" font-size="14" fill="#4b5563">Bronze</text>
  <text x="216" y="68" font-size="16" fill="#1f2937">소스에서 받은 그대로. 타입 변환도 하지 않음.</text>
  <text x="216" y="96" font-size="16" fill="#1f2937">수집 시각과 소스 파일명을 함께 기록.</text>

  <line x1="110" y1="132" x2="110" y2="190" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="130" y="167" font-size="16" font-weight="bold" fill="#b91c1c">여기까지는 절대 수정하지 않는다</text>

  <!-- staging -->
  <rect x="24" y="196" width="556" height="104" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="44" y="240" font-size="19" font-weight="bold" fill="#1e3a8a">staging (정제)</text>
  <text x="44" y="268" font-size="14" fill="#4b5563">Silver</text>
  <text x="216" y="240" font-size="16" fill="#1f2937">타입 캐스팅, 컬럼명 표준화, 중복 제거,</text>
  <text x="216" y="268" font-size="16" fill="#1f2937">널 처리. 1:1 대응 관계 유지.</text>

  <line x1="110" y1="304" x2="110" y2="346" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- mart -->
  <rect x="24" y="352" width="556" height="104" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="44" y="396" font-size="19" font-weight="bold" fill="#065f46">mart (집계)</text>
  <text x="44" y="424" font-size="14" fill="#4b5563">Gold</text>
  <text x="216" y="396" font-size="16" fill="#1f2937">비즈니스 로직 적용. 조인, 집계, 지표 정의.</text>
  <text x="216" y="424" font-size="16" fill="#1f2937">BI와 ML이 바라보는 계층.</text>

  <!-- 재생성 경로 -->
  <path d="M582,76 H656 V248 H586" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-b)"/>
  <text x="676" y="128" font-size="15" fill="#1f2937">변환 로직 버그나</text>
  <text x="676" y="150" font-size="15" fill="#1f2937">지표 정의가 바뀌면</text>
  <text x="676" y="172" font-size="15" fill="#1f2937">소스를 다시 긁지 않고</text>
  <text x="676" y="194" font-size="15" font-weight="bold" fill="#1d4ed8">staging부터 재생성</text>
</svg>
