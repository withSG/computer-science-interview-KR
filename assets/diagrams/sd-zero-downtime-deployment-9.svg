<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">종료 시간 예산 계산</title>
  <desc id="d">preStop 15초, 가장 오래 걸리는 API 20초, 커넥션 풀·컨슈머 정리 5초를 더한 40초가 terminationGracePeriodSeconds의 최소값이고 여유 두고 60초로 잡는다. preStop 대기는 헬스체크 주기 5초 × 실패 임계값 2회 = 10초 이상이어야 하므로 여유 두고 15초로 잡는다. 막대 길이는 초에 비례한다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>

  <!-- ① terminationGracePeriodSeconds 예산 -->
  <rect x="24" y="24" width="832" height="46" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="44" y="53" font-size="17" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#5b21b6">terminationGracePeriodSeconds</tspan>  ≥  preStop 대기 + 최장 요청 처리 시간 + 정리 시간</text>

  <text x="40" y="101" font-size="15" font-weight="bold" fill="#4b5563">예시</text>

  <!-- 필요한 시간 합계 (1초 = 11px) -->
  <rect x="40" y="112" width="165" height="48" fill="#dbeafe"/>
  <rect x="205" y="112" width="220" height="48" fill="#fef3c7"/>
  <rect x="425" y="112" width="55" height="48" fill="#d1fae5"/>
  <line x1="205" y1="112" x2="205" y2="160" stroke="#374151" stroke-width="1.2"/>
  <line x1="425" y1="112" x2="425" y2="160" stroke="#374151" stroke-width="1.2"/>
  <rect x="40" y="112" width="440" height="48" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="122.5" y="141" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">preStop 15초</text>
  <text x="315" y="141" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">가장 오래 걸리는 API 20초</text>
  <text x="452.5" y="141" font-size="15" font-weight="bold" fill="#064e3b" text-anchor="middle">5초</text>
  <polyline points="452.5,110 452.5,95 462,95" fill="none" stroke="#047857" stroke-width="1.2"/>
  <text x="468" y="101" font-size="15" fill="#064e3b">커넥션 풀·컨슈머 정리</text>
  <text x="496" y="143" font-size="18" font-weight="bold" fill="#111827">= 40초</text>

  <!-- 40초 기준선 -->
  <line x1="480" y1="160" x2="480" y2="188" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- terminationGracePeriodSeconds 막대 -->
  <rect x="40" y="188" width="440" height="48" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="56" y="217" font-size="16" font-weight="bold" fill="#5b21b6" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">terminationGracePeriodSeconds</text>
  <rect x="482" y="188" width="218" height="48" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="591" y="217" font-size="15" fill="#5b21b6" text-anchor="middle">여유</text>
  <text x="716" y="218" font-size="17" font-weight="bold" fill="#5b21b6">여유 두고 60초</text>

  <line x1="480" y1="238" x2="480" y2="246" stroke="#374151" stroke-width="1.5"/>
  <text x="480" y="264" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">최소 40초</text>

  <line x1="24" y1="290" x2="856" y2="290" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ② preStop 대기 예산 -->
  <rect x="24" y="310" width="832" height="46" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="44" y="339" font-size="17" fill="#111827"><tspan font-weight="bold" fill="#1d4ed8">preStop 대기</tspan>  ≥  헬스체크 주기 × 실패 임계값 (+ 전파 지연)</text>

  <text x="40" y="387" font-size="15" font-weight="bold" fill="#4b5563">예시</text>

  <rect x="40" y="398" width="110" height="48" fill="#f3f4f6"/>
  <line x1="95" y1="398" x2="95" y2="446" stroke="#374151" stroke-width="1.2"/>
  <rect x="40" y="398" width="110" height="48" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="67.5" y="427" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">5초</text>
  <text x="122.5" y="427" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">5초</text>
  <text x="166" y="429" font-size="18" font-weight="bold" fill="#111827">= 5초 × 2회 = 10초</text>

  <line x1="150" y1="446" x2="150" y2="474" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>

  <rect x="40" y="474" width="110" height="48" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="95" y="503" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">preStop 대기</text>
  <rect x="152" y="474" width="53" height="48" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="178.5" y="503" font-size="15" fill="#1e3a8a" text-anchor="middle">여유</text>
  <text x="221" y="504" font-size="17" font-weight="bold" fill="#1d4ed8">여유 두고 15초</text>
</svg>
