<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IVF 구축과 nprobe 검색</title>
  <desc id="d">위: k-means로 전체 벡터를 nlist개(그림에서는 4개) 클러스터로 나누고 각 클러스터의 centroid(대표점)를 둔다. 아래: nprobe=2로 검색하면 쿼리와 가장 가까운 centroid 2개(C2, C3)의 구역에 속한 벡터만 비교하고, C1과 C4는 아예 보지 않아 그만큼 절약된다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== 1행: 구축 ===== -->
  <g transform="translate(24,24)">
    <rect x="0" y="0" width="440" height="230" fill="#f9fafb"/>
    <!-- 클러스터 경계 -->
    <path d="M156.7,0 L163.2,97.7 L0,149.6 M163.2,97.7 L237.2,169.2 L392,0 M237.2,169.2 L240.3,230" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="0" y="0" width="440" height="230" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <!-- 벡터 -->
    <g fill="#374151">
      <circle cx="45" cy="35" r="5"/><circle cx="118" cy="30" r="5"/><circle cx="40" cy="85" r="5"/><circle cx="70" cy="108" r="5"/><circle cx="115" cy="95" r="5"/><circle cx="60" cy="20" r="5"/>
      <circle cx="190" cy="20" r="5"/><circle cx="275" cy="22" r="5"/><circle cx="320" cy="30" r="5"/><circle cx="290" cy="65" r="5"/><circle cx="250" cy="95" r="5"/><circle cx="205" cy="110" r="5"/>
      <circle cx="300" cy="150" r="5"/><circle cx="395" cy="115" r="5"/><circle cx="420" cy="150" r="5"/><circle cx="330" cy="205" r="5"/><circle cx="385" cy="212" r="5"/><circle cx="415" cy="55" r="5"/>
      <circle cx="60" cy="190" r="5"/><circle cx="85" cy="210" r="5"/><circle cx="175" cy="140" r="5"/><circle cx="200" cy="215" r="5"/><circle cx="40" cy="165" r="5"/>
    </g>
    <!-- centroid -->
    <g fill="#1e3a8a">
      <path d="M85,53 L94,68 L76,68 Z"/>
      <path d="M236,43 L245,58 L227,58 Z"/>
      <path d="M354,151 L363,166 L345,166 Z"/>
      <path d="M120,163 L129,178 L111,178 Z"/>
    </g>
    <g font-size="18" font-weight="700" fill="#111827">
      <text x="100" y="68">C1</text>
      <text x="222" y="58" text-anchor="end">C2</text>
      <text x="369" y="166">C3</text>
      <text x="135" y="178">C4</text>
    </g>
  </g>

  <!-- 1행 설명 -->
  <text x="496" y="50" font-size="20" font-weight="700" fill="#111827">구축</text>
  <text x="496" y="84" font-size="16" fill="#1f2937">k-means로 전체 벡터를</text>
  <text x="496" y="108" font-size="16" fill="#1f2937"><tspan font-weight="700">nlist</tspan>개 클러스터로 나눈다</text>
  <text x="496" y="134" font-size="15" fill="#4b5563">그림에서는 nlist = 4</text>
  <circle cx="506" cy="171" r="5" fill="#374151"/>
  <text x="524" y="177" font-size="15" fill="#1f2937">벡터</text>
  <path d="M506,191 L515,206 L497,206 Z" fill="#1e3a8a"/>
  <text x="524" y="205" font-size="15" fill="#1f2937">centroid(대표점)</text>
  <path d="M496,227 L516,227" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="524" y="233" font-size="15" fill="#1f2937">클러스터 경계</text>

  <!-- 구축 → 검색 -->
  <path d="M244,258 L244,288" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== 2행: 검색 ===== -->
  <g transform="translate(24,294)">
    <!-- 구역 면: 비교(C2, C3) / 안 봄(C1, C4) -->
    <path d="M0,0 L156.7,0 L163.2,97.7 L0,149.6 Z" fill="#f3f4f6"/>
    <path d="M240.3,230 L0,230 L0,149.6 L163.2,97.7 L237.2,169.2 Z" fill="#f3f4f6"/>
    <path d="M156.7,0 L392,0 L237.2,169.2 L163.2,97.7 Z" fill="#dbeafe"/>
    <path d="M392,0 L440,0 L440,230 L240.3,230 L237.2,169.2 Z" fill="#dbeafe"/>
    <path d="M156.7,0 L163.2,97.7 L0,149.6 M163.2,97.7 L237.2,169.2 L392,0 M237.2,169.2 L240.3,230" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="0" y="0" width="440" height="230" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <!-- 안 보는 구역의 벡터 -->
    <g fill="#b6bcc6">
      <circle cx="45" cy="35" r="5"/><circle cx="118" cy="30" r="5"/><circle cx="40" cy="85" r="5"/><circle cx="70" cy="108" r="5"/><circle cx="115" cy="95" r="5"/><circle cx="60" cy="20" r="5"/>
      <circle cx="60" cy="190" r="5"/><circle cx="85" cy="210" r="5"/><circle cx="175" cy="140" r="5"/><circle cx="200" cy="215" r="5"/><circle cx="40" cy="165" r="5"/>
    </g>
    <!-- 비교하는 구역의 벡터 -->
    <g fill="#1f2937">
      <circle cx="190" cy="20" r="5"/><circle cx="275" cy="22" r="5"/><circle cx="320" cy="30" r="5"/><circle cx="290" cy="65" r="5"/><circle cx="250" cy="95" r="5"/><circle cx="205" cy="110" r="5"/>
      <circle cx="300" cy="150" r="5"/><circle cx="395" cy="115" r="5"/><circle cx="420" cy="150" r="5"/><circle cx="330" cy="205" r="5"/><circle cx="385" cy="212" r="5"/><circle cx="415" cy="55" r="5"/>
    </g>
    <!-- 쿼리 → 가까운 centroid 2개 -->
    <path d="M322,108 L236,52 M322,108 L354,160" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 4" fill="none"/>
    <g fill="#1e3a8a">
      <path d="M85,53 L94,68 L76,68 Z"/>
      <path d="M236,43 L245,58 L227,58 Z"/>
      <path d="M354,151 L363,166 L345,166 Z"/>
      <path d="M120,163 L129,178 L111,178 Z"/>
    </g>
    <path d="M322,95 L325.8,103.3 L334.4,103.9 L327.7,109.6 L329.9,118.4 L322,113.6 L314.1,118.4 L316.3,109.6 L309.6,103.9 L318.2,103.3 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
    <text x="339" y="103" font-size="16" font-weight="700" fill="#92400e">쿼리</text>
    <g font-size="18" font-weight="700" fill="#111827">
      <text x="100" y="68">C1</text>
      <text x="222" y="58" text-anchor="end">C2</text>
      <text x="369" y="166">C3</text>
      <text x="135" y="178">C4</text>
    </g>
    <g font-size="16" font-weight="700">
      <text x="100" y="89" fill="#4b5563">안 봄</text>
      <text x="222" y="79" text-anchor="end" fill="#1d4ed8">비교</text>
      <text x="369" y="187" fill="#1d4ed8">비교</text>
      <text x="135" y="199" fill="#4b5563">안 봄</text>
    </g>
  </g>

  <!-- 2행 설명: 검색 절차 -->
  <text x="496" y="320" font-size="20" font-weight="700" fill="#111827">검색 (nprobe=2)</text>
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="508" cy="355" r="12" fill="#1d4ed8"/><text x="508" y="360">1</text>
    <circle cx="508" cy="419" r="12" fill="#1d4ed8"/><text x="508" y="424">2</text>
    <circle cx="508" cy="459" r="12" fill="#1d4ed8"/><text x="508" y="464">3</text>
  </g>
  <g font-size="16" fill="#1f2937">
    <text x="530" y="361">쿼리와 가장 가까운 centroid</text>
    <text x="530" y="385">2개를 고른다 → <tspan font-weight="700" fill="#1d4ed8">C2, C3</tspan></text>
    <text x="530" y="425"><tspan font-weight="700" fill="#1d4ed8">C2</tspan>와 <tspan font-weight="700" fill="#1d4ed8">C3</tspan>에 속한 벡터들만 비교한다</text>
    <text x="530" y="465"><tspan font-weight="700">C1, C4</tspan>는 아예 보지 않는다</text>
    <text x="530" y="489" font-weight="700" fill="#047857">→ 여기가 절약되는 부분</text>
  </g>
</svg>
