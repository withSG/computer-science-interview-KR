<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">거의 모든 문제에 재사용되는 뼈대</title>
  <desc id="d">시스템 설계 면접에서 사용되는 재사용 가능한 상위 설계 뼈대 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="770" fill="#ffffff"/>

  <!-- Client -->
  <rect x="230" y="30" width="140" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="300" y="54" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Client</text>

  <!-- Line: Client -> CDN -->
  <path d="M300,70 L300,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- CDN -->
  <rect x="230" y="100" width="140" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="124" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">CDN</text>
  
  <!-- CDN 주석 -->
  <text x="400" y="124" fill="#52606d" font-size="13">정적 자원·이미지는 여기서 끝난다</text>

  <!-- Line: CDN -> API Gateway / LB -->
  <path d="M300,140 L300,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- API Gateway / LB -->
  <rect x="210" y="170" width="180" height="54" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="193" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">API Gateway</text>
  <text x="300" y="211" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">/ LB</text>

  <!-- API Gateway 주석 -->
  <text x="410" y="201" fill="#52606d" font-size="13">인증, 레이트 리밋, 라우팅</text>

  <!-- Lines: API Gateway -> Write API / Read API -->
  <path d="M300,224 L300,250 M170,250 L430,250 M170,250 L170,270 M430,250 L430,270" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M170,260 L170,270" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M430,260 L430,270" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Write API -->
  <rect x="110" y="270" width="120" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="294" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Write API</text>

  <!-- Read API -->
  <rect x="370" y="270" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="430" y="294" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Read API</text>

  <!-- Read API 오른쪽 주석 -->
  <text x="510" y="294" fill="#52606d" font-size="13">상태를 갖지 않아야 수평 확장이 된다</text>

  <!-- Line: Read API -> Cache -->
  <path d="M430,310 L430,350" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Cache -->
  <rect x="370" y="350" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="430" y="374" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Cache</text>

  <!-- Cache 주석 -->
  <text x="510" y="374" fill="#52606d" font-size="13">읽기 경로의 대부분을 여기서 끊는다</text>

  <!-- Lines -> Database -->
  <!-- Line: Write API -> Database -->
  <path d="M170,310 L170,430" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Line: Cache -> Database -->
  <path d="M430,390 L430,430" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Database -->
  <rect x="110" y="430" width="380" height="44" rx="4" fill="#f8fafc" stroke="#1f2933" stroke-width="1.5"/>
  <text x="300" y="456" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Database</text>

  <!-- Database 주석 -->
  <text x="505" y="456" fill="#52606d" font-size="13">← 쓰기 Primary / 읽기 Replica</text>

  <!-- Line: Database -> Message Queue -->
  <path d="M300,474 L300,520" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Message Queue -->
  <rect x="220" y="520" width="160" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="300" y="544" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Message Queue</text>

  <!-- Line: Message Queue -> Worker -->
  <path d="M380,540 L425,540" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Worker -->
  <text x="435" y="544" fill="#1f2933" font-size="13" font-weight="bold">Worker <tspan fill="#52606d" font-weight="normal">(통계 집계, 알림, 인덱싱)</tspan></text>

  <!-- Message Queue / Worker 주석 -->
  <text x="435" y="515" fill="#52606d" font-size="13">즉시 응답할 필요 없는 후속 작업</text>
</svg>