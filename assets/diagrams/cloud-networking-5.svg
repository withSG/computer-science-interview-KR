<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stateless가 실제로 어떤 사고를 만드는가</title>
  <desc id="d">Stateless NACL에서 응답 트래픽이 임시 포트 미허용으로 인해 차단되는 과정을 나타낸 시퀀스 다이어그램</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 제목 헤딩 -->
  <text x="24" y="37" font-size="16" font-weight="bold" fill="#1f2933">Stateless가 실제로 어떤 사고를 만드는가</text>

  <!-- 수직 라이프라인 (점선) -->
  <path d="M210,110 L210,290" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M670,110 L670,290" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <!-- 노드: 클라이언트 -->
  <rect x="50" y="60" width="320" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="90" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트 (임시 포트 51234)</text>

  <!-- 노드: 서버 -->
  <rect x="610" y="60" width="120" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="670" y="90" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">서버</text>

  <!-- 요청 화살표 (상단) -->
  <path d="M210,140 L661,140" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="360" y="128" width="160" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="440" y="144" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">SYN, dst:443</text>

  <!-- 클라이언트 (dst 51234) 노드 (하단) -->
  <rect x="50" y="180" width="320" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="210" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트 (dst 51234)</text>

  <!-- 응답 화살표 (하단, 차단됨) -->
  <path d="M670,205 L219,205" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="345" y="193" width="190" height="24" fill="#ffffff" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="440" y="209" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">SYN/ACK, src:443</text>

  <!-- 차단 원인 지적 화살표 -->
  <path d="M440,260 L440,222" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- 차단 설명 박스 -->
  <rect x="180" y="260" width="520" height="54" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="282" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">NACL 아웃바운드 규칙 평가:</text>
  <text x="440" y="302" font-size="12" fill="#1f2933" text-anchor="middle">"목적지 포트 51234로 나가는 트래픽" — 허용 규칙 없음 → DROP</text>
</svg>