<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">내 Bean 등록 뒤 자동 설정 평가</title>
  <desc id="d">시간 축에서 내 @Configuration, @Component 등록이 먼저 끝나고 자동 설정 평가가 그 뒤에 온다. 그래서 평가 시점에는 내 Bean이 이미 컨테이너에 있어 @ConditionalOnMissingBean이 정확히 판단할 수 있다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 시간 축 -->
  <text x="40" y="46" font-size="15" font-weight="bold" fill="#4b5563">시간 축</text>
  <line x1="112" y1="41" x2="838" y2="41" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ① 내 등록 -->
  <rect x="40" y="76" width="370" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="74" cy="120" r="16" fill="#1d4ed8"/>
  <text x="74" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="104" y="114" font-size="16" font-weight="bold" fill="#111827">내 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@Configuration, @Component</tspan> 등록</text>
  <text x="104" y="142" font-size="14" fill="#4b5563">사용자 정의 설정 · 컴포넌트 스캔</text>

  <line x1="412" y1="120" x2="474" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ② 자동 설정 평가 -->
  <rect x="478" y="76" width="362" height="88" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="512" cy="120" r="16" fill="#374151"/>
  <text x="512" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="542" y="126" font-size="17" font-weight="bold" fill="#111827">자동 설정 평가</text>

  <!-- 평가 시점의 상태 -->
  <line x1="659" y1="166" x2="659" y2="200" stroke="#059669" stroke-width="2"/>
  <rect x="220" y="202" width="620" height="124" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="250" y="244" font-size="17" fill="#111827">이 시점에는 내 Bean이 <tspan font-weight="bold">이미 컨테이너에 있다</tspan></text>
  <text x="250" y="290" font-size="17" font-weight="bold" fill="#047857">→ <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">@ConditionalOnMissingBean</tspan> 이 정확히 판단할 수 있다</text>
</svg>
