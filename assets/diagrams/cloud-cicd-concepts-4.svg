<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">한 번 빌드, 여러 번 배포</title>
  <desc id="d">잘못된 방식은 커밋에서 곧바로 갈라져 환경마다 다시 빌드하므로 두 번째 빌드가 첫 번째와 같다는 보장이 없다. 올바른 방식은 커밋을 한 번만 빌드해 아티팩트(app:a1b2c3d)를 만들고, 완전히 동일한 바이트를 스테이징과 운영 두 환경에 올린다.</desc>
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="510" fill="#ffffff"/>

  <!-- ── 잘못된 방식 ── -->
  <rect x="24" y="20" width="832" height="206" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="54" font-size="16" fill="#374151"><tspan font-size="18" font-weight="bold" fill="#b91c1c">잘못된 방식</tspan> (환경마다 다시 빌드)</text>

  <rect x="48" y="118" width="80" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="88" y="146" font-size="16" fill="#111827" text-anchor="middle">커밋</text>

  <path d="M128,140 H150 V100 H174" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <path d="M128,140 H150 V180 H174" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>

  <rect x="176" y="78" width="88" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="220" y="106" font-size="16" fill="#111827" text-anchor="middle">빌드</text>
  <rect x="176" y="158" width="88" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="220" y="186" font-size="16" fill="#111827" text-anchor="middle">빌드</text>

  <line x1="264" y1="100" x2="638" y2="100" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <line x1="264" y1="180" x2="638" y2="180" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>

  <text x="452" y="137" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">두 번째 빌드는 첫 번째와</text>
  <text x="452" y="159" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">같다는 보장이 없다</text>

  <rect x="640" y="78" width="160" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="720" y="106" font-size="16" fill="#111827" text-anchor="middle">스테이징 배포</text>
  <rect x="640" y="158" width="160" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="720" y="186" font-size="16" fill="#111827" text-anchor="middle">운영 배포</text>

  <!-- ── 올바른 방식 ── -->
  <rect x="24" y="246" width="832" height="240" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="44" y="280" font-size="16" fill="#374151"><tspan font-size="18" font-weight="bold" fill="#047857">올바른 방식</tspan> (한 번만 빌드)</text>

  <rect x="48" y="348" width="80" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="88" y="376" font-size="16" fill="#111827" text-anchor="middle">커밋</text>
  <line x1="128" y1="370" x2="174" y2="370" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="176" y="348" width="88" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="220" y="376" font-size="16" fill="#111827" text-anchor="middle">빌드</text>
  <line x1="264" y1="370" x2="328" y2="370" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <rect x="330" y="338" width="200" height="64" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="430" y="364" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">아티팩트</text>
  <text x="430" y="388" font-size="15" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">app:a1b2c3d</text>

  <path d="M530,370 H585 V330 H638" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <path d="M530,370 H585 V410 H638" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <rect x="640" y="300" width="160" height="60" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="720" y="325" font-size="16" fill="#111827" text-anchor="middle">스테이징 배포</text>
  <text x="720" y="348" font-size="14" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">app:a1b2c3d</text>
  <rect x="640" y="380" width="160" height="60" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="720" y="405" font-size="16" fill="#111827" text-anchor="middle">운영 배포</text>
  <text x="720" y="428" font-size="14" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">app:a1b2c3d</text>

  <line x1="430" y1="446" x2="430" y2="406" stroke="#047857" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <text x="430" y="468" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">완전히 동일한 바이트를 두 환경에 올린다</text>
</svg>
