<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CDN 동작 흐름</title>
  <desc id="d">사용자(한국)의 요청은 가장 가까운 엣지 서버(서울)로 간다. 캐시 HIT면 즉시 응답하고, 캐시 MISS면 오리진 서버에 요청해 캐시에 저장한 뒤 응답한다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="880" height="230" fill="#ffffff"/>

  <!-- 사용자 → 엣지 -->
  <rect x="24" y="87" width="122" height="56" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="85" y="121" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사용자(한국)</text>
  <path d="M148,115 L170,115" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="176" y="79" width="146" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="249" y="110" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle"><tspan x="249">가장 가까운</tspan><tspan x="249" dy="22">엣지 서버(서울)</tspan></text>

  <!-- 분기 -->
  <path d="M324,115 L342,115" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M342,64 L342,164" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M342,64 L362,64" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M342,164 L362,164" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ao)"/>

  <!-- 캐시 HIT 경로 -->
  <rect x="368" y="38" width="108" height="52" rx="26" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="422" y="70" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">캐시 HIT</text>
  <path d="M478,64 L500,64" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <rect x="506" y="38" width="116" height="52" rx="8" fill="#047857" stroke="#047857" stroke-width="1.5"/>
  <text x="564" y="70" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">즉시 응답</text>

  <!-- 캐시 MISS 경로 -->
  <rect x="368" y="138" width="108" height="52" rx="26" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="422" y="170" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">캐시 MISS</text>
  <path d="M478,164 L500,164" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <rect x="506" y="132" width="120" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="566" y="159" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle"><tspan x="566">오리진 서버</tspan><tspan x="566" dy="21">요청</tspan></text>
  <path d="M628,164 L650,164" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <rect x="656" y="138" width="100" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="706" y="170" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">캐시 저장</text>
  <path d="M758,164 L780,164" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <rect x="786" y="138" width="70" height="52" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="821" y="170" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">응답</text>
</svg>
