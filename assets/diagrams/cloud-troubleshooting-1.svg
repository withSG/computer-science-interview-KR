<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">증상별 원인 층</title>
  <desc id="d">Pod 증상 다섯 가지를 각각 원인이 있는 층(스케줄링, 이미지/설정/볼륨, 애플리케이션/리소스, 네트워크/Probe, 노드)과 그 층에서 보이는 대표 상태에 연결한 표입니다.</desc>
  <rect width="880" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 머리행 -->
  <text x="40" y="44" font-size="15" font-weight="bold" fill="#4b5563">증상</text>
  <text x="380" y="44" font-size="15" font-weight="bold" fill="#4b5563">원인 층 · 대표 상태</text>

  <!-- 1. 스케줄링 층 -->
  <rect x="24" y="60" width="300" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="104" font-size="17" font-weight="bold" fill="#111827">Pod가 아예 안 뜬다</text>
  <line x1="330" y1="98" x2="356" y2="98" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="364" y="60" width="492" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="88" font-size="17" font-weight="bold" fill="#1d4ed8">스케줄링 층</text>
  <rect x="380" y="100" width="84" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="422" y="118" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Pending</text>

  <!-- 2. 이미지 / 설정 / 볼륨 층 -->
  <rect x="24" y="150" width="300" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="194" font-size="17" font-weight="bold" fill="#111827">컨테이너가 안 만들어진다</text>
  <line x1="330" y1="188" x2="356" y2="188" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="364" y="150" width="492" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="178" font-size="17" font-weight="bold" fill="#1d4ed8">이미지 / 설정 / 볼륨 층</text>
  <rect x="380" y="190" width="158" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="459" y="208" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ImagePullBackOff</text>
  <rect x="548" y="190" width="236" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="666" y="208" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CreateContainerConfigError</text>

  <!-- 3. 애플리케이션 / 리소스 층 -->
  <rect x="24" y="240" width="300" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="284" font-size="17" font-weight="bold" fill="#111827">떴다가 죽는다</text>
  <line x1="330" y1="278" x2="356" y2="278" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="364" y="240" width="492" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="268" font-size="17" font-weight="bold" fill="#1d4ed8">애플리케이션 / 리소스 층</text>
  <rect x="380" y="280" width="158" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="459" y="298" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CrashLoopBackOff</text>
  <rect x="548" y="280" width="100" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="598" y="298" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OOMKilled</text>

  <!-- 4. 네트워크 / Probe 층 -->
  <rect x="24" y="330" width="300" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="374" font-size="17" font-weight="bold" fill="#111827">살아 있는데 트래픽이 안 온다</text>
  <line x1="330" y1="368" x2="356" y2="368" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="364" y="330" width="492" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="358" font-size="17" font-weight="bold" fill="#1d4ed8">네트워크 / Probe 층</text>
  <rect x="380" y="370" width="170" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="465" y="388" font-size="14" fill="#1f2937" text-anchor="middle">Endpoints 비어 있음</text>

  <!-- 5. 노드 층 -->
  <rect x="24" y="420" width="300" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="464" font-size="17" font-weight="bold" fill="#111827">잘 돌다가 사라진다</text>
  <line x1="330" y1="458" x2="356" y2="458" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="364" y="420" width="492" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="448" font-size="17" font-weight="bold" fill="#1d4ed8">노드 층</text>
  <rect x="380" y="460" width="84" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="422" y="478" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Evicted</text>
  <rect x="474" y="460" width="92" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="520" y="478" font-size="14" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">NotReady</text>
</svg>
