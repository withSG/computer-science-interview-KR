<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1. 왜 필요한가: 상태 이름은 원인이 아니라 증상이다</title>
  <desc id="d">Pod의 증상과 그에 대응하는 쿠버네티스 층위 및 상태 이름을 나타낸 트러블슈팅 매핑 다이어그램입니다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Row 1: 스케줄링 층 -->
  <rect x="24" y="24" width="280" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="164" y="55" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Pod가 아예 안 뜬다</text>
  
  <path d="M304,50 L350,50" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <rect x="350" y="24" width="506" height="52" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="366" y="55" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">스케줄링 층</text>
  <text x="450" y="55" font-size="13" fill="#52606d" text-anchor="start">(Pending)</text>

  <!-- Row 2: 이미지 / 설정 / 볼륨 층 -->
  <rect x="24" y="94" width="280" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="164" y="125" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">컨테이너가 안 만들어진다</text>
  
  <path d="M304,120 L350,120" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  
  <rect x="350" y="94" width="506" height="52" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="366" y="125" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="start">이미지 / 설정 / 볼륨 층</text>
  <text x="525" y="125" font-size="13" fill="#52606d" text-anchor="start">(ImagePullBackOff, CreateContainerConfigError)</text>

  <!-- Row 3: 애플리케이션 / 리소스 층 -->
  <rect x="24" y="164" width="280" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="164" y="195" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">떴다가 죽는다</text>
  
  <path d="M304,190 L350,190" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  
  <rect x="350" y="164" width="506" height="52" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="366" y="195" font-size="13" font-weight="600" fill="#dc2626" text-anchor="start">애플리케이션 / 리소스 층</text>
  <text x="535" y="195" font-size="13" fill="#52606d" text-anchor="start">(CrashLoopBackOff, OOMKilled)</text>

  <!-- Row 4: 네트워크 / Probe 층 -->
  <rect x="24" y="234" width="280" height="52" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="164" y="265" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">살아 있는데 트래픽이 안 온다</text>
  
  <path d="M304,260 L350,260" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  
  <rect x="350" y="234" width="506" height="52" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="366" y="265" font-size="13" font-weight="600" fill="#d97706" text-anchor="start">네트워크 / Probe 층</text>
  <text x="505" y="265" font-size="13" fill="#52606d" text-anchor="start">(Endpoints 비어 있음)</text>

  <!-- Row 5: 노드 층 -->
  <rect x="24" y="304" width="280" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="164" y="335" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">잘 돌다가 사라진다</text>
  
  <path d="M304,330 L350,330" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  
  <rect x="350" y="304" width="506" height="52" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="366" y="335" font-size="13" font-weight="600" fill="#059669" text-anchor="start">노드 층</text>
  <text x="420" y="335" font-size="13" fill="#52606d" text-anchor="start">(Evicted, NotReady)</text>
</svg>