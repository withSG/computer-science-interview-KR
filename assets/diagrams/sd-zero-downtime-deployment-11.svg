<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">개선: 확장-수축 패턴 (Expand and Contract)</title>
  <desc id="d">Expand, Migrate, Contract 단계로 이루어진 무중단 배포의 확장-수축 패턴 흐름도</desc>
  
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Step 1: Expand -->
  <g>
    <rect x="80" y="40" width="130" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="145" y="70" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">[Expand]</text>
    <text x="235" y="70" font-size="14" fill="#1f2933">구·신 양쪽이 모두 동작하는 상태로 넓힌다</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M145,90 L145,150" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2: Migrate -->
  <g>
    <rect x="80" y="150" width="130" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="145" y="180" font-size="16" font-weight="bold" fill="#d97706" text-anchor="middle">[Migrate]</text>
    <text x="235" y="180" font-size="14" fill="#1f2933">데이터를 옮기고, 신버전이 새 구조만 쓰도록 전환한다</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M145,200 L145,260" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 3: Contract -->
  <g>
    <rect x="80" y="260" width="130" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="145" y="290" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">[Contract]</text>
    <text x="235" y="290" font-size="14" fill="#1f2933">아무도 안 쓰는 것이 확인된 뒤에 낡은 것을 제거한다</text>
  </g>
</svg>