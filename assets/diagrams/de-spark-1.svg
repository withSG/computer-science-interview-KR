<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Spark 드라이버·클러스터 매니저·익스큐터 구조</title>
  <desc id="d">드라이버가 클러스터 매니저에 자원을 요청하면(①) 클러스터 매니저가 익스큐터를 띄우고(②), 익스큐터들이 Task를 실행하며(③) 셔플 때는 서로 데이터를 교환한다(④).</desc>
  <rect width="880" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Driver -->
  <rect x="40" y="24" width="800" height="166" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="62" y="58" font-size="20" font-weight="700" fill="#1d4ed8">Driver <tspan font-size="16" font-weight="400">(드라이버)</tspan></text>
  <text x="62" y="92" font-size="16" fill="#1f2937">• 내가 쓴 코드가 실행되는 곳</text>
  <text x="62" y="118" font-size="16" fill="#1f2937">• 논리 계획을 만들고 최적화해 Stage/Task로 쪼갠다</text>
  <text x="62" y="144" font-size="16" fill="#1f2937">• 각 Task를 어느 익스큐터에 보낼지 결정하고 진행을 추적</text>
  <text x="62" y="170" font-size="16" fill="#1f2937">• SparkSession(spark 변수)이 여기 산다</text>

  <!-- ① 자원 요청 -->
  <line x1="348" y1="192" x2="348" y2="239" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="364" y="222" font-size="16" font-weight="700" fill="#111827">① 자원 요청</text>

  <!-- Cluster Manager -->
  <rect x="40" y="242" width="800" height="84" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="62" y="276" font-size="20" font-weight="700" fill="#92400e">Cluster Manager <tspan font-size="16" font-weight="400">(YARN / Kubernetes / Standalone)</tspan></text>
  <text x="62" y="308" font-size="16" fill="#1f2937">• 클러스터의 CPU·메모리를 관리하고 익스큐터를 띄워 준다</text>

  <!-- ② 익스큐터 기동 -->
  <line x1="136" y1="328" x2="136" y2="383" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="348" y1="328" x2="348" y2="383" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="560" y1="328" x2="560" y2="383" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="364" y="362" font-size="16" font-weight="700" fill="#111827">② 익스큐터 기동</text>

  <!-- Executors -->
  <g>
    <rect x="40" y="386" width="192" height="140" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="136" y="416" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">Executor 1</text>
    <rect x="54" y="432" width="76" height="34" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="92" y="454" font-size="15" fill="#065f46" text-anchor="middle">Task</text>
    <rect x="142" y="432" width="76" height="34" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="180" y="454" font-size="15" fill="#065f46" text-anchor="middle">Task</text>
    <rect x="54" y="478" width="164" height="34" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="136" y="500" font-size="15" fill="#374151" text-anchor="middle">캐시 메모리</text>
  </g>
  <g>
    <rect x="252" y="386" width="192" height="140" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="348" y="416" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">Executor 2</text>
    <rect x="266" y="432" width="76" height="34" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="304" y="454" font-size="15" fill="#065f46" text-anchor="middle">Task</text>
    <rect x="354" y="432" width="76" height="34" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="392" y="454" font-size="15" fill="#065f46" text-anchor="middle">Task</text>
    <rect x="266" y="478" width="164" height="34" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="348" y="500" font-size="15" fill="#374151" text-anchor="middle">캐시 메모리</text>
  </g>
  <g>
    <rect x="464" y="386" width="192" height="140" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="560" y="416" font-size="18" font-weight="700" fill="#065f46" text-anchor="middle">Executor 3</text>
    <rect x="478" y="432" width="76" height="34" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="516" y="454" font-size="15" fill="#065f46" text-anchor="middle">Task</text>
    <rect x="566" y="432" width="76" height="34" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
    <text x="604" y="454" font-size="15" fill="#065f46" text-anchor="middle">Task</text>
    <rect x="478" y="478" width="164" height="34" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="560" y="500" font-size="15" fill="#374151" text-anchor="middle">캐시 메모리</text>
  </g>

  <!-- ③ Task 실행 -->
  <line x1="718" y1="449" x2="661" y2="449" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="728" y="455" font-size="16" font-weight="700" fill="#111827">③ Task 실행</text>

  <!-- ④ 셔플 시 데이터 교환 -->
  <path d="M156,530 Q242,582 328,530" fill="none" stroke="#b91c1c" stroke-width="2" marker-start="url(#ahr)" marker-end="url(#ahr)"/>
  <path d="M368,530 Q454,582 540,530" fill="none" stroke="#b91c1c" stroke-width="2" marker-start="url(#ahr)" marker-end="url(#ahr)"/>
  <path d="M112,530 Q348,642 584,530" fill="none" stroke="#b91c1c" stroke-width="2" marker-start="url(#ahr)" marker-end="url(#ahr)"/>
  <text x="348" y="620" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">④ 셔플 시 서로 데이터 교환</text>
</svg>
