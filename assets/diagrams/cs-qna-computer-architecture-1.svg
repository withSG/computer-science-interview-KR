<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">명령어 실행 사이클</title>
  <desc id="d">① Fetch에서 PC → MAR → 메모리에서 명령어 읽기 → MBR → IR 순으로 명령어를 가져오고 PC = PC + 1로 다음 명령어 주소로 증가한다. ② Decode에서 제어장치가 IR의 명령어를 해석하고, ③ Execute에서 ALU가 연산하거나 메모리에 접근해 결과를 저장하며, 필요하면 ④ Memory Access / Write Back을 거친 뒤 다음 명령어로 다시 반복한다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="880" height="550" fill="#ffffff"/>

  <!-- ① Fetch -->
  <rect x="80" y="24" width="776" height="146" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="92" y="36" width="140" height="122" rx="8" fill="#1d4ed8"/>
  <text x="162" y="92" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">① Fetch</text>
  <text x="162" y="118" font-size="16" fill="#ffffff" text-anchor="middle">인출</text>

  <rect x="264" y="46" width="64" height="46" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="296" y="75" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">PC</text>
  <path d="M334,69 H365" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="372" y="46" width="72" height="46" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="408" y="75" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">MAR</text>
  <path d="M450,69 H481" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="488" y="40" width="128" height="58" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="552" y="64" font-size="15" fill="#111827" text-anchor="middle">메모리에서<tspan x="552" dy="21">명령어 읽기</tspan></text>
  <path d="M622,69 H653" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="660" y="46" width="72" height="46" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="696" y="75" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">MBR</text>
  <path d="M738,69 H769" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="776" y="46" width="64" height="46" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="808" y="75" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">IR</text>

  <path d="M296,96 V113" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="264" y="118" width="140" height="34" rx="17" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="334" y="141" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">PC = PC + 1</text>
  <text x="418" y="141" font-size="15" fill="#374151">다음 명령어 주소로 증가</text>

  <path d="M162,174 V196" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>

  <!-- ② Decode -->
  <rect x="80" y="202" width="776" height="84" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="92" y="214" width="140" height="60" rx="8" fill="#6d28d9"/>
  <text x="162" y="240" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">② Decode</text>
  <text x="162" y="264" font-size="16" fill="#ffffff" text-anchor="middle">해석</text>
  <text x="256" y="237" font-size="16" fill="#111827"><tspan font-weight="bold">IR</tspan>의 명령어를 <tspan font-weight="bold">제어장치</tspan>가 해석</text>
  <text x="256" y="265" font-size="15" fill="#4b5563">어떤 연산인지, 피연산자는 무엇인지 파악</text>

  <path d="M162,290 V312" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>

  <!-- ③ Execute -->
  <rect x="80" y="318" width="776" height="84" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <rect x="92" y="330" width="140" height="60" rx="8" fill="#047857"/>
  <text x="162" y="356" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">③ Execute</text>
  <text x="162" y="380" font-size="16" fill="#ffffff" text-anchor="middle">실행</text>
  <text x="256" y="353" font-size="16" fill="#111827"><tspan font-weight="bold">ALU</tspan>가 연산 수행 또는 메모리 접근</text>
  <text x="256" y="381" font-size="15" fill="#4b5563">결과를 레지스터나 메모리에 저장</text>

  <path d="M162,406 V428" stroke="#374151" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ah-ink)"/>

  <!-- ④ (필요 시) Memory Access / Write Back -->
  <rect x="80" y="434" width="776" height="84" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="92" y="446" width="140" height="60" rx="8" fill="#b45309"/>
  <text x="162" y="472" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">④</text>
  <text x="162" y="496" font-size="16" fill="#ffffff" text-anchor="middle">(필요 시)</text>
  <text x="256" y="483" font-size="18" font-weight="bold" fill="#111827">Memory Access / Write Back</text>

  <!-- 다음 명령어로 반복 -->
  <path d="M78,476 H56 V97 H75" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <text x="42" y="286" font-size="15" fill="#4b5563" text-anchor="middle" transform="rotate(-90 42 286)">다음 명령어</text>
</svg>
