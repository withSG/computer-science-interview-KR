<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Weaving 시점 세 가지</title>
  <desc id="d">컴파일 타임 위빙은 AspectJ 컴파일러가 .java를 부가 기능이 박힌 .class로, 클래스 로드 위빙은 JVM 로드 시 에이전트가 .class를 변조해 메모리상의 클래스로, 런타임 위빙은 Spring이 원본 Bean을 프록시 객체로 감싸 컨테이너에 등록한다. Spring AOP는 런타임 위빙이다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="44" y="44" font-size="14" font-weight="bold" fill="#4b5563">위빙 시점</text>
  <text x="252" y="44" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">입력</text>
  <text x="444" y="44" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">엮는 방법</text>
  <text x="704" y="44" font-size="14" font-weight="bold" fill="#4b5563" text-anchor="middle">결과</text>

  <!-- 1. 컴파일 타임 위빙 -->
  <rect x="24" y="60" width="832" height="88" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="110" font-size="17" font-weight="bold" fill="#111827">컴파일 타임 위빙</text>
  <rect x="196" y="80" width="112" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="252" y="110" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.java</text>
  <line x1="316" y1="104" x2="568" y2="104" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="444" y="92" font-size="15" fill="#1f2937" text-anchor="middle">AspectJ 컴파일러</text>
  <rect x="580" y="72" width="248" height="64" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="704" y="98" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.class</text>
  <text x="704" y="122" font-size="14" fill="#374151" text-anchor="middle">부가 기능이 이미 박힌 바이트코드</text>

  <!-- 2. 클래스 로드 위빙 -->
  <rect x="24" y="160" width="832" height="88" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="210" font-size="17" font-weight="bold" fill="#111827">클래스 로드 위빙</text>
  <rect x="196" y="180" width="112" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="252" y="210" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.class</text>
  <line x1="316" y1="204" x2="568" y2="204" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="444" y="192" font-size="15" fill="#1f2937" text-anchor="middle">JVM 로드 시 에이전트가 변조</text>
  <rect x="580" y="180" width="248" height="48" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="704" y="210" font-size="16" fill="#111827" text-anchor="middle">메모리상의 클래스</text>

  <!-- 3. 런타임 위빙 (Spring AOP) -->
  <rect x="24" y="260" width="832" height="96" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="44" y="299" font-size="17" font-weight="bold" fill="#5b21b6">런타임 위빙</text>
  <rect x="44" y="312" width="104" height="26" rx="13" fill="#6d28d9"/>
  <text x="96" y="330" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Spring AOP</text>
  <rect x="196" y="284" width="112" height="48" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="252" y="314" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">원본 Bean</text>
  <line x1="316" y1="308" x2="568" y2="308" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="444" y="296" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">Spring이 프록시 객체로 감쌈</text>
  <rect x="580" y="284" width="248" height="48" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="704" y="314" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">컨테이너에 프록시 등록</text>
</svg>
