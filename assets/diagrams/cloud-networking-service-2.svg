<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Service 타입의 계단식 구조</title>
  <desc id="d">왼쪽은 인터넷에서 LoadBalancer Service(클라우드 LB 자동 생성), NodePort(30000~, 모든 노드의 동일 포트 개방), ClusterIP(가상 IP, 클러스터 내부 전용)를 거쳐 Pod 세 개로 가는 경로. 오른쪽은 ClusterIP·NodePort·LoadBalancer 타입이 각각 포함하는 계층을 계단 모양으로 보여 준다. NodePort는 ClusterIP를, LoadBalancer는 NodePort를 포함한다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ── 왼쪽: 트래픽 경로 -->
  <rect x="160" y="24" width="120" height="36" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="48" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">인터넷</text>
  <line x1="220" y1="62" x2="220" y2="87" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="40" y="90" width="360" height="68" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="220" y="118" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">LoadBalancer Service</text>
  <text x="220" y="144" font-size="15" fill="#374151" text-anchor="middle">클라우드 LB 자동 생성</text>
  <line x1="220" y1="160" x2="220" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="40" y="188" width="360" height="68" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="220" y="216" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">NodePort (30000~)</text>
  <text x="220" y="242" font-size="15" fill="#374151" text-anchor="middle">모든 노드의 동일 포트 개방</text>
  <line x1="220" y1="258" x2="220" y2="283" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="40" y="286" width="360" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="220" y="314" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">ClusterIP (가상 IP)</text>
  <text x="220" y="340" font-size="15" fill="#374151" text-anchor="middle">클러스터 내부 전용</text>

  <path d="M220,356 V376 M90,376 H350" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="376" x2="90" y2="401" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="220" y1="376" x2="220" y2="401" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="350" y1="376" x2="350" y2="401" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="50" y="404" width="80" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90" y="430" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Pod</text>
  <rect x="180" y="404" width="80" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="220" y="430" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Pod</text>
  <rect x="310" y="404" width="80" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="350" y="430" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Pod</text>

  <!-- ── 오른쪽: 타입별 포함 관계 (계단) -->
  <text x="444" y="48" font-size="16" font-weight="bold" fill="#111827">타입별 포함 관계</text>
  <line x1="424" y1="84" x2="424" y2="360" stroke="#d1d5db" stroke-width="1"/>

  <!-- ClusterIP 타입 -->
  <rect x="444" y="278" width="124" height="84" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="454" y="292" width="104" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="506" y="326" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">ClusterIP</text>
  <text x="506" y="386" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">ClusterIP</text>

  <!-- NodePort 타입 -->
  <rect x="582" y="180" width="124" height="182" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="592" y="194" width="104" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="644" y="228" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">NodePort</text>
  <rect x="592" y="292" width="104" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="644" y="326" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">ClusterIP</text>
  <text x="644" y="386" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">NodePort</text>

  <!-- LoadBalancer 타입 -->
  <rect x="720" y="82" width="124" height="280" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="730" y="96" width="104" height="56" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="782" y="130" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">클라우드 LB</text>
  <rect x="730" y="194" width="104" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="782" y="228" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">NodePort</text>
  <rect x="730" y="292" width="104" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="782" y="326" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">ClusterIP</text>
  <text x="782" y="386" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">LoadBalancer</text>

  <!-- 설명 -->
  <text x="444" y="426" font-size="15" font-weight="bold" fill="#111827">위 세 타입은 계단식이다.</text>
  <text x="444" y="450" font-size="15" fill="#374151">NodePort는 ClusterIP를 포함하고,</text>
  <text x="444" y="474" font-size="15" fill="#374151">LoadBalancer는 NodePort를 포함한다.</text>
</svg>
