<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3. Service 타입 네 가지</title>
  <desc id="d">인터넷, LoadBalancer Service, NodePort, ClusterIP 및 Pod 간의 계단식 흐름과 각 타입별 설명, 부가 설명을 나타내는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Top level: 인터넷 -->
  <rect x="360" y="20" width="160" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="42" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">인터넷</text>

  <!-- Arrow 1 -->
  <path d="M440,56 L440,84" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Level 1: LoadBalancer Service -->
  <rect x="290" y="86" width="300" height="44" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="112" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="bold">LoadBalancer Service</text>
  <!-- Side Note 1 -->
  <text x="610" y="112" font-size="13" fill="#52606d" text-anchor="start">클라우드 LB 자동 생성</text>

  <!-- Arrow 2 -->
  <path d="M440,130 L440,158" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Level 2: NodePort (30000~) -->
  <rect x="290" y="160" width="300" height="44" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="186" font-size="14" fill="#d97706" text-anchor="middle" font-weight="bold">NodePort (30000~)</text>
  <!-- Side Note 2 -->
  <text x="610" y="186" font-size="13" fill="#52606d" text-anchor="start">모든 노드의 동일 포트 개방</text>

  <!-- Arrow 3 -->
  <path d="M440,204 L440,232" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Level 3: ClusterIP (가상 IP) -->
  <rect x="290" y="234" width="300" height="44" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="260" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">ClusterIP (가상 IP)</text>
  <!-- Side Note 3 -->
  <text x="610" y="260" font-size="13" fill="#52606d" text-anchor="start">클러스터 내부 전용</text>

  <!-- Branch Arrows to Pods -->
  <path d="M440,278 L440,300" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M220,300 L660,300" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M220,300 L220,322" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M440,300 L440,322" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M660,300 L660,322" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Pods -->
  <rect x="170" y="324" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="348" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Pod</text>

  <rect x="390" y="324" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="348" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Pod</text>

  <rect x="610" y="324" width="100" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="660" y="348" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Pod</text>

  <!-- Footnote Box -->
  <rect x="150" y="400" width="580" height="60" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="424" font-size="12" fill="#52606d" text-anchor="middle">위 세 타입은 계단식이다. NodePort는 ClusterIP를 포함하고,</text>
  <text x="440" y="444" font-size="12" fill="#52606d" text-anchor="middle">LoadBalancer는 NodePort를 포함한다.</text>
</svg>