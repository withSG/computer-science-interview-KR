<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">쿠키와 세션으로 로그인 유지</title>
  <desc id="d">로그인 요청을 받은 서버가 세션 저장소에 8f2c1a → userId=77을 기록하고 Set-Cookie로 SESSIONID=8f2c1a를 내려준다. 이후 브라우저가 모든 요청에 Cookie: SESSIONID=8f2c1a를 자동으로 붙이면 서버는 세션 저장소를 조회해 userId=77을 확인한다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>

  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="62" y="24" width="176" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="52" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">클라이언트 (브라우저)</text>
  <rect x="480" y="24" width="120" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="540" y="52" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">서버</text>
  <rect x="700" y="24" width="140" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="770" y="52" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">세션 저장소</text>

  <!-- 생명선 -->
  <line x1="150" y1="68" x2="150" y2="526" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="540" y1="68" x2="540" y2="526" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="770" y1="68" x2="770" y2="526" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ① 로그인 요청 -->
  <text x="345" y="106" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">① 로그인 요청</text>
  <text x="345" y="131" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /login  {id, pw}</text>
  <line x1="152" y1="148" x2="536" y2="148" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#m-blue)"/>

  <text x="655" y="174" font-size="15" fill="#92400e" text-anchor="middle">세션 저장소에 기록</text>
  <text x="655" y="197" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"<tspan fill="#6d28d9" font-weight="bold">8f2c1a</tspan> → userId=77"</text>
  <line x1="542" y1="214" x2="766" y2="214" stroke="#b45309" stroke-width="2" marker-end="url(#m-amber)"/>

  <!-- ② 응답 -->
  <text x="345" y="254" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">② 응답</text>
  <text x="345" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan x="345" y="279">Set-Cookie: SESSIONID=<tspan fill="#6d28d9" font-weight="bold">8f2c1a</tspan>;</tspan><tspan x="345" y="301">HttpOnly; Secure; SameSite=Lax</tspan></text>
  <line x1="538" y1="318" x2="154" y2="318" stroke="#047857" stroke-width="2.5" marker-end="url(#m-green)"/>

  <!-- ③ 이후 모든 요청 -->
  <text x="345" y="360" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">③ 이후 모든 요청 (브라우저가 자동으로 붙임)</text>
  <text x="345" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan x="345" y="385">GET /mypage</tspan><tspan x="345" y="407">Cookie: SESSIONID=<tspan fill="#6d28d9" font-weight="bold">8f2c1a</tspan></tspan></text>
  <line x1="152" y1="424" x2="536" y2="424" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#m-blue)"/>

  <text x="655" y="452" font-size="15" fill="#92400e" text-anchor="middle">세션 저장소 조회</text>
  <line x1="542" y1="466" x2="766" y2="466" stroke="#b45309" stroke-width="2" marker-end="url(#m-amber)"/>
  <text x="655" y="494" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">userId=77 확인</text>
  <line x1="768" y1="508" x2="544" y2="508" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-amber)"/>
</svg>
