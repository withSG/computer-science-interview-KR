<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="880" height="670" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stateful 서버와 Stateless 서버 비교</title>
  <desc id="d">Stateful 서버에서는 사용자 A의 상태가 서버1에만 있어 A가 서버1로만 가야 하고 서버1이 죽으면 진행 상황이 사라진다. Stateless 서버에서는 A의 요청이 어느 서버로 가도 똑같이 처리되어 서버를 자유롭게 늘릴 수 있고 한 대가 죽어도 다른 서버가 받는다.</desc>
  <rect width="880" height="670" fill="#ffffff"/>

  <defs>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ===== Stateful ===== -->
  <rect x="24" y="24" width="832" height="300" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="48" y="61" font-size="20" font-weight="bold" fill="#b91c1c">Stateful 서버</text>
  <text x="212" y="60" font-size="16" fill="#374151">사용자 A의 상태 → 서버1에만 있음</text>

  <!-- 사용자 A -->
  <rect x="64" y="144" width="120" height="48" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="124" y="174" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">사용자 A</text>

  <!-- 서버들 -->
  <rect x="330" y="86" width="170" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="348" y="114" font-size="16" font-weight="bold" fill="#1f2937">서버1</text>
  <rect x="411" y="95" width="77" height="26" rx="13" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="449.5" y="113" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">A의 상태</text>

  <rect x="330" y="146" width="170" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="348" y="174" font-size="16" font-weight="bold" fill="#4b5563">서버2</text>

  <rect x="330" y="206" width="170" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="348" y="234" font-size="16" font-weight="bold" fill="#4b5563">서버3</text>

  <!-- 화살표 -->
  <line x1="186" y1="160" x2="324" y2="110" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar-red)"/>
  <line x1="186" y1="168" x2="324" y2="168" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-gray)"/>

  <!-- 설명 -->
  <text x="524" y="114" font-size="16" font-weight="bold" fill="#991b1b">A는 무조건 여기로만</text>
  <text x="524" y="174" font-size="16" fill="#374151">A가 오면 "누구세요?"</text>

  <!-- 결과 -->
  <rect x="48" y="266" width="784" height="40" rx="6" fill="#fee2e2"/>
  <text x="440" y="292" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">서버1이 죽으면 A의 진행 상황도 소멸</text>

  <!-- ===== Stateless ===== -->
  <rect x="24" y="344" width="832" height="300" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="48" y="381" font-size="20" font-weight="bold" fill="#047857">Stateless 서버</text>
  <text x="222" y="380" font-size="16" fill="#374151">상태 없음</text>

  <!-- 사용자 A -->
  <rect x="64" y="464" width="120" height="48" rx="24" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="124" y="494" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">사용자 A</text>

  <!-- 서버들 -->
  <rect x="330" y="406" width="170" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="348" y="434" font-size="16" font-weight="bold" fill="#1f2937">서버1</text>
  <rect x="330" y="466" width="170" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="348" y="494" font-size="16" font-weight="bold" fill="#1f2937">서버2</text>
  <rect x="330" y="526" width="170" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="348" y="554" font-size="16" font-weight="bold" fill="#1f2937">서버3</text>

  <!-- 화살표 -->
  <line x1="186" y1="480" x2="324" y2="430" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <line x1="186" y1="488" x2="324" y2="488" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <line x1="186" y1="496" x2="324" y2="546" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>

  <!-- 설명 -->
  <text x="524" font-size="16" font-weight="bold" fill="#065f46"><tspan x="524" y="453">A의 요청이 아무 서버로 가도</tspan><tspan x="524" dy="23">동일하게 처리됨</tspan></text>
  <text x="524" y="554" font-size="16" fill="#374151">서버 추가가 자유롭다</text>

  <!-- 결과 -->
  <rect x="48" y="586" width="784" height="40" rx="6" fill="#d1fae5"/>
  <text x="440" y="612" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">서버가 죽어도 다른 서버가 받으면 그만</text>
</svg>
