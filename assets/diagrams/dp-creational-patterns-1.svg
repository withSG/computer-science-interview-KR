<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">생성 책임 분리 전후</title>
  <desc id="d">생성 패턴 없이는 OrderService, RefundService, BatchJob 세 곳이 각자 new로 Client를 만들어 생성 방법을 아는 곳이 세 군데다. 생성 책임을 분리하면 세 곳이 Factory를 거쳐 Client를 얻으므로 생성 방법을 아는 곳은 Factory 하나다.</desc>
  <rect width="880" height="590" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 위: 생성 패턴 없이 -->
  <rect x="24" y="24" width="832" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="58" font-size="18" font-weight="bold" fill="#b91c1c">생성 패턴 없이</text>

  <path d="M210,100 L437,150" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M210,160 L437,160" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M210,220 L437,170" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="48" y="78" width="160" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="128" y="106" font-size="16" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService</text>
  <rect x="48" y="138" width="160" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="128" y="166" font-size="16" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RefundService</text>
  <rect x="48" y="198" width="160" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="128" y="226" font-size="16" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">BatchJob</text>

  <rect x="266" y="105" width="52" height="26" fill="#f8fafc"/>
  <text x="292" y="123" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">new</text>
  <rect x="266" y="147" width="52" height="26" fill="#f8fafc"/>
  <text x="292" y="165" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">new</text>
  <rect x="266" y="189" width="52" height="26" fill="#f8fafc"/>
  <text x="292" y="207" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">new</text>

  <rect x="440" y="138" width="100" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="490" y="166" font-size="16" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Client</text>

  <text x="580" y="166" font-size="18" font-weight="bold" fill="#b91c1c">생성 방법을 아는 곳이 세 군데</text>

  <!-- 아래: 생성 책임을 분리하면 -->
  <rect x="24" y="282" width="832" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="316" font-size="18" font-weight="bold" fill="#047857">생성 책임을 분리하면</text>

  <path d="M208,358 H240 M208,418 H240 M208,478 H240 M240,358 V478" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <path d="M240,418 H270" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M392,418 H437" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="48" y="336" width="160" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="128" y="364" font-size="16" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService</text>
  <rect x="48" y="396" width="160" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="128" y="424" font-size="16" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RefundService</text>
  <rect x="48" y="456" width="160" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="128" y="484" font-size="16" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">BatchJob</text>

  <rect x="272" y="396" width="120" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="332" y="424" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Factory</text>

  <rect x="440" y="396" width="100" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="490" y="424" font-size="16" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Client</text>

  <text x="580" y="424" font-size="18" font-weight="bold" fill="#047857">아는 곳은 Factory 하나</text>

  <!-- 범례 -->
  <rect x="48" y="540" width="20" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="80" y="556" font-size="15" fill="#374151">= 생성 방법을 아는 곳</text>
</svg>
