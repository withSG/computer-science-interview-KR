<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">해밍 코드 인코딩 예시</title>
  <desc id="d">데이터 1, 0, 0, 1을 위치 3, 5, 6, 7에 놓고, P1 = 위치 3,5,7의 XOR = 0, P2 = 위치 3,6,7의 XOR = 0, P4 = 위치 5,6,7의 XOR = 1을 계산해 전송 코드워드 0 0 1 1 0 0 1을 만든다.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="640" fill="#ffffff"/>

  <!-- ① 데이터 배치 -->
  <text x="32" y="44" font-size="17" font-weight="bold" fill="#111827">① 데이터 d1 d2 d3 d4 = 1, 0, 0, 1</text>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="374" y="80">d1</text>
    <text x="518" y="80">d2</text>
    <text x="590" y="80">d3</text>
    <text x="662" y="80">d4</text>
  </g>
  <text x="40" y="113" font-size="15" font-weight="bold" fill="#4b5563">데이터</text>
  <g fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5">
    <rect x="344" y="88" width="60" height="38" rx="4"/>
    <rect x="488" y="88" width="60" height="38" rx="4"/>
    <rect x="560" y="88" width="60" height="38" rx="4"/>
    <rect x="632" y="88" width="60" height="38" rx="4"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="374" y="113">1</text>
    <text x="518" y="113">0</text>
    <text x="590" y="113">0</text>
    <text x="662" y="113">1</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5">
    <line x1="374" y1="130" x2="374" y2="164" marker-end="url(#ag)"/>
    <line x1="518" y1="130" x2="518" y2="164" marker-end="url(#ag)"/>
    <line x1="590" y1="130" x2="590" y2="164" marker-end="url(#ag)"/>
    <line x1="662" y1="130" x2="662" y2="164" marker-end="url(#ag)"/>
  </g>

  <!-- 위치 / 값 -->
  <text x="40" y="188" font-size="15" font-weight="bold" fill="#4b5563">위치</text>
  <g font-size="16" fill="#4b5563" text-anchor="middle">
    <text x="230" y="188">1</text>
    <text x="302" y="188">2</text>
    <text x="374" y="188">3</text>
    <text x="446" y="188">4</text>
    <text x="518" y="188">5</text>
    <text x="590" y="188">6</text>
    <text x="662" y="188">7</text>
  </g>
  <text x="40" y="223" font-size="15" font-weight="bold" fill="#4b5563">값</text>
  <g stroke-width="1.8" stroke-dasharray="5 4">
    <rect x="200" y="198" width="60" height="38" rx="4" fill="#eff6ff" stroke="#1d4ed8"/>
    <rect x="272" y="198" width="60" height="38" rx="4" fill="#ecfdf5" stroke="#047857"/>
    <rect x="416" y="198" width="60" height="38" rx="4" fill="#f5f3ff" stroke="#6d28d9"/>
  </g>
  <g fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5">
    <rect x="344" y="198" width="60" height="38" rx="4"/>
    <rect x="488" y="198" width="60" height="38" rx="4"/>
    <rect x="560" y="198" width="60" height="38" rx="4"/>
    <rect x="632" y="198" width="60" height="38" rx="4"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="230" y="223" fill="#1d4ed8">P1</text>
    <text x="302" y="223" fill="#065f46">P2</text>
    <text x="374" y="223" fill="#111827">1</text>
    <text x="446" y="223" fill="#6d28d9">P4</text>
    <text x="518" y="223" fill="#111827">0</text>
    <text x="590" y="223" fill="#111827">0</text>
    <text x="662" y="223" fill="#111827">1</text>
  </g>

  <!-- ② 패리티 계산 -->
  <text x="32" y="284" font-size="17" font-weight="bold" fill="#111827">② 각 패리티 = 자기가 감시하는 자리들의 XOR</text>

  <rect x="32" y="300" width="816" height="46" rx="6" fill="#eff6ff"/>
  <rect x="32" y="356" width="816" height="46" rx="6" fill="#ecfdf5"/>
  <rect x="32" y="412" width="816" height="46" rx="6" fill="#f5f3ff"/>

  <rect x="48" y="307" width="52" height="32" rx="5" fill="#1d4ed8"/>
  <rect x="48" y="363" width="52" height="32" rx="5" fill="#047857"/>
  <rect x="48" y="419" width="52" height="32" rx="5" fill="#6d28d9"/>
  <g font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="74" y="329">P1</text>
    <text x="74" y="385">P2</text>
    <text x="74" y="441">P4</text>
  </g>

  <g font-size="18" fill="#111827">
    <text x="118" y="329">= (위치 3,5,7의 XOR) = 1 ⊕ 0 ⊕ 1 =</text>
    <text x="118" y="385">= (위치 3,6,7의 XOR) = 1 ⊕ 0 ⊕ 1 =</text>
    <text x="118" y="441">= (위치 5,6,7의 XOR) = 0 ⊕ 0 ⊕ 1 =</text>
  </g>

  <rect x="470" y="306" width="46" height="34" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="470" y="362" width="46" height="34" rx="5" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <rect x="470" y="418" width="46" height="34" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <text x="493" y="330" fill="#1d4ed8">0</text>
    <text x="493" y="386" fill="#065f46">0</text>
    <text x="493" y="442" fill="#6d28d9">1</text>
  </g>
  <g font-size="15" fill="#4b5563">
    <text x="536" y="328">→ 위치 1에 기록</text>
    <text x="536" y="384">→ 위치 2에 기록</text>
    <text x="536" y="440">→ 위치 4에 기록</text>
  </g>

  <!-- ③ 전송 코드워드 -->
  <text x="32" y="504" font-size="17" font-weight="bold" fill="#111827">③ 전송 코드워드</text>
  <text x="40" y="538" font-size="15" font-weight="bold" fill="#4b5563">위치</text>
  <g font-size="16" fill="#4b5563" text-anchor="middle">
    <text x="230" y="538">1</text>
    <text x="302" y="538">2</text>
    <text x="374" y="538">3</text>
    <text x="446" y="538">4</text>
    <text x="518" y="538">5</text>
    <text x="590" y="538">6</text>
    <text x="662" y="538">7</text>
  </g>
  <text x="40" y="573" font-size="15" font-weight="bold" fill="#4b5563">값</text>
  <g stroke-width="2">
    <rect x="200" y="548" width="60" height="38" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <rect x="272" y="548" width="60" height="38" rx="4" fill="#d1fae5" stroke="#047857"/>
    <rect x="416" y="548" width="60" height="38" rx="4" fill="#ede9fe" stroke="#6d28d9"/>
  </g>
  <g fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5">
    <rect x="344" y="548" width="60" height="38" rx="4"/>
    <rect x="488" y="548" width="60" height="38" rx="4"/>
    <rect x="560" y="548" width="60" height="38" rx="4"/>
    <rect x="632" y="548" width="60" height="38" rx="4"/>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="230" y="574" fill="#1d4ed8">0</text>
    <text x="302" y="574" fill="#065f46">0</text>
    <text x="374" y="574" fill="#111827">1</text>
    <text x="446" y="574" fill="#6d28d9">1</text>
    <text x="518" y="574" fill="#111827">0</text>
    <text x="590" y="574" fill="#111827">0</text>
    <text x="662" y="574" fill="#111827">1</text>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="230" y="608" fill="#1d4ed8" font-weight="bold">P1</text>
    <text x="302" y="608" fill="#065f46" font-weight="bold">P2</text>
    <text x="374" y="608" fill="#4b5563">d1</text>
    <text x="446" y="608" fill="#6d28d9" font-weight="bold">P4</text>
    <text x="518" y="608" fill="#4b5563">d2</text>
    <text x="590" y="608" fill="#4b5563">d3</text>
    <text x="662" y="608" fill="#4b5563">d4</text>
  </g>
</svg>
