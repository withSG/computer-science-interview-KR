<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Mark-and-Sweep 동작 과정</title>
  <desc id="d">GC 루트에서 시작하여 도달 가능한 객체를 마크하고 마크되지 않은 객체를 메모리에서 해제하는 트리 구조 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <!-- 단계 헤더 섹션 -->
  <rect x="40" y="30" width="800" height="84" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <rect x="60" y="44" width="760" height="26" rx="4" fill="#eff6ff"/>
  <text x="70" y="61" fill="#2563eb" font-size="13" font-weight="bold">1. Mark 단계:</text>
  <text x="175" y="61" fill="#1f2933" font-size="13">GC 루트에서 시작하여 도달 가능한 객체를 마크</text>

  <rect x="60" y="76" width="760" height="26" rx="4" fill="#fef2f2"/>
  <text x="70" y="93" fill="#dc2626" font-size="13" font-weight="bold">2. Sweep 단계:</text>
  <text x="185" y="93" fill="#1f2933" font-size="13">마크되지 않은 객체를 메모리에서 해제</text>

  <!-- 범례 (Legend) -->
  <rect x="520" y="145" width="320" height="30" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <circle cx="535" cy="160" r="6" fill="#059669"/>
  <text x="547" y="164" fill="#1f2933" font-size="11.5">✓ 도달 가능 (유지)</text>
  <circle cx="675" cy="160" r="6" fill="#dc2626"/>
  <text x="687" y="164" fill="#1f2933" font-size="11.5">✗ 도달 불가 (수거 대상)</text>

  <!-- 트리의 루트: GC Root -->
  <rect x="40" y="140" width="220" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="165" fill="#7c3aed" font-size="14" font-weight="bold" text-anchor="middle">GC Root (전역 객체, 콜 스택)</text>

  <!-- 계층 연결선 및 경로 -->
  <!-- GC Root -> obj1 -->
  <path d="M 100 180 L 100 240 L 140 240" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
  <!-- obj1 -> obj2 -->
  <path d="M 230 260 L 230 320 L 270 320" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>

  <!-- GC Root -> obj3 -->
  <path d="M 100 180 L 100 380 L 140 380" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>

  <!-- GC Root -> (obj4) [도달 불가 끊어진 선] -->
  <path d="M 100 180 L 100 450 L 140 450" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
  <!-- (obj4) -> (obj5) -->
  <path d="M 285 470 L 285 490 L 310 490" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-red)"/>

  <!-- 노드 1: obj1 ✓ (마크 - 유지) -->
  <rect x="140" y="220" width="200" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="245" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">obj1 ✓ (마크 - 유지)</text>

  <!-- 노드 2: obj2 ✓ (마크 - 유지) -->
  <rect x="270" y="300" width="200" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="370" y="325" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">obj2 ✓ (마크 - 유지)</text>

  <!-- 노드 3: obj3 ✓ (마크 - 유지) -->
  <rect x="140" y="360" width="200" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="385" fill="#059669" font-size="13" font-weight="bold" text-anchor="middle">obj3 ✓ (마크 - 유지)</text>

  <!-- 노드 4: (obj4) ✗ (마크 안됨 - 수거 대상) -->
  <rect x="140" y="430" width="290" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="285" y="455" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">(obj4) ✗ (마크 안됨 - 수거 대상)</text>

  <!-- 노드 5: (obj5) ✗ (마크 안됨 - 수거 대상) -->
  <rect x="310" y="480" width="290" height="32" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="455" y="501" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">(obj5) ✗ (마크 안됨 - 수거 대상)</text>
</svg>