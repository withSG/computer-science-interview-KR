<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Mark-and-Sweep 동작 과정</title>
  <desc id="d">Mark 단계에서 GC Root(전역 객체, 콜 스택)부터 참조를 따라 도달 가능한 obj1, obj2, obj3을 마크해 유지하고, Sweep 단계에서 마크되지 않은 obj4, obj5를 수거 대상으로 메모리에서 해제한다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 단계 -->
  <rect x="24" y="24" width="388" height="80" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="54" cy="50" r="14" fill="#047857"/>
  <text x="54" y="56" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="78" y="57" font-size="18" font-weight="bold" fill="#047857">Mark 단계</text>
  <text x="42" y="88" font-size="15" fill="#1f2937">GC 루트에서 시작하여 도달 가능한 객체를 마크</text>

  <line x1="418" y1="64" x2="460" y2="64" stroke="#6b7280" stroke-width="2" marker-end="url(#ak)"/>

  <rect x="468" y="24" width="388" height="80" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="498" cy="50" r="14" fill="#b91c1c"/>
  <text x="498" y="56" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="522" y="57" font-size="18" font-weight="bold" fill="#b91c1c">Sweep 단계</text>
  <text x="486" y="88" font-size="15" fill="#1f2937">마크되지 않은 객체를 메모리에서 해제</text>

  <!-- GC Root -->
  <rect x="24" y="210" width="200" height="64" rx="10" fill="#1f2937"/>
  <text x="124" y="237" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GC Root</text>
  <text x="124" y="261" font-size="15" fill="#e5e7eb" text-anchor="middle">(전역 객체, 콜 스택)</text>

  <!-- 도달 가능 영역 -->
  <rect x="262" y="128" width="594" height="204" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="282" y="155" font-size="16" font-weight="bold" fill="#047857">도달 가능 — Mark 단계에서 마크됨</text>

  <path d="M224,242 H272 V202 H298" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M272,242 V282 H298" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="520" y1="202" x2="608" y2="202" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="300" y="172" width="220" height="60" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="410" y="196" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">obj1</text>
  <text x="410" y="220" font-size="15" fill="#047857" text-anchor="middle">✓ 마크 - 유지</text>

  <rect x="610" y="172" width="220" height="60" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="720" y="196" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">obj2</text>
  <text x="720" y="220" font-size="15" fill="#047857" text-anchor="middle">✓ 마크 - 유지</text>

  <rect x="300" y="252" width="220" height="60" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="410" y="276" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">obj3</text>
  <text x="410" y="300" font-size="15" fill="#047857" text-anchor="middle">✓ 마크 - 유지</text>

  <!-- 도달 불가 영역 -->
  <rect x="262" y="352" width="594" height="124" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="282" y="379" font-size="16" font-weight="bold" fill="#b91c1c">도달 불가 — Sweep 단계에서 해제</text>

  <line x1="520" y1="426" x2="608" y2="426" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <rect x="300" y="396" width="220" height="60" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="410" y="420" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">obj4</text>
  <text x="410" y="444" font-size="15" fill="#b91c1c" text-anchor="middle">✗ 마크 안됨 - 수거 대상</text>

  <rect x="610" y="396" width="220" height="60" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="720" y="420" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">obj5</text>
  <text x="720" y="444" font-size="15" fill="#b91c1c" text-anchor="middle">✗ 마크 안됨 - 수거 대상</text>
</svg>
