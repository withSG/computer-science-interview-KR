<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IEEE 754 부동 소수점 구조</title>
  <desc id="d">부동 소수점은 부호 비트, 지수부(Exponent), 가수부(Mantissa)로 나뉜다. 단정도(32비트)는 1+8+23비트, 배정도(64비트)는 1+11+52비트이며 값은 (-1)^부호 × 1.가수 × 2^(지수 - bias)로 계산한다. 장점(매우 넓은 표현 범위 ±3.4 × 10^38), 단점(정밀도 제한, 0.1 + 0.2 ≠ 0.3 문제), 사용 분야(과학 계산, 그래픽, 일반 프로그래밍)를 함께 정리했다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 구조 (머리행) -->
  <text x="40" y="51" font-size="16" font-weight="bold" fill="#111827">구조</text>
  <rect x="196" y="24" width="90" height="42" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="241" y="51" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">부호 비트</text>
  <rect x="296" y="24" width="220" height="42" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="406" y="51" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">지수부(Exponent)</text>
  <rect x="526" y="24" width="314" height="42" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="683" y="51" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">가수부(Mantissa)</text>

  <!-- 단정도 -->
  <text x="40" y="102" font-size="16" font-weight="bold" fill="#111827">단정도(32비트)</text>
  <rect x="196" y="76" width="90" height="40" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="241" y="102" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">1비트</text>
  <rect x="296" y="76" width="220" height="40" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="406" y="102" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">8비트</text>
  <rect x="526" y="76" width="314" height="40" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="683" y="102" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">23비트</text>

  <!-- 배정도 -->
  <text x="40" y="150" font-size="16" font-weight="bold" fill="#111827">배정도(64비트)</text>
  <rect x="196" y="124" width="90" height="40" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="241" y="150" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">1비트</text>
  <rect x="296" y="124" width="220" height="40" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="406" y="150" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">11비트</text>
  <rect x="526" y="124" width="314" height="40" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="683" y="150" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">52비트</text>

  <!-- 값 계산식 -->
  <rect x="40" y="188" width="800" height="64" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="440" y="228" font-size="20" fill="#111827" text-anchor="middle">값 = (−1)<tspan dy="-9" font-size="15" font-weight="bold" fill="#6d28d9">부호</tspan><tspan dy="9"> × 1.</tspan><tspan font-weight="bold" fill="#b45309">가수</tspan><tspan> × 2</tspan><tspan dy="-9" font-size="15">(<tspan font-weight="bold" fill="#1d4ed8">지수</tspan> − bias)</tspan></text>

  <!-- 장점 -->
  <rect x="40" y="276" width="392" height="88" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="64" y="306" font-size="18" font-weight="bold" fill="#047857">장점</text>
  <circle cx="70" cy="337" r="3" fill="#047857"/>
  <text x="82" y="342" font-size="16" fill="#111827">매우 넓은 표현 범위 (±3.4 × 10<tspan dy="-7" font-size="14">38</tspan><tspan dy="7">)</tspan></text>

  <!-- 단점 -->
  <rect x="448" y="276" width="392" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="472" y="306" font-size="18" font-weight="bold" fill="#b91c1c">단점</text>
  <circle cx="478" cy="337" r="3" fill="#b91c1c"/>
  <text x="490" y="342" font-size="16" fill="#111827">정밀도 제한 (0.1 + 0.2 ≠ 0.3 문제)</text>

  <!-- 사용 -->
  <text x="40" y="411" font-size="17" font-weight="bold" fill="#111827">사용</text>
  <rect x="96" y="388" width="97" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="144.5" y="411" font-size="16" fill="#111827" text-anchor="middle">과학 계산</text>
  <rect x="205" y="388" width="76" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="243" y="411" font-size="16" fill="#111827" text-anchor="middle">그래픽</text>
  <rect x="293" y="388" width="129" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="357.5" y="411" font-size="16" fill="#111827" text-anchor="middle">일반 프로그래밍</text>
</svg>
