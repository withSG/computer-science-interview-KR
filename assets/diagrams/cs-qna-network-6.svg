<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Blocking I/O (동기 블로킹)</title>
  <desc id="d">호출자가 read()를 호출하면 데이터가 올 때까지 스레드가 블로킹되어 기다렸다가 데이터를 받아 처리하는 흐름과, 이 모델의 특징·문제·예를 정리한 그림.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 흐름: 호출자 → read() 호출 → [대기] → 데이터 수신 → 처리 -->
  <rect x="24" y="40" width="88" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="68" y="74" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">호출자</text>
  <line x1="114" y1="68" x2="146" y2="68" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="150" y="40" width="140" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="220" y="74" font-size="16" fill="#1e3a8a" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">read()</tspan> 호출</text>
  <line x1="292" y1="68" x2="322" y2="68" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="326" y="40" width="276" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="464" y="74" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">대기 대기 대기...</text>
  <line x1="604" y1="68" x2="634" y2="68" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="638" y="40" width="124" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="700" y="74" font-size="16" fill="#065f46" text-anchor="middle">데이터 수신</text>
  <line x1="764" y1="68" x2="790" y2="68" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="794" y="40" width="62" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="825" y="74" font-size="16" fill="#1e3a8a" text-anchor="middle">처리</text>

  <!-- 대기 구간 강조 -->
  <path d="M330,106 V114 H458 L464,122 L470,114 H598 V106" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="464" y="146" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">이 구간 동안 스레드 블로킹</text>

  <!-- 특징 -->
  <rect x="24" y="176" width="408" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="208" font-size="17" font-weight="bold" fill="#1d4ed8">특징</text>
  <circle cx="50" cy="237" r="3" fill="#1d4ed8"/>
  <text x="62" y="242" font-size="15" fill="#1f2937">가장 단순한 모델</text>
  <circle cx="50" cy="267" r="3" fill="#1d4ed8"/>
  <text x="62" y="272" font-size="15" fill="#1f2937">I/O 완료까지 스레드 블로킹</text>
  <circle cx="50" cy="297" r="3" fill="#1d4ed8"/>
  <text x="62" y="302" font-size="15" fill="#1f2937">멀티스레드로 동시성 처리 (스레드당 1 I/O)</text>

  <!-- 문제 -->
  <rect x="448" y="176" width="408" height="156" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="468" y="208" font-size="17" font-weight="bold" fill="#b91c1c">문제</text>
  <circle cx="474" cy="237" r="3" fill="#b91c1c"/>
  <text x="486" y="242" font-size="15" fill="#1f2937">스레드 수 = 동시 연결 수 → 스레드 폭발 위험</text>
  <circle cx="474" cy="267" r="3" fill="#b91c1c"/>
  <text x="486" y="272" font-size="15" fill="#1f2937">컨텍스트 스위칭 오버헤드</text>

  <!-- 예 -->
  <rect x="24" y="352" width="832" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="388" font-size="16" font-weight="bold" fill="#111827">예</text>
  <text x="76" y="388" font-size="15" fill="#1f2937">전통적인 Java I/O (<tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">InputStream.read()</tspan>)</text>
</svg>
