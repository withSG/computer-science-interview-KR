<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">직접 호출과 옵저버 비교</title>
  <desc id="d">직접 호출에서는 UserService가 EmailService, PointService, StatsService를 모두 불러 후속 처리가 추가될 때마다 커진다. 옵저버에서는 UserService가 UserRegisteredEvent만 발행하고 Email, Point, Stats, Coupon 구독자가 각자 받으므로 발행자는 구독자를 모른다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <line x1="440" y1="30" x2="440" y2="356" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ===== 직접 호출 ===== -->
  <text x="24" y="50" font-size="18" font-weight="bold" fill="#b91c1c">직접 호출</text>

  <rect x="24" y="167" width="144" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="96" y="196" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UserService</text>

  <!-- 줄기와 가지 -->
  <path d="M168,190 L204,190 M204,100 L204,247" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
  <line x1="204" y1="100" x2="250" y2="100" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-r)"/>
  <line x1="204" y1="158" x2="250" y2="158" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-r)"/>
  <line x1="204" y1="216" x2="250" y2="216" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-r)"/>
  <path d="M204,247 L204,274 L250,274" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-r)"/>

  <rect x="254" y="80" width="162" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="335" y="105" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">EmailService</text>
  <rect x="254" y="138" width="162" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="335" y="163" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">PointService</text>
  <rect x="254" y="196" width="162" height="40" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="335" y="221" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">StatsService</text>
  <rect x="254" y="254" width="162" height="40" rx="6" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="335" y="279" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">+ 새 후속 처리</text>

  <text x="220" y="340" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">추가될 때마다 UserService가 커진다</text>

  <!-- ===== 옵저버 ===== -->
  <text x="464" y="50" font-size="18" font-weight="bold" fill="#1d4ed8">옵저버</text>

  <rect x="588" y="72" width="144" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="660" y="101" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UserService</text>

  <line x1="660" y1="118" x2="660" y2="152" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="674" y="141" font-size="15" font-weight="bold" fill="#1d4ed8">발행</text>

  <rect x="530" y="156" width="260" height="46" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="660" y="185" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UserRegisteredEvent</text>

  <!-- 구독자에게 전달 -->
  <path d="M660,202 L660,222 M511,222 L809,222" fill="none" stroke="#047857" stroke-width="1.8"/>
  <line x1="511" y1="222" x2="511" y2="248" stroke="#047857" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <line x1="610" y1="222" x2="610" y2="248" stroke="#047857" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <line x1="710" y1="222" x2="710" y2="248" stroke="#047857" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <line x1="809" y1="222" x2="809" y2="248" stroke="#047857" stroke-width="1.8" marker-end="url(#arr-g)"/>

  <rect x="468" y="252" width="86" height="42" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="511" y="278" font-size="15" fill="#111827" text-anchor="middle">Email</text>
  <rect x="567" y="252" width="86" height="42" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="610" y="278" font-size="15" fill="#111827" text-anchor="middle">Point</text>
  <rect x="667" y="252" width="86" height="42" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="710" y="278" font-size="15" fill="#111827" text-anchor="middle">Stats</text>
  <rect x="766" y="252" width="86" height="42" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="809" y="278" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">Coupon</text>
  <text x="809" y="314" font-size="14" fill="#047857" text-anchor="middle">+ 추가</text>

  <text x="660" y="340" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">발행자는 구독자를 모른다</text>
</svg>
