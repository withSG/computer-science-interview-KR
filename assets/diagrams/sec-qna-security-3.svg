<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비대칭키 암호화</title>
  <desc id="d">수신자가 공개키를 송신자에게 전달하고, 송신자는 그 공개키로 암호화해 보내며, 수신자는 개인키로 복호화한다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="140" y="30" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="220" y="62" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">송신자</text>
  <rect x="580" y="30" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="660" y="62" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">수신자</text>

  <!-- 생명선 -->
  <path d="M220,80 L220,340" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M660,80 L660,268" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M660,316 L660,340" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ① 공개키 전달 -->
  <text x="440" y="136" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">① 공개키 전달</text>
  <path d="M652,150 L230,150" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>

  <!-- ② 공개키로 암호화 -->
  <text x="440" y="216" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">② 공개키로 암호화</text>
  <path d="M228,230 L650,230" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>

  <!-- ③ 개인키로 복호화 -->
  <rect x="560" y="268" width="200" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="660" y="298" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">③ 개인키로 복호화</text>
</svg>
