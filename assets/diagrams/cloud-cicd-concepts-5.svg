<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 피라미드를 파이프라인에 눕히기</title>
  <desc id="d">느림, 비쌈, 신뢰도 높음 특성의 E2E, 통합 테스트, 단위 테스트 피라미드와 설명 라벨을 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 상단 및 하단 속성 라벨 -->
  <text x="310" y="38.5" fill="#52606d" font-size="13" font-weight="bold" text-anchor="middle">느림 / 비쌈 / 신뢰도 높음</text>
  <text x="310" y="348.5" fill="#52606d" font-size="13" font-weight="bold" text-anchor="middle">빠름 / 쌈 / 범위 좁음</text>

  <!-- 피라미드 박스 (E2E) -->
  <rect x="230" y="55" width="160" height="50" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="84.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">E2E</text>

  <!-- 피라미드 박스 (통합 테스트) -->
  <rect x="170" y="140" width="280" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="169.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">통합 테스트</text>

  <!-- 피라미드 박스 (단위 테스트) -->
  <rect x="110" y="225" width="400" height="50" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="310" y="254.55" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">단위 테스트</text>

  <!-- 계단형 연결선 (ASCII의 ┌─┴ ┴─┐ 표현) -->
  <path d="M230,105 L230,122.5 L170,122.5 L170,140" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M390,105 L390,122.5 L450,122.5 L450,140" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M170,190 L170,207.5 L110,207.5 L110,225" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M450,190 L450,207.5 L510,207.5 L510,225" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- 화살표 및 설명 라벨 (E2E) -->
  <path d="M480,80 L420,80" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="490" y="84.55" fill="#1f2933" font-size="13" text-anchor="start">핵심 시나리오 몇 개만. 머지 후 또는 야간에.</text>

  <!-- 화살표 및 설명 라벨 (통합 테스트) -->
  <path d="M510,165 L470,165" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="520" y="169.55" fill="#1f2933" font-size="13" text-anchor="start">PR 파이프라인 후반. DB/외부 연동 확인.</text>

  <!-- 화살표 및 설명 라벨 (단위 테스트) -->
  <path d="M570,250 L530,250" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="580" y="254.55" fill="#1f2933" font-size="13" text-anchor="start">PR 파이프라인 맨 앞. 수십 초 안에 끝나야 한다.</text>
</svg>