<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트 피라미드와 파이프라인 배치</title>
  <desc id="d">위로 갈수록 느리고 비싸며 신뢰도가 높은 테스트 피라미드(단위 테스트, 통합 테스트, E2E)와 각 층을 파이프라인 어디서 돌리는지 보여준다. 단위 테스트는 PR 파이프라인 맨 앞, 통합 테스트는 PR 파이프라인 후반, E2E는 머지 후 또는 야간에 돌린다.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 세로 축: 위 = 느림/비쌈/신뢰도 높음, 아래 = 빠름/쌈/범위 좁음 -->
  <text x="24" y="42" font-size="15" font-weight="bold" fill="#374151">느림 / 비쌈 / 신뢰도 높음</text>
  <line x1="36" y1="58" x2="36" y2="346" stroke="#4b5563" stroke-width="2" marker-start="url(#ax)" marker-end="url(#ax)"/>
  <text x="24" y="378" font-size="15" font-weight="bold" fill="#374151">빠름 / 쌈 / 범위 좁음</text>

  <!-- 피라미드 -->
  <polygon points="210,64 310,64 357.1,152 162.9,152" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="260" y="114" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">E2E</text>

  <polygon points="158.6,160 361.4,160 408.6,248 111.4,248" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="210" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">통합 테스트</text>

  <polygon points="107.1,256 412.9,256 460,344 60,344" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="260" y="306" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">단위 테스트</text>

  <!-- 파이프라인 배치 설명 -->
  <text x="520" y="42" font-size="15" fill="#4b5563">파이프라인에서 돌리는 위치</text>

  <line x1="342" y1="108" x2="516" y2="108" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="520" y="64" width="336" height="88" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="540" y="101" font-size="16" font-weight="bold" fill="#b45309">머지 후 또는 야간에</text>
  <text x="540" y="128" font-size="15" fill="#374151">핵심 시나리오 몇 개만</text>

  <line x1="394" y1="204" x2="516" y2="204" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="520" y="160" width="336" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="197" font-size="16" font-weight="bold" fill="#1d4ed8">PR 파이프라인 후반</text>
  <text x="540" y="224" font-size="15" fill="#374151">DB/외부 연동 확인</text>

  <line x1="445" y1="300" x2="516" y2="300" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="520" y="256" width="336" height="88" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="540" y="293" font-size="16" font-weight="bold" fill="#047857">PR 파이프라인 맨 앞</text>
  <text x="540" y="320" font-size="15" fill="#374151">수십 초 안에 끝나야 한다</text>
</svg>
