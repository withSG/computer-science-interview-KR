<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OSI 7계층 한눈에 보기</title>
  <desc id="d">OSI 7계층을 7 응용부터 1 물리까지 위에서 아래로 놓고, 계층마다 책임, 주소, PDU, 대표 장비를 한 행씩 정리한 표입니다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>

  <!-- 줄무늬 행 (6, 4, 2 계층) -->
  <rect x="24" y="124" width="832" height="56" fill="#f3f6fb"/>
  <rect x="24" y="236" width="832" height="56" fill="#f3f6fb"/>
  <rect x="24" y="348" width="832" height="56" fill="#f3f6fb"/>

  <!-- 머리행 -->
  <rect x="24" y="24" width="832" height="44" fill="#1e3a8a"/>
  <g font-size="16" font-weight="700" fill="#ffffff">
    <text x="40" y="52">계층</text>
    <text x="190" y="52">책임</text>
    <text x="444" y="52" text-anchor="middle">주소</text>
    <text x="549" y="52" text-anchor="middle">PDU</text>
    <text x="630" y="52">대표 장비</text>
  </g>

  <!-- 격자 -->
  <g stroke="#d6dce5" stroke-width="1">
    <line x1="24" y1="124" x2="856" y2="124"/>
    <line x1="24" y1="180" x2="856" y2="180"/>
    <line x1="24" y1="236" x2="856" y2="236"/>
    <line x1="24" y1="292" x2="856" y2="292"/>
    <line x1="24" y1="348" x2="856" y2="348"/>
    <line x1="24" y1="404" x2="856" y2="404"/>
    <line x1="174" y1="68" x2="174" y2="460"/>
    <line x1="404" y1="68" x2="404" y2="460"/>
    <line x1="484" y1="68" x2="484" y2="460"/>
    <line x1="614" y1="68" x2="614" y2="460"/>
  </g>
  <rect x="24" y="24" width="832" height="436" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 계층 번호 배지 -->
  <g fill="#1d4ed8">
    <rect x="38" y="82" width="28" height="28" rx="6"/>
    <rect x="38" y="138" width="28" height="28" rx="6"/>
    <rect x="38" y="194" width="28" height="28" rx="6"/>
    <rect x="38" y="250" width="28" height="28" rx="6"/>
    <rect x="38" y="306" width="28" height="28" rx="6"/>
    <rect x="38" y="362" width="28" height="28" rx="6"/>
    <rect x="38" y="418" width="28" height="28" rx="6"/>
  </g>
  <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="52" y="102">7</text>
    <text x="52" y="158">6</text>
    <text x="52" y="214">5</text>
    <text x="52" y="270">4</text>
    <text x="52" y="326">3</text>
    <text x="52" y="382">2</text>
    <text x="52" y="438">1</text>
  </g>

  <!-- 계층 이름 -->
  <g font-size="16" font-weight="700" fill="#111827">
    <text x="78" y="102">응용</text>
    <text x="78" y="158">표현</text>
    <text x="78" y="214">세션</text>
    <text x="78" y="270">전송</text>
    <text x="78" y="326">네트워크</text>
    <text x="78" y="382">데이터링크</text>
    <text x="78" y="438">물리</text>
  </g>

  <!-- 책임 -->
  <g font-size="16" fill="#1f2937">
    <text x="190" y="102">사용자·앱이 쓰는 규약</text>
    <text x="190" y="158">인코딩·압축·암호화</text>
    <text x="190" y="214">대화의 시작·유지·종료</text>
    <text x="190" y="270">프로세스 간 전달, 신뢰성</text>
    <text x="190" y="326">종단 간 경로 결정</text>
    <text x="190" y="382">인접 노드 간 전달, 오류검출</text>
    <text x="190" y="438">비트를 신호로 바꿔 전송</text>
  </g>

  <!-- 주소 -->
  <g font-size="16" text-anchor="middle">
    <text x="444" y="102" fill="#4b5563">-</text>
    <text x="444" y="158" fill="#4b5563">-</text>
    <text x="444" y="214" fill="#4b5563">-</text>
    <text x="444" y="270" fill="#1d4ed8" font-weight="700">포트</text>
    <text x="444" y="326" fill="#1d4ed8" font-weight="700">IP</text>
    <text x="444" y="382" fill="#1d4ed8" font-weight="700">MAC</text>
    <text x="444" y="438" fill="#4b5563">-</text>
  </g>

  <!-- PDU -->
  <g font-size="16" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="549" y="102">메시지</text>
    <text x="549" y="158">메시지</text>
    <text x="549" y="214">메시지</text>
    <text x="549" y="259">세그먼트</text>
    <text x="549" y="281">/데이터그램</text>
    <text x="549" y="326">패킷</text>
    <text x="549" y="382">프레임</text>
    <text x="549" y="438">비트</text>
  </g>

  <!-- 대표 장비 -->
  <g font-size="16" fill="#1f2937">
    <text x="630" y="91">L7 로드밸런서</text>
    <text x="630" y="113" fill="#4b5563">(프록시, WAF)</text>
    <text x="630" y="270">L4 로드밸런서</text>
    <text x="630" y="326">라우터, L3 스위치</text>
    <text x="630" y="382">스위치, 브리지</text>
    <text x="630" y="438">케이블, 허브, 리피터</text>
  </g>
</svg>
