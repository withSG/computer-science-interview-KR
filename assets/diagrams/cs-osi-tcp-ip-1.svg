<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OSI 7계층</title>
  <desc id="d">OSI 7계층 각 계층의 이름, 책임, 주소, PDU, 대표 장비를 나타낸 표 형태의 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 헤더 영역 -->
  <rect x="24" y="24" width="832" height="40" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="94" y="48.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">계층</text>
  <text x="280" y="48.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">책임</text>
  <text x="440" y="48.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">주소</text>
  <text x="540" y="48.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">PDU</text>
  <text x="710" y="48.2" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">대표 장비</text>

  <!-- 7계층 : 응용 (보라 계열: 상위 계층/사용자 접점) -->
  <g>
    <rect x="24" y="70" width="140" height="44" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
    <text x="94" y="96.5" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">7 응용</text>
    <text x="180" y="96.5" font-size="13" fill="#1f2933">사용자·앱이 쓰는 규약</text>
    <text x="440" y="96.5" font-size="13" fill="#52606d" text-anchor="middle">-</text>
    <text x="540" y="96.5" font-size="13" fill="#1f2933" text-anchor="middle">메시지</text>
    <text x="710" y="88.5" font-size="13" fill="#1f2933" text-anchor="middle">L7 로드밸런서</text>
    <text x="710" y="106.5" font-size="11.5" fill="#52606d" text-anchor="middle">(프록시, WAF)</text>
    <line x1="24" y1="120" x2="856" y2="120" stroke="#cbd2d9" stroke-width="1"/>
  </g>

  <!-- 6계층 : 표현 -->
  <g>
    <rect x="24" y="126" width="140" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
    <text x="94" y="150.5" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">6 표현</text>
    <text x="180" y="150.5" font-size="13" fill="#1f2933">인코딩·압축·암호화</text>
    <text x="440" y="150.5" font-size="13" fill="#52606d" text-anchor="middle">-</text>
    <text x="540" y="150.5" font-size="13" fill="#1f2933" text-anchor="middle">메시지</text>
    <line x1="24" y1="172" x2="856" y2="172" stroke="#cbd2d9" stroke-width="1"/>
  </g>

  <!-- 5계층 : 세션 -->
  <g>
    <rect x="24" y="178" width="140" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
    <text x="94" y="202.5" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">5 세션</text>
    <text x="180" y="202.5" font-size="13" fill="#1f2933">대화의 시작·유지·종료</text>
    <text x="440" y="202.5" font-size="13" fill="#52606d" text-anchor="middle">-</text>
    <text x="540" y="202.5" font-size="13" fill="#1f2933" text-anchor="middle">메시지</text>
    <line x1="24" y1="224" x2="856" y2="224" stroke="#cbd2d9" stroke-width="1"/>
  </g>

  <!-- 4계층 : 전송 (파랑 계열: 종단 간 데이터 전달) -->
  <g>
    <rect x="24" y="230" width="140" height="44" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="94" y="256.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">4 전송</text>
    <text x="180" y="256.5" font-size="13" fill="#1f2933">프로세스 간 전달, 신뢰성</text>
    <text x="440" y="256.5" font-size="13" fill="#1f2933" text-anchor="middle">포트</text>
    <text x="540" y="248.5" font-size="13" fill="#1f2933" text-anchor="middle">세그먼트</text>
    <text x="540" y="266.5" font-size="13" fill="#1f2933" text-anchor="middle">/데이터그램</text>
    <text x="710" y="256.5" font-size="13" fill="#1f2933" text-anchor="middle">L4 로드밸런서</text>
    <line x1="24" y1="280" x2="856" y2="280" stroke="#cbd2d9" stroke-width="1"/>
  </g>

  <!-- 3계층 : 네트워크 (초록 계열: 경로 결정 및 라우팅) -->
  <g>
    <rect x="24" y="286" width="140" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="94" y="310.5" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">3 네트워크</text>
    <text x="180" y="310.5" font-size="13" fill="#1f2933">종단 간 경로 결정</text>
    <text x="440" y="310.5" font-size="13" fill="#1f2933" text-anchor="middle">IP</text>
    <text x="540" y="310.5" font-size="13" fill="#1f2933" text-anchor="middle">패킷</text>
    <text x="710" y="310.5" font-size="13" fill="#1f2933" text-anchor="middle">라우터, L3 스위치</text>
    <line x1="24" y1="332" x2="856" y2="332" stroke="#cbd2d9" stroke-width="1"/>
  </g>

  <!-- 2계층 : 데이터링크 (주황 계열: 노드 간 인접 전달) -->
  <g>
    <rect x="24" y="338" width="140" height="40" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
    <text x="94" y="362.5" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">2 데이터링크</text>
    <text x="180" y="362.5" font-size="13" fill="#1f2933">인접 노드 간 전달, 오류검출</text>
    <text x="440" y="362.5" font-size="13" fill="#1f2933" text-anchor="middle">MAC</text>
    <text x="540" y="362.5" font-size="13" fill="#1f2933" text-anchor="middle">프레임</text>
    <text x="710" y="362.5" font-size="13" fill="#1f2933" text-anchor="middle">스위치, 브리지</text>
    <line x1="24" y1="384" x2="856" y2="384" stroke="#cbd2d9" stroke-width="1"/>
  </g>

  <!-- 1계층 : 물리 (회색/하드웨어 계열: 비트 전송) -->
  <g>
    <rect x="24" y="390" width="140" height="34" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>
    <text x="94" y="411.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1 물리</text>
    <text x="180" y="411.5" font-size="13" fill="#1f2933">비트를 신호로 바꿔 전송</text>
    <text x="440" y="411.5" font-size="13" fill="#52606d" text-anchor="middle">-</text>
    <text x="540" y="411.5" font-size="13" fill="#1f2933" text-anchor="middle">비트</text>
    <text x="710" y="411.5" font-size="13" fill="#1f2933" text-anchor="middle">케이블, 허브, 리피터</text>
  </g>
</svg>