<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Health Check 방식</title>
  <desc id="d">로드 밸런서는 Active(주기적으로 GET /health 요청 전송)와 Passive(실제 요청 실패 감지) 두 방식으로 서버 상태를 확인하고, 장애 서버를 자동으로 제외해 고가용성을 확보한다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <text x="440" y="48" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">로드 밸런서가 서버 상태를 주기적으로 확인</text>

  <!-- Active -->
  <rect x="24" y="72" width="404" height="176" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="44" y="90" width="88" height="32" rx="16" fill="#1d4ed8"/>
  <text x="88" y="112" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Active</text>
  <text x="146" y="112" font-size="17" font-weight="bold" fill="#111827">주기적 요청 전송</text>

  <rect x="48" y="152" width="124" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="110" y="190" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">로드 밸런서</text>
  <line x1="176" y1="190" x2="294" y2="190" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="236" y="178" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /health</text>
  <rect x="300" y="152" width="108" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="354" y="190" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>

  <!-- Passive -->
  <rect x="452" y="72" width="404" height="176" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <rect x="472" y="90" width="96" height="32" rx="16" fill="#b45309"/>
  <text x="520" y="112" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Passive</text>
  <text x="582" y="112" font-size="17" font-weight="bold" fill="#111827">실제 요청 실패 감지</text>

  <rect x="476" y="152" width="124" height="64" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="538" y="190" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">로드 밸런서</text>
  <line x1="604" y1="190" x2="722" y2="190" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-red)"/>
  <text x="664" y="178" font-size="15" fill="#b91c1c" text-anchor="middle">실제 요청</text>
  <rect x="728" y="152" width="108" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="782" y="180" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>
  <text x="782" y="204" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">✕ 실패</text>

  <!-- 합류 → 결과 -->
  <line x1="226" y1="248" x2="226" y2="272" stroke="#047857" stroke-width="2"/>
  <line x1="654" y1="248" x2="654" y2="272" stroke="#047857" stroke-width="2"/>
  <line x1="226" y1="272" x2="654" y2="272" stroke="#047857" stroke-width="2"/>
  <line x1="440" y1="272" x2="440" y2="298" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <rect x="290" y="304" width="300" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="336" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">장애 서버 자동 제외</text>
  <line x1="440" y1="356" x2="440" y2="384" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="310" y="390" width="260" height="52" rx="8" fill="#047857"/>
  <text x="440" y="422" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">고가용성 확보</text>
</svg>
