<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">호출 한 번의 전체 경로</title>
  <desc id="d">Controller가 부른 orderService.order(...)는 실제로 프록시의 메서드다. 프록시 안에서 @Around 앞부분이 실행되고 proceed()로 원본 OrderService의 order()가 돌며, 반환 또는 예외 뒤 @Around 뒷부분이 실행된 다음 결과가 Controller로 돌아간다.</desc>
  <rect width="880" height="650" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 호출하는 Controller -->
  <rect x="340" y="24" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="54" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Controller</text>

  <text x="456" y="98" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">orderService.order(...)</text>
  <text x="456" y="121" font-size="14" fill="#6d28d9">← 실제로는 프록시의 메서드</text>

  <!-- 프록시 -->
  <rect x="120" y="140" width="640" height="370" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="144" y="172" font-size="17" font-weight="bold" fill="#5b21b6" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService$$Proxy</text>

  <line x1="440" y1="72" x2="440" y2="184" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>

  <!-- 1. @Around 앞부분 -->
  <rect x="230" y="190" width="420" height="60" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="440" y="215" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">1. @Around 앞부분</text>
  <text x="440" y="238" font-size="14" fill="#374151" text-anchor="middle">측정 시작, 트랜잭션 begin</text>

  <line x1="440" y1="250" x2="440" y2="292" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="454" y="276" font-size="15" font-weight="bold" fill="#5b21b6" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">proceed()</text>

  <!-- 원본 -->
  <rect x="280" y="298" width="320" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="327" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">OrderService</tspan> (원본)</text>
  <text x="440" y="353" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">order()</tspan> 실제 로직</text>

  <line x1="440" y1="370" x2="440" y2="412" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="454" y="396" font-size="15" fill="#1d4ed8">반환 또는 예외</text>

  <!-- 2. @Around 뒷부분 -->
  <rect x="230" y="418" width="420" height="60" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="440" y="443" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">2. @Around 뒷부분</text>
  <text x="440" y="466" font-size="14" fill="#374151" text-anchor="middle">commit/rollback, 시간 로그</text>

  <!-- 결과 반환 -->
  <line x1="440" y1="478" x2="440" y2="572" stroke="#374151" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="456" y="546" font-size="15" fill="#111827">결과 반환</text>

  <rect x="340" y="578" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="608" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Controller</text>
</svg>
