<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">일관성 모델 스펙트럼</title>
  <desc id="d">왼쪽 강함(느림, 조율 비용 큼)에서 오른쪽 약함(빠름, 조율 없음) 순으로 선형성, 순차 일관성, 인과 일관성, 세션 보장, 최종 일관성을 나란히 놓고 각 모델이 보장하는 내용을 적은 그림.</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 축 -->
  <text x="24" y="44" font-size="19" font-weight="bold" fill="#111827">강함</text>
  <text x="856" y="44" text-anchor="end" font-size="19" font-weight="bold" fill="#111827">약함</text>
  <line x1="82" y1="37" x2="798" y2="37" stroke="#374151" stroke-width="2" marker-start="url(#ah-ink)" marker-end="url(#ah-ink)"/>
  <text x="24" y="72" font-size="15" fill="#4b5563">(느림, 조율 비용 큼)</text>
  <text x="856" y="72" text-anchor="end" font-size="15" fill="#4b5563">(빠름, 조율 없음)</text>

  <!-- 1. 선형성 -->
  <rect x="24" y="96" width="160" height="170" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M25,105 A8,8 0 0 1 33,97 H175 A8,8 0 0 1 183,105 V166 H25 Z" fill="#93c5fd"/>
  <text x="104" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">선형성</text>
  <text x="104" y="153" text-anchor="middle" font-size="15" fill="#1e3a8a">Linearizable</text>
  <text x="104" y="196" text-anchor="middle" font-size="15" fill="#1f2937">
    <tspan x="104">전역 실시간</tspan>
    <tspan x="104" dy="22">순서까지 일치</tspan>
  </text>

  <!-- 2. 순차 일관성 -->
  <rect x="192" y="96" width="160" height="170" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M193,105 A8,8 0 0 1 201,97 H343 A8,8 0 0 1 351,105 V166 H193 Z" fill="#b1d5fd"/>
  <text x="272" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">순차 일관성</text>
  <text x="272" y="153" text-anchor="middle" font-size="15" fill="#1e3a8a">Sequential</text>
  <text x="272" y="196" text-anchor="middle" font-size="15" fill="#1f2937">
    <tspan x="272">모든 노드가</tspan>
    <tspan x="272" dy="22">같은 순서로 본다</tspan>
    <tspan x="272" dy="22" fill="#4b5563">(실시간 순서는 무관)</tspan>
  </text>

  <!-- 3. 인과 일관성 -->
  <rect x="360" y="96" width="160" height="170" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M361,105 A8,8 0 0 1 369,97 H511 A8,8 0 0 1 519,105 V166 H361 Z" fill="#cfe4fe"/>
  <text x="440" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">인과 일관성</text>
  <text x="440" y="153" text-anchor="middle" font-size="15" fill="#1e3a8a">Causal</text>
  <text x="440" y="196" text-anchor="middle" font-size="15" fill="#1f2937">
    <tspan x="440">원인과 결과의</tspan>
    <tspan x="440" dy="22">순서만 보장</tspan>
  </text>

  <!-- 4. 세션 보장 -->
  <rect x="528" y="96" width="160" height="170" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M529,105 A8,8 0 0 1 537,97 H679 A8,8 0 0 1 687,105 V166 H529 Z" fill="#e3effe"/>
  <text x="608" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">세션 보장</text>
  <text x="608" y="153" text-anchor="middle" font-size="15" fill="#1e3a8a">Session</text>
  <text x="608" y="196" text-anchor="middle" font-size="15" fill="#1f2937">
    <tspan x="608">"내가 쓴 건</tspan>
    <tspan x="608" dy="22">내가 본다"</tspan>
  </text>

  <!-- 5. 최종 일관성 -->
  <rect x="696" y="96" width="160" height="170" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M697,105 A8,8 0 0 1 705,97 H847 A8,8 0 0 1 855,105 V166 H697 Z" fill="#f1f7ff"/>
  <text x="776" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">최종 일관성</text>
  <text x="776" y="153" text-anchor="middle" font-size="15" fill="#1e3a8a">Eventual</text>
  <text x="776" y="196" text-anchor="middle" font-size="15" fill="#1f2937">
    <tspan x="776">언젠가는</tspan>
    <tspan x="776" dy="22">같아진다</tspan>
  </text>
</svg>
