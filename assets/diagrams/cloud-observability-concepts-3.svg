<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">에러 버짓 — SLO가 숫자에서 정책으로 바뀌는 지점</title>
  <desc id="d">SLO 99.9%, 30일 기준 에러 버짓 계산 및 사용량/잔여량 진행바 다이어그램</desc>
  
  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>
  
  <!-- 상단 제목 라벨 -->
  <text x="440" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SLO 99.9%, 30일 기준</text>
  
  <!-- 수식 계산 구역 배경 -->
  <rect x="100" y="55" width="680" height="90" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <!-- 수식 계산 항목 1: 요청 기준 -->
  <text x="130" y="90" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">요청 기준</text>
  <text x="240" y="90" font-size="13" fill="#1f2933" text-anchor="start">그 30일간의 전체 요청 × 0.1%</text>
  <text x="490" y="90" font-size="13" fill="#52606d" text-anchor="start">=</text>
  <text x="515" y="90" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">허용되는 실패 요청 수</text>
  
  <!-- 수식 계산 항목 2: 시간 환산 -->
  <text x="130" y="122" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">시간 환산</text>
  <text x="240" y="122" font-size="13" fill="#1f2933" text-anchor="start">30일(43,200분) × 0.1%</text>
  <text x="490" y="122" font-size="13" fill="#52606d" text-anchor="start">=</text>
  <text x="515" y="122" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">43.2분</text>
  
  <!-- 진행바 박스 테두리 -->
  <rect x="80" y="170" width="720" height="64" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <!-- 사용됨 부분 (28%) -->
  <rect x="82" y="172" width="198" height="60" rx="3" fill="#d97706"/>
  
  <!-- 잔여 부분 (72%) -->
  <rect x="280" y="172" width="518" height="60" rx="3" fill="#eff6ff"/>
  
  <!-- 사용됨 12분 라벨 -->
  <text x="181" y="207" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">사용됨 12분</text>
  
  <!-- 잔여 31분 라벨 -->
  <text x="539" y="207" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">잔여 31분</text>
  
  <!-- 백분율 하단 표시 -->
  <text x="181" y="265" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">28%</text>
  <text x="539" y="265" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">72%</text>

  <!-- 지시선 (백분율 연관성 표시) -->
  <line x1="181" y1="236" x2="181" y2="248" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="539" y1="236" x2="539" y2="248" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>