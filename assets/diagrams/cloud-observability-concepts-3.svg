<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">에러 버짓 계산과 소진</title>
  <desc id="d">SLO 99.9%, 30일 기준 에러 버짓은 전체 요청의 0.1%이고 시간으로 환산하면 43.2분입니다. 그중 12분(28%)을 사용했고 31분(72%)이 남은 상태를 막대로 보여줍니다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>

  <text x="24" y="46" font-size="20" font-weight="bold" fill="#111827">SLO 99.9%, 30일 기준</text>

  <!-- 계산 표 -->
  <rect x="24" y="68" width="140" height="104" fill="#f3f4f6"/>
  <line x1="24" y1="120" x2="856" y2="120" stroke="#d1d5db" stroke-width="1"/>
  <line x1="164" y1="68" x2="164" y2="172" stroke="#d1d5db" stroke-width="1"/>
  <rect x="24" y="68" width="832" height="104" rx="4" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <text x="44" y="100" font-size="16" font-weight="bold" fill="#1f2937">요청 기준</text>
  <text x="188" y="100" font-size="17" fill="#1f2937">그 30일간의 전체 요청 × <tspan font-weight="bold" fill="#b91c1c">0.1%</tspan></text>
  <text x="512" y="100" font-size="17" fill="#4b5563">=</text>
  <text x="540" y="100" font-size="17" font-weight="bold" fill="#111827">허용되는 실패 요청 수</text>

  <text x="44" y="152" font-size="16" font-weight="bold" fill="#1f2937">시간 환산</text>
  <text x="188" y="152" font-size="17" fill="#1f2937">30일(43,200분) × <tspan font-weight="bold" fill="#b91c1c">0.1%</tspan></text>
  <text x="512" y="152" font-size="17" fill="#4b5563">=</text>
  <text x="540" y="152" font-size="17" font-weight="bold" fill="#111827">43.2분</text>

  <!-- 버짓 막대 -->
  <text x="64" y="214" font-size="16" font-weight="bold" fill="#1f2937">에러 버짓 43.2분</text>
  <rect x="64" y="228" width="211" height="56" fill="#b45309"/>
  <rect x="275" y="228" width="541" height="56" fill="#ecfdf5"/>
  <rect x="64" y="228" width="752" height="56" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="169" y="263" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">사용됨 12분</text>
  <text x="545" y="263" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">잔여 31분</text>

  <!-- 비율 치수선 -->
  <line x1="66" y1="302" x2="272" y2="302" stroke="#b45309" stroke-width="1.5"/>
  <line x1="66" y1="296" x2="66" y2="308" stroke="#b45309" stroke-width="1.5"/>
  <line x1="272" y1="296" x2="272" y2="308" stroke="#b45309" stroke-width="1.5"/>
  <line x1="278" y1="302" x2="814" y2="302" stroke="#047857" stroke-width="1.5"/>
  <line x1="278" y1="296" x2="278" y2="308" stroke="#047857" stroke-width="1.5"/>
  <line x1="814" y1="296" x2="814" y2="308" stroke="#047857" stroke-width="1.5"/>
  <text x="169" y="332" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">28%</text>
  <text x="545" y="332" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">72%</text>
</svg>
