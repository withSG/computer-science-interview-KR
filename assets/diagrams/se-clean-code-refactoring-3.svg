<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기능 추가와 리팩터링 PR 분리</title>
  <desc id="d">왼쪽은 결제 수단 추가와 결제 모듈 전면 리팩터링을 한 PR(변경 1,400줄)에 섞은 안티패턴과 그 결과, 오른쪽은 PR #1 결제 모듈 리팩터링(동작 변화 0)과 PR #2 결제 수단 추가로 분리한 개선안이다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 왼쪽: 안티패턴 -->
  <rect x="24" y="24" width="404" height="400" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="44" y="44" width="84" height="30" rx="6" fill="#b91c1c"/>
  <text x="86" y="65" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">안티패턴</text>
  <text x="140" y="66" font-size="17" font-weight="bold" fill="#111827">하나의 PR에 섞여 있다</text>

  <rect x="44" y="92" width="364" height="156" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="60" y="118" font-size="15" font-weight="bold" fill="#374151">PR 하나</text>
  <text x="392" y="118" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">변경 1,400줄</text>
  <rect x="60" y="130" width="332" height="38" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="226" y="155" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">결제 수단 추가</text>
  <text x="226" y="187" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">+</text>
  <rect x="60" y="194" width="332" height="38" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="226" y="219" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">결제 모듈 전면 리팩터링</text>

  <g font-size="15" fill="#111827">
    <text x="46" y="286" font-weight="bold" fill="#b91c1c">→</text>
    <text x="70" y="286">
      <tspan x="70">리뷰어는 어느 줄이 동작을 바꾸는 줄인지</tspan>
      <tspan x="70" dy="22">구분할 수 없다</tspan>
    </text>
    <text x="46" y="342" font-weight="bold" fill="#b91c1c">→</text>
    <text x="70" y="342">
      <tspan x="70">장애가 나도 원인이 새 기능인지</tspan>
      <tspan x="70" dy="22">리팩터링인지 모른다</tspan>
    </text>
    <text x="46" y="398" font-weight="bold" fill="#b91c1c">→</text>
    <text x="70" y="398">되돌리려면 새 기능까지 같이 사라진다</text>
  </g>

  <!-- 오른쪽: 개선 -->
  <rect x="452" y="24" width="404" height="400" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <rect x="472" y="44" width="54" height="30" rx="6" fill="#047857"/>
  <text x="499" y="65" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">개선</text>
  <text x="538" y="66" font-size="17" font-weight="bold" fill="#111827">커밋과 PR을 분리한다</text>

  <rect x="472" y="92" width="364" height="116" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <rect x="488" y="106" width="64" height="28" rx="5" fill="#6d28d9"/>
  <text x="520" y="126" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">PR #1</text>
  <text x="564" y="127" font-size="17" font-weight="bold" fill="#111827">결제 모듈 리팩터링</text>
  <text x="488" y="168" font-size="15" font-weight="bold" fill="#6d28d9">동작 변화 0</text>
  <text x="488" y="192" font-size="15" fill="#4b5563">기존 테스트가 그대로 통과</text>

  <path d="M654,210 L654,262" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <rect x="472" y="264" width="364" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="488" y="278" width="64" height="28" rx="5" fill="#1d4ed8"/>
  <text x="520" y="298" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">PR #2</text>
  <text x="564" y="299" font-size="17" font-weight="bold" fill="#111827">결제 수단 추가</text>
  <text x="488" y="338" font-size="15" fill="#4b5563">깨끗해진 구조 위에서 작은 변경</text>

  <!-- 범례 -->
  <rect x="264" y="446" width="18" height="18" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="290" y="460" font-size="15" fill="#111827">기능 추가 모자</text>
  <rect x="440" y="446" width="18" height="18" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="466" y="460" font-size="15" fill="#111827">리팩터링 모자</text>
</svg>
