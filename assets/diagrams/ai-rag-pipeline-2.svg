<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">쿼리 재작성: 질문이 검색에 부적합한 문제</title>
  <desc id="d">안티패턴: 사용자 입력을 그대로 임베딩해서 검색하는 문제점과 대화 이력 및 검색 쿼리 예시</desc>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 전체 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 콘테이너 (안티패턴 영역) -->
  <rect x="24" y="24" width="832" height="292" rx="8" ry="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 상단 제목 바 / 안티패턴 영역 -->
  <rect x="24" y="24" width="832" height="44" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <!-- 하단 둥근 모서리 가리기용 덮개 -->
  <rect x="25" y="50" width="830" height="17" fill="#fef2f2"/>
  <line x1="24" y1="68" x2="856" y2="68" stroke="#dc2626" stroke-width="1.5"/>

  <text x="44" y="51.6" font-size="16" font-weight="bold" fill="#dc2626">안티패턴: 사용자 입력을 그대로 임베딩해서 검색</text>

  <!-- 내부 세부 항목 카드들 -->
  <!-- 1. 대화 이력 카드 -->
  <rect x="48" y="88" width="784" height="52" rx="6" ry="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="64" y="119.6" font-size="14" font-weight="bold" fill="#1f2933">대화 이력:</text>
  <text x="144" y="119.6" font-size="14" fill="#1f2933">"환불 정책 알려줘"</text>
  <path d="M295,114 L315,114" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="327" y="119.6" font-size="13" fill="#52606d">(답변)</text>
  <path d="M375,114 L395,114" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="407" y="119.6" font-size="14" fill="#1f2933">"그럼 그건 며칠이야?"</text>

  <!-- 연결 화살표 (대화 이력 -> 검색 쿼리) -->
  <path d="M440,140 L440,158" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 2. 검색 쿼리 카드 -->
  <rect x="48" y="160" width="784" height="48" rx="6" ry="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="64" y="189.6" font-size="14" font-weight="bold" fill="#1f2933">검색 쿼리:</text>
  <text x="144" y="189.6" font-size="14" font-weight="bold" fill="#dc2626">"그럼 그건 며칠이야?"</text>

  <!-- 3. 문제점 경고 카드 -->
  <rect x="48" y="228" width="784" height="64" rx="6" ry="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="68" y="266.6" font-size="16" font-weight="bold" fill="#dc2626">→</text>
  <text x="92" y="266.6" font-size="14" font-weight="bold" fill="#dc2626">"그건"이 뭔지 없는 문장이라 검색이 완전히 빗나간다</text>

</svg>