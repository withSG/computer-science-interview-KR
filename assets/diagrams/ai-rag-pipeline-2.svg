<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대화 맥락 없는 검색 쿼리</title>
  <desc id="d">안티패턴: "환불 정책 알려줘", (답변), "그럼 그건 며칠이야?"로 이어진 대화에서 마지막 입력만 그대로 검색 쿼리가 되어, "그건"이 뭔지 없는 문장이라 검색이 완전히 빗나간다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <rect x="24" y="24" width="92" height="32" rx="16" fill="#b91c1c"/>
  <text x="70" y="46" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">안티패턴</text>
  <text x="132" y="47" font-size="19" font-weight="bold" fill="#111827">사용자 입력을 그대로 임베딩해서 검색</text>

  <!-- 1행: 대화 이력 -->
  <text x="24" y="120" font-size="16" font-weight="bold" fill="#374151">대화 이력</text>

  <rect x="124" y="92" width="196" height="44" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="222" y="120" font-size="17" fill="#111827" text-anchor="middle">환불 정책 알려줘</text>

  <path d="M328,114 H380" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>

  <rect x="390" y="92" width="112" height="44" rx="22" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="446" y="120" font-size="17" fill="#4b5563" text-anchor="middle">(답변)</text>

  <path d="M510,114 H562" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>

  <rect x="572" y="92" width="240" height="44" rx="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="692" y="120" font-size="17" fill="#111827" text-anchor="middle">그럼 그건 며칠이야?</text>

  <!-- 앞선 대화는 검색으로 가지 않음 -->
  <path d="M222,138 V154" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <path d="M216,160 L228,172 M228,160 L216,172" stroke="#b91c1c" stroke-width="2.5" fill="none"/>
  <path d="M446,138 V154" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <path d="M440,160 L452,172 M452,160 L440,172" stroke="#b91c1c" stroke-width="2.5" fill="none"/>
  <text x="334" y="206" font-size="15" fill="#4b5563" text-anchor="middle">앞선 대화는 검색에 전달되지 않음</text>

  <!-- 마지막 입력만 그대로 검색 쿼리로 -->
  <path d="M692,138 V178" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <text x="704" y="164" font-size="14" font-weight="bold" fill="#1d4ed8">그대로</text>

  <rect x="572" y="182" width="240" height="72" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="590" y="205" font-size="14" font-weight="bold" fill="#4b5563">검색 쿼리</text>
  <text x="590" y="237" font-size="18" fill="#111827">“그럼 <tspan font-weight="bold" fill="#b91c1c">그건</tspan> 며칠이야?”</text>

  <path d="M692,256 V282" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>

  <!-- 결과 -->
  <rect x="24" y="286" width="832" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="320" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">“그건”이 뭔지 없는 문장이라 검색이 완전히 빗나간다</text>
</svg>
