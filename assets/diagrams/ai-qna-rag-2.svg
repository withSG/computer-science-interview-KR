<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RAG 파이프라인</title>
  <desc id="d">Indexing, Retrieval, Generation 3단계로 구성된 RAG 파이프라인 흐름도</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- SECTION 1: Indexing (색인) -->
  <g id="section-indexing">
    <!-- Outer Group Container -->
    <rect x="40" y="30" width="800" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="58" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">Indexing (색인)</text>

    <!-- Node 1: Documents -->
    <rect x="65" y="80" width="115" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="122.5" y="108.1" font-size="13" fill="#1f2933" text-anchor="middle">Documents</text>

    <!-- Arrow 1 -->
    <path d="M180,103 L220,103" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Node 2: Chunking -->
    <rect x="220" y="80" width="105" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="272.5" y="108.1" font-size="13" fill="#1f2933" text-anchor="middle">Chunking</text>

    <!-- Arrow 2 -->
    <path d="M325,103 L365,103" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Node 3: Embedding -->
    <rect x="365" y="80" width="115" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="422.5" y="108.1" font-size="13" fill="#1f2933" text-anchor="middle">Embedding</text>

    <!-- Arrow 3 -->
    <path d="M480,103 L520,103" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Node 4: Vector DB 저장 -->
    <rect x="520" y="80" width="145" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="592.5" y="108.1" font-size="13" fill="#1f2933" text-anchor="middle">Vector DB 저장</text>
  </g>

  <!-- SECTION 2: Retrieval (검색) -->
  <g id="section-retrieval">
    <!-- Outer Group Container -->
    <rect x="40" y="190" width="800" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="440" y="218" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">Retrieval (검색)</text>

    <!-- Node 1: Query -->
    <rect x="65" y="240" width="85" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="107.5" y="268.1" font-size="13" fill="#1f2933" text-anchor="middle">Query</text>

    <!-- Arrow 1 -->
    <path d="M150,263 L190,263" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <!-- Node 2: Embedding -->
    <rect x="190" y="240" width="115" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="247.5" y="268.1" font-size="13" fill="#1f2933" text-anchor="middle">Embedding</text>

    <!-- Arrow 2 -->
    <path d="M305,263 L345,263" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <!-- Node 3: Vector Search -->
    <rect x="345" y="240" width="140" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="415" y="268.1" font-size="13" fill="#1f2933" text-anchor="middle">Vector Search</text>

    <!-- Arrow 3 -->
    <path d="M485,263 L525,263" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <!-- Node 4: Top-K 문서 -->
    <rect x="525" y="240" width="125" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="587.5" y="268.1" font-size="13" fill="#1f2933" text-anchor="middle">Top-K 문서</text>
  </g>

  <!-- SECTION 3: Generation (생성) -->
  <g id="section-generation">
    <!-- Outer Group Container -->
    <rect x="40" y="350" width="800" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="440" y="378" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">Generation (생성)</text>

    <!-- Node 1: [Query + Retrieved Context] -->
    <rect x="65" y="400" width="265" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="197.5" y="428.1" font-size="13" fill="#1f2933" text-anchor="middle">[Query + Retrieved Context]</text>

    <!-- Arrow 1 -->
    <path d="M330,423 L370,423" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

    <!-- Node 2: LLM -->
    <rect x="370" y="400" width="75" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="407.5" y="428.1" font-size="13" fill="#1f2933" text-anchor="middle">LLM</text>

    <!-- Arrow 2 -->
    <path d="M445,423 L485,423" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

    <!-- Node 3: Answer -->
    <rect x="485" y="400" width="90" height="46" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="530" y="428.1" font-size="13" fill="#1f2933" text-anchor="middle">Answer</text>
  </g>
</svg>