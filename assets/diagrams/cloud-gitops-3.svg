<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 810" width="880" height="810" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GitOps Pull 방식 구조</title>
  <desc id="d">앱 코드 저장소 push, CI 파이프라인의 빌드·테스트·이미지 push, 매니페스트 저장소에 이미지 태그 갱신 커밋까지는 클러스터 밖에서 일어난다. 운영 클러스터 안의 GitOps 에이전트(ArgoCD)가 매니페스트 저장소를 pull해 비교하고 다르면 apply하며, 드리프트가 생기면 원하는 상태로 되돌린다. 화살표가 클러스터 안에서 밖으로만 나가므로 밖에서 들어오는 권한이 필요 없다.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="880" height="810" fill="#ffffff"/>

  <!-- 핵심 -->
  <rect x="24" y="24" width="832" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="54" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle"><tspan fill="#b45309">핵심:</tspan> 화살표가 클러스터 안에서 밖으로 나간다. 밖에서 안으로 들어오는 권한이 필요 없다.</text>

  <!-- 클러스터 밖 -->
  <text x="24" y="106" font-size="15" font-weight="bold" fill="#4b5563">클러스터 밖</text>

  <rect x="24" y="118" width="160" height="100" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="104" y="174" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">앱 코드 저장소</text>

  <line x1="186" y1="168" x2="240" y2="168" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="214" y="158" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">push</text>

  <rect x="244" y="118" width="210" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="349" y="150" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">CI 파이프라인</text>
  <text x="349" y="178" font-size="15" fill="#374151" text-anchor="middle">빌드 → 테스트</text>
  <text x="349" y="202" font-size="15" fill="#374151" text-anchor="middle">이미지 push</text>

  <line x1="456" y1="168" x2="636" y2="168" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="547" y="158" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">이미지 태그 갱신 커밋</text>

  <rect x="640" y="118" width="216" height="100" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="748" y="162" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">매니페스트 저장소</text>
  <text x="748" y="188" font-size="15" fill="#6d28d9" text-anchor="middle">(원하는 상태)</text>

  <!-- 운영 클러스터 -->
  <rect x="24" y="300" width="832" height="220" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="44" y="332" font-size="18" font-weight="bold" fill="#065f46">운영 클러스터</text>

  <rect x="572" y="346" width="264" height="150" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="704" y="376" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">GitOps 에이전트</text>
  <text x="704" y="400" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">(ArgoCD)</text>
  <line x1="588" y1="416" x2="820" y2="416" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="590" y="444" font-size="15" fill="#111827">① Git을 폴링/웹훅으로 감지</text>
  <text x="590" y="472" font-size="15" fill="#111827">② 원하는 상태와 실제 상태 비교</text>

  <rect x="44" y="392" width="300" height="66" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="194" y="431" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Deployment / Service / ...</text>

  <line x1="570" y1="425" x2="348" y2="425" stroke="#6d28d9" stroke-width="2" marker-end="url(#ap)"/>
  <text x="458" y="413" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">③ 다르면 apply</text>

  <!-- pull: 에이전트 → 매니페스트 저장소 (안 → 밖) -->
  <line x1="800" y1="344" x2="800" y2="222" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ap)"/>
  <text x="812" y="268" font-size="16" font-weight="bold" fill="#6d28d9">pull</text>

  <!-- 드리프트 발생 시 되돌림 (안 → 밖) -->
  <path d="M260,390 L260,262 L690,262 L690,222" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ao)"/>
  <text x="475" y="252" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">드리프트 발생 시 되돌림 (원하는 상태 쪽으로)</text>

  <!-- 이 구조로 얻는 것 -->
  <text x="24" y="562" font-size="17" font-weight="bold" fill="#111827">이 구조로 얻는 것</text>

  <rect x="24" y="578" width="408" height="98" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="606" font-size="16" font-weight="bold" fill="#1d4ed8">자격증명</text>
  <text x="40" y="632" font-size="15" fill="#374151">CI에는 클러스터 권한이 필요 없음</text>
  <text x="40" y="656" font-size="15" fill="#374151">이미지 레지스트리 push·매니페스트 커밋 권한만</text>

  <rect x="448" y="578" width="408" height="98" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="464" y="606" font-size="16" font-weight="bold" fill="#b45309">드리프트</text>
  <text x="464" y="632" font-size="15" fill="#374151">에이전트가 계속 비교해 차이가 즉시 드러남</text>
  <text x="464" y="656" font-size="15" fill="#374151">자가 치유를 켜두면 자동으로 되돌아감</text>

  <rect x="24" y="692" width="408" height="98" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="720" font-size="16" font-weight="bold" fill="#6d28d9">감사 추적 · 롤백</text>
  <text x="40" y="746" font-size="15" fill="#374151">누가 언제 무엇을 왜 바꿨나 → Git 커밋과 PR</text>
  <text x="40" y="770" font-size="15" fill="#374151">git revert 후 에이전트가 조정하면 이전 상태로</text>

  <rect x="448" y="692" width="408" height="98" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="464" y="720" font-size="16" font-weight="bold" fill="#047857">저장소 분리</text>
  <text x="464" y="746" font-size="15" fill="#374151">앱 코드 저장소와 매니페스트 저장소를 따로 둠</text>
  <text x="464" y="770" font-size="15" fill="#374151">앱 CI 낭비 방지 · 권한 분리 · 커밋 이력 = 배포 이력</text>
</svg>
