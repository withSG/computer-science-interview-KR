<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 790" width="880" height="790" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">병목 자원 판별 흐름</title>
  <desc id="d">Load Average가 높으면 top의 %wa와 %us·%sy로 I/O 계열과 CPU 계열을 가르고, iostat·vmstat 또는 %us·%sy 우세로 원인을 좁힌다. Load는 낮은데 응답만 느리면 외부 의존성 지연이나 락 대기·커넥션 풀 고갈이라 시스템 지표에 잡히지 않는다.</desc>
  <rect width="880" height="790" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- 루트 -->
  <rect x="330" y="24" width="220" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="52" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">Load Average 높음</text>

  <!-- 루트에서 두 갈래 -->
  <path d="M440,68 V88 M226,88 H654" stroke="#4b5563" stroke-width="2" fill="none"/>
  <line x1="226" y1="88" x2="226" y2="114" stroke="#b45309" stroke-width="2" marker-end="url(#amber)"/>
  <line x1="654" y1="88" x2="654" y2="114" stroke="#6d28d9" stroke-width="2" marker-end="url(#purple)"/>

  <!-- ===== I/O 계열 ===== -->
  <rect x="24" y="116" width="404" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="226" y="142" font-size="16" fill="#1f2937" text-anchor="middle">top의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">%wa</tspan> 가 높다</text>
  <text x="226" y="168" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">→ I/O 계열</text>

  <path d="M48,180 V402" stroke="#b45309" stroke-width="2" fill="none"/>
  <line x1="48" y1="222" x2="70" y2="222" stroke="#b45309" stroke-width="2" marker-end="url(#amber)"/>
  <line x1="48" y1="402" x2="70" y2="402" stroke="#b45309" stroke-width="2" marker-end="url(#amber)"/>

  <!-- 디스크 I/O 병목 -->
  <rect x="72" y="204" width="356" height="160" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M80,205 H420 A7,7 0 0 1 427,212 V240 H73 V212 A7,7 0 0 1 80,205 Z" fill="#fef3c7"/>
  <text x="88" y="228" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">iostat</tspan> 의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">await·%util</tspan> 도 높다</text>
  <text x="88" y="268" font-size="17" font-weight="bold" fill="#b45309">→ 디스크 I/O 병목</text>
  <text font-size="15" fill="#374151">
    <tspan x="104" y="296">· 슬로우 쿼리</tspan>
    <tspan x="104" y="320">· 로그 과다 쓰기</tspan>
    <tspan x="104" y="344">· 볼륨 IOPS·처리량 상한 도달</tspan>
  </text>

  <!-- 메모리 부족이 만든 I/O 폭증 -->
  <rect x="72" y="384" width="356" height="160" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <path d="M80,385 H420 A7,7 0 0 1 427,392 V420 H73 V392 A7,7 0 0 1 80,385 Z" fill="#fef3c7"/>
  <text x="88" y="408" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">vmstat</tspan> 의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">si·so</tspan> 가 계속 0이 아니다</text>
  <text x="88" y="448" font-size="17" font-weight="bold" fill="#b45309">→ 메모리 부족이 만든 I/O 폭증</text>
  <text font-size="15" fill="#374151">
    <tspan x="104" y="476">· 누수</tspan>
    <tspan x="104" y="500">· 힙 과다 설정</tspan>
    <tspan x="104" y="524">· 캐시 부족</tspan>
  </text>

  <!-- ===== CPU 계열 ===== -->
  <rect x="452" y="116" width="404" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="654" y="142" font-size="16" fill="#1f2937" text-anchor="middle">top의 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">%us·%sy</tspan> 가 높다</text>
  <text x="654" y="168" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">→ CPU 계열</text>

  <path d="M476,180 V402" stroke="#6d28d9" stroke-width="2" fill="none"/>
  <line x1="476" y1="222" x2="498" y2="222" stroke="#6d28d9" stroke-width="2" marker-end="url(#purple)"/>
  <line x1="476" y1="402" x2="498" y2="402" stroke="#6d28d9" stroke-width="2" marker-end="url(#purple)"/>

  <!-- 애플리케이션 코드 -->
  <rect x="500" y="204" width="356" height="160" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M508,205 H848 A7,7 0 0 1 855,212 V240 H501 V212 A7,7 0 0 1 508,205 Z" fill="#ede9fe"/>
  <text x="516" y="228" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">%us</tspan> 우세</text>
  <text x="516" y="268" font-size="17" font-weight="bold" fill="#6d28d9">→ 애플리케이션 코드</text>
  <text font-size="15" fill="#374151">
    <tspan x="532" y="296">· GC 폭주</tspan>
    <tspan x="532" y="320">· 무한 루프</tspan>
    <tspan x="532" y="344">· 비효율 알고리즘</tspan>
  </text>

  <!-- 커널 경로 -->
  <rect x="500" y="384" width="356" height="160" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M508,385 H848 A7,7 0 0 1 855,392 V420 H501 V392 A7,7 0 0 1 508,385 Z" fill="#ede9fe"/>
  <text x="516" y="408" font-size="15" fill="#1f2937"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">%sy</tspan> 우세</text>
  <text x="516" y="448" font-size="17" font-weight="bold" fill="#6d28d9">→ 커널 경로</text>
  <text font-size="15" fill="#374151">
    <tspan x="532" y="476">· 컨텍스트 스위칭 폭주</tspan>
    <tspan x="532" y="500">· 인터럽트 폭주</tspan>
    <tspan x="532" y="524">· 시스템 콜 과다</tspan>
  </text>

  <!-- 구분선 -->
  <line x1="24" y1="574" x2="856" y2="574" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== Load 낮은데 느린 경우 ===== -->
  <rect x="24" y="594" width="150" height="28" rx="14" fill="#0f766e"/>
  <text x="99" y="613" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">놓치기 쉬운 갈래</text>

  <rect x="24" y="672" width="280" height="46" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="164" y="701" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Load 는 낮은데 응답만 느리다</text>

  <line x1="308" y1="695" x2="332" y2="695" stroke="#0f766e" stroke-width="2" marker-end="url(#teal)"/>

  <rect x="336" y="634" width="520" height="124" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text font-size="17" font-weight="bold" fill="#0f766e">
    <tspan x="356" y="664">외부 의존성 지연(DB·외부 API·DNS)</tspan>
    <tspan x="356" y="690">또는 락 대기·커넥션 풀 고갈</tspan>
  </text>
  <text font-size="15" fill="#1f2937">
    <tspan x="356" y="720">스레드가 대기만 하므로 CPU도 I/O도 쓰지 않아</tspan>
    <tspan x="356" y="742">어떤 시스템 지표에도 안 잡힌다</tspan>
  </text>
</svg>
