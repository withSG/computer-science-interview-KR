<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 395" width="880" height="395" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">소프트웨어 호환성</title>
  <desc id="d">x86에서 ARM으로 이식 시 고려 사항과 Apple Rosetta 2를 통한 해결 방안 다이어그램</desc>
  <rect width="880" height="395" fill="#ffffff"/>

  <!-- Main Container -->
  <rect x="24" y="24" width="832" height="347" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Title / Header Zone -->
  <text x="48" y="60" font-size="16" font-weight="bold" fill="#1f2933">소프트웨어 호환성</text>

  <!-- Section 1: x86 -> ARM Transposition Box -->
  <rect x="48" y="80" width="784" height="155" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- Sub-header Label -->
  <text x="72" y="112" font-size="14" font-weight="bold" fill="#2563eb">x86 → ARM 이식 시 고려 사항:</text>

  <!-- Bullet Items -->
  <!-- Bullet 1 -->
  <circle cx="80" cy="141" r="3" fill="#52606d"/>
  <text x="94" y="145" font-size="13" font-weight="bold" fill="#1f2933">엔디언(Byte Order):</text>
  <text x="238" y="145" font-size="13" fill="#52606d">ARM은 bi-endian (기본 little-endian)</text>

  <!-- Bullet 2 -->
  <circle cx="80" cy="171" r="3" fill="#52606d"/>
  <text x="94" y="175" font-size="13" font-weight="bold" fill="#1f2933">정렬(Alignment):</text>
  <text x="216" y="175" font-size="13" fill="#52606d">ARM은 정렬 위반 시 오류 가능</text>

  <!-- Bullet 3 -->
  <circle cx="80" cy="201" r="3" fill="#52606d"/>
  <text x="94" y="205" font-size="13" fill="#1f2933">컴파일러 재빌드 필요</text>

  <!-- Section 2: Solution Box -->
  <rect x="48" y="255" width="784" height="92" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>

  <!-- Solution Header -->
  <text x="72" y="287" font-size="14" font-weight="bold" fill="#059669">해결:</text>

  <!-- Solution Bullet -->
  <circle cx="80" cy="316" r="3" fill="#059669"/>
  <text x="94" y="320" font-size="13" font-weight="bold" fill="#1f2933">Apple Rosetta 2:</text>
  <text x="212" y="320" font-size="13" fill="#1f2933">x86 바이너리를 ARM에서 사전 번역(JIT 코드는 실행 중 번역)</text>
</svg>