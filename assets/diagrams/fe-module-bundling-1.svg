<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">의존성 그래프 만들기</title>
  <desc id="d">번들러가 진입점부터 시작하여 각 모듈의 import 구문을 재귀적으로 분석해 의존성 그래프를 구축하는 과정을 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="720" fill="#ffffff"/>

  <defs>
    <!-- Arrowhead markers for different colors -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Bracket Header -->
  <g>
    <text x="440" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[1단계: 의존성 그래프 구축]</text>
  </g>

  <!-- Entry Line Details -->
  <g>
    <text x="440" y="85" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">entry: src/index.js</text>
    
    <!-- Flow Down Line with Label -->
    <path d="M440,98 L440,163" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <rect x="230" y="117" width="420" height="24" rx="4" fill="#ffffff"/>
    <text x="440" y="133" font-size="12" fill="#52606d" text-anchor="middle">파일을 읽어 AST로 파싱 → import 구문을 전부 찾는다</text>
  </g>

  <!-- Root Node: index.js -->
  <g>
    <rect x="365" y="170" width="150" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="198" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">index.js</text>
  </g>

  <!-- Connectors from index.js to children -->
  <!-- Main stem down -->
  <path d="M440,216 L440,240" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- Horizontal bus -->
  <path d="M190,240 L690,240" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <!-- Branch down to App.jsx -->
  <path d="M190,240 L190,263" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Branch down to styles.css -->
  <path d="M440,240 L440,263" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Branch down to analytics.js -->
  <path d="M690,240 L690,263" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- First Level Children -->
  <!-- App.jsx -->
  <g>
    <rect x="120" y="270" width="140" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="190" y="298" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">App.jsx</text>
  </g>

  <!-- styles.css -->
  <g>
    <rect x="370" y="270" width="140" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="440" y="298" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">styles.css</text>
  </g>

  <!-- analytics.js -->
  <g>
    <rect x="615" y="270" width="150" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="690" y="298" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">analytics.js</text>
  </g>

  <!-- Connection from App.jsx to Cart.jsx -->
  <path d="M190,316 L190,363" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Cart.jsx -->
  <g>
    <rect x="120" y="370" width="140" height="46" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="190" y="398" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Cart.jsx</text>
  </g>

  <!-- Connections to utils.js (Shared Node) -->
  <!-- From Cart.jsx -->
  <path d="M190,416 L190,483 L361,483" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <!-- From analytics.js -->
  <path d="M690,316 L690,483 L519,483" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Shared Node: utils.js -->
  <g>
    <rect x="370" y="460" width="140" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="440" y="488" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">utils.js</text>
  </g>

  <!-- Annotation under utils.js -->
  <g>
    <text x="440" y="530" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle">두 곳에서 참조되지만 노드는 하나다</text>
  </g>

  <!-- Bottom Explanatory Notes Container -->
  <g>
    <rect x="80" y="570" width="720" height="100" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="440" y="608" font-size="13" fill="#1f2933" text-anchor="middle">각 노드를 방문할 때마다 다시 import를 찾아 재귀적으로 확장한다.</text>
    <text x="440" y="638" font-size="13" fill="#1f2933" text-anchor="middle">이미 방문한 파일은 재방문하지 않으므로 순환 참조가 있어도 멈춘다.</text>
  </g>
</svg>