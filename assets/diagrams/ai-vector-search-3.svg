<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">메타데이터 필터링의 함정</title>
  <desc id="d">Post-filtering은 전체 100만 개에서 ANN으로 10개를 뽑은 뒤 필터를 걸어 9개가 탈락하고 1개만 남아 결과가 거의 빈다. Pre-filtering은 필터로 5,000개를 먼저 추린 뒤 검색하지만, 100만 개 기준으로 만든 ANN 인덱스는 부분집합 안에서 길이 끊겨 엉뚱한 곳에 갇히거나 5,000개를 다 비교하게 된다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ===== Post-filtering ===== -->
  <text x="24" y="50" font-size="20" font-weight="700" fill="#111827">Post-filtering <tspan font-size="16" font-weight="400" fill="#4b5563">(검색 먼저, 필터 나중)</tspan></text>

  <path d="M196,108 L351,108" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M527,108 L682,108" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="24" y="70" width="170" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="109" y="114" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">전체 100만</text>

  <rect x="219" y="94" width="110" height="28" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="274" y="113" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">ANN Top-10</text>

  <rect x="355" y="70" width="170" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="100" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">10개</text>
  <g fill="#374151">
    <circle cx="381.5" cy="124" r="4.5"/><circle cx="394.5" cy="124" r="4.5"/><circle cx="407.5" cy="124" r="4.5"/><circle cx="420.5" cy="124" r="4.5"/><circle cx="433.5" cy="124" r="4.5"/>
    <circle cx="446.5" cy="124" r="4.5"/><circle cx="459.5" cy="124" r="4.5"/><circle cx="472.5" cy="124" r="4.5"/><circle cx="485.5" cy="124" r="4.5"/><circle cx="498.5" cy="124" r="4.5"/>
  </g>

  <rect x="573" y="94" width="66" height="28" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="606" y="113" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">필터</text>

  <rect x="686" y="70" width="170" height="76" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="771" y="100" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle">1개</text>
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <circle cx="712.5" cy="124" r="4"/><circle cx="725.5" cy="124" r="4"/><circle cx="738.5" cy="124" r="4"/><circle cx="764.5" cy="124" r="4"/><circle cx="777.5" cy="124" r="4"/>
    <circle cx="790.5" cy="124" r="4"/><circle cx="803.5" cy="124" r="4"/><circle cx="816.5" cy="124" r="4"/><circle cx="829.5" cy="124" r="4"/>
  </g>
  <circle cx="751.5" cy="124" r="4.5" fill="#b91c1c"/>

  <path d="M771,170 L771,151" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <rect x="506" y="172" width="350" height="42" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="681" y="199" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">9개가 필터에서 탈락 → 결과가 거의 빈다</text>

  <path d="M24,242 L856,242" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ===== Pre-filtering ===== -->
  <text x="24" y="282" font-size="20" font-weight="700" fill="#111827">Pre-filtering <tspan font-size="16" font-weight="400" fill="#4b5563">(필터 먼저, 검색 나중)</tspan></text>

  <path d="M196,340 L351,340" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M527,340 L682,340" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="24" y="302" width="170" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="109" y="346" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">전체 100만</text>

  <rect x="241" y="326" width="66" height="28" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="274" y="345" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">필터</text>

  <rect x="355" y="302" width="170" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="346" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle">5,000개</text>

  <rect x="573" y="326" width="66" height="28" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="606" y="345" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">검색</text>

  <rect x="686" y="302" width="170" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="771" y="346" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">10개</text>

  <path d="M440,402 L440,383" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arr-amber)"/>
  <rect x="176" y="404" width="528" height="92" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <g font-size="16" fill="#1f2937">
    <text x="196" y="430" font-weight="700" fill="#92400e">ANN 인덱스는 100만 개 기준으로 만들어졌다.</text>
    <text x="196" y="456">5,000개 부분집합 안에서 그래프를 타면 길이 끊겨</text>
    <text x="196" y="482">엉뚱한 곳에 갇히거나, 결국 5,000개를 다 비교하게 된다</text>
  </g>
</svg>
