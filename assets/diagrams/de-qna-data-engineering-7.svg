<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">데이터 파이프라인 구성 요소</title>
  <desc id="d">데이터 파이프라인은 수집(Ingestion), 저장(Storage), 처리(Processing), 서빙(Serving) 네 단계로 흐르며, 각 단계 아래에 Kafka·S3·Spark·DW 같은 대표 예시를 둔다.</desc>
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 단계 머리 -->
  <rect x="24" y="24" width="172" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="110" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">1. 수집</text>
  <text x="110" y="81" font-size="15" fill="#1d4ed8" text-anchor="middle">Ingestion</text>

  <rect x="244" y="24" width="172" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="330" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">2. 저장</text>
  <text x="330" y="81" font-size="15" fill="#1d4ed8" text-anchor="middle">Storage</text>

  <rect x="464" y="24" width="172" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="550" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">3. 처리</text>
  <text x="550" y="81" font-size="15" fill="#1d4ed8" text-anchor="middle">Processing</text>

  <rect x="684" y="24" width="172" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="770" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">4. 서빙</text>
  <text x="770" y="81" font-size="15" fill="#1d4ed8" text-anchor="middle">Serving</text>

  <path d="M200,60 L239,60" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M420,60 L459,60" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M640,60 L679,60" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 예시 도구 -->
  <rect x="24" y="112" width="172" height="112" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="110" y="144" font-size="16" fill="#1f2937" text-anchor="middle">Kafka</text>
  <text x="110" y="172" font-size="16" fill="#1f2937" text-anchor="middle">API</text>
  <text x="110" y="200" font-size="16" fill="#1f2937" text-anchor="middle">CDC</text>

  <rect x="244" y="112" width="172" height="112" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="330" y="144" font-size="16" fill="#1f2937" text-anchor="middle">S3</text>
  <text x="330" y="172" font-size="16" fill="#1f2937" text-anchor="middle">HDFS</text>
  <text x="330" y="200" font-size="16" fill="#1f2937" text-anchor="middle">Data Lake</text>

  <rect x="464" y="112" width="172" height="112" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="550" y="144" font-size="16" fill="#1f2937" text-anchor="middle">Spark</text>
  <text x="550" y="172" font-size="16" fill="#1f2937" text-anchor="middle">dbt</text>

  <rect x="684" y="112" width="172" height="112" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="770" y="144" font-size="16" fill="#1f2937" text-anchor="middle">DW</text>
  <text x="770" y="172" font-size="16" fill="#1f2937" text-anchor="middle">DB</text>
  <text x="770" y="200" font-size="16" fill="#1f2937" text-anchor="middle">BI 도구</text>
</svg>
