<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HTTP/1.1 Head-of-Line Blocking</title>
  <desc id="d">HTTP/1.1에서는 요청1의 응답1이 돌아올 때까지 요청2를 보내지 못하고 기다린다. 앞 요청이 끝나야 다음 요청이 가능하다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 주체 -->
  <rect x="195" y="24" width="170" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="280" y="52" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">클라이언트</text>
  <rect x="555" y="24" width="170" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="640" y="52" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">서버</text>

  <!-- 생명선 -->
  <line x1="280" y1="68" x2="280" y2="385" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="640" y1="68" x2="640" y2="385" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 시간 축 -->
  <text x="800" y="116" font-size="15" fill="#4b5563" text-anchor="middle">시간</text>
  <line x1="800" y1="126" x2="800" y2="372" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ak)"/>

  <!-- 요청1 / 응답1 -->
  <line x1="280" y1="112" x2="638" y2="162" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="460" y="118" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">요청1</text>
  <line x1="640" y1="180" x2="282" y2="230" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="460" y="188" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">응답1</text>

  <!-- 대기 구간 -->
  <path d="M266,112 L256,112 L256,230 L266,230" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="244" y="164" font-size="15" fill="#b91c1c" text-anchor="end">응답1을 받을 때까지</text>
  <text x="244" y="188" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="end">요청2 대기</text>

  <!-- 요청2 / 응답2 -->
  <line x1="280" y1="250" x2="638" y2="300" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="460" y="256" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">요청2</text>
  <line x1="640" y1="318" x2="282" y2="368" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="460" y="326" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">응답2</text>

  <!-- 요점 -->
  <rect x="290" y="408" width="340" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="460" y="437" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">앞 요청이 끝나야 다음 요청 가능</text>
</svg>
