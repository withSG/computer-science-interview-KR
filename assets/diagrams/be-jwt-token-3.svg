<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="880" height="670" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Access Token 만료와 Refresh Token 재발급 흐름</title>
  <desc id="d">로그인하면 AT(15분)와 RT(14일, HttpOnly 쿠키)를 받고, API는 AT로 호출한다. 15분 뒤 AT가 exp 초과로 401을 받으면 RT 쿠키로 /token/refresh를 호출하고, Auth Server가 저장된 RT와 대조한 뒤 새 AT와 새 RT를 내준다(Rotation).</desc>
  <rect width="880" height="670" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="60" y="24" width="140" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="130" y="52" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">Client</text>
  <rect x="380" y="24" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="470" y="52" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">Auth Server</text>
  <rect x="670" y="24" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="760" y="52" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">Resource API</text>

  <!-- 생명선 -->
  <line x1="130" y1="68" x2="130" y2="606" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="470" y1="68" x2="470" y2="606" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="760" y1="68" x2="760" y2="606" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 1. 로그인 -->
  <circle cx="40" cy="106" r="12" fill="#334155"/>
  <text x="40" y="111" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <path d="M131,120 H468" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="300" y="110" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /login</text>

  <!-- 2. 토큰 발급 -->
  <circle cx="40" cy="166" r="12" fill="#334155"/>
  <text x="40" y="171" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <path d="M469,180 H132" stroke="#1f2937" stroke-width="1.6" stroke-dasharray="7 4" fill="none" marker-end="url(#ah)"/>
  <text x="300" y="170" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#1d4ed8">AT(15분)</tspan> + <tspan font-weight="bold" fill="#6d28d9">RT(14일, HttpOnly 쿠키)</tspan></text>

  <!-- 3. API 호출 -->
  <circle cx="40" cy="226" r="12" fill="#334155"/>
  <text x="40" y="231" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <path d="M131,240 H758" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="300" y="230" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /orders</text>
  <text x="300" y="264" font-size="14" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Authorization: Bearer <tspan font-weight="bold" fill="#1d4ed8">AT</tspan></text>

  <!-- 시간 경과 -->
  <rect x="24" y="286" width="832" height="36" rx="6" fill="#f3f4f6"/>
  <text x="440" y="309" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">… 15분 경과 …</text>

  <!-- 4. 만료된 AT로 호출 -->
  <circle cx="40" cy="356" r="12" fill="#334155"/>
  <text x="40" y="361" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <path d="M131,370 H758" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="300" y="360" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /orders</text>

  <!-- 5. 401 -->
  <circle cx="40" cy="416" r="12" fill="#334155"/>
  <text x="40" y="421" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <path d="M759,430 H132" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 4" fill="none" marker-end="url(#ahr)"/>
  <text x="610" y="420" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">401 Unauthorized (exp 초과)</text>

  <!-- 6. 재발급 요청 -->
  <circle cx="40" cy="476" r="12" fill="#334155"/>
  <text x="40" y="481" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <path d="M131,490 H468" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="300" y="480" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">POST /token/refresh</text>
  <text x="300" y="514" font-size="15" fill="#374151" text-anchor="middle"><tspan font-weight="bold" fill="#6d28d9">RT</tspan> 쿠키 자동 전송</text>
  <rect x="488" y="472" width="160" height="36" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="568" y="495" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">저장된 RT와 대조</text>

  <!-- 7. 새 토큰 -->
  <circle cx="40" cy="562" r="12" fill="#334155"/>
  <text x="40" y="567" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <path d="M469,576 H132" stroke="#1f2937" stroke-width="1.6" stroke-dasharray="7 4" fill="none" marker-end="url(#ah)"/>
  <text x="300" y="566" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#1d4ed8">새 AT</tspan> + <tspan font-weight="bold" fill="#6d28d9">새 RT</tspan> (Rotation)</text>

  <!-- 범례 -->
  <text x="40" y="644" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">AT</tspan> = Access Token<tspan dx="28" font-weight="bold" fill="#6d28d9">RT</tspan> = Refresh Token<tspan dx="28">실선 = 요청, 점선 = 응답</tspan></text>
</svg>
