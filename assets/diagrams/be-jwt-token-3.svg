<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4. Access Token과 Refresh Token</title>
  <desc id="d">Client, Auth Server, Resource API 간의 Access Token과 Refresh Token 발급, 인증, 만료 및 Refresh Token Rotation 흐름 시퀀스 다이어그램</desc>
  <rect width="880" height="620" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="42" font-size="16" font-weight="bold" fill="#1f2933">## 4. Access Token과 Refresh Token</text>

  <!-- Lifelines -->
  <line x1="140" y1="100" x2="140" y2="570" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="440" y1="100" x2="440" y2="570" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="740" y1="100" x2="740" y2="570" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Participant Headers -->
  <rect x="70" y="65" width="140" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="87.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Client</text>

  <rect x="360" y="65" width="160" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="87.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Auth Server</text>

  <rect x="655" y="65" width="170" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="740" y="87.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Resource API</text>

  <!-- Message 1: POST /login -->
  <path d="M140,140 L440,140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="232" y="125" width="116" height="20" fill="#ffffff"/>
  <text x="290" y="139.025" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">POST /login</text>

  <!-- Message 2: AT(15분) + RT(14일, HttpOnly 쿠키) -->
  <path d="M440,190 L140,190" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="156" y="175" width="268" height="20" fill="#ffffff"/>
  <text x="290" y="189.025" font-size="13" fill="#7c3aed" text-anchor="middle">AT(15분) + RT(14일, HttpOnly 쿠키)</text>

  <!-- Message 3: GET /orders Authorization: Bearer AT -->
  <path d="M140,250 L740,250" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="296" y="235" width="288" height="20" fill="#ffffff"/>
  <text x="440" y="249.025" font-size="13" fill="#2563eb" text-anchor="middle">GET /orders   Authorization: Bearer AT</text>

  <!-- Time lapse: … 15분 경과 … -->
  <rect x="355" y="295" width="170" height="26" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="312.025" font-size="13" font-style="italic" fill="#52606d" text-anchor="middle">… 15분 경과 …</text>

  <!-- Message 4: GET /orders → 401 Unauthorized (exp 초과) -->
  <path d="M140,370 L740,370" stroke="#dc2626" stroke-width="1.5" fill="none" marker-start="url(#a-red)"/>
  <rect x="230" y="355" width="420" height="20" fill="#ffffff"/>
  <text x="440" y="369.025" font-size="13" fill="#dc2626" text-anchor="middle">GET /orders   → 401 Unauthorized (exp 초과)</text>

  <!-- Message 5: POST /token/refresh (RT 쿠키 자동 전송) -->
  <path d="M140,450 L440,450" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="162" y="435" width="256" height="20" fill="#ffffff"/>
  <text x="290" y="449.025" font-size="13" fill="#1f2933" text-anchor="middle">POST /token/refresh  (RT 쿠키 자동 전송)</text>

  <!-- Annotation: 저장된 RT와 대조 -->
  <rect x="455" y="437" width="135" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="522.5" y="454.025" font-size="11.5" font-weight="bold" fill="#d97706" text-anchor="middle">저장된 RT와 대조</text>

  <!-- Message 6: 새 AT + 새 RT (Rotation) -->
  <path d="M440,520 L140,520" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="195" y="505" width="190" height="20" fill="#ffffff"/>
  <text x="290" y="519.025" font-size="13" fill="#059669" font-weight="bold" text-anchor="middle">새 AT + 새 RT (Rotation)</text>
</svg>