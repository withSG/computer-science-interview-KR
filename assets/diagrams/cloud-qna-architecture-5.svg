<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">데이터베이스 설계</title>
  <desc id="d">Cassandra와 Redis의 데이터베이스 설계 사양 카드</desc>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <!-- 그림자 효과 대체 및 테두리 스타일 정의 -->
  </defs>

  <!-- Cassandra 카드 (파랑 계열) -->
  <g transform="translate(40, 20)">
    <!-- 카드 배경 -->
    <rect x="0" y="0" width="380" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- Header 영역 -->
    <rect x="0" y="0" width="380" height="48" rx="8" fill="#2563eb"/>
    <!-- 하단 모서리 사각형으로 덮어서 상단만 라운드 적용 효과 -->
    <rect x="0" y="40" width="380" height="8" fill="#2563eb"/>
    <text x="20" y="30" font-size="16" font-weight="bold" fill="#ffffff">Cassandra (메시지 저장):</text>

    <!-- Content 영역 -->
    <!-- 항목 1: 파티션 키 -->
    <rect x="20" y="68" width="340" height="40" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="35" y="93" font-size="13" font-weight="bold" fill="#2563eb">•</text>
    <text x="48" y="93" font-size="13" fill="#1f2933">파티션 키: chat_room_id</text>

    <!-- 항목 2: 클러스터링 키 -->
    <rect x="20" y="120" width="340" height="40" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="35" y="145" font-size="13" font-weight="bold" fill="#2563eb">•</text>
    <text x="48" y="145" font-size="13" fill="#1f2933">클러스터링 키: message_id (시간순 정렬)</text>

    <!-- 항목 3: 특성 -->
    <rect x="20" y="172" width="340" height="40" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="35" y="197" font-size="13" font-weight="bold" fill="#2563eb">•</text>
    <text x="48" y="197" font-size="13" fill="#1f2933">쓰기 최적화, 수평 확장 용이</text>
  </g>

  <!-- Redis 카드 (보라 계열) -->
  <g transform="translate(460, 20)">
    <!-- 카드 배경 -->
    <rect x="0" y="0" width="380" height="300" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    
    <!-- Header 영역 -->
    <rect x="0" y="0" width="380" height="48" rx="8" fill="#7c3aed"/>
    <rect x="0" y="40" width="380" height="8" fill="#7c3aed"/>
    <text x="20" y="30" font-size="16" font-weight="bold" fill="#ffffff">Redis:</text>

    <!-- Content 영역 -->
    <!-- 항목 1: 세션 관리 -->
    <rect x="20" y="68" width="340" height="40" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="35" y="93" font-size="13" font-weight="bold" fill="#7c3aed">•</text>
    <text x="48" y="93" font-size="13" fill="#1f2933">세션 관리 (user_id → server_id)</text>

    <!-- 항목 2: 온라인 상태 -->
    <rect x="20" y="120" width="340" height="40" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="35" y="145" font-size="13" font-weight="bold" fill="#7c3aed">•</text>
    <text x="48" y="145" font-size="13" fill="#1f2933">온라인 상태 (SET)</text>

    <!-- 항목 3: 최근 메시지 캐시 -->
    <rect x="20" y="172" width="340" height="40" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="35" y="197" font-size="13" font-weight="bold" fill="#7c3aed">•</text>
    <text x="48" y="197" font-size="13" fill="#1f2933">최근 메시지 캐시</text>
  </g>
</svg>