<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">데이터 분할이라는 최소 장치</title>
  <desc id="d">전체 데이터를 학습셋, 검증셋, 테스트셋으로 분할하고 각각의 역할을 설명하는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title/Header Area -->
  <rect x="40" y="30" width="800" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">데이터 분할이라는 최소 장치</text>

  <!-- Root Box -->
  <rect x="60" y="100" width="160" height="180" rx="8" fill="#f8fafc" stroke="#1f2933" stroke-width="2"/>
  <text x="140" y="195" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">전체 데이터</text>

  <!-- Tree Lines -->
  <path d="M 220 190 L 260 190 L 260 120 L 280 120" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M 260 190 L 280 190" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M 260 190 L 260 260 L 280 260" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Node 1: 학습셋(train) -->
  <rect x="280" y="100" width="180" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="370" y="125" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">학습셋(train)</text>
  <text x="475" y="125" font-size="13" fill="#52606d" text-anchor="start">:</text>
  <text x="495" y="125" font-size="13" fill="#1f2933" text-anchor="start">가중치를 업데이트하는 데 쓴다</text>

  <!-- Node 2: 검증셋(validation) -->
  <rect x="280" y="170" width="180" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="370" y="195" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">검증셋(validation)</text>
  <text x="475" y="195" font-size="13" fill="#52606d" text-anchor="start">:</text>
  <text x="495" y="195" font-size="13" fill="#1f2933" text-anchor="start">하이퍼파라미터를 고르고 조기 종료 시점을 정한다</text>

  <!-- Node 3: 테스트셋(test) -->
  <rect x="280" y="240" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="370" y="265" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">테스트셋(test)</text>
  <text x="475" y="265" font-size="13" fill="#52606d" text-anchor="start">:</text>
  <text x="495" y="265" font-size="13" fill="#1f2933" text-anchor="start">딱 한 번, 최종 보고용으로만 쓴다</text>
</svg>