<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대략적 설계</title>
  <desc id="d">실시간 채팅 시스템의 대략적 설계 구조를 나타낸 다이어그램입니다. Clients, WebSocket Gateway, Message Service, Presence Service, Message Queue (Kafka), Message Storage (Cassandra), Redis 간의 연결 관계를 보여줍니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="720" fill="#ffffff"/>

  <!-- 제목 (문서 헤딩) -->
  <text x="440" y="36" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">대략적 설계</text>

  <!-- 1. Clients -->
  <rect x="140" y="60" width="600" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="88.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Clients</text>

  <!-- 화살표: Clients -> WebSocket Gateway -->
  <path d="M440,106 L440,164" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="390" y="125" width="100" height="20" fill="#ffffff" rx="3"/>
  <text x="440" y="139" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">WebSocket</text>

  <!-- 2. WebSocket Gateway -->
  <rect x="140" y="164" width="600" height="64" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="192.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">WebSocket Gateway</text>
  <text x="440" y="213" font-size="12" fill="#52606d" text-anchor="middle">(연결 관리, 메시지 라우팅)</text>

  <!-- 분기 선: WebSocket Gateway -> Message Service / Presence Service -->
  <path d="M440,228 L440,260" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M260,260 L620,260" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M260,260 L260,284" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M620,260 L620,284" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 3. Message Service -->
  <rect x="140" y="284" width="240" height="74" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="260" y="310.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Message Service</text>
  <text x="260" y="337" font-size="12" fill="#52606d" text-anchor="middle">(메시지처리)</text>

  <!-- 4. Presence Service -->
  <rect x="500" y="284" width="240" height="74" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="620" y="310.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Presence Service</text>
  <text x="620" y="337" font-size="12" fill="#52606d" text-anchor="middle">(온라인상태)</text>

  <!-- 선: Services -> Message Queue (Kafka) -->
  <!-- Left path from Message Service -->
  <path d="M260,358 L260,434" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Right path from Presence Service -->
  <path d="M620,358 L620,396 L480,396 L480,434" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 5. Message Queue (Kafka) -->
  <rect x="140" y="434" width="600" height="64" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="462.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Message Queue (Kafka)</text>
  <text x="440" y="483" font-size="12" fill="#52606d" text-anchor="middle">(메시지 순서 보장, 버퍼링)</text>

  <!-- 분기 선: Message Queue -> Message Storage / Redis -->
  <path d="M260,498 L260,554" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M620,498 L620,554" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 6. Message Storage (Cassandra) -->
  <rect x="140" y="554" width="240" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="260" y="582.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Message Storage</text>
  <text x="260" y="612" font-size="12" fill="#52606d" text-anchor="middle">(Cassandra)</text>

  <!-- 7. Redis (Session, Presence) -->
  <rect x="500" y="554" width="240" height="90" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="575.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Redis</text>
  <text x="620" y="602" font-size="12" fill="#52606d" text-anchor="middle">(Session,</text>
  <text x="620" y="622" font-size="12" fill="#52606d" text-anchor="middle">Presence)</text>
</svg>