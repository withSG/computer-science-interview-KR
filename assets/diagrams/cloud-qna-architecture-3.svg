<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실시간 채팅 대략적 설계</title>
  <desc id="d">Clients가 WebSocket으로 WebSocket Gateway에 연결되고, Gateway는 Message Service와 Presence Service로 나뉩니다. 두 서비스는 Message Queue (Kafka)로 모이고, Kafka 뒤에 Message Storage (Cassandra)와 Redis (Session, Presence)가 있습니다.</desc>
  <rect width="880" height="660" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Clients -->
  <rect x="110" y="24" width="660" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="56" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Clients</text>
  <line x1="440" y1="76" x2="440" y2="130" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-b)"/>
  <text x="454" y="109" font-size="15" font-weight="bold" fill="#1d4ed8">WebSocket</text>

  <!-- WebSocket Gateway -->
  <rect x="110" y="132" width="660" height="80" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440" y="164" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">WebSocket Gateway</text>
  <text x="440" y="192" text-anchor="middle" font-size="16" fill="#5b21b6">(연결 관리, 메시지 라우팅)</text>

  <!-- 분기 -->
  <path d="M440,212 V240 H250 V266" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M440,240 H630 V266" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Message Service / Presence Service -->
  <rect x="110" y="268" width="280" height="84" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="250" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Message Service</text>
  <text x="250" y="330" text-anchor="middle" font-size="16" fill="#1d4ed8">(메시지처리)</text>

  <rect x="490" y="268" width="280" height="84" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="630" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Presence Service</text>
  <text x="630" y="330" text-anchor="middle" font-size="16" fill="#1d4ed8">(온라인상태)</text>

  <line x1="250" y1="352" x2="250" y2="410" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="630" y1="352" x2="630" y2="410" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Message Queue (Kafka) -->
  <rect x="110" y="412" width="660" height="80" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="444" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Message Queue (Kafka)</text>
  <text x="440" y="472" text-anchor="middle" font-size="16" fill="#92400e">(메시지 순서 보장, 버퍼링)</text>

  <line x1="250" y1="492" x2="250" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="630" y1="492" x2="630" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 저장소 -->
  <rect x="110" y="552" width="280" height="84" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="250" y="586" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Message Storage</text>
  <text x="250" y="614" text-anchor="middle" font-size="16" fill="#047857">(Cassandra)</text>

  <rect x="490" y="552" width="280" height="84" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="630" y="586" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Redis</text>
  <text x="630" y="614" text-anchor="middle" font-size="16" fill="#b91c1c">(Session, Presence)</text>
</svg>
