<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">복합 인덱스 리프 순서와 조건별 탐색</title>
  <desc id="d">(status, created_at) 인덱스의 리프 7행을 세 WHERE 조건으로 읽은 모습입니다. status = 'DONE' 조건은 한데 모인 DONE 구간으로 바로 점프하고, created_at 조건을 더하면 그 구간 안에서 다시 좁히지만, created_at 만으로 거르면 맞는 행이 CANCELED·DONE·PENDING 곳곳에 흩어져 있어 선행 컬럼 없이는 좁힐 수 없습니다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

