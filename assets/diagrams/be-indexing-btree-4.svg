<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">복합 인덱스와 선행 컬럼 규칙</title>
  <desc id="d">(status, created_at) 복합 인덱스의 리프 노드 정렬 순서와 WHERE 조건별 인덱스 탐색 방식을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="30" y="35" font-size="16" font-weight="bold" fill="#1f2933">(status, created_at) 인덱스의 리프 순서</text>

  <!-- 테이블 인덱스 리프 영역 -->
  <g id="table-group">
    <!-- 헤더 배경 -->
    <rect x="30" y="60" width="280" height="35" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="90" y="82.2" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">status</text>
    <text x="230" y="82.2" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">created_at</text>
    <line x1="30" y1="95" x2="310" y2="95" stroke="#9aa5b1" stroke-width="1.5"/>

    <!-- 행 1, 2 (CANCELED 그룹) -->
    <rect x="30" y="95" width="280" height="60" fill="#f8fafc" stroke="#cbd2d9" stroke-dasharray="2 2"/>
    <text x="90" y="119.2" font-size="13" fill="#52606d" text-anchor="middle">CANCELED</text>
    <text x="230" y="119.2" font-size="13" fill="#52606d" text-anchor="middle">2024-01-03</text>
    <text x="90" y="143.2" font-size="13" fill="#52606d" text-anchor="middle">CANCELED</text>
    <text x="230" y="143.2" font-size="13" fill="#52606d" text-anchor="middle">2024-02-11</text>

    <!-- 행 3, 4, 5 (DONE 그룹 - 강조 영역) -->
    <rect x="30" y="155" width="280" height="90" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="90" y="179.2" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">DONE</text>
    <text x="230" y="179.2" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">2024-01-05</text>
    <text x="90" y="203.2" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">DONE</text>
    <text x="230" y="203.2" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">2024-01-09</text>
    <text x="90" y="227.2" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">DONE</text>
    <text x="230" y="227.2" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">2024-03-02</text>

    <!-- 행 6, 7 (PENDING 그룹) -->
    <rect x="30" y="245" width="280" height="60" fill="#f8fafc" stroke="#cbd2d9" stroke-dasharray="2 2"/>
    <text x="90" y="269.2" font-size="13" fill="#52606d" text-anchor="middle">PENDING</text>
    <text x="230" y="269.2" font-size="13" fill="#52606d" text-anchor="middle">2024-01-01</text>
    <text x="90" y="293.2" font-size="13" fill="#52606d" text-anchor="middle">PENDING</text>
    <text x="230" y="293.2" font-size="13" fill="#52606d" text-anchor="middle">2024-02-20</text>
    
    <!-- 전체 테두리 -->
    <rect x="30" y="60" width="280" height="245" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  </g>

  <!-- 원본 주석: ← status 로 먼저 뭉쳐 있다 -->
  <path d="M310,180 L350,180" stroke="#059669" stroke-width="1.5" fill="none" marker-start="url(#a-green)"/>
  <text x="360" y="184.2" font-size="13" font-weight="bold" fill="#059669">← status 로 먼저 뭉쳐 있다</text>

  <!-- 조건 1 영역 -->
  <g id="cond1-group">
    <rect x="30" y="325" width="280" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="40" y="347.2" font-size="13" font-weight="bold" fill="#2563eb">WHERE status = 'DONE'</text>
    
    <path d="M310,343 L540,343" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="550" y="347.2" font-size="13" fill="#2563eb">→ DONE 구간으로 바로 점프. 인덱스 사용</text>
  </g>

  <!-- 조건 2 영역 -->
  <g id="cond2-group">
    <rect x="30" y="375" width="415" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="40" y="397.2" font-size="13" font-weight="bold" fill="#059669">WHERE status = 'DONE' AND created_at &gt; ?</text>
    
    <path d="M445,393 L540,393" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="550" y="397.2" font-size="13" fill="#059669">→ DONE 구간 안에서 다시 좁힌다. 최적</text>
  </g>

  <!-- 조건 3 영역 -->
  <g id="cond3-group">
    <rect x="30" y="425" width="310" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="40" y="447.2" font-size="13" font-weight="bold" fill="#dc2626">WHERE created_at &gt; '2024-02-01'</text>
    
    <path d="M340,443 L540,443" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="550" y="447.2" font-size="13" fill="#dc2626">→ created_at 은 전체적으로 정렬돼 있지 않다</text>
    <text x="566" y="471.2" font-size="11.5" fill="#52606d">(CANCELED 2월과 DONE 1월이 뒤섞임)</text>
    <text x="550" y="495.2" font-size="13" fill="#dc2626">→ 선행 컬럼 없이는 못 좁힌다</text>
  </g>
</svg>