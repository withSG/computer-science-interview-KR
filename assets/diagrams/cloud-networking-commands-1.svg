<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">연결 장애 진단 순서</title>
  <desc id="d">대상 생존 확인(0)부터 링크(L1/L2), IP와 경로(L3), 도달성(L3), 이름 해석, 포트(L4), 요청/응답(L7), 패킷 실체(tcpdump)까지 아래 계층부터 위로 올라가며 확인하는 8단계와 단계별 명령어, 확인할 점.</desc>
  <rect width="880" height="680" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="24" y="24" width="832" height="34" rx="6" fill="#f1f5f9"/>
  <text x="48" y="46" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">단계</text>
  <text x="104" y="46" font-size="15" font-weight="bold" fill="#374151">확인할 질문</text>
  <text x="392" y="46" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">계층</text>
  <text x="468" y="46" font-size="15" font-weight="bold" fill="#374151">명령어 · 볼 것</text>
  <!-- 0 -->
  <rect x="84" y="70" width="772" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="48" cy="102" r="17" fill="#1d4ed8"/>
  <text x="48" y="108" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>
  <line x1="48" y1="122" x2="48" y2="155" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="104" y="108" font-size="18" font-weight="bold" fill="#111827">대상이 살아 있나</text>
  <line x1="448" y1="82" x2="448" y2="122" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="468" y="108" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">ping</tspan><tspan fill="#4b5563"> / 콘솔 접속 / 클라우드 상태</tspan></text>
  <!-- 1 -->
  <rect x="84" y="144" width="772" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="48" cy="176" r="17" fill="#1d4ed8"/>
  <text x="48" y="182" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="48" y1="196" x2="48" y2="229" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="104" y="182" font-size="18" font-weight="bold" fill="#111827">링크가 올라와 있나</text>
  <rect x="348" y="162" width="88" height="28" rx="14" fill="#e0e7ff"/>
  <text x="392" y="181" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">L1/L2</text>
  <line x1="448" y1="156" x2="448" y2="196" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="468" y="171" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">ip link show</tspan></text>
  <text x="468" y="195" font-size="15"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#4b5563">state UP / DOWN</tspan></text>
  <!-- 2 -->
  <rect x="84" y="218" width="772" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="48" cy="250" r="17" fill="#1d4ed8"/>
  <text x="48" y="256" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <line x1="48" y1="270" x2="48" y2="303" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="104" y="256" font-size="18" font-weight="bold" fill="#111827">IP와 경로가 맞나</text>
  <rect x="348" y="236" width="88" height="28" rx="14" fill="#e0e7ff"/>
  <text x="392" y="255" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">L3</text>
  <line x1="448" y1="230" x2="448" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="468" y="245" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">ip addr show / ip route show</tspan></text>
  <text x="468" y="269" font-size="15"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#4b5563">default</tspan><tspan fill="#4b5563"> 라우트 존재 여부</tspan></text>
  <!-- 3 -->
  <rect x="84" y="292" width="772" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="48" cy="324" r="17" fill="#1d4ed8"/>
  <text x="48" y="330" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="48" y1="344" x2="48" y2="377" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="104" y="330" font-size="18" font-weight="bold" fill="#111827">상대에 도달하나</text>
  <rect x="348" y="310" width="88" height="28" rx="14" fill="#e0e7ff"/>
  <text x="392" y="329" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">L3</text>
  <line x1="448" y1="304" x2="448" y2="344" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="468" y="319" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">ping / traceroute / mtr</tspan></text>
  <text x="468" y="343" font-size="15"><tspan fill="#4b5563">어느 홉에서 끊기는가</tspan></text>
  <!-- 4 -->
  <rect x="84" y="366" width="772" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="48" cy="398" r="17" fill="#1d4ed8"/>
  <text x="48" y="404" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <line x1="48" y1="418" x2="48" y2="451" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="104" y="404" font-size="18" font-weight="bold" fill="#111827">이름이 IP로 풀리나</text>
  <rect x="348" y="384" width="88" height="28" rx="14" fill="#e0e7ff"/>
  <text x="392" y="403" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">이름 해석</text>
  <line x1="448" y1="378" x2="448" y2="418" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="468" y="393" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">dig / getent hosts</tspan></text>
  <text x="468" y="417" font-size="15"><tspan fill="#4b5563">기대한 IP가 맞는가</tspan></text>
  <!-- 5 -->
  <rect x="84" y="440" width="772" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="48" cy="472" r="17" fill="#1d4ed8"/>
  <text x="48" y="478" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <line x1="48" y1="492" x2="48" y2="525" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="104" y="478" font-size="18" font-weight="bold" fill="#111827">포트가 열려 있나</text>
  <rect x="348" y="458" width="88" height="28" rx="14" fill="#e0e7ff"/>
  <text x="392" y="477" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">L4</text>
  <line x1="448" y1="452" x2="448" y2="492" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="468" y="467" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">ss -tlnp</tspan><tspan fill="#4b5563"> (서버 측)</tspan></text>
  <text x="468" y="491" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">nc -zv</tspan><tspan fill="#4b5563"> (클라이언트 측)</tspan></text>
  <!-- 6 -->
  <rect x="84" y="514" width="772" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="48" cy="546" r="17" fill="#1d4ed8"/>
  <text x="48" y="552" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <line x1="48" y1="566" x2="48" y2="599" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="104" y="552" font-size="18" font-weight="bold" fill="#111827">요청/응답이 정상인가</text>
  <rect x="348" y="532" width="88" height="28" rx="14" fill="#e0e7ff"/>
  <text x="392" y="551" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">L7</text>
  <line x1="448" y1="526" x2="448" y2="566" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="468" y="541" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">curl -v / curl -w</tspan></text>
  <text x="468" y="565" font-size="15"><tspan fill="#4b5563">상태 코드, 단계별 소요 시간</tspan></text>
  <!-- 7 -->
  <rect x="84" y="588" width="772" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <circle cx="48" cy="620" r="17" fill="#1d4ed8"/>
  <text x="48" y="626" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="104" y="626" font-size="18" font-weight="bold" fill="#111827">그래도 모르겠다</text>
  <rect x="348" y="606" width="88" height="28" rx="14" fill="#e0e7ff"/>
  <text x="392" y="625" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">패킷 실체</text>
  <line x1="448" y1="600" x2="448" y2="640" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="468" y="615" font-size="16"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827" font-weight="bold">tcpdump</tspan></text>
  <text x="468" y="639" font-size="15"><tspan fill="#4b5563">패킷은 거짓말하지 않는다</tspan></text>
</svg>
