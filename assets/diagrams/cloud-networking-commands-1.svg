<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">진단 순서 — 아래에서 위로</title>
  <desc id="d">0단계부터 7단계까지 아래 계층부터 위로 올라가며 네트워크 문제를 진단하는 순서와 관련 명령어를 나타낸 표</desc>
  <rect width="880" height="770" fill="#ffffff"/>
  
  <rect x="30" y="30" width="820" height="710" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2" rx="6"/>
  
  <rect x="30" y="30" width="820" height="80" fill="#eff6ff" rx="6"/>
  <rect x="30" y="90" width="820" height="20" fill="#eff6ff"/>
  <text x="50" y="73.5" font-size="14" font-weight="bold" fill="#2563eb">0. 대상이 살아 있나</text>
  <text x="450" y="73.5" font-size="13" fill="#1f2933">ping / 콘솔 접속 / 클라우드 상태</text>
  
  <line x1="30" y1="110" x2="850" y2="110" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <rect x="30" y="110" width="820" height="80" fill="#ffffff"/>
  <text x="50" y="143.5" font-size="14" font-weight="bold" fill="#1f2933">1. 링크가 올라와 있나</text>
  <text x="80" y="168.5" font-size="13" font-weight="bold" fill="#52606d">L1/L2</text>
  <text x="450" y="143.5" font-size="13" fill="#1f2933">ip link show</text>
  <text x="450" y="168.5" font-size="13" fill="#1f2933">state UP / DOWN</text>
  
  <line x1="30" y1="190" x2="850" y2="190" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <rect x="30" y="190" width="820" height="80" fill="#ffffff"/>
  <text x="50" y="223.5" font-size="14" font-weight="bold" fill="#1f2933">2. IP와 경로가 맞나</text>
  <text x="80" y="248.5" font-size="13" font-weight="bold" fill="#52606d">L3</text>
  <text x="450" y="223.5" font-size="13" fill="#1f2933">ip addr show / ip route show</text>
  <text x="450" y="248.5" font-size="13" fill="#1f2933">default 라우트 존재 여부</text>
  
  <line x1="30" y1="270" x2="850" y2="270" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <rect x="30" y="270" width="820" height="80" fill="#ffffff"/>
  <text x="50" y="303.5" font-size="14" font-weight="bold" fill="#1f2933">3. 상대에 도달하나</text>
  <text x="80" y="328.5" font-size="13" font-weight="bold" fill="#52606d">L3</text>
  <text x="450" y="303.5" font-size="13" fill="#1f2933">ping / traceroute / mtr</text>
  <text x="450" y="328.5" font-size="13" fill="#1f2933">어느 홉에서 끊기는가</text>
  
  <line x1="30" y1="350" x2="850" y2="350" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <rect x="30" y="350" width="820" height="80" fill="#ffffff"/>
  <text x="50" y="383.5" font-size="14" font-weight="bold" fill="#1f2933">4. 이름이 IP로 풀리나</text>
  <text x="80" y="408.5" font-size="13" font-weight="bold" fill="#52606d">이름 해석</text>
  <text x="450" y="383.5" font-size="13" fill="#1f2933">dig / getent hosts</text>
  <text x="450" y="408.5" font-size="13" fill="#1f2933">기대한 IP가 맞는가</text>
  
  <line x1="30" y1="430" x2="850" y2="430" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <rect x="30" y="430" width="820" height="80" fill="#ffffff"/>
  <text x="50" y="463.5" font-size="14" font-weight="bold" fill="#1f2933">5. 포트가 열려 있나</text>
  <text x="80" y="488.5" font-size="13" font-weight="bold" fill="#52606d">L4</text>
  <text x="450" y="463.5" font-size="13" fill="#1f2933">ss -tlnp (서버 측)</text>
  <text x="450" y="488.5" font-size="13" fill="#1f2933">nc -zv (클라이언트 측)</text>
  
  <line x1="30" y1="510" x2="850" y2="510" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <rect x="30" y="510" width="820" height="80" fill="#ffffff"/>
  <text x="50" y="543.5" font-size="14" font-weight="bold" fill="#1f2933">6. 요청/응답이 정상인가</text>
  <text x="80" y="568.5" font-size="13" font-weight="bold" fill="#52606d">L7</text>
  <text x="450" y="543.5" font-size="13" fill="#1f2933">curl -v / curl -w</text>
  <text x="450" y="568.5" font-size="13" fill="#1f2933">상태 코드, 단계별 소요 시간</text>
  
  <line x1="30" y1="590" x2="850" y2="590" stroke="#cbd2d9" stroke-width="1.5"/>
  
  <rect x="30" y="590" width="820" height="80" fill="#fffbeb" rx="6"/>
  <rect x="30" y="590" width="820" height="20" fill="#fffbeb"/>
  <text x="50" y="623.5" font-size="14" font-weight="bold" fill="#d97706">7. 그래도 모르겠다</text>
  <text x="80" y="648.5" font-size="13" font-weight="bold" fill="#d97706">패킷 실체</text>
  <text x="450" y="623.5" font-size="13" font-weight="bold" fill="#1f2933">tcpdump</text>
  <text x="450" y="648.5" font-size="13" fill="#1f2933">패킷은 거짓말하지 않는다</text>
</svg>