<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">학습 순서 권장</title>
  <desc id="d">시스템 설계는 1. 캐싱 전략(Redis, CDN), 2. 확장성(로드밸런싱, 샤딩), 3. 성능 최적화(병목 분석, 최적화) 순서로 학습하기를 권장한다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="190" fill="#ffffff"/>

  <!-- 1. 캐싱 전략 -->
  <rect x="36" y="24" width="216" height="140" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="144" cy="58" r="18" fill="#1d4ed8"/>
  <text x="144" y="64" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <text x="144" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">캐싱 전략</text>
  <text x="144" y="138" text-anchor="middle" font-size="16" fill="#1e3a8a">Redis, CDN</text>

  <line x1="258" y1="94" x2="324" y2="94" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 2. 확장성 -->
  <rect x="332" y="24" width="216" height="140" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="440" cy="58" r="18" fill="#6d28d9"/>
  <text x="440" y="64" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">2</text>
  <text x="440" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">확장성</text>
  <text x="440" y="138" text-anchor="middle" font-size="16" fill="#4c1d95">로드밸런싱, 샤딩</text>

  <line x1="554" y1="94" x2="620" y2="94" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 3. 성능 최적화 -->
  <rect x="628" y="24" width="216" height="140" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <circle cx="736" cy="58" r="18" fill="#047857"/>
  <text x="736" y="64" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">3</text>
  <text x="736" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">성능 최적화</text>
  <text x="736" y="138" text-anchor="middle" font-size="16" fill="#064e3b">병목 분석, 최적화</text>
</svg>
