<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">학습 순서 권장</title>
  <desc id="d">1. 캐싱 전략, 2. 확장성, 3. 성능 최적화 순서의 학습 경로 다이어그램</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <text x="440" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">학습 순서 권장</text>
  
  <!-- Step 1 -->
  <rect x="290" y="60" width="300" height="50" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="89.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">1. 캐싱 전략 (Redis, CDN)</text>
  
  <!-- Arrow 1 -> 2 -->
  <path d="M440,110 L440,140" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  
  <!-- Step 2 -->
  <rect x="290" y="140" width="300" height="50" rx="6" ry="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="169.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">2. 확장성 (로드밸런싱, 샤딩)</text>
  
  <!-- Arrow 2 -> 3 -->
  <path d="M440,190 L440,220" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  
  <!-- Step 3 -->
  <rect x="290" y="220" width="300" height="50" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="249.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">3. 성능 최적화 (병목 분석, 최적화)</text>
</svg>