<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 710" width="880" height="710" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Webpack 빌드 파이프라인과 plugin 훅</title>
  <desc id="d">entry, loader, 그래프 완성, mode, output 순서로 빌드가 진행되고 loader 단계는 파일마다 반복된다. 오른쪽 plugin 열은 HtmlWebpackPlugin(⑤ 직전), DefinePlugin(②와 ③ 사이), MiniCssExtractPlugin(②와 ⑤ 양쪽)이 붙는 시점을 보여준다.</desc>
  <rect width="880" height="710" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="64" y="50" font-size="18" font-weight="bold" fill="#111827">Webpack 빌드 파이프라인</text>
  <text x="634" y="42" font-size="18" font-weight="bold" fill="#6d28d9">plugin</text>
  <text x="634" y="66" font-size="14" fill="#6d28d9">①~⑤ 전 구간의 "훅"에 붙는다</text>

  <!-- plugin 레인 배경 -->
  <rect x="616" y="80" width="240" height="600" rx="10" fill="#f5f3ff"/>

  <!-- ① entry -->
  <rect x="64" y="80" width="540" height="72" rx="8" fill="#ffffff"/>
  <path d="M72,80 H196 V152 H72 A8,8 0 0 1 64,144 V88 A8,8 0 0 1 72,80 Z" fill="#dbeafe"/>
  <rect x="64" y="80" width="540" height="72" rx="8" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="76" y="121.5" font-size="16" font-weight="bold" fill="#1e3a8a">① entry</text>
  <text x="210" y="108" font-size="15" font-weight="bold" fill="#111827">"./src/index.js 부터 시작해"</text>
  <text x="210" y="134" font-size="15" fill="#4b5563">그래프의 루트. 여기가 없으면 아무것도 시작 안 된다</text>

  <line x1="334" y1="152" x2="334" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ② loader -->
  <rect x="64" y="188" width="540" height="122" rx="8" fill="#ffffff"/>
  <path d="M72,188 H196 V310 H72 A8,8 0 0 1 64,302 V196 A8,8 0 0 1 72,188 Z" fill="#dbeafe"/>
  <rect x="64" y="188" width="540" height="122" rx="8" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="76" y="254.5" font-size="16" font-weight="bold" fill="#1e3a8a">② loader</text>
  <text x="210" y="214" font-size="15" font-weight="bold" fill="#111827">"확장자가 .scss네 → sass-loader → css-loader</text>
  <text x="210" y="238" font-size="15" font-weight="bold" fill="#111827">→ style-loader 순으로 통과시켜 JS로 바꿔"</text>
  <text x="210" y="266" font-size="15" fill="#4b5563">변환 결과에서 다시 import를 찾아 그래프를 확장한다</text>
  <text x="210" y="294" font-size="15" font-weight="bold" fill="#b45309">↻ 파일을 하나 읽을 때마다 반복</text>
  <!-- 반복 루프 -->
  <path d="M64,292 H40 V206 H61" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ah-loop)"/>

  <line x1="334" y1="310" x2="334" y2="367" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ③ 그래프 완성 -->
  <rect x="64" y="370" width="540" height="52" rx="8" fill="#ffffff"/>
  <path d="M72,370 H196 V422 H72 A8,8 0 0 1 64,414 V378 A8,8 0 0 1 72,370 Z" fill="#e5e7eb"/>
  <rect x="64" y="370" width="540" height="52" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="76" y="401.5" font-size="16" font-weight="bold" fill="#374151">③ 그래프 완성</text>
  <text x="210" y="401.5" font-size="15" fill="#111827">모든 모듈이 JS로 변환되어 노드로 연결됨</text>

  <line x1="334" y1="422" x2="334" y2="455" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ④ mode -->
  <rect x="64" y="458" width="540" height="74" rx="8" fill="#ffffff"/>
  <path d="M72,458 H196 V532 H72 A8,8 0 0 1 64,524 V466 A8,8 0 0 1 72,458 Z" fill="#dbeafe"/>
  <rect x="64" y="458" width="540" height="74" rx="8" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="76" y="500.5" font-size="16" font-weight="bold" fill="#1e3a8a">④ mode</text>
  <text x="210" y="487" font-size="15" fill="#111827"><tspan font-weight="bold">production</tspan>이면 트리 셰이킹·미니파이·청크 분할</text>
  <text x="210" y="513" font-size="15" fill="#111827"><tspan font-weight="bold">development</tspan>면 거의 건드리지 않고 빠르게 통과</text>

  <line x1="334" y1="532" x2="334" y2="609" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ⑤ output -->
  <rect x="64" y="612" width="540" height="56" rx="8" fill="#ffffff"/>
  <path d="M72,612 H196 V668 H72 A8,8 0 0 1 64,660 V620 A8,8 0 0 1 72,612 Z" fill="#dbeafe"/>
  <rect x="64" y="612" width="540" height="56" rx="8" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="76" y="645.5" font-size="16" font-weight="bold" fill="#1e3a8a">⑤ output</text>
  <text x="210" y="645.5" font-size="15" font-weight="bold" fill="#111827">"dist/ 아래 [name].[contenthash].js 로 파일을 써"</text>

  <!-- plugin 연결선 -->
  <line x1="634" y1="242" x2="608" y2="242" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="604" cy="242" r="5" fill="#6d28d9"/>
  <line x1="634" y1="340" x2="338" y2="340" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="334" cy="340" r="5" fill="#6d28d9"/>
  <line x1="634" y1="572" x2="338" y2="572" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="334" cy="572" r="5" fill="#6d28d9"/>
  <line x1="634" y1="640" x2="608" y2="640" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="604" cy="640" r="5" fill="#6d28d9"/>

  <!-- plugin 카드 -->
  <rect x="634" y="214" width="210" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="646" y="237" font-size="15" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">MiniCssExtractPlugin</text>
  <text x="646" y="258" font-size="14" fill="#374151">②와 ⑤ 양쪽에 관여</text>

  <rect x="634" y="291" width="210" height="98" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="646" y="314" font-size="15" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DefinePlugin</text>
  <text x="646" y="336" font-size="14" font-weight="bold" fill="#111827">②와 ③ 사이</text>
  <text x="646" y="357" font-size="14" fill="#374151">모듈을 파싱하며 식별자를</text>
  <text x="646" y="377" font-size="14" fill="#374151">치환하는 시점</text>

  <rect x="634" y="544" width="210" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="646" y="567" font-size="15" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HtmlWebpackPlugin</text>
  <text x="646" y="588" font-size="14" font-weight="bold" fill="#111827">⑤ 직전</text>

  <rect x="634" y="612" width="210" height="56" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="646" y="635" font-size="15" font-weight="bold" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">MiniCssExtractPlugin</text>
  <text x="646" y="656" font-size="14" fill="#374151">②와 ⑤ 양쪽에 관여</text>
</svg>
