<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">변경 종류별 파이프라인 재실행 범위</title>
  <desc id="d">변경이 기하를 바꾸면 Style, Layout, Paint, Composite를 모두 다시 돌아 가장 비싸고, 색·그림자만 바뀌면 Layout을 건너뛰어 중간, transform/opacity처럼 합성만으로 끝나면 Layout과 Paint를 건너뛰어 가장 싸다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 시작점과 분기 줄기 -->
  <rect x="24" y="24" width="136" height="44" rx="8" fill="#1f2937"/>
  <text x="92" y="52" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">변경 발생</text>
  <path d="M48,68 L48,390" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M48,122 L71,122" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>
  <path d="M48,256 L71,256" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>
  <path d="M48,390 L71,390" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <!-- ① 기하 변경: 전 단계 (가장 비쌈) -->
  <rect x="76" y="92" width="780" height="116" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="96" y="127" font-size="16" fill="#111827">기하(geometry)가 바뀌었나?<tspan dx="12" font-weight="bold" fill="#b91c1c">→ YES</tspan></text>

  <rect x="96" y="144" width="100" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="146" y="171" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">Style</text>
  <path d="M200,166 L232,166" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-red)"/>
  <rect x="236" y="144" width="110" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="291" y="171" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">Layout</text>
  <path d="M350,166 L382,166" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-red)"/>
  <rect x="386" y="144" width="100" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="436" y="171" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">Paint</text>
  <path d="M490,166 L522,166" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-red)"/>
  <rect x="526" y="144" width="130" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="591" y="171" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">Composite</text>

  <text x="690" y="156" font-size="20" font-weight="bold" fill="#b91c1c">가장 비쌈</text>
  <text x="690" y="182" font-size="15" fill="#374151">리플로우(Reflow)</text>

  <!-- ② 보이는 것만 변경: Layout 건너뜀 (중간) -->
  <rect x="76" y="226" width="780" height="116" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="96" y="261" font-size="16" fill="#111827">색·그림자처럼 보이는 것만 바뀌었나?<tspan dx="12" font-weight="bold" fill="#b45309">→ YES</tspan></text>

  <rect x="96" y="278" width="100" height="44" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="146" y="305" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Style</text>
  <path d="M200,300 L382,300" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#m-amber)"/>
  <text x="291" y="292" font-size="14" fill="#4b5563" text-anchor="middle">Layout 건너뜀</text>
  <rect x="386" y="278" width="100" height="44" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="436" y="305" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Paint</text>
  <path d="M490,300 L522,300" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#m-amber)"/>
  <rect x="526" y="278" width="130" height="44" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="591" y="305" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Composite</text>

  <text x="690" y="290" font-size="20" font-weight="bold" fill="#b45309">중간</text>
  <text x="690" y="316" font-size="15" fill="#374151">리페인트(Repaint)</text>

  <!-- ③ 합성만: Layout·Paint 건너뜀 (가장 쌈) -->
  <rect x="76" y="360" width="780" height="116" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="96" y="395" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">transform/opacity</tspan>처럼 레이어 합성만으로 끝나나?<tspan dx="12" font-weight="bold" fill="#047857">→ YES</tspan></text>

  <rect x="96" y="412" width="100" height="44" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="146" y="439" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">Style</text>
  <path d="M200,434 L522,434" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#m-green)"/>
  <text x="361" y="426" font-size="14" fill="#4b5563" text-anchor="middle">Layout · Paint 건너뜀</text>
  <rect x="526" y="412" width="130" height="44" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="591" y="439" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">Composite</text>

  <text x="690" y="424" font-size="20" font-weight="bold" fill="#047857">가장 쌈</text>
  <text x="690" y="450" font-size="15" fill="#374151">합성(Composite)만</text>
</svg>
