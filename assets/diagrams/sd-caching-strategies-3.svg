<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안티패턴: 캐시를 갱신(update)한다</title>
  <desc id="d">요청A와 요청B의 DB 및 캐시 쓰기 순서가 뒤집혀 DB는 200, 캐시는 100이 되는 안티패턴 시퀀스 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 헤딩 / 제목 -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">안티패턴: 캐시를 갱신(update)한다</text>

  <!-- 메인 박스 영역 -->
  <rect x="30" y="60" width="820" height="235" rx="8" ry="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 요청 A 흐름 (파랑) -->
  <!-- 1. 요청A: DB에 100 쓰기 -->
  <rect x="50" y="85" width="180" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="107.6" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">요청A: DB에 100 쓰기</text>

  <path d="M 230 103 L 640 103 L 640 235 L 590 235" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 요청 B 흐름 (보라) -->
  <!-- 2. 요청B: DB에 200 쓰기 -->
  <rect x="50" y="135" width="180" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140" y="157.6" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">요청B: DB에 200 쓰기</text>

  <path d="M 230 153 L 420 153" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- 3. 요청B: 캐시에 200 쓰기 -->
  <rect x="410" y="185" width="180" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="207.6" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">요청B: 캐시에 200 쓰기</text>

  <path d="M 230 153 L 340 153 L 340 203 L 410 203" stroke="#7c3aed" stroke-width="1.5" fill="none"/>

  <!-- 4. 요청A: 캐시에 100 쓰기 -->
  <rect x="410" y="235" width="180" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="257.6" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">요청A: 캐시에 100 쓰기</text>

  <!-- 결과 강조 라벨 (빨강) -->
  <rect x="620" y="235" width="200" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="630" y="257.6" font-size="13" font-weight="bold" fill="#dc2626">← DB는 200, 캐시는 100</text>
</svg>