<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기존 Stack Reconciler의 문제</title>
  <desc id="d">React 15 이전 Stack Reconciler는 렌더링을 시작하면 완료까지 한 덩어리로, 중단 없이 동기적으로 실행한다. 그래서 큰 업데이트가 오면 UI 블로킹과 프레임 드랍이 생긴다.</desc>
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="24" y="44" font-size="18" font-weight="bold" fill="#111827">Stack Reconciler (React 15 이전)</text>

  <!-- 렌더링 시작 ━━━━━━► 완료 : 한 덩어리 -->
  <text x="40" y="118" font-size="16" font-weight="bold" fill="#111827">렌더링 시작</text>
  <polygon points="184,84 772,84 796,112 772,140 184,140" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="480" y="118" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">중단 불가, 동기적</text>
  <text x="808" y="118" font-size="17" font-weight="bold" fill="#111827">완료</text>

  <!-- 결과 -->
  <text x="40" y="206" font-size="17" font-weight="bold" fill="#111827">큰 업데이트 시</text>
  <path d="M164,200 H194" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="204" y="180" width="118" height="40" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="263" y="206" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">UI 블로킹</text>
  <rect x="338" y="180" width="130" height="40" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="403" y="206" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">프레임 드랍</text>
</svg>
