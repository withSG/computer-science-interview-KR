<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기존 Stack Reconciler의 문제</title>
  <desc id="d">Stack Reconciler (React 15 이전)의 동기적 렌더링 방식과 UI 블로킹 및 프레임 드랍 문제를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="880" height="230" fill="#ffffff"/>

  <!-- Title / Label Header -->
  <text x="30" y="42" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="start">Stack Reconciler (React 15 이전):</text>

  <!-- Main Box Section -->
  <rect x="30" y="60" width="820" height="90" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Process Flow inside Box -->
  <!-- Text: 렌더링 시작 -->
  <text x="60" y="103" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="start">렌더링 시작</text>
  
  <!-- Arrow -->
  <path d="M145,98 L755,98" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- Text: 완료 -->
  <text x="800" y="103" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="end">완료</text>

  <!-- Subtitle Text inside Box -->
  <text x="60" y="130" font-size="13" fill="#52606d" text-anchor="start">(중단 불가, 동기적)</text>

  <!-- Problem Statement below Box -->
  <path d="M30,182 L42,182" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="50" y="186" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">큰 업데이트 시 UI 블로킹, 프레임 드랍</text>
</svg>