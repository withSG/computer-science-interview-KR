<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT 인증 흐름</title>
  <desc id="d">클라이언트가 로그인하면 서버가 JWT를 발급하고, 클라이언트는 토큰을 localStorage나 Cookie에 저장한 뒤 요청마다 Authorization: Bearer {token} 헤더로 보내며, 서버는 서명을 검증한 후 요청을 처리한다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="110" y="24" width="180" height="52" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">클라이언트</text>
  <rect x="630" y="24" width="180" height="52" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="720" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">서버</text>

  <!-- 생명선 (상자 구간은 끊음) -->
  <line x1="200" y1="76" x2="200" y2="216" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="200" y1="284" x2="200" y2="520" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="720" y1="76" x2="720" y2="430" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="720" y1="486" x2="720" y2="520" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 1. 로그인 → 서버가 JWT 발급 -->
  <circle cx="252" cy="115" r="13" fill="#1d4ed8"/>
  <text x="252" y="120" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="274" y="121" font-size="16" fill="#111827">로그인</text>
  <line x1="200" y1="134" x2="719" y2="134" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="274" y="181" font-size="16" fill="#111827">서버가 <tspan font-weight="bold" fill="#b45309">JWT</tspan> 발급</text>
  <line x1="720" y1="194" x2="201" y2="194" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>

  <!-- 2. 클라이언트가 토큰 저장 -->
  <rect x="80" y="216" width="240" height="68" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="108" cy="241" r="13" fill="#1d4ed8"/>
  <text x="108" y="246" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="130" y="247" font-size="17" font-weight="bold" fill="#111827">토큰 저장</text>
  <text x="130" y="272" font-size="15" fill="#374151">localStorage, Cookie</text>

  <!-- 요청마다 반복 구간 -->
  <rect x="60" y="306" width="790" height="204" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="60" y="306" width="122" height="32" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="327" font-size="15" font-weight="bold" fill="#111827">요청마다 반복</text>

  <!-- 3. Authorization: Bearer {token} 헤더로 전송 -->
  <circle cx="252" cy="355" r="13" fill="#1d4ed8"/>
  <text x="252" y="360" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="274" y="361" font-size="16" fill="#111827">헤더로 전송</text>
  <line x1="200" y1="374" x2="719" y2="374" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="240" y="386" width="276" height="32" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="256" y="407" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Authorization: Bearer <tspan fill="#b45309" font-weight="bold">{token}</tspan></text>

  <!-- 4. 서버가 서명 검증 후 요청 처리 -->
  <rect x="590" y="430" width="240" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="614" cy="458" r="13" fill="#1d4ed8"/>
  <text x="614" y="463" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="636" y="464" font-size="16" font-weight="bold" fill="#111827">서명 검증 후 요청 처리</text>
</svg>
