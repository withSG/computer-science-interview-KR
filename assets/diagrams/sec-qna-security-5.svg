<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT 인증 흐름</title>
  <desc id="d">클라이언트와 서버 간의 로그인 및 JWT 발급, 토큰 저장, 요청 전송 및 서명 검증 절차를 나타낸 흐름도</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="40" y="44" font-size="16" font-weight="bold" fill="#1f2933">JWT 인증 흐름</text>

  <!-- 액터 라벨 및 가이드 영역 -->
  <!-- 클라이언트 영역 -->
  <rect x="40" y="80" width="280" height="380" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="60" y="96" width="240" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="121" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">클라이언트</text>

  <!-- 서버 영역 -->
  <rect x="560" y="80" width="280" height="380" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="580" y="96" width="240" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="700" y="121" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">서버</text>

  <!-- 수직 라이프라인 -->
  <path d="M180,136 L180,430" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M700,136 L700,430" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 1: 로그인 -> 서버가 JWT 발급 -->
  <path d="M180,180 L700,180" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <rect x="230" y="166" width="420" height="26" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="440" y="183" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">1. 로그인 → 서버가 JWT 발급</text>

  <!-- Step 2: 클라이언트가 토큰 저장 (localStorage, Cookie) -->
  <rect x="60" y="225" width="240" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="255" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">2. 클라이언트가 토큰 저장</text>
  <text x="180" y="271" font-size="11.5" fill="#52606d" text-anchor="middle">(localStorage, Cookie)</text>

  <!-- Step 3: 요청마다 Authorization: Bearer {token} 헤더로 전송 -->
  <path d="M180,320 L700,320" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>
  <rect x="210" y="306" width="460" height="26" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="440" y="323" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">3. 요청마다 Authorization: Bearer {token} 헤더로 전송</text>

  <!-- Step 4: 서버가 서명 검증 후 요청 처리 -->
  <rect x="580" y="365" width="240" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="395" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">4. 서버가 서명 검증 후</text>
  <text x="700" y="411" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">요청 처리</text>
</svg>