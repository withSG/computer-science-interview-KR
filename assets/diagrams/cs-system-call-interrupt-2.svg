<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1260" width="880" height="1260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">read() 시스템 콜 동작 절차</title>
  <desc id="d">사용자 코드의 read() 호출이 사용자 모드 1~3단계, 트랩으로 모드 경계를 넘은 뒤 커널 모드 4~8단계, 다시 사용자 모드 9단계로 진행되는 과정입니다. 7단계에서 페이지 캐시에 데이터가 없을 때만 스레드가 Waiting 상태가 되어 컨텍스트 스위칭이 일어납니다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="1260" fill="#ffffff"/>

  <!-- ===== 사용자 모드 (1~3) ===== -->
  <rect x="24" y="24" width="832" height="340" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="124" y="56" font-size="18" font-weight="bold" fill="#1d4ed8">사용자 모드</text>

  <rect x="64" y="72" width="768" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="96" cy="98" r="15" fill="#1d4ed8"/>
  <text x="96" y="103" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="124" y="104" font-size="16" font-weight="bold" fill="#111827">애플리케이션이 라이브러리 함수 호출</text>
  <text x="124" y="132" font-size="15" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">FileInputStream.read()  →  libc의 read()</text>

  <path d="M96,150 L96,170" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="64" y="172" width="768" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="96" cy="198" r="15" fill="#1d4ed8"/>
  <text x="96" y="203" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="124" y="204" font-size="16" font-weight="bold" fill="#111827">libc가 시스템 콜 번호를 레지스터에 넣고</text>
  <text x="124" y="232" font-size="15" fill="#374151">인자(파일 디스크립터, 버퍼 주소, 길이)도 레지스터에 배치</text>

  <path d="M96,250 L96,270" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="64" y="272" width="768" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="96" cy="298" r="15" fill="#1d4ed8"/>
  <text x="96" y="303" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="124" y="304" font-size="16" font-weight="bold" fill="#111827">트랩 명령어 실행</text>
  <text x="124" y="332" font-size="15" fill="#374151">(x86-64 리눅스에서는 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">syscall</tspan> 명령어)</text>

  <!-- 모드 경계 1 -->
  <line x1="24" y1="388" x2="856" y2="388" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="736" y="374" width="104" height="28" fill="#ffffff"/>
  <text x="788" y="393" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">모드 경계</text>

  <!-- ===== 커널 모드 (4~8) ===== -->
  <rect x="24" y="412" width="832" height="660" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <path d="M96,350 L96,456" stroke="#4b5563" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="124" y="444" font-size="18" font-weight="bold" fill="#6d28d9">커널 모드</text>

  <rect x="64" y="460" width="768" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="96" cy="486" r="15" fill="#6d28d9"/>
  <text x="96" y="491" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="124" y="492" font-size="16" font-weight="bold" fill="#111827">CPU가 자동으로 모드 비트를 커널로 바꾸고</text>
  <text x="124" y="520" font-size="15" fill="#374151">미리 등록된 진입점으로 점프, 사용자 컨텍스트 저장</text>

  <path d="M96,538 L96,558" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="64" y="560" width="768" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="96" cy="586" r="15" fill="#6d28d9"/>
  <text x="96" y="591" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="124" y="592" font-size="16" font-weight="bold" fill="#111827">시스템 콜 번호로 시스템 콜 테이블을 조회해 핸들러 결정</text>

  <path d="M96,614 L96,634" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="64" y="636" width="768" height="154" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="96" cy="662" r="15" fill="#6d28d9"/>
  <text x="96" y="667" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="124" y="668" font-size="16" font-weight="bold" fill="#111827">인자 검증</text>
  <text x="124" y="696" font-size="15" fill="#374151">· 파일 디스크립터가 이 프로세스의 것이 맞는가</text>
  <text x="124" y="722" font-size="15" fill="#374151">· 버퍼 주소가 이 프로세스의 유효한 쓰기 가능 영역인가</text>
  <rect x="124" y="738" width="688" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="140" y="761" font-size="15" font-weight="bold" fill="#b91c1c">※ 검증을 건너뛰면 커널 임의 메모리 덮어쓰기 취약점이 된다</text>

  <path d="M96,792 L96,812" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="64" y="814" width="768" height="166" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="96" cy="840" r="15" fill="#6d28d9"/>
  <text x="96" y="845" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="124" y="846" font-size="16" font-weight="bold" fill="#111827">실제 작업 수행</text>

  <rect x="124" y="862" width="260" height="102" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="144" y="890" font-size="15" font-weight="bold" fill="#047857">페이지 캐시에 있으면</text>
  <text x="144" y="918" font-size="15" fill="#111827">즉시 복사하고 반환</text>

  <rect x="400" y="862" width="412" height="102" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="420" y="890" font-size="15" font-weight="bold" fill="#b45309">없으면</text>
  <text x="420" y="918" font-size="15" fill="#111827">디스크 I/O 요청 후 이 스레드를 Waiting 상태로</text>
  <text x="420" y="946" font-size="15" font-weight="bold" fill="#b91c1c">(여기서 비로소 컨텍스트 스위칭 발생)</text>

  <path d="M96,982 L96,1002" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="64" y="1004" width="768" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="96" cy="1030" r="15" fill="#6d28d9"/>
  <text x="96" y="1035" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="124" y="1036" font-size="16" font-weight="bold" fill="#111827">반환값을 레지스터에 넣고 사용자 컨텍스트 복원</text>

  <!-- 모드 경계 2 -->
  <line x1="24" y1="1096" x2="856" y2="1096" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="736" y="1082" width="104" height="28" fill="#ffffff"/>
  <text x="788" y="1101" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">모드 경계</text>

  <!-- ===== 사용자 모드 (9) ===== -->
  <rect x="24" y="1120" width="832" height="116" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <path d="M96,1058 L96,1166" stroke="#4b5563" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="124" y="1152" font-size="18" font-weight="bold" fill="#1d4ed8">사용자 모드</text>

  <rect x="64" y="1168" width="768" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="96" cy="1194" r="15" fill="#1d4ed8"/>
  <text x="96" y="1199" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <text x="124" y="1200" font-size="16" font-weight="bold" fill="#111827">libc가 반환값을 확인하고 필요시 errno 설정 후 호출자에게 리턴</text>
</svg>
