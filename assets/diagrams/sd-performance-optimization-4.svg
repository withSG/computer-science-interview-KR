<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">부하 테스트 구간</title>
  <desc id="d">시간에 따라 가상 사용자 수를 서서히 늘리는 램프업, 목표 부하를 유지하는 정상 상태, p50/p95/p99와 에러율을 기록하는 측정 구간이 이어지며, 워밍업이 안 된 초반 구간은 측정에서 제외한다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 구간 배경 -->
  <rect x="97" y="70" width="203" height="230" fill="#f3f4f6"/>
  <rect x="300" y="70" width="240" height="230" fill="#f3f4f6"/>
  <rect x="540" y="70" width="260" height="230" fill="#ecfdf5"/>
  <line x1="300" y1="70" x2="300" y2="300" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="540" y1="70" x2="540" y2="300" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 구간 설명 -->
  <g text-anchor="middle">
    <text x="198.5" y="100" font-size="17" font-weight="bold" fill="#111827">램프업</text>
    <text x="198.5" y="126" font-size="15" fill="#374151"><tspan x="198.5">가상 사용자를</tspan><tspan x="198.5" dy="22">서서히 증가</tspan></text>

    <text x="420" y="100" font-size="17" font-weight="bold" fill="#111827">정상 상태</text>
    <text x="420" y="126" font-size="15" fill="#374151"><tspan x="420">목표 부하 유지</tspan><tspan x="420" dy="22">(예: 5분)</tspan></text>

    <text x="670" y="100" font-size="17" font-weight="bold" fill="#047857">측정 구간</text>
    <text x="670" y="126" font-size="15" fill="#111827"><tspan x="670">이 구간의 p50/p95/p99와</tspan><tspan x="670" dy="22">에러율을 기록한다</tspan></text>
  </g>

  <!-- 부하 곡선 -->
  <polyline points="96,300 300,190 800,190" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>

  <!-- 축 -->
  <line x1="96" y1="300" x2="96" y2="62" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="96" y="46" font-size="15" fill="#374151" text-anchor="middle">가상 사용자 수</text>
  <line x1="96" y1="300" x2="812" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="820" y="306" font-size="16" font-weight="bold" fill="#111827">시간</text>

  <!-- 측정 제외 / 포함 -->
  <path d="M98,316 V328 H538 V316" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="318" y="354" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">워밍업이 안 된 초반 구간은 측정에서 제외한다</text>
  <path d="M542,316 V328 H798 V316" fill="none" stroke="#047857" stroke-width="1.5"/>
  <text x="670" y="354" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">이 구간만 측정</text>
</svg>
