<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">6. 부하 테스트</title>
  <desc id="d">부하 테스트의 램프업, 정상 상태, 측정 구간 및 시간축을 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 배경 구간 (면) -->
  <!-- 워밍업 제외 구간 (램프업 + 정상 상태) -->
  <rect x="50" y="30" width="460" height="180" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- 측정 구간 -->
  <rect x="540" y="30" width="290" height="180" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>

  <!-- 상단 그룹 박스 (1: 램프업) -->
  <rect x="70" y="50" width="180" height="100" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="160" y="77.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[램프업]</text>
  <text x="160" y="103.55" font-size="13" fill="#52606d" text-anchor="middle">가상 사용자를</text>
  <text x="160" y="123.55" font-size="13" fill="#52606d" text-anchor="middle">서서히 증가</text>

  <!-- 상단 그룹 박스 (2: 정상 상태) -->
  <rect x="300" y="50" width="180" height="100" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="390" y="77.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[정상 상태]</text>
  <text x="390" y="103.55" font-size="13" fill="#52606d" text-anchor="middle">목표 부하 유지</text>
  <text x="390" y="123.55" font-size="13" fill="#52606d" text-anchor="middle">(예: 5분)</text>

  <!-- 상단 그룹 박스 (3: 측정 구간) -->
  <rect x="560" y="50" width="250" height="100" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="685" y="77.6" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">[측정 구간]</text>
  <text x="685" y="103.55" font-size="13" fill="#1f2933" text-anchor="middle">이 구간의 p50/p95/p99와</text>
  <text x="685" y="123.55" font-size="13" fill="#1f2933" text-anchor="middle">에러율을 기록한다</text>

  <!-- 수직 연결선 (│ 및 ┴ 표시 위치로 내림) -->
  <path d="M160,150 L160,230" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M390,150 L390,230" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M685,150 L685,230" stroke="#059669" stroke-width="1.5" fill="none"/>

  <!-- 시간 축 (───┴──────────────┴──────────────────────┴───► 시간) -->
  <path d="M50,230 L800,230" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
  
  <!-- 시간 축 눈금 (┴) -->
  <path d="M160,223 L160,237" stroke="#1f2933" stroke-width="2"/>
  <path d="M390,223 L390,237" stroke="#1f2933" stroke-width="2"/>
  <path d="M685,223 L685,237" stroke="#059669" stroke-width="2"/>

  <!-- 시간 축 라벨 -->
  <text x="815" y="234.55" font-size="13" font-weight="bold" fill="#1f2933">시간</text>

  <!-- 하단 설명 문구 -->
  <text x="270" y="284.55" font-size="13" fill="#dc2626" font-weight="bold">워밍업이 안 된 초반 구간은 측정에서 제외한다</text>
  <!-- 하단 제외 구간 표시 화살표/주석선 -->
  <path d="M50,260 L490,260" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
</svg>