<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">응답 지연 증가 — 커넥션 풀 사이즈 안티패턴과 개선</title>
  <desc id="d">커넥션 풀 사이즈를 20에서 100으로 올리면 DB 동시 접속이 5배가 되어 DB CPU가 포화되고 장애가 확대된다. 개선은 풀 대기 시간과 쿼리 실행 시간을 분리 측정한 뒤, 대기가 길고 쿼리가 짧으면 커넥션을 오래 쥐는 코드를, 쿼리가 길면 인덱스·쿼리를 고치는 것이다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="700" fill="#ffffff"/>

  <!-- 안티패턴 -->
  <rect x="24" y="24" width="832" height="252" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="44" y="44" width="92" height="34" rx="17" fill="#b91c1c"/>
  <text x="90" y="67" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">안티패턴</text>
  <text x="152" y="68" font-size="19" font-weight="bold" fill="#7f1d1d">“느리니까 커넥션 풀 사이즈를 20 → 100으로 올린다”</text>

  <text x="44" y="116" font-size="16" font-weight="bold" fill="#b91c1c">왜 문제인가</text>
  <text x="152" y="116" font-size="15" fill="#1f2937">느린 원인이 쿼리라면 커넥션이 늘어도 쿼리는 그대로 느리다.</text>

  <rect x="44" y="140" width="174" height="64" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="131" y="166" font-size="15" fill="#1f2937" text-anchor="middle">풀 사이즈</text>
  <text x="131" y="190" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">20 → 100</text>

  <rect x="250" y="140" width="174" height="64" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="337" y="166" font-size="15" fill="#1f2937" text-anchor="middle">DB 동시 접속</text>
  <text x="337" y="190" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">5배</text>

  <rect x="456" y="140" width="174" height="64" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="543" y="166" font-size="15" fill="#1f2937" text-anchor="middle">DB CPU</text>
  <text x="543" y="190" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">포화</text>

  <rect x="662" y="140" width="174" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="749" y="166" font-size="15" fill="#1f2937" text-anchor="middle">전체가 함께 느려져</text>
  <text x="749" y="190" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">장애 확대</text>

  <path d="M221,172 H246" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M427,172 H452" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M633,172 H658" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <text x="44" y="244" font-size="15" font-weight="bold" fill="#7f1d1d">실제로 풀 사이즈를 줄여야 나아지는 경우도 흔하다.</text>

  <!-- 개선 -->
  <rect x="24" y="300" width="832" height="376" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <rect x="44" y="327" width="72" height="34" rx="17" fill="#047857"/>
  <text x="80" y="350" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">개선</text>

  <rect x="150" y="318" width="580" height="52" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="350" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">① 풀 대기 시간과 쿼리 실행 시간을 분리해서 측정한다</text>

  <path d="M440,370 V392 H240 V416" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M440,392 H640 V416" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <!-- ② 조건 -->
  <rect x="48" y="420" width="384" height="104" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="68" y="450" font-size="16" font-weight="bold" fill="#111827">② 대기가 길고 쿼리가 짧으면</text>
  <text x="68" y="482" font-size="15" fill="#374151">풀 대기</text>
  <rect x="160" y="470" width="200" height="14" rx="3" fill="#6b7280"/>
  <text x="372" y="482" font-size="14" fill="#374151">길다</text>
  <text x="68" y="510" font-size="15" fill="#374151">쿼리 실행</text>
  <rect x="160" y="498" width="32" height="14" rx="3" fill="#6b7280"/>
  <text x="204" y="510" font-size="14" fill="#374151">짧다</text>

  <!-- ③ 조건 -->
  <rect x="448" y="420" width="384" height="104" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="468" y="450" font-size="16" font-weight="bold" fill="#111827">③ 쿼리가 길면</text>
  <text x="468" y="496" font-size="15" fill="#374151">쿼리 실행</text>
  <rect x="560" y="484" width="200" height="14" rx="3" fill="#6b7280"/>
  <text x="772" y="496" font-size="14" fill="#374151">길다</text>

  <path d="M240,524 V554" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M640,524 V554" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <!-- 조치 -->
  <rect x="48" y="558" width="384" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="240" y="593" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">커넥션을 오래 쥐는 코드를 찾는다</text>
  <text x="240" y="623" font-size="15" fill="#1f2937" text-anchor="middle">(트랜잭션 안의 외부 API 호출이 1순위 용의자)</text>

  <rect x="448" y="558" width="384" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="640" y="593" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">인덱스·쿼리를 고친다</text>
  <text x="640" y="623" font-size="15" fill="#1f2937" text-anchor="middle">풀 사이즈는 마지막에 만진다</text>
</svg>
