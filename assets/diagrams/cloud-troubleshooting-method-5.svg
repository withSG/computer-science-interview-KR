<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">응답 지연 증가 - 안티패턴과 개선 방안</title>
  <desc id="d">응답 지연 증가 시 커넥션 풀을 무작정 늘리는 안티패턴의 문제점과 이를 해결하기 위한 3단계 개선 측정 절차를 설명하는 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  
  <!-- 전체 배경 -->
  <rect width="880" height="610" fill="#ffffff"/>

  <!-- 안티패턴 영역 -->
  <g id="anti-pattern-group">
    <rect x="24" y="20" width="832" height="230" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/>
    <rect x="40" y="36" width="800" height="36" fill="#dc2626" rx="4"/>
    <text x="56" y="58.55" fill="#ffffff" font-size="14" font-weight="bold">안티패턴: "느리니까 커넥션 풀 사이즈를 20 → 100으로 올린다"</text>

    <!-- 왜 문제인가 -->
    <text x="56" y="98.55" fill="#dc2626" font-size="14" font-weight="bold">왜 문제인가:</text>
    
    <text x="72" y="123.55" fill="#1f2933" font-size="13">느린 원인이 쿼리라면 커넥션이 늘어도 쿼리는 그대로 느리다.</text>
    <text x="72" y="147.55" fill="#1f2933" font-size="13">오히려 DB에 동시 접속이 5배 들어가 DB CPU가 포화되고,</text>
    <text x="72" y="171.55" fill="#1f2933" font-size="13">전체가 함께 느려져 장애가 확대된다.</text>
    <text x="72" y="195.55" fill="#1f2933" font-size="13">실제로 풀 사이즈를 줄여야 나아지는 경우도 흔하다.</text>
  </g>

  <!-- 개선 영역 -->
  <g id="improvement-group">
    <rect x="24" y="270" width="832" height="316" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="8"/>
    <rect x="40" y="286" width="800" height="36" fill="#059669" rx="4"/>
    <text x="56" y="308.55" fill="#ffffff" font-size="14" font-weight="bold">개선:</text>

    <!-- 1) 측정 -->
    <g id="step-1">
      <rect x="56" y="336" width="768" height="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="4"/>
      <text x="72" y="360.55" fill="#1f2933" font-size="13" font-weight="bold">1) 풀 대기 시간과 쿼리 실행 시간을 분리해서 측정한다</text>
    </g>

    <!-- 2) 대기가 길고 쿼리가 짧은 경우 -->
    <g id="step-2">
      <rect x="56" y="390" width="768" height="88" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="4"/>
      
      <text x="72" y="416.55" fill="#1f2933" font-size="13" font-weight="bold">2) 대기가 길고 쿼리가 짧으면</text>
      
      <path d="M 265 412 L 297 412" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
      
      <text x="310" y="416.55" fill="#2563eb" font-size="13" font-weight="bold">커넥션을 오래 쥐는 코드를 찾는다</text>
      <text x="88" y="452.55" fill="#52606d" font-size="13">(트랜잭션 안의 외부 API 호출이 1순위 용의자)</text>
    </g>

    <!-- 3) 쿼리가 긴 경우 -->
    <g id="step-3">
      <rect x="56" y="492" width="768" height="78" fill="#ffffff" stroke="#9aa5b1" stroke-width="1" rx="4"/>
      
      <text x="72" y="523.55" fill="#1f2933" font-size="13" font-weight="bold">3) 쿼리가 길면</text>
      
      <path d="M 180 519 L 212 519" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
      
      <text x="225" y="523.55" fill="#1f2933" font-size="13">인덱스·쿼리를 고친다. 풀 사이즈는 마지막에 만진다</text>
    </g>
  </g>
</svg>