<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배포 후 장애 대응 프로세스</title>
  <desc id="d">1 롤백 먼저(원인 분석은 나중) → 5분 이내 2 상황 전파 → 3 롤백 실행 → 복구 확인 뒤 4 원인 분석(사후) → 5 Postmortem 작성으로 이어지는 다섯 단계 흐름.</desc>
  <rect width="880" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 흐름 척추 화살표 -->
  <path d="M52,83 L52,165" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M52,207 L52,269" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M52,311 L52,418" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M52,460 L52,535" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 전이 조건 -->
  <text x="72" y="130" font-size="15" font-weight="bold" fill="#b45309">5분 이내</text>
  <text x="72" y="364" font-size="15" font-weight="bold" fill="#047857">복구 확인</text>
  <path d="M160,358 L856,358" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>

  <!-- 1. 롤백 먼저 -->
  <rect x="96" y="24" width="760" height="76" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="52" cy="62" r="18" fill="#b91c1c"/>
  <text x="52" y="68" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="116" y="57" font-size="20" font-weight="bold" fill="#b91c1c">롤백 먼저!</text>
  <text x="116" y="85" font-size="16" fill="#7f1d1d">(원인 분석은 나중)</text>
  <text x="380" y="68" font-size="18" font-weight="bold" fill="#111827">“서비스 복구가 최우선”</text>

  <!-- 2. 상황 전파 -->
  <rect x="96" y="148" width="760" height="76" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <circle cx="52" cy="186" r="18" fill="#b45309"/>
  <text x="52" y="192" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="116" y="192" font-size="18" font-weight="bold" fill="#111827">상황 전파</text>
  <text x="380" y="179" font-size="16" fill="#1f2937">· Slack 장애 채널 알림</text>
  <text x="380" y="205" font-size="16" fill="#1f2937">· 관련자 소집</text>

  <!-- 3. 롤백 실행 -->
  <rect x="96" y="252" width="760" height="76" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <circle cx="52" cy="290" r="18" fill="#b45309"/>
  <text x="52" y="296" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="116" y="296" font-size="18" font-weight="bold" fill="#111827">롤백 실행</text>
  <text x="380" y="283" font-size="16" fill="#1f2937">· <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl rollout undo</tspan></text>
  <text x="380" y="309" font-size="16" fill="#1f2937">· 이전 이미지 태그로 재배포</text>

  <!-- 4. 원인 분석 (사후) -->
  <rect x="96" y="388" width="760" height="102" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="52" cy="439" r="18" fill="#1d4ed8"/>
  <text x="52" y="445" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="116" y="445" font-size="18" font-weight="bold" fill="#111827">원인 분석 (사후)</text>
  <text x="380" y="419" font-size="16" fill="#1f2937">· 로그/메트릭 분석</text>
  <text x="380" y="445" font-size="16" fill="#1f2937">· 변경사항 리뷰</text>
  <text x="380" y="471" font-size="16" fill="#1f2937">· 재현 테스트</text>

  <!-- 5. Postmortem 작성 -->
  <rect x="96" y="518" width="760" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="52" cy="556" r="18" fill="#1d4ed8"/>
  <text x="52" y="562" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="116" y="562" font-size="18" font-weight="bold" fill="#111827">Postmortem 작성</text>
  <text x="380" y="549" font-size="16" fill="#1f2937">· 타임라인 정리</text>
  <text x="380" y="575" font-size="16" fill="#1f2937">· 재발 방지 Action Items</text>
</svg>
