<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AVL LR 케이스의 이중 회전</title>
  <desc id="d">왼쪽 자식 x의 오른쪽에 y가 붙은 지그재그(LR) 모양을, ① x를 좌회전해 일직선(LL)으로 만든 뒤 ② z를 우회전해 y가 루트이고 x와 z가 자식인 균형 트리로 복구하는 과정.</desc>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
  </defs>
  <text x="24" y="40" font-size="18" font-weight="bold" fill="#1f2933">LR 케이스: 지그재그라 한 번에 펼 수 없어 두 번 회전</text>
  <rect x="24" y="62" width="190" height="246" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="119" y="92" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2933">지그재그 (LR)</text>
  <rect x="345" y="62" width="190" height="246" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="440" y="92" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2933">일직선 (LL)</text>
  <rect x="666" y="62" width="190" height="246" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="761" y="92" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2933">균형 복구</text>
  <line x1="128.6" y1="155.9" x2="109.4" y2="184.1" stroke="#6b7280" stroke-width="2"/>
  <line x1="109.4" y1="223.9" x2="128.6" y2="252.1" stroke="#6b7280" stroke-width="2"/>
  <circle cx="142" cy="136" r="22" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="142" y="142.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933">z</text>
  <circle cx="96" cy="204" r="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
  <text x="96" y="210.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#1d4ed8">x</text>
  <circle cx="142" cy="272" r="22" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="142" y="278.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933">y</text>
  <line x1="472.6" y1="155.9" x2="453.4" y2="184.1" stroke="#6b7280" stroke-width="2"/>
  <line x1="426.6" y1="223.9" x2="407.4" y2="252.1" stroke="#6b7280" stroke-width="2"/>
  <circle cx="486" cy="136" r="22" fill="#ecfdf5" stroke="#047857" stroke-width="4"/>
  <text x="486" y="142.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#047857">z</text>
  <circle cx="440" cy="204" r="22" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="440" y="210.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933">y</text>
  <circle cx="394" cy="272" r="22" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="394" y="278.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933">x</text>
  <line x1="746.4" y1="189.1" x2="723.6" y2="218.9" stroke="#6b7280" stroke-width="2"/>
  <line x1="775.6" y1="189.1" x2="798.4" y2="218.9" stroke="#6b7280" stroke-width="2"/>
  <circle cx="761" cy="170" r="22" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="761" y="176.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933">y</text>
  <circle cx="709" cy="238" r="22" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="709" y="244.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933">x</text>
  <circle cx="813" cy="238" r="22" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="813" y="244.5" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2933">z</text>
  <line x1="226" y1="204" x2="333" y2="204" stroke="#1d4ed8" stroke-width="3" marker-end="url(#mb)"/>
  <text x="279.5" y="188" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4ed8">① x를 좌회전</text>
  <text x="279.5" y="236" font-size="14" text-anchor="middle" fill="#4b5563">LR → LL</text>
  <line x1="547" y1="204" x2="654" y2="204" stroke="#047857" stroke-width="3" marker-end="url(#mg)"/>
  <text x="600.5" y="188" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">② z를 우회전</text>
  <text x="600.5" y="236" font-size="14" text-anchor="middle" fill="#4b5563">LL → 균형</text>
</svg>
