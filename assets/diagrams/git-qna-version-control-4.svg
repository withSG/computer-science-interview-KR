<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Git 영역과 이동 명령</title>
  <desc id="d">Working Directory에서 git add로 Staging Area, git commit으로 Local Repo, git push로 Remote Repo까지 변경이 옮겨 가는 네 영역의 흐름.</desc>
  <rect width="880" height="180" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. Working Directory -->
  <rect x="24" y="38" width="133" height="104" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="90.5" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Working</text>
  <text x="90.5" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Directory</text>
  <text x="90.5" y="120" text-anchor="middle" font-size="14" fill="#4b5563">작업 디렉터리</text>

  <!-- 2. Staging Area -->
  <rect x="257" y="38" width="133" height="104" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="323.5" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Staging</text>
  <text x="323.5" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">Area</text>
  <text x="323.5" y="120" text-anchor="middle" font-size="14" fill="#92400e">스테이징 영역</text>

  <!-- 3. Local Repo -->
  <rect x="490" y="38" width="133" height="104" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="556.5" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Local</text>
  <text x="556.5" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Repo</text>
  <text x="556.5" y="120" text-anchor="middle" font-size="14" fill="#1e40af">로컬 저장소</text>

  <!-- 4. Remote Repo -->
  <rect x="723" y="38" width="133" height="104" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="789.5" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">Remote</text>
  <text x="789.5" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">Repo</text>
  <text x="789.5" y="120" text-anchor="middle" font-size="14" fill="#5b21b6">원격 저장소</text>

  <!-- arrows + commands -->
  <text x="207" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git add</text>
  <line x1="165" y1="100" x2="247" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="440" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git commit</text>
  <line x1="398" y1="100" x2="480" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="673" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">git push</text>
  <line x1="631" y1="100" x2="713" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
</svg>
