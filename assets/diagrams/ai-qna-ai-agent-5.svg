<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">조건부 엣지 동작 흐름</title>
  <desc id="d">model 노드 뒤 라우팅 함수가 도구 필요 여부를 판단해 yes면 tools 노드로, no면 END로 보낸다. tools는 다시 model로 돌아가 model과 tools 사이에 순환(cycle)이 생긴다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- model 노드 -->
  <rect x="56" y="68" width="160" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="136" y="96" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">model</text>
  <text x="136" y="119" font-size="15" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">call_model</text>

  <!-- model → 라우팅 -->
  <line x1="216" y1="100" x2="306" y2="100" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ao)"/>

  <!-- 라우팅 함수 (도구 필요?) -->
  <polygon points="310,100 440,40 570,100 440,160" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="97" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">도구 필요?</text>
  <text x="440" y="120" font-size="15" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">should_continue</text>

  <!-- no → END -->
  <line x1="570" y1="100" x2="676" y2="100" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ao)"/>
  <text x="623" y="88" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">no</text>
  <rect x="680" y="72" width="144" height="56" rx="28" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="752" y="106" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">END</text>

  <!-- yes → tools -->
  <line x1="440" y1="160" x2="440" y2="224" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ao)"/>
  <text x="454" y="198" font-size="16" font-weight="bold" fill="#b45309">yes</text>

  <!-- tools 노드 -->
  <rect x="360" y="228" width="160" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="256" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">tools</text>
  <text x="440" y="279" font-size="15" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">call_tools</text>

  <!-- tools → model (순환) -->
  <path d="M360,260 L136,260 L136,136" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="252" y="196" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">순환(cycle)</text>
  <text x="252" y="222" font-size="15" fill="#4b5563" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">model</tspan> ↔ <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">tools</tspan></text>

  <!-- 범례 -->
  <line x1="24" y1="316" x2="856" y2="316" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="40" y1="344" x2="84" y2="344" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="96" y="349" font-size="15" fill="#111827">조건부 엣지 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#92400e">add_conditional_edges</tspan></text>
  <line x1="480" y1="344" x2="524" y2="344" stroke="#1d4ed8" stroke-width="2"/>
  <text x="536" y="349" font-size="15" fill="#111827">정적 엣지 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#1d4ed8">add_edge</tspan></text>
</svg>
