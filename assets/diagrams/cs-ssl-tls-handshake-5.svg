<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SNI 유무 비교</title>
  <desc id="d">SNI 없이는 첫 메시지에 도메인 정보가 없어 서버가 어떤 인증서를 보낼지 알 수 없고 IP당 도메인 하나만 가능하다. SNI를 쓰면 ClientHello의 server_name = shop.example.com 을 보고 서버가 shop.example.com용 인증서를 고른다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 가운데 구분선 -->
  <line x1="440" y1="24" x2="440" y2="436" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ══ 왼쪽: SNI 없이 -->
  <rect x="24" y="24" width="404" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="226" y="51" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">SNI 없이</text>

  <!-- Client -->
  <rect x="24" y="84" width="404" height="128" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="100" width="84" height="28" rx="14" fill="#1f2937"/>
  <text x="82" y="119" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Client</text>
  <text x="44" y="158" font-size="16" fill="#111827">(TLS 시작)</text>
  <path d="M52,166 V186 H62" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="66" y="172" width="170" height="28" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="80" y="191" font-size="15" fill="#4b5563">server_name 없음</text>

  <line x1="226" y1="216" x2="226" y2="250" stroke="#4b5563" stroke-width="2" marker-end="url(#m-gray)"/>

  <!-- Server -->
  <rect x="24" y="256" width="404" height="88" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="272" width="84" height="28" rx="14" fill="#1f2937"/>
  <text x="82" y="291" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Server</text>
  <text x="44" y="328" font-size="17" font-weight="bold" fill="#b91c1c">어떤 인증서를? 알 수 없음</text>

  <line x1="226" y1="348" x2="226" y2="378" stroke="#b91c1c" stroke-width="2" marker-end="url(#m-red)"/>

  <!-- 결과 -->
  <rect x="24" y="384" width="404" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="226" y="416" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">IP당 도메인 하나만 가능</text>

  <!-- ══ 오른쪽: SNI 사용 -->
  <rect x="452" y="24" width="404" height="42" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="654" y="51" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">SNI 사용</text>

  <!-- Client -->
  <rect x="452" y="84" width="404" height="128" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="468" y="100" width="84" height="28" rx="14" fill="#1f2937"/>
  <text x="510" y="119" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Client</text>
  <text x="472" y="158" font-size="16" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ClientHello</text>
  <path d="M480,166 V186 H490" fill="none" stroke="#047857" stroke-width="1.5"/>
  <rect x="494" y="172" width="300" height="28" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="508" y="191" font-size="15" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">server_name = shop.example.com</text>

  <line x1="654" y1="216" x2="654" y2="250" stroke="#4b5563" stroke-width="2" marker-end="url(#m-gray)"/>

  <!-- Server -->
  <rect x="452" y="256" width="404" height="88" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="468" y="272" width="84" height="28" rx="14" fill="#1f2937"/>
  <text x="510" y="291" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Server</text>
  <text x="472" y="328" font-size="17" font-weight="bold" fill="#047857">shop.example.com용 인증서 선택</text>
</svg>
