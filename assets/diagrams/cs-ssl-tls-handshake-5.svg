<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SNI — 한 IP에 여러 도메인이 있을 때</title>
  <desc id="d">SNI 미사용 시와 사용 시의 TLS ClientHello 및 인증서 선택 동작 비교 다이어그램</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- [SNI 없이] 영역 -->
  <rect x="24" y="20" width="404" height="250" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="40" y="36" width="110" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="95" y="55" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">[SNI 없이]</text>

  <!-- [SNI 없이] 내용 -->
  <text x="48" y="100" font-size="13" font-weight="bold" fill="#1f2933">Client:</text>
  <text x="100" y="100" font-size="13" fill="#52606d">(TLS 시작)</text>

  <text x="48" y="152" font-size="13" font-weight="bold" fill="#1f2933">Server:</text>
  <text x="100" y="152" font-size="13" font-weight="bold" fill="#dc2626">어떤 인증서를? 알 수 없음</text>

  <!-- [SNI 없이] 트리/화살표 표현 -->
  <path d="M100,172 L100,196 L118,196" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="130" y="200" font-size="13" font-weight="bold" fill="#dc2626">IP당 도메인 하나만 가능</text>


  <!-- [SNI 사용] 영역 -->
  <rect x="452" y="20" width="404" height="250" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="468" y="36" width="110" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="523" y="55" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">[SNI 사용]</text>

  <!-- [SNI 사용] 내용 -->
  <text x="476" y="100" font-size="13" font-weight="bold" fill="#1f2933">Client:</text>
  <text x="528" y="100" font-size="13" font-weight="bold" fill="#2563eb">ClientHello</text>

  <!-- 트리 구조 └ -->
  <path d="M528,118 L528,136 L542,136" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="548" y="140" font-size="13" fill="#059669" font-weight="bold">server_name = shop.example.com</text>

  <text x="476" y="192" font-size="13" font-weight="bold" fill="#1f2933">Server:</text>
  <text x="528" y="192" font-size="13" font-weight="bold" fill="#059669">shop.example.com용 인증서 선택</text>
</svg>