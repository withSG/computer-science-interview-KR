<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LangGraph 에이전트 그래프</title>
  <desc id="d">START에서 model 노드로 가고, model은 도구 호출이 있으면 tools로, 없으면 END로 갑니다. tools는 결과를 State에 넣고 다시 model로 돌아가며, 이 순환이 ReAct 루프입니다. 실선은 무조건 가는 add_edge, 점선은 State를 보고 갈림길을 고르는 add_conditional_edges입니다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- START -->
  <rect x="180" y="24" width="120" height="40" rx="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="240" y="50" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">START</text>
  <path d="M240,64 L240,120" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- model -->
  <rect x="150" y="124" width="180" height="72" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="240" y="156" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">model</text>
  <text x="240" y="181" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">call_model</text>

  <!-- tools -->
  <rect x="560" y="124" width="180" height="72" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="650" y="156" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">tools</text>
  <text x="650" y="181" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ToolNode(tools)</text>

  <!-- model -> tools (조건부) -->
  <path d="M330,160 L556,160" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ahp)"/>
  <text x="445" y="146" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">도구 호출 있음</text>

  <!-- tools -> model (무조건, 순환) -->
  <path d="M650,196 L650,262 L290,262 L290,200" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ahp)"/>
  <text x="470" y="288" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">결과를 State에 넣고 다시 model로</text>

  <!-- 순환 표시 -->
  <text x="470" y="236" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">이 순환이 ReAct 루프</text>

  <!-- model -> END (조건부) -->
  <path d="M240,196 L240,326" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ah)"/>
  <text x="226" y="272" font-size="15" font-weight="bold" fill="#374151" text-anchor="end">도구 호출 없음</text>

  <!-- END -->
  <rect x="180" y="330" width="120" height="40" rx="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="240" y="356" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">END</text>

  <!-- 범례 -->
  <rect x="40" y="402" width="800" height="94" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <path d="M64,432 L124,432" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="140" y="438" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">add_edge</text>
  <text x="360" y="438" font-size="16" fill="#111827">무조건 가는 길</text>
  <path d="M64,468 L124,468" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  <text x="140" y="474" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">add_conditional_edges</text>
  <text x="360" y="474" font-size="16" fill="#111827">State를 보고 갈림길을 고르는 길</text>
</svg>
