<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Non-Repeatable Read: 두 조회 사이의 UPDATE로 값이 바뀜</title>
  <desc id="d">트랜잭션 A가 id=1 행을 두 번 SELECT하는 사이 트랜잭션 B가 값을 2000으로 UPDATE하고 COMMIT해서, A의 첫 조회는 1000, 두 번째 조회는 2000으로 결과가 달라지는 Non-Repeatable Read를 시간 순서로 보여준다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 시간 축 표시 -->
  <text x="856" y="30" font-size="14" fill="#4b5563" text-anchor="end">시간 →</text>

  <!-- 레인 선 -->
  <path d="M148,96 L852,96" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr-ink)"/>
  <path d="M148,240 L852,240" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr-ink)"/>

  <!-- B의 커밋이 A의 타임라인에 끼어듦 -->
  <path d="M580,216 L580,101" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr-org)"/>

  <!-- 레인 라벨 -->
  <rect x="24" y="76" width="124" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="86" y="101.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">트랜잭션 A</text>
  <rect x="24" y="220" width="124" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="86" y="245.5" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">트랜잭션 B</text>

  <!-- ① 1차 조회 -->
  <text x="172" y="56" font-size="15" font-weight="bold" fill="#1d4ed8">① 1차 조회</text>
  <rect x="172" y="66" width="180" height="60" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="262" y="89" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SELECT id=1</text>
  <text x="262" y="115" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">→ 1000</text>

  <!-- ② B의 UPDATE + COMMIT -->
  <text x="380" y="206" font-size="15" font-weight="bold" fill="#b45309">② 값 변경</text>
  <rect x="380" y="216" width="240" height="48" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="500" y="245.5" font-size="16" font-weight="bold" fill="#7c2d12" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">UPDATE 2000 + COMMIT</text>

  <!-- ③ 2차 조회 -->
  <text x="640" y="56" font-size="15" font-weight="bold" fill="#b91c1c">③ 2차 조회 (같은 행)</text>
  <rect x="640" y="66" width="180" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="730" y="89" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SELECT id=1</text>
  <text x="730" y="115" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">→ 2000</text>

  <!-- 요점 -->
  <rect x="24" y="294" width="832" height="44" rx="8" fill="#f3f4f6"/>
  <text x="440" y="321.5" font-size="16" fill="#111827" text-anchor="middle">A는 아무것도 안 했는데 같은 행의 <tspan font-weight="bold">값</tspan>이 1000 → 2000 · 원인은 두 조회 사이의 <tspan font-weight="bold">UPDATE + COMMIT</tspan></text>
</svg>
