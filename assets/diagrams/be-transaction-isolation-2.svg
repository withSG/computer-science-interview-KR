<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Non-Repeatable Read 현상 시퀀스</title>
  <desc id="d">트랜잭션 A가 같은 행을 두 번 조회하는 사이에 트랜잭션 B가 값을 업데이트하고 커밋하여 두 조회 결과가 다르게 나타나는 현상을 보여주는 시퀀스 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Legend -->
  <rect x="580" y="20" width="260" height="40" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <rect x="595" y="33" width="14" height="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="615" y="45" font-size="12" fill="#1f2933">트랜잭션 A (조회)</text>
  <rect x="725" y="33" width="14" height="14" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="745" y="45" font-size="12" fill="#1f2933">트랜잭션 B (변경)</text>

  <!-- Track Labels -->
  <!-- Label Widths: "트랜잭션 A" = 100px + 24px = 124px -> 130px -->
  <rect x="40" y="80" width="130" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="105" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">트랜잭션 A</text>

  <rect x="40" y="200" width="130" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="105" y="225" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">트랜잭션 B</text>

  <!-- Timeline Base Axes -->
  <path d="M170,100 L840,100" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M170,220 L840,220" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Transaction A - Operation 1: [SELECT id=1 → 1000] -->
  <!-- Width: "SELECT id=1 → 1000" (17.7 chars * ~7 + 24) = ~170px -->
  <line x1="200" y1="100" x2="370" y2="100" stroke="#2563eb" stroke-width="3"/>
  <rect x="200" y="80" width="170" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="285" y="105" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">SELECT id=1 → 1000</text>

  <!-- Transaction B - Operation: [UPDATE 2000 + COMMIT] -->
  <!-- Width: "UPDATE 2000 + COMMIT" (20 chars * ~8 + 24) = ~190px -->
  <line x1="400" y1="220" x2="590" y2="220" stroke="#d97706" stroke-width="3"/>
  <rect x="400" y="200" width="190" height="40" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="495" y="225" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">UPDATE 2000 + COMMIT</text>

  <!-- Vertical Dependency Connection from Transaction B to A -->
  <path d="M495,200 L495,120" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Transaction A - Operation 2: [SELECT id=1 → 2000] -->
  <!-- Width: "SELECT id=1 → 2000" = 170px -->
  <line x1="620" y1="100" x2="790" y2="100" stroke="#2563eb" stroke-width="3"/>
  <rect x="620" y="80" width="170" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="705" y="105" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">SELECT id=1 → 2000</text>

  <!-- Horizontal Timeline Connectors for A -->
  <path d="M370,100 L620,100" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-blue)"/>
  <path d="M170,100 L200,100" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M790,100 L830,100" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- Horizontal Timeline Connectors for B -->
  <path d="M170,220 L400,220" stroke="#d97706" stroke-width="1.5"/>
  <path d="M590,220 L830,220" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/>

  <!-- Time Flow Indicator at Bottom -->
  <path d="M170,280 L830,280" stroke="#52606d" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="470" y="271" width="50" height="18" fill="#ffffff"/>
  <text x="495" y="284" font-size="11.5" fill="#52606d" text-anchor="middle">시간 흐름</text>
</svg>