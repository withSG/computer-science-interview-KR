<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT 기반 인증 흐름</title>
  <desc id="d">클라이언트와 서버 간의 JWT 기반 로그인 및 요청, 검증 흐름 시퀀스 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="45" font-size="16" font-weight="bold" fill="#1f2933">JWT 기반 인증 흐름</text>

  <!-- Lifelines -->
  <!-- Client Column -->
  <rect x="140" y="70" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="95" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트</text>
  <line x1="220" y1="110" x2="220" y2="470" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Server Column -->
  <rect x="580" y="70" width="160" height="40" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="95" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서버</text>
  <line x1="660" y1="110" x2="660" y2="470" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 1: 로그인 -> 서버에서 JWT 생성 및 발급 -->
  <!-- Request Line -->
  <path d="M 220,150 L 660,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="390" y="136" width="100" height="22" fill="#ffffff"/>
  <text x="440" y="152" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">1. 로그인</text>

  <!-- Response Line -->
  <path d="M 660,190 L 220,190" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="330" y="176" width="220" height="22" fill="#ffffff"/>
  <text x="440" y="192" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">서버에서 JWT 생성 및 발급</text>

  <!-- Step 2: 클라이언트에서 토큰 저장 (localStorage/Cookie) -->
  <rect x="80" y="225" width="280" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="220" y="253" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">2. 클라이언트에서 토큰 저장 (localStorage/Cookie)</text>

  <!-- Step 3: 이후 요청 시 Authorization 헤더에 토큰 포함 -->
  <path d="M 220,330 L 660,330" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="270" y="316" width="340" height="22" fill="#ffffff"/>
  <text x="440" y="332" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">3. 이후 요청 시 Authorization 헤더에 토큰 포함</text>

  <!-- Step 4: 서버에서 토큰 검증 (서명 확인) -->
  <rect x="530" y="375" width="260" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="403" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">4. 서버에서 토큰 검증 (서명 확인)</text>
</svg>