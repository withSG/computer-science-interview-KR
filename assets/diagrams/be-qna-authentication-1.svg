<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT 기반 인증 흐름</title>
  <desc id="d">클라이언트가 로그인하면 서버가 JWT를 생성해 발급하고, 클라이언트는 토큰을 localStorage나 Cookie에 저장한다. 이후 요청마다 Authorization 헤더에 토큰을 넣어 보내면 서버가 서명을 확인해 토큰을 검증한다.</desc>
  <rect width="880" height="510" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="100" y="24" width="220" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="210" y="54" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">클라이언트</text>
  <rect x="560" y="24" width="220" height="48" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="670" y="54" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">서버</text>

  <!-- 생명선 -->
  <line x1="210" y1="72" x2="210" y2="486" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="670" y1="72" x2="670" y2="486" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 1. 로그인 → JWT 생성 및 발급 -->
  <line x1="212" y1="130" x2="666" y2="130" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <circle cx="400" cy="108" r="13" fill="#1d4ed8"/>
  <text x="400" y="113" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="422" y="114" font-size="17" font-weight="bold" fill="#1e3a8a">로그인</text>

  <rect x="596" y="148" width="148" height="40" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="670" y="174" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">JWT 생성</text>

  <line x1="668" y1="222" x2="214" y2="222" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="440" y="208" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">JWT 발급</text>

  <!-- 2. 토큰 저장 -->
  <circle cx="68" cy="272" r="13" fill="#1d4ed8"/>
  <text x="68" y="277" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="96" y="242" width="228" height="60" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="210" y="266" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">토큰 저장</text>
  <text x="210" y="290" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">localStorage / Cookie</text>

  <!-- 구분: 이후 요청 -->
  <line x1="24" y1="336" x2="856" y2="336" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="382" y="323" width="116" height="26" rx="13" fill="#f3f4f6"/>
  <text x="440" y="341" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">이후 요청 시</text>

  <!-- 3. Authorization 헤더에 토큰 포함 -->
  <line x1="212" y1="392" x2="666" y2="392" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <circle cx="302" cy="370" r="13" fill="#1d4ed8"/>
  <text x="302" y="375" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="324" y="376" font-size="17" fill="#1e3a8a"><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Authorization</tspan> 헤더에 토큰 포함</text>

  <!-- 4. 토큰 검증 -->
  <circle cx="544" cy="440" r="13" fill="#6d28d9"/>
  <text x="544" y="445" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="572" y="410" width="196" height="60" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="670" y="434" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">토큰 검증</text>
  <text x="670" y="458" font-size="15" fill="#1f2937" text-anchor="middle">서명 확인</text>
</svg>
