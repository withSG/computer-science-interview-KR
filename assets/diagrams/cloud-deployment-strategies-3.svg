<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Blue-Green 배포 단계</title>
  <desc id="d">1단계에서 LB는 Blue(v1)에 트래픽 100%를 보냅니다. 2단계에서 트래픽 없는 Green(v2)을 만들어 스모크 테스트로 검증하고, 3단계에서 LB가 100%를 Green으로 넘기며 Blue는 즉시 복귀 가능한 대기 상태로 남습니다. 4단계에서 일정 시간 관찰 후 Blue를 회수하고, 문제가 생기면 LB를 Blue로 되돌립니다.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="660" fill="#ffffff"/>

  <!-- ===== 1단계 (현재) ===== -->
  <text x="50" y="46" font-size="18" font-weight="bold" fill="#1f2937">1단계 (현재)</text>
  <rect x="50" y="62" width="240" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="90" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Blue (v1)</text>
  <rect x="63" y="104" width="46" height="32" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="86" y="125" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="119" y="104" width="46" height="32" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="142" y="125" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="175" y="104" width="46" height="32" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="198" y="125" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="231" y="104" width="46" height="32" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="254" y="125" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>

  <rect x="400" y="84" width="80" height="44" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="112" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">LB</text>
  <path d="M398,106 L294,106" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <text x="346" y="95" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">100%</text>

  <rect x="590" y="62" width="240" height="88" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="710" y="112" font-size="16" fill="#4b5563" text-anchor="middle">Green: 없음</text>

  <line x1="50" y1="172" x2="830" y2="172" stroke="#d1d5db" stroke-width="1"/>

  <!-- ===== 2단계 (Green 구축) ===== -->
  <text x="50" y="204" font-size="18" font-weight="bold" fill="#1f2937">2단계 (Green 구축)</text>
  <rect x="50" y="220" width="240" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="248" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Blue (v1)</text>
  <rect x="63" y="262" width="46" height="32" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="86" y="283" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="119" y="262" width="46" height="32" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="142" y="283" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="175" y="262" width="46" height="32" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="198" y="283" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="231" y="262" width="46" height="32" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="254" y="283" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>

  <rect x="400" y="242" width="80" height="44" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="270" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">LB</text>
  <path d="M398,264 L294,264" stroke="#1d4ed8" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <text x="346" y="253" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">100%</text>
  <text x="535" y="269" font-size="15" fill="#4b5563" text-anchor="middle">트래픽 없음</text>

  <rect x="590" y="220" width="240" height="88" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="710" y="248" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">Green (v2)</text>
  <rect x="603" y="262" width="46" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="626" y="283" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="659" y="262" width="46" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="682" y="283" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="715" y="262" width="46" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="738" y="283" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="771" y="262" width="46" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="794" y="283" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>

  <path d="M710,338 L710,314" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ak)"/>
  <text x="830" y="360" font-size="15" fill="#374151" text-anchor="end">여기서 실사용 전 검증(스모크 테스트)</text>

  <line x1="50" y1="382" x2="830" y2="382" stroke="#d1d5db" stroke-width="1"/>

  <!-- ===== 3단계 (전환) ===== -->
  <text x="50" y="414" font-size="18" font-weight="bold" fill="#1f2937">3단계 (전환)</text>
  <rect x="50" y="430" width="240" height="88" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="170" y="462" font-size="17" font-weight="bold" fill="#4b5563" text-anchor="middle">Blue (v1)</text>
  <text x="170" y="494" font-size="16" fill="#374151" text-anchor="middle">대기 (즉시 복귀 가능)</text>

  <rect x="400" y="452" width="80" height="44" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="480" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">LB</text>
  <path d="M482,474 L586,474" stroke="#047857" stroke-width="3" fill="none" marker-end="url(#ag)"/>
  <text x="534" y="463" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">100%</text>

  <rect x="590" y="430" width="240" height="88" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="710" y="458" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">Green (v2)</text>
  <rect x="603" y="472" width="46" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="626" y="493" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="659" y="472" width="46" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="682" y="493" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="715" y="472" width="46" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="738" y="493" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="771" y="472" width="46" height="32" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="794" y="493" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>

  <line x1="50" y1="540" x2="830" y2="540" stroke="#d1d5db" stroke-width="1"/>

  <!-- ===== 4단계 ===== -->
  <text x="50" y="572" font-size="18" font-weight="bold" fill="#1f2937">4단계</text>
  <text x="70" y="604" font-size="16" fill="#1f2937">• 일정 시간 관찰 후 Blue 회수</text>
  <text x="70" y="632" font-size="16" fill="#b91c1c">• 문제가 생기면 LB를 Blue로 되돌린다</text>
</svg>
