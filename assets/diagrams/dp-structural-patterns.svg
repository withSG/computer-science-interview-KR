<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 890" width="880" height="890" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">조합 폭발: 상속 2ⁿ-1개 vs 데코레이터 n개</title>
  <desc id="d">옵션 3개(Logging, Retry, Encrypting)를 상속으로 조합하면 MessageSender 아래 클래스가 7개 필요하지만, 데코레이터는 LoggingSender, RetryingSender, EncryptingSender 3개로 원본 SmsSender를 감싸 런타임에 조합한다. 아래 막대그래프는 옵션 수 n이 1에서 5로 늘 때 상속은 1, 3, 7, 15, 31개, 데코레이터는 1, 2, 3, 4, 5개임을 보여준다.</desc>
  <rect width="880" height="890" fill="#ffffff"/>

  <!-- 요점 -->
  <text x="24" y="38" font-size="19" font-weight="700" fill="#111827">옵션 n개를 조합할 때 필요한 클래스 수: 상속 2ⁿ-1개, 데코레이터 n개</text>

  <!-- ─────────── 왼쪽: 상속으로 조합 ─────────── -->
  <rect x="24" y="58" width="476" height="452" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="88" font-size="17" font-weight="700" fill="#b91c1c">상속으로 조합: 클래스 7개</text>

  <!-- 트리 선 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M64,140 V388"/>
    <path d="M64,168 H92"/>
    <path d="M64,210 H92"/>
    <path d="M64,252 H92"/>
    <path d="M64,304 H92"/>
    <path d="M64,346 H92"/>
    <path d="M64,388 H92"/>
    <path d="M112,404 V440 H136"/>
  </g>

  <!-- 루트 -->
  <rect x="44" y="106" width="170" height="34" rx="5" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="129" y="129" font-size="16" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">MessageSender</text>

  <!-- 옵션 1개 -->
  <g fill="#ffffff" stroke="#9ca3af" stroke-width="1.5">
    <rect x="92" y="152" width="170" height="32" rx="5"/>
    <rect x="92" y="194" width="170" height="32" rx="5"/>
    <rect x="92" y="236" width="170" height="32" rx="5"/>
    <rect x="92" y="288" width="170" height="32" rx="5"/>
    <rect x="92" y="330" width="170" height="32" rx="5"/>
    <rect x="92" y="372" width="170" height="32" rx="5"/>
  </g>
  <rect x="136" y="424" width="212" height="32" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <g font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="177" y="173">Logging</text>
    <text x="177" y="215">Retry</text>
    <text x="177" y="257">Encrypting</text>
    <text x="177" y="309">LoggingEncrypting</text>
    <text x="177" y="351">RetryEncrypting</text>
    <text x="177" y="393">LoggingRetry</text>
    <text x="242" y="445" fill="#b91c1c" font-weight="700">LoggingRetryEncrypting</text>
  </g>

  <!-- 묶음 괄호 -->
  <g stroke="#b91c1c" stroke-width="1.5" fill="none">
    <path d="M358,154 H366 V266 H358"/>
    <path d="M358,290 H366 V402 H358"/>
    <path d="M358,426 H366 V454 H358"/>
  </g>
  <g font-size="15" fill="#b91c1c">
    <text x="378" y="206" font-weight="700">옵션 1개</text>
    <text x="378" y="227">클래스 3개</text>
    <text x="378" y="342" font-weight="700">2개 조합</text>
    <text x="378" y="363">클래스 3개</text>
    <text x="378" y="435" font-weight="700">3개 조합</text>
    <text x="378" y="456">클래스 1개</text>
  </g>

  <text x="44" y="490" font-size="15" font-weight="700" fill="#b91c1c">컴파일 시점에 조합이 고정됨 (런타임 유연성 없음)</text>

  <!-- ─────────── 오른쪽: 데코레이터로 조합 ─────────── -->
  <rect x="516" y="58" width="340" height="452" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="536" y="88" font-size="17" font-weight="700" fill="#1d4ed8">데코레이터로 조합: 클래스 3개 + 원본</text>

  <!-- 중첩(감싸기) -->
  <rect x="536" y="112" width="300" height="262" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="554" y="164" width="264" height="192" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="572" y="216" width="228" height="122" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="590" y="268" width="192" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <g font-size="16" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="552" y="142">LoggingSender</text>
    <text x="570" y="194">RetryingSender</text>
    <text x="588" y="246">EncryptingSender</text>
  </g>
  <text x="686" y="299" font-size="16" font-weight="700" fill="#047857" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SmsSender</tspan> (원본)</text>

  <text x="536" y="412" font-size="15" fill="#374151">바깥에서 안쪽으로 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">inner.doWork()</tspan>로 위임</text>
  <text x="536" y="490" font-size="15" font-weight="700" fill="#1d4ed8">런타임에 동적으로 조합 가능</text>

  <!-- ─────────── 아래: 옵션 수에 따른 클래스 수 ─────────── -->
  <rect x="24" y="530" width="832" height="336" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="562" font-size="17" font-weight="700" fill="#111827">옵션 수(n)에 따른 클래스 수</text>

  <!-- 범례 -->
  <rect x="590" y="549" width="16" height="16" rx="2" fill="#f87171"/>
  <text x="612" y="562" font-size="15" fill="#111827">상속 (2ⁿ-1)</text>
  <rect x="712" y="549" width="16" height="16" rx="2" fill="#60a5fa"/>
  <text x="734" y="562" font-size="15" fill="#111827">데코레이터 (n)</text>

  <!-- 예시 강조 (n = 3) -->
  <rect x="374" y="588" width="132" height="244" rx="6" fill="#fef9c3"/>

  <!-- 막대 (1 = 5px, 바닥 y=790) -->
  <g fill="#f87171">
    <rect x="92" y="785" width="40" height="5"/>
    <rect x="244" y="775" width="40" height="15"/>
    <rect x="396" y="755" width="40" height="35"/>
    <rect x="548" y="715" width="40" height="75"/>
    <rect x="700" y="635" width="40" height="155"/>
  </g>
  <g fill="#60a5fa">
    <rect x="140" y="785" width="40" height="5"/>
    <rect x="292" y="780" width="40" height="10"/>
    <rect x="444" y="775" width="40" height="15"/>
    <rect x="596" y="770" width="40" height="20"/>
    <rect x="748" y="765" width="40" height="25"/>
  </g>
  <path d="M60,790 H820" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 값 라벨 -->
  <g font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">
    <text x="112" y="777">1</text>
    <text x="264" y="767">3</text>
    <text x="416" y="747">7</text>
    <text x="568" y="707">15</text>
    <text x="720" y="627">31</text>
  </g>
  <g font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    <text x="160" y="777">1</text>
    <text x="312" y="772">2</text>
    <text x="464" y="767">3</text>
    <text x="616" y="762">4</text>
    <text x="768" y="757">5</text>
  </g>

  <!-- x축 라벨 -->
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="136" y="814">n = 1</text>
    <text x="288" y="814">n = 2</text>
    <text x="440" y="814" font-weight="700" fill="#111827">n = 3</text>
    <text x="592" y="814">n = 4</text>
    <text x="744" y="814">n = 5</text>
  </g>
  <text x="440" y="605" font-size="14" fill="#374151" text-anchor="middle">위 예시</text>

  <text x="440" y="852" font-size="15" fill="#374151" text-anchor="middle">상속은 옵션이 늘 때 클래스 수가 지수적으로 폭발하고, 데코레이터는 선형(n개)으로 유지된다</text>
</svg>
