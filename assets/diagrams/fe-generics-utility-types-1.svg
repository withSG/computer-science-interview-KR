<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">any 방식과 제네릭 방식 비교</title>
  <desc id="d">같은 User[]를 넣어도 any 방식의 first()는 any를 돌려주어 입력과 출력 타입의 관계가 끊기고, 제네릭 방식의 first&lt;T&gt;()는 T = User를 기억해 User | undefined를 돌려주어 관계가 보존된다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ===== 왼쪽: any 방식 ===== -->
  <rect x="24" y="24" width="404" height="372" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="60" font-size="19" font-weight="bold" fill="#b91c1c">any 방식</text>

  <rect x="114" y="84" width="120" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="174" y="112" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">User[]</text>

  <line x1="174" y1="129" x2="174" y2="186" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="84" y="188" width="180" height="52" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="174" y="220" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">first()</text>

  <line x1="174" y1="241" x2="174" y2="294" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="114" y="296" width="120" height="46" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="174" y="325" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">any</text>
  <text x="248" y="325" font-size="15" fill="#b91c1c">← 무엇이든 될 수 있음</text>

  <!-- 관계선: 입력에서 출발했지만 first()에서 끊긴다 -->
  <path d="M235,106 H354 V196" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="306" y="198" width="96" height="32" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="354" y="220" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">관계 소실</text>

  <!-- ===== 오른쪽: 제네릭 방식 ===== -->
  <rect x="452" y="24" width="404" height="372" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="472" y="60" font-size="19" font-weight="bold" fill="#047857">제네릭 방식</text>

  <rect x="542" y="84" width="120" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="602" y="112" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">User[]</text>

  <line x1="602" y1="129" x2="602" y2="186" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="616" y="163" font-size="15" font-weight="bold" fill="#047857">T = User 로 기억</text>

  <rect x="512" y="188" width="180" height="52" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="602" y="220" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">first&lt;T&gt;()</text>

  <line x1="602" y1="241" x2="602" y2="294" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="497" y="296" width="210" height="46" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="602" y="325" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">User | undefined</text>

  <!-- 관계선: 입력 타입이 출력까지 이어진다 -->
  <path d="M663,106 H782 V196" fill="none" stroke="#059669" stroke-width="2"/>
  <rect x="734" y="198" width="96" height="32" rx="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="782" y="220" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">관계 보존</text>
  <path d="M782,231 V319 H710" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ah-green)"/>
</svg>
