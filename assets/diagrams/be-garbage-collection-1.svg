<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GC Root에서 닿는 객체만 살아남는다</title>
  <desc id="d">GC Roots(스레드 스택, static 필드, JNI 참조)에서 참조를 따라 닿는 A, B, C, D는 살아남고, D를 가리키기만 할 뿐 아무도 참조하지 않는 E는 Unreachable이라 회수 대상이 된다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 도달 가능 영역 -->
  <rect x="256" y="40" width="600" height="226" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="836" y="72" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">살아남음 (Reachable): A, B, C, D</text>

  <!-- 도달 불가 영역 -->
  <rect x="256" y="296" width="600" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="836" y="324" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="end">회수 대상 (Unreachable): E, 그리고 E만 참조하던 모든 객체</text>

  <!-- GC Roots -->
  <rect x="24" y="40" width="196" height="226" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="122" y="72" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">GC Roots</text>
  <rect x="40" y="106" width="164" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="122" y="132" font-size="16" fill="#111827" text-anchor="middle">스레드 스택</text>
  <rect x="40" y="156" width="164" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="122" y="182" font-size="16" fill="#111827" text-anchor="middle">static 필드</text>
  <rect x="40" y="206" width="164" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="122" y="232" font-size="16" fill="#111827" text-anchor="middle">JNI 참조</text>

  <!-- 참조 화살표 (살아남는 경로) -->
  <path d="M204,126 H290" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar-ink)"/>
  <path d="M204,176 H290" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar-ink)"/>
  <path d="M368,126 H450" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar-ink)"/>
  <path d="M528,126 H610" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar-ink)"/>

  <!-- 살아남는 객체 -->
  <rect x="296" y="106" width="72" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="332" y="132" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">A</text>
  <rect x="456" y="106" width="72" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="492" y="132" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">B</text>
  <rect x="616" y="106" width="72" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="652" y="132" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">C</text>
  <rect x="296" y="156" width="72" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="332" y="182" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">D</text>

  <!-- E: D를 가리키지만 아무도 E를 가리키지 않음 -->
  <path d="M332,346 V202" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#ar-red)"/>
  <rect x="296" y="346" width="72" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="332" y="372" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">E</text>
  <text x="392" y="360" font-size="15" fill="#7f1d1d">D가 E를 참조하지 않으면</text>
  <text x="392" y="384" font-size="15" fill="#7f1d1d">E는 D를 가리켜도 Unreachable</text>
</svg>
