<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GC Root가 되는 것들</title>
  <desc id="d">GC Roots에서 시작하는 객체 참조 관계와 도달 가능성(Reachability)을 나타내는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- GC Roots 박스 (컨테이너/그룹) -->
  <rect x="40" y="40" width="180" height="150" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="68" fill="#2563eb" font-size="16" font-weight="bold" text-anchor="middle">GC Roots</text>
  <line x1="50" y1="82" x2="210" y2="82" stroke="#cbd2d9" stroke-width="1"/>
  
  <text x="60" y="108" fill="#1f2933" font-size="13">스레드 스택</text>
  <text x="60" y="138" fill="#1f2933" font-size="13">static 필드</text>
  <text x="60" y="168" fill="#1f2933" font-size="13">JNI 참조</text>

  <!-- Reachable 객체들 [A], [B], [C], [D] -->
  <rect x="300" y="85" width="50" height="36" rx="4" ry="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="325" y="107" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">A</text>

  <rect x="400" y="85" width="50" height="36" rx="4" ry="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="425" y="107" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">B</text>

  <rect x="500" y="85" width="50" height="36" rx="4" ry="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="525" y="107" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">C</text>

  <rect x="300" y="125" width="50" height="36" rx="4" ry="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="325" y="147" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">D</text>

  <!-- Unreachable 객체 [E] -->
  <rect x="300" y="215" width="50" height="36" rx="4" ry="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="325" y="237" fill="#dc2626" font-size="14" font-weight="bold" text-anchor="middle">E</text>

  <!-- 참조 화살표들 -->
  <!-- GC Roots -> [A] -->
  <path d="M220,103 L291,103" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- GC Roots -> [D] -->
  <path d="M220,143 L291,143" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- [A] -> [B] -->
  <path d="M350,103 L391,103" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- [B] -> [C] -->
  <path d="M450,103 L491,103" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- [E] -> [D] -->
  <path d="M325,215 L325,168" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- [E] 우측 설명 텍스트 -->
  <text x="375" y="228" fill="#52606d" font-size="12">← D가 E를 참조하지 않으면</text>
  <text x="390" y="248" fill="#52606d" font-size="12">E는 D를 가리켜도 Unreachable</text>

  <!-- 하단 요약 및 결과 안내 영역 -->
  <rect x="40" y="285" width="800" height="65" rx="6" ry="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <text x="60" y="311" fill="#059669" font-size="13" font-weight="bold">살아남음:</text>
  <text x="135" y="311" fill="#1f2933" font-size="13">A, B, C, D</text>

  <text x="60" y="335" fill="#dc2626" font-size="13" font-weight="bold">회수 대상:</text>
  <text x="135" y="335" fill="#1f2933" font-size="13">E, 그리고 E만 참조하던 모든 객체</text>
</svg>