<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Latency vs Throughput</title>
  <desc id="d">Latency와 Throughput의 정의 및 고속도로 비유 예시</desc>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- Latency Box -->
  <rect x="40" y="35" width="385" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="82" font-size="14" fill="#1f2933"><tspan font-weight="bold" fill="#2563eb">Latency:</tspan> 한 요청이 처리되는 시간</text>

  <!-- Throughput Box -->
  <rect x="455" y="35" width="385" height="85" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="475" y="82" font-size="14" fill="#1f2933"><tspan font-weight="bold" fill="#059669">Throughput:</tspan> 전체 시스템이 처리하는 양</text>

  <!-- Example Box -->
  <rect x="40" y="140" width="800" height="125" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="65" y="170" font-size="14" font-weight="bold" fill="#1f2933">예: 고속도로</text>
  <text x="65" y="202" font-size="13" fill="#1f2933">- <tspan font-weight="bold" fill="#2563eb">Latency</tspan> = 서울→부산 소요 시간 (4시간)</text>
  <text x="65" y="232" font-size="13" fill="#1f2933">- <tspan font-weight="bold" fill="#059669">Throughput</tspan> = 시간당 통과 차량 수 (1000대/시)</text>
</svg>