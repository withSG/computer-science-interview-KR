<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Latency vs Throughput</title>
  <desc id="d">Latency는 한 요청이 처리되는 시간, Throughput은 전체 시스템이 처리하는 양이다. 고속도로에 비유하면 Latency는 서울→부산 소요 시간(4시간), Throughput은 시간당 통과 차량 수(1000대/시)다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>

  <!-- 정의 카드 -->
  <rect x="24" y="24" width="404" height="88" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="48" y="58" font-size="20" font-weight="bold" fill="#1d4ed8">Latency</text>
  <text x="48" y="92" font-size="16" fill="#1f2933">한 요청이 처리되는 시간</text>

  <rect x="452" y="24" width="404" height="88" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="476" y="58" font-size="20" font-weight="bold" fill="#047857">Throughput</text>
  <text x="476" y="92" font-size="16" fill="#1f2933">전체 시스템이 처리하는 양</text>

  <!-- 예: 고속도로 -->
  <text x="24" y="152" font-size="16" font-weight="bold" fill="#374151">예: 고속도로</text>

  <!-- Latency: 서울→부산 전 구간 -->
  <text x="440" y="182" font-size="16" text-anchor="middle" fill="#1f2933"><tspan font-weight="bold" fill="#1d4ed8">Latency</tspan> = 서울→부산 소요 시간 <tspan font-weight="bold" fill="#1d4ed8">(4시간)</tspan></text>
  <line x1="104" y1="192" x2="104" y2="204" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="776" y1="192" x2="776" y2="204" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="108" y1="198" x2="772" y2="198" stroke="#1d4ed8" stroke-width="1.5" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>

  <!-- 도시 -->
  <rect x="24" y="214" width="72" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="60" y="244" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2933">서울</text>
  <rect x="784" y="214" width="72" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="820" y="244" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2933">부산</text>

  <!-- 도로와 차량 -->
  <rect x="104" y="214" width="672" height="48" fill="#d1d5db"/>
  <line x1="108" y1="238" x2="772" y2="238" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 10"/>
  <rect x="150" y="220" width="36" height="12" rx="3" fill="#4b5563"/>
  <rect x="250" y="244" width="36" height="12" rx="3" fill="#4b5563"/>
  <rect x="360" y="220" width="36" height="12" rx="3" fill="#4b5563"/>
  <rect x="470" y="244" width="36" height="12" rx="3" fill="#4b5563"/>
  <rect x="604" y="220" width="36" height="12" rx="3" fill="#4b5563"/>
  <rect x="700" y="244" width="36" height="12" rx="3" fill="#4b5563"/>

  <!-- Throughput: 한 지점을 시간당 통과하는 차량 수 -->
  <line x1="560" y1="208" x2="560" y2="276" stroke="#047857" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="560" y="300" font-size="16" text-anchor="middle" fill="#1f2933"><tspan font-weight="bold" fill="#047857">Throughput</tspan> = 시간당 통과 차량 수 <tspan font-weight="bold" fill="#047857">(1000대/시)</tspan></text>
</svg>
