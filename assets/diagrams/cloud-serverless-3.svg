<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동기 API 구성</title>
  <desc id="d">클라이언트가 HTTPS로 API Gateway에 요청하고, API Gateway가 Lambda를, Lambda가 DynamoDB를 호출한다. API Gateway는 인증/스로틀링과 요청 검증을, Lambda는 비즈니스 로직을 맡는다.</desc>
  <rect width="880" height="240" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 요청 흐름 -->
  <rect x="24" y="40" width="130" height="64" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="89" y="78" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">클라이언트</text>

  <line x1="154" y1="72" x2="228" y2="72" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="191" y="62" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">HTTPS</text>

  <rect x="231" y="40" width="170" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="316" y="78" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">API Gateway</text>

  <line x1="401" y1="72" x2="475" y2="72" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="478" y="40" width="150" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="553" y="78" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">Lambda</text>

  <line x1="628" y1="72" x2="702" y2="72" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="705" y="40" width="150" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="78" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">DynamoDB</text>

  <!-- 각 구성 요소가 맡는 일 -->
  <line x1="316" y1="104" x2="316" y2="144" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="231" y="144" width="170" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="316" y="173" font-size="15" fill="#1f2937" text-anchor="middle">인증/스로틀링</text>
  <text x="316" y="197" font-size="15" fill="#1f2937" text-anchor="middle">요청 검증</text>

  <line x1="553" y1="104" x2="553" y2="144" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="478" y="144" width="150" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="553" y="185" font-size="15" fill="#1f2937" text-anchor="middle">비즈니스 로직</text>
</svg>
