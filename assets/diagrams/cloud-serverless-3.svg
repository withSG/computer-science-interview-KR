<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">패턴 A. 동기 API — API Gateway + Lambda</title>
  <desc id="d">클라이언트가 HTTPS로 API Gateway에 요청을 보내면, Lambda를 거쳐 DynamoDB로 전달되는 동기 API 패턴 다이어그램입니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="230" fill="#ffffff"/>

  <!-- 연결선 및 화살표 -->
  <!-- 클라이언트 -> API Gateway -->
  <path d="M120,60 L240,60" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="145" y="47" width="70" height="18" fill="#ffffff"/>
  <text x="180" y="60.025" font-size="11.5" fill="#2563eb" text-anchor="middle">HTTPS</text>

  <!-- API Gateway -> Lambda -->
  <path d="M380,60 L480,60" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Lambda -> DynamoDB -->
  <path d="M600,60 L700,60" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- API Gateway -> 수직 설명선 -->
  <path d="M310,85 L310,115" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Lambda -> 수직 설명선 -->
  <path d="M540,85 L540,115" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- 노드: 클라이언트 -->
  <rect x="24" y="35" width="96" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="72" y="64.55" font-size="13" fill="#1f2933" text-anchor="middle">클라이언트</text>

  <!-- 노드: API Gateway -->
  <rect x="240" y="35" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="64.55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">API Gateway</text>

  <!-- 노드: Lambda -->
  <rect x="480" y="35" width="120" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="540" y="64.55" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">Lambda</text>

  <!-- 노드: DynamoDB -->
  <rect x="700" y="35" width="130" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="765" y="64.55" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">DynamoDB</text>

  <!-- 하단 부가 설명: API Gateway -->
  <text x="310" y="132.025" font-size="11.5" fill="#52606d" text-anchor="middle">인증/스로틀링</text>
  <text x="310" y="152.025" font-size="11.5" fill="#52606d" text-anchor="middle">요청 검증</text>

  <!-- 하단 부가 설명: Lambda -->
  <text x="540" y="132.025" font-size="11.5" fill="#52606d" text-anchor="middle">비즈니스 로직</text>
</svg>