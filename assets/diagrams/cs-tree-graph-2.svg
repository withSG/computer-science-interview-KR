<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트리 순회 3종</title>
  <desc id="d">이진 트리의 노드 구조와 전위, 중위, 후위, 레벨 순회 방식 및 방문 순서를 나타낸 다이어그램</desc>
  
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Left Container: Binary Tree Structure -->
  <rect x="30" y="30" width="300" height="280" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="180" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#52606d">이진 트리 구조</text>

  <!-- Tree Edges -->
  <line x1="180" y1="100" x2="110" y2="160" stroke="#52606d" stroke-width="2"/>
  <line x1="180" y1="100" x2="250" y2="160" stroke="#52606d" stroke-width="2"/>
  <line x1="110" y1="160" x2="70" y2="220" stroke="#52606d" stroke-width="2"/>
  <line x1="110" y1="160" x2="150" y2="220" stroke="#52606d" stroke-width="2"/>

  <!-- Tree Nodes -->
  <!-- Node 1 (Root) -->
  <circle cx="180" cy="100" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">1</text>

  <!-- Node 2 -->
  <circle cx="110" cy="160" r="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="110" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c3aed">2</text>

  <!-- Node 3 -->
  <circle cx="250" cy="160" r="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c3aed">3</text>

  <!-- Node 4 -->
  <circle cx="70" cy="220" r="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="70" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c3aed">4</text>

  <!-- Node 5 -->
  <circle cx="150" cy="220" r="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c3aed">5</text>

  <!-- Right Container: Traversal Rules and Results -->
  <rect x="350" y="30" width="500" height="280" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Row 1: Preorder -->
  <g transform="translate(370, 50)">
    <rect x="0" y="0" width="130" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">전위(Preorder)</text>
    
    <text x="145" y="23" font-size="13" fill="#1f2933">루트 → 왼쪽 → 오른쪽</text>
    <text x="285" y="23" font-size="13" fill="#52606d">:</text>
    
    <rect x="300" y="0" width="140" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="370" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">1 2 4 5 3</text>
  </g>

  <!-- Row 2: Inorder -->
  <g transform="translate(370, 110)">
    <rect x="0" y="0" width="130" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">중위(Inorder)</text>
    
    <text x="145" y="23" font-size="13" fill="#1f2933">왼쪽 → 루트 → 오른쪽</text>
    <text x="285" y="23" font-size="13" fill="#52606d">:</text>
    
    <rect x="300" y="0" width="140" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="370" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">4 2 5 1 3</text>
  </g>

  <!-- Row 3: Postorder -->
  <g transform="translate(370, 170)">
    <rect x="0" y="0" width="130" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">후위(Postorder)</text>
    
    <text x="145" y="23" font-size="13" fill="#1f2933">왼쪽 → 오른쪽 → 루트</text>
    <text x="285" y="23" font-size="13" fill="#52606d">:</text>
    
    <rect x="300" y="0" width="140" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="370" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">4 5 2 3 1</text>
  </g>

  <!-- Row 4: Level -->
  <g transform="translate(370, 230)">
    <rect x="0" y="0" width="130" height="36" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">레벨(Level)</text>
    
    <text x="145" y="23" font-size="13" fill="#1f2933">위에서 아래, 왼→오</text>
    <text x="285" y="23" font-size="13" fill="#52606d">:</text>
    
    <rect x="300" y="0" width="140" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="370" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2933">1 2 3 4 5</text>
  </g>
</svg>