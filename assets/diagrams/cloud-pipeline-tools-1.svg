<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">네 개의 계층</title>
  <desc id="d">GitHub Actions의 네 가지 주요 계층 구조인 워크플로, 트리거, 잡, 러너, 스텝의 관계와 설명을 나타낸 트리 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">네 개의 계층</text>
  <line x1="40" y1="60" x2="840" y2="60" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Level 1: Workflow -->
  <!-- Box: x=40, y=80, w=380, h=50 -->
  <rect x="40" y="80" width="380" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="112" font-size="14" font-weight="bold" fill="#7c3aed">워크플로 (Workflow)</text>
  
  <!-- Right note for Workflow -->
  <!-- Box: x=440, y=80, w=400, h=50 -->
  <rect x="440" y="80" width="400" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="460" y="111" font-size="13" fill="#1f2933">.github/workflows/ci.yml 파일 하나</text>

  <!-- Hierarchy Lines Level 1 to Level 2 -->
  <path d="M 80 130 L 80 175 L 110 175" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M 80 175 L 80 245 L 110 245" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Level 2: Trigger -->
  <!-- Box: x=110, y=150, w=200, h=50 -->
  <rect x="110" y="150" width="200" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="182" font-size="14" font-weight="bold" fill="#2563eb">트리거 (on:)</text>

  <!-- Right note for Trigger -->
  <!-- Box: x=330, y=150, w=510, h=50 -->
  <rect x="330" y="150" width="510" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="345" y="181" font-size="13" fill="#1f2933">어떤 이벤트에 반응할지. push, pull_request, schedule, workflow_dispatch</text>

  <!-- Level 2: Jobs -->
  <!-- Box: x=110, y=220, w=200, h=50 -->
  <rect x="110" y="220" width="200" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="130" y="252" font-size="14" font-weight="bold" fill="#059669">잡 (jobs:)</text>

  <!-- Right note for Jobs -->
  <!-- Box: x=330, y=220, w=510, h=50 -->
  <rect x="330" y="220" width="510" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="345" y="251" font-size="13" fill="#1f2933">독립적인 실행 단위. 기본적으로 서로 병렬.</text>

  <!-- Hierarchy Lines Level 2 (Jobs) to Level 3 -->
  <path d="M 150 270 L 150 315 L 180 315" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M 150 315 L 150 385 L 180 385" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Level 3: Runner -->
  <!-- Box: x=180, y=290, w=210, h=50 -->
  <rect x="180" y="290" width="210" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="200" y="322" font-size="14" font-weight="bold" fill="#d97706">러너 (runs-on:)</text>

  <!-- Right note for Runner -->
  <!-- Box: x=410, y=290, w=430, h=50 -->
  <rect x="410" y="290" width="430" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="425" y="321" font-size="13" fill="#1f2933">이 잡이 돌아갈 가상 머신 또는 컨테이너</text>

  <!-- Level 3: Steps -->
  <!-- Box: x=180, y=360, w=210, h=50 -->
  <rect x="180" y="360" width="210" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="392" font-size="14" font-weight="bold" fill="#2563eb">스텝 (steps:)</text>

  <!-- Right note for Steps -->
  <!-- Box: x=410, y=360, w=430, h=50 -->
  <rect x="410" y="360" width="430" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="425" y="391" font-size="13" fill="#1f2933">잡 안에서 순서대로 실행되는 명령들</text>

  <!-- Hierarchy Lines Level 3 (Steps) to Level 4 -->
  <path d="M 220 410 L 220 445 L 250 445" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M 220 445 L 220 495 L 250 495" fill="none" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Level 4: uses -->
  <!-- Box: x=250, y=425, w=150, h=40 -->
  <rect x="250" y="425" width="150" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="270" y="450" font-size="13" font-weight="bold" fill="#1f2933">uses:</text>

  <!-- Right note for uses -->
  <!-- Box: x=420, y=425, w=420, h=40 -->
  <rect x="420" y="425" width="420" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="435" y="450" font-size="13" fill="#1f2933">재사용 가능한 액션 호출</text>

  <!-- Level 4: run -->
  <!-- Box: x=250, y=475, w=150, h=40 -->
  <rect x="250" y="475" width="150" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="270" y="500" font-size="13" font-weight="bold" fill="#1f2933">run:</text>

  <!-- Right note for run -->
  <!-- Box: x=420, y=475, w=420, h=40 -->
  <rect x="420" y="475" width="420" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="435" y="500" font-size="13" fill="#1f2933">셸 명령 직접 실행</text>
</svg>