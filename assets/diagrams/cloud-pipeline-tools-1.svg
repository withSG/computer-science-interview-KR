<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GitHub Actions 워크플로의 계층</title>
  <desc id="d">워크플로 파일 하나 안에 트리거(on:)와 잡(jobs:)이 있고, 잡 안에 러너(runs-on:)와 스텝(steps:)이, 스텝은 uses: 또는 run: 으로 이루어지는 포함 관계를 중첩 상자로 보여 준다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 워크플로 -->
  <rect x="24" y="24" width="832" height="472" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="48" y="60" font-size="18" font-weight="bold" fill="#6d28d9">워크플로 (Workflow)</text>
  <text x="260" y="60" font-size="15" fill="#374151"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.github/workflows/ci.yml</tspan> 파일 하나</text>

  <!-- 트리거 -->
  <rect x="48" y="80" width="784" height="86" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="68" y="112" font-size="16" font-weight="bold" fill="#1d4ed8">트리거 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(on:)</tspan></text>
  <text x="260" y="112" font-size="15" fill="#374151">어떤 이벤트에 반응할지</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#1e3a8a" text-anchor="middle">
    <rect x="260" y="124" width="60" height="30" rx="15" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="290" y="144">push</text>
    <rect x="330" y="124" width="132" height="30" rx="15" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="396" y="144">pull_request</text>
    <rect x="472" y="124" width="96" height="30" rx="15" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="520" y="144">schedule</text>
    <rect x="578" y="124" width="178" height="30" rx="15" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="667" y="144">workflow_dispatch</text>
  </g>

  <!-- 잡 -->
  <rect x="48" y="182" width="784" height="292" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="68" y="214" font-size="16" font-weight="bold" fill="#047857">잡 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(jobs:)</tspan></text>
  <text x="260" y="214" font-size="15" fill="#374151">독립적인 실행 단위. 기본적으로 서로 병렬.</text>

  <!-- 러너 -->
  <rect x="72" y="230" width="736" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="92" y="262" font-size="16" font-weight="bold" fill="#b45309">러너 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(runs-on:)</tspan></text>
  <text x="260" y="262" font-size="15" fill="#374151">이 잡이 돌아갈 가상 머신 또는 컨테이너</text>

  <!-- 스텝 -->
  <rect x="72" y="298" width="736" height="160" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="92" y="330" font-size="16" font-weight="bold" fill="#4338ca">스텝 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(steps:)</tspan></text>
  <text x="260" y="330" font-size="15" fill="#374151">잡 안에서 순서대로 실행되는 명령들</text>

  <rect x="96" y="346" width="688" height="42" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="116" y="372" font-size="15" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">uses:</text>
  <text x="260" y="372" font-size="15" fill="#374151">재사용 가능한 액션 호출</text>

  <rect x="96" y="400" width="688" height="42" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="116" y="426" font-size="15" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">run:</text>
  <text x="260" y="426" font-size="15" fill="#374151">셸 명령 직접 실행</text>
</svg>
