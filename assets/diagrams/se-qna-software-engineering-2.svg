<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트가 없는 경우의 문제점</title>
  <desc id="d">수동 테스트 의존, 리팩토링 두려움, 배포 불안감, 버그 재발 등 테스트 부재로 인한 4가지 문제를 나열한 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Background Container -->
  <rect x="24" y="24" width="832" height="292" rx="12" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Title Section -->
  <rect x="44" y="44" width="792" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="69" fill="#dc2626" font-size="16" font-weight="bold" text-anchor="middle">테스트가 없는 경우의 문제점</text>

  <!-- Item 1 -->
  <g>
    <rect x="44" y="100" width="792" height="44" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <circle cx="70" cy="122" r="10" fill="#dc2626"/>
    <path d="M64,116 L76,128 M76,116 L64,128" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="94" y="126" fill="#1f2933" font-size="14" font-weight="bold">수동 테스트에 의존</text>
    <path d="M235,122 L255,122" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="253,119 259,122 253,125" fill="#dc2626"/>
    <text x="268" y="126" fill="#52606d" font-size="13">시간 소모, 휴먼 에러</text>
  </g>

  <!-- Item 2 -->
  <g>
    <rect x="44" y="152" width="792" height="44" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <circle cx="70" cy="174" r="10" fill="#dc2626"/>
    <path d="M64,168 L76,180 M76,168 L64,180" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="94" y="178" fill="#1f2933" font-size="14" font-weight="bold">리팩토링 두려움</text>
    <path d="M235,174 L255,174" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="253,171 259,174 253,177" fill="#dc2626"/>
    <text x="268" y="178" fill="#52606d" font-size="13">기술 부채 증가</text>
  </g>

  <!-- Item 3 -->
  <g>
    <rect x="44" y="204" width="792" height="44" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <circle cx="70" cy="226" r="10" fill="#dc2626"/>
    <path d="M64,220 L76,232 M76,220 L64,232" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="94" y="230" fill="#1f2933" font-size="14" font-weight="bold">배포 불안감</text>
    <path d="M235,226 L255,226" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="253,223 259,226 253,229" fill="#dc2626"/>
    <text x="268" y="230" fill="#52606d" font-size="13">릴리즈 지연</text>
  </g>

  <!-- Item 4 -->
  <g>
    <rect x="44" y="256" width="792" height="44" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <circle cx="70" cy="278" r="10" fill="#dc2626"/>
    <path d="M64,272 L76,284 M76,272 L64,284" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="94" y="282" fill="#1f2933" font-size="14" font-weight="bold">버그 재발</text>
    <path d="M235,278 L255,278" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="253,275 259,278 253,281" fill="#dc2626"/>
    <text x="268" y="282" fill="#52606d" font-size="13">같은 문제 반복</text>
  </g>
</svg>