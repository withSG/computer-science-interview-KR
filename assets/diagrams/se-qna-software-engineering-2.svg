<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">테스트가 없는 경우의 문제점</title>
  <desc id="d">테스트가 없으면 수동 테스트에 의존해 시간 소모와 휴먼 에러가, 리팩터링 두려움으로 기술 부채 증가가, 배포 불안감으로 릴리스 지연이, 버그 재발로 같은 문제 반복이 생긴다.</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="40" y="44" font-size="16" font-weight="bold" fill="#b91c1c">테스트가 없으면</text>
  <text x="480" y="44" font-size="16" font-weight="bold" fill="#374151">그 결과</text>

  <!-- 1 -->
  <rect x="40" y="64" width="340" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="66" cy="90" r="10" fill="#b91c1c"/>
  <path d="M61,85 L71,95 M71,85 L61,95" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="96" font-size="17" font-weight="bold" fill="#111827">수동 테스트에 의존</text>
  <line x1="392" y1="90" x2="468" y2="90" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="480" y="64" width="360" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="504" y="96" font-size="17" fill="#111827">시간 소모, 휴먼 에러</text>

  <!-- 2 -->
  <rect x="40" y="132" width="340" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="66" cy="158" r="10" fill="#b91c1c"/>
  <path d="M61,153 L71,163 M71,153 L61,163" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="164" font-size="17" font-weight="bold" fill="#111827">리팩터링 두려움</text>
  <line x1="392" y1="158" x2="468" y2="158" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="480" y="132" width="360" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="504" y="164" font-size="17" fill="#111827">기술 부채 증가</text>

  <!-- 3 -->
  <rect x="40" y="200" width="340" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="66" cy="226" r="10" fill="#b91c1c"/>
  <path d="M61,221 L71,231 M71,221 L61,231" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="232" font-size="17" font-weight="bold" fill="#111827">배포 불안감</text>
  <line x1="392" y1="226" x2="468" y2="226" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="480" y="200" width="360" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="504" y="232" font-size="17" fill="#111827">릴리스 지연</text>

  <!-- 4 -->
  <rect x="40" y="268" width="340" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="66" cy="294" r="10" fill="#b91c1c"/>
  <path d="M61,289 L71,299 M71,289 L61,299" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="300" font-size="17" font-weight="bold" fill="#111827">버그 재발</text>
  <line x1="392" y1="294" x2="468" y2="294" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="480" y="268" width="360" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="504" y="300" font-size="17" fill="#111827">같은 문제 반복</text>
</svg>
