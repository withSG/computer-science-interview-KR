<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배포 모델: 소유와 테넌시</title>
  <desc id="d">퍼블릭 클라우드는 여러 회사(A사·B사·C사)가 벤더 소유의 공유 자원 풀을 함께 쓰는 멀티테넌시이고, 프라이빗 클라우드는 우리 조직만 쓰는 단독 테넌시다. 둘을 전용선이나 VPN으로 이어 하나의 시스템처럼 쓰면 하이브리드 클라우드이며, 멀티 클라우드는 서로 다른 퍼블릭 벤더를 둘 이상 쓰는 것으로 하이브리드와 축이 다르다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <text x="440" y="40" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">자원을 누가 소유하고, 누가 그 위에서 쓰는가</text>

  <!-- 퍼블릭 -->
  <rect x="24" y="64" width="400" height="220" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="224" y="98" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">퍼블릭 클라우드</text>
  <rect x="60" y="116" width="96" height="44" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="108" y="144" font-size="16" fill="#111827" text-anchor="middle">A사</text>
  <rect x="176" y="116" width="96" height="44" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="224" y="144" font-size="16" fill="#111827" text-anchor="middle">B사</text>
  <rect x="292" y="116" width="96" height="44" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="340" y="144" font-size="16" fill="#111827" text-anchor="middle">C사</text>
  <rect x="48" y="170" width="352" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="224" y="198" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">공유 자원 풀 (멀티테넌시)</text>
  <text x="224" y="254" font-size="16" fill="#111827" text-anchor="middle">벤더 소유·운영</text>

  <!-- 프라이빗 -->
  <rect x="456" y="64" width="400" height="220" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="656" y="98" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">프라이빗 클라우드</text>
  <rect x="480" y="116" width="352" height="44" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="656" y="144" font-size="16" fill="#111827" text-anchor="middle">우리 조직 전용 사용</text>
  <rect x="480" y="170" width="352" height="44" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="656" y="198" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">단독 테넌시</text>
  <text x="656" y="254" font-size="16" fill="#111827" text-anchor="middle">조직 소유 또는 전용</text>

  <!-- 연결: 전용선 / VPN -->
  <path d="M224,330 L656,330" fill="none" stroke="#6d28d9" stroke-width="2.5"/>
  <path d="M224,330 L224,290" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#up)"/>
  <path d="M656,330 L656,290" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#up)"/>
  <path d="M440,330 L440,362" fill="none" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="440" y="318" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">전용선 / VPN</text>

  <!-- 하이브리드 -->
  <rect x="250" y="362" width="380" height="76" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="394" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">하이브리드 클라우드</text>
  <text x="440" y="422" font-size="16" fill="#1f2937" text-anchor="middle">둘을 하나의 시스템처럼 연결</text>

  <!-- 멀티 클라우드: 다른 축 -->
  <rect x="24" y="472" width="832" height="84" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="48" y="506" font-size="16" fill="#111827"><tspan font-size="18" font-weight="bold" fill="#b45309">멀티 클라우드</tspan> = 서로 다른 퍼블릭 벤더를 둘 이상 동시에 쓰는 것</text>
  <text x="48" y="536" font-size="15" fill="#4b5563">(하이브리드와 축이 다르다. 함께 쓰이기도 한다)</text>
</svg>
