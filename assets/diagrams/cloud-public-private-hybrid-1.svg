<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 필요한가 — 퍼블릭 클라우드가 정답이 아닌 경우</title>
  <desc id="d">자원 소유 및 사용 주체에 따른 퍼블릭, 프라이빗, 하이브리드 클라우드와 멀티 클라우드의 구조 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <!-- Arrow Markers for each color -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Top Header Subtitle Label -->
  <text x="440" y="32" font-size="14" fill="#52606d" text-anchor="middle">자원을 누가 소유하고, 누가 그 위에서 쓰는가</text>

  <!-- Public Cloud Outer Box -->
  <rect x="50" y="55" width="360" height="230" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="87" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">퍼블릭 클라우드</text>

  <!-- Public Cloud Inner Boxes (A사, B사, C사) -->
  <rect x="85" y="105" width="70" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="120" y="129" font-size="13" fill="#1f2933" text-anchor="middle">A사</text>

  <rect x="195" y="105" width="70" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="230" y="129" font-size="13" fill="#1f2933" text-anchor="middle">B사</text>

  <rect x="305" y="105" width="70" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="340" y="129" font-size="13" fill="#1f2933" text-anchor="middle">C사</text>

  <!-- Public Cloud Details -->
  <text x="230" y="174" font-size="13" fill="#1f2933" text-anchor="middle">공유 자원 풀</text>
  <text x="230" y="204" font-size="13" fill="#1f2933" text-anchor="middle">(멀티테넌시)</text>
  <text x="230" y="234" font-size="13" fill="#1f2933" text-anchor="middle">벤더 소유·운영</text>


  <!-- Private Cloud Outer Box -->
  <rect x="470" y="55" width="360" height="230" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="87" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">프라이빗 클라우드</text>

  <!-- Private Cloud Inner Box -->
  <rect x="540" y="105" width="220" height="60" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="650" y="130" font-size="13" fill="#1f2933" text-anchor="middle">우리 조직</text>
  <text x="650" y="150" font-size="13" fill="#1f2933" text-anchor="middle">전용 사용</text>

  <!-- Private Cloud Details -->
  <text x="650" y="204" font-size="13" fill="#1f2933" text-anchor="middle">단독 테넌시</text>
  <text x="650" y="234" font-size="13" fill="#1f2933" text-anchor="middle">조직 소유 또는 전용</text>


  <!-- Connecting Arrows and Line -->
  <!-- Arrow to Public Cloud (upwards) -->
  <path d="M230,325 L230,285" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Arrow to Private Cloud (upwards) -->
  <path d="M650,325 L650,285" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Horizontal Connection Line (전용선 / VPN) -->
  <path d="M230,325 L650,325" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Connector Line from Horizontal Line down to Hybrid Box -->
  <path d="M440,325 L440,365" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Label on Connection Line with White Background -->
  <rect x="365" y="313" width="150" height="24" fill="#ffffff"/>
  <text x="440" y="330" font-size="13" fill="#1f2933" text-anchor="middle">전용선 / VPN</text>


  <!-- Hybrid Cloud Box & Side Annotation -->
  <rect x="290" y="365" width="300" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="396" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">하이브리드 클라우드</text>
  
  <!-- Side Annotation for Hybrid Cloud -->
  <text x="605" y="395" font-size="13" fill="#52606d" text-anchor="start">둘을 하나의 시스템처럼 연결</text>


  <!-- Bottom Footnotes / Supplementary Text -->
  <rect x="50" y="445" width="780" height="70" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="70" y="474" font-size="13" fill="#1f2933">멀티 클라우드 = 서로 다른 퍼블릭 벤더를 둘 이상 동시에 쓰는 것</text>
  <text x="180" y="499" font-size="13" fill="#52606d">(하이브리드와 축이 다르다. 함께 쓰이기도 한다)</text>

</svg>