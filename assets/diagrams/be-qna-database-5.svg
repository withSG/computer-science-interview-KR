<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">삽입 이상 (Insertion Anomaly)</title>
  <desc id="d">수강 과목 없이 학생 정보만 등록할 때 기본키 NULL 문제로 인해 데이터 삽입이 불가능한 현상을 설명하는 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title / Section Header -->
  <text x="30" y="42" font-size="16" font-weight="bold" fill="#1f2933">삽입 이상 (Insertion Anomaly)</text>

  <!-- Problem Statement Box -->
  <rect x="30" y="60" width="820" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="45" y="84" font-size="14" font-weight="bold" fill="#d97706">문제:</text>
  <text x="90" y="84" font-size="14" fill="#1f2933">수강 과목 없이 학생 정보만 등록할 수 없음</text>

  <!-- Target Action Box (Input Attempt) -->
  <rect x="30" y="125" width="820" height="45" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="50" y="152" font-size="14" font-weight="bold" fill="#1f2933">학생 1003 박민준(BA, 경영학) 등록하려면?</text>

  <!-- Flow Steps -->
  <!-- Step 1: Null Assignment -->
  <path d="M 80 170 L 80 195" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="60" y="187" font-size="14" font-weight="bold" fill="#dc2626">→</text>
  <rect x="85" y="195" width="765" height="38" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="100" y="219" font-size="13" font-weight="bold" fill="#dc2626">과목코드, 과목명에 NULL을 넣어야 함</text>

  <!-- Step 2: Primary Key Violation -->
  <path d="M 80 233 L 80 258" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="60" y="250" font-size="14" font-weight="bold" fill="#dc2626">→</text>
  <rect x="85" y="258" width="765" height="48" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="100" y="287" font-size="14" font-weight="bold" fill="#dc2626">기본키(학생ID + 과목코드)에 NULL 불가 → 삽입 불가!</text>
</svg>