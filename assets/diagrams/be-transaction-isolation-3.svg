<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Phantom Read — 같은 조건으로 조회했는데 행 개수가 다르다</title>
  <desc id="d">트랜잭션 A가 동일한 조건으로 두 번 조회하는 사이에 트랜잭션 B가 새 데이터를 삽입하고 커밋하여 두 번째 조회 결과의 행 개수가 달라지는 Phantom Read 현상을 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="arrow-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Timeline Base Lines -->
  <path d="M135,70 L830,70" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#arrow-ink)"/>
  <path d="M135,150 L830,150" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="none" fill="none" marker-end="url(#arrow-ink)"/>

  <!-- Vertical Connection (Transaction B impact on Transaction A timeline) -->
  <path d="M490,130 L490,70" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- Transaction A Label -->
  <rect x="25" y="52" width="100" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="75" y="74.9" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">트랜잭션 A</text>

  <!-- Query 1 Box (WHERE age > 20 → 3건) -->
  <rect x="160" y="51" width="180" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="74.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">WHERE age &gt; 20 → 3건</text>

  <!-- Query 2 Box (WHERE age > 20 → 4건) -->
  <rect x="640" y="51" width="180" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="730" y="74.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">WHERE age &gt; 20 → 4건</text>

  <!-- Transaction B Label -->
  <rect x="25" y="132" width="100" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="75" y="154.9" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">트랜잭션 B</text>

  <!-- Insert Box (age=25 INSERT + COMMIT) -->
  <rect x="385" y="131" width="210" height="38" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="154.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">age=25 INSERT + COMMIT</text>
</svg>