<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">개방 주소법 삭제 후 탐색 실패</title>
  <desc id="d">K2를 그냥 지우면 버킷 4가 빈 칸이 된다. K3를 찾을 때 hash(K3) = 4이므로 버킷 4부터 탐사하는데, 버킷 4가 비어 있어 탐사가 멈추고 "없다"고 답한다. K3는 실제로 버킷 5에 있는데도 찾지 못한다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="dl-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <text x="24" y="40" font-size="16" font-weight="bold" fill="#374151">K2를 그냥 지운 뒤</text>

  <!-- ① 탐사 시작 -->
  <text x="506" y="50" font-size="16" fill="#1d4ed8" text-anchor="end" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash(K3) = 4</text>
  <circle cx="524" cy="44" r="12" fill="#1d4ed8"/>
  <text x="524" y="49" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="524" y1="58" x2="524" y2="90" stroke="#1d4ed8" stroke-width="2" marker-end="url(#dl-blue)"/>

  <!-- ② 빈 칸에서 멈춤: 5번으로 넘어가지 못함 -->
  <path d="M544,94 Q566,50 588,94" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <line x1="560" y1="66" x2="572" y2="78" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="572" y1="66" x2="560" y2="78" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="566" cy="44" r="12" fill="#b91c1c"/>
  <text x="566" y="49" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="584" y="49" font-size="15" font-weight="bold" fill="#b91c1c">탐사 중단 (빈 칸)</text>

  <!-- ③ K3는 5번에 있음 -->
  <circle cx="632" cy="76" r="12" fill="#b91c1c"/>
  <text x="632" y="81" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 배열 (버킷 0~6) -->
  <rect x="146" y="96" width="84" height="56" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="230" y="96" width="84" height="56" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="314" y="96" width="84" height="56" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="398" y="96" width="84" height="56" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="482" y="96" width="84" height="56" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="566" y="96" width="84" height="56" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="650" y="96" width="84" height="56" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="130" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">K1</text>
  <text x="608" y="130" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">K3</text>
  <text x="188" y="176" font-size="15" fill="#4b5563" text-anchor="middle">0</text>
  <text x="272" y="176" font-size="15" fill="#4b5563" text-anchor="middle">1</text>
  <text x="356" y="176" font-size="15" fill="#4b5563" text-anchor="middle">2</text>
  <text x="440" y="176" font-size="15" fill="#4b5563" text-anchor="middle">3</text>
  <text x="524" y="176" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">4</text>
  <text x="608" y="176" font-size="15" fill="#4b5563" text-anchor="middle">5</text>
  <text x="692" y="176" font-size="15" fill="#4b5563" text-anchor="middle">6</text>
  <text x="524" y="204" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">▲ 빈 칸이 생김</text>
  <text x="524" y="226" font-size="15" fill="#4b5563" text-anchor="middle">(K2를 지운 자리)</text>

  <!-- K3를 찾으려면 -->
  <rect x="24" y="250" width="832" height="168" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="282" font-size="16" font-weight="bold" fill="#111827">K3를 찾으려면</text>
  <circle cx="56" cy="316" r="12" fill="#1d4ed8"/>
  <text x="56" y="321" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="80" y="322" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">hash(K3) = 4</tspan> → 버킷 4부터 탐사</text>
  <circle cx="56" cy="352" r="12" fill="#b91c1c"/>
  <text x="56" y="357" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="80" y="358" font-size="16" fill="#111827">버킷 4 확인 → 비어 있음 → <tspan font-weight="bold" fill="#b91c1c">"없다"</tspan></text>
  <circle cx="56" cy="388" r="12" fill="#b91c1c"/>
  <text x="56" y="393" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="80" y="394" font-size="16" font-weight="bold" fill="#b91c1c">실제로는 버킷 5에 있는데도 못 찾는다</text>
</svg>
