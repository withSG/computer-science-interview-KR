<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">개방 주소법의 삭제 문제</title>
  <desc id="d">K2를 지워서 버킷 4가 비어있을 때, K3를 탐사하는 과정에서 버킷 4가 빈 칸이라 탐사가 중단되어 버킷 5의 K3를 찾지 못하는 문제 설명 다이어그램</desc>
  
  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커 (주황/강조) -->
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <!-- 화살표 마커 (빨강/실패) -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ================= 왼쪽 영역: 해시 테이블 배열 및 빈 칸 화살표 ================= -->

  <!-- 배열 버킷 (7개: Index 0~6) -->
  <!-- 버킷 0 -->
  <rect x="30" y="80" width="55" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="57.5" y="155" font-size="11.5" fill="#52606d" text-anchor="middle">0</text>

  <!-- 버킷 1 -->
  <rect x="85" y="80" width="55" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="112.5" y="155" font-size="11.5" fill="#52606d" text-anchor="middle">1</text>

  <!-- 버킷 2 -->
  <rect x="140" y="80" width="55" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="167.5" y="155" font-size="11.5" fill="#52606d" text-anchor="middle">2</text>

  <!-- 버킷 3: K1 -->
  <rect x="195" y="80" width="55" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="222.5" y="112" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">K1</text>
  <text x="222.5" y="155" font-size="11.5" fill="#52606d" text-anchor="middle">3</text>

  <!-- 버킷 4: 빈 칸 (삭제됨) -->
  <rect x="250" y="80" width="55" height="50" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="277.5" y="155" font-size="11.5" fill="#52606d" text-anchor="middle">4</text>

  <!-- 버킷 5: K3 -->
  <rect x="305" y="80" width="55" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="332.5" y="112" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">K3</text>
  <text x="332.5" y="155" font-size="11.5" fill="#52606d" text-anchor="middle">5</text>

  <!-- 버킷 6 -->
  <rect x="360" y="80" width="55" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="387.5" y="155" font-size="11.5" fill="#52606d" text-anchor="middle">6</text>

  <!-- 빈 칸 포인팅 화살표 (버킷 4 하단) -->
  <path d="M277.5,210 L277.5,137" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <text x="277.5" y="230" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">▲ 빈 칸이 생김</text>

  <!-- ================= 오른쪽 영역: 텍스트 설명 ================= -->

  <!-- 제목/목적: K3를 찾으려면 -->
  <text x="460" y="85" font-size="14" font-weight="bold" fill="#1f2933">K3를 찾으려면</text>

  <!-- 탐사 단계 1: 버킷 3 확인 -->
  <circle cx="470" cy="120" r="3" fill="#52606d"/>
  <text x="482" y="124" font-size="13" fill="#1f2933">버킷 3 확인 → K1이 아님</text>

  <!-- 탐사 단계 2: 버킷 4 확인 (실패 지점) -->
  <circle cx="470" cy="155" r="3" fill="#dc2626"/>
  <text x="482" y="159" font-size="13" fill="#1f2933">버킷 4 확인 → 비어 있음 → </text>
  <rect x="652" y="142" width="52" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="678" y="159" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">"없다"</text>

  <!-- 결과 설명: 실제로는 버킷 5에 있는데도 못 찾는다 -->
  <path d="M470,190 L470,210 L478,210" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="486" y="214" font-size="13" font-weight="bold" fill="#dc2626">실제로는 버킷 5에 있는데도 못 찾는다</text>

  <!-- 탐사 경로 시각화 곡선 (버킷 3 -> 버킷 4 중단) -->
  <path d="M222.5,75 C222.5,50 277.5,50 277.5,73" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-red)"/>
  <rect x="226" y="38" width="98" height="20" rx="3" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="275" y="52" font-size="11" fill="#dc2626" text-anchor="middle">탐사 중단 (빈 칸)</text>

</svg>