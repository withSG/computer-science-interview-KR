<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상품 상세 페이지 전략 분리</title>
  <desc id="d">한 상품 상세 페이지를 데이터 성격에 따라 세 영역으로 나눈다. 상품명·이미지·상세 설명·스펙은 거의 안 바뀌고 SEO가 필수라 ISR, 재고 수량·실시간 가격은 초 단위로 바뀌고 틀리면 사고라 클라이언트에서 별도 조회(CSR), 장바구니 담김 여부·내 쿠폰은 사용자별이라 클라이언트 조회 또는 동적 렌더로 처리한다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 페이지 틀 -->
  <rect x="24" y="24" width="832" height="472" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <path d="M36 24 H844 Q856 24 856 36 V64 H24 V36 Q24 24 36 24 Z" fill="#334155"/>
  <text x="48" y="51" font-size="18" font-weight="700" fill="#ffffff">상품 상세 페이지</text>

  <!-- 열 머리 -->
  <text x="64" y="94" font-size="15" font-weight="700" fill="#4b5563">데이터</text>
  <text x="352" y="94" font-size="15" font-weight="700" fill="#4b5563">성격</text>
  <text x="572" y="94" font-size="15" font-weight="700" fill="#4b5563">렌더링 방식</text>

  <!-- 영역 1: ISR -->
  <rect x="44" y="108" width="792" height="112" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="64" y="158" font-size="17" font-weight="700" fill="#111827">상품명 / 이미지 /</text>
  <text x="64" y="182" font-size="17" font-weight="700" fill="#111827">상세 설명 / 스펙</text>
  <line x1="308" y1="164" x2="340" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="352" y="159" font-size="15" fill="#1f2937">거의 안 바뀜,</text>
  <text x="352" y="181" font-size="15" fill="#1f2937">SEO 필수</text>
  <line x1="528" y1="164" x2="560" y2="164" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="568" y="120" width="252" height="88" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2.5"/>
  <text x="584" y="148" font-size="20" font-weight="700" fill="#047857">ISR</text>
  <text x="584" y="173" font-size="16" fill="#1f2937">revalidate</text>
  <text x="584" y="195" font-size="16" fill="#1f2937">+ 수정 시 온디맨드</text>

  <!-- 영역 2: CSR -->
  <rect x="44" y="236" width="792" height="112" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="64" y="298" font-size="17" font-weight="700" fill="#111827">재고 수량 / 실시간 가격</text>
  <line x1="308" y1="292" x2="340" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="352" y="287" font-size="15" fill="#1f2937">초 단위로 바뀜,</text>
  <text x="352" y="309" font-size="15" fill="#1f2937">틀리면 사고</text>
  <line x1="528" y1="292" x2="560" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="568" y="248" width="252" height="88" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="584" y="284" font-size="20" font-weight="700" fill="#6d28d9">CSR</text>
  <text x="584" y="310" font-size="15" fill="#1f2937">클라이언트에서 별도 조회</text>

  <!-- 영역 3: 사용자별 -->
  <rect x="44" y="364" width="792" height="112" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="64" y="426" font-size="17" font-weight="700" fill="#111827">장바구니 담김 여부 / 내 쿠폰</text>
  <line x1="308" y1="420" x2="340" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="352" y="425" font-size="15" fill="#1f2937">사용자별</text>
  <line x1="528" y1="420" x2="560" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="568" y="376" width="252" height="88" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <text x="584" y="413" font-size="17" font-weight="700" fill="#b45309">클라이언트 조회</text>
  <text x="584" y="438" font-size="17" font-weight="700" fill="#b45309">또는 동적 렌더</text>

  <!-- 요점 -->
  <text x="440" y="528" font-size="16" text-anchor="middle" fill="#1f2937">한 페이지 안에서도 <tspan font-weight="700">데이터 성격</tspan>이 달라, 영역마다 다른 전략을 쓴다</text>
</svg>
