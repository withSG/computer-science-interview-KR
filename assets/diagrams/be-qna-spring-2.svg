<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Spring MVC 상세 흐름도</title>
  <desc id="d">Client 요청이 Front Controller인 DispatcherServlet에 들어가 HandlerMapping과 HandlerAdapter로 갈라졌다가 Controller로 모이고, ViewResolver와 View를 거쳐 다시 Client로 돌아가는 흐름. 상자 옆 번호는 핵심 답변의 1~6단계와 같다.</desc>
  <rect width="880" height="690" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <text x="24" y="44" font-size="15" fill="#4b5563">번호 = 핵심 답변의 단계</text>

  <!-- Client (요청) -->
  <rect x="350" y="24" width="180" height="46" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="53" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Client</text>
  <line x1="440" y1="70" x2="440" y2="114" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="452" y="98" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Request</text>

  <!-- DispatcherServlet -->
  <circle cx="272" cy="143" r="15" fill="#374151"/>
  <text x="272" y="148" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="300" y="116" width="280" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="149" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DispatcherServlet</text>
  <line x1="622" y1="143" x2="584" y2="143" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrV)"/>
  <rect x="624" y="125" width="180" height="36" rx="18" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="714" y="149" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">Front Controller</text>

  <!-- 갈라짐 -->
  <line x1="440" y1="170" x2="440" y2="196" stroke="#374151" stroke-width="2"/>
  <line x1="250" y1="196" x2="630" y2="196" stroke="#374151" stroke-width="2"/>
  <line x1="250" y1="195" x2="250" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="630" y1="195" x2="630" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- HandlerMapping / HandlerAdapter -->
  <circle cx="114" cy="256" r="15" fill="#374151"/>
  <text x="114" y="261" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="140" y="232" width="220" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="262" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HandlerMapping</text>

  <circle cx="494" cy="256" r="15" fill="#374151"/>
  <text x="494" y="261" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="520" y="232" width="220" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="630" y="262" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HandlerAdapter</text>

  <!-- 모임 -->
  <line x1="250" y1="280" x2="250" y2="307" stroke="#374151" stroke-width="2"/>
  <line x1="630" y1="280" x2="630" y2="307" stroke="#374151" stroke-width="2"/>
  <line x1="250" y1="306" x2="630" y2="306" stroke="#374151" stroke-width="2"/>
  <line x1="440" y1="306" x2="440" y2="338" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Controller -->
  <circle cx="314" cy="364" r="15" fill="#374151"/>
  <text x="314" y="369" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="340" y="340" width="200" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="370" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Controller</text>
  <line x1="440" y1="388" x2="440" y2="426" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ViewResolver -->
  <circle cx="314" cy="452" r="15" fill="#374151"/>
  <text x="314" y="457" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="340" y="428" width="200" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="458" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ViewResolver</text>
  <line x1="440" y1="476" x2="440" y2="514" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- View -->
  <circle cx="314" cy="540" r="15" fill="#374151"/>
  <text x="314" y="545" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="340" y="516" width="200" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="546" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">View</text>
  <line x1="440" y1="564" x2="440" y2="610" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="452" y="593" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Response</text>

  <!-- Client (응답) -->
  <rect x="350" y="612" width="180" height="46" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="641" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Client</text>
</svg>
