<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1010" width="880" height="1010" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TLS 1.2 핸드셰이크 흐름</title>
  <desc id="d">TCP 연결 뒤 Client와 Server가 두 번 왕복하며 메시지를 주고받는 TLS 1.2 핸드셰이크. 첫 왕복은 ClientHello부터 ServerHelloDone까지, 인증서 검증 뒤 두 번째 왕복에서 키 교환과 Finished를 마치고 대칭키 암호화 통신으로 넘어간다.</desc>
  <rect width="880" height="1010" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="50" y="24" width="140" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="120" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>
  <rect x="530" y="24" width="140" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="600" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Server</text>
  <line x1="120" y1="68" x2="120" y2="950" stroke="#9ca3af" stroke-width="2"/>
  <line x1="600" y1="68" x2="600" y2="950" stroke="#9ca3af" stroke-width="2"/>

  <!-- 전제 -->
  <rect x="190" y="86" width="340" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="360" y="108" font-size="15" fill="#4b5563" text-anchor="middle">TCP 3-way 핸드셰이크가 이미 끝난 상태</text>

  <!-- 첫 번째 왕복 -->
  <line x1="122" y1="178" x2="598" y2="178" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="136" y="170" font-size="16" font-weight="bold" fill="#111827">ClientHello</text>
  <rect x="136" y="190" width="316" height="106" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="152" y="213" font-size="15" fill="#374151">· 지원 TLS 버전</text>
  <text x="152" y="236" font-size="15" fill="#374151">· Cipher Suite 목록</text>
  <text x="152" y="259" font-size="15" fill="#374151">· 클라이언트 랜덤</text>
  <text x="152" y="282" font-size="15" fill="#374151">· SNI(접속하려는 도메인) <tspan font-weight="bold" fill="#b91c1c">← 평문</tspan></text>

  <line x1="598" y1="334" x2="122" y2="334" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="584" y="326" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">ServerHello</text>
  <rect x="324" y="346" width="260" height="60" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="340" y="369" font-size="15" fill="#374151">· 선택한 버전 / Cipher Suite</text>
  <text x="340" y="392" font-size="15" fill="#374151">· 서버 랜덤</text>

  <line x1="598" y1="446" x2="122" y2="446" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="584" y="438" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">Certificate (인증서 체인)</text>

  <line x1="598" y1="492" x2="122" y2="492" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="584" y="484" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">ServerKeyExchange (ECDHE 공개값 + 서명)</text>

  <line x1="598" y1="538" x2="122" y2="538" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="584" y="530" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">ServerHelloDone</text>

  <path d="M 624 178 H 640 V 538 H 624" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="654" y="356" font-size="20" font-weight="bold" fill="#1d4ed8">1 RTT</text>
  <text x="654" y="380" font-size="15" fill="#4b5563">첫 번째 왕복</text>

  <!-- 클라이언트의 인증서 검증 -->
  <rect x="96" y="566" width="460" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="326" y="595" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold" fill="#b45309">인증서 검증:</tspan> 서명 · 유효기간 · 도메인 · 폐기 여부</text>

  <!-- 두 번째 왕복 -->
  <line x1="122" y1="666" x2="598" y2="666" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="136" y="658" font-size="16" font-weight="bold" fill="#111827">ClientKeyExchange (ECDHE 공개값)</text>

  <line x1="122" y1="712" x2="598" y2="712" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="136" y="704" font-size="16" font-weight="bold" fill="#111827">ChangeCipherSpec</text>

  <line x1="122" y1="758" x2="598" y2="758" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="136" y="750" font-size="16" font-weight="bold" fill="#047857">Finished (암호화됨)</text>

  <line x1="598" y1="812" x2="122" y2="812" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="584" y="804" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">ChangeCipherSpec</text>

  <line x1="598" y1="858" x2="122" y2="858" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="584" y="850" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">Finished (암호화됨)</text>

  <path d="M 624 666 H 640 V 858 H 624" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="654" y="762" font-size="20" font-weight="bold" fill="#6d28d9">2 RTT</text>
  <text x="654" y="786" font-size="15" fill="#4b5563">두 번째 왕복</text>

  <!-- 이후 데이터 -->
  <line x1="124" y1="916" x2="596" y2="916" stroke="#047857" stroke-width="3.5" marker-start="url(#ah-green)" marker-end="url(#ah-green)"/>
  <rect x="240" y="898" width="240" height="36" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="360" y="922" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">이후 대칭키로 암호화된 통신</text>

  <!-- 범례와 요약 -->
  <line x1="40" y1="982" x2="84" y2="982" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="94" y="987" font-size="15" fill="#374151">평문 메시지</text>
  <line x1="200" y1="982" x2="244" y2="982" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="254" y="987" font-size="15" fill="#374151">암호화된 메시지</text>
  <text x="856" y="987" font-size="15" fill="#374151" text-anchor="end">TCP 1 RTT까지 합치면 데이터 전송 전 <tspan font-weight="bold" fill="#111827">3 RTT</tspan></text>
</svg>
