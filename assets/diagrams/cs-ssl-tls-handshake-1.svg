<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1160" width="880" height="1160" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TLS 1.2 핸드셰이크</title>
  <desc id="d">Client와 Server 간의 TLS 1.2 핸드셰이크 과정을 나타낸 Sequence Diagram</desc>
  <rect width="880" height="1160" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="440" y="45" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">TLS 1.2 핸드셰이크</text>

  <!-- RTT Sections Background & Markers -->
  <!-- 1 RTT Zone -->
  <rect x="50" y="145" width="710" height="370" rx="8" fill="#eff6ff" fill-opacity="0.5" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 800,165 L 820,165 L 820,505 L 800,505" stroke="#2563eb" stroke-width="2" fill="none"/>
  <text x="830" y="340" font-size="14" font-weight="bold" fill="#2563eb">1 RTT</text>

  <!-- 2 RTT Zone -->
  <rect x="50" y="585" width="710" height="340" rx="8" fill="#f5f3ff" fill-opacity="0.5" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 800,605 L 820,605 L 820,905 L 800,905" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <text x="830" y="760" font-size="14" font-weight="bold" fill="#7c3aed">2 RTT</text>

  <!-- Lifelines & Headers -->
  <rect x="110" y="70" width="140" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="94" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Client</text>

  <rect x="610" y="70" width="140" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="94" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Server</text>

  <line x1="180" y1="110" x2="180" y2="1090" stroke="#cbd2d9" stroke-width="2"/>
  <line x1="680" y1="110" x2="680" y2="1090" stroke="#cbd2d9" stroke-width="2"/>

  <!-- Top Note: TCP 3-way -->
  <rect x="230" y="120" width="400" height="26" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="430" y="137" font-size="12" fill="#52606d" text-anchor="middle">(TCP 3-way 핸드셰이크가 이미 끝난 상태)</text>

  <!-- 1. ClientHello -->
  <path d="M 180,175 L 680,175" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <rect x="230" y="162" width="105" height="20" fill="#ffffff"/>
  <text x="235" y="177" font-size="13" font-weight="bold" fill="#2563eb">ClientHello</text>

  <text x="210" y="200" font-size="11.5" fill="#52606d">· 지원 TLS 버전</text>
  <text x="210" y="220" font-size="11.5" fill="#52606d">· Cipher Suite 목록</text>
  <text x="210" y="240" font-size="11.5" fill="#52606d">· 클라이언트 랜덤</text>
  <text x="210" y="260" font-size="11.5" fill="#52606d">· SNI(접속하려는 도메인) ← 평문</text>

  <!-- 2. Server Hello Group -->
  <path d="M 680,295 L 180,295" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="540" y="282" width="105" height="20" fill="#ffffff"/>
  <text x="545" y="297" font-size="13" font-weight="bold" fill="#1f2933">ServerHello</text>

  <text x="510" y="320" font-size="11.5" fill="#52606d">· 선택한 버전 / Cipher Suite</text>
  <text x="510" y="340" font-size="11.5" fill="#52606d">· 서버 랜덤</text>

  <!-- Certificate -->
  <path d="M 680,375 L 180,375" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="480" y="362" width="165" height="20" fill="#ffffff"/>
  <text x="485" y="377" font-size="13" font-weight="bold" fill="#1f2933">Certificate (인증서 체인)</text>

  <!-- ServerKeyExchange -->
  <path d="M 680,425 L 180,425" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="360" y="412" width="285" height="20" fill="#ffffff"/>
  <text x="365" y="427" font-size="13" font-weight="bold" fill="#1f2933">ServerKeyExchange (ECDHE 공개값 + 서명)</text>

  <!-- ServerHelloDone -->
  <path d="M 680,475 L 180,475" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="525" y="462" width="120" height="20" fill="#ffffff"/>
  <text x="530" y="477" font-size="13" font-weight="bold" fill="#1f2933">ServerHelloDone</text>

  <!-- Certificate Verification (Client Internal Process) -->
  <rect x="120" y="525" width="370" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="305" y="550" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">[인증서 검증: 서명 · 유효기간 · 도메인 · 폐기 여부]</text>

  <!-- 3. Client Key Exchange & Cipher Spec -->
  <!-- ClientKeyExchange -->
  <path d="M 180,615 L 680,615" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="230" y="602" width="235" height="20" fill="#ffffff"/>
  <text x="235" y="617" font-size="13" font-weight="bold" fill="#7c3aed">ClientKeyExchange (ECDHE 공개값)</text>

  <!-- ChangeCipherSpec -->
  <path d="M 180,665 L 680,665" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="230" y="652" width="145" height="20" fill="#ffffff"/>
  <text x="235" y="667" font-size="13" font-weight="bold" fill="#7c3aed">ChangeCipherSpec</text>

  <!-- Finished -->
  <path d="M 180,715 L 680,715" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="230" y="702" width="140" height="20" fill="#ffffff"/>
  <text x="235" y="717" font-size="13" font-weight="bold" fill="#7c3aed">Finished (암호화됨)</text>

  <!-- Server ChangeCipherSpec & Finished -->
  <!-- ChangeCipherSpec -->
  <path d="M 680,785 L 180,785" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="500" y="772" width="145" height="20" fill="#ffffff"/>
  <text x="505" y="787" font-size="13" font-weight="bold" fill="#7c3aed">ChangeCipherSpec</text>

  <!-- Finished -->
  <path d="M 680,835 L 180,835" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="505" y="822" width="140" height="20" fill="#ffffff"/>
  <text x="510" y="837" font-size="13" font-weight="bold" fill="#7c3aed">Finished (암호화됨)</text>

  <!-- Secure Communication Phase -->
  <rect x="180" y="955" width="500" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <path d="M 195,980 L 665,980" stroke="#059669" stroke-width="2.5" fill="none" marker-start="url(#a-green)" marker-end="url(#a-green)"/>
  <rect x="330" y="970" width="200" height="20" fill="#ecfdf5"/>
  <text x="430" y="985" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">이후 대칭키로 암호화된 통신</text>

  <!-- Bottom Lifeline End Caps -->
  <rect x="110" y="1050" width="140" height="30" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="180" y="1070" font-size="13" fill="#52606d" text-anchor="middle">Client</text>

  <rect x="610" y="1050" width="140" height="30" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="680" y="1070" font-size="13" fill="#52606d" text-anchor="middle">Server</text>
</svg>