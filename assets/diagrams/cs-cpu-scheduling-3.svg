<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 740" width="880" height="740" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SRTF 실행 순서와 선점 과정</title>
  <desc id="d">SRTF(선점)의 간트 차트와 작업별 대기 구간, 시점별 판단 과정입니다. t=2에 P1, t=4에 P2가 선점되어 P1(0~2), P2(2~4), P3(4~5), P2(5~7), P4(7~11), P1(11~16) 순으로 실행됩니다. 대기 시간은 P1=(16-0)-7=9, P2=(7-2)-4=1, P3=(5-4)-1=0, P4=(11-5)-4=2로 평균 3.0입니다.</desc>
  <rect width="880" height="740" fill="#ffffff"/>
  <!-- 범례 -->
  <path d="M506,25 L520,25 L513,37 Z" fill="#374151"/>
  <text x="526" y="37" font-size="15" fill="#111827">도착</text>
  <rect x="578" y="23" width="32" height="16" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="618" y="37" font-size="15" fill="#111827">대기 (Ready 큐)</text>
  <rect x="752" y="23" width="8" height="16" fill="#dbeafe"/>
  <rect x="760" y="23" width="8" height="16" fill="#d1fae5"/>
  <rect x="768" y="23" width="8" height="16" fill="#fef3c7"/>
  <rect x="776" y="23" width="8" height="16" fill="#ede9fe"/>
  <rect x="752" y="23" width="32" height="16" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="792" y="37" font-size="15" fill="#111827">실행</text>
  <!-- CPU 간트 차트 -->
  <text x="24" y="100" font-size="17" font-weight="bold" fill="#111827">CPU</text>
  <text x="24" y="119" font-size="14" fill="#4b5563">실행 순서</text>
  <line x1="160" y1="75" x2="160" y2="82" stroke="#374151" stroke-width="1.5"/>
  <text x="160" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">0</text>
  <line x1="226" y1="75" x2="226" y2="82" stroke="#374151" stroke-width="1.5"/>
  <text x="226" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
  <line x1="292" y1="75" x2="292" y2="82" stroke="#374151" stroke-width="1.5"/>
  <text x="292" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">4</text>
  <line x1="325" y1="75" x2="325" y2="82" stroke="#374151" stroke-width="1.5"/>
  <text x="325" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">5</text>
  <line x1="391" y1="75" x2="391" y2="82" stroke="#374151" stroke-width="1.5"/>
  <text x="391" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">7</text>
  <line x1="523" y1="75" x2="523" y2="82" stroke="#374151" stroke-width="1.5"/>
  <text x="523" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">11</text>
  <line x1="688" y1="75" x2="688" y2="82" stroke="#374151" stroke-width="1.5"/>
  <text x="688" y="69" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">16</text>
  <rect x="161" y="82" width="64" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="193" y="110" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">P1</text>
  <rect x="227" y="82" width="64" height="44" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="259" y="110" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">P2</text>
  <rect x="293" y="82" width="31" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="308.5" y="110" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">P3</text>
  <rect x="326" y="82" width="64" height="44" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="358" y="110" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">P2</text>
  <rect x="392" y="82" width="130" height="44" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="457" y="110" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">P4</text>
  <rect x="524" y="82" width="163" height="44" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="605.5" y="110" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">P1</text>
  <!-- 간트 주석 -->
  <line x1="226" y1="129" x2="226" y2="137" stroke="#b91c1c" stroke-width="2"/>
  <text x="226" y="154" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">P1 선점</text>
  <line x1="292" y1="129" x2="292" y2="137" stroke="#b91c1c" stroke-width="2"/>
  <text x="292" y="154" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">P2 선점</text>
  <!-- 작업별 대기·실행 구간 -->
  <line x1="160" y1="170" x2="160" y2="398" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="226" y1="170" x2="226" y2="398" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="292" y1="170" x2="292" y2="398" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="325" y1="170" x2="325" y2="398" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="391" y1="170" x2="391" y2="398" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="523" y1="170" x2="523" y2="398" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="688" y1="170" x2="688" y2="398" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="856" y="150" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">대기 시간</text>
  <text x="856" y="170" font-size="14" fill="#4b5563" text-anchor="end">(종료 − 도착) − 버스트</text>
  <!-- P1 -->
  <text x="24" y="196" font-size="17" font-weight="bold" fill="#1e3a8a">P1</text>
  <text x="24" y="215" font-size="14" fill="#4b5563">도착 0 · 버스트 7</text>
  <rect x="161" y="184" width="64" height="30" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="227" y="184" width="295" height="30" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="374.5" y="204" font-size="15" fill="#374151" text-anchor="middle">대기 9</text>
  <rect x="524" y="184" width="163" height="30" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M153,171 L167,171 L160,182 Z" fill="#374151"/>
  <text x="856" y="205" font-size="17" fill="#111827" text-anchor="end"><tspan>(16 − 0) − 7 = </tspan><tspan font-weight="bold">9</tspan></text>
  <!-- P2 -->
  <text x="24" y="250" font-size="17" font-weight="bold" fill="#065f46">P2</text>
  <text x="24" y="269" font-size="14" fill="#4b5563">도착 2 · 버스트 4</text>
  <rect x="227" y="238" width="64" height="30" rx="2" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <rect x="293" y="238" width="31" height="30" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="326" y="238" width="64" height="30" rx="2" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <path d="M219,225 L233,225 L226,236 Z" fill="#374151"/>
  <text x="856" y="259" font-size="17" fill="#111827" text-anchor="end"><tspan>(7 − 2) − 4 = </tspan><tspan font-weight="bold">1</tspan></text>
  <!-- P3 -->
  <text x="24" y="304" font-size="17" font-weight="bold" fill="#92400e">P3</text>
  <text x="24" y="323" font-size="14" fill="#4b5563">도착 4 · 버스트 1</text>
  <rect x="293" y="292" width="31" height="30" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <path d="M285,279 L299,279 L292,290 Z" fill="#374151"/>
  <text x="856" y="313" font-size="17" fill="#111827" text-anchor="end"><tspan>(5 − 4) − 1 = </tspan><tspan font-weight="bold">0</tspan></text>
  <!-- P4 -->
  <text x="24" y="358" font-size="17" font-weight="bold" fill="#5b21b6">P4</text>
  <text x="24" y="377" font-size="14" fill="#4b5563">도착 5 · 버스트 4</text>
  <rect x="326" y="346" width="64" height="30" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="358" y="366" font-size="15" fill="#374151" text-anchor="middle">대기 2</text>
  <rect x="392" y="346" width="130" height="30" rx="2" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M318,333 L332,333 L325,344 Z" fill="#374151"/>
  <text x="856" y="367" font-size="17" fill="#111827" text-anchor="end"><tspan>(11 − 5) − 4 = </tspan><tspan font-weight="bold">2</tspan></text>
  <!-- 시간 눈금 -->
  <line x1="160" y1="398" x2="688" y2="398" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="160" y1="398" x2="160" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="420" font-size="14" fill="#4b5563" text-anchor="middle">0</text>
  <line x1="193" y1="398" x2="193" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="193" y="420" font-size="14" fill="#4b5563" text-anchor="middle">1</text>
  <line x1="226" y1="398" x2="226" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="420" font-size="14" fill="#4b5563" text-anchor="middle">2</text>
  <line x1="259" y1="398" x2="259" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="259" y="420" font-size="14" fill="#4b5563" text-anchor="middle">3</text>
  <line x1="292" y1="398" x2="292" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="292" y="420" font-size="14" fill="#4b5563" text-anchor="middle">4</text>
  <line x1="325" y1="398" x2="325" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="325" y="420" font-size="14" fill="#4b5563" text-anchor="middle">5</text>
  <line x1="358" y1="398" x2="358" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="358" y="420" font-size="14" fill="#4b5563" text-anchor="middle">6</text>
  <line x1="391" y1="398" x2="391" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="391" y="420" font-size="14" fill="#4b5563" text-anchor="middle">7</text>
  <line x1="424" y1="398" x2="424" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="424" y="420" font-size="14" fill="#4b5563" text-anchor="middle">8</text>
  <line x1="457" y1="398" x2="457" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="457" y="420" font-size="14" fill="#4b5563" text-anchor="middle">9</text>
  <line x1="490" y1="398" x2="490" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="420" font-size="14" fill="#4b5563" text-anchor="middle">10</text>
  <line x1="523" y1="398" x2="523" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="523" y="420" font-size="14" fill="#4b5563" text-anchor="middle">11</text>
  <line x1="556" y1="398" x2="556" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="556" y="420" font-size="14" fill="#4b5563" text-anchor="middle">12</text>
  <line x1="589" y1="398" x2="589" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="589" y="420" font-size="14" fill="#4b5563" text-anchor="middle">13</text>
  <line x1="622" y1="398" x2="622" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="622" y="420" font-size="14" fill="#4b5563" text-anchor="middle">14</text>
  <line x1="655" y1="398" x2="655" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="655" y="420" font-size="14" fill="#4b5563" text-anchor="middle">15</text>
  <line x1="688" y1="398" x2="688" y2="404" stroke="#6b7280" stroke-width="1.5"/>
  <text x="688" y="420" font-size="14" fill="#4b5563" text-anchor="middle">16</text>
  <text x="24" y="420" font-size="14" fill="#4b5563">시간</text>
  <!-- 아래 설명 -->
  <rect x="24" y="444" width="832" height="196" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="476" font-size="16" font-weight="bold" fill="#111827">t=2</text>
  <text x="112" y="476" font-size="16" fill="#111827">P2(4) &lt; P1 남은시간(5)</text>
  <text x="430" y="476" font-size="16" fill="#4b5563">→</text>
  <text x="462" y="476" font-size="16" font-weight="bold" fill="#111827"><tspan fill="#1e3a8a">P1</tspan> <tspan fill="#b91c1c">선점</tspan></text>
  <line x1="40" y1="488" x2="840" y2="488" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="512" font-size="16" font-weight="bold" fill="#111827">t=4</text>
  <text x="112" y="512" font-size="16" fill="#111827">P3(1) &lt; P2 남은시간(2)</text>
  <text x="430" y="512" font-size="16" fill="#4b5563">→</text>
  <text x="462" y="512" font-size="16" font-weight="bold" fill="#111827"><tspan fill="#065f46">P2</tspan> <tspan fill="#b91c1c">선점</tspan></text>
  <line x1="40" y1="524" x2="840" y2="524" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="548" font-size="16" font-weight="bold" fill="#111827">t=5</text>
  <text x="112" y="548" font-size="16" fill="#111827">P3 종료, 남은 것 P2(2) P4(4) P1(5)</text>
  <text x="430" y="548" font-size="16" fill="#4b5563">→</text>
  <text x="462" y="548" font-size="16" font-weight="bold" fill="#111827"><tspan fill="#065f46">P2</tspan></text>
  <line x1="40" y1="560" x2="840" y2="560" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="584" font-size="16" font-weight="bold" fill="#111827">t=7</text>
  <text x="112" y="584" font-size="16" fill="#111827">P2 종료</text>
  <text x="430" y="584" font-size="16" fill="#4b5563">→</text>
  <text x="462" y="584" font-size="16" font-weight="bold" fill="#111827"><tspan fill="#5b21b6">P4(4)</tspan></text>
  <line x1="40" y1="596" x2="840" y2="596" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="620" font-size="16" font-weight="bold" fill="#111827">t=11</text>
  <text x="112" y="620" font-size="16" fill="#111827">P4 종료</text>
  <text x="430" y="620" font-size="16" fill="#4b5563">→</text>
  <text x="462" y="620" font-size="16" font-weight="bold" fill="#111827"><tspan fill="#1e3a8a">P1(5)</tspan></text>
  <!-- 평균 대기 시간 -->
  <rect x="24" y="660" width="832" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="693" font-size="18" fill="#111827"><tspan font-weight="bold">평균 대기 시간</tspan><tspan> = (9+1+0+2)/4 = </tspan><tspan font-size="20" font-weight="bold" fill="#1d4ed8">3.0</tspan></text>
</svg>
