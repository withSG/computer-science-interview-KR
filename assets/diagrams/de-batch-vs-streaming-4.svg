<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Lambda 아키텍처의 두 경로</title>
  <desc id="d">불변 로그인 원본 데이터가 배치 레이어와 스피드 레이어로 갈라졌다가 서빙 레이어에서 합쳐져 조회된다. 조회 시점에는 배치 결과(어제까지 확정)와 스피드 결과(오늘분 근사)를 합쳐서 응답한다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 원본 데이터 -->
  <rect x="24" y="152" width="140" height="76" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="94" y="185" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">원본 데이터</text>
  <text x="94" y="208" font-size="15" fill="#374151" text-anchor="middle">(불변 로그)</text>

  <!-- 갈라지는 선 -->
  <path d="M164,190 H192" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M192,190 V95 H222" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M192,190 V285 H222" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>

  <!-- 배치 레이어 -->
  <rect x="224" y="40" width="300" height="110" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="244" y="73" font-size="18" font-weight="bold" fill="#1d4ed8">배치 레이어</text>
  <text x="244" y="102" font-size="15" fill="#1f2937">전체 원본을 주기적으로 재계산</text>
  <text x="244" y="127" font-size="15" fill="#1f2937">느리지만 정확하고 확정적</text>

  <!-- 스피드 레이어 -->
  <rect x="224" y="230" width="300" height="110" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="244" y="263" font-size="18" font-weight="bold" fill="#b45309">스피드 레이어</text>
  <text x="244" y="292" font-size="15" fill="#1f2937">최근 데이터만 실시간 근사 계산</text>
  <text x="244" y="317" font-size="15" fill="#1f2937">배치 결과가 나오면 폐기</text>

  <!-- 합쳐지는 선 -->
  <path d="M524,95 H556 V190" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M524,285 H556 V190" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M556,190 H586" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 서빙 레이어 -->
  <rect x="588" y="152" width="150" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="663" y="196" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">서빙 레이어</text>

  <!-- 조회 -->
  <path d="M738,190 H778" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <rect x="780" y="166" width="76" height="48" rx="24" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="818" y="196" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">조회</text>

  <!-- 조회 시점의 응답 구성 -->
  <line x1="24" y1="372" x2="856" y2="372" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="24" y="423" font-size="16" font-weight="bold" fill="#111827">조회 시점</text>

  <rect x="120" y="392" width="250" height="62" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="245" y="418" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">배치 결과</text>
  <text x="245" y="441" font-size="15" fill="#1f2937" text-anchor="middle">어제까지 확정</text>

  <text x="396" y="432" font-size="24" font-weight="bold" fill="#374151" text-anchor="middle">+</text>

  <rect x="422" y="392" width="250" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="547" y="418" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">스피드 결과</text>
  <text x="547" y="441" font-size="15" fill="#1f2937" text-anchor="middle">오늘분 근사</text>

  <path d="M684,423 H726" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="738" y="429" font-size="16" font-weight="bold" fill="#111827">합쳐서 응답</text>
</svg>
