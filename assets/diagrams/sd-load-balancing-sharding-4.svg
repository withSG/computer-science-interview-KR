<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">user_id 샤딩과 산탄-수집</title>
  <desc id="d">샤딩 키를 user_id로 잡은 주문 테이블에서 내 주문 목록 조회는 user_id를 아니까 샤드 1개만 조회해 빠르다. 어제 주문 전체 통계는 모든 샤드에 쿼리를 뿌리고(scatter) 결과를 애플리케이션에서 합쳐야(gather) 하므로, 샤드 하나만 느려도 전체가 그만큼 느려진다.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="680" fill="#ffffff"/>

  <text x="24" y="46" font-size="18" font-weight="bold" fill="#111827">샤딩 키를 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_id</tspan>로 잡은 주문 테이블</text>

  <!-- [O] 내 주문 목록 조회 -->
  <rect x="24" y="68" width="832" height="208" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="48" y="113" width="220" height="76" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <circle cx="76" cy="137" r="14" fill="#047857"/>
  <text x="76" y="143" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">O</text>
  <text x="98" y="143" font-size="16" font-weight="bold" fill="#111827">내 주문 목록 조회</text>
  <text x="64" y="175" font-size="15" font-weight="bold" fill="#065f46"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user_id</tspan>를 아니까</text>
  <line x1="272" y1="151" x2="384" y2="151" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect x="392" y="90" width="140" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="462" y="112" font-size="15" fill="#4b5563" text-anchor="middle">샤드 1</text>
  <rect x="392" y="134" width="140" height="34" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="462" y="157" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">샤드 2</text>
  <rect x="392" y="178" width="140" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="462" y="200" font-size="15" fill="#4b5563" text-anchor="middle">샤드 3</text>
  <rect x="392" y="222" width="140" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="462" y="244" font-size="15" fill="#4b5563" text-anchor="middle">샤드 4</text>

  <line x1="536" y1="151" x2="648" y2="151" stroke="#047857" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="656" y="113" width="180" height="76" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="746" y="143" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">샤드 1개만 조회</text>
  <text x="746" y="174" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">빠르다</text>

  <!-- [X] 어제 주문 전체 통계 -->
  <rect x="24" y="300" width="832" height="350" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="48" y="399" width="220" height="56" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="76" cy="427" r="14" fill="#b91c1c"/>
  <text x="76" y="433" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">X</text>
  <text x="98" y="433" font-size="16" font-weight="bold" fill="#111827">어제 주문 전체 통계</text>

  <text x="329" y="332" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">① scatter</text>
  <line x1="272" y1="427" x2="384" y2="361" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="272" y1="427" x2="384" y2="405" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="272" y1="427" x2="384" y2="449" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="272" y1="427" x2="384" y2="493" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="392" y="344" width="140" height="34" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="462" y="367" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">샤드 1</text>
  <rect x="392" y="388" width="140" height="34" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="462" y="411" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">샤드 2</text>
  <rect x="392" y="432" width="140" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="462" y="455" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">샤드 3 · 느림</text>
  <rect x="392" y="476" width="140" height="34" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="462" y="499" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">샤드 4</text>

  <text x="594" y="332" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">② gather</text>
  <line x1="540" y1="361" x2="648" y2="400" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <line x1="540" y1="405" x2="648" y2="418" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <line x1="540" y1="449" x2="648" y2="436" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <line x1="540" y1="493" x2="648" y2="454" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <rect x="656" y="389" width="180" height="76" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="746" y="419" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">애플리케이션</text>
  <text x="746" y="447" font-size="15" fill="#374151" text-anchor="middle">결과 합치기</text>

  <text x="48" y="546" font-size="15" fill="#1f2937">① 모든 샤드에 쿼리를 뿌리고(scatter)</text>
  <text x="48" y="572" font-size="15" fill="#1f2937">② 결과를 애플리케이션에서 합쳐야(gather) 한다</text>
  <rect x="48" y="590" width="340" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="64" y="616" font-size="16" font-weight="bold" fill="#b91c1c">샤드 하나만 느려도 전체가 그만큼 느려진다</text>
</svg>
