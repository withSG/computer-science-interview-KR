<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">샤딩 키가 왜 가장 중요한가</title>
  <desc id="d">샤딩 키를 user_id로 잡은 주문 테이블에서 [O] 내 주문 목록 조회는 한 샤드만 조회하여 빠른 반면, [X] 어제 주문 전체 통계는 scatter-gather 패턴으로 인해 전체 샤드가 연결되어 성능이 저하됨을 설명하는 다이어그램입니다.</desc>
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 메인 헤더 박스 -->
  <rect x="240" y="24" width="400" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="49" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">샤딩 키를 user_id로 잡은 주문 테이블</text>

  <!-- [O] 성공/효율적 쿼리 구역 -->
  <g>
    <!-- 구역 배경 및 테두리 -->
    <rect x="30" y="88" width="820" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    
    <!-- 아이콘/태그 -->
    <rect x="46" y="104" width="36" height="28" rx="4" fill="#059669"/>
    <text x="64" y="123" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">[O]</text>

    <!-- 쿼리 라벨 -->
    <text x="96" y="123" font-size="14" font-weight="bold" fill="#1f2933">"내 주문 목록 조회"</text>

    <!-- 화살표 -->
    <path d="M260,128 L320,128" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

    <!-- 설명 텍스트 -->
    <text x="330" y="123" font-size="13" font-weight="bold" fill="#059669"> user_id를 아니까 샤드 1개만 조회. 빠르다</text>
  </g>

  <!-- [X] 비효율적/Scatter-Gather 쿼리 구역 -->
  <g>
    <!-- 구역 배경 및 테두리 -->
    <rect x="30" y="184" width="820" height="162" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>

    <!-- 아이콘/태그 -->
    <rect x="46" y="200" width="36" height="28" rx="4" fill="#dc2626"/>
    <text x="64" y="219" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">[X]</text>

    <!-- 쿼리 라벨 -->
    <text x="96" y="219" font-size="14" font-weight="bold" fill="#1f2933">"어제 주문 전체 통계"</text>

    <!-- 화살표 -->
    <path d="M260,224 L320,224" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

    <!-- 멀티 라인 설명 텍스트 -->
    <text x="330" y="219" font-size="13" fill="#dc2626">모든 샤드에 쿼리를 뿌리고(scatter)</text>
    <text x="330" y="255" font-size="13" fill="#dc2626">결과를 애플리케이션에서 합쳐야(gather) 한다</text>
    <text x="330" y="291" font-size="13" stroke="none" fill="#dc2626">샤드 하나만 느려도 전체가 그만큼 느려진다</text>
  </g>
</svg>