<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">주축과 교차축</title>
  <desc id="d">flex-direction: row와 column 설정에 따른 주축과 교차축의 방향 및 justify-*와 align-* 속성의 역할을 보여주는 다이어그램</desc>
  <defs>
    <!-- Dark Ink Marker -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- Blue Marker for Main Axis -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <!-- Green Marker for Cross Axis -->
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- LEFT SECTION: flex-direction: row (기본) -->
  <!-- Title: flex-direction: row (기본) -->
  <text x="40" y="45" font-size="14" font-weight="bold" fill="#1f2933">flex-direction: row (기본)</text>

  <!-- Main Axis Label & Arrow (Row) -->
  <text x="180" y="70.5" font-size="13" font-weight="bold" fill="#2563eb">주축 →</text>
  <path d="M225,66 L370,66" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Cross Axis Label & Arrow (Row) -->
  <text x="40" y="105.5" font-size="13" font-weight="bold" fill="#059669">교</text>
  <text x="40" y="125.5" font-size="13" font-weight="bold" fill="#059669">차</text>
  <text x="40" y="145.5" font-size="13" font-weight="bold" fill="#059669">축</text>
  <text x="40" y="170.5" font-size="13" font-weight="bold" fill="#059669">↓</text>
  <path d="M46,180 L46,220" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- Outer Flex Container (Row) -->
  <rect x="70" y="90" width="310" height="140" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>

  <!-- Child Items (Row) -->
  <!-- Item 1 -->
  <rect x="95" y="125" width="60" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="125" y="164.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

  <!-- Item 2 -->
  <rect x="195" y="125" width="60" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="225" y="164.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

  <!-- Item 3 -->
  <rect x="295" y="125" width="60" height="70" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="325" y="164.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>


  <!-- RIGHT SECTION: flex-direction: column -->
  <!-- Title: flex-direction: column -->
  <text x="500" y="45" font-size="14" font-weight="bold" fill="#1f2933">flex-direction: column</text>

  <!-- Cross Axis Label & Arrow (Column) -->
  <text x="635" y="70.5" font-size="13" font-weight="bold" fill="#059669">교차축 →</text>
  <path d="M690,66 L780,66" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- Main Axis Label & Arrow (Column) -->
  <text x="500" y="105.5" font-size="13" font-weight="bold" fill="#2563eb">주</text>
  <text x="500" y="125.5" font-size="13" font-weight="bold" fill="#2563eb">축</text>
  <text x="500" y="160.5" font-size="13" font-weight="bold" fill="#2563eb">│</text>
  <text x="500" y="200.5" font-size="13" font-weight="bold" fill="#2563eb">↓</text>
  <path d="M506,210 L506,280" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Outer Flex Container (Column) -->
  <rect x="530" y="90" width="260" height="210" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="4"/>

  <!-- Child Items (Column) -->
  <!-- Item 1 -->
  <rect x="560" y="115" width="200" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="660" y="149.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

  <!-- Item 2 -->
  <rect x="560" y="215" width="200" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="660" y="249.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

  <!-- Side Note / Annotation for Column -->
  <text x="805" y="125.5" font-size="13" fill="#52606d">축이 통째로</text>
  <text x="805" y="145.5" font-size="13" fill="#52606d">90도 돌았다</text>


  <!-- BOTTOM SECTION: Legend / Key Formula -->
  <rect x="70" y="270" width="370" height="35" fill="#fffbeb" stroke="#d97706" stroke-width="1" rx="4"/>
  <text x="255" y="292.05" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">
    <tspan fill="#2563eb">justify-*</tspan> = 주축      <tspan fill="#059669">align-*</tspan> = 교차축
  </text>
</svg>