<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">주축과 교차축</title>
  <desc id="d">flex-direction: row에서는 주축이 가로, 교차축이 세로이고, column에서는 축이 통째로 90도 돌아 주축이 세로가 된다. justify-*는 주축, align-*는 교차축을 담당한다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ===== row ===== -->
  <text x="40" y="44" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">flex-direction: row<tspan font-size="15" font-weight="normal" fill="#4b5563"> (기본)</tspan></text>

  <!-- 주축 (가로) -->
  <text x="248" y="76" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">주축</text>
  <line x1="96" y1="88" x2="398" y2="88" stroke="#1d4ed8" stroke-width="3" marker-end="url(#am)"/>

  <!-- 교차축 (세로) -->
  <g font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">
    <text x="44" y="150">교</text>
    <text x="44" y="172">차</text>
    <text x="44" y="194">축</text>
  </g>
  <line x1="72" y1="106" x2="72" y2="234" stroke="#047857" stroke-width="3" marker-end="url(#ac)"/>

  <rect x="96" y="106" width="304" height="130" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="116" y="130" width="64" height="82" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="148" y="178" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
  <rect x="192" y="130" width="64" height="82" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="224" y="178" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">2</text>
  <rect x="268" y="130" width="64" height="82" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="300" y="178" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">3</text>

  <!-- 범례: 속성과 축 -->
  <rect x="96" y="260" width="304" height="76" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="114" y1="287" x2="146" y2="287" stroke="#1d4ed8" stroke-width="3" marker-end="url(#am)"/>
  <text x="160" y="293" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">justify-*</tspan> = 주축</text>
  <line x1="114" y1="317" x2="146" y2="317" stroke="#047857" stroke-width="3" marker-end="url(#ac)"/>
  <text x="160" y="323" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">align-*</tspan> = 교차축</text>

  <!-- ===== column ===== -->
  <text x="470" y="44" font-size="17" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">flex-direction: column</text>

  <!-- 교차축 (가로) -->
  <text x="640" y="76" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">교차축</text>
  <line x1="540" y1="88" x2="738" y2="88" stroke="#047857" stroke-width="3" marker-end="url(#ac)"/>

  <!-- 주축 (세로) -->
  <g font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
    <text x="490" y="200">주</text>
    <text x="490" y="222">축</text>
  </g>
  <line x1="516" y1="106" x2="516" y2="334" stroke="#1d4ed8" stroke-width="3" marker-end="url(#am)"/>

  <rect x="540" y="106" width="200" height="230" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="560" y="126" width="160" height="66" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="640" y="166" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">1</text>
  <rect x="560" y="206" width="160" height="66" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="640" y="246" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">2</text>

  <!-- 메모 -->
  <text x="760" y="200" font-size="15" font-weight="bold" fill="#374151">축이 통째로</text>
  <text x="760" y="222" font-size="15" font-weight="bold" fill="#374151">90도 돌았다</text>
</svg>
