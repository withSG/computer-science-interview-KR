<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SSL Stripping 공격 흐름</title>
  <desc id="d">사용자가 example.com을 입력하면 브라우저가 평문 GET http://example.com을 보내고, 공격자가 이를 가로채 사용자에게는 http로, 진짜 서버와는 https로 통신합니다. 사용자는 눈치채지 못하고 비밀번호는 공격자를 지나갑니다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>

  <text x="32" y="44" font-size="20" font-weight="bold" fill="#111827">SSL Stripping</text>

  <!-- 타임라인 세로선 -->
  <line x1="52" y1="108" x2="52" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="52" y1="178" x2="52" y2="216" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="52" y1="254" x2="52" y2="390" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ① 사용자 입력 -->
  <circle cx="52" cy="90" r="16" fill="#374151"/>
  <text x="52" y="96" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="88" y="68" width="244" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="104" y="96" font-size="16" fill="#111827">사용자 입력: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">example.com</tspan></text>

  <!-- ② 브라우저 평문 요청 -->
  <circle cx="52" cy="160" r="16" fill="#374151"/>
  <text x="52" y="166" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="88" y="138" width="336" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="104" y="166" font-size="16" fill="#111827">브라우저: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">GET http://example.com</tspan></text>
  <text x="440" y="166" font-size="16" font-weight="bold" fill="#b91c1c">← 평문! 여기가 노출 지점</text>

  <!-- ③ 공격자가 가로챈다 -->
  <circle cx="52" cy="236" r="16" fill="#374151"/>
  <text x="52" y="242" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="88" y="208" width="760" height="164" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="108" y="242" font-size="18" font-weight="bold" fill="#b91c1c">공격자가 가로챈다</text>

  <!-- 노드 -->
  <rect x="104" y="282" width="112" height="64" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="309" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">사용자</text>
  <text x="160" y="332" font-size="14" fill="#4b5563" text-anchor="middle">(브라우저)</text>

  <rect x="424" y="282" width="104" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="476" y="320" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">공격자</text>

  <rect x="720" y="282" width="112" height="64" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="776" y="320" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">진짜 서버</text>

  <!-- 링크 A: http -->
  <line x1="222" y1="314" x2="418" y2="314" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#ah-red)" marker-end="url(#ah-red)"/>
  <text x="320" y="272" font-size="15" fill="#111827" text-anchor="middle">사용자에게는 계속</text>
  <text x="320" y="296" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">http로 응답 (자물쇠 없음)</text>

  <!-- 링크 B: https -->
  <line x1="534" y1="314" x2="714" y2="314" stroke="#1d4ed8" stroke-width="3" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
  <text x="624" y="272" font-size="15" fill="#111827" text-anchor="middle">진짜 서버와는</text>
  <text x="624" y="296" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">https로 통신</text>

  <!-- ④ 사용자는 넘어간다 -->
  <circle cx="52" cy="410" r="16" fill="#374151"/>
  <text x="52" y="416" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="90" y="416" font-size="16" fill="#111827">사용자는 "원래 이 사이트가 이랬나" 하고 넘어간다</text>
  <rect x="88" y="436" width="380" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="278" y="464" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">입력한 비밀번호는 공격자를 지나간다</text>
</svg>
