<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HSTS — 첫 요청의 빈틈을 막는다 (SSL Stripping)</title>
  <desc id="d">사용자가 example.com을 입력했을 때 HTTP 평문 요청을 공격자가 가로채어 중간에서 HTTP와 HTTPS로 매개하는 SSL Stripping 공격 과정</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 메인 박스 (SSL Stripping 구역) -->
  <rect x="24" y="20" width="832" height="350" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="51" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">[ SSL Stripping ]</text>

  <!-- Node 1: 사용자 입력 -->
  <rect x="330" y="70" width="220" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="93" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">사용자 입력: example.com</text>

  <!-- 화살표: 사용자 입력 -> 브라우저 -->
  <path d="M440,106 L440,128" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Node 2: 브라우저 -->
  <rect x="240" y="130" width="400" height="38" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="154" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">브라우저: GET http://example.com</text>

  <!-- 브라우저 라벨 오른쪽 부가설명 -->
  <rect x="480" y="141" width="150" height="18" fill="#fef2f2" rx="2"/>
  <text x="555" y="154" fill="#dc2626" font-size="11.5" font-weight="bold" text-anchor="middle">← 평문! 여기가 노출 지점</text>

  <!-- 메인 수직 메인 라인 (브라우저 하단에서 내려오는 선) -->
  <path d="M300,168 L300,285" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- 분기 1: 공격자가 가로챈다 -->
  <path d="M300,200 L388,200" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Node 3: 공격자 컨테이너 -->
  <rect x="396" y="175" width="430" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="410" y="196" fill="#dc2626" font-size="13" font-weight="bold">공격자가 가로챈다</text>

  <!-- 하위 항목들 -->
  <text x="430" y="221" fill="#1f2933" font-size="13">├─ 사용자에게는 계속 http로 응답 (자물쇠 없음)</text>
  <text x="430" y="243" fill="#1f2933" font-size="13">└─ 진짜 서버와는 https로 통신</text>

  <!-- 분기 2: 사용자는 넘어간다 & 비밀번호 노출 -->
  <path d="M300,285 L320,285" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <text x="325" y="289" fill="#1f2933" font-size="13">└─ 사용자는 "원래 이 사이트가 이랬나" 하고 넘어간다</text>
  <text x="346" y="315" fill="#dc2626" font-size="13" font-weight="bold">입력한 비밀번호는 공격자를 지나간다</text>

</svg>