<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">균형 BST와 편향 BST 비교</title>
  <desc id="d">왼쪽의 균형 잡힌 BST에서는 7을 8, 3, 6과 차례로 비교해 3회 만에 찾는다. 오른쪽처럼 1,2,3,4,5를 순서대로 삽입하면 높이가 n인 한 줄 트리가 되어 모든 연산이 O(n)이 된다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="24" y="24" width="412" height="532" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="452" y="24" width="404" height="532" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="44" y="60" font-size="19" font-weight="bold" fill="#1e3a8a">균형 잡힌 BST</text>
  <text x="472" y="60" font-size="19" font-weight="bold" fill="#991b1b">1,2,3,4,5를 순서대로 삽입하면</text>
  <line x1="220" y1="118.1" x2="162" y2="161.9" stroke="#1d4ed8" stroke-width="3.5"/>
  <line x1="252" y1="118.1" x2="310" y2="161.9" stroke="#9ca3af" stroke-width="2"/>
  <line x1="134.2" y1="190.1" x2="107.8" y2="225.9" stroke="#9ca3af" stroke-width="2"/>
  <line x1="157.8" y1="190.1" x2="184.2" y2="225.9" stroke="#1d4ed8" stroke-width="3.5"/>
  <line x1="337.8" y1="190.1" x2="364.2" y2="225.9" stroke="#9ca3af" stroke-width="2"/>
  <line x1="185.9" y1="259.2" x2="166.1" y2="292.8" stroke="#9ca3af" stroke-width="2"/>
  <line x1="206.1" y1="259.2" x2="225.9" y2="292.8" stroke="#1d4ed8" stroke-width="3.5"/>
  <line x1="367.9" y1="260.3" x2="354.1" y2="291.7" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="96" cy="242" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="96" y="247.9" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">1</text>
  <circle cx="146" cy="174" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="146" y="179.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3</text>
  <circle cx="156" cy="310" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="156" y="315.9" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">4</text>
  <circle cx="196" cy="242" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="196" y="247.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">6</text>
  <circle cx="236" cy="310" r="20" fill="#047857" stroke="#047857" stroke-width="2"/>
  <text x="236" y="315.9" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <circle cx="236" cy="106" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="236" y="112" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">8</text>
  <circle cx="326" cy="174" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="326" y="179.9" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">10</text>
  <circle cx="346" cy="310" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="346" y="315.9" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">13</text>
  <circle cx="376" cy="242" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="376" y="247.9" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">14</text>
  <circle cx="176.5" cy="120.9" r="12" fill="#1d4ed8"/>
  <text x="176.5" y="125.9" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="190.3" cy="193.8" r="12" fill="#1d4ed8"/>
  <text x="190.3" y="198.8" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="236.7" cy="263.8" r="12" fill="#1d4ed8"/>
  <text x="236.7" y="268.8" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="44" y="372" width="372" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="402" font-size="17" font-weight="bold" fill="#1e3a8a">7 찾기</text>
  <circle cx="76" cy="426" r="12" fill="#1d4ed8"/>
  <text x="76" y="431" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="98" y="432" font-size="16" fill="#1f2937">8보다 작다 → <tspan font-weight="bold">왼쪽</tspan></text>
  <circle cx="76" cy="454" r="12" fill="#1d4ed8"/>
  <text x="76" y="459" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="98" y="460" font-size="16" fill="#1f2937">3보다 크다 → <tspan font-weight="bold">오른쪽</tspan></text>
  <circle cx="76" cy="482" r="12" fill="#1d4ed8"/>
  <text x="76" y="487" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="98" y="488" font-size="16" fill="#1f2937">6보다 크다 → <tspan font-weight="bold">오른쪽</tspan></text>
  <text x="64" y="522" font-size="17" font-weight="bold" fill="#047857">비교 3회로 도착</text>
  <line x1="553.2" y1="121" x2="586.8" y2="159" stroke="#b91c1c" stroke-width="2"/>
  <line x1="613.2" y1="189" x2="646.8" y2="227" stroke="#b91c1c" stroke-width="2"/>
  <line x1="673.2" y1="257" x2="706.8" y2="295" stroke="#b91c1c" stroke-width="2"/>
  <line x1="735.2" y1="323" x2="762" y2="346" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="540" cy="106" r="20" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="540" y="112" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">1</text>
  <circle cx="600" cy="174" r="20" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="600" y="179.9" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">2</text>
  <circle cx="660" cy="242" r="20" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="660" y="247.9" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">3</text>
  <circle cx="720" cy="310" r="20" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="720" y="315.9" font-size="17" font-weight="bold" fill="#991b1b" text-anchor="middle">4</text>
  <text x="786" y="356" font-size="20" font-weight="bold" fill="#991b1b" text-anchor="middle">…</text>
  <line x1="490" y1="86" x2="490" y2="350" stroke="#b91c1c" stroke-width="2" marker-start="url(#m-red)" marker-end="url(#m-red)"/>
  <text x="504" y="246" font-size="18" font-weight="bold" fill="#991b1b">높이 = n</text>
  <rect x="472" y="372" width="364" height="164" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="492" y="436" font-size="19" font-weight="bold" fill="#991b1b">모든 연산이 O(n).</text>
  <text x="492" y="470" font-size="16" fill="#1f2937">포인터 하나 더 붙은 연결 리스트다</text>
</svg>
