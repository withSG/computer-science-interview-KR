<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BST의 정의 및 균형과 편향 비교</title>
  <desc id="d">균형 잡힌 이진 탐색 트리와 1부터 5까지 순서대로 삽입하여 편향된 이진 탐색 트리를 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 영역 1: 균형 잡힌 BST -->
  <rect x="24" y="20" width="410" height="460" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="40" y="48" font-size="16" font-weight="bold" fill="#2563eb">균형 잡힌 BST</text>

  <!-- 트리 노드 및 연결선 (Left Tree) -->
  <!-- Line Connections -->
  <line x1="200" y1="85" x2="130" y2="135" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="200" y1="85" x2="270" y2="135" stroke="#9aa5b1" stroke-width="2"/>

  <line x1="130" y1="135" x2="80" y2="195" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="130" y1="135" x2="175" y2="195" stroke="#2563eb" stroke-width="2.5"/> <!-- Search path -->

  <line x1="270" y1="135" x2="330" y2="195" stroke="#9aa5b1" stroke-width="2"/>

  <line x1="175" y1="195" x2="130" y2="255" stroke="#9aa5b1" stroke-width="2"/>
  <line x1="175" y1="195" x2="220" y2="255" stroke="#2563eb" stroke-width="2.5"/> <!-- Search path -->

  <line x1="330" y1="195" x2="290" y2="255" stroke="#9aa5b1" stroke-width="2"/>

  <!-- Nodes (Left Tree) -->
  <!-- Node 8 (Highlighted Start) -->
  <circle cx="200" cy="85" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="90" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">8</text>

  <!-- Node 3 (Highlighted Path) -->
  <circle cx="130" cy="135" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="130" y="140" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

  <!-- Node 10 -->
  <circle cx="270" cy="135" r="18" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="270" y="140" font-size="14" fill="#1f2933" text-anchor="middle">10</text>

  <!-- Node 1 -->
  <circle cx="80" cy="195" r="18" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="80" y="200" font-size="14" fill="#1f2933" text-anchor="middle">1</text>

  <!-- Node 6 (Highlighted Path) -->
  <circle cx="175" cy="195" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="175" y="200" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">6</text>

  <!-- Node 14 -->
  <circle cx="330" cy="195" r="18" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="330" y="200" font-size="14" fill="#1f2933" text-anchor="middle">14</text>

  <!-- Node 4 -->
  <circle cx="130" cy="255" r="18" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="130" y="260" font-size="14" fill="#1f2933" text-anchor="middle">4</text>

  <!-- Node 7 (Target - Double Ring) -->
  <circle cx="220" cy="255" r="18" fill="#059669" stroke="#059669" stroke-width="1.5"/>
  <circle cx="220" cy="255" r="22" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="220" y="260" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>

  <!-- Node 13 -->
  <circle cx="290" cy="255" r="18" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="290" y="260" font-size="14" fill="#1f2933" text-anchor="middle">13</text>

  <!-- Left Tree Note / Description -->
  <rect x="40" y="325" width="378" height="135" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="52" y="358" font-size="13" font-weight="bold" fill="#2563eb">7 찾기:</text>
  <text x="100" y="358" font-size="13" fill="#1f2933">8보다 작다→왼쪽, 3보다 크다→오른쪽,</text>
  <text x="100" y="388" font-size="13" fill="#1f2933">6보다 크다→오른쪽. 비교 3회로 도착</text>

  <!-- 영역 2: 편향된 BST -->
  <rect x="454" y="20" width="402" height="460" rx="8" fill="#fef2f2" stroke="#cbd2d9" stroke-width="1"/>
  <text x="470" y="48" font-size="16" font-weight="bold" fill="#dc2626">1,2,3,4,5를 순서대로 삽입하면</text>

  <!-- 트리 노드 및 연결선 (Right Skewed Tree) -->
  <line x1="530" y1="85" x2="580" y2="135" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="580" y1="135" x2="630" y2="195" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="630" y1="195" x2="680" y2="255" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Node 1 -->
  <circle cx="530" cy="85" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="530" y="90" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1</text>

  <!-- Node 2 -->
  <circle cx="580" cy="135" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="580" y="140" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2</text>

  <!-- Node 3 -->
  <circle cx="630" cy="195" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="630" y="200" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

  <!-- Node 4 -->
  <circle cx="680" cy="255" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="680" y="260" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

  <!-- ... 높이 = n -->
  <text x="712" y="260" font-size="13" font-weight="bold" fill="#dc2626">... 높이 = n</text>

  <!-- Right Tree Note / Description -->
  <rect x="470" y="325" width="370" height="135" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="486" y="365" font-size="13" font-weight="bold" fill="#dc2626">모든 연산이 O(n).</text>
  <text x="486" y="398" font-size="13" fill="#1f2933">포인터 하나 더 붙은 연결 리스트다</text>
</svg>