<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">수평 확장: 서버 1대에서 서버 N대로</title>
  <desc id="d">같은 크기의 서버를 여러 대 추가해 서버 1대를 서버 N대(S1, S2, S3 …)로 늘리는 Scale Out.</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 이전: 서버 1대 -->
  <rect x="40" y="40" width="180" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="74" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">서버 1대</text>
  <rect x="75" y="100" width="110" height="84" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="147.5" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">서버</text>

  <!-- 추가 화살표 -->
  <line x1="234" y1="142" x2="364" y2="142" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="300" y="128" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Scale Out</text>
  <text x="300" y="170" font-size="15" fill="#374151" text-anchor="middle">서버 대수 추가</text>

  <!-- 이후: 서버 N대 -->
  <rect x="380" y="40" width="460" height="180" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="610" y="74" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">서버 N대</text>
  <rect x="404" y="100" width="110" height="84" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="459" y="147.5" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S1</text>
  <rect x="530" y="100" width="110" height="84" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="585" y="147.5" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S2</text>
  <rect x="656" y="100" width="110" height="84" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="711" y="147.5" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S3</text>
  <circle cx="788" cy="142" r="3.5" fill="#1d4ed8"/>
  <circle cx="802" cy="142" r="3.5" fill="#1d4ed8"/>
  <circle cx="816" cy="142" r="3.5" fill="#1d4ed8"/>
</svg>
