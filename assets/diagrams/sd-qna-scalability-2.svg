<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">수평 확장 (Horizontal Scaling)</title>
  <desc id="d">서버 1대에서 서버 N대로 확장되며 내부의 S1, S2, S3 서버로 트래픽이 분산되는 수평 확장 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  
  <rect width="880" height="320" fill="#ffffff"/>
  
  <rect x="70" y="60" width="260" height="200" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="200" y="164.55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">서버 1대</text>
  
  <path d="M360,160 L450,160" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a-blue)"/>
  
  <rect x="480" y="60" width="330" height="200" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="645" y="104.55" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">서버 N대</text>
  
  <rect x="525" y="130" width="240" height="90" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <line x1="605" y1="130" x2="605" y2="220" stroke="#9aa5b1" stroke-width="1.5"/>
  <line x1="685" y1="130" x2="685" y2="220" stroke="#9aa5b1" stroke-width="1.5"/>
  
  <text x="565" y="179.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">S1</text>
  <text x="645" y="179.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">S2</text>
  <text x="725" y="179.55" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">S3</text>
</svg>