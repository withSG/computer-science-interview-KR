<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접관은 포트폴리오를 이렇게 읽는다</title>
  <desc id="d">포트폴리오 검토 시 면접관의 시선 이동 경로와 주요 평가 항목을 나타낸 흐름도</desc>
  <rect width="880" height="580" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title / Header Box -->
  <rect x="240" y="30" width="400" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="59" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">포트폴리오 도착</text>

  <!-- Vertical Main Trunk Line -->
  <path d="M440,78 L440,510" stroke="#cbd2d9" stroke-width="2" fill="none"/>

  <!-- Step 1 -->
  <path d="M440,115 L470,115" stroke="#cbd2d9" stroke-width="1.5" fill="none"/>
  <rect x="110" y="93" width="360" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="125" y="120" font-size="13" font-weight="bold" fill="#2563eb">[1]</text>
  <text x="150" y="120" font-size="13" fill="#1f2933">뭘 만든 건지 3줄 안에 파악되나?</text>

  <path d="M470,115 L520,115" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="530" y="119" font-size="12" fill="#dc2626">─── 안 되면 여기서 흥미가 꺼진다</text>

  <!-- Step 2 -->
  <path d="M440,195 L470,195" stroke="#cbd2d9" stroke-width="1.5" fill="none"/>
  <rect x="180" y="173" width="290" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="195" y="200" font-size="13" font-weight="bold" fill="#2563eb">[2]</text>
  <text x="220" y="200" font-size="13" fill="#1f2933">기술 스택 목록 확인</text>

  <path d="M470,195 L520,195" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="530" y="191" font-size="12" fill="#52606d">─── "React, TS, Redux, Next..."</text>
  <text x="555" y="209" font-size="12" fill="#52606d">→ 여기까지는 다들 비슷하다</text>

  <!-- Step 2 -> Step 3 Connector Down Arrow -->
  <path d="M325,217 L325,253" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 3 -->
  <path d="M440,275 L470,275" stroke="#cbd2d9" stroke-width="1.5" fill="none"/>
  <rect x="110" y="253" width="360" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="125" y="280" font-size="13" font-weight="bold" fill="#2563eb">[3]</text>
  <text x="150" y="280" font-size="13" fill="#1f2933">이 사람이 직접 한 건 어디까지?</text>

  <path d="M470,275 L520,275" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="530" y="279" font-size="12" fill="#52606d">─── 팀 프로젝트면 역할 구분을 찾는다</text>

  <!-- Step 4 (Highlighted Focus Area) -->
  <path d="M440,370 L470,370" stroke="#d97706" stroke-width="2" fill="none"/>
  <rect x="100" y="325" width="370" height="90" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="115" y="352" font-size="13" font-weight="bold" fill="#d97706">[4]</text>
  <text x="140" y="352" font-size="13" font-weight="bold" fill="#1f2933">결정의 흔적이 있나?</text>
  <text x="140" y="374" font-size="12" fill="#52606d">"왜 Redux였나", "왜 SSR이었나"</text>
  <text x="140" y="396" font-size="12" fill="#52606d">설명이 있으면 그걸 파고, 없으면 "왜 썼어요?"로 시작한다</text>

  <path d="M470,370 L520,370" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="530" y="374" font-size="12.5" font-weight="bold" fill="#d97706">─── ※ 여기가 질문의 원천</text>

  <!-- Step 5 -->
  <path d="M440,510 L470,510" stroke="#cbd2d9" stroke-width="1.5" fill="none"/>
  <rect x="110" y="488" width="360" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="125" y="515" font-size="13" font-weight="bold" fill="#2563eb">[5]</text>
  <text x="150" y="515" font-size="13" fill="#1f2933">README / 커밋 히스토리</text>

  <path d="M470,510 L520,510" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="530" y="514" font-size="12" fill="#52606d">─── 협업 습관을 추정한다</text>
</svg>