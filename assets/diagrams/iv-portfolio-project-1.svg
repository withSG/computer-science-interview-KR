<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접관의 포트폴리오 시선 경로</title>
  <desc id="d">포트폴리오가 도착하면 면접관은 [1] 무엇을 만들었는지, [2] 기술 스택, [3] 직접 한 범위, [4] 결정의 흔적, [5] README와 커밋 히스토리 순으로 본다. [2]까지는 다들 비슷하고 점수는 [3]과 [4]에서 갈리며, [4]가 질문의 원천이다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 시작 -->
  <rect x="254" y="24" width="200" height="40" rx="20" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="354" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">포트폴리오 도착</text>
  <path d="M354,66 V85" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 구간 괄호 A: [1]~[2] -->
  <path d="M154,90 H144 V214 H154" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <text x="134" y="146" text-anchor="end" font-size="15" fill="#4b5563">여기까지는</text>
  <text x="134" y="166" text-anchor="end" font-size="15" fill="#4b5563">다들 비슷하다</text>

  <!-- 구간 괄호 B: [3]~[4] -->
  <path d="M154,242 H144 V438 H154" stroke="#b45309" stroke-width="2.5" fill="none"/>
  <text x="134" y="334" text-anchor="end" font-size="16" font-weight="bold" fill="#b45309">점수가</text>
  <text x="134" y="355" text-anchor="end" font-size="16" font-weight="bold" fill="#b45309">갈리는 곳</text>

  <!-- [1] -->
  <rect x="160" y="88" width="388" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="190" cy="114" r="14" fill="#475569"/>
  <text x="190" y="119" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="216" y="120" font-size="17" font-weight="bold" fill="#111827">뭘 만든 건지 3줄 안에 파악되나?</text>
  <path d="M552,114 H574" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="584" y="119" font-size="15" fill="#b91c1c">안 되면 여기서 흥미가 꺼진다</text>

  <path d="M354,142 V161" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [2] -->
  <rect x="160" y="164" width="388" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="190" cy="190" r="14" fill="#475569"/>
  <text x="190" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="216" y="196" font-size="17" font-weight="bold" fill="#111827">기술 스택 목록 확인</text>
  <path d="M552,190 H574" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="584" y="195" font-size="15" fill="#374151">"React, TS, Redux, Next..."</text>

  <path d="M354,218 V237" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [3] -->
  <rect x="160" y="240" width="388" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="190" cy="266" r="14" fill="#b45309"/>
  <text x="190" y="271" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="216" y="272" font-size="17" font-weight="bold" fill="#111827">이 사람이 직접 한 건 어디까지?</text>
  <path d="M552,266 H574" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="584" y="271" font-size="15" fill="#374151">팀 프로젝트면 역할 구분을 찾는다</text>

  <path d="M354,294 V313" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [4] 강조 -->
  <rect x="160" y="316" width="388" height="124" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="190" cy="341" r="14" fill="#b45309"/>
  <text x="190" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4</text>
  <text x="216" y="347" font-size="17" font-weight="bold" fill="#111827">결정의 흔적이 있나?</text>
  <text x="216" y="375" font-size="15" fill="#374151">"왜 Redux였나", "왜 SSR이었나"</text>
  <text x="216" y="399" font-size="15" fill="#374151">설명이 있으면 → 그걸 파고,</text>
  <text x="216" y="423" font-size="15" fill="#374151">없으면 → "왜 썼어요?"로 시작한다</text>
  <path d="M552,341 H574" stroke="#b45309" stroke-width="2" fill="none"/>
  <text x="584" y="347" font-size="18" font-weight="bold" fill="#b45309">※ 여기가 질문의 원천</text>

  <path d="M354,442 V461" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- [5] -->
  <rect x="160" y="464" width="388" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="190" cy="490" r="14" fill="#475569"/>
  <text x="190" y="495" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">5</text>
  <text x="216" y="496" font-size="17" font-weight="bold" fill="#111827">README / 커밋 히스토리</text>
  <path d="M552,490 H574" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="584" y="495" font-size="15" fill="#374151">협업 습관을 추정한다</text>
</svg>
