<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3. 비동기 처리 (Message Queue)</title>
  <desc id="d">동기 처리 문제와 비동기 처리 해결 방식을 비교하고 비동기 처리 대상 목록을 보여주는 다이어그램입니다.</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 제목 -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">3. 비동기 처리 (Message Queue)</text>

  <!-- Section 1: 동기 처리 (문제) -->
  <rect x="40" y="80" width="380" height="180" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="60" y="113" font-size="14" font-weight="bold" fill="#dc2626">동기 처리 (문제)</text>

  <!-- Synchronous Flow -->
  <!-- User -->
  <rect x="60" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="100" y="164" font-size="13" text-anchor="middle" fill="#1f2933">User</text>

  <!-- Arrow 1 -->
  <path d="M140,160 L180,160" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- API -->
  <rect x="180" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="164" font-size="13" text-anchor="middle" fill="#1f2933">API</text>

  <!-- Arrow 2 -->
  <path d="M260,160 L300,160" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- DB -->
  <rect x="300" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="340" y="164" font-size="13" text-anchor="middle" fill="#1f2933">DB</text>

  <!-- Label (블로킹) -->
  <rect x="188" y="202" width="64" height="20" fill="#ffffff" rx="2"/>
  <text x="220" y="216" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="bold">(블로킹)</text>

  <!-- Section 2: 비동기 처리 (해결) -->
  <rect x="440" y="80" width="400" height="180" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="460" y="113" font-size="14" font-weight="bold" fill="#059669">비동기 처리 (해결)</text>

  <!-- Asynchronous Flow -->
  <!-- User -->
  <rect x="455" y="140" width="55" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="482.5" y="164" font-size="13" text-anchor="middle" fill="#1f2933">User</text>

  <!-- Arrow 1 -->
  <path d="M510,160 L530,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- API -->
  <rect x="530" y="140" width="55" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="557.5" y="164" font-size="13" text-anchor="middle" fill="#1f2933">API</text>

  <!-- Arrow 2 -->
  <path d="M585,160 L605,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- MQ -->
  <rect x="605" y="140" width="55" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="632.5" y="164" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">MQ</text>

  <!-- Arrow 3 -->
  <path d="M660,160 L680,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Worker -->
  <rect x="680" y="140" width="70" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="715" y="164" font-size="13" text-anchor="middle" fill="#1f2933">Worker</text>

  <!-- Arrow 4 -->
  <path d="M750,160 L770,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- DB -->
  <rect x="770" y="140" width="55" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="797.5" y="164" font-size="13" text-anchor="middle" fill="#1f2933">DB</text>

  <!-- Label (논블로킹) -->
  <rect x="589" y="202" width="76" height="20" fill="#ffffff" rx="2"/>
  <text x="627" y="216" font-size="11.5" text-anchor="middle" fill="#059669" font-weight="bold">(논블로킹)</text>

  <!-- Section 3: 하단 목록 Box -->
  <rect x="40" y="280" width="800" height="180" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Bullet Items -->
  <text x="80" y="325" font-size="13" fill="#1f2933">- 이메일 발송</text>
  <text x="80" y="360" font-size="13" fill="#1f2933">- 알림 전송</text>
  <text x="80" y="395" font-size="13" fill="#1f2933">- 로그 처리</text>
  <text x="80" y="430" font-size="13" fill="#1f2933">- 이미지 리사이징</text>
</svg>