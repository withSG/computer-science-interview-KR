<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동기 처리와 비동기 처리</title>
  <desc id="d">동기 처리는 User → API → DB로 곧장 이어져 블로킹되고, 비동기 처리는 User → API → MQ → Worker → DB로 메시지 큐를 거쳐 논블로킹이 된다. 비동기 처리 대상 예는 이메일 발송, 알림 전송, 로그 처리, 이미지 리사이징.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 동기 처리 (문제) -->
  <rect x="32" y="24" width="816" height="124" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="52" y="54" font-size="18" font-weight="bold" fill="#b91c1c">동기 처리 (문제)</text>

  <rect x="64" y="76" width="104" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="116" y="108" font-size="17" fill="#111827" text-anchor="middle">User</text>
  <rect x="226" y="76" width="104" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="278" y="108" font-size="17" fill="#111827" text-anchor="middle">API</text>
  <rect x="712" y="76" width="104" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="764" y="108" font-size="17" fill="#111827" text-anchor="middle">DB</text>

  <path d="M170,102 H219" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <path d="M332,102 H705" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <rect x="473" y="88" width="96" height="28" fill="#fef2f2"/>
  <text x="521" y="108" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">(블로킹)</text>

  <!-- 비동기 처리 (해결) -->
  <rect x="32" y="168" width="816" height="142" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="52" y="198" font-size="18" font-weight="bold" fill="#047857">비동기 처리 (해결)</text>

  <rect x="64" y="220" width="104" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="116" y="252" font-size="17" fill="#111827" text-anchor="middle">User</text>
  <rect x="226" y="220" width="104" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="278" y="252" font-size="17" fill="#111827" text-anchor="middle">API</text>
  <rect x="388" y="220" width="104" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="252" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">MQ</text>
  <rect x="550" y="220" width="104" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="602" y="252" font-size="17" fill="#111827" text-anchor="middle">Worker</text>
  <rect x="712" y="220" width="104" height="52" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="764" y="252" font-size="17" fill="#111827" text-anchor="middle">DB</text>

  <path d="M170,246 H219" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <path d="M332,246 H381" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <path d="M494,246 H543" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <path d="M656,246 H705" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="359" y="294" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">(논블로킹)</text>

  <!-- 비동기 처리 대상 -->
  <rect x="32" y="330" width="816" height="98" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="360" font-size="17" font-weight="bold" fill="#111827">비동기 처리 대상</text>

  <rect x="52" y="376" width="176" height="38" rx="19" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="140" y="401" font-size="16" fill="#1f2937" text-anchor="middle">이메일 발송</text>
  <rect x="244" y="376" width="176" height="38" rx="19" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="332" y="401" font-size="16" fill="#1f2937" text-anchor="middle">알림 전송</text>
  <rect x="436" y="376" width="176" height="38" rx="19" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="524" y="401" font-size="16" fill="#1f2937" text-anchor="middle">로그 처리</text>
  <rect x="628" y="376" width="176" height="38" rx="19" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="716" y="401" font-size="16" fill="#1f2937" text-anchor="middle">이미지 리사이징</text>
</svg>
