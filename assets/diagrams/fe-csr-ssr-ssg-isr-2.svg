<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">네 렌더링 전략의 시간축</title>
  <desc id="d">CSR, SSR, SSG, ISR이 빌드 타임, 요청 시점, 브라우저 단계에서 각각 무엇을 하는지 비교한다. HTML을 만드는 칸을 강조했으며, CSR만 브라우저에서 HTML을 만들고 나머지 셋은 서버에서 만들되 만드는 시점만 다르다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 열 머리 + 시간축 -->
  <text x="234" y="44" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">빌드 타임</text>
  <text x="496" y="44" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">요청 시점</text>
  <text x="758" y="44" font-size="17" font-weight="700" text-anchor="middle" fill="#111827">브라우저</text>
  <text x="124" y="66" font-size="14" text-anchor="end" fill="#4b5563">시간</text>
  <line x1="136" y1="61" x2="852" y2="61" stroke="#94a3b8" stroke-width="2" marker-end="url(#ahx)"/>

  <!-- CSR -->
  <rect x="24" y="80" width="88" height="62" rx="8" fill="#1f2937"/>
  <text x="68" y="117" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">CSR</text>
  <rect x="136" y="80" width="196" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="234" y="116" font-size="15" text-anchor="middle" fill="#4b5563">(없음)</text>
  <rect x="376" y="80" width="240" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="496" y="116" font-size="15" text-anchor="middle" fill="#111827">빈 HTML 전송</text>
  <rect x="660" y="80" width="196" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="758" y="107" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">JS가 HTML 생성</text>
  <text x="758" y="128" font-size="15" text-anchor="middle" fill="#374151">+ API 호출</text>

  <!-- SSR -->
  <rect x="24" y="156" width="88" height="62" rx="8" fill="#1f2937"/>
  <text x="68" y="193" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">SSR</text>
  <rect x="136" y="156" width="196" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="234" y="192" font-size="15" text-anchor="middle" fill="#4b5563">(없음)</text>
  <rect x="376" y="156" width="240" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="496" y="183" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">HTML 생성 후 전송</text>
  <text x="496" y="204" font-size="15" text-anchor="middle" fill="#374151">(매 요청마다)</text>
  <rect x="660" y="156" width="196" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="758" y="183" font-size="15" text-anchor="middle" fill="#111827">받은 HTML 표시</text>
  <text x="758" y="204" font-size="15" text-anchor="middle" fill="#374151">+ 하이드레이션</text>

  <!-- SSG -->
  <rect x="24" y="232" width="88" height="62" rx="8" fill="#1f2937"/>
  <text x="68" y="269" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">SSG</text>
  <rect x="136" y="232" width="196" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="234" y="268" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">HTML 미리 생성</text>
  <rect x="376" y="232" width="240" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="496" y="259" font-size="15" text-anchor="middle" fill="#111827">저장된 HTML 전송</text>
  <text x="496" y="280" font-size="15" text-anchor="middle" fill="#374151">(CDN에서 바로)</text>
  <rect x="660" y="232" width="196" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="758" y="259" font-size="15" text-anchor="middle" fill="#111827">받은 HTML 표시</text>
  <text x="758" y="280" font-size="15" text-anchor="middle" fill="#374151">+ 하이드레이션</text>

  <!-- ISR -->
  <rect x="24" y="308" width="88" height="86" rx="8" fill="#1f2937"/>
  <text x="68" y="357" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">ISR</text>
  <rect x="136" y="308" width="196" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="234" y="356" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">HTML 미리 생성</text>
  <rect x="376" y="308" width="240" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="496" y="335" font-size="15" text-anchor="middle" fill="#111827">캐시된 HTML 전송</text>
  <rect x="388" y="348" width="216" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="496" y="370" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">+ 만료됐으면 뒤에서 재생성</text>
  <rect x="660" y="308" width="196" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="758" y="346" font-size="15" text-anchor="middle" fill="#111827">받은 HTML 표시</text>
  <text x="758" y="367" font-size="15" text-anchor="middle" fill="#374151">+ 하이드레이션</text>

  <!-- 단계 사이 화살표 -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#ah)">
    <line x1="620" y1="111" x2="656" y2="111"/>
    <line x1="620" y1="187" x2="656" y2="187"/>
    <line x1="336" y1="263" x2="372" y2="263"/>
    <line x1="620" y1="263" x2="656" y2="263"/>
    <line x1="336" y1="351" x2="372" y2="351"/>
    <line x1="620" y1="351" x2="656" y2="351"/>
  </g>

  <!-- 범례 -->
  <rect x="136" y="414" width="30" height="20" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="176" y="429" font-size="15" fill="#1f2937">HTML을 만드는 곳</text>

  <!-- 요점 -->
  <rect x="24" y="452" width="832" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="482" font-size="16" fill="#111827"><tspan font-weight="700" fill="#1d4ed8">CSR만</tspan> HTML을 브라우저에서 만들고, SSR·SSG·ISR은 전부 서버에서 만든다 — 차이는 <tspan font-weight="700" fill="#1d4ed8">'언제 만드느냐'</tspan>뿐</text>
</svg>
