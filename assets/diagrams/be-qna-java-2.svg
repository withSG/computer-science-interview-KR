<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Virtual Thread 동작 원리</title>
  <desc id="d">Virtual Thread가 I/O를 기다리면 JVM이 힙에 저장해 Unmount하고, Carrier Thread는 다른 Virtual Thread를 실행하며, I/O가 끝나면 다시 Mount되는 4단계 흐름입니다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="140" y="28" width="600" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="182" cy="60" r="17" fill="#1d4ed8"/>
  <text x="182" y="66" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="218" y="66" font-size="18" fill="#1f2937"><tspan font-weight="bold">Virtual Thread</tspan>가 I/O 대기</text>

  <path d="M440,94 L440,130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="140" y="136" width="600" height="64" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <circle cx="182" cy="168" r="17" fill="#b45309"/>
  <text x="182" y="174" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="218" y="174" font-size="18" fill="#1f2937">JVM이 힙에 저장 (<tspan font-weight="bold" fill="#92400e">Unmount</tspan>)</text>

  <path d="M440,202 L440,238" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="140" y="244" width="600" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="182" cy="276" r="17" fill="#6d28d9"/>
  <text x="182" y="282" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="218" y="282" font-size="18" fill="#1f2937"><tspan font-weight="bold">Carrier Thread</tspan>가 다른 Virtual Thread 실행</text>

  <path d="M440,310 L440,346" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="140" y="352" width="600" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <circle cx="182" cy="384" r="17" fill="#047857"/>
  <text x="182" y="390" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="218" y="390" font-size="18" fill="#1f2937">I/O 완료 시 다시 <tspan font-weight="bold" fill="#065f46">Mount</tspan></text>
</svg>
