<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동작 원리</title>
  <desc id="d">명령어 사이클 5단계: Fetch, Decode, Execute, Mem, WB 단계별 흐름 및 설명</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Step 1: Fetch -->
  <rect x="30" y="80" width="136" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="98" y="108" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">① Fetch</text>
  <text x="98" y="138" font-size="14" fill="#1f2933" text-anchor="middle">인출</text>

  <!-- Step 1 Details -->
  <text x="98" y="188" font-size="13" fill="#52606d" text-anchor="middle">PC→MAR</text>
  <text x="98" y="208" font-size="13" fill="#52606d" text-anchor="middle">메모리→IR</text>
  <text x="98" y="228" font-size="13" fill="#52606d" text-anchor="middle">PC 증가</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M166,120 L202,120" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2: Decode -->
  <rect x="202" y="80" width="136" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="108" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">② Decode</text>
  <text x="270" y="138" font-size="14" fill="#1f2933" text-anchor="middle">해석</text>

  <!-- Step 2 Details -->
  <text x="270" y="188" font-size="13" fill="#52606d" text-anchor="middle">IR 해독</text>
  <text x="270" y="208" font-size="13" fill="#52606d" text-anchor="middle">제어신호 생성</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M338,120 L374,120" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3: Execute -->
  <rect x="374" y="80" width="136" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="442" y="108" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">③Execute</text>
  <text x="442" y="138" font-size="14" fill="#1f2933" text-anchor="middle">실행</text>

  <!-- Step 3 Details -->
  <text x="442" y="188" font-size="13" fill="#52606d" text-anchor="middle">ALU 연산</text>
  <text x="442" y="208" font-size="13" fill="#52606d" text-anchor="middle">주소 계산</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M510,120 L546,120" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4: Mem -->
  <rect x="546" y="80" width="136" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="614" y="108" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">④ Mem</text>
  <text x="614" y="138" font-size="14" fill="#1f2933" text-anchor="middle">메모리</text>

  <!-- Step 4 Details -->
  <text x="614" y="188" font-size="13" fill="#52606d" text-anchor="middle">LOAD/STORE</text>
  <text x="614" y="208" font-size="13" fill="#52606d" text-anchor="middle">만 사용</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M682,120 L718,120" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 5: WB -->
  <rect x="718" y="80" width="136" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="786" y="108" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">⑤ WB</text>
  <text x="786" y="138" font-size="14" fill="#1f2933" text-anchor="middle">결과기록</text>

  <!-- Step 5 Details -->
  <text x="786" y="188" font-size="13" fill="#52606d" text-anchor="middle">레지스터에</text>
  <text x="786" y="208" font-size="13" fill="#52606d" text-anchor="middle">결과 저장</text>

  <!-- Feedback Loop Arrow from Step 5 back to Step 1 -->
  <path d="M786,80 L786,40 L98,40 L98,71" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
</svg>