<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">조사한 사실에서 출발한 지원 동기</title>
  <desc id="d">개선된 지원 동기 답변을 세 부분으로 나눠, 구체적 사실[A], 내 경험과의 접점[B], 하고 싶은 일[C]이 차례로 이어지는 구조를 보여준다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="32" y="44" font-size="18" font-weight="bold" fill="#111827">[개선 - 조사한 사실에서 출발]</text>

  <!-- [A] 구체적 사실 -->
  <rect x="32" y="68" width="200" height="80" rx="8" fill="#eff6ff"/>
  <rect x="200" y="68" width="32" height="80" fill="#eff6ff"/>
  <line x1="232" y1="68" x2="232" y2="148" stroke="#1d4ed8" stroke-width="1"/>
  <rect x="32" y="68" width="816" height="80" rx="8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="132" y="102" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">[A]</text>
  <text x="132" y="128" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">구체적 사실</text>
  <text font-size="16" fill="#111827">
    <tspan x="252" y="101">"기술 블로그에서 렌더링 방식을 개편한 글을 읽었습니다.</tspan>
    <tspan x="252" y="127">초기 로딩과 상호작용 속도 사이에서 고민한 과정이 인상적이었는데,</tspan>
  </text>

  <line x1="132" y1="152" x2="132" y2="172" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [B] 내 경험과의 접점 -->
  <rect x="32" y="176" width="200" height="106" rx="8" fill="#ecfdf5"/>
  <rect x="200" y="176" width="32" height="106" fill="#ecfdf5"/>
  <line x1="232" y1="176" x2="232" y2="282" stroke="#047857" stroke-width="1"/>
  <rect x="32" y="176" width="816" height="106" rx="8" fill="none" stroke="#047857" stroke-width="1.5"/>
  <text x="132" y="223" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">[B]</text>
  <text x="132" y="249" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">내 경험과의 접점</text>
  <text font-size="16" fill="#111827">
    <tspan x="252" y="209">제가 진행한 프로젝트에서도 목록 화면 렌더링 비용 때문에</tspan>
    <tspan x="252" y="235">비슷한 고민을 했던 터라 내용이 잘 와닿았습니다.</tspan>
    <tspan x="252" y="261">규모는 다르지만 같은 종류의 문제를 다루는 팀이라고 느꼈습니다.</tspan>
  </text>

  <line x1="132" y1="286" x2="132" y2="306" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [C] 하고 싶은 일 -->
  <rect x="32" y="310" width="200" height="80" rx="8" fill="#f5f3ff"/>
  <rect x="200" y="310" width="32" height="80" fill="#f5f3ff"/>
  <line x1="232" y1="310" x2="232" y2="390" stroke="#6d28d9" stroke-width="1"/>
  <rect x="32" y="310" width="816" height="80" rx="8" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="132" y="344" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">[C]</text>
  <text x="132" y="370" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">하고 싶은 일</text>
  <text font-size="16" fill="#111827">
    <tspan x="252" y="343">사용자 수가 많은 환경에서 이 문제를 어떻게 다루는지 배우면서,</tspan>
    <tspan x="252" y="369">제가 해온 렌더링 최적화 경험도 보탤 수 있을 것 같아 지원했습니다."</tspan>
  </text>
</svg>
