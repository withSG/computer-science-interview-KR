<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안티패턴 → 개선</title>
  <desc id="d">조사한 사실에서 출발하는 자기소개서 지원 동기 개선 예시 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">[개선 - 조사한 사실에서 출발]</text>

  <!-- Quote Container Background -->
  <rect x="30" y="55" width="820" height="310" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Segment A -->
  <rect x="50" y="75" width="530" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="3 3"/>
  <text x="65" y="99" font-size="13" fill="#1f2933">"기술 블로그에서 렌더링 방식을 개편한 글을 읽었습니다.</text>
  <text x="65" y="121" font-size="13" fill="#1f2933"> 초기 로딩과 상호작용 속도 사이에서 고민한 과정이 인상적이었는데,</text>

  <!-- Arrow A -->
  <path d="M 680,105 L 590,105" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Label A -->
  <rect x="690" y="85" width="135" height="40" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="757" y="110" font-size="13" font-weight="bold" text-anchor="middle" fill="#2563eb">[A] 구체적 사실</text>

  <!-- Segment B -->
  <rect x="50" y="150" width="530" height="80" rx="4" fill="#ecfdf5" stroke="#059669" stroke-dasharray="3 3"/>
  <text x="65" y="174" font-size="13" fill="#1f2933"> 제가 진행한 프로젝트에서도 목록 화면 렌더링 비용 때문에</text>
  <text x="65" y="196" font-size="13" fill="#1f2933"> 비슷한 고민을 했던 터라 내용이 잘 와닿았습니다.</text>
  <text x="65" y="218" font-size="13" fill="#1f2933"> 규모는 다르지만 같은 종류의 문제를 다루는 팀이라고 느꼈습니다.</text>

  <!-- Arrow B -->
  <path d="M 680,190 L 590,190" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Label B -->
  <rect x="690" y="170" width="145" height="40" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="762" y="195" font-size="13" font-weight="bold" text-anchor="middle" fill="#059669">[B] 내 경험과의 접점</text>

  <!-- Segment C -->
  <rect x="50" y="245" width="530" height="60" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="3 3"/>
  <text x="65" y="269" font-size="13" fill="#1f2933"> 사용자 수가 많은 환경에서 이 문제를 어떻게 다루는지 배우면서,</text>
  <text x="65" y="291" font-size="13" fill="#1f2933"> 제가 해온 렌더링 최적화 경험도 보탤 수 있을 것 같아 지원했습니다."</text>

  <!-- Arrow C -->
  <path d="M 680,275 L 590,275" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Label C -->
  <rect x="690" y="255" width="135" height="40" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="757" y="280" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">[C] 하고 싶은 일</text>
</svg>