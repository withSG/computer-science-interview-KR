<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FCFS (First Come First Served) — 비선점 간트 차트 및 대기 시간</title>
  <desc id="d">FCFS 알고리즘에 따른 P1, P2, P3, P4 프로세스의 타임라인 간트 차트와 각 프로세스의 대기 시간 및 평균 대기 시간 계산 과정입니다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 제목 헤딩 -->
  <text x="30" y="45" font-size="16" font-weight="bold" fill="#1f2933">FCFS (First Come First Served) — 비선점</text>

  <!-- 간트 차트 영역 -->
  <g transform="translate(30, 80)">
    <!-- 시간 축 타임라인 라인 -->
    <path d="M 0,40 L 820,40" stroke="#1f2933" stroke-width="2"/>
    <path d="M 820,40 L 820,40" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- P1: 시간 0 ~ 7 (너비 358.75) -->
    <rect x="0" y="10" width="358.75" height="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
    <text x="179.375" y="30" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">P1</text>
    <!-- P1 눈금 및 시간 표기 -->
    <line x1="0" y1="40" x2="0" y2="48" stroke="#1f2933" stroke-width="2"/>
    <text x="0" y="65" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">0</text>

    <!-- P2: 시간 7 ~ 11 (너비 205) -->
    <rect x="358.75" y="10" width="205" height="30" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
    <text x="461.25" y="30" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">P2</text>
    <!-- P2 시작 눈금 및 시간 표기 (7) -->
    <line x1="358.75" y1="40" x2="358.75" y2="48" stroke="#1f2933" stroke-width="2"/>
    <text x="358.75" y="65" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">7</text>

    <!-- P3: 시간 11 ~ 12 (너비 51.25) -->
    <rect x="563.75" y="10" width="51.25" height="30" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="4"/>
    <text x="589.375" y="30" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">P3</text>
    <!-- P3 시작 눈금 및 시간 표기 (11) -->
    <line x1="563.75" y1="40" x2="563.75" y2="48" stroke="#1f2933" stroke-width="2"/>
    <text x="563.75" y="65" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">11</text>

    <!-- P4: 시간 12 ~ 16 (너비 205) -->
    <rect x="615" y="10" width="205" height="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
    <text x="717.5" y="30" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">P4</text>
    <!-- P4 시작 눈금 및 시간 표기 (12) -->
    <line x1="615" y1="40" x2="615" y2="48" stroke="#1f2933" stroke-width="2"/>
    <text x="615" y="65" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">12</text>

    <!-- 끝 눈금 및 시간 표기 (16) -->
    <line x1="820" y1="40" x2="820" y2="48" stroke="#1f2933" stroke-width="2"/>
    <text x="820" y="65" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">16</text>
  </g>

  <!-- 대기 시간 및 계산 정보 박스 -->
  <rect x="30" y="185" width="820" height="105" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1" rx="6"/>

  <text x="50" y="222" font-size="13" fill="#1f2933">
    <tspan font-weight="bold" fill="#52606d">대기 시간:</tspan> P1=0, P2=7-2=5, P3=11-4=7, P4=12-5=7
  </text>

  <line x1="50" y1="240" x2="830" y2="240" stroke="#cbd2d9" stroke-width="1"/>

  <text x="50" y="268" font-size="14" font-weight="bold" fill="#1f2933">
    평균 대기 시간 = (0+5+7+7)/4 = 4.75
  </text>
</svg>