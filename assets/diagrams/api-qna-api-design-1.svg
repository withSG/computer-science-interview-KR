<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">REST와 GraphQL의 데이터 페칭</title>
  <desc id="d">REST는 GET /users/1 한 번에 불필요한 필드까지 받는 Over-fetching과, GET /users/1과 GET /users/1/posts처럼 여러 요청이 필요한 Under-fetching이 생긴다. GraphQL은 query 하나로 필요한 필드만 한 번에 가져온다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- REST 패널 -->
  <rect x="32" y="24" width="816" height="264" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="56" y="58" font-size="20" font-weight="bold" fill="#b91c1c">REST</text>

  <!-- 1) Over-fetching -->
  <rect x="56" y="84" width="280" height="48" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="196" y="113.5" font-size="16" text-anchor="middle" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /users/1</text>
  <line x1="344" y1="108" x2="420" y2="108" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="430" y="76" width="394" height="64" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="627" y="102" font-size="18" font-weight="bold" text-anchor="middle" fill="#b91c1c">Over-fetching</text>
  <text x="627" y="127" font-size="16" text-anchor="middle" fill="#1f2937">불필요한 필드도 반환</text>

  <!-- 2) Under-fetching -->
  <rect x="56" y="164" width="280" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="196" y="191.5" font-size="16" text-anchor="middle" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /users/1</text>
  <rect x="56" y="220" width="280" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="196" y="247.5" font-size="16" text-anchor="middle" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /users/1/posts</text>
  <path d="M344,186 H366 V242 H344" fill="none" stroke="#4b5563" stroke-width="2"/>
  <line x1="366" y1="214" x2="420" y2="214" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="430" y="182" width="394" height="64" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="627" y="208" font-size="18" font-weight="bold" text-anchor="middle" fill="#b91c1c">Under-fetching</text>
  <text x="627" y="233" font-size="16" text-anchor="middle" fill="#1f2937">여러 요청 필요</text>

  <!-- GraphQL 패널 -->
  <rect x="32" y="308" width="816" height="248" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="56" y="342" font-size="20" font-weight="bold" fill="#047857">GraphQL</text>

  <rect x="56" y="360" width="280" height="176" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <g font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="76" y="392">query {</text>
    <text x="95.2" y="416">user(id: 1) {</text>
    <text x="114.4" y="440">name</text>
    <text x="114.4" y="464">posts { title }</text>
    <text x="95.2" y="488">}</text>
    <text x="76" y="512">}</text>
  </g>
  <line x1="344" y1="448" x2="420" y2="448" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="430" y="420" width="394" height="56" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.8"/>
  <text x="627" y="454.5" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857">필요한 필드만 한 번에</text>
</svg>
