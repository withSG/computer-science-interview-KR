<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" width="880" height="630" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CSRF 성립 조건과 방어</title>
  <desc id="d">CSRF가 성립하려면 자격 증명 자동 첨부, 출처 미검증, 요청 완전 재현이라는 세 조건이 모두 필요하고, 각각 SameSite 쿠키, Origin 헤더 검증, CSRF 토큰이 깨뜨린다. 셋 다 충족되면 강제 송금이 성공하고, 하나만 깨도 공격은 실패한다.</desc>
  <rect width="880" height="630" fill="#ffffff"/>
  <defs>
    <marker id="ar-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 요점 -->
  <text x="24" y="44" font-size="19" font-weight="bold" fill="#111827">세 조건이 동시에 만족돼야 CSRF가 성립한다</text>

  <!-- 열 머리 -->
  <text x="24" y="86" font-size="16" font-weight="bold" fill="#b91c1c">성립 조건 (셋 다 필요)</text>
  <text x="504" y="86" font-size="16" font-weight="bold" fill="#047857">그 조건을 깨는 방어</text>

  <!-- 행 1: 조건 1 ↔ 방어 1 -->
  <rect x="24" y="102" width="400" height="124" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="134" font-size="15" font-weight="bold" fill="#b91c1c">조건 1</text>
  <text x="44" y="164" font-size="17" font-weight="bold" fill="#111827">자격 증명이 자동으로 붙는다</text>
  <text x="44" y="194" font-size="15" fill="#374151">쿠키·HTTP Basic. 브라우저가 알아서 첨부한다</text>

  <text x="464" y="154" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">깬다</text>
  <line x1="500" y1="166" x2="430" y2="166" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>

  <rect x="504" y="102" width="352" height="124" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="524" y="134" font-size="15" font-weight="bold" fill="#047857">방어 1</text>
  <text x="524" y="162" font-size="17" font-weight="bold" fill="#111827">SameSite 쿠키</text>
  <text x="524" y="188" font-size="15" fill="#374151">SameSite=Lax / Strict 설정 시</text>
  <text x="524" y="210" font-size="15" fill="#374151">Cross-Site POST 요청에 쿠키 미전송</text>

  <!-- 행 2: 조건 2 ↔ 방어 3 -->
  <rect x="24" y="246" width="400" height="124" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="278" font-size="15" font-weight="bold" fill="#b91c1c">조건 2</text>
  <text x="44" y="308" font-size="17" font-weight="bold" fill="#111827">서버가 요청의 출처를 검증하지 않는다</text>
  <text x="44" y="338" font-size="15" fill="#374151">세션만 유효하면 어디서 왔든 처리한다</text>

  <text x="464" y="298" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">깬다</text>
  <line x1="500" y1="310" x2="430" y2="310" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>

  <rect x="504" y="246" width="352" height="124" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="524" y="278" font-size="15" font-weight="bold" fill="#047857">방어 3 <tspan font-weight="normal" fill="#374151">(보조 층)</tspan></text>
  <text x="524" y="306" font-size="17" font-weight="bold" fill="#111827">Origin 헤더 검증</text>
  <text x="524" y="332" font-size="15" fill="#374151">HTTP Origin 헤더 확인</text>
  <text x="524" y="354" font-size="15" fill="#374151">허용되지 않은 출처(evil.com) 거부</text>

  <!-- 행 3: 조건 3 ↔ 방어 2 -->
  <rect x="24" y="390" width="400" height="124" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="422" font-size="15" font-weight="bold" fill="#b91c1c">조건 3</text>
  <text x="44" y="452" font-size="17" font-weight="bold" fill="#111827">공격자가 요청을 완전히 재현할 수 있다</text>
  <text x="44" y="482" font-size="15" fill="#374151">공격자가 모를 값(토큰)이 하나도 없다</text>

  <text x="464" y="442" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">깬다</text>
  <line x1="500" y1="454" x2="430" y2="454" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>

  <rect x="504" y="390" width="352" height="124" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="524" y="422" font-size="15" font-weight="bold" fill="#047857">방어 2</text>
  <text x="524" y="450" font-size="17" font-weight="bold" fill="#111827">CSRF 토큰</text>
  <text x="524" y="476" font-size="15" fill="#374151">서버가 발행한 랜덤 토큰 검증</text>
  <text x="524" y="498" font-size="15" fill="#374151">SOP로 인해 evil.com은 토큰 탈취 불가</text>

  <!-- 결과 -->
  <line x1="224" y1="520" x2="224" y2="548" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar-red)"/>
  <rect x="24" y="554" width="400" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="224" y="586" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">셋 다 충족 → 강제 송금 성공</text>

  <line x1="680" y1="520" x2="680" y2="548" stroke="#047857" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <rect x="504" y="554" width="352" height="52" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="680" y="586" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">하나만 깨도 → 공격 실패</text>
</svg>
