<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stateful과 Stateless의 요청 분산 비교</title>
  <desc id="d">세션을 서버 메모리에 두면 LB가 재요청을 서버B로 보냈을 때 로그인이 풀리고, sticky session으로 막아도 A가 죽으면 A에 붙은 사용자 전원이 로그아웃된다. 요청이 토큰을 들고 오면 어느 서버든 똑같이 검증하므로 서버를 아무 때나 늘리고 줄일 수 있다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="550" fill="#ffffff"/>

  <!-- ===== Stateful ===== -->
  <rect x="24" y="24" width="832" height="252" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#b91c1c">Stateful — 서버 메모리에 세션</text>

  <!-- 요청 -->
  <rect x="48" y="82" width="160" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="128" y="110" font-size="16" fill="#1f2937" text-anchor="middle">요청</text>
  <path d="M208,104 L270,104" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>
  <!-- 재요청 -->
  <rect x="48" y="142" width="160" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="128" y="170" font-size="16" fill="#1f2937" text-anchor="middle">재요청</text>
  <path d="M208,164 L270,164" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>

  <!-- LB -->
  <rect x="272" y="82" width="80" height="104" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="312" y="140" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">LB</text>

  <!-- LB → 서버 -->
  <path d="M352,104 L398,104" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>
  <path d="M352,164 L398,164" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#ah-red)"/>

  <rect x="400" y="82" width="110" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="455" y="110" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">서버A</text>
  <rect x="400" y="142" width="110" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="455" y="170" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">서버B</text>

  <text x="532" y="110" font-size="16" fill="#1f2937">김씨 세션 보관</text>
  <text x="532" y="170" font-size="16" font-weight="bold" fill="#b91c1c">세션 없음. 로그인 풀림</text>

  <!-- sticky session -->
  <path d="M44,204 L836,204" stroke="#fca5a5" stroke-width="1"/>
  <text x="48" y="232" font-size="16" fill="#1f2937">해결하려면 LB에 "김씨는 항상 A로" 고정(sticky session)</text>
  <text x="48" y="260" font-size="16" font-weight="bold" fill="#b91c1c">→ A가 죽으면 A에 붙은 사용자 전원 로그아웃</text>

  <!-- ===== Stateless ===== -->
  <rect x="24" y="300" width="832" height="226" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="44" y="332" font-size="18" font-weight="bold" fill="#047857">Stateless — 요청이 신원 증명을 들고 옴</text>

  <!-- 요청 + 토큰 -->
  <rect x="48" y="358" width="160" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="128" y="386" font-size="16" fill="#1f2937" text-anchor="middle">요청 <tspan font-weight="bold" fill="#047857">+ 토큰</tspan></text>
  <path d="M208,380 L270,380" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>
  <!-- 재요청 + 토큰 -->
  <rect x="48" y="418" width="160" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="128" y="446" font-size="16" fill="#1f2937" text-anchor="middle">재요청 <tspan font-weight="bold" fill="#047857">+ 토큰</tspan></text>
  <path d="M208,440 L270,440" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>

  <!-- LB -->
  <rect x="272" y="358" width="80" height="104" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="312" y="416" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">LB</text>

  <path d="M352,380 L398,380" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>
  <path d="M352,440 L398,440" stroke="#047857" stroke-width="1.5" fill="none" marker-end="url(#ah-green)"/>

  <rect x="400" y="358" width="110" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="455" y="386" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">서버A</text>
  <rect x="400" y="418" width="110" height="44" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="455" y="446" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">서버B</text>

  <text x="532" y="386" font-size="16" fill="#1f2937">토큰 검증 후 처리</text>
  <text x="532" y="446" font-size="16" font-weight="bold" fill="#047857">똑같이 검증. 문제 없음</text>

  <path d="M44,480 L836,480" stroke="#6ee7b7" stroke-width="1"/>
  <text x="48" y="508" font-size="16" font-weight="bold" fill="#047857">→ 서버를 아무 때나 늘리고 줄여도 된다</text>
</svg>
