<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stop-the-World 타임라인</title>
  <desc id="d">애플리케이션 스레드 T1, T2, T3가 실행되다가 STW 구간에서 동시에 모두 멈춘다. 첫 번째는 GC 스레드 작업으로 인한 긴 정지이고, 두 번째는 동시 수집형 GC의 짧은 STW다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 머리: 그룹 라벨과 시간 방향 -->
  <text x="32" y="38" font-size="16" font-weight="bold" fill="#111827">애플리케이션 스레드</text>
  <text x="756" y="38" font-size="15" fill="#4b5563" text-anchor="end">시간</text>
  <line x1="766" y1="33" x2="846" y2="33" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STW 구간 (세 스레드 전체를 가로지름) -->
  <rect x="300" y="56" width="224" height="148" fill="#fee2e2"/>
  <rect x="700" y="56" width="64" height="148" fill="#fee2e2"/>
  <line x1="300" y1="52" x2="300" y2="208" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="524" y1="52" x2="524" y2="208" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="700" y1="52" x2="700" y2="208" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="764" y1="52" x2="764" y2="208" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 스레드 라벨 -->
  <text x="40" y="88" font-size="16" font-weight="bold" fill="#374151">T1</text>
  <text x="40" y="136" font-size="16" font-weight="bold" fill="#374151">T2</text>
  <text x="40" y="184" font-size="16" font-weight="bold" fill="#374151">T3</text>

  <!-- 실행 구간 막대 -->
  <rect x="96" y="68" width="204" height="28" rx="3" fill="#2563eb"/>
  <rect x="524" y="68" width="176" height="28" rx="3" fill="#2563eb"/>
  <rect x="764" y="68" width="84" height="28" rx="3" fill="#2563eb"/>

  <rect x="96" y="116" width="204" height="28" rx="3" fill="#2563eb"/>
  <rect x="524" y="116" width="176" height="28" rx="3" fill="#2563eb"/>
  <rect x="764" y="116" width="84" height="28" rx="3" fill="#2563eb"/>

  <rect x="96" y="164" width="204" height="28" rx="3" fill="#2563eb"/>
  <rect x="524" y="164" width="176" height="28" rx="3" fill="#2563eb"/>
  <rect x="764" y="164" width="84" height="28" rx="3" fill="#2563eb"/>

  <!-- STW 라벨 -->
  <text x="412" y="137" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">STW</text>
  <text x="732" y="136" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">STW</text>

  <!-- 구간 설명 괄호 -->
  <path d="M300,216 V228 H524 V216" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <text x="412" y="254" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">GC 스레드 작업</text>
  <text x="412" y="276" font-size="15" fill="#4b5563" text-anchor="middle">(긴 정지)</text>

  <path d="M700,216 V228 H764 V216" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <text x="732" y="254" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">짧은 STW</text>
  <text x="732" y="276" font-size="15" fill="#4b5563" text-anchor="middle">(동시 수집형 GC)</text>

  <!-- 범례 -->
  <rect x="32" y="304" width="24" height="16" rx="3" fill="#2563eb"/>
  <text x="64" y="317" font-size="15" fill="#111827">애플리케이션 실행</text>
  <rect x="236" y="304" width="24" height="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="268" y="317" font-size="15" fill="#111827">Stop-the-World: 모든 애플리케이션 스레드 정지</text>
</svg>
