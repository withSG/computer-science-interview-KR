<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Trace와 Span 계층</title>
  <desc id="d">하나의 요청인 Trace 아래 Span A(API Gateway, 130ms)가 있고, 그 아래 Span B(User Service, 40ms)와 Span D(Order Service, 80ms), 다시 그 아래 Span C(DB Query, 15ms)와 Span E(Payment API, 50ms)가 이어지는 계층. Total은 130ms.</desc>
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- tree connectors -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M60,76 L60,412"/>
    <path d="M60,126 L80,126"/>
    <path d="M104,148 L104,306"/>
    <path d="M104,186 L130,186"/>
    <path d="M104,306 L130,306"/>
    <path d="M154,208 L154,246 L180,246"/>
    <path d="M154,328 L154,366 L180,366"/>
  </g>

  <!-- Trace root -->
  <rect x="40" y="28" width="440" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="58" font-size="18" fill="#1e3a8a"><tspan font-weight="bold">Trace</tspan><tspan font-size="16">: 전체 요청의 여정 (하나의 요청)</tspan></text>

  <!-- Span A -->
  <rect x="80" y="104" width="640" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="98" y="132" font-size="16" font-weight="bold" fill="#1d4ed8">Span A</text>
  <text x="180" y="132" font-size="16" fill="#1f2937">API Gateway</text>
  <text x="700" y="132" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">130ms</text>

  <!-- Span B -->
  <rect x="130" y="164" width="590" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="148" y="192" font-size="16" font-weight="bold" fill="#1d4ed8">Span B</text>
  <text x="230" y="192" font-size="16" fill="#1f2937">User Service</text>
  <text x="700" y="192" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">40ms</text>

  <!-- Span C -->
  <rect x="180" y="224" width="540" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="198" y="252" font-size="16" font-weight="bold" fill="#1d4ed8">Span C</text>
  <text x="280" y="252" font-size="16" fill="#1f2937">DB Query</text>
  <text x="700" y="252" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">15ms</text>

  <!-- Span D -->
  <rect x="130" y="284" width="590" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="148" y="312" font-size="16" font-weight="bold" fill="#1d4ed8">Span D</text>
  <text x="230" y="312" font-size="16" fill="#1f2937">Order Service</text>
  <text x="700" y="312" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">80ms</text>

  <!-- Span E -->
  <rect x="180" y="344" width="540" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="198" y="372" font-size="16" font-weight="bold" fill="#1d4ed8">Span E</text>
  <text x="280" y="372" font-size="16" fill="#1f2937">Payment API</text>
  <text x="700" y="372" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="end">50ms</text>

  <!-- Total -->
  <rect x="40" y="412" width="190" height="42" rx="21" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="135" y="439" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">Total: 130ms</text>
</svg>
