<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">경력 전환자 답변 비교</title>
  <desc id="d">경력 전환자의 약한 답변 예시와 강한 답변 예시를 비교하고 각 답변에 대한 해석을 설명하는 다이어그램</desc>
  <rect width="880" height="390" fill="#ffffff"/>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 약함 카드 -->
  <g>
    <rect x="24" y="24" width="832" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    
    <!-- 약함 라벨 -->
    <rect x="40" y="40" width="60" height="26" rx="4" fill="#dc2626"/>
    <text x="70" y="56.1" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">약함</text>
    
    <!-- 약함 본문 -->
    <text x="112" y="56.1" fill="#1f2933" font-size="13">"이전 직무는 반복적이고 성장이 없어서 개발로 전향했습니다."</text>
    
    <!-- 약함 화살표 & 설명 -->
    <path d="M70,76 L70,110" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <text x="88" y="103.1" fill="#52606d" font-size="12.5">여기서도 반복이 시작되면 또 떠나겠다는 말로 들린다.</text>
  </g>

  <!-- 강함 카드 -->
  <g>
    <rect x="24" y="150" width="832" height="216" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    
    <!-- 강함 라벨 -->
    <rect x="40" y="166" width="60" height="26" rx="4" fill="#059669"/>
    <text x="70" y="182.1" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">강함</text>
    
    <!-- 강함 본문 (4줄) -->
    <text x="112" y="182.1" fill="#1f2933" font-size="13">"재고 관리 업무를 하면서 엑셀 작업을 자동화하려고 스크립트를 짜기 시작했습니다.</text>
    <text x="112" y="206.1" fill="#1f2933" font-size="13">그게 실제로 팀 업무 시간을 줄이는 걸 보고 제대로 배우고 싶어졌고,</text>
    <text x="112" y="230.1" fill="#1f2933" font-size="13">그때부터 1년간 준비해 프로젝트 3개를 만들었습니다.</text>
    <text x="112" y="254.1" fill="#1f2933" font-size="13">도메인을 아는 상태로 개발한다는 게 어떤 이점이 있는지도 그때 알았습니다."</text>
    
    <!-- 강함 화살표 & 설명 (3줄) -->
    <path d="M70,268 L70,302" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <text x="88" y="295.1" fill="#52606d" font-size="12.5">계기가 구체적이고, 전환에 들인 시간이 진정성의 증거가 되며,</text>
    <text x="88" y="318.1" fill="#52606d" font-size="12.5">이전 경력이 약점이 아니라 자산으로 재배치됐다.</text>
  </g>
</svg>