<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">경력 전환 동기 답변 비교</title>
  <desc id="d">이전 일에 대한 불만으로 답한 약한 예는 또 떠나겠다는 말로 들리고, 개발로 향하는 이유로 답한 강한 예는 구체적 계기, 전환에 들인 시간, 자산이 된 이전 경력을 보여준다.</desc>
  <rect width="880" height="590" fill="#ffffff"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 약함 -->
  <rect x="24" y="24" width="832" height="150" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="44" y="40" width="64" height="30" rx="6" fill="#b91c1c"/>
  <text x="76" y="61" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">약함</text>
  <text x="122" y="61" font-size="16" font-weight="bold" fill="#b91c1c">이전 일에 대한 불만</text>

  <rect x="44" y="86" width="480" height="72" rx="6" fill="#ffffff"/>
  <text font-size="16" fill="#111827">
    <tspan x="60" y="116">"이전 직무는 반복적이고 성장이 없어서</tspan>
    <tspan x="60" y="140">개발로 전향했습니다."</tspan>
  </text>
  <line x1="530" y1="122" x2="566" y2="122" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="572" y="86" width="264" height="72" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text font-size="15" fill="#7f1d1d">
    <tspan x="588" y="116">여기서도 반복이 시작되면</tspan>
    <tspan x="588" y="140">또 떠나겠다는 말로 들린다</tspan>
  </text>

  <!-- 강함 -->
  <rect x="24" y="198" width="832" height="366" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <rect x="44" y="214" width="64" height="30" rx="6" fill="#047857"/>
  <text x="76" y="235" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">강함</text>
  <text x="122" y="235" font-size="16" font-weight="bold" fill="#047857">개발로 향하는 이유</text>

  <!-- 강함: 계기 -->
  <rect x="44" y="260" width="480" height="120" rx="6" fill="#ffffff"/>
  <text font-size="16" fill="#111827">
    <tspan x="60" y="289">"재고 관리 업무를 하면서 엑셀 작업을</tspan>
    <tspan x="60" y="313">자동화하려고 스크립트를 짜기 시작했습니다.</tspan>
    <tspan x="60" y="337">그게 실제로 팀 업무 시간을 줄이는 걸 보고</tspan>
    <tspan x="60" y="361">제대로 배우고 싶어졌고,</tspan>
  </text>
  <line x1="530" y1="320" x2="566" y2="320" stroke="#047857" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="572" y="284" width="264" height="72" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="588" y="326" font-size="15" fill="#064e3b">계기가 구체적이다</text>

  <!-- 강함: 전환에 들인 시간 -->
  <rect x="44" y="392" width="480" height="72" rx="6" fill="#ffffff"/>
  <text x="60" y="433" font-size="16" fill="#111827">그때부터 1년간 준비해 프로젝트 3개를 만들었습니다.</text>
  <line x1="530" y1="428" x2="566" y2="428" stroke="#047857" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="572" y="392" width="264" height="72" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text font-size="15" fill="#064e3b">
    <tspan x="588" y="422">전환에 들인 시간이</tspan>
    <tspan x="588" y="446">진정성의 증거가 된다</tspan>
  </text>

  <!-- 강함: 이전 경력 -->
  <rect x="44" y="476" width="480" height="72" rx="6" fill="#ffffff"/>
  <text font-size="16" fill="#111827">
    <tspan x="60" y="506">도메인을 아는 상태로 개발한다는 게 어떤 이점이</tspan>
    <tspan x="60" y="530">있는지도 그때 알았습니다."</tspan>
  </text>
  <line x1="530" y1="512" x2="566" y2="512" stroke="#047857" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="572" y="476" width="264" height="72" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text font-size="15" fill="#064e3b">
    <tspan x="588" y="506">이전 경력이 약점이 아니라</tspan>
    <tspan x="588" y="530">자산으로 재배치됐다</tspan>
  </text>
</svg>
