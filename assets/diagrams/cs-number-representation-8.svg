<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">0.1 + 0.2와 0.3 비교</title>
  <desc id="d">저장된 0.1과 0.2는 각각 원래 값보다 아주 조금 크고, 둘을 더하면 0.3보다 조금 큰 값이 됩니다. 반면 저장된 0.3은 0.3보다 아주 조금 작습니다. 두 값의 비트 패턴이 달라 == 비교는 false가 됩니다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 범례 -->
  <line x1="500" y1="28" x2="500" y2="48" stroke="#111827" stroke-width="2"/>
  <text x="510" y="43" font-size="15" fill="#374151">정확한 값</text>
  <circle cx="604" cy="38" r="7" fill="#1d4ed8"/>
  <text x="618" y="43" font-size="15" fill="#374151">저장된 값 (간격은 과장해 그림)</text>

  <!-- 행 1: 저장된 0.1 -->
  <text x="72" y="102" font-size="17" font-weight="bold" fill="#111827">저장된 0.1</text>
  <text x="220" y="102" font-size="16" fill="#111827">0.1보다 <tspan font-weight="bold">아주 조금 큼</tspan></text>
  <line x1="600" y1="96" x2="820" y2="96" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="710" y1="84" x2="710" y2="108" stroke="#111827" stroke-width="2"/>
  <circle cx="726" cy="96" r="7" fill="#1d4ed8"/>
  <text x="710" y="128" font-size="14" fill="#374151" text-anchor="middle">0.1</text>

  <!-- 행 2: 저장된 0.2 -->
  <text x="44" y="167" font-size="20" font-weight="bold" fill="#111827">+</text>
  <text x="72" y="166" font-size="17" font-weight="bold" fill="#111827">저장된 0.2</text>
  <text x="220" y="166" font-size="16" fill="#111827">0.2보다 <tspan font-weight="bold">아주 조금 큼</tspan></text>
  <line x1="600" y1="160" x2="820" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="710" y1="148" x2="710" y2="172" stroke="#111827" stroke-width="2"/>
  <circle cx="734" cy="160" r="7" fill="#1d4ed8"/>
  <text x="710" y="192" font-size="14" fill="#374151" text-anchor="middle">0.2</text>

  <line x1="40" y1="206" x2="840" y2="206" stroke="#374151" stroke-width="1.5"/>

  <!-- 비교되는 두 값 -->
  <rect x="32" y="218" width="816" height="140" rx="8" fill="#f3f4f6"/>

  <!-- 행 3: 더하면 -->
  <text x="72" y="246" font-size="17" font-weight="bold" fill="#111827">더하면</text>
  <text x="220" y="246" font-size="16" fill="#111827">0.3보다 <tspan font-weight="bold">조금 큰 값</tspan></text>
  <text x="220" y="270" font-size="14" fill="#4b5563">출력: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">0.30000000000000004</tspan></text>
  <line x1="600" y1="240" x2="820" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="710" y1="228" x2="710" y2="252" stroke="#111827" stroke-width="2"/>
  <circle cx="762" cy="240" r="7" fill="#1d4ed8"/>
  <text x="710" y="272" font-size="14" fill="#374151" text-anchor="middle">0.3</text>

  <!-- 행 4: 저장된 0.3 -->
  <text x="72" y="320" font-size="17" font-weight="bold" fill="#111827">저장된 0.3</text>
  <text x="220" y="320" font-size="16" fill="#111827">0.3보다 <tspan font-weight="bold">아주 조금 작음</tspan></text>
  <line x1="600" y1="314" x2="820" y2="314" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="710" y1="302" x2="710" y2="326" stroke="#111827" stroke-width="2"/>
  <circle cx="686" cy="314" r="7" fill="#1d4ed8"/>
  <text x="710" y="346" font-size="14" fill="#374151" text-anchor="middle">0.3</text>

  <!-- 결론 -->
  <rect x="160" y="372" width="560" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="440" y="402" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">두 값의 비트 패턴이 다르다  →  == 는 false</text>
</svg>
