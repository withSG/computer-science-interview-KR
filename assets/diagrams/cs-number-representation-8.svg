<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">무슨 일이 벌어지나</title>
  <desc id="d">부동소수점 오차로 인해 0.1과 0.2를 더한 값과 저장된 0.3의 비트 패턴이 달라 비교 연산 결과가 false가 되는 과정</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 헤딩 / 구역 영역 -->
  <rect x="24" y="20" width="832" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">무슨 일이 벌어지나</text>

  <!-- 메인 연산 과정 박스 (0.1 + 0.2) -->
  <rect x="50" y="80" width="370" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="105" font-size="12" font-weight="bold" fill="#2563eb">덧셈 연산 경로</text>

  <!-- 저장된 0.1 -->
  <rect x="70" y="120" width="330" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="85" y="143" font-size="13" fill="#1f2933" font-weight="bold">저장된 0.1</text>
  <text x="200" y="143" font-size="13" fill="#52606d">=</text>
  <text x="220" y="143" font-size="13" fill="#d97706" font-weight="bold">0.1 보다 아주 조금 큼</text>

  <!-- 저장된 0.2 -->
  <rect x="70" y="166" width="330" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="85" y="189" font-size="13" fill="#1f2933" font-weight="bold">저장된 0.2</text>
  <text x="200" y="189" font-size="13" fill="#52606d">=</text>
  <text x="220" y="189" font-size="13" fill="#d97706" font-weight="bold">0.2 보다 아주 조금 큼</text>

  <!-- 더하면 -->
  <rect x="70" y="212" width="330" height="36" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="85" y="235" font-size="13" fill="#2563eb" font-weight="bold">더하면</text>
  <text x="200" y="235" font-size="13" fill="#52606d">=</text>
  <text x="220" y="235" font-size="13" fill="#2563eb" font-weight="bold">0.3 보다 조금 큰 값</text>

  <!-- 비교 대상 박스 (0.3) -->
  <rect x="460" y="188" width="370" height="72" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="480" y="208" font-size="12" font-weight="bold" fill="#52606d">직접 저장된 값</text>

  <!-- 저장된 0.3 -->
  <rect x="480" y="212" width="330" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="495" y="235" font-size="13" fill="#1f2933" font-weight="bold">저장된 0.3</text>
  <text x="610" y="235" font-size="13" fill="#52606d">=</text>
  <text x="630" y="235" font-size="13" fill="#7c3aed" font-weight="bold">0.3 보다 아주 조금 작음</text>

  <!-- 하단 결과 및 화살표 흐름 -->
  <!-- 덧셈 결과에서 화살표 내려옴 -->
  <path d="M 235,248 L 235,295 L 300,295" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  
  <!-- 저장된 0.3에서 화살표 내려옴 -->
  <path d="M 645,248 L 645,295 L 580,295" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 최종 결과 상자 -->
  <rect x="308" y="277" width="264" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="300" font-size="13" font-weight="bold" fill="#dc2626">두 값의 비트 패턴이 다르다</text>
  <path d="M 482,295 L 492,295" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="502" y="300" font-size="13" font-weight="bold" fill="#dc2626">== 는 false</text>
</svg>