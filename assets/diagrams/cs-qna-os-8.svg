<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 990" width="880" height="990" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세그멘테이션의 분할과 주소 변환</title>
  <desc id="d">프로세스를 코드, 스택, 힙, 데이터 같은 가변 크기 세그먼트로 나눠 물리 메모리에 배치하고, 세그먼트 테이블의 기준 주소에 오프셋을 더해 물리 주소를 구하는 과정과, 세그멘테이션의 장점과 단점을 보여 준다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="880" height="990" fill="#ffffff"/>

  <!-- ① 논리적 단위로 분할 -->
  <text x="40" y="46" font-size="17" font-weight="bold" fill="#111827">① 논리적 단위로 분할</text>

  <text x="150" y="84" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">프로세스</text>
  <text x="150" y="106" font-size="15" fill="#4b5563" text-anchor="middle">논리적 단위 “세그먼트”로 분할</text>
  <text x="630" y="84" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">물리 메모리</text>
  <text x="630" y="106" font-size="15" fill="#4b5563" text-anchor="middle">가변 크기 세그먼트를 배치</text>

  <!-- 프로세스 쪽 세그먼트 (크기가 제각각) -->
  <rect x="60" y="124" width="180" height="72" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="60" y="208" width="180" height="48" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="60" y="268" width="180" height="56" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="60" y="336" width="180" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="150" y="166" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">코드</text>
  <text x="150" y="238" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">스택</text>
  <text x="150" y="302" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">힙</text>
  <text x="150" y="362" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">데이터</text>
  <text x="150" y="404" font-size="15" fill="#4b5563" text-anchor="middle">세그먼트: 코드, 스택, 힙, 데이터 등</text>

  <!-- 물리 메모리: 세그먼트 사이에 빈 공간 -->
  <rect x="520" y="124" width="220" height="28" fill="#f3f4f6"/>
  <rect x="520" y="224" width="220" height="36" fill="#f3f4f6"/>
  <rect x="520" y="364" width="220" height="32" fill="#f3f4f6"/>
  <rect x="520" y="436" width="220" height="28" fill="#f3f4f6"/>
  <text x="630" y="143" font-size="15" fill="#4b5563" text-anchor="middle">빈 공간</text>
  <text x="630" y="247" font-size="15" fill="#4b5563" text-anchor="middle">빈 공간</text>
  <text x="630" y="385" font-size="15" fill="#4b5563" text-anchor="middle">빈 공간</text>
  <text x="630" y="455" font-size="15" fill="#4b5563" text-anchor="middle">빈 공간</text>
  <rect x="520" y="152" width="220" height="72" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="520" y="260" width="220" height="48" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="520" y="308" width="220" height="56" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="520" y="396" width="220" height="40" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="630" y="194" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">코드</text>
  <text x="630" y="290" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">스택</text>
  <text x="630" y="342" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">힙</text>
  <text x="630" y="422" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">데이터</text>
  <rect x="520" y="124" width="220" height="340" fill="none" stroke="#374151" stroke-width="2"/>

  <path d="M246,160 L514,188" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M246,232 L514,284" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M246,296 L514,336" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M246,356 L514,416" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>

  <path d="M770,152 H746" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah-ink)"/>
  <text x="776" y="157" font-size="15" font-weight="bold" fill="#111827">기준 주소</text>

  <!-- ② 주소 변환 -->
  <text x="40" y="504" font-size="17" font-weight="bold" fill="#111827">② 주소 변환</text>

  <text x="40" y="536" font-size="16" font-weight="bold" fill="#111827">가상 주소</text>
  <rect x="40" y="548" width="160" height="48" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <rect x="200" y="548" width="100" height="48" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="120" y="578" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">세그먼트 번호</text>
  <text x="250" y="578" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">오프셋</text>

  <rect x="40" y="636" width="260" height="80" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="170" y="666" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">세그먼트 테이블</text>
  <text x="170" y="694" font-size="15" fill="#374151" text-anchor="middle">번호 → (기준 주소, 한계값)</text>
  <path d="M120,596 V634" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>

  <path d="M300,572 H470 V656" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>
  <text x="385" y="562" font-size="15" fill="#374151" text-anchor="middle">오프셋</text>
  <path d="M300,676 H450" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>
  <text x="376" y="666" font-size="15" fill="#374151" text-anchor="middle">기준 주소</text>

  <circle cx="470" cy="676" r="18" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="470" y="684" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">+</text>
  <path d="M488,676 H536" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah-ink)"/>

  <rect x="540" y="640" width="300" height="72" rx="6" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="690" y="668" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">물리 주소</text>
  <text x="690" y="696" font-size="15" fill="#374151" text-anchor="middle">= 세그먼트 기준 주소 + 오프셋</text>

  <!-- ③ 장단점 -->
  <text x="40" y="764" font-size="17" font-weight="bold" fill="#111827">③ 장점과 단점</text>

  <rect x="40" y="780" width="392" height="184" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="60" y="810" font-size="18" font-weight="bold" fill="#047857">장점</text>
  <text x="60" y="842" font-size="15" fill="#111827">• 내부 단편화 없음</text>
  <text x="74" y="866" font-size="15" fill="#4b5563">(가변 크기라 딱 맞게 배치)</text>
  <text x="60" y="894" font-size="15" fill="#111827">• 논리적 단위로 보호(protection) 설정 가능</text>
  <text x="60" y="922" font-size="15" fill="#111827">• 공유 용이</text>
  <text x="74" y="946" font-size="15" fill="#4b5563">(코드 세그먼트 공유)</text>

  <rect x="448" y="780" width="392" height="184" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="468" y="810" font-size="18" font-weight="bold" fill="#b91c1c">단점</text>
  <text x="468" y="842" font-size="15" fill="#111827">• 외부 단편화(External Fragmentation) 발생</text>
  <text x="482" y="866" font-size="15" fill="#4b5563">(가변 크기라 중간에 빈 공간 생김)</text>
  <text x="468" y="894" font-size="15" fill="#111827">• 연속 메모리 필요</text>
</svg>
