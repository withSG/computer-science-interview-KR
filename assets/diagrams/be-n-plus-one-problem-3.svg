<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">연관 데이터 조회 전략 선택</title>
  <desc id="d">연관 데이터가 필요 없으면 LAZY 그대로 둔다. 필요하면 상황에 따라 단건 조회는 fetch join 또는 @EntityGraph, 목록과 페이징에서 ToOne은 fetch join, 컬렉션은 LAZY와 batch size, 컬렉션이 두 개 이상이면 하나만 fetch join하고 나머지는 batch size, 읽기 전용은 DTO 직접 조회를 고른다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 질문 -->
  <rect x="24" y="24" width="264" height="52" rx="26" fill="#1f2937"/>
  <text x="156" y="56" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">연관 데이터가 필요한가?</text>

  <!-- 아니오 -->
  <text x="415" y="42" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">아니오</text>
  <line x1="292" y1="50" x2="538" y2="50" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="544" y="26" width="312" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560" y="56" font-size="16" fill="#111827"><tspan font-weight="700">LAZY 그대로 둔다.</tspan> 문제 없음.</text>

  <!-- 예: 줄기 -->
  <text x="64" y="98" font-size="15" font-weight="700" fill="#374151">예</text>
  <line x1="52" y1="78" x2="52" y2="396" stroke="#374151" stroke-width="2"/>
  <g stroke="#374151" stroke-width="2" marker-end="url(#ah)">
    <line x1="52" y1="132" x2="78" y2="132"/>
    <line x1="52" y1="230" x2="78" y2="230"/>
    <line x1="52" y1="328" x2="78" y2="328"/>
    <line x1="52" y1="396" x2="78" y2="396"/>
  </g>

  <!-- 상황 -->
  <g fill="#ffffff" stroke="#374151" stroke-width="1.5">
    <rect x="80" y="108" width="300" height="48" rx="8"/>
    <rect x="80" y="206" width="300" height="48" rx="8"/>
    <rect x="80" y="304" width="300" height="48" rx="8"/>
    <rect x="80" y="372" width="300" height="48" rx="8"/>
  </g>
  <g font-size="16" fill="#111827">
    <text x="96" y="138">단건 조회이고 확실히 함께 쓴다</text>
    <text x="96" y="236">목록 + 페이징이 필요하다</text>
    <text x="96" y="334">컬렉션이 두 개 이상이다</text>
    <text x="96" y="402">읽기 전용이고 필드 몇 개만 필요하다</text>
  </g>

  <!-- 목록 + 페이징 갈래 -->
  <path d="M 382 230 H 392 M 392 200 V 260" fill="none" stroke="#374151" stroke-width="2"/>
  <g stroke="#374151" stroke-width="2" marker-end="url(#ah)">
    <line x1="391" y1="200" x2="402" y2="200"/>
    <line x1="391" y1="260" x2="402" y2="260"/>
  </g>
  <g fill="#f9fafb" stroke="#6b7280" stroke-width="1.5">
    <rect x="404" y="176" width="112" height="48" rx="8"/>
    <rect x="404" y="236" width="112" height="48" rx="8"/>
  </g>
  <g font-size="16" fill="#111827" text-anchor="middle">
    <text x="460" y="206">ToOne 관계</text>
    <text x="460" y="266">컬렉션</text>
  </g>

  <!-- 상황 → 선택 화살표 -->
  <g stroke="#374151" stroke-width="2" marker-end="url(#ah)">
    <line x1="384" y1="132" x2="538" y2="132"/>
    <line x1="520" y1="200" x2="538" y2="200"/>
    <line x1="520" y1="260" x2="538" y2="260"/>
    <line x1="384" y1="328" x2="538" y2="328"/>
    <line x1="384" y1="396" x2="538" y2="396"/>
  </g>

  <!-- 선택 -->
  <g fill="#ecfdf5" stroke="#047857" stroke-width="1.5">
    <rect x="544" y="108" width="312" height="48" rx="8"/>
    <rect x="544" y="176" width="312" height="48" rx="8"/>
    <rect x="544" y="236" width="312" height="48" rx="8"/>
    <rect x="544" y="304" width="312" height="48" rx="8"/>
    <rect x="544" y="372" width="312" height="48" rx="8"/>
  </g>
  <g font-size="16" font-weight="700" fill="#111827">
    <text x="560" y="138">fetch join / @EntityGraph</text>
    <text x="560" y="206">fetch join <tspan font-weight="400" fill="#4b5563">(행이 안 늘어남)</tspan></text>
    <text x="560" y="266">LAZY + batch size</text>
    <text x="560" y="334">하나만 fetch join + 나머지 batch size</text>
    <text x="560" y="402">DTO 직접 조회</text>
  </g>
</svg>
