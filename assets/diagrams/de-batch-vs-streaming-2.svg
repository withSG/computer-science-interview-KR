<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" width="880" height="690" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">윈도우 세 가지</title>
  <desc id="d">텀블링은 겹치지 않는 10분 고정 구간이라 이벤트가 정확히 한 윈도우에 속하고, 슬라이딩은 10분 윈도우가 겹치며 이동해 한 이벤트가 여러 윈도우에 들어가며, 세션은 활동 사이의 공백(gap)으로 구간이 정해져 길이가 제각각이다.</desc>
  <rect width="880" height="690" fill="#ffffff"/>
  <defs>
    <marker id="gap-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- ① 텀블링 -->
  <text x="24" y="44" font-size="19" font-weight="700" fill="#1d4ed8">텀블링(Tumbling)</text>
  <text x="212" y="44" font-size="16" fill="#374151">겹치지 않는 고정 구간</text>

  <rect x="83" y="86" width="234" height="34" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="323" y="86" width="234" height="34" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="563" y="86" width="234" height="34" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="108" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">10분</text>
  <text x="440" y="108" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">10분</text>
  <text x="680" y="108" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">10분</text>

  <line x1="248" y1="78" x2="248" y2="134" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="248" cy="70" r="5" fill="#111827"/>
  <text x="258" y="75" font-size="14" fill="#111827">이벤트</text>
  <circle cx="248" cy="103" r="4.5" fill="#111827"/>

  <line x1="80" y1="134" x2="800" y2="134" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="80" y1="134" x2="80" y2="140" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="320" y1="134" x2="320" y2="140" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="560" y1="134" x2="560" y2="140" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="800" y1="134" x2="800" y2="140" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="158" font-size="15" fill="#374151" text-anchor="middle">10:00</text>
  <text x="320" y="158" font-size="15" fill="#374151" text-anchor="middle">10:10</text>
  <text x="560" y="158" font-size="15" fill="#374151" text-anchor="middle">10:20</text>
  <text x="800" y="158" font-size="15" fill="#374151" text-anchor="middle">10:30</text>

  <text x="24" y="192" font-size="16" fill="#111827"><tspan font-weight="700" fill="#1d4ed8">→</tspan> 각 이벤트는 정확히 하나의 윈도우에 속한다</text>

  <line x1="24" y1="216" x2="856" y2="216" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ② 슬라이딩 -->
  <text x="24" y="256" font-size="19" font-weight="700" fill="#6d28d9">슬라이딩(Sliding)</text>
  <text x="212" y="256" font-size="16" fill="#374151">고정 길이가 일정 간격으로 겹치며 이동</text>

  <rect x="83" y="296" width="234" height="30" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="203" y="334" width="234" height="30" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="323" y="372" width="234" height="30" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="200" y="316" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">10분</text>
  <text x="320" y="354" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">10분</text>
  <text x="440" y="392" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">10분</text>

  <line x1="248" y1="288" x2="248" y2="414" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="248" cy="280" r="5" fill="#111827"/>
  <text x="258" y="285" font-size="14" fill="#111827">이벤트</text>
  <circle cx="248" cy="311" r="4.5" fill="#111827"/>
  <circle cx="248" cy="349" r="4.5" fill="#111827"/>

  <line x1="80" y1="414" x2="560" y2="414" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="80" y1="414" x2="80" y2="420" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="200" y1="414" x2="200" y2="420" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="320" y1="414" x2="320" y2="420" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="440" y1="414" x2="440" y2="420" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="560" y1="414" x2="560" y2="420" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="438" font-size="15" fill="#374151" text-anchor="middle">10:00</text>
  <text x="200" y="438" font-size="15" fill="#374151" text-anchor="middle">10:05</text>
  <text x="320" y="438" font-size="15" fill="#374151" text-anchor="middle">10:10</text>
  <text x="440" y="438" font-size="15" fill="#374151" text-anchor="middle">10:15</text>
  <text x="560" y="438" font-size="15" fill="#374151" text-anchor="middle">10:20</text>

  <text x="24" y="472" font-size="16" fill="#111827"><tspan font-weight="700" fill="#6d28d9">→</tspan> 하나의 이벤트가 여러 윈도우에 중복해서 들어간다</text>

  <line x1="24" y1="496" x2="856" y2="496" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ③ 세션 -->
  <text x="24" y="536" font-size="19" font-weight="700" fill="#b45309">세션(Session)</text>
  <text x="212" y="536" font-size="16" fill="#374151">활동 사이의 공백으로 구간이 결정된다</text>

  <text x="24" y="586" font-size="15" fill="#374151">이벤트</text>

  <rect x="106" y="560" width="120" height="40" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <rect x="370" y="560" width="92" height="40" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <rect x="594" y="560" width="32" height="40" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>

  <circle cx="122" cy="580" r="6" fill="#b45309"/>
  <circle cx="142" cy="580" r="6" fill="#b45309"/>
  <circle cx="162" cy="580" r="6" fill="#b45309"/>
  <circle cx="190" cy="580" r="6" fill="#b45309"/>
  <circle cx="210" cy="580" r="6" fill="#b45309"/>
  <circle cx="386" cy="580" r="6" fill="#b45309"/>
  <circle cx="406" cy="580" r="6" fill="#b45309"/>
  <circle cx="426" cy="580" r="6" fill="#b45309"/>
  <circle cx="446" cy="580" r="6" fill="#b45309"/>
  <circle cx="610" cy="580" r="6" fill="#b45309"/>

  <line x1="236" y1="580" x2="360" y2="580" stroke="#4b5563" stroke-width="1.5" marker-start="url(#gap-ar)" marker-end="url(#gap-ar)"/>
  <line x1="472" y1="580" x2="584" y2="580" stroke="#4b5563" stroke-width="1.5" marker-start="url(#gap-ar)" marker-end="url(#gap-ar)"/>
  <text x="298" y="568" font-size="15" fill="#374151" text-anchor="middle">gap</text>
  <text x="528" y="568" font-size="15" fill="#374151" text-anchor="middle">gap</text>

  <text x="166" y="624" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">세션1</text>
  <text x="416" y="624" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">세션2</text>
  <text x="610" y="624" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">세션3</text>

  <text x="24" y="664" font-size="16" fill="#111827"><tspan font-weight="700" fill="#b45309">→</tspan> 길이가 고정이 아니라 데이터가 정한다</text>
</svg>
