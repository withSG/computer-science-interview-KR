<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4. 윈도우 — 무한한 스트림을 자르기</title>
  <desc id="d">텀블링, 슬라이딩, 세션 윈도우의 구조와 특성을 시각화한 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="770" fill="#ffffff"/>

  <!-- ==================== 1. 텀블링 윈도우 (Tumbling) ==================== -->
  <rect x="24" y="24" width="832" height="210" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  
  <!-- Section Title -->
  <text x="40" y="58" font-size="16" font-weight="bold" fill="#1f2933">[텀블링(Tumbling)]</text>
  <text x="200" y="58" font-size="14" fill="#52606d">겹치지 않는 고정 구간</text>

  <!-- Timeline Base Line -->
  <line x1="80" y1="120" x2="800" y2="120" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- Ticks & Labels -->
  <line x1="120" y1="110" x2="120" y2="130" stroke="#1f2933" stroke-width="2"/>
  <text x="120" y="152" font-size="13" text-anchor="middle" fill="#1f2933">10:00</text>

  <line x1="320" y1="110" x2="320" y2="130" stroke="#1f2933" stroke-width="2"/>
  <text x="320" y="152" font-size="13" text-anchor="middle" fill="#1f2933">10:10</text>

  <line x1="520" y1="110" x2="520" y2="130" stroke="#1f2933" stroke-width="2"/>
  <text x="520" y="152" font-size="13" text-anchor="middle" fill="#1f2933">10:20</text>

  <line x1="720" y1="110" x2="720" y2="130" stroke="#1f2933" stroke-width="2"/>
  <text x="720" y="152" font-size="13" text-anchor="middle" fill="#1f2933">10:30</text>

  <!-- Tumbling Window Ranges -->
  <!-- Window 1 -->
  <rect x="120" y="90" width="200" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="120" y1="105" x2="320" y2="105" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="185" y="96" width="70" height="18" fill="#ffffff" rx="2"/>
  <text x="220" y="110" font-size="13" text-anchor="middle" font-weight="bold" fill="#2563eb">10분</text>

  <!-- Window 2 -->
  <rect x="320" y="90" width="200" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="320" y1="105" x2="520" y2="105" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="385" y="96" width="70" height="18" fill="#ffffff" rx="2"/>
  <text x="420" y="110" font-size="13" text-anchor="middle" font-weight="bold" fill="#2563eb">10분</text>

  <!-- Window 3 -->
  <rect x="520" y="90" width="200" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="520" y1="105" x2="720" y2="105" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="585" y="96" width="70" height="18" fill="#ffffff" rx="2"/>
  <text x="620" y="110" font-size="13" text-anchor="middle" font-weight="bold" fill="#2563eb">10분</text>

  <!-- Footnote -->
  <text x="40" y="198" font-size="13" fill="#1f2933">각 이벤트는 정확히 하나의 윈도우에 속한다</text>


  <!-- ==================== 2. 슬라이딩 윈도우 (Sliding) ==================== -->
  <rect x="24" y="258" width="832" height="260" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>

  <!-- Section Title -->
  <text x="40" y="292" font-size="16" font-weight="bold" fill="#1f2933">[슬라이딩(Sliding)]</text>
  <text x="195" y="292" font-size="14" fill="#52606d">고정 길이가 일정 간격으로 겹치며 이동</text>

  <!-- Window 1 -->
  <rect x="120" y="315" width="280" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="225" y="319" width="70" height="18" fill="#ffffff" rx="2"/>
  <text x="260" y="333" font-size="13" text-anchor="middle" font-weight="bold" fill="#059669">10분</text>

  <!-- Window 2 -->
  <rect x="260" y="350" width="280" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="365" y="354" width="70" height="18" fill="#ffffff" rx="2"/>
  <text x="400" y="368" font-size="13" text-anchor="middle" font-weight="bold" fill="#059669">10분</text>

  <!-- Window 3 -->
  <rect x="400" y="385" width="280" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="505" y="389" width="70" height="18" fill="#ffffff" rx="2"/>
  <text x="540" y="403" font-size="13" text-anchor="middle" font-weight="bold" fill="#059669">10분</text>

  <!-- Timeline Base Line -->
  <line x1="80" y1="430" x2="800" y2="430" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- Ticks & Labels -->
  <line x1="120" y1="425" x2="120" y2="435" stroke="#1f2933" stroke-width="2"/>
  <text x="120" y="452" font-size="13" text-anchor="middle" fill="#1f2933">10:00</text>

  <line x1="260" y1="425" x2="260" y2="435" stroke="#1f2933" stroke-width="2"/>
  <text x="260" y="452" font-size="13" text-anchor="middle" fill="#1f2933">10:05</text>

  <line x1="400" y1="425" x2="400" y2="435" stroke="#1f2933" stroke-width="2"/>
  <text x="400" y="452" font-size="13" text-anchor="middle" fill="#1f2933">10:10</text>

  <line x1="540" y1="425" x2="540" y2="435" stroke="#1f2933" stroke-width="2"/>
  <text x="540" y="452" font-size="13" text-anchor="middle" fill="#1f2933">10:15</text>

  <!-- Footnote -->
  <text x="40" y="498" font-size="13" fill="#1f2933">하나의 이벤트가 여러 윈도우에 중복해서 들어간다</text>


  <!-- ==================== 3. 세션 윈도우 (Session) ==================== -->
  <rect x="24" y="542" width="832" height="204" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>

  <!-- Section Title -->
  <text x="40" y="576" font-size="16" font-weight="bold" fill="#1f2933">[세션(Session)]</text>
  <text x="180" y="576" font-size="14" fill="#52606d">활동 사이의 공백으로 구간이 결정된다</text>

  <!-- Events Timeline -->
  <text x="40" y="622" font-size="14" fill="#1f2933">이벤트:</text>

  <!-- Dots (●) for Events -->
  <!-- Group 1 -->
  <circle cx="125" cy="617" r="5" fill="#7c3aed"/>
  <circle cx="140" cy="617" r="5" fill="#7c3aed"/>
  <circle cx="155" cy="617" r="5" fill="#7c3aed"/>
  <circle cx="180" cy="617" r="5" fill="#7c3aed"/>
  <circle cx="195" cy="617" r="5" fill="#7c3aed"/>

  <!-- Group 2 -->
  <circle cx="340" cy="617" r="5" fill="#7c3aed"/>
  <circle cx="355" cy="617" r="5" fill="#7c3aed"/>
  <circle cx="370" cy="617" r="5" fill="#7c3aed"/>
  <circle cx="385" cy="617" r="5" fill="#7c3aed"/>

  <!-- Group 3 -->
  <circle cx="530" cy="617" r="5" fill="#7c3aed"/>

  <!-- Brackets & Labels for Sessions -->
  <!-- Session 1 Bracket -->
  <path d="M115,632 L115,640 L160,640 L160,646 L160,640 L205,640 L205,632" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="135" y="642" width="50" height="18" fill="#f5f3ff"/>
  <text x="160" y="656" font-size="13" text-anchor="middle" font-weight="bold" fill="#7c3aed">세션1</text>

  <!-- Gap 1 -->
  <text x="260" y="652" font-size="13" text-anchor="middle" font-style="italic" fill="#52606d">gap</text>

  <!-- Session 2 Bracket -->
  <path d="M330,632 L330,640 L362.5,640 L362.5,646 L362.5,640 L395,640 L395,632" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="337.5" y="642" width="50" height="18" fill="#f5f3ff"/>
  <text x="362.5" y="656" font-size="13" text-anchor="middle" font-weight="bold" fill="#7c3aed">세션2</text>

  <!-- Gap 2 -->
  <text x="450" y="652" font-size="13" text-anchor="middle" font-style="italic" fill="#52606d">gap</text>

  <!-- Session 3 Bracket -->
  <path d="M520,632 L520,640 L530,640 L530,646 L530,640 L540,640 L540,632" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="505" y="642" width="50" height="18" fill="#f5f3ff"/>
  <text x="530" y="656" font-size="13" text-anchor="middle" font-weight="bold" fill="#7c3aed">세션3</text>

  <!-- Footnote -->
  <text x="40" y="718" font-size="13" fill="#1f2933">길이가 고정이 아니라 데이터가 정한다</text>
</svg>