<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">병목은 사라지지 않고 아래로 내려간다</title>
  <desc id="d">애플리케이션 서버 증설로 인한 DB 커넥션 초과 문제 및 장애 연쇄 반응 흐름도</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Step 1: Application Connections -->
  <rect x="40" y="30" width="800" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="60.75" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">애플리케이션 20대 × 커넥션 풀 50개 = 1,000개 커넥션 요청</text>

  <!-- Step 2: MySQL Max Connections Limits -->
  <rect x="40" y="105" width="800" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="135.75" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">MySQL max_connections = 151 (기본값인 경우가 많다)</text>

  <!-- Connection Overflow Arrow -->
  <path d="M440,155 L440,175" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Step 3: Cascading Failures Container -->
  <rect x="40" y="185" width="800" height="125" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>

  <!-- Failure Line 1 -->
  <text x="440" y="218.55" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">→ 대부분이 연결에 실패 → 재시도 → DB는 연결 수락만으로 CPU를 쓴다</text>

  <!-- Internal Cascade Arrow -->
  <path d="M440,233 L440,250" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-amber)"/>

  <!-- Failure Line 2 -->
  <text x="440" y="278.55" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">→ 정상 쿼리까지 느려진다</text>
</svg>