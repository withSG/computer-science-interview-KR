<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">수직 확장: 서버 1대를 더 강력한 서버로 교체</title>
  <desc id="d">CPU 4코어·RAM 16GB인 서버 1대를 CPU 32코어·RAM 256GB인 더 강력한 서버로 교체하는 Scale Up. 코어는 칸 개수, RAM은 막대 길이로 같은 비율로 그렸다.</desc>
  <rect width="880" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 이전: 서버 1대 -->
  <rect x="40" y="40" width="172" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="126" y="72" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">서버 1대</text>
  <line x1="56" y1="90" x2="196" y2="90" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="127.5" font-size="16" fill="#374151">CPU 4코어</text>
  <path d="M160 108h12v12h-12zM176 108h12v12h-12zM160 124h12v12h-12zM176 124h12v12h-12z" fill="#64748b"/>
  <text x="60" y="173.5" font-size="16" fill="#374151">RAM 16GB</text>
  <rect x="160" y="160" width="16" height="16" fill="#64748b"/>

  <!-- 교체 화살표 -->
  <line x1="228" y1="120" x2="426" y2="120" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="328" y="106" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Scale Up</text>
  <text x="328" y="148" font-size="15" fill="#374151" text-anchor="middle">더 강력한 서버로 교체</text>

  <!-- 이후: 더 강력한 서버 -->
  <rect x="444" y="40" width="396" height="160" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="642" y="72" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">더 강력한 서버</text>
  <line x1="460" y1="90" x2="824" y2="90" stroke="#bfdbfe" stroke-width="1"/>
  <text x="464" y="127.5" font-size="16" font-weight="bold" fill="#1e3a8a">CPU 32코어</text>
  <path d="M564 108h12v12h-12zM580 108h12v12h-12zM596 108h12v12h-12zM612 108h12v12h-12zM628 108h12v12h-12zM644 108h12v12h-12zM660 108h12v12h-12zM676 108h12v12h-12zM692 108h12v12h-12zM708 108h12v12h-12zM724 108h12v12h-12zM740 108h12v12h-12zM756 108h12v12h-12zM772 108h12v12h-12zM788 108h12v12h-12zM804 108h12v12h-12zM564 124h12v12h-12zM580 124h12v12h-12zM596 124h12v12h-12zM612 124h12v12h-12zM628 124h12v12h-12zM644 124h12v12h-12zM660 124h12v12h-12zM676 124h12v12h-12zM692 124h12v12h-12zM708 124h12v12h-12zM724 124h12v12h-12zM740 124h12v12h-12zM756 124h12v12h-12zM772 124h12v12h-12zM788 124h12v12h-12zM804 124h12v12h-12z" fill="#2563eb"/>
  <text x="464" y="173.5" font-size="16" font-weight="bold" fill="#1e3a8a">RAM 256GB</text>
  <rect x="564" y="160" width="256" height="16" fill="#2563eb"/>

  <!-- 범례 -->
  <text x="440" y="230" font-size="14" fill="#4b5563" text-anchor="middle">칸 1개 = 코어 1개 · 막대 길이 = RAM 용량 (두 서버 같은 비율)</text>
</svg>
