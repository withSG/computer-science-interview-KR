<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">수직 확장 (Vertical Scaling)</title>
  <desc id="d">서버 1대(CPU 4코어, RAM 16GB)에서 더 강력한 서버(CPU 32코어, RAM 256GB)로 업그레이드되는 수직 확장 과정 다이어그램</desc>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="880" height="260" fill="#ffffff"/>

  <!-- 이전: 기존 서버 (서버 1대) -->
  <rect x="130" y="40" width="220" height="180" rx="8" ry="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="240" y="85" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">서버 1대</text>
  <line x1="150" y1="105" x2="330" y2="105" stroke="#cbd2d9" stroke-width="1"/>
  <text x="240" y="139" font-size="13" fill="#52606d" text-anchor="middle">CPU 4코어</text>
  <text x="240" y="174" font-size="13" fill="#52606d" text-anchor="middle">RAM 16GB</text>

  <!-- 화살표 -->
  <path d="M 370 130 L 500 130" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 이후: 스케일 업 서버 (더 강력한 서버) -->
  <rect x="520" y="40" width="230" height="180" rx="8" ry="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="635" y="85" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">더 강력한 서버</text>
  <line x1="540" y1="105" x2="730" y2="105" stroke="#cbd2d9" stroke-width="1"/>
  <text x="635" y="139" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">CPU 32코어</text>
  <text x="635" y="174" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">RAM 256GB</text>
</svg>