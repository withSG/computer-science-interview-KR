<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="880" height="720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">지원 동기의 3층 구조</title>
  <desc id="d">회사에 대한 구체적 사실, 내가 가진 것과의 접점, 여기서 하고 싶은 일의 3층 구조와 각 요소가 빠졌을 때의 반응을 보여주는 다이어그램입니다.</desc>

  <!-- 배경 -->
  <rect width="880" height="720" fill="#ffffff"/>

  <!-- 마커 정의 -->
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- [A] 구역 -->
  <g>
    <text x="140" y="74" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[A]</text>
    <rect x="180" y="30" width="300" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="59" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">회사에 대한 구체적 사실</text>
    <text x="330" y="81" font-size="13" fill="#52606d" text-anchor="middle">서비스 / 기술 / 최근 변화</text>
    
    <!-- 오른쪽 설명 -->
    <path d="M 520 65 L 490 65" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-blue)"/>
    <text x="535" y="70" font-size="13" font-weight="bold" fill="#2563eb">조사에서 나온다</text>
  </g>

  <!-- [A] -> [B] 연결선 및 라벨 -->
  <path d="M 330 100 L 330 160" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <rect x="270" y="120" width="120" height="20" fill="#ffffff"/>
  <text x="330" y="134" font-size="11.5" fill="#52606d" text-anchor="middle">이어붙이는 논리</text>

  <!-- [B] 구역 -->
  <g>
    <text x="140" y="204" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">[B]</text>
    <rect x="180" y="160" width="300" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="330" y="189" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">내가 가진 것과의 접점</text>
    <text x="330" y="211" font-size="13" fill="#52606d" text-anchor="middle">경험 / 관심사 / 강점</text>

    <!-- 오른쪽 설명 -->
    <path d="M 520 195 L 490 195" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-green)"/>
    <text x="535" y="200" font-size="13" font-weight="bold" fill="#059669">내 경험에서 나온다</text>
  </g>

  <!-- [B] -> [C] 연결선 -->
  <path d="M 330 230 L 330 290" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- [C] 구역 -->
  <g>
    <text x="140" y="334" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">[C]</text>
    <rect x="180" y="290" width="300" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="330" y="319" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">여기서 하고 싶은 일</text>
    <text x="330" y="341" font-size="13" fill="#52606d" text-anchor="middle">기여 + 성장 방향</text>

    <!-- 오른쪽 설명 -->
    <path d="M 520 325 L 490 325" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-purple)"/>
    <text x="535" y="330" font-size="13" font-weight="bold" fill="#7c3aed">미래형</text>
  </g>

  <!-- 구분선 -->
  <line x1="80" y1="400" x2="800" y2="400" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- 하단 섹션: 빠지면 이렇게 들린다 -->
  <g>
    <text x="80" y="440" font-size="14" font-weight="bold" fill="#1f2933">빠지면 이렇게 들린다</text>

    <!-- A 없음 -->
    <rect x="80" y="465" width="720" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="110" y="498" font-size="13" font-weight="bold" fill="#dc2626">A 없음</text>
    <path d="M 180 493 L 205 493" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="215" y="498" font-size="13" fill="#1f2933">"아무 회사에나 낸 지원서"</text>

    <!-- B 없음 -->
    <rect x="80" y="535" width="720" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="110" y="568" font-size="13" font-weight="bold" fill="#d97706">B 없음</text>
    <path d="M 180 563 L 205 563" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="215" y="568" font-size="13" fill="#1f2933">"팬심은 알겠는데 왜 당신을 뽑아야 하나"</text>

    <!-- C 없음 -->
    <rect x="80" y="605" width="720" height="56" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
    <text x="110" y="638" font-size="13" font-weight="bold" fill="#52606d">C 없음</text>
    <path d="M 180 633 L 205 633" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="215" y="638" font-size="13" fill="#1f2933">"들어와서 뭘 하고 싶은지 없는 사람"</text>
  </g>
</svg>