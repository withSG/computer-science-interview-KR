<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">지원 동기의 3층 구조</title>
  <desc id="d">지원 동기는 조사에서 나오는 회사에 대한 구체적 사실(A), 내 경험에서 나오는 내가 가진 것과의 접점(B), 미래형인 여기서 하고 싶은 일(C)의 세 층으로 이어지며, 각 층이 빠지면 어떻게 들리는지를 같은 줄에 보여준다.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- 열 머리 -->
  <text x="24" y="42" font-size="16" font-weight="bold" fill="#374151">지원 동기의 세 층</text>
  <text x="556" y="42" font-size="16" font-weight="bold" fill="#b91c1c">빠지면 이렇게 들린다</text>

  <!-- 층 사이 연결선 -->
  <line x1="184" y1="156" x2="184" y2="204" stroke="#6b7280" stroke-width="2"/>
  <text x="198" y="185" font-size="15" fill="#4b5563">이어붙이는 논리</text>
  <line x1="184" y1="300" x2="184" y2="348" stroke="#6b7280" stroke-width="2"/>

  <!-- A층 -->
  <rect x="24" y="60" width="320" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="40" y="88" width="40" height="40" rx="8" fill="#1d4ed8"/>
  <text x="60" y="115" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  <text x="96" y="102" font-size="17" font-weight="bold" fill="#111827">회사에 대한 구체적 사실</text>
  <text x="96" y="128" font-size="15" fill="#374151">서비스 / 기술 / 최근 변화</text>
  <line x1="392" y1="108" x2="352" y2="108" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="400" y="113" font-size="15" font-weight="bold" fill="#1d4ed8">조사에서 나온다</text>
  <rect x="556" y="60" width="300" height="96" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="576" y="100" font-size="15" font-weight="bold" fill="#b91c1c">A 없음</text>
  <text x="576" y="128" font-size="16" fill="#111827">“아무 회사에나 낸 지원서”</text>

  <!-- B층 -->
  <rect x="24" y="204" width="320" height="96" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <rect x="40" y="232" width="40" height="40" rx="8" fill="#047857"/>
  <text x="60" y="259" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <text x="96" y="246" font-size="17" font-weight="bold" fill="#111827">내가 가진 것과의 접점</text>
  <text x="96" y="272" font-size="15" fill="#374151">경험 / 관심사 / 강점</text>
  <line x1="392" y1="252" x2="352" y2="252" stroke="#047857" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="400" y="257" font-size="15" font-weight="bold" fill="#047857">내 경험에서 나온다</text>
  <rect x="556" y="204" width="300" height="96" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="576" y="234" font-size="15" font-weight="bold" fill="#b91c1c">B 없음</text>
  <text x="576" y="260" font-size="16" fill="#111827">“팬심은 알겠는데</text>
  <text x="576" y="284" font-size="16" fill="#111827">왜 당신을 뽑아야 하나”</text>

  <!-- C층 -->
  <rect x="24" y="348" width="320" height="96" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="40" y="376" width="40" height="40" rx="8" fill="#6d28d9"/>
  <text x="60" y="403" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
  <text x="96" y="390" font-size="17" font-weight="bold" fill="#111827">여기서 하고 싶은 일</text>
  <text x="96" y="416" font-size="15" fill="#374151">기여 + 성장 방향</text>
  <line x1="392" y1="396" x2="352" y2="396" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="400" y="401" font-size="15" font-weight="bold" fill="#6d28d9">미래형</text>
  <rect x="556" y="348" width="300" height="96" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="576" y="388" font-size="15" font-weight="bold" fill="#b91c1c">C 없음</text>
  <text x="576" y="416" font-size="16" fill="#111827">“들어와서 뭘 하고 싶은지 없는 사람”</text>
</svg>
