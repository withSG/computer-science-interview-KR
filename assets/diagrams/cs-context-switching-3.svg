<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컨텍스트 스위칭 비용 비교</title>
  <desc id="d">프로세스 스위칭과 스레드 스위칭의 비용 차이 및 각 세부 항목을 트리 형태로 비교한 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Main Title Container -->
  <rect x="40" y="30" width="800" height="50" rx="8" fill="#1f2933"/>
  <text x="440" y="61" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">컨텍스트 스위칭 비용 비교</text>

  <!-- Connectors from Root to Main Branches -->
  <path d="M 440,80 L 440,110 L 250,110 L 250,130" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <path d="M 440,110 L 630,110 L 630,130" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- Left Branch: Process Switching (High Cost / Red accent) -->
  <!-- Process Header Box -->
  <rect x="50" y="130" width="400" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="250" y="157" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">프로세스 스위칭</text>
  <text x="250" y="177" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">수천 ~ 수만 CPU 사이클</text>

  <!-- Process Items Tree Structure lines -->
  <path d="M 90,190 L 90,425" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- Process Item 1: PCB 저장/복원 -->
  <path d="M 90,230 L 115,230" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <rect x="115" y="208" width="315" height="44" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="135" y="234" font-size="14" font-weight="bold" fill="#1f2933">PCB 저장/복원</text>

  <!-- Process Item 2: 메모리 매핑 변경 -->
  <path d="M 90,295 L 115,295" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <rect x="115" y="273" width="315" height="44" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="135" y="299" font-size="14" font-weight="bold" fill="#1f2933">메모리 매핑 변경</text>

  <!-- Process Item 3: TLB 플러시 -->
  <path d="M 90,360 L 115,360" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <rect x="115" y="338" width="315" height="44" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="135" y="364" font-size="14" font-weight="bold" fill="#1f2933">TLB 플러시</text>

  <!-- Process Item 4: 캐시 미스 페널티 -->
  <path d="M 90,425 L 115,425" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <rect x="115" y="403" width="315" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="135" y="429" font-size="14" font-weight="bold" fill="#d97706">캐시 미스 페널티</text>


  <!-- Right Branch: Thread Switching (Lower Cost / Blue accent) -->
  <!-- Thread Header Box -->
  <rect x="480" y="130" width="350" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="157" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">스레드 스위칭</text>
  <text x="655" y="177" font-size="13" font-weight="bold" fill="#52606d" text-anchor="middle">수백 ~ 수천 CPU 사이클</text>

  <!-- Thread Items Tree Structure lines -->
  <path d="M 515,190 L 515,295" stroke="#9aa5b1" stroke-width="2" fill="none"/>

  <!-- Thread Item 1: TCB 저장/복원 -->
  <path d="M 515,230 L 540,230" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <rect x="540" y="208" width="270" height="44" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="560" y="234" font-size="14" font-weight="bold" fill="#1f2933">TCB 저장/복원</text>

  <!-- Thread Item 2: 레지스터 교체 -->
  <path d="M 515,295 L 540,295" stroke="#9aa5b1" stroke-width="2" fill="none"/>
  <rect x="540" y="273" width="270" height="44" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="560" y="299" font-size="14" font-weight="bold" fill="#1f2933">레지스터 교체</text>

</svg>