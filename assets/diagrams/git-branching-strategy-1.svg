<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 필요한가 - 제품 성격 및 배포 주기에 따른 브랜치 전략 선택</title>
  <desc id="d">배포 주기와 지원 버전 수에 따라 웹 서비스/SaaS는 GitHub Flow 및 트렁크 기반 개발을, 패키지 SW/모바일 앱은 Git Flow를 선택함을 나타내는 다이어그램</desc>
  
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 상단 화살표 축 (배포 주기/버전 지원 범주) -->
  <path d="M 230,40 L 650,40" stroke="#1f2933" stroke-width="2" fill="none" marker-end="url(#a-ink)"/>
  
  <rect x="24" y="28" width="190" height="24" fill="#ffffff"/>
  <text x="210" y="44" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="end">배포 주기가 짧고</text>
  
  <rect x="670" y="28" width="190" height="24" fill="#ffffff"/>
  <text x="670" y="44" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">배포 주기가 길고</text>

  <text x="210" y="66" font-size="13" fill="#52606d" text-anchor="end">버전이 하나만 존재</text>
  <text x="670" y="66" font-size="13" fill="#52606d" text-anchor="start">여러 버전을 동시 지원</text>

  <!-- 왼쪽 영역: 짧은 배포 주기 / 단일 버전 (파랑 계열) -->
  <rect x="40" y="100" width="360" height="80" rx="6" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="220" y="132" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">웹 서비스, SaaS</text>
  <text x="220" y="157" font-size="13" fill="#52606d" text-anchor="middle">(하루에 여러 번 배포)</text>

  <!-- 왼쪽 수직 연결 화살표 -->
  <path d="M 220,180 L 220,220" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- 왼쪽 결과 박스 -->
  <rect x="40" y="220" width="360" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="252" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">브랜치를 적게, 짧게</text>
  <text x="220" y="277" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">(GitHub Flow / TBD)</text>

  <!-- 오른쪽 영역: 긴 배포 주기 / 다중 버전 (보라 계열) -->
  <rect x="480" y="100" width="360" height="80" rx="6" fill="#f5f3ff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="660" y="132" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">패키지 SW, 모바일 앱,</text>
  <text x="660" y="157" font-size="13" fill="#52606d" text-anchor="middle">설치형 엔터프라이즈 제품</text>

  <!-- 오른쪽 수직 연결 화살표 -->
  <path d="M 660,180 L 660,220" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- 오른쪽 결과 박스 -->
  <rect x="480" y="220" width="360" height="80" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="660" y="252" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">브랜치를 명확히 나눠</text>
  <text x="660" y="277" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">버전별로 관리 (Git Flow)</text>
</svg>