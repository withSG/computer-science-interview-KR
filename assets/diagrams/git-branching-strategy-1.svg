<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배포 주기에 따른 브랜치 전략 선택</title>
  <desc id="d">배포 주기가 짧고 버전이 하나뿐인 웹 서비스·SaaS는 브랜치를 적게, 짧게(GitHub Flow / TBD) 가져가고, 배포 주기가 길고 여러 버전을 동시 지원하는 패키지 SW·모바일 앱·설치형 엔터프라이즈 제품은 브랜치를 명확히 나눠 버전별로 관리(Git Flow)한다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 스펙트럼 축: 짧은 배포 주기 → 긴 배포 주기 -->
  <text x="230" y="50" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">배포 주기가 짧고</text>
  <text x="230" y="76" font-size="15" fill="#374151" text-anchor="middle">버전이 하나만 존재</text>
  <line x1="318" y1="58" x2="560" y2="58" stroke="#374151" stroke-width="2.5" marker-end="url(#ah-ink)"/>
  <text x="650" y="50" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">배포 주기가 길고</text>
  <text x="650" y="76" font-size="15" fill="#374151" text-anchor="middle">여러 버전을 동시 지원</text>

  <!-- 왼쪽: 짧은 배포 주기 -->
  <rect x="40" y="100" width="380" height="80" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="230" y="133" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">웹 서비스, SaaS</text>
  <text x="230" y="159" font-size="15" fill="#4b5563" text-anchor="middle">(하루에 여러 번 배포)</text>

  <line x1="230" y1="182" x2="230" y2="222" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ah-blue)"/>

  <rect x="40" y="226" width="380" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="230" y="262" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">브랜치를 적게, 짧게</text>
  <text x="230" y="291" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">(GitHub Flow / TBD)</text>

  <!-- 오른쪽: 긴 배포 주기 -->
  <rect x="460" y="100" width="380" height="80" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="650" y="133" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">패키지 SW, 모바일 앱,</text>
  <text x="650" y="159" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">설치형 엔터프라이즈 제품</text>

  <line x1="650" y1="182" x2="650" y2="222" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ah-purple)"/>

  <rect x="460" y="226" width="380" height="88" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="650" y="262" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">브랜치를 명확히 나눠 버전별로 관리</text>
  <text x="650" y="291" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">(Git Flow)</text>
</svg>
