<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컨트롤 플레인 구성요소</title>
  <desc id="d">쿠버네티스 컨트롤 플레인 구성요소(kube-scheduler, kube-controller-manager, kube-apiserver, etcd)와 워커 노드(Node 1, 2, 3) 간의 관계를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- Control Plane 그룹 영역 -->
  <rect x="40" y="30" width="800" height="350" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="56" fill="#1f2933" font-size="16" font-weight="bold">Control Plane</text>

  <!-- kube-scheduler -->
  <rect x="70" y="80" width="180" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="104.5" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">kube-scheduler</text>

  <!-- kube-controller-manager -->
  <rect x="530" y="80" width="220" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="104.5" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">kube-controller-manager</text>

  <!-- kube-apiserver -->
  <rect x="180" y="170" width="520" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="196.5" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">kube-apiserver</text>
  <text x="440" y="220.5" fill="#1f2933" font-size="13" text-anchor="middle">인증 · 인가 · Admission · 스키마 검증</text>
  <text x="440" y="242.5" fill="#52606d" font-size="11.5" text-anchor="middle">(클러스터로 들어가는 유일한 관문)</text>

  <!-- etcd -->
  <rect x="375" y="300" width="130" height="45" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="327.5" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">etcd</text>
  <text x="520" y="327.5" fill="#52606d" font-size="11.5" text-anchor="start">단일 진실 원천</text>

  <!-- 화살표: scheduler -> apiserver -->
  <path d="M160,120 L160,145 L250,145 L250,170" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <rect x="160" y="137" width="85" height="18" fill="#ffffff"/>
  <text x="202.5" y="150" fill="#52606d" font-size="11.5" text-anchor="middle">watch / write</text>

  <!-- 화살표: controller-manager -> apiserver -->
  <path d="M640,120 L640,170" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- 화살표: apiserver -> etcd -->
  <path d="M440,260 L440,300" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="448" y="271" width="55" height="18" fill="#ffffff"/>
  <text x="450" y="284" fill="#52606d" font-size="11.5" text-anchor="start">읽기/쓰기</text>

  <!-- Control Plane -> Nodes 연결선 & 라벨 -->
  <path d="M440,380 L440,430" fill="none" stroke="#1f2933" stroke-width="1.5"/>
  <path d="M160,430 L720,430" fill="none" stroke="#1f2933" stroke-width="1.5"/>
  <path d="M160,430 L160,450" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M440,430 L440,450" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M720,430 L720,450" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <rect x="448" y="396" width="160" height="18" fill="#ffffff"/>
  <text x="450" y="409" fill="#52606d" font-size="11.5" text-anchor="start">kubelet이 API 서버를 watch</text>

  <!-- Node 1 -->
  <rect x="70" y="450" width="180" height="100" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="471.5" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Node 1</text>
  <text x="160" y="491.5" fill="#52606d" font-size="11.5" text-anchor="middle">kubelet</text>
  <text x="160" y="511.5" fill="#52606d" font-size="11.5" text-anchor="middle">kube-proxy</text>
  <text x="160" y="531.5" fill="#52606d" font-size="11.5" text-anchor="middle">런타임</text>

  <!-- Node 2 -->
  <rect x="350" y="450" width="180" height="100" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="471.5" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Node 2</text>
  <text x="440" y="491.5" fill="#52606d" font-size="11.5" text-anchor="middle">kubelet</text>
  <text x="440" y="511.5" fill="#52606d" font-size="11.5" text-anchor="middle">kube-proxy</text>
  <text x="440" y="531.5" fill="#52606d" font-size="11.5" text-anchor="middle">런타임</text>

  <!-- Node 3 -->
  <rect x="630" y="450" width="180" height="100" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="720" y="471.5" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">Node 3</text>
  <text x="720" y="491.5" fill="#52606d" font-size="11.5" text-anchor="middle">kubelet</text>
  <text x="720" y="511.5" fill="#52606d" font-size="11.5" text-anchor="middle">kube-proxy</text>
  <text x="720" y="531.5" fill="#52606d" font-size="11.5" text-anchor="middle">런타임</text>
</svg>