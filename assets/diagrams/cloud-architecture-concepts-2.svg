<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컨트롤 플레인과 워커 노드</title>
  <desc id="d">컨트롤 플레인 안에서 kube-scheduler와 kube-controller-manager는 kube-apiserver를 watch/write하고, 클러스터로 들어가는 유일한 관문인 kube-apiserver만 단일 진실 원천인 etcd를 읽고 쓴다. 각 노드(kubelet, kube-proxy, 런타임)의 kubelet은 API 서버를 watch한다.</desc>
  <rect width="880" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Control Plane 영역 -->
  <rect x="24" y="24" width="832" height="386" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="46" y="56" font-size="19" font-weight="bold" fill="#1f2937">Control Plane</text>

  <!-- scheduler / controller-manager -->
  <rect x="80" y="76" width="240" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="200" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">kube-scheduler</text>
  <rect x="500" y="76" width="300" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="650" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">kube-controller-manager</text>

  <line x1="200" y1="128" x2="200" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="650" y1="128" x2="650" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <text x="425" y="160" text-anchor="middle" font-size="16" fill="#374151">watch / write</text>

  <!-- kube-apiserver -->
  <rect x="120" y="184" width="640" height="112" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="220" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">kube-apiserver</text>
  <text x="440" y="251" text-anchor="middle" font-size="16" fill="#1f2937">인증 · 인가 · Admission · 스키마 검증</text>
  <text x="440" y="279" text-anchor="middle" font-size="15" fill="#374151">(클러스터로 들어가는 유일한 관문)</text>

  <!-- etcd -->
  <line x1="440" y1="296" x2="440" y2="340" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <text x="456" y="324" font-size="16" fill="#374151">읽기/쓰기</text>
  <rect x="360" y="344" width="160" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="374" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">etcd</text>
  <text x="540" y="374" font-size="16" font-weight="bold" fill="#047857">단일 진실 원천</text>

  <!-- 컨트롤 플레인 → 노드 -->
  <line x1="440" y1="410" x2="440" y2="460" stroke="#374151" stroke-width="2"/>
  <text x="456" y="442" font-size="16" fill="#374151">kubelet이 API 서버를 watch</text>
  <line x1="170" y1="460" x2="710" y2="460" stroke="#374151" stroke-width="2"/>
  <line x1="170" y1="460" x2="170" y2="492" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="440" y1="460" x2="440" y2="492" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <line x1="710" y1="460" x2="710" y2="492" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>

  <!-- Nodes -->
  <rect x="60" y="496" width="220" height="120" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="170" y="524" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">Node 1</text>
  <text x="170" y="552" text-anchor="middle" font-size="16" fill="#1f2937">kubelet</text>
  <text x="170" y="576" text-anchor="middle" font-size="16" fill="#1f2937">kube-proxy</text>
  <text x="170" y="600" text-anchor="middle" font-size="16" fill="#1f2937">런타임</text>

  <rect x="330" y="496" width="220" height="120" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="524" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">Node 2</text>
  <text x="440" y="552" text-anchor="middle" font-size="16" fill="#1f2937">kubelet</text>
  <text x="440" y="576" text-anchor="middle" font-size="16" fill="#1f2937">kube-proxy</text>
  <text x="440" y="600" text-anchor="middle" font-size="16" fill="#1f2937">런타임</text>

  <rect x="600" y="496" width="220" height="120" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="710" y="524" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">Node 3</text>
  <text x="710" y="552" text-anchor="middle" font-size="16" fill="#1f2937">kubelet</text>
  <text x="710" y="576" text-anchor="middle" font-size="16" fill="#1f2937">kube-proxy</text>
  <text x="710" y="600" text-anchor="middle" font-size="16" fill="#1f2937">런타임</text>
</svg>
