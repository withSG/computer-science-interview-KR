<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">안티패턴: 읽기와 쓰기를 번갈아 반복</title>
  <desc id="d">읽기와 쓰기를 번갈아 반복하여 매 반복마다 레이아웃 전체 재계산이 발생하는 안티패턴 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="40" font-size="16" font-weight="bold" fill="#1f2933">[안티패턴]</text>

  <!-- Group / Box Background for Layout Recalculation Focus -->
  <rect x="230" y="55" width="220" height="210" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Row 1 -->
  <!-- 읽기 -->
  <rect x="40" y="70" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="94" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">읽기</text>

  <!-- Arrow 1-1 -->
  <path d="M140,90 L240,90" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- [레이아웃 계산] 1 -->
  <rect x="240" y="70" width="200" height="40" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="94" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[레이아웃 계산]</text>

  <!-- Arrow 1-2 -->
  <path d="M440,90 L540,90" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- 쓰기(무효화) 1 -->
  <rect x="540" y="70" width="140" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="610" y="94" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">쓰기(무효화)</text>


  <!-- Row 2 -->
  <!-- 읽기 -->
  <rect x="40" y="140" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="164" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">읽기</text>

  <!-- Arrow 2-1 -->
  <path d="M140,160 L240,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- [레이아웃 계산] 2 -->
  <rect x="240" y="140" width="200" height="40" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="164" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[레이아웃 계산]</text>

  <!-- Arrow 2-2 -->
  <path d="M440,160 L540,160" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- 쓰기(무효화) 2 -->
  <rect x="540" y="140" width="140" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="610" y="164" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">쓰기(무효화)</text>


  <!-- Row 3 -->
  <!-- 읽기 -->
  <rect x="40" y="210" width="100" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="234" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">읽기</text>

  <!-- Arrow 3-1 -->
  <path d="M140,230 L240,230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- [레이아웃 계산] 3 -->
  <rect x="240" y="210" width="200" height="40" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="234" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">[레이아웃 계산]</text>

  <!-- Arrow 3-2 -->
  <path d="M440,230 L540,230" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- 쓰기(무효화) 3 -->
  <rect x="540" y="210" width="140" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="610" y="234" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">쓰기(무효화)</text>


  <!-- Annotation Pointing Upward -->
  <path d="M340,285 L340,252" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <text x="350" y="299" font-size="13" font-weight="bold" fill="#d97706">매 반복마다 전체 재계산</text>
</svg>