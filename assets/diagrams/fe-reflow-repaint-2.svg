<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">레이아웃 스래싱 안티패턴</title>
  <desc id="d">루프 안에서 읽기, 레이아웃 계산, 쓰기(무효화)가 반복마다 되풀이된다. 쓰기가 레이아웃을 무효화하므로 다음 반복의 읽기가 레이아웃을 다시 계산하게 만들어, 매 반복마다 전체 재계산이 일어난다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 머리: 안티패턴 태그와 해당 코드 -->
  <rect x="24" y="20" width="96" height="32" rx="16" fill="#b91c1c"/>
  <text x="72" y="41" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">안티패턴</text>
  <text x="136" y="41" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">card.style.width = container.offsetWidth + 'px';</text>

  <!-- 반복 1 -->
  <text x="24" y="104" font-size="15" font-weight="bold" fill="#374151">반복 1</text>
  <rect x="110" y="72" width="170" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="195" y="94" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">읽기</text>
  <text x="195" y="114" font-size="14" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">offsetWidth</text>
  <path d="M284,98 L326,98" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#m-blue)"/>
  <rect x="330" y="72" width="220" height="52" rx="6" fill="#b91c1c"/>
  <text x="440" y="104" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">레이아웃 계산</text>
  <path d="M554,98 L596,98" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-red)"/>
  <rect x="600" y="72" width="200" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="700" y="94" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">쓰기(무효화)</text>
  <text x="700" y="114" font-size="14" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">style.width</text>
  <path d="M700,128 L700,140 L195,140 L195,152" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>

  <!-- 반복 2 -->
  <text x="24" y="188" font-size="15" font-weight="bold" fill="#374151">반복 2</text>
  <rect x="110" y="156" width="170" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="195" y="178" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">읽기</text>
  <text x="195" y="198" font-size="14" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">offsetWidth</text>
  <path d="M284,182 L326,182" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#m-blue)"/>
  <rect x="330" y="156" width="220" height="52" rx="6" fill="#b91c1c"/>
  <text x="440" y="188" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">레이아웃 계산</text>
  <path d="M554,182 L596,182" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-red)"/>
  <rect x="600" y="156" width="200" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="700" y="178" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">쓰기(무효화)</text>
  <text x="700" y="198" font-size="14" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">style.width</text>
  <path d="M700,212 L700,224 L195,224 L195,236" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>

  <!-- 반복 3 -->
  <text x="24" y="272" font-size="15" font-weight="bold" fill="#374151">반복 3</text>
  <rect x="110" y="240" width="170" height="52" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="195" y="262" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">읽기</text>
  <text x="195" y="282" font-size="14" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">offsetWidth</text>
  <path d="M284,266 L326,266" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#m-blue)"/>
  <rect x="330" y="240" width="220" height="52" rx="6" fill="#b91c1c"/>
  <text x="440" y="272" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">레이아웃 계산</text>
  <path d="M554,266 L596,266" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-red)"/>
  <rect x="600" y="240" width="200" height="52" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="700" y="262" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">쓰기(무효화)</text>
  <text x="700" y="282" font-size="14" fill="#6d28d9" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">style.width</text>

  <text x="24" y="322" font-size="18" font-weight="bold" fill="#374151">…</text>

  <!-- 요점: 레이아웃 열을 가리킴 -->
  <path d="M440,336 L440,298" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-red)"/>
  <text x="440" y="362" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">매 반복마다 전체 재계산</text>
  <text x="440" y="386" font-size="15" fill="#374151" text-anchor="middle">카드가 500개면 레이아웃이 500번</text>
</svg>
