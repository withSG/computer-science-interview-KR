<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">왜 평균이 아니라 백분위인가</title>
  <desc id="d">응답 시간 데이터 모음(100ms 4개, 5000ms 1개)을 바탕으로 평균값의 왜곡과 백분위 지표(p50, p99)의 차이를 설명하는 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Section Title from header -->
  <text x="40" y="38" font-size="16" font-weight="bold" fill="#1f2933">왜 평균이 아니라 백분위인가</text>

  <!-- Raw Data Points Row -->
  <g id="data-points">
    <!-- Normal sample 1 -->
    <rect x="40" y="60" width="120" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="100" y="84" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">100ms</text>

    <!-- Normal sample 2 -->
    <rect x="175" y="60" width="120" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="235" y="84" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">100ms</text>

    <!-- Normal sample 3 -->
    <rect x="310" y="60" width="120" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="370" y="84" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">100ms</text>

    <!-- Normal sample 4 -->
    <rect x="445" y="60" width="120" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
    <text x="505" y="84" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">100ms</text>

    <!-- Outlier sample -->
    <rect x="580" y="60" width="120" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="640" y="84" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">5000ms</text>
  </g>

  <!-- Metrics Breakdown Block -->
  <g id="metrics-group">
    <!-- Row 1: 평균 -->
    <rect x="40" y="130" width="110" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="95" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#d97706">평균</text>
    <text x="175" y="156" font-size="14" font-weight="bold" fill="#1f2933">= 1080ms</text>
    <path d="M260,152 L300,152" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <rect x="315" y="130" width="525" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="330" y="156" font-size="13" fill="#1f2933">"1초 정도 걸리는 API구나"</text>

    <!-- Row 2: p50 -->
    <rect x="40" y="190" width="110" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="95" y="216" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c3aed">p50</text>
    <text x="175" y="216" font-size="14" font-weight="bold" fill="#1f2933">= 100ms</text>
    <path d="M260,212 L300,212" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <rect x="315" y="190" width="525" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="330" y="216" font-size="13" fill="#1f2933">절반의 사용자는 100ms 안에 응답받는다</text>

    <!-- Row 3: p99 -->
    <rect x="40" y="250" width="110" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="95" y="276" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">p99</text>
    <text x="175" y="276" font-size="14" font-weight="bold" fill="#1f2933">≈ 5000ms</text>
    <path d="M260,272 L300,272" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <rect x="315" y="250" width="525" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="330" y="276" font-size="13" fill="#1f2933">최악의 사용자는 5초를 기다린다</text>
  </g>
</svg>