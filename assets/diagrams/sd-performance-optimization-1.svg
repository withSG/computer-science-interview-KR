<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">평균과 백분위 비교</title>
  <desc id="d">응답 시간 100ms 4개와 5000ms 1개를 수직선 위에 찍으면 평균 1080ms는 요청이 하나도 없는 자리에 놓이고, p50은 100ms, p99는 약 5000ms로 실제 사용자가 겪는 시간을 가리킨다.</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 측정값 -->
  <text x="40" y="48" font-size="17" fill="#111827"><tspan font-weight="bold">측정한 응답 시간 5개</tspan><tspan dx="12">100ms, 100ms, 100ms, 100ms, </tspan><tspan font-weight="bold" fill="#b91c1c">5000ms</tspan></text>

  <!-- 지표 표시선 -->
  <text x="113.6" y="100" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">p50</text>
  <line x1="113.6" y1="110" x2="113.6" y2="260" stroke="#6d28d9" stroke-width="2"/>

  <text x="246.9" y="100" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">평균</text>
  <line x1="246.9" y1="110" x2="246.9" y2="260" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="260" y="152" font-size="15" fill="#b45309"><tspan x="260">1080ms 근처에는</tspan><tspan x="260" dy="21">요청이 하나도 없음</tspan></text>

  <text x="780" y="100" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">p99</text>
  <line x1="780" y1="110" x2="780" y2="260" stroke="#b91c1c" stroke-width="2"/>

  <!-- 점: 100ms × 4 -->
  <circle cx="113.6" cy="247" r="9" fill="#374151"/>
  <circle cx="113.6" cy="227" r="9" fill="#374151"/>
  <circle cx="113.6" cy="207" r="9" fill="#374151"/>
  <circle cx="113.6" cy="187" r="9" fill="#374151"/>
  <text x="132" y="222" font-size="15" fill="#374151">100ms × 4</text>

  <!-- 점: 5000ms × 1 -->
  <circle cx="780" cy="247" r="9" fill="#b91c1c"/>
  <text x="762" y="252" font-size="15" fill="#b91c1c" text-anchor="end">5000ms × 1</text>

  <!-- 축 -->
  <line x1="100" y1="260" x2="800" y2="260" stroke="#374151" stroke-width="1.5"/>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="100" y1="260" x2="100" y2="267"/>
    <line x1="236" y1="260" x2="236" y2="267"/>
    <line x1="372" y1="260" x2="372" y2="267"/>
    <line x1="508" y1="260" x2="508" y2="267"/>
    <line x1="644" y1="260" x2="644" y2="267"/>
    <line x1="780" y1="260" x2="780" y2="267"/>
  </g>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="100" y="286">0ms</text>
    <text x="236" y="286">1000ms</text>
    <text x="372" y="286">2000ms</text>
    <text x="508" y="286">3000ms</text>
    <text x="644" y="286">4000ms</text>
    <text x="780" y="286">5000ms</text>
  </g>

  <!-- 해석 -->
  <rect x="40" y="320" width="200" height="44" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="140" y="348" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">평균 = 1080ms</text>
  <line x1="252" y1="342" x2="282" y2="342" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="298" y="348" font-size="16" fill="#111827">"1초 정도 걸리는 API구나"</text>

  <rect x="40" y="376" width="200" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="140" y="404" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">p50 = 100ms</text>
  <line x1="252" y1="398" x2="282" y2="398" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="298" y="404" font-size="16" fill="#111827">절반의 사용자는 100ms 안에 응답받는다</text>

  <rect x="40" y="432" width="200" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="140" y="460" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">p99 ≈ 5000ms</text>
  <line x1="252" y1="454" x2="282" y2="454" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="298" y="460" font-size="16" fill="#111827">최악의 사용자는 5초를 기다린다</text>
</svg>
