<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">데이터 파이프라인 구성 요소</title>
  <desc id="d">수집, 저장, 변환, 적재, 서빙 다섯 단계가 왼쪽에서 오른쪽으로 이어지고 단계마다 대표 기술이 붙는다. 오케스트레이션(Airflow 등)과 관측(로그, 지표, 데이터 품질 알림)은 다섯 단계 전체를 가로지른다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 단계 박스 -->
  <rect x="24" y="24" width="148" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="11" fill="#1d4ed8"/>
  <text x="44" y="49" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="98" y="58" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">수집</text>
  <text x="98" y="84" font-size="15" fill="#374151" text-anchor="middle">Ingest</text>

  <line x1="174" y1="62" x2="193" y2="62" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="195" y="24" width="148" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="215" cy="44" r="11" fill="#1d4ed8"/>
  <text x="215" y="49" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="269" y="58" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">저장</text>
  <text x="269" y="84" font-size="15" fill="#374151" text-anchor="middle">Storage</text>

  <line x1="345" y1="62" x2="364" y2="62" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="366" y="24" width="148" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="386" cy="44" r="11" fill="#1d4ed8"/>
  <text x="386" y="49" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="440" y="58" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">변환</text>
  <text x="440" y="84" font-size="15" fill="#374151" text-anchor="middle">Transform</text>

  <line x1="516" y1="62" x2="535" y2="62" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="537" y="24" width="148" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="557" cy="44" r="11" fill="#1d4ed8"/>
  <text x="557" y="49" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="611" y="58" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">적재</text>
  <text x="611" y="84" font-size="15" fill="#374151" text-anchor="middle">Load</text>

  <line x1="687" y1="62" x2="706" y2="62" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="708" y="24" width="148" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="728" cy="44" r="11" fill="#1d4ed8"/>
  <text x="728" y="49" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="782" y="58" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">서빙</text>
  <text x="782" y="84" font-size="15" fill="#374151" text-anchor="middle">Serving</text>

  <!-- 단계별 대표 기술 -->
  <rect x="24" y="110" width="148" height="126" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <g font-size="15" fill="#1f2937">
    <circle cx="40" cy="135" r="2.5" fill="#6b7280"/>
    <text x="50" y="140">DB 스냅샷</text>
    <circle cx="40" cy="161" r="2.5" fill="#6b7280"/>
    <text x="50" y="166">CDC</text>
    <circle cx="40" cy="187" r="2.5" fill="#6b7280"/>
    <text x="50" y="192">이벤트 스트림</text>
    <circle cx="40" cy="213" r="2.5" fill="#6b7280"/>
    <text x="50" y="218">외부 API</text>
  </g>

  <rect x="195" y="110" width="148" height="126" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <g font-size="15" fill="#1f2937">
    <circle cx="211" cy="135" r="2.5" fill="#6b7280"/>
    <text x="221" y="140">S3 / GCS</text>
    <circle cx="211" cy="161" r="2.5" fill="#6b7280"/>
    <text x="221" y="166">HDFS</text>
    <circle cx="211" cy="187" r="2.5" fill="#6b7280"/>
    <text x="221" y="192">원본 그대로</text>
  </g>

  <rect x="366" y="110" width="148" height="126" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <g font-size="15" fill="#1f2937">
    <circle cx="382" cy="135" r="2.5" fill="#6b7280"/>
    <text x="392" y="140">Spark</text>
    <circle cx="382" cy="161" r="2.5" fill="#6b7280"/>
    <text x="392" y="166">dbt(SQL)</text>
    <circle cx="382" cy="187" r="2.5" fill="#6b7280"/>
    <text x="392" y="192">품질 검증</text>
  </g>

  <rect x="537" y="110" width="148" height="126" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <g font-size="15" fill="#1f2937">
    <circle cx="553" cy="135" r="2.5" fill="#6b7280"/>
    <text x="563" y="140">MERGE /</text>
    <text x="563" y="161">파티션 교체</text>
    <circle cx="553" cy="187" r="2.5" fill="#6b7280"/>
    <text x="563" y="192">집계 테이블</text>
  </g>

  <rect x="708" y="110" width="148" height="126" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <g font-size="15" fill="#1f2937">
    <circle cx="724" cy="135" r="2.5" fill="#6b7280"/>
    <text x="734" y="140">BI 대시보드</text>
    <circle cx="724" cy="161" r="2.5" fill="#6b7280"/>
    <text x="734" y="166">ML 피처</text>
    <circle cx="724" cy="187" r="2.5" fill="#6b7280"/>
    <text x="734" y="192">역방향 동기화</text>
    <text x="734" y="213">(Reverse ETL)</text>
  </g>

  <!-- 전 단계를 가로지르는 축 -->
  <text x="24" y="272" font-size="15" fill="#4b5563">전 단계를 가로지르는 축</text>

  <rect x="24" y="284" width="832" height="48" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="440" y="314" font-size="17" font-weight="bold" fill="#5b21b6" text-anchor="middle">오케스트레이션 (Airflow 등)</text>

  <rect x="24" y="344" width="832" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="374" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">관측: 로그 / 지표 / 데이터 품질 알림</text>
</svg>
