<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">NACL과 Security Group 두 겹 방화벽</title>
  <desc id="d">인터넷 트래픽이 Subnet 경계 안에서 1차로 NACL(Stateless, 서브넷 단위, 인바운드·아웃바운드 규칙을 각각 따로 평가)을, 2차로 Security Group(Stateful, ENI, 허용된 요청의 응답은 자동 통과)을 거쳐 EC2 인스턴스에 닿는 구조.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 인터넷 -->
  <rect x="370" y="24" width="140" height="44" rx="22" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="52" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">인터넷</text>

  <!-- Subnet 경계 -->
  <rect x="64" y="96" width="752" height="480" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="88" y="126" font-size="16" font-weight="bold" fill="#374151">Subnet 경계</text>
  <line x1="440" y1="68" x2="440" y2="146" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 1. NACL -->
  <rect x="120" y="150" width="640" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="156" cy="178" r="14" fill="#b45309"/>
  <text x="156" y="184" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="182" y="185" font-size="20" font-weight="bold" fill="#92400e">NACL</text>
  <rect x="520" y="164" width="100" height="28" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="570" y="183" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">Stateless</text>
  <rect x="632" y="164" width="104" height="28" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="684" y="183" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">서브넷 단위</text>
  <rect x="160" y="206" width="260" height="46" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="290" y="235" font-size="16" fill="#1f2937" text-anchor="middle">인바운드 규칙</text>
  <rect x="460" y="206" width="260" height="46" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="590" y="235" font-size="16" fill="#1f2937" text-anchor="middle">아웃바운드 규칙</text>
  <text x="440" y="283" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">각각 따로 평가</text>

  <line x1="440" y1="300" x2="440" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2. Security Group -->
  <rect x="120" y="340" width="640" height="124" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="156" cy="368" r="14" fill="#1d4ed8"/>
  <text x="156" y="374" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="182" y="375" font-size="20" font-weight="bold" fill="#1e3a8a">Security Group</text>
  <rect x="520" y="354" width="100" height="28" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="570" y="373" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">Stateful</text>
  <rect x="632" y="354" width="104" height="28" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="684" y="373" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">ENI</text>
  <rect x="160" y="398" width="560" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="440" y="427" font-size="16" fill="#1f2937" text-anchor="middle">허용된 요청의 응답은 자동 통과</text>

  <line x1="440" y1="464" x2="440" y2="500" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- EC2 -->
  <rect x="330" y="504" width="220" height="48" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="534" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">EC2 인스턴스</text>
</svg>
