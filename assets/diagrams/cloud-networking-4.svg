<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Security Group과 NACL</title>
  <desc id="d">인터넷에서 Subnet 경계를 지나 NACL, Security Group을 거쳐 EC2 인스턴스로 연결되는 구조도</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 인터넷 (최상단) -->
  <rect x="370" y="24" width="140" height="40" rx="20" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="49" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">인터넷</text>

  <!-- 인터넷 -> Subnet 경계 화살표 -->
  <path d="M440,64 L440,92" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Subnet 경계 (큰 영역) -->
  <rect x="190" y="94" width="500" height="376" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="210" y="122" font-size="14" fill="#52606d" font-weight="bold">Subnet 경계</text>

  <!-- NACL 영역 -->
  <rect x="230" y="140" width="420" height="96" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="166" font-size="14" fill="#059669" font-weight="bold" text-anchor="middle">NACL (Stateless, 서브넷 단위)</text>
  <text x="440" y="190" font-size="13" fill="#1f2933" text-anchor="middle">인바운드 규칙 / 아웃바운드 규칙</text>
  <text x="440" y="214" font-size="13" fill="#1f2933" text-anchor="middle">각각 따로 평가</text>

  <!-- NACL -> Security Group 화살표 -->
  <path d="M440,236 L440,262" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Security Group 영역 -->
  <rect x="230" y="264" width="420" height="76" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="290" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="middle">Security Group (Stateful, ENI)</text>
  <text x="440" y="316" font-size="13" fill="#1f2933" text-anchor="middle">허용된 요청의 응답은 자동 통과</text>

  <!-- Security Group -> EC2 인스턴스 화살표 -->
  <path d="M440,340 L440,366" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- EC2 인스턴스 -->
  <rect x="330" y="368" width="220" height="46" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="396" font-size="14" fill="#7c3aed" font-weight="bold" text-anchor="middle">[ EC2 인스턴스 ]</text>
</svg>