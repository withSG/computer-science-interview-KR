<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">람다 아키텍처 흐름</title>
  <desc id="d">소스 데이터가 배치 레이어(정확, 느림)와 스피드 레이어(실시간) 두 경로로 갈라졌다가 서빙 레이어에서 합쳐져 조회된다. 장점은 정확성과 실시간을 모두 얻는 것, 단점은 배치/스트리밍 두 코드베이스를 유지해야 해 복잡하다는 것이다.</desc>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- 연결선 -->
  <path d="M154,116 H190 V68 H222" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M154,116 H190 V164 H222" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <path d="M476,68 H503 V116 H526" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M476,164 H503 V116 H526" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <line x1="690" y1="116" x2="742" y2="116" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 소스 데이터 -->
  <rect x="24" y="92" width="130" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="89" y="122" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">소스 데이터</text>

  <!-- 배치 레이어 -->
  <rect x="226" y="36" width="250" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="351" y="63" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">배치 레이어</text>
  <text x="351" y="86" font-size="15" fill="#1e40af" text-anchor="middle">(정확, 느림)</text>

  <!-- 스피드 레이어 -->
  <rect x="226" y="132" width="250" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="351" y="159" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">스피드 레이어</text>
  <text x="351" y="182" font-size="15" fill="#5b21b6" text-anchor="middle">(실시간)</text>

  <!-- 서빙 레이어 -->
  <rect x="530" y="92" width="160" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="610" y="122" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">서빙 레이어</text>

  <!-- 조회 -->
  <rect x="746" y="92" width="110" height="48" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="801" y="122" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">조회</text>

  <!-- 장단점 -->
  <rect x="24" y="232" width="408" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="44" y="268" font-size="16" font-weight="bold" fill="#047857">장점</text>
  <text x="96" y="268" font-size="16" fill="#1f2937">정확성 + 실시간 모두</text>

  <rect x="448" y="232" width="408" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="468" y="268" font-size="16" font-weight="bold" fill="#b91c1c">단점</text>
  <text x="520" y="268" font-size="16" fill="#1f2937">배치/스트리밍 두 코드베이스 유지 (복잡)</text>
</svg>
