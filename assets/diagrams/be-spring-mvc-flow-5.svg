<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">HandlerMapping과 HandlerAdapter의 짝</title>
  <desc id="d">HandlerMapping은 누가 처리할지 찾고, HandlerAdapter는 그 핸들러를 실행하는 법을 압니다. RequestMappingHandlerMapping이 찾은 @GetMapping 메서드는 RequestMappingHandlerAdapter가 파라미터 바인딩과 리플렉션으로 호출하고, SimpleUrlHandlerMapping이 찾은 정적 리소스 핸들러는 HttpRequestHandlerAdapter가 스트림에 파일을 바로 씁니다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>

  <!-- column headers -->
  <text x="208" y="54" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HandlerMapping</text>
  <text x="208" y="82" font-size="16" fill="#374151" text-anchor="middle">"누가 처리할지 찾는다"</text>
  <path d="M24,100 H392" stroke="#1d4ed8" stroke-width="3" fill="none"/>

  <text x="672" y="54" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HandlerAdapter</text>
  <text x="672" y="82" font-size="16" fill="#374151" text-anchor="middle">"그 핸들러를 실행하는 법을 안다"</text>
  <path d="M488,100 H856" stroke="#047857" stroke-width="3" fill="none"/>

  <!-- pair 1: @Controller methods -->
  <rect x="24" y="122" width="368" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="208" y="153" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RequestMappingHandlerMapping</text>
  <text x="208" y="180" font-size="15" fill="#374151" text-anchor="middle">@GetMapping 메서드</text>
  <path d="M398,160 H480" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <rect x="488" y="122" width="368" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="672" y="153" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RequestMappingHandlerAdapter</text>
  <text x="672" y="180" font-size="15" fill="#374151" text-anchor="middle">파라미터 바인딩 + 리플렉션 호출</text>

  <!-- pair 2: static resources -->
  <rect x="24" y="222" width="368" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="208" y="253" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SimpleUrlHandlerMapping</text>
  <text x="208" y="280" font-size="15" fill="#374151" text-anchor="middle">정적 리소스 핸들러</text>
  <path d="M398,260 H480" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <rect x="488" y="222" width="368" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="672" y="253" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">HttpRequestHandlerAdapter</text>
  <text x="672" y="280" font-size="15" fill="#374151" text-anchor="middle">스트림에 파일을 바로 쓴다</text>
</svg>
