<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실행 컨텍스트의 구성 요소</title>
  <desc id="d">Execution Context 내부의 LexicalEnvironment, VariableEnvironment, this 바인딩의 구조와 세부 요소</desc>
  <rect width="880" height="570" fill="#ffffff"/>

  <!-- Outer Container: Execution Context -->
  <rect x="40" y="30" width="800" height="510" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  <text x="440" y="65" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Execution Context</text>

  <!-- 1. LexicalEnvironment Container -->
  <rect x="70" y="90" width="740" height="230" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="122" font-size="14" font-weight="bold" fill="#2563eb">LexicalEnvironment (렉시컬 환경)</text>

  <!-- 1-1. Environment Record -->
  <rect x="95" y="140" width="690" height="70" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="115" y="169" font-size="13" font-weight="bold" fill="#1f2933">Environment Record (환경 레코드)</text>
  <text x="115" y="194" font-size="11.5" fill="#52606d">식별자 ─ 값 매핑 (let/const, 매개변수)</text>

  <!-- 1-2. Outer Reference -->
  <rect x="95" y="230" width="690" height="70" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="115" y="259" font-size="13" font-weight="bold" fill="#1f2933">Outer Reference (외부 렉시컬 환경 참조)</text>
  <text x="115" y="284" font-size="11.5" fill="#52606d">→ 상위 스코프를 가리키는 화살표</text>

  <!-- 2. VariableEnvironment Container -->
  <rect x="70" y="340" width="740" height="90" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="95" y="374" font-size="14" font-weight="bold" fill="#059669">VariableEnvironment (변수 환경)</text>
  <text x="115" y="404" font-size="11.5" fill="#52606d">var 선언, 함수 선언문 보관</text>

  <!-- 3. this Binding Container -->
  <rect x="70" y="450" width="740" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="95" y="485" font-size="14" font-weight="bold" fill="#7c3aed">this 바인딩</text>
</svg>