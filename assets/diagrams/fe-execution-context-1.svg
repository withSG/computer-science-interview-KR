<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실행 컨텍스트의 세 구성 요소</title>
  <desc id="d">Execution Context 안에 LexicalEnvironment(환경 레코드와 외부 렉시컬 환경 참조), VariableEnvironment(var 선언, 함수 선언문 보관), this 바인딩이 들어 있는 구조.</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- Execution Context 바깥 틀 -->
  <rect x="24" y="24" width="832" height="472" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="48" y="62"><tspan font-size="20" font-weight="bold" fill="#0f172a">Execution Context</tspan><tspan dx="12" font-size="16" fill="#4b5563">실행 컨텍스트</tspan></text>

  <!-- ① LexicalEnvironment -->
  <rect x="48" y="84" width="784" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="118"><tspan font-size="18" font-weight="bold" fill="#1d4ed8">① LexicalEnvironment</tspan><tspan dx="10" font-size="16" fill="#1e3a8a">(렉시컬 환경)</tspan></text>

  <rect x="72" y="136" width="330" height="128" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="92" y="168" font-size="17" font-weight="bold" fill="#0f172a">Environment Record</text>
  <text x="92" y="192" font-size="16" fill="#374151">환경 레코드</text>
  <text x="92" y="226" font-size="16" fill="#111827">식별자 ─ 값 매핑</text>
  <text x="92" y="250" font-size="16" fill="#374151">(let/const, 매개변수)</text>

  <text x="440" y="210" font-size="28" font-weight="bold" fill="#1d4ed8" text-anchor="middle">+</text>

  <rect x="478" y="136" width="330" height="128" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="498" y="168" font-size="17" font-weight="bold" fill="#0f172a">Outer Reference</text>
  <text x="498" y="192" font-size="16" fill="#374151">외부 렉시컬 환경 참조</text>
  <text x="498" y="226" font-size="16" fill="#111827">→ 상위 스코프를 가리키는 화살표</text>

  <!-- ② VariableEnvironment -->
  <rect x="48" y="304" width="784" height="96" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="72" y="340"><tspan font-size="18" font-weight="bold" fill="#047857">② VariableEnvironment</tspan><tspan dx="10" font-size="16" fill="#065f46">(변수 환경)</tspan></text>
  <text x="72" y="374" font-size="16" fill="#1f2937">var 선언, 함수 선언문 보관</text>

  <!-- ③ this 바인딩 -->
  <rect x="48" y="420" width="784" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="72" y="454" font-size="18" font-weight="bold" fill="#6d28d9">③ this 바인딩</text>
</svg>
