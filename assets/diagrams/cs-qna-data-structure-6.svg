<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BST 구조와 중위 순회</title>
  <desc id="d">8을 루트로 왼쪽 서브트리(3, 1, 6)에는 8보다 작은 값, 오른쪽 서브트리(10, 14)에는 8보다 큰 값이 있는 이진 탐색 트리와, 중위 순회하면 1, 3, 6, 8, 10, 14처럼 정렬된 순서로 나오는 것을 보여준다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#ffffff"/>

  <!-- 서브트리 영역 -->
  <rect x="150" y="112" width="280" height="200" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="550" y="112" width="180" height="200" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="290" y="278" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">왼쪽 서브트리</text>
  <text x="290" y="299" font-size="15" fill="#1d4ed8" text-anchor="middle">8보다 작은 값</text>
  <text x="640" y="278" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">오른쪽 서브트리</text>
  <text x="640" y="299" font-size="15" fill="#b45309" text-anchor="middle">8보다 큰 값</text>

  <!-- 간선 -->
  <g stroke="#4b5563" stroke-width="2">
    <line x1="490" y1="72" x2="290" y2="148"/>
    <line x1="490" y1="72" x2="590" y2="148"/>
    <line x1="290" y1="148" x2="190" y2="224"/>
    <line x1="290" y1="148" x2="390" y2="224"/>
    <line x1="590" y1="148" x2="690" y2="224"/>
  </g>

  <!-- 노드 -->
  <circle cx="490" cy="72" r="24" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <g fill="#ffffff" stroke-width="2">
    <circle cx="290" cy="148" r="24" stroke="#1d4ed8"/>
    <circle cx="190" cy="224" r="24" stroke="#1d4ed8"/>
    <circle cx="390" cy="224" r="24" stroke="#1d4ed8"/>
    <circle cx="590" cy="148" r="24" stroke="#b45309"/>
    <circle cx="690" cy="224" r="24" stroke="#b45309"/>
  </g>
  <g font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="490" y="79">8</text>
    <text x="290" y="155">3</text>
    <text x="190" y="231">1</text>
    <text x="390" y="231">6</text>
    <text x="590" y="155">10</text>
    <text x="690" y="231">14</text>
  </g>

  <!-- 중위 순회 결과 -->
  <text x="40" y="372" font-size="16" font-weight="bold" fill="#111827">중위 순회</text>
  <g stroke-width="1.5">
    <rect x="162" y="346" width="56" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="262" y="346" width="56" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="362" y="346" width="56" height="40" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="462" y="346" width="56" height="40" rx="8" fill="#f3f4f6" stroke="#111827"/>
    <rect x="562" y="346" width="56" height="40" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="662" y="346" width="56" height="40" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="223" y1="366" x2="256" y2="366"/>
    <line x1="323" y1="366" x2="356" y2="366"/>
    <line x1="423" y1="366" x2="456" y2="366"/>
    <line x1="523" y1="366" x2="556" y2="366"/>
    <line x1="623" y1="366" x2="656" y2="366"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="190" y="372">1</text>
    <text x="290" y="372">3</text>
    <text x="390" y="372">6</text>
    <text x="490" y="372">8</text>
    <text x="590" y="372">10</text>
    <text x="690" y="372">14</text>
  </g>
  <text x="740" y="372" font-size="15" font-weight="bold" fill="#047857">정렬된 순서</text>
</svg>
