<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">VM과 컨테이너 구조</title>
  <desc id="d">VM은 앱마다 Bins/Libs와 Guest OS를 따로 싣고 Hypervisor와 Hardware 위에서 실행된다. Container는 앱이 Container Engine 위에서 실행되며 하나의 Host OS 커널을 공유한다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 가운데 구분선 -->
  <line x1="440" y1="28" x2="440" y2="422" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===== VM ===== -->
  <text x="230" y="50" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">VM</text>

  <!-- VM 1 : App A / Bins/Libs / Guest OS -->
  <rect x="60" y="84" width="160" height="46" fill="#ede9fe"/>
  <rect x="60" y="130" width="160" height="46" fill="#f9fafb"/>
  <rect x="60" y="176" width="160" height="46" fill="#fef3c7"/>
  <line x1="60" y1="130" x2="220" y2="130" stroke="#9ca3af" stroke-width="1"/>
  <line x1="60" y1="176" x2="220" y2="176" stroke="#9ca3af" stroke-width="1"/>
  <rect x="60" y="84" width="160" height="138" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="140" y="113" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">App A</text>
  <text x="140" y="159" font-size="16" fill="#111827" text-anchor="middle">Bins/Libs</text>
  <text x="140" y="205" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">Guest OS</text>

  <!-- VM 2 : App B / Bins/Libs / Guest OS -->
  <rect x="240" y="84" width="160" height="46" fill="#ede9fe"/>
  <rect x="240" y="130" width="160" height="46" fill="#f9fafb"/>
  <rect x="240" y="176" width="160" height="46" fill="#fef3c7"/>
  <line x1="240" y1="130" x2="400" y2="130" stroke="#9ca3af" stroke-width="1"/>
  <line x1="240" y1="176" x2="400" y2="176" stroke="#9ca3af" stroke-width="1"/>
  <rect x="240" y="84" width="160" height="138" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="320" y="113" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">App B</text>
  <text x="320" y="159" font-size="16" fill="#111827" text-anchor="middle">Bins/Libs</text>
  <text x="320" y="205" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">Guest OS</text>

  <!-- Hypervisor -->
  <rect x="60" y="238" width="340" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="230" y="268" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hypervisor</text>

  <!-- Hardware -->
  <rect x="60" y="298" width="340" height="48" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="230" y="328" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- VM 요약 -->
  <text x="230" y="386" font-size="16" fill="#111827" text-anchor="middle">OS: 각 VM마다 <tspan font-weight="bold" fill="#92400e">Guest OS</tspan></text>
  <text x="230" y="412" font-size="16" fill="#111827" text-anchor="middle">격리: 강한 격리 (하이퍼바이저 경계)</text>

  <!-- ===== Container ===== -->
  <text x="650" y="50" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Container</text>

  <!-- App A / App B -->
  <rect x="480" y="118" width="160" height="46" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="560" y="147" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">App A</text>
  <rect x="660" y="118" width="160" height="46" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="740" y="147" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">App B</text>

  <!-- Container Engine -->
  <rect x="480" y="176" width="340" height="46" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="650" y="205" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Container Engine</text>

  <!-- Host OS (공유) -->
  <rect x="480" y="238" width="340" height="48" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="650" y="268" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">Host OS</text>

  <!-- Hardware -->
  <rect x="480" y="298" width="340" height="48" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="650" y="328" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- Container 요약 -->
  <text x="650" y="386" font-size="16" fill="#111827" text-anchor="middle">OS: <tspan font-weight="bold" fill="#92400e">Host OS</tspan> 커널 공유</text>
  <text x="650" y="412" font-size="16" fill="#111827" text-anchor="middle">격리: 프로세스 격리</text>
</svg>
