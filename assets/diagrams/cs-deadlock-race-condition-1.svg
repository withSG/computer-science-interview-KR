<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 count++ 가 안전하지 않은가</title>
  <desc id="d">count++ 의 3단계 동작 원리와 두 스레드(T1, T2)가 동시에 실행될 때 발생하는 갱신 유실(lost update) 과정을 보여주는 타임라인 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Section 1: count++ 의 실제 동작 -->
  <rect x="24" y="24" width="832" height="180" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="44" y="55" font-size="16" font-weight="bold" fill="#1f2933">count++ 의 실제 동작</text>

  <!-- Step 1 -->
  <rect x="44" y="74" width="256" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="56" y="86" width="60" height="22" rx="4" fill="#2563eb"/>
  <text x="86" y="101" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. LOAD</text>
  <text x="56" y="132" font-size="13" fill="#1f2933">count 값을 메모리에서</text>
  <text x="56" y="152" font-size="13" fill="#1f2933">레지스터로 읽는다</text>

  <!-- Step 2 -->
  <rect x="312" y="74" width="256" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="324" y="86" width="54" height="22" rx="4" fill="#2563eb"/>
  <text x="351" y="101" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. ADD</text>
  <text x="324" y="132" font-size="13" fill="#1f2933">레지스터 값에 1을</text>
  <text x="324" y="152" font-size="13" fill="#1f2933">더한다</text>

  <!-- Step 3 -->
  <rect x="580" y="74" width="264" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="592" y="86" width="68" height="22" rx="4" fill="#2563eb"/>
  <text x="626" y="101" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. STORE</text>
  <text x="592" y="132" font-size="13" fill="#1f2933">결과를 메모리에 다시</text>
  <text x="592" y="152" font-size="13" fill="#1f2933">쓴다</text>

  <!-- Section 2: 두 스레드 동시 실행 시나리오 -->
  <rect x="24" y="224" width="832" height="292" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="44" y="255" font-size="16" font-weight="bold" fill="#1f2933">count = 0 인 상태에서 두 스레드가 끼어들면</text>

  <!-- Timeline Axis -->
  <text x="44" y="295" font-size="13" font-weight="bold" fill="#52606d">시간 →</text>
  <path d="M100,291 L836,291" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-ink)"/>

  <!-- Thread Labels -->
  <text x="44" y="339" font-size="14" font-weight="bold" fill="#2563eb">T1:</text>
  <text x="44" y="399" font-size="14" font-weight="bold" fill="#7c3aed">T2:</text>

  <!-- T1 Steps -->
  <!-- T1: LOAD(0) -->
  <rect x="100" y="318" width="110" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="155" y="340" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">LOAD(0)</text>

  <!-- T1: ADD(1) -->
  <rect x="340" y="318" width="100" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="340" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">ADD(1)</text>

  <!-- T1: STORE(1) -->
  <rect x="580" y="318" width="110" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="635" y="340" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">STORE(1)</text>

  <!-- T2 Steps -->
  <!-- T2: LOAD(0) -->
  <rect x="220" y="378" width="110" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="275" y="400" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">LOAD(0)</text>

  <!-- T2: ADD(1) -->
  <rect x="460" y="378" width="100" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="510" y="400" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">ADD(1)</text>

  <!-- T2: STORE(1) -->
  <rect x="700" y="378" width="110" height="34" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="755" y="400" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">STORE(1)</text>

  <!-- Error Connection Line & Label -->
  <!-- Vertical line from T2 STORE(1) pointing down to result label line -->
  <path d="M755,412 L755,475 L560,475" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Result Box / Label -->
  <rect x="44" y="456" font-size="14" width="500" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="480" font-size="14" font-weight="bold" fill="#dc2626">최종 count = 1</text>
  <text x="165" y="480" font-size="13" fill="#52606d">← 두 번 증가시켰는데 1만 늘었다</text>
</svg>