<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">직접 연결(N×M) vs 이벤트 로그 중심(N+M) 결합도 비교</title>
  <desc id="d">생산자와 소비자 간의 직접 연결 방식과 카프카 토픽 기반 이벤트 로그 중심 연결 방식의 결합도 및 확장성 차이를 나타낸 다이어그램입니다.</desc>

  <!-- 배경 흰색 -->
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커: 본문/일반 -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- 화살표 마커: 보더/회색 -->
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/>
    </marker>
    <!-- 화살표 마커: 강조 주황 -->
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <!-- 화살표 마커: 강조 파랑 -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 메인 전체 제목 -->
  <text x="440" y="35" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">직접 연결(N×M) vs 이벤트 로그 중심(N+M) 결합도 비교</text>

  <!-- 영역 구분 카드 (좌: 직접 연결, 우: 이벤트 로그 중심) -->
  <rect x="20" y="50" width="410" height="420" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="8"/>
  <rect x="450" y="50" width="410" height="420" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" rx="8"/>

  <!-- 구역 제목: 왼쪽 -->
  <text x="225" y="80" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">직접 연결 (N × M 복잡도)</text>
  <text x="225" y="98" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">생산자 3개 × 소비자 5개 = 연결선 15개</text>

  <!-- 구역 제목: 오른쪽 -->
  <text x="655" y="80" font-size="14" font-weight="600" fill="#059669" text-anchor="middle">이벤트 로그 중심 (N + M 복잡도)</text>
  <text x="655" y="98" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">생산자 3개 + 소비자 5개 = 연결선 8개</text>

  <!-- ==================== [왼쪽 다이어그램: 직접 연결] ==================== -->
  
  <!-- 생산자 (왼쪽 섹션) -->
  <!-- 주문 -->
  <rect x="40" y="130" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="80" y="152" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">주문</text>
  
  <!-- 결제 -->
  <rect x="40" y="240" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="80" y="262" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">결제</text>
  
  <!-- 가입 -->
  <rect x="40" y="350" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="80" y="372" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">가입</text>

  <!-- 소비자 (왼쪽 섹션) -->
  <!-- 재고 -->
  <rect x="330" y="110" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="370" y="132" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">재고</text>
  
  <!-- 배송 -->
  <rect x="330" y="170" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="370" y="192" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">배송</text>

  <!-- 알림 -->
  <rect x="330" y="230" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="370" y="252" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">알림</text>

  <!-- 분석 -->
  <rect x="330" y="290" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="370" y="312" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">분석</text>

  <!-- 추천 (신규 소비자 - 강한 강조) -->
  <rect x="330" y="370" width="80" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="4"/>
  <text x="370" y="392" font-size="13" font-weight="600" fill="#d97706" text-anchor="middle">추천 (신규)</text>

  <!-- 복잡한 교차 연결선 (직접 연결 15개) -->
  <!-- 기존 소비자 연결선 (회색) -->
  <path d="M120,148 L330,128" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,148 L330,188" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,148 L330,248" stroke="#9aa5b1" stroke-width="1" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,148 L330,308" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-gray)"/>

  <path d="M120,258 L330,128" stroke="#9aa5b1" stroke-width="1" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,258 L330,188" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,258 L330,248" stroke="#9aa5b1" stroke-width="1" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,258 L330,308" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-gray)"/>

  <path d="M120,368 L330,128" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,368 L330,188" stroke="#9aa5b1" stroke-width="1" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,368 L330,248" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-gray)"/>
  <path d="M120,368 L330,308" stroke="#9aa5b1" stroke-width="1" fill="none" marker-end="url(#a-gray)"/>

  <!-- 신규 소비자(추천) 추가로 인해 변경해야 하는 생산자 연결선 3개 (주황 강조) -->
  <path d="M120,148 L330,388" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
  <path d="M120,258 L330,388" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>
  <path d="M120,368 L330,388" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- 왼쪽 하단 경고 박스 -->
  <rect x="40" y="420" width="370" height="36" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="4"/>
  <text x="225" y="442" font-size="11.5" font-weight="500" fill="#dc2626" text-anchor="middle">새 소비자 추가 시 모든 생산자 코드 수정 필요 (강한 결합)</text>


  <!-- ==================== [오른쪽 다이어그램: 이벤트 로그 중심] ==================== -->

  <!-- 생산자 (오른쪽 섹션) -->
  <!-- 주문 -->
  <rect x="470" y="130" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="510" y="152" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">주문</text>
  
  <!-- 결제 -->
  <rect x="470" y="240" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="510" y="262" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">결제</text>
  
  <!-- 가입 -->
  <rect x="470" y="350" width="80" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="510" y="372" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">가입</text>

  <!-- 중앙: Kafka 토픽 로그 -->
  <rect x="600" y="120" width="110" height="280" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="655" y="145" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">Kafka 토픽들</text>
  
  <!-- 토픽 내 이벤트 로그 디스크 박스 표현 -->
  <rect x="615" y="165" width="80" height="26" fill="#ffffff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="655" y="182" font-size="11.5" font-weight="400" fill="#7c3aed" text-anchor="middle">주문 이벤트</text>

  <rect x="615" y="200" width="80" height="26" fill="#ffffff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="655" y="217" font-size="11.5" font-weight="400" fill="#7c3aed" text-anchor="middle">결제 이벤트</text>

  <rect x="615" y="235" width="80" height="26" fill="#ffffff" stroke="#7c3aed" stroke-width="1" rx="3"/>
  <text x="655" y="252" font-size="11.5" font-weight="400" fill="#7c3aed" text-anchor="middle">가입 이벤트</text>

  <rect x="615" y="275" width="80" height="115" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="3 3" rx="3"/>
  <text x="655" y="330" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">보존 기간 유지</text>
  <text x="655" y="348" font-size="11" font-weight="400" fill="#52606d" text-anchor="middle">(재처리 가능)</text>

  <!-- 소비자 (오른쪽 섹션) -->
  <!-- 재고 -->
  <rect x="760" y="110" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="800" y="132" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">재고</text>
  
  <!-- 배송 -->
  <rect x="760" y="170" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="800" y="192" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">배송</text>

  <!-- 알림 -->
  <rect x="760" y="230" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="800" y="252" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">알림</text>

  <!-- 분석 -->
  <rect x="760" y="290" width="80" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="4"/>
  <text x="800" y="312" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">분석</text>

  <!-- 추천 (신규 소비자) -->
  <rect x="760" y="370" width="80" height="36" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="4"/>
  <text x="800" y="392" font-size="13" font-weight="600" fill="#d97706" text-anchor="middle">추천 (신규)</text>

  <!-- 오른쪽 깔끔한 3+5 연결선 -->
  <!-- 생산자 -> Kafka (3개) -->
  <path d="M550,148 L600,178" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M550,258 L600,213" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M550,368 L600,248" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Kafka -> 소비자 (기존 4개) -->
  <path d="M710,180 L760,128" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M710,200 L760,188" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M710,230 L760,248" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M710,250 L760,308" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Kafka -> 신규 소비자(추천) 구독 연결선 1개만 추가 (주황 강조) -->
  <path d="M710,270 L760,388" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- 오른쪽 하단 안내 박스 -->
  <rect x="470" y="420" width="370" height="36" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="4"/>
  <text x="655" y="442" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">생산자 코드 변경 없이 토픽만 구독해 즉시 확장 (느슨한 결합)</text>

  <!-- 하단 캡션 결론 -->
  <text x="440" y="498" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">결론: Kafka 토픽을 중간에 두면 생산자와 소비자가 서로를 몰라도 되므로 시스템 변경 및 장애 전파가 차단된다.</text>
</svg>