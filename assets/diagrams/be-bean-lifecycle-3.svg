<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">기대한 동작과 실제 동작</title>
  <desc id="d">singleton에 prototype을 주입했을 때, 기대한 동작은 요청A, B, C가 각각 cart #1, #2, #3을 받는 것이지만 실제로는 세 요청 모두 같은 cart #1 객체를 씁니다.</desc>
  <rect width="880" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 기대한 동작 -->
  <rect x="24" y="24" width="404" height="252" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="226" y="60" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle">기대한 동작</text>

  <rect x="56" y="90" width="100" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="106" y="116" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">요청A</text>
  <line x1="160" y1="110" x2="270" y2="110" stroke="#047857" stroke-width="2" marker-end="url(#ok)"/>
  <rect x="276" y="90" width="120" height="40" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="336" y="116" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">cart #1</text>

  <rect x="56" y="150" width="100" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="106" y="176" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">요청B</text>
  <line x1="160" y1="170" x2="270" y2="170" stroke="#047857" stroke-width="2" marker-end="url(#ok)"/>
  <rect x="276" y="150" width="120" height="40" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="336" y="176" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">cart #2</text>

  <rect x="56" y="210" width="100" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="106" y="236" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">요청C</text>
  <line x1="160" y1="230" x2="270" y2="230" stroke="#047857" stroke-width="2" marker-end="url(#ok)"/>
  <rect x="276" y="210" width="120" height="40" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
  <text x="336" y="236" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">cart #3</text>

  <!-- 실제 동작 -->
  <rect x="452" y="24" width="404" height="252" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="654" y="60" font-size="19" font-weight="bold" fill="#b91c1c" text-anchor="middle">실제 동작</text>

  <rect x="484" y="90" width="100" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="534" y="116" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">요청A</text>
  <rect x="484" y="150" width="100" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="534" y="176" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">요청B</text>
  <rect x="484" y="210" width="100" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="534" y="236" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">요청C</text>

  <path d="M588,110 H624 Q634,110 634,120 V160 Q634,170 644,170 M588,230 H624 Q634,230 634,220 V180 Q634,170 644,170" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <line x1="588" y1="170" x2="676" y2="170" stroke="#b91c1c" stroke-width="2" marker-end="url(#bad)"/>

  <rect x="682" y="146" width="150" height="48" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="757" y="176" font-size="18" font-weight="bold" fill="#991b1b" text-anchor="middle">cart #1</text>
  <text x="757" y="222" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">(전부 같은 객체)</text>
</svg>
