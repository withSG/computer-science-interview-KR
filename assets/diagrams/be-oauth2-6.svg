<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">실무에서의 소셜 로그인 순서도</title>
  <desc id="d">실무 소셜 로그인 시 수행하는 5단계 처리 과정</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g>
    <rect x="100" y="30" width="680" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="135" cy="62" r="14" fill="#2563eb"/>
    <text x="135" y="67" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="165" y="66" font-size="13" font-weight="bold" fill="#1f2933">사용자를 공급자 인가 화면으로 보낸다</text>
    <text x="415" y="66" font-size="13" fill="#52606d">(state, nonce, PKCE 포함)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,94 L440,124" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 -->
  <g>
    <rect x="100" y="124" width="680" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="135" cy="156" r="14" fill="#2563eb"/>
    <text x="135" y="161" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="165" y="160" font-size="13" font-weight="bold" fill="#1f2933">콜백에서 state 검증</text>
    <path d="M315,156 L345,156" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
    <text x="360" y="160" font-size="13" font-weight="bold" fill="#1f2933">code를 토큰으로 교환</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,188 L440,218" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3 -->
  <g>
    <rect x="100" y="218" width="680" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="135" cy="250" r="14" fill="#2563eb"/>
    <text x="135" y="255" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="165" y="254" font-size="13" fill="#1f2933">id_token의 서명 / iss / aud / exp / nonce 검증</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,282 L440,312" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4 -->
  <g>
    <rect x="100" y="312" width="680" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="135" cy="344" r="14" fill="#2563eb"/>
    <text x="135" y="349" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="165" y="348" font-size="13" fill="#1f2933">(iss, sub)로 우리 DB에서 사용자를 찾거나 새로 만든다</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,376 L440,406" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 5 (Important Highlight) -->
  <g>
    <rect x="100" y="406" width="680" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="135" cy="443" r="14" fill="#7c3aed"/>
    <text x="135" y="448" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="165" y="438" font-size="13" font-weight="bold" fill="#7c3aed">여기서부터는 우리 서비스의 인증 체계로</text>
    <text x="165" y="458" font-size="12" fill="#52606d">(세션 쿠키 또는 우리가 서명한 JWT)</text>
  </g>
</svg>