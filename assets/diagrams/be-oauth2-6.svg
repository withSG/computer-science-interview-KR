<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">소셜 로그인 처리 5단계</title>
  <desc id="d">우리 서비스는 사용자를 공급자 인가 화면으로 보내고, 콜백에서 state를 검증한 뒤 code를 토큰으로 교환하고, id_token을 검증하고, (iss, sub)로 사용자를 찾거나 만든 다음, 여기서부터는 세션 쿠키나 우리가 서명한 JWT 같은 우리 서비스의 인증 체계로 넘어간다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>
  <defs>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 단계 사이 화살표 -->
  <line x1="52" y1="85" x2="52" y2="134" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/>
  <line x1="52" y1="173" x2="52" y2="222" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/>
  <line x1="52" y1="261" x2="52" y2="310" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/>
  <line x1="52" y1="349" x2="52" y2="432" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ahp)"/>

  <!-- 1 -->
  <circle cx="52" cy="66" r="17" fill="#1d4ed8"/>
  <text x="52" y="72" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="88" y="24" width="768" height="84" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="108" y="56" font-size="17" font-weight="bold" fill="#111827">사용자를 공급자 인가 화면으로 보낸다</text>
  <rect x="108" y="70" width="64" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="140" y="89" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">state</text>
  <rect x="180" y="70" width="64" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="212" y="89" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">nonce</text>
  <rect x="252" y="70" width="64" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="284" y="89" font-size="15" fill="#1d4ed8" text-anchor="middle">PKCE</text>
  <text x="326" y="89" font-size="15" fill="#374151">포함</text>

  <!-- 2 -->
  <circle cx="52" cy="154" r="17" fill="#1d4ed8"/>
  <text x="52" y="160" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="88" y="124" width="768" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="108" y="160" font-size="17" font-weight="bold" fill="#111827">콜백에서 <tspan fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">state</tspan> 검증  →  <tspan fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">code</tspan>를 토큰으로 교환</text>

  <!-- 3 -->
  <circle cx="52" cy="242" r="17" fill="#1d4ed8"/>
  <text x="52" y="248" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="88" y="200" width="768" height="84" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="108" y="232" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">id_token</tspan> 검증</text>
  <rect x="108" y="246" width="56" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="136" y="265" font-size="15" fill="#1d4ed8" text-anchor="middle">서명</text>
  <rect x="172" y="246" width="52" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="198" y="265" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">iss</text>
  <rect x="232" y="246" width="52" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="258" y="265" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">aud</text>
  <rect x="292" y="246" width="52" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="318" y="265" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">exp</text>
  <rect x="352" y="246" width="64" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="384" y="265" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">nonce</text>

  <!-- 4 -->
  <circle cx="52" cy="330" r="17" fill="#1d4ed8"/>
  <text x="52" y="336" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="88" y="300" width="768" height="60" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="108" y="336" font-size="17" font-weight="bold" fill="#111827"><tspan fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(iss, sub)</tspan>로 우리 DB에서 사용자를 찾거나 새로 만든다</text>

  <!-- 5 -->
  <circle cx="52" cy="452" r="18" fill="#6d28d9"/>
  <text x="52" y="458" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="88" y="388" width="768" height="128" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="108" y="424" font-size="19" font-weight="bold" fill="#6d28d9">여기서부터는 우리 서비스의 인증 체계로</text>
  <rect x="108" y="440" width="96" height="32" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="156" y="461" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">세션 쿠키</text>
  <text x="222" y="461" font-size="15" fill="#374151">또는</text>
  <rect x="264" y="440" width="168" height="32" rx="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="348" y="461" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">우리가 서명한 JWT</text>
  <text x="108" y="500" font-size="15" fill="#4b5563">구글 Access Token을 우리 서비스의 인증 수단으로 계속 쓰지 않는다</text>
</svg>
