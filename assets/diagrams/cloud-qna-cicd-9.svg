<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IaC 워크플로우</title>
  <desc id="d">Write, Plan, Review, Apply, State 단계를 거치는 IaC(Infrastructure as Code)의 기본 워크플로우 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">IaC 워크플로우</text>

  <!-- Step 1: Write -->
  <rect x="250" y="70" width="160" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="100" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Write</text>
  <text x="440" y="100" font-size="13" fill="#52606d" text-anchor="start">인프라 코드 작성</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M330,120 L330,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2: Plan -->
  <rect x="250" y="150" width="160" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="180" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Plan</text>
  <text x="440" y="180" font-size="13" fill="#52606d" text-anchor="start">변경사항 미리보기</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M330,200 L330,230" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Step 3: Review -->
  <rect x="250" y="230" width="160" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="330" y="260" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Review</text>
  <text x="440" y="260" font-size="13" fill="#52606d" text-anchor="start">코드 리뷰 (PR)</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M330,280 L330,310" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <!-- Step 4: Apply -->
  <rect x="250" y="310" width="160" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="330" y="340" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">Apply</text>
  <text x="440" y="340" font-size="13" fill="#52606d" text-anchor="start">인프라 적용</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M330,360 L330,390" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Step 5: State -->
  <rect x="250" y="390" width="160" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="330" y="420" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">State</text>
  <text x="440" y="420" font-size="13" fill="#52606d" text-anchor="start">상태 파일 관리</text>
</svg>