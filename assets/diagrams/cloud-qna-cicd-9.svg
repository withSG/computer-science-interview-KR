<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IaC 워크플로우</title>
  <desc id="d">인프라 코드 작성(Write), 변경사항 미리보기(Plan), 코드 리뷰(Review), 인프라 적용(Apply), 상태 파일 관리(State)의 순서로 진행되는 IaC 워크플로우입니다.</desc>
  <rect width="880" height="200" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. Write -->
  <rect x="30" y="36" width="136" height="128" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="54" cy="66" r="13" fill="#1d4ed8"/>
  <text x="54" y="71" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="73" font-size="20" font-weight="bold" fill="#111827">Write</text>
  <line x1="44" y1="92" x2="152" y2="92" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="46" y="120" font-size="16" fill="#374151">인프라 코드</text>
  <text x="46" y="142" font-size="16" fill="#374151">작성</text>

  <line x1="171" y1="100" x2="196" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2. Plan -->
  <rect x="201" y="36" width="136" height="128" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="225" cy="66" r="13" fill="#1d4ed8"/>
  <text x="225" y="71" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="247" y="73" font-size="20" font-weight="bold" fill="#111827">Plan</text>
  <line x1="215" y1="92" x2="323" y2="92" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="217" y="120" font-size="16" fill="#374151">변경사항</text>
  <text x="217" y="142" font-size="16" fill="#374151">미리보기</text>

  <line x1="342" y1="100" x2="367" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3. Review -->
  <rect x="372" y="36" width="136" height="128" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="396" cy="66" r="13" fill="#1d4ed8"/>
  <text x="396" y="71" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="418" y="73" font-size="20" font-weight="bold" fill="#111827">Review</text>
  <line x1="386" y1="92" x2="494" y2="92" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="388" y="120" font-size="16" fill="#374151">코드 리뷰</text>
  <text x="388" y="142" font-size="16" fill="#374151">(PR)</text>

  <line x1="513" y1="100" x2="538" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4. Apply -->
  <rect x="543" y="36" width="136" height="128" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="567" cy="66" r="13" fill="#1d4ed8"/>
  <text x="567" y="71" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="589" y="73" font-size="20" font-weight="bold" fill="#111827">Apply</text>
  <line x1="557" y1="92" x2="665" y2="92" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="559" y="120" font-size="16" fill="#374151">인프라 적용</text>

  <line x1="684" y1="100" x2="709" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 5. State -->
  <rect x="714" y="36" width="136" height="128" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="738" cy="66" r="13" fill="#1d4ed8"/>
  <text x="738" y="71" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="760" y="73" font-size="20" font-weight="bold" fill="#111827">State</text>
  <line x1="728" y1="92" x2="836" y2="92" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="730" y="120" font-size="16" fill="#374151">상태 파일</text>
  <text x="730" y="142" font-size="16" fill="#374151">관리</text>
</svg>
