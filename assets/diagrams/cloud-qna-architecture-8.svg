<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파일 저장·공유 시스템 대략적 설계</title>
  <desc id="d">Client 요청은 CDN(CloudFront, 다운로드 가속·캐싱)과 API Gateway를 거쳐 Metadata Service와 Upload Service로 나뉜다. Metadata Service는 MySQL에 메타데이터를, Upload Service는 S3에 파일을 저장한다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="200" y="24" width="480" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="58" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>

  <line x1="440" y1="80" x2="440" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CDN -->
  <rect x="200" y="124" width="480" height="72" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="154" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">CDN (CloudFront)</text>
  <text x="440" y="180" font-size="15" fill="#1f2937" text-anchor="middle">다운로드 가속, 캐싱</text>

  <line x1="440" y1="196" x2="440" y2="236" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- API Gateway -->
  <rect x="200" y="240" width="480" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="274" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">API Gateway</text>

  <!-- 분기 -->
  <line x1="440" y1="296" x2="440" y2="326" stroke="#374151" stroke-width="2"/>
  <line x1="260" y1="326" x2="620" y2="326" stroke="#374151" stroke-width="2"/>
  <line x1="260" y1="325" x2="260" y2="360" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="325" x2="620" y2="360" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 서비스 -->
  <rect x="110" y="364" width="300" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="260" y="402" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Metadata Service</text>

  <rect x="470" y="364" width="300" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="620" y="402" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">Upload Service</text>

  <line x1="260" y1="428" x2="260" y2="468" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="428" x2="620" y2="468" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 저장소 -->
  <rect x="110" y="472" width="300" height="80" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="260" y="505" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">MySQL</text>
  <text x="260" y="532" font-size="15" fill="#1f2937" text-anchor="middle">메타데이터</text>

  <rect x="470" y="472" width="300" height="80" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2.5"/>
  <text x="620" y="505" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">S3</text>
  <text x="620" y="532" font-size="15" fill="#1f2937" text-anchor="middle">파일 저장</text>
</svg>
