<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">출처(Origin)의 구조</title>
  <desc id="d">URL을 스킴, 호스트, 포트, 경로, 쿼리, 프래그먼트로 구분하고 출처 포함 여부를 설명하는 다이어그램</desc>
  
  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 마커 정의 -->
  <defs>
    <marker id="a-scheme" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-host" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-port" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- URL 박스 전체 배경 영역 -->
  <rect x="40" y="35" width="800" height="70" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- URL 컴포넌트 텍스트 (글자 겹침 및 넘침 완벽 방지) -->
  <!-- 폰트 크기 20px, Monospace 성격의 font-family 추가 지정으로 가독성 확보 -->
  <g font-size="20" font-weight="bold" font-family="Consolas, 'Courier New', monospace">
    <!-- 스킴: https -->
    <rect x="55" y="48" width="65" height="44" fill="#eff6ff" rx="4"/>
    <text x="87.5" y="77" fill="#2563eb" text-anchor="middle">https</text>
    
    <!-- 구분자: :// -->
    <text x="135" y="77" fill="#52606d" text-anchor="middle">://</text>
    
    <!-- 호스트: example.com -->
    <rect x="150" y="48" width="145" height="44" fill="#ecfdf5" rx="4"/>
    <text x="222.5" y="77" fill="#059669" text-anchor="middle">example.com</text>
    
    <!-- 구분자: : -->
    <text x="303" y="77" fill="#52606d" text-anchor="middle">:</text>
    
    <!-- 포트: 443 -->
    <rect x="310" y="48" width="48" height="44" fill="#f5f3ff" rx="4"/>
    <text x="334" y="77" fill="#7c3aed" text-anchor="middle">443</text>
    
    <!-- 경로, 쿼리, 프래그먼트: /products/1?q=a#top -->
    <rect x="365" y="48" width="460" height="44" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="4 4" rx="4"/>
    <text x="595" y="77" fill="#52606d" text-anchor="middle">/products/1?q=a#top</text>
  </g>

  <!-- 지시선 및 화살표 -->

  <!-- 1. 포트 (Port) 연결선 -->
  <!-- 원본: ─┬─ -> └─ 포트 (https 기본 443, http 기본 80) -->
  <path d="M334,92 L334,140 L370,140" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-port)"/>
  <text x="385" y="144" fill="#7c3aed" font-size="14" font-weight="bold">포트</text>
  <text x="420" y="144" fill="#52606d" font-size="13">(https 기본 443, http 기본 80)</text>

  <!-- 2. 호스트 (Host) 연결선 -->
  <!-- 원본: ─────┬───── -> └────────── 호스트 -->
  <path d="M222.5,92 L222.5,185 L370,185" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-host)"/>
  <text x="385" y="189" fill="#059669" font-size="14" font-weight="bold">호스트</text>

  <!-- 3. 스킴 (Scheme) 연결선 -->
  <!-- 원본: ─┬─── -> └────────────────────── 스킴 -->
  <path d="M87.5,92 L87.5,230 L370,230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-scheme)"/>
  <text x="385" y="234" fill="#2563eb" font-size="14" font-weight="bold">스킴</text>

  <!-- 하단 부가 설명 박스 (출처 제외 요소 설명) -->
  <!-- 원본: 경로(/products/1), 쿼리(?q=a), 프래그먼트(#top)는 출처에 포함되지 않는다. -->
  <rect x="40" y="270" width="800" height="45" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="440" y="298" fill="#d97706" font-size="13.5" font-weight="bold" text-anchor="middle">경로(/products/1), 쿼리(?q=a), 프래그먼트(#top)는 출처에 포함되지 않는다.</text>

</svg>