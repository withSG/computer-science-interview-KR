<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">URL에서 출처(Origin)의 범위</title>
  <desc id="d">https://example.com:443/products/1?q=a#top 에서 스킴(https), 호스트(example.com), 포트(443)가 출처를 이룬다. 포트는 https 기본 443, http 기본 80이며, 경로(/products/1), 쿼리(?q=a), 프래그먼트(#top)는 출처에 포함되지 않는다.</desc>
  <rect width="880" height="260" fill="#ffffff"/>

  <!-- 위쪽 묶음 괄호 -->
  <text x="263" y="48" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">출처(Origin) = 스킴 + 호스트 + 포트</text>
  <path d="M60,76 V64 H466 V76" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="650" y="48" font-size="16" text-anchor="middle" fill="#4b5563">출처에 포함되지 않음</text>
  <path d="M476,76 V64 H824 V76" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- URL 조각 -->
  <g font-size="24" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" text-anchor="middle">
    <rect x="60" y="86" width="92" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="106" y="118" fill="#1d4ed8">https</text>
    <text x="175" y="118" fill="#4b5563">://</text>
    <rect x="198" y="86" width="184" height="48" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
    <text x="290" y="118" fill="#047857">example.com</text>
    <text x="392" y="118" fill="#4b5563">:</text>
    <rect x="402" y="86" width="64" height="48" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="434" y="118" fill="#6d28d9">443</text>
    <rect x="476" y="86" width="180" height="48" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="566" y="118" fill="#4b5563">/products/1</text>
    <rect x="662" y="86" width="78" height="48" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="701" y="118" fill="#4b5563">?q=a</text>
    <rect x="746" y="86" width="78" height="48" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="785" y="118" fill="#4b5563">#top</text>
  </g>

  <!-- 아래 이름표 -->
  <g stroke-width="1.5">
    <line x1="106" y1="134" x2="106" y2="150" stroke="#1d4ed8"/>
    <line x1="290" y1="134" x2="290" y2="150" stroke="#047857"/>
    <line x1="434" y1="134" x2="434" y2="150" stroke="#6d28d9"/>
    <line x1="566" y1="134" x2="566" y2="150" stroke="#9ca3af"/>
    <line x1="701" y1="134" x2="701" y2="150" stroke="#9ca3af"/>
    <line x1="785" y1="134" x2="785" y2="150" stroke="#9ca3af"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="106" y="172" fill="#1d4ed8">스킴</text>
    <text x="290" y="172" fill="#047857">호스트</text>
    <text x="434" y="172" fill="#6d28d9">포트</text>
    <text x="566" y="172" fill="#4b5563">경로</text>
    <text x="701" y="172" fill="#4b5563">쿼리</text>
    <text x="785" y="172" fill="#4b5563">프래그먼트</text>
  </g>
  <text x="434" y="198" font-size="15" text-anchor="middle" fill="#374151">https 기본 443</text>
  <text x="434" y="221" font-size="15" text-anchor="middle" fill="#374151">http 기본 80</text>
</svg>
