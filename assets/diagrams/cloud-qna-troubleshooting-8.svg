<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트래픽 급증 대응 전략</title>
  <desc id="d">Scale Out(Auto Scaling, HPA), 캐싱(CDN, Redis, 애플리케이션 캐시), 큐잉(Kafka, SQS, 요청 버퍼링), 서킷 브레이커(장애 전파 차단), Rate Limiting(API 호출 제한) 다섯 가지 전략과 각각의 수단.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <text x="24" y="46" font-size="19" font-weight="bold" fill="#111827">트래픽 급증 대응 전략</text>

  <!-- 1. Scale Out -->
  <rect x="24" y="72" width="306" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="56" cy="102" r="16" fill="#1d4ed8"/>
  <text x="56" y="108" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="108" font-size="18" font-weight="bold" fill="#111827">Scale Out (수평 확장)</text>
  <path d="M330,102 L366,102" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="366" y="84" width="130" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="431" y="108" font-size="16" fill="#1f2937" text-anchor="middle">Auto Scaling</text>
  <rect x="508" y="84" width="64" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="540" y="108" font-size="16" fill="#1f2937" text-anchor="middle">HPA</text>

  <!-- 2. 캐싱 -->
  <rect x="24" y="146" width="306" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="56" cy="176" r="16" fill="#1d4ed8"/>
  <text x="56" y="182" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="84" y="182" font-size="18" font-weight="bold" fill="#111827">캐싱</text>
  <path d="M330,176 L366,176" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="366" y="158" width="66" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="399" y="182" font-size="16" fill="#1f2937" text-anchor="middle">CDN</text>
  <rect x="444" y="158" width="74" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="481" y="182" font-size="16" fill="#1f2937" text-anchor="middle">Redis</text>
  <rect x="530" y="158" width="164" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="612" y="182" font-size="16" fill="#1f2937" text-anchor="middle">애플리케이션 캐시</text>

  <!-- 3. 큐잉 -->
  <rect x="24" y="220" width="306" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="56" cy="250" r="16" fill="#1d4ed8"/>
  <text x="56" y="256" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="84" y="256" font-size="18" font-weight="bold" fill="#111827">큐잉 (비동기 처리)</text>
  <path d="M330,250 L366,250" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="366" y="232" width="76" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="404" y="256" font-size="16" fill="#1f2937" text-anchor="middle">Kafka</text>
  <rect x="454" y="232" width="64" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="486" y="256" font-size="16" fill="#1f2937" text-anchor="middle">SQS</text>
  <rect x="530" y="232" width="118" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="589" y="256" font-size="16" fill="#1f2937" text-anchor="middle">요청 버퍼링</text>

  <!-- 4. 서킷 브레이커 -->
  <rect x="24" y="294" width="306" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="56" cy="324" r="16" fill="#1d4ed8"/>
  <text x="56" y="330" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="84" y="330" font-size="18" font-weight="bold" fill="#111827">서킷 브레이커</text>
  <path d="M330,324 L366,324" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="366" y="306" width="138" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="435" y="330" font-size="16" fill="#1f2937" text-anchor="middle">장애 전파 차단</text>

  <!-- 5. Rate Limiting -->
  <rect x="24" y="368" width="306" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="56" cy="398" r="16" fill="#1d4ed8"/>
  <text x="56" y="404" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="84" y="404" font-size="18" font-weight="bold" fill="#111827">Rate Limiting</text>
  <path d="M330,398 L366,398" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <rect x="366" y="380" width="136" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="434" y="404" font-size="16" fill="#1f2937" text-anchor="middle">API 호출 제한</text>
</svg>
