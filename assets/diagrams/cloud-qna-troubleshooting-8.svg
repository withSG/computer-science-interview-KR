<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트래픽 급증 대응 전략</title>
  <desc id="d">Scale Out, 캐싱, 큐잉, 서킷 브레이커, Rate Limiting으로 구성된 트래픽 급증 대응 전략 트리 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 프레임 (외곽 박스) -->
  <rect x="40" y="30" width="800" height="440" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>

  <!-- 헤더 영역 -->
  <path d="M 40 86 L 840 86" stroke="#9aa5b1" stroke-width="2"/>
  <text x="440" y="63" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">트래픽 급증 대응 전략</text>

  <!-- 항목 1: Scale Out -->
  <rect x="70" y="110" width="740" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="132" font-size="13" font-weight="bold" fill="#2563eb">1. Scale Out (수평 확장)</text>
  <!-- 트리 라인 -->
  <path d="M 110 142 L 110 152 L 130 152" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="138" y="156" font-size="11.5" fill="#52606d">Auto Scaling, HPA</text>

  <!-- 항목 2: 캐싱 -->
  <rect x="70" y="180" width="740" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="90" y="202" font-size="13" font-weight="bold" fill="#059669">2. 캐싱</text>
  <!-- 트리 라인 -->
  <path d="M 110 212 L 110 222 L 130 222" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="138" y="226" font-size="11.5" fill="#52606d">CDN, Redis, 애플리케이션 캐시</text>

  <!-- 항목 3: 큐잉 -->
  <rect x="70" y="250" width="740" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="90" y="272" font-size="13" font-weight="bold" fill="#d97706">3. 큐잉 (비동기 처리)</text>
  <!-- 트리 라인 -->
  <path d="M 110 282 L 110 292 L 130 292" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="138" y="296" font-size="11.5" fill="#52606d">Kafka, SQS, 요청 버퍼링</text>

  <!-- 항목 4: 서킷 브레이커 -->
  <rect x="70" y="320" width="740" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="90" y="342" font-size="13" font-weight="bold" fill="#dc2626">4. 서킷 브레이커</text>
  <!-- 트리 라인 -->
  <path d="M 110 352 L 110 362 L 130 362" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="138" y="366" font-size="11.5" fill="#52606d">장애 전파 차단</text>

  <!-- 항목 5: Rate Limiting -->
  <rect x="70" y="390" width="740" height="56" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="412" font-size="13" font-weight="bold" fill="#7c3aed">5. Rate Limiting</text>
  <!-- 트리 라인 -->
  <path d="M 110 422 L 110 432 L 130 432" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="138" y="436" font-size="11.5" fill="#52606d">API 호출 제한</text>
</svg>