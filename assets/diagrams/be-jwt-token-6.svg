<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" width="880" height="332" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JWT의 세 조각</title>
  <desc id="d">jwt.io 예제 토큰을 점(.)으로 나눈 Header, Payload, Signature 세 조각. 앞 두 조각은 Base64URL 인코딩이라 JSON으로 해독되고, 세 번째 조각은 Header.Payload 전체에 대한 HMAC 바이너리 값이라 텍스트로 해독되지 않는다.</desc>
  <rect width="880" height="332" fill="#ffffff"/>

  <!-- Header -->
  <rect x="24" y="24" width="832" height="68" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M25,32 Q25,25 32,25 H164 V91 H32 Q25,91 25,84 Z" fill="#eff6ff"/>
  <line x1="164" y1="25" x2="164" y2="91" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="94" y="64" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Header</text>
  <text x="184" y="52" font-size="15" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</text>
  <text x="184" y="77" font-size="14" fill="#4b5563">Base64URL 인코딩 → <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">{"alg":"HS256","typ":"JWT"}</tspan></text>

  <!-- 구분자 -->
  <rect x="184" y="98" width="32" height="28" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="117" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.</text>
  <text x="228" y="117" font-size="15" fill="#4b5563">구분자</text>

  <!-- Payload -->
  <rect x="24" y="132" width="832" height="68" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M25,140 Q25,133 32,133 H164 V199 H32 Q25,199 25,192 Z" fill="#f5f3ff"/>
  <line x1="164" y1="133" x2="164" y2="199" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="94" y="172" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">Payload</text>
  <text x="184" y="160" font-size="15" fill="#6d28d9" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ</text>
  <text x="184" y="185" font-size="14" fill="#4b5563">Base64URL 인코딩 → <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">{"sub":"1234567890","name":"John Doe","iat":1516239022}</tspan></text>

  <!-- 구분자 -->
  <rect x="184" y="206" width="32" height="28" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="225" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.</text>
  <text x="228" y="225" font-size="15" fill="#4b5563">구분자</text>

  <!-- Signature -->
  <rect x="24" y="240" width="832" height="68" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M25,248 Q25,241 32,241 H164 V307 H32 Q25,307 25,300 Z" fill="#ecfdf5"/>
  <line x1="164" y1="241" x2="164" y2="307" stroke="#047857" stroke-width="1.5"/>
  <text x="94" y="280" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">Signature</text>
  <text x="184" y="268" font-size="15" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c</text>
  <text x="184" y="293" font-size="14" fill="#4b5563">Header.Payload 전체의 HMAC → 바이너리 해시라 텍스트로 해독되지 않음</text>
</svg>
