<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Bi-encoder와 Cross-encoder 비교</title>
  <desc id="d">Bi-encoder(검색용, 빠름)는 질문과 문서를 각각 모델에 넣어 벡터로 만든 뒤 거리를 잰다. 문서 벡터는 미리 계산 가능해 100만 건도 즉시 검색한다. Cross-encoder(재순위용, 정확)는 질문과 문서를 함께 모델에 넣어 관련성 점수를 낸다. 매 쌍마다 모델 실행이 필요해 수십 건이 한계다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- ===== Bi-encoder ===== -->
  <rect x="24" y="24" width="404" height="292" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="62" font-size="20" font-weight="bold" fill="#1e3a8a">Bi-encoder</text>
  <text x="160" y="62" font-size="16" fill="#374151">(검색용, 빠름)</text>

  <!-- 질문 행 -->
  <rect x="44" y="96" width="56" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="72" y="122" font-size="16" fill="#111827" text-anchor="middle">질문</text>
  <path d="M102,116 H132" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="136" y="96" width="68" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="122" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">모델</text>
  <path d="M206,116 H236" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="240" y="96" width="56" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="268" y="122" font-size="16" fill="#111827" text-anchor="middle">벡터</text>

  <!-- 문서 행 -->
  <rect x="44" y="166" width="56" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="72" y="192" font-size="16" fill="#111827" text-anchor="middle">문서</text>
  <path d="M102,186 H132" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="136" y="166" width="68" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="192" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">모델</text>
  <path d="M206,186 H236" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="240" y="166" width="56" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="268" y="192" font-size="16" fill="#111827" text-anchor="middle">벡터</text>

  <!-- 두 벡터 → 거리 -->
  <path d="M298,116 H318 V186 H298" stroke="#1d4ed8" stroke-width="1.5" fill="none"/>
  <path d="M318,151 H338" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#ah-blue)"/>
  <rect x="342" y="131" width="66" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="375" y="157" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">거리</text>

  <line x1="44" y1="234" x2="408" y2="234" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="44" y="264" font-size="16" fill="#111827">문서 벡터는 미리 계산 가능</text>
  <text x="44" y="294" font-size="17" font-weight="bold" fill="#047857">→ 100만 건도 즉시 검색</text>

  <!-- ===== Cross-encoder ===== -->
  <rect x="452" y="24" width="404" height="292" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="472" y="62" font-size="20" font-weight="bold" fill="#4c1d95">Cross-encoder</text>
  <text x="624" y="62" font-size="16" fill="#374151">(재순위용, 정확)</text>

  <!-- 질문+문서 한 쌍 -->
  <rect x="472" y="96" width="80" height="110" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="484" y="106" width="56" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="512" y="130" font-size="16" fill="#111827" text-anchor="middle">질문</text>
  <rect x="484" y="160" width="56" height="36" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="512" y="184" font-size="16" fill="#111827" text-anchor="middle">문서</text>

  <path d="M554,151 H586" stroke="#6d28d9" stroke-width="1.5" fill="none" marker-end="url(#ah-violet)"/>
  <rect x="590" y="129" width="68" height="44" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="624" y="157" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">모델</text>
  <path d="M660,151 H690" stroke="#6d28d9" stroke-width="1.5" fill="none" marker-end="url(#ah-violet)"/>
  <rect x="694" y="131" width="112" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="750" y="157" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">관련성 점수</text>

  <line x1="472" y1="234" x2="836" y2="234" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="472" y="264" font-size="16" fill="#111827">매 쌍마다 모델 실행 필요</text>
  <text x="472" y="294" font-size="17" font-weight="bold" fill="#b91c1c">→ 수십 건이 한계</text>
</svg>
