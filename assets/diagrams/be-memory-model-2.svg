<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">add 호출 시점의 JVM Stack</title>
  <desc id="d">calc() 실행 중 add()를 호출한 순간의 스택. 맨 아래 main 프레임 위에 calc 프레임(a=10, b=?)이, 그 위에 가장 최근에 쌓인 add 프레임(x=10, y=5)이 있다.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>

  <text x="440" y="46" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">calc() 실행 중 add() 호출 시점의 스택</text>

  <!-- 스택 용기 -->
  <path d="M318,80 V312 H582 V80" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="450" y="340" font-size="15" fill="#4b5563" text-anchor="middle">JVM Stack</text>

  <!-- main 프레임 -->
  <rect x="330" y="244" width="240" height="56" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="278" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">main 프레임</text>

  <!-- calc 프레임 -->
  <rect x="330" y="164" width="240" height="80" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="196" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">calc 프레임</text>
  <text x="450" y="224" font-size="16" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">a=10, b=?</text>

  <!-- add 프레임 (맨 위) -->
  <rect x="330" y="84" width="240" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="116" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">add 프레임</text>
  <text x="450" y="144" font-size="16" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">x=10, y=5</text>

  <!-- 쌓이는 방향 -->
  <line x1="280" y1="296" x2="280" y2="96" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="264" y="186" font-size="15" fill="#4b5563" text-anchor="end">호출하면</text>
  <text x="264" y="208" font-size="15" fill="#4b5563" text-anchor="end">위에 쌓임</text>

  <!-- 최근 프레임 표시 -->
  <line x1="636" y1="124" x2="576" y2="124" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="648" y="120" font-size="16" font-weight="bold" fill="#1d4ed8">가장 최근에 쌓인 프레임</text>
  <text x="648" y="144" font-size="15" fill="#4b5563">add가 끝나면 사라짐</text>
</svg>
