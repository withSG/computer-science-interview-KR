<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">JVM Stack (스택)</title>
  <desc id="d">calc() 실행 중 add() 호출 시점의 JVM 스택 프레임 구조를 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 헤딩 / 설명 -->
  <text x="440" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">JVM Stack (스택)</text>
  <text x="440" y="74" font-size="13" fill="#52606d" text-anchor="middle">calc() 실행 중 add() 호출 시점의 스택</text>

  <!-- 마커 정의 -->
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 스택 프레임 컨테이너 / 박스들 -->
  <!-- 가장 최근 프레임 (add 프레임) - 강조 색상 (파랑) -->
  <rect x="290" y="110" width="300" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="4"/>
  <text x="440" y="141" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">add 프레임</text>
  <text x="440" y="169" font-size="13" fill="#1f2933" text-anchor="middle">x=10, y=5</text>

  <!-- calc 프레임 - 회색/보조 -->
  <rect x="290" y="190" width="300" height="80" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="0"/>
  <text x="440" y="221" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">calc 프레임</text>
  <text x="440" y="249" font-size="13" fill="#1f2933" text-anchor="middle">a=10, b=?</text>

  <!-- main 프레임 - 회색/보조 -->
  <rect x="290" y="270" width="300" height="60" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="0"/>
  <text x="440" y="306" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">main 프레임</text>

  <!-- 주석 화살표 및 라벨 -->
  <path d="M 230,150 L 281,150" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="54" y="138" width="168" height="24" fill="#ffffff"/>
  <text x="222" y="154" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">← 가장 최근에 쌓인 프레임</text>
</svg>