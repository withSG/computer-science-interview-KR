<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Throwable 예외 계층 구조</title>
  <desc id="d">Throwable은 복구 불가한 Error와 복구 가능한 Exception으로 나뉘고, Exception은 컴파일 타임에 확인하는 Checked Exception과 런타임의 Unchecked Exception으로 나뉩니다. 각 분류 아래 대표 클래스를 나열합니다.</desc>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- connectors: Throwable -> Error, Exception -->
  <path d="M440,68 L440,90 M134,90 L558,90 M134,90 L134,112 M558,90 L558,112" stroke="#64748b" stroke-width="2" fill="none"/>
  <!-- connectors: Exception -> Checked, Unchecked -->
  <path d="M558,160 L558,182 M380,182 L686,182 M380,182 L380,204 M686,182 L686,204" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- Throwable -->
  <rect x="360" y="24" width="160" height="44" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="440" y="53" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Throwable</text>

  <!-- Error -->
  <rect x="24" y="112" width="220" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="134" y="142" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">Error (심각, 복구 불가)</text>

  <!-- Exception -->
  <rect x="260" y="112" width="596" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="558" y="142" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">Exception (복구 가능)</text>

  <!-- Checked -->
  <rect x="260" y="204" width="240" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="380" y="230" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">Checked Exception</text>
  <text x="380" y="254" font-size="15" fill="#92400e" text-anchor="middle">(컴파일 타임)</text>

  <!-- Unchecked -->
  <rect x="516" y="204" width="340" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="686" y="230" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Unchecked Exception</text>
  <text x="686" y="254" font-size="15" fill="#1e40af" text-anchor="middle">(런타임)</text>

  <!-- leaf spines -->
  <path d="M40,160 L40,420 M40,320 L56,320 M40,370 L56,370 M40,420 L56,420" stroke="#b91c1c" stroke-width="1.5" fill="none"/>
  <path d="M276,268 L276,420 M276,320 L292,320 M276,370 L292,370 M276,420 L292,420" stroke="#b45309" stroke-width="1.5" fill="none"/>
  <path d="M532,268 L532,420 M532,320 L556,320 M532,370 L556,370 M532,420 L556,420" stroke="#1d4ed8" stroke-width="1.5" fill="none"/>

  <!-- Error leaves -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="56" y="300" width="188" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="150" y="325">OutOfMemoryError</text>
    <rect x="56" y="350" width="188" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="150" y="375">StackOverflowError</text>
    <rect x="56" y="400" width="188" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="150" y="425">VirtualMachineError</text>

    <!-- Checked leaves -->
    <rect x="292" y="300" width="208" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="396" y="325">IOException</text>
    <rect x="292" y="350" width="208" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="396" y="375">SQLException</text>
    <rect x="292" y="400" width="208" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="396" y="425">FileNotFoundException</text>

    <!-- Unchecked leaves -->
    <rect x="556" y="300" width="300" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="706" y="325">NullPointerException</text>
    <rect x="556" y="350" width="300" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="706" y="375">ArrayIndexOutOfBoundsException</text>
    <rect x="556" y="400" width="300" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="706" y="425">IllegalArgumentException</text>
  </g>
</svg>
