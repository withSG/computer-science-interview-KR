<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">핵심 답변</title>
  <desc id="d">Java의 Throwable 계층 구조를 나타낸 트리 다이어그램으로, Error와 Exception, 그리고 Checked와 Unchecked Exception의 하위 클래스를 보여줍니다.</desc>
  <rect width="880" height="640" fill="#ffffff"/>

  <!-- Legend -->
  <g id="legend" transform="translate(500, 30)">
    <rect x="0" y="0" width="350" height="40" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    
    <rect x="12" y="12" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="34" y="24" font-size="11.5" fill="#1f2933">Error (복구 불가)</text>

    <rect x="135" y="12" width="16" height="16" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="157" y="24" font-size="11.5" fill="#1f2933">Checked</text>

    <rect x="225" y="12" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="247" y="24" font-size="11.5" fill="#1f2933">Unchecked</text>
  </g>

  <!-- Level 1: Root Node (Throwable) -->
  <g id="node-throwable">
    <rect x="30" y="30" width="160" height="44" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="2"/>
    <text x="110" y="57" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Throwable</text>
  </g>

  <!-- Level 2 Tree Lines from Throwable -->
  <path d="M 60,74 L 60,117" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 60,117 L 120,117" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 60,117 L 60,307 L 120,307" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Level 2: Error Node -->
  <g id="node-error">
    <rect x="120" y="95" width="280" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="260" y="122" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Error (심각, 복구 불가)</text>
  </g>

  <!-- Level 3 Tree Lines under Error -->
  <path d="M 150,139 L 150,249" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 150,173 L 190,173" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 150,211 L 190,211" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 150,249 L 190,249" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Level 3 Nodes under Error -->
  <g id="node-oom">
    <rect x="190" y="155" width="210" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="295" y="178" font-size="13" fill="#1f2933" text-anchor="middle">OutOfMemoryError</text>
  </g>
  <g id="node-soe">
    <rect x="190" y="193" width="210" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="295" y="216" font-size="13" fill="#1f2933" text-anchor="middle">StackOverflowError</text>
  </g>
  <g id="node-vme">
    <rect x="190" y="231" width="210" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="295" y="254" font-size="13" fill="#1f2933" text-anchor="middle">VirtualMachineError</text>
  </g>

  <!-- Level 2: Exception Node -->
  <g id="node-exception">
    <rect x="120" y="285" width="280" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="260" y="312" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">Exception (복구 가능)</text>
  </g>

  <!-- Level 3 Tree Lines under Exception -->
  <path d="M 150,329 L 150,497" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 150,367 L 190,367" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 150,497 L 190,497" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Level 3: Checked Exception Node -->
  <g id="node-checked">
    <rect x="190" y="345" width="340" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="360" y="372" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">Checked Exception (컴파일 타임)</text>
  </g>

  <!-- Level 4 Tree Lines under Checked Exception -->
  <path d="M 220,389 L 220,481" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 220,413 L 260,413" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 220,447 L 260,447" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 220,481 L 260,481" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Level 4 Nodes under Checked Exception -->
  <g id="node-ioe">
    <rect x="260" y="395" width="230" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="375" y="418" font-size="13" fill="#1f2933" text-anchor="middle">IOException</text>
  </g>
  <g id="node-sqle">
    <rect x="260" y="429" width="230" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="375" y="452" font-size="13" fill="#1f2933" text-anchor="middle">SQLException</text>
  </g>
  <g id="node-fnfe">
    <rect x="260" y="463" width="230" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="375" y="486" font-size="13" fill="#1f2933" text-anchor="middle">FileNotFoundException</text>
  </g>

  <!-- Level 3: Unchecked Exception Node -->
  <g id="node-unchecked">
    <rect x="190" y="475" width="340" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="360" y="502" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Unchecked Exception (런타임)</text>
  </g>

  <!-- Level 4 Tree Lines under Unchecked Exception -->
  <path d="M 220,519 L 220,611" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 220,543 L 260,543" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 220,577 L 260,577" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
  <path d="M 220,611 L 260,611" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Level 4 Nodes under Unchecked Exception -->
  <g id="node-npe">
    <rect x="260" y="525" width="280" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="400" y="548" font-size="13" fill="#1f2933" text-anchor="middle">NullPointerException</text>
  </g>
  <g id="node-aioobe">
    <rect x="260" y="559" width="280" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="400" y="582" font-size="13" fill="#1f2933" text-anchor="middle">ArrayIndexOutOfBoundsException</text>
  </g>
  <g id="node-iae">
    <rect x="260" y="593" width="280" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="400" y="616" font-size="13" fill="#1f2933" text-anchor="middle">IllegalArgumentException</text>
  </g>
</svg>