<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">검색 후 재순위로 좁히기</title>
  <desc id="d">전체 100만 청크를 벡터+BM25 검색(빠름·거침)으로 후보 50개까지 좁히고, 그 50개만 cross-encoder(느림·정확)로 다시 채점해 최종 5개를 남긴다.</desc>
  <rect width="880" height="200" fill="#ffffff"/>

  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 좁아지는 흐름 배경 -->
  <path d="M214,44 L706,84 L706,136 L214,176 Z" fill="#f3f4f6"/>

  <!-- 전체 100만 청크 -->
  <rect x="24" y="44" width="190" height="132" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="119" y="102" font-size="16" fill="#374151" text-anchor="middle">전체</text>
  <text x="119" y="130" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">100만 청크</text>

  <!-- 1단계: 벡터+BM25 -->
  <path d="M218,110 H364" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ah-blue)"/>
  <text x="292" y="98" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">벡터+BM25</text>
  <text x="292" y="136" font-size="15" fill="#374151" text-anchor="middle">빠름·거침</text>

  <!-- 후보 50개 -->
  <rect x="370" y="68" width="150" height="84" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="445" y="117" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">후보 50개</text>

  <!-- 2단계: cross-encoder -->
  <path d="M524,110 H700" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#ah-violet)"/>
  <text x="612" y="98" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">cross-encoder</text>
  <text x="612" y="136" font-size="15" fill="#374151" text-anchor="middle">느림·정확</text>

  <!-- 최종 5개 -->
  <rect x="706" y="84" width="150" height="52" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="781" y="117" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">최종 5개</text>
</svg>
