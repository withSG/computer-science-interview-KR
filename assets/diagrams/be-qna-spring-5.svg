<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DispatcherServlet 처리 흐름</title>
  <desc id="d">클라이언트 요청에서 시작해 DispatcherServlet 수신, HandlerMapping(어떤 컨트롤러?), HandlerAdapter(컨트롤러 실행), Controller(비즈니스 로직 + ModelAndView 반환), ViewResolver(View 객체 조회), View(렌더링)를 거쳐 클라이언트 응답으로 끝나는 8단계.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 열 머리 -->
  <text x="128" y="44" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">단계</text>
  <text x="192" y="44" font-size="15" font-weight="bold" fill="#4b5563">구성요소</text>
  <text x="428" y="44" font-size="15" font-weight="bold" fill="#4b5563">하는 일</text>

  <!-- 단계 사이 연결 화살표 -->
  <path d="M128,103 L128,125" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M128,167 L128,189" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M128,231 L128,253" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M128,295 L128,317" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M128,359 L128,381" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M128,423 L128,445" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M128,487 L128,509" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- 1 -->
  <circle cx="128" cy="84" r="17" fill="#4b5563"/>
  <text x="128" y="90" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="168" y="60" width="600" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="192" y="90" font-size="17" font-weight="bold" fill="#111827">클라이언트</text>
  <text x="428" y="90" font-size="16" fill="#1f2937">요청</text>

  <!-- 2 -->
  <circle cx="128" cy="148" r="17" fill="#1d4ed8"/>
  <text x="128" y="154" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="168" y="124" width="600" height="48" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="192" y="154" font-size="17" font-weight="bold" fill="#1e3a8a">DispatcherServlet</text>
  <text x="428" y="154" font-size="16" fill="#1e3a8a">수신</text>

  <!-- 3 -->
  <circle cx="128" cy="212" r="17" fill="#374151"/>
  <text x="128" y="218" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="168" y="188" width="600" height="48" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="192" y="218" font-size="17" font-weight="bold" fill="#111827">HandlerMapping</text>
  <text x="428" y="218" font-size="16" fill="#1f2937">어떤 컨트롤러?</text>

  <!-- 4 -->
  <circle cx="128" cy="276" r="17" fill="#374151"/>
  <text x="128" y="282" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="168" y="252" width="600" height="48" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="192" y="282" font-size="17" font-weight="bold" fill="#111827">HandlerAdapter</text>
  <text x="428" y="282" font-size="16" fill="#1f2937">컨트롤러 실행</text>

  <!-- 5 -->
  <circle cx="128" cy="340" r="17" fill="#b45309"/>
  <text x="128" y="346" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="168" y="316" width="600" height="48" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="192" y="346" font-size="17" font-weight="bold" fill="#78350f">Controller</text>
  <text x="428" y="346" font-size="16" fill="#78350f">비즈니스 로직 + ModelAndView 반환</text>

  <!-- 6 -->
  <circle cx="128" cy="404" r="17" fill="#374151"/>
  <text x="128" y="410" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="168" y="380" width="600" height="48" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="192" y="410" font-size="17" font-weight="bold" fill="#111827">ViewResolver</text>
  <text x="428" y="410" font-size="16" fill="#1f2937">View 객체 조회</text>

  <!-- 7 -->
  <circle cx="128" cy="468" r="17" fill="#374151"/>
  <text x="128" y="474" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="168" y="444" width="600" height="48" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="192" y="474" font-size="17" font-weight="bold" fill="#111827">View</text>
  <text x="428" y="474" font-size="16" fill="#1f2937">렌더링</text>

  <!-- 8 -->
  <circle cx="128" cy="532" r="17" fill="#4b5563"/>
  <text x="128" y="538" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <rect x="168" y="508" width="600" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="192" y="538" font-size="17" font-weight="bold" fill="#111827">클라이언트</text>
  <text x="428" y="538" font-size="16" fill="#1f2937">응답</text>
</svg>
