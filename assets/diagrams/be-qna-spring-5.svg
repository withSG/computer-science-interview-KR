<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 780" width="880" height="780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DispatcherServlet 처리 흐름</title>
  <desc id="d">클라이언트 요청부터 DispatcherServlet, HandlerMapping, HandlerAdapter, Controller, ViewResolver, View를 거쳐 클라이언트 응답에 이르는 8단계 처리 흐름 다이어그램입니다.</desc>
  <rect width="880" height="780" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="440" y="38" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">처리 흐름</text>

  <!-- 1. 클라이언트 요청 -->
  <rect x="240" y="60" width="400" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="89" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">1. 클라이언트 요청</text>

  <path d="M440,108 L440,138" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 2. DispatcherServlet 수신 -->
  <rect x="240" y="140" width="400" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="169" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">2. DispatcherServlet 수신</text>

  <path d="M440,188 L440,218" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 3. HandlerMapping: 어떤 컨트롤러? -->
  <rect x="240" y="220" width="400" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="249" font-size="13" fill="#1f2933" text-anchor="middle">3. HandlerMapping: 어떤 컨트롤러?</text>

  <path d="M440,268 L440,298" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 4. HandlerAdapter: 컨트롤러 실행 -->
  <rect x="240" y="300" width="400" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="329" font-size="13" fill="#1f2933" text-anchor="middle">4. HandlerAdapter: 컨트롤러 실행</text>

  <path d="M440,348 L440,378" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 5. Controller: 비즈니스 로직 + ModelAndView 반환 -->
  <rect x="240" y="380" width="400" height="48" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="409" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">5. Controller: 비즈니스 로직 + ModelAndView 반환</text>

  <path d="M440,428 L440,458" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 6. ViewResolver: View 객체 조회 -->
  <rect x="240" y="460" width="400" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="489" font-size="13" fill="#1f2933" text-anchor="middle">6. ViewResolver: View 객체 조회</text>

  <path d="M440,508 L440,538" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 7. View: 렌더링 -->
  <rect x="240" y="540" width="400" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="569" font-size="13" fill="#1f2933" text-anchor="middle">7. View: 렌더링</text>

  <path d="M440,588 L440,618" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 8. 클라이언트 응답 -->
  <rect x="240" y="620" width="400" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="649" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">8. 클라이언트 응답</text>
</svg>