<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1. 왜 필요한가</title>
  <desc id="d">문제 1 로드 밸런싱과 문제 2 샤딩의 난이도 차이를 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>

  <!-- 문제 1 영역 (로드 밸런싱) -->
  <rect x="24" y="24" width="832" height="110" rx="8" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="44" y="52.55" fill="#1f2933" font-size="16" font-weight="bold">문제 1: 들어오는 요청을 어느 서버가 처리할 것인가?</text>
  
  <path d="M 64,68 L 64,106 L 94,106" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <text x="110" y="110.55" fill="#2563eb" font-size="14" font-weight="bold">로드 밸런싱.</text>
  <text x="200" y="110.55" fill="#1f2933" font-size="13">서버들이 무상태라면 아무나 처리해도 되므로 비교적 쉽다</text>

  <!-- 문제 2 영역 (샤딩) -->
  <rect x="24" y="150" width="832" height="126" rx="8" fill="#f5f3ff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="44" y="178.55" fill="#1f2933" font-size="16" font-weight="bold">문제 2: 데이터를 어느 DB가 가질 것인가?</text>

  <path d="M 64,194 L 64,232 L 94,232" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <text x="110" y="222.55" fill="#7c3aed" font-size="14" font-weight="bold">샤딩.</text>
  <text x="152" y="222.55" fill="#1f2933" font-size="13">데이터는 "아무 데나 두면 되는" 것이 아니다.</text>
  <text x="152" y="248.55" fill="#52606d" font-size="13">어디에 뒀는지 기억해야 하고, 나중에 옮기기가 매우 어렵다</text>
</svg>