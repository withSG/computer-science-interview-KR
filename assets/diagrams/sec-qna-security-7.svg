<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">관계</title>
  <desc id="d">OAuth 2.0 권한 위임 프로토콜/프레임워크 내부의 JWT 토큰(형식 A)과 Opaque 토큰(형식 B)의 관계를 나타낸 다이어그램</desc>
  <rect width="880" height="280" fill="#ffffff"/>

  <!-- OAuth 2.0 Outer Container Box -->
  <rect x="180" y="30" width="520" height="220" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Outer Title: OAuth 2.0 -->
  <text x="440" y="65.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">OAuth 2.0</text>
  
  <!-- Outer Subtitle: (권한 위임 프로토콜/프레임워크) -->
  <text x="440" y="93.1" font-size="13" fill="#52606d" text-anchor="middle">(권한 위임 프로토콜/프레임워크)</text>

  <!-- JWT Token Inner Box (형식 A) -->
  <rect x="220" y="120" width="200" height="100" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="320" y="159.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">JWT 토큰</text>
  <text x="320" y="187.0" font-size="13" fill="#52606d" text-anchor="middle">(형식 A)</text>

  <!-- Opaque Token Inner Box (형식 B) -->
  <rect x="460" y="120" width="200" height="100" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="560" y="159.5" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Opaque 토큰</text>
  <text x="560" y="187.0" font-size="13" fill="#52606d" text-anchor="middle">(형식 B)</text>
</svg>