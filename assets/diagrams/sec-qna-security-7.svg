<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">OAuth와 토큰 형식</title>
  <desc id="d">OAuth 2.0(권한 위임 프로토콜/프레임워크)이라는 큰 틀 안에 토큰 형식으로 JWT 토큰(형식 A)과 Opaque 토큰(형식 B)이 들어가는 관계.</desc>
  <rect width="880" height="280" fill="#ffffff"/>

  <!-- OAuth 2.0 (바깥 틀) -->
  <rect x="140" y="24" width="600" height="228" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="62" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">OAuth 2.0</text>
  <text x="440" y="90" font-size="16" fill="#374151" text-anchor="middle">권한 위임 프로토콜/프레임워크</text>

  <!-- 형식 A -->
  <rect x="170" y="122" width="240" height="98" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="290" y="164" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">JWT 토큰</text>
  <text x="290" y="192" font-size="15" fill="#4b5563" text-anchor="middle">형식 A</text>

  <!-- 형식 B -->
  <rect x="470" y="122" width="240" height="98" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="590" y="164" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Opaque 토큰</text>
  <text x="590" y="192" font-size="15" fill="#4b5563" text-anchor="middle">형식 B</text>
</svg>
