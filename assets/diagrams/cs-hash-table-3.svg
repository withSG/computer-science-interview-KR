<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">방법 2: 개방 주소법 (Open Addressing)</title>
  <desc id="d">선형 탐사(Linear Probing) 방식에서 충돌이 발생했을 때 다음 빈 버킷을 찾아가며 군집을 형성하는 과정을 보여주는 다이어그램입니다.</desc>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 문서 헤딩/제목 -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">선형 탐사 (Linear Probing): 충돌하면 바로 다음 칸으로</text>

  <!-- 좌측 해시 탐사 프로세스 영역 -->
  <!-- K1 -->
  <text x="30" y="98" font-size="14" font-weight="bold" fill="#2563eb">K1</text>
  <path d="M55,94 L90,94" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="98" y="98" font-size="13" font-weight="bold" fill="#1f2933">3</text>
  <text x="115" y="98" font-size="13" fill="#52606d">(빔)</text>

  <!-- K2 -->
  <text x="30" y="148" font-size="14" font-weight="bold" fill="#d97706">K2</text>
  <path d="M55,144 L90,144" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <text x="98" y="148" font-size="13" font-weight="bold" fill="#1f2933">3</text>
  <text x="115" y="148" font-size="13" fill="#dc2626">(참)</text>
  <path d="M142,144 L165,144" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <text x="173" y="148" font-size="13" font-weight="bold" fill="#1f2933">4</text>

  <!-- K3 -->
  <text x="30" y="198" font-size="14" font-weight="bold" fill="#7c3aed">K3</text>
  <path d="M55,194 L90,194" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="98" y="198" font-size="13" font-weight="bold" fill="#1f2933">4</text>
  <text x="115" y="198" font-size="13" fill="#dc2626">(참)</text>
  <path d="M142,194 L165,194" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="173" y="198" font-size="13" font-weight="bold" fill="#1f2933">5</text>

  <!-- 우측 해시 테이블 (버킷 배열) -->
  <!-- 군집 강조 배경 영역 (버킷 3, 4, 5) -->
  <rect x="420" y="70" width="180" height="70" fill="#fffbeb" rx="4" ry="4"/>

  <!-- 버킷 0 ~ 6 -->
  <!-- 버킷 0 -->
  <rect x="240" y="80" width="60" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="270" y="152" font-size="13" fill="#52606d" text-anchor="middle">0</text>

  <!-- 버킷 1 -->
  <rect x="300" y="80" width="60" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="330" y="152" font-size="13" fill="#52606d" text-anchor="middle">1</text>

  <!-- 버킷 2 -->
  <rect x="360" y="80" width="60" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="390" y="152" font-size="13" fill="#52606d" text-anchor="middle">2</text>

  <!-- 버킷 3 (K1) -->
  <rect x="420" y="80" width="60" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="110" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">K1</text>
  <text x="450" y="152" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3</text>

  <!-- 버킷 4 (K2) -->
  <rect x="480" y="80" width="60" height="50" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="510" y="110" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">K2</text>
  <text x="510" y="152" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">4</text>

  <!-- 버킷 5 (K3) -->
  <rect x="540" y="80" width="60" height="50" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="570" y="110" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">K3</text>
  <text x="570" y="152" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">5</text>

  <!-- 버킷 6 -->
  <rect x="600" y="80" width="60" height="50" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="630" y="152" font-size="13" fill="#52606d" text-anchor="middle">6</text>

  <!-- 군집(cluster) 형성 안내 표시 -->
  <!-- └─────── 군집(cluster) 형성 브래킷 및 라벨 -->
  <path d="M430,175 L430,185 L590,185 L590,175" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M510,185 L510,195" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M510,195 L530,195" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="538" y="199" font-size="13" font-weight="bold" fill="#d97706">군집(cluster) 형성</text>
</svg>