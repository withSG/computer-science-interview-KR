<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">선형 탐사와 군집 형성</title>
  <desc id="d">선형 탐사는 충돌하면 바로 다음 칸으로 간다. K1은 빈 3번에, K2는 3번이 차 있어 4번에, K3는 4번이 차 있어 5번에 들어가 3~5번에 군집(cluster)이 생긴다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="lp-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="lp-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <text x="24" y="38" font-size="18" font-weight="bold" fill="#111827">선형 탐사 (Linear Probing)<tspan font-weight="normal" fill="#374151">: 충돌하면 바로 다음 칸으로</tspan></text>

  <!-- 열 배경 (버킷 0~6) -->
  <rect x="258" y="62" width="80" height="196" fill="#f3f4f6"/>
  <rect x="342" y="62" width="80" height="196" fill="#f3f4f6"/>
  <rect x="426" y="62" width="80" height="196" fill="#f3f4f6"/>
  <rect x="510" y="62" width="80" height="196" fill="#f3f4f6"/>
  <rect x="594" y="62" width="80" height="196" fill="#f3f4f6"/>
  <rect x="678" y="62" width="80" height="196" fill="#f3f4f6"/>
  <rect x="762" y="62" width="80" height="196" fill="#f3f4f6"/>

  <!-- 머리행: 버킷 번호 -->
  <text x="24" y="86" font-size="15" font-weight="bold" fill="#4b5563">삽입 순서</text>
  <text x="856" y="38" font-size="15" fill="#4b5563" text-anchor="end">빔: 비어 있음 · 참: 이미 차 있음</text>
  <text x="298" y="86" font-size="15" fill="#4b5563" text-anchor="middle">0</text>
  <text x="382" y="86" font-size="15" fill="#4b5563" text-anchor="middle">1</text>
  <text x="466" y="86" font-size="15" fill="#4b5563" text-anchor="middle">2</text>
  <text x="550" y="86" font-size="15" fill="#4b5563" text-anchor="middle">3</text>
  <text x="634" y="86" font-size="15" fill="#4b5563" text-anchor="middle">4</text>
  <text x="718" y="86" font-size="15" fill="#4b5563" text-anchor="middle">5</text>
  <text x="802" y="86" font-size="15" fill="#4b5563" text-anchor="middle">6</text>

  <!-- ① K1 → 3 (빔) -->
  <text x="24" y="130" font-size="16" fill="#111827">① <tspan font-weight="bold" fill="#1d4ed8">K1</tspan> → 3 (빔)</text>
  <rect x="522" y="104" width="56" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="550" y="130" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">K1</text>

  <!-- ② K2 → 3 (참) → 4 -->
  <text x="24" y="186" font-size="16" fill="#111827">② <tspan font-weight="bold" fill="#b45309">K2</tspan> → 3 (참) → 4</text>
  <rect x="522" y="160" width="56" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="550" y="186" font-size="15" fill="#4b5563" text-anchor="middle">참</text>
  <line x1="580" y1="180" x2="604" y2="180" stroke="#b45309" stroke-width="2" marker-end="url(#lp-amber)"/>
  <rect x="606" y="160" width="56" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="634" y="186" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">K2</text>

  <!-- ③ K3 → 4 (참) → 5 -->
  <text x="24" y="242" font-size="16" fill="#111827">③ <tspan font-weight="bold" fill="#6d28d9">K3</tspan> → 4 (참) → 5</text>
  <rect x="606" y="216" width="56" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="634" y="242" font-size="15" fill="#4b5563" text-anchor="middle">참</text>
  <line x1="664" y1="236" x2="688" y2="236" stroke="#6d28d9" stroke-width="2" marker-end="url(#lp-purple)"/>
  <rect x="690" y="216" width="56" height="40" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="718" y="242" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">K3</text>

  <!-- 결과 배열 -->
  <text x="24" y="310" font-size="16" font-weight="bold" fill="#111827">결과 배열</text>
  <rect x="256" y="276" width="84" height="56" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="340" y="276" width="84" height="56" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="424" y="276" width="84" height="56" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="508" y="276" width="84" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="592" y="276" width="84" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <rect x="676" y="276" width="84" height="56" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <rect x="760" y="276" width="84" height="56" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="550" y="310" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">K1</text>
  <text x="634" y="310" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">K2</text>
  <text x="718" y="310" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">K3</text>
  <text x="298" y="354" font-size="15" fill="#4b5563" text-anchor="middle">0</text>
  <text x="382" y="354" font-size="15" fill="#4b5563" text-anchor="middle">1</text>
  <text x="466" y="354" font-size="15" fill="#4b5563" text-anchor="middle">2</text>
  <text x="550" y="354" font-size="15" fill="#4b5563" text-anchor="middle">3</text>
  <text x="634" y="354" font-size="15" fill="#4b5563" text-anchor="middle">4</text>
  <text x="718" y="354" font-size="15" fill="#4b5563" text-anchor="middle">5</text>
  <text x="802" y="354" font-size="15" fill="#4b5563" text-anchor="middle">6</text>

  <!-- 군집 괄호 -->
  <path d="M514,366 L514,376 L754,376 L754,366" stroke="#b45309" stroke-width="2" fill="none"/>
  <text x="634" y="404" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">군집(cluster) 형성</text>
</svg>
