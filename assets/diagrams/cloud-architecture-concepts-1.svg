<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">조정 루프(Reconciliation Loop)</title>
  <desc id="d">컨트롤러가 spec(원하는 상태, replicas: 3)과 status(실제 상태, readyReplicas: 2)를 비교해 차이를 발견하면 Pod 1개를 추가 생성하고, 끝나지 않고 다시 비교로 돌아가는 조정 루프.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- spec -->
  <rect x="250" y="30" width="380" height="90" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="67" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d4ed8">spec (원하는 상태)</text>
  <text x="440" y="100" text-anchor="middle" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">replicas: 3</text>

  <!-- 비교(diff) -->
  <line x1="440" y1="120" x2="440" y2="176" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <text x="458" y="154" font-size="16" fill="#374151">비교(diff)</text>

  <!-- status -->
  <rect x="250" y="180" width="380" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="217" text-anchor="middle" font-size="19" font-weight="bold" fill="#b45309">status (실제 상태)</text>
  <text x="440" y="250" text-anchor="middle" font-size="17" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">readyReplicas: 2</text>

  <!-- 차이 발견 -->
  <line x1="440" y1="270" x2="440" y2="326" stroke="#374151" stroke-width="2" marker-end="url(#ink)"/>
  <text x="458" y="304" font-size="16" fill="#374151">차이 발견</text>

  <!-- 조치 -->
  <rect x="300" y="330" width="280" height="70" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="372" text-anchor="middle" font-size="19" font-weight="bold" fill="#047857">Pod 1개 추가 생성</text>

  <!-- 루프 복귀 -->
  <path d="M580,365 H720 V75 H636" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#loop)"/>
  <text x="738" y="212" font-size="17" font-weight="bold" fill="#1d4ed8">다시 비교</text>
  <text x="738" y="236" font-size="16" fill="#1d4ed8">(끝나지 않음)</text>
</svg>
