<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">페이지 폴트 처리 흐름</title>
  <desc id="d">페이지 폴트가 발생하면 인터럽트 발생, 디스크에서 페이지 로드, 페이지 테이블 업데이트, 재실행 순서로 처리된다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="160" fill="#ffffff"/>

  <!-- 계기: 페이지 폴트 -->
  <rect x="24" y="32" width="124" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="86" y="78" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">페이지 폴트</text>
  <text x="86" y="102" font-size="15" fill="#92400e" text-anchor="middle">발생 시</text>

  <line x1="152" y1="80" x2="183" y2="80" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 1. 인터럽트 발생 -->
  <rect x="188" y="32" width="136" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="256" cy="56" r="12" fill="#1d4ed8"/>
  <text x="256" y="61" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="256" y="92" font-size="16" fill="#111827" text-anchor="middle">인터럽트</text>
  <text x="256" y="114" font-size="16" fill="#111827" text-anchor="middle">발생</text>

  <line x1="328" y1="80" x2="359" y2="80" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2. 디스크에서 페이지 로드 -->
  <rect x="364" y="32" width="136" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="432" cy="56" r="12" fill="#1d4ed8"/>
  <text x="432" y="61" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="432" y="92" font-size="16" fill="#111827" text-anchor="middle">디스크에서</text>
  <text x="432" y="114" font-size="16" fill="#111827" text-anchor="middle">페이지 로드</text>

  <line x1="504" y1="80" x2="535" y2="80" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 3. 페이지 테이블 업데이트 -->
  <rect x="540" y="32" width="136" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="608" cy="56" r="12" fill="#1d4ed8"/>
  <text x="608" y="61" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="608" y="92" font-size="16" fill="#111827" text-anchor="middle">페이지 테이블</text>
  <text x="608" y="114" font-size="16" fill="#111827" text-anchor="middle">업데이트</text>

  <line x1="680" y1="80" x2="711" y2="80" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 4. 재실행 -->
  <rect x="716" y="32" width="136" height="96" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="784" cy="56" r="12" fill="#047857"/>
  <text x="784" y="61" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="784" y="103" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">재실행</text>
</svg>
