  <!-- 3회차 -->
  <text x="40" y="229" font-size="15" font-weight="bold" fill="#374151">3회차</text>
  <rect x="110" y="204" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="149" y="229" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <rect x="194" y="204" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="233" y="229" font-size="15" fill="#374151" text-anchor="middle">학습</text>
