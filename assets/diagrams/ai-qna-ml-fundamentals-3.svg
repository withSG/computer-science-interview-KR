<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">K-Fold 교차 검증 (K=5)</title>
  <desc id="d">데이터를 5개 폴드로 나누고, 5번의 회차마다 검증 폴드를 하나씩 바꿔 나머지 4개 폴드로 학습한다. 5번의 성능을 평균해 일반화 성능을 추정한다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="18" font-weight="bold" fill="#1f2937">K-Fold (K=5) 예시</text>

  <!-- 범례 -->
  <rect x="300" y="29" width="20" height="20" rx="3" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="330" y="44" font-size="15" fill="#1f2937">검증 데이터 (Validation)</text>
  <rect x="560" y="29" width="20" height="20" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="590" y="44" font-size="15" fill="#1f2937">학습 데이터 (Train)</text>

  <!-- 폴드 머리글 -->
  <text x="149" y="88" font-size="15" fill="#4b5563" text-anchor="middle">폴드 1</text>
  <text x="233" y="88" font-size="15" fill="#4b5563" text-anchor="middle">폴드 2</text>
  <text x="317" y="88" font-size="15" fill="#4b5563" text-anchor="middle">폴드 3</text>
  <text x="401" y="88" font-size="15" fill="#4b5563" text-anchor="middle">폴드 4</text>
  <text x="485" y="88" font-size="15" fill="#4b5563" text-anchor="middle">폴드 5</text>

  <!-- 1회차 -->
  <text x="40" y="125" font-size="15" font-weight="bold" fill="#374151">1회차</text>
  <rect x="110" y="100" width="78" height="40" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="149" y="125" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <rect x="194" y="100" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="233" y="125" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <rect x="278" y="100" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="317" y="125" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <rect x="362" y="100" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="401" y="125" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <rect x="446" y="100" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="485" y="125" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <path d="M 532 120 L 554 120" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="560" y="104" width="70" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="595" y="125" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">성능 1</text>
  <path d="M 630 120 L 654 120" stroke="#4b5563" stroke-width="1.5" fill="none"/>

