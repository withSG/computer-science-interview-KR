  <rect x="560" y="208" width="70" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="595" y="229" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">성능 3</text>
  <path d="M 630 224 L 654 224" stroke="#4b5563" stroke-width="1.5" fill="none"/>

  <!-- 4회차 -->
