  <!-- 평균 -->
  <path d="M 654 120 L 654 328" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <path d="M 654 224 L 676 224" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="682" y="196" width="174" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="769" y="230" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">5번의 성능을 평균</text>

  <text x="40" y="386" font-size="15" fill="#4b5563">매 회차 다른 폴드 1개로 검증하고 나머지 4개 폴드로 학습</text>
</svg>
