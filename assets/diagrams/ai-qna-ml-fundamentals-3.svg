  <rect x="278" y="256" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="317" y="281" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <rect x="362" y="256" width="78" height="40" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="401" y="281" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <rect x="446" y="256" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="485" y="281" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <path d="M 532 276 L 554 276" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="560" y="260" width="70" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="595" y="281" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">성능 4</text>
  <path d="M 630 276 L 654 276" stroke="#4b5563" stroke-width="1.5" fill="none"/>

  <!-- 5회차 -->
  <text x="40" y="333" font-size="15" font-weight="bold" fill="#374151">5회차</text>
  <rect x="110" y="308" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="149" y="333" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <rect x="194" y="308" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
