  <text x="401" y="333" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <rect x="446" y="308" width="78" height="40" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="485" y="333" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">검증</text>
  <path d="M 532 328 L 554 328" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <rect x="560" y="312" width="70" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="595" y="333" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">성능 5</text>
