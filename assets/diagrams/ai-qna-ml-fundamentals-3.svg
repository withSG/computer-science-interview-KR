<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">교차 검증 (Cross Validation)</title>
  <desc id="d">K-Fold (K=5) 교차 검증의 5가지 폴드 반복 구성 및 성능 평균화 과정 다이어그램</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 박스 Container -->
  <rect x="24" y="24" width="832" height="292" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- 섹션 제목 -->
  <text x="50" y="60" fill="#1f2933" font-size="16" font-weight="bold">K-Fold (K=5) 예시:</text>

  <!-- Fold 1 -->
  <g transform="translate(50, 80)">
    <!-- 검증 -->
    <rect x="0" y="0" width="90" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="45" y="22.2" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">검증</text>

    <!-- 학습 1 -->
    <rect x="98" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="143" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 학습 2 -->
    <rect x="196" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="241" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 학습 3 -->
    <rect x="294" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="339" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 학습 4 -->
    <rect x="392" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="437" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>
  </g>

  <!-- Fold 2 -->
  <g transform="translate(50, 126)">
    <!-- 학습 1 -->
    <rect x="0" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="45" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 검증 -->
    <rect x="98" y="0" width="90" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="143" y="22.2" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">검증</text>

    <!-- 학습 2 -->
    <rect x="196" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="241" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 학습 3 -->
    <rect x="294" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="339" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 학습 4 -->
    <rect x="392" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="437" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>
  </g>

  <!-- Fold 3 -->
  <g transform="translate(50, 172)">
    <!-- 학습 1 -->
    <rect x="0" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="45" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 학습 2 -->
    <rect x="98" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="143" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 검증 -->
    <rect x="196" y="0" width="90" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="241" y="22.2" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">검증</text>

    <!-- 학습 3 -->
    <rect x="294" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="339" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>

    <!-- 학습 4 -->
    <rect x="392" y="0" width="90" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="437" y="22.2" fill="#1f2933" font-size="13" text-anchor="middle">학습</text>
  </g>

  <!-- 하단 생략 및 요약 수식 영역 -->
  <text x="50" y="238" fill="#52606d" font-size="16" font-weight="bold">...</text>

  <!-- 화살표 및 최종 요약 텍스트 -->
  <path d="M100,232 L532,232" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  
  <rect x="546" y="214" width="180" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="636" y="236.2" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">5번의 성능을 평균</text>

  <!-- 범례 (Legend) -->
  <g transform="translate(50, 272)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="24" y="12.5" fill="#52606d" font-size="11.5">검증 데이터 (Validation)</text>

    <rect x="180" y="0" width="16" height="16" rx="2" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="204" y="12.5" fill="#52606d" font-size="11.5">학습 데이터 (Train)</text>
  </g>
</svg>