  <text x="401" y="177" font-size="15" fill="#374151" text-anchor="middle">학습</text>
  <rect x="446" y="152" width="78" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="485" y="177" font-size="15" fill="#374151" text-anchor="middle">학습</text>
