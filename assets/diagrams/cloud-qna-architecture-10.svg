<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">검색 시스템 대략적 설계</title>
  <desc id="d">Client 요청이 API Gateway(Rate Limiting, 캐싱)를 거쳐 Search Service와 Autocomplete Service로 나뉘고, Search Service는 Elasticsearch를, Autocomplete Service는 Elasticsearch와 Redis를 사용하는 구조를 보여준다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="260" y="24" width="360" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="440" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Client</text>

  <line x1="440" y1="78" x2="440" y2="110" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- API Gateway -->
  <rect x="260" y="114" width="360" height="72" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="143" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">API Gateway</text>
  <text x="440" y="169" font-size="16" fill="#374151" text-anchor="middle">Rate Limiting, 캐싱</text>

  <!-- 분기 -->
  <path d="M440,188 L440,212 M220,212 L660,212" stroke="#374151" stroke-width="2" fill="none"/>
  <line x1="220" y1="211" x2="220" y2="236" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="660" y1="211" x2="660" y2="236" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Search Service -->
  <rect x="70" y="240" width="300" height="72" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="220" y="269" font-size="18" font-weight="bold" fill="#065f46" text-anchor="middle">Search Service</text>
  <text x="220" y="295" font-size="16" fill="#374151" text-anchor="middle">검색 처리</text>

  <!-- Autocomplete Service -->
  <rect x="500" y="240" width="320" height="72" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="660" y="269" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">Autocomplete Service</text>
  <text x="660" y="295" font-size="16" fill="#374151" text-anchor="middle">자동완성</text>

  <!-- Search → Elasticsearch -->
  <line x1="220" y1="314" x2="220" y2="386" stroke="#047857" stroke-width="2" marker-end="url(#ahg)"/>

  <!-- Autocomplete → Elasticsearch / Redis -->
  <path d="M590,314 L590,350 L450,350 L450,386" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#ahp)"/>
  <line x1="730" y1="314" x2="730" y2="386" stroke="#6d28d9" stroke-width="2" marker-end="url(#ahp)"/>

  <!-- Elasticsearch -->
  <rect x="70" y="390" width="460" height="76" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="300" y="421" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">Elasticsearch</text>
  <text x="300" y="447" font-size="16" fill="#374151" text-anchor="middle">역인덱스, 검색</text>

  <!-- Redis -->
  <rect x="630" y="390" width="200" height="76" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="730" y="421" font-size="18" font-weight="bold" fill="#991b1b" text-anchor="middle">Redis</text>
  <text x="730" y="447" font-size="16" fill="#374151" text-anchor="middle">자동완성</text>
</svg>
