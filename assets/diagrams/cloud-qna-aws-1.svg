<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">VPC Public·Private Subnet 구성</title>
  <desc id="d">Internet과 IGW 아래 AZ-a·AZ-b의 Public Subnet(ALB)과 NAT Gateway가 연결되고, 그 아래 Private Subnet(App, App, DB)이 각각 이어지는 구조.</desc>
  <rect width="880" height="580" fill="#ffffff"/>

  <!-- 연결선 -->
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <path d="M440,68 V100"/>
    <path d="M440,160 V250"/>
    <path d="M165,190 H715"/>
    <path d="M165,190 V220"/>
    <path d="M715,190 V220"/>
    <path d="M165,330 V400"/>
    <path d="M440,306 V400"/>
    <path d="M715,330 V400"/>
  </g>

  <!-- Internet -->
  <rect x="350" y="24" width="180" height="44" rx="22" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="52" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Internet</text>

  <!-- IGW -->
  <rect x="320" y="100" width="240" height="60" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="440" y="125" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">IGW</text>
  <text x="440" y="148" font-size="15" fill="#4b5563" text-anchor="middle">Internet Gateway</text>

  <!-- Public Subnet (AZ-a) -->
  <rect x="40" y="220" width="250" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="165" y="248" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Public Subnet (AZ-a)</text>
  <rect x="105" y="264" width="120" height="46" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="165" y="293" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">ALB</text>

  <!-- Public Subnet (AZ-b) -->
  <rect x="590" y="220" width="250" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="715" y="248" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Public Subnet (AZ-b)</text>
  <rect x="655" y="264" width="120" height="46" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="715" y="293" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">ALB</text>

  <!-- NAT Gateway -->
  <rect x="340" y="250" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="440" y="284" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">NAT Gateway</text>

  <!-- Private Subnets -->
  <rect x="40" y="400" width="250" height="76" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="165" y="431" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">Private Subnet</text>
  <text x="165" y="457" font-size="16" fill="#111827" text-anchor="middle">(App)</text>

  <rect x="315" y="400" width="250" height="76" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="440" y="431" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">Private Subnet</text>
  <text x="440" y="457" font-size="16" fill="#111827" text-anchor="middle">(App)</text>

  <rect x="590" y="400" width="250" height="76" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="715" y="431" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">Private Subnet</text>
  <text x="715" y="457" font-size="16" fill="#111827" text-anchor="middle">(DB)</text>

  <!-- 범례 -->
  <rect x="40" y="507" width="18" height="18" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="70" y="522" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#1d4ed8">Public Subnet</tspan><tspan dx="12">IGW 직접 연결 · 외부에서 직접 접근 가능</tspan></text>
  <rect x="40" y="539" width="18" height="18" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="70" y="554" font-size="15" fill="#374151"><tspan font-weight="bold" fill="#047857">Private Subnet</tspan><tspan dx="12">인터넷 접근은 NAT Gateway 통해서만 · 외부 접근 차단</tspan></text>
</svg>
