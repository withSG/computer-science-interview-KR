<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">아키텍처 예시</title>
  <desc id="d">VPC 내 Public Subnet과 Private Subnet의 구조를 나타낸 아키텍처 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Legend -->
  <g transform="translate(620, 20)">
    <rect x="0" y="0" width="230" height="85" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <rect x="12" y="12" width="14" height="14" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="34" y="23.5" font-size="11.5" fill="#1f2933">Public Subnet</text>
    <rect x="12" y="35" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="34" y="46.5" font-size="11.5" fill="#1f2933">Private Subnet (App)</text>
    <rect x="12" y="58" width="14" height="14" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="34" y="69.5" font-size="11.5" fill="#1f2933">Private Subnet (DB)</text>
  </g>

  <!-- Connectors / Lines -->
  <!-- Internet to IGW -->
  <path d="M440,55 L440,85" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- IGW to Public Subnets Branching -->
  <path d="M440,145 L440,185" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M190,185 L690,185" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M190,185 L190,215" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M690,185 L690,215" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Public Subnet Left (AZ-a ALB) Connections -->
  <path d="M190,315 L190,415" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- NAT Gateway Connections -->
  <path d="M440,335 L440,415" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Public Subnet Right (AZ-b ALB) Connections -->
  <path d="M690,315 L690,415" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Nodes / Boxes -->
  <!-- Internet -->
  <text x="440" y="48" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Internet</text>

  <!-- IGW -->
  <rect x="370" y="85" width="140" height="60" rx="4" fill="#f8fafc" stroke="#1f2933" stroke-width="1.5"/>
  <text x="440" y="120" font-size="13" fill="#1f2933" text-anchor="middle">IGW</text>

  <!-- Public Subnet (AZ-a) ALB -->
  <rect x="120" y="215" width="140" height="100" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="240" font-size="13" fill="#1f2933" text-anchor="middle">Public</text>
  <text x="190" y="260" font-size="13" fill="#1f2933" text-anchor="middle">Subnet</text>
  <text x="190" y="280" font-size="13" fill="#1f2933" text-anchor="middle">(AZ-a)</text>
  <text x="190" y="300" font-size="13" fill="#1f2933" text-anchor="middle">ALB</text>

  <!-- Public Subnet (AZ-b) ALB -->
  <rect x="620" y="215" width="140" height="100" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="690" y="240" font-size="13" fill="#1f2933" text-anchor="middle">Public</text>
  <text x="690" y="260" font-size="13" fill="#1f2933" text-anchor="middle">Subnet</text>
  <text x="690" y="280" font-size="13" fill="#1f2933" text-anchor="middle">(AZ-b)</text>
  <text x="690" y="300" font-size="13" fill="#1f2933" text-anchor="middle">ALB</text>

  <!-- NAT Gateway -->
  <rect x="370" y="275" width="140" height="60" rx="4" fill="#f8fafc" stroke="#1f2933" stroke-width="1.5"/>
  <text x="440" y="305" font-size="13" fill="#1f2933" text-anchor="middle">NAT</text>
  <text x="440" y="323" font-size="13" fill="#1f2933" text-anchor="middle">Gateway</text>

  <!-- Private Subnet (App) - Left -->
  <rect x="120" y="415" width="140" height="80" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="190" y="445" font-size="13" fill="#1f2933" text-anchor="middle">Private</text>
  <text x="190" y="465" font-size="13" fill="#1f2933" text-anchor="middle">Subnet</text>
  <text x="190" y="485" font-size="13" fill="#1f2933" text-anchor="middle">(App)</text>

  <!-- Private Subnet (App) - Middle -->
  <rect x="370" y="415" width="140" height="80" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="445" font-size="13" fill="#1f2933" text-anchor="middle">Private</text>
  <text x="440" y="465" font-size="13" fill="#1f2933" text-anchor="middle">Subnet</text>
  <text x="440" y="485" font-size="13" fill="#1f2933" text-anchor="middle">(App)</text>

  <!-- Private Subnet (DB) - Right -->
  <rect x="620" y="415" width="140" height="80" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="690" y="445" font-size="13" fill="#1f2933" text-anchor="middle">Private</text>
  <text x="690" y="465" font-size="13" fill="#1f2933" text-anchor="middle">Subnet</text>
  <text x="690" y="485" font-size="13" fill="#1f2933" text-anchor="middle">(DB)</text>
</svg>