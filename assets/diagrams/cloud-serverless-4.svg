<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SQS + Lambda 버퍼링 패턴</title>
  <desc id="d">생산자가 보낸 메시지를 SQS 큐가 받아두고 Lambda가 폴링해 처리한다. Lambda가 실패하고 재시도 횟수를 초과한 메시지는 DLQ(Dead Letter Queue)로 간다.</desc>
  <rect width="880" height="280" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 정상 흐름 -->
  <rect x="28" y="40" width="110" height="68" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="83" y="80" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">생산자</text>

  <line x1="138" y1="74" x2="186" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="190" y="40" width="160" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="71" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">SQS 큐</text>
  <text x="270" y="94" font-size="14" fill="#374151" text-anchor="middle">속도 차이 흡수</text>

  <line x1="350" y1="74" x2="530" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <text x="440" y="62" font-size="15" fill="#374151" text-anchor="middle">(Lambda가 폴링)</text>

  <rect x="534" y="40" width="140" height="68" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="604" y="80" font-size="18" font-weight="bold" fill="#9a3412" text-anchor="middle">Lambda</text>

  <line x1="674" y1="74" x2="724" y2="74" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="728" y="40" width="124" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="790" y="80" font-size="17" font-weight="bold" fill="#065f46" text-anchor="middle">처리</text>

  <!-- 실패 흐름 -->
  <line x1="604" y1="108" x2="604" y2="190" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="616" y="155" font-size="15" font-weight="bold" fill="#b91c1c">실패</text>

  <path d="M270,108 L270,226 L475,226" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
  <text x="374" y="216" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">재시도 횟수 초과</text>

  <rect x="479" y="194" width="250" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="604" y="220" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">DLQ</text>
  <text x="604" y="243" font-size="15" fill="#b91c1c" text-anchor="middle">(Dead Letter Queue)</text>
</svg>
