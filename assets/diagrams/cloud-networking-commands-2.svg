<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 504" width="880" height="504" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">curl -w 시간 분해</title>
  <desc id="d">curl -w 값은 요청 시작(0)부터의 누적 시각이다. time_namelookup, time_connect, time_appconnect, time_starttransfer, time_total 사이의 구간이 각각 DNS 조회, TCP 핸드셰이크, TLS 핸드셰이크, 서버 처리(TTFB), 본문 전송이며, 어느 구간이 크냐에 따라 원인이 갈리고 대부분은 서버 처리 구간이다.</desc>
  <rect width="880" height="504" fill="#ffffff"/>
  <text x="206" y="44" font-size="15" font-weight="bold" fill="#374151" text-anchor="end">누적 시각</text>
  <text x="250" y="44" font-size="15" font-weight="bold" fill="#374151">구간 · 이 값이 크면</text>
  <text x="618" y="44" font-size="15" font-weight="bold" fill="#374151">원인</text>
  <line x1="24" y1="58" x2="856" y2="58" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="240" y="317" width="616" height="74" fill="#fffbeb"/>
  <line x1="240" y1="164" x2="856" y2="164" stroke="#e5e7eb" stroke-width="1.2"/>
  <line x1="240" y1="240" x2="856" y2="240" stroke="#e5e7eb" stroke-width="1.2"/>
  <line x1="240" y1="316" x2="856" y2="316" stroke="#e5e7eb" stroke-width="1.2"/>
  <line x1="240" y1="392" x2="856" y2="392" stroke="#e5e7eb" stroke-width="1.2"/>
  <line x1="226" y1="96" x2="226" y2="156" stroke="#6d28d9" stroke-width="8"/>
  <line x1="226" y1="172" x2="226" y2="232" stroke="#1d4ed8" stroke-width="8"/>
  <line x1="226" y1="248" x2="226" y2="308" stroke="#047857" stroke-width="8"/>
  <line x1="226" y1="324" x2="226" y2="384" stroke="#b45309" stroke-width="8"/>
  <line x1="226" y1="400" x2="226" y2="460" stroke="#4b5563" stroke-width="8"/>
  <circle cx="226" cy="88" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="206" y="93" font-size="15" fill="#111827" text-anchor="end"><tspan fill="#4b5563">요청 시작 </tspan><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">0</tspan></text>
  <circle cx="226" cy="164" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="206" y="169" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">time_namelookup</text>
  <circle cx="226" cy="240" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="206" y="245" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">time_connect</text>
  <circle cx="226" cy="316" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="206" y="321" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">time_appconnect</text>
  <circle cx="226" cy="392" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="206" y="397" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">time_starttransfer</text>
  <circle cx="226" cy="468" r="6" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="206" y="473" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" font-weight="bold" fill="#111827" text-anchor="end">time_total</text>
  <text x="250" y="121" font-size="17" font-weight="bold" fill="#6d28d9">DNS 조회</text>
  <text x="250" y="145" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#374151">time_namelookup</text>
  <text x="594" y="132" font-size="18" font-weight="bold" fill="#4b5563">→</text>
  <text x="618" y="121" font-size="16" fill="#111827">DNS 서버 지연,</text>
  <text x="618" y="145" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">resolv.conf</tspan> 설정</text>
  <text x="250" y="197" font-size="17" font-weight="bold" fill="#1d4ed8">TCP 핸드셰이크</text>
  <text x="250" y="221" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#374151">time_connect - time_namelookup</text>
  <text x="594" y="208" font-size="18" font-weight="bold" fill="#4b5563">→</text>
  <text x="618" y="208" font-size="16" fill="#111827">네트워크 지연, 거리, 혼잡</text>
  <text x="250" y="273" font-size="17" font-weight="bold" fill="#047857">TLS 핸드셰이크</text>
  <text x="250" y="297" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#374151">time_appconnect - time_connect</text>
  <text x="594" y="284" font-size="18" font-weight="bold" fill="#4b5563">→</text>
  <text x="618" y="284" font-size="16" fill="#111827">TLS 협상 비용, 인증서 체인</text>
  <text x="250" y="349" font-size="17" font-weight="bold" fill="#b45309">서버 처리(TTFB)</text>
  <text x="250" y="373" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#374151">time_starttransfer - time_appconnect</text>
  <text x="594" y="360" font-size="18" font-weight="bold" fill="#4b5563">→</text>
  <text x="618" y="348" font-size="16" fill="#111827" font-weight="bold">서버 애플리케이션이 느림</text>
  <rect x="618" y="358" width="112" height="24" rx="12" fill="#fde68a"/>
  <text x="674" y="375" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">대부분 여기</text>
  <text x="250" y="425" font-size="17" font-weight="bold" fill="#4b5563">본문 전송</text>
  <text x="250" y="449" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#374151">time_total - time_starttransfer</text>
  <text x="594" y="436" font-size="18" font-weight="bold" fill="#4b5563">→</text>
  <text x="618" y="436" font-size="16" fill="#111827">응답 본문이 크거나 대역폭 부족</text>
</svg>
