<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파일 삭제의 실제 동작</title>
  <desc id="d">rm은 디렉터리에서 이름만 제거(unlink)해 inode 링크 수를 1에서 0으로 만든다. 프로세스가 아직 파일을 열고 있으면 이름 없이 열린 채 공간이 유지되어 du로는 안 보이고 df에는 잡히며, 프로세스가 close()하거나 종료해야 실제로 해제된다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="530" fill="#ffffff"/>

  <text x="40" y="42" font-size="19" font-weight="bold" fill="#111827">파일 삭제의 실제 동작</text>

  <!-- 1. 명령 -->
  <circle cx="84" cy="95" r="16" fill="#374151"/>
  <text x="84" y="101" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <rect x="120" y="70" width="640" height="50" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="101" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">rm access.log</text>

  <line x1="440" y1="120" x2="440" y2="146" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2. unlink -->
  <circle cx="84" cy="190" r="16" fill="#1d4ed8"/>
  <text x="84" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <rect x="120" y="150" width="640" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="183" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">디렉터리에서 이름만 제거 (unlink)</text>
  <text x="440" y="213" text-anchor="middle" font-size="16" fill="#1e3a8a">inode의 링크 수 1 → 0</text>

  <!-- 조건 -->
  <line x1="440" y1="230" x2="440" y2="290" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="456" y="266" font-size="17" font-weight="bold" fill="#b45309">그러나 프로세스가 아직 열고 있으면</text>

  <!-- 3. 공간 유지 -->
  <circle cx="84" cy="349" r="16" fill="#b45309"/>
  <text x="84" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <rect x="120" y="294" width="640" height="110" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="327" text-anchor="middle" font-size="19" font-weight="bold" fill="#78350f">이름 없음 + 열린 상태 = 공간 유지</text>
  <rect x="170" y="344" width="250" height="44" rx="6" fill="#ffffff" stroke="#d6a45c" stroke-width="1.2"/>
  <text x="295" y="372" text-anchor="middle" font-size="17" fill="#111827"><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">du</tspan>로는 안 보인다</text>
  <rect x="460" y="344" width="250" height="44" rx="6" fill="#ffffff" stroke="#d6a45c" stroke-width="1.2"/>
  <text x="585" y="372" text-anchor="middle" font-size="17" fill="#111827"><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">df</tspan>에는 잡힌다</text>

  <line x1="440" y1="404" x2="440" y2="440" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- 4. 실제 해제 -->
  <circle cx="84" cy="469" r="16" fill="#047857"/>
  <text x="84" y="475" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <rect x="120" y="444" width="640" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="475" text-anchor="middle" font-size="18" font-weight="bold" fill="#065f46">프로세스가 close()하거나 종료해야 실제 해제</text>
</svg>
