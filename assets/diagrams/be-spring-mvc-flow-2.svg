<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">@Controller와 @RestController의 응답 경로</title>
  <desc id="d">@Controller는 뷰 이름을 반환해 ViewResolver와 View.render를 거쳐 HTML을 응답 본문에 쓰고, @RestController는 반환 객체를 HttpMessageConverter(Jackson)가 JSON으로 바꿔 ViewResolver 없이 응답 본문에 바로 쓴다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 왼쪽: @Controller + 뷰 이름 반환 -->
  <rect x="24" y="24" width="404" height="432" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M25,96 L25,34 Q25,25 34,25 L418,25 Q427,25 427,34 L427,96 Z" fill="#eff6ff"/>
  <line x1="25" y1="96" x2="427" y2="96" stroke="#1d4ed8" stroke-width="1"/>
  <text x="226" y="56" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">@Controller</text>
  <text x="226" y="82" font-size="15" fill="#1f2937" text-anchor="middle">뷰 이름 반환</text>

  <rect x="52" y="120" width="348" height="48" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="226" y="150" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">return "orders/list";</text>
  <line x1="226" y1="170" x2="226" y2="190" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="52" y="192" width="348" height="92" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="226" y="220" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ViewResolver</text>
  <text x="226" y="246" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"orders/list" + prefix/suffix</text>
  <text x="226" y="270" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">→ /WEB-INF/views/orders/list.jsp</text>
  <line x1="226" y1="286" x2="226" y2="306" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="52" y="308" width="348" height="48" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="226" y="338" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">View.render(model, request, response)</text>
  <line x1="226" y1="358" x2="226" y2="378" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="52" y="380" width="348" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="226" y="414" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">HTML 문자열이 응답 본문에 기록됨</text>

  <!-- 오른쪽: @RestController -->
  <rect x="452" y="24" width="404" height="432" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M453,96 L453,34 Q453,25 462,25 L846,25 Q855,25 855,34 L855,96 Z" fill="#f5f3ff"/>
  <line x1="453" y1="96" x2="855" y2="96" stroke="#6d28d9" stroke-width="1"/>
  <text x="654" y="56" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">@RestController</text>
  <text x="654" y="82" font-size="15" fill="#1f2937" text-anchor="middle">= @Controller + @ResponseBody</text>

  <rect x="480" y="120" width="348" height="48" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="654" y="150" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">return new OrderResponse(...);</text>
  <line x1="654" y1="170" x2="654" y2="190" stroke="#6d28d9" stroke-width="2" marker-end="url(#ap)"/>

  <rect x="480" y="192" width="348" height="92" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="654" y="232" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">HttpMessageConverter</text>
  <text x="654" y="258" font-size="15" fill="#1f2937" text-anchor="middle">(Jackson이 객체 → JSON)</text>
  <line x1="654" y1="286" x2="654" y2="378" stroke="#6d28d9" stroke-width="2" marker-end="url(#ap)"/>

  <rect x="672" y="300" width="160" height="64" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="752" y="327" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">ViewResolver를</text>
  <text x="752" y="349" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">거치지 않는다</text>

  <rect x="480" y="380" width="348" height="56" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="654" y="414" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">JSON 문자열이 응답 본문에 직접 기록됨</text>
</svg>
