<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">@Controller와 @RestController의 갈림길</title>
  <desc id="d">@Controller와 @RestController의 처리 흐름 비교 다이어그램</desc>
  <rect width="880" height="570" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Section 1: @Controller -->
  <g id="controller-section">
    <rect x="30" y="24" width="820" height="230" rx="8" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="50" y="52" font-size="14" font-weight="bold" fill="#2563eb">[@Controller + 뷰 이름 반환]</text>

    <!-- Step 1 -->
    <rect x="70" y="70" width="220" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="180" y="92" font-size="13" text-anchor="middle" fill="#1f2933">return "orders/list";</text>

    <!-- Arrow 1 -->
    <path d="M180,106 L180,124" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Step 2 -->
    <rect x="70" y="125" width="220" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="180" y="147" font-size="13" text-anchor="middle" fill="#1f2933">ViewResolver</text>

    <!-- Flow to path details -->
    <path d="M290,143 L330,143" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
    <text x="335" y="147" font-size="13" fill="#52606d">─ "orders/list" + prefix/suffix ─&gt; /WEB-INF/views/orders/list.jsp</text>

    <!-- Arrow 2 -->
    <path d="M180,161 L180,179" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Step 3 -->
    <rect x="70" y="180" width="310" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="225" y="202" font-size="13" text-anchor="middle" fill="#1f2933">View.render(model, request, response)</text>

    <!-- Arrow 3 -->
    <path d="M180,216 L180,234" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- Result Text -->
    <text x="200" y="244" font-size="13" fill="#1f2933">HTML 문자열이 응답 본문에 기록됨</text>
  </g>

  <!-- Section 2: @RestController -->
  <g id="rest-controller-section">
    <rect x="30" y="274" width="820" height="270" rx="8" fill="#f5f3ff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="50" y="302" font-size="14" font-weight="bold" fill="#7c3aed">[@RestController (= @Controller + @ResponseBody)]</text>

    <!-- Step 1 -->
    <rect x="70" y="320" width="270" height="36" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="205" y="342" font-size="13" text-anchor="middle" fill="#1f2933">return new OrderResponse(...);</text>

    <!-- Arrow 1 -->
    <path d="M205,356 L205,374" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

    <!-- Step 2 -->
    <rect x="70" y="375" width="270" height="36" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="205" y="397" font-size="13" text-anchor="middle" fill="#1f2933">HttpMessageConverter</text>

    <!-- Flow to Converter details -->
    <text x="350" y="397" font-size="13" fill="#52606d">(Jackson이 객체 → JSON)</text>

    <!-- Arrow 2 -->
    <path d="M205,411 L205,429" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

    <!-- Result Text -->
    <text x="70" y="449" font-size="13" fill="#1f2933">JSON 문자열이 응답 본문에 직접 기록됨</text>

    <!-- Note Arrow & Text -->
    <path d="M325,445 L355,445" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
    <rect x="360" y="431" width="250" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="370" y="448" font-size="13" font-weight="bold" fill="#d97706">ViewResolver를 거치지 않는다</text>
  </g>
</svg>