<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 900" width="880" height="900" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">자기소개 키워드가 만드는 질문 트리</title>
  <desc id="d">나열형 자기소개는 키워드 6개가 얕게 흩어져 면접관이 가장 약한 키워드를 골라 질문하고 대답이 끊긴다. 압축형 자기소개는 준비된 키워드 두 갈래가 꼬리 질문까지 깊게 이어져 답변을 완료한다.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="900" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="440" y="44" font-size="19" font-weight="bold" fill="#111827" text-anchor="middle">자기소개 키워드가 만드는 질문 트리 — 나열형 vs 압축형</text>

  <!-- 범례 -->
  <rect x="124" y="68" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="148" y="81" font-size="15" fill="#1f2937">준비된 영역 (꼬리 질문 가능)</text>
  <rect x="366" y="68" width="16" height="16" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="390" y="81" font-size="15" fill="#1f2937">설명 못 하는 영역 (약한 노드)</text>
  <rect x="615" y="66" width="24" height="20" rx="5" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="647" y="81" font-size="15" fill="#b91c1c">면접관 공략 타겟</text>

  <!-- 열 머리 -->
  <rect x="24" y="100" width="832" height="32" rx="4" fill="#f3f4f6"/>
  <text x="90" y="121" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">자기소개</text>
  <text x="278" y="121" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">키워드</text>
  <text x="518" y="121" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">면접관 질문</text>
  <text x="752" y="121" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">지원자 답변</text>

  <!-- ===== 안티패턴: 나열형 ===== -->
  <rect x="24" y="144" width="832" height="388" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="172" font-size="17" font-weight="bold" fill="#b91c1c">안티패턴: 나열형 (넓고 얕은 트리)</text>
  <text x="320" y="172" font-size="15" fill="#4b5563">기술 키워드 6개 방치 → 가장 약한 고리 선택 유도</text>

  <!-- 뿌리 -->
  <rect x="40" y="192" width="100" height="252" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="90" y="312" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">나열형</text>
  <text x="90" y="336" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">자기소개</text>

  <!-- 뿌리 → 키워드 6개 -->
  <path d="M140,208 H180" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M140,252 H180" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M140,296 H178" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
  <path d="M140,340 H180" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M140,384 H180" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M140,428 H178" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>

  <!-- 키워드 -->
  <rect x="184" y="192" width="188" height="32" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="278" y="214" font-size="16" fill="#064e3b" text-anchor="middle">자바</text>
  <rect x="184" y="236" width="188" height="32" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="278" y="258" font-size="16" fill="#064e3b" text-anchor="middle">파이썬</text>
  <rect x="180" y="276" width="196" height="40" rx="9" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="184" y="280" width="188" height="32" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="278" y="302" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">C</text>
  <rect x="184" y="324" width="188" height="32" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="278" y="346" font-size="16" fill="#064e3b" text-anchor="middle">리액트</text>
  <rect x="184" y="368" width="188" height="32" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="278" y="390" font-size="16" fill="#064e3b" text-anchor="middle">타입스크립트</text>
  <rect x="180" y="408" width="196" height="40" rx="9" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="184" y="412" width="188" height="32" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="278" y="434" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">Next.js</text>

  <!-- 키워드 → 질문 -->
  <path d="M372,208 H404" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M376,296 H404" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
  <path d="M372,340 H404" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M376,428 H404" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>

  <!-- 면접관 질문 -->
  <rect x="408" y="192" width="220" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="518" y="214" font-size="16" fill="#1f2937" text-anchor="middle">기초 문법 질문</text>
  <rect x="408" y="280" width="220" height="32" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="518" y="302" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">가장 약한 것을 질문</text>
  <rect x="408" y="324" width="220" height="32" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="518" y="346" font-size="16" fill="#1f2937" text-anchor="middle">컴포넌트 질문</text>
  <rect x="408" y="412" width="220" height="32" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="518" y="434" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">선택 이유 질문</text>

  <!-- 질문 → 답변(끊김) -->
  <path d="M628,296 H660" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ah-red)"/>
  <path d="M628,428 H660" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ah-red)"/>
  <rect x="664" y="280" width="176" height="32" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="752" y="302" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">대답 못함 (중단)</text>
  <rect x="664" y="412" width="176" height="32" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="752" y="434" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">대답 못함 (중단)</text>

  <!-- 나열형 요약 -->
  <rect x="40" y="460" width="800" height="56" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="56" y="483" font-size="16" font-weight="bold" fill="#92400e">면접관: "가장 약해 보이는 키워드부터 질문한다"</text>
  <text x="56" y="506" font-size="15" fill="#374151">질문 주도권을 면접관에게 빼앗김</text>

  <!-- ===== 개선: 압축형 ===== -->
  <rect x="24" y="548" width="832" height="264" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="576" font-size="17" font-weight="bold" fill="#047857">개선: 압축형 (좁고 깊은 트리)</text>
  <text x="320" y="576" font-size="15" fill="#4b5563">시험 범위 제안 → 준비된 3단계 꼬리 질문 유도</text>

  <!-- 뿌리 -->
  <rect x="40" y="596" width="100" height="128" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="90" y="654" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">압축형</text>
  <text x="90" y="678" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">자기소개</text>

  <!-- 1행: 프로파일링 / 리렌더링 -->
  <path d="M140,624 H180" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <rect x="184" y="596" width="188" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="278" y="630" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">프로파일링 / 리렌더링</text>
  <path d="M372,624 H404" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <rect x="408" y="596" width="220" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="518" y="619" font-size="16" fill="#064e3b" text-anchor="middle">"원인을 어떻게</text>
  <text x="518" y="641" font-size="16" fill="#064e3b" text-anchor="middle">찾았나요?"</text>
  <path d="M628,624 H660" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <rect x="664" y="596" width="176" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="752" y="619" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">프로파일러 분석</text>
  <text x="752" y="641" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">과정 설명 (완료)</text>

  <!-- 2행: 메모이제이션 / 가상화 -->
  <path d="M140,696 H180" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <rect x="184" y="668" width="188" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="278" y="702" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">메모이제이션 / 가상화</text>
  <path d="M372,696 H404" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <rect x="408" y="668" width="220" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="518" y="691" font-size="16" fill="#064e3b" text-anchor="middle">"가상화는 어떻게</text>
  <text x="518" y="713" font-size="16" fill="#064e3b" text-anchor="middle">구현했나요?"</text>
  <path d="M628,696 H660" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ah-green)"/>
  <rect x="664" y="668" width="176" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="752" y="691" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">렌더링 조건 및</text>
  <text x="752" y="713" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">트레이드오프 (완료)</text>

  <!-- 압축형 요약 -->
  <rect x="40" y="740" width="800" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="56" y="763" font-size="16" font-weight="bold" fill="#065f46">지원자: "내가 준비한 키워드로 질문을 유도한다"</text>
  <text x="56" y="786" font-size="15" fill="#374151">질문 주도권을 확보하여 깊은 실력 입증</text>

  <!-- 결론 -->
  <text x="440" y="846" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">결론:</tspan> 자기소개에 심는 키워드는 다음 질문의 범위를 결정하므로,</text>
  <text x="440" y="872" font-size="16" fill="#111827" text-anchor="middle">3단계 꼬리 질문까지 답변 가능한 핵심 기술만 압축해 던져야 한다.</text>
</svg>
