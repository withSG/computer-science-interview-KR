<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">자기소개 키워드가 만드는 질문 트리 — 나열형 vs 압축형</title>
  <desc id="d">나열형 자기소개는 여러 키워드가 약한 질문 가지로 산발되고, 압축형 자기소개는 핵심 키워드가 깊은 꼬리 질문 가지로 이어진다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 메인 제목 -->
  <text x="440" y="36" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">자기소개 키워드가 만드는 질문 트리 — 나열형 vs 압축형</text>

  <!-- 범례 (Legend) -->
  <rect x="180" y="55" width="520" height="30" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <rect x="200" y="64" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="218" y="74" font-size="11.5" font-weight="400" fill="#1f2933">준비된 영역 (꼬리 질문 가능)</text>

  <rect x="380" y="64" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="398" y="74" font-size="11.5" font-weight="400" fill="#1f2933">설명 못 하는 영역 (약한 노드)</text>

  <circle cx="566" cy="70" r="5" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="2 2"/>
  <text x="576" y="74" font-size="11.5" font-weight="400" fill="#dc2626">면접관 공략 타겟</text>

  <!-- 구역 구분 카드 (왼쪽: 나열형) -->
  <rect x="20" y="100" width="412" height="380" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="226" y="125" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">안티패턴: 나열형 (넓고 얕은 트리)</text>
  <text x="226" y="142" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">기술 키워드 6개 방치 → 가장 약한 고리 선택 유도</text>

  <!-- 나열형 노드 및 화살표 -->
  <!-- 뿌리 노드 -->
  <rect x="136" y="160" width="180" height="30" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="226" y="179" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">나열형 자기소개</text>

  <!-- 가지 화살표 (1단) -->
  <path d="M170,190 L50,220" stroke="#cbd2d9" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M190,190 L110,220" stroke="#cbd2d9" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M210,190 L172,220" stroke="#cbd2d9" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M242,190 L231,220" stroke="#cbd2d9" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M262,190 L309,220" stroke="#cbd2d9" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M282,190 L393,220" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- 1단 노드들 (키워드 6개) -->
  <!-- 자바 -->
  <rect x="30" y="220" width="40" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="50" y="237" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">자바</text>

  <!-- 파이썬 -->
  <rect x="86" y="220" width="48" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="110" y="237" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">파이썬</text>

  <!-- C -->
  <rect x="154" y="220" width="36" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="172" y="237" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">C</text>
  <!-- 약한 노드 강조 점선 링 -->
  <rect x="150" y="216" width="44" height="34" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 리액트 -->
  <rect x="207" y="220" width="48" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="231" y="237" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">리액트</text>

  <!-- 타입스크립트 -->
  <rect x="267" y="220" width="84" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="309" y="237" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">타입스크립트</text>

  <!-- Next.js -->
  <rect x="368" y="220" width="50" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="393" y="237" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">Next.js</text>
  <rect x="364" y="216" width="58" height="34" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 1단에서 2단으로 연결 (짧은 질문 후 중단) -->
  <path d="M50,246 L50,290" stroke="#cbd2d9" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M175,246 L175,290" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <path d="M235,246 L262,290" stroke="#cbd2d9" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M390,246 L390,290" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- 2단 노드들 -->
  <!-- 기초 문법 질문 -->
  <rect x="28" y="290" width="86" height="28" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="71" y="308" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle">기초 문법 질문</text>

  <!-- 가장 약한 것을 질문 -->
  <rect x="123" y="290" width="112" height="28" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="179" y="308" font-size="11.5" font-weight="500" fill="#dc2626" text-anchor="middle">가장 약한 것을 질문</text>

  <!-- 컴포넌트 질문 -->
  <rect x="244" y="290" width="84" height="28" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="286" y="308" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle">컴포넌트 질문</text>

  <!-- 선택 이유 질문 -->
  <rect x="338" y="290" width="86" height="28" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="381" y="308" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="middle">선택 이유 질문</text>

  <!-- 2단에서 끊김 표기 -->
  <path d="M179,318 L179,350" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <rect x="131" y="350" width="96" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="179" y="367" font-size="11.5" font-weight="500" fill="#dc2626" text-anchor="middle">대답 못함 (중단)</text>

  <path d="M376,318 L376,350" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <rect x="328" y="350" width="96" height="26" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="376" y="367" font-size="11.5" font-weight="500" fill="#dc2626" text-anchor="middle">대답 못함 (중단)</text>

  <!-- 나열형 요약 라벨 -->
  <rect x="44" y="415" width="364" height="45" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="226" y="433" font-size="11.5" font-weight="500" fill="#d97706" text-anchor="middle">면접관: "가장 약해 보이는 키워드부터 질문한다"</text>
  <text x="226" y="449" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">질문 주도권을 면접관에게 빼앗김</text>

  <!-- 구역 구분 카드 (오른쪽: 압축형) -->
  <rect x="448" y="100" width="412" height="380" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="654" y="125" font-size="14" font-weight="600" fill="#1f2933" text-anchor="middle">개선: 압축형 (좁고 깊은 트리)</text>
  <text x="654" y="142" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">시험 범위 제안 → 준비된 3단계 꼬리 질문 유도</text>

  <!-- 압축형 노드 및 화살표 -->
  <!-- 뿌리 노드 -->
  <rect x="564" y="160" width="180" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="654" y="179" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">압축형 자기소개</text>

  <!-- 가지 화살표 (1단) -->
  <path d="M620,190 L550,220" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <path d="M688,190 L753,220" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>

  <!-- 1단 노드들 (핵심 키워드 2개) -->
  <rect x="486" y="220" width="128" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="238" font-size="12" font-weight="500" fill="#1f2933" text-anchor="middle">프로파일링 / 리렌더링</text>

  <rect x="689" y="220" width="128" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="753" y="238" font-size="12" font-weight="500" fill="#1f2933" text-anchor="middle">메모이제이션 / 가상화</text>

  <!-- 가지 화살표 (2단) -->
  <path d="M550,248 L550,285" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M753,248 L753,285" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 2단 노드들 (꼬리 질문 1단계) -->
  <rect x="470" y="285" width="160" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="303" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">"원인을 어떻게 찾았나요?"</text>

  <rect x="665" y="285" width="176" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="753" y="303" font-size="11.5" font-weight="500" fill="#1f2933" text-anchor="middle">"가상화는 어떻게 구현했나요?"</text>

  <!-- 가지 화살표 (3단) -->
  <path d="M550,313 L550,350" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <path d="M753,313 L753,350" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- 3단 노드들 (꼬리 질문 2단계 - 근거 증명) -->
  <rect x="456" y="350" width="188" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550" y="368" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">프로파일러 분석 과정 설명 (완료)</text>

  <rect x="654" y="350" width="198" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="753" y="368" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">렌더링 조건 및 트레이드오프 (완료)</text>

  <!-- 압축형 요약 라벨 -->
  <rect x="472" y="415" width="364" height="45" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="654" y="433" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">지원자: "내가 준비한 키워드로 질문을 유도한다"</text>
  <text x="654" y="449" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">질문 주도권을 확보하여 깊은 실력 입증</text>

  <!-- 하단 결론 캡션 -->
  <text x="440" y="512" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">결론: 자기소개에 심는 키워드는 다음 질문의 범위를 결정하므로, 3단계 꼬리 질문까지 답변 가능한 핵심 기술만 압축해 던져야 한다.</text>
</svg>