<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">재귀 호출 스택의 공간</title>
  <desc id="d">n = 4일 때 재귀 factorial은 factorial(4)부터 factorial(1)까지 스택 프레임 4개가 쌓이고 factorial(1)에서 처음 return한다. 깊이 n만큼 쌓이므로 공간 O(n)이고 n이 10만이면 StackOverflowError가 난다. 반복 버전은 프레임이 하나뿐이라 공간 O(1)이다.</desc>
  <rect width="880" height="390" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 재귀 버전 -->
  <text x="40" y="42" font-size="18" font-weight="bold" fill="#111827">재귀 버전의 스택 (n = 4)</text>

  <!-- 깊이 괄호 -->
  <text x="148" y="178" font-size="17" font-weight="bold" fill="#111827" text-anchor="end">깊이 n</text>
  <text x="148" y="202" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="end">→ 공간 O(n)</text>
  <path d="M170,72 L160,72 L160,300 L170,300" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- 프레임 -->
  <rect x="180" y="72" width="220" height="52" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="180" y="130" width="220" height="52" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="180" y="188" width="220" height="52" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="180" y="246" width="220" height="52" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <g font-size="17" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="290" y="104" font-weight="bold" fill="#1e3a8a">factorial(1)</text>
    <text x="290" y="162" fill="#111827">factorial(2)</text>
    <text x="290" y="220" fill="#111827">factorial(3)</text>
    <text x="290" y="278" fill="#111827">factorial(4)</text>
  </g>
  <line x1="172" y1="308" x2="408" y2="308" stroke="#374151" stroke-width="3"/>

  <!-- 처음 return -->
  <line x1="450" y1="98" x2="408" y2="98" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="458" y="104" font-size="16" font-weight="bold" fill="#1d4ed8">여기서 처음 return</text>

  <!-- 경고 -->
  <rect x="180" y="326" width="300" height="40" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="196" y="352" font-size="16" fill="#b91c1c">n이 10만이면 <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">StackOverflowError</tspan></text>

  <!-- 구분선 -->
  <line x1="630" y1="30" x2="630" y2="366" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 반복 버전 비교 -->
  <text x="652" y="42" font-size="17" font-weight="bold" fill="#374151">비교: 반복 버전</text>
  <text x="652" y="172" font-size="15" fill="#374151">반복문은 프레임이</text>
  <text x="652" y="194" font-size="15" fill="#374151">안 쌓인다</text>
  <text x="652" y="228" font-size="17" font-weight="bold" fill="#047857">→ 공간 O(1)</text>
  <rect x="652" y="246" width="196" height="52" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="750" y="278" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">factorialIter(4)</text>
  <line x1="644" y1="308" x2="856" y2="308" stroke="#374151" stroke-width="3"/>
</svg>
