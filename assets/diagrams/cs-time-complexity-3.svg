<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">공간 복잡도 - 재귀 버전의 스택 (n = 4)</title>
  <desc id="d">재귀 함수 factorial(n) 호출 시 스택 프레임이 쌓이는 구조와 깊이에 따른 공간 복잡도 O(n)을 보여주는 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="380" fill="#ffffff"/>

  <!-- Main Title Block (Headings from Document) -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">재귀 버전의 스택 (n = 4)</text>

  <!-- Stack Outer Container Background & Outer Line -->
  <rect x="50" y="60" width="280" height="240" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>

  <!-- Stack Frames (Top to Bottom) -->
  <!-- Top Frame: factorial(1) - Highlighted (처음 return 하는 지점) -->
  <rect x="50" y="60" width="280" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="98.2" font-size="14" font-weight="bold" fill="#2563eb">factorial(1)</text>

  <!-- Second Frame: factorial(2) -->
  <line x1="50" y1="120" x2="330" y2="120" stroke="#cbd2d9" stroke-width="1.5"/>
  <rect x="50" y="120" width="280" height="60" fill="#ffffff"/>
  <text x="70" y="158.2" font-size="14" fill="#1f2933">factorial(2)</text>

  <!-- Third Frame: factorial(3) -->
  <line x1="50" y1="180" x2="330" y2="180" stroke="#cbd2d9" stroke-width="1.5"/>
  <rect x="50" y="180" width="280" height="60" fill="#ffffff"/>
  <text x="70" y="218.2" font-size="14" fill="#1f2933">factorial(3)</text>

  <!-- Bottom Frame: factorial(4) -->
  <line x1="50" y1="240" x2="330" y2="240" stroke="#cbd2d9" stroke-width="1.5"/>
  <rect x="50" y="240" width="280" height="60" fill="#ffffff"/>
  <text x="70" y="278.2" font-size="14" fill="#1f2933">factorial(4)</text>

  <!-- Arrow & Annotation 1: factorial(1) (← 여기서 처음 return) -->
  <path d="M410,90 L338,90" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="420" y="94.2" font-size="13" font-weight="bold" fill="#2563eb">← 여기서 처음 return</text>

  <!-- Annotation 2: Depth and Space Complexity (깊이 n → 공간 O(n)) -->
  <!-- Visual bracket/indicator for stack depth -->
  <path d="M345,60 L355,60 L355,180 L365,180 L355,180 L355,300 L345,300" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <text x="380" y="184.2" font-size="14" font-weight="bold" fill="#1f2933">깊이 n → 공간 O(n)</text>

  <!-- Bottom Footnote Annotation (n이 10만이면 StackOverflowError) -->
  <text x="50" y="338.2" font-size="13" font-weight="bold" fill="#dc2626">n이 10만이면 StackOverflowError</text>
</svg>