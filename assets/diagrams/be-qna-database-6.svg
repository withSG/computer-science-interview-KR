<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">갱신 이상 (Update Anomaly)</title>
  <desc id="d">CS 학과명 변경 시 발생 데이터 불일치 예시를 설명하는 테이블 및 주석 다이어그램</desc>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 메인 콘테이너 영역 (회색 배경) -->
  <rect x="24" y="20" width="832" height="350" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 상단 설명 텍스트 (문제 문구 및 설명) -->
  <text x="44" y="52" font-size="14" font-weight="bold" fill="#dc2626">문제: 일부 행만 수정하면 데이터 불일치 발생</text>

  <text x="44" y="86" font-size="13" fill="#1f2933">CS 학과명을 "컴퓨터공학" → "소프트웨어공학"으로 변경 시</text>
  <text x="44" y="110" font-size="13" fill="#52606d">→ 김철수의 첫 번째 행만 수정하면 두 번째 행과 불일치</text>

  <!-- 표 헤더 영역 -->
  <g transform="translate(44, 135)">
    <!-- Header Row Background -->
    <rect x="0" y="0" width="792" height="36" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1"/>

    <!-- Separators for Header -->
    <line x1="100" y1="0" x2="100" y2="36" stroke="#9aa5b1" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="36" stroke="#9aa5b1" stroke-width="1"/>
    <line x1="310" y1="0" x2="310" y2="36" stroke="#9aa5b1" stroke-width="1"/>
    <line x1="510" y1="0" x2="510" y2="36" stroke="#9aa5b1" stroke-width="1"/>

    <!-- Header Text -->
    <text x="50" y="22" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학생ID</text>
    <text x="150" y="22" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학생명</text>
    <text x="255" y="22" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학과코드</text>
    <text x="410" y="22" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">학과명</text>
    <text x="651" y="22" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">과목코드</text>

    <!-- Table Row 1 (수정됨 - 초록 계열) -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="792" height="40" fill="#ecfdf5" stroke="#9aa5b1" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="40" stroke="#9aa5b1" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="40" stroke="#9aa5b1" stroke-width="1"/>
      <line x1="310" y1="0" x2="310" y2="40" stroke="#9aa5b1" stroke-width="1"/>
      <line x1="510" y1="0" x2="510" y2="40" stroke="#9aa5b1" stroke-width="1"/>

      <text x="50" y="24" font-size="13" fill="#1f2933" text-anchor="middle">1001</text>
      <text x="150" y="24" font-size="13" fill="#1f2933" text-anchor="middle">김철수</text>
      <text x="255" y="24" font-size="13" fill="#1f2933" text-anchor="middle">CS</text>
      <text x="410" y="24" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">소프트웨어공학</text>
      <text x="651" y="24" font-size="13" fill="#1f2933" text-anchor="middle">C001</text>

      <!-- Row 1 Note -->
      <path d="M 685 20 L 700 20" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
      <text x="708" y="24" font-size="12" font-weight="bold" fill="#059669">수정됨</text>
    </g>

    <!-- Table Row 2 (수정 안됨 - 빨강 계열) -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="792" height="40" fill="#fef2f2" stroke="#9aa5b1" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="40" stroke="#9aa5b1" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="40" stroke="#9aa5b1" stroke-width="1"/>
      <line x1="310" y1="0" x2="310" y2="40" stroke="#9aa5b1" stroke-width="1"/>
      <line x1="510" y1="0" x2="510" y2="40" stroke="#9aa5b1" stroke-width="1"/>

      <text x="50" y="24" font-size="13" fill="#1f2933" text-anchor="middle">1001</text>
      <text x="150" y="24" font-size="13" fill="#1f2933" text-anchor="middle">김철수</text>
      <text x="255" y="24" font-size="13" fill="#1f2933" text-anchor="middle">CS</text>
      <text x="410" y="24" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">컴퓨터공학</text>
      <text x="651" y="24" font-size="13" fill="#1f2933" text-anchor="middle">C002</text>

      <!-- Row 2 Note -->
      <path d="M 685 20 L 700 20" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
      <text x="708" y="24" font-size="12" font-weight="bold" fill="#dc2626">수정 안됨</text>
    </g>
  </g>

  <!-- 하단 불일치 화살표 및 강조 표시 -->
  <g transform="translate(44, 275)">
    <path d="M 765 0 L 775 0 L 775 25 L 760 25" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <rect x="700" y="15" width="55" height="20" fill="#fef2f2" rx="3"/>
    <text x="755" y="29" font-size="13" font-weight="bold" fill="#dc2626">불일치!</text>
  </g>
</svg>