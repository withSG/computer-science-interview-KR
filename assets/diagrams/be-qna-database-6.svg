<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">갱신 이상 예시</title>
  <desc id="d">CS 학과명을 컴퓨터공학에서 소프트웨어공학으로 바꿀 때 김철수(1001)의 첫 번째 행(C001)만 수정하고 두 번째 행(C002)은 수정하지 않아, 같은 학생의 두 행이 서로 다른 학과명을 갖는 불일치를 보여준다.</desc>
  <rect width="880" height="330" fill="#ffffff"/>

  <!-- 문제 -->
  <rect x="24" y="24" width="832" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="40" y="36" width="54" height="24" rx="12" fill="#b91c1c"/>
  <text x="67" y="53" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">문제</text>
  <text x="108" y="54" font-size="17" font-weight="bold" fill="#111827">일부 행만 수정하면 데이터 불일치 발생</text>

  <!-- 상황 -->
  <text x="24" y="110" font-size="17" font-weight="bold" fill="#111827">CS 학과명을 "컴퓨터공학" → "소프트웨어공학"으로 변경 시</text>
  <text x="24" y="140" font-size="16" fill="#374151">→ 김철수의 첫 번째 행만 수정하면 두 번째 행과 불일치</text>

  <!-- 표 -->
  <rect x="24" y="162" width="608" height="44" fill="#e5e7eb"/>
  <rect x="336" y="206" width="184" height="48" fill="#ecfdf5"/>
  <rect x="336" y="254" width="184" height="48" fill="#fef2f2"/>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="24" y1="254" x2="632" y2="254"/>
    <line x1="124" y1="162" x2="124" y2="302"/>
    <line x1="224" y1="162" x2="224" y2="302"/>
    <line x1="336" y1="162" x2="336" y2="302"/>
    <line x1="520" y1="162" x2="520" y2="302"/>
  </g>
  <line x1="24" y1="206" x2="632" y2="206" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="24" y="162" width="608" height="140" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <g font-size="16" font-weight="bold" fill="#111827">
    <text x="38" y="190">학생ID</text>
    <text x="138" y="190">학생명</text>
    <text x="238" y="190">학과코드</text>
    <text x="350" y="190">학과명</text>
    <text x="534" y="190">과목코드</text>
  </g>

  <g font-size="16" fill="#111827">
    <text x="38" y="236">1001</text>
    <text x="138" y="236">김철수</text>
    <text x="238" y="236">CS</text>
    <text x="534" y="236">C001</text>

    <text x="38" y="284">1001</text>
    <text x="138" y="284">김철수</text>
    <text x="238" y="284">CS</text>
    <text x="534" y="284">C002</text>
  </g>
  <text x="350" y="236" font-size="16" font-weight="bold" fill="#047857">소프트웨어공학</text>
  <text x="350" y="284" font-size="16" font-weight="bold" fill="#b91c1c">컴퓨터공학</text>

  <!-- 행별 표시 -->
  <text x="648" y="236" font-size="16" font-weight="bold" fill="#047857">← 수정됨</text>
  <text x="648" y="284" font-size="16" font-weight="bold" fill="#b91c1c">← 수정 안됨</text>
  <path d="M748,220 H758 V288 H748" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="770" y="261" font-size="19" font-weight="bold" fill="#b91c1c">불일치!</text>
</svg>
