<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">원시 타입과 참조 타입의 저장</title>
  <desc id="d">example 프레임의 score에는 값 90이 그대로, user에는 Heap에 있는 User 객체의 주소 0x7f3a만 들어 있다. User 객체의 name 필드는 다시 주소 0x91f2로 String "kim"을 가리키고, age에는 30이 들어 있다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- ===== JVM Stack ===== -->
  <rect x="24" y="24" width="384" height="402" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#111827">JVM Stack<tspan font-size="16" font-weight="normal" fill="#4b5563"> (example 프레임)</tspan></text>

  <rect x="48" y="90" width="336" height="160" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <rect x="149" y="91" width="234" height="78" fill="#ecfdf5"/>
  <rect x="149" y="171" width="234" height="78" fill="#eff6ff"/>
  <line x1="48" y1="170" x2="384" y2="170" stroke="#475569" stroke-width="1.5"/>
  <line x1="148" y1="90" x2="148" y2="250" stroke="#475569" stroke-width="1.5"/>

  <!-- score -->
  <text x="98" y="136" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">score</text>
  <text x="266" y="128" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">90</text>
  <text x="266" y="155" font-size="15" fill="#047857" text-anchor="middle">(값이 그대로)</text>

  <!-- user -->
  <text x="98" y="216" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">user</text>
  <text x="250" y="207" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">0x7f3a</text>
  <text x="250" y="235" font-size="15" fill="#1d4ed8" text-anchor="middle">(주소만)</text>

  <!-- 범례 -->
  <rect x="48" y="296" width="18" height="18" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="78" y="311" font-size="15" fill="#111827">원시 타입: 실제 값이 그대로</text>
  <line x1="48" y1="344" x2="70" y2="344" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="78" y="349" font-size="15" fill="#111827">참조 타입: 객체의 주소(참조)</text>

  <!-- ===== Heap ===== -->
  <rect x="452" y="24" width="404" height="402" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="472" y="56" font-size="18" font-weight="bold" fill="#111827">Heap</text>

  <!-- User 객체 -->
  <rect x="488" y="180" width="300" height="128" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <path d="M488,220 V184 A4,4 0 0 1 492,180 H784 A4,4 0 0 1 788,184 V220 Z" fill="#e2e8f0"/>
  <text x="638" y="206" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">User 객체</text>
  <rect x="569" y="221" width="218" height="42" fill="#eff6ff"/>
  <rect x="569" y="265" width="218" height="42" fill="#ecfdf5"/>
  <line x1="488" y1="220" x2="788" y2="220" stroke="#475569" stroke-width="1.5"/>
  <line x1="488" y1="264" x2="788" y2="264" stroke="#475569" stroke-width="1.5"/>
  <line x1="568" y1="220" x2="568" y2="308" stroke="#475569" stroke-width="1.5"/>
  <text x="528" y="248" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">name</text>
  <text x="646" y="248" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">0x91f2</text>
  <text x="528" y="292" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">age</text>
  <text x="646" y="292" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">30</text>

  <!-- String "kim" -->
  <rect x="488" y="350" width="300" height="48" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="638" y="380" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">String <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">"kim"</tspan></text>

  <!-- 참조 화살표 -->
  <line x1="296" y1="200" x2="486" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M692,242 H824 V374 H792" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
</svg>
