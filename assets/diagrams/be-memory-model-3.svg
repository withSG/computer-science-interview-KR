<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">원시 타입 vs 참조 타입 메모리 구조</title>
  <desc id="d">JVM Stack 프레임의 변수들과 Heap 영역의 User 객체 및 String 객체 간의 참조 관계를 보여주는 다이어그램입니다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커 (파랑 / 참조선용) -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <!-- 화살표 마커 (보라 / 내부 참조선용) -->
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 영역 배경 및 그룹 라벨 -->
  <!-- 1. JVM Stack 영역 -->
  <rect x="30" y="30" width="370" height="320" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5" rx="8"/>
  <text x="50" y="60" font-size="16" font-weight="bold" fill="#1f2933">JVM Stack (example 프레임)</text>

  <!-- 2. Heap 영역 -->
  <rect x="440" y="30" width="410" height="320" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5" rx="8"/>
  <text x="460" y="60" font-size="16" font-weight="bold" fill="#1f2933">Heap</text>

  <!-- Stack 영역 내부 박스 (스택 프레임) -->
  <!-- score 행 -->
  <rect x="50" y="90" width="120" height="90" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="110" y="140" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">score</text>

  <rect x="170" y="90" width="230" height="90" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="285" y="125" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">90</text>
  <text x="285" y="155" font-size="11.5" fill="#52606d" text-anchor="middle">(값이 그대로)</text>

  <!-- user 행 -->
  <rect x="50" y="180" width="120" height="90" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="230" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">user</text>

  <rect x="170" y="180" width="230" height="90" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="285" y="215" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">0x7f3a</text>
  <text x="285" y="245" font-size="11.5" fill="#52606d" text-anchor="middle">(주소만)</text>

  <!-- Heap 영역 내부 객체들 -->
  <!-- User 객체 -->
  <g transform="translate(470, 90)">
    <!-- User 객체 헤더 -->
    <rect x="0" y="0" width="260" height="35" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="bold" fill="#2563eb">User 객체</text>

    <!-- name 행 -->
    <rect x="0" y="35" width="80" height="35" fill="#f5f3ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="40" y="57" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">name</text>

    <rect x="80" y="35" width="180" height="35" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="130" y="57" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">0x91f2</text>

    <!-- age 행 -->
    <rect x="0" y="70" width="80" height="35" fill="#ecfdf5" stroke="#2563eb" stroke-width="1.5"/>
    <text x="40" y="92" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">age</text>

    <rect x="80" y="70" width="180" height="35" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="170" y="92" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">30</text>
  </g>

  <!-- String "kim" 객체 -->
  <g transform="translate(470, 245)">
    <rect x="0" y="0" width="260" height="45" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="20" y="27" font-size="13" font-weight="bold" fill="#7c3aed">String "kim"</text>
  </g>

  <!-- 화살표 연결선 -->
  <!-- 1. user (0x7f3a) -> User 객체 -->
  <path d="M 330,225 L 461,225" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 2. name (0x91f2) -> String "kim" 객체 -->
  <path d="M 685,142.5 L 760,142.5 L 760,267.5 L 739,267.5" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
</svg>