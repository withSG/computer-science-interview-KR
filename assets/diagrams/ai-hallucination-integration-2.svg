<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Prompt Engineering·RAG·Fine-tuning 결정 순서</title>
  <desc id="d">출력이 마음에 안 들 때 내용이 틀렸는지, 형식이나 톤이 문제인지로 먼저 나누고, 원인에 따라 RAG, Prompt Engineering, Few-shot, Fine-tuning(마지막 수단)을 고르는 결정 트리.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 연결선 -->
  <g fill="none" stroke="#4b5563" stroke-width="2">
    <path d="M440,72 V96 H226 V117" marker-end="url(#arr)"/>
    <path d="M440,72 V96 H664 V117" marker-end="url(#arr)"/>
    <path d="M226,168 V192 H116 V213" marker-end="url(#arr)"/>
    <path d="M226,168 V192 H336 V213" marker-end="url(#arr)"/>
    <path d="M664,168 V192 H564 V213" marker-end="url(#arr)"/>
    <path d="M664,168 V192 H764 V213" marker-end="url(#arr)"/>
    <path d="M116,280 V317" marker-end="url(#arr)"/>
    <path d="M336,280 V317" marker-end="url(#arr)"/>
    <path d="M564,280 V317" marker-end="url(#arr)"/>
    <path d="M764,280 V317" marker-end="url(#arr)"/>
  </g>

  <!-- 출발점 -->
  <rect x="290" y="24" width="300" height="48" rx="24" fill="#1f2937"/>
  <text x="440" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">출력이 마음에 안 든다</text>

  <!-- 첫 질문 -->
  <rect x="96" y="120" width="260" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="226" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">내용이 틀렸나?</text>
  <rect x="534" y="120" width="260" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="664" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">형식/톤이 문제인가?</text>

  <!-- 원인 -->
  <rect x="24" y="216" width="184" height="64" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="116" y="243" text-anchor="middle" font-size="16" fill="#111827"><tspan x="116">모델이 알 리</tspan><tspan x="116" dy="22">없는 정보다</tspan></text>
  <rect x="224" y="216" width="224" height="64" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="336" y="243" text-anchor="middle" font-size="16" fill="#111827"><tspan x="336">지시가 모호</tspan><tspan x="336" dy="22">했을 뿐이다</tspan></text>
  <rect x="472" y="216" width="184" height="64" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="564" y="243" text-anchor="middle" font-size="16" fill="#111827"><tspan x="564">예시 몇 개로</tspan><tspan x="564" dy="22">고쳐지나?</tspan></text>
  <rect x="672" y="216" width="184" height="64" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="764" y="243" text-anchor="middle" font-size="16" fill="#111827"><tspan x="764">예시로는 안 되고</tspan><tspan x="764" dy="22">일관성이 계속 필요</tspan></text>

  <!-- 선택 -->
  <rect x="24" y="320" width="184" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="116" y="358" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">RAG</text>
  <rect x="224" y="320" width="224" height="64" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="336" y="358" text-anchor="middle" font-size="18" font-weight="700" fill="#064e3b">Prompt Engineering</text>
  <rect x="472" y="320" width="184" height="64" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="564" y="358" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Few-shot</text>
  <rect x="672" y="320" width="184" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="764" y="347" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Fine-tuning</text>
  <text x="764" y="371" text-anchor="middle" font-size="15" fill="#78350f">(마지막 수단)</text>
</svg>
