  <text x="556" y="197" font-size="16" fill="#b91c1c"><tspan font-weight="bold">검증 오차</tspan> (내려오다 금세 멈춘다)</text>
  <text x="556" y="227" font-size="16" fill="#1d4ed8"><tspan font-weight="bold">학습 오차</tspan> (샘플이 늘수록 올라간다)</text>
  <path d="M288,262 L288,233" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text x="272" y="286" font-size="16" font-weight="bold" fill="#111827">두 곡선이 “높은 값”에서 일찍 붙어버린다</text>
  <text x="272" y="310" font-size="15" fill="#374151">모델이 표현할 수 있는 한계에 이미 도달했다는 뜻</text>

  <!-- 증상 B: 고분산 -->
  <rect x="24" y="410" width="832" height="356" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="446" font-size="19" font-weight="bold" fill="#6d28d9">[증상 B] 고분산<tspan fill="#111827" font-weight="normal"> — 데이터를 더 모으면 </tspan><tspan fill="#047857">좋아진다</tspan></text>
  <text x="84" y="480" font-size="16" font-weight="bold" fill="#374151">오차</text>
  <path d="M96,730 L96,490" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ax)"/>
  <path d="M96,730 L548,730" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ax)"/>
