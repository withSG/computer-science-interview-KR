<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 790" width="880" height="790" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">학습 데이터 양에 따른 학습 곡선</title>
  <desc id="d">증상 A 고편향에서는 검증 오차와 학습 오차가 높은 값에서 일찍 붙어 데이터를 더 모아도 소용없다. 증상 B 고분산에서는 학습 오차는 바닥에 붙어 있고 검증 오차는 아직 내려가는 중이어서 넓은 간격이 천천히 좁혀지므로 데이터를 더 모으면 좋아진다.</desc>
  <rect width="880" height="790" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- 증상 A: 고편향 -->
  <rect x="24" y="24" width="832" height="356" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="60" font-size="19" font-weight="bold" fill="#b45309">[증상 A] 고편향<tspan fill="#111827" font-weight="normal"> — 데이터를 더 모아도 </tspan><tspan fill="#b91c1c">소용없다</tspan></text>
  <text x="84" y="94" font-size="16" font-weight="bold" fill="#374151">오차</text>
  <path d="M96,344 L96,104" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ax)"/>
  <path d="M96,344 L548,344" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ax)"/>
  <text x="548" y="370" font-size="16" font-weight="bold" fill="#374151" text-anchor="end">학습 데이터 양</text>
