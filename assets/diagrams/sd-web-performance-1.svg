<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">클릭부터 최종 화면까지 사용자가 겪는 시간</title>
  <desc id="d">클릭 후 DNS 조회, TCP + TLS 연결, HTML 요청과 서버 처리(200ms)와 첫 바이트 도착(TTFB), HTML 파싱과 CSS/JS 재요청, JS 실행과 프레임워크 부팅·데이터 요청·렌더, 이미지·폰트 로드와 최종 화면까지 여섯 단계가 차례로 이어진다. 서버 처리는 사용자가 "됐다"고 느끼기까지의 전체 중 한 칸뿐이다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-spine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="590" fill="#ffffff"/>

  <!-- 요점 캡션 -->
  <text x="24" y="38" font-size="18" font-weight="bold" fill="#111827">서버 처리(200ms)는 클릭부터 최종 화면까지의 일부일 뿐</text>

  <!-- 시작: 클릭 -->
  <rect x="24" y="64" width="72" height="36" rx="18" fill="#1f2937"/>
  <text x="60" y="88" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">클릭</text>

  <!-- 세로 척추(시간 순서) -->
  <line x1="60" y1="102" x2="60" y2="134" stroke="#374151" stroke-width="2" marker-end="url(#ah-spine)"/>
  <line x1="60" y1="166" x2="60" y2="196" stroke="#374151" stroke-width="2" marker-end="url(#ah-spine)"/>
  <line x1="60" y1="228" x2="60" y2="258" stroke="#374151" stroke-width="2" marker-end="url(#ah-spine)"/>
  <line x1="60" y1="290" x2="60" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#ah-spine)"/>
  <line x1="60" y1="352" x2="60" y2="382" stroke="#374151" stroke-width="2" marker-end="url(#ah-spine)"/>
  <line x1="60" y1="414" x2="60" y2="444" stroke="#374151" stroke-width="2" marker-end="url(#ah-spine)"/>

  <!-- 단계 번호 -->
  <circle cx="60" cy="150" r="14" fill="#374151"/>
  <text x="60" y="155" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="60" cy="212" r="14" fill="#374151"/>
  <text x="60" y="217" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="60" cy="274" r="14" fill="#374151"/>
  <text x="60" y="279" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="60" cy="336" r="14" fill="#374151"/>
  <text x="60" y="341" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="60" cy="398" r="14" fill="#374151"/>
  <text x="60" y="403" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="60" cy="460" r="14" fill="#374151"/>
  <text x="60" y="465" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

  <!-- 번호 → 첫 박스 연결 -->
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="75" y1="150" x2="99" y2="150"/>
    <line x1="75" y1="212" x2="99" y2="212"/>
    <line x1="75" y1="274" x2="99" y2="274"/>
    <line x1="75" y1="336" x2="99" y2="336"/>
    <line x1="75" y1="398" x2="99" y2="398"/>
    <line x1="75" y1="460" x2="99" y2="460"/>
  </g>

  <!-- 1. DNS 조회 -->
  <rect x="100" y="130" width="104" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="152" y="156" font-size="16" fill="#1f2937" text-anchor="middle">DNS 조회</text>

  <!-- 2. TCP + TLS 연결 -->
  <rect x="100" y="192" width="150" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="175" y="218" font-size="16" fill="#1f2937" text-anchor="middle">TCP + TLS 연결</text>

  <!-- 3. HTML 요청 → 서버 처리 → TTFB -->
  <rect x="100" y="254" width="116" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="158" y="280" font-size="16" fill="#1f2937" text-anchor="middle">HTML 요청</text>
  <line x1="220" y1="274" x2="248" y2="274" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="252" y="252" width="222" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="363" y="280" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">서버 처리(여기가 200ms)</text>
  <line x1="478" y1="274" x2="506" y2="274" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="510" y="254" width="200" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="610" y="280" font-size="16" fill="#1f2937" text-anchor="middle">첫 바이트 도착 (TTFB)</text>

  <!-- 4. HTML 파싱 → CSS/JS 발견 → 다시 요청 -->
  <rect x="100" y="316" width="116" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="158" y="342" font-size="16" fill="#1f2937" text-anchor="middle">HTML 파싱</text>
  <line x1="220" y1="336" x2="248" y2="336" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="252" y="316" width="130" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="317" y="342" font-size="16" fill="#1f2937" text-anchor="middle">CSS/JS 발견</text>
  <line x1="386" y1="336" x2="414" y2="336" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="418" y="316" width="172" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="504" y="342" font-size="16" fill="#1f2937" text-anchor="middle">그것들을 다시 요청</text>

  <!-- 5. JS 실행 → 프레임워크 부팅 → 데이터 요청 → 렌더 -->
  <rect x="100" y="378" width="96" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="148" y="404" font-size="16" fill="#1f2937" text-anchor="middle">JS 실행</text>
  <line x1="200" y1="398" x2="228" y2="398" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="232" y="378" width="150" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="307" y="404" font-size="16" fill="#1f2937" text-anchor="middle">프레임워크 부팅</text>
  <line x1="386" y1="398" x2="414" y2="398" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="418" y="378" width="120" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="478" y="404" font-size="16" fill="#1f2937" text-anchor="middle">데이터 요청</text>
  <line x1="542" y1="398" x2="570" y2="398" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="574" y="378" width="76" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="612" y="404" font-size="16" fill="#1f2937" text-anchor="middle">렌더</text>

  <!-- 6. 이미지·폰트 로드 → 최종 화면 → 됐다 -->
  <rect x="100" y="440" width="156" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="178" y="466" font-size="16" fill="#1f2937" text-anchor="middle">이미지·폰트 로드</text>
  <line x1="260" y1="460" x2="288" y2="460" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="292" y="440" width="116" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="350" y="466" font-size="16" fill="#1f2937" text-anchor="middle">최종 화면</text>
  <line x1="412" y1="460" x2="440" y2="460" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="444" y="438" width="262" height="44" rx="22" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="575" y="466" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">사용자가 "됐다"고 느끼는 순간</text>

  <!-- 범례 -->
  <line x1="24" y1="510" x2="856" y2="510" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="24" y="528" width="26" height="18" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="543" font-size="15" fill="#1f2937"><tspan font-weight="bold" fill="#92400e">서버 처리</tspan> — 백엔드 API가 응답하는 시간</text>
  <rect x="24" y="556" width="26" height="18" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="60" y="571" font-size="15" fill="#1f2937"><tspan font-weight="bold">나머지</tspan> — 네트워크 왕복 횟수 · 다운로드할 바이트 양 · 메인 스레드의 자바스크립트가 결정</text>
</svg>
