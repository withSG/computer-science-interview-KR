<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">표준 스트림 0·1·2의 기본 연결</title>
  <desc id="d">모든 프로세스는 0 stdin, 1 stdout, 2 stderr 세 파일 디스크립터를 갖는다. 키보드 입력은 0번으로 들어오고, 1번과 2번은 기본적으로 모두 화면을 가리키므로 출력이 섞여 보인다.</desc>
  <defs>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 키보드 -->
  <rect x="40" y="84" width="120" height="46" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="100" y="113" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">키보드</text>

  <!-- 프로세스 -->
  <rect x="230" y="30" width="300" height="240" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="62" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">프로세스</text>

  <rect x="250" y="84" width="260" height="46" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text y="113" font-size="16" fill="#374151">
    <tspan x="270" font-size="17" font-weight="bold" fill="#047857">0</tspan>
    <tspan x="296" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">stdin</tspan>
    <tspan x="370" font-size="15">(표준 입력)</tspan>
  </text>

  <rect x="250" y="144" width="260" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text y="173" font-size="16" fill="#374151">
    <tspan x="270" font-size="17" font-weight="bold" fill="#1d4ed8">1</tspan>
    <tspan x="296" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">stdout</tspan>
    <tspan x="370" font-size="15">(표준 출력)</tspan>
  </text>

  <rect x="250" y="204" width="260" height="46" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text y="233" font-size="16" fill="#374151">
    <tspan x="270" font-size="17" font-weight="bold" fill="#b91c1c">2</tspan>
    <tspan x="296" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">stderr</tspan>
    <tspan x="370" font-size="15">(표준 에러)</tspan>
  </text>

  <!-- 화면 -->
  <rect x="680" y="144" width="160" height="106" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="760" y="203" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">화면</text>

  <!-- 화살표 -->
  <line x1="160" y1="107" x2="246" y2="107" stroke="#047857" stroke-width="2" marker-end="url(#m-green)"/>
  <line x1="510" y1="167" x2="676" y2="167" stroke="#1d4ed8" stroke-width="2" marker-end="url(#m-blue)"/>
  <line x1="510" y1="227" x2="676" y2="227" stroke="#b91c1c" stroke-width="2" marker-end="url(#m-red)"/>

  <!-- 설명 -->
  <rect x="40" y="298" width="800" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text font-size="16" fill="#111827">
    <tspan x="60" y="328">기본적으로 <tspan font-weight="bold">1과 2는 모두 화면을 가리키므로</tspan> 섞여 보인다.</tspan>
    <tspan x="60" y="356">그래서 "화면에서는 보였는데 파일에는 없다"가 발생한다.</tspan>
  </text>
</svg>
