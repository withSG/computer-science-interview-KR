<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 스트림인가</title>
  <desc id="d">키보드에서 프로세스의 stdin(0)으로 입력되고, 프로세스에서 stdout(1)과 stderr(2)가 각각 화면으로 출력되는 구조를 설명하는 표준 스트림 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="880" height="380" fill="#ffffff"/>

  <!-- 키보드 -->
  <rect x="40" y="100" width="110" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="95" y="134" font-size="14" fill="#1f2933" text-anchor="middle">키보드</text>

  <!-- 프로세스 메인 박스 -->
  <rect x="230" y="40" width="280" height="180" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="370" y="134" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">프로세스</text>

  <!-- 0 stdin (표준 입력) -->
  <rect x="250" y="65" width="240" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="370" y="87" font-size="13" fill="#059669" text-anchor="middle">0  stdin  (표준 입력)</text>

  <!-- 1 stdout (표준 출력) -->
  <rect x="250" y="125" width="240" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="370" y="147" font-size="13" fill="#2563eb" text-anchor="middle">1  stdout (표준 출력)</text>

  <!-- 2 stderr (표준 에러) -->
  <rect x="250" y="165" width="240" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="370" y="187" font-size="13" fill="#d97706" text-anchor="middle">2  stderr (표준 에러)</text>

  <!-- 화면 (stdout용) -->
  <rect x="610" y="113" width="100" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="660" y="135" font-size="14" fill="#1f2933" text-anchor="middle">화면</text>

  <!-- 화면 (stderr용) -->
  <rect x="610" y="165" width="100" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="660" y="187" font-size="14" fill="#1f2933" text-anchor="middle">화면</text>

  <!-- 화살표: 키보드 -> 0 stdin -->
  <path d="M 150 130 L 220 130 L 220 83 L 241 83" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/>

  <!-- 화살표: 1 stdout -> 화면 -->
  <path d="M 490 143 L 601 143" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- 화살표: 2 stderr -> 화면 -->
  <path d="M 490 183 L 601 183" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-orange)"/>

  <!-- 하단 부가 텍스트 -->
  <text x="40" y="270" font-size="13" fill="#52606d">기본적으로 1과 2는 모두 화면을 가리키므로 섞여 보인다.</text>
  <text x="40" y="298" font-size="13" fill="#52606d">그래서 "화면에서는 보였는데 파일에는 없다"가 발생한다.</text>
</svg>