<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">문제는 총량이 아니라 기울기다</title>
  <desc id="d">일반적인 성장은 서서히 증가하여 대응할 시간이 있지만, 이벤트성 스파이크는 급격히 치솟아 대응할 시간이 없음을 보여주는 차트 비교 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Left Panel: 일반적인 성장 -->
  <rect x="30" y="20" width="390" height="300" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1" rx="8"/>
  <text x="225" y="55" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">[일반적인 성장]</text>
  
  <!-- Left Chart Axes -->
  <!-- Y-axis -->
  <path d="M 80,240 L 80,90" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <text x="80" y="80" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">req/s</text>
  
  <!-- X-axis -->
  <path d="M 80,240 L 350,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="375" y="244" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">time</text>
  
  <!-- Left Chart Curve -->
  <path d="M 80,230 Q 150,230 200,180 T 320,130" stroke="#2563eb" stroke-width="3" fill="none"/>
  
  <!-- Left Caption -->
  <text x="225" y="285" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">대응할 시간이 있다</text>

  <!-- Right Panel: 이벤트성 스파이크 -->
  <rect x="460" y="20" width="390" height="300" fill="#fef2f2" stroke="#9aa5b1" stroke-width="1" rx="8"/>
  <text x="655" y="55" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">[이벤트성 스파이크]</text>
  
  <!-- Right Chart Axes -->
  <!-- Y-axis -->
  <path d="M 510,240 L 510,90" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <text x="510" y="80" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">req/s</text>
  
  <!-- X-axis -->
  <path d="M 510,240 L 780,240" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <text x="805" y="244" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">time</text>
  
  <!-- Right Chart Spike Path -->
  <path d="M 510,240 L 610,240 L 610,120 L 670,120 L 670,240 L 750,240" stroke="#dc2626" stroke-width="3" fill="none"/>
  
  <!-- Right Caption -->
  <text x="655" y="285" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">대응할 시간이 없다</text>
</svg>