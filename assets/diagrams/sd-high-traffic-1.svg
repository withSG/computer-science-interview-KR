<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">일반적인 성장과 이벤트성 스파이크</title>
  <desc id="d">왼쪽 일반적인 성장은 요청량(req/s)이 시간에 따라 서서히 올라 대응할 시간이 있고, 오른쪽 이벤트성 스파이크는 계단처럼 한순간에 튀어 대응할 시간이 없음을 나란히 비교한다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 왼쪽: 일반적인 성장 -->
  <rect x="24" y="24" width="404" height="312" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="226" y="60" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">일반적인 성장</text>
  <line x1="80" y1="250" x2="80" y2="92" stroke="#374151" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="80" y1="250" x2="360" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#ax)"/>
  <text x="92" y="100" font-size="14" fill="#4b5563">req/s</text>
  <text x="368" y="255" font-size="14" fill="#4b5563">time</text>
  <path d="M84,236 C170,236 200,222 240,196 S306,138 350,132" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <text x="206" y="178" text-anchor="end" font-size="15" font-weight="bold" fill="#1d4ed8">서서히 오른다</text>
  <text x="226" y="306" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">대응할 시간이 있다</text>

  <!-- 오른쪽: 이벤트성 스파이크 -->
  <rect x="452" y="24" width="404" height="312" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="654" y="60" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">이벤트성 스파이크</text>
  <line x1="508" y1="250" x2="508" y2="92" stroke="#374151" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="508" y1="250" x2="788" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#ax)"/>
  <text x="520" y="100" font-size="14" fill="#4b5563">req/s</text>
  <text x="796" y="255" font-size="14" fill="#4b5563">time</text>
  <path d="M512,236 H630 V112 H662 V236 H778" fill="none" stroke="#b91c1c" stroke-width="4" stroke-linejoin="miter" stroke-linecap="round"/>
  <text x="676" y="140" font-size="15" font-weight="bold" fill="#b91c1c">계단처럼 튄다</text>
  <text x="654" y="306" text-anchor="middle" font-size="18" font-weight="bold" fill="#b91c1c">대응할 시간이 없다</text>
</svg>
