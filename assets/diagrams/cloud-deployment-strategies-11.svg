<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Recreate 배포 흐름</title>
  <desc id="d">시각 t0에는 v1 세 대가 정상 서비스하고, t1에는 전부 종료되어 이 구간이 다운타임이 되며, t2에 v2 세 대가 기동합니다(기동 시간만큼 더 소요).</desc>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#ffffff"/>

  <!-- t1 다운타임 구간 강조 -->
  <rect x="316" y="24" width="248" height="312" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 머리글 -->
  <text x="160" y="56" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">시각 t0</text>
  <text x="440" y="56" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">시각 t1</text>
  <text x="720" y="56" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">시각 t2</text>

  <!-- t0: v1 x3 -->
  <rect x="80" y="76" width="160" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="104" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="80" y="132" width="160" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="160" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>
  <rect x="80" y="188" width="160" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="216" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v1</text>

  <!-- t1: 빈 자리 x3 -->
  <rect x="360" y="76" width="160" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="360" y="132" width="160" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="360" y="188" width="160" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- t2: v2 x3 -->
  <rect x="640" y="76" width="160" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="104" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="640" y="132" width="160" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="160" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>
  <rect x="640" y="188" width="160" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="216" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">v2</text>

  <!-- 시간 진행 화살표 -->
  <path d="M248,154 L352,154" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ak)"/>
  <path d="M528,154 L632,154" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ak)"/>

  <!-- 상태 설명 -->
  <text x="160" y="268" font-size="16" fill="#1f2937" text-anchor="middle">정상 서비스</text>
  <text x="440" y="268" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">전부 종료</text>
  <text x="720" y="268" font-size="16" fill="#1f2937" text-anchor="middle">새 버전 기동</text>
  <text x="720" y="292" font-size="15" fill="#4b5563" text-anchor="middle">(기동 시간만큼 더 소요)</text>

  <rect x="346" y="286" width="188" height="36" rx="18" fill="#b91c1c"/>
  <text x="440" y="310" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">이 구간이 다운타임</text>
</svg>
