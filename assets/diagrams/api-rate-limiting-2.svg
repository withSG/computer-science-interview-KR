<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sliding Window Log 처리 과정</title>
  <desc id="d">저장된 기록 [12:00:10, 12:00:35, 12:00:58, 12:01:01, 12:01:20]이 있을 때 12:01:30에 요청이 오면 12:00:30 이전 기록인 12:00:10을 제거하고, 남은 4개가 한도 5 미만이므로 허용하고 12:01:30을 추가한다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 윈도(12:00:30 ~ 12:01:30) 영역 -->
  <rect x="352" y="100" width="500" height="276" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="602" y="126" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">윈도 = 지금부터 과거 1분 (12:00:30 ~ 12:01:30)</text>
  <text x="292" y="126" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">윈도 밖</text>

  <!-- 행 0: 저장된 기록 -->
  <text x="32" y="64" font-size="16" font-weight="bold" fill="#111827">저장된 기록</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="248" y="40" width="88" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="292" y="63">12:00:10</text>
    <rect x="372" y="40" width="88" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="416" y="63">12:00:35</text>
    <rect x="468" y="40" width="88" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="512" y="63">12:00:58</text>
    <rect x="564" y="40" width="88" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="608" y="63">12:01:01</text>
    <rect x="660" y="40" width="88" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="704" y="63">12:01:20</text>
  </g>

  <!-- 행 1: 요청 도착 -->
  <circle cx="43" cy="164" r="11" fill="#1f2937"/>
  <text x="43" y="169" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text font-size="15" fill="#111827"><tspan x="62" y="159">지금 12:01:30에</tspan><tspan x="62" dy="21">요청이 왔다</tspan></text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="248" y="146" width="88" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="292" y="169">12:00:10</text>
    <rect x="372" y="146" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="416" y="169">12:00:35</text>
    <rect x="468" y="146" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="512" y="169">12:00:58</text>
    <rect x="564" y="146" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="608" y="169">12:01:01</text>
    <rect x="660" y="146" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="704" y="169">12:01:20</text>
    <rect x="756" y="146" width="88" height="36" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="800" y="169" fill="#1d4ed8" font-weight="bold">12:01:30</text>
  </g>

  <!-- 행 2: 윈도 밖 기록 제거 -->
  <circle cx="43" cy="232" r="11" fill="#1f2937"/>
  <text x="43" y="237" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text font-size="15" fill="#111827"><tspan x="62" y="227">12:00:30 이전</tspan><tspan x="62" dy="21">기록 제거</tspan></text>
  <rect x="248" y="214" width="88" height="36" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="292" y="237" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">제거</text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="372" y="214" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="416" y="237">12:00:35</text>
    <rect x="468" y="214" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="512" y="237">12:00:58</text>
    <rect x="564" y="214" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="608" y="237">12:01:01</text>
    <rect x="660" y="214" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="704" y="237">12:01:20</text>
    <rect x="756" y="214" width="88" height="36" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="800" y="237" fill="#1d4ed8" font-weight="bold">12:01:30</text>
  </g>
  <!-- 남은 개수 괄호 -->
  <path d="M372,256 L372,262 L748,262 L748,256" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="560" y="284" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">남은 기록 4개</text>

  <!-- 행 3: 허용하고 추가 -->
  <circle cx="43" cy="318" r="11" fill="#1f2937"/>
  <text x="43" y="323" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text font-size="15" fill="#111827"><tspan x="62" y="313">4개. 한도 5 미만이므로</tspan><tspan x="62" dy="21" font-weight="bold" fill="#047857">허용하고 12:01:30을 추가</tspan></text>
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="15" fill="#111827" text-anchor="middle">
    <rect x="372" y="300" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="416" y="323">12:00:35</text>
    <rect x="468" y="300" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="512" y="323">12:00:58</text>
    <rect x="564" y="300" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="608" y="323">12:01:01</text>
    <rect x="660" y="300" width="88" height="36" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    <text x="704" y="323">12:01:20</text>
    <rect x="756" y="300" width="88" height="36" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="800" y="323" fill="#047857" font-weight="bold">12:01:30</text>
  </g>
  <text x="800" y="360" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">추가</text>
</svg>
