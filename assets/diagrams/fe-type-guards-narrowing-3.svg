<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">타입 가드와 타입 단언 비교</title>
  <desc id="d">타입 가드는 typeof v === "string"으로 실제 값을 확인해 컴파일러가 사실을 알게 되므로 런타임에도 안전하다. 타입 단언은 v as string으로 확인 없이 컴파일러가 입을 다물게 할 뿐이라 틀렸으면 런타임에 폭발한다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 타입 가드 -->
  <rect x="50" y="24" width="360" height="48" rx="8" fill="#1d4ed8"/>
  <text x="230" y="55" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">타입 가드</text>
  <line x1="230" y1="72" x2="230" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="50" y="104" width="360" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="230" y="134" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">실제 값 확인</text>
  <line x1="230" y1="152" x2="230" y2="180" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="50" y="184" width="360" height="48" rx="6" fill="#f9fafb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="230" y="214" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">typeof v === "string"</text>
  <line x1="230" y1="232" x2="230" y2="260" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="50" y="264" width="360" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="230" y="294" font-size="17" fill="#1e3a8a" text-anchor="middle">컴파일러가 사실을 알게 됨</text>
  <line x1="230" y1="312" x2="230" y2="340" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="50" y="344" width="360" height="56" rx="8" fill="#047857"/>
  <text x="230" y="378" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">런타임에도 안전</text>

  <!-- 타입 단언 -->
  <rect x="470" y="24" width="360" height="48" rx="8" fill="#b91c1c"/>
  <text x="650" y="55" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">타입 단언</text>
  <line x1="650" y1="72" x2="650" y2="100" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="470" y="104" width="360" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="650" y="134" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">확인 없음</text>
  <line x1="650" y1="152" x2="650" y2="180" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="470" y="184" width="360" height="48" rx="6" fill="#f9fafb" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="650" y="214" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">v as string</text>
  <line x1="650" y1="232" x2="650" y2="260" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="470" y="264" width="360" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="650" y="294" font-size="17" fill="#7f1d1d" text-anchor="middle">컴파일러가 입을 다물게 됨</text>
  <line x1="650" y1="312" x2="650" y2="340" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="470" y="344" width="360" height="56" rx="8" fill="#b91c1c"/>
  <text x="650" y="378" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">틀렸으면 런타임에 폭발</text>

  <!-- 가운데 구분 -->
  <line x1="440" y1="24" x2="440" y2="400" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3 5"/>
</svg>
