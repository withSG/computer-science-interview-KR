<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">단언은 검사가 아니라 선언이다</title>
  <desc id="d">타입 가드와 타입 단언의 차이를 나타내는 비교 흐름도입니다. 타입 가드는 실제 값 확인을 거쳐 런타임에 안전하지만, 타입 단언은 확인 없이 컴파일러를 억제하여 틀렸을 때 런타임 에러를 발생시킵니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- Left Column Group: 타입 가드 (Blue Theme) -->
  <rect x="30" y="20" width="395" height="350" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="117" y="35" width="220" height="40" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="227" y="60" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">[타입 가드]</text>

  <rect x="77" y="115" width="300" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="227" y="140" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">실제 값 확인</text>

  <rect x="77" y="195" width="300" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="227" y="220" fill="#1f2933" font-size="13" font-family="Consolas, monospace" font-weight="bold" text-anchor="middle">typeof v === "string"</text>

  <rect x="77" y="275" width="300" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="227" y="300" fill="#1f2933" font-size="14" text-anchor="middle">컴파일러가 사실을 알게 됨</text>

  <rect x="77" y="325" width="300" height="35" rx="6" fill="#059669" stroke="#059669" stroke-width="1.5"/>
  <text x="227" y="347" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">런타임에도 안전</text>

  <!-- Left Column Arrows -->
  <path d="M227,75 L227,115" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M227,155 L227,195" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M227,235 L227,275" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M227,315 L227,325" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Right Column Group: 타입 단언 (Red Theme) -->
  <rect x="455" y="20" width="395" height="350" rx="8" fill="#fef2f2" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="542" y="35" width="220" height="40" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="60" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">[타입 단언]</text>

  <rect x="502" y="115" width="300" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="140" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">확인 없음</text>

  <rect x="502" y="195" width="300" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="220" fill="#1f2933" font-size="13" font-family="Consolas, monospace" font-weight="bold" text-anchor="middle">v as string</text>

  <rect x="502" y="275" width="300" height="40" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="300" fill="#1f2933" font-size="14" text-anchor="middle">컴파일러가 입을 다물게 됨</text>

  <rect x="502" y="325" width="300" height="35" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <text x="652" y="347" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">틀렸으면 런타임에 폭발</text>

  <!-- Right Column Arrows -->
  <path d="M652,75 L652,115" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <path d="M652,155 L652,195" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <path d="M652,235 L652,275" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <path d="M652,315 L652,325" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
</svg>