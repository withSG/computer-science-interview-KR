<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RAG가 필요한 이유</title>
  <desc id="d">LLM의 한계 네 가지(지식 컷오프, 내부 문서 접근 불가, 환각, 출처 확인 어려움)가 RAG로 각각 어떻게 해결되는지(최신 정보 검색, 사내 문서 활용, 검색 문서 기반 답변으로 정확성 향상, 출처 제공) 한 줄씩 짝지어 보여준다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 머리: 두 열 -->
  <rect x="32" y="24" width="368" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="216" y="50" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">LLM의 한계</text>
  <rect x="480" y="24" width="368" height="40" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="664" y="50" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">RAG로 해결</text>

  <!-- 1행 -->
  <rect x="32" y="80" width="368" height="68" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="62" cy="114" r="14" fill="#b91c1c"/>
  <text x="62" y="119" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="88" y="108" font-size="16" font-weight="bold" fill="#1f2937">학습 데이터 이후 정보 모름</text>
  <text x="88" y="130" font-size="15" fill="#4b5563">(지식 컷오프)</text>
  <line x1="408" y1="114" x2="470" y2="114" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="480" y="80" width="368" height="68" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="510" cy="114" r="14" fill="#047857"/>
  <text x="510" y="119" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="536" y="120" font-size="16" font-weight="bold" fill="#1f2937">최신 정보 검색 가능</text>

  <!-- 2행 -->
  <rect x="32" y="162" width="368" height="68" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="62" cy="196" r="14" fill="#b91c1c"/>
  <text x="62" y="201" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="88" y="202" font-size="16" font-weight="bold" fill="#1f2937">기업 내부 문서 접근 불가</text>
  <line x1="408" y1="196" x2="470" y2="196" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="480" y="162" width="368" height="68" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="510" cy="196" r="14" fill="#047857"/>
  <text x="510" y="201" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="536" y="202" font-size="16" font-weight="bold" fill="#1f2937">사내 문서 활용 가능</text>

  <!-- 3행 -->
  <rect x="32" y="244" width="368" height="68" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="62" cy="278" r="14" fill="#b91c1c"/>
  <text x="62" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="88" y="272" font-size="16" font-weight="bold" fill="#1f2937">환각</text>
  <text x="88" y="294" font-size="15" fill="#4b5563">(그럴듯하지만 틀린 답변)</text>
  <line x1="408" y1="278" x2="470" y2="278" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="480" y="244" width="368" height="68" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="510" cy="278" r="14" fill="#047857"/>
  <text x="510" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="536" y="272" font-size="16" font-weight="bold" fill="#1f2937">검색된 문서 기반으로 답변</text>
  <text x="536" y="294" font-size="15" font-weight="bold" fill="#047857">→ 정확성 향상</text>

  <!-- 4행 -->
  <rect x="32" y="326" width="368" height="68" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="62" cy="360" r="14" fill="#b91c1c"/>
  <text x="62" y="365" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="88" y="366" font-size="16" font-weight="bold" fill="#1f2937">출처 확인 어려움</text>
  <line x1="408" y1="360" x2="470" y2="360" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="480" y="326" width="368" height="68" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="510" cy="360" r="14" fill="#047857"/>
  <text x="510" y="365" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="536" y="366" font-size="16" font-weight="bold" fill="#1f2937">출처 제공 가능</text>
</svg>
