<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RAG가 필요한 이유</title>
  <desc id="d">LLM의 4가지 한계점과 RAG를 통해 해결되는 4가지 이점을 대비하여 보여주는 비교 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 제목 헤딩 -->
  <text x="40" y="52" font-size="16" font-weight="bold" fill="#1f2933">RAG가 필요한 이유</text>

  <!-- 좌측 그룹: LLM의 한계 -->
  <rect x="40" y="80" width="370" height="390" rx="8" ry="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="118" font-size="14" font-weight="bold" fill="#dc2626">LLM의 한계:</text>

  <!-- LLM 한계 항목 1 -->
  <rect x="64" y="140" width="322" height="60" rx="6" ry="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="80" y="176" font-size="13" font-weight="bold" fill="#dc2626">1.</text>
  <text x="98" y="176" font-size="13" fill="#1f2933">학습 데이터 이후 정보 모름 (지식 컷오프)</text>

  <!-- LLM 한계 항목 2 -->
  <rect x="64" y="215" width="322" height="60" rx="6" ry="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="80" y="251" font-size="13" font-weight="bold" fill="#dc2626">2.</text>
  <text x="98" y="251" font-size="13" fill="#1f2933">기업 내부 문서 접근 불가</text>

  <!-- LLM 한계 항목 3 -->
  <rect x="64" y="290" width="322" height="60" rx="6" ry="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="80" y="326" font-size="13" font-weight="bold" fill="#dc2626">3.</text>
  <text x="98" y="326" font-size="13" fill="#1f2933">환각 (그럴듯하지만 틀린 답변)</text>

  <!-- LLM 한계 항목 4 -->
  <rect x="64" y="365" width="322" height="60" rx="6" ry="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="80" y="401" font-size="13" font-weight="bold" fill="#dc2626">4.</text>
  <text x="98" y="401" font-size="13" fill="#1f2933">출처 확인 어려움</text>

  <!-- 연결 화살표 (한계 -> 해결) -->
  <path d="M 410 170 L 460 170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M 410 245 L 460 245" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M 410 320 L 460 320" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M 410 395 L 460 395" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 우측 그룹: RAG로 해결 -->
  <rect x="470" y="80" width="370" height="390" rx="8" ry="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="494" y="118" font-size="14" font-weight="bold" fill="#059669">RAG로 해결:</text>

  <!-- RAG 해결 항목 1 -->
  <rect x="494" y="140" width="322" height="60" rx="6" ry="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="510" y="176" font-size="13" font-weight="bold" fill="#059669">1.</text>
  <text x="528" y="176" font-size="13" fill="#1f2933">최신 정보 검색 가능</text>

  <!-- RAG 해결 항목 2 -->
  <rect x="494" y="215" width="322" height="60" rx="6" ry="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="510" y="251" font-size="13" font-weight="bold" fill="#059669">2.</text>
  <text x="528" y="251" font-size="13" fill="#1f2933">사내 문서 활용 가능</text>

  <!-- RAG 해결 항목 3 -->
  <rect x="494" y="290" width="322" height="60" rx="6" ry="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="510" y="326" font-size="13" font-weight="bold" fill="#059669">3.</text>
  <text x="528" y="326" font-size="13" fill="#1f2933">검색된 문서 기반으로 답변 → 정확성 향상</text>

  <!-- RAG 해결 항목 4 -->
  <rect x="494" y="365" width="322" height="60" rx="6" ry="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="510" y="401" font-size="13" font-weight="bold" fill="#059669">4.</text>
  <text x="528" y="401" font-size="13" fill="#1f2933">출처 제공 가능</text>
</svg>