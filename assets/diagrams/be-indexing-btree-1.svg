<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">B-Tree 노드 하나 = 페이지 하나</title>
  <desc id="d">16KB 페이지 하나를 노드 하나로 삼아 루트 노드에 50, 120, 300, 740 등 수백 개의 키를 담고, 그 아래로 내부 노드 자식도 수백 개를 거느리는 B-Tree 구조.</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 요점 캡션 -->
  <text x="498" y="40" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">노드 하나 = 페이지 하나<tspan fill="#1d4ed8">(16KB)</tspan> 안에 키를 <tspan fill="#1d4ed8">수백 개</tspan> 담는다</text>
  <line x1="498" y1="52" x2="498" y2="90" stroke="#111827" stroke-width="1.8" marker-end="url(#ah-ink)"/>

  <!-- 왼쪽 단계 라벨 -->
  <text x="40" y="132" font-size="18" font-weight="bold" fill="#111827">루트</text>
  <text x="40" y="156" font-size="15" fill="#4b5563">1 페이지</text>
  <text x="40" y="287" font-size="18" font-weight="bold" fill="#111827">내부 노드</text>

  <!-- 루트 노드 = 1 페이지 -->
  <rect x="150" y="96" width="696" height="80" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="172" y="114" width="84" height="44" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="214" y="142" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">50</text>
  <rect x="272" y="114" width="84" height="44" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="314" y="142" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">120</text>
  <rect x="372" y="114" width="84" height="44" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="414" y="142" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">300</text>
  <rect x="472" y="114" width="84" height="44" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="514" y="142" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">740</text>
  <rect x="572" y="114" width="70" height="44" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="607" y="140" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">…</text>
  <text x="664" y="142" font-size="17" font-weight="bold" fill="#1d4ed8">수백 개의 키</text>

  <!-- 자식 포인터 -->
  <line x1="210" y1="178" x2="210" y2="250" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <line x1="360" y1="178" x2="360" y2="250" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <line x1="510" y1="178" x2="510" y2="250" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <line x1="660" y1="178" x2="660" y2="250" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <text x="686" y="210" font-size="16" font-weight="bold" fill="#1d4ed8">자식도 수백 개</text>
  <text x="686" y="232" font-size="15" fill="#4b5563">(팬아웃, fan-out)</text>

  <!-- 내부 노드 -->
  <rect x="150" y="254" width="120" height="52" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="168" y="268" width="22" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="198" y="268" width="22" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="242" y="285" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>

  <rect x="300" y="254" width="120" height="52" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="318" y="268" width="22" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="348" y="268" width="22" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="392" y="285" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>

  <rect x="450" y="254" width="120" height="52" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="468" y="268" width="22" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="498" y="268" width="22" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="542" y="285" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>

  <rect x="600" y="254" width="120" height="52" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="618" y="268" width="22" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="648" y="268" width="22" height="24" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="692" y="285" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>

  <text x="764" y="286" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>
</svg>
