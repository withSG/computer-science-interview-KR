<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">B-Tree의 아이디어: 노드 하나를 페이지 하나로 채운다</title>
  <desc id="d">노드 하나를 16KB 페이지 하나로 채워 키와 자식을 수백 개 담는 B-Tree 구조 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 상단 라벨 (설명) -->
  <text x="440" y="35" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">노드 하나 = 페이지 하나(16KB) 안에 키를 수백 개 담는다</text>
  
  <!-- 중앙 하향 화살표 (설명 -> 루트 노드) -->
  <path d="M440,48 L440,72" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 루트 노드 박스 (1 페이지) -->
  <rect x="140" y="80" width="600" height="60" rx="4" ry="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  
  <!-- 루트 노드 내용 -->
  <text x="400" y="115" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">[50] [120] [300] [740] ... 수백 개의 키</text>
  
  <!-- 우측 주석: ← 루트 (1 페이지) -->
  <text x="755" y="115" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">← 루트 (1 페이지)</text>

  <!-- 우측 주석: 자식도 수백 개 -->
  <text x="755" y="185" font-size="13" fill="#52606d" text-anchor="start">자식도 수백 개</text>

  <!-- 연결 화살표 4개 (루트 -> 내부 노드들) -->
  <path d="M220,140 L180,212" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M340,140 L350,212" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M520,140 L520,212" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M640,140 L690,212" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- 자식 노드 (내부 노드) 4개 -->
  <!-- 노드 1 -->
  <rect x="120" y="220" width="120" height="50" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="180" y="249" font-size="13" fill="#1f2933" text-anchor="middle">...</text>

  <!-- 노드 2 -->
  <rect x="290" y="220" width="120" height="50" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="350" y="249" font-size="13" fill="#1f2933" text-anchor="middle">...</text>

  <!-- 노드 3 -->
  <rect x="460" y="220" width="120" height="50" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="520" y="249" font-size="13" fill="#1f2933" text-anchor="middle">...</text>

  <!-- 노드 4 -->
  <rect x="630" y="220" width="120" height="50" rx="4" ry="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="690" y="249" font-size="13" fill="#1f2933" text-anchor="middle">...</text>

  <!-- 우측 주석: ← 내부 노드 -->
  <text x="755" y="249" font-size="13" fill="#52606d" text-anchor="start">← 내부 노드</text>

</svg>