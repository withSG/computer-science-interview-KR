<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LIME 국소 근사 절차</title>
  <desc id="d">LIME은 설명할 샘플 x 주변에 가짜 샘플을 만들어 원래 모델의 예측을 받고, x에 가까운 샘플에 큰 가중치를 준 선형 모델을 학습해 그 계수를 설명으로 쓴다. 복잡한 결정 경계 전체가 아니라 x 근처에서만 맞는 직선으로 흉내 낸다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- LIME 4단계 -->
  <rect x="40" y="28" width="800" height="36" rx="6" fill="#f3f6fb"/>
  <circle cx="64" cy="46" r="13" fill="#1d4ed8"/>
  <text x="64" y="51" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="90" y="52" font-size="16" fill="#111827">설명할 샘플 x 주변에 <tspan font-weight="bold" fill="#1d4ed8">변형된 가짜 샘플</tspan>을 많이 만든다</text>
  <rect x="40" y="72" width="800" height="36" rx="6" fill="#f3f6fb"/>
  <circle cx="64" cy="90" r="13" fill="#1d4ed8"/>
  <text x="64" y="95" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="90" y="96" font-size="16" fill="#111827"><tspan font-weight="bold" fill="#1d4ed8">원래(복잡한) 모델</tspan>로 그 샘플들의 예측을 받는다</text>
  <rect x="40" y="116" width="800" height="36" rx="6" fill="#f3f6fb"/>
  <circle cx="64" cy="134" r="13" fill="#1d4ed8"/>
  <text x="64" y="139" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="90" y="140" font-size="16" fill="#111827">x에 가까운 샘플에 <tspan font-weight="bold" fill="#1d4ed8">큰 가중치</tspan>를 주고, <tspan font-weight="bold" fill="#1d4ed8">선형 모델</tspan>을 학습시킨다</text>
  <rect x="40" y="160" width="800" height="36" rx="6" fill="#f3f6fb"/>
  <circle cx="64" cy="178" r="13" fill="#1d4ed8"/>
  <text x="64" y="183" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="90" y="184" font-size="16" fill="#111827">그 선형 모델의 계수를 <tspan font-weight="bold" fill="#1d4ed8">"x 근처에서의 설명"</tspan>으로 제시한다</text>

