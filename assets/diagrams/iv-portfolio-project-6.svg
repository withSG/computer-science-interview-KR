<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접관이 확인하려는 것</title>
  <desc id="d">답변 중 면접관이 체크하는 4가지 항목과 각각의 위험 신호 및 정상/성숙/가점/재발 방지 신호를 비교한 다이어그램입니다.</desc>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 메인 헤더 / 제목 영역 -->
  <rect x="240" y="24" width="400" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="51" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">[답변 중 면접관이 체크하는 것]</text>

  <!-- 항목 1: 상대를 어떻게 부르나 -->
  <g transform="translate(0, 90)">
    <!-- 왼쪽 카테고리 박스 -->
    <rect x="30" y="0" width="220" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">상대를 어떻게 부르나</text>

    <!-- 화살표 (위: 위험신호 / 아래: 정상) -->
    <path d="M250,22 L280,22" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <path d="M250,48 L280,48" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <!-- 오른쪽 내용 박스 (위: 감점/위험, 아래: 가점/정상) -->
    <rect x="280" y="4" width="310" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="295" y="27" font-size="13" fill="#1f2933">"그 사람이 고집을 부려서"</text>
    <path d="M590,22 L620,22" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-red)"/>
    <rect x="620" y="4" width="230" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="735" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">위험 신호</text>

    <rect x="280" y="44" width="310" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="295" y="67" font-size="13" fill="#1f2933">"서로 우선순위가 달라서"</text>
    <path d="M590,62 L620,62" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="620" y="44" width="230" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="735" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">정상</text>
  </g>

  <!-- 항목 2: 원인을 어디서 찾나 -->
  <g transform="translate(0, 180)">
    <!-- 왼쪽 카테고리 박스 -->
    <rect x="30" y="0" width="220" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">원인을 어디서 찾나</text>

    <!-- 화살표 -->
    <path d="M250,22 L280,22" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <path d="M250,48 L280,48" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <!-- 오른쪽 내용 박스 -->
    <rect x="280" y="4" width="310" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="295" y="27" font-size="13" fill="#1f2933">외부(상대, 환경)만</text>
    <path d="M590,22 L620,22" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-red)"/>
    <rect x="620" y="4" width="230" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="735" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">협업 리스크</text>

    <rect x="280" y="44" width="310" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="295" y="67" font-size="13" fill="#1f2933">구조와 절차에서</text>
    <path d="M590,62 L620,62" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="620" y="44" width="230" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="735" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">성숙한 신호</text>
  </g>

  <!-- 항목 3: 무엇으로 설득했나 -->
  <g transform="translate(0, 270)">
    <!-- 왼쪽 카테고리 박스 -->
    <rect x="30" y="0" width="220" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">무엇으로 설득했나</text>

    <!-- 화살표 -->
    <path d="M250,22 L280,22" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <path d="M250,48 L280,48" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <!-- 오른쪽 내용 박스 -->
    <rect x="280" y="4" width="310" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="295" y="27" font-size="13" fill="#1f2933">목소리/직급/포기</text>
    <path d="M590,22 L620,22" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-red)"/>
    <rect x="620" y="4" width="230" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="735" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">감점</text>

    <rect x="280" y="44" width="310" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="295" y="67" font-size="13" fill="#1f2933">데이터/사용자 관점</text>
    <path d="M590,62 L620,62" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="620" y="44" width="230" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="735" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">가점</text>
  </g>

  <!-- 항목 4: 이후에 무엇이 남았나 -->
  <g transform="translate(0, 360)">
    <!-- 왼쪽 카테고리 박스 -->
    <rect x="30" y="0" width="220" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">이후에 무엇이 남았나</text>

    <!-- 화살표 -->
    <path d="M250,22 L280,22" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
    <path d="M250,48 L280,48" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

    <!-- 오른쪽 내용 박스 -->
    <rect x="280" y="4" width="310" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="295" y="27" font-size="13" fill="#1f2933">"그냥 넘어갔다"</text>
    <path d="M590,22 L620,22" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a-red)"/>
    <rect x="620" y="4" width="230" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="735" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">학습 없음</text>

    <rect x="280" y="44" width="310" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="295" y="67" font-size="13" fill="#1f2933">"규칙을 만들었다"</text>
    <path d="M590,62 L620,62" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="620" y="44" width="230" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="735" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">재발 방지</text>
  </g>

  <!-- 범례 (하단) -->
  <g transform="translate(260, 455)">
    <rect x="0" y="0" width="360" height="30" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <rect x="20" y="9" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="38" y="20" font-size="11.5" fill="#52606d">부정적 / 위험 평가</text>

    <rect x="190" y="9" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="208" y="20" font-size="11.5" fill="#52606d">긍정적 / 권장 평가</text>
  </g>
</svg>