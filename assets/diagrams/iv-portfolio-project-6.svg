<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">답변 중 면접관이 체크하는 것</title>
  <desc id="d">갈등 경험 답변에서 면접관이 보는 네 가지(상대를 어떻게 부르나, 원인을 어디서 찾나, 무엇으로 설득했나, 이후에 무엇이 남았나)마다 부정적으로 읽히는 답과 긍정적으로 읽히는 답, 그리고 각각의 판정을 나란히 비교한 표.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <text x="24" y="46" font-size="18" font-weight="bold" fill="#1f2933">답변 중 면접관이 체크하는 것</text>

  <!-- 머리행 -->
  <rect x="24" y="66" width="220" height="44" fill="#e2e8f0"/>
  <rect x="244" y="66" width="306" height="44" fill="#fee2e2"/>
  <rect x="550" y="66" width="306" height="44" fill="#d1fae5"/>
  <text x="42" y="94" font-size="16" font-weight="bold" fill="#1f2933">체크 항목</text>
  <text x="262" y="94" font-size="16" font-weight="bold" fill="#b91c1c">부정적으로 읽히는 답</text>
  <text x="568" y="94" font-size="16" font-weight="bold" fill="#047857">긍정적으로 읽히는 답</text>

  <!-- 셀 바탕 -->
  <rect x="24" y="110" width="220" height="312" fill="#f8fafc"/>
  <rect x="244" y="110" width="306" height="312" fill="#fef2f2"/>
  <rect x="550" y="110" width="306" height="312" fill="#ecfdf5"/>

  <!-- 격자 -->
  <line x1="24" y1="110" x2="856" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="188" x2="856" y2="188" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="266" x2="856" y2="266" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="24" y1="344" x2="856" y2="344" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="244" y1="66" x2="244" y2="422" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="550" y1="66" x2="550" y2="422" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="66" width="832" height="356" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 1행 -->
  <text x="42" y="155" font-size="16" font-weight="bold" fill="#1f2933">상대를 어떻게 부르나</text>
  <text x="262" y="143" font-size="16" fill="#1f2933">"그 사람이 고집을 부려서"</text>
  <text x="262" y="169" font-size="16" font-weight="bold" fill="#b91c1c">→ 위험 신호</text>
  <text x="568" y="143" font-size="16" fill="#1f2933">"서로 우선순위가 달라서"</text>
  <text x="568" y="169" font-size="16" font-weight="bold" fill="#047857">→ 정상</text>

  <!-- 2행 -->
  <text x="42" y="233" font-size="16" font-weight="bold" fill="#1f2933">원인을 어디서 찾나</text>
  <text x="262" y="221" font-size="16" fill="#1f2933">외부(상대, 환경)만</text>
  <text x="262" y="247" font-size="16" font-weight="bold" fill="#b91c1c">→ 협업 리스크</text>
  <text x="568" y="221" font-size="16" fill="#1f2933">구조와 절차에서</text>
  <text x="568" y="247" font-size="16" font-weight="bold" fill="#047857">→ 성숙한 신호</text>

  <!-- 3행 -->
  <text x="42" y="311" font-size="16" font-weight="bold" fill="#1f2933">무엇으로 설득했나</text>
  <text x="262" y="299" font-size="16" fill="#1f2933">목소리/직급/포기</text>
  <text x="262" y="325" font-size="16" font-weight="bold" fill="#b91c1c">→ 감점</text>
  <text x="568" y="299" font-size="16" fill="#1f2933">데이터/사용자 관점</text>
  <text x="568" y="325" font-size="16" font-weight="bold" fill="#047857">→ 가점</text>

  <!-- 4행 -->
  <text x="42" y="389" font-size="16" font-weight="bold" fill="#1f2933">이후에 무엇이 남았나</text>
  <text x="262" y="377" font-size="16" fill="#1f2933">"그냥 넘어갔다"</text>
  <text x="262" y="403" font-size="16" font-weight="bold" fill="#b91c1c">→ 학습 없음</text>
  <text x="568" y="377" font-size="16" fill="#1f2933">"규칙을 만들었다"</text>
  <text x="568" y="403" font-size="16" font-weight="bold" fill="#047857">→ 재발 방지</text>
</svg>
