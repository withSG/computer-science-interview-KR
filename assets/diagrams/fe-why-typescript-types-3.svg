<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">5. any, unknown, never의 자리</title>
  <desc id="d">TypeScript의 unknown, never, any 타입 계층 구조 및 각 타입의 역할을 설명하는 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- unknown Box (Top) -->
  <rect x="220" y="30" width="220" height="48" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="60.5" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">unknown</text>

  <!-- unknown Annotations -->
  <text x="455" y="52" fill="#52606d" font-size="13" font-weight="bold">← 최상위(top). 모든 값을 받는다</text>
  <text x="472" y="72" fill="#52606d" font-size="11.5">쓰려면 반드시 좁혀야 한다</text>

  <!-- Connecting line: unknown to concrete types -->
  <path d="M330,78 L330,120" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Concrete Types Box Array -->
  <!-- Line connecting all concrete types top -->
  <path d="M120,120 L540,120" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Individual type vertical drop lines -->
  <path d="M120,120 L120,135" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M200,120 L200,135" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M290,120 L290,135" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M390,120 L390,135" stroke="#1f2933" stroke-width="1.5" fill="none"/>
  <path d="M540,120 L540,135" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- Main combined concrete types box border -->
  <rect x="70" y="135" width="520" height="42" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Internal dividing lines -->
  <line x1="160" y1="135" x2="160" y2="177" stroke="#cbd2d9" stroke-width="1.5"/>
  <line x1="240" y1="135" x2="240" y2="177" stroke="#cbd2d9" stroke-width="1.5"/>
  <line x1="340" y1="135" x2="340" y2="177" stroke="#cbd2d9" stroke-width="1.5"/>
  <line x1="440" y1="135" x2="440" y2="177" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- Labels for concrete types -->
  <text x="115" y="161" fill="#1f2933" font-size="13" text-anchor="middle">string</text>
  <text x="200" y="161" fill="#1f2933" font-size="13" text-anchor="middle">number</text>
  <text x="290" y="161" fill="#1f2933" font-size="13" text-anchor="middle">boolean</text>
  <text x="390" y="161" fill="#1f2933" font-size="13" text-anchor="middle">object</text>
  <text x="515" y="161" fill="#1f2933" font-size="13" text-anchor="middle">...</text>

  <!-- Connecting line: concrete types to never -->
  <path d="M330,177 L330,220" stroke="#1f2933" stroke-width="1.5" fill="none"/>

  <!-- never Box (Bottom) -->
  <rect x="220" y="220" width="220" height="48" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="330" y="250.5" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">never</text>

  <!-- never Annotations -->
  <text x="455" y="242" fill="#52606d" font-size="13" font-weight="bold">← 최하위(bottom). 어떤 값도 없다</text>
  <text x="472" y="262" fill="#52606d" font-size="11.5">어디에나 할당 가능</text>

  <!-- any Box -->
  <rect x="220" y="330" width="220" height="48" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="360.5" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">any</text>

  <!-- any Annotations -->
  <text x="455" y="344" fill="#52606d" font-size="13" font-weight="bold">← 계층 바깥. never만 빼면 위아래 모두와</text>
  <text x="472" y="366" fill="#52606d" font-size="11.5">자유롭게 오간다 = 타입 검사를 끄는 스위치</text>
</svg>