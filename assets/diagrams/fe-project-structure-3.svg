<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BFF 없음과 있음 비교</title>
  <desc id="d">BFF가 없으면 프론트가 주문·사용자·상품·배송 서비스를 직접 호출해 4번 왕복하고 인증을 4번 처리하며 서비스 분할을 알게 된다. BFF가 있으면 프론트는 BFF와 1번 왕복하고, BFF가 인증·집계·응답 변환을 맡아 네 서비스를 호출하므로 프론트는 BFF만 안다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="grn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="gry" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- ── BFF 없음 ── -->
  <rect x="24" y="24" width="404" height="382" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="226" y="54" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">BFF 없음</text>

  <rect x="156" y="72" width="140" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="226" y="102" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">프론트</text>
  <text x="312" y="92" font-size="16" font-weight="bold" fill="#b91c1c">4번 왕복</text>
  <text x="312" y="114" font-size="15" fill="#b91c1c">인증 4번 처리</text>

  <path d="M226,121 V150 M82,150 H370" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <line x1="82" y1="150" x2="82" y2="298" stroke="#b91c1c" stroke-width="2" marker-end="url(#red)"/>
  <line x1="178" y1="150" x2="178" y2="298" stroke="#b91c1c" stroke-width="2" marker-end="url(#red)"/>
  <line x1="274" y1="150" x2="274" y2="298" stroke="#b91c1c" stroke-width="2" marker-end="url(#red)"/>
  <line x1="370" y1="150" x2="370" y2="298" stroke="#b91c1c" stroke-width="2" marker-end="url(#red)"/>

  <rect x="42" y="300" width="80" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="82" y="330" font-size="16" fill="#111827" text-anchor="middle">주문</text>
  <rect x="138" y="300" width="80" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="178" y="330" font-size="16" fill="#111827" text-anchor="middle">사용자</text>
  <rect x="234" y="300" width="80" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="274" y="330" font-size="16" fill="#111827" text-anchor="middle">상품</text>
  <rect x="330" y="300" width="80" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="370" y="330" font-size="16" fill="#111827" text-anchor="middle">배송</text>

  <text x="226" y="384" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">프론트가 서비스 분할을 안다</text>

  <!-- ── BFF 있음 ── -->
  <rect x="452" y="24" width="404" height="382" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="654" y="54" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">BFF 있음</text>

  <rect x="584" y="72" width="140" height="48" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="654" y="102" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">프론트</text>

  <line x1="654" y1="121" x2="654" y2="176" stroke="#047857" stroke-width="2" marker-end="url(#grn)"/>
  <text x="668" y="154" font-size="16" font-weight="bold" fill="#047857">1번 왕복</text>

  <rect x="544" y="178" width="220" height="66" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="654" y="205" font-size="18" font-weight="bold" fill="#5b21b6" text-anchor="middle">BFF</text>
  <text x="654" y="232" font-size="15" fill="#1f2937" text-anchor="middle">인증·집계·응답 변환</text>

  <path d="M654,245 V270 M510,270 H798" stroke="#4b5563" stroke-width="2" fill="none"/>
  <line x1="510" y1="270" x2="510" y2="298" stroke="#4b5563" stroke-width="2" marker-end="url(#gry)"/>
  <line x1="606" y1="270" x2="606" y2="298" stroke="#4b5563" stroke-width="2" marker-end="url(#gry)"/>
  <line x1="702" y1="270" x2="702" y2="298" stroke="#4b5563" stroke-width="2" marker-end="url(#gry)"/>
  <line x1="798" y1="270" x2="798" y2="298" stroke="#4b5563" stroke-width="2" marker-end="url(#gry)"/>

  <rect x="470" y="300" width="80" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="510" y="330" font-size="16" fill="#111827" text-anchor="middle">주문</text>
  <rect x="566" y="300" width="80" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="606" y="330" font-size="16" fill="#111827" text-anchor="middle">사용자</text>
  <rect x="662" y="300" width="80" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="702" y="330" font-size="16" fill="#111827" text-anchor="middle">상품</text>
  <rect x="758" y="300" width="80" height="48" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="798" y="330" font-size="16" fill="#111827" text-anchor="middle">배송</text>

  <text x="654" y="384" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">프론트는 BFF만 안다</text>
</svg>
