<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동작 원리 — 주소 계산</title>
  <desc id="d">배열의 각 인덱스와 해당 요소의 값, 시작 주소 및 4바이트씩 일정하게 증가하는 주소 계산 구조를 보여주는 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="#ffffff"/>

  <!-- 인덱스 라벨 -->
  <text x="148" y="32" font-size="14" fill="#52606d" text-anchor="middle" font-weight="bold">arr[0]</text>
  <text x="294" y="32" font-size="14" fill="#52606d" text-anchor="middle" font-weight="bold">arr[1]</text>
  <text x="440" y="32" font-size="14" fill="#52606d" text-anchor="middle" font-weight="bold">arr[2]</text>
  <text x="586" y="32" font-size="14" fill="#52606d" text-anchor="middle" font-weight="bold">arr[3]</text>
  <text x="732" y="32" font-size="14" fill="#52606d" text-anchor="middle" font-weight="bold">arr[4]</text>

  <!-- 배열 박스 그룹 -->
  <g stroke="#9aa5b1" stroke-width="1.5">
    <rect x="75" y="44" width="146" height="50" fill="#eff6ff"/>
    <rect x="221" y="44" width="146" height="50" fill="#eff6ff"/>
    <rect x="367" y="44" width="146" height="50" fill="#eff6ff"/>
    <rect x="513" y="44" width="146" height="50" fill="#eff6ff"/>
    <rect x="659" y="44" width="146" height="50" fill="#eff6ff"/>
  </g>

  <!-- 배열 값 -->
  <text x="148" y="74.5" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">10</text>
  <text x="294" y="74.5" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">20</text>
  <text x="440" y="74.5" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">30</text>
  <text x="586" y="74.5" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">40</text>
  <text x="732" y="74.5" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">50</text>

  <!-- 주소 라벨 -->
  <text x="148" y="118" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">0x1000</text>
  <text x="294" y="118" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">0x1004</text>
  <text x="440" y="118" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">0x1008</text>
  <text x="586" y="118" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">0x100C</text>
  <text x="732" y="118" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">0x1010</text>

  <!-- 각 칸 연결 선 및 화살표 구조 -->
  <path d="M148,126 L148,150 L732,150 L732,126" fill="none" stroke="#52606d" stroke-width="1.5"/>
  <line x1="294" y1="126" x2="294" y2="150" stroke="#52606d" stroke-width="1.5"/>
  <line x1="440" y1="126" x2="440" y2="150" stroke="#52606d" stroke-width="1.5"/>
  <line x1="586" y1="126" x2="586" y2="150" stroke="#52606d" stroke-width="1.5"/>
  <line x1="440" y1="150" x2="440" y2="182" stroke="#52606d" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <!-- 하단 부가 설명 라벨 -->
  <rect x="330" y="192" width="220" height="28" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="210" font-size="13" fill="#1f2933" text-anchor="middle">각 칸 4바이트씩 정확히 일정</text>
</svg>