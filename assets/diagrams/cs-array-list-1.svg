<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">배열의 연속 메모리 배치</title>
  <desc id="d">int arr[5]의 값 10~50이 0x1000부터 빈틈없이 이어진 칸에 놓이고, 주소가 0x1000, 0x1004, 0x1008, 0x100C, 0x1010으로 각 칸 4바이트씩 정확히 일정하게 늘어나는 모습.</desc>
  <rect width="880" height="280" fill="#ffffff"/>
  <defs>
    <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 행 머리 -->
  <text x="24" y="53" font-size="15" fill="#4b5563">인덱스</text>
  <text x="24" y="100" font-size="15" fill="#4b5563">값</text>
  <text x="24" y="163" font-size="15" fill="#4b5563">주소</text>

  <!-- 인덱스 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="16" fill="#374151" text-anchor="middle">
    <text x="168" y="53">arr[0]</text>
    <text x="304" y="53">arr[1]</text>
    <text x="440" y="53">arr[2]</text>
    <text x="576" y="53">arr[3]</text>
    <text x="712" y="53">arr[4]</text>
  </g>

  <!-- 연속된 칸 -->
  <g fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5">
    <rect x="100" y="66" width="136" height="60"/>
    <rect x="236" y="66" width="136" height="60"/>
    <rect x="372" y="66" width="136" height="60"/>
    <rect x="508" y="66" width="136" height="60"/>
    <rect x="644" y="66" width="136" height="60"/>
  </g>
  <g font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="168" y="104">10</text>
    <text x="304" y="104">20</text>
    <text x="440" y="104">30</text>
    <text x="576" y="104">40</text>
    <text x="712" y="104">50</text>
  </g>

  <!-- 주소 -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
    <text x="168" y="163">0x1000</text>
    <text x="304" y="163">0x1004</text>
    <text x="440" y="163">0x1008</text>
    <text x="576" y="163">0x100C</text>
    <text x="712" y="163">0x1010</text>
  </g>

  <!-- 주소 간격 -->
  <g fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ah-o)">
    <path d="M194,176 Q236,206 276,178"/>
    <path d="M330,176 Q372,206 412,178"/>
    <path d="M466,176 Q508,206 548,178"/>
    <path d="M602,176 Q644,206 684,178"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">
    <text x="236" y="222">+4바이트</text>
    <text x="372" y="222">+4바이트</text>
    <text x="508" y="222">+4바이트</text>
    <text x="644" y="222">+4바이트</text>
  </g>

  <!-- 요점 -->
  <text x="440" y="258" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">각 칸 4바이트씩 정확히 일정</text>
</svg>
