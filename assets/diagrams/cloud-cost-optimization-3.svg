<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Spot 중단 통보 경로</title>
  <desc id="d">AWS가 용량 회수를 결정하면 인스턴스 메타데이터(/latest/meta-data/spot/instance-action)에 중단 예고가 노출되고 EventBridge 이벤트(Spot Instance Interruption Warning)가 발행되며, 약 2분 뒤 인스턴스가 중지 또는 종료된다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 시작점 -->
  <rect x="24" y="24" width="300" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="174" y="56" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">AWS가 용량 회수를 결정</text>

  <!-- 줄기와 가지 -->
  <line x1="64" y1="76" x2="64" y2="398" stroke="#374151" stroke-width="2"/>
  <line x1="64" y1="126" x2="110" y2="126" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="64" y1="296" x2="110" y2="296" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="64" y1="398" x2="110" y2="398" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar-red)"/>

  <!-- 1. 인스턴스 메타데이터 -->
  <rect x="112" y="100" width="744" height="146" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="136" y="132" font-size="17" font-weight="bold" fill="#111827">인스턴스 메타데이터에 중단 예고 노출</text>
  <rect x="728" y="112" width="112" height="26" rx="13" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="784" y="130" font-size="14" fill="#92400e" text-anchor="middle">폴링으로 확인</text>
  <rect x="136" y="148" width="348" height="30" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="148" y="168" font-size="15" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">/latest/meta-data/spot/instance-action</text>
  <text x="136" y="206" font-size="15" fill="#4b5563">평소</text>
  <text x="256" y="206" font-size="15" font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" fill="#111827">404</text>
  <text x="136" y="230" font-size="15" fill="#4b5563">회수 예정이면</text>
  <text x="256" y="230" font-size="15" fill="#111827">action과 시각이 담긴 JSON</text>

  <!-- 2. EventBridge -->
  <rect x="112" y="270" width="744" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="136" y="302" font-size="17" font-weight="bold" fill="#111827">EventBridge 이벤트 발행</text>
  <rect x="728" y="282" width="112" height="26" rx="13" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="784" y="300" font-size="14" fill="#92400e" text-anchor="middle">이벤트로 수신</text>
  <text x="136" y="328" font-size="15" fill="#374151">(Spot Instance Interruption Warning)</text>

  <!-- 3. 중지/종료 -->
  <rect x="112" y="370" width="744" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="136" y="404" font-size="17" font-weight="bold" fill="#b91c1c">약 2분 뒤 인스턴스 중지/종료</text>
</svg>
