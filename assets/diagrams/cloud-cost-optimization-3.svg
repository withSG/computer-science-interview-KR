<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">중단은 이렇게 통보된다</title>
  <desc id="d">AWS가 Spot 인스턴스 용량 회수를 결정하면 인스턴스 메타데이터와 EventBridge를 통해 예고하고 약 2분 뒤 인스턴스를 중지 또는 종료하는 과정을 나타낸 트리 다이어그램</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <defs>
    <!-- 화살표 마커 (잉크색) -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <!-- 화살표 마커 (주황색 - 경고/예고) -->
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <!-- 화살표 마커 (빨강색 - 중지/종료) -->
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 문서 헤딩 / 제목 영역 -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">중단은 이렇게 통보된다</text>

  <!-- Root 노드: AWS가 용량 회수를 결정 -->
  <rect x="40" y="80" width="230" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="155" y="109.75" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">AWS가 용량 회수를 결정</text>

  <!-- Branch 1: 인스턴스 메타데이터에 중단 예고 노출 -->
  <rect x="340" y="80" width="500" height="100" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="112.75" font-size="13" font-weight="bold" fill="#1f2933">인스턴스 메타데이터에 중단 예고 노출</text>
  <text x="380" y="137.25" font-size="11.5" font-family="Consolas, monospace" fill="#52606d">/latest/meta-data/spot/instance-action</text>
  <text x="380" y="161.25" font-size="11.5" fill="#52606d">(평소 404, 회수 예정이면 action과 시각이 담긴 JSON)</text>

  <!-- Branch 2: EventBridge 이벤트 발행 -->
  <rect x="340" y="210" width="500" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="235.75" font-size="13" font-weight="bold" fill="#1f2933">EventBridge 이벤트 발행</text>
  <text x="380" y="256.25" font-size="11.5" fill="#52606d">(Spot Instance Interruption Warning)</text>

  <!-- Branch 3: 약 2분 뒤 인스턴스 중지/종료 -->
  <rect x="340" y="300" width="500" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="329.75" font-size="13" font-weight="bold" fill="#dc2626">약 2분 뒤 인스턴스 중지/종료</text>

  <!-- 트리 연결선 및 화살표 -->
  <!-- Root 오른쪽 분기선 메인 줄 -->
  <path d="M 270,105 L 300,105 L 300,325" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>

  <!-- Branch 1 화살표 (top) -->
  <path d="M 300,105 L 340,105" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>

  <!-- Branch 2 화살표 (middle) -->
  <path d="M 300,240 L 340,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Branch 3 화살표 (bottom) -->
  <path d="M 300,325 L 340,325" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
</svg>