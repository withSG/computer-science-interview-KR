<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">학생_수강 테이블 예시</title>
  <desc id="d">정규화 전 학생_수강 테이블. 학생ID, 학생명, 학과코드, 학과명, 과목코드, 과목명 6개 열에 김철수(1001)의 수강 2행과 이영희(1002)의 수강 1행이 들어 있고, 기본키는 학생ID + 과목코드다.</desc>
  <rect width="880" height="310" fill="#ffffff"/>

  <text x="24" y="44" font-size="18" font-weight="bold" fill="#111827">학생_수강 테이블 <tspan font-weight="normal" fill="#374151">(정규화 전)</tspan></text>

  <!-- 행 배경 -->
  <rect x="24" y="64" width="832" height="46" fill="#e5e7eb"/>
  <rect x="24" y="110" width="832" height="44" fill="#ffffff"/>
  <rect x="24" y="154" width="832" height="44" fill="#f9fafb"/>
  <rect x="24" y="198" width="832" height="44" fill="#ffffff"/>

  <!-- 격자 -->
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="24" y1="154" x2="856" y2="154"/>
    <line x1="24" y1="198" x2="856" y2="198"/>
    <line x1="148" y1="64" x2="148" y2="242"/>
    <line x1="272" y1="64" x2="272" y2="242"/>
    <line x1="408" y1="64" x2="408" y2="242"/>
    <line x1="576" y1="64" x2="576" y2="242"/>
    <line x1="712" y1="64" x2="712" y2="242"/>
  </g>
  <line x1="24" y1="110" x2="856" y2="110" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="24" y="64" width="832" height="178" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- 머리행 -->
  <g font-size="16" font-weight="bold" fill="#111827">
    <text x="38" y="93">학생ID</text>
    <text x="162" y="93">학생명</text>
    <text x="286" y="93">학과코드</text>
    <text x="422" y="93">학과명</text>
    <text x="590" y="93">과목코드</text>
    <text x="726" y="93">과목명</text>
  </g>
  <rect x="100" y="76" width="34" height="22" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="117" y="92" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">PK</text>
  <rect x="664" y="76" width="34" height="22" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="681" y="92" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">PK</text>

  <!-- 데이터 -->
  <g font-size="16" fill="#111827">
    <text x="38" y="138">1001</text>
    <text x="162" y="138">김철수</text>
    <text x="286" y="138">CS</text>
    <text x="422" y="138">컴퓨터공학</text>
    <text x="590" y="138">C001</text>
    <text x="726" y="138">자료구조</text>

    <text x="38" y="182">1001</text>
    <text x="162" y="182">김철수</text>
    <text x="286" y="182">CS</text>
    <text x="422" y="182">컴퓨터공학</text>
    <text x="590" y="182">C002</text>
    <text x="726" y="182">알고리즘</text>

    <text x="38" y="226">1002</text>
    <text x="162" y="226">이영희</text>
    <text x="286" y="226">EE</text>
    <text x="422" y="226">전자공학</text>
    <text x="590" y="226">E001</text>
    <text x="726" y="226">회로이론</text>
  </g>

  <!-- 범례 -->
  <rect x="24" y="262" width="34" height="22" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="41" y="278" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">PK</text>
  <text x="68" y="279" font-size="15" fill="#374151">기본키(학생ID + 과목코드)</text>
</svg>
