<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">float 높이 붕괴</title>
  <desc id="d">자식 A와 B에 float:left를 주면 자식이 흐름에서 빠져 부모 .row가 높이를 모르고 높이 0으로 붕괴한다.</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 왼쪽: HTML -->
  <text x="24" y="40" font-size="15" font-weight="bold" fill="#374151">HTML</text>
  <rect x="24" y="54" width="392" height="182" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <g font-size="16" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="44" y="94">&lt;div class="<tspan font-weight="bold" fill="#b91c1c">row</tspan>"&gt;</text>
    <text x="72" y="132">&lt;div style="<tspan font-weight="bold" fill="#1d4ed8">float:left</tspan>"&gt;A&lt;/div&gt;</text>
    <text x="72" y="170">&lt;div style="<tspan font-weight="bold" fill="#1d4ed8">float:left</tspan>"&gt;B&lt;/div&gt;</text>
    <text x="44" y="208">&lt;/div&gt;</text>
  </g>

  <!-- 가운데 화살표 -->
  <line x1="428" y1="145" x2="462" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 오른쪽: 렌더링 결과 -->
  <text x="484" y="40" font-size="15" font-weight="bold" fill="#374151">렌더링 결과</text>

  <text x="484" y="84" font-size="16" font-weight="bold" fill="#b91c1c">.row (높이 0!)</text>
  <rect x="484" y="96" width="240" height="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>

  <rect x="484" y="114" width="76" height="76" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="522" y="159" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>
  <rect x="572" y="114" width="76" height="76" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="159" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">B</text>

  <line x1="690" y1="152" x2="658" y2="152" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="700" y="146" font-size="15" fill="#1f2937">자식이 흐름에서 빠져</text>
  <text x="700" y="168" font-size="15" fill="#1f2937">부모가 높이를 모른다</text>
</svg>
