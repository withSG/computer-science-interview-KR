<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">5. float와 clearfix — 왜 역사인가</title>
  <desc id="d">float 적용 시 자식 요소가 흐름에서 빠져 부모의 높이가 0이 되는 현상을 나타낸 다이어그램</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  <defs>
    <marker id="a-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <!-- Left Code Block -->
  <rect x="30" y="30" width="370" height="200" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="50" y="72" font-size="13" fill="#1f2933" font-family="Consolas, Monaco, monospace">&lt;div class="row"&gt;</text>
  <text x="74" y="112" font-size="13" fill="#2563eb" font-family="Consolas, Monaco, monospace">&lt;div style="float:left"&gt;A&lt;/div&gt;</text>
  <text x="74" y="152" font-size="13" fill="#2563eb" font-family="Consolas, Monaco, monospace">&lt;div style="float:left"&gt;B&lt;/div&gt;</text>
  <text x="50" y="192" font-size="13" fill="#1f2933" font-family="Consolas, Monaco, monospace">&lt;/div&gt;</text>

  <!-- Right Visual Diagram -->
  <!-- .row (높이 0!) -->
  <rect x="440" y="45" width="230" height="28" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="555" y="63" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">.row (높이 0!)</text>

  <!-- Box A -->
  <rect x="440" y="105" width="60" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="140" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>

  <!-- Box B -->
  <rect x="520" y="105" width="60" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="140" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">B</text>

  <!-- Arrow & Annotation -->
  <path d="M 640 135 L 600 135" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-sub)"/>
  <text x="650" y="129" font-size="13" fill="#52606d">자식이 흐름에서 빠져</text>
  <text x="650" y="149" font-size="13" fill="#52606d">부모가 높이를 모른다</text>
</svg>