<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">비트 배치</title>
  <desc id="d">32비트 단정도 float와 64비트 배정도 double의 IEEE 754 비트 배치를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Section 1: 32비트 단정도 float -->
  <text x="30" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="start">[32비트 단정도 float]</text>

  <!-- 32비트 Float Diagram Box Group -->
  <!-- Total Diagram Width = 820px, starting x = 30 -->
  <!-- S: 1 bit (approx ratio -> 50px) -->
  <rect x="30" y="60" width="50" height="40" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="55" y="84" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">S</text>

  <!-- E (8): 8 bits (approx ratio -> 200px) -->
  <rect x="80" y="60" width="200" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="84" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">E (8)</text>

  <!-- M (23): 23 bits (approx ratio -> 570px) -->
  <rect x="280" y="60" width="570" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="84" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">M (23)</text>

  <!-- Bit labels and Bias for Float -->
  <text x="55" y="122" font-size="13" fill="#52606d" text-anchor="middle">1</text>
  <text x="180" y="122" font-size="13" fill="#52606d" text-anchor="middle">8</text>
  <text x="565" y="122" font-size="13" fill="#52606d" text-anchor="middle">23</text>
  <text x="850" y="122" font-size="13" fill="#52606d" text-anchor="end">bias = 127</text>

  <!-- Section 2: 64비트 배정도 double -->
  <text x="30" y="190" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="start">[64비트 배정도 double]</text>

  <!-- 64비트 Double Diagram Box Group -->
  <!-- S: 1 bit (50px) -->
  <rect x="30" y="210" width="50" height="40" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="55" y="234" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">S</text>

  <!-- E (11): 11 bits (220px) -->
  <rect x="80" y="210" width="220" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="234" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">E (11)</text>

  <!-- M (52): 52 bits (550px) -->
  <rect x="300" y="210" width="550" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="575" y="234" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">M (52)</text>

  <!-- Bit labels and Bias for Double -->
  <text x="55" y="272" font-size="13" fill="#52606d" text-anchor="middle">1</text>
  <text x="190" y="272" font-size="13" fill="#52606d" text-anchor="middle">11</text>
  <text x="575" y="272" font-size="13" fill="#52606d" text-anchor="middle">52</text>
  <text x="850" y="272" font-size="13" fill="#52606d" text-anchor="end">bias = 1023</text>
</svg>