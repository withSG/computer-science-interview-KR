<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">메시지 큐 활용</title>
  <desc id="d">Producer에서 Message Queue를 거쳐 Consumer로 이어지는 구조와 메시지 큐의 장점을 설명하는 다이어그램입니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="#ffffff"/>

  <!-- Title Section -->
  <text x="30" y="31.6" font-size="16" font-weight="bold" fill="#1f2933">메시지 큐 활용</text>

  <!-- Producer Box -->
  <rect x="30" y="50" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="80.55" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Producer</text>

  <!-- Arrow Producer -> MQ -->
  <path d="M170,75 L220,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Message Queue Box -->
  <rect x="220" y="50" width="220" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="72.55" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[Message Queue]</text>
  <text x="330" y="89.025" font-size="11.5" fill="#52606d" text-anchor="middle">(RabbitMQ, Kafka, SQS)</text>

  <!-- Arrow MQ -> Consumer -->
  <path d="M440,75 L490,75" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Consumer Box -->
  <rect x="490" y="50" width="140" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="560" y="80.55" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Consumer</text>

  <!-- Advantages Section -->
  <rect x="30" y="125" width="600" height="110" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="50" y="152.55" font-size="14" font-weight="bold" fill="#1f2933">장점:</text>
  <text x="50" y="174.55" font-size="13" fill="#1f2933">- 서비스 간 결합도 감소</text>
  <text x="50" y="195.55" font-size="13" fill="#1f2933">- 부하 분산</text>
  <text x="50" y="216.55" font-size="13" fill="#1f2933">- 재시도/실패 처리</text>
</svg>