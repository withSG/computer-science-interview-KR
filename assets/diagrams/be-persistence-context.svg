<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">엔티티 상태 전이도</title>
  <desc id="d">new Member()로 만든 객체는 비영속이고, em.persist()나 em.find() 조회로 영속이 된다. 영속은 em.detach(), em.clear(), em.close()로 준영속, em.remove()로 삭제 상태가 된다. em.merge()는 인자를 영속으로 바꾸지 않고 같은 식별자의 영속 엔티티에 값을 복사해 그 영속 인스턴스를 반환한다.</desc>
  <rect width="880" height="650" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 진입 -->
  <text x="125" y="48" text-anchor="middle" font-size="16" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">new Member()</text>
  <line x1="125" y1="58" x2="125" y2="96" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="440" y="48" text-anchor="middle" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.find()</tspan>로 조회</text>
  <line x1="440" y1="58" x2="440" y2="96" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 비영속 -->
  <rect x="40" y="100" width="170" height="126" rx="10" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="125" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">비영속</text>
  <text x="125" y="156" text-anchor="middle" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(new)</text>
  <text x="125" y="186" text-anchor="middle" font-size="15" fill="#374151">JPA가 존재를 모름.</text>
  <text x="125" y="208" text-anchor="middle" font-size="15" fill="#374151">그냥 자바 객체.</text>

  <!-- 영속 -->
  <rect x="355" y="100" width="170" height="126" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">영속</text>
  <text x="440" y="156" text-anchor="middle" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(managed)</text>
  <text x="440" y="186" text-anchor="middle" font-size="15" fill="#374151">1차 캐시 등록,</text>
  <text x="440" y="208" text-anchor="middle" font-size="15" fill="#374151">변경 감지 대상</text>

  <!-- 준영속 -->
  <rect x="670" y="100" width="170" height="126" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="755" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#6d28d9">준영속</text>
  <text x="755" y="156" text-anchor="middle" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(detached)</text>
  <text x="755" y="186" text-anchor="middle" font-size="15" fill="#374151">관리 대상에서 제외,</text>
  <text x="755" y="208" text-anchor="middle" font-size="15" fill="#374151">변경 감지 안 됨</text>

  <!-- 삭제 -->
  <rect x="355" y="300" width="170" height="126" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="334" text-anchor="middle" font-size="19" font-weight="700" fill="#b91c1c">삭제</text>
  <text x="440" y="356" text-anchor="middle" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(removed)</text>
  <text x="440" y="386" text-anchor="middle" font-size="15" fill="#374151">DELETE 예약 상태.</text>
  <text x="440" y="408" text-anchor="middle" font-size="15" fill="#374151">커밋 시 실제 삭제.</text>

  <!-- 비영속 → 영속 -->
  <line x1="210" y1="163" x2="351" y2="163" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="282" y="151" text-anchor="middle" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.persist()</text>

  <!-- 영속 → 준영속 -->
  <line x1="525" y1="140" x2="666" y2="140" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="597" y="84" text-anchor="middle" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.detach()</text>
  <text x="597" y="104" text-anchor="middle" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.clear()</text>
  <text x="597" y="124" text-anchor="middle" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.close()</text>

  <!-- 준영속 → 영속 -->
  <line x1="670" y1="190" x2="529" y2="190" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="597" y="214" text-anchor="middle" font-size="15" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.merge()</tspan> ※</text>

  <!-- 영속 → 삭제 -->
  <line x1="440" y1="226" x2="440" y2="296" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="428" y="266" text-anchor="end" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.remove()</text>

  <!-- merge 상세 -->
  <rect x="40" y="456" width="800" height="170" rx="10" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="64" y="488" font-size="17" font-weight="700" fill="#111827">※ <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">em.merge()</tspan>는 준영속 객체를 영속으로 바꾸지 않는다</text>

  <rect x="64" y="508" width="170" height="96" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="149" y="546" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">인자로 넘긴 객체</text>
  <text x="149" y="572" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">호출 뒤에도 준영속</text>

  <line x1="234" y1="566" x2="300" y2="566" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="269" y="554" text-anchor="middle" font-size="15" fill="#111827">값 복사</text>

  <rect x="304" y="508" width="240" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="424" y="538" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">같은 식별자의 영속 엔티티</text>
  <text x="424" y="564" text-anchor="middle" font-size="15" fill="#374151">1차 캐시에서 찾고,</text>
  <text x="424" y="586" text-anchor="middle" font-size="15" fill="#374151">없으면 DB에서 조회</text>

  <line x1="544" y1="566" x2="610" y2="566" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="579" y="554" text-anchor="middle" font-size="15" fill="#111827">반환</text>

  <rect x="614" y="508" width="202" height="96" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="715" y="538" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">반환값</text>
  <text x="715" y="564" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">영속 인스턴스</text>
  <text x="715" y="586" text-anchor="middle" font-size="15" fill="#374151">이후 작업은 반환값으로</text>
</svg>
