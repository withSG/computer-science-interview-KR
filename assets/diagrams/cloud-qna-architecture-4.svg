<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">채팅 메시지 전송 흐름</title>
  <desc id="d">1:1 채팅은 User A → Gateway Server 1 → Kafka → Gateway Server 2 → User B 순서로 전달되고, 두 Gateway 서버가 Cassandra에 저장합니다. 그룹 채팅은 멤버 목록 조회, 각 멤버의 Gateway 서버 확인, 병렬 전달 세 단계입니다.</desc>
  <rect width="880" height="452" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 1:1 채팅 -->
  <text x="24" y="44" font-size="18" font-weight="bold" fill="#111827">1:1 채팅</text>

  <rect x="24" y="64" width="112" height="64" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="80" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">User A</text>

  <rect x="180" y="64" width="150" height="64" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="255" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Gateway</text>
  <text x="255" y="113" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Server 1</text>

  <rect x="374" y="64" width="132" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Kafka</text>

  <rect x="550" y="64" width="150" height="64" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="625" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Gateway</text>
  <text x="625" y="113" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Server 2</text>

  <rect x="744" y="64" width="112" height="64" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="800" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">User B</text>

  <line x1="136" y1="96" x2="178" y2="96" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="330" y1="96" x2="372" y2="96" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="506" y1="96" x2="548" y2="96" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="700" y1="96" x2="742" y2="96" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Gateway → Cassandra -->
  <path d="M255,128 V172 H400 V206" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-g)"/>
  <path d="M625,128 V172 H480 V206" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#ah-g)"/>

  <rect x="360" y="208" width="160" height="64" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="440" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Cassandra</text>
  <text x="440" y="259" text-anchor="middle" font-size="16" fill="#047857">(저장)</text>

  <line x1="24" y1="304" x2="856" y2="304" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 그룹 채팅 -->
  <text x="24" y="344" font-size="18" font-weight="bold" fill="#111827">그룹 채팅</text>

  <rect x="24" y="364" width="230" height="64" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="54" cy="396" r="14" fill="#1d4ed8"/>
  <text x="54" y="401" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="78" y="402" font-size="16" fill="#1f2937">그룹 멤버 목록 조회</text>

  <rect x="298" y="364" width="290" height="64" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="328" cy="396" r="14" fill="#1d4ed8"/>
  <text x="328" y="401" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="352" y="402" font-size="16" fill="#1f2937">각 멤버의 Gateway 서버 확인</text>

  <rect x="632" y="364" width="224" height="64" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="662" cy="396" r="14" fill="#1d4ed8"/>
  <text x="662" y="401" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="686" y="402" font-size="16" fill="#1f2937">병렬로 메시지 전달</text>

  <line x1="254" y1="396" x2="296" y2="396" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="588" y1="396" x2="630" y2="396" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
</svg>
