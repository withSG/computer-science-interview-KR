<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">메시지 전송 흐름</title>
  <desc id="d">1:1 채팅 메시지 전송 흐름과 그룹 채팅 처리 방식을 설명하는 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 1:1 채팅 Section Label -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">1:1 채팅:</text>

  <!-- Flow Line Background Path for Gateway to Cassandra -->
  <path d="M250,110 L250,160 L440,160 L440,195" stroke="#059669" stroke-width="1.5" fill="none"/>
  <path d="M630,110 L630,160 L440,160" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Arrows between Main Sequence -->
  <path d="M120,80 L188,80" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M310,80 L378,80" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M500,80 L568,80" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M690,80 L758,80" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- User A Box -->
  <rect x="30" y="50" width="90" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="75" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">User A</text>

  <!-- Gateway Server 1 Box -->
  <rect x="190" y="50" width="120" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="250" y="74.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Gateway</text>
  <text x="250" y="94.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Server 1</text>

  <!-- Kafka Box -->
  <rect x="380" y="50" width="120" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Kafka</text>

  <!-- Gateway Server 2 Box -->
  <rect x="570" y="50" width="120" height="60" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="630" y="74.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Gateway</text>
  <text x="630" y="94.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Server 2</text>

  <!-- User B Box -->
  <rect x="760" y="50" width="90" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="805" y="84.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">User B</text>

  <!-- Cassandra Box -->
  <rect x="370" y="200" width="140" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="228.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Cassandra</text>
  <text x="440" y="252.55" font-size="13" fill="#52606d" text-anchor="middle">(저장)</text>

  <line x1="30" y1="310" x2="850" y2="310" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 그룹 채팅 Section Label -->
  <text x="30" y="350" font-size="16" font-weight="bold" fill="#1f2933">그룹 채팅:</text>

  <!-- List Items -->
  <circle cx="40" cy="380" r="3" fill="#52606d"/>
  <text x="52" y="384.55" font-size="13" fill="#1f2933">- 그룹 멤버 목록 조회</text>

  <circle cx="40" cy="410" r="3" fill="#52606d"/>
  <text x="52" y="414.55" font-size="13" fill="#1f2933">- 각 멤버의 Gateway 서버 확인</text>

  <circle cx="40" cy="440" r="3" fill="#52606d"/>
  <text x="52" y="444.55" font-size="13" fill="#1f2933">- 병렬로 메시지 전달</text>
</svg>