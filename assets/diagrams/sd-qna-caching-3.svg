<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Read-Through 읽기 흐름</title>
  <desc id="d">애플리케이션이 캐시를 조회하고, Cache Miss이면 캐시가 자동으로 DB를 조회해 저장한 뒤 응답을 반환하는 Read-Through 순서도.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 요점 캡션 -->
  <text x="40" y="44" font-size="19" font-weight="bold" fill="#111827"><tspan fill="#1d4ed8">Read-Through</tspan><tspan fill="#111827">  ·  캐시가 DB를 직접 조회</tspan></text>

  <!-- 참여자 -->
  <rect x="40" y="70" width="180" height="48" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="130" y="100" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">애플리케이션</text>

  <rect x="350" y="70" width="180" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="100" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">캐시</text>

  <rect x="660" y="70" width="180" height="48" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="750" y="100" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">DB</text>

  <!-- 생명선 -->
  <line x1="130" y1="118" x2="130" y2="440" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="440" y1="118" x2="440" y2="440" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="750" y1="118" x2="750" y2="440" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 1. 캐시 조회 -->
  <text x="285" y="160" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. 캐시 조회</text>
  <line x1="132" y1="174" x2="436" y2="174" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 2. Cache Miss 구간: 캐시가 DB를 직접 조회하고 저장 -->
  <rect x="300" y="200" width="556" height="176" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="578" y="230" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">2. Cache Miss → 캐시가 자동으로 DB 조회 및 저장</text>
  <line x1="440" y1="246" x2="440" y2="376" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="750" y1="246" x2="750" y2="376" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>

  <text x="595" y="272" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">DB 조회</text>
  <line x1="442" y1="284" x2="746" y2="284" stroke="#b45309" stroke-width="2" marker-end="url(#ah-orange)"/>
  <line x1="748" y1="314" x2="444" y2="314" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>

  <rect x="380" y="330" width="120" height="34" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="352" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">캐시에 저장</text>

  <!-- 3. 응답 반환 -->
  <text x="285" y="408" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">3. 응답 반환</text>
  <line x1="438" y1="422" x2="134" y2="422" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
</svg>
