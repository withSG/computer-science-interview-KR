<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Read-Through 읽기 전략</title>
  <desc id="d">캐시가 DB를 직접 조회하는 Read-Through 전략 흐름도</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 제목 / 섹션 헤딩 -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">2. Read-Through</text>
  <text x="40" y="75" font-size="13" fill="#52606d">캐시가 DB를 직접 조회</text>

  <!-- 메인 흐름 박스 (전체 프로세스 영역) -->
  <rect x="40" y="100" width="800" height="200" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>

  <!-- Step 1: 1. 캐시 조회 -->
  <rect x="70" y="130" width="180" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="159" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">1. 캐시 조회</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M250,155 L280,155" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Step 2: 2. Cache Miss → 캐시가 자동으로 DB 조회 및 저장 -->
  <!-- 글자 폭 계산: '2. Cache Miss → 캐시가 자동으로 DB 조회 및 저장' 
       한글 20자(260) + 영문/숫자/기호 14자(~12) = ~272px -> 박스 폭 430px로 충분함 -->
  <rect x="290" y="130" width="430" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="505" y="159" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">2. Cache Miss → 캐시가 자동으로 DB 조회 및 저장</text>

  <!-- Arrow 2 -> 3 (아래로 꺾어서 3번으로 연결) -->
  <path d="M505,180 L505,220 L260,220" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-orange)"/>

  <!-- Step 3: 3. 응답 반환 -->
  <rect x="70" y="210" width="180" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="160" y="239" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">3. 응답 반환</text>
</svg>