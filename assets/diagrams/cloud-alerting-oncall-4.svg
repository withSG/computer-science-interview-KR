<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">장애 대응 흐름과 MTTD·MTTA·MTTR</title>
  <desc id="d">장애 발생, 감지, 확인, 완화, 복구, 회고로 이어지는 타임라인 위에 MTTD(발생→감지, 알림 설계의 품질), MTTA(감지→확인, On-call 체계의 품질), MTTR(발생→복구, 사용자가 아팠던 시간, 대응 절차와 롤백 능력의 품질) 구간을 막대로 표시하고, 확인부터 복구까지는 원인 규명을 하면 안 되는 구간임을 보여준다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 단계 라벨 -->
  <g font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="300" y="52">장애 발생</text>
    <text x="405" y="52">감지</text>
    <text x="510" y="52">확인</text>
    <text x="615" y="52">완화</text>
    <text x="720" y="52">복구</text>
    <text x="825" y="52">회고</text>
  </g>

  <!-- 세로 안내선 -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="300" y1="86" x2="300" y2="386"/>
    <line x1="405" y1="86" x2="405" y2="386"/>
    <line x1="510" y1="86" x2="510" y2="386"/>
    <line x1="615" y1="86" x2="615" y2="386"/>
    <line x1="720" y1="86" x2="720" y2="386"/>
    <line x1="825" y1="86" x2="825" y2="386"/>
  </g>

  <!-- 시간 축 -->
  <line x1="276" y1="74" x2="852" y2="74" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <g fill="#1f2937">
    <circle cx="300" cy="74" r="6"/>
    <circle cx="405" cy="74" r="6"/>
    <circle cx="510" cy="74" r="6"/>
    <circle cx="615" cy="74" r="6"/>
    <circle cx="720" cy="74" r="6"/>
    <circle cx="825" cy="74" r="6"/>
  </g>

  <!-- 행 구분선 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="24" y1="170" x2="856" y2="170"/>
    <line x1="24" y1="242" x2="856" y2="242"/>
  </g>
  <line x1="24" y1="318" x2="856" y2="318" stroke="#9ca3af" stroke-width="1"/>

  <!-- MTTD -->
  <text x="24" y="124" font-size="18" font-weight="bold" fill="#1d4ed8">MTTD</text>
  <text x="88" y="124" font-size="15" fill="#4b5563">발생→감지</text>
  <text x="24" y="148" font-size="15" fill="#111827">알림 설계의 품질</text>
  <rect x="300" y="115" width="105" height="32" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="352.5" y="136" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">MTTD</text>

  <!-- MTTA -->
  <text x="24" y="196" font-size="18" font-weight="bold" fill="#b45309">MTTA</text>
  <text x="88" y="196" font-size="15" fill="#4b5563">감지→확인</text>
  <text x="24" y="220" font-size="15" fill="#111827">On-call 체계의 품질</text>
  <rect x="405" y="187" width="105" height="32" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="457.5" y="208" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">MTTA</text>

  <!-- MTTR -->
  <text x="24" y="268" font-size="18" font-weight="bold" fill="#047857">MTTR</text>
  <text x="88" y="268" font-size="15" fill="#4b5563">발생→복구</text>
  <text x="24" y="292" font-size="15" fill="#111827">대응 절차와 롤백 능력의 품질</text>
  <rect x="300" y="259" width="420" height="32" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="510" y="280" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">MTTR · 사용자가 아팠던 시간</text>

  <!-- 원인 규명 금지 구간 -->
  <text x="24" y="352" font-size="18" font-weight="bold" fill="#b91c1c">확인→복구</text>
  <text x="24" y="376" font-size="15" font-weight="bold" fill="#b91c1c">여기서 원인 규명을 하면 안 된다</text>
  <rect x="510" y="343" width="210" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="615" y="364" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">완화 우선</text>
</svg>
