<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">어느 계층을 보느냐가 모든 차이를 만든다</title>
  <desc id="d">네트워크 패킷의 IP 헤더, TCP 헤더, 페이로드 구조와 각 계층(L3, L4, L7)이 읽고 판단하는 범위를 나타낸 다이어그램</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title / Label -->
  <text x="40" y="45" font-size="14" font-weight="bold" fill="#52606d">네트워크로 흘러가는 패킷 한 조각</text>

  <!-- Packet Frame & Sections -->
  <!-- IP Header Section (L3) -->
  <rect x="40" y="65" width="460" height="48" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="94" font-size="13" font-weight="bold" fill="#1f2933">IP 헤더</text>
  <text x="150" y="94" font-size="13" fill="#52606d">출발지 IP / 목적지 IP</text>

  <!-- Arrow & Annotation for L3 -->
  <path d="M570,89 L510,89" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="580" y="94" font-size="13" font-weight="bold" fill="#1f2933">L3</text>

  <!-- TCP Header Section (L4) -->
  <rect x="40" y="120" width="460" height="48" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="149" font-size="13" font-weight="bold" fill="#1f2933">TCP 헤더</text>
  <text x="150" y="149" font-size="13" fill="#52606d">출발지 포트 / 목적지 포트</text>

  <!-- Arrow & Annotation for L4 -->
  <path d="M570,144 L510,144" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="580" y="149" font-size="13" font-weight="bold" fill="#2563eb">L4는 여기까지 읽고 판단한다</text>

  <!-- Payload Section (L7) -->
  <rect x="40" y="175" width="460" height="185" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="204" font-size="13" font-weight="bold" fill="#1f2933">페이로드</text>
  
  <!-- HTTP Payload Content -->
  <rect x="75" y="220" width="405" height="120" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="95" y="248" font-size="13" fill="#1f2933" font-family="'Segoe UI', monospace, sans-serif">GET /api/orders/123 HTTP/1.1</text>
  <text x="95" y="278" font-size="13" fill="#1f2933" font-family="'Segoe UI', monospace, sans-serif">Host: api.example.com</text>
  <text x="95" y="308" font-size="13" fill="#1f2933" font-family="'Segoe UI', monospace, sans-serif">Cookie: SESSIONID=abc</text>

  <!-- Arrow & Annotation for L7 -->
  <path d="M570,267 L510,267" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="580" y="272" font-size="13" font-weight="bold" fill="#7c3aed">L7은 이 안까지 파싱한다</text>
</svg>