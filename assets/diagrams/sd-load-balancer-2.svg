<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">L4와 L7이 읽는 패킷 범위</title>
  <desc id="d">패킷 한 조각은 IP 헤더, TCP 헤더, 페이로드 순으로 쌓여 있다. L3는 IP 헤더, L4는 TCP 헤더까지 읽고 판단하며, L7은 페이로드 안의 HTTP 요청(GET /api/orders/123, Host, Cookie)까지 파싱한다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <text x="24" y="44" font-size="17" font-weight="bold" fill="#374151">네트워크로 흘러가는 패킷 한 조각</text>

  <!-- 패킷 -->
  <rect x="24" y="64" width="500" height="52" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="44" y="96" font-size="16" font-weight="bold" fill="#111827">IP 헤더</text>
  <text x="164" y="96" font-size="15" fill="#374151">출발지 IP / 목적지 IP</text>

  <rect x="24" y="116" width="500" height="52" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="148" font-size="16" font-weight="bold" fill="#111827">TCP 헤더</text>
  <text x="164" y="148" font-size="15" fill="#374151">출발지 포트 / 목적지 포트</text>

  <rect x="24" y="168" width="500" height="170" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="198" font-size="16" font-weight="bold" fill="#111827">페이로드</text>
  <rect x="44" y="214" width="460" height="106" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="244" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET /api/orders/123 HTTP/1.1</text>
  <text x="64" y="272" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Host: api.example.com</text>
  <text x="64" y="300" font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Cookie: SESSIONID=abc</text>

  <!-- 읽는 범위 막대 -->
  <text x="544" y="48" font-size="15" fill="#4b5563">읽는 범위</text>
  <rect x="548" y="64" width="10" height="52" rx="3" fill="#6b7280"/>
  <rect x="572" y="64" width="10" height="104" rx="3" fill="#1d4ed8"/>
  <rect x="596" y="64" width="10" height="274" rx="3" fill="#6d28d9"/>

  <text x="626" y="96" font-size="16" font-weight="bold" fill="#374151">L3</text>
  <text x="626" y="148" font-size="16" font-weight="bold" fill="#1d4ed8">L4는 여기까지 읽고 판단한다</text>
  <text x="626" y="249" font-size="16" font-weight="bold" fill="#6d28d9">L7은 이 안까지 파싱한다</text>
</svg>
