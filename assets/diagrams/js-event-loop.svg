<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이벤트 루프의 구성 요소와 순환 흐름</title>
  <desc id="d">콜 스택이 비동기 API를 호출하면(①) 호스트 환경이 다른 스레드에서 처리하고, 완료되면 콜백을 마이크로태스크 큐나 태스크 큐에 넣는다(②). 이벤트 루프는 콜 스택이 비면 큐에서 콜백을 꺼내 올리며(③, 마이크로태스크 우선) 이 순환을 무한 반복한다.</desc>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="770" fill="#ffffff"/>

  <!-- JavaScript 엔진 -->
  <rect x="224" y="24" width="632" height="208" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="244" y="54" font-size="18" font-weight="bold" fill="#111827">JavaScript 엔진</text>

  <rect x="244" y="70" width="250" height="142" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="369" y="96" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Call Stack</text>
  <text x="369" y="118" font-size="15" fill="#374151" text-anchor="middle">실행 중 · 하나뿐</text>
  <rect x="264" y="130" width="210" height="32" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="369" y="151" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">console.log('A')</text>
  <rect x="264" y="168" width="210" height="32" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="369" y="189" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Global Context</text>

  <rect x="514" y="70" width="322" height="142" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="675" y="96" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Heap</text>
  <text x="675" y="118" font-size="15" fill="#374151" text-anchor="middle">객체 저장</text>
  <line x1="627" y1="166" x2="675" y2="178" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="693" y1="172" x2="727" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="614" cy="163" r="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="680" cy="180" r="17" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="740" cy="156" r="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- ① 비동기 API 호출 -->
  <line x1="369" y1="214" x2="369" y2="280" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="384" y="264" font-size="16" font-weight="bold" fill="#1d4ed8">① 비동기 API 호출</text>

  <!-- 호스트 환경 -->
  <rect x="224" y="284" width="632" height="152" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="244" y="314" font-size="18" font-weight="bold" fill="#92400e">호스트 환경 (Web API / libuv)</text>
  <text x="836" y="314" font-size="15" fill="#4b5563" text-anchor="end">다른 스레드에서 처리</text>
  <rect x="244" y="330" width="290" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="389" y="356" font-size="16" fill="#1f2937" text-anchor="middle">타이머 (setTimeout)</text>
  <rect x="546" y="330" width="290" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="691" y="356" font-size="16" fill="#1f2937" text-anchor="middle">네트워크 (fetch / XHR)</text>
  <rect x="244" y="382" width="290" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="389" y="408" font-size="16" fill="#1f2937" text-anchor="middle">파일 I/O</text>
  <rect x="546" y="382" width="290" height="40" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="691" y="408" font-size="16" fill="#1f2937" text-anchor="middle">DOM 이벤트 리스너</text>

  <!-- ② 완료되면 콜백을 큐에 넣는다 -->
  <line x1="369" y1="438" x2="369" y2="496" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="384" y="474" font-size="16" font-weight="bold" fill="#92400e">② 완료되면 콜백을 큐에 넣는다</text>

  <!-- 큐 -->
  <rect x="224" y="500" width="632" height="244" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>

  <rect x="240" y="516" width="600" height="100" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="256" y="546" font-size="18" font-weight="bold" fill="#6d28d9">Microtask Queue (우선)</text>
  <text x="824" y="546" font-size="15" fill="#374151" text-anchor="end">큐가 빌 때까지 전부 처리</text>
  <rect x="256" y="562" width="120" height="38" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="316" y="586" font-size="15" fill="#1f2937" text-anchor="middle">Promise 반응</text>
  <rect x="386" y="562" width="152" height="38" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="462" y="586" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">queueMicrotask</text>
  <rect x="548" y="562" width="170" height="38" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="633" y="586" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">MutationObserver</text>

  <rect x="240" y="628" width="600" height="100" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="256" y="658" font-size="18" font-weight="bold" fill="#047857">Task Queue (매크로태스크)</text>
  <text x="824" y="658" font-size="15" fill="#374151" text-anchor="end">주기마다 하나씩 꺼냄</text>
  <rect x="256" y="674" width="116" height="38" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="314" y="698" font-size="15" fill="#1f2937" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTimeout</text>
  <rect x="382" y="674" width="106" height="38" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="435" y="698" font-size="15" fill="#1f2937" text-anchor="middle">이벤트 콜백</text>
  <rect x="498" y="674" width="90" height="38" rx="5" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="543" y="698" font-size="15" fill="#1f2937" text-anchor="middle">I/O 완료</text>

  <!-- 큐 → 이벤트 루프 -->
  <line x1="238" y1="566" x2="200" y2="566" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <line x1="238" y1="678" x2="200" y2="678" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- 이벤트 루프 -->
  <rect x="32" y="540" width="164" height="164" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="114" y="600" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Event Loop</text>
  <text x="114" y="624" font-size="15" fill="#374151" text-anchor="middle">이벤트 루프</text>
  <text x="114" y="668" font-size="15" fill="#374151" text-anchor="middle">이 순환을 무한 반복</text>

  <!-- ③ 콜 스택이 비면 꺼내 올린다 -->
  <path d="M60,538 L60,141 L240,141" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
  <text x="74" y="334" font-size="16" font-weight="bold" fill="#111827">③ 콜 스택이 비면</text>
  <text x="74" y="358" font-size="16" font-weight="bold" fill="#111827">꺼내 올린다</text>
</svg>
