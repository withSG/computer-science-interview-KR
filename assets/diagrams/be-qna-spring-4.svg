<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프론트 컨트롤러 패턴</title>
  <desc id="d">DispatcherServlet이 모든 요청의 진입점으로서 Controller1, Controller2, Controller3으로 요청을 위임하는 구조 다이어그램</desc>
  <rect width="880" height="260" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Central DispatcherServlet Box -->
  <rect x="290" y="40" width="300" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="71" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">DispatcherServlet</text>

  <!-- Side Note / Annotation -->
  <text x="610" y="70" font-size="13" fill="#52606d">← 모든 요청의 진입점</text>

  <!-- Flow Lines & Arrowheads -->
  <!-- Main vertical trunk from DispatcherServlet -->
  <path d="M440,90 L440,150" stroke="#2563eb" stroke-width="2" fill="none"/>
  
  <!-- Horizontal distribution branch -->
  <path d="M170,150 L710,150" stroke="#2563eb" stroke-width="2" fill="none"/>

  <!-- Left Branch & Arrow to Controller1 -->
  <path d="M170,150 L170,180" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Middle Branch & Arrow to Controller2 -->
  <path d="M440,150 L440,180" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- Right Branch & Arrow to Controller3 -->
  <path d="M710,150 L710,180" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Controller 1 -->
  <rect x="90" y="180" width="160" height="44" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="170" y="207" font-size="14" fill="#1f2933" text-anchor="middle">Controller1</text>

  <!-- Controller 2 -->
  <rect x="360" y="180" width="160" height="44" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="207" font-size="14" fill="#1f2933" text-anchor="middle">Controller2</text>

  <!-- Controller 3 -->
  <rect x="630" y="180" width="160" height="44" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="710" y="207" font-size="14" fill="#1f2933" text-anchor="middle">Controller3</text>
</svg>