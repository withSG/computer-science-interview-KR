<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프론트 컨트롤러 패턴</title>
  <desc id="d">여러 요청이 모두 DispatcherServlet 하나로 들어오고, DispatcherServlet이 이를 Controller1, Controller2, Controller3 중 적절한 컨트롤러에 위임하는 구조.</desc>
  <rect width="880" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 들어오는 요청들 -->
  <rect x="258" y="28" width="84" height="34" rx="17" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="300" y="51" font-size="15" fill="#374151" text-anchor="middle">요청</text>
  <rect x="398" y="28" width="84" height="34" rx="17" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="51" font-size="15" fill="#374151" text-anchor="middle">요청</text>
  <rect x="538" y="28" width="84" height="34" rx="17" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="580" y="51" font-size="15" fill="#374151" text-anchor="middle">요청</text>

  <path d="M306,64 L390,110" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M440,64 L440,110" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ah-gray)"/>
  <path d="M574,64 L490,110" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ah-gray)"/>

  <!-- DispatcherServlet: 단일 진입점 -->
  <rect x="240" y="114" width="400" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="440" y="149" font-size="22" font-weight="bold" fill="#1e3a8a" text-anchor="middle">DispatcherServlet</text>
  <text x="440" y="178" font-size="15" fill="#1e40af" text-anchor="middle">프론트 컨트롤러 · 모든 요청의 진입점</text>

  <!-- 컨트롤러로 위임 -->
  <path d="M440,196 L440,236" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <path d="M170,236 L710,236" stroke="#1d4ed8" stroke-width="2" fill="none"/>
  <path d="M170,236 L170,278" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M440,236 L440,278" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M710,236 L710,278" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <text x="454" y="224" font-size="15" fill="#1d4ed8">적절한 컨트롤러에 위임</text>

  <rect x="70" y="282" width="200" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="170" y="316" font-size="17" fill="#111827" text-anchor="middle">Controller1</text>
  <rect x="340" y="282" width="200" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="316" font-size="17" fill="#111827" text-anchor="middle">Controller2</text>
  <rect x="610" y="282" width="200" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="710" y="316" font-size="17" fill="#111827" text-anchor="middle">Controller3</text>
</svg>
