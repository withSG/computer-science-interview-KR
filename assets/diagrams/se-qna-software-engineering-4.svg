<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">리팩토링 대상 코드 냄새 (Code Smell)</title>
  <desc id="d">리팩토링이 필요한 주요 코드 냄새 5가지 항목과 기준을 정리한 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- 메인 헤더 박스 -->
  <rect x="240" y="30" width="400" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="60" text-anchor="middle" fill="#dc2626" font-size="16" font-weight="bold">리팩토링 대상 코드 냄새 (Code Smell)</text>

  <!-- 항목 1: 중복 코드 -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="600" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="5" fill="#dc2626"/>
    <text x="45" y="30" fill="#1f2933" font-size="14" font-weight="bold">중복 코드 (Duplicated Code)</text>
  </g>

  <!-- 항목 2: 긴 메서드 -->
  <g transform="translate(140, 170)">
    <rect x="0" y="0" width="600" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="5" fill="#dc2626"/>
    <text x="45" y="30" fill="#1f2933" font-size="14" font-weight="bold">긴 메서드 (Long Method)</text>
    <rect x="360" y="12" width="220" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="470" y="29" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">20줄 이상 → 분리 고려</text>
  </g>

  <!-- 항목 3: 큰 클래스 -->
  <g transform="translate(140, 230)">
    <rect x="0" y="0" width="600" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="5" fill="#dc2626"/>
    <text x="45" y="30" fill="#1f2933" font-size="14" font-weight="bold">큰 클래스 (Large Class)</text>
    <rect x="360" y="12" width="220" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="470" y="29" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">너무 많은 책임</text>
  </g>

  <!-- 항목 4: 긴 파라미터 목록 -->
  <g transform="translate(140, 290)">
    <rect x="0" y="0" width="600" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="5" fill="#dc2626"/>
    <text x="45" y="30" fill="#1f2933" font-size="14" font-weight="bold">긴 파라미터 목록 (Long Parameter List)</text>
    <rect x="360" y="12" width="220" height="26" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="470" y="29" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">4개 이상</text>
  </g>

  <!-- 항목 5: 주석이 많은 코드 -->
  <g transform="translate(140, 350)">
    <rect x="0" y="0" width="600" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="5" fill="#dc2626"/>
    <text x="45" y="30" fill="#1f2933" font-size="14" font-weight="bold">주석이 많은 코드</text>
    <rect x="360" y="12" width="220" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="470" y="29" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">코드 자체가 설명되어야</text>
  </g>
</svg>