<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">리팩터링 대상 코드 냄새</title>
  <desc id="d">리팩터링 대상인 코드 냄새 다섯 가지와 판단 기준을 표로 정리한다. 긴 메서드는 20줄 이상이면 분리를 고려하고, 긴 파라미터 목록은 4개 이상이 기준이다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 행 배경 (짝수 행 옅은 음영) -->
  <rect x="24" y="132" width="832" height="60" fill="#f8fafc"/>
  <rect x="24" y="252" width="832" height="60" fill="#f8fafc"/>

  <!-- 머리행 -->
  <path d="M24,72 V32 A8,8 0 0 1 32,24 H848 A8,8 0 0 1 856,32 V72 Z" fill="#e2e8f0"/>
  <text x="40" y="54" font-size="16" font-weight="700" fill="#111827">코드 냄새 (Code Smell)</text>
  <text x="544" y="54" font-size="16" font-weight="700" fill="#111827">기준</text>

  <!-- 격자선 -->
  <line x1="24" y1="72" x2="856" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="132" x2="856" y2="132" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="24" y1="192" x2="856" y2="192" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="24" y1="252" x2="856" y2="252" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="24" y1="312" x2="856" y2="312" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="520" y1="24" x2="520" y2="372" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="24" y="24" width="832" height="348" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 1. 중복 코드 -->
  <circle cx="56" cy="102" r="14" fill="#334155"/>
  <text x="56" y="107" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="88" y="108" font-size="17" fill="#111827"><tspan font-weight="700">중복 코드</tspan><tspan font-size="15" fill="#4b5563"> (Duplicated Code)</tspan></text>
  <text x="544" y="108" font-size="16" fill="#4b5563">—</text>

  <!-- 2. 긴 메서드 -->
  <circle cx="56" cy="162" r="14" fill="#334155"/>
  <text x="56" y="167" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="88" y="168" font-size="17" fill="#111827"><tspan font-weight="700">긴 메서드</tspan><tspan font-size="15" fill="#4b5563"> (Long Method)</tspan></text>
  <text x="544" y="168" font-size="16" fill="#1f2937"><tspan font-weight="700" fill="#b45309">20줄 이상</tspan> → 분리 고려</text>

  <!-- 3. 큰 클래스 -->
  <circle cx="56" cy="222" r="14" fill="#334155"/>
  <text x="56" y="227" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="88" y="228" font-size="17" fill="#111827"><tspan font-weight="700">큰 클래스</tspan><tspan font-size="15" fill="#4b5563"> (Large Class)</tspan></text>
  <text x="544" y="228" font-size="16" fill="#1f2937">너무 많은 책임</text>

  <!-- 4. 긴 파라미터 목록 -->
  <circle cx="56" cy="282" r="14" fill="#334155"/>
  <text x="56" y="287" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="88" y="288" font-size="17" fill="#111827"><tspan font-weight="700">긴 파라미터 목록</tspan><tspan font-size="15" fill="#4b5563"> (Long Parameter List)</tspan></text>
  <text x="544" y="288" font-size="16" fill="#1f2937"><tspan font-weight="700" fill="#b45309">4개 이상</tspan></text>

  <!-- 5. 주석이 많은 코드 -->
  <circle cx="56" cy="342" r="14" fill="#334155"/>
  <text x="56" y="347" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="88" y="348" font-size="17" font-weight="700" fill="#111827">주석이 많은 코드</text>
  <text x="544" y="348" font-size="16" fill="#1f2937">코드 자체가 설명되어야</text>
</svg>
