<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">flush와 commit의 차이</title>
  <desc id="d">commit()은 flush()(변경 감지, SQL 생성, 쓰기 지연 저장소의 SQL을 DB로 전송)를 먼저 수행한 다음 트랜잭션을 확정한다. flush 후에는 아직 커밋 전이라 ROLLBACK이 가능하고 1차 캐시도 그대로지만, commit 후에는 되돌릴 수 없고 트랜잭션 종료와 함께 영속성 컨텍스트도 닫힌다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- commit() 영역: flush() 전체 + 트랜잭션 확정 -->
  <rect x="24" y="24" width="832" height="196" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="44" y="58" font-size="20" font-weight="bold" fill="#5b21b6" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">commit()</text>
  <text x="150" y="57" font-size="15" fill="#374151">flush()를 먼저 수행하고, 그 다음 트랜잭션을 확정한다</text>

  <!-- flush() 영역 -->
  <rect x="44" y="76" width="556" height="128" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="64" y="104" font-size="18" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">flush()</text>

  <!-- 단계 -->
  <rect x="64" y="120" width="120" height="64" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="124" y="158" font-size="16" text-anchor="middle" fill="#111827">변경 감지</text>
  <path d="M190,152 L214,152" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="220" y="120" width="120" height="64" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="280" y="158" font-size="16" text-anchor="middle" fill="#111827">SQL 생성</text>
  <path d="M346,152 L370,152" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="376" y="120" width="204" height="64" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="478" y="147" font-size="15" text-anchor="middle" fill="#111827">쓰기 지연 저장소의 SQL을</text>
  <text x="478" y="169" font-size="15" text-anchor="middle" fill="#111827">DB로 전송</text>
  <path d="M586,152 L634,152" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="640" y="120" width="196" height="64" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="738" y="158" font-size="17" font-weight="bold" text-anchor="middle" fill="#4c1d95">트랜잭션 확정</text>

  <!-- 각 시점 이후 상태 -->
  <path d="M478,190 L478,254" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M738,190 L738,254" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <rect x="24" y="262" width="516" height="154" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="44" y="292" font-size="17" font-weight="bold" fill="#1d4ed8"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">flush()</tspan> 후</text>
  <line x1="44" y1="306" x2="520" y2="306" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="336" font-size="15" fill="#111827">이 시점에 DB에는 반영됐지만 아직 커밋 전 →<tspan dx="7" font-weight="bold" fill="#047857">ROLLBACK 가능</tspan></text>
  <text x="44" y="368" font-size="15" fill="#111827">1차 캐시는 그대로 유지된다</text>
  <text x="44" y="392" font-size="14" fill="#4b5563">(flush는 캐시를 비우는 게 아니다)</text>

  <rect x="560" y="262" width="296" height="154" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="580" y="292" font-size="17" font-weight="bold" fill="#6d28d9"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">commit()</tspan> 후</text>
  <line x1="580" y1="306" x2="836" y2="306" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="580" y="336" font-size="15" font-weight="bold" fill="#b91c1c">이 시점 이후 되돌릴 수 없다</text>
  <text x="580" y="368" font-size="15" fill="#111827">트랜잭션 종료 →</text>
  <text x="580" y="392" font-size="15" fill="#111827">영속성 컨텍스트도 닫힌다</text>
</svg>
