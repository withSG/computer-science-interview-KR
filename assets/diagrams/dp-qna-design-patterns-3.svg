<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">문제 상황</title>
  <desc id="d">Shape 클래스 하위에 RedCircle, BlueCircle, RedSquare, BlueSquare 및 조합 폭발을 나타내는 트리 구조 다이어그램</desc>
  <rect width="880" height="320" fill="#ffffff"/>

  <!-- Main Container -->
  <rect x="180" y="20" width="520" height="280" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- Root Node: Shape -->
  <rect x="370" y="45" width="140" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="70" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">Shape</text>

  <!-- Tree Lines -->
  <!-- Vertical main line from Shape -->
  <path d="M 440,85 L 440,245" stroke="#52606d" stroke-width="1.5" fill="none"/>

  <!-- Horizontal branches -->
  <path d="M 440,115 L 470,115" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M 440,155 L 470,155" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M 440,195 L 470,195" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M 440,235 L 470,235" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M 440,260 L 470,260" stroke="#52606d" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- Child Nodes -->
  <!-- RedCircle -->
  <rect x="470" y="98" width="130" height="34" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="535" y="120" fill="#1f2933" font-size="13" text-anchor="middle">RedCircle</text>

  <!-- BlueCircle -->
  <rect x="470" y="138" width="130" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="535" y="160" fill="#1f2933" font-size="13" text-anchor="middle">BlueCircle</text>

  <!-- RedSquare -->
  <rect x="470" y="178" width="130" height="34" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="535" y="200" fill="#1f2933" font-size="13" text-anchor="middle">RedSquare</text>

  <!-- BlueSquare -->
  <rect x="470" y="218" width="130" height="34" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="535" y="240" fill="#1f2933" font-size="13" text-anchor="middle">BlueSquare</text>

  <!-- Combinatorial Explosion Warning Badge -->
  <rect x="470" y="258" width="180" height="30" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="278" fill="#d97706" font-size="13" font-weight="bold" text-anchor="middle">... (조합 폭발!)</text>
</svg>