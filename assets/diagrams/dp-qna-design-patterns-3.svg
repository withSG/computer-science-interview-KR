<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">브릿지 적용 전 조합 폭발</title>
  <desc id="d">Shape 아래에 RedCircle, BlueCircle, RedSquare, BlueSquare처럼 색과 모양의 조합마다 하위 클래스를 만들면 클래스가 n × m개로 늘어나는 조합 폭발을 보여 준다.</desc>
  <rect width="880" height="270" fill="#ffffff"/>

  <!-- 루트 -->
  <rect x="370" y="24" width="140" height="48" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="440" y="54" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Shape</text>

  <!-- 트리 선 -->
  <path d="M440,72 V100" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M120,100 H600" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M600,100 H760" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M120,99 V128 M280,99 V128 M440,99 V128 M600,99 V128" fill="none" stroke="#4b5563" stroke-width="2"/>
  <path d="M760,100 V128" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 하위 클래스 -->
  <rect x="50" y="128" width="140" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="120" y="160" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">RedCircle</text>

  <rect x="210" y="128" width="140" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="280" y="160" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">BlueCircle</text>

  <rect x="370" y="128" width="140" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="160" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">RedSquare</text>

  <rect x="530" y="128" width="140" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="600" y="160" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">BlueSquare</text>

  <rect x="690" y="128" width="140" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="760" y="150" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">...</text>
  <text x="760" y="170" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">(조합 폭발!)</text>

  <!-- 요점 -->
  <text x="440" y="230" font-size="16" fill="#1f2937" text-anchor="middle">색 × 모양 조합마다 하위 클래스가 하나씩 필요 → <tspan font-weight="bold" fill="#b91c1c">n × m개</tspan></text>
</svg>
