<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">EventBridge 이벤트 라우팅</title>
  <desc id="d">S3·애플리케이션·AWS 서비스 이벤트가 EventBridge로 들어오면, 규칙 source=order, type=created는 재고 Lambda로, 규칙 detail.amount &gt; 10000은 심사 Lambda로, 스케줄(cron)은 야간 배치 Lambda로 보낸다.</desc>
  <rect width="880" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 이벤트 소스 -->
  <rect x="28" y="103" width="180" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="118" y="140" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">S3 / 애플리케이션 /</text>
  <text x="118" y="163" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">AWS 서비스 이벤트</text>

  <line x1="208" y1="145" x2="248" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- EventBridge 와 규칙 -->
  <rect x="252" y="28" width="346" height="234" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="425" y="61" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">EventBridge</text>

  <rect x="268" y="80" width="314" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="282" y="108" font-size="16" fill="#1e3a8a"><tspan font-weight="bold">규칙:</tspan> <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">source=order, type=created</tspan></text>

  <rect x="268" y="140" width="314" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="282" y="168" font-size="16" fill="#1e3a8a"><tspan font-weight="bold">규칙:</tspan> <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">detail.amount &gt; 10000</tspan></text>

  <rect x="268" y="200" width="314" height="46" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="282" y="228" font-size="16" fill="#5b21b6"><tspan font-weight="bold">스케줄</tspan>(cron)</text>

  <!-- 규칙 → 대상 Lambda -->
  <line x1="582" y1="103" x2="680" y2="103" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="582" y1="163" x2="680" y2="163" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="582" y1="223" x2="680" y2="223" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <rect x="684" y="80" width="168" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="768" y="109" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">재고 Lambda</text>

  <rect x="684" y="140" width="168" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="768" y="169" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">심사 Lambda</text>

  <rect x="684" y="200" width="168" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="768" y="229" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">야간 배치 Lambda</text>
</svg>
