<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BFF 도입 효과</title>
  <desc id="d">프론트엔드, BFF 레이어, 그리고 서비스A, 서비스B, 서비스C 간의 구조 다이어그램</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="16" font-weight="bold" fill="#1f2933">BFF 도입 효과</text>

  <rect x="350" y="60" width="180" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="89" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">[프론트엔드]</text>

  <path d="M440,108 L440,148" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="330" y="150" width="220" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="179" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">[BFF 레이어]</text>

  <path d="M680,174 L552,174" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-slate)"/>
  <rect x="565" y="161" width="120" height="26" fill="#ffffff"/>
  <text x="570" y="178" font-size="13" fill="#52606d">인증, 집계, 변환</text>

  <path d="M380,198 L240,248" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M440,198 L440,248" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M500,198 L640,248" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="160" y="250" width="160" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="240" y="279" font-size="14" fill="#1f2933" text-anchor="middle">[서비스A]</text>

  <rect x="360" y="250" width="160" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="279" font-size="14" fill="#1f2933" text-anchor="middle">[서비스B]</text>

  <rect x="560" y="250" width="160" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="640" y="279" font-size="14" fill="#1f2933" text-anchor="middle">[서비스C]</text>
</svg>