<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BFF 도입 효과</title>
  <desc id="d">프론트엔드는 BFF 레이어 하나만 호출하고, BFF 레이어가 인증, 집계, 변환을 맡아 서비스A, 서비스B, 서비스C로 요청을 나눠 보낸다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 프론트엔드 -->
  <rect x="340" y="24" width="200" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="56" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">프론트엔드</text>

  <!-- 프론트엔드 → BFF -->
  <line x1="440" y1="78" x2="440" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <text x="456" y="105" font-size="15" fill="#374151">프론트는 BFF만 바라봄</text>

  <!-- BFF 레이어 -->
  <rect x="110" y="124" width="660" height="138" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="158" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">BFF 레이어</text>

  <rect x="134" y="176" width="196" height="64" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="232" y="202" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">인증</text>
  <text x="232" y="226" font-size="14" fill="#374151" text-anchor="middle">인증/권한 처리 통합</text>

  <rect x="342" y="176" width="196" height="64" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440" y="202" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">집계</text>
  <text x="440" y="226" font-size="14" fill="#374151" text-anchor="middle">여러 서비스 → 단일 응답</text>

  <rect x="550" y="176" width="196" height="64" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="648" y="202" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">변환</text>
  <text x="648" y="226" font-size="14" fill="#374151" text-anchor="middle">프론트엔드에 맞는 형태로</text>

  <!-- BFF → 서비스 -->
  <line x1="340" y1="264" x2="232" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="440" y1="264" x2="440" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="540" y1="264" x2="648" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 서비스 -->
  <rect x="142" y="320" width="180" height="52" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="232" y="352" font-size="17" fill="#111827" text-anchor="middle">서비스A</text>

  <rect x="350" y="320" width="180" height="52" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="440" y="352" font-size="17" fill="#111827" text-anchor="middle">서비스B</text>

  <rect x="558" y="320" width="180" height="52" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="648" y="352" font-size="17" fill="#111827" text-anchor="middle">서비스C</text>
</svg>
