<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">폭포수와 반복적 개발의 피드백 시점</title>
  <desc id="d">폭포수는 요구분석 1개월, 설계 2개월, 구현 4개월, 테스트 2개월을 지나 배포한 뒤에야 처음 피드백을 받아 9개월치를 되돌려야 하고, 반복적 개발은 2주 주기(계획·구현·검증)마다 피드백을 받아 버리는 것이 최대 2주치다.</desc>
  <rect width="880" height="610" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ───── 폭포수 ───── -->
  <text x="40" y="44" font-size="20" font-weight="bold" fill="#b91c1c">폭포수</text>
  <text x="114" y="44" font-size="16" fill="#374151">피드백 지점이 마지막에 딱 한 번</text>

  <!-- 단계 이름 (막대 위) -->
  <text x="74" y="80" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">요구분석</text>
  <text x="192" y="80" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">설계</text>
  <text x="412" y="80" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">구현</text>
  <text x="634" y="80" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">테스트</text>
  <text x="748" y="80" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">배포</text>

  <!-- 기간에 비례한 단계 막대 -->
  <path d="M40,92 L102,92 L112,112 L102,132 L40,132 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M118,92 L252,92 L262,112 L252,132 L118,132 L128,112 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M268,92 L546,92 L556,112 L546,132 L268,132 L278,112 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M562,92 L696,92 L706,112 L696,132 L562,132 L572,112 Z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="118" font-size="16" fill="#111827" text-anchor="middle">1개월</text>
  <text x="192" y="118" font-size="16" fill="#111827" text-anchor="middle">2개월</text>
  <text x="412" y="118" font-size="16" fill="#111827" text-anchor="middle">4개월</text>
  <text x="634" y="118" font-size="16" fill="#111827" text-anchor="middle">2개월</text>

  <!-- 배포 마일스톤 -->
  <line x1="710" y1="112" x2="728" y2="112" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <path d="M748,96 L764,112 L748,128 L732,112 Z" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>

  <!-- 9개월 묶음 -->
  <path d="M40,140 L40,148 L706,148 L706,140" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="373" y1="148" x2="373" y2="155" stroke="#6b7280" stroke-width="1.5"/>
  <text x="373" y="175" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">9개월</text>

  <!-- 첫 피드백 -->
  <line x1="748" y1="130" x2="748" y2="166" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="470" y="170" width="370" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="655" y="198" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">“이건 우리가 원한 게 아닌데요”</text>
  <text x="655" y="225" font-size="15" fill="#7f1d1d" text-anchor="middle">9개월 만에 처음 듣는 말. 되돌릴 것이 9개월치다</text>

  <!-- 구분선 -->
  <line x1="40" y1="268" x2="840" y2="268" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ───── 반복적 개발 ───── -->
  <text x="40" y="308" font-size="20" font-weight="bold" fill="#047857">반복적 개발</text>
  <text x="160" y="308" font-size="16" fill="#374151">피드백 지점이 주기마다</text>

  <!-- 주기 1 -->
  <rect x="40" y="328" width="176" height="126" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M40,360 L40,336 Q40,328 48,328 L208,328 Q216,328 216,336 L216,360 Z" fill="#dbeafe"/>
  <line x1="40" y1="360" x2="216" y2="360" stroke="#1d4ed8" stroke-width="1"/>
  <text x="128" y="350" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2주</text>
  <text x="128" y="386" font-size="16" fill="#111827" text-anchor="middle">계획</text>
  <text x="128" y="412" font-size="16" fill="#111827" text-anchor="middle">구현</text>
  <text x="128" y="438" font-size="16" fill="#111827" text-anchor="middle">검증</text>
  <line x1="128" y1="456" x2="128" y2="484" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="80" y="488" width="96" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="128" y="510" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">피드백</text>

  <!-- 주기 2 -->
  <rect x="248" y="328" width="176" height="126" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M248,360 L248,336 Q248,328 256,328 L416,328 Q424,328 424,336 L424,360 Z" fill="#dbeafe"/>
  <line x1="248" y1="360" x2="424" y2="360" stroke="#1d4ed8" stroke-width="1"/>
  <text x="336" y="350" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2주</text>
  <text x="336" y="386" font-size="16" fill="#111827" text-anchor="middle">계획</text>
  <text x="336" y="412" font-size="16" fill="#111827" text-anchor="middle">구현</text>
  <text x="336" y="438" font-size="16" fill="#111827" text-anchor="middle">검증</text>
  <line x1="336" y1="456" x2="336" y2="484" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="288" y="488" width="96" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="336" y="510" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">피드백</text>

  <!-- 주기 3 -->
  <rect x="456" y="328" width="176" height="126" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M456,360 L456,336 Q456,328 464,328 L624,328 Q632,328 632,336 L632,360 Z" fill="#dbeafe"/>
  <line x1="456" y1="360" x2="632" y2="360" stroke="#1d4ed8" stroke-width="1"/>
  <text x="544" y="350" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2주</text>
  <text x="544" y="386" font-size="16" fill="#111827" text-anchor="middle">계획</text>
  <text x="544" y="412" font-size="16" fill="#111827" text-anchor="middle">구현</text>
  <text x="544" y="438" font-size="16" fill="#111827" text-anchor="middle">검증</text>
  <line x1="544" y1="456" x2="544" y2="484" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="496" y="488" width="96" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="544" y="510" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">피드백</text>

  <!-- 주기 4 -->
  <rect x="664" y="328" width="176" height="126" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M664,360 L664,336 Q664,328 672,328 L832,328 Q840,328 840,336 L840,360 Z" fill="#dbeafe"/>
  <line x1="664" y1="360" x2="840" y2="360" stroke="#1d4ed8" stroke-width="1"/>
  <text x="752" y="350" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2주</text>
  <text x="752" y="386" font-size="16" fill="#111827" text-anchor="middle">계획</text>
  <text x="752" y="412" font-size="16" fill="#111827" text-anchor="middle">구현</text>
  <text x="752" y="438" font-size="16" fill="#111827" text-anchor="middle">검증</text>
  <line x1="752" y1="456" x2="752" y2="484" stroke="#047857" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="704" y="488" width="96" height="32" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="752" y="510" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">피드백</text>

  <!-- 버리는 양 -->
  <rect x="240" y="542" width="400" height="42" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="569" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">방향이 틀렸어도 버리는 것은 최대 2주치다</text>
</svg>
