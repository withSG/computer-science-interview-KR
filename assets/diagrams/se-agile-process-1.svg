<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1. 왜 필요한가 — 폭포수의 전제가 깨지는 지점</title>
  <desc id="d">폭포수 모델과 반복적 개발 모델의 피드백 시점 및 변경 비용 차이를 나타낸 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Section 1: 폭포수 -->
  <g>
    <!-- Section Header -->
    <rect x="40" y="30" width="80" height="28" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="80" y="48.9" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">[폭포수]</text>
    <text x="135" y="48.55" font-size="13" font-weight="bold" fill="#52606d">피드백 지점이 마지막에 딱 한 번</text>

    <!-- Waterfall Process Boxes -->
    <!-- Box 1: 요구분석 -->
    <rect x="40" y="80" width="110" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="95" y="104.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">요구분석</text>
    <text x="95" y="138.025" font-size="11.5" fill="#52606d" text-anchor="middle">1개월</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M150,100 L180,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Box 2: 설계 -->
    <rect x="180" y="80" width="110" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="235" y="104.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">설계</text>
    <text x="235" y="138.025" font-size="11.5" fill="#52606d" text-anchor="middle">2개월</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M290,100 L320,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Box 3: 구현 -->
    <rect x="320" y="80" width="110" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="375" y="104.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">구현</text>
    <text x="375" y="138.025" font-size="11.5" fill="#52606d" text-anchor="middle">4개월</text>

    <!-- Arrow 3 -> 4 -->
    <path d="M430,100 L460,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Box 4: 테스트 -->
    <rect x="460" y="80" width="110" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="515" y="104.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">테스트</text>
    <text x="515" y="138.025" font-size="11.5" fill="#52606d" text-anchor="middle">2개월</text>

    <!-- Arrow 4 -> 5 -->
    <path d="M570,100 L600,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

    <!-- Box 5: 배포 -->
    <rect x="600" y="80" width="110" height="40" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="655" y="104.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">배포</text>

    <!-- Down arrow from 배포 -->
    <path d="M710,100 L730,100 L730,165" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- Waterfall Feedback Alert Box -->
    <rect x="330" y="150" width="380" height="54" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="520" y="171.2" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">"이건 우리가 원한 게 아닌데요"</text>
    <text x="520" y="192.025" font-size="11.5" fill="#991b1b" text-anchor="middle">← 9개월 만에 처음 듣는 말. 되돌릴 것이 9개월치다</text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="230" x2="840" y2="230" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Section 2: 반복적 개발 -->
  <g>
    <!-- Section Header -->
    <rect x="40" y="255" width="110" height="28" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="95" y="273.9" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">[반복적 개발]</text>
    <text x="165" y="273.55" font-size="13" font-weight="bold" fill="#52606d">피드백 지점이 주기마다</text>

    <!-- Iteration 1 -->
    <g>
      <rect x="70" y="300" width="120" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="70" y="300" width="120" height="26" rx="6" fill="#dbeafe"/>
      <text x="130" y="318.025" font-size="11.5" font-weight="bold" fill="#1e40af" text-anchor="middle">2주</text>
      <text x="130" y="344.2" font-size="12" fill="#1f2933" text-anchor="middle">계획</text>
      <text x="130" y="366.2" font-size="12" fill="#1f2933" text-anchor="middle">구현</text>
      <text x="130" y="388.2" font-size="12" fill="#1f2933" text-anchor="middle">검증</text>

      <path d="M130,410 L130,432" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
      <rect x="100" y="438" width="60" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="130" y="453.2" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">피드백</text>
    </g>

    <!-- Iteration 2 -->
    <g>
      <rect x="230" y="300" width="120" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="230" y="300" width="120" height="26" rx="6" fill="#dbeafe"/>
      <text x="290" y="318.025" font-size="11.5" font-weight="bold" fill="#1e40af" text-anchor="middle">2주</text>
      <text x="290" y="344.2" font-size="12" fill="#1f2933" text-anchor="middle">계획</text>
      <text x="290" y="366.2" font-size="12" fill="#1f2933" text-anchor="middle">구현</text>
      <text x="290" y="388.2" font-size="12" fill="#1f2933" text-anchor="middle">검증</text>

      <path d="M290,410 L290,432" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
      <rect x="260" y="438" width="60" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="290" y="453.2" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">피드백</text>
    </g>

    <!-- Iteration 3 -->
    <g>
      <rect x="390" y="300" width="120" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="390" y="300" width="120" height="26" rx="6" fill="#dbeafe"/>
      <text x="450" y="318.025" font-size="11.5" font-weight="bold" fill="#1e40af" text-anchor="middle">2주</text>
      <text x="450" y="344.2" font-size="12" fill="#1f2933" text-anchor="middle">계획</text>
      <text x="450" y="366.2" font-size="12" fill="#1f2933" text-anchor="middle">구현</text>
      <text x="450" y="388.2" font-size="12" fill="#1f2933" text-anchor="middle">검증</text>

      <path d="M450,410 L450,432" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
      <rect x="420" y="438" width="60" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="450" y="453.2" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">피드백</text>
    </g>

    <!-- Iteration 4 -->
    <g>
      <rect x="550" y="300" width="120" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="550" y="300" width="120" height="26" rx="6" fill="#dbeafe"/>
      <text x="610" y="318.025" font-size="11.5" font-weight="bold" fill="#1e40af" text-anchor="middle">2주</text>
      <text x="610" y="344.2" font-size="12" fill="#1f2933" text-anchor="middle">계획</text>
      <text x="610" y="366.2" font-size="12" fill="#1f2933" text-anchor="middle">구현</text>
      <text x="610" y="388.2" font-size="12" fill="#1f2933" text-anchor="middle">검증</text>

      <path d="M610,410 L610,432" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
      <rect x="580" y="438" width="60" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="610" y="453.2" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">피드백</text>
    </g>

    <!-- Iterative Footnote -->
    <text x="70" y="490.025" font-size="11.5" fill="#059669">← 방향이 틀렸어도 버리는 것은 최대 2주치다</text>
  </g>
</svg>