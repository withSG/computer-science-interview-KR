<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cipher Suite 읽는 법</title>
  <desc id="d">TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256을 네 조각으로 나눠 읽는다. ECDHE는 키 교환(전방 비밀성 O), RSA는 인증(RSA 서명으로 서버 신원 증명), AES_128_GCM은 대칭 암호(AES 128비트 GCM 모드), SHA256은 해시(SHA-256, 키 파생·무결성)다.</desc>
  <rect width="880" height="270" fill="#ffffff"/>
  <defs>
    <marker id="ah-kx" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ah-au" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ah-sy" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ah-ha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>

  <!-- Cipher Suite 문자열: TLS_ [ECDHE] _ [RSA] _WITH_ [AES_128_GCM] _ [SHA256] -->
  <g font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-size="24" font-weight="bold" text-anchor="middle">
    <text x="147" y="64" fill="#4b5563">TLS_</text>
    <rect x="179" y="32" width="100" height="48" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="229" y="64" fill="#6d28d9">ECDHE</text>
    <text x="289" y="64" fill="#4b5563">_</text>
    <rect x="299" y="32" width="72" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="335" y="64" fill="#1d4ed8">RSA</text>
    <text x="415" y="64" fill="#4b5563">_WITH_</text>
    <rect x="459" y="32" width="172" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="545" y="64" fill="#047857">AES_128_GCM</text>
    <text x="641" y="64" fill="#4b5563">_</text>
    <rect x="651" y="32" width="112" height="48" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="707" y="64" fill="#b45309">SHA256</text>
  </g>

  <!-- 연결선 -->
  <path d="M 229 80 V 104 H 125 V 130" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-kx)"/>
  <path d="M 335 80 V 130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-au)"/>
  <path d="M 545 80 V 130" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ah-sy)"/>
  <path d="M 707 80 V 104 H 755 V 130" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ah-ha)"/>

  <!-- 조각별 의미 -->
  <path d="M 30 168 V 140 Q 30 132 38 132 H 212 Q 220 132 220 140 V 168 Z" fill="#f5f3ff"/>
  <rect x="30" y="132" width="190" height="112" rx="8" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="125" y="156" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">키 교환</text>
  <text x="125" y="198" font-size="16" fill="#111827" text-anchor="middle">ECDHE</text>
  <text x="125" y="224" font-size="16" fill="#111827" text-anchor="middle">(전방 비밀성 O)</text>

  <path d="M 240 168 V 140 Q 240 132 248 132 H 422 Q 430 132 430 140 V 168 Z" fill="#eff6ff"/>
  <rect x="240" y="132" width="190" height="112" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="335" y="156" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">인증</text>
  <text x="335" y="198" font-size="16" fill="#111827" text-anchor="middle">RSA 서명으로</text>
  <text x="335" y="224" font-size="16" fill="#111827" text-anchor="middle">서버 신원 증명</text>

  <path d="M 450 168 V 140 Q 450 132 458 132 H 632 Q 640 132 640 140 V 168 Z" fill="#ecfdf5"/>
  <rect x="450" y="132" width="190" height="112" rx="8" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="545" y="156" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">대칭 암호</text>
  <text x="545" y="198" font-size="16" fill="#111827" text-anchor="middle">AES 128비트</text>
  <text x="545" y="224" font-size="16" fill="#111827" text-anchor="middle">GCM 모드</text>

  <path d="M 660 168 V 140 Q 660 132 668 132 H 842 Q 850 132 850 140 V 168 Z" fill="#fffbeb"/>
  <rect x="660" y="132" width="190" height="112" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="755" y="156" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">해시</text>
  <text x="755" y="198" font-size="16" fill="#111827" text-anchor="middle">SHA-256</text>
  <text x="755" y="224" font-size="16" fill="#111827" text-anchor="middle">(키 파생·무결성)</text>
</svg>
