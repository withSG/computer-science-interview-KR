<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cipher Suite 읽는 법</title>
  <desc id="d">TLS Cipher Suite 구조 분석 다이어그램</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <text x="40" y="40" font-size="16" font-weight="bold" fill="#1f2933">Cipher Suite 읽는 법</text>
  <rect x="40" y="65" width="615" height="46" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="55" y="93" font-size="14" font-weight="bold" fill="#52606d">TLS_</text>
  <rect x="102" y="71" width="86" height="34" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="145" y="93" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">ECDHE</text>
  <text x="193" y="93" font-size="14" font-weight="bold" fill="#52606d">_</text>
  <rect x="208" y="71" width="64" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="93" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">RSA</text>
  <text x="277" y="93" font-size="14" font-weight="bold" fill="#52606d">_WITH_</text>
  <rect x="342" y="71" width="130" height="34" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="407" y="93" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">AES_128_GCM</text>
  <text x="477" y="93" font-size="14" font-weight="bold" fill="#52606d">_</text>
  <rect x="492" y="71" width="88" height="34" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="536" y="93" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">SHA256</text>
  <defs>
    <marker id="a-hash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="a-cipher" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="a-auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-kex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <path d="M 536 111 V 145 H 565" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-hash)"/>
  <path d="M 407 111 V 185 H 565" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-cipher)"/>
  <path d="M 240 111 V 225 H 565" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-auth)"/>
  <path d="M 145 111 V 265 H 565" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-kex)"/>
  <rect x="570" y="130" width="270" height="30" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="582" y="149.5" font-size="13" font-weight="bold" fill="#d97706">해시: SHA-256 (키 파생·무결성)</text>
  <rect x="570" y="170" width="270" height="30" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="582" y="189.5" font-size="13" font-weight="bold" fill="#059669">대칭 암호: AES 128비트 GCM 모드</text>
  <rect x="570" y="210" width="270" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="582" y="229.5" font-size="13" font-weight="bold" fill="#2563eb">인증: RSA 서명으로 서버 신원 증명</text>
  <rect x="570" y="250" width="270" height="30" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="582" y="269.5" font-size="13" font-weight="bold" fill="#7c3aed">키 교환: ECDHE (전방 비밀성 O)</text>
</svg>