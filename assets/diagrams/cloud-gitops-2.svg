<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">드리프트가 생기는 과정</title>
  <desc id="d">새벽 3시 장애에 담당자가 kubectl로 replicas, 이미지, 타임아웃을 손으로 바꾸고 Git에는 반영하지 않는다. 그 결과 Git의 선언(replicas 4, api:v1.3.0, 3s)과 클러스터의 실제(replicas 20, api:hotfix-2, 30s)가 달라지는 것이 드리프트다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>

  <!-- 단계 레일 -->
  <line x1="44" y1="70" x2="44" y2="218" stroke="#d1d5db" stroke-width="2"/>
  <line x1="44" y1="254" x2="44" y2="280" stroke="#d1d5db" stroke-width="2"/>

  <!-- 1. 장애와 수동 조치 -->
  <circle cx="44" cy="52" r="16" fill="#1f2937"/>
  <text x="44" y="58" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="58" font-size="18" font-weight="bold" fill="#111827">새벽 3시. 장애가 났다. 담당자가 급하게 손을 쓴다.</text>

  <rect x="76" y="76" width="780" height="112" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="96" y="108" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl scale deployment/api --replicas=20</text>
  <text x="96" y="138" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl set image deployment/api api=api:hotfix-2</text>
  <text x="96" y="168" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">kubectl edit configmap/api-config</text>
  <text x="440" y="168" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"># 타임아웃 값을 늘림</text>

  <!-- 2. 복구, 그러나 Git 미반영 -->
  <circle cx="44" cy="236" r="16" fill="#1f2937"/>
  <text x="44" y="242" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="76" y="242" font-size="17" font-weight="bold" fill="#047857">서비스는 살아났다.<tspan fill="#b91c1c"> 그리고 아무도 이 변경을 Git에 반영하지 않았다.</tspan></text>

  <!-- 3. 비교 표 -->
  <circle cx="44" cy="298" r="16" fill="#1f2937"/>
  <text x="44" y="304" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <rect x="76" y="276" width="780" height="44" fill="#f3f4f6"/>
  <rect x="76" y="276" width="780" height="176" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="76" y1="320" x2="856" y2="320" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="76" y1="364" x2="856" y2="364" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="76" y1="408" x2="856" y2="408" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="256" y1="276" x2="256" y2="452" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="556" y1="276" x2="556" y2="452" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="96" y="304" font-size="16" font-weight="bold" fill="#374151">항목</text>
  <text x="406" y="304" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Git의 선언</text>
  <text x="706" y="304" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">클러스터의 실제</text>

  <text x="96" y="348" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">replicas</text>
  <text x="406" y="348" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">4</text>
  <text x="706" y="348" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">20</text>

  <text x="96" y="392" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">image</text>
  <text x="406" y="392" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">api:v1.3.0</text>
  <text x="706" y="392" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">api:hotfix-2</text>

  <text x="96" y="436" font-size="16" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">timeout</text>
  <text x="406" y="436" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">3s</text>
  <text x="706" y="436" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">30s</text>

  <!-- 결론 -->
  <rect x="76" y="472" width="780" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="466" y="505" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">두 개가 다르다. 이게 드리프트다.</text>
</svg>
