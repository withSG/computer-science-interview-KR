<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구멍 2 — 드리프트(Drift)</title>
  <desc id="d">긴급 장애 대응으로 인해 Git의 선언 상태와 클러스터의 실제 상태가 달라지는 드리프트 현상을 설명하는 다이어그램</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 상단 장애 상황 박스 -->
  <rect x="40" y="30" width="800" height="150" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="6"/>
  <text x="60" y="62" font-size="14" font-weight="bold" fill="#d97706">새벽 3시. 장애가 났다. 담당자가 급하게 손을 쓴다.</text>
  
  <rect x="80" y="80" width="720" height="80" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="100" y="103" font-size="13" font-family="monospace" fill="#1f2933">kubectl scale deployment/api --replicas=20</text>
  <text x="100" y="125" font-size="13" font-family="monospace" fill="#1f2933">kubectl set image deployment/api api=api:hotfix-2</text>
  <text x="100" y="147" font-size="13" font-family="monospace" fill="#1f2933">kubectl edit configmap/api-config</text>
  <text x="460" y="147" font-size="13" font-family="monospace" fill="#52606d"># 타임아웃 값을 늘림</text>

  <!-- 중간 설명 -->
  <text x="40" y="215" font-size="14" font-weight="bold" fill="#1f2933">서비스는 살아났다. 그리고 아무도 이 변경을 Git에 반영하지 않았다.</text>

  <!-- 하단 드리프트 비교 영역 -->
  <rect x="40" y="240" width="800" height="220" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5" rx="6"/>

  <!-- Git의 선언 카드 -->
  <rect x="60" y="260" width="760" height="50" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="80" y="290" font-size="13" font-weight="bold" fill="#2563eb">Git의 선언       :</text>
  <text x="210" y="290" font-size="13" font-family="monospace" fill="#1f2933">replicas 4,  image api:v1.3.0,  timeout 3s</text>

  <!-- 클러스터의 실제 카드 -->
  <rect x="60" y="325" width="760" height="50" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="80" y="355" font-size="13" font-weight="bold" fill="#dc2626">클러스터의 실제   :</text>
  <text x="210" y="355" font-size="13" font-family="monospace" fill="#1f2933">replicas 20, image api:hotfix-2, timeout 30s</text>

  <!-- 드리프트 가리키는 화살표 및 설명 -->
  <path d="M 210,420 L 210,385" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <text x="225" y="415" font-size="13" font-weight="bold" fill="#dc2626">두 개가 다르다. 이게 드리프트다.</text>
</svg>