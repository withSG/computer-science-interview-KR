<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" width="880" height="650" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">원인을 찾느라 늦어진 롤백</title>
  <desc id="d">14:30 배포 후 14:33에 에러율이 0.1%에서 4.2%로 올랐지만 원인을 먼저 찾느라 15:20에야 롤백을 시작해 15:24에 정상 복귀한 과정을 시간축에 놓았습니다. 사용자가 아팠던 시간은 실제 51분, 14:35에 롤백을 시작했다면 6분으로 45분 차이가 납니다.</desc>
  <rect width="880" height="650" fill="#ffffff"/>

  <!-- 행 배경 (짝수 행 음영) -->
  <rect x="24" y="72" width="832" height="54" fill="#f3f4f6"/>
  <rect x="24" y="180" width="832" height="54" fill="#f3f4f6"/>
  <rect x="24" y="288" width="832" height="54" fill="#f3f4f6"/>
  <rect x="24" y="396" width="832" height="54" fill="#f3f4f6"/>

  <!-- 머리행 -->
  <text x="40" y="56" font-size="14" font-weight="bold" fill="#4b5563">시각</text>
  <text x="112" y="56" font-size="14" font-weight="bold" fill="#4b5563">상황</text>
  <g font-size="14" fill="#4b5563" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="540" y="56">14:30</text>
    <text x="596" y="56">14:40</text>
    <text x="652" y="56">14:50</text>
    <text x="708" y="56">15:00</text>
    <text x="764" y="56">15:10</text>
    <text x="820" y="56">15:20</text>
  </g>

  <!-- 시간 눈금선 -->
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="540" y1="64" x2="540" y2="450"/>
    <line x1="596" y1="64" x2="596" y2="450"/>
    <line x1="652" y1="64" x2="652" y2="450"/>
    <line x1="708" y1="64" x2="708" y2="450"/>
    <line x1="764" y1="64" x2="764" y2="450"/>
    <line x1="820" y1="64" x2="820" y2="450"/>
  </g>

  <!-- 시각 열 -->
  <g font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="40" y="104">14:30</text>
    <text x="40" y="158">14:33</text>
    <text x="40" y="212">14:35</text>
    <text x="40" y="266">14:50</text>
    <text x="40" y="320">15:10</text>
    <text x="40" y="374">15:20</text>
    <text x="40" y="428">15:24</text>
  </g>

  <!-- 상황 열 -->
  <text x="112" y="104" font-size="16" fill="#111827">배포 완료</text>
  <text x="112" y="158" font-size="16" font-weight="bold" fill="#b91c1c">에러율 0.1% → 4.2%</text>
  <text x="112" y="202" font-size="15" fill="#92400e">
    <tspan x="112">“이번 배포는 로직 한 줄만 바꿨는데</tspan>
    <tspan x="112" dy="21">이게 원인일 리가 없다”</tspan>
  </text>
  <text x="112" y="266" font-size="15" fill="#374151">로그 분석 중... 커넥션 풀 고갈 로그 발견</text>
  <text x="112" y="310" font-size="15" fill="#374151">
    <tspan x="112">코드 리뷰 중...</tspan>
    <tspan x="112" dy="21">트랜잭션 안에서 외부 API를 부른다는 걸 발견</tspan>
  </text>
  <text x="112" y="374" font-size="16" font-weight="bold" fill="#047857">롤백 시작</text>
  <text x="112" y="428" font-size="16" font-weight="bold" fill="#047857">에러율 정상 복귀</text>

  <!-- 시간축 위 사건 점 -->
  <circle cx="540" cy="99" r="7" fill="#374151"/>
  <circle cx="556.8" cy="153" r="7" fill="#b91c1c"/>
  <circle cx="568" cy="207" r="7" fill="#b45309"/>
  <circle cx="652" cy="261" r="7" fill="#6b7280"/>
  <circle cx="764" cy="315" r="7" fill="#6b7280"/>
  <circle cx="820" cy="369" r="7" fill="#047857"/>
  <circle cx="842.4" cy="423" r="7" fill="#047857"/>

  <!-- 요약: 사용자가 아팠던 시간 -->
  <line x1="24" y1="468" x2="856" y2="468" stroke="#9ca3af" stroke-width="1"/>
  <text x="40" y="500" font-size="17" font-weight="bold" fill="#111827">사용자가 아팠던 시간 <tspan font-size="15" font-weight="normal" fill="#4b5563">(에러율이 오른 14:33부터)</tspan></text>

  <text x="40" y="538" font-size="16" font-weight="bold" fill="#b91c1c">실제</text>
  <rect x="556.8" y="516" width="285.6" height="30" fill="#b91c1c"/>
  <text x="699.6" y="537" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">51분</text>

  <text x="40" y="580" font-size="16" font-weight="bold" fill="#047857">14:35에 롤백을 시작했다면</text>
  <rect x="556.8" y="558" width="33.6" height="30" fill="#047857"/>
  <text x="600" y="579" font-size="17" font-weight="bold" fill="#047857">6분</text>

  <!-- 45분 차이 괄호 -->
  <line x1="842.4" y1="546" x2="842.4" y2="600" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="590.4" y1="588" x2="590.4" y2="600" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M590.4,598 V606 H842.4 V598" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="716.4" y="628" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">45분 차이</text>
</svg>
