<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TCP 3-way handshake</title>
  <desc id="d">Client가 SYN(seq=x)을 보내고 Server가 SYN+ACK(seq=y, ack=x+1)로 답하기까지가 1 RTT이며, Client가 ACK(ack=y+1)를 보내면 연결 수립이 완료된다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="150" y="24" width="120" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="210" y="50" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Client</text>
  <rect x="620" y="24" width="120" height="40" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="680" y="50" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="middle">Server</text>
  <line x1="210" y1="64" x2="210" y2="388" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="680" y1="64" x2="680" y2="388" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 1 RTT 구간 표시 (SYN 전송 ~ SYN+ACK 수신) -->
  <path d="M198,112 H184 V258 H198" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="172" y="178" font-size="15" fill="#374151" text-anchor="end">여기까지</text>
  <text x="172" y="204" font-size="20" font-weight="bold" fill="#b45309" text-anchor="end">1 RTT</text>

  <!-- SYN -->
  <line x1="210" y1="112" x2="676" y2="166" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="445" y="118" font-size="16" fill="#374151" text-anchor="middle"><tspan font-size="17" font-weight="bold" fill="#1d4ed8">SYN</tspan>  (연결하자, seq=x)</text>

  <!-- SYN+ACK -->
  <line x1="680" y1="204" x2="214" y2="258" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="445" y="200" font-size="16" fill="#374151" text-anchor="middle"><tspan font-size="17" font-weight="bold" fill="#6d28d9">SYN+ACK</tspan>  (좋다, seq=y, ack=x+1)</text>

  <!-- ACK -->
  <line x1="210" y1="304" x2="676" y2="358" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="445" y="310" font-size="16" fill="#374151" text-anchor="middle"><tspan font-size="17" font-weight="bold" fill="#1d4ed8">ACK</tspan>  (확인, ack=y+1)</text>

  <!-- 연결 수립 완료 -->
  <rect x="210" y="390" width="470" height="40" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="445" y="416" font-size="17" font-weight="bold" fill="#047857" text-anchor="middle">연결 수립 완료</text>
</svg>
