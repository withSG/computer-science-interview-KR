<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">4. TCP 연결 — 대화가 가능한 상태 만들기</title>
  <desc id="d">Client와 Server 간의 TCP 3-Way Handshake 과정을 나타낸 시퀀스 다이어그램</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>
  
  <text x="40" y="32" font-size="16" font-weight="bold" fill="#1f2933">4. TCP 연결 — 대화가 가능한 상태 만들기</text>
  
  <rect x="180" y="55" width="120" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="78" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Client</text>
  
  <rect x="580" y="55" width="120" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="78" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Server</text>
  
  <line x1="240" y1="91" x2="240" y2="360" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="640" y1="91" x2="640" y2="360" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <path d="M240,140 L631,140" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#m-blue)"/>
  <rect x="325" y="126" width="230" height="22" rx="4" fill="#ffffff"/>
  <text x="440" y="141" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">SYN (연결하자, seq=x)</text>
  
  <path d="M640,210 L249,210" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#m-purple)"/>
  <rect x="285" y="196" width="310" height="22" rx="4" fill="#ffffff"/>
  <text x="440" y="211" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">SYN+ACK (좋다, seq=y, ack=x+1)</text>
  
  <text x="655" y="214" font-size="11.5" fill="#52606d">← 여기까지 1 RTT</text>
  
  <path d="M240,280 L631,280" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#m-green)"/>
  <rect x="330" y="266" width="220" height="22" rx="4" fill="#ffffff"/>
  <text x="440" y="281" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">ACK (확인, ack=y+1)</text>
  
  <rect x="360" y="322" width="160" height="28" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="440" y="340" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">[연결 수립 완료]</text>
</svg>