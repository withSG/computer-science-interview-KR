<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">3가지 요소의 역할</title>
  <desc id="d">Observability의 3가지 요소인 Logs, Metrics, Traces의 역할, 질문, 상세 설명 모음</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Outer Container (Observability) -->
  <rect x="24" y="24" width="832" height="452" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="2"/>
  
  <!-- Outer Title Background -->
  <path d="M 24 32 C 24 28, 28 24, 32 24 L 848 24 C 852 24, 856 28, 856 32 L 856 80 L 24 80 Z" fill="#1f2933"/>
  <text x="440" y="58" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Observability</text>

  <!-- Divider Line below Header -->
  <line x1="24" y1="80" x2="856" y2="80" stroke="#9aa5b1" stroke-width="2"/>

  <!-- Column Separators -->
  <line x1="301" y1="80" x2="301" y2="476" stroke="#cbd2d9" stroke-width="2"/>
  <line x1="578" y1="80" x2="578" y2="476" stroke="#cbd2d9" stroke-width="2"/>

  <!-- Row Separators -->
  <line x1="24" y1="136" x2="856" y2="136" stroke="#cbd2d9" stroke-width="1.5"/>
  <line x1="24" y1="240" x2="856" y2="240" stroke="#cbd2d9" stroke-width="1.5"/>

  <!-- Section 1: Logs Column -->
  <!-- Column Header -->
  <rect x="25" y="81" width="275" height="54" fill="#eff6ff"/>
  <text x="162" y="113" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Logs</text>
  
  <!-- Question Box -->
  <rect x="36" y="148" width="253" height="80" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="162" y="180" font-size="13" fill="#1f2933" text-anchor="middle">"무슨 일이</text>
  <text x="162" y="206" font-size="13" fill="#1f2933" text-anchor="middle">일어났지?"</text>
  
  <!-- Details Content -->
  <text x="48" y="275" font-size="13" fill="#1f2933">상세한 정보</text>
  <text x="48" y="315" font-size="13" fill="#1f2933">디버깅</text>
  <text x="48" y="355" font-size="13" fill="#1f2933">감사 추적</text>

  <!-- Section 2: Metrics Column -->
  <!-- Column Header -->
  <rect x="302" y="81" width="275" height="54" fill="#ecfdf5"/>
  <text x="440" y="113" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">Metrics</text>
  
  <!-- Question Box -->
  <rect x="313" y="148" width="253" height="80" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="440" y="180" font-size="13" fill="#1f2933" text-anchor="middle">"얼마나</text>
  <text x="440" y="206" font-size="13" fill="#1f2933" text-anchor="middle">심각하지?"</text>
  
  <!-- Details Content -->
  <text x="325" y="275" font-size="13" fill="#1f2933">집계된 수치</text>
  <text x="325" y="315" font-size="13" fill="#1f2933">대시보드</text>
  <text x="325" y="355" font-size="13" fill="#1f2933">알림 설정</text>

  <!-- Section 3: Traces Column -->
  <!-- Column Header -->
  <rect x="579" y="81" width="276" height="54" fill="#f5f3ff"/>
  <text x="717" y="113" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Traces</text>
  
  <!-- Question Box -->
  <rect x="590" y="148" width="254" height="80" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="717" y="193" font-size="13" fill="#1f2933" text-anchor="middle">"어디서 느려졌지?"</text>
  
  <!-- Details Content -->
  <text x="602" y="275" font-size="13" fill="#1f2933">분산 요청 추적</text>
  <text x="602" y="315" font-size="13" fill="#1f2933">병목 구간 파악</text>
  <text x="602" y="355" font-size="13" fill="#1f2933">서비스 의존성</text>
</svg>