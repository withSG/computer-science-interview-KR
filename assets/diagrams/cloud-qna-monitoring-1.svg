<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Observability 3가지 요소의 역할</title>
  <desc id="d">Observability를 이루는 Logs, Metrics, Traces가 각각 답하는 질문(무슨 일이 일어났지, 얼마나 심각하지, 어디서 느려졌지)과 주요 용도를 세 열로 나란히 비교한다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 바깥 틀: Observability -->
  <rect x="24" y="24" width="832" height="322" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="60" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Observability <tspan font-size="16" font-weight="normal" fill="#4b5563">(관측가능성)</tspan></text>

  <!-- Logs -->
  <rect x="44" y="84" width="252" height="238" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M44 94 Q44 84 54 84 H286 Q296 84 296 94 V130 H44 Z" fill="#1d4ed8"/>
  <text x="170" y="114" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Logs</text>
  <rect x="45" y="130" width="250" height="66" fill="#eff6ff"/>
  <text x="170" y="169" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">“무슨 일이 일어났지?”</text>
  <circle cx="68" cy="225" r="3.5" fill="#1d4ed8"/>
  <text x="80" y="231" font-size="16" fill="#1f2937">상세한 정보</text>
  <circle cx="68" cy="259" r="3.5" fill="#1d4ed8"/>
  <text x="80" y="265" font-size="16" fill="#1f2937">디버깅</text>
  <circle cx="68" cy="293" r="3.5" fill="#1d4ed8"/>
  <text x="80" y="299" font-size="16" fill="#1f2937">감사 추적</text>

  <!-- Metrics -->
  <rect x="314" y="84" width="252" height="238" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M314 94 Q314 84 324 84 H556 Q566 84 566 94 V130 H314 Z" fill="#047857"/>
  <text x="440" y="114" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Metrics</text>
  <rect x="315" y="130" width="250" height="66" fill="#ecfdf5"/>
  <text x="440" y="169" font-size="18" font-weight="bold" fill="#064e3b" text-anchor="middle">“얼마나 심각하지?”</text>
  <circle cx="338" cy="225" r="3.5" fill="#047857"/>
  <text x="350" y="231" font-size="16" fill="#1f2937">집계된 수치</text>
  <circle cx="338" cy="259" r="3.5" fill="#047857"/>
  <text x="350" y="265" font-size="16" fill="#1f2937">대시보드</text>
  <circle cx="338" cy="293" r="3.5" fill="#047857"/>
  <text x="350" y="299" font-size="16" fill="#1f2937">알림 설정</text>

  <!-- Traces -->
  <rect x="584" y="84" width="252" height="238" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <path d="M584 94 Q584 84 594 84 H826 Q836 84 836 94 V130 H584 Z" fill="#6d28d9"/>
  <text x="710" y="114" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Traces</text>
  <rect x="585" y="130" width="250" height="66" fill="#f5f3ff"/>
  <text x="710" y="169" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">“어디서 느려졌지?”</text>
  <circle cx="608" cy="225" r="3.5" fill="#6d28d9"/>
  <text x="620" y="231" font-size="16" fill="#1f2937">분산 요청 추적</text>
  <circle cx="608" cy="259" r="3.5" fill="#6d28d9"/>
  <text x="620" y="265" font-size="16" fill="#1f2937">병목 구간 파악</text>
  <circle cx="608" cy="293" r="3.5" fill="#6d28d9"/>
  <text x="620" y="299" font-size="16" fill="#1f2937">서비스 의존성</text>
</svg>
