<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">델타 기반 저장과 복원 비용</title>
  <desc id="d">델타 기반 도구는 파일마다 v1 전체 뒤에 변경분(+3줄, -1줄, +7줄 …)을 쌓는다. v50 시점의 A.java를 보려면 v1을 꺼내 델타 49개를 순서대로 적용해야 한다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="24" y="42" font-size="19" font-weight="bold" fill="#111827">델타 기반<tspan dx="14" font-size="16" font-weight="normal" fill="#4b5563">파일 단위로 변경분을 쌓는다</tspan></text>

  <!-- A.java 레인 -->
  <rect x="24" y="68" width="832" height="64" rx="10" fill="#f3f4f6"/>
  <text x="42" y="106" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">A.java</text>
  <rect x="150" y="80" width="104" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="202" y="106" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1(전체)</text>
  <line x1="256" y1="100" x2="286" y2="100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="290" y="80" width="76" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="328" y="106" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">+3줄</text>
  <line x1="368" y1="100" x2="398" y2="100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="402" y="80" width="76" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="440" y="106" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">-1줄</text>
  <line x1="480" y1="100" x2="510" y2="100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="514" y="80" width="76" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="552" y="106" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">+7줄</text>
  <line x1="592" y1="100" x2="622" y2="100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="650" y="106" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>
  <line x1="678" y1="100" x2="706" y2="100" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="710" y="80" width="90" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="755" y="106" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">v57</text>

  <!-- B.java 레인 -->
  <rect x="24" y="144" width="832" height="64" rx="10" fill="#f3f4f6"/>
  <text x="42" y="182" font-size="17" font-weight="bold" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">B.java</text>
  <rect x="150" y="156" width="104" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="202" y="182" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1(전체)</text>
  <line x1="256" y1="176" x2="286" y2="176" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="290" y="156" width="76" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="328" y="182" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">+2줄</text>
  <line x1="368" y1="176" x2="398" y2="176" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="426" y="182" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>
  <line x1="454" y1="176" x2="706" y2="176" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <rect x="710" y="156" width="90" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="755" y="182" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">v41</text>

  <!-- 복원 비용 -->
  <rect x="24" y="234" width="832" height="162" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="44" y="270" font-size="18" font-weight="bold" fill="#111827">“v50 시점의 A.java를 보여줘”</text>
  <text x="44" y="302" font-size="17" font-weight="bold" fill="#b91c1c">→ v1을 꺼내서 델타 49개를 순서대로 적용해야 한다</text>

  <rect x="44" y="326" width="110" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="99" y="352" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">v1(전체)</text>
  <line x1="156" y1="346" x2="190" y2="346" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ahr)"/>
  <rect x="194" y="326" width="96" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="242" y="352" font-size="16" fill="#111827" text-anchor="middle">델타 1</text>
  <line x1="292" y1="346" x2="326" y2="346" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ahr)"/>
  <rect x="330" y="326" width="96" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="378" y="352" font-size="16" fill="#111827" text-anchor="middle">델타 2</text>
  <line x1="428" y1="346" x2="462" y2="346" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ahr)"/>
  <text x="490" y="352" font-size="20" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>
  <line x1="516" y1="346" x2="548" y2="346" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ahr)"/>
  <rect x="552" y="326" width="100" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="602" y="352" font-size="16" fill="#111827" text-anchor="middle">델타 49</text>
  <line x1="654" y1="346" x2="688" y2="346" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ahr)"/>
  <rect x="692" y="326" width="96" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="740" y="352" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">v50</text>
</svg>
