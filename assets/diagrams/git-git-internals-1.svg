<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">델타 방식과 그 비용</title>
  <desc id="d">파일 단위로 변경분을 쌓는 델타 기반 버전 관리 방식과 v50 시점 복원 시 발생하는 연산 비용을 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 헤딩 / 섹션 영역 -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">[델타 기반]</text>
  <text x="130" y="38" font-size="14" fill="#52606d">파일 단위로 변경분을 쌓는다</text>

  <!-- 메인 다이어그램 박스 (A.java) -->
  <rect x="30" y="65" width="820" height="60" rx="6" fill="#f8fafc" stroke="#e4e7eb" stroke-width="1"/>

  <rect x="45" y="77" width="75" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="82.5" y="99.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">A.java</text>

  <path d="M120,95 L145,95" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="145" y="79" width="80" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="185" y="99.2" font-size="12" fill="#1f2933" text-anchor="middle">v1(전체)</text>

  <path d="M225,95 L250,95" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="250" y="81" width="55" height="28" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="277.5" y="99.2" font-size="12" fill="#059669" text-anchor="middle">+3줄</text>

  <path d="M305,95 L330,95" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="330" y="81" width="55" height="28" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="357.5" y="99.2" font-size="12" fill="#dc2626" text-anchor="middle">-1줄</text>

  <path d="M385,95 L410,95" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="410" y="81" width="55" height="28" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="437.5" y="99.2" font-size="12" fill="#059669" text-anchor="middle">+7줄</text>

  <path d="M465,95 L490,95" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <text x="515" y="99.2" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">...</text>

  <path d="M540,95 L565,95" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="565" y="79" width="60" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="595" y="99.2" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">v57</text>


  <!-- 메인 다이어그램 박스 (B.java) -->
  <rect x="30" y="135" width="820" height="60" rx="6" fill="#f8fafc" stroke="#e4e7eb" stroke-width="1"/>

  <rect x="45" y="147" width="75" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="82.5" y="169.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">B.java</text>

  <path d="M120,165 L145,165" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="145" y="149" width="80" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="185" y="169.2" font-size="12" fill="#1f2933" text-anchor="middle">v1(전체)</text>

  <path d="M225,165 L250,165" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <rect x="250" y="151" width="55" height="28" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="277.5" y="169.2" font-size="12" fill="#059669" text-anchor="middle">+2줄</text>

  <path d="M305,165 L330,165" stroke="#9aa5b1" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <text x="357.5" y="169.2" font-size="14" font-weight="bold" fill="#52606d" text-anchor="middle">...</text>

  <path d="M385,165 L565,165" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-ink)"/>

  <rect x="565" y="149" width="60" height="32" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="595" y="169.2" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">v41</text>


  <!-- 문제점 / 비용 설명 영역 -->
  <rect x="30" y="220" width="820" height="90" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>

  <text x="60" y="254" font-size="13.5" font-weight="bold" fill="#991b1b">"v50 시점의 A.java를 보여줘"</text>

  <path d="M75,268 L75,286 L95,286" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <text x="105" y="290" font-size="13" fill="#dc2626">v1을 꺼내서 델타 49개를 순서대로 적용해야 한다</text>
</svg>