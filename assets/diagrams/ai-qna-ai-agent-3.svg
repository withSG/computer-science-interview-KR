<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">플로우 엔지니어링 예시</title>
  <desc id="d">계획 수립, 코드 생성, 테스트 실행 뒤 실패하면 수정과 재실행을 거쳐 테스트로 돌아가는 검증/재시도 루프를 돌고, 재실행이 성공하면 완료로 끝나는 흐름.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#ffffff"/>

  <!-- 1행: 계획 수립 → 코드 생성 → 테스트 실행 -->
  <rect x="24" y="40" width="160" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="50" cy="70" r="12" fill="#1d4ed8"/>
  <text x="50" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="72" y="76" font-size="17" font-weight="bold" fill="#111827">계획 수립</text>

  <rect x="248" y="40" width="160" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="274" cy="70" r="12" fill="#1d4ed8"/>
  <text x="274" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="296" y="76" font-size="17" font-weight="bold" fill="#111827">코드 생성</text>

  <rect x="472" y="40" width="160" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="498" cy="70" r="12" fill="#1d4ed8"/>
  <text x="498" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="520" y="76" font-size="17" font-weight="bold" fill="#111827">테스트 실행</text>

  <path d="M184,70 L246,70" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <path d="M408,70 L470,70" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ab)"/>

  <!-- 실패 → 수정 -->
  <path d="M552,100 L552,178" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="540" y="146" text-anchor="end" font-size="16" font-weight="bold" fill="#b91c1c">실패</text>

  <!-- 2행: 수정 → 재실행 -->
  <rect x="472" y="180" width="160" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <circle cx="498" cy="210" r="12" fill="#b45309"/>
  <text x="498" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="520" y="216" font-size="17" font-weight="bold" fill="#111827">수정</text>

  <rect x="696" y="180" width="160" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <circle cx="722" cy="210" r="12" fill="#b45309"/>
  <text x="722" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="744" y="216" font-size="17" font-weight="bold" fill="#111827">재실행</text>

  <path d="M632,210 L694,210" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ao)"/>

  <!-- 재실행 → 테스트 실행 (루프) -->
  <path d="M776,180 L776,70 L634,70" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#ao)"/>

  <!-- 루프 라벨 -->
  <rect x="588" y="122" width="152" height="34" rx="17" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="664" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">검증/재시도 루프</text>

  <!-- 성공 → 완료 -->
  <path d="M776,240 L776,318" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="790" y="286" font-size="16" font-weight="bold" fill="#047857">성공</text>

  <rect x="696" y="320" width="160" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <circle cx="722" cy="350" r="12" fill="#047857"/>
  <text x="722" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">6</text>
  <text x="744" y="356" font-size="17" font-weight="bold" fill="#111827">완료</text>
</svg>
