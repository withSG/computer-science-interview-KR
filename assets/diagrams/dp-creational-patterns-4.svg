<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로토타입 패턴: 얕은 복사와 깊은 복사 비교</title>
  <desc id="d">얕은 복사에서는 origin과 copy가 동일한 List를 공유하지만, 깊은 복사에서는 각각 독립된 List를 참조하는 구조를 보여주는 다이어그램입니다.</desc>
  
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Section 1: Shallow Copy (얕은 복사) -->
  <rect x="24" y="24" width="404" height="292" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="58" font-size="16" font-weight="bold" fill="#dc2626">[얕은 복사]</text>

  <!-- Shallow Copy Nodes -->
  <!-- origin -->
  <rect x="54" y="100" width="90" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="99" y="124" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">origin</text>

  <!-- copy -->
  <rect x="54" y="180" width="90" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="99" y="204" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">copy</text>

  <!-- List (Shared) -->
  <rect x="204" y="140" width="90" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="249" y="164" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">List</text>

  <!-- Item -->
  <rect x="324" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="364" y="164" font-size="13" fill="#1f2933" text-anchor="middle">Item</text>

  <!-- Shallow Copy Connections -->
  <!-- origin to List merge point -->
  <path d="M144,120 L174,120 L174,160 L204,160" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <!-- copy to List merge point -->
  <path d="M144,200 L174,200 L174,160" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <!-- Arrow pointing to List -->
  <path d="M174,160 L204,160" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-danger)"/>

  <!-- List to Item -->
  <path d="M294,160 L324,160" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Shallow Copy Caption -->
  <text x="226" y="260" font-size="13" fill="#dc2626" font-weight="bold" text-anchor="middle">같은 리스트를 공유</text>


  <!-- Section 2: Deep Copy (깊은 복사) -->
  <rect x="452" y="24" width="404" height="292" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="472" y="58" font-size="16" font-weight="bold" fill="#059669">[깊은 복사]</text>

  <!-- Deep Copy Nodes -->
  <!-- origin -->
  <rect x="482" y="100" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="522" y="124" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">origin</text>

  <!-- List(A) -->
  <rect x="612" y="100" width="90" height="40" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="657" y="124" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">List(A)</text>

  <!-- Item (Upper) -->
  <rect x="752" y="100" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="792" y="124" font-size="13" fill="#1f2933" text-anchor="middle">Item</text>

  <!-- copy -->
  <rect x="482" y="180" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="522" y="204" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">copy</text>

  <!-- List(B) -->
  <rect x="612" y="180" width="90" height="40" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="657" y="204" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">List(B)</text>

  <!-- Item (Lower) -->
  <rect x="752" y="180" width="80" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="792" y="204" font-size="13" fill="#1f2933" text-anchor="middle">Item</text>

  <!-- Deep Copy Connections -->
  <!-- origin to List(A) -->
  <path d="M562,120 L612,120" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-success)"/>
  <!-- List(A) to Item -->
  <path d="M702,120 L752,120" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- copy to List(B) -->
  <path d="M562,200 L612,200" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-success)"/>
  <!-- List(B) to Item -->
  <path d="M702,200 L752,200" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Deep Copy Caption -->
  <text x="654" y="260" font-size="13" fill="#059669" font-weight="bold" text-anchor="middle">리스트를 새로 만들었다</text>
</svg>