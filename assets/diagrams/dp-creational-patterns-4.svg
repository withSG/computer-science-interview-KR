<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">얕은 복사와 깊은 복사</title>
  <desc id="d">얕은 복사에서는 origin과 copy가 같은 List를 공유해 copy에 추가하면 원본에도 추가돼 있다. 깊은 복사에서는 origin은 List(A), copy는 새로 만든 List(B)를 가리킨다.</desc>
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="350" fill="#ffffff"/>

  <!-- 얕은 복사 -->
  <rect x="24" y="24" width="404" height="302" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="48" y="60" font-size="19" font-weight="700" fill="#b91c1c">얕은 복사</text>

  <rect x="48" y="100" width="100" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="98" y="128" font-size="16" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">origin</text>
  <rect x="48" y="196" width="100" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="98" y="224" font-size="16" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">copy</text>

  <rect x="206" y="148" width="88" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="250" y="176" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">List</text>
  <rect x="330" y="148" width="74" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="367" y="176" font-size="16" fill="#111827" text-anchor="middle">Item</text>

  <path d="M148,122 H178 V170 H200" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ar-red)"/>
  <path d="M148,218 H178 V170" stroke="#b91c1c" stroke-width="2" fill="none"/>
  <path d="M294,170 H324" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar-ink)"/>

  <text x="226" y="280" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle">같은 리스트를 공유</text>
  <text x="226" y="306" font-size="15" fill="#4b5563" text-anchor="middle">copy에 추가하면 원본에도 추가돼 있다</text>

  <!-- 깊은 복사 -->
  <rect x="452" y="24" width="404" height="302" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="476" y="60" font-size="19" font-weight="700" fill="#047857">깊은 복사</text>

  <rect x="476" y="100" width="90" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="521" y="128" font-size="16" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">origin</text>
  <rect x="606" y="100" width="100" height="44" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="656" y="128" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">List(A)</text>
  <rect x="746" y="100" width="86" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="789" y="128" font-size="16" fill="#111827" text-anchor="middle">Item</text>

  <rect x="476" y="196" width="90" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="521" y="224" font-size="16" font-weight="700" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">copy</text>
  <rect x="606" y="196" width="100" height="44" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="656" y="224" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">List(B)</text>
  <rect x="746" y="196" width="86" height="44" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="789" y="224" font-size="16" fill="#111827" text-anchor="middle">Item</text>

  <path d="M566,122 H600" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ar-green)"/>
  <path d="M706,122 H740" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar-ink)"/>
  <path d="M566,218 H600" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#ar-green)"/>
  <path d="M706,218 H740" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ar-ink)"/>

  <text x="654" y="280" font-size="17" font-weight="700" fill="#047857" text-anchor="middle">리스트를 새로 만들었다</text>
</svg>
