<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">에이징 우선순위 상승</title>
  <desc id="d">P_low의 우선순위가 t=0에 10으로 계속 밀리다가 5초마다 1씩 올라 t=45에 우선순위 1이 되어 드디어 실행되는 과정을 계단 그래프로 나타냈습니다. 숫자가 낮을수록 높은 우선순위입니다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 캡션 -->
  <text x="40" y="42" fill="#111827"><tspan font-size="19" font-weight="bold">에이징 예</tspan><tspan dx="10" font-size="16" fill="#374151">숫자가 낮을수록 높은 우선순위, 5초마다 1 상승</tspan></text>

  <!-- 세로 방향 표시 -->
  <text x="84" y="88" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">우선순위</text>
  <text x="84" y="110" font-size="15" fill="#374151" text-anchor="middle">높음</text>
  <path d="M84,410 L84,124" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="84" y="432" font-size="15" fill="#374151" text-anchor="middle">낮음</text>

  <!-- 시간축 -->
  <path d="M120,450 L846,450" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-gray)"/>
  <g stroke="#4b5563" stroke-width="1.5">
    <line x1="130" y1="445" x2="130" y2="455"/>
    <line x1="206" y1="445" x2="206" y2="455"/>
    <line x1="282" y1="445" x2="282" y2="455"/>
    <line x1="358" y1="445" x2="358" y2="455"/>
    <line x1="434" y1="445" x2="434" y2="455"/>
    <line x1="510" y1="445" x2="510" y2="455"/>
    <line x1="586" y1="445" x2="586" y2="455"/>
    <line x1="662" y1="445" x2="662" y2="455"/>
    <line x1="738" y1="445" x2="738" y2="455"/>
    <line x1="814" y1="445" x2="814" y2="455"/>
  </g>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="130" y="475">0</text>
    <text x="206" y="475">5</text>
    <text x="282" y="475">10</text>
    <text x="358" y="475">15</text>
    <text x="434" y="475">20</text>
    <text x="510" y="475">25</text>
    <text x="586" y="475">30</text>
    <text x="662" y="475">35</text>
    <text x="738" y="475">40</text>
    <text x="814" y="475">45</text>
  </g>
  <text x="846" y="502" font-size="15" font-weight="bold" fill="#374151" text-anchor="end">시간 t (초)</text>

  <!-- 계단: 5초마다 우선순위 숫자 1 감소 -->
  <path d="M130,400 H206 V370 H282 V340 H358 V310 H434 V280 H510 V250 H586 V220 H662 V190 H738 V160 H814 V130" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/>

  <g fill="#6d28d9">
    <circle cx="206" cy="370" r="5"/>
    <circle cx="282" cy="340" r="5"/>
    <circle cx="358" cy="310" r="5"/>
    <circle cx="434" cy="280" r="5"/>
    <circle cx="510" cy="250" r="5"/>
    <circle cx="586" cy="220" r="5"/>
    <circle cx="662" cy="190" r="5"/>
    <circle cx="738" cy="160" r="5"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#4c1d95">
    <text x="216" y="362">9</text>
    <text x="292" y="332">8</text>
    <text x="368" y="302">7</text>
    <text x="444" y="272">6</text>
    <text x="520" y="242">5</text>
    <text x="596" y="212">4</text>
    <text x="672" y="182">3</text>
    <text x="748" y="152">2</text>
  </g>

  <!-- 한 계단 = 5초, 1 상승 -->
  <text x="472" y="300" font-size="14" fill="#4b5563" text-anchor="middle">5초</text>
  <text x="518" y="271" font-size="14" fill="#4b5563">1 상승</text>

  <!-- 시작: 계속 밀림 -->
  <circle cx="130" cy="400" r="7" fill="#b45309"/>
  <text x="124" y="431" font-size="15" font-weight="bold" fill="#b45309">t=0  P_low: 우선순위 10 · 계속 밀림</text>

  <!-- 끝: 드디어 실행 -->
  <circle cx="814" cy="130" r="8" fill="#047857"/>
  <text x="796" y="128" font-size="16" font-weight="bold" fill="#047857" text-anchor="end">t=45  P_low: 우선순위 1 · 드디어 실행</text>
</svg>
