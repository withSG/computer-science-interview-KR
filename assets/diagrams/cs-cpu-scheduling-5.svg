<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">기아와 에이징 - 에이징 예</title>
  <desc id="d">에이징 예시: 시간 경과(t=0부터 t=45까지)에 따라 P_low 프로세스의 우선순위가 10에서 1로 상승하여 실행되는 과정을 나타낸 다이어그램입니다.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  
  <rect width="880" height="380" fill="#ffffff"/>

  <rect x="24" y="24" width="832" height="332" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

  <text x="48" y="58" font-size="16" font-weight="bold" fill="#1f2933">4. 기아와 에이징</text>
  <text x="48" y="82" font-size="13" fill="#52606d">에이징 예 (숫자가 낮을수록 높은 우선순위, 5초마다 1 상승)</text>

  <path d="M120,115 L120,315" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <g>
    <rect x="48" y="105" width="54" height="26" rx="4" fill="#1f2933"/>
    <text x="75" y="122" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">t=0</text>
    
    <circle cx="120" cy="118" r="4" fill="#1f2933"/>

    <rect x="150" y="100" width="220" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="166" y="123" font-size="13" font-weight="bold" fill="#1f2933">P_low: 우선순위 10</text>

    <path d="M380,118 L440,118" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="450" y="100" width="100" height="36" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="500" y="123" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">계속 밀림</text>
  </g>

  <g>
    <rect x="48" y="150" width="54" height="26" rx="4" fill="#52606d"/>
    <text x="75" y="167" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">t=5</text>
    <circle cx="120" cy="163" r="4" fill="#52606d"/>

    <rect x="150" y="145" width="220" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="166" y="168" font-size="13" fill="#1f2933">P_low: 우선순위 9</text>
  </g>

  <g>
    <rect x="48" y="195" width="54" height="26" rx="4" fill="#52606d"/>
    <text x="75" y="212" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">t=10</text>
    <circle cx="120" cy="208" r="4" fill="#52606d"/>

    <rect x="150" y="190" width="220" height="36" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="166" y="213" font-size="13" fill="#1f2933">P_low: 우선순위 8</text>
  </g>

  <g>
    <text x="75" y="252" font-size="16" font-weight="bold" fill="#52606d" text-anchor="middle">...</text>
    <text x="250" y="252" font-size="16" font-weight="bold" fill="#52606d" text-anchor="middle">...</text>
  </g>

  <g>
    <rect x="48" y="280" width="54" height="26" rx="4" fill="#059669"/>
    <text x="75" y="297" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">t=45</text>
    <circle cx="120" cy="293" r="4" fill="#059669"/>

    <rect x="150" y="275" width="220" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="166" y="298" font-size="13" font-weight="bold" fill="#1f2933">P_low: 우선순위 1</text>

    <path d="M380,293 L440,293" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
    <rect x="450" y="275" width="112" height="36" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="506" y="298" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">드디어 실행</text>
  </g>

  <g>
    <rect x="620" y="100" width="210" height="110" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="635" y="122" font-size="11.5" font-weight="bold" fill="#52606d">범례</text>
    
    <rect x="635" y="135" width="12" height="12" rx="2" fill="#fffbeb" stroke="#d97706"/>
    <text x="655" y="145" font-size="11" fill="#1f2933">대기 (기아 상태)</text>

    <rect x="635" y="158" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669"/>
    <text x="655" y="168" font-size="11" fill="#1f2933">우선순위 도달 / 실행</text>

    <text x="635" y="193" font-size="11" fill="#52606d">* 대기 시간이 늘어남에 따라</text>
    <text x="635" y="206" font-size="11" fill="#52606d">  우선순위 수치 감소(상승)</text>
  </g>
</svg>