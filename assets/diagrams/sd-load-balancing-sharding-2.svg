<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">라운드 로빈의 부하 쏠림</title>
  <desc id="d">무거운 요청(3초)과 가벼운 요청(10ms)이 번갈아 들어올 때 라운드 로빈이 순서대로 하나씩 나누면 서버1에는 무거운 요청만 가서 큐가 계속 쌓이고 서버2에는 가벼운 요청만 가서 거의 놀고 있다. 요청 개수는 반반이지만 부하는 완전히 기운다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- 들어오는 요청 -->
  <text x="24" y="64" font-size="16" font-weight="bold" fill="#111827">요청</text>
  <rect x="132" y="38" width="104" height="42" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="184" y="64" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">무거움 3초</text>
  <rect x="244" y="38" width="104" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="296" y="64" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">가벼움 10ms</text>
  <rect x="356" y="38" width="104" height="42" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="408" y="64" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">무거움 3초</text>
  <rect x="468" y="38" width="104" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="520" y="64" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">가벼움 10ms</text>
  <rect x="580" y="38" width="104" height="42" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="632" y="64" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">무거움 3초</text>
  <rect x="692" y="38" width="104" height="42" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="744" y="64" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">가벼움 10ms</text>
  <text x="810" y="66" font-size="20" font-weight="bold" fill="#4b5563">…</text>

  <!-- 라운드 로빈 배정 -->
  <text x="24" y="113" font-size="15" font-weight="bold" fill="#111827">라운드 로빈</text>
  <rect x="144" y="94" width="80" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="184" y="113" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">→ 서버1</text>
  <rect x="256" y="94" width="80" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="296" y="113" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">→ 서버2</text>
  <rect x="368" y="94" width="80" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="408" y="113" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">→ 서버1</text>
  <rect x="480" y="94" width="80" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="520" y="113" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">→ 서버2</text>
  <rect x="592" y="94" width="80" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="632" y="113" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">→ 서버1</text>
  <rect x="704" y="94" width="80" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="744" y="113" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">→ 서버2</text>

  <line x1="24" y1="144" x2="856" y2="144" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="24" y="178" font-size="18" font-weight="bold" fill="#111827">라운드 로빈 결과</text>

  <!-- 서버1 -->
  <rect x="24" y="196" width="104" height="56" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="76" y="230" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">서버1</text>
  <line x1="176" y1="224" x2="134" y2="224" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="182" y="204" width="88" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="226" y="229" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">무거움</text>
  <rect x="278" y="204" width="88" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="322" y="229" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">무거움</text>
  <rect x="374" y="204" width="88" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="418" y="229" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">무거움</text>
  <text x="472" y="231" font-size="20" font-weight="bold" fill="#4b5563">…</text>
  <line x1="508" y1="224" x2="562" y2="224" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="572" y="200" width="284" height="48" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="714" y="230" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">큐가 계속 쌓인다</text>

  <!-- 서버2 -->
  <rect x="24" y="268" width="104" height="56" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="76" y="302" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">서버2</text>
  <line x1="176" y1="296" x2="134" y2="296" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="182" y="276" width="88" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="226" y="301" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">가벼움</text>
  <rect x="278" y="276" width="88" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="322" y="301" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">가벼움</text>
  <rect x="374" y="276" width="88" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="418" y="301" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">가벼움</text>
  <text x="472" y="303" font-size="20" font-weight="bold" fill="#4b5563">…</text>
  <line x1="508" y1="296" x2="562" y2="296" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="572" y="272" width="284" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="714" y="302" font-size="18" font-weight="bold" fill="#047857" text-anchor="middle">거의 놀고 있다</text>

  <!-- 요점 -->
  <rect x="24" y="348" width="832" height="48" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
  <text x="440" y="378" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">요청 개수는 정확히 반반인데, 부하는 완전히 기울었다</text>
</svg>
