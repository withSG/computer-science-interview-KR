<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">병목은 사라지지 않고 아래로 내려간다</title>
  <desc id="d">1단계 이미지 대역폭 부족에서 2단계 애플리케이션 CPU 100%, 3단계 DB 커넥션 고갈로 이어지는 병목 이동 과정</desc>
  <rect width="880" height="500" fill="#ffffff"/>

  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 제목 헤딩 -->
  <text x="40" y="42" font-size="16" font-weight="bold" fill="#1f2933">3. 병목은 사라지지 않고 아래로 내려간다</text>

  <!-- [1단계] 영역 -->
  <g>
    <!-- 단계 박스 (파랑) -->
    <rect x="40" y="70" width="800" height="100" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="56" y="86" width="70" height="26" rx="4" fill="#2563eb"/>
    <text x="91" y="103" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[1단계]</text>
    
    <!-- 내용 텍스트 -->
    <text x="138" y="103" font-size="13" font-weight="bold" fill="#1f2933">CDN 없음, 서버 2대 → 이미지가 대역폭을 다 먹어 API가 느리다</text>
    
    <!-- 조치 라벨 및 배경 -->
    <rect x="56" y="126" width="768" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="70" y="145" font-size="13" font-weight="bold" fill="#2563eb">조치:</text>
    <text x="110" y="145" font-size="13" fill="#1f2933">CDN 도입</text>
  </g>

  <!-- 1단계 → 2단계 화살표 -->
  <path d="M440,170 L440,198" stroke="#52606d" stroke-width="2" fill="none" marker-end="url(#a-gray)"/>

  <!-- [2단계] 영역 -->
  <g>
    <!-- 단계 박스 (주황) -->
    <rect x="40" y="200" width="800" height="100" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="56" y="216" width="70" height="26" rx="4" fill="#d97706"/>
    <text x="91" y="233" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[2단계]</text>
    
    <!-- 내용 텍스트 -->
    <text x="138" y="233" font-size="13" font-weight="bold" fill="#1f2933">이미지는 CDN이 처리 → 이번엔 애플리케이션 CPU가 100%</text>
    
    <!-- 조치 라벨 및 배경 -->
    <rect x="56" y="256" width="768" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="70" y="275" font-size="13" font-weight="bold" fill="#d97706">조치:</text>
    <text x="110" y="275" font-size="13" fill="#1f2933">서버 2대 → 20대</text>
  </g>

  <!-- 2단계 → 3단계 화살표 -->
  <path d="M440,300 L440,328" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- [3단계] 영역 (핵심 - 빨강) -->
  <g>
    <!-- 단계 박스 (빨강) -->
    <rect x="40" y="330" width="800" height="100" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="56" y="346" width="70" height="26" rx="4" fill="#dc2626"/>
    <text x="91" y="363" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">[3단계]</text>
    
    <!-- 내용 텍스트 -->
    <text x="138" y="363" font-size="13" font-weight="bold" fill="#1f2933">애플리케이션은 여유 → DB 커넥션 고갈, "connection is not available"</text>
    
    <!-- 조치 라벨 및 배경 -->
    <rect x="56" y="386" width="768" height="30" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="70" y="405" font-size="13" font-weight="bold" fill="#dc2626">조치:</text>
    <text x="110" y="405" font-size="13" font-weight="bold" fill="#dc2626">???</text>
  </g>
</svg>