<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DNS 캐시 확인 순서</title>
  <desc id="d">DNS 캐시는 브라우저, OS, 라우터, ISP 순서로 확인한다.</desc>
  <rect width="880" height="170" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="36" y="40" font-size="15" font-weight="700" fill="#4b5563">DNS 캐싱: 이 순서로 캐시 확인</text>

  <!-- 1 브라우저 -->
  <rect x="36" y="64" width="160" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="68" cy="98" r="14" fill="#1d4ed8"/>
  <text x="68" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="130" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">브라우저</text>

  <path d="M198,98 L248,98" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- 2 OS -->
  <rect x="252" y="64" width="160" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="284" cy="98" r="14" fill="#1d4ed8"/>
  <text x="284" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="346" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">OS</text>

  <path d="M414,98 L464,98" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- 3 라우터 -->
  <rect x="468" y="64" width="160" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="500" cy="98" r="14" fill="#1d4ed8"/>
  <text x="500" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="562" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">라우터</text>

  <path d="M630,98 L680,98" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- 4 ISP -->
  <rect x="684" y="64" width="160" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="716" cy="98" r="14" fill="#1d4ed8"/>
  <text x="716" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="778" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">ISP</text>
</svg>
