<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">README를 열었을 때</title>
  <desc id="d">README의 나쁜 경우와 좋은 경우를 네 쌍으로 나란히 비교한 표. 기본 README·배지 나열·실행 방법 없음·역할 구분 없음이 각각 어떤 인상을 주는지, 대응하는 좋은 경우가 무엇을 얻는지 보여준다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <text x="24" y="46" font-size="18" font-weight="bold" fill="#1f2933">README를 열었을 때</text>

  <!-- 나쁜 경우 -->
  <rect x="24" y="66" width="404" height="44" fill="#fee2e2"/>
  <rect x="24" y="110" width="404" height="320" fill="#fef2f2"/>
  <line x1="24" y1="110" x2="428" y2="110" stroke="#f87171" stroke-width="1.5"/>
  <line x1="24" y1="190" x2="428" y2="190" stroke="#fecaca" stroke-width="1"/>
  <line x1="24" y1="270" x2="428" y2="270" stroke="#fecaca" stroke-width="1"/>
  <line x1="24" y1="350" x2="428" y2="350" stroke="#fecaca" stroke-width="1"/>
  <rect x="24" y="66" width="404" height="364" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <text x="44" y="95" font-size="18" font-weight="bold" fill="#b91c1c">나쁜 경우</text>

  <text x="44" y="144" font-size="16" fill="#1f2933">create-react-app 기본 README</text>
  <text x="44" y="170" font-size="16" font-weight="bold" fill="#b91c1c">→ 신경 안 썼다는 신호</text>

  <text x="44" y="224" font-size="16" fill="#1f2933">기술 스택 배지만 20개</text>
  <text x="44" y="250" font-size="16" font-weight="bold" fill="#b91c1c">→ 나열형 사고</text>

  <text x="44" y="304" font-size="16" fill="#1f2933">실행 방법 없음</text>
  <text x="44" y="330" font-size="16" font-weight="bold" fill="#b91c1c">→ 돌려볼 수 없음</text>

  <text x="44" y="384" font-size="16" fill="#1f2933">팀 프로젝트인데 역할 구분 없음</text>
  <text x="44" y="410" font-size="16" font-weight="bold" fill="#b91c1c">→ 뭘 했는지 알 수 없음</text>

  <!-- 좋은 경우 -->
  <rect x="452" y="66" width="404" height="44" fill="#d1fae5"/>
  <rect x="452" y="110" width="404" height="320" fill="#ecfdf5"/>
  <line x1="452" y1="110" x2="856" y2="110" stroke="#34d399" stroke-width="1.5"/>
  <line x1="452" y1="190" x2="856" y2="190" stroke="#a7f3d0" stroke-width="1"/>
  <line x1="452" y1="270" x2="856" y2="270" stroke="#a7f3d0" stroke-width="1"/>
  <line x1="452" y1="350" x2="856" y2="350" stroke="#a7f3d0" stroke-width="1"/>
  <rect x="452" y="66" width="404" height="364" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="472" y="95" font-size="18" font-weight="bold" fill="#047857">좋은 경우</text>

  <text x="472" y="144" font-size="16" fill="#1f2933">한 줄 소개 + 스크린샷/GIF</text>
  <text x="472" y="170" font-size="16" font-weight="bold" fill="#047857">→ 3초 안에 뭔지 파악됨</text>

  <text x="472" y="224" font-size="16" fill="#1f2933">스택 + "왜 골랐는지" 한 줄씩</text>
  <text x="472" y="250" font-size="16" font-weight="bold" fill="#047857">→ 결정의 흔적</text>

  <text x="472" y="304" font-size="16" fill="#1f2933">설치·실행 명령 복붙 가능</text>
  <text x="472" y="330" font-size="16" font-weight="bold" fill="#047857">→ 검증 가능</text>

  <text x="472" y="384" font-size="16" fill="#1f2933">담당 영역 명시</text>
  <text x="472" y="410" font-size="16" font-weight="bold" fill="#047857">→ 질문할 지점이 명확</text>
</svg>
