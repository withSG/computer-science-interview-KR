<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이미 평가가 시작된 자료</title>
  <desc id="d">README를 열었을 때 나쁜 경우와 좋은 경우를 비교한 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  
  <rect width="880" height="500" fill="#ffffff"/>

  <!-- 상단 타이틀 -->
  <rect x="340" y="24" width="200" height="36" rx="4" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="46.6" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">[README를 열었을 때]</text>

  <!-- 왼쪽: 나쁜 경우 구역 -->
  <rect x="30" y="80" width="400" height="395" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="230" y="108.6" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">나쁜 경우</text>
  <line x1="50" y1="122" x2="410" y2="122" stroke="#dc2626" stroke-width="1.5"/>

  <!-- 나쁜 경우 항목 1 -->
  <rect x="50" y="135" width="360" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="230" y="157.6" font-size="13" fill="#1f2933" text-anchor="middle">create-react-app 기본 README</text>
  <path d="M230,171 L230,190" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="120" y="198" width="220" height="28" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="230" y="216.0" font-size="12" fill="#dc2626" text-anchor="middle">→ 신경 안 썼다는 신호</text>

  <!-- 나쁜 경우 항목 2 -->
  <rect x="50" y="240" width="360" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="230" y="262.6" font-size="13" fill="#1f2933" text-anchor="middle">기술 스택 배지만 20개</text>
  <path d="M230,276 L230,295" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="150" y="303" width="160" height="28" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="230" y="321.0" font-size="12" fill="#dc2626" text-anchor="middle">→ 나열형 사고</text>

  <!-- 나쁜 경우 항목 3 -->
  <rect x="50" y="345" width="360" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="230" y="367.6" font-size="13" fill="#1f2933" text-anchor="middle">실행 방법 없음</text>
  <path d="M230,381 L230,400" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="150" y="408" width="160" height="28" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="230" y="426.0" font-size="12" fill="#dc2626" text-anchor="middle">→ 돌려볼 수 없음</text>

  <!-- 오른쪽: 좋은 경우 구역 -->
  <rect x="450" y="80" width="400" height="395" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="650" y="108.6" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">좋은 경우</text>
  <line x1="470" y1="122" x2="830" y2="122" stroke="#059669" stroke-width="1.5"/>

  <!-- 좋은 경우 항목 1 -->
  <rect x="470" y="135" width="360" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="650" y="157.6" font-size="13" fill="#1f2933" text-anchor="middle">한 줄 소개 + 스크린샷/GIF</text>
  <path d="M650,171 L650,190" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="530" y="198" width="240" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="650" y="216.0" font-size="12" fill="#059669" text-anchor="middle">→ 3초 안에 뭔지 파악됨</text>

  <!-- 좋은 경우 항목 2 -->
  <rect x="470" y="240" width="360" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="650" y="262.6" font-size="13" fill="#1f2933" text-anchor="middle">스택 + "왜 골랐는지" 한 줄씩</text>
  <path d="M650,276 L650,295" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="570" y="303" width="160" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="650" y="321.0" font-size="12" fill="#059669" text-anchor="middle">→ 결정의 흔적</text>

  <!-- 좋은 경우 항목 3 -->
  <rect x="470" y="345" width="360" height="36" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="650" y="367.6" font-size="13" fill="#1f2933" text-anchor="middle">설치·실행 명령 복붙 가능</text>
  <path d="M650,381 L650,400" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="570" y="408" width="160" height="28" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="650" y="426.0" font-size="12" fill="#059669" text-anchor="middle">→ 검증 가능</text>
</svg>