<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">문제 1 — 뒤로 갈수록 느려진다</title>
  <desc id="d">Offset 방식과 Cursor 방식의 데이터 읽기 양 및 성능 차이를 비교하는 다이어그램</desc>
  <rect width="880" height="490" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="24" y="36" font-size="16" font-weight="bold" fill="#1f2933">문제 1 — 뒤로 갈수록 느려진다</text>

  <!-- SECTION 1: Offset 방식 -->
  <text x="24" y="75" font-size="14" font-weight="bold" fill="#1f2933">Offset 방식이 실제로 읽는 양</text>

  <!-- Offset Line 1 -->
  <text x="24" y="114" font-size="13" font-weight="bold" fill="#1f2933">1페이지</text>
  <text x="120" y="114" font-size="12" fill="#52606d">(OFFSET 0)</text>

  <!-- [■■■■■■■■■■] -->
  <rect x="230" y="96" width="230" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="345" y="113" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">■■■■■■■■■■</text>

  <text x="580" y="114" font-size="13" font-weight="bold" fill="#2563eb">10행 읽고 10행 반환</text>

  <!-- Offset Line 2 -->
  <text x="24" y="154" font-size="13" font-weight="bold" fill="#1f2933">10페이지</text>
  <text x="120" y="154" font-size="12" fill="#52606d">(OFFSET 90)</text>

  <!-- [□□□□□□□□□ ... □□□■■■■■■■■■■] -->
  <g>
    <!-- 버리는 부분 -->
    <rect x="230" y="136" width="160" height="26" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
    <text x="310" y="153" font-size="12" fill="#dc2626" text-anchor="middle">□□□□□□□□□ ... □□□</text>
    <!-- 취하는 부분 -->
    <rect x="395" y="136" width="165" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
    <text x="477.5" y="153" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">■■■■■■■■■■</text>
  </g>

  <text x="580" y="154" font-size="13" fill="#dc2626">100행 읽고 <tspan font-weight="bold">90행 버림</tspan></text>

  <!-- Offset Line 3 -->
  <text x="24" y="194" font-size="13" font-weight="bold" fill="#1f2933">1000페이지</text>
  <text x="120" y="194" font-size="12" fill="#52606d">(OFFSET 9990)</text>

  <!-- [□□□□□□□ ... 9990행 버림 ... □□□■■■■■■■■■■] -->
  <g>
    <!-- 버리는 부분 -->
    <rect x="230" y="176" width="220" height="26" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
    <text x="340" y="193" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">□□□□□ ... 9990행 버림 ... □□□</text>
    <!-- 취하는 부분 -->
    <rect x="455" y="176" width="105" height="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
    <text x="507.5" y="193" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">■■■■■■■■■■</text>
  </g>

  <text x="580" y="214" font-size="13" fill="#dc2626">10000행 읽고 <tspan font-weight="bold">9990행 버림</tspan></text>

  <!-- Divider Line -->
  <line x1="24" y1="245" x2="856" y2="245" stroke="#cbd2d9" stroke-width="1"/>

  <!-- SECTION 2: Cursor 방식 -->
  <text x="24" y="280" font-size="14" font-weight="bold" fill="#1f2933">Cursor 방식이 읽는 양</text>

  <!-- Cursor Line 1 -->
  <text x="24" y="320" font-size="13" font-weight="bold" fill="#1f2933">1페이지</text>

  <rect x="230" y="302" width="230" height="26" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="3"/>
  <text x="345" y="319" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">■■■■■■■■■■</text>

  <text x="580" y="320" font-size="13" font-weight="bold" fill="#059669">10행</text>

  <!-- Cursor Line 2 -->
  <text x="24" y="360" font-size="13" font-weight="bold" fill="#1f2933">10페이지</text>

  <rect x="230" y="342" width="230" height="26" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="3"/>
  <text x="345" y="359" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">■■■■■■■■■■</text>

  <text x="580" y="360" font-size="13" font-weight="bold" fill="#059669">10행</text>
  <text x="635" y="360" font-size="13" fill="#52606d">← 항상 같다</text>

  <!-- Cursor Line 3 -->
  <text x="24" y="400" font-size="13" font-weight="bold" fill="#1f2933">1000페이지</text>

  <rect x="230" y="382" width="230" height="26" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="3"/>
  <text x="345" y="399" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">■■■■■■■■■■</text>

  <text x="580" y="400" font-size="13" font-weight="bold" fill="#059669">10행</text>
  <text x="635" y="400" font-size="13" fill="#52606d">← 항상 같다</text>

  <!-- Legend / Footnote -->
  <g>
    <rect x="24" y="440" width="14" height="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1" rx="2"/>
    <text x="44" y="452" font-size="11.5" fill="#52606d">반환되는 데이터 (10행)</text>

    <rect x="210" y="440" width="14" height="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 2" rx="2"/>
    <text x="230" y="452" font-size="11.5" fill="#52606d">읽고 버려지는 데이터 (비효율 발생)</text>

    <rect x="460" y="440" width="14" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="1" rx="2"/>
    <text x="480" y="452" font-size="11.5" fill="#52606d">Cursor 방식 읽기 (일정함)</text>
  </g>
</svg>