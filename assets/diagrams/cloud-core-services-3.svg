<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">EBS와 S3 비교</title>
  <desc id="d">EBS는 EC2 인스턴스에 /dev/xvdf로 마운트된 디스크로 블록 단위 읽기/쓰기를 하며, 특정 AZ에 묶이고 한 인스턴스에 부착되며 파일시스템이 필요하다. S3는 앱, 브라우저, CLI 등 어디서든 HTTPS GET/PUT 요청으로 버킷에 접근하고, 버킷은 img/a/1.jpg, log/2026/x.gz 같은 키가 놓인 평평한 키 공간이다.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 열 구분선 -->
  <line x1="440" y1="24" x2="440" y2="416" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===== EBS ===== -->
  <rect x="24" y="24" width="404" height="42" rx="8" fill="#1d4ed8"/>
  <text x="226" y="51" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">EBS (블록 스토리지)</text>

  <rect x="66" y="86" width="320" height="82" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="226" y="118" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">EC2 인스턴스</text>
  <text x="226" y="148" font-size="15" fill="#1f2937" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">/dev/xvdf</tspan> 로 마운트된 디스크</text>

  <line x1="226" y1="172" x2="226" y2="244" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="242" y="214" font-size="15" font-weight="bold" fill="#1d4ed8">블록 단위 읽기/쓰기</text>

  <rect x="66" y="250" width="320" height="166" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="280" font-size="17" font-weight="bold" fill="#1d4ed8">EBS 볼륨</text>
  <text font-size="16" fill="#111827">
    <tspan x="90" y="318">• 특정 AZ에 묶임</tspan>
    <tspan x="90" y="350">• 한 인스턴스에 부착</tspan>
    <tspan x="90" y="382">• 파일시스템 필요</tspan>
  </text>

  <!-- ===== S3 ===== -->
  <rect x="452" y="24" width="404" height="42" rx="8" fill="#047857"/>
  <text x="654" y="51" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">S3 (객체 스토리지)</text>

  <rect x="494" y="86" width="320" height="82" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="654" y="118" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">어디서든 HTTPS 요청</text>
  <text x="654" y="148" font-size="15" fill="#1f2937" text-anchor="middle">(앱, 브라우저, CLI)</text>

  <line x1="654" y1="172" x2="654" y2="244" stroke="#047857" stroke-width="2" marker-end="url(#ag)"/>
  <text x="670" y="214" font-size="15" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">GET/PUT</text>

  <rect x="494" y="250" width="320" height="166" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="518" y="280" font-size="17" font-weight="bold" fill="#047857">버킷(bucket)</text>

  <text x="518" y="318" font-size="15" fill="#1f2937">키:</text>
  <rect x="556" y="298" width="210" height="30" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="570" y="318" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">img/a/1.jpg</text>

  <text x="518" y="356" font-size="15" fill="#1f2937">키:</text>
  <rect x="556" y="336" width="210" height="30" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.2"/>
  <text x="570" y="356" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">log/2026/x.gz</text>

  <text x="518" y="396" font-size="15" fill="#374151">(평평한 키 공간)</text>
</svg>
