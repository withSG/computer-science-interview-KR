<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스토리지: S3와 EBS 비교</title>
  <desc id="d">EBS(블록 스토리지)와 S3(객체 스토리지)의 구조, 연결 방식 및 특징을 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 영역 구분 배경 (EBS / S3) -->
  <rect x="30" y="20" width="390" height="350" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="460" y="20" width="390" height="350" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 메인 헤더 / 카테고리 타이틀 -->
  <text x="50" y="48" font-size="16" font-weight="bold" fill="#1f2933">EBS (블록 스토리지)</text>
  <text x="480" y="48" font-size="16" font-weight="bold" fill="#1f2933">S3 (객체 스토리지)</text>

  <!-- EBS 상단 박스 -->
  <rect x="60" y="70" width="330" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="99" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">EC2 인스턴스</text>
  <text x="225" y="121" font-size="13" text-anchor="middle" fill="#1f2933">/dev/xvdf 로</text>
  <text x="225" y="143" font-size="13" text-anchor="middle" fill="#1f2933">마운트된 디스크</text>

  <!-- EBS 화살표 및 라벨 -->
  <path d="M225,160 L225,230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="150" y="183" width="150" height="24" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="225" y="199" font-size="11.5" text-anchor="middle" fill="#52606d">블록 단위 읽기/쓰기</text>

  <!-- EBS 하단 박스 -->
  <rect x="60" y="230" width="330" height="110" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="265" font-size="13" text-anchor="middle" fill="#1f2933">특정 AZ에 묶임</text>
  <text x="225" y="289" font-size="13" text-anchor="middle" fill="#1f2933">한 인스턴스에 부착</text>
  <text x="225" y="313" font-size="13" text-anchor="middle" fill="#1f2933">파일시스템 필요</text>

  <!-- S3 상단 박스 -->
  <rect x="490" y="70" width="330" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="655" y="101" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2933">어디서든 HTTPS 요청</text>
  <text x="655" y="123" font-size="13" text-anchor="middle" fill="#1f2933">(앱, 브라우저, CLI)</text>

  <!-- S3 화살표 및 라벨 -->
  <path d="M655,140 L655,200" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <rect x="615" y="158" width="80" height="22" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" rx="4"/>
  <text x="655" y="173" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#059669">GET/PUT</text>

  <!-- S3 하단 박스 -->
  <rect x="490" y="200" width="330" height="140" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="515" y="230" font-size="13" font-weight="bold" fill="#1f2933">버킷(bucket)</text>
  <text x="530" y="257" font-size="13" fill="#1f2933">└ 키: img/a/1.jpg</text>
  <text x="530" y="281" font-size="13" fill="#1f2933">└ 키: log/2026/x.gz</text>
  <text x="515" y="311" font-size="13" fill="#1f2933">(평평한 키 공간)</text>
</svg>