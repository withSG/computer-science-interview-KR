<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">페이징 (Paging)</title>
  <desc id="d">가상 메모리와 물리 메모리의 페이징 매핑 구조 및 장단점을 나타낸 다이어그램</desc>
  <rect width="880" height="570" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title Zone -->
  <text x="30" y="40" font-size="16" font-weight="bold" fill="#1f2933">페이징 (Paging)</text>

  <!-- Section 1: Concept Definition -->
  <rect x="30" y="60" width="820" height="70" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="50" y="88" font-size="13" fill="#1f2933">가상 메모리를 고정 크기 "페이지(Page)"로 분할</text>
  <text x="50" y="112" font-size="13" fill="#1f2933">물리 메모리를 동일 크기 "프레임(Frame)"으로 분할</text>

  <!-- Section 2: Address Mapping Visual -->
  <!-- Virtual Address -->
  <rect x="30" y="150" width="310" height="50" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="40" y="180" font-size="13" font-weight="bold" fill="#2563eb">가상 주소 =</text>
  <rect x="135" y="158" width="105" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="187.5" y="180" font-size="13" text-anchor="middle" fill="#1f2933">페이지 번호</text>
  <line x1="240" y1="158" x2="240" y2="192" stroke="#9aa5b1" stroke-width="1"/>
  <rect x="240" y="158" width="90" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="285" y="180" font-size="13" text-anchor="middle" fill="#1f2933">오프셋</text>

  <!-- Mapping Node: Page Table -->
  <rect x="375" y="150" width="290" height="50" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="520" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">페이지 테이블: 페이지 번호 → 프레임 번호 매핑</text>

  <!-- Physical Address -->
  <rect x="30" y="220" width="310" height="50" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="40" y="250" font-size="13" font-weight="bold" fill="#059669">물리 주소 =</text>
  <rect x="135" y="228" width="105" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="187.5" y="250" font-size="13" text-anchor="middle" fill="#1f2933">프레임 번호</text>
  <line x1="240" y1="228" x2="240" y2="262" stroke="#9aa5b1" stroke-width="1"/>
  <rect x="240" y="228" width="90" height="34" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="285" y="250" font-size="13" text-anchor="middle" fill="#1f2933">오프셋</text>

  <!-- Connectors -->
  <path d="M 340 175 L 375 175" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M 520 200 L 520 245 L 340 245" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Section 3: Advantages & Disadvantages -->
  <!-- Advantages Box -->
  <rect x="30" y="295" width="820" height="110" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="50" y="325" font-size="14" font-weight="bold" fill="#059669">장점:</text>
  <text x="70" y="355" font-size="13" fill="#1f2933">- 외부 단편화(External Fragmentation) 없음</text>
  <text x="70" y="380" font-size="13" fill="#1f2933">- 연속되지 않은 메모리에 프로세스 배치 가능</text>

  <!-- Disadvantages Box -->
  <rect x="30" y="420" width="820" height="125" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="50" y="450" font-size="14" font-weight="bold" fill="#dc2626">단점:</text>
  <text x="70" y="480" font-size="13" fill="#1f2933">- 내부 단편화(Internal Fragmentation) 발생</text>
  <text x="85" y="505" font-size="11.5" fill="#52606d">(마지막 페이지가 꽉 차지 않으면 낭비)</text>
  <text x="70" y="530" font-size="13" fill="#1f2933">- 페이지 테이블 오버헤드</text>
</svg>