<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Blue-Green 배포</title>
  <desc id="d">단계 1에서는 Load Balancer가 트래픽 100%를 Blue(v1.0, Active)로 보내고 Green(v2.0)은 Standby입니다. 단계 2에서는 트래픽 100%를 Green(v2.0)으로 전환해 Green이 Active, Blue가 Standby가 됩니다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== 단계 1 ===== -->
  <rect x="24" y="24" width="388" height="310" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="56" font-size="17" font-weight="700" fill="#111827">단계 1: Blue(현재)에 100% 트래픽</text>

  <rect x="44" y="76" width="348" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="218" y="104" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Load Balancer</text>

  <path d="M124,122 V200" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="138" y="168" font-size="18" font-weight="700" fill="#1d4ed8">100%</text>

  <rect x="44" y="204" width="160" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="124" y="238" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">Blue</text>
  <text x="124" y="264" font-size="16" fill="#111827" text-anchor="middle">v1.0</text>
  <text x="124" y="289" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">(Active)</text>

  <rect x="232" y="204" width="160" height="100" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="312" y="238" font-size="19" font-weight="700" fill="#047857" text-anchor="middle">Green</text>
  <text x="312" y="264" font-size="16" fill="#111827" text-anchor="middle">v2.0</text>
  <text x="312" y="289" font-size="15" fill="#4b5563" text-anchor="middle">(Standby)</text>

  <!-- 단계 사이 -->
  <path d="M422,254 H458" fill="none" stroke="#6b7280" stroke-width="3" marker-end="url(#an)"/>

  <!-- ===== 단계 2 ===== -->
  <rect x="468" y="24" width="388" height="310" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="488" y="56" font-size="17" font-weight="700" fill="#111827">단계 2: 트래픽을 Green으로 전환</text>

  <rect x="488" y="76" width="348" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
  <text x="662" y="104" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Load Balancer</text>

  <path d="M756,122 V200" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#ag)"/>
  <text x="742" y="168" font-size="18" font-weight="700" fill="#047857" text-anchor="end">100%</text>

  <rect x="488" y="204" width="160" height="100" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="568" y="238" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">Blue</text>
  <text x="568" y="264" font-size="16" fill="#111827" text-anchor="middle">v1.0</text>
  <text x="568" y="289" font-size="15" fill="#4b5563" text-anchor="middle">(Standby)</text>

  <rect x="676" y="204" width="160" height="100" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="756" y="238" font-size="19" font-weight="700" fill="#047857" text-anchor="middle">Green</text>
  <text x="756" y="264" font-size="16" fill="#111827" text-anchor="middle">v2.0</text>
  <text x="756" y="289" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">(Active)</text>
</svg>
