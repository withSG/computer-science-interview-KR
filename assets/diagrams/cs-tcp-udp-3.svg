<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">슬라이딩 윈도우</title>
  <desc id="d">송신 측이 보는 바이트 스트림을 이미 ACK 받음, 보냈지만 ACK 대기, 보낼 수 있음, 아직 못 보냄 네 구간으로 나누고, 9번까지 수신했다는 ACK가 도착하면 8~14번이던 윈도우가 10~16번으로 오른쪽으로 미끄러지는 모습입니다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

