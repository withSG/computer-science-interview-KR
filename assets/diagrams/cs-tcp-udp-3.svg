  <rect x="704" y="360" width="44" height="44" fill="#bbf7d0" stroke="#047857" stroke-width="1.5"/>
  <text x="726" y="388" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">16</text>
  <text x="792" y="342" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">아직 못 보냄</text>
