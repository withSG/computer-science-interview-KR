<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Deployment · ReplicaSet · Pod 3계층</title>
  <desc id="d">Deployment web은 템플릿 버전마다 ReplicaSet을 하나씩 만든다. 구버전 v1의 ReplicaSet web-6f4는 replicas 0으로 롤백용 정의만 남고, 현재 v2의 ReplicaSet web-9a2가 Pod 3개를 유지한다.</desc>
  <rect width="880" height="460" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Deployment -->
  <rect x="290" y="24" width="300" height="80" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="440" y="57" font-size="19" font-weight="bold" fill="#312e81" text-anchor="middle">Deployment: web</text>
  <text x="440" y="86" font-size="16" fill="#312e81" text-anchor="middle">이미지 v2, replicas: 3</text>

  <!-- Deployment → ReplicaSet 분기 -->
  <line x1="440" y1="104" x2="440" y2="150" stroke="#374151" stroke-width="2"/>
  <text x="454" y="134" font-size="15" fill="#374151">템플릿 버전마다 하나씩</text>
  <line x1="190" y1="150" x2="640" y2="150" stroke="#374151" stroke-width="2"/>
  <line x1="190" y1="150" x2="190" y2="186" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="150" x2="640" y2="186" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- 구버전 ReplicaSet -->
  <rect x="40" y="192" width="300" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="190" y="220" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">구버전 (v1)</text>
  <text x="190" y="248" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">ReplicaSet web-6f4</text>
  <text x="190" y="276" font-size="16" fill="#374151" text-anchor="middle">replicas: 0</text>
  <text x="190" y="324" font-size="15" fill="#4b5563" text-anchor="middle">롤백용으로 정의만 남음</text>

  <!-- 현재 ReplicaSet -->
  <rect x="490" y="192" width="300" height="100" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="640" y="220" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">현재 (v2)</text>
  <text x="640" y="248" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ReplicaSet web-9a2</text>
  <text x="640" y="276" font-size="16" fill="#1e3a8a" text-anchor="middle">replicas: 3</text>

  <!-- ReplicaSet → Pod 분기 -->
  <line x1="640" y1="292" x2="640" y2="322" stroke="#374151" stroke-width="2"/>
  <line x1="496" y1="322" x2="784" y2="322" stroke="#374151" stroke-width="2"/>
  <line x1="496" y1="322" x2="496" y2="352" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="322" x2="640" y2="352" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="784" y1="322" x2="784" y2="352" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Pods -->
  <rect x="432" y="358" width="128" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="496" y="384" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Pod</text>
  <text x="496" y="412" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">web-9a2-k2p</text>

  <rect x="576" y="358" width="128" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="640" y="384" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Pod</text>
  <text x="640" y="412" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">web-9a2-x8m</text>

  <rect x="720" y="358" width="128" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="784" y="384" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Pod</text>
  <text x="784" y="412" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">web-9a2-q7d</text>
</svg>
