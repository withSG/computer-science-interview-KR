<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">호이스팅과 TDZ</title>
  <desc id="d">var는 선언과 초기화(undefined)가 동시에 진행되어 선언 전에 접근하면 undefined가 나옵니다. let과 const는 선언만 진행된 뒤 TDZ 구간을 거쳐 변수 선언문에 도달해야 초기화되며, const는 이때 초기화와 할당이 동시에 진행됩니다. TDZ 구간에서 접근하면 ReferenceError가 발생합니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 변수 선언문 도달 시점 -->
  <text x="598" y="36" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">변수 선언문 도달</text>
  <path d="M592,42 L604,42 L598,50 z" fill="#2563eb"/>
  <line x1="598" y1="52" x2="598" y2="322" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- var -->
  <text x="24" y="92" font-size="20" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">var</text>
  <text x="24" y="114" font-size="14" fill="#4b5563">선언</text>
  <rect x="120" y="60" width="232" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="236" y="89" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">선언 + 초기화(undefined)</text>
  <text x="236" y="112" font-size="14" fill="#065f46" text-anchor="middle">동시 진행</text>
  <line x1="354" y1="95" x2="372" y2="95" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="376" y="60" width="196" height="70" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="474" y="101" font-size="14" fill="#047857" text-anchor="middle">접근 → <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">undefined</tspan></text>

  <!-- let -->
  <text x="24" y="182" font-size="20" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">let</text>
  <text x="24" y="204" font-size="14" fill="#4b5563">선언</text>
  <rect x="120" y="150" width="232" height="70" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="236" y="191" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">선언만 진행</text>
  <line x1="354" y1="185" x2="372" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="376" y="150" width="196" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="474" y="179" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">TDZ 구간</text>
  <text x="474" y="202" font-size="14" fill="#991b1b" text-anchor="middle">접근 → <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ReferenceError</tspan></text>
  <line x1="574" y1="185" x2="594" y2="185" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="598" y="150" width="258" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="727" y="179" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">초기화</text>
  <text x="727" y="202" font-size="14" fill="#1e40af" text-anchor="middle">변수 선언문 도달 시</text>

  <!-- const -->
  <text x="24" y="272" font-size="20" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">const</text>
  <text x="24" y="294" font-size="14" fill="#4b5563">선언</text>
  <rect x="120" y="240" width="232" height="70" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="236" y="281" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">선언만 진행</text>
  <line x1="354" y1="275" x2="372" y2="275" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="376" y="240" width="196" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="474" y="269" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">TDZ 구간</text>
  <text x="474" y="292" font-size="14" fill="#991b1b" text-anchor="middle">접근 → <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ReferenceError</tspan></text>
  <line x1="574" y1="275" x2="594" y2="275" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="598" y="240" width="258" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="727" y="269" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">초기화 + 할당</text>
  <text x="727" y="292" font-size="14" fill="#1e40af" text-anchor="middle">변수 선언문 도달 시 동시 진행</text>
</svg>
