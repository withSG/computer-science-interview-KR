<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">세션과 JWT의 로그아웃 차이</title>
  <desc id="d">세션은 로그아웃하면 서버가 저장소에서 세션을 삭제해 즉시 차단한다. JWT는 클라이언트가 토큰을 지울 뿐 서버는 아무것도 하지 않아, 이미 복사해 둔 토큰이 있다면 만료 전까지 계속 유효하다.</desc>
  <rect width="880" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e40af"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#92400e"/>
    </marker>
  </defs>

  <!-- 세션 -->
  <rect x="24" y="24" width="832" height="156" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="44" y="54" width="90" height="60" rx="8" fill="#1d4ed8"/>
  <text x="89" y="90" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">세션</text>

  <rect x="158" y="54" width="110" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="213" y="90" font-size="16" fill="#111827" text-anchor="middle">로그아웃</text>
  <path d="M270,84 H306" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <rect x="310" y="54" width="220" height="60" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="420" y="90" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">저장소에서 세션 삭제</text>
  <path d="M532,84 H568" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <rect x="572" y="54" width="264" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="704" y="91" font-size="19" font-weight="bold" fill="#047857" text-anchor="middle">즉시 차단</text>

  <path d="M420,140 V118" stroke="#1e40af" stroke-width="1.5" fill="none" marker-end="url(#ahb)"/>
  <text x="420" y="160" font-size="15" fill="#1e40af" text-anchor="middle">서버가 <tspan font-weight="bold">"권한의 원본"</tspan>을 쥐고 있음</text>

  <!-- JWT -->
  <rect x="24" y="200" width="832" height="156" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="44" y="230" width="90" height="60" rx="8" fill="#b45309"/>
  <text x="89" y="266" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">JWT</text>

  <rect x="158" y="230" width="110" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="213" y="266" font-size="16" fill="#111827" text-anchor="middle">로그아웃</text>
  <path d="M270,260 H306" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <rect x="310" y="230" width="220" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="266" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">클라이언트가 토큰 삭제</text>
  <path d="M532,260 H568" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <rect x="572" y="230" width="264" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="704" y="254" font-size="15" fill="#111827" text-anchor="middle">이미 복사해 둔 토큰이 있다면</text>
  <text x="704" y="278" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle">만료 전까지 계속 유효</text>

  <path d="M420,316 V294" stroke="#92400e" stroke-width="1.5" fill="none" marker-end="url(#aha)"/>
  <text x="420" y="336" font-size="15" fill="#92400e" text-anchor="middle">서버는 <tspan font-weight="bold">아무것도 안 함</tspan></text>
</svg>
