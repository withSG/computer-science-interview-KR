<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">로컬 호출과 네트워크 호출의 결과</title>
  <desc id="d">모놀리식의 로컬 호출은 결과가 성공 또는 예외 두 가지뿐이지만, MSA에서 주문 서비스가 HTTP로 재고 서비스를 부르면 결과가 최소 다섯 가지이고 그중 처리 여부를 알 수 없는 타임아웃이 가장 어렵다는 것을 보여줍니다.</desc>
  <rect width="880" height="490" fill="#ffffff"/>
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 모놀리식 -->
  <rect x="24" y="24" width="252" height="278" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="40" y="55" font-size="18" font-weight="bold" fill="#111827">[모놀리식]</text>

  <rect x="40" y="84" width="72" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="76" y="112" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">주문</text>
  <path d="M116,114 L182,114" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arr-ink)"/>
  <text x="150" y="102" font-size="14" fill="#374151" text-anchor="middle">로컬 호출</text>
  <rect x="188" y="84" width="72" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="224" y="112" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">재고</text>

  <text x="40" y="170" font-size="17" font-weight="bold" fill="#111827">결과는 두 가지</text>
  <rect x="40" y="186" width="220" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="150" y="214" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">성공</text>
  <rect x="40" y="240" width="220" height="44" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="150" y="268" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">또는 예외</text>

  <!-- MSA -->
  <rect x="296" y="24" width="560" height="440" rx="10" fill="#f8faff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="312" y="55" font-size="18" font-weight="bold" fill="#1d4ed8">[MSA]</text>

  <rect x="312" y="84" width="120" height="44" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="372" y="112" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">주문 서비스</text>
  <path d="M436,114 L560,114" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="498" y="102" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">HTTP</text>
  <rect x="566" y="84" width="120" height="44" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="626" y="112" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">재고 서비스</text>

  <text x="312" y="170" font-size="17" font-weight="bold" fill="#111827">결과는 최소 다섯 가지</text>

  <!-- 1 -->
  <rect x="312" y="186" width="528" height="44" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <circle cx="336" cy="208" r="12" fill="#047857"/>
  <text x="336" y="213" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="360" y="214" font-size="16" font-weight="bold" fill="#047857">성공</text>

  <!-- 2 -->
  <rect x="312" y="240" width="528" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="336" cy="262" r="12" fill="#4b5563"/>
  <text x="336" y="267" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="360" y="267" font-size="15" fill="#1f2937">재고 서비스가 500을 반환 (실패 응답은 받았다)</text>

  <!-- 3: 가장 어렵다 -->
  <rect x="312" y="294" width="528" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="336" cy="316" r="12" fill="#b45309"/>
  <text x="336" y="321" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="360" y="321" font-size="15" font-weight="bold" fill="#92400e">타임아웃 — 처리됐는지 안 됐는지 알 수 없다</text>
  <rect x="720" y="302" width="110" height="28" rx="14" fill="#b45309"/>
  <text x="775" y="321" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">← 가장 어렵다</text>

  <!-- 4 -->
  <rect x="312" y="348" width="528" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="336" cy="370" r="12" fill="#4b5563"/>
  <text x="336" y="375" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="360" y="375" font-size="15" fill="#1f2937">커넥션 거부 (서비스가 죽었거나 배포 중)</text>

  <!-- 5 -->
  <rect x="312" y="402" width="528" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="336" cy="424" r="12" fill="#4b5563"/>
  <text x="336" y="429" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="360" y="429" font-size="15" fill="#1f2937">응답은 왔는데 그 사이 네트워크가 끊겨 주문 쪽이 못 받음</text>
</svg>
