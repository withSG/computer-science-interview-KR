<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">네트워크는 신뢰할 수 없다</title>
  <desc id="d">모놀리식 환경과 MSA 환경에서의 호출 결과 차이를 나타낸 다이어그램입니다. MSA 환경에서는 네트워크로 인해 다양한 결과 케이스와 타임아웃 같은 불확실성이 발생함을 설명합니다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">네트워크는 신뢰할 수 없다</text>

  <!-- Monolith Section -->
  <rect x="40" y="70" width="800" height="130" rx="6" fill="#f8fafc" stroke="#e4e7eb" stroke-width="1"/>
  
  <!-- [모놀리식] 주문 -> 재고 (로컬 호출) -->
  <text x="60" y="105" font-size="14" font-weight="bold" fill="#1f2933">[모놀리식]</text>
  
  <!-- Monolith Diagram Box -->
  <rect x="150" y="87" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="185" y="106" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">주문</text>
  
  <path d="M220,102 L280,102" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  
  <rect x="290" y="87" width="70" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="325" y="106" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">재고</text>
  
  <text x="375" y="106" font-size="13" fill="#52606d">(로컬 호출)</text>

  <!-- Monolith Result -->
  <text x="60" y="160" font-size="13" fill="#1f2933">결과는 두 가지: 성공, 또는 예외</text>

  <!-- MSA Section -->
  <rect x="40" y="220" width="800" height="280" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  
  <!-- [MSA] 주문 서비스 - -HTTP--> 재고 서비스 -->
  <text x="60" y="255" font-size="14" font-weight="bold" fill="#2563eb">[MSA]</text>
  
  <rect x="120" y="237" width="105" height="30" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="172" y="256" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">주문 서비스</text>
  
  <path d="M225,252 L360,252" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="268" y="243" width="48" height="18" fill="#ffffff"/>
  <text x="292" y="256" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">HTTP</text>
  
  <rect x="370" y="237" width="105" height="30" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="422" y="256" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">재고 서비스</text>

  <!-- MSA Results Header -->
  <text x="60" y="305" font-size="13" font-weight="bold" fill="#1f2933">결과는 최소 다섯 가지:</text>

  <!-- Results List -->
  <text x="90" y="335" font-size="13" fill="#059669" font-weight="bold">1. 성공</text>

  <text x="90" y="365" font-size="13" fill="#dc2626">2. 재고 서비스가 500을 반환 (실패했음이 확실)</text>

  <!-- Item 3 Highlighted -->
  <rect x="82" y="380" width="730" height="30" rx="4" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
  <text x="90" y="400" font-size="13" font-weight="bold" fill="#d97706">3. 타임아웃 — 처리됐는지 안 됐는지 알 수 없다</text>
  <path d="M450,396 L470,396" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Custom marker inline fallback / arrow -->
  <text x="450" y="400" font-size="13" font-weight="bold" fill="#d97706">← 가장 어렵다</text>

  <text x="90" y="435" font-size="13" fill="#52606d">4. 커넥션 거부 (서비스가 죽었거나 배포 중)</text>

  <text x="90" y="465" font-size="13" fill="#52606d">5. 응답은 왔는데 그 사이 네트워크가 끊겨 주문 쪽이 못 받음</text>
</svg>