<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">이벤트 루프의 두 규칙</title>
  <desc id="d">규칙 1: 매크로태스크는 한 사이클에 딱 하나만 꺼내 실행한다. 규칙 2: 매크로태스크가 끝나면 마이크로태스크 큐를 완전히 비우며, 비우는 도중 추가된 마이크로태스크도 이번에 처리한다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="880" height="310" fill="#ffffff"/>

  <!-- 규칙 1: 매크로태스크 -->
  <rect x="24" y="24" width="832" height="100" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="72" cy="74" r="24" fill="#1d4ed8"/>
  <text x="72" y="82" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="116" y="81" font-size="18" fill="#111827">매크로태스크는 한 사이클에 <tspan font-weight="bold" fill="#1d4ed8">딱 하나만</tspan> 꺼내 실행한다</text>

  <rect x="648" y="40" width="56" height="40" rx="6" fill="#1d4ed8"/>
  <text x="676" y="66" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">T1</text>
  <rect x="708" y="40" width="56" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="736" y="66" font-size="16" fill="#1d4ed8" text-anchor="middle">T2</text>
  <rect x="768" y="40" width="56" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="796" y="66" font-size="16" fill="#1d4ed8" text-anchor="middle">T3</text>
  <path d="M650,86 v6 h52 v-6" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="676" y="113" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">하나만</text>

  <!-- 1 다음에 2 -->
  <line x1="72" y1="128" x2="72" y2="151" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 규칙 2: 마이크로태스크 -->
  <rect x="24" y="156" width="832" height="128" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="72" cy="219" r="24" fill="#6d28d9"/>
  <text x="72" y="227" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="116" y="210" font-size="18" fill="#111827">매크로태스크가 끝나면 마이크로태스크 큐를 <tspan font-weight="bold" fill="#6d28d9">완전히 비운다</tspan></text>
  <text x="116" y="240" font-size="15" fill="#4b5563">(비우는 도중 추가된 마이크로태스크도 이번에 처리한다)</text>

  <rect x="648" y="180" width="56" height="40" rx="6" fill="#6d28d9"/>
  <text x="676" y="206" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">m1</text>
  <rect x="708" y="180" width="56" height="40" rx="6" fill="#6d28d9"/>
  <text x="736" y="206" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">m2</text>
  <rect x="768" y="180" width="56" height="40" rx="6" fill="#6d28d9"/>
  <text x="796" y="205" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">+추가</text>
  <path d="M650,226 v6 h172 v-6" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="736" y="257" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">전부</text>
</svg>
