<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">좋은 알림 체크리스트</title>
  <desc id="d">좋은 알림인지 확인하는 다섯 가지 질문: 즉각적인 조치가 필요한가, 무엇을 해야 하는지 명확한가, 고객에게 영향이 있는가, 자동화로 해결할 수 없는가, 중복 알림이 아닌가.</desc>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 카드 -->
  <rect x="160" y="24" width="560" height="346" rx="12" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <path d="M160,36 A12,12 0 0 1 172,24 L708,24 A12,12 0 0 1 720,36 L720,80 L160,80 Z" fill="#047857"/>
  <text x="440" y="59" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">좋은 알림 체크리스트</text>

  <!-- 행 구분선 -->
  <line x1="162" y1="138" x2="718" y2="138" stroke="#d1d5db" stroke-width="1"/>
  <line x1="162" y1="196" x2="718" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <line x1="162" y1="254" x2="718" y2="254" stroke="#d1d5db" stroke-width="1"/>
  <line x1="162" y1="312" x2="718" y2="312" stroke="#d1d5db" stroke-width="1"/>

  <!-- 1 -->
  <rect x="196" y="97" width="24" height="24" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <path d="M201,109 L206,115 L216,103" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="115" font-size="17" fill="#111827">즉각적인 조치가 필요한가?</text>

  <!-- 2 -->
  <rect x="196" y="155" width="24" height="24" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <path d="M201,167 L206,173 L216,161" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="173" font-size="17" fill="#111827">이 알림으로 뭘 해야 하는지 명확한가?</text>

  <!-- 3 -->
  <rect x="196" y="213" width="24" height="24" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <path d="M201,225 L206,231 L216,219" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="231" font-size="17" fill="#111827">고객에게 영향이 있는가?</text>

  <!-- 4 -->
  <rect x="196" y="271" width="24" height="24" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <path d="M201,283 L206,289 L216,277" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="289" font-size="17" fill="#111827">자동화로 해결할 수 없는가?</text>

  <!-- 5 -->
  <rect x="196" y="329" width="24" height="24" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <path d="M201,341 L206,347 L216,335" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="347" font-size="17" fill="#111827">중복 알림이 아닌가?</text>
</svg>
