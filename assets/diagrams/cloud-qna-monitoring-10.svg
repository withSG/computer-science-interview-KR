<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">좋은 알림 체크리스트</title>
  <desc id="d">좋은 알림의 조건을 확인하는 5가지 항목 체크리스트</desc>
  <rect width="880" height="350" fill="#ffffff"/>
  <rect x="140" y="40" width="600" height="270" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <path d="M 140,48 A 8,8 0 0,1 148,40 L 732,40 A 8,8 0 0,1 740,48 L 740,90 L 140,90 Z" fill="#ecfdf5"/>
  <line x1="140" y1="90" x2="740" y2="90" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="71" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">좋은 알림 체크리스트</text>
  <text x="180" y="125" font-size="13" fill="#1f2933">☑ 즉각적인 조치가 필요한가?</text>
  <text x="180" y="165" font-size="13" fill="#1f2933">☑ 이 알림으로 뭘 해야 하는지 명확한가?</text>
  <text x="180" y="205" font-size="13" fill="#1f2933">☑ 고객에게 영향이 있는가?</text>
  <text x="180" y="245" font-size="13" fill="#1f2933">☑ 자동화로 해결할 수 없는가?</text>
  <text x="180" y="285" font-size="13" fill="#1f2933">☑ 중복 알림이 아닌가?</text>
</svg>