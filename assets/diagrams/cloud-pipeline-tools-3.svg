<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Jenkins 컨트롤러와 에이전트</title>
  <desc id="d">Jenkins 컨트롤러는 웹 UI, 잡 스케줄링, 설정 보관, 플러그인 로드를 맡고 빌드는 직접 돌리지 않는다. 작업은 linux, macos, gpu 에이전트로 배분되며, 에이전트는 label로 골라 쓴다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 컨트롤러 -->
  <rect x="200" y="24" width="480" height="156" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="58" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Jenkins 컨트롤러</text>
  <text x="440" y="90" font-size="16" fill="#1f2937" text-anchor="middle">웹 UI · 잡 스케줄링 · 설정 보관</text>
  <text x="440" y="116" font-size="16" fill="#1f2937" text-anchor="middle">플러그인 로드</text>
  <rect x="224" y="132" width="432" height="34" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="440" y="154" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">(여기서 빌드를 직접 돌리면 안 된다)</text>

  <!-- 작업 배분 -->
  <path d="M440,180 V222 H200 V252" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M440,180 V222 H680 V252" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M440,180 V252" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="452" y="206" font-size="15" fill="#1d4ed8">작업 배분</text>

  <!-- 에이전트 -->
  <rect x="100" y="256" width="200" height="90" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="200" y="290" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">에이전트</text>
  <rect x="155" y="304" width="90" height="28" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="200" y="323" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">linux</text>

  <rect x="340" y="256" width="200" height="90" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="290" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">에이전트</text>
  <rect x="395" y="304" width="90" height="28" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="440" y="323" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">macos</text>

  <rect x="580" y="256" width="200" height="90" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5"/>
  <text x="680" y="290" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">에이전트</text>
  <rect x="635" y="304" width="90" height="28" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="680" y="323" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">gpu</text>

  <!-- label 선택 -->
  <path d="M100,360 V370 H780 V360 M440,370 V380" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="402" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">label로 골라 쓴다</text>
  <text x="440" y="426" font-size="15" fill="#4b5563" text-anchor="middle">예: <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">agent { label 'linux' }</tspan></text>
</svg>
