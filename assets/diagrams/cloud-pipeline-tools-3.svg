<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Jenkins의 구조</title>
  <desc id="d">Jenkins 컨트롤러에서 여러 에이전트(linux, macos, gpu)로 작업을 배분하는 구조 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 컨트롤러 영역 (가로 중심 340) -->
  <rect x="130" y="30" width="420" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="60.6" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Jenkins 컨트롤러</text>
  <text x="340" y="89.55" font-size="13" fill="#1f2933" text-anchor="middle">웹 UI · 잡 스케줄링 · 설정 보관</text>
  <text x="340" y="119.55" font-size="13" fill="#1f2933" text-anchor="middle">플러그인 로드</text>
  <text x="340" y="149.55" font-size="13" fill="#dc2626" text-anchor="middle">(여기서 빌드를 직접 돌리면 안 된다)</text>

  <!-- 화살표 및 라벨 -->
  <path d="M190,180 L190,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M340,180 L340,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M490,180 L490,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="525" y="200" width="70" height="20" fill="#ffffff"/>
  <text x="560" y="214.55" font-size="13" fill="#52606d" text-anchor="middle">작업 배분</text>

  <!-- 에이전트 1: linux -->
  <rect x="120" y="240" width="140" height="90" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="190" y="274.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">에이전트</text>
  <text x="190" y="304.55" font-size="13" fill="#52606d" text-anchor="middle">linux</text>

  <!-- 에이전트 2: macos -->
  <rect x="270" y="240" width="140" height="90" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="340" y="274.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">에이전트</text>
  <text x="340" y="304.55" font-size="13" fill="#52606d" text-anchor="middle">macos</text>

  <!-- 에이전트 3: gpu -->
  <rect x="420" y="240" width="140" height="90" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="490" y="274.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">에이전트</text>
  <text x="490" y="304.55" font-size="13" fill="#52606d" text-anchor="middle">gpu</text>

  <!-- 우측 주석 라벨 -->
  <text x="580" y="289.55" font-size="13" fill="#52606d" text-anchor="start">← label로 골라 쓴다</text>
</svg>