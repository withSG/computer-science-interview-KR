<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ROC-AUC와 PR-AUC</title>
  <desc id="d">ROC 곡선과 PR 곡선의 축, 곡선 형태, 무작위 선 및 x축 특성 설명을 비교하여 나타낸 다이어그램</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="390" fill="#ffffff"/>

  <!-- 좌측: ROC 곡선 영역 (x: 40 ~ 420) -->
  <!-- ROC 제목 및 y축 라벨 -->
  <text x="230" y="36" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">ROC 곡선</text>
  <text x="230" y="58" fill="#52606d" font-size="13" text-anchor="middle">TPR(=재현율)</text>

  <!-- ROC 무작위 대각선 (점선) -->
  <line x1="100" y1="210" x2="360" y2="70" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="235" y="154" fill="#52606d" font-size="11.5" text-anchor="start">(대각선 = 무작위)</text>

  <!-- ROC 곡선 -->
  <path d="M 100 210 Q 110 120, 180 90 T 360 70" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- ROC 축 (y축, x축) -->
  <line x1="100" y1="70" x2="100" y2="210" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <line x1="100" y1="210" x2="380" y2="210" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <!-- ROC 눈금 및 라벨 -->
  <text x="88" y="74" fill="#1f2933" font-size="13" text-anchor="end">1</text>
  <text x="88" y="214" fill="#1f2933" font-size="13" text-anchor="end">0</text>
  <text x="100" y="230" fill="#1f2933" font-size="13" text-anchor="middle">0</text>
  <text x="360" y="230" fill="#1f2933" font-size="13" text-anchor="middle">1</text>
  <text x="390" y="214" fill="#1f2933" font-size="13" text-anchor="start">FPR</text>

  <!-- ROC 하단 설명 카드 -->
  <rect x="70" y="255" width="320" height="100" rx="6" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="90" y="289" fill="#1f2933" font-size="13" font-weight="bold">x축: FPR = FP / (FP + TN)</text>
  <text x="90" y="324" fill="#2563eb" font-size="13">분모에 TN이 들어간다</text>

  <!-- 중앙 구분선 -->
  <line x1="440" y1="30" x2="440" y2="360" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 우측: PR 곡선 영역 (x: 460 ~ 840) -->
  <!-- PR 제목 및 y축 라벨 -->
  <text x="650" y="36" fill="#1f2933" font-size="16" font-weight="bold" text-anchor="middle">PR 곡선</text>
  <text x="650" y="58" fill="#52606d" font-size="13" text-anchor="middle">Precision</text>

  <!-- PR 곡선 -->
  <path d="M 520 70 C 530 110, 600 130, 780 210" fill="none" stroke="#059669" stroke-width="2.5"/>

  <!-- PR 축 (y축, x축) -->
  <line x1="520" y1="70" x2="520" y2="210" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <line x1="520" y1="210" x2="800" y2="210" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>

  <!-- PR 눈금 및 라벨 -->
  <text x="508" y="74" fill="#1f2933" font-size="13" text-anchor="end">1</text>
  <text x="508" y="214" fill="#1f2933" font-size="13" text-anchor="end">0</text>
  <text x="520" y="230" fill="#1f2933" font-size="13" text-anchor="middle">0</text>
  <text x="780" y="230" fill="#1f2933" font-size="13" text-anchor="middle">1</text>
  <text x="810" y="214" fill="#1f2933" font-size="13" text-anchor="start">Recall</text>

  <!-- PR 하단 설명 카드 -->
  <rect x="490" y="255" width="320" height="100" rx="6" fill="#ecfdf5" stroke="#cbd2d9" stroke-width="1"/>
  <text x="510" y="289" fill="#1f2933" font-size="13" font-weight="bold">x축: Recall = TP / (TP + FN)</text>
  <text x="510" y="324" fill="#059669" font-size="13">두 축 모두 TN이 등장하지 않는다</text>
</svg>