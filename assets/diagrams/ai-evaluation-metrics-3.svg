<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ROC 곡선과 PR 곡선의 축 비교</title>
  <desc id="d">왼쪽 ROC 곡선은 TPR(=재현율)과 FPR을 축으로 쓰고 대각선이 무작위 모델이며, x축 FPR = FP / (FP + TN)의 분모에 TN이 들어간다. 오른쪽 PR 곡선은 Precision과 Recall을 축으로 쓰며 두 축 모두 TN이 등장하지 않는다. 각 곡선 아래 면적이 ROC-AUC, PR-AUC다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 가운데 구분선 -->
  <line x1="440" y1="24" x2="440" y2="556" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ===== 왼쪽: ROC 곡선 ===== -->
  <text x="228" y="40" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">ROC 곡선</text>
  <text x="228" y="66" font-size="15" fill="#4b5563" text-anchor="middle">곡선 아래 면적 = ROC-AUC</text>

  <!-- 곡선 아래 면적 -->
  <path d="M112,342 C122,200 190,130 372,122 L372,342 Z" fill="#dbeafe"/>
  <!-- 값 1 경계(단위 정사각형) -->
  <line x1="112" y1="122" x2="372" y2="122" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="372" y1="122" x2="372" y2="342" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- 무작위 대각선 -->
  <line x1="112" y1="342" x2="372" y2="122" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="236" y="296" font-size="15" fill="#374151">(대각선 = 무작위)</text>
  <!-- ROC 곡선 -->
  <path d="M112,342 C122,200 190,130 372,122" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <!-- 축 -->
  <line x1="112" y1="342" x2="112" y2="114" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="112" y1="342" x2="394" y2="342" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="106" y1="122" x2="112" y2="122" stroke="#374151" stroke-width="1.5"/>
  <line x1="372" y1="342" x2="372" y2="348" stroke="#374151" stroke-width="1.5"/>
  <text x="100" y="96" font-size="15" font-weight="bold" fill="#1f2937">TPR(=재현율)</text>
  <text x="100" y="127" font-size="15" fill="#1f2937" text-anchor="end">1</text>
  <text x="100" y="347" font-size="15" fill="#1f2937" text-anchor="end">0</text>
  <text x="112" y="366" font-size="15" fill="#1f2937" text-anchor="middle">0</text>
  <text x="372" y="366" font-size="15" fill="#1f2937" text-anchor="middle">1</text>
  <text x="242" y="392" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">FPR</text>

  <!-- ROC 축 공식 카드 -->
  <rect x="40" y="414" width="376" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="446" font-size="16" fill="#1f2937"><tspan font-weight="bold">y축</tspan>  TPR = TP / (TP + FN)</text>
  <text x="60" y="476" font-size="16" fill="#1f2937"><tspan font-weight="bold">x축</tspan>  FPR = FP / (FP + <tspan font-weight="bold" fill="#b91c1c">TN</tspan>)</text>
  <rect x="54" y="494" width="348" height="46" rx="6" fill="#fef2f2"/>
  <text x="228" y="523" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">분모에 TN이 들어간다</text>

  <!-- ===== 오른쪽: PR 곡선 ===== -->
  <text x="652" y="40" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">PR 곡선</text>
  <text x="652" y="66" font-size="15" fill="#4b5563" text-anchor="middle">곡선 아래 면적 = PR-AUC</text>

  <!-- 곡선 아래 면적 -->
  <path d="M536,122 C600,128 700,190 796,300 L796,342 L536,342 Z" fill="#d1fae5"/>
  <line x1="536" y1="122" x2="796" y2="122" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="796" y1="122" x2="796" y2="342" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- PR 곡선 -->
  <path d="M536,122 C600,128 700,190 796,300" fill="none" stroke="#047857" stroke-width="3"/>

  <!-- 축 -->
  <line x1="536" y1="342" x2="536" y2="114" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="536" y1="342" x2="818" y2="342" stroke="#374151" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="530" y1="122" x2="536" y2="122" stroke="#374151" stroke-width="1.5"/>
  <line x1="796" y1="342" x2="796" y2="348" stroke="#374151" stroke-width="1.5"/>
  <text x="524" y="96" font-size="15" font-weight="bold" fill="#1f2937">Precision</text>
  <text x="524" y="127" font-size="15" fill="#1f2937" text-anchor="end">1</text>
  <text x="524" y="347" font-size="15" fill="#1f2937" text-anchor="end">0</text>
  <text x="536" y="366" font-size="15" fill="#1f2937" text-anchor="middle">0</text>
  <text x="796" y="366" font-size="15" fill="#1f2937" text-anchor="middle">1</text>
  <text x="666" y="392" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Recall</text>

  <!-- PR 축 공식 카드 -->
  <rect x="464" y="414" width="376" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="484" y="446" font-size="16" fill="#1f2937"><tspan font-weight="bold">y축</tspan>  Precision = TP / (TP + FP)</text>
  <text x="484" y="476" font-size="16" fill="#1f2937"><tspan font-weight="bold">x축</tspan>  Recall = TP / (TP + FN)</text>
  <rect x="478" y="494" width="348" height="46" rx="6" fill="#ecfdf5"/>
  <text x="652" y="523" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">두 축 모두 TN이 등장하지 않는다</text>
</svg>
