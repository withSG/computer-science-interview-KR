<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대칭키 암호화</title>
  <desc id="d">송신자가 데이터를 암호화해 수신자에게 보내고, 복호화에도 같은 키를 사용한다.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- 참여자 -->
  <rect x="60" y="40" width="160" height="240" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="140" y="167" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">송신자</text>
  <rect x="660" y="40" width="160" height="240" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="740" y="167" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">수신자</text>

  <!-- ① 암호화 -->
  <text x="440" y="96" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">① 암호화</text>
  <path d="M232,110 L646,110" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="440" y="136" font-size="15" fill="#4b5563" text-anchor="middle">데이터</text>

  <!-- 같은 키 -->
  <rect x="370" y="154" width="140" height="38" rx="19" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="179" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">같은 키 사용</text>

  <!-- ② 복호화 -->
  <text x="440" y="222" font-size="18" font-weight="bold" fill="#6d28d9" text-anchor="middle">② 복호화</text>
  <path d="M648,236 L234,236" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#ap)"/>
</svg>
