<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">대칭키 암호화</title>
  <desc id="d">송신자와 수신자가 같은 키를 사용하여 데이터를 암호화하고 복호화하는 과정을 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="280" fill="#ffffff"/>

  <!-- 주역 구역 영역 (송신자 / 수신자 박스) -->
  <rect x="180" y="30" width="160" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="260" y="57" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">송신자</text>

  <rect x="540" y="30" width="160" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="620" y="57" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">수신자</text>

  <!-- 세로 수직선 (라이프라인) -->
  <path d="M260,74 L260,240" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M620,74 L620,240" stroke="#cbd2d9" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- 상단 화살표: 송신자 -> 수신자 (암호화) -->
  <path d="M260,120 L620,120" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  
  <!-- 상단 화살표 라벨 및 설명 -->
  <rect x="388" y="106" width="104" height="28" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="440" y="124" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">암호화</text>
  
  <rect x="410" y="139" width="60" height="22" rx="3" fill="#ffffff"/>
  <text x="440" y="154" font-size="12" fill="#52606d" text-anchor="middle">데이터</text>

  <rect x="635" y="108" width="105" height="24" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="687" y="124" font-size="11.5" font-weight="bold" fill="#d97706" text-anchor="middle">(같은 키 사용)</text>

  <!-- 하단 화살표: 수신자 -> 송신자 (복호화) -->
  <path d="M620,195 L260,195" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>
  
  <!-- 하단 화살표 라벨 -->
  <rect x="388" y="181" width="104" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="440" y="199" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">복호화</text>
</svg>