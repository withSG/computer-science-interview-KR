<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">양방향과 연관관계 주인</title>
  <desc id="d">객체 세계의 2개 참조와 DB 세계의 1개 외래키 매핑 관계를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="370" fill="#ffffff"/>

  <!-- 메인 구역 구분 (왼쪽: 객체 세계, 오른쪽: DB 세계) -->
  <!-- 1. 객체 세계 (왼쪽 영역) -->
  <text x="30" y="44.9" font-size="14" font-weight="bold" fill="#1f2933">객체 세계 (참조 2개)</text>

  <!-- Member 박스 -->
  <rect x="30" y="70" width="130" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="104.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Member</text>

  <!-- Team 박스 -->
  <rect x="270" y="70" width="130" height="60" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="335" y="104.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Team</text>

  <!-- team 화살표 (Member -> Team) -->
  <path d="M160,85 L270,85" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="200" y="73" width="30" height="16" fill="#ffffff"/>
  <text x="215" y="85.025" font-size="11.5" fill="#2563eb" text-anchor="middle">team</text>

  <!-- members 화살표 (Team -> Member) -->
  <path d="M270,115 L160,115" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="190" y="107" width="50" height="16" fill="#ffffff"/>
  <text x="215" y="119.025" font-size="11.5" fill="#7c3aed" text-anchor="middle">members</text>

  <!-- 객체 설명 텍스트 -->
  <text x="30" y="174.025" font-size="11.5" fill="#52606d">관계를 바꿀 수 있는 지점이 2개</text>


  <!-- 2. DB 세계 (오른쪽 영역) -->
  <text x="450" y="44.9" font-size="14" font-weight="bold" fill="#1f2933">DB 세계 (외래키 1개)</text>
  <text x="450" y="74.025" font-size="11.5" font-weight="bold" fill="#52606d">member 테이블</text>

  <!-- 테이블 헤더 -->
  <rect x="450" y="85" width="60" height="25" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="480" y="101.55" font-size="13" fill="#1f2933" text-anchor="middle">id</text>

  <rect x="510" y="85" width="80" height="25" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="550" y="101.55" font-size="13" fill="#1f2933" text-anchor="middle">name</text>

  <rect x="590" y="85" width="90" height="25" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="635" y="101.55" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">team_id</text>

  <!-- 테이블 데이터 행 -->
  <rect x="450" y="110" width="60" height="25" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="480" y="126.55" font-size="13" fill="#1f2933" text-anchor="middle">1</text>

  <rect x="510" y="110" width="80" height="25" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="550" y="126.55" font-size="13" fill="#1f2933" text-anchor="middle">김</text>

  <rect x="590" y="110" width="90" height="25" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="635" y="126.55" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">10</text>

  <!-- FK 설명 화살표 및 텍스트 -->
  <path d="M700,122.5 L685,122.5" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="708" y="126.55" font-size="13" fill="#d97706">FK는 이 컬럼 하나뿐</text>

  <!-- DB 설명 텍스트 -->
  <text x="450" y="174.025" font-size="11.5" fill="#52606d">team 테이블에는 member를 가리키는</text>
  <text x="450" y="194.025" font-size="11.5" fill="#52606d">컬럼이 아예 없다. 수정 지점은 1개.</text>
</svg>