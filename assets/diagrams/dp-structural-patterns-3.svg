<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">퍼사드 패턴 비교</title>
  <desc id="d">퍼사드가 없을 때 클라이언트가 여러 하위 시스템 클래스에 직접 의존하는 구조와, 퍼사드(JdbcTemplate)를 통해 간단히 호출하는 구조를 비교하는 다이어그램</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Left Container: 퍼사드 없이 -->
  <rect x="24" y="24" width="400" height="392" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="224" y="58" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[퍼사드 없이]</text>

  <!-- Left: Client -->
  <rect x="60" y="84" width="130" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="125" y="108" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트</text>

  <!-- Left: Direct Dependency Tree Lines & Nodes -->
  <path d="M125,124 L125,304" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  
  <!-- Branch 1: DataSource -->
  <path d="M125,160 L185,160" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="185" y="145" width="180" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="275" y="164" font-size="13" fill="#1f2933" text-anchor="middle">DataSource</text>

  <!-- Branch 2: Connection -->
  <path d="M125,196 L185,196" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="185" y="181" width="180" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="275" y="200" font-size="13" fill="#1f2933" text-anchor="middle">Connection</text>

  <!-- Branch 3: PreparedStatement -->
  <path d="M125,232 L185,232" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="185" y="217" width="180" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="275" y="236" font-size="13" fill="#1f2933" text-anchor="middle">PreparedStatement</text>

  <!-- Branch 4: ResultSet -->
  <path d="M125,268 L185,268" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="185" y="253" width="180" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="275" y="272" font-size="13" fill="#1f2933" text-anchor="middle">ResultSet</text>

  <!-- Branch 5: SQLException 변환 -->
  <path d="M125,304 L185,304" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  <rect x="185" y="289" width="180" height="30" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="275" y="308" font-size="13" fill="#1f2933" text-anchor="middle">SQLException 변환</text>

  <!-- Left: Annotation Footnote -->
  <text x="224" y="370" font-size="13" fill="#dc2626" font-weight="bold" text-anchor="middle">순서와 정리 책임을 전부 안다</text>


  <!-- Right Container: 퍼사드 -->
  <rect x="456" y="24" width="400" height="392" rx="8" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <text x="656" y="58" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[퍼사드]</text>

  <!-- Right: Client -->
  <rect x="591" y="84" width="130" height="40" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="656" y="108" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">클라이언트</text>

  <!-- Arrow: Client -> Facade -->
  <path d="M656,124 L656,160" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Right: Facade (JdbcTemplate) -->
  <rect x="566" y="160" width="180" height="44" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="656" y="186" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">JdbcTemplate</text>

  <!-- Arrow bus from Facade to Subsystem -->
  <path d="M656,204 L656,236" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <path d="M511,236 L801,236" stroke="#2563eb" stroke-width="1.5" fill="none"/>

  <!-- Arrow 1: DataSource -->
  <path d="M511,236 L511,270" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="471" y="270" width="80" height="48" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="511" y="298" font-size="11.5" fill="#1f2933" text-anchor="middle">DataSource</text>

  <!-- Arrow 2: PS -->
  <path d="M608,236 L608,270" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="578" y="270" width="60" height="48" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="608" y="298" font-size="11.5" fill="#1f2933" text-anchor="middle">PS</text>

  <!-- Arrow 3: ResultSet -->
  <path d="M704,236 L704,270" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="664" y="270" width="80" height="48" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="704" y="298" font-size="11.5" fill="#1f2933" text-anchor="middle">ResultSet</text>

  <!-- Arrow 4: 예외 변환 -->
  <path d="M801,236 L801,270" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="756" y="270" width="90" height="48" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="801" y="298" font-size="11.5" fill="#1f2933" text-anchor="middle">예외 변환</text>
</svg>