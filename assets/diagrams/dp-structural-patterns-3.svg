<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">퍼사드 없이와 퍼사드 비교</title>
  <desc id="d">퍼사드가 없으면 클라이언트가 DataSource, Connection, PreparedStatement, ResultSet, SQLException 변환을 직접 다루며 순서와 정리 책임을 전부 안다. 퍼사드가 있으면 클라이언트는 JdbcTemplate만 부르고, JdbcTemplate이 DataSource, PreparedStatement, ResultSet, 예외 변환을 다룬다.</desc>
  <rect width="880" height="590" fill="#ffffff"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ─────────── 퍼사드 없이 ─────────── -->
  <rect x="24" y="24" width="832" height="226" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="44" y="54" font-size="18" font-weight="700" fill="#b91c1c">퍼사드 없이</text>

  <rect x="375" y="74" width="130" height="40" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="100" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">클라이언트</text>
  <text x="522" y="100" font-size="16" font-weight="700" fill="#b91c1c">← 순서와 정리 책임을 전부 안다</text>

  <g stroke="#374151" stroke-width="1.5" fill="none">
    <path d="M440,114 V148"/>
    <path d="M100,148 H752"/>
    <path d="M100,148 V180" marker-end="url(#ah)"/>
    <path d="M242,148 V180" marker-end="url(#ah)"/>
    <path d="M412,148 V180" marker-end="url(#ah)"/>
    <path d="M582,148 V180" marker-end="url(#ah)"/>
    <path d="M752,148 V180" marker-end="url(#ah)"/>
  </g>

  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.5">
    <rect x="44" y="184" width="112" height="42" rx="6"/>
    <rect x="186" y="184" width="112" height="42" rx="6"/>
    <rect x="328" y="184" width="168" height="42" rx="6"/>
    <rect x="526" y="184" width="112" height="42" rx="6"/>
    <rect x="668" y="184" width="168" height="42" rx="6"/>
  </g>
  <g font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="100" y="210">DataSource</text>
    <text x="242" y="210">Connection</text>
    <text x="412" y="210">PreparedStatement</text>
    <text x="582" y="210">ResultSet</text>
  </g>
  <text x="752" y="210" font-size="15" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SQLException</tspan> 변환</text>

  <!-- ─────────── 퍼사드 ─────────── -->
  <rect x="24" y="270" width="832" height="296" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="44" y="300" font-size="18" font-weight="700" fill="#1d4ed8">퍼사드</text>

  <rect x="375" y="320" width="130" height="40" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="440" y="346" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">클라이언트</text>
  <path d="M440,360 V394" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="350" y="398" width="180" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="427" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">JdbcTemplate</text>
  <text x="548" y="427" font-size="16" font-weight="700" fill="#1d4ed8">← 절차 전체를 감춘다</text>

  <g stroke="#374151" stroke-width="1.5" fill="none">
    <path d="M440,444 V470"/>
    <path d="M202,470 H678"/>
    <path d="M202,470 V500" marker-end="url(#ah)"/>
    <path d="M370,470 V500" marker-end="url(#ah)"/>
    <path d="M538,470 V500" marker-end="url(#ah)"/>
    <path d="M678,470 V500" marker-end="url(#ah)"/>
  </g>

  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.5">
    <rect x="146" y="504" width="112" height="42" rx="6"/>
    <rect x="286" y="504" width="168" height="42" rx="6"/>
    <rect x="482" y="504" width="112" height="42" rx="6"/>
    <rect x="622" y="504" width="112" height="42" rx="6"/>
  </g>
  <g font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="202" y="530">DataSource</text>
    <text x="370" y="530">PreparedStatement</text>
    <text x="538" y="530">ResultSet</text>
  </g>
  <text x="678" y="530" font-size="15" fill="#111827" text-anchor="middle">예외 변환</text>
</svg>
