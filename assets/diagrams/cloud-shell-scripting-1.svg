<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">set -euo pipefail — 기본값 바꾸기</title>
  <desc id="d">set -e가 없을 때와 있을 때의 명령 실행 흐름 비교 다이어그램</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Left Container (set -e 없음) -->
  <g id="left-group">
    <!-- Group Title -->
    <text x="240" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">set -e 없음</text>

    <!-- Outer Frame for Left Block -->
    <rect x="60" y="60" width="360" height="230" rx="6" ry="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>

    <!-- Row 1: cd -->
    <rect x="70" y="70" width="340" height="60" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="90" y="105" font-size="14" font-weight="bold" fill="#1f2933">cd</text>
    <text x="380" y="105" font-size="14" font-weight="bold" fill="#059669" text-anchor="end">✓</text>

    <!-- Row 2: tar -->
    <rect x="70" y="140" width="340" height="60" rx="4" ry="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="90" y="175" font-size="14" font-weight="bold" fill="#1f2933">tar</text>
    <text x="380" y="175" font-size="14" fill="#dc2626" font-weight="bold" text-anchor="end">✗ 실패</text>

    <!-- Row 3: rm -rf -->
    <rect x="70" y="210" width="340" height="60" rx="4" ry="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="90" y="245" font-size="14" font-weight="bold" fill="#1f2933">rm -rf</text>
    <text x="380" y="245" font-size="14" fill="#dc2626" font-weight="bold" text-anchor="end">✓ 실행됨 (사고)</text>
  </g>

  <!-- Right Container (set -e 있음) -->
  <g id="right-group">
    <!-- Group Title -->
    <text x="640" y="44" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">set -e 있음</text>

    <!-- Outer Frame for Right Block -->
    <rect x="460" y="60" width="360" height="160" rx="6" ry="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>

    <!-- Row 1: cd -->
    <rect x="470" y="70" width="340" height="60" rx="4" ry="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="490" y="105" font-size="14" font-weight="bold" fill="#1f2933">cd</text>
    <text x="780" y="105" font-size="14" font-weight="bold" fill="#059669" text-anchor="end">✓</text>

    <!-- Row 2: tar -->
    <rect x="470" y="140" width="340" height="60" rx="4" ry="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="490" y="175" font-size="14" font-weight="bold" fill="#1f2933">tar</text>
    <text x="780" y="175" font-size="14" fill="#dc2626" font-weight="bold" text-anchor="end">✗ 실패</text>

    <!-- Exit Annotation below box -->
    <text x="640" y="250" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">즉시 종료, exit 1</text>
  </g>
</svg>