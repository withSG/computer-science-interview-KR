<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ADD 결과 R1을 SUB가 먼저 읽으려는 데이터 해저드</title>
  <desc id="d">ADD R1, R2, R3 다음에 SUB R4, R1, R5가 오면, SUB는 3사이클에 R1을 읽어야 하지만 ADD는 5사이클 WB에서야 R1을 기록하므로 아직 값이 없다.</desc>
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  </defs>
  <rect width="880" height="390" fill="#ffffff"/>
  <rect x="24" y="24" width="832" height="100" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
  <text x="48" y="64" font-size="19" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="700">ADD</tspan> <tspan fill="#1d4ed8" font-weight="700">R1</tspan><tspan>, R2, R3</tspan></text>
  <text x="236" y="64" font-size="17" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">; R1 = R2 + R3</text>
  <text x="48" y="102" font-size="19" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace"><tspan font-weight="700">SUB</tspan> <tspan>R4, </tspan><tspan fill="#b91c1c" font-weight="700">R1</tspan><tspan>, R5</tspan></text>
  <text x="236" y="102" font-size="17" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">; R4 = R1 - R5</text>
  <text x="420" y="102" font-size="16" font-weight="700" fill="#b91c1c">← R1이 필요하다</text>
  <text x="48" y="168" font-size="15" fill="#4b5563">사이클</text>
  <text x="144" y="168" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">1</text>
  <text x="224" y="168" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">2</text>
  <text x="304" y="168" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">3</text>
  <text x="384" y="168" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">4</text>
  <text x="464" y="168" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">5</text>
  <text x="544" y="168" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">6</text>
  <line x1="104" y1="178" x2="584" y2="178" stroke="#d1d5db" stroke-width="1"/>
  <text x="48" y="217" font-size="18" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ADD</text>
  <rect x="109" y="190" width="70" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="144" y="216" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">IF</text>
  <rect x="189" y="190" width="70" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="224" y="216" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">ID</text>
  <rect x="269" y="190" width="70" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="304" y="216" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">EX</text>
  <rect x="349" y="190" width="70" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="384" y="216" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">MEM</text>
  <rect x="429" y="190" width="70" height="40" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/>
  <text x="464" y="216" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">WB</text>
  <text x="48" y="271" font-size="18" font-weight="700" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SUB</text>
  <rect x="189" y="244" width="70" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="224" y="270" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">IF</text>
  <rect x="269" y="244" width="70" height="40" rx="6" fill="#b91c1c" stroke="#b91c1c" stroke-width="2"/>
  <text x="304" y="270" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ID</text>
  <rect x="349" y="244" width="70" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="384" y="270" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">EX</text>
  <rect x="429" y="244" width="70" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="464" y="270" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">MEM</text>
  <rect x="509" y="244" width="70" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="544" y="270" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">WB</text>
  <line x1="596" y1="210" x2="505" y2="210" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="606" y="216" font-size="16" font-weight="700" fill="#1d4ed8">R1은 5사이클 WB에서야 기록됨</text>
  <line x1="304" y1="334" x2="304" y2="290" stroke="#b91c1c" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="304" y="360" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">3사이클에 R1을 읽어야 하는데 아직 없다</text>
</svg>
