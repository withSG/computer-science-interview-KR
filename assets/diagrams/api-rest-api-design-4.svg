<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">401 vs 403</title>
  <desc id="d">401 Unauthorized와 403 Forbidden 상태 코드의 의미, 원인, 그리고 클라이언트가 할 일을 비교하는 다이어그램입니다.</desc>
  <rect width="880" height="370" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 401 Unauthorized Block -->
  <rect x="24" y="24" width="832" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  
  <!-- 401 Status Tag -->
  <rect x="44" y="44" width="180" height="36" rx="4" fill="#2563eb"/>
  <text x="134" y="66" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">401 Unauthorized</text>

  <!-- Arrow 1 -->
  <path d="M234,62 L266,62" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- 401 Quote -->
  <text x="280" y="66" font-size="16" font-weight="bold" fill="#1f2933">"당신이 누군지 모르겠습니다"</text>

  <!-- 401 Causes -->
  <text x="280" y="98" font-size="13" fill="#52606d">토큰 없음 / 만료 / 위조</text>

  <!-- Arrow 2 -->
  <path d="M234,130 L266,130" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- 401 Action -->
  <text x="280" y="134" font-size="13" font-weight="bold" fill="#2563eb">클라이언트가 할 일: 로그인, 토큰 갱신</text>


  <!-- 403 Forbidden Block -->
  <rect x="24" y="196" width="832" height="150" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- 403 Status Tag -->
  <rect x="44" y="216" width="180" height="36" rx="4" fill="#7c3aed"/>
  <text x="134" y="238" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">403 Forbidden</text>

  <!-- Arrow 3 -->
  <path d="M234,234 L266,234" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- 403 Quote -->
  <text x="280" y="238" font-size="16" font-weight="bold" fill="#1f2933">"당신이 누군진 알겠는데, 그건 안 됩니다"</text>

  <!-- 403 Causes -->
  <text x="280" y="270" font-size="13" fill="#52606d">일반 회원이 관리자 API 호출</text>

  <!-- Arrow 4 -->
  <path d="M234,302 L266,302" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>

  <!-- 403 Action -->
  <text x="280" y="306" font-size="13" font-weight="bold" fill="#7c3aed">클라이언트가 할 일: 없음. 다시 로그인해도 소용없다</text>
</svg>