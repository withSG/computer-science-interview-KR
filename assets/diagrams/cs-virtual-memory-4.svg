<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 748" width="880" height="748" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">페이지 폴트 처리 단계</title>
  <desc id="d">Valid 비트가 0인 페이지에 접근하면 하드웨어 트랩, 커널의 정당성 검사와 빈 프레임 확보, 디스크 읽기, 페이지 테이블 갱신을 거쳐 폴트가 난 명령어를 처음부터 재실행한다. 잘못된 접근은 SIGSEGV로 종료되고, 디스크 읽기가 가장 느린 단계다.</desc>
  <rect width="880" height="748" fill="#ffffff"/>

  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 본선 화살표 -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M338,88 V112" marker-end="url(#ink)"/>
    <path d="M338,164 V188" marker-end="url(#ink)"/>
    <path d="M338,240 V306" marker-end="url(#ink)"/>
    <path d="M338,358 V488" marker-end="url(#ink)"/>
    <path d="M338,540 V564" marker-end="url(#ink)"/>
    <path d="M338,632 V656" marker-end="url(#ink)"/>
  </g>
  <text x="352" y="279" font-size="15" font-weight="bold" fill="#047857">정당하면 계속</text>

  <!-- 1 CPU -->
  <circle cx="40" cy="56" r="14" fill="#374151"/>
  <text x="40" y="61" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="64" y="42" width="84" height="28" rx="14" fill="#dbeafe"/>
  <text x="106" y="61" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">CPU</text>
  <rect x="160" y="24" width="356" height="64" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="176" y="51" font-size="16" fill="#111827">CPU가 가상 주소 접근</text>
  <text x="176" y="75" font-size="16" fill="#111827">페이지 테이블에서 <tspan font-weight="bold">Valid 비트 = 0</tspan> 확인</text>

  <!-- 2 하드웨어 -->
  <circle cx="40" cy="140" r="14" fill="#374151"/>
  <text x="40" y="145" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="64" y="126" width="84" height="28" rx="14" fill="#ccfbf1"/>
  <text x="106" y="145" font-size="14" font-weight="bold" fill="#115e59" text-anchor="middle">하드웨어</text>
  <rect x="160" y="116" width="356" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="176" y="146" font-size="16" fill="#111827">페이지 폴트 트랩 발생 → 커널 모드 진입</text>

  <!-- 3 커널: 정당성 검사 -->
  <circle cx="40" cy="216" r="14" fill="#374151"/>
  <text x="40" y="221" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="64" y="202" width="84" height="28" rx="14" fill="#e5e7eb"/>
  <text x="106" y="221" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">커널</text>
  <rect x="160" y="192" width="356" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="176" y="222" font-size="16" fill="#111827">접근이 정당한지 검사</text>

  <!-- 3 → 종료 분기 -->
  <path d="M516,216 H560" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#red)"/>
  <rect x="564" y="184" width="292" height="64" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="580" y="209" font-size="15" fill="#111827">잘못된 주소 / 권한 위반이면</text>
  <text x="580" y="233" font-size="15" font-weight="bold" fill="#b91c1c">→ 프로세스 종료 (SIGSEGV)</text>

  <!-- 4 커널: 빈 프레임 확보 -->
  <circle cx="40" cy="334" r="14" fill="#374151"/>
  <text x="40" y="339" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="64" y="320" width="84" height="28" rx="14" fill="#e5e7eb"/>
  <text x="106" y="339" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">커널</text>
  <rect x="160" y="310" width="356" height="48" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="176" y="340" font-size="16" fill="#111827">빈 프레임 확보</text>

  <!-- 4 의 갈래 -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M516,334 H540 M540,300 V368"/>
    <path d="M540,300 H560" marker-end="url(#ink)"/>
    <path d="M540,368 H560" marker-end="url(#ink)"/>
    <path d="M584,396 V440 H600" marker-end="url(#ink)"/>
  </g>
  <rect x="564" y="272" width="292" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="580" y="295" font-size="15" font-weight="bold" fill="#111827">여유 있으면</text>
  <text x="580" y="317" font-size="15" fill="#111827">→ 그대로 사용</text>
  <rect x="564" y="340" width="292" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="580" y="363" font-size="15" font-weight="bold" fill="#111827">없으면</text>
  <text x="580" y="385" font-size="15" fill="#111827">→ 교체 알고리즘으로 희생 페이지 선택</text>
  <rect x="604" y="412" width="252" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="620" y="435" font-size="15" font-weight="bold" fill="#111827">Dirty면</text>
  <text x="620" y="457" font-size="15" fill="#111827">→ 디스크에 기록 후 회수</text>

  <!-- 5 디스크 (가장 느림) -->
  <circle cx="40" cy="516" r="14" fill="#374151"/>
  <text x="40" y="521" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="64" y="502" width="84" height="28" rx="14" fill="#ede9fe"/>
  <text x="106" y="521" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">디스크</text>
  <rect x="160" y="492" width="356" height="48" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/>
  <text x="176" y="522" font-size="16" fill="#111827">필요한 페이지를 프레임으로 읽어 온다</text>
  <path d="M572,516 H522" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#amber)"/>
  <text x="580" y="522" font-size="17" font-weight="bold" fill="#b45309">여기가 가장 느리다</text>

  <!-- 6 커널: 페이지 테이블 갱신 -->
  <circle cx="40" cy="600" r="14" fill="#374151"/>
  <text x="40" y="605" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="64" y="586" width="84" height="28" rx="14" fill="#e5e7eb"/>
  <text x="106" y="605" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">커널</text>
  <rect x="160" y="568" width="356" height="64" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="176" y="595" font-size="16" fill="#111827">페이지 테이블 갱신</text>
  <text x="176" y="619" font-size="16" fill="#111827">(Valid=1, 프레임 번호 기록)</text>

  <!-- 7 재실행 -->
  <circle cx="40" cy="692" r="14" fill="#374151"/>
  <text x="40" y="697" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="160" y="660" width="356" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="176" y="687" font-size="16" fill="#111827">프로세스를 Ready로 되돌리고,</text>
  <text x="176" y="711" font-size="16" fill="#111827">폴트가 났던 명령어를 <tspan font-weight="bold" fill="#047857">처음부터 재실행</tspan></text>
</svg>
