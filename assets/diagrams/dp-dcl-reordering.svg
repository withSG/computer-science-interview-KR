<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 724" width="880" height="724" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">volatile 없는 DCL의 재배치 문제</title>
  <desc id="d">volatile이 없으면 스레드 A의 객체 생성이 ① 힙 메모리 할당, ③ instance 대입, ② 생성자 실행 순서로 재배치될 수 있다. ③과 ② 사이 위험 구간에 스레드 B가 1차 검사에서 instance != null을 보고 락 없이 반환받아, 커넥션 0개인 미완성 객체를 그대로 사용한다.</desc>
  <rect width="880" height="724" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 위험 구간 띠 (T2 ~ T3) -->
  <rect x="24" y="226" width="832" height="240" fill="#fef2f2"/>

  <!-- 시간축 -->
  <text x="72" y="58" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">시간</text>
  <path d="M72,72 V616" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- 레인 머리 -->
  <rect x="132" y="24" width="232" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="248" y="50" font-size="17" font-weight="bold" text-anchor="middle" fill="#1e3a8a">스레드 A</text>
  <text x="248" y="72" font-size="15" text-anchor="middle" fill="#1e40af">(객체 생성 중)</text>
  <rect x="376" y="24" width="232" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="492" y="50" font-size="17" font-weight="bold" text-anchor="middle" fill="#4c1d95">스레드 B</text>
  <text x="492" y="72" font-size="15" text-anchor="middle" fill="#5b21b6">(getInstance 호출)</text>
  <rect x="620" y="24" width="236" height="60" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="738" y="50" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">힙 객체 상태</text>
  <text x="738" y="72" font-size="15" text-anchor="middle" fill="#374151">(ConnectionPool)</text>

  <!-- 생명선 -->
  <path d="M248,84 V620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
  <path d="M492,84 V620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>

  <!-- 스레드 A 진행 화살표 -->
  <path d="M248,216 V229" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>
  <path d="M248,304 V475" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#ah-blue)"/>

  <!-- 시각 표시 -->
  <rect x="36" y="110" width="72" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="129" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">T1 이전</text>
  <rect x="36" y="176" width="72" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">T1</text>
  <rect x="36" y="254" width="72" height="28" rx="14" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="72" y="273" font-size="15" font-weight="bold" text-anchor="middle" fill="#b91c1c">T2</text>
  <rect x="28" y="318" width="88" height="74" fill="#fef2f2"/>
  <text x="72" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">위험 구간</text>
  <text x="72" y="362" font-size="15" text-anchor="middle" fill="#b91c1c">(인스턴스</text>
  <text x="72" y="382" font-size="15" text-anchor="middle" fill="#b91c1c">미완성)</text>
  <rect x="36" y="490" width="72" height="28" rx="14" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="72" y="509" font-size="15" font-weight="bold" text-anchor="middle" fill="#b91c1c">T3</text>
  <rect x="36" y="558" width="72" height="28" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="72" y="577" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">T4</text>

  <!-- 스레드 A -->
  <rect x="140" y="164" width="216" height="52" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="248" y="186" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">① 힙 메모리 할당</text>
  <text x="248" y="207" font-size="15" text-anchor="middle" fill="#4b5563">(주소값 생성)</text>

  <rect x="140" y="232" width="216" height="72" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="248" y="254" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">③ <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">instance</tspan> 대입</text>
  <text x="248" y="275" font-size="15" text-anchor="middle" fill="#b91c1c">(주소만 먼저 연결)</text>
  <text x="248" y="295" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">명령어 재배치 발생</text>

  <rect x="140" y="478" width="216" height="52" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="248" y="500" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">② 생성자 실행</text>
  <text x="248" y="521" font-size="15" text-anchor="middle" fill="#047857">(커넥션 풀 생성/열기)</text>

  <!-- 스레드 B -->
  <rect x="384" y="316" width="216" height="72" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="492" y="338" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">1차 검사</text>
  <text x="492" y="359" font-size="15" text-anchor="middle" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">instance != null</text>
  <text x="492" y="379" font-size="15" font-weight="bold" text-anchor="middle" fill="#b91c1c">→ 통과! (락 없이 반환)</text>
  <path d="M492,388 V403" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>
  <rect x="384" y="406" width="216" height="50" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="492" y="426" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">미완성 객체를</text>
  <text x="492" y="446" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">그대로 받아 사용</text>
  <path d="M600,431 H625" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#ah-red)"/>

  <!-- 힙 객체 상태 -->
  <rect x="628" y="100" width="220" height="52" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="738" y="122" font-size="16" font-weight="bold" text-anchor="middle" fill="#374151">null 상태</text>
  <text x="738" y="143" font-size="15" text-anchor="middle" fill="#4b5563">(메모리 미할당)</text>

  <rect x="628" y="232" width="220" height="224" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="738" y="338" font-size="16" font-weight="bold" text-anchor="middle" fill="#b91c1c">주소 연결됨 / 커넥션 0개</text>
  <text x="738" y="360" font-size="15" text-anchor="middle" fill="#b91c1c">(생성자 미실행 껍데기)</text>

  <rect x="628" y="546" width="220" height="52" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="738" y="568" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">커넥션 20개 정상 생성</text>
  <text x="738" y="589" font-size="15" text-anchor="middle" fill="#047857">(객체 초기화 완료)</text>

  <!-- 결론 -->
  <rect x="24" y="634" width="832" height="66" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="48" y="661" font-size="16" fill="#1f2937"><tspan font-weight="bold">결론:</tspan> <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">volatile</tspan>이 없으면 ① → ③ → ② 재배치로 인해</text>
  <text x="48" y="685" font-size="16" fill="#1f2937">스레드 B가 생성자가 실행되지 않은 미완성 객체에 접근하게 된다.</text>
</svg>
