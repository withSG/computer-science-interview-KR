<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">온프레미스 대 프라이빗 클라우드</title>
  <desc id="d">전통적 온프레미스는 개발팀이 메일·결재로 서버를 요청하고 인프라팀이 장비를 설치해 며칠에서 몇 주 뒤 고정 배정으로 전달한다. 프라이빗 클라우드는 개발팀이 포털에서 직접 생성하면 API 호출로 오케스트레이션 계층이 풀에서 자원을 할당하고, 몇 분 만에 가상 자원이 생성되며 사용량이 계량·청구된다.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 전통적 온프레미스 -->
  <rect x="24" y="24" width="404" height="352" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="58" font-size="19" font-weight="bold" fill="#374151" text-anchor="middle">전통적 온프레미스</text>

  <rect x="48" y="80" width="356" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="226" y="112" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">개발팀:</tspan> "서버 한 대 주세요"</text>
  <path d="M226,134 L226,186" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>
  <text x="242" y="166" font-size="15" fill="#4b5563">메일/결재</text>

  <rect x="48" y="188" width="356" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="226" y="220" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">인프라팀:</tspan> 장비 확인 → 설치</text>
  <path d="M226,242 L226,294" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="240" y="254" width="104" height="30" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="292" y="275" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">며칠~몇 주</text>

  <rect x="48" y="296" width="356" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="226" y="328" font-size="16" fill="#111827" text-anchor="middle">서버 전달 (고정 배정)</text>

  <!-- 프라이빗 클라우드 -->
  <rect x="452" y="24" width="404" height="352" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="654" y="58" font-size="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">프라이빗 클라우드</text>

  <rect x="476" y="80" width="356" height="52" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="654" y="112" font-size="16" fill="#111827" text-anchor="middle"><tspan font-weight="bold">개발팀:</tspan> 포털에서 직접 생성 (셀프서비스)</text>
  <path d="M654,134 L654,186" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="670" y="166" font-size="15" fill="#1d4ed8">API 호출</text>

  <rect x="476" y="188" width="356" height="52" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="654" y="220" font-size="16" fill="#111827" text-anchor="middle">오케스트레이션 계층이 풀에서 자원 할당</text>
  <path d="M654,242 L654,294" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="668" y="254" width="72" height="30" rx="15" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="704" y="275" font-size="16" font-weight="bold" fill="#065f46" text-anchor="middle">몇 분</text>

  <rect x="476" y="296" width="356" height="52" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="654" y="328" font-size="16" fill="#111827" text-anchor="middle">가상 자원 생성 + 사용량 계량/청구</text>
</svg>
