<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">온프레미스와 뭐가 다른가</title>
  <desc id="d">전통적 온프레미스와 프라이빗 클라우드의 자원 요청 및 할당 프로세스를 비교한 다이어그램</desc>
  
  <defs>
    <!-- Arrowhead markers -->
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="430" fill="#ffffff"/>

  <!-- Section 1: 전통적 온프레미스 (Left Panel) -->
  <rect x="24" y="20" width="404" height="390" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="226" y="52" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">[ 전통적 온프레미스 ]</text>

  <!-- Left Column Step 1 -->
  <rect x="50" y="80" width="352" height="50" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="226" y="110" font-size="13" fill="#1f2933" text-anchor="middle">개발팀: "서버 한 대 주세요"</text>

  <!-- Left Arrow 1 -->
  <path d="M226,130 L226,170" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>
  <rect x="180" y="141" width="92" height="18" fill="#ffffff"/>
  <text x="226" y="154" font-size="11.5" fill="#52606d" text-anchor="middle">메일/결재</text>

  <!-- Left Column Step 2 -->
  <rect x="50" y="170" width="352" height="50" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="226" y="200" font-size="13" fill="#1f2933" text-anchor="middle">인프라팀: 장비 확인 → 설치</text>

  <!-- Left Arrow 2 -->
  <path d="M226,220 L226,260" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>
  <rect x="180" y="231" width="92" height="18" fill="#ffffff"/>
  <text x="226" y="244" font-size="11.5" fill="#d97706" font-weight="bold" text-anchor="middle">며칠~몇 주</text>

  <!-- Left Column Step 3 -->
  <rect x="50" y="260" width="352" height="50" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="226" y="290" font-size="13" fill="#1f2933" text-anchor="middle">서버 전달 (고정 배정)</text>


  <!-- Section 2: 프라이빗 클라우드 (Right Panel) -->
  <rect x="452" y="20" width="404" height="390" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="654" y="52" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">[ 프라이빗 클라우드 ]</text>

  <!-- Right Column Step 1 -->
  <rect x="478" y="80" width="352" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="654" y="110" font-size="13" fill="#1f2933" text-anchor="middle">개발팀: 포털에서 직접 생성 (셀프서비스)</text>

  <!-- Right Arrow 1 -->
  <path d="M654,130 L654,170" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="615" y="141" width="78" height="18" fill="#ffffff"/>
  <text x="654" y="154" font-size="11.5" fill="#2563eb" text-anchor="middle">API 호출</text>

  <!-- Right Column Step 2 -->
  <rect x="478" y="170" width="352" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="654" y="200" font-size="13" fill="#1f2933" text-anchor="middle">오케스트레이션 계층이 풀에서 자원 할당</text>

  <!-- Right Arrow 2 -->
  <path d="M654,220 L654,260" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="622" y="231" width="64" height="18" fill="#ffffff"/>
  <text x="654" y="244" font-size="11.5" fill="#059669" font-weight="bold" text-anchor="middle">몇 분</text>

  <!-- Right Column Step 3 -->
  <rect x="478" y="260" width="352" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="654" y="290" font-size="13" fill="#1f2933" text-anchor="middle">가상 자원 생성 + 사용량 계량/청구</text>
</svg>