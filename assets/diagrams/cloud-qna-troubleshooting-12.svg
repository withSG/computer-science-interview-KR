<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">무차별 대입 공격 대응 답변</title>
  <desc id="d">로그인 API의 무차별 대입 공격을 WAF 알림으로 탐지하고, 즉시·10분·1시간·당일 순서로 차단·계정 분석·Rate Limiting 강화·Captcha 도입을 진행한 뒤 사후 조치를 거쳐 동일 유형 공격을 자동 차단하게 된 면접 답변 구조.</desc>
  <rect width="880" height="590" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 단계 축 (왼쪽) -->
  <line x1="76" y1="79" x2="76" y2="114" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="76" y1="158" x2="76" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="76" y1="262" x2="76" y2="382" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="76" y1="426" x2="76" y2="511" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="28" y="41" width="96" height="34" rx="17" fill="#334155"/>
  <text x="76" y="64" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">상황</text>
  <rect x="28" y="120" width="96" height="34" rx="17" fill="#334155"/>
  <text x="76" y="143" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">탐지</text>
  <rect x="28" y="224" width="96" height="34" rx="17" fill="#334155"/>
  <text x="76" y="247" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">대응</text>
  <rect x="28" y="388" width="96" height="34" rx="17" fill="#334155"/>
  <text x="76" y="411" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">사후 조치</text>
  <rect x="28" y="517" width="96" height="34" rx="17" fill="#334155"/>
  <text x="76" y="540" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">결과</text>

  <!-- 상황 -->
  <rect x="140" y="28" width="712" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="164" y="64" font-size="17" fill="#0f172a">“로그인 API에서 특정 IP 대역의 비정상적인 요청이 탐지되었습니다.”</text>

  <!-- 탐지 -->
  <rect x="140" y="112" width="712" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <circle cx="166" cy="137" r="3" fill="#475569"/>
  <text x="178" y="142" font-size="16" fill="#1f2937">WAF에서 분당 <tspan font-weight="bold" fill="#b91c1c">1000회 이상</tspan> 로그인 시도 알림</text>
  <circle cx="166" cy="163" r="3" fill="#475569"/>
  <text x="178" y="168" font-size="16" fill="#1f2937">실패율 <tspan font-weight="bold" fill="#b91c1c">99% 이상</tspan> (무차별 대입 공격)</text>

  <!-- 대응: 시간 순 -->
  <rect x="140" y="212" width="712" height="144" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="229" y="247" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">즉시</text>
  <text x="407" y="247" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">10분</text>
  <text x="585" y="247" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">1시간</text>
  <text x="763" y="247" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">당일</text>

  <line x1="246" y1="272" x2="388" y2="272" stroke="#b45309" stroke-width="2" marker-end="url(#arrA)"/>
  <line x1="424" y1="272" x2="566" y2="272" stroke="#b45309" stroke-width="2" marker-end="url(#arrA)"/>
  <line x1="602" y1="272" x2="744" y2="272" stroke="#b45309" stroke-width="2" marker-end="url(#arrA)"/>

  <circle cx="229" cy="272" r="13" fill="#b45309"/>
  <text x="229" y="277" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="407" cy="272" r="13" fill="#b45309"/>
  <text x="407" y="277" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="585" cy="272" r="13" fill="#b45309"/>
  <text x="585" y="277" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="763" cy="272" r="13" fill="#b45309"/>
  <text x="763" y="277" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  <text x="229" y="310" font-size="16" fill="#1f2937" text-anchor="middle">해당 IP 대역<tspan x="229" dy="23">WAF에서 차단</tspan></text>
  <text x="407" y="310" font-size="16" fill="#1f2937" text-anchor="middle">영향받은 계정 분석<tspan x="407" dy="23">→ 침해 없음 확인</tspan></text>
  <text x="585" y="310" font-size="16" fill="#1f2937" text-anchor="middle">Rate Limiting 강화<tspan x="585" dy="23">(분당 10회)</tspan></text>
  <text x="763" y="310" font-size="16" fill="#1f2937" text-anchor="middle">Captcha 도입<tspan x="763" dy="23">(5회 실패 시)</tspan></text>

  <!-- 사후 조치 -->
  <rect x="140" y="380" width="712" height="102" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="166" cy="405" r="3" fill="#475569"/>
  <text x="178" y="410" font-size="16" fill="#1f2937">로그인 실패 모니터링 대시보드 추가</text>
  <circle cx="166" cy="431" r="3" fill="#475569"/>
  <text x="178" y="436" font-size="16" fill="#1f2937">비정상 로그인 시도 시 사용자 알림 기능</text>
  <circle cx="166" cy="457" r="3" fill="#475569"/>
  <text x="178" y="462" font-size="16" fill="#1f2937">정기 보안 점검 체계 수립</text>

  <!-- 결과 -->
  <rect x="140" y="506" width="712" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="164" y="540" font-size="17" font-weight="bold" fill="#065f46">동일 유형 공격 자동 차단, 사용자 계정 안전 확보</text>
</svg>
