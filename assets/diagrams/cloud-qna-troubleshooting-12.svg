<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">면접 답변 예시</title>
  <desc id="d">로그인 API의 비정상적인 요청 탐지, 대응, 사후 조치 및 결과를 나타내는 인시던트 대응 프로세스 다이어그램</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="770" fill="#ffffff"/>

  <!-- Title / Quote Box -->
  <rect x="24" y="24" width="832" height="50" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="55" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">"로그인 API에서 특정 IP 대역의 비정상적인 요청이 탐지되었습니다."</text>

  <!-- Arrow 1 -->
  <path d="M440,74 L440,94" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 1. 탐지 (Detection) - Red fill for alert -->
  <rect x="24" y="94" width="832" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="44" y="125" font-size="16" fill="#dc2626" font-weight="bold">탐지:</text>
  <text x="54" y="155" font-size="13" fill="#1f2933">- WAF에서 분당 1000회 이상 로그인 시도 알림</text>
  <text x="54" y="180" font-size="13" fill="#1f2933">- 실패율 99% 이상 (무차별 대입 공격)</text>

  <!-- Arrow 2 -->
  <path d="M440,204 L440,224" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 2. 대응 (Response) - Amber fill for action/mitigation -->
  <rect x="24" y="224" width="832" height="160" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="44" y="255" font-size="16" fill="#d97706" font-weight="bold">대응:</text>
  <text x="54" y="285" font-size="13" fill="#1f2933">1. (즉시) 해당 IP 대역 WAF에서 차단</text>
  <text x="54" y="310" font-size="13" fill="#1f2933">2. (10분) 영향받은 계정 분석 → 침해 없음 확인</text>
  <text x="54" y="335" font-size="13" fill="#1f2933">3. (1시간) Rate Limiting 강화 (분당 10회)</text>
  <text x="54" y="360" font-size="13" fill="#1f2933">4. (당일) Captcha 도입 (5회 실패 시)</text>

  <!-- Arrow 3 -->
  <path d="M440,384 L440,404" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 3. 사후 조치 (Follow-up) - Purple fill for long-term governance/improvement -->
  <rect x="24" y="404" width="832" height="135" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="44" y="435" font-size="16" fill="#7c3aed" font-weight="bold">사후 조치:</text>
  <text x="54" y="465" font-size="13" fill="#1f2933">- 로그인 실패 모니터링 대시보드 추가</text>
  <text x="54" y="490" font-size="13" fill="#1f2933">- 비정상 로그인 시도 시 사용자 알림 기능</text>
  <text x="54" y="515" font-size="13" fill="#1f2933">- 정기 보안 점검 체계 수립</text>

  <!-- Arrow 4 -->
  <path d="M440,539 L440,559" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 4. 결과 (Result) - Emerald/Green fill for successful outcome -->
  <rect x="24" y="559" width="832" height="85" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="44" y="590" font-size="16" fill="#059669" font-weight="bold">결과:</text>
  <text x="54" y="620" font-size="13" fill="#1f2933">동일 유형 공격 자동 차단, 사용자 계정 안전 확보</text>
</svg>