<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Virtual DOM의 동작 과정</title>
  <desc id="d">상태 변경이 일어나면 새 Virtual DOM 트리 생성, 이전 트리와 비교(Diffing), 변경된 부분만 계산(Reconciliation)까지 메모리에서 처리하고, 마지막에 실제 DOM에 한 번에 반영(Batch Update)하는 5단계 흐름.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 구역: Virtual DOM (메모리) -->
  <rect x="24" y="96" width="832" height="256" rx="12" fill="#eff6ff"/>
  <text x="44" y="218" font-size="17" font-weight="bold" fill="#1d4ed8">Virtual DOM</text>
  <text x="44" y="242" font-size="15" fill="#374151">메모리에서 계산</text>

  <!-- 구역: 실제 DOM -->
  <rect x="24" y="368" width="832" height="88" rx="12" fill="#ecfdf5"/>
  <text x="44" y="406" font-size="17" font-weight="bold" fill="#047857">실제 DOM</text>
  <text x="44" y="430" font-size="15" fill="#374151">변경분만 한 번에</text>

  <!-- 1. 상태 변경 발생 -->
  <rect x="236" y="24" width="596" height="56" rx="28" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="268" cy="52" r="15" fill="#b45309"/>
  <text x="268" y="57.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="296" y="58" font-size="17" font-weight="bold" fill="#111827">상태 변경 발생</text>

  <path d="M534,80 V110" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 2. 새로운 Virtual DOM 트리 생성 -->
  <rect x="236" y="112" width="596" height="56" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="268" cy="140" r="15" fill="#1d4ed8"/>
  <text x="268" y="145.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="296" y="146" font-size="17" font-weight="bold" fill="#111827">새로운 Virtual DOM 트리 생성</text>

  <path d="M534,168 V194" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 3. 이전 Virtual DOM과 비교 (Diffing) -->
  <rect x="236" y="196" width="596" height="56" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="268" cy="224" r="15" fill="#1d4ed8"/>
  <text x="268" y="229.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="296" y="230" font-size="17" font-weight="bold" fill="#111827">이전 Virtual DOM과 비교</text>
  <rect x="722" y="210" width="96" height="28" rx="14" fill="#dbeafe"/>
  <text x="770" y="229" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">Diffing</text>

  <path d="M534,252 V278" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 4. 변경된 부분만 계산 (Reconciliation) -->
  <rect x="236" y="280" width="596" height="56" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="268" cy="308" r="15" fill="#1d4ed8"/>
  <text x="268" y="313.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="296" y="314" font-size="17" font-weight="bold" fill="#111827">변경된 부분만 계산</text>
  <rect x="662" y="294" width="156" height="28" rx="14" fill="#dbeafe"/>
  <text x="740" y="313" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">Reconciliation</text>

  <path d="M534,336 V382" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 5. 실제 DOM에 일괄 반영 (Batch Update) -->
  <rect x="236" y="384" width="596" height="56" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <circle cx="268" cy="412" r="15" fill="#047857"/>
  <text x="268" y="417.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="296" y="418" font-size="17" font-weight="bold" fill="#111827">실제 DOM에 일괄 반영</text>
  <rect x="680" y="398" width="138" height="28" rx="14" fill="#d1fae5"/>
  <text x="749" y="417" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">Batch Update</text>
</svg>
