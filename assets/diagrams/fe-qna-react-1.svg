<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Virtual DOM의 동작 과정</title>
  <desc id="d">Virtual DOM이 상태 변경 발생부터 실제 DOM에 일괄 반영되기까지의 5단계 동작 과정을 나타낸 플로우차트 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="440" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Virtual DOM의 동작 과정</text>

  <!-- Flowchart Nodes -->
  <!-- Step 1 -->
  <rect x="260" y="70" width="360" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="102" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1. 상태 변경 발생</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M440,124 L440,154" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 2 -->
  <rect x="260" y="156" width="360" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="188" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2. 새로운 Virtual DOM 트리 생성</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M440,210 L440,240" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 3 -->
  <rect x="260" y="242" width="360" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="274" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">3. 이전 Virtual DOM과 비교 (Diffing)</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M440,296 L440,326" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 4 -->
  <rect x="260" y="328" width="360" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="360" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4. 변경된 부분만 계산 (Reconciliation)</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M440,382 L440,412" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Step 5 (Final Highlight Node) -->
  <rect x="260" y="414" width="360" height="54" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="446" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">5. 실제 DOM에 일괄 반영 (Batch Update)</text>
</svg>