<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">타임 퀀텀 설정의 트레이드오프</title>
  <desc id="d">타임 퀀텀이 매우 작을 때와 매우 클 때의 컨텍스트 스위칭 오버헤드, 응답성, 처리량 차이를 비교하는 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Section 1: 퀀텀이 매우 작을 때 -->
  <g id="section-small-quantum">
    <text x="30" y="38" font-size="14" font-weight="bold" fill="#1f2933">퀀텀이 매우 작을 때 (전환 비용을 5μs로 잡고 퀀텀을 50μs로 준 경우)</text>

    <!-- Timeline Blocks -->
    <!-- Start mark ├ -->
    <line x1="30" y1="58" x2="30" y2="92" stroke="#d97706" stroke-width="2"/>

    <!-- Work 1 -->
    <rect x="30" y="60" width="130" height="30" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="95" y="79" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">작업</text>
    <text x="95" y="108" font-size="11.5" fill="#52606d" text-anchor="middle">50μs</text>

    <!-- Switch 1 -->
    <rect x="160" y="60" width="30" height="30" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="175" y="79" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">전환</text>
    <text x="175" y="108" font-size="11.5" fill="#52606d" text-anchor="middle">5</text>

    <!-- Work 2 -->
    <rect x="190" y="60" width="130" height="30" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="255" y="79" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">작업</text>
    <text x="255" y="108" font-size="11.5" fill="#52606d" text-anchor="middle">50μs</text>

    <!-- Switch 2 -->
    <rect x="320" y="60" width="30" height="30" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="335" y="79" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">전환</text>
    <text x="335" y="108" font-size="11.5" fill="#52606d" text-anchor="middle">5</text>

    <!-- Work 3 -->
    <rect x="350" y="60" width="130" height="30" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="415" y="79" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">작업</text>
    <text x="415" y="108" font-size="11.5" fill="#52606d" text-anchor="middle">50μs</text>

    <!-- Switch 3 -->
    <rect x="480" y="60" width="30" height="30" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="495" y="79" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">전환</text>
    <text x="495" y="108" font-size="11.5" fill="#52606d" text-anchor="middle">5</text>

    <!-- Work 4 -->
    <rect x="510" y="60" width="130" height="30" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="575" y="79" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">작업</text>
    <text x="575" y="108" font-size="11.5" fill="#52606d" text-anchor="middle">50μs</text>

    <!-- End mark ┤ -->
    <line x1="640" y1="58" x2="640" y2="92" stroke="#d97706" stroke-width="2"/>

    <!-- Description arrow and text -->
    <path d="M 30 140 L 45 140" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="55" y="144" font-size="13" fill="#1f2933">전체 시간의 약 9%를 전환에 쓴다. 응답은 빠르지만 처리량 손실.</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="180" x2="850" y2="180" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Section 2: 퀀텀이 매우 클 때 -->
  <g id="section-large-quantum">
    <text x="30" y="222" font-size="14" font-weight="bold" fill="#1f2933">퀀텀이 매우 클 때 (예: 1초)</text>

    <!-- Timeline Blocks -->
    <!-- Start mark ├ -->
    <line x1="30" y1="242" x2="30" y2="278" stroke="#2563eb" stroke-width="2"/>

    <!-- Work -->
    <rect x="30" y="244" width="580" height="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="320" y="263" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">작업</text>

    <!-- Switch -->
    <rect x="610" y="244" width="30" height="30" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="625" y="263" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">전환</text>

    <!-- End mark ┤ -->
    <line x1="640" y1="242" x2="640" y2="278" stroke="#dc2626" stroke-width="2"/>

    <!-- Description arrow and text lines -->
    <path d="M 30 315 L 45 315" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="55" y="319" font-size="13" fill="#1f2933">오버헤드는 무시할 수준이지만, 앞 작업이 끝날 때까지</text>
    <text x="55" y="341" font-size="13" fill="#1f2933">뒤 작업은 최대 1초를 기다린다. 사실상 FCFS.</text>
  </g>
</svg>