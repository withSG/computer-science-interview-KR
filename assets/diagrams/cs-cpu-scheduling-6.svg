<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 550" width="880" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">타임 퀀텀 크기 비교</title>
  <desc id="d">퀀텀이 50μs로 매우 작으면 5μs 전환이 자주 끼어 전체 시간의 약 9%를 전환에 써 응답은 빠르지만 처리량을 잃고, 퀀텀이 1초로 매우 크면 오버헤드는 무시할 수준이지만 뒤 작업이 최대 1초를 기다려 사실상 FCFS가 되는 것을 비교합니다.</desc>
  <rect width="880" height="550" fill="#ffffff"/>
  <defs>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ① 퀀텀이 매우 작을 때 -->
  <text x="40" y="44" font-size="19" font-weight="bold" fill="#111827">① 퀀텀이 매우 작을 때</text>
  <text x="40" y="70" font-size="15" fill="#374151">전환 비용을 5μs로 잡고 퀀텀을 50μs로 준 경우</text>

  <rect x="74" y="90" width="170" height="44" fill="#dbeafe"/>
  <text x="159" y="118" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">작업 50μs</text>
  <rect x="244" y="90" width="17" height="44" fill="#b91c1c"/>
  <rect x="261" y="90" width="170" height="44" fill="#dbeafe"/>
  <text x="346" y="118" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">작업 50μs</text>
  <rect x="431" y="90" width="17" height="44" fill="#b91c1c"/>
  <rect x="448" y="90" width="170" height="44" fill="#dbeafe"/>
  <text x="533" y="118" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">작업 50μs</text>
  <rect x="618" y="90" width="17" height="44" fill="#b91c1c"/>
  <rect x="635" y="90" width="170" height="44" fill="#dbeafe"/>
  <text x="720" y="118" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">작업 50μs</text>

  <g font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">
    <text x="252.5" y="156">전환 5μs</text>
    <text x="439.5" y="156">전환 5μs</text>
    <text x="626.5" y="156">전환 5μs</text>
  </g>

  <text x="40" y="194" fill="#111827"><tspan font-size="17" font-weight="bold">→ 전체 시간의 약 9%를 전환에 쓴다</tspan><tspan dx="8" font-size="15" fill="#4b5563">(5μs ÷ 55μs)</tspan></text>

  <rect x="74" y="210" width="112" height="32" rx="16" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="130" y="231" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">응답: 빠름</text>
  <rect x="198" y="210" width="128" height="32" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="262" y="231" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">처리량: 손실</text>

  <line x1="40" y1="274" x2="840" y2="274" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ② 퀀텀이 매우 클 때 -->
  <text x="40" y="318" font-size="19" font-weight="bold" fill="#111827">② 퀀텀이 매우 클 때 (예: 1초)</text>

  <text x="796.5" y="350" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">전환</text>
  <rect x="74" y="360" width="714" height="44" fill="#dbeafe"/>
  <text x="431" y="388" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">작업 (퀀텀 1초)</text>
  <rect x="788" y="360" width="17" height="44" fill="#b91c1c"/>

  <line x1="74" y1="416" x2="74" y2="436" stroke="#b45309" stroke-width="1.5"/>
  <line x1="788" y1="416" x2="788" y2="436" stroke="#b45309" stroke-width="1.5"/>
  <path d="M77,426 L336,426" fill="none" stroke="#b45309" stroke-width="2" marker-start="url(#ah-amber)"/>
  <path d="M526,426 L785,426" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <text x="431" y="432" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">뒤 작업 대기 · 최대 1초</text>

  <text x="40" y="474" font-size="17" font-weight="bold" fill="#111827">→ 사실상 FCFS</text>

  <rect x="74" y="490" width="180" height="32" rx="16" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="164" y="511" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">오버헤드: 무시할 수준</text>
  <rect x="266" y="490" width="390" height="32" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="461" y="511" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">응답: 앞 작업이 끝날 때까지 뒤 작업은 최대 1초 대기</text>
</svg>
