<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">패턴 2. 데일리 스크럼이 상태 보고 회의가 된다</title>
  <desc id="d">데일리 스크럼 안티패턴: 개발자들이 팀원 간 소통 대신 스크럼 마스터에게만 상태 보고를 하며 회의가 길어지는 구조를 보여주는 다이어그램입니다.</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 메인 프레임 영역 -->
  <rect x="20" y="20" width="840" height="300" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>

  <!-- 타이틀 Header -->
  <rect x="20" y="20" width="840" height="46" rx="8" fill="#dc2626"/>
  <!-- rx 가려짐 방지 및 하단 직선 처리 -->
  <rect x="20" y="58" width="840" height="8" fill="#dc2626"/>
  <text x="40" y="49" fill="#ffffff" font-size="16" font-weight="bold">안티패턴: 데일리 스크럼이 상태 보고 회의가 된다</text>

  <!-- 수신자: 스크럼 마스터 (중앙 상단) -->
  <rect x="330" y="86" width="220" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="116" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">스크럼 마스터</text>

  <!-- 발신자 1: 개발자 A (좌측 하단) -->
  <rect x="40" y="180" width="370" height="70" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="210" fill="#dc2626" font-size="13" font-weight="bold">개발자 A</text>
  <text x="125" y="210" fill="#52606d" font-size="13">→ (스크럼 마스터를 보며)</text>
  <text x="60" y="234" fill="#1f2933" font-size="13">"어제 API 3개 했고 오늘 2개 합니다"</text>

  <!-- 발신자 2: 개발자 B (우측 하단) -->
  <rect x="470" y="180" width="370" height="70" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="490" y="210" fill="#dc2626" font-size="13" font-weight="bold">개발자 B</text>
  <text x="555" y="210" fill="#52606d" font-size="13">→ (스크럼 마스터를 보며)</text>
  <text x="490" y="234" fill="#1f2933" font-size="13">"어제 화면 붙였고 오늘 이어서 합니다"</text>

  <!-- 보고 화살표 1 (개발자 A -> 스크럼 마스터) -->
  <path d="M225,180 L225,160 L380,160 L380,143" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- 보고 화살표 2 (개발자 B -> 스크럼 마스터) -->
  <path d="M655,180 L655,160 L500,160 L500,143" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- 비효율 경고 하단 바 -->
  <rect x="40" y="270" width="800" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="440" y="291" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">... 12명이 순서대로 40분</text>
</svg>