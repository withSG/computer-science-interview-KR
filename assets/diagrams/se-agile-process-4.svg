<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상태 보고 회의가 된 데일리 스크럼</title>
  <desc id="d">안티패턴: 개발자 A와 B가 팀원이 아니라 스크럼 마스터를 보며 어제 한 일과 오늘 할 일을 보고하고, 이런 식으로 12명이 순서대로 말하는 데 40분이 걸린다.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 안티패턴 표지 -->
  <rect x="24" y="24" width="96" height="32" rx="16" fill="#b91c1c"/>
  <text x="72" y="45.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">안티패턴</text>

  <!-- 모든 시선이 향하는 곳: 스크럼 마스터 -->
  <rect x="330" y="36" width="220" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="72" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">스크럼 마스터</text>

  <!-- 시선/보고 화살표 -->
  <line x1="250" y1="186" x2="390" y2="102" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="630" y1="186" x2="490" y2="102" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="290" y="146" font-size="15" fill="#b91c1c" text-anchor="end">(스크럼 마스터를 보며)</text>
  <text x="590" y="146" font-size="15" fill="#b91c1c">(스크럼 마스터를 보며)</text>

  <!-- 개발자 A -->
  <rect x="40" y="190" width="380" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="60" y="224" font-size="17" font-weight="bold" fill="#b91c1c">개발자 A</text>
  <text x="60" y="262" font-size="16" fill="#111827">"어제 API 3개 했고 오늘 2개 합니다"</text>

  <!-- 개발자 B -->
  <rect x="460" y="190" width="380" height="96" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="480" y="224" font-size="17" font-weight="bold" fill="#b91c1c">개발자 B</text>
  <text x="480" y="262" font-size="16" fill="#111827">"어제 화면 붙였고 오늘 이어서 합니다"</text>

  <!-- 발언 순서: 12명 -->
  <text x="40" y="324" font-size="15" fill="#4b5563">발언 순서</text>
  <rect x="40" y="334" width="62" height="40" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="71" y="359" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">A</text>
  <rect x="107" y="334" width="62" height="40" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="138" y="359" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">B</text>
  <rect x="174" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="205" y="359" font-size="15" fill="#4b5563" text-anchor="middle">3</text>
  <rect x="241" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="272" y="359" font-size="15" fill="#4b5563" text-anchor="middle">4</text>
  <rect x="308" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="339" y="359" font-size="15" fill="#4b5563" text-anchor="middle">5</text>
  <rect x="375" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="406" y="359" font-size="15" fill="#4b5563" text-anchor="middle">6</text>
  <rect x="442" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="473" y="359" font-size="15" fill="#4b5563" text-anchor="middle">7</text>
  <rect x="509" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="540" y="359" font-size="15" fill="#4b5563" text-anchor="middle">8</text>
  <rect x="576" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="607" y="359" font-size="15" fill="#4b5563" text-anchor="middle">9</text>
  <rect x="643" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="674" y="359" font-size="15" fill="#4b5563" text-anchor="middle">10</text>
  <rect x="710" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="741" y="359" font-size="15" fill="#4b5563" text-anchor="middle">11</text>
  <rect x="777" y="334" width="62" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="808" y="359" font-size="15" fill="#4b5563" text-anchor="middle">12</text>

  <!-- 묶음 괄호 -->
  <path d="M40,384 V392 H434 L440,400 L446,392 H839 V384" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="440" y="428" font-size="17" fill="#111827" text-anchor="middle">… 12명이 순서대로 <tspan font-size="20" font-weight="bold" fill="#b91c1c">40분</tspan></text>
</svg>
