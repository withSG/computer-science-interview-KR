<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fiber의 해결책</title>
  <desc id="d">React 16 이상 Fiber Reconciler의 작업 분할 및 중단 가능 구조를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 헤딩/제목 -->
  <text x="40" y="45" font-size="16" font-weight="bold" fill="#1f2933">Fiber Reconciler (React 16+):</text>

  <!-- 작업 노드 (A, B, C, D, E) -->
  <!-- A -->
  <rect x="40" y="80" width="70" height="50" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="111" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>

  <!-- 화살표 A -> B -->
  <path d="M110,105 L150,105" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- B -->
  <rect x="150" y="80" width="70" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="185" y="111" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>

  <!-- 화살표 B -> C -->
  <path d="M220,105 L260,105" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- C -->
  <rect x="260" y="80" width="70" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="295" y="111" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>

  <!-- 화살표 C -> D -->
  <path d="M330,105 L370,105" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- D -->
  <rect x="370" y="80" width="70" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="405" y="111" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">D</text>

  <!-- 화살표 D -> E -->
  <path d="M440,105 L480,105" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- E -->
  <rect x="480" y="80" width="70" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="515" y="111" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">E</text>

  <!-- 화살표 E -> 완료 -->
  <path d="M550,105 L590,105" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 완료 라벨 -->
  <text x="600" y="109" font-size="13" font-weight="bold" fill="#059669">완료</text>

  <!-- 중단 위치 표시 화살표 (↑) -->
  <path d="M75,175 L75,138" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#a-amber)"/>

  <!-- 주석 1: 중단 가능! 우선순위 높은 작업 먼저 -->
  <text x="75" y="198" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">중단 가능! 우선순위 높은 작업 먼저</text>

  <!-- 하단 부가 설명 화살표 (→) 및 텍스트 -->
  <path d="M40,260 L60,260" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <text x="70" y="264" font-size="13" fill="#1f2933">긴급한 업데이트(입력, 애니메이션)를 먼저 처리</text>
</svg>