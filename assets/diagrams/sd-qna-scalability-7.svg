<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CAP 조합</title>
  <desc id="d">분산 시스템의 CAP 정리 중 P의 필수성과 CP 대 AP 선택 및 예시 시스템 다이어그램</desc>
  <rect width="880" height="430" fill="#ffffff"/>
  
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 상단 핵심 전제 상자 -->
  <rect x="190" y="30" width="500" height="70" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="440" y="62" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">분산 시스템에서 P(Partition Tolerance)는 필수</text>
  
  <!-- 화살표 및 전환 라벨 -->
  <path d="M440,100 L440,128" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <rect x="360" y="106" width="160" height="20" fill="#ffffff"/>
  <text x="440" y="120" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">→ 실제로는 CP vs AP 선택</text>

  <!-- CP 섹션 박스 -->
  <rect x="40" y="150" width="385" height="240" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="232.5" y="185" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">CP (Consistency + Partition Tolerance)</text>
  
  <text x="60" y="225" font-size="13" fill="#1f2933">- 일관성 우선</text>
  <text x="60" y="260" font-size="13" fill="#1f2933">- 네트워크 분할 시 일부 요청 거부</text>
  <text x="60" y="295" font-size="13" fill="#1f2933">- 예: MongoDB, HBase, Redis Cluster</text>

  <!-- AP 섹션 박스 -->
  <rect x="455" y="150" width="385" height="240" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="647.5" y="185" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">AP (Availability + Partition Tolerance)</text>
  
  <text x="475" y="225" font-size="13" fill="#1f2933">- 가용성 우선</text>
  <text x="475" y="260" font-size="13" fill="#1f2933">- 네트워크 분할 시에도 응답 (오래된 데이터 가능)</text>
  <text x="475" y="295" font-size="13" fill="#1f2933">- 예: Cassandra, DynamoDB, CouchDB</text>
</svg>