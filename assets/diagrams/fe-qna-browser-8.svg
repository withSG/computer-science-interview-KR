<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">TCP 3-way handshake</title>
  <desc id="d">Client가 SYN을 보내고, Server가 SYN+ACK로 답한 뒤, Client가 ACK를 보내는 3-way handshake의 세 메시지를 위에서 아래 시간 순서로 보여준다.</desc>
  <defs>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>

  <!-- 참여자 -->
  <rect x="80" y="24" width="160" height="48" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="160" y="54" fill="#1d4ed8" font-size="18" font-weight="bold" text-anchor="middle">Client</text>
  <rect x="640" y="24" width="160" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="720" y="54" fill="#047857" font-size="18" font-weight="bold" text-anchor="middle">Server</text>

  <!-- 생명선 -->
  <path d="M160,72 L160,306" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M720,72 L720,306" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 1. SYN : Client → Server -->
  <text x="440" y="118" fill="#1d4ed8" font-size="17" font-weight="bold" text-anchor="middle">1. SYN</text>
  <path d="M164,132 L714,132" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ah-b)"/>

  <!-- 2. SYN+ACK : Server → Client -->
  <text x="440" y="188" fill="#047857" font-size="17" font-weight="bold" text-anchor="middle">2. SYN+ACK</text>
  <path d="M716,202 L166,202" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#ah-g)"/>

  <!-- 3. ACK : Client → Server -->
  <text x="440" y="258" fill="#1d4ed8" font-size="17" font-weight="bold" text-anchor="middle">3. ACK</text>
  <path d="M164,272 L714,272" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ah-b)"/>
</svg>
