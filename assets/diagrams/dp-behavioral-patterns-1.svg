<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">전략 패턴 적용 전후 구조</title>
  <desc id="d">적용 전에는 ShippingCalculator 한 메서드 안에서 배송 방식별 if 분기가 계속 자라고, 적용 후에는 ShippingCalculator가 ShippingPolicy 인터페이스의 calculate()만 부르며 배송 방식마다 구현 클래스가 하나씩 생겨 새 방식은 클래스 1개 추가로 끝난다.</desc>
  <rect width="880" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- 가운데 구분선 -->
  <line x1="440" y1="36" x2="440" y2="396" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ===== 적용 전 ===== -->
  <text x="24" y="52" font-size="18" font-weight="bold" fill="#b91c1c">적용 전</text>

  <rect x="24" y="72" width="392" height="282" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="44" y="104" font-size="16" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ShippingCalculator</text>

  <rect x="44" y="122" width="352" height="40" rx="5" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
  <text x="62" y="147" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">if EXPRESS ...</text>

  <rect x="44" y="176" width="352" height="40" rx="5" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
  <text x="62" y="201" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">if SAME_DAY ...</text>

  <rect x="44" y="230" width="352" height="40" rx="5" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
  <text x="62" y="255" font-size="15" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">if PICKUP ...</text>

  <rect x="44" y="284" width="352" height="46" rx="5" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="312" font-size="15" font-weight="bold" fill="#b91c1c">+ 새 방식이 생길 때마다 분기 추가</text>

  <text x="220" y="390" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">분기가 한 메서드 안에서 계속 자란다</text>

  <!-- ===== 적용 후 ===== -->
  <text x="464" y="52" font-size="18" font-weight="bold" fill="#047857">적용 후</text>

  <!-- ShippingCalculator -->
  <rect x="540" y="72" width="240" height="66" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="660" y="99" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ShippingCalculator</text>
  <text x="660" y="125" font-size="15" fill="#1d4ed8" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">policy.calculate()</text>

  <line x1="660" y1="138" x2="660" y2="174" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ShippingPolicy 인터페이스 -->
  <rect x="496" y="178" width="328" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="660" y="206" font-size="16" text-anchor="middle" fill="#111827"><tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ShippingPolicy</tspan><tspan fill="#047857" font-size="15"> (인터페이스)</tspan></text>

  <!-- 구현 관계: 빈 삼각형 + 점선 줄기 -->
  <path d="M660,222 L667,234 L653,234 Z" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <path d="M660,234 L660,331 M660,275 L644,275 M660,331 L644,331 M660,275 L676,275 M660,331 L676,331" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="672" y="250" font-size="14" fill="#047857">구현</text>

  <rect x="466" y="254" width="178" height="42" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="555" y="280" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">StandardShipping</text>

  <rect x="676" y="254" width="178" height="42" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="765" y="280" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">ExpressShipping</text>

  <rect x="466" y="310" width="178" height="42" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="555" y="336" font-size="15" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">SameDayShipping</text>

  <rect x="676" y="310" width="178" height="42" rx="6" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="765" y="336" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">+ 새 방식 클래스</text>

  <text x="660" y="390" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">새 방식 = 클래스 1개. 기존 파일은 안 연다</text>
</svg>
