<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">1단계 — 알고리즘을 인터페이스 뒤로 옮긴다</title>
  <desc id="d">전략 패턴 적용 전후의 클래스 구조와 관계를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="430" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- Title section based on document heading -->
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#1f2933">1단계 — 알고리즘을 인터페이스 뒤로 옮긴다</text>

  <!-- Left Side Group: [적용 전] -->
  <g>
    <text x="30" y="78" font-size="14" font-weight="bold" fill="#dc2626">[적용 전]</text>

    <!-- ShippingCalculator Box (Before) -->
    <rect x="30" y="95" width="370" height="155" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="50" y="125" font-size="14" font-weight="bold" fill="#1f2933">ShippingCalculator</text>
    
    <!-- Code logic tree inside -->
    <path d="M 60,140 L 60,215 M 60,150 L 72,150 M 60,180 L 72,180 M 60,210 L 72,210" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
    <text x="80" y="154" font-size="13" font-family="monospace" fill="#dc2626">if EXPRESS ...</text>
    <text x="80" y="184" font-size="13" font-family="monospace" fill="#dc2626">if SAME_DAY ...</text>
    <text x="80" y="214" font-size="13" font-family="monospace" fill="#dc2626">if PICKUP ...</text>

    <!-- Annotation Box (Before) -->
    <rect x="30" y="270" width="370" height="120" rx="6" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="50" y="315" font-size="13" fill="#52606d">분기가 한 메서드 안에서</text>
    <text x="50" y="345" font-size="13" fill="#52606d">계속 자란다</text>
  </g>

  <!-- Divider line -->
  <line x1="430" y1="70" x2="430" y2="400" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right Side Group: [적용 후] -->
  <g>
    <text x="460" y="78" font-size="14" font-weight="bold" fill="#059669">[적용 후]</text>

    <!-- ShippingCalculator Box (After) -->
    <rect x="460" y="95" width="390" height="75" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="480" y="125" font-size="14" font-weight="bold" fill="#1f2933">ShippingCalculator</text>
    <path d="M 490,135 L 490,152 M 490,148 L 502,148" stroke="#9aa5b1" stroke-width="1.5" fill="none"/>
    <text x="510" y="152" font-size="13" font-family="monospace" fill="#2563eb">policy.calculate()</text>

    <!-- Arrow connecting ShippingCalculator to ShippingPolicy -->
    <path d="M 655,170 L 655,193" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

    <!-- ShippingPolicy Interface Box -->
    <rect x="460" y="200" width="390" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="480" y="230" font-size="14" font-weight="bold" fill="#1f2933">ShippingPolicy <tspan font-size="12" font-weight="normal" fill="#059669">(인터페이스)</tspan></text>

    <!-- Implementations Tree -->
    <path d="M 480,250 L 480,340 M 480,270 L 502,270 M 480,305 L 502,305 M 480,340 L 502,340" stroke="#059669" stroke-width="1.5" fill="none"/>
    <text x="512" y="274" font-size="13" fill="#1f2933">StandardShipping</text>
    <text x="512" y="309" font-size="13" fill="#1f2933">ExpressShipping</text>
    <text x="512" y="344" font-size="13" fill="#1f2933">SameDayShipping</text>

    <!-- Annotation Note (After) -->
    <rect x="460" y="365" width="390" height="35" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="475" y="387" font-size="12.5" font-weight="bold" fill="#059669">새 방식 = 클래스 1개. 기존 파일은 안 연다</text>
  </g>
</svg>