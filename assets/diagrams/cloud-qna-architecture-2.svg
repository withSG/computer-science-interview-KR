<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 584" width="880" height="584" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">URL 단축 서비스 대략적 설계</title>
  <desc id="d">Client 요청이 Load Balancer를 거쳐 URL 생성용 API Server와 리다이렉트용 API Server로 나뉘고, 두 서버 모두 Cache (Redis)를 거쳐 short_url → long_url 매핑을 담은 Database로 이어집니다.</desc>
  <rect width="880" height="584" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="110" y="24" width="660" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="56" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Client</text>
  <line x1="440" y1="76" x2="440" y2="114" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Load Balancer -->
  <rect x="110" y="116" width="660" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Load Balancer</text>

  <!-- 분기 -->
  <path d="M440,168 V196 H250 V222" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M440,196 H630 V222" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- API Server (URL 생성) -->
  <rect x="110" y="224" width="280" height="80" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="250" y="257" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">API Server</text>
  <text x="250" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">(URL 생성)</text>

  <!-- API Server (리다이렉트) -->
  <rect x="490" y="224" width="280" height="80" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="630" y="257" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">API Server</text>
  <text x="630" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">(리다이렉트)</text>

  <line x1="250" y1="304" x2="250" y2="362" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-b)"/>
  <line x1="630" y1="304" x2="630" y2="362" stroke="#047857" stroke-width="2" marker-end="url(#ah-g)"/>

  <!-- Cache -->
  <rect x="110" y="364" width="660" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="396" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Cache (Redis)</text>
  <text x="440" y="424" text-anchor="middle" font-size="16" fill="#92400e">(핫 데이터 캐싱)</text>
  <line x1="440" y1="440" x2="440" y2="482" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Database -->
  <rect x="110" y="484" width="660" height="76" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="440" y="516" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Database (NoSQL/RDB)</text>
  <text x="440" y="544" text-anchor="middle" font-size="16" fill="#5b21b6"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">short_url → long_url</tspan> 매핑</text>
</svg>
