<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Hypervisor 구조 비교</title>
  <desc id="d">Type 1(Bare-metal)은 Hardware 위에 Hypervisor가 바로 올라가고 그 위에 VM이 실행된다. Type 2(Hosted)는 Hardware와 Hypervisor 사이에 Host OS가 한 층 더 있어 OS 오버헤드가 생긴다.</desc>
  <rect width="880" height="450" fill="#ffffff"/>

  <!-- 가운데 구분선 -->
  <line x1="440" y1="28" x2="440" y2="422" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===== Type 1 ===== -->
  <text x="230" y="50" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Type 1 <tspan font-weight="normal" fill="#4b5563">(Bare-metal)</tspan></text>

  <!-- VM -->
  <rect x="60" y="150" width="160" height="54" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="140" y="183" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">VM</text>
  <rect x="240" y="150" width="160" height="54" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="320" y="183" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">VM</text>

  <!-- Hypervisor -->
  <rect x="60" y="216" width="340" height="54" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="230" y="249" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hypervisor</text>

  <!-- Hardware -->
  <rect x="60" y="282" width="340" height="54" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="230" y="315" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- Type 1 요약 -->
  <text x="230" y="376" font-size="16" fill="#111827" text-anchor="middle">Hypervisor를 하드웨어에 직접 설치</text>
  <text x="230" y="402" font-size="16" fill="#047857" text-anchor="middle">→ 성능 높음</text>

  <!-- ===== Type 2 ===== -->
  <text x="650" y="50" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">Type 2 <tspan font-weight="normal" fill="#4b5563">(Hosted)</tspan></text>

  <!-- VM -->
  <rect x="480" y="84" width="160" height="54" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="560" y="117" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">VM</text>
  <rect x="660" y="84" width="160" height="54" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="740" y="117" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">VM</text>

  <!-- Hypervisor -->
  <rect x="480" y="150" width="340" height="54" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="650" y="183" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hypervisor</text>

  <!-- Host OS : Type 2에만 있는 층 -->
  <rect x="480" y="216" width="340" height="54" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="650" y="249" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">Host OS</text>

  <!-- Hardware -->
  <rect x="480" y="282" width="340" height="54" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>
  <text x="650" y="315" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- Type 2 요약 -->
  <text x="650" y="376" font-size="16" fill="#111827" text-anchor="middle">Hypervisor를 <tspan font-weight="bold" fill="#92400e">호스트 OS 위</tspan>에 설치</text>
  <text x="650" y="402" font-size="16" fill="#b45309" text-anchor="middle">→ 성능 중간 (OS 오버헤드)</text>
</svg>
