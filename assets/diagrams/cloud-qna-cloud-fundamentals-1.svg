<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구조 비교</title>
  <desc id="d">Type 1과 Type 2 Hypervisor의 구조적 차이를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="880" height="490" fill="#ffffff"/>

  <!-- 메인 제목 -->
  <text x="440" y="40" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">구조 비교</text>

  <!-- 영역 배경 카드 -->
  <!-- Type 1 영역 -->
  <rect x="40" y="70" width="380" height="380" rx="8" fill="#eff6ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="230" y="105" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">Type 1:</text>

  <!-- Type 2 영역 -->
  <rect x="460" y="70" width="380" height="380" rx="8" fill="#f5f3ff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="650" y="105" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">Type 2:</text>

  <!-- ==================== TYPE 1 ==================== -->
  <!-- VM 1 (Left) -->
  <rect x="80" y="130" width="120" height="50" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="160.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">VM</text>

  <!-- VM 2 (Right) -->
  <rect x="260" y="130" width="120" height="50" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="160.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">VM</text>

  <!-- Hypervisor -->
  <rect x="80" y="230" width="300" height="50" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="260.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Hypervisor</text>

  <!-- Hardware -->
  <rect x="80" y="330" width="300" height="50" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="360.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Hardware</text>

  <!-- Type 1 연결선 및 화살표 -->
  <!-- VM1 & VM2 -> Hypervisor -->
  <path d="M140,180 L140,205 L230,205 L230,230" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <path d="M320,180 L320,205 L230,205" stroke="#2563eb" stroke-width="1.5" fill="none"/>

  <!-- Hypervisor -> Hardware -->
  <path d="M230,280 L230,330" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>


  <!-- ==================== TYPE 2 ==================== -->
  <!-- VM 1 (Left) -->
  <rect x="500" y="130" width="120" height="40" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="560" y="154" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">VM</text>

  <!-- VM 2 (Right) -->
  <rect x="680" y="130" width="120" height="40" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="740" y="154" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">VM</text>

  <!-- Hypervisor -->
  <rect x="500" y="210" width="300" height="40" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="234" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Hypervisor</text>

  <!-- Host OS -->
  <rect x="500" y="290" width="300" height="40" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="314" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Host OS</text>

  <!-- Hardware -->
  <rect x="500" y="370" width="300" height="40" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="394" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Hardware</text>

  <!-- Type 2 연결선 및 화살표 -->
  <!-- VM1 & VM2 -> Hypervisor -->
  <path d="M560,170 L560,190 L650,190 L650,210" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M740,170 L740,190 L650,190" stroke="#7c3aed" stroke-width="1.5" fill="none"/>

  <!-- Hypervisor -> Host OS -->
  <path d="M650,250 L650,290" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Host OS -> Hardware -->
  <path d="M650,330 L650,370" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
</svg>