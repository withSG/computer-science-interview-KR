<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">VM과 컨테이너의 계층 비교</title>
  <desc id="d">VM은 VM마다 Guest OS 커널을 부팅해 하이퍼바이저 위에서 돌고, 컨테이너는 App과 라이브러리만 가진 채 호스트 커널 하나를 공유한다. 그래서 syscall 경로도 VM은 Guest 커널을 거쳐 하이퍼바이저로, 컨테이너는 호스트 커널로 직행한다.</desc>
  <rect width="880" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 두 열 패널 -->
  <rect x="24" y="24" width="404" height="552" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="452" y="24" width="404" height="552" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 머리말 + 요점 -->
  <text x="226" y="60" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">VM 방식</text>
  <rect x="120" y="74" width="212" height="32" rx="16" fill="#fef3c7"/>
  <text x="226" y="96" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">커널이 VM 개수만큼 존재</text>

  <text x="654" y="60" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">컨테이너 방식</text>
  <rect x="582" y="74" width="144" height="32" rx="16" fill="#fef3c7"/>
  <text x="654" y="96" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">커널은 딱 하나</text>

  <!-- ===================== VM 방식 ===================== -->
  <!-- VM A -->
  <rect x="44" y="126" width="170" height="40" fill="#dbeafe"/>
  <rect x="44" y="166" width="170" height="40" fill="#eff6ff"/>
  <rect x="44" y="206" width="170" height="60" fill="#fef3c7"/>
  <line x1="44" y1="166" x2="214" y2="166" stroke="#93c5fd" stroke-width="1"/>
  <line x1="44" y1="206" x2="214" y2="206" stroke="#93c5fd" stroke-width="1"/>
  <rect x="44" y="126" width="170" height="140" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="129" y="152" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">App A</text>
  <text x="129" y="191" font-size="15" fill="#1f2937" text-anchor="middle">라이브러리</text>
  <text x="129" y="230" font-size="15" fill="#1f2937" text-anchor="middle">Guest OS</text>
  <text x="129" y="252" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">커널 O</text>

  <!-- VM B -->
  <rect x="238" y="126" width="170" height="40" fill="#dbeafe"/>
  <rect x="238" y="166" width="170" height="40" fill="#eff6ff"/>
  <rect x="238" y="206" width="170" height="60" fill="#fef3c7"/>
  <line x1="238" y1="166" x2="408" y2="166" stroke="#93c5fd" stroke-width="1"/>
  <line x1="238" y1="206" x2="408" y2="206" stroke="#93c5fd" stroke-width="1"/>
  <rect x="238" y="126" width="170" height="140" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="323" y="152" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">App B</text>
  <text x="323" y="191" font-size="15" fill="#1f2937" text-anchor="middle">라이브러리</text>
  <text x="323" y="230" font-size="15" fill="#1f2937" text-anchor="middle">Guest OS</text>
  <text x="323" y="252" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">커널 O</text>

  <!-- 가상 HW 연결 -->
  <line x1="129" y1="266" x2="129" y2="316" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="323" y1="266" x2="323" y2="316" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="296" font-size="15" fill="#4b5563" text-anchor="middle">가상 HW</text>

  <!-- Hypervisor / Host OS / Hardware -->
  <rect x="44" y="316" width="364" height="44" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="344" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Hypervisor</text>
  <line x1="226" y1="360" x2="226" y2="376" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="44" y="376" width="364" height="44" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="404" font-size="16" fill="#111827" text-anchor="middle">Host OS</text>
  <line x1="226" y1="420" x2="226" y2="436" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="44" y="436" width="364" height="44" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="464" font-size="16" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- ===================== 컨테이너 방식 ===================== -->
  <!-- 컨테이너 A -->
  <rect x="472" y="126" width="170" height="40" fill="#dbeafe"/>
  <rect x="472" y="166" width="170" height="40" fill="#eff6ff"/>
  <line x1="472" y1="166" x2="642" y2="166" stroke="#93c5fd" stroke-width="1"/>
  <rect x="472" y="126" width="170" height="80" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="557" y="152" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">App A</text>
  <text x="557" y="191" font-size="15" fill="#1f2937" text-anchor="middle">라이브러리</text>

  <!-- 컨테이너 B -->
  <rect x="666" y="126" width="170" height="40" fill="#dbeafe"/>
  <rect x="666" y="166" width="170" height="40" fill="#eff6ff"/>
  <line x1="666" y1="166" x2="836" y2="166" stroke="#93c5fd" stroke-width="1"/>
  <rect x="666" y="126" width="170" height="80" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="751" y="152" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">App B</text>
  <text x="751" y="191" font-size="15" fill="#1f2937" text-anchor="middle">라이브러리</text>

  <!-- syscall 연결 -->
  <line x1="557" y1="206" x2="557" y2="256" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="751" y1="206" x2="751" y2="256" stroke="#6b7280" stroke-width="1.5"/>
  <text x="567" y="236" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">syscall</text>
  <text x="761" y="236" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">syscall</text>

  <!-- 컨테이너 런타임 -->
  <rect x="472" y="256" width="364" height="60" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="654" y="281" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">컨테이너 런타임</text>
  <text x="654" y="303" font-size="15" fill="#374151" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">(containerd / runc)</text>
  <line x1="654" y1="316" x2="654" y2="332" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Host OS 커널 (1개) -->
  <rect x="472" y="332" width="364" height="88" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="654" y="366" font-size="18" font-weight="bold" fill="#92400e" text-anchor="middle">Host OS 커널 (1개)</text>
  <text x="654" y="394" font-size="15" fill="#1f2937" text-anchor="middle">namespace + cgroup</text>
  <line x1="654" y1="420" x2="654" y2="436" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Hardware -->
  <rect x="472" y="436" width="364" height="44" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="654" y="464" font-size="16" fill="#111827" text-anchor="middle">Hardware</text>

  <!-- ===================== syscall 경로 ===================== -->
  <line x1="44" y1="500" x2="408" y2="500" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="472" y1="500" x2="836" y2="500" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- VM: syscall → Guest 커널 → 하이퍼바이저 -->
  <rect x="44" y="518" width="80" height="36" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="84" y="541" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">syscall</text>
  <line x1="128" y1="536" x2="152" y2="536" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="156" y="518" width="104" height="36" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="208" y="541" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">Guest 커널</text>
  <line x1="264" y1="536" x2="288" y2="536" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="292" y="518" width="116" height="36" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="350" y="541" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">하이퍼바이저</text>

  <!-- 컨테이너: syscall → 호스트 커널 (직행) -->
  <rect x="472" y="518" width="80" height="36" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="512" y="541" font-size="15" fill="#1e3a8a" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">syscall</text>
  <line x1="556" y1="536" x2="580" y2="536" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="584" y="518" width="104" height="36" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="636" y="541" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">호스트 커널</text>
  <text x="700" y="541" font-size="15" font-weight="bold" fill="#047857">(직행)</text>
</svg>
