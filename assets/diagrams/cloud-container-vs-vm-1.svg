<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="880" height="610" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">컨테이너 vs VM 비교</title>
  <desc id="d">VM 방식과 컨테이너 방식의 구조적 차이점 및 커널 동작 방식 비교 다이어그램</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="610" fill="#ffffff"/>

  <!-- 영역 구분 배경 면 -->
  <rect x="24" y="24" width="404" height="480" fill="#f8fafc" rx="8" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="452" y="24" width="404" height="480" fill="#f8fafc" rx="8" stroke="#cbd2d9" stroke-width="1"/>

  <!-- 섹션 헤더 (제목) -->
  <text x="226" y="55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">VM 방식</text>
  <text x="654" y="55" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">컨테이너 방식</text>

  <!-- ==================== 왼쪽: VM 방식 ==================== -->
  <!-- App A & B -->
  <rect x="54" y="80" width="160" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="134" y="100.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">App A</text>

  <rect x="238" y="80" width="160" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="318" y="100.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">App B</text>

  <!-- 라이브러리 -->
  <rect x="54" y="112" width="160" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="134" y="132.5" font-size="13" fill="#1f2933" text-anchor="middle">라이브러리</text>

  <rect x="238" y="112" width="160" height="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="318" y="132.5" font-size="13" fill="#1f2933" text-anchor="middle">라이브러리</text>

  <!-- Guest OS & 커널 O -->
  <rect x="54" y="144" width="160" height="50" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="134" y="163.5" font-size="13" fill="#1f2933" text-anchor="middle">Guest OS</text>
  <text x="134" y="181.5" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">커널 O</text>

  <rect x="238" y="144" width="160" height="50" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="318" y="163.5" font-size="13" fill="#1f2933" text-anchor="middle">Guest OS</text>
  <text x="318" y="181.5" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">커널 O</text>

  <!-- 연결선: Guest OS -> Hypervisor (가상 HW) -->
  <path d="M134,194 L134,260 L226,260" stroke="#52606d" stroke-width="1.5" fill="none"/>
  <path d="M318,194 L318,260 L226,260" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 가상 HW 라벨 배경 & 텍스트 -->
  <rect x="94" y="217" width="80" height="20" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="134" y="231" font-size="11.5" fill="#52606d" text-anchor="middle">가상 HW</text>

  <!-- Hypervisor -->
  <rect x="84" y="260" width="284" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="226" y="286.5" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Hypervisor</text>

  <!-- 연결선: Hypervisor -> Host OS -->
  <path d="M226,304 L226,334" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Host OS (VM) -->
  <rect x="84" y="334" width="284" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="226" y="360.5" font-size="14" fill="#1f2933" text-anchor="middle">Host OS</text>

  <!-- 연결선: Host OS -> Hardware -->
  <path d="M226,378 L226,408" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Hardware (VM) -->
  <rect x="84" y="408" width="284" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="226" y="434.5" font-size="14" fill="#1f2933" text-anchor="middle">Hardware</text>


  <!-- ==================== 오른쪽: 컨테이너 방식 ==================== -->
  <!-- App A & B -->
  <rect x="482" y="80" width="160" height="32" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="562" y="100.5" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">App A</text>

  <rect x="666" y="80" width="160" height="32" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="746" y="100.5" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">App B</text>

  <!-- 라이브러리 -->
  <rect x="482" y="112" width="160" height="32" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="562" y="132.5" font-size="13" fill="#1f2933" text-anchor="middle">라이브러리</text>

  <rect x="666" y="112" width="160" height="32" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="746" y="132.5" font-size="13" fill="#1f2933" text-anchor="middle">라이브러리</text>

  <!-- 연결선: 컨테이너 -> 컨테이너 런타임 (syscall) -->
  <path d="M562,144 L562,210 L654,210" stroke="#059669" stroke-width="1.5" fill="none"/>
  <path d="M746,144 L746,210 L654,210" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- syscall 라벨 배경 & 텍스트 -->
  <rect x="582" y="167" width="60" height="20" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="612" y="181" font-size="11.5" fill="#059669" text-anchor="middle">syscall</text>

  <rect x="766" y="167" width="60" height="20" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
  <text x="796" y="181" font-size="11.5" fill="#059669" text-anchor="middle">syscall</text>

  <!-- 컨테이너 런타임 -->
  <rect x="512" y="210" width="284" height="50" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="654" y="230.5" font-size="13" fill="#1f2933" text-anchor="middle">컨테이너 런타임</text>
  <text x="654" y="248.5" font-size="11.5" fill="#52606d" text-anchor="middle">(containerd / runc)</text>

  <!-- 연결선: 컨테이너 런타임 -> Host OS 커널 -->
  <path d="M654,260 L654,286" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Host OS 커널 (1개) -->
  <rect x="512" y="286" width="284" height="60" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="654" y="307.5" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">Host OS 커널 (1개)</text>
  <text x="654" y="328.5" font-size="13" fill="#1f2933" text-anchor="middle">namespace + cgroup</text>

  <!-- 연결선: Host OS 커널 -> Hardware -->
  <path d="M654,346 L654,408" stroke="#52606d" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Hardware (컨테이너) -->
  <rect x="512" y="408" width="284" height="44" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="654" y="434.5" font-size="14" fill="#1f2933" text-anchor="middle">Hardware</text>


  <!-- ==================== 하단 요약 설명 ==================== -->
  <line x1="24" y1="520" x2="856" y2="520" stroke="#cbd2d9" stroke-width="1"/>

  <!-- VM 요약 -->
  <text x="54" y="550" font-size="13" font-weight="bold" fill="#1f2933">커널이 VM 개수만큼 존재</text>
  <text x="54" y="575" font-size="13" fill="#52606d">syscall → Guest 커널 → 하이퍼바이저</text>

  <!-- 컨테이너 요약 -->
  <text x="482" y="550" font-size="13" font-weight="bold" fill="#059669">커널은 딱 하나</text>
  <text x="482" y="575" font-size="13" fill="#059669">syscall → 호스트 커널 (직행)</text>
</svg>