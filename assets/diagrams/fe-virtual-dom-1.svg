<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상태 변경부터 화면 반영까지</title>
  <desc id="d">setState 호출 뒤 렌더, 비교·재조정, 커밋 세 단계를 거쳐 브라우저 레이아웃·페인트로 이어지는 흐름. 오른쪽 열은 각 단계에서 실제 DOM의 상태로, 1·2단계에서는 아직 그대로이고 3단계 커밋에서 처음으로 바뀐다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- 시작: setState 호출 -->
  <rect x="219" y="24" width="170" height="40" rx="20" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="304" y="50" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setState</tspan> 호출</text>

  <!-- 오른쪽 열 머리: 실제 DOM -->
  <text x="740" y="50" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">실제 DOM</text>
  <line x1="636" y1="66" x2="844" y2="66" stroke="#9ca3af" stroke-width="1.5"/>

  <line x1="304" y1="64" x2="304" y2="93" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 1. 렌더 -->
  <rect x="24" y="96" width="560" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="60" cy="126" r="16" fill="#1d4ed8"/>
  <text x="60" y="132" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="90" y="133" font-size="19" font-weight="bold" fill="#1e3a8a">렌더 (Render)</text>
  <text x="90" y="164" font-size="16" fill="#1f2937">컴포넌트 함수를 다시 호출해</text>
  <text x="90" y="188" font-size="16" fill="#1f2937">새 Virtual DOM 트리를 만든다</text>

  <line x1="584" y1="151" x2="621" y2="151" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah-gray)"/>
  <rect x="624" y="96" width="232" height="110" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="157" font-size="17" fill="#4b5563" text-anchor="middle">아직 그대로</text>

  <line x1="304" y1="206" x2="304" y2="235" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 2. 비교 + 재조정 -->
  <rect x="24" y="238" width="560" height="110" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="60" cy="268" r="16" fill="#1d4ed8"/>
  <text x="60" y="274" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="90" y="275" font-size="19" font-weight="bold" fill="#1e3a8a">비교 (Diffing) + 재조정 (Reconciliation)</text>
  <text x="90" y="306" font-size="16" fill="#1f2937">이전 트리 ↔ 새 트리를 맞대어 보고</text>
  <text x="90" y="330" font-size="16" fill="#1f2937">"무엇을 바꿔야 하는지" 목록을 만든다</text>

  <line x1="584" y1="293" x2="621" y2="293" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah-gray)"/>
  <rect x="624" y="238" width="232" height="110" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="299" font-size="17" fill="#4b5563" text-anchor="middle">아직 그대로</text>

  <line x1="304" y1="348" x2="304" y2="377" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 3. 커밋 -->
  <rect x="24" y="380" width="560" height="90" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <circle cx="60" cy="410" r="16" fill="#047857"/>
  <text x="60" y="416" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="90" y="417" font-size="19" font-weight="bold" fill="#065f46">커밋 (Commit)</text>
  <text x="90" y="448" font-size="16" fill="#1f2937">계산된 변경 목록만 실제 DOM에 일괄 적용</text>

  <line x1="584" y1="425" x2="621" y2="425" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <rect x="624" y="380" width="232" height="90" rx="10" fill="#047857" stroke="#047857" stroke-width="1.5"/>
  <text x="740" y="419" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">여기서 처음으로</text>
  <text x="740" y="443" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">실제 DOM이 바뀐다</text>

  <line x1="304" y1="470" x2="304" y2="499" stroke="#374151" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 끝: 브라우저 -->
  <rect x="149" y="502" width="310" height="44" rx="22" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="304" y="530" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">브라우저가 레이아웃·페인트 수행</text>
</svg>
