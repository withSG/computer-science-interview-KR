<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">상태 변경부터 화면 반영까지</title>
  <desc id="d">React의 상태 변경부터 Virtual DOM 렌더링, Diffing 및 Reconciliation, Commit을 거쳐 브라우저 레이아웃 및 페인트까지의 과정을 설명하는 다이어그램</desc>
  <rect width="880" height="680" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <!-- Start State -->
  <rect x="350" y="30" width="180" height="36" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="440" y="52.55" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">setState 호출</text>
  <path d="M440,66 L440,100" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- Step 1: Render -->
  <rect x="120" y="100" width="640" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144" y="134.9" font-size="14" font-weight="bold" fill="#2563eb">1. 렌더 (Render)</text>
  <text x="160" y="164.55" font-size="13" fill="#1f2933">컴포넌트 함수를 다시 호출해</text>
  <text x="160" y="186.55" font-size="13" fill="#1f2933">새 Virtual DOM 트리를 만든다</text>
  <text x="160" y="208.2" font-size="12" fill="#52606d">→ 실제 DOM은 아직 그대로</text>
  <path d="M440,230 L440,264" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <!-- Step 2: Reconciliation -->
  <rect x="120" y="264" width="640" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144" y="298.9" font-size="14" font-weight="bold" fill="#2563eb">2. 비교 (Diffing) + 재조정 (Reconciliation)</text>
  <text x="160" y="328.55" font-size="13" fill="#1f2933">이전 트리 ↔ 새 트리를 맞대어 보고</text>
  <text x="160" y="350.55" font-size="13" fill="#1f2933">"무엇을 바꿔야 하는지" 목록을 만든다</text>
  <text x="160" y="372.2" font-size="12" fill="#52606d">→ 실제 DOM은 아직 그대로</text>
  <path d="M440,394 L440,428" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>
  <!-- Step 3: Commit -->
  <rect x="120" y="428" width="640" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="144" y="462.9" font-size="14" font-weight="bold" fill="#059669">3. 커밋 (Commit)</text>
  <text x="160" y="492.55" font-size="13" fill="#1f2933">계산된 변경 목록만 실제 DOM에 일괄 적용</text>
  <text x="160" y="520.375" font-size="12.5" font-weight="bold" fill="#059669">→ 여기서 처음으로 실제 DOM이 바뀐다</text>
  <path d="M440,558 L440,592" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <!-- End State -->
  <rect x="290" y="592" width="300" height="42" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="617.55" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">브라우저가 레이아웃·페인트 수행</text>
</svg>