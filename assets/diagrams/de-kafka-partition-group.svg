<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">토픽 파티션과 컨슈머 그룹의 두 층 배정 구조</title>
  <desc id="d">카프카 토픽 orders의 파티션 P0, P1, P2에서 각 컨슈머 그룹 billing과 analytics로 데이터가 배정되고 흐르는 구조를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="440" y="36" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">토픽 파티션과 컨슈머 그룹의 두 층 배정 구조</text>

  <!-- TOPIC BOX -->
  <rect x="40" y="60" width="800" height="170" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="60" y="88" font-size="14" font-weight="600" fill="#1f2933">Topic: orders (동일한 길이의 Append-Only 로그)</text>

  <!-- PARTITION 0 -->
  <text x="60" y="118" font-size="13" font-weight="500" fill="#1f2933">P0</text>
  <rect x="90" y="105" width="600" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <line x1="210" y1="105" x2="210" y2="125" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="330" y1="105" x2="330" y2="125" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="450" y1="105" x2="450" y2="125" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="570" y1="105" x2="570" y2="125" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="450" y="105" width="240" height="20" fill="#fef2f2" opacity="0.6"/>
  <line x1="450" y1="100" x2="450" y2="130" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="450" cy="100" r="3" fill="#7c3aed"/>
  <line x1="570" y1="100" x2="570" y2="130" stroke="#2563eb" stroke-width="2"/>
  <circle cx="570" cy="100" r="3" fill="#2563eb"/>

  <!-- PARTITION 1 -->
  <text x="60" y="158" font-size="13" font-weight="500" fill="#1f2933">P1</text>
  <rect x="90" y="145" width="600" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <line x1="210" y1="145" x2="210" y2="165" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="330" y1="145" x2="330" y2="165" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="450" y1="145" x2="450" y2="165" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="570" y1="145" x2="570" y2="165" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="330" y="145" width="360" height="20" fill="#fef2f2" opacity="0.6"/>
  <line x1="330" y1="140" x2="330" y2="170" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="330" cy="140" r="3" fill="#7c3aed"/>
  <line x1="570" y1="140" x2="570" y2="170" stroke="#2563eb" stroke-width="2"/>
  <circle cx="570" cy="140" r="3" fill="#2563eb"/>

  <!-- PARTITION 2 -->
  <text x="60" y="198" font-size="13" font-weight="500" fill="#1f2933">P2</text>
  <rect x="90" y="185" width="600" height="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <line x1="210" y1="185" x2="210" y2="205" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="330" y1="185" x2="330" y2="205" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="450" y1="185" x2="450" y2="205" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="570" y1="185" x2="570" y2="205" stroke="#cbd2d9" stroke-width="1"/>
  <rect x="450" y="185" width="240" height="20" fill="#fef2f2" opacity="0.6"/>
  <line x1="450" y1="180" x2="450" y2="210" stroke="#2563eb" stroke-width="2"/>
  <circle cx="450" cy="180" r="3" fill="#2563eb"/>
  <line x1="570" y1="180" x2="570" y2="210" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="570" cy="180" r="3" fill="#7c3aed"/>

  <text x="700" y="158" font-size="11.5" fill="#52606d">← 최신 오프셋 (LEO)</text>

  <!-- CONSUMER GROUP 1: billing -->
  <rect x="40" y="270" width="380" height="190" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="298" font-size="14" font-weight="600" fill="#7c3aed">Consumer Group "billing"</text>
  <text x="60" y="318" font-size="11.5" fill="#52606d">용도: 결제 처리 (파티션 작업 분담 = 스케일 아웃)</text>

  <rect x="60" y="335" width="160" height="105" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="140" y="360" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Consumer C1</text>
  <text x="140" y="388" font-size="11.5" fill="#52606d" text-anchor="middle">배정 파티션:</text>
  <text x="140" y="410" font-size="13" font-weight="500" fill="#7c3aed" text-anchor="middle">P0, P1</text>

  <rect x="240" y="335" width="160" height="105" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="320" y="360" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Consumer C2</text>
  <text x="320" y="388" font-size="11.5" fill="#52606d" text-anchor="middle">배정 파티션:</text>
  <text x="320" y="410" font-size="13" font-weight="500" fill="#7c3aed" text-anchor="middle">P2</text>

  <!-- CONSUMER GROUP 2: analytics -->
  <rect x="460" y="270" width="380" height="190" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="298" font-size="14" font-weight="600" fill="#2563eb">Consumer Group "analytics"</text>
  <text x="480" y="318" font-size="11.5" fill="#52606d">용도: 데이터 분석 (독립 소비 = 단일 컨슈머)</text>

  <rect x="570" y="335" width="160" height="105" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="650" y="360" font-size="13" font-weight="600" fill="#1f2933" text-anchor="middle">Consumer C1</text>
  <text x="650" y="388" font-size="11.5" fill="#52606d" text-anchor="middle">배정 파티션:</text>
  <text x="650" y="410" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">P0, P1, P2</text>

  <!-- FLOW ARROWS (Partition -> Consumer) -->
  <path d="M 120,205 Q 120,240 140,335" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <path d="M 330,205 Q 260,250 160,335" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>
  <path d="M 570,205 Q 460,250 320,335" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-purple)"/>

  <path d="M 210,205 Q 400,240 630,335" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <path d="M 450,205 Q 560,240 650,335" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>
  <path d="M 650,205 Q 670,250 670,335" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- LEGEND -->
  <rect x="40" y="475" width="800" height="30" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="60" y1="490" x2="80" y2="490" stroke="#1f2933" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <text x="90" y="494" font-size="11" fill="#1f2933">파티션 데이터 흐름 및 배정 (Partition → Consumer)</text>

  <line x1="330" y1="485" x2="330" y2="495" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="330" cy="485" r="2.5" fill="#7c3aed"/>
  <text x="340" y="494" font-size="11" fill="#1f2933">billing 커밋 오프셋</text>

  <line x1="470" y1="485" x2="470" y2="495" stroke="#2563eb" stroke-width="2"/>
  <circle cx="470" cy="485" r="2.5" fill="#2563eb"/>
  <text x="480" y="494" font-size="11" fill="#1f2933">analytics 커밋 오프셋</text>

  <rect x="620" y="483" width="15" height="12" fill="#fef2f2" stroke="#dc2626" stroke-width="0.5"/>
  <text x="640" y="494" font-size="11" fill="#1f2933">컨슈머 랙 (최신 오프셋과의 차이)</text>

  <text x="440" y="525" font-size="11.5" fill="#52606d" text-anchor="middle">결론: 그룹 내에서는 파티션을 분할 소비하고, 그룹 간에는 오프셋을 독립적으로 관리하며 동일 데이터 전체를 개별 소비한다.</text>
</svg>