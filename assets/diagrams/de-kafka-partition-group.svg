<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">토픽 파티션과 컨슈머 그룹의 두 층 배정 구조</title>
  <desc id="d">토픽 orders의 파티션 P0, P1, P2를 billing 그룹은 C1(P0, P1)과 C2(P2)가 나눠 갖고, analytics 그룹은 C1 하나가 전부 읽는다. 두 그룹은 파티션마다 커밋 오프셋을 따로 관리하고, 최신 오프셋과의 차이가 컨슈머 랙이다.</desc>
  <rect width="880" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ===== 토픽 ===== -->
  <rect x="24" y="24" width="832" height="264" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="48" y="58" font-size="19" font-weight="700" fill="#111827">Topic: orders</text>
  <text x="182" y="58" font-size="15" fill="#4b5563">(P0, P1, P2 · append-only 로그)</text>

  <!-- 파티션 로그 막대: 칸 8개, 오른쪽 끝(x=576)이 최신 오프셋 -->
  <text x="64" y="126" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P0</text>
  <rect x="96" y="108" width="480" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <path d="M156,108 V132 M216,108 V132 M276,108 V132 M336,108 V132 M396,108 V132 M456,108 V132 M516,108 V132" stroke="#cbd5e1" stroke-width="1"/>

  <text x="64" y="186" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P1</text>
  <rect x="96" y="168" width="480" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <path d="M156,168 V192 M216,168 V192 M276,168 V192 M336,168 V192 M396,168 V192 M456,168 V192 M516,168 V192" stroke="#cbd5e1" stroke-width="1"/>

  <text x="64" y="246" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P2</text>
  <rect x="96" y="228" width="480" height="24" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <path d="M156,228 V252 M216,228 V252 M276,228 V252 M336,228 V252 M396,228 V252 M456,228 V252 M516,228 V252" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 최신 오프셋 (LEO) -->
  <line x1="576" y1="96" x2="576" y2="268" stroke="#111827" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- billing 커밋 오프셋 (막대 위 ▼, 보라) -->
  <path d="M456,108 V132 M276,168 V192 M396,228 V252" stroke="#6d28d9" stroke-width="3"/>
  <polygon points="449,95 463,95 456,106" fill="#6d28d9"/>
  <polygon points="269,155 283,155 276,166" fill="#6d28d9"/>
  <polygon points="389,215 403,215 396,226" fill="#6d28d9"/>

  <!-- analytics 커밋 오프셋 (막대 아래 ▲, 파랑) -->
  <path d="M336,108 V132 M516,168 V192 M456,228 V252" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="329,145 343,145 336,134" fill="#1d4ed8"/>
  <polygon points="509,205 523,205 516,194" fill="#1d4ed8"/>
  <polygon points="449,265 463,265 456,254" fill="#1d4ed8"/>

  <!-- 예: P0에서 billing의 랙 -->
  <path d="M458,92 V86 H574 V92" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="516" y="78" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">billing 랙</text>

  <!-- 범례 -->
  <polygon points="612,112 626,112 619,123" fill="#6d28d9"/>
  <text x="636" y="123" font-size="15" fill="#111827">billing 커밋 오프셋</text>
  <polygon points="612,155 626,155 619,144" fill="#1d4ed8"/>
  <text x="636" y="155" font-size="15" fill="#111827">analytics 커밋 오프셋</text>
  <line x1="619" y1="172" x2="619" y2="192" stroke="#111827" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="636" y="187" font-size="15" fill="#111827">최신 오프셋 (LEO)</text>
  <path d="M612,220 V213 H626 V220" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="636" y="221" font-size="15" font-weight="700" fill="#111827">컨슈머 랙</text>
  <text x="636" y="243" font-size="15" fill="#4b5563">= 최신 오프셋과의 차이</text>

  <!-- ===== 두 그룹으로 갈라짐 ===== -->
  <path d="M440,288 V308 H228 V334" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M440,308 H652 V334" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== billing 그룹 ===== -->
  <rect x="24" y="338" width="404" height="218" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <polygon points="44,357 58,357 51,368" fill="#6d28d9"/>
  <text x="66" y="369" font-size="18" font-weight="700" fill="#6d28d9">Consumer Group "billing"</text>
  <text x="44" y="394" font-size="14" fill="#4b5563">용도: 결제 처리</text>

  <rect x="44" y="408" width="200" height="76" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="144" y="432" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">C1</text>
  <rect x="80" y="444" width="56" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="108" y="464" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">P0</text>
  <rect x="152" y="444" width="56" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="180" y="464" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">P1</text>

  <rect x="260" y="408" width="148" height="76" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="334" y="432" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">C2</text>
  <rect x="306" y="444" width="56" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="334" y="464" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">P2</text>

  <text x="44" y="516" font-size="16" font-weight="700" fill="#111827">각 파티션을 나눠 갖는다</text>
  <text x="44" y="540" font-size="15" fill="#4b5563">(작업 분담 = 스케일 아웃)</text>

  <!-- ===== analytics 그룹 ===== -->
  <rect x="452" y="338" width="404" height="218" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="472,368 486,368 479,357" fill="#1d4ed8"/>
  <text x="494" y="369" font-size="18" font-weight="700" fill="#1d4ed8">Consumer Group "analytics"</text>
  <text x="472" y="394" font-size="14" fill="#4b5563">용도: 데이터 분석</text>

  <rect x="472" y="408" width="252" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="598" y="432" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">C1</text>
  <rect x="498" y="444" width="56" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="526" y="464" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">P0</text>
  <rect x="570" y="444" width="56" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="598" y="464" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">P1</text>
  <rect x="642" y="444" width="56" height="28" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
  <text x="670" y="464" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">P2</text>

  <text x="472" y="516" font-size="16" font-weight="700" fill="#111827">다른 그룹은 독립적으로 전체를 읽는다</text>
  <text x="472" y="540" font-size="15" fill="#4b5563">(오프셋도 따로 관리)</text>
</svg>
