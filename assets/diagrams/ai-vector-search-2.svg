<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">완전 탐색 계산량</title>
  <desc id="d">벡터 1,000만 개 × 1,024 차원에서 거리 계산 1회는 곱셈·덧셈 약 1,024회, 전체 1회 검색은 약 100억 회 연산이고, 초당 100건의 검색 요청이 들어오면 초당 1조 회가 되어 감당할 방법이 없습니다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 전제 -->
  <rect x="28" y="24" width="824" height="54" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="58" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">벡터 1,000만 개 × 1,024 차원</text>

  <!-- ① 거리 계산 1회 -->
  <rect x="28" y="112" width="216" height="170" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="54" cy="141" r="13" fill="#1d4ed8"/>
  <text x="54" y="146" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="147" font-size="17" font-weight="bold" fill="#111827">거리 계산 1회</text>
  <line x1="44" y1="166" x2="228" y2="166" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="136" y="208" font-size="16" fill="#374151" text-anchor="middle">곱셈·덧셈</text>
  <text x="136" y="244" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">약 1,024회</text>

  <!-- 화살표 1 -->
  <line x1="252" y1="197" x2="322" y2="197" stroke="#374151" stroke-width="2.5" marker-end="url(#mk)"/>
  <text x="288" y="185" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">× 1,000만</text>
  <text x="288" y="222" font-size="14" fill="#4b5563" text-anchor="middle">벡터 수</text>

  <!-- ② 전체 1회 검색 -->
  <rect x="332" y="112" width="216" height="170" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="358" cy="141" r="13" fill="#1d4ed8"/>
  <text x="358" y="146" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="380" y="147" font-size="17" font-weight="bold" fill="#111827">전체 1회 검색</text>
  <line x1="348" y1="166" x2="532" y2="166" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="440" y="208" font-size="16" fill="#374151" text-anchor="middle">1,000만 × 1,024</text>
  <text x="440" y="244" font-size="22" font-weight="bold" fill="#111827" text-anchor="middle">≈ 100억 회 연산</text>

  <!-- 화살표 2 -->
  <line x1="556" y1="197" x2="626" y2="197" stroke="#374151" stroke-width="2.5" marker-end="url(#mk)"/>
  <text x="592" y="185" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">× 100건</text>
  <text x="592" y="222" font-size="14" fill="#4b5563" text-anchor="middle">초당 요청</text>

  <!-- ③ 초당 100건 요청 -->
  <rect x="636" y="112" width="216" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="662" cy="141" r="13" fill="#b91c1c"/>
  <text x="662" y="146" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="684" y="147" font-size="17" font-weight="bold" fill="#111827">초당 100건 요청</text>
  <line x1="652" y1="166" x2="836" y2="166" stroke="#fecaca" stroke-width="1.5"/>
  <text x="744" y="208" font-size="16" fill="#374151" text-anchor="middle">100억 × 100</text>
  <text x="744" y="248" font-size="28" font-weight="bold" fill="#b91c1c" text-anchor="middle">초당 1조 회</text>

  <!-- 결론 -->
  <line x1="744" y1="290" x2="744" y2="320" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#mr)"/>
  <rect x="28" y="328" width="824" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="363" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">이 규모에서는 감당할 방법이 없다</text>
</svg>
