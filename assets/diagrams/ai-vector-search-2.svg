<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">계산량</title>
  <desc id="d">벡터 1,000만 개 x 1,024 차원의 연산량 폭증과 완전 탐색의 한계를 나타낸 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 메인 박스 (계산량 연산 분석) -->
  <rect x="140" y="30" width="600" height="230" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>

  <!-- 항목 1: 기본 정보 -->
  <rect x="170" y="55" width="540" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="440" y="82" fill="#1f2933" font-size="14" font-weight="bold" text-anchor="middle">벡터 1,000만 개 × 1,024 차원</text>

  <!-- 항목 2: 거리 계산 1회 -->
  <text x="190" y="134" fill="#52606d" font-size="13" font-weight="bold">거리 계산 1회</text>
  <text x="310" y="134" fill="#1f2933" font-size="13">=</text>
  <text x="330" y="134" fill="#1f2933" font-size="13">곱셈·덧셈 약 1,024회</text>

  <!-- 항목 3: 전체 1회 검색 -->
  <text x="190" y="184" fill="#52606d" font-size="13" font-weight="bold">전체 1회 검색</text>
  <text x="310" y="184" fill="#1f2933" font-size="13">=</text>
  <text x="330" y="184" fill="#1f2933" font-size="13">1,000만 × 1,024 ≈ 100억 회 연산</text>

  <!-- 항목 4: 질문 (초당 100건) -->
  <rect x="140" y="285" width="600" height="45" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="312" fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle">초당 100건의 검색 요청이 들어온다면?</text>

  <!-- 화살표 -->
  <path d="M440,330 L440,360" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- 결론 / 강조 (한계) -->
  <rect x="140" y="365" width="600" height="45" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="392" fill="#dc2626" font-size="14" font-weight="bold" text-anchor="middle">→ 초당 1조 회. 이 규모에서는 감당할 방법이 없다</text>
</svg>