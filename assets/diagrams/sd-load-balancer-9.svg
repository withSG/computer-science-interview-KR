<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Active-Standby 로드 밸런서의 VIP 넘기기</title>
  <desc id="d">평상시에는 LB-A(Active)가 VIP 203.0.113.10을 보유하고 LB-B(Standby)가 A 신호를 감시한다. A가 죽으면 B가 신호 끊김을 감지해 VIP를 가져오므로 클라이언트는 같은 주소로 계속 접속하지만, 전환 순간 짧은 끊김은 있다.</desc>
  <rect width="880" height="570" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ar-big" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- 머리 -->
  <rect x="24" y="22" width="172" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="110" y="45" font-size="17" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Active-Standby</text>
  <text x="212" y="46" font-size="18" font-weight="bold" fill="#111827">가상 IP(VIP)를 넘긴다</text>

  <!-- ===== 패널 1: 평상시 ===== -->
  <rect x="24" y="72" width="394" height="364" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="42" y="104" font-size="17" font-weight="bold" fill="#111827">평상시</text>

  <rect x="153" y="120" width="136" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="221" y="146" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">클라이언트</text>
  <path d="M221,160 V186" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="121" y="190" width="200" height="40" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="221" y="216" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VIP 203.0.113.10</text>

  <path d="M221,230 V250 H125 V278" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar-blue)"/>
  <path d="M221,250 H317 V278" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-gray)"/>

  <rect x="38" y="284" width="174" height="136" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="125" y="312" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">LB-A (Active)</text>
  <text x="125" y="338" font-size="15" fill="#374151" text-anchor="middle">실제 10.0.0.11</text>
  <rect x="77" y="352" width="96" height="28" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="125" y="371" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VIP 보유</text>

  <rect x="230" y="284" width="174" height="136" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="317" y="312" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">LB-B (Standby)</text>
  <text x="317" y="338" font-size="15" fill="#374151" text-anchor="middle">실제 10.0.0.12</text>
  <text x="317" y="371" font-size="15" fill="#4b5563" text-anchor="middle">"A 신호 감시 중"</text>

  <!-- 패널 사이 화살표 -->
  <path d="M426,254 H452" fill="none" stroke="#4b5563" stroke-width="4" marker-end="url(#ar-big)"/>

  <!-- ===== 패널 2: A가 죽으면 ===== -->
  <rect x="462" y="72" width="394" height="364" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="104" font-size="17" font-weight="bold" fill="#b91c1c">A가 죽으면</text>

  <rect x="591" y="120" width="136" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="659" y="146" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">클라이언트</text>
  <path d="M659,160 V186" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="559" y="190" width="200" height="40" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="659" y="216" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VIP 203.0.113.10</text>

  <path d="M659,230 V250 H755 V278" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ar-blue)"/>
  <path d="M659,250 H563 V278" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-gray)"/>

  <rect x="476" y="284" width="174" height="136" rx="8" fill="#f3f4f6" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="563" y="312" font-size="16" font-weight="bold" fill="#4b5563" text-anchor="middle">LB-A</text>
  <text x="563" y="338" font-size="15" fill="#4b5563" text-anchor="middle">실제 10.0.0.11</text>
  <rect x="521" y="352" width="84" height="28" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
  <text x="563" y="371" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">① 죽음</text>

  <rect x="668" y="284" width="174" height="136" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="755" y="312" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">LB-B</text>
  <text x="755" y="338" font-size="15" fill="#374151" text-anchor="middle">실제 10.0.0.12</text>
  <text x="755" y="366" font-size="15" fill="#111827" text-anchor="middle">② 신호 끊김을 감지</text>
  <rect x="685" y="380" width="140" height="28" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="755" y="399" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">③ VIP를 가져옴</text>

  <!-- 결과 -->
  <rect x="24" y="456" width="832" height="88" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="44" y="490" font-size="16" fill="#111827">→ 클라이언트는 여전히 <tspan font-weight="bold">203.0.113.10</tspan>으로 접속. <tspan font-weight="bold" fill="#1d4ed8">주소가 바뀌지 않는다</tspan></text>
  <text x="44" y="524" font-size="16" font-weight="bold" fill="#b45309">→ 전환 순간 짧은 끊김은 있다</text>
</svg>
