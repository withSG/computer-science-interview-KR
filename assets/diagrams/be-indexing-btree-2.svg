<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">B-Tree와 B+Tree 비교</title>
  <desc id="d">B-Tree는 모든 노드에 데이터가 있어 범위 검색 때 트리를 오르내려야 한다. B+Tree는 내부 노드에 길잡이 키만 두고 실제 데이터(또는 데이터 위치)는 리프에만 두며, 리프끼리 양방향 연결 리스트로 이어져 있다.</desc>
  <rect width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- ===== B-Tree ===== -->
  <rect x="24" y="20" width="832" height="230" rx="8" fill="#fafafa" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="54" font-size="17" fill="#111827"><tspan font-size="20" font-weight="bold">B-Tree</tspan> : 모든 노드에 데이터가 있다</text>

  <!-- 루트 -->
  <rect x="220" y="76" width="180" height="46" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="255" y="105" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">50</text>
  <rect x="277" y="85" width="66" height="28" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
  <text x="310" y="104" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">데이터</text>
  <text x="368" y="104" font-size="17" font-weight="bold" fill="#4b5563" text-anchor="middle">…</text>

  <!-- 자식 -->
  <line x1="260" y1="124" x2="202" y2="176" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah-gray)"/>
  <line x1="360" y1="124" x2="418" y2="176" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah-gray)"/>

  <rect x="120" y="180" width="140" height="46" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="152" y="209" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">20</text>
  <rect x="176" y="189" width="66" height="28" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
  <text x="209" y="208" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">데이터</text>

  <rect x="360" y="180" width="140" height="46" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="392" y="209" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">70</text>
  <rect x="416" y="189" width="66" height="28" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
  <text x="449" y="208" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">데이터</text>

  <!-- 범위 검색 경로: 20 → 50 → 70 -->
  <line x1="247" y1="177" x2="292" y2="128" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>
  <line x1="328" y1="128" x2="373" y2="177" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>

  <line x1="540" y1="203" x2="576" y2="203" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>
  <text x="590" y="197" font-size="16" font-weight="bold" fill="#b45309">범위 검색을 하려면</text>
  <text x="590" y="219" font-size="16" font-weight="bold" fill="#b45309">트리를 오르내려야 한다</text>

  <!-- ===== B+Tree ===== -->
  <rect x="24" y="270" width="832" height="270" rx="8" fill="#fafafa" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="304" font-size="17" fill="#111827"><tspan font-size="20" font-weight="bold">B+Tree</tspan> : 데이터는 리프에만, 리프끼리 연결 리스트로 이어져 있다</text>

  <!-- 내부 노드 -->
  <rect x="220" y="328" width="180" height="46" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <rect x="236" y="336" width="66" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="269" y="357" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">50</text>
  <rect x="318" y="336" width="66" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="351" y="357" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">120</text>

  <line x1="406" y1="351" x2="432" y2="351" stroke="#6b7280" stroke-width="1.2"/>
  <text x="442" y="357" font-size="16" fill="#111827">내부 노드에는 <tspan font-weight="bold">"길잡이 키"</tspan>만 있다</text>

  <!-- 리프로 가는 포인터 -->
  <line x1="250" y1="376" x2="146" y2="426" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah-gray)"/>
  <line x1="310" y1="376" x2="310" y2="426" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah-gray)"/>
  <line x1="370" y1="376" x2="474" y2="426" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah-gray)"/>

  <!-- 리프 -->
  <rect x="80" y="430" width="120" height="46" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/>
  <text x="140" y="459" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">20<tspan dx="10">30</tspan></text>
  <rect x="250" y="430" width="120" height="46" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/>
  <text x="310" y="459" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">50<tspan dx="10">70</tspan></text>
  <rect x="420" y="430" width="120" height="46" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/>
  <text x="480" y="459" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">120<tspan dx="10">…</tspan></text>

  <!-- 리프끼리 양방향 연결 -->
  <line x1="206" y1="453" x2="244" y2="453" stroke="#047857" stroke-width="2" marker-start="url(#ah-green)" marker-end="url(#ah-green)"/>
  <line x1="376" y1="453" x2="414" y2="453" stroke="#047857" stroke-width="2" marker-start="url(#ah-green)" marker-end="url(#ah-green)"/>

  <line x1="552" y1="446" x2="584" y2="446" stroke="#047857" stroke-width="2" marker-start="url(#ah-green)" marker-end="url(#ah-green)"/>
  <text x="594" y="452" font-size="16" font-weight="bold" fill="#047857">리프끼리 양방향 연결</text>
  <text x="594" y="476" font-size="15" fill="#374151">범위 검색은 옆으로 훑기만 하면 된다</text>

  <!-- 데이터 위치 -->
  <path d="M80,486 V494 H540 V486" fill="none" stroke="#047857" stroke-width="1.5"/>
  <text x="310" y="520" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">실제 데이터(또는 데이터 위치)는 여기에만 있다</text>
</svg>
