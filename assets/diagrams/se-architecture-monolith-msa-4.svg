<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">잘못된 기준: 기술 계층</title>
  <desc id="d">안티패턴 계층별로 나누기: 컨트롤러 서비스, 비즈니스 서비스, DAO 서비스가 순차적으로 화살표로 연결된 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="220" fill="#ffffff"/>
  
  <!-- Outer Container / Area for Anti-pattern -->
  <rect x="24" y="20" width="832" height="180" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <!-- Section Title -->
  <text x="44" y="52" font-size="16" font-weight="bold" fill="#dc2626">안티패턴 - 계층별로 나누기</text>
  
  <!-- Service Box 1: 컨트롤러 서비스 -->
  <rect x="54" y="80" width="220" height="80" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="164" y="125" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">컨트롤러 서비스</text>
  
  <!-- Arrow 1 -> 2 -->
  <path d="M274,120 L328,120" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  
  <!-- Service Box 2: 비즈니스 서비스 -->
  <rect x="330" y="80" width="220" height="80" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="125" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">비즈니스 서비스</text>
  
  <!-- Arrow 2 -> 3 -->
  <path d="M550,120 L604,120" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  
  <!-- Service Box 3: DAO 서비스 -->
  <rect x="606" y="80" width="220" height="80" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="716" y="125" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">DAO 서비스</text>
</svg>