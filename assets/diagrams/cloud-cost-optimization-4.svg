<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Spot 중단 예고 후 정리 절차</title>
  <desc id="d">중단 예고를 감지하면 약 2분 안에 등록 해제, 메시지 수신 중단, 체크포인트 저장, 드레이닝, 정상 종료의 다섯 단계를 차례로 밟습니다.</desc>
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>

  <!-- 시간 괄호: 예고 감지부터 종료까지 약 2분 -->
  <path d="M114,30 H104 V452 H114" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="92" y="236" font-size="18" font-weight="bold" fill="#111827" text-anchor="end">약 2분</text>
  <text x="92" y="259" font-size="15" fill="#4b5563" text-anchor="end">안에 완료</text>

  <!-- 단계 사이 연결 화살표 -->
  <path d="M148,76 V124" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gray)"/>
  <path d="M148,166 V194" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gray)"/>
  <path d="M148,236 V264" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gray)"/>
  <path d="M148,306 V334" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gray)"/>
  <path d="M148,376 V404" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-gray)"/>

  <!-- 0. 중단 예고 감지 -->
  <rect x="184" y="30" width="672" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="148" cy="56" r="18" fill="#b91c1c"/>
  <text x="148" y="62" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <text x="204" y="62" font-size="18" font-weight="bold" fill="#b91c1c">중단 예고 감지</text>

  <!-- 1 -->
  <rect x="184" y="120" width="672" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="148" cy="146" r="18" fill="#1d4ed8"/>
  <text x="148" y="152" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="204" y="152" font-size="16" fill="#111827">로드 밸런서 대상 그룹에서 스스로 등록 해제</text>
  <path d="M540,146 H578" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="590" y="152" font-size="16" font-weight="bold" fill="#1d4ed8">새 요청 유입 차단</text>

  <!-- 2 -->
  <rect x="184" y="190" width="672" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="148" cy="216" r="18" fill="#1d4ed8"/>
  <text x="148" y="222" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="204" y="222" font-size="16" fill="#111827"><tspan fill="#4b5563">큐 컨슈머라면</tspan> 새 메시지 수신 중단</text>

  <!-- 3 -->
  <rect x="184" y="260" width="672" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="148" cy="286" r="18" fill="#1d4ed8"/>
  <text x="148" y="292" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="204" y="292" font-size="16" fill="#111827">처리 중이던 작업의 체크포인트를 외부 저장소에 저장</text>

  <!-- 4 -->
  <rect x="184" y="330" width="672" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="148" cy="356" r="18" fill="#1d4ed8"/>
  <text x="148" y="362" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="204" y="362" font-size="16" fill="#111827">진행 중 요청이 끝날 때까지 대기 <tspan fill="#4b5563">(드레이닝)</tspan></text>

  <!-- 5 -->
  <rect x="184" y="400" width="672" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="148" cy="426" r="18" fill="#047857"/>
  <text x="148" y="432" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="204" y="432" font-size="16" font-weight="bold" fill="#047857">정상 종료</text>
</svg>
