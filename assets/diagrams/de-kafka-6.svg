<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">파티션 수와 컨슈머 수에 따른 배정</title>
  <desc id="d">파티션 3개에 컨슈머 2개면 C1이 파티션 두 개를 맡고, 컨슈머 4개면 C4는 배정받을 파티션이 없어 유휴 상태가 된다. 병렬성의 상한은 파티션 수다.</desc>
  <rect width="880" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ===== 왼쪽: 파티션 3개 / 컨슈머 2개 ===== -->
  <rect x="24" y="24" width="404" height="356" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="226" y="58" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">파티션 3개 / 컨슈머 2개</text>
  <text x="100" y="92" font-size="14" fill="#4b5563" text-anchor="middle">파티션</text>
  <text x="320" y="92" font-size="14" fill="#4b5563" text-anchor="middle">컨슈머 (같은 그룹)</text>

  <rect x="56" y="108" width="88" height="48" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="100" y="138" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P0</text>
  <rect x="56" y="172" width="88" height="48" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="100" y="202" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P1</text>
  <rect x="56" y="236" width="88" height="48" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="100" y="266" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P2</text>

  <line x1="146" y1="132" x2="228" y2="132" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="146" y1="196" x2="228" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="146" y1="260" x2="228" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="232" y="108" width="176" height="112" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="320" y="158" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">C1</text>
  <text x="320" y="184" font-size="15" fill="#92400e" text-anchor="middle">(C1이 두 개를 담당)</text>
  <rect x="232" y="236" width="176" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="320" y="266" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">C2</text>

  <!-- ===== 오른쪽: 파티션 3개 / 컨슈머 4개 ===== -->
  <rect x="452" y="24" width="404" height="356" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="654" y="58" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">파티션 3개 / 컨슈머 4개</text>
  <text x="528" y="92" font-size="14" fill="#4b5563" text-anchor="middle">파티션</text>
  <text x="748" y="92" font-size="14" fill="#4b5563" text-anchor="middle">컨슈머 (같은 그룹)</text>

  <rect x="484" y="108" width="88" height="48" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="528" y="138" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P0</text>
  <rect x="484" y="172" width="88" height="48" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="528" y="202" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P1</text>
  <rect x="484" y="236" width="88" height="48" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="528" y="266" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">P2</text>

  <line x1="574" y1="132" x2="656" y2="132" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="574" y1="196" x2="656" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="574" y1="260" x2="656" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="660" y="108" width="176" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="748" y="138" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">C1</text>
  <rect x="660" y="172" width="176" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="748" y="202" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">C2</text>
  <rect x="660" y="236" width="176" height="48" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="748" y="266" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">C3</text>
  <rect x="660" y="300" width="176" height="60" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="748" y="324" font-size="17" font-weight="700" fill="#4b5563" text-anchor="middle">C4</text>
  <text x="748" y="348" font-size="15" fill="#b91c1c" text-anchor="middle">배정 없음 (유휴)</text>

  <!-- ===== 요점 ===== -->
  <rect x="24" y="400" width="832" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="434" font-size="17" fill="#111827" text-anchor="middle"><tspan font-weight="700" fill="#1d4ed8">병렬성의 상한 = 파티션 수</tspan>  ·  파티션 하나는 그룹 안에서 정확히 한 컨슈머에게만 배정</text>
</svg>
