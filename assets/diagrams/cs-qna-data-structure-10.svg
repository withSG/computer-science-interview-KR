<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">차수 3 B-Tree(2-3 B-Tree) 구조 예시</title>
  <desc id="d">루트 노드 [30 | 70]이 키 두 개로 자식 세 개를 가리킨다. 30보다 작은 키는 [10 | 20], 30과 70 사이는 [40 | 60], 70보다 큰 키는 [80 | 90] 리프로 가며, 세 리프는 모두 같은 레벨에 있다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- 레벨 띠 -->
  <rect x="24" y="24" width="832" height="88" rx="10" fill="#f3f4f6"/>
  <rect x="24" y="224" width="832" height="88" rx="10" fill="#f3f4f6"/>
  <text x="44" y="74" font-size="16" font-weight="bold" fill="#111827">루트 노드</text>
  <text x="44" y="262" font-size="16" font-weight="bold" fill="#111827">리프 노드</text>
  <text x="44" y="286" font-size="15" fill="#4b5563">모두 같은 레벨</text>

  <!-- 간선: 키 사이의 자식 포인터 -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="458" y1="96" x2="284.9" y2="235"/>
    <line x1="520" y1="96" x2="520" y2="235"/>
    <line x1="582" y1="96" x2="755.1" y2="235"/>
  </g>

  <!-- 간선 라벨: 자식이 맡는 키 범위 -->
  <text x="344" y="174" text-anchor="end" font-size="16" fill="#374151">키 &lt; 30</text>
  <text x="532" y="174" font-size="16" fill="#374151">30 &lt; 키 &lt; 70</text>
  <text x="696" y="174" font-size="16" fill="#374151">키 &gt; 70</text>

  <!-- 루트 [30 | 70] -->
  <rect x="450" y="40" width="140" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <line x1="520" y1="40" x2="520" y2="96" stroke="#2563eb" stroke-width="2"/>
  <text x="485" y="76" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">30</text>
  <text x="555" y="76" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">70</text>

  <!-- 리프 [10 | 20] -->
  <rect x="210" y="240" width="140" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <line x1="280" y1="240" x2="280" y2="296" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="276" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">10</text>
  <text x="315" y="276" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">20</text>

  <!-- 리프 [40 | 60] -->
  <rect x="450" y="240" width="140" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <line x1="520" y1="240" x2="520" y2="296" stroke="#2563eb" stroke-width="2"/>
  <text x="485" y="276" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">40</text>
  <text x="555" y="276" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">60</text>

  <!-- 리프 [80 | 90] -->
  <rect x="690" y="240" width="140" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <line x1="760" y1="240" x2="760" y2="296" stroke="#2563eb" stroke-width="2"/>
  <text x="725" y="276" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">80</text>
  <text x="795" y="276" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">90</text>

  <!-- 포인터 출발점 -->
  <g fill="#1d4ed8">
    <circle cx="458" cy="96" r="4"/>
    <circle cx="520" cy="96" r="4"/>
    <circle cx="582" cy="96" r="4"/>
  </g>

  <!-- 요약 -->
  <rect x="24" y="332" width="832" height="44" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="360" text-anchor="middle" font-size="15" fill="#111827"><tspan font-weight="bold">차수 M = 3</tspan>  →  노드당 키 최대 2개(M−1), 자식 최대 3개(M) · 노드 안의 키는 오름차순</text>
</svg>
