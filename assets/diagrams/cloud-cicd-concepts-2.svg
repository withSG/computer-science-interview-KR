<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CD의 두 얼굴 — Delivery와 Deployment</title>
  <desc id="d">CI, Continuous Delivery, Continuous Deployment의 단계별 과정과 사람의 승인 여부 차이를 나타낸 다이어그램</desc>
  <rect width="880" height="520" fill="#ffffff"/>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Section 1: CI -->
  <rect x="20" y="20" width="840" height="135" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="40" y="48" font-size="16" font-weight="bold" fill="#1f2933">CI (Continuous Integration)</text>

  <!-- CI Steps -->
  <rect x="40" y="65" width="70" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="75" y="86" font-size="13" text-anchor="middle" fill="#1f2933">커밋</text>

  <path d="M110,82 L135,82" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="135" y="65" width="70" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="170" y="86" font-size="13" text-anchor="middle" fill="#1f2933">빌드</text>

  <path d="M205,82 L230,82" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <rect x="230" y="65" width="80" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="270" y="86" font-size="13" text-anchor="middle" fill="#1f2933">테스트</text>

  <!-- CI Arrow & Note -->
  <path d="M270,122 L270,99" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <text x="280" y="132" font-size="11.5" fill="#52606d">여기까지가 CI. 산출물은 "이 커밋은 안전하다"는 신호</text>

  <!-- Section 2: Continuous Delivery -->
  <rect x="20" y="175" width="840" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="40" y="203" font-size="16" font-weight="bold" fill="#1f2933">Continuous Delivery (지속적 전달)</text>

  <!-- CD Delivery Steps -->
  <rect x="40" y="220" width="65" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="72.5" y="241" font-size="13" text-anchor="middle" fill="#1f2933">커밋</text>

  <path d="M105,237 L125,237" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="125" y="220" width="65" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="157.5" y="241" font-size="13" text-anchor="middle" fill="#1f2933">빌드</text>

  <path d="M190,237 L210,237" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="210" y="220" width="75" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="247.5" y="241" font-size="13" text-anchor="middle" fill="#1f2933">테스트</text>

  <path d="M285,237 L305,237" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="305" y="220" width="85" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="347.5" y="241" font-size="13" text-anchor="middle" fill="#1f2933">아티팩트</text>

  <path d="M390,237 L410,237" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="410" y="220" width="105" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="462.5" y="241" font-size="13" text-anchor="middle" fill="#1f2933">스테이징 배포</text>

  <path d="M515,237 L535,237" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="535" y="220" width="100" height="34" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="585" y="241" font-size="13" text-anchor="middle" font-weight="bold" fill="#d97706">[사람 승인]</text>

  <path d="M635,237 L655,237" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <rect x="655" y="220" width="65" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="687.5" y="241" font-size="13" text-anchor="middle" fill="#1f2933">운영</text>

  <!-- CD Delivery Arrow & Note -->
  <path d="M585,297 L585,254" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <text x="585" y="307" font-size="11.5" text-anchor="middle" fill="#52606d">릴리스 시점만 사람이 정한다</text>

  <!-- Section 3: Continuous Deployment -->
  <rect x="20" y="345" width="840" height="150" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="40" y="373" font-size="16" font-weight="bold" fill="#1f2933">Continuous Deployment (지속적 배포)</text>

  <!-- CD Deployment Steps -->
  <rect x="40" y="390" width="65" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="72.5" y="411" font-size="13" text-anchor="middle" fill="#1f2933">커밋</text>

  <path d="M105,407 L130,407" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="130" y="390" width="65" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="162.5" y="411" font-size="13" text-anchor="middle" fill="#1f2933">빌드</text>

  <path d="M195,407 L220,407" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="220" y="390" width="75" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="257.5" y="411" font-size="13" text-anchor="middle" fill="#1f2933">테스트</text>

  <path d="M295,407 L320,407" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="320" y="390" width="85" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="362.5" y="411" font-size="13" text-anchor="middle" fill="#1f2933">아티팩트</text>

  <path d="M405,407 L430,407" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="430" y="390" width="80" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="470" y="411" font-size="13" text-anchor="middle" fill="#1f2933">스테이징</text>

  <path d="M510,407 L535,407" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <rect x="535" y="390" width="150" height="34" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
  <text x="610" y="411" font-size="13" text-anchor="middle" fill="#1f2933">운영 (승인 없음)</text>

  <!-- CD Deployment Arrow & Note -->
  <path d="M610,467 L610,424" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <text x="610" y="477" font-size="11.5" text-anchor="middle" fill="#52606d">사람 대신 자동 검증과 자동 롤백이 지킨다</text>
</svg>