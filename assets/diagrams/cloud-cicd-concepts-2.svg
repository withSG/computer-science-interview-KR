<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CI와 두 가지 CD 비교</title>
  <desc id="d">CI는 커밋, 빌드, 테스트까지이며 산출물은 이 커밋이 안전하다는 신호다. Continuous Delivery는 아티팩트와 스테이징 배포 뒤 사람 승인을 거쳐 운영에 나가며 릴리스 시점만 사람이 정한다. Continuous Deployment는 승인 없이 운영까지 가고, 사람 대신 자동 검증과 자동 롤백이 지킨다.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- ── CI ── -->
  <rect x="24" y="20" width="832" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="44" y="50" font-size="17" font-weight="bold" fill="#1d4ed8">CI (Continuous Integration)</text>

  <rect x="41" y="66" width="64" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="73" y="94" font-size="16" fill="#111827" text-anchor="middle">커밋</text>
  <line x1="105" y1="88" x2="135" y2="88" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="136" y="66" width="64" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="168" y="94" font-size="16" fill="#111827" text-anchor="middle">빌드</text>
  <line x1="200" y1="88" x2="230" y2="88" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="231" y="66" width="78" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="270" y="94" font-size="16" fill="#111827" text-anchor="middle">테스트</text>

  <!-- CI 끝 -->
  <line x1="326" y1="60" x2="326" y2="116" stroke="#1d4ed8" stroke-width="3"/>
  <text x="344" y="83" font-size="16" font-weight="bold" fill="#1d4ed8">여기까지가 CI</text>
  <text x="344" y="107" font-size="15" fill="#374151">산출물은 "이 커밋은 안전하다"는 신호</text>

  <!-- ── Continuous Delivery ── -->
  <rect x="24" y="150" width="832" height="164" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="44" y="180" font-size="17" font-weight="bold" fill="#047857">Continuous Delivery (지속적 전달)</text>

  <rect x="41" y="196" width="64" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="73" y="224" font-size="16" fill="#111827" text-anchor="middle">커밋</text>
  <line x1="105" y1="218" x2="135" y2="218" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="136" y="196" width="64" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="168" y="224" font-size="16" fill="#111827" text-anchor="middle">빌드</text>
  <line x1="200" y1="218" x2="230" y2="218" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="231" y="196" width="78" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="270" y="224" font-size="16" fill="#111827" text-anchor="middle">테스트</text>
  <line x1="309" y1="218" x2="339" y2="218" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="340" y="196" width="94" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="387" y="224" font-size="16" fill="#111827" text-anchor="middle">아티팩트</text>
  <line x1="434" y1="218" x2="464" y2="218" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="465" y="196" width="128" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="529" y="224" font-size="16" fill="#111827" text-anchor="middle">스테이징 배포</text>
  <line x1="593" y1="218" x2="623" y2="218" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="624" y="196" width="104" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <text x="676" y="224" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">사람 승인</text>
  <line x1="728" y1="218" x2="758" y2="218" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="759" y="196" width="80" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="799" y="224" font-size="16" fill="#111827" text-anchor="middle">운영</text>

  <line x1="676" y1="272" x2="676" y2="244" stroke="#b45309" stroke-width="1.8" marker-end="url(#ah-amber)"/>
  <text x="676" y="294" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">릴리스 시점만 사람이 정한다</text>

  <!-- ── Continuous Deployment ── -->
  <rect x="24" y="332" width="832" height="164" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="44" y="362" font-size="17" font-weight="bold" fill="#6d28d9">Continuous Deployment (지속적 배포)</text>

  <rect x="41" y="378" width="64" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="73" y="406" font-size="16" fill="#111827" text-anchor="middle">커밋</text>
  <line x1="105" y1="400" x2="135" y2="400" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="136" y="378" width="64" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="168" y="406" font-size="16" fill="#111827" text-anchor="middle">빌드</text>
  <line x1="200" y1="400" x2="230" y2="400" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="231" y="378" width="78" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="270" y="406" font-size="16" fill="#111827" text-anchor="middle">테스트</text>
  <line x1="309" y1="400" x2="339" y2="400" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="340" y="378" width="94" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="387" y="406" font-size="16" fill="#111827" text-anchor="middle">아티팩트</text>
  <line x1="434" y1="400" x2="464" y2="400" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <rect x="465" y="378" width="128" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="529" y="406" font-size="16" fill="#111827" text-anchor="middle">스테이징</text>
  <line x1="593" y1="400" x2="758" y2="400" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="676" y="388" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">승인 없음</text>
  <rect x="759" y="378" width="80" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text x="799" y="406" font-size="16" fill="#111827" text-anchor="middle">운영</text>

  <line x1="676" y1="454" x2="676" y2="408" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#ah-purple)"/>
  <text x="676" y="476" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">사람 대신 자동 검증과 자동 롤백이 지킨다</text>
</svg>
