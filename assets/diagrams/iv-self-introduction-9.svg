<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">강점 구성 요소 비교</title>
  <desc id="d">검증 불가능한 약한 주장과 행동 서술, 사건, 직무 연결로 이루어진 강한 강점 구성을 비교하는 다이어그램</desc>
  <defs>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- Top Bad Case Row -->
  <g transform="translate(40, 40)">
    <!-- "꼼꼼합니다" -->
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="110" y="29" fill="#dc2626" font-size="14" font-weight="bold" text-anchor="middle">"꼼꼼합니다"</text>

    <!-- Arrow Top -->
    <path d="M220,25 L310,25" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

    <!-- 검증 불가. 정보량 0 -->
    <rect x="320" y="0" width="480" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="560" y="29" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">검증 불가. 정보량 0</text>
  </g>

  <!-- Bottom Good Case Row 1: "로그부터 보고 범위를 좁힙니다" -->
  <g transform="translate(40, 120)">
    <!-- "로그부터 보고 범위를 좁힙니다" -->
    <rect x="0" y="0" width="260" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="130" y="29" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">"로그부터 보고 범위를 좁힙니다"</text>

    <!-- Arrow Bottom -->
    <path d="M260,25 L310,25" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- 행동 서술 -->
    <rect x="320" y="0" width="480" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="560" y="29" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">행동 서술</text>
  </g>

  <!-- Bottom Good Case Row 2: + "결제 실패 원인이 캐시 만료 주기였던 걸 찾아낸 적이 있습니다" -->
  <g transform="translate(40, 185)">
    <!-- + "결제 실패 원인이 캐시 만료 주기였던 걸 찾아낸 적이 있습니다" -->
    <rect x="0" y="0" width="500" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="250" y="29" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">+ "결제 실패 원인이 캐시 만료 주기였던 걸 찾아낸 적이 있습니다"</text>

    <!-- Arrow Middle -->
    <path d="M500,25 L550,25" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- 사건 -->
    <rect x="560" y="0" width="240" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="680" y="29" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">사건</text>
  </g>

  <!-- Bottom Good Case Row 3: + "장애 대응이 잦은 팀이라면 바로 쓰일 것 같습니다" -->
  <g transform="translate(40, 250)">
    <!-- + "장애 대응이 잦은 팀이라면 바로 쓰일 것 같습니다" -->
    <rect x="0" y="0" width="440" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="220" y="29" fill="#2563eb" font-size="13" font-weight="bold" text-anchor="middle">+ "장애 대응이 잦은 팀이라면 바로 쓰일 것 같습니다"</text>

    <!-- Arrow Bottom Sub -->
    <path d="M440,25 L490,25" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

    <!-- 직무 연결 -->
    <rect x="500" y="0" width="300" height="50" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="650" y="29" fill="#1f2933" font-size="13" font-weight="bold" text-anchor="middle">직무 연결</text>
  </g>
</svg>