<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">강점을 세 조각으로 말하기</title>
  <desc id="d">"꼼꼼합니다" 같은 단어 하나는 검증할 수 없어 정보량이 0이고, 행동 서술에 사건과 직무 연결을 더해야 강점이 전달된다는 것을 보여준다.</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 단어 하나 -->
  <text x="32" y="46" font-size="16" font-weight="bold" fill="#4b5563">단어 하나로 끝낸 강점</text>
  <rect x="32" y="62" width="250" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="157" y="96" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">"꼼꼼합니다"</text>
  <line x1="290" y1="90" x2="346" y2="90" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="358" y="96" font-size="18" font-weight="bold" fill="#b91c1c">검증 불가. 정보량 0</text>

  <!-- 세 조각 -->
  <text x="32" y="172" font-size="16" font-weight="bold" fill="#4b5563">세 조각으로 만든 강점</text>

  <rect x="32" y="188" width="176" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="120" y="220" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">행동 서술</text>
  <rect x="224" y="188" width="624" height="52" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="244" y="220" font-size="16" fill="#111827">"로그부터 보고 범위를 좁힙니다"</text>

  <text x="120" y="264" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">+</text>

  <rect x="32" y="272" width="176" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="120" y="304" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">사건</text>
  <rect x="224" y="272" width="624" height="52" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="244" y="304" font-size="16" fill="#111827">"결제 실패 원인이 캐시 만료 주기였던 걸 찾아낸 적이 있습니다"</text>

  <text x="120" y="348" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">+</text>

  <rect x="32" y="356" width="176" height="52" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="120" y="388" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">직무 연결</text>
  <rect x="224" y="356" width="624" height="52" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="244" y="388" font-size="16" fill="#111827">"장애 대응이 잦은 팀이라면 바로 쓰일 것 같습니다"</text>
</svg>
