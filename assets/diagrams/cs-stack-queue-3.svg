<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">동작</title>
  <desc id="d">A, B, C를 넣은 뒤 dequeue 한 번 수행 시 front와 rear 포인터의 변화를 보여주는 큐 동작 다이어그램</desc>
  <rect width="880" height="260" fill="#ffffff"/>

  <defs>
    <!-- Dark Ink Arrow Pointer for Front/Rear -->
    <marker id="a-ink" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/>
    </marker>
    <!-- Blue Arrow for Dequeue Operation -->
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title/Header Line -->
  <text x="40" y="38" font-size="14" font-weight="bold" fill="#1f2933">A, B, C 를 넣은 뒤 dequeue 한 번</text>

  <!-- ================= LEFT QUEUE STATE ================= -->
  <!-- Pointer Labels (Left Queue) -->
  <text x="130" y="74" font-size="13" fill="#1f2933" text-anchor="middle">front</text>
  <text x="250" y="74" font-size="13" fill="#1f2933" text-anchor="middle">rear</text>

  <!-- Pointer Arrows (Left Queue) -->
  <path d="M 130,80 L 130,94" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M 250,80 L 250,94" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Left Queue Cells Container (Outer Box) -->
  <g transform="translate(100, 100)">
    <!-- Cell 1: 'A' -->
    <rect x="0" y="0" width="60" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="30" y="24" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>

    <!-- Cell 2: 'B' -->
    <rect x="60" y="0" width="60" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="90" y="24" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>

    <!-- Cell 3: 'C' -->
    <rect x="120" y="0" width="60" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="150" y="24" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>
  </g>

  <!-- ================= MIDDLE OPERATION (DEQUEUE) ================= -->
  <!-- Dequeue Operation Arrow -->
  <path d="M 340,120 L 450,120" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <text x="395" y="110" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">dequeue</text>
  <text x="395" y="142" font-size="13" fill="#52606d" text-anchor="middle">A 반환</text>

  <!-- ================= RIGHT QUEUE STATE ================= -->
  <!-- Pointer Labels (Right Queue) -->
  <text x="570" y="74" font-size="13" fill="#1f2933" text-anchor="middle">front</text>
  <text x="630" y="74" font-size="13" fill="#1f2933" text-anchor="middle">rear</text>

  <!-- Pointer Arrows (Right Queue) -->
  <path d="M 570,80 L 570,94" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <path d="M 630,80 L 630,94" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- Right Queue Cells Container (Outer Box) -->
  <g transform="translate(480, 100)">
    <!-- Cell 1: Empty (after Dequeue) -->
    <rect x="0" y="0" width="60" height="40" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Cell 2: 'B' -->
    <rect x="60" y="0" width="60" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="90" y="24" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text>

    <!-- Cell 3: 'C' -->
    <rect x="120" y="0" width="60" height="40" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="150" y="24" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">C</text>
  </g>

  <!-- ================= FOOTNOTE TEXT ================= -->
  <text x="440" y="210" font-size="13" fill="#52606d" text-anchor="middle">넣는 쪽과 빼는 쪽이 반대 끝이라 서로 간섭하지 않는다</text>
</svg>