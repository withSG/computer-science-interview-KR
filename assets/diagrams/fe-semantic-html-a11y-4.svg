<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">스크린 리더의 세 가지 목록</title>
  <desc id="d">스크린 리더는 마크업에서 자동으로 만든 랜드마크 목록(banner, navigation, main, complementary, contentinfo), 제목 목록(h1 채용 공고, h2 자격 요건·우대 사항·전형 절차), 링크 목록(지원하기, 공유하기, 목록으로)으로 페이지를 훑고, 랜드마크 목록에서 main으로 바로 점프한다.</desc>
  <rect width="880" height="360" fill="#ffffff"/>

  <!-- 랜드마크 목록 -->
  <rect x="24" y="24" width="320" height="268" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M25,68 V34 Q25,25 34,25 H334 Q343,25 343,34 V68 Z" fill="#f3f4f6"/>
  <line x1="24" y1="68" x2="344" y2="68" stroke="#d1d5db" stroke-width="1"/>
  <text x="44" y="53" font-size="17" font-weight="700" fill="#111827">랜드마크 목록</text>

  <text x="48" y="106" font-size="16" fill="#111827">banner</text>
  <text x="190" y="106" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;header&gt;</text>
  <text x="48" y="146" font-size="16" fill="#111827">navigation</text>
  <text x="190" y="146" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;nav&gt;</text>

  <rect x="36" y="162" width="296" height="36" rx="6" fill="#1d4ed8"/>
  <text x="48" y="186" font-size="16" font-weight="700" fill="#ffffff">main</text>
  <text x="190" y="186" font-size="15" fill="#dbeafe" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;main&gt;</text>
  <text x="320" y="186" text-anchor="end" font-size="16" font-weight="700" fill="#ffffff">← 점프</text>

  <text x="48" y="226" font-size="16" fill="#111827">complementary</text>
  <text x="190" y="226" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;aside&gt;</text>
  <text x="48" y="266" font-size="16" fill="#111827">contentinfo</text>
  <text x="190" y="266" font-size="15" fill="#4b5563" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;footer&gt;</text>

  <!-- 제목 목록 -->
  <rect x="368" y="24" width="248" height="268" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M369,68 V34 Q369,25 378,25 H606 Q615,25 615,34 V68 Z" fill="#f3f4f6"/>
  <line x1="368" y1="68" x2="616" y2="68" stroke="#d1d5db" stroke-width="1"/>
  <text x="388" y="53" font-size="17" font-weight="700" fill="#111827">제목 목록</text>

  <text x="388" y="106" font-size="16" fill="#111827"><tspan font-size="15" font-weight="700" fill="#1d4ed8" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">h1</tspan><tspan font-weight="700"> 채용 공고</tspan></text>
  <text x="410" y="146" font-size="16" fill="#111827"><tspan font-size="15" font-weight="700" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">h2</tspan> 자격 요건</text>
  <text x="410" y="186" font-size="16" fill="#111827"><tspan font-size="15" font-weight="700" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">h2</tspan> 우대 사항</text>
  <text x="410" y="226" font-size="16" fill="#111827"><tspan font-size="15" font-weight="700" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">h2</tspan> 전형 절차</text>

  <!-- 링크 목록 -->
  <rect x="640" y="24" width="216" height="268" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M641,68 V34 Q641,25 650,25 H846 Q855,25 855,34 V68 Z" fill="#f3f4f6"/>
  <line x1="640" y1="68" x2="856" y2="68" stroke="#d1d5db" stroke-width="1"/>
  <text x="660" y="53" font-size="17" font-weight="700" fill="#111827">링크 목록</text>

  <text x="660" y="106" font-size="16" fill="#1d4ed8" text-decoration="underline">지원하기</text>
  <text x="660" y="146" font-size="16" fill="#1d4ed8" text-decoration="underline">공유하기</text>
  <text x="660" y="186" font-size="16" fill="#1d4ed8" text-decoration="underline">목록으로</text>

  <!-- 요점 -->
  <text x="440" y="330" text-anchor="middle" font-size="16" fill="#111827"><tspan font-weight="700">세 목록 모두 마크업에서 자동 생성</tspan><tspan fill="#374151"> — </tspan><tspan fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">&lt;div&gt;</tspan><tspan fill="#374151">만 쓴 페이지는 셋 다 비어 있다</tspan></text>
</svg>
