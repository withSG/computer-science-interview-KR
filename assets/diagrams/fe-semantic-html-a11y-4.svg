<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340"
     font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">스크린 리더의 목록 단축키 탐색 및 점프 기능</title>
  <desc id="d">스크린 리더가 시맨틱 HTML 요소로부터 자동으로 생성하는 랜드마크 목록, 제목 목록, 링크 목록과 목록 간 점프를 나타낸 다이어그램입니다.</desc>
  <rect width="880" height="340" fill="#ffffff"/>

  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 1. 랜드마크 목록 -->
  <g id="landmark-list">
    <!-- Header Box -->
    <rect x="50" y="30" width="220" height="40" rx="4" fill="#2563eb"/>
    <text x="160" y="55.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">[랜드마크 목록]</text>
    
    <!-- Body Box -->
    <rect x="50" y="70" width="220" height="230" rx="4" fill="#eff6ff" stroke="#9aa5b1" stroke-width="1.5"/>
    
    <!-- Items -->
    <text x="74" y="114.5" font-size="13" font-weight="500" fill="#1f2933">banner</text>
    <text x="74" y="154.5" font-size="13" font-weight="500" fill="#1f2933">navigation</text>
    
    <!-- Highlighted item: main -->
    <rect x="62" y="177" width="196" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="74" y="197.5" font-size="13" font-weight="bold" fill="#7c3aed">main</text>
    
    <text x="74" y="240.5" font-size="13" font-weight="500" fill="#1f2933">complementary</text>
    <text x="74" y="280.5" font-size="13" font-weight="500" fill="#1f2933">contentinfo</text>
  </g>

  <!-- Jump Connection (점프) -->
  <path d="M 330 193 L 268 193" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a-purple)"/>
  
  <!-- Arrow Label Background & Text -->
  <rect x="281" y="179" width="36" height="22" fill="#ffffff"/>
  <text x="299" y="194.5" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="middle">점프</text>

  <!-- 2. 제목 목록 -->
  <g id="heading-list">
    <!-- Header Box -->
    <rect x="330" y="30" width="220" height="40" rx="4" fill="#059669"/>
    <text x="440" y="55.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">[제목 목록]</text>
    
    <!-- Body Box -->
    <rect x="330" y="70" width="220" height="230" rx="4" fill="#ecfdf5" stroke="#9aa5b1" stroke-width="1.5"/>
    
    <!-- Items -->
    <text x="354" y="114.5" font-size="13" font-weight="500" fill="#1f2933">h1 채용 공고</text>
    
    <!-- Highlighted item: h2 자격 요건 -->
    <rect x="342" y="137" width="196" height="32" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="354" y="157.5" font-size="13" font-weight="bold" fill="#7c3aed">h2 자격 요건</text>
    
    <text x="354" y="200.5" font-size="13" font-weight="500" fill="#1f2933">h2 우대 사항</text>
    <text x="354" y="240.5" font-size="13" font-weight="500" fill="#1f2933">h2 전형 절차</text>
  </g>

  <!-- 3. 링크 목록 -->
  <g id="link-list">
    <!-- Header Box -->
    <rect x="610" y="30" width="220" height="40" rx="4" fill="#d97706"/>
    <text x="720" y="55.6" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">[링크 목록]</text>
    
    <!-- Body Box -->
    <rect x="610" y="70" width="220" height="230" rx="4" fill="#fffbeb" stroke="#9aa5b1" stroke-width="1.5"/>
    
    <!-- Items -->
    <text x="634" y="114.5" font-size="13" font-weight="500" fill="#1f2933">지원하기</text>
    <text x="634" y="154.5" font-size="13" font-weight="500" fill="#1f2933">공유하기</text>
    <text x="634" y="194.5" font-size="13" font-weight="500" fill="#1f2933">목록으로</text>
  </g>
</svg>