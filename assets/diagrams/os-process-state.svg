<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로세스 상태 전이 다이어그램</title>
  <desc id="d">프로세스의 5가지 상태(New, Ready, Running, Waiting, Terminated)와 주요 상태 전이 과정을 보여주는 상태 머신 다이어그램입니다.</desc>
  
  <rect width="880" height="420" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="440" y="36" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">프로세스 상태 전이 다이어그램</text>

  <rect x="40" y="140" width="120" height="60" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="100" y="175" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">생성 (New)</text>

  <rect x="220" y="140" width="130" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="175" font-size="13" font-weight="500" fill="#2563eb" text-anchor="middle">준비 (Ready)</text>

  <rect x="430" y="140" width="130" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="495" y="175" font-size="13" font-weight="500" fill="#059669" text-anchor="middle">실행 (Running)</text>

  <rect x="325" y="270" width="130" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="390" y="305" font-size="13" font-weight="500" fill="#d97706" text-anchor="middle">대기 (Waiting)</text>

  <rect x="720" y="140" width="120" height="60" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="780" y="175" font-size="13" font-weight="500" fill="#1f2933" text-anchor="middle">종료 (Terminated)</text>

  <path d="M160,170 L220,170" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="162" y="152" width="56" height="15" fill="#ffffff"/>
  <text x="190" y="163" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">admit</text>

  <path d="M350,155 L430,155" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="360" y="137" width="60" height="15" fill="#ffffff"/>
  <text x="390" y="148" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">dispatch</text>

  <path d="M430,185 Q360,225 285,200" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="318" y="213" width="112" height="15" fill="#ffffff"/>
  <text x="374" y="224" font-size="11.5" font-weight="500" fill="#7c3aed" text-anchor="middle">timeout (선점)</text>

  <path d="M495,200 L435,270" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
  <rect x="470" y="232" width="128" height="15" fill="#ffffff"/>
  <text x="534" y="243" font-size="11.5" font-weight="500" fill="#d97706" text-anchor="middle">I/O 요청 (블로킹)</text>

  <path d="M325,285 Q250,260 270,200" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="180" y="260" width="86" height="15" fill="#ffffff"/>
  <text x="223" y="271" font-size="11.5" font-weight="500" fill="#2563eb" text-anchor="middle">I/O 완료</text>

  <path d="M560,170 L720,170" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <rect x="620" y="152" width="40" height="15" fill="#ffffff"/>
  <text x="640" y="163" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">exit</text>

  <path d="M455,300 Q600,320 720,195" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
  <rect x="548" y="302" width="80" height="15" fill="#ffffff"/>
  <text x="588" y="313" font-size="11.5" font-weight="400" fill="#dc2626" text-anchor="middle">강제 종료</text>

  <rect x="180" y="350" width="520" height="30" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
  
  <line x1="200" y1="365" x2="220" y2="365" stroke="#7c3aed" stroke-width="2"/>
  <text x="228" y="369" font-size="11" font-weight="400" fill="#1f2933">선점 (타임 퀀텀 만료)</text>

  <line x1="360" y1="365" x2="380" y2="365" stroke="#d97706" stroke-width="2"/>
  <text x="388" y="369" font-size="11" font-weight="400" fill="#1f2933">자발적 블로킹 (I/O wait)</text>

  <line x1="530" y1="365" x2="550" y2="365" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="558" y="369" font-size="11" font-weight="400" fill="#1f2933">비정상 전이</text>

  <text x="440" y="405" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle">결론: Running 상태는 타임 아웃(선점) 또는 I/O 요청(블로킹)에 의해 각각 Ready와 Waiting 상태로 분기됩니다.</text>
</svg>