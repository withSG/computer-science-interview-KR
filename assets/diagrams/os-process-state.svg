<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">프로세스 상태 전이 다이어그램</title>
  <desc id="d">New, Ready, Running, Waiting, Terminated 다섯 상태와 그 사이의 전이를 보여줍니다. Running은 timeout(선점)이면 Ready로, I/O 요청(블로킹)이면 Waiting으로 갈라집니다.</desc>
  <rect width="880" height="640" fill="#ffffff"/>

  <defs>
    <marker id="m-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 상태 박스 -->
  <rect x="64" y="32" width="160" height="68" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="144" y="61" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">New</text>
  <text x="144" y="84" font-size="15" fill="#374151" text-anchor="middle">생성</text>

  <rect x="464" y="32" width="160" height="68" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="544" y="61" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Terminated</text>
  <text x="544" y="84" font-size="15" fill="#374151" text-anchor="middle">종료</text>

  <rect x="64" y="192" width="160" height="68" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="144" y="221" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Ready</text>
  <text x="144" y="244" font-size="15" fill="#374151" text-anchor="middle">준비</text>

  <rect x="464" y="192" width="160" height="68" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="544" y="221" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Running</text>
  <text x="544" y="244" font-size="15" fill="#374151" text-anchor="middle">실행</text>

  <rect x="464" y="392" width="160" height="68" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="544" y="421" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">Waiting</text>
  <text x="544" y="444" font-size="15" fill="#374151" text-anchor="middle">대기</text>

  <!-- New → Ready : admit -->
  <path d="M144,100 L144,189" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>
  <text x="158" y="151" font-size="16" fill="#1f2937">admit<tspan font-size="15" fill="#4b5563"> (메모리 적재)</tspan></text>

  <!-- Ready → Running : dispatch -->
  <path d="M224,214 L461,214" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>
  <text x="344" y="203" font-size="16" fill="#1f2937" text-anchor="middle">dispatch</text>

  <!-- Running → Ready : timeout (선점) -->
  <path d="M464,240 L227,240" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#m-purple)"/>
  <text x="344" y="267" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="middle">timeout (선점)</text>
  <text x="344" y="289" font-size="14" fill="#6d28d9" text-anchor="middle">타임 퀀텀 만료 → 다시 Ready</text>

  <!-- Running → Terminated : exit -->
  <path d="M544,192 L544,103" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>
  <text x="558" y="151" font-size="16" fill="#1f2937">exit</text>

  <!-- Running → Waiting : I/O 요청 / wait() (블로킹) -->
  <path d="M544,260 L544,389" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#m-amber)"/>
  <text x="558" y="319" font-size="16" font-weight="700" fill="#b45309">I/O 요청 / wait()</text>
  <text x="558" y="341" font-size="15" fill="#b45309">(블로킹)</text>

  <!-- Waiting → Ready : I/O 완료 인터럽트 -->
  <path d="M464,426 L144,426 L144,263" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>
  <text x="304" y="414" font-size="16" fill="#1f2937" text-anchor="middle">I/O 완료 인터럽트</text>

  <!-- Waiting → Terminated : 강제 종료된 경우 -->
  <path d="M624,426 L808,426 L808,66 L627,66" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#m-red)"/>
  <text x="716" y="414" font-size="15" fill="#b91c1c" text-anchor="middle">강제 종료된 경우</text>

  <!-- 범례 -->
  <rect x="40" y="496" width="800" height="120" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>

  <line x1="64" y1="524" x2="104" y2="524" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="116" y="529" font-size="16" font-weight="700" fill="#6d28d9">선점 (타임 퀀텀 만료)</text>
  <text x="360" y="529" font-size="15" fill="#374151">Running → Ready: 주어진 시간이 끝나 밀려남</text>

  <line x1="64" y1="556" x2="104" y2="556" stroke="#b45309" stroke-width="2.5"/>
  <text x="116" y="561" font-size="16" font-weight="700" fill="#b45309">자발적 블로킹 (I/O wait)</text>
  <text x="360" y="561" font-size="15" fill="#374151">Running → Waiting: I/O가 끝날 때까지 스스로 양보</text>

  <line x1="64" y1="588" x2="104" y2="588" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="116" y="593" font-size="16" font-weight="700" fill="#b91c1c">비정상 전이</text>
  <text x="360" y="593" font-size="15" fill="#374151">Waiting → Terminated: 강제 종료된 경우</text>
</svg>
