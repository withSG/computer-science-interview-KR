<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">왜 빠르고 확장성이 좋은가</title>
  <desc id="d">Kafka의 빠른 처리량과 높은 확장성을 제공하는 4가지 핵심 요인(수평 확장, 디스크 순차 쓰기 및 페이지 캐시, 메시지 보관 및 재처리, 복제)을 설명하는 다이어그램</desc>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- Main Title Container -->
  <rect x="24" y="24" width="832" height="48" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1"/>
  <text x="40" y="53" font-size="16" font-weight="bold" fill="#1f2933">왜 빠르고 확장성이 좋은가</text>

  <!-- Card 1: 파티션으로 수평 확장 (병렬 처리) -->
  <g transform="translate(24, 90)">
    <rect x="0" y="0" width="832" height="72" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="#2563eb"/>
    <text x="36" y="41" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="68" y="41" font-size="14" font-weight="bold" fill="#1f2933">파티션으로 수평 확장 (병렬 처리)</text>
  </g>

  <!-- Card 2: 디스크 순차 쓰기 + 페이지 캐시 → 높은 처리량 -->
  <g transform="translate(24, 172)">
    <rect x="0" y="0" width="832" height="72" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="#059669"/>
    <text x="36" y="41" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="68" y="41" font-size="14" font-weight="bold" fill="#1f2933">디스크 순차 쓰기 + 페이지 캐시 → 높은 처리량</text>
  </g>

  <!-- Card 3: 메시지를 디스크에 보관(retention) → 재처리 가능 -->
  <g transform="translate(24, 254)">
    <rect x="0" y="0" width="832" height="72" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="#d97706"/>
    <text x="36" y="41" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="68" y="41" font-size="14" font-weight="bold" fill="#1f2933">메시지를 디스크에 보관(retention) → 재처리 가능</text>
  </g>

  <!-- Card 4: 복제(replication)로 내구성/장애 대응 -->
  <g transform="translate(24, 336)">
    <rect x="0" y="0" width="832" height="72" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="#7c3aed"/>
    <text x="36" y="41" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="68" y="41" font-size="14" font-weight="bold" fill="#1f2933">복제(replication)로 내구성/장애 대응</text>
  </g>
</svg>