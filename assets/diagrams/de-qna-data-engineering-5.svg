<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Kafka가 빠르고 확장성이 좋은 이유</title>
  <desc id="d">네 가지 방법과 그 효과: 파티션으로 수평 확장(병렬 처리), 디스크 순차 쓰기와 페이지 캐시로 높은 처리량, 메시지를 디스크에 보관(retention)해 재처리 가능, 복제(replication)로 내구성과 장애 대응.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="350" fill="#ffffff"/>

  <!-- 열 머리 -->
  <text x="242" y="44" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">방법</text>
  <text x="665" y="44" font-size="15" font-weight="bold" fill="#4b5563" text-anchor="middle">효과</text>

  <!-- 1 -->
  <circle cx="44" cy="88" r="15" fill="#1f2937"/>
  <text x="44" y="94" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="72" y="60" width="340" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="92" y="94" font-size="16" fill="#1f2937">파티션으로</text>
  <line x1="414" y1="88" x2="470" y2="88" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="474" y="60" width="382" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="494" y="94" font-size="16" font-weight="bold" fill="#1e3a8a">수평 확장 (병렬 처리)</text>

  <!-- 2 -->
  <circle cx="44" cy="158" r="15" fill="#1f2937"/>
  <text x="44" y="164" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="72" y="130" width="340" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="92" y="164" font-size="16" fill="#1f2937">디스크 순차 쓰기 + 페이지 캐시</text>
  <line x1="414" y1="158" x2="470" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="474" y="130" width="382" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="494" y="164" font-size="16" font-weight="bold" fill="#1e3a8a">높은 처리량</text>

  <!-- 3 -->
  <circle cx="44" cy="228" r="15" fill="#1f2937"/>
  <text x="44" y="234" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="72" y="200" width="340" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="92" y="234" font-size="16" fill="#1f2937">메시지를 디스크에 보관(retention)</text>
  <line x1="414" y1="228" x2="470" y2="228" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="474" y="200" width="382" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="494" y="234" font-size="16" font-weight="bold" fill="#1e3a8a">재처리 가능</text>

  <!-- 4 -->
  <circle cx="44" cy="298" r="15" fill="#1f2937"/>
  <text x="44" y="304" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="72" y="270" width="340" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="92" y="304" font-size="16" fill="#1f2937">복제(replication)로</text>
  <line x1="414" y1="298" x2="470" y2="298" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="474" y="270" width="382" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="494" y="304" font-size="16" font-weight="bold" fill="#1e3a8a">내구성/장애 대응</text>
</svg>
