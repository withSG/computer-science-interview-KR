<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Dirty Read — 커밋되지 않은 값을 읽는다</title>
  <desc id="d">트랜잭션 A가 값을 2000으로 수정하고 롤백하기 전에 트랜잭션 B가 그 값을 읽는 Dirty Read 이상 현상을 나타낸 다이어그램입니다.</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="880" height="340" fill="#ffffff"/>

  <text x="40" y="35" font-size="13" font-weight="bold" fill="#52606d">시간 →</text>

  <rect x="30" y="60" width="820" height="100" rx="8" fill="#f8fafc" stroke="#f0f4f8" stroke-width="1"/>
  <text x="50" y="114" font-size="14" font-weight="bold" fill="#1f2933">트랜잭션 A</text>

  <rect x="30" y="180" width="820" height="100" rx="8" fill="#f8fafc" stroke="#f0f4f8" stroke-width="1"/>
  <text x="50" y="234" font-size="14" font-weight="bold" fill="#1f2933">트랜잭션 B</text>

  <path d="M150,110 L230,110" stroke="#1f2933" stroke-width="2" fill="none"/>
  
  <rect x="230" y="90" width="230" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="345" y="115" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">balance 1000 → 2000 UPDATE</text>

  <path d="M460,110 L640,110" stroke="#1f2933" stroke-width="2" fill="none"/>

  <rect x="640" y="90" width="110" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="695" y="115" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">ROLLBACK</text>

  <path d="M750,110 L820,110" stroke="#1f2933" stroke-width="2" fill="none"/>

  <path d="M150,230 L450,230" stroke="#1f2933" stroke-width="2" fill="none"/>

  <rect x="450" y="210" width="180" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="540" y="235" font-size="13" font-weight="bold" fill="#d97706" text-anchor="middle">SELECT → 2000 읽음</text>

  <path d="M630,230 L820,230" stroke="#1f2933" stroke-width="2" fill="none"/>

  <path d="M345,130 L345,230" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <path d="M540,295 L540,253" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>
  
  <rect x="420" y="295" width="240" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="540" y="316" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">존재한 적 없는 값을 읽었다</text>

</svg>