<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CSRF 공격 시나리오</title>
  <desc id="d">피해자가 bank.com에 로그인해 세션 쿠키를 보관한 상태에서 evil.com을 방문하면, 자동 제출 폼이 bank.com/transfer로 POST를 보내고 브라우저가 bank.com 쿠키를 자동 첨부해 서버는 세션이 유효하다고 보고 송금을 처리한다.</desc>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- 생명선 -->
  <line x1="150" y1="84" x2="150" y2="498" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="730" y1="84" x2="730" y2="498" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 참여자 -->
  <rect x="40" y="24" width="220" height="60" rx="8" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="150" y="60" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">피해자 브라우저</text>

  <rect x="620" y="24" width="220" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="730" y="60" font-size="18" font-weight="bold" fill="#1d4ed8" text-anchor="middle">bank.com</text>

  <!-- ① 로그인 -->
  <text x="440" y="130" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">① 로그인 → 세션 쿠키 보관</text>
  <line x1="726" y1="142" x2="156" y2="142" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar-blue)"/>

  <!-- ② evil.com 방문: 브라우저 안에서 열린 공격 페이지 -->
  <rect x="60" y="166" width="500" height="208" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="80" y="194" font-size="16" font-weight="bold" fill="#9a3412">② evil.com 방문 <tspan font-weight="normal" fill="#374151">(다른 탭이어도 무방)</tspan></text>
  <rect x="76" y="208" width="468" height="150" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
  <g font-size="15" fill="#1f2937" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">
    <text x="92" y="236" xml:space="preserve">&lt;form action="https://bank.com/transfer"</text>
    <text x="92" y="261" xml:space="preserve">      method="POST" id="f"&gt;</text>
    <text x="92" y="286" xml:space="preserve">  &lt;input name="to" <tspan fill="#b91c1c" font-weight="bold">value="attacker"</tspan>&gt;</text>
    <text x="92" y="311" xml:space="preserve">  &lt;input name="amount" <tspan fill="#b91c1c" font-weight="bold">value="1000000"</tspan>&gt;</text>
    <text x="92" y="336" xml:space="preserve">&lt;/form&gt;  <tspan fill="#b91c1c" font-weight="bold">&lt;script&gt;f.submit()&lt;/script&gt;</tspan></text>
  </g>

  <!-- ③ 쿠키 자동 첨부 전송 -->
  <text x="440" y="414" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">③ 브라우저가 bank.com 쿠키를 자동 첨부해 전송</text>
  <line x1="154" y1="426" x2="724" y2="426" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar-red)"/>

  <!-- ④ 송금 처리 -->
  <rect x="610" y="444" width="240" height="38" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="730" y="468" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">④ 세션 유효 → 송금 처리</text>
</svg>
