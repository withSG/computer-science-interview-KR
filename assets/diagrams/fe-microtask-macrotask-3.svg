<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">퀴즈 1 — 마이크로태스크 도중 추가되는 마이크로태스크</title>
  <desc id="d">동기 실행, 마이크로태스크 소진, 매크로태스크 실행 과정을 단계별로 나타낸 이벤트 루프 추적 다이어그램</desc>
  <rect width="880" height="770" fill="#ffffff"/>

  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="832" height="36" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="16" y="22" font-size="12" font-weight="bold" fill="#1f2933">범례:</text>
    
    <rect x="65" y="10" width="16" height="16" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="87" y="22" font-size="11.5" fill="#1f2933">동기 실행</text>

    <rect x="170" y="10" width="16" height="16" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="192" y="22" font-size="11.5" fill="#1f2933">마이크로태스크 큐</text>

    <rect x="330" y="10" width="16" height="16" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="352" y="22" font-size="11.5" fill="#1f2933">매크로태스크 큐</text>

    <rect x="480" y="10" width="16" height="16" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="502" y="22" font-size="11.5" fill="#1f2933">콘솔 출력</text>
  </g>

  <!-- Section 1: [동기 실행 구간] -->
  <g transform="translate(24, 68)">
    <rect x="0" y="0" width="832" height="260" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="832" height="34" rx="8" fill="#2563eb"/>
    <!-- bottom corners fix for header rect -->
    <rect x="0" y="26" width="832" height="8" fill="#2563eb"/>
    <text x="16" y="22" font-size="14" font-weight="bold" fill="#ffffff">[동기 실행 구간]</text>

    <!-- Item 1 -->
    <rect x="20" y="46" width="180" height="28" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="30" y="64" font-size="13" fill="#1f2933">'1' 출력</text>
    <rect x="210" y="46" width="70" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="245" y="64" font-size="12" fill="#059669" text-anchor="middle">출력: '1'</text>

    <!-- Item 2 -->
    <rect x="20" y="82" width="180" height="28" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="30" y="100" font-size="13" fill="#1f2933">setTimeout(2) 등록</text>
    <path d="M200,96 L270,96" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
    <rect x="280" y="82" width="220" height="28" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="290" y="100" font-size="12" fill="#d97706">매크로 큐: [2]</text>

    <!-- Item 3 -->
    <rect x="20" y="118" width="180" height="28" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="30" y="136" font-size="13" fill="#1f2933">Promise.then(3) 등록</text>
    <path d="M200,132 L270,132" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <rect x="280" y="118" width="530" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="290" y="136" font-size="12" fill="#7c3aed">이미 이행됨 → 마이크로 큐: [then3]</text>

    <!-- Item 3 subnote -->
    <text x="40" y="162" font-size="11.5" fill="#52606d">.then(5)는 아직 앞 단계가 끝나지 않아 대기 상태로 연결만 해둔다</text>

    <!-- Item 4 -->
    <rect x="20" y="176" width="180" height="28" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="30" y="194" font-size="13" fill="#1f2933">setTimeout(6) 등록</text>
    <path d="M200,190 L270,190" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#a-amber)"/>
    <rect x="280" y="176" width="220" height="28" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="290" y="194" font-size="12" fill="#d97706">매크로 큐: [2, 6]</text>

    <!-- Item 5 -->
    <rect x="20" y="212" width="180" height="28" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="30" y="230" font-size="13" fill="#1f2933">'7' 출력</text>
    <rect x="210" y="212" width="70" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="245" y="230" font-size="12" fill="#059669" text-anchor="middle">출력: '7'</text>

    <text x="310" y="230" font-size="12" font-weight="bold" fill="#52606d">콜 스택 비었음</text>
  </g>

  <!-- Section 2: [마이크로태스크 소진] -->
  <g transform="translate(24, 344)">
    <rect x="0" y="0" width="832" height="230" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="0" y="0" width="832" height="34" rx="8" fill="#7c3aed"/>
    <rect x="0" y="26" width="832" height="8" fill="#7c3aed"/>
    <text x="16" y="22" font-size="14" font-weight="bold" fill="#ffffff">[마이크로태스크 소진]</text>

    <!-- Step 1 -->
    <rect x="20" y="46" width="150" height="80" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="30" y="68" font-size="13" font-weight="bold" fill="#7c3aed">then3 실행</text>
    <path d="M100,74 L100,84" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="30" y="96" font-size="12" fill="#1f2933">→ '3' 출력</text>

    <path d="M170,64 L220,64" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <rect x="230" y="50" width="572" height="28" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="240" y="68" font-size="12" fill="#1f2933">queueMicrotask(4)</text>
    <text x="420" y="68" font-size="12" font-weight="bold" fill="#7c3aed">마이크로 큐: [4]</text>

    <path d="M170,100 L220,100" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
    <rect x="230" y="86" width="572" height="28" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="240" y="104" font-size="12" fill="#1f2933">then3이 undefined 반환 → 다음 then 예약</text>
    <text x="560" y="104" font-size="12" font-weight="bold" fill="#7c3aed">마이크로 큐: [4, then5]</text>

    <!-- Step 2 -->
    <rect x="20" y="136" width="150" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="30" y="154" font-size="13" font-weight="bold" fill="#7c3aed">4 실행</text>
    <path d="M170,150 L220,150" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="230" y="136" width="120" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="240" y="154" font-size="12" fill="#059669">→ '4' 출력</text>

    <!-- Step 3 -->
    <rect x="20" y="172" width="150" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="30" y="190" font-size="13" font-weight="bold" fill="#7c3aed">then5 실행</text>
    <path d="M170,186 L220,186" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="230" y="172" width="120" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="240" y="190" font-size="12" fill="#059669">→ '5' 출력</text>

    <text x="380" y="190" font-size="12" font-weight="bold" fill="#52606d">마이크로 큐 비었음</text>
  </g>

  <!-- Section 3: [매크로태스크 하나] & [다음 사이클] -->
  <g transform="translate(24, 590)">
    <rect x="0" y="0" width="832" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="832" height="30" rx="8" fill="#d97706"/>
    <rect x="0" y="22" width="832" height="8" fill="#d97706"/>
    <text x="16" y="20" font-size="13" font-weight="bold" fill="#ffffff">[매크로태스크 하나]</text>

    <rect x="20" y="36" width="110" height="26" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="30" y="53" font-size="12.5" font-weight="bold" fill="#d97706">2 실행</text>
    <path d="M130,49 L165,49" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="175" y="36" width="100" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="185" y="53" font-size="12" fill="#059669">→ '2' 출력</text>

    <path d="M275,49 L305,49" stroke="#1f2933" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <text x="315" y="53" font-size="12" fill="#52606d">→ 이후 마이크로 큐 확인 (비어 있음)</text>
  </g>

  <g transform="translate(24, 672)">
    <rect x="0" y="0" width="832" height="70" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="0" y="0" width="832" height="30" rx="8" fill="#52606d"/>
    <rect x="0" y="22" width="832" height="8" fill="#52606d"/>
    <text x="16" y="20" font-size="13" font-weight="bold" fill="#ffffff">[다음 사이클]</text>

    <rect x="20" y="36" width="110" height="26" rx="4" fill="#ffffff" stroke="#52606d" stroke-width="1"/>
    <text x="30" y="53" font-size="12.5" font-weight="bold" fill="#1f2933">6 실행</text>
    <path d="M130,49 L165,49" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
    <rect x="175" y="36" width="100" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="185" y="53" font-size="12" fill="#059669">→ '6' 출력</text>
  </g>
</svg>