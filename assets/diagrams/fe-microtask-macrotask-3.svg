  <text x="48" y="48" font-size="15" font-weight="bold" fill="#374151">실행 흐름</text>
  <text x="490" y="48" font-size="15" font-weight="bold" fill="#374151">큐 변화</text>
  <text x="804" y="48" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">출력</text>
  <text x="50" y="93.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="74" y="94" font-size="17" font-weight="bold" fill="#1e293b">동기 실행 구간</text>
  <text x="48" y="133" font-size="16" fill="#111827">'1' 출력</text>
  <text x="804" y="132.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="48" y="171" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTimeout(2)</tspan> 등록</text>
  <text x="490" y="170" font-size="15" fill="#1e40af">매크로 큐: <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[2]</tspan></text>
  <text x="48" y="209" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Promise.then(3)</tspan> 등록 → 이미 이행됨</text>
  <text x="490" y="208" font-size="15" fill="#5b21b6">마이크로 큐: <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[then3]</tspan></text>
  <text x="74" y="244" font-size="15" fill="#4b5563"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">.then(5)</tspan>는 아직 앞 단계가 끝나지 않아 대기 상태로 연결만 해둔다</text>
  <text x="48" y="281" font-size="16" fill="#111827"><tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">setTimeout(6)</tspan> 등록</text>
  <text x="490" y="280" font-size="15" fill="#1e40af">매크로 큐: <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[2, 6]</tspan></text>
  <text x="48" y="319" font-size="16" fill="#111827">'7' 출력</text>
  <text x="804" y="318.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="48" y="356" font-size="15" font-weight="bold" fill="#4b5563">콜 스택 비었음</text>
  <text x="50" y="407.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="74" y="408" font-size="17" font-weight="bold" fill="#5b21b6">마이크로태스크 소진</text>
  <text x="48" y="447" font-size="16" fill="#111827">then3 실행 → '3' 출력</text>
  <text x="804" y="446.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="74" y="485" font-size="16" fill="#111827">→ <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">queueMicrotask(4)</tspan></text>
  <text x="490" y="484" font-size="15" fill="#5b21b6">마이크로 큐: <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[4]</tspan></text>
  <text x="74" y="523" font-size="16" fill="#111827">→ then3이 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">undefined</tspan> 반환 → 다음 then 예약</text>
  <text x="490" y="522" font-size="15" fill="#5b21b6">마이크로 큐: <tspan font-weight="bold" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">[4, then5]</tspan></text>
  <text x="48" y="561" font-size="16" fill="#111827">4 실행 → '4' 출력</text>
  <text x="804" y="560.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="48" y="599" font-size="16" fill="#111827">then5 실행 → '5' 출력</text>
  <text x="804" y="598.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="48" y="636" font-size="15" font-weight="bold" fill="#4b5563">마이크로 큐 비었음</text>
  <text x="50" y="687.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="74" y="688" font-size="17" font-weight="bold" fill="#1e40af">매크로태스크 하나</text>
  <text x="48" y="727" font-size="16" fill="#111827">2 실행 → '2' 출력</text>
  <text x="804" y="726.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="74" y="764" font-size="15" font-weight="bold" fill="#4b5563">→ 이후 마이크로 큐 확인(비어 있음)</text>
  <text x="50" y="815.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="74" y="816" font-size="17" font-weight="bold" fill="#1e40af">다음 사이클</text>
  <text x="48" y="855" font-size="16" fill="#111827">6 실행 → '6' 출력</text>
  <text x="804" y="854.5" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="440" y="919" font-size="19" font-weight="bold" fill="#065f46" text-anchor="middle">출력: 1 → 7 → 3 → 4 → 5 → 2 → 6</text>
</svg>
