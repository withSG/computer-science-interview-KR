<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 960" width="880" height="960" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">퀴즈 1 실행 순서 추적</title>
  <desc id="d">동기 실행 구간, 마이크로태스크 소진, 매크로태스크 하나, 다음 사이클의 네 구간으로 나눠 각 단계의 실행 내용과 매크로·마이크로 큐 변화, 출력을 표로 추적한다. 소진 도중 추가된 4가 then5보다 앞에 줄 서므로 출력은 1, 7, 3, 4, 5, 2, 6 순이다.</desc>
