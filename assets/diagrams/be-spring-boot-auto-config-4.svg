<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">디버깅 — 무엇이 켜졌고 무엇이 꺼졌나</title>
  <desc id="d">Spring Boot 조건 평가 리포트(CONDITIONS EVALUATION REPORT)의 구조를 보여주는 다이어그램</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Main Title Container -->
  <rect x="24" y="24" width="832" height="50" rx="6" fill="#1f2933"/>
  <text x="440" y="55" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">CONDITIONS EVALUATION REPORT</text>

  <!-- Legend -->
  <rect x="520" y="86" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="538" y="97" fill="#52606d" font-size="11.5">적용됨</text>
  <rect x="610" y="86" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="628" y="97" fill="#52606d" font-size="11.5">미적용(핵심)</text>
  <rect x="710" y="86" width="12" height="12" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="728" y="97" fill="#52606d" font-size="11.5">제외/조건없음</text>

  <!-- 1. Positive Matches Group -->
  <g>
    <rect x="24" y="110" width="832" height="130" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <!-- Header Area -->
    <text x="44" y="139" fill="#059669" font-size="14" font-weight="bold">Positive matches:</text>
    <rect x="230" y="125" width="220" height="20" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1"/>
    <text x="236" y="139" fill="#059669" font-size="11.5">← 조건을 만족해서 적용된 것</text>
    
    <line x1="44" y1="155" x2="836" y2="155" stroke="#a7f3d0" stroke-width="1"/>
    
    <!-- Content Detail -->
    <text x="56" y="179" fill="#1f2933" font-size="13" font-weight="bold">DataSourceAutoConfiguration matched:</text>
    <text x="80" y="209" fill="#52606d" font-size="13">- @ConditionalOnClass found required classes 'javax.sql.DataSource' ...</text>
  </g>

  <!-- 2. Negative Matches Group -->
  <g>
    <rect x="24" y="255" width="832" height="155" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <!-- Header Area -->
    <text x="44" y="284" fill="#dc2626" font-size="14" font-weight="bold">Negative matches:</text>
    <rect x="230" y="270" width="285" height="20" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="236" y="284" fill="#dc2626" font-size="11.5" font-weight="bold">← 조건을 만족하지 못해 빠진 것 (여기가 핵심)</text>
    
    <line x1="44" y1="300" x2="836" y2="300" stroke="#fecaca" stroke-width="1"/>
    
    <!-- Content Detail -->
    <text x="56" y="324" fill="#1f2933" font-size="13" font-weight="bold">RedisAutoConfiguration:</text>
    <text x="80" y="352" fill="#dc2626" font-size="13">Did not match:</text>
    <text x="104" y="380" fill="#52606d" font-size="13">- @ConditionalOnClass did not find required class 'org.springframework.data.redis.core.RedisOperations'</text>
  </g>

  <!-- 3. Exclusions Group -->
  <g>
    <rect x="24" y="425" width="408" height="90" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="44" y="454" fill="#d97706" font-size="14" font-weight="bold">Exclusions:</text>
    <rect x="220" y="440" width="180" height="20" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="226" y="454" fill="#d97706" font-size="11.5">← exclude 로 명시적으로 뺀 것</text>
    <line x1="44" y1="470" x2="412" y2="470" stroke="#fde68a" stroke-width="1"/>
  </g>

  <!-- 4. Unconditional Classes Group -->
  <g>
    <rect x="448" y="425" width="408" height="90" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="468" y="454" fill="#1f2933" font-size="14" font-weight="bold">Unconditional classes:</text>
    <rect x="630" y="440" width="200" height="20" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="636" y="454" fill="#52606d" font-size="11.5">← 조건 없이 항상 적용되는 것</text>
    <line x1="468" y1="470" x2="836" y2="470" stroke="#cbd2d9" stroke-width="1"/>
  </g>
</svg>