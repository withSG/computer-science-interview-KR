<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">조건 평가 리포트 구조</title>
  <desc id="d">--debug로 켜는 CONDITIONS EVALUATION REPORT는 Positive matches(조건을 만족해 적용된 것), Negative matches(조건을 만족하지 못해 빠진 것, 여기가 핵심), Exclusions(exclude로 명시적으로 뺀 것), Unconditional classes(조건 없이 항상 적용되는 것)로 나뉜다.</desc>
  <rect width="880" height="620" fill="#ffffff"/>

  <!-- 리포트 머리 -->
  <rect x="24" y="24" width="832" height="56" rx="8" fill="#1f2937"/>
  <text x="440" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">CONDITIONS EVALUATION REPORT</text>

  <!-- Positive matches -->
  <rect x="24" y="100" width="832" height="132" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="48" y="134" font-size="17" font-weight="bold" fill="#047857" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Positive matches:</text>
  <rect x="340" y="112" width="270" height="32" rx="16" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="475" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">← 조건을 만족해서 적용된 것</text>
  <line x1="48" y1="154" x2="832" y2="154" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="64" y="184" font-size="15" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">DataSourceAutoConfiguration matched:</text>
  <text x="92" y="212" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">- @ConditionalOnClass found required classes 'javax.sql.DataSource' ...</text>

  <!-- Negative matches (핵심) -->
  <rect x="24" y="252" width="832" height="190" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="48" y="286" font-size="17" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Negative matches:</text>
  <rect x="340" y="264" width="270" height="32" rx="16" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="475" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">← 조건을 만족하지 못해 빠진 것</text>
  <rect x="624" y="264" width="112" height="32" rx="16" fill="#b91c1c"/>
  <text x="680" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">여기가 핵심</text>
  <line x1="48" y1="306" x2="832" y2="306" stroke="#fecaca" stroke-width="1.5"/>
  <text x="64" y="336" font-size="15" font-weight="bold" fill="#111827" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">RedisAutoConfiguration:</text>
  <text x="92" y="364" font-size="15" font-weight="bold" fill="#b91c1c" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Did not match:</text>
  <text x="120" y="392" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">- @ConditionalOnClass did not find required class</text>
  <text x="138" y="420" font-size="15" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">'org.springframework.data.redis.core.RedisOperations'</text>

  <!-- Exclusions -->
  <rect x="24" y="462" width="832" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="48" y="496" font-size="17" font-weight="bold" fill="#92400e" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Exclusions:</text>
  <rect x="340" y="474" width="270" height="32" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="475" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">← <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">exclude</tspan> 로 명시적으로 뺀 것</text>

  <!-- Unconditional classes -->
  <rect x="24" y="534" width="832" height="56" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="48" y="568" font-size="17" font-weight="bold" fill="#374151" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">Unconditional classes:</text>
  <rect x="340" y="546" width="270" height="32" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="475" y="568" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">← 조건 없이 항상 적용되는 것</text>
</svg>
