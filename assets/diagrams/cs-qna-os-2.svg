<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FCFS (First Come First Served) — 비선점</title>
  <desc id="d">FCFS 스케줄링의 특징, Convoy Effect 단점, Gantt 차트 예시 및 대기 시간 계산 설명</desc>
  
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 헤딩 / 제목 -->
  <text x="30" y="36" font-size="16" font-weight="bold" fill="#1f2933">1. FCFS (First Come First Served) — 비선점</text>

  <!-- 핵심 개념 및 단점 블록 -->
  <g transform="translate(30, 55)">
    <!-- 특징 -->
    <rect x="0" y="0" width="820" height="36" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="16" y="22" font-size="13" font-weight="bold" fill="#2563eb">도착 순서대로 처리</text>

    <!-- 단점 (Convoy Effect) -->
    <rect x="0" y="44" width="820" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="16" y="66" font-size="13" font-weight="bold" fill="#dc2626">단점: 앞의 긴 작업이 뒤를 막음 (Convoy Effect)</text>
  </g>

  <!-- 작업 정보 영역 -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="820" height="32" rx="4" fill="#f8fafc" stroke="#cbd2d9" stroke-width="1"/>
    <text x="16" y="20" font-size="13" fill="#1f2933"><tspan font-weight="bold">작업:</tspan> P1(24ms), P2(3ms), P3(3ms) 순서로 도착</text>
  </g>

  <!-- Gantt 차트 (시각적 전사) -->
  <g transform="translate(30, 198)">
    <!-- P1 Box (24ms - 상대적 폭 반영) -->
    <rect x="0" y="0" width="560" height="40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="280" y="24" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">P1 (24ms)</text>

    <!-- P2 Box (3ms) -->
    <rect x="560" y="0" width="120" height="40" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="620" y="24" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">P2 (3ms)</text>

    <!-- P3 Box (3ms) -->
    <rect x="680" y="0" width="120" height="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="740" y="24" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">P3 (3ms)</text>

    <!-- 타임라인 타임스탬프 -->
    <text x="0" y="56" font-size="11.5" fill="#52606d" text-anchor="middle">0</text>
    <text x="560" y="56" font-size="11.5" fill="#52606d" text-anchor="middle">24</text>
    <text x="680" y="56" font-size="11.5" fill="#52606d" text-anchor="middle">27</text>
    <text x="800" y="56" font-size="11.5" fill="#52606d" text-anchor="middle">30</text>
  </g>

  <!-- 대기 시간 계산 결과 -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="820" height="36" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="16" y="22" font-size="13" font-weight="bold" fill="#1f2933">대기 시간: P1=0, P2=24, P3=27 → 평균 17ms</text>
  </g>
</svg>