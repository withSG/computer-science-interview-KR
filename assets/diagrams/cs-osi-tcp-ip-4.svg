<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ARP로 다음 홉의 MAC 알아내기</title>
  <desc id="d">내 PC가 192.0.2.1의 MAC을 묻는 ARP 요청을 같은 네트워크 전체에 브로드캐스트하고, 공유기가 자기 MAC BB:BB:BB:BB:BB:BB를 내 PC에게만 유니캐스트로 답하면, 내 PC가 그 결과를 ARP 캐시에 저장해 다음부터는 묻지 않는 과정을 보여 줍니다.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="880" height="490" fill="#ffffff"/>

  <!-- 참여자 -->
  <rect x="150" y="24" width="140" height="46" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="220" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">내 PC</text>
  <rect x="700" y="24" width="140" height="46" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="770" y="53" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">공유기</text>

  <!-- 생명선 -->
  <line x1="220" y1="70" x2="220" y2="316" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="770" y1="70" x2="770" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ① ARP 요청: 브로드캐스트 -->
  <circle cx="42" cy="132" r="15" fill="#1d4ed8"/>
  <text x="42" y="138" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="64" y="138" font-size="16" font-weight="bold" fill="#1d4ed8">ARP 요청</text>

  <text x="495" y="114" font-size="16" fill="#111827" text-anchor="middle">“192.0.2.1 쓰는 사람 누구? MAC 알려줘”</text>
  <line x1="226" y1="132" x2="763" y2="132" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arr-blue)"/>
  <text x="495" y="160" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">같은 네트워크 전체에 브로드캐스트</text>
  <text x="495" y="184" font-size="15" fill="#374151" text-anchor="middle">목적지 MAC = <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold" fill="#111827">FF:FF:FF:FF:FF:FF</tspan></text>

  <!-- ② ARP 응답: 유니캐스트 -->
  <circle cx="42" cy="254" r="15" fill="#047857"/>
  <text x="42" y="260" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="64" y="260" font-size="16" font-weight="bold" fill="#047857">ARP 응답</text>

  <text x="495" y="236" font-size="16" fill="#111827" text-anchor="middle">“그거 나야. 내 MAC은 <tspan font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace" font-weight="bold">BB:BB:BB:BB:BB:BB</tspan>”</text>
  <line x1="764" y1="254" x2="227" y2="254" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="495" y="282" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">나에게만 유니캐스트로 응답</text>

  <!-- ③ ARP 캐시 저장 -->
  <circle cx="42" cy="344" r="15" fill="#b45309"/>
  <text x="42" y="350" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="64" y="350" font-size="16" font-weight="bold" fill="#b45309">캐시 저장</text>

  <rect x="150" y="316" width="690" height="146" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="172" y="350" font-size="16" font-weight="bold" fill="#7c2d12">내 PC의 ARP 캐시에 저장 — 다음부터는 안 물어본다</text>

  <rect x="172" y="368" width="646" height="34" fill="#fef3c7"/>
  <rect x="172" y="402" width="646" height="40" fill="#ffffff"/>
  <g stroke="#b45309" stroke-width="1" fill="none">
    <line x1="172" y1="402" x2="818" y2="402"/>
    <line x1="352" y1="368" x2="352" y2="442"/>
    <line x1="612" y1="368" x2="612" y2="442"/>
  </g>
  <rect x="172" y="368" width="646" height="74" fill="none" stroke="#b45309" stroke-width="1.2"/>

  <text x="262" y="391" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">IP 주소</text>
  <text x="482" y="391" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">MAC 주소</text>
  <text x="715" y="391" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">상태</text>

  <text x="262" y="428" font-size="16" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">192.0.2.1</text>
  <text x="482" y="428" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle" font-family="Consolas,'D2Coding',Menlo,'Malgun Gothic',monospace">BB:BB:BB:BB:BB:BB</text>
  <text x="715" y="428" font-size="15" fill="#374151" text-anchor="middle">Dynamic / Resolved</text>
</svg>
