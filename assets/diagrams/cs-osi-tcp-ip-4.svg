<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">그럼 다음 홉의 MAC은 어떻게 아는가 — ARP</title>
  <desc id="d">내 PC와 공유기 간의 ARP 브로드캐스트 요청, 유니캐스트 응답 및 ARP 캐시 저장 과정을 나타낸 다이어그램입니다.</desc>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="40" y="36" fill="#1f2933" font-size="16" font-weight="bold">그럼 다음 홉의 MAC은 어떻게 아는가 — ARP</text>

  <!-- 개체 박스 -->
  <!-- 내 PC -->
  <rect x="40" y="60" width="160" height="350" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="40" y="60" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="85" fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle">내 PC</text>

  <!-- 공유기 -->
  <rect x="680" y="60" width="160" height="350" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.5"/>
  <rect x="680" y="60" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="85" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">공유기</text>

  <!-- 타임라인/생명선 -->
  <path d="M120,100 L120,390" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M760,100 L760,390" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 과정 ①: 브로드캐스트 요청 -->
  <g>
    <!-- 화살표 -->
    <path d="M120,150 L760,150" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a-blue)"/>
    
    <!-- 번호 및 메시지 -->
    <rect x="135" y="118" width="540" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="145" y="134" fill="#2563eb" font-size="13" font-weight="bold">① 내 PC:</text>
    <text x="210" y="134" fill="#1f2933" font-size="13">"192.0.2.1 쓰는 사람 누구? MAC 알려줘"</text>

    <!-- 부가 정보 -->
    <rect x="235" y="160" width="410" height="20" rx="3" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="440" y="174" fill="#52606d" font-size="11.5" text-anchor="middle">→ 같은 네트워크 전체에 브로드캐스트 (목적지 MAC = FF:FF:FF:FF:FF:FF)</text>
  </g>

  <!-- 과정 ②: 유니캐스트 응답 -->
  <g>
    <!-- 화살표 -->
    <path d="M760,240 L120,240" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
    
    <!-- 번호 및 메시지 -->
    <rect x="205" y="208" width="540" height="24" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="215" y="224" fill="#059669" font-size="13" font-weight="bold">② 공유기:</text>
    <text x="280" y="224" fill="#1f2933" font-size="13">"그거 나야. 내 MAC은 BB:BB:BB:BB:BB:BB"</text>

    <!-- 부가 정보 -->
    <rect x="360" y="250" width="160" height="20" rx="3" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/>
    <text x="440" y="264" fill="#52606d" font-size="11.5" text-anchor="middle">→ 나에게만 유니캐스트로 응답</text>
  </g>

  <!-- 과정 ③: ARP 캐시 저장 -->
  <g>
    <!-- 로컬 작업 표시 박스 -->
    <rect x="55" y="300" width="600" height="70" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="70" y="325" fill="#d97706" font-size="13" font-weight="bold">③ 내 PC:</text>
    <text x="135" y="325" fill="#1f2933" font-size="13">ARP 캐시에 (192.0.2.1 → BB:BB:...) 저장. 다음부터는 안 물어본다</text>
    
    <!-- 세부 저장 형태 시각화 -->
    <rect x="70" y="338" width="570" height="22" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/>
    <text x="80" y="353" fill="#52606d" font-size="11.5">[ARP Cache Table]</text>
    <text x="200" y="353" fill="#1f2933" font-size="11.5" font-weight="bold">IP: 192.0.2.1  →  MAC: BB:BB:BB:BB:BB:BB</text>
    <text x="480" y="353" fill="#059669" font-size="11.5">(State: Dynamic / Resolved)</text>
  </g>
</svg>