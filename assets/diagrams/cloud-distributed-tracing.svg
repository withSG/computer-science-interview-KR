<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">트레이스 워터폴 — 2.8초가 어디로 갔는가</title>
  <desc id="d">요청 하나(Trace)를 구성하는 스팬들을 시간축에 놓은 워터폴. Gateway 2800ms 안에서 order-service 2760ms, 그 아래 inventory 15ms·pricing 28ms가 순차로, payment 2680ms 아래 db:SELECT 8ms와 HTTP POST /pg 2650ms가 이어진다. 외부 PG 호출이 병목이고, order-service에는 37ms의 계측 공백이 있다.</desc>
  <rect width="880" height="540" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="24" y="40" font-size="20" font-weight="bold" fill="#111827">트레이스 워터폴 — 2.8초가 어디로 갔는가</text>
  <text x="24" y="66" font-size="15" fill="#4b5563">요청 전체 여정(Trace)과 하위 작업 구간(Span)의 시간 흐름 분석</text>

  <!-- 범례 -->
  <rect x="24" y="86" width="28" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="60" y="99" font-size="15" fill="#111827">일반 스팬</text>
  <rect x="160" y="86" width="28" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="196" y="99" font-size="15" fill="#111827">임계 경로 (병목)</text>

  <!-- 축 머리 -->
  <rect x="24" y="118" width="832" height="30" fill="#f3f4f6"/>
  <text x="32" y="138" font-size="14" font-weight="bold" fill="#374151">스팬 / 서비스 이름</text>
  <text x="256" y="138" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">0ms</text>
  <text x="434.6" y="138" font-size="14" fill="#374151" text-anchor="middle">1000ms</text>
  <text x="613.1" y="138" font-size="14" fill="#374151" text-anchor="middle">2000ms</text>
  <text x="756" y="138" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">2800ms</text>
  <text x="850" y="138" font-size="14" font-weight="bold" fill="#374151" text-anchor="end">소요</text>

  <!-- 줄무늬 행 배경 -->
  <rect x="24" y="196" width="832" height="44" fill="#f9fafb"/>
  <rect x="24" y="284" width="832" height="44" fill="#f9fafb"/>
  <rect x="24" y="372" width="832" height="44" fill="#f9fafb"/>

  <!-- 눈금선 -->
  <line x1="256" y1="148" x2="256" y2="460" stroke="#9ca3af" stroke-width="1"/>
  <line x1="434.6" y1="148" x2="434.6" y2="460" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="613.1" y1="148" x2="613.1" y2="460" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="756" y1="148" x2="756" y2="460" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="24" y1="460" x2="856" y2="460" stroke="#d1d5db" stroke-width="1"/>

  <!-- 트리 연결선 -->
  <path d="M32,186 V218 H44" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M58,232 V350 H70 M58,262 H70 M58,306 H70" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M84,364 V438 H96 M84,394 H96" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- R1 Gateway -->
  <text x="24" y="179.5" font-size="16" font-weight="bold" fill="#111827">Gateway</text>
  <rect x="256" y="161" width="500" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="850" y="179.5" font-size="15" fill="#111827" text-anchor="end">2800ms</text>

  <!-- R2 order-service -->
  <text x="50" y="223.5" font-size="16" font-weight="bold" fill="#111827">order-service</text>
  <rect x="259.6" y="205" width="492.8" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="850" y="223.5" font-size="15" fill="#111827" text-anchor="end">2760ms</text>

  <!-- R3 inventory -->
  <text x="76" y="267.5" font-size="16" fill="#111827">inventory</text>
  <rect x="259.6" y="249" width="2.7" height="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="850" y="267.5" font-size="15" fill="#111827" text-anchor="end">15ms</text>

  <!-- R4 pricing -->
  <text x="76" y="311.5" font-size="16" fill="#111827">pricing</text>
  <rect x="262.3" y="293" width="5" height="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="850" y="311.5" font-size="15" fill="#111827" text-anchor="end">28ms</text>

  <!-- R5 payment -->
  <text x="76" y="355.5" font-size="16" font-weight="bold" fill="#b91c1c">payment</text>
  <rect x="273.9" y="337" width="478.5" height="26" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="850" y="355.5" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">2680ms</text>

  <!-- R6 db:SELECT -->
  <text x="102" y="399.5" font-size="16" fill="#111827">db:SELECT</text>
  <rect x="274.8" y="381" width="3" height="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="850" y="399.5" font-size="15" fill="#111827" text-anchor="end">8ms</text>

  <!-- R7 HTTP POST /pg -->
  <text x="102" y="443.5" font-size="16" font-weight="bold" fill="#b91c1c">HTTP POST /pg</text>
  <rect x="278.3" y="424" width="473.2" height="28" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="292" y="443.5" font-size="15" font-weight="bold" fill="#b91c1c">병목 지점: 외부 PG 결제 호출 (2.65초 소요)</text>
  <text x="850" y="443.5" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="end">2650ms</text>

  <!-- 순차 호출 표시 -->
  <path d="M266,262 H282 V306 H271" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <line x1="282" y1="284" x2="300" y2="284" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="300" y="267" width="224" height="34" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="412" y="289.5" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">순차 호출 (병렬화 가능 구간)</text>

  <!-- 계측 공백 표시 -->
  <line x1="670" y1="232" x2="670" y2="248" stroke="#b45309" stroke-width="1.5"/>
  <rect x="556" y="248" width="228" height="76" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="570" y="270" font-size="15" font-weight="bold" fill="#b45309">계측 공백 (37ms)</text>
  <text x="570" y="292" font-size="15" fill="#374151">2760ms − 자식 합 2723ms</text>
  <text x="570" y="313" font-size="15" fill="#374151">직렬화/GC/큐 대기</text>

  <!-- 결론 -->
  <rect x="24" y="480" width="832" height="40" rx="6" fill="#f3f4f6"/>
  <text x="440" y="505.5" font-size="15" fill="#111827" text-anchor="middle"><tspan font-weight="bold">결론:</tspan> 전체 지연시간 2.8초 중 2.65초가 외부 PG 연동에서 발생하며, 37ms의 미계측 처리 시간이 존재함</text>
</svg>
