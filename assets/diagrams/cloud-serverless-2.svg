<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">15분 제한 대응 흐름</title>
  <desc id="d">작업이 15분을 넘을 때 세 가지 질문으로 갈라진다. 병렬로 쪼갤 수 있으면 큐에 흩뿌려 Lambda 여러 개가 나눠 처리하고, 순차 단계로 쪼갤 수 있으면 Step Functions 상태 머신으로 구성하며, 하나의 긴 프로세스여야 하면 Lambda 대신 ECS/Fargate Task나 AWS Batch를 쓴다.</desc>
  <rect width="880" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 출발점 -->
  <rect x="24" y="24" width="250" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="149" y="58" font-size="18" font-weight="bold" fill="#b91c1c" text-anchor="middle">"작업이 15분을 넘는다"</text>

  <!-- 줄기와 가지 -->
  <line x1="56" y1="80" x2="56" y2="344" stroke="#4b5563" stroke-width="2"/>
  <line x1="56" y1="152" x2="93" y2="152" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="56" y1="248" x2="93" y2="248" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-ink)"/>
  <line x1="55" y1="344" x2="93" y2="344" stroke="#4b5563" stroke-width="2" marker-end="url(#ah-ink)"/>

  <!-- 1. 병렬 -->
  <rect x="96" y="114" width="284" height="76" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="238" y="158" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">병렬로 쪼갤 수 있나?</text>
  <line x1="380" y1="152" x2="425" y2="152" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="428" y="114" width="428" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="146" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#1d4ed8">큐</tspan>에 작업 단위로 흩뿌리고</text>
  <text x="450" y="171" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#1d4ed8">Lambda 여러 개</tspan>가 나눠 처리</text>

  <!-- 2. 순차 -->
  <rect x="96" y="210" width="284" height="76" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="238" y="254" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">순차 단계로 쪼갤 수 있나?</text>
  <line x1="380" y1="248" x2="425" y2="248" stroke="#6d28d9" stroke-width="2" marker-end="url(#ah-purple)"/>
  <rect x="428" y="210" width="428" height="76" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="242" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#6d28d9">Step Functions</tspan>로 상태 머신 구성</text>
  <text x="450" y="267" font-size="15" fill="#4b5563">(Step Functions 자체는 장시간 실행 가능)</text>

  <!-- 3. 하나의 긴 프로세스 -->
  <rect x="96" y="306" width="284" height="76" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="238" y="350" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">하나의 긴 프로세스여야 하나?</text>
  <line x1="380" y1="344" x2="425" y2="344" stroke="#b45309" stroke-width="2" marker-end="url(#ah-amber)"/>
  <rect x="428" y="306" width="428" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="338" font-size="16" fill="#1f2937">Lambda가 아니라</text>
  <text x="450" y="363" font-size="16" font-weight="bold" fill="#92400e">ECS/Fargate Task, AWS Batch</text>
</svg>
